name: Rebuild Table of Contents

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  run-script:
    if: github.actor != 'Certamen-Automation-Bot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Create Github App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Checkout repository code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pyyaml

      - name: Execute Python script
        run: python scripts/generate_index.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          if ! git diff --cached --quiet; then
            git checkout -b new-index-yaml
            git commit -m "chore: updates index.yaml [skip ci]"
            git push origin HEAD:new-index-yaml

          else
            echo "No changes detected. Skipping commit."
          fi