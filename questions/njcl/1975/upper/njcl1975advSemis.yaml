tournament: NJCL Certamen
year: 1975
division: Advanced
round: Semifinals
questions:
  - tossup:
      question: "Who in Hades was condemned to eternal punishement on the wheel?"
      answer: "IXION"
    boni:
      - question: "The mysteries of Eleusis involved the worship of what three deities?"
        answer: "DIONYSUS, DEMETER, PERSEPHONE / KORE"
  - tossup:
      question: "In Rome's citizen armies, men of the lowest rank, who had no weapons issued to them but instead had to retrieve them from fallen comrades were called what?"
      answer: "<latin>ACCENSI</latin>"
    boni:
      - question: "One of the first non-Italian provinces added to Rome's territory was Pergamum. How was it acquired?"
        answer: "IT WAS WILLED TO ROME (BY ATTALUS III)"
      - question: "An age of exploration, in which an expedition reached central Africa, was instituted by what emperor?"
        answer: "NERO"
      - question: "Which emperor conquered what is now Romania?"
        answer: "TRAJAN"
  - tossup:
      question: "What was a <latin>suovetaurilia</latin>?"
      answer: "SACRIFICE OF A PIG, SHEEP, AND BULL"
    boni:
      - question: "A Roman generally had 3 names. If he earned a 4th, what was it called?"
        answer: "<latin>AGNOMEN / COGNOMEN EX VIRTUTE</latin>"
      - question: "Specifically, what type of <latin>omina</latin> were <latin>auspicia</latin>?"
        answer: "BIRD / FLIGHT RELATED OMENS"
      - question: "What marriage prohibition did the emperor Tiberius issue and later repeal?"
        answer: "NEITHER MEN OVER 60 NOR WOMEN OVER 50 WERE ALLOWED TO MARRY."
  - tossup:
      question: "What Latin word can be translated either “what” or “why”?"
      answer: "<latin>QUID</latin>"
    boni:
      - question: "What tense of the subjunctive is needed in this sentence: He asked me if I would come."
        answer: "IMPERFECT"
      - question: "What word begins a Latin question when the expected answer is “yes”?"
        answer: <latin>NONNE</latin>
      - question: "What word begins a Latin question when the expected answer is “no”?"
        answer: <latin>NUM</latin>
  - tossup:
      question: "What is the name given to the race of men sprung from ants on the island of Aegina?"
      answer: "MYRMIDONS"
    boni:
      - question: "Who was turned into a white heifer by Jupiter?"
        answer: "IO"
      - question: "Who was her father?"
        answer: "INACHUS"
      - question: "What flower did Aphrodite cause to grow out of the blood of the slain Adonis?"
        answer: "ANEMONE"
  - tossup:
      question: "What is the name given to the monument erected over a grave where the body does not really lie?"
      answer: "CENOTAPH / <latin>CENOTAPHIUM</latin>"
    boni:
      - question: "For what war did the Romans first build a fleet?"
        answer: "FIRST PUNIC WAR"
      - question: "To what emperor did Pliny write for advice on what to do with the Christians?"
        answer: "(M. ULPIUS) TRAJAN(US)"
      - question: "What famous archaeologist first excavated that palace of Minos on Crete?"
        answer: "(SIR ARTHUR) EVANS"
  - tossup:
      question: "In the <title>Aeneid</title>, who is Jupiter speaking to when he says <latin>Parce metu, Cytherea</latin>?"
      answer: "VENUS"
    boni:
      - question: "Who is the character addressed with the line <latin>Tros Tyriusque mihi nullo discrimine agetur</latin>?"
        answer: "AENEAS"
      - question: "Who is the character addressed with the line <latin>Italiam non sponte sequor</latin>?"
        answer: "DIDO"
      - question: "Who is the character addressed with the line <latin>Imperium sine fine dedi</latin>?"
        answer: "VENUS"
  - tossup:
      question: "What is a more accurate English translation of <latin>familia</latin> than “family”?"
      answer: "HOUSEHOLD"
    boni:
      - question: "What is the comparative of the adverb <latin>diu</latin>?"
        answer: "<latin>DIUTIUS</latin>"
      - question: "Most modern Romance languages have so-called conditional tenses which have no exact parallel in Latin. In form, not in usage, from what Latin mood are they derived?"
        answer: "INFINITIVE"
  - tossup:
      question: "Who speaks this line from the <title>Aeneid</title>: <latin>Exoriare aliquis nostrīs ex ossibus ultor</latin>?"
      answer: "DIDO"
    boni:
      - question: "Who speaks this line from the <title>Aeneid</title>: <latin>Tu regere imperiō populōs Romane mementō</latin>?"
        answer: "ANCHISES"
      - question: "Who speaks this line from the <title>Aeneid</title>: <latin>O fortunatī quōrum iam moenia surgunt</latin>?"
        answer: "AENEAS"
  - tossup:
      question: "What was the name of the Spartan secret police?"
      answer: "KRYPTEIA"
    boni:
      - question: "Who was ostracized in the 5th century BC for favoring detente with Sparta?"
        answer: "THEMISTOCLES"
      - question: "What was the year of the 1st Olympiad?"
        answer: "776 BC"
      - question: "For what purpose did a Greek athlete use weights called <latin>halteres</latin>?"
        answer: "TO GIVE HIM MOMENTUM IN THE RUNNING OR STANDING BROAD JUMP"
  - tossup:
      question: "Who was abandoned by the Greeks on the way to Troy, only to be rescued by them in the 9th year of the war because they needed the arrows of Hercules in his possession?"
      answer: "PHILOCTETES"
    boni:
      - question: "What was the name of Calypso's island"
        answer: "OGYGIA"
      - question: "Cassandra's curse was that her prophecies were never heeded but always fulfille. What had her crime been?"
        answer: "SHE SCORED THE AFFECTIONS OF APOLLO"
      - question: "Which Greek was first to set foot on Trojan soil and 1st to die there?"
        answer: "PROTESILAÜS"
  - tossup:
      question: "What 6th century emperor is responsible for major changes in the Roman law code?"
      answer: "JUSTINIAN"
    boni:
      - question: "What important archaeological site would you visit to view the tombs of the Persian kings Xerxes, Artaxerxes, and Darius II?"
        answer: "PERSEPOLIS"
      - question: "What important archaeological site would you visit to view the House of the Faun?"
        answer: "POMPEII"
      - question: "What important archaeological site would you visit to view three magnificently preserved Doric buildings, 2 dedicated to Hera and 1 to Athena?"
        answer: "PAESTUM"
  - tossup:
      question: "A peculiar group of 5 verbs, the most common of which means “to use,” have <emphasis>two</emphasis> syntactical oddities in common. What are these peculiarities?"
      answer: "THEY TAKE AN ABLATIVE OBJECT AND THEY ARE DEPONENT"
    boni:
      - question: "Name 3 defective verbs."
        answer: "ODI, COEPI, MEMINI"
  - tossup:
      question: "To which of his poetic predecessors did Horace refer to as his “lantern”?"
      answer: "(C.) LUCILIUS"
    boni:
      - question: "Who was the author of the <title>Vulgate</title>?"
        answer: (ST.) JEROME / (EUSEBIUS) HIERONYMUS
      - question: "What Roman historian proposed the theory that Romulus and Remus were raised by a prostitute on the basis of the double meaning of the word <latin>lupa</latin>?"
        answer: "(T.) LIVIUS / LIVY"
      - question: "Whether facutal or not, who does Donatus say died on the same day that Vergil assumed the <latin>toga virilis</latin>?"
        answer: "LUCRETIUS"
  - tossup:
      question: "Where did the oak tree bear the oracle of Jupiter?"
      answer: "DODONA"
    boni:
      - question: "Through the ancient religious custom of euphemism, the Furies were also called what?"
        answer: "EUMENIDES"
      - question: "Just as Cupid could (especially in poetry) be called <latin>Amor</latin>, who was referred to as Discordia?"
        answer: "ERIS"
      - question: "What fountain sprang forth from the ground where the foot of Pegasus struck?"
        answer: "HIPPOCRENE"
  - tossup:
      question: "Of all the Latin words for “god” which one is always used for a deified emperor?"
      answer: "<latin>DIVUS</latin>"
    boni:
      - question: "What is the genitive plural of <latin>divus</latin>?"
        answer: "<latin>DIVUM / DIVOM</latin>"
      - question: "Give another example of a 2nd-declension masculine substantive with the genitive plural ending of -um."
        answer: "<latin>NUMMUS / DEUS / SUPERUS / VER</latin>"
      - question: "Is this form older or newer than the more common <latin>-ōrum</latin>?"
        answer: "(MUCH) OLDER"
