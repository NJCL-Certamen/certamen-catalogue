tournament: "NJCL Certamen"
year: 1976
division: "Advanced"
round: Semifinals 2
questions:
  - tossup:
      question: "Who fulfilled a prophecy by presenting himself to his uncle wearing only one shoe?"
      answer: "JASON"
    boni:
      - question: "Who was Jason's father?"
        answer: "AESON"
      - question: "Who had ridden the Golden Ram to Colchis?"
        answer: "PHRIXUS"
      - question: "Who was his sister, who had fallen off during the journey?"
        answer: "HELLE"
  - tossup:
      question: "What would we call the region the Romans called <latin>Caledonia</latin>?"
      answer: "SCOTLAND"
    boni:
      - question: "Give the name ancient name of the city of Massilia"
        answer: "MARSEILLES"
      - question: "Give the name ancient name of the city of Colonia Agrippa"
        answer: "COLOGNE"
      - question: "Give the name ancient name of the city of Vindobona"
        answer: "VIENNA"
  - tossup:
      question: "On the works of what Greek poet were Vergil's <title>Eclogues</title> based?"
      answer: "THEOCRITUS"
    boni:
      - question: "What sort of men did Pindar glorify in his verses?"
        answer: "ATHLETES AND WARRIORS"
      - question: "To what Greek historian do we owe much of our knowledge of The Persian Empire?"
        answer: "XENOPHON"
      - question: "What Alexandrian Greek wrote a work of 13 books on geometry, naming it the <title>Elements</title>?"
        answer: "EUCLID"
  - tossup:
      question: "What mood follows postquam?"
      answer: "INDICATIVE"
    boni:
      - question: "What mood follows dum when it means “while” or “as long as”?"
        answer: "INDICATIVE"
      - question: "What mood follows dum when it means “until”?"
        answer: "SUBJUNCTIVE"
      - question: "What mood follows cum when it means “although”?"
        answer: "SUBJUNCTIVE"
  - tossup:
      question: "What is the name for the race of men sprung from ants?"
      answer: "MYRMIDONS (FROM THE GREEK MYRMEX, “ANT”)"
    boni:
      - question: "What island was their home?"
        answer: "AEGINA"
      - question: "For what king of Aegina did Zeus, his father, create them?"
        answer: "AEACUS"
      - question: "Under whom did they fight in the Trojan War?"
        answer: "ACHILLES"
  - tossup:
      question: "An upright and virtuous woman, eventually deified, she was the wife of Augustus and mother of Tiberius. Who was she?"
      answer: "LIVIA DRUSILLA"
    boni:
      - question: "Who was the nephew of Augustus praised by Vergil?"
        answer: "MARCELLUS"
      - question: "Who did he marry?"
        answer: "JULIA, DAUGHTER OF AUGUSTUS"
      - question: "When did Marcellus die?"
        answer: "23 BC, AT THE AGE OF"
  - tossup:
      question: "Who was the wife of Maecenas?"
      answer: "TERENTIA"
    boni:
      - question: "Who besides Vergil could call Maecenas his patronus?"
        answer: "HORACE OR PROPERTIUS"
      - question: "Who besides Tibullus could call Marcus Valerius Messalla his patronus?"
        answer: "OVID"
      - question: "Where was Ovid exiled?"
        answer: "TOMI (DACIA)"
  - tossup:
      question: "What is the syntax of the frequent dictionary entry quod vide?"
      answer: "SUBORDINATE IMPERATIVE"
    boni:
      - question: "It is abbreviated q.v. What is abbreviated qq.v.?"
        answer: "<latin>QUAE VIDE</latin>"
      - question: "What is abbreviated viz.?"
        answer: "<latin>VIDELICET</latin>"
      - question: "What is abbreviated sc.?"
        answer: "<latin>SCILICET</latin>"
  - tossup:
      question: "On the night before the first battle of the Trojan War, Odysseus and Diomedes killed a Thracian ally of Priam and stole his 12 horses. Who was he?"
      answer: "RHESUS"
    boni:
      - question: "Why did they steal the horses?"
        answer: "IT WAS PROPHESIED THAT TROY COULD NEVER FALL IF THE HORSES OF RHESUS ATE GRASS FROM THE PLAINS OF TROY OR DRANK WATER FROM THE RIVER XANTHUS."
      - question: "What famous object did the same two Greeks steal out of the city itself?"
        answer: "THE PALLADIUM"
      - question: "What famous Trojan hero was wounded by Diomedes?"
        answer: "AENEAS"
  - tossup:
      question: "In the Roman courts, who had the privilege of not having to swear to speak the truth?"
      answer: "A VESTAL VIRGIN"
    boni:
      - question: "Who had to get the permission of the Senate to leave Italy?"
        answer: "A SENATOR"
      - question: "Where was a senator not allowed to go without the emperor's permission?"
        answer: "EGYPT"
      - question: "What in his dress distinguished a senator?"
        answer: "<latin>THE CLAVUS LATUS</latin>"
  - tossup:
      question: "What Greek playwright gave us works whose names in Latin include <latin>Equites, Vespae, Ranae, Aves</latin>, and <latin>Nubes</latin>?"
      answer: "ARISTOPHANES"
    boni:
      - question: "What is the English title of <latin>Ranae</latin>?"
        answer: "<title>THE FROGS</title>"
      - question: "What is the English title of <latin>Equites</latin>?"
        answer: "<title>THE KNIGHTS</title>"
      - question: "What is the English title of <latin>Nubes</latin>?"
        answer: "<title>THE CLOUDS</title>"
  - tossup:
      question: "To what conjugation do the compounds of <latin>do</latin> belong?"
      answer: "THE THIRD"
    boni:
      - question: "What is unique about the present infinitive of <latin>do</latin>?"
        answer: "THE -A- IS SHORT"
      - question: "What is the compound of <latin>do</latin> which means “give back”?"
        answer: "REDDO (spell!)"
      - question: "What English word for a turncoat comes via French from a compound of <latin>do</latin>?"
        answer: "TRAITOR (FROM <latin>TRADO</latin>)"
  - tossup:
      question: "What was the early Latin name for the Muses?"
      answer: "<latin>CAMENAE</latin>"
    boni:
      - question: "Who was the mother of the Muses?"
        answer: "MNEMOSYNE"
      - question: "Where were the Muses born?"
        answer: "PIERIA ON MOUNT OLYMPUS"
      - question: "Who was the mother of the Graces?"
        answer: "EURYNOME"
  - tossup:
      question: "Where was Horace's beloved farm?"
      answer: "THE SABINE HILLS"
    boni:
      - question: "Who wrote <latin>Mens sana in corpore sano</latin>?"
        answer: "JUVENAL"
      - question: "What Roman poet wrote one of his most touching poems to his dead brother?"
        answer: "CATULLUS"
      - question: "What Roman woman writer of the Augustan age wrote love letters to a beau named Cerinthus?"
        answer: "SULPICIA"
  - tossup:
      question: "What is today's (8/10/76) complete date in Latin?"
      answer: "<latin>IV IDUS AUGUSTAS MMDCCXXIX</latin> (2729 AUC)"
    boni:
      - question: "What was the chief port of departure from Italy to Greece?"
        answer: "BRUNDISIUM"
      - question: "Where, in 37 BC, did Marc Antony and Octavian renew the Second Triumvirate?"
        answer: "TARENTUM"
      - question: "What early Greek colony in southern Italy gave its name to excessive luxury?"
        answer: "SYBARIS"