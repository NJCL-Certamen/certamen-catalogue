tournament: "NJCL Certamen"
year: 1979
division: "Advanced"
round: Finals
questions:
  - tossup:
      question: "Catholic terminology of course uses Latin extensively. Nevertheless, only one of the following nouns is of Latin origin; the rest are corrupted from Greek words. Identify the Latin derivative: priest, nun, monk, bishop."
      answer: "NUN"
    boni:
      - question: "What term for a Catholic VIP comes from a Latin adjective which means pivotal or crucial?"
        answer: "CARDINAL"
      - question: "Early Christians borrowed as their word noun Latinized to <latin>ecclesia</latin>. What did <latin>ἐκκλησία</latin> originally mean in Greek?"
        answer: "A POPULAR ASSEMBLY"
  - tossup:
      question: "The first seven lines of the <title>Iliad</title> constitute a compact, viable unit, and it is no accident that Vergil does the same with the first seven lines of the Aeneid. The last word of the seventh line of the Iliad is Achilles; in a significant change of emphasis, what word ends line seven of the <title>Aeneid</title>?"
      answer: "<latin>ROMA / ROMAE</latin>"
    boni:
      - question: "What historical event is described in <title>Aeneid</title> 671-713, which passage includes the line, “Shapes of all sorts of gods and the barking Anubis bear arms agaisnt Neptune and Venus and Minerva”?"
        answer: "ACTIUM"
      - question: "What is the last word of the Aeneid?"
        answer: "<latin>UMBRAS</latin>"
  - tossup:
      question: "Who begins one of his poems: <latin>Cenabis bene, mi Fabulle</latin>?"
      answer: "CATULLUS (#13)"
    boni:
      - question: "As the poem goes on to say, what must Fabullus bring with him in order to dine well?"
        answer: "HIS OWN MEAL"
      - question: "Catullus admits that he is poor - his purse is full of cobwebs - and can only furnish the perfume, but says that the perfume is so wonderful that Fabullus will want what?"
        answer: "THAT THE GODS MAKE HIM ALL NOSE"
  - tossup:
      question: "What classical verb form would you substitute for the archaism in <latin>di duint</latin>?"
      answer: "<latin>DENT</latin>"
    boni:
      - question: "What kind of subjunctive is the old formula <latin>di duint</latin>?"
        answer: "OPTATIVE (VOL.)"
      - question: "What kind of subjunctive is used in <latin>quid dicerem</latin>?"
        answer: "DELIBERATIVE"
  - tossup:
      question: "This is a scene taken from I, Claudius. Augustus, Livia, Tiberius, Postumus, Claudius and other members of the imperial family are lying about in sybaritic splendor listening to the poet Horace in after-dinner recitation. A breathless herald rushes in to announce to Augustus the massacre of General Varus and three legions in the forests of Germany. Point out to the scriptwriter his two gross historical errors."
      answer: "IN 9 AD, POSTUMUS HAD BEEN BANISHED FOR TWO YEARS AND HORACE DEAD FOR 17!!!"
    boni:
      - question: "Where was Postumus exiled in 7 AD?"
        answer: "PLANASIA (now Pianosa - Cathh-22)"
      - question: "Where was his mother exiled in 2 BC?"
        answer: "PANDATERIA, IN THE TYRRHENIAN SEA, ALLOWED TO MOVE TO RHEGIUM IN 4 AD."
  - tossup:
      question: "Who was the father of Hippolochus, Isander and Laodameia?"
      answer: "BELLEROPHON"
    boni:
      - question: "Who was their mother?"
        answer: "PHILONOË"
      - question: "Who falsely accused Bellerophon of rape?"
        answer: "STHENEBOEA / ANTEIA"
  - tossup:
      question: "What is the significance to Vergil of this set of numbers: 830, 2188, 12,913?"
      answer: "THE NUMBER OF LINES IN HIS WORKS, IN ORDER"
    boni:
      - question: "In all of Homer dactyls outnumber spondees 68% to 32%. In all of Vergil, do dactyls outnumber spondees or vice versa?"
        answer: "SPONDEES OUTNUMBER DACTYLS"
      - question: "The percentages?"
        answer: "SPONDEES 56%, DACTYLS 44%"
  - tossup:
      question: "What was unusual about the two sons of Molione?"
      answer: "THEY WERE SIAMESE TWINS"
    boni:
      - question: "What were their names?"
        answer: "EURYTUS AND CTEATUS"
      - question: "Whom did they kill?"
        answer: "IPHICLES (and Dameon)"
  - tossup:
      question: "Whom did Ares turn into a rooster?"
      answer: "ALECTRYON"
    boni:
      - question: "Who was turned into a turtle for refusing to attend the wedding of Zeus and Hera?"
        answer: "THE NYMPH CHELONE"
      - question: "What playmate of the child Zeus was turned into a stone for calling little Zeus mortal?"
        answer: "CELMUS"
  - tossup:
      question: "The Romans simply called it the Persian fruit, and our word for it is a corruption of the Latin adjective for Persian. What is it?"
      answer: "A PEACH"
    boni:
      - question: "Our word for the tree and its fruit comes from the Latin <latin>cerasus</latin>. What is it?"
        answer: "THE CHERRY"
      - question: "Which of the following does not have a Latin root: onion, cucumber, tomato, cauliflower?"
        answer: "TOMATO"
  - tossup:
      question: "Latin-based names have been given to parts of the globe unknown to the Romans; Nova Scotia, for instance, means New Scotland in Latin. What is the Latin-based name and its meaning for the island now called Taiwan?"
      answer: "<latin>FORMOSA</latin> - BEAUTIFUL"
    boni:
      - question: "An African nation was founded in the nineteenth century by ex-slaves repatriating themselves from this continent to that of their ancestors. What is its name and what is its Latin root?"
        answer: "LIBERIA - FROM <latin>LIBER</latin>, FREE"
      - question: "What is the meaning of the Latinate name Australia?"
        answer: "THE LAND IN THE SOUTH"
  - tossup:
      question: "What is the third person plural perfect active subjunctive of <latin>sepelio</latin>?"
      answer: "<latin>SEPELIVERINT</latin>"
    boni:
      - question: "Change <latin>sepeliverint</latin> to passive."
        answer: "<latin>SEPULTI SINT</latin>"
      - question: "Change <latin>sepeliverint</latin> to imperfect."
        answer: "<latin>SEPELIRENT</latin>"
  - tossup:
      question: "Which emperor opened the ranks of the Pretorian Guard to provincials?"
      answer: "(L.) SEPTIMIUS SEVERUS"
    boni:
      - question: "With what deceased figure did Septimius Severus affiliate himself by a unilateral act of adoption?"
        answer: "MARCUS AURELIUS"
      - question: "Whom did Septimius Severus name as his heirs?"
        answer: "GETA AND CARACALLA"
  - tossup:
      question: "Latin names, even more than our own, usually had some connection to common nouns, and their owners, as are we, were subject to good-natured or bad-natured puns. What is the meaning of the common noun <latin>scipio</latin>?"
      answer: "CANE, WALKING-STICK"
    boni:
      - question: "Whose name came from the noun meaning chickpea?"
        answer: "CICERO'S"
      - question: "What do we call that which the Romans called the <latin>Vergiliae</latin>?"
        answer: "THE CONSTELLATION PLEIADES"
  - tossup:
      question: "Who gave his name to the Spanish city of Barcelona?"
      answer: "HAMILCAR BARCA"
    boni:
      - question: "What modern city did the Romans call Aquincum?"
        answer: "BUDAPEST, HUNGARY"
      - question: "What is the derivative modern name for the Roman provincial city of Aurelianensis?"
        answer: "ORLEANS"
  - tossup:
      question: "When the mother of Cleobis and Biton prayed to Hera that her sons receive the greatest blessing available to mortals, what did Hera grant them?"
      answer: "PAINLESS DEATHS"
    boni:
      - question: "Who by writing on a piece of fruit tricked his beloved into marrying him?"
        answer: "ACONTIUS"
      - question: "Who was his beloved?"
        answer: "CYDIPPE"
  - tossup:
      question: "One the author, one the inspiration, what two writers come to mind when you hear: <latin>Nescio quid maius nascitur Iliade</latin>?"
      answer: "PROPERTIUS AND VERGIL"
    boni:
      - question: "One the author, one the inspiration, what two authors come to mind when you hear: <latin>Ille mi par esse deo videtur</latin>?"
        answer: "CATULLUS AND SAPPHO"
      - question: "One the author, one the inspiration, what two authors come to mind when you hear: <latin>Unus qui nobis cunctando restituis rem</latin>?"
        answer: "VERGIL AND ENNIUS"
  - tossup:
      question: "To what dynasty did Cleopatra belong?"
      answer: "THE PTOLEMIES"
    boni:
      - question: "Several Ptolemaic queens were named Cleopatra. How many?"
        answer: "SEVEN"
      - question: "Where in Europe was the Ptolemies' home?"
        answer: "MACEDONIA"
  - tossup:
      question: "In the Third Samnite War, what ancestor of Scipio Africanus drove the Samnites out of Lucania?"
      answer: "(L.) SCIPIO BARBATUS"
    boni:
      - question: "Also in the Third Samnite War, who were the Roman commanders at the battle of Sentinum?"
        answer: "FABIUS RULLIANUS AND DECIUS MUS"
      - question: "Which of these commanders rallied his wing of the army at the cost of his own life?"
        answer: "DECIUS MUS"
  - tossup:
      question: "With only indicatives and subjunctives counted, how many inflected forms does a regular, transitive Latin verb have?"
      answer: "120"
    boni:
      - question: "The term defective usually means a verb is missing the entire present system, but technically the word means only that the verb is missing one of more forms. How is <latin>scio</latin> defective?"
        answer: "NO PRESENT IMPERATIVE"
      - question: "What forms of <latin>quaeso</latin> occur in classical Latin?"
        answer: "ONLY <latin>QUAESO</latin> AND <latin>QUAESUMUS</latin> (A <latin>QUAESIT</latin> IS ONCE IN LUCRETIUS)"
