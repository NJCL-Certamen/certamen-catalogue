tournament: "NJCL Certamen"
year: 1982
division: "Intermediate"
round: "Semifinals"
questions:
  - tossup:
      question: "Change the verb form <latin>malo</latin> to the plural."
      answer: "<latin>MALUMUS</latin>"
    boni:
      - question: "Change <latin>malo</latin> to the third person."
        answer: "<latin>MAVULT</latin>"
      - question: "Change <latin>mavult</latin> to the plural."
        answer: "<latin>MALUNT</latin>"
  - tossup:
      question: "What is the translation of the saying: <latin>Mens sana in corpore sano</latin>?"
      answer: "A HEALTHY MIND IN A HEALTHY BODY"
    boni:
      - question: "What is the genitive plural of the phrase <latin>sana mens</latin>?"
        answer: "<latin>SANARUM MENTIUM</latin>"
      - question: "What is the genitive plural of the phrase <latin>sanum corpus</latin>?"
        answer: "<latin>SANORUM CORPORUM</latin>"
  - tossup:
      question: "Who was served the flesh of his own sons at a banquet?"
      answer: "THYESTES"
    boni:
      - question: "Who was responsible for serving Thyestes this ghastly meal?"
        answer: "ATREUS"
      - question: "What supernatural phenomenon did Atreus stage to gain the throne of Mycenae?"
        answer: "THE SUN REVERSED ITS PATH THROUUGH THE SKY"
  - tossup:
      question: "What interrogative translates the English archaism \"whence\"?"
      answer: "<latin>UNDE</latin>"
    boni:
      - question: "What translates \"thence\"?"
        answer: "<latin>INDE</latin> (or <latin>ALLINC</latin>)"
      - question: "Ask in Latin: \"Where are you coming from, Anthony?\""
        answer: "<latin>UNDE VENIS, ANTONI?</latin>"
  - tossup:
      question: "How many of the Seven Wonders of the World glorified Greek divinities?"
      answer: "THREE"
    boni:
      - question: "Which divinity was honored by a temple at Ephesus?"
        answer: "ARTEMIS"
      - question: "Who was honored by the Colossus of Rhodes?"
        answer: "APOLLO / HELIOS"
  - tossup:
      question: "Tradition says that Hercules founded Herculaneum on his return from Spain. Why had he gone there?"
      answer: "TO FETCH THE CATTLE OF GERYON"
    boni:
      - question: "What physical deformity did Geryon have?"
        answer: "THREE BODIES / THREE HEADS"
      - question: "What deformity did Geryon's dog Orthos have?"
        answer: "TWO HEADS"
  - tossup:
      question: "Which of the following does not come from <latin>amicus</latin>: inimical, amicable, amiable, ceramic?"
      answer: "CERAMIC"
    boni:
      - question: "What is the meaning of the Latin word which has become the English word \"addendum\"?"
        answer: "SOMETHING WHICH MUST BE ADDED"
      - question: "What is the meaning of the Latin word which has become the English word \"agenda\"?"
        answer: "THINGS WHICH MUST BE DONE"
  - tossup:
      question: "What king sent Aeneas aid from Pallanteum?"
      answer: "EVANDER"
    boni:
      - question: "What wife of King Latinus was a bitter enemy of Aeneas and his followers?"
        answer: "AMATA"
      - question: "Which of the following figures in the last part of Aeneas' saga dies first: Mezentius, Turnus, Amata, Camilla?"
        answer: "MEZENTIUS"
  - tossup:
      question: "How many of Odysseus' men did Scylla eat?"
      answer: "SIX"
    boni:
      - question: "Who was Scylla's companion monster?"
        answer: "CHARYBDIS"
      - question: "Where are Scylla and Charybdis?"
        answer: "THE STRAITS OF MESSINA, BETWEEN ITALY AND SICILY"
  - tossup:
      question: "What are the only cases in which you find a supine?"
      answer: "ACCUSATIVE AND ABLATIVE"
    boni:
      - question: "What declension to supines belong to?"
        answer: "THE FOURTH"
      - question: "What is the Latin phrase meaning \"hard to do\"?"
        answer: "<latin>DIFFICILE ACTU / FACTU</latin>"
  - tossup:
      question: "What type of verbs are <latin>piget, pudet, miseret</latin>, and <latin>taedet</latin>?"
      answer: "IMPERSONAL"
    boni:
      - question: "Translate into English: <latin>Me poetae miseret</latin>."
        answer: "I FEEL SORRY FOR THE POET"
      - question: "Using an impersonal verb, say \"I'm sorry.\""
        answer: "<latin>ME PAENITET</latin>."
  - tossup:
      question: "What is the term for a Roman ship with three banks of oars?"
      answer: "TRIREME"
    boni:
      - question: "With two banks of oars?"
        answer: "BIREME"
      - question: "What was the general term for a warship?"
        answer: "NAVIS LONGA"
  - tossup:
      question: "What law in 67 BC gave Pompey complete command of the waters of the Mediterranean?"
      answer: "THE LEX GABINIA"
    boni:
      - question: "What law in the following year gave Pompey authority in the East?"
        answer: "THE LEX MANILIA"
      - question: "In favor of which of these did Cicero make an oration?"
        answer: "LEX MANILIA"
  - tossup:
      question: "How many emperors were there in the Flavian Dynasty?"
      answer: "THREE"
    boni:
      - question: "What was the relationship of the first to the third?"
        answer: "FATHER - SON"
      - question: "What was the relationship of the second to the third?"
        answer: "BROTHER - BROTHER"
  - tossup:
      question: "Which of the following is not a derivative of <latin>caput</latin>: chapter, chapel, chef, captain?"
      answer: "CHAPEL"
    boni:
      - question: "Which of the following have the same root: rigid, dirigible, indirect?"
        answer: "DIRIGIBLE AND INDIRECT"
      - question: "Which of the following does not have the same root as the other two: panic, pantry, companion?"
        answer: "PANIC"
  - tossup:
      question: "Make the adjective <latin>audax</latin> into an adverb."
      answer: "<latin>AUDACTER</latin>"
    boni:
      - question: "Make <latin>lenis</latin> an adverb."
        answer: "<latin>LENITER</latin>"
      - question: "Make <latin>vehemens</latin> an adverb."
        answer: "<latin>VEHEMENTER</latin>"
  - tossup:
      question: "What was the penalty for insulting a Vestal Virgin?"
      answer: "DEATH BY BEATING"
    boni:
      - question: "What privilege was granted a Vestal Virgin in a law court?"
        answer: "SHE WAS NOT REQUIRED TO SWEAR TO TELL THE TRUTH"
      - question: "What privilege was granted a Vestal Virgin who passed a condemned criminal on his way to be executed?"
        answer: "SHE COULD PARDON HIM ON THE SPOT."
  - tossup:
      question: "<latin>Responde Latine</latin>: Take the number of Muses, multiply by the number of Fates, add the number of Gorgons, and divide by the number of eyes the Gray Women had."
      answer: "<latin>TRIGINTA</latin>"
    boni:
      - question: "<latin>Responde Latine</latin>: How long did the Trojan War last?"
        answer: "<latin>DECEM ANNOS</latin>"
      - question: "<latin>Responde Latine</latin>: Take the number of Hercules' labors, subtract the number of Furies, and multiply by the number of Olympian deities."
        answer: "<latin>CENTUM (ET) OCTO / OCTO ET CENTUM</latin>"
  - tossup:
      question: "For what Greek warrior did Hephaestus make new armor?"
      answer: "ACHILLES"
    boni:
      - question: "Who had died wearing Achilles' old armor?"
        answer: "PATROCLUS"
      - question: "Who had killed Patroclus and stripped him of the armor?"
        answer: "HECTOR"
  - tossup:
      question: "At the Battle of Cannae, who were the volones?"
      answer: "SLAVES WHO SERVED AS VOLUNTEERS IN THE ROMAN ARMY"
    boni:
      - question: "Where was the army of Varus destroyed in 9 AD?"
        answer: "THE TEUTOBERG FOREST"
      - question: "Three legions were destroyed in that battle, and the superstitious Romans never used their numbers again. What were the numbers?"
        answer: "XVII, XVIII AND XIX"