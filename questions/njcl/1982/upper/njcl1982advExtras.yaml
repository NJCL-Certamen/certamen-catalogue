tournament: "NJCL Certamen"
year: 1982
division: "Advanced"
round: "Extra Questions"
questions:
  - tossup:
      question: "What is the genitive plural of <latin>senex</latin>?"
      answer: "<latin>SENUM</latin>"
  - tossup:
      question: "What two Latin nouns with different stems share the nominative singular <latin>frons</latin>?"
      answer: "<latin>FRONS, FRONTIS</latin> (F) and <latin>FRONS, FRONDIS</latin> (F)"
  - tossup:
      question: "Given that <latin>haec</latin> is plural, what must be its singular?"
      answer: "<latin>HOC</latin>"
  - tossup:
      question: "The Latin word for barber is <latin>tonsor</latin>. What is the meaning of the Latin noun from which we get \"barber\"?"
      answer: "BEARD"
  - tossup:
      question: "In what battle were the Romans supposedly aided by Castor and Pollux?"
      answer: "THE BATTLE OF LAKE REGILLUS"
  - tossup:
      question: "What two creatures sprang from the Gorgon Medusa's blood?"
      answer: "PEGASUS AND CHRYSAOR"
  - tossup:
      question: "Who was Vergil's patron?"
      answer: "MAECENAS"
  - tossup:
      question: "What verb means \"be ill\"?"
      answer: "<latin>AEGROTO</latin>"
  - tossup:
      question: "What is the accusative singular of <latin>sitis</latin>?"
      answer: "<latin>SITIM</latin>"
  - tossup:
      question: "What is the perfect passive participle of <latin>sepelio</latin>?"
      answer: "<latin>SEPULTUS</latin>"
  - tossup:
      question: "What is the next declinable number after three?"
      answer: "TWO HUNDRED"
  - tossup:
      question: "In what year did the Flavian dynasty begin?"
      answer: "69 AD"
  - tossup:
      question: "Who called his writings a <latin>farrago</latin>?"
      answer: "JUVENAL"
  - tossup:
      question: "What was the name of Odysseus' faithful dog?"
      answer: "ARGUS"
  - tossup:
      question: "What Latin verb is the root of the English noun \"collapse\"?"
      answer: "<latin>LABOR</latin>"
  - tossup:
      question: "What tense of the subjunctive would be required to translate \"If I were you...\"?"
      answer: "IMPERFECT"
  - tossup:
      question: "What is the perfect active infinitive of <latin>pario</latin>?"
      answer: "<latin>PEPERISSE</latin>"
  - tossup:
      question: "What is the case of the adjective in this quote: <latin>O fortunati, quorum iam moenia surgunt!</latin>"
      answer: "VOCATIVE"
  - tossup:
      question: "What term do epic poets substitute for <latin>imperator</latin>, and why?"
      answer: "<latin>INDUPERATOR</latin> - <latin>IMPERATOR</latin> WON'T SCAN IN DAC. HE"
  - tossup:
      question: "Who bought the Empire at auction in 193 AD?"
      answer: "DIDIUS JULIANUS"
  - tossup:
      question: "Who were the two immortal Gorgons?"
      answer: "STHENO AND EURYALE"
  - tossup:
      question: "<latin>Porcus</latin> means \"pig\"; name another animal whose English name comes from <latin>porcus</latin>."
      answer: "PORCUPINE or PORPOISE"
  - tossup:
      question: "What is the superlative of <latin>vetus</latin>?"
      answer: "VETERRIMUS"
  - tossup:
      question: "What is odd about a noun which is a heteroclite?"
      answer: "IT IS FOUND IN TWO DIFFERENT DECLENSIONS (e.g. fames)"
  - tossup:
      question: "The Latin root <latin>ped-</latin> means \"foot\"; what does the Greek root <latin>ped-</latin> mean?"
      answer: "CHILD"
  - tossup:
      question: "Who wrote <title>Works and Days</title>?"
      answer: "HESIOD"
  - tossup:
      question: "How did Demeter try to make a mortal child invulnerable?"
      answer: "PUTTING HIM IN THE EMBERS"
  - tossup:
      question: "Who assassinated Caligula?"
      answer: "CASSIUS CHAEREA"
  - tossup:
      question: "What noun encompasses all of these: <latin>sciurus, vespertilio, lepus, caper</latin>?"
      answer: "ANIMALIA"
  - tossup:
      question: "What two superlatives exist for <latin>pius</latin>?"
      answer: "<latin>PIISSIMUS</latin> AND <latin>PIENTISSIMUS</latin>"
  - tossup:
      question: "How would you say in Latin: \"He is the best of us all\"?"
      answer: "<latin>EST OPTIMUS NOSTRUM OMNIUM</latin>"
  - tossup:
      question: "What is the syntax of the pronoun in this quotation: <latin>O fortunatam natam me consule Romam</latin>?"
      answer: "ABLATIVE ABSOLUTE"
  - tossup:
      question: "Whom does Lucretius call Iphianassa?"
      answer: "IPHIGENIA"
  - tossup:
      question: "When were the standards lost at Carrhae regained?"
      answer: "20 BC"
  - tossup:
      question: "What seer was destined to die when he met a seer greater than himself?"
      answer: "CALCHAS"