tournament: "NJCL Certamen"
year: 1983
division: "Intermediate"
round: "Round 1"
questions:
  - tossup:
      question: "On the shores of Epirus, Aeneas met what Trojan woman, formerly the wife of Hector?"
      answer: "ANDROMACHE"
    boni:
      - question: "Who had claimed her as a prize when Troy fell?"
        answer: "PYRRHUS (NEOPTOLEMUS)"
      - question: "To whom was she married in Epirus?"
        answer: "HELENUS"
  - tossup:
      question: "What two kinships did Hera have to Zeus?"
      answer: "WIFE AND SISTER"
    boni:
      - question: "How was Hades related to Zeus?"
        answer: "BROTHER"
      - question: "How was Demeter related to Zeus?"
        answer: "SISTER"
  - tossup:
      question: "What is 73 in Roman numerals?"
      answer: "LXXIII"
    boni:
      - question: "What is 199 in Roman numerals?"
        answer: "CIC"
      - question: "What is 499 in Roman numerals?"
        answer: "ID"
  - tossup:
      question: "Vergil's tomb bears these words: <latin>Cecini pascua, rura, duces</latin>. Give the principal parts and English meaning of the verb in that quotation."
      answer: "<latin>CANO, -ERE, CECINI, CANTUS</latin> - “SING”"
    boni:
      - question: "On Vergil's tomb one also reads: <latin>Mantua me genuit</latin>. Give that verb's principal parts and meaning."
        answer: "<latin>GIGNO, GIGNERE, GENUI, GENITUS</latin> - “BEAR”"
      - question: "<latin>Calabri rapuere</latin> also appears. In what mood is the verb <latin>rapuere</latin>?"
        answer: "INDICATIVE"
  - tossup:
      question: "What is the name of verbs with active meanings but only passive forms?"
      answer: "DEPONENT"
    boni:
      - question: "Give an example of a semi-deponent verb."
        answer: "<latin>AUDEO, GAUDEO, SOLEO, (CON)FIDO</latin>"
      - question: "How would a Roman say, “We have dared”?"
        answer: "<latin>AUSI SUMUS</latin>"
  - tossup:
      question: "What early first-century BC conflict set Romans against some of their Italian allies?"
      answer: "SOCIAL / MARSIC / ITALIAN WAR"
    boni:
      - question: "What tribe was chief among the rebellious allies?"
        answer: "MARSI"
      - question: "What reform was the result of the Social War?"
        answer: "CITIZENSHIP FOR THE ITALIAN SUBJECT TRIBES"
  - tossup:
      question: "How would a Roman say, “one hundred miles”?"
      answer: "<latin>CENTUM MILIA PASSUUM</latin>"
    boni:
      - question: "How would he say, “two hundred miles”?"
        answer: "<latin>DUCENTA MILIA PASSUUM</latin>"
      - question: "“One thousand miles?”"
        answer: "<latin>MILLE MILIA PASSUUM</latin>"
  - tossup:
      question: "What was Rome's first consular year?"
      answer: "509 BC"
    boni:
      - question: "Who were the first consuls?"
        answer: "L. JUNIUS BRUTUS AND L. TARQUINIUS"
      - question: "Who was Collatinus' wife?"
        answer: "LUCRETIA COLLATINUS"
  - tossup:
      question: "Paris was born in Troy. Say “in Troy” in Latin."
      answer: "<latin>TROIAE</latin>"
    boni:
      - question: "Agamemnon came from Mycenae. Say “from Mycenae.”"
        answer: "<latin>MYCENIS</latin>"
      - question: "Paris traveled to Sparta. Say “to Sparta.”"
        answer: "<latin>SPARTAM</latin>"
  - tossup:
      question: "Who prevented Menelaüs from killing Paris?"
      answer: "APHRODITE / VENUS"
    boni:
      - question: "How did she do it?"
        answer: "SHE SPIRITED PARIS OFF TO HELEN'S BEDROOM IN A CLOUD OR MIST"
      - question: "When Paris was eventually killed, who became Helen's husband?"
        answer: "DEIPHOBUS"
  - tossup:
      question: "Who was the slayer of Medusa?"
      answer: "PERSEUS"
    boni:
      - question: "Whom did he rescue from a sea monster?"
        answer: "ANDROMEDA"
      - question: "What type of creature was Medusa?"
        answer: "GORGON"
  - tossup:
      question: "Who succeeded Romulus?"
      answer: "NUMA POMPILIUS"
    boni:
      - question: "Who was Rome's last king?"
        answer: "TARQUINIUS SUPERBUS"
      - question: "What was the year of his deposing?"
        answer: "510 BC"
  - tossup:
      question: "Who succeeded Tiberius?"
      answer: "CALIGULA / GAIUS"
    boni:
      - question: "Who succeeded Nero?"
        answer: "(SER. SULPICIUS) GALBA"
      - question: "Who succeeded Domitian?"
        answer: "(M. COCCEIUS) NERVA"
  - tossup:
      question: "What Roman ceremony included a slave who had to repeat the sentence <latin>Hominem te memento</latin>?"
      answer: "A TRIUMPHAL PROCESSION"
    boni:
      - question: "What building was the destination of a triumphal procession?"
        answer: "THE TEMPLE OF JUPITER CAPITOLINUS"
      - question: "What was the minimum number of enemy dead for a triumph?"
        answer: "5000"
  - tossup:
      question: "What is the genitive singular of <latin>fur</latin>?"
      answer: "<latin>FURIS</latin>"
    boni:
      - question: "What does <latin>fur</latin> mean?"
        answer: "THIEF"
      - question: "What English adjective comes from it?"
        answer: "FURTIVE"
  - tossup:
      question: "What Latin noun is the root of “ignition”?"
      answer: "<latin>IGNIS</latin>"
    boni:
      - question: "What Latin pronoun is the root of “identical”?"
        answer: "<latin>IDEM</latin>"
      - question: "What Latin adjective is the root of “integrity”?"
        answer: "<latin>INTEGER</latin>"
  - tossup:
      question: "Who was the father of Phaëthon?"
      answer: "APOLLO"
    boni:
      - question: "Who was his mother?"
        answer: "CLYMENE"
      - question: "Into what were his weeping sisters transformed?"
        answer: "POPLAR TREES"
  - tossup:
      question: "In what ways must a relative pronoun agree with its antecedent?"
      answer: "GENDER AND NUMBER"
    boni:
      - question: "In what ways must an appositive agree with its antecedent?"
        answer: "CASE ONLY"
      - question: "Supply the correct form of <latin>laetus</latin> in the following sentence: <latin>Rex reginaque sunt</latin>."
        answer: "<latin>LAETI</latin>"
  - tossup:
      question: "Differentiate in meaning between <latin>odium</latin> and <latin>otium</latin>."
      answer: "<latin>ODIUM</latin> - HATRED; <latin>OTIUM</latin> - PEACE, LEISURE, SPARE TIME"
    boni:
      - question: "Differentiate in meaning between <latin>pecus</latin> and <latin>pectus</latin>."
        answer: "<latin>PECUS</latin> - FLOCK, HERD; <latin>PECTUS</latin> - HEART, CHEST, BREAST"
      - question: "Between <latin>queror</latin> and <latin>quaero</latin>"
        answer: "<latin>QUEROR</latin> - COMPLAIN; <latin>QUAERO</latin> - SEEK, ASK"
  - tossup:
      question: "What is the positive adverb of <latin>magnus</latin>?"
      answer: "<latin>MAGNOPERE</latin>"
    boni:
      - question: "What is the positive adverb of <latin>facilis</latin>?"
        answer: "<latin>FACILE</latin>"
      - question: "What is the superlative adverb of <latin>facilis</latin>?"
        answer: "<latin>FACILLIME</latin>"
