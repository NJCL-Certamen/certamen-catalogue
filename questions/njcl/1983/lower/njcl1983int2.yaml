tournament: "NJCL Certamen"
year: 1983
division: "Intermediate"
round: "Round 2"
questions:
  - tossup:
      question: "What Roman emperor died in the British city of York in 211 AD?"
      answer: "(L.) SEPTIMIUS SEVERUS"
    boni:
      - question: "Name the two sons of Septimius Severus who ruled jointly with equal authority for one year following their father's death."
        answer: "(M. AURELIUS ANTONINUS) GETA AND CARACALLA"
      - question: "The name Caracalla, like Caligula, is an imperial nickname; Caracalla ruled under the name M. Aurelius Antoninus. What does his nickname Caracalla mean?"
        answer: "AN OVERCOAT PECULIAR TO THE RHINELAND AND GAUL, WHICH C. LIKED TO WEAR"
  - tossup:
      question: "What part of a sentence can an intransitive verb not have?"
      answer: "DIRECT OBJECT"
    boni:
      - question: "What part of speech joins the two halves of a pair?"
        answer: "CONJUNCTION"
      - question: "Which of these is not a conjunction: <latin>ut, aut, et, it, at</latin>?"
        answer: "<latin>IT</latin>"
  - tossup:
      question: "In 47 BC Caesar defeated Pharnaces at Zela. Whose son was Pharnaces?"
      answer: "MITHRIDATES'"
    boni:
      - question: "What Roman general had defeated Mithridates some twenty years before?"
        answer: "POMPEY"
      - question: "Why was Mithridates immune to poison?"
        answer: "HE HAD TAKEN SOME DAILY ALL HIS LIFE"
  - tossup:
      question: "To what Trojan princess did Apollo give the gift of prophecy?"
      answer: "CASSANDRA"
    boni:
      - question: "Achilles dragged the body of Cassandra's brother around the walls of Troy. Who was that brother?"
        answer: "HECTOR"
      - question: "What Greek brought Cassandra back to Greece as part of his booty?"
        answer: "AGAMEMNON"
  - tossup:
      question: "What case is governed by the preposition <latin>per</latin>?"
      answer: "ACCUSATIVE"
    boni:
      - question: "What case is governed by the preposition <latin>ob</latin>?"
        answer: "ACCUSATIVE"
      - question: "What case is governed by the preposition <latin>propter</latin>?"
        answer: "ACCUSATIVE"
  - tossup:
      question: "Who was the Roman god of war?"
      answer: "MARS"
    boni:
      - question: "Who was the Roman goddess of war?"
        answer: "MINERVA / NERIO / BELLONA"
      - question: "Who was the Roman goddess of the moon?"
        answer: "DIANA"
  - tossup:
      question: "Who was changed into a spider by the angry Athena?"
      answer: "ARACHNE"
    boni:
      - question: "Into what was Callisto changed?"
        answer: "A BEAR"
      - question: "Who was Callisto's son?"
        answer: "ARCAS"
  - tossup:
      question: "Which of the following does not have the same root as the others: manner, manor, manse, remnant?"
      answer: "MANNER"
    boni:
      - question: "What verb is the root of three of them?"
        answer: "<latin>MANEO</latin>"
      - question: "What word is the root of “manner”?"
        answer: "<latin>MANUS</latin>"
  - tossup:
      question: "<latin>RESPONDE LATINE: Quot bracchia habes</latin>?"
      answer: "<latin>DUO</latin>"
    boni:
      - question: "<latin>RESPONDE LATINE: Quot capita habes</latin>?"
        answer: "<latin>UNUM</latin>"
      - question: "<latin>RESPONDE LATINE: Quot oculos habes</latin>?"
        answer: "<latin>DUO / DUOS</latin>"
  - tossup:
      question: "Translate into English the idiom <latin>castra ponere</latin>."
      answer: "PITCH CAMP"
    boni:
      - question: "Translate into English the idiom <latin>gratias agere</latin>."
        answer: "THANK"
      - question: "Translate into English the idiom <latin>verba facere</latin>."
        answer: "SPEAK / MAKE A SPEECH"
  - tossup:
      question: "What is another name for the Flavian Amphitheatre?"
      answer: "COLOSSEUM"
    boni:
      - question: "What does Trajan's Column commemorate?"
        answer: "VICTORY OVER DACIA"
      - question: "What arch is nearest the Colosseum?"
        answer: "ARCH OF CONSTANTINE"
  - tossup:
      question: "What was the first of a Roman month called?"
      answer: "THE KALENDS"
    boni:
      - question: "What were the other two reckoning points?"
        answer: "IDES AND NONES"
  - tossup:
      question: "Who was Rome's first king named Tarquin?"
      answer: "(L.) TARQUINIUS PRISCUS"
    boni:
      - question: "What was his wife's name?"
        answer: "TANAQUIL"
      - question: "What tribe were the Tarquins from?"
        answer: "THE ETRUSCANS"
  - tossup:
      question: "What young man killed the Calydonian boar?"
      answer: "MELEAGER"
    boni:
      - question: "What object, safeguarded by his mother, represented his lifespan?"
        answer: "A PIECE OF FIREWOOD"
      - question: "Who was his mother?"
        answer: "ALTHAEA"
  - tossup:
      question: "What is the ablative singular of <latin>lac</latin>?"
      answer: "<latin>LACTE</latin>"
    boni:
      - question: "What is the ablative singular of <latin>mel</latin>?"
        answer: "<latin>MELLE</latin>"
      - question: "What is the ablative singular of <latin>quies</latin>?"
        answer: "<latin>QUIETE</latin>"
  - tossup:
      question: "What is the meaning of the Latin word which has unchanged become the English word “agenda”?"
      answer: "THINGS WHICH MUST BE DONE"
    boni:
      - question: "What Latin words yield the English “willy nilly”?"
        answer: "VOLENS NOLENS / VELLE NOLLE"
      - question: "What proper adjective associated with Roman history has been corrupted into “parting” as in the phrases “parting shot” and “parting glance”?"
        answer: "PARTHIAN"
  - tossup:
      question: "What is the accusative singular of <latin>cornu</latin>?"
      answer: "<latin>CORNU</latin>"
    boni:
      - question: "What is the dative singular?"
        answer: "<latin>CORNU</latin>"
      - question: "What is the genitive singular?"
        answer: "<latin>CORNUS</latin>"
  - tossup:
      question: "Give two people the order: “Pity your friends.”"
      answer: "<latin>MISEREMINI AMICORUM (VESTRORUM)</latin>"
    boni:
      - question: "Use a gerundive to say “by making ships.”"
        answer: "<latin>NAVIBUS FACIENDIS</latin>"
      - question: "Use a gerundive to say “in order to make ships.”"
        answer: "<latin>AD NAVES FACIENDAS // NAVIUM FACIENDARUM CAUSA / GRATIA</latin>"
  - tossup:
      question: "What tutor instructed Hercules on the lyre?"
      answer: "LINUS"
    boni:
      - question: "Who was Hercules' wife, the woman responsible for his death?"
        answer: "DEIANEIRA"
      - question: "Whose blood poisoned him?"
        answer: "THE CENTAUR NESSUS'"
  - tossup:
      question: "What is the English for <latin>arbor</latin>?"
      answer: "TREE"
    boni:
      - question: "What is the English for <latin>radix</latin>?"
        answer: "ROOT"
      - question: "What is the English for <latin>saxum</latin>?"
        answer: "ROCK / STONE / BOULDER"
