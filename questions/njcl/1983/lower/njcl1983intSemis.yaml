tournament: "NJCL Certamen"
year: 1983
division: "Intermediate"
round: "Semifinals"
questions:

  - tossup:
      question: "What is the first person plural imperfect active subjunctive of <latin>fero</latin>?"
      answer: "<latin>FERREMUS</latin>"
    boni:
      - question: "Change <latin>ferremus</latin> to perfect."
        answer: "<latin>TULERIMUS</latin>"
      - question: "Change <latin>tulerimus</latin> to passive."
        answer: "<latin>LATI SIMUS</latin>"
  - tossup:
      question: "By whom was Cicero marked for death with a proscription list?"
      answer: "MARC(US) ANTONY / ANTONIUS"
    boni:
      - question: "Where and in what year was Cicero killed?"
        answer: "FORMIAE, 43 BC"
      - question: "What were the orations called which Cicero delivered against Antony?"
        answer: "THE PHILIPPICS"
  - tossup:
      question: "What does <latin>Q.E.D.</latin> stand for and what does it mean?"
      answer: "<latin>QUOD ERAT DEMONSTRANDUM</latin> - THAT WHICH HAD TO BE PROVEN"
    boni:
      - question: "What does <latin>e.g.</latin> stand for?"
        answer: "<latin>EXEMPLI GRATIA</latin> - FOR THE SAKE OF EXAMPLE"
      - question: "What does <latin>PhD</latin> stand for?"
        answer: "<latin>PHILOSOPHIAE DOCTOR</latin> - DOCTOR OF PHILOSOPHY"
  - tossup:
      question: "Give the first person singular pluperfect active subjunctive of <latin>tollo</latin>."
      answer: "<latin>SUSTULISSEM</latin>"
    boni:
      - question: "Change <latin>sustulissem</latin> to passive."
        answer: "<latin>SUBLATUS ESSEM</latin>"
      - question: "Change <latin>sustulissem</latin> to perfect."
        answer: "<latin>SUSTULERIM</latin>"
  - tossup:
      question: "What in Rome was the <latin>Aqua Appia</latin>?"
      answer: "THE APPIAN AQUEDUCT"
    boni:
      - question: "This aqueduct was named for the Roman responsible for its construction. Who was he?"
        answer: "APPIUS CLAUDIUS CAECUS"
      - question: "What does the name Caecus tell us about him?"
        answer: "HE WAS BLIND"
  - tossup:
      question: "What Latin noun is the root of the English adjective “cordial”?"
      answer: "<latin>COR</latin>"
    boni:
      - question: "What is its nominative plural?"
        answer: "<latin>CORDA</latin>"
      - question: "What is the meaning of the Latin noun at the root of the English adjective “coronary”?"
        answer: "CROWN"
  - tossup:
      question: "What case is used as the subject of the historical infinitive?"
      answer: "NOMINATIVE"
    boni:
      - question: "What case would be used to translate “I” in the sentence “I must go,” assuming a passive periphrastic is used?"
        answer: "DATIVE"
      - question: "In the sentence, “Caesar is said to have been a great general,” what case would be used to translate “general?”"
        answer: "NOMINATIVE (SO-CALLED NOM. WITH INF.)"
  - tossup:
      question: "What is the meaning of the idiom <latin>ius iurandum</latin>?"
      answer: "OATH"
    boni:
      - question: "What is the genitive singular of the phrase?"
        answer: "<latin>IURIS IURANDI</latin>"
      - question: "What does the verb <latin>iuro</latin> mean?"
        answer: "SWEAR"
  - tossup:
      question: "What type of siege machine was a <latin>turris ambulatoria</latin>?"
      answer: "A SIEGE TOWER ON WHEELS"
    boni:
      - question: "In a Roman camp, what was the <latin>fossa</latin>?"
        answer: "TRENCH AROUND THE PERIMETER"
      - question: "What type of soldiers were organized into units called <latin>alae</latin>?"
        answer: "CAVALRY"
  - tossup:
      question: "What mother was changed into a fountain?"
      answer: "NIOBE"
    boni:
      - question: "What girl was changed into a laurel?"
        answer: "DAPHNE"
      - question: "What statue was changed into a girl?"
        answer: "GALATEA"
  - tossup:
      question: "Which of the following is not related to <latin>genus</latin>: gender, genocide, genuide, genuflect?"
      answer: "GENUFLECT"
    boni:
      - question: "Identify the gender, declension and meaning of the root of “genuflect.”"
        answer: "FOURTH NEUTER “KNEE”"
      - question: "“Knee” is not a derivative of <latin>genu</latin>, but the two nouns have a common root in Indo-European. What do we call such word relatives?"
        answer: "COGNATES"
  - tossup:
      question: "Who were the sons of Theseus and Phaedra?"
      answer: "ACAMAS, DEMOPHON"
    boni:
      - question: "Who was the son of Theseus and Perigune, daughter of Sinis?"
        answer: "MELANIPPUS"
      - question: "Who besides Hippolyta is some sourses said to be the mother of Hippolytus?"
        answer: "HIPPOLYTA'S SISTER ANTIOPE"
  - tossup:
      question: "<latin>RESPONDE LATINE: Quot fiunt quattuor et novem</latin>?"
      answer: "<latin>TREDECIM</latin>"
    boni:
      - question: "<latin>RESPONDE LATINE: Quot fiunt triginta minus undecim</latin>?"
        answer: "<latin>UNDEVIGINTI</latin>"
      - question: "<latin>RESPONDE LATINE: Quot fiunt ter sex</latin>?"
        answer: "<latin>DUODEVIGINTI</latin>"
  - tossup:
      question: "When Tantalus served his son Pelops to the gods as a stew, who bit into the flesh and realized it was human?"
      answer: "CERES / DEMETER"
    boni:
      - question: "When Pelops was brought back to life, how was his ruined shoulder replaced?"
        answer: "WITH ONE OF IVORY"
      - question: "Who served her son to her husband because her husband had seduced and cut out the tongue of her sister?"
        answer: "PROCNE"
  - tossup:
      question: "We know about Sisyphus and his rock in Hades. Where was he king when alive?"
      answer: "CORINTH"
    boni:
      - question: "What games is he credited with starting there?"
        answer: "ISTHMIAN"
      - question: "Who reinstituted them after a lapse?"
        answer: "THESEUS"
  - tossup:
      question: "<latin>Impero, persuadeo, permitto</latin> and <latin>pareo</latin> all govern what case?"
      answer: "DATIVE"
    boni:
      - question: "What case goes with <latin>rogo, moneo, hortor</latin> and <latin>imploro</latin>?"
        answer: "ACCUSATIVE"
      - question: "What case goes with <latin>peto</latin> and <latin>postulo</latin>?"
        answer: "ABLATIVE (+ AB)"
  - tossup:
      question: "In what building would you see a <latin>retiarius</latin>?"
      answer: "THE COLOSSEUM"
    boni:
      - question: "Where would you see an <latin>auriga</latin>?"
        answer: "THE CIRCUS"
      - question: "Where would you see a <latin>flamen</latin>?"
        answer: "THE TEMPLE"
  - tossup:
      question: "What wicked woman betrayed the Roman citadel to the Sabines for the objects they wore on their arms?"
      answer: "TARPEIA"
    boni:
      - question: "How did they repay her?"
        answer: "THEY CRUSHED HER WITH THEIR SHIELDS"
      - question: "The Tarpeian rock, named for this traitoress, was used by the Romans as a place of execution. On what hill is it found?"
        answer: "THE CAPITOLINE"
  - tossup:
      question: "Who was the son of Semele?"
      answer: "BACCHUS / DIONYSUS"
    boni:
      - question: "Who was his mortal foster father?"
        answer: "SILENUS / ATHAMAS"
      - question: "Who, to his regret, was rewarded by Bacchus for a kindness to Silenus?"
        answer: "MIDAS"
  - tossup:
      question: "Between what two major wars did the Romans fight the Macedonian Wars?"
      answer: "THE SECOND AND THIRD PUNIC WARS"
    boni:
      - question: "Against what Asian king did the Romans also fight during the second century BC?"
        answer: "ANTIOCHUS"
      - question: "To what defeated Roman foe did Antiochus give temporary asylum?"
        answer: "HANNIBAL"
