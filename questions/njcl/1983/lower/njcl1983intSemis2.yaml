tournament: "NJCL Certamen"
year: 1983
division: "Intermediate"
round: "Semifinals 2"
questions:

  - tossup:
      question: "On what body of water is Colchis, Medea's homeland, located?"
      answer: "THE BLACK SEA / <latin>PONTUS EUXINUS</latin>"
    boni:
      - question: "At the time of Jason's quest, who was the king?"
        answer: "AEËTES"
      - question: "What son of AEËTES was killed by his sister Medea to aid the escape of Jason and herself?"
        answer: "ABSYRTUS"
  - tossup:
      question: "What Roman law officially established the Second Triumvirate and proved to be another death blow for the Republic?"
      answer: "THE <latin>LEX TITIA</latin>"
    boni:
      - question: "What Roman law legalized the intermarriage of patricians and plebeians?"
        answer: "<latin>LEX CANULEIA</latin>"
      - question: "What law of 287 BC made votes of the popular assembly binding on all Romans?"
        answer: "<latin>LEX HORTENSIA</latin>"
  - tossup:
      question: "What is the perfect passive infinitive of <latin>scribo</latin>?"
      answer: "<latin>SCRIPTUS ESSE</latin>"
    boni:
      - question: "What is its perfect active infinitive?"
        answer: "<latin>SCRIPSISSE</latin>"
      - question: "Translate “We shall have written.”"
        answer: "<latin>SCRIPSERIMUS</latin>"
  - tossup:
      question: "Using a supine, say in Latin: “They came to fight.”"
      answer: "<latin>PUGNATUM VENERUNT</latin>"
    boni:
      - question: "Using another supine, say: “difficult to do.”"
        answer: "<latin>DIFFICILE FACTU</latin>"
      - question: "Of what declension does the supine use the inflections?"
        answer: "FOURTH"
  - tossup:
      question: "What was the name of Rome's main sewer?"
      answer: "<latin>CLOACA MAXIMA</latin>"
    boni:
      - question: "By the time of Augustus, the Cloaca Maxima had fallen into disrepair. What friend of Augustus renovated the sewer and water system of Rome in 33 BC?"
        answer: "(M. VIPSANIUS) AGRIPPA"
      - question: "Who was the patron deity of the sewers?"
        answer: "VENUS"
  - tossup:
      question: "What god sent a plague on the Greeks at Troy?"
      answer: "APOLLO"
    boni:
      - question: "Why?"
        answer: "HE WAS ANGRY AT AGAMEMNON's CAPTURE OF CHRYSEÏS"
      - question: "Who was the Greeks' chief priest at Troy?"
        answer: "CALCHAS"
  - tossup:
      question: "Give the Latin noun with its meaning from which the English word “umbrella” is derived."
      answer: "<latin>UMBRA</latin> - SHADE"
    boni:
      - question: "From what Latin verb does “usury” come?"
        answer: "<latin>UTOR</latin>"
      - question: "Give the Latin verb at the root of “ambition.”"
        answer: "<latin><latin>AMBIO, AMBIRE</latin> (COMPOUND OF <latin>EO, IRE</latin>)</latin>"
  - tossup:
      question: "What is the meaning of the Ciceronian idiom <latin>causam dicere</latin>?"
      answer: "PLEAD A CASE"
    boni:
      - question: "Translate these Ciceronian idioms: <latin>uno ore</latin>."
        answer: "UNANIMOUSLY"
      - question: "<latin>censum habere</latin>."
        answer: "TAKE A CENSUS"
  - tossup:
      question: "What king of the Sabines ruled jointly with Romulus?"
      answer: "TITUS TATIUS"
    boni:
      - question: "Who was the only other Sabine king of Rome?"
        answer: "NUMA POMPILIUS"
      - question: "Who was Numa's consort?"
        answer: "(THE NYMPH) EGERIA"
  - tossup:
      question: "Who threw Romulus and Remus into the river?"
      answer: "AMULIUS"
    boni:
      - question: "Who set Danaë and Perseus afloat in a chest?"
        answer: "ACRISIUS"
      - question: "Who lost a sandal helping an old lady ford a river?"
        answer: "JASON"
  - tossup:
      question: "Change <latin>vult</latin> to subjunctive."
      answer: "<latin>VELIT</latin>"
    boni:
      - question: "What is the <emphasis>tense</emphasis> of the archaic subjunctive form <latin>ausim</latin>?"
        answer: "PERFECT"
      - question: "What would be the more normal classical form of the archaic form <latin>faxim</latin>?"
        answer: "<latin>FECERIM</latin>"
  - tossup:
      question: "What praenomen is abbreviated M'?"
      answer: "MANIUS"
    boni:
      - question: "Which one is abbreviated Cn?"
        answer: "GNAEUS"
      - question: "Which one is abbreviated Mam?"
        answer: "MAMERCUS"
  - tossup:
      question: "Name an English word derived from the Latin verb meaning “to drink.”"
      answer: "IMBIBE, BIBULOUS, BEVERAGE, ETC"
    boni:
      - question: "What is the perfect active infinitive of this verb?"
        answer: "<latin>BIBISSE</latin>"
      - question: "What Latin verb means “to breathe”?"
        answer: "<latin>SPIRARE / HALARE</latin>"
  - tossup:
      question: "Who after sleeping with her father gave birth to Adonis?"
      answer: "MYRRHA"
    boni:
      - question: "Who was Myrrha's father and lover?"
        answer: "CINYRAS / BELUS / THEIAS"
      - question: "What was Myrrha's metamorphosis?"
        answer: "INTO A MYRRH TREE"
  - tossup:
      question: "Where did the emperor Hadrian build a wall?"
      answer: "BRITAIN / GERMANY"
    boni:
      - question: "Where did the emperor Aurelian build a wall?"
        answer: "AROUND ROME"
      - question: "Where did Romulus build his wall?"
        answer: "ON THE PALATINE"
  - tossup:
      question: "What is unusual about the adjectives <latin>nequam</latin> and <latin>frugi</latin>?"
      answer: "THEY ARE INDECLINABLE"
    boni:
      - question: "Give the masculine dative singular of the adjective <latin>ullus</latin>."
        answer: "<latin>ULLI</latin>"
      - question: "Give the feminine nominative singular of the adjective <latin>tener</latin>."
        answer: "<latin>TENERA</latin>"
  - tossup:
      question: "In Cicero, what mood normally follows the conjunction <latin>quamvis</latin>, “although”?"
      answer: "SUBJUNCTIVE"
    boni:
      - question: "What type of subjunctive clause is introduced by the conjunction <latin>tamquam</latin>, meaning “as if” or “as though?”"
        answer: "SUBJUNCTIVE CLAUSE OF COMPARISON"
      - question: "What type of subjunctive clause is introduced by <latin>dum, modo</latin> and <latin>dummodo</latin>?"
        answer: "SUBJUNCTIVE CLAUSE OF PROVISO"
  - tossup:
      question: "Daphne and Marpessa spurned Apollo's love. Whom did Apollo spurn, causing her to turn into a sunflower?"
      answer: "CLYTIË"
    boni:
      - question: "Whom did Marpessa prefer to Apollo?"
        answer: "IDAS"
      - question: "Who was Daphne's father?"
        answer: "THE RIVER GOD PENEIUS"
  - tossup:
      question: "What Latin noun includes all the following: <latin>ulmus, quercus, pinus, ficus</latin>?"
      answer: "<latin>ARBORES</latin>"
    boni:
      - question: "What Latin noun includes these: Notus, Boreas, Zephyrus, Auster?"
        answer: "<latin>VENTI</latin>"
      - question: "What Latin noun includes these: Melita, Baliares, Ogygia, Ortygia?"
        answer: "<latin>INSULAE</latin>"
  - tossup:
      question: "In what war were the Battles of Ecnomus, Panormus, Drepana and Mylae fought?"
      answer: "THE FIRST PUNIC WAR"
    boni:
      - question: "In what war were Roman armies led by the generals Bestia, Postumius Albinus, Metellus Numidicus and Marius?"
        answer: "JUGURTHINE"
      - question: "What enemy of Rome won victories at Heraclea in 280 BC and at Asculum in 279?"
        answer: "PYRRHUS"
