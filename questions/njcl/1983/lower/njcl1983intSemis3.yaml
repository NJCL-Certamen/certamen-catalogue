tournament: "NJCL Certamen"
year: 1983
division: "Intermediate"
round: "Semifinals 3"
questions:

  - tossup:
      question: "What character in mythology invented the shepherd's pipes?"
      answer: "PAN"
    boni:
      - question: "The instrument was named for a nymph whom Pan loved. Who was she?"
        answer: "SYRINX"
      - question: "How did she come to give her name to the pipes?"
        answer: "SHE HAD BEEN TURNED INTO A THICKET OF WEEDS, FROM WHICH THE PIPES WERE MADE"
  - tossup:
      question: "Give the English equivalent of the Ides of November."
      answer: "NOV. 13"
    boni:
      - question: "What is <latin>a.d. V Nonas Octobres</latin>?"
        answer: "OCT. 3"
      - question: "What is <latin>a.d. IV Kalendas Maias</latin>?"
        answer: "APR. 28"
  - tossup:
      question: "Whom did Demeter punish with insatiable hunger?"
      answer: "ERYSICHTHON"
    boni:
      - question: "What rival did Polyphemus crush with a boulder?"
        answer: "ACIS"
      - question: "What rival for Glaucus did Circe transform with a potion?"
        answer: "SCYLLA"
  - tossup:
      question: "Who was the mother of the Muses?"
      answer: "MNEMOSYNE"
    boni:
      - question: "What mountain was sacred to them?"
        answer: "HELICON / PIERIA"
      - question: "What was the native Italic version of the Muses?"
        answer: "CAMENAE"
  - tossup:
      question: "What posthumous penalty was exacted on Domitian?"
      answer: "THE <latin>DAMNATIO MEMORIAE</latin>"
    boni:
      - question: "Who had preceded Domitian?"
        answer: "TITUS"
      - question: "What relationship was Domitian to Titus?"
        answer: "BROTHER"
  - tossup:
      question: "Illyricum was a narrow province that bordered Cisalpine Gaul on the southeast. Name the two modern-day countries which lie in the same territory as ancient Illyricum."
      answer: "ALBANIA AND YUGOSLAVIA"
    boni:
      - question: "What modern city was ancient Lutetia?"
        answer: "PARIS"
      - question: "What modern name is given to the river Sequana?"
        answer: "SEINE"
  - tossup:
      question: "What English noun comes from the Latin verb <latin>scindo</latin>?"
      answer: "SCISSORS et al."
    boni:
      - question: "What is the perfect active infinitive of <latin>pendo</latin>?"
        answer: "<latin>PEPENDISSE</latin>"
      - question: "What is the perfect active infinitive of <latin>parco</latin>?"
        answer: "<latin>PEPERCISSE</latin>"
  - tossup:
      question: "What was <latin>aes rude</latin>?"
      answer: "LUMBS OF BRONZE USED AS EARLY CURRENCY"
    boni:
      - question: "What was <latin>aes grave</latin>?"
        answer: "THE FIRST ROUND BRONZE COINS"
      - question: "What were the <latin>triumviri monetales</latin>?"
        answer: "MINT SUPERVISORS"
  - tossup:
      question: "Supply a Latin noun which sums up these: leo, cervus, taurus, ovis."
      answer: "<latin>ANIMALIA / QUADRUPEDES</latin>"
    boni:
      - question: "Supply one for these nound: <latin>corvus, perdix, anas, anser</latin>."
        answer: "<latin>AVES</latin>"
      - question: "Supply one for these: <latin>murex, tonsicula, tructa, pistrix</latin>."
        answer: "<latin>PISCES</latin>"
  - tossup:
      question: "In a regular third- or fourth-conjugation verb, what other form is identical in both voices to the first person singular present subjunctive?"
      answer: "THE FIRST PERSON SINGULAR FUTURE INDICATIVE"
    boni:
      - question: "What is this form in the passive for <latin>capio</latin>?"
        answer: "<latin>CAPIAR</latin>"
      - question: "What is the present imperative of <latin>reor</latin>?"
        answer: "<latin>RERE</latin>"
  - tossup:
      question: "What type of verb is <latin>coepi</latin>?"
      answer: "DEFECTIVE"
    boni:
      - question: "What synonym for <latin>coepi</latin> is not defective?"
        answer: "<latin>INCIPIO</latin>"
      - question: "Give the principal parts of a defective verb which means “hate.”"
        answer: "<latin>ODI, ODISSE, OSURUS</latin>"
  - tossup:
      question: "Who taunted the defeated Romans with the sarcastic phrase <latin>vae victis</latin>?"
      answer: "BRENNUS"
    boni:
      - question: "What battle a few miles away had preceded the capture of Rome by Brennus?"
        answer: "THE BATTLE OF THE RIVER ALLIA"
      - question: "When did he capture Rome?"
        answer: "390 / 387 BC"
  - tossup:
      question: "Who built the city Pallanteum on the hill later called the Palatine?"
      answer: "EVANDER"
    boni:
      - question: "Who visited him to kill a monster?"
        answer: "HERCULES"
      - question: "Who visited him to ask for military aid?"
        answer: "AENEAS"
  - tossup:
      question: "Change this sentence to the passive: <latin>Numa leges dedit</latin>."
      answer: "<latin>LEGES A NUMA DATAE SUNT</latin>"
    boni:
      - question: "Translate: The Roman people were ruled well by Numa."
        answer: "<latin>POPULUS ROMANUS A NUMA BENE REGEBATUR / RECTUS EST</latin>"
      - question: "Say in Latin: “Numa must give laws.”"
        answer: "<latin>LEGES NUMAE DANDAE SUNT</latin>"
  - tossup:
      question: "Who was the mother of Andromeda?"
      answer: "CASSIOPEIA"
    boni:
      - question: "Who was Andromeda's father?"
        answer: "CEPHEUS"
      - question: "Who was her betrothed before Perseus?"
        answer: "HER UNCLE PHINEUS"
  - tossup:
      question: "Complete the analogy: <latin>volo : nolo :: vis : ___</latin>"
      answer: "<latin>NON VIS</latin>"
    boni:
      - question: "<latin>Volo : malo :: vult : ____</latin>"
        answer: "<latin>MAVULT</latin>"
      - question: "<latin>Volumus : nolumus :: vultis : ____</latin>"
        answer: "<latin>NON VULTIS</latin>"
  - tossup:
      question: "What is the grammatical use of <latin>me</latin> in this sentence: <latin>Me pulchrum esse puto</latin>?"
      answer: "SUBJECT OF INDIRECT STATEMENT"
    boni:
      - question: "What is the use of me: <latin>Meus frater me minor est</latin>?"
        answer: "ABL. OF COMPARISON"
      - question: "What is the use of me: <latin>Me magistro, discipul multa discunt</latin>?"
        answer: "ABLATIVE ABSOLUTE"
      - question: "What is the use of me: <latin>Meus frater me minor est</latin>?"
        answer: "ABL. OF COMPARISON"
  - tossup:
      question: "To us it's a countertop. What was a <latin>formica</latin> in Rome?"
      answer: "ANT"
    boni:
      - question: "What was a <latin>rana</latin>?"
        answer: "FROG"
      - question: "What was a <latin>pullus</latin>?"
        answer: "CHICKEN"
  - tossup:
      question: "The brother of Cicero, the poets Horace and Ennius, and Fabius the Delayer, all had what in common?"
      answer: "<latin>PRAENOMEN</latin> QUINTUS"
    boni:
      - question: "The wife of Marius, the grandmother of Augustus, the mother of Caracalla and the daughter of Scribonia all shared what name?"
        answer: "JULIA"
      - question: "The poet Catullus; Pollio, the rescuer of Vergil's farm; and the two Plinies all had waht praenomen?"
        answer: "GAIUS"
  - tossup:
      question: "From what Latin verb does the English noun “parent” come?"
      answer: "<latin>PARIO</latin>"
    boni:
      - question: "What does <latin>pario</latin> mean?"
        answer: "PRODUCE, GIVE BIRTH"
      - question: "What is its perfect active infinitive?"
        answer: "<latin>PEPERISSE</latin>"
