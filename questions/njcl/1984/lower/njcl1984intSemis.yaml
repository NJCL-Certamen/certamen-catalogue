tournament: "NJCL Certamen"
year: 1984
division: "Intermediate"
round: "Semifinals"
questions:

  - tossup:
      question: "Who was the first wife of Aeneas?"
      answer: "CREUSA"
    boni:
      - question: "What city did Aeneas found in Italy and name after his ~~second~~ last wife?"
        answer: "LAVINIUM"
      - question: "Dido, Aeneas' lover, was a widow; who was her dead husband?"
        answer: "SYCHAEUS (SICHARBAS)"
  - tossup:
      question: "."
      answer: "The suffix -men, minis makes from a verb a noun meaning the means or result of the action of a verb. Using this suffix, give the word that means “the result of flowing” - a stream. FLUMEN (FLUMINIS N)"
    boni:
      - question: "What word means “the result of driving”?"
        answer: "AGMEN"
      - question: "What word means “the means of knowing” - a name?"
        answer: "NOMEN"
  - tossup:
      question: "What Roman emperor fought the Marcomannic Wars?"
      answer: "M. AURELIUS"
    boni:
      - question: "Where did Marcus Aurelius die?"
        answer: "VINDOBONA (VIENNA)"
      - question: "Who was M. Aurelius' successor?"
        answer: "COMMODUS"
  - tossup:
      question: "Where in Rome was the Temple of Aesculapius located?"
      answer: "TIBER ISLAND"
    boni:
      - question: "Where did Augustus build the Temple of the Deified Caesar?"
        answer: "THE FORUM"
      - question: "In which imperial forum was the temple of Mars Ultor located?"
        answer: "IN THE FORUM AUGUSTUM (or FORUM AUGUSTI)"
  - tossup:
      question: "The Latin word for “herd” produced the Latin word for “money” because a man's wealth in an agricultural society was measured by his livestock. What are these two Latin nouns?"
      answer: "PECUS AND PECUNIA"
    boni:
      - question: "What is the geitive singular of the phrase unus princeps?"
        answer: "UNIUS PRINCIPIS"
      - question: "What is the accusative plural of locus?"
        answer: "LOCA"
  - tossup:
      question: "To what office was Caesar elected in 63 BC?"
      answer: "PONTIFEX MAXIMUS"
    boni:
      - question: "What office was abolished after his death?"
        answer: "DICTATOR"
      - question: "Which emperor refused to accept the title of Augustus?"
        answer: "VITELLIUS"
  - tossup:
      question: "What is the English for mens?"
      answer: "MIND"
    boni:
      - question: "What is the English for mensa?"
        answer: "TABLE"
      - question: "What is the English for mensis?"
        answer: "MONTH"
  - tossup:
      question: "What enemy commander led the sack of Rome in 410 AD?"
      answer: "ALARIC"
    boni:
      - question: "Of what tribe was Alaric chieftain?"
        answer: "THE VISIGOTHS"
      - question: "Who made a sea raid upon Rome in 455 AD?"
        answer: "GAISERIC (THE VANDALS)"
  - tossup:
      question: "What month did the Romans consider unlucky for weddings?"
      answer: "MAY"
    boni:
      - question: "How long was the standard Roman engagement?"
        answer: "TWO YEARS"
      - question: "Into how many strands was a Roman bride's hair traditionally braided?"
        answer: "SIX"
  - tossup:
      question: "One of the best archers among the Greeks at Troy was also the half-brother of Ajax the Greater. Who was he?"
      answer: "TEUCER"
    boni:
      - question: "Who was the father of Ajax the Greater?"
        answer: "TELAMON"
      - question: "Juno in the first book of the Aeneid mentions Ajax the Lesser as having performed what sacrilege?"
        answer: "VIOLATING CASSANDRA OR CARRYING OFF THE PALLADIUM"
  - tossup:
      question: "What is the perfect active infinitive of <u>surgo</u>?"
      answer: "SURREXISSE"
    boni:
      - question: "."
        answer: "681 Give the perfect active infinitive of these verbs:"
      - question: "."
        answer: "<u>sepelio</u>. SEPELIVISSE"
      - question: "."
        answer: "<u>pingo</u>. PINXISSE"
  - tossup:
      question: "."
      answer: "Translate into English: <u>Me paenitet</u>. I REGRET, I'M SORRY."
    boni:
      - question: "."
        answer: "13 Translate these impersonal verbs:"
      - question: "."
        answer: "<u>Me taedet</u>. IT BORES ME, I'M BORED."
      - question: "."
        answer: "<u>Me miseret</u>. IT GRIEVES ME, I'M DISTRESSED"
  - tossup:
      question: "."
      answer: "What kind of perfects do the following verbs have in common:"
    boni:
      - question: "218 <u>curro</u>, <u>cano</u>, <u>cado</u>, <u>caedo</u>?"
        answer: "REDUPLICATED"
      - question: "What is the perfect active infinitive of <u>fallo</u>?"
        answer: "FEFELISSE"
      - question: "What is the perfect active infinitive of <u>pello</u>?"
        answer: "PEPULISSE"
  - tossup:
      question: "."
      answer: "AUC is sometimes taken to stand for something other than"
    boni:
      - question: "178 <u>ab urbe condita</u>. What else?"
        answer: "ANNO URBIS CONDITAE"
      - question: "How would I ask the date in Latin? QUOTUS DIES EST? Quotus dies est?"
        answer: "<u>a.d. IV Non. Aug.</u>"
  - tossup:
      question: "."
      answer: "What priestess guided her lover across the Hellespont with"
    boni:
      - question: "3/35 a lantern?"
        answer: "HERO"
      - question: "Of what deity was Hero the priestess?"
        answer: "APHRODITE"
      - question: "Who was Hero's lover?"
        answer: "LEANDER"
  - tossup:
      question: "Who are doomed to drawing water with their sieves?"
      answer: "THE DANAIDS"
    boni:
      - question: "2577 What was their crime?"
        answer: "THEY MURDERED THEIR BRIDEGROOMS"
      - question: "How many of them share this fate?"
        answer: "49"
  - tossup:
      question: "What is the universal genitive singular of the pronoun <u>hic</u>?"
      answer: "HUIUS"
    boni:
      - question: "868 What is the genitive singular of <u>ille</u>?"
        answer: "ILLIUS"
      - question: "What is the genitive singular of <u>is</u>?"
        answer: "EIUS"
  - tossup:
      question: "."
      answer: "Which of the following is a derivative of <u>do</u>: dance, date"
    boni:
      - question: "757 (the fruit), date (a social occasion), dandy?"
        answer: "DATE (SOCIAL)"
      - question: "."
        answer: "Which of the following is not a derivative of a compound"
      - question: "of <u>do</u>: traitor, addition, predator, condition?"
        answer: "PREDATOR"
      - question: "What Latin verb lies at the ultimate root of predator?"
        answer: "PRAEHENDO"
  - tossup:
      question: "Whose throne was usurped in the king's absence by Menestheus?"
      answer: "3096 THESEUS"
    boni:
      - question: "."
        answer: "What sons of Theseus were forced to flee from Athens while"
      - question: "Menestheus was on the throne?"
        answer: "ACAMAS AND DEMOPHON"
      - question: "Where did they go for refuge?"
        answer: "TO THE COURT OF KING ELEPHENOR"
      - question: "."
        answer: "OF THE ABANTES, IN EUBOEA"
  - tossup:
      question: "What is regularly odd about the prepositions <u>tenus</u> and <u>versus</u>?"
      answer: "191 THEY FOLLOW THEIR OBJECTS"
    boni:
      - question: "What case does <u>tenus</u> take?"
        answer: "THE ABLATIVE (or GENITIVE)"
      - question: "What case does <u>versus</u> take?"
        answer: "THE ACCUSATIVE"
      - question: "."
        answer: "#"