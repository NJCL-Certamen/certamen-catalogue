tournament: "NJCL Certamen"
year: 1984
division: "Intermediate"
round: "Semifinals 2"
questions:

  - tossup:
      question: "What Roman circus dates from 221 BC?"
      answer: "THE CIRCUS FLAMINIUS"
    boni:
      - question: "What Roman circus, dating from the fourth century AD, stood on the Appian Way outside Rome?"
        answer: "THE CIRCUS OF MAXENTIUS"
      - question: "What Roman circus stood on the present site of Vatican City?"
        answer: "THE CIRCUS OF NERO AND GAIUS or THE CIRCUS VATICANUS"
  - tossup:
      question: "Which of the Argonauts had the power to fly?"
      answer: "ZETES AND CALAIS"
    boni:
      - question: "Who among them was so swift-footed he could run over the waves?"
        answer: "EUPHEMUS"
      - question: "Which Argonaut could, by calling on his grandfather Poseidon, assume any form he wished?"
        answer: "PERICLYMENUS"
  - tossup:
      question: "In what year did Titus sack Jerusalem?"
      answer: "70 AD"
    boni:
      - question: "In what year did Mummius sack and destroy Corinth?"
        answer: "146BC"
      - question: "What did the Romans call the province they made from Greece?"
        answer: "ACHAIA"
  - tossup:
      question: "Who killed Agamemnon when he got back home?"
      answer: "CLYTEMNESTRA AND/OR AEGISTHUS"
    boni:
      - question: "Who killed Clytemnestra?"
        answer: "ORESTES"
      - question: "How was Orestes punished for matricide?"
        answer: "PURSUED BY THE FURIES"
  - tossup:
      question: "What Latin relative pronoun would be required to translate this sentence into Latin: “The students that you see on stage are very smart?"
      answer: "” QUOS"
    boni:
      - question: "."
        answer: "“The Romans, whose accomplishments were many, are worthy of study.” QUORUM"
      - question: "."
        answer: "Your parents, whom you should obey, told you to do your homework. QUIBUS"
  - tossup:
      question: "Who was the man who provided Odysseus with the ship in which he was finally taken back to Ithaca?"
      answer: "ALCINOUS"
    boni:
      - question: "How did Poseidon punish Alcinous for this?"
        answer: "HE TURNED THE SHIP INTO A STONE, BLOCKING THE HARBOR FOREVER."
      - question: "What was the name of Alcinous' island kindgom?"
        answer: "SCHERIA"
  - tossup:
      question: "What Latin phrase often means “something” but literally means “I don't know what”?"
      answer: "NESCIO QUID"
    boni:
      - question: "What is the singular imperative of scio?"
        answer: "SCITO"
      - question: "Which of the following is not a derivative of scio: science, scout, omniscient, plebiscite?"
        answer: "SCOUT"
  - tossup:
      question: "When would a Roman girl stop wearing her bulla?"
      answer: "THE DAY BEFORE HER WEDDING"
    boni:
      - question: "When would a Roman boy stop wearing his?"
        answer: "THE DAY HE GOT THE TOGA VIRILIS"
      - question: "What did a child receive the same day it was given a bulla?"
        answer: "ITS NAME"
  - tossup:
      question: "Which emperor opened the ranks of the Pretorian Guard to provincials?"
      answer: "SEPTIMIUS SEVERUS"
    boni:
      - question: "With what deceased figure did Septimius Severus affiliate himself with a reverse, unilateral act of adoption?"
        answer: "M. AURELIUS"
      - question: "Whom did Septimius Severus name as his heirs?"
        answer: "GETA AND CARACALLA"
  - tossup:
      question: "198 Which of these words is not an adverb: diu, nunc, non, tum, sine?"
      answer: "SINE"
    boni:
      - question: "Which of these is not a preposition: ad, cum, bis, ex, ab?"
        answer: "BIS"
      - question: "Which of these is not a conjunction: sed, saepe, et, quod, ubi?"
        answer: "SAEPE"
  - tossup:
      question: "."
      answer: "645 Give the correct form of the adjective fortis to agree with the noun pueris. FORTIBUS"
    boni:
      - question: "What form of fortis is required to modify milite?"
        answer: "FORTI"
      - question: "To modify militum?"
        answer: "FORTIUM"
  - tossup:
      question: "."
      answer: "633 Change this sentence to the passive: Numa leges dedit. LEGES A NUMA DATAE SUNT."
    boni:
      - question: "What case is used to show agent with a passive periphrastic?"
        answer: "DATIVE"
      - question: "."
        answer: "Say in Latin: “Numa must give laws.” LEGES NUMAE DANDAE SUNT."
  - tossup:
      question: "734 What Latin noun is a general term for these: torus, sella, lectus, mensa?"
      answer: "SUPELLEX"
    boni:
      - question: "What Latin noun contains all of these: mala, uva, fici, pruna?"
        answer: "FRUGES (or POMA or FRUCTUS)"
      - question: "What Latin noun includes all of these: vespertilio, iumentum, caper, lepus?"
        answer: "ANIMALIA (MAMMALIA)"
  - tossup:
      question: "3121 Who was the father of the Titans?"
      answer: "URANUS"
    boni:
      - question: "Who was their mother?"
        answer: "GAEA"
      - question: "Who overthrew Uranus?"
        answer: "CRONUS"
