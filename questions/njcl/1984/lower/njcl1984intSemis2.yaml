      question: "."
      answer: "5267"
  - tossup:
      question: "5267 In what year was the first triumvirate formed?"
      answer: "60 BC"
    boni:
      - question: "How long did the triumvirate last?"
        answer: "SEVEN YEARS"
      - question: "In what year was the second triumvirate formed?"
        answer: "43 BC"
  - tossup:
      question: "3023 What creature was part lion, part goat and part serpent?"
      answer: "CHIMAERA"
    boni:
      - question: "What hero killed it?"
        answer: "BELLEROPHON"
      - question: "What was his horse's name?"
        answer: "PEGASUS"
  - tossup:
      question: "."
      answer: "10 Give the correct form of facio for this sentence: “I don't know what he's doing.” FACIAT"
    boni:
