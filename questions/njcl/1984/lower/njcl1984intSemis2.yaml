        answer: "NOSSE"
  - tossup:
      question: "608 Where is the common abbvreviation S.T.T.L. found?"
      answer: "CEMETERIES"
    boni:
      - question: "What were the columbaria in a Roman cemetery?"
        answer: "NICHES FOR URNS"
      - question: "What does the word “sarcophagus” (a stone coffin) literally mean?"
        answer: "FLESH-EATER"
