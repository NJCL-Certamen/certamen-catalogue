      - question: "What feature is evident in a fenestrated wall?"
        answer: "WINDOWS"
      - question: "If lioness and tigress are the female versions of lion and tiger, what does “egress” mean?"
        answer: "A MEANS OF EXIT"
  - tossup:
      question: "."
      answer: "415 You should know by now that the perfect of tollo is sustuli."
