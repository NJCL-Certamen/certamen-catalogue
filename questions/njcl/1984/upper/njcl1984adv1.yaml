tournament: "NJCL Certamen"
year: 1984
division: "Advanced"
round: "Round 1"
questions:

  - tossup:
      question: "."
      answer: "Change to the accusative singular the phrase celeris fuga. CELEREM FUGAM"
    boni:
      - question: "."
        answer: "Change the same phrase to the genitive plural. CELERIUM FUGARUM"
      - question: "."
        answer: "Change the same phrase to the ablative singular. CELERI FUGA"
  - tossup:
      question: "Which of these is not from the verb flo: souffle, flatulent, persiflage, flute?"
      answer: "PERSIFLAGE"
    boni:
      - question: "“Persiflage” means idle chatter or banter. What Latin verb is at its root?"
        answer: "SIBILARE (hiss or whistle)"
      - question: "How is a vehicle for those who can't walk derived from the Latin verb for walk?"
        answer: "AMBULANCE IS FROM A FRENCH TERM WHICH LITERALLY MEANS “WALKING HOSPITAL.”"
  - tossup:
      question: "What Roman author wrote a biography of his father-in-law, a provincial governor?"
      answer: "TACITUS"
    boni:
      - question: "What was the name of the work and the subject?"
        answer: "AGRICOLA"
      - question: "What historian, roughly a contemporary of Tacitus, was the author of The Lives of the Twelve Caesars?"
        answer: "SUETONIUS"
  - tossup:
      question: "What do the words nihil, fas and mane have in common?"
      answer: "THEY ARE INDECLINABLE"
    boni:
      - question: "What two forms of the noun vis are not found?"
        answer: "GEN. AND DAT. SINGULAR"
      - question: "What two forms of the noun nemo are not found?"
        answer: "GEN. AND ABL. SINGULAR"
  - tossup:
      question: "How many of the Seven Wonders of the World glorified Greek divinities?"
      answer: "THREE"
    boni:
      - question: "Which divinity was honored by a temple at Ephesus?"
        answer: "ARTEMIS"
      - question: "Who was honored by the Colossus of Rhodes?"
        answer: "APOLLO OR HELIOS"
  - tossup:
      question: "What earlier poet did Horace call his lantern?"
      answer: "LUCILIUS"
    boni:
      - question: "What early Roman epicist wrote a poem on Roman history entitled the Annales?"
        answer: "ENNIUS"
      - question: "What second-century AD historian wrote a prose work of the same title?"
        answer: "TACITUS"
  - tossup:
      question: "What was the year of the four emperors?"
      answer: "69 AD"
    boni:
      - question: "Who was the first of them?"
        answer: "GALBA"
      - question: "What dynasty was begun with the last of them?"
        answer: "FLAVIAN"
  - tossup:
      question: "What is the Latin word for 100?"
      answer: "CENTUM"
    boni:
      - question: "What is twenty?"
        answer: "VIGINTI"
      - question: "What is the ordinal of centum?"
        answer: "CENTESIMUS or CENTENSIMUS"
  - tossup:
      question: "."
      answer: "Using spondeo, translate “I have answered.” SPOPONDI"
    boni:
      - question: "."
        answer: "Using posco, translate “I have demanded.” POPOSCI"
      - question: "What type of perfect are these?"
        answer: "REDUPLICATED"
  - tossup:
      question: "Who said, 'I see in him many a Marius“?"
      answer: "SULLA"
    boni:
      - question: "Of whom was he speaking?"
        answer: "JULIUS CAESAR"
      - question: "Where did Caesar say ”Alea iacta est“?"
        answer: "AT THE RUBICON"
  - tossup:
      question: "5615 When Rome declared war or made peace, what priests performed the necessary rites?"
      answer: "THE FETIALES"
    boni:
      - question: "who was the priest of Jupiter?"
        answer: "FLAMEN DIALIS"
      - question: "How was the Pontifex Maximus chosen after the beginning of the Empire?"
        answer: "IT WAS ALWAYS THE EMPEROR HIMSELF."
  - tossup:
      question: "7678 What important author was born in Arpinum?"
      answer: "CICERO"
    boni:
      - question: "When was he born?"
        answer: "106 BC"
      - question: "When was he killed?"
        answer: "43 BC"
  - tossup:
      question: "444 What is the Latin verb meaning ”to learn“?"
      answer: "DISCERE (or COGNOSCERE)"
    boni:
      - question: "What is the perfect active infinitive of discere?"
        answer: "DIDICISSE"
      - question: "."
        answer: "Translate the English: ”We must learn these things.“"
      - question: "."
        answer: "HAEC NOBIS DISCENDA SUNT. or HAEC DISCERE DEBEMUS. or HAEC NOS DISCERE OPORTET."
  - tossup:
      question: "2959 What was unusual about the two sons of Molione?"
      answer: "THEY WERE SIAMESE TWINS"
    boni:
      - question: "What were their names?"
        answer: "EURYTUS AND CTEATUS"
      - question: "Whom did they kill?"
        answer: "IPHICLES (and Dameon)"
  - tossup:
      question: "7686 Who was the author of the Ars Poetica?"
      answer: "HORACE"
    boni:
      - question: "By what other title is it known?"
        answer: "THE EPISTLE TO THE PISOS"
      - question: "In what meter is it written?"
        answer: "DACTYLIC HEXAMETER"
  - tossup:
      question: "2704 What nymph was almost killed by her own son, who mistook her for a wild bear?"
      answer: "CALLISTO"
    boni:
      - question: "Who accidentally killed his wife Procris by hurling a spear into a clumb of bushes?"
        answer: "CEPHALUS"
      - question: "What lover of Jupiter foolishly asked to see him in his full glory, thus causing her own destruction?"
        answer: "SEMELE"
  - tossup:
      question: "."
      answer: "2580 Name the three-headed dog of the underworld. CERBERUS"
    boni:
      - question: "."
        answer: "Name the area of the underworld where evil souls were tormented. TARTARUS"
      - question: "."
        answer: "Name the area of the underworld where good souls spent eternity in bliss. THE ELYSIAN FIELDS"
  - tossup:
      question: "2950 Who was the mother of Aesculapius?"
      answer: "CORONIS"
    boni:
      - question: "Who was his father?"
        answer: "APOLLO"
      - question: "What was Aesculapius' field of expertise?"
        answer: "MEDICINE"
  - tossup:
      question: "400 What is the superlative of acer?"
      answer: "ACERRIMUS"
    boni:
      - question: "What is the superlative of aeger?"
        answer: "AEGERRIMUS"
      - question: "What is the superlative of similis?"
        answer: "SIMILLIMUS"
  - tossup:
      question: "739 Of what type of verb is odi an example?"
      answer: "DEFECTIVE"
    boni:
      - question: "."
        answer: "Using it, say ”I used to hate.“ ODERAM"
      - question: "."
        answer: "Say ”I will hate.“ ODERO"
      - question: "."
        answer: "#"