tournament: "NJCL Certamen"
year: 1984
division: "Advanced"
round: "Finals"
questions:

  - tossup:
      question: "Which of the following is neither descended from nor cognate to a Latin noun: linen, wool, flannel, cotton?"
      answer: "COTTON"
    boni:
      - question: "The Roman city of Nimausus is now the French city of Nimes; what fabric tells us that it came from there?"
        answer: "DENIM"
      - question: "What fabric has an English name which is derived from the Greek word for Chinese?"
        answer: "SILK"
  - tossup:
      question: "To what island did Augustus exile his daughter Julia?"
      answer: "PANDATARIA"
    boni:
      - question: "What member of the imperial family was banished to the island of Trimerus?"
        answer: "JULIA, DAUGHTER OF JULIA AND AGRIPPA"
      - question: "Why did Augustus disinherit and banish Agrippa Postumus?"
        answer: "“DEPRAVED AND CONTUMACIOUS CHARACHTER” (OCD) - IMMORALITY"
      - question: "."
        answer: "signature"
  - tossup:
      question: "What Greek author wrote works on hunting, estate management, cavalry command and the philosophy of Socrates, but is best known for his Anabasis?"
      answer: "XENOPHON"
    boni:
      - question: "For ten points, what two titles did Xenophon and Plato both use?"
        answer: "All four works are concerned with Socrates. THE SYMPOSIUM AND THE APOLOGY"
  - tossup:
      question: "Aulus Hirtius completed with an eighth book Julius Caesar's commentaries on the war in Gaul. What is the name of the work, probably by Hirtius, which continues Caesar's work on the Civil War?"
      answer: "BELLUM ALEXANDRINUM"
    boni:
      - question: "What work, perhaps edited by Hirtius but certainly not written by him, is a sequel to the Bellum Alexandrinum?"
        answer: "BELLUM AFRICUM"
      - question: "What work, again not by Hirtius, describes Caesar's last campaign through the Battle of Munda?"
        answer: "BELLUM HISPANIENSE"
      - question: "."
        answer: "signature"
  - tossup:
      question: "."
      answer: "Translate into the nominative the phrase “both poems.” AMBO"
    boni:
      - question: "."
        answer: "Put the phrase “both nights” into the genitive. AMBARUM NOCTIUM"
      - question: "."
        answer: "Put the phrase “both daughters” into the ablative. AMBABUS FILIABUS"
  - tossup:
      question: "To what class do fourth-conjugation verbs ending in -urio belong?"
      answer: "DESIDERATIVES"
    boni:
      - question: "What does esurio mean?"
        answer: "TO BE HUNGRY"
      - question: "What does parturio mean?"
        answer: "TO BE IN LABOR"
  - tossup:
      question: "Who were the doctors for the Greek forces at Troy?"
      answer: "MACHAON AND PODALIRIUS"
    boni:
      - question: "Who was their father?"
        answer: "ASCLEPIUS"
      - question: "Who was the principal Greek seer at Troy?"
        answer: "CALCHAS"
  - tossup:
      question: "Latin names, even more than our own, usually had some connection to common nouns, and their owners, as we are were subject to good-natured or bad-natured puns. What is the meaning of the common noun scipio?"
      answer: "WALKING-STICK, CANE"
    boni:
      - question: "Whose name came from the noun meaning chickpea?"
        answer: "CICERO'S"
      - question: "What do we call that which the Romans called the Vergiliae?"
        answer: "THE PLEIADES"
  - tossup:
      question: "What is the present infinitive of the defective verb queo?"
      answer: "QUIRE"
    boni:
      - question: "What is its perfect infinitive?"
        answer: "QUISSE"
      - question: "What is the present infinitive of prosum?"
        answer: "PRODESSE"
      - question: "."
        answer: "signature"
      - question: "."
        answer: "signature"
  - tossup:
      question: "."
      answer: "Distinguish in meaning between these two fourth-conjugation verbs: operio and opperior. OPERIO=COVER, OPPERIOR=AWAIT"
    boni:
      - question: "."
        answer: "Distinguish between sperno and sterno. SPERNO=SHUN, STERNO=STREW, LAY LOW"
      - question: "."
        answer: "Distinguish between liquor liqui and liqueo liquere. LIQUOR=MELT (INTRANSITIVE), LIQUEO=MELT (TRANSITIVE)"
  - tossup:
      question: "Venus is described at one point in the Aeneid as nuda genu. What poetic construction is Vergil using?"
      answer: "ACCUSATIVE OF RESPECT"
    boni:
      - question: "Book II begins with the words Conticuere omnes. How would this verb be expressed in prose?"
        answer: "CONTICUERUNT"
      - question: "The second line of the poem says Aeneas was the first to come Italiam. How would that be expressed in good prose?"
        answer: "IN ITALIAM or perhaps AD ITALIAM"
  - tossup:
      question: "What seer, brought to Ithaca by Telemachus, foretold the suitors' deaths but was ignored by them?"
      answer: "THEOCLYMENUS"
    boni:
      - question: "What famous seer was Theoclymenus' ancestor?"
        answer: "MELAMPUS"
      - question: "Where had Telemachus brought Theoclymenus from?"
        answer: "PYLOS"
  - tossup:
      question: "."
      answer: "Translate this sentence which uses a subjunctive clause:"
    boni:
      - question: "."
        answer: "Ignorabam cur imperator me vocavisset."
      - question: "."
        answer: "I DIDN'T KNOW WHY THE EMPEROR HAD CALLED ME."
      - question: "."
        answer: "Translate these sentences:"
      - question: "."
        answer: "Militibus persuadeamus ut nobis parcamus."
      - question: "."
        answer: "LET'S PERSUADE THE SOLDIERS TO SPARE US."
      - question: "."
        answer: "Nisi cucurrissem, nunc non adessem."
      - question: "."
        answer: "IF I HADN'T RUN, I WOULDN'T BE HERE NOW."
  - tossup:
      question: "."
      answer: "You are a tourist visiting Rome in 82 AD to see the new Colosseum. Having taken an early-morning tour of the beautiful monument, you walk through the Forum to the Arx on the Capitoline. Name all the arches you see on the way. NONE"
    boni:
      - question: "On the Capitoline you eat lunch with lots of garum and walk down the hill to the Via Lata. You begin a long walk to visit the Tomb of Augustus. As you pass the Campus Agrippae on your right, with the Campus Martius coming up on your right, what triumphal arch carrying an aqueduct do you walk under?"
        answer: "THE ARCH OF CLAUDIUS"
      - question: "Before you get to Augustus' tomb, what does the Via Lata become?"
        answer: "THE VIA FLAMINIA"
  - tossup:
      question: "What genre of Roman literature was pioneered by men named C. Acilius, Cincius Alimatus, Postumius Albinus and Fabius Pictor?"
      answer: "HISTORY"
    boni:
      - question: "How many of them wrote in Greek?"
        answer: "ALL OF THEM"
      - question: "Who was the first Roman historian to write in Latin?"
        answer: "CATO THE CENSOR"
  - tossup:
      question: "According to Ovid, who was changed into a weasel by Lucina?"
      answer: "GALANTHIS"
    boni:
      - question: "What two figures in Greek mythology had their deaths commemorated by the hyacinth?"
        answer: "HYACINTHUS AND AJAX"
      - question: "Into what did Bacchus transform the daughters of King Minyas?"
        answer: "BATS"
  - tossup:
      question: "What is the significance to Vergil of this set of ~~numbers~~: 830; 2188; 12,913?"
      answer: "THE NUMBER OF LINES IN HIS ~~WORKS~~, IN ORDER"
    boni:
      - question: "In all of Homer dactyls outnumber spondees 68% to 32%. In all of Vergil, do ~~dactyls outnumber spondees~~ or vice versa?"
        answer: "SPONDEES OUTNUMBER DACTYLS"
      - question: "What are the percentages for all of Vergil?"
        answer: "SPONDEES 56%, DACTYLS 44%"
  - tossup:
      question: "5045 To whom were the Romans allied by the Foedus Cassianum in 493 BC?"
      answer: "THE LATIN LEAGUE"
    boni:
      - question: "The alliance deteriorated and eventually Rome fought the Latins and Volscians in the Great Latin War; it lasted from 340 to 338 BC. Who was the great Roman hero of that war?"
        answer: "TITUS MANLIUS TORQUATUS"
      - question: "Whom did Torquatus once have executed for disobeying orders and dueling with an enemy of Rome?"
        answer: "HIS OWN SON"
  - tossup:
      question: "5451 ~~What many emperors were there in 193 AD?"
      answer: "~~ THREE"
    boni:
      - question: "~~What was the year of the four emperors in the second century AD?"
        answer: "193 AD~~"
      - question: "In order, who were the ~~four~~ 3?"
        answer: "COMMODUS, PERTINAX, DIDIUS JULIANUS, SEPTIMIUS SEVERUS"
      - question: "Which of them became emperor by buying the empire at an auction staged by the Pretorian Guard?"
        answer: "DIDIUS JULIANUS"
  - tossup:
      question: "2788 Who stole the cattle of Sisyphus?"
      answer: "AUTOLYCUS"
    boni:
      - question: "Who was Autolycus' famous grandson?"
        answer: "ODYSSEUS"
      - question: "During a visit to Autolycus, Odysseus received a scar by which he was recognized after the Trojan War. How did he get the scar?"
        answer: "HE WAS GASHED BY A BOAR"
  - tossup:
      question: "The story of what famous couple appears in the fourth book of Georgics?"
      answer: "Orpheus & Eurydice"
    boni:
      - question: "What couple's story is found in Apuleius' “Golden Ass”?"
        answer: "Cupid & Psyche"
      - question: "What couple's wedding is recounted by Catullus?"
        answer: "Peleus & Thetis"
  - tossup:
      question: "With what latin noun is wool cognate?"
      answer: "<u>vellus</u>"
    boni:
      - question: "With what L. noun is flannel cognate?"
        answer: "<u>lana</u>"
