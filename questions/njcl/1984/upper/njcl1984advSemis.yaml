tournament: "NJCL Certamen"
year: 1984
division: "Advanced"
round: "Semifinals"
questions:

  - tossup:
      question: "What is the perfect passive participle of fodio?"
      answer: "FOSSUS"
    boni:
      - question: "What is the perfect passive participle of sancio?"
        answer: "SANCTUS"
      - question: "...of gero?"
        answer: "GESTUS"
  - tossup:
      question: "What omen at Aulis told Calchas that the Trojan War would last at least nine years?"
      answer: "A SNAKE CRAWLED OUT FROM UNDER THE ALTAR AND ATE A SPARROW AND HER EIGHT BABIES"
    boni:
      - question: "What had Agamemnon done to persuade Calchas to join the Greek army?"
        answer: "HE HAD BUILT A TEMPLE TO ARTEMIS, WHOSE PRIEST CALCHAS WAS."
      - question: "What seer told the Greeks that Troy would not fall until they had rescued Philoctetes?"
        answer: "HELENUS"
  - tossup:
      question: "What 2 rivers bounded Cispadane Gaul?"
      answer: "THE AREA BETWEEN THE RIVERS PO AND RUBICON"
    boni:
      - question: "What is the modern name for the Gallic city of Massilia?"
        answer: "MARSEILLES"
      - question: "...for Lugdunum?"
        answer: "LYON"
  - tossup:
      question: "According to Ovid, how did Caesar's soul appear to the world?"
      answer: "STAR/COMET"
    boni:
      - question: "In what work of Ovid is this stated?"
        answer: "THE METAMORPHOSES"
      - question: "In what book of the Metamorphoses?"
        answer: "FIFTEEN"
  - tossup:
      question: "Who in the Aeneid is given the epithet fidus?"
      answer: "ACHATES"
    boni:
      - question: "Who speaks the words dux femina facti?"
        answer: "(THE DISGUISED) VENUS"
      - question: "Who says Rex erat Aeneas nobis?"
        answer: "ILIONEUS"
  - tossup:
      question: "What deity did Cassiopeia anger by boasting of her daughter's beauty?"
      answer: "POSEIDON (or THE NEREIDS)"
    boni:
      - question: "What deity did Medusa offend?"
        answer: "ATHENA"
      - question: "Who out of jealousy turned Scylla into a horrible monster?"
        answer: "CIRCE"
  - tossup:
      question: "What is the comparative degree of malus?"
      answer: "PEIOR"
    boni:
      - question: "What is the fourth principal part of tollo?"
        answer: "SUBLATUS"
      - question: "What preposition is used with the ablative of agent?"
        answer: "NONE"
  - tossup:
      question: "With what Greek comedy is the term ”Cloudcuckooland“ associated?"
      answer: "THE BIRDS"
    boni:
      - question: "Who wrote it?"
        answer: "ARISTOPHANES"
      - question: "To what subdivision of Greek comedy does he belong?"
        answer: "OLD COMEDY"
  - tossup:
      question: "."
      answer: "Translate into English: Eamus Romam hac aestate. LET'S GO TO ROME THIS SUMMER."
    boni:
      - question: "."
        answer: "Change ”this summer“ to ”this spring.“ HOC VERE"
      - question: "."
        answer: "Change ”to Rome“ to ”to Greece.“ IN (not AD!) GRAECIAM"
  - tossup:
      question: "Who was the author of the Historia Naturalis?"
      answer: "PLINY THE ELDER"
    boni:
      - question: "Of what genre are almost all of his nephew's extant works?"
        answer: "LETTERS"
      - question: "What is both Plinies' hometown?"
        answer: "COMUM (in norther Italy)"
  - tossup:
      question: "What sort of words are Aeneadae, Heraclidae and Atridae?"
      answer: "PATRONYMICS”"
    boni:
      - question: "What sort of verbs are licet, oportet and paenitet?"
        answer: "IMPERSONAL"
      - question: "What English word for “prison” comes from paenitet?"
        answer: "PENITENTIARY"
  - tossup:
      question: "What Roman room comes from a Latin adjective meaning “black” because of its smoke-blackened walls?"
      answer: "ATRIUM"
    boni:
      - question: "What feature of the triclinium gives it its name?"
        answer: "THREE COUCHES"
      - question: "~~What was a Roman house's entrance hall?"
        answer: "THE FAUCES~~"
  - tossup:
      question: "What was a Roman baby called until given a praenomen?"
      answer: "PUPUS (PUPA)"
    boni:
      - question: "When was a male baby named?"
        answer: "THE NINTH DAY OF LIFE"
      - question: "What was the name of every male's individual guardian spirit?"
        answer: "GENIUS"
  - tossup:
      question: "."
      answer: "Give in Latin the date for the celebration of Halloween. PRIDIE KALENDAS NOVEMBRES"
    boni:
      - question: "."
        answer: "Give in Latin the date of our Independence Day. A.D. IV NONAS IULIAS (ANTE DIEM QUARTUM...)"
      - question: "."
        answer: "Give in Latin the date for April Fool's Day. KALENDIS APRILIBUS (KALENDAE APRILES)"
  - tossup:
      question: "What case expresses time when?"
      answer: "ABLATIVE"
    boni:
      - question: "What case shows time within which?"
        answer: "ABLATIVE"
      - question: "What case shows duration of time?"
        answer: "ACCUSATIVE"
  - tossup:
      question: "If someone gave you a codex, what would you do with it?"
      answer: "READ IT"
    boni:
      - question: "What would you do with a pomum?"
        answer: "EAT IT"
      - question: "What would you do with a mucinium?"
        answer: "BLOW YOUR NOSE"
  - tossup:
      question: "How is Alcmena related to Danae?"
      answer: "GREAT-GRANDDAUGHTER"
    boni:
      - question: "What brothers were enemies even in the womb?"
        answer: "ACRISIUS AND PROETUS"
      - question: "Who was their father?"
        answer: "ABAS"
  - tossup:
      question: "Who was the muse of history?"
      answer: "CLIO"
    boni:
      - question: "Who was the muse of love poetry?"
        answer: "ERATO"
      - question: "Who was the muse of epic poetry?"
        answer: "CALLIOPE"
  - tossup:
      question: "When were the standards lost in the Battle of Carrhae in 53 BC regained?"
      answer: "20 BC"
    boni:
      - question: "By force or by diplomacy?"
        answer: "BY DIPLOMACY"
      - question: "Who headed the embassy that recovered them?"
        answer: "TIBERIUS AND AUGUSTUS"
  - tossup:
      question: "What Numidian king led a revolt in 111 BC?"
      answer: "JUGURTHA"
    boni:
      - question: "Who was the king of Numidia during the Second Punic War?"
        answer: "MASINISSA"
      - question: "Who accepted Jugurtha's surrender?"
        answer: "SULLA"
      - question: "If you are standing in a middle of peristyle, what is a Latin name for a thing directly over your head?"
        answer: "CAELUM, SOL, NUBES, AER, LUNA, STELLA, etc."
      - question: "."
        answer: "#"