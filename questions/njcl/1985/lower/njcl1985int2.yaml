      question: "2783 What was the first task imposed on Psyche by Venus?"
      answer: "SORTING GRAIN"
    boni:
      - question: "How is it done for her?"
        answer: "ANTS DO IT"
      - question: "What was her last task?"
        answer: "FETCHING SOME OF PROSERPINA'S BEAUTY"
      - question: "XIX 5163 What is carried on a viaduct?"
