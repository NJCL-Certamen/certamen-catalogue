      question: "699 What did a latro do for a living?"
      answer: "HE STOLE"
    boni:
      - question: "What occupation was a pistor?"
        answer: "BAKER"
      - question: "A lanius?"
        answer: "BUTCHER, MEAT VENDOR"
  - tossup:
      question: "5115 Over which bridge did the Via Flaminia cross the Tiber?"
      answer: "PONS MULVIUS"
    boni:
      - question: "What was the first stone bridge on the Tiber?"
        answer: "PONS AEMILIUS"
      - question: "What early Roman patriot defended a bridge until it could be cut down?"
        answer: "HORATIUS"
  - tossup:
