      - question: "What verb is the root of “supersede”?"
        answer: "SEDEO"
      - question: "Which two of the following words have the same root: consensus, censorious, descend, senseless?"
        answer: "CONSENSUS, SENSELESS"
  - tossup:
      question: "."
      answer: "What ablative usage is contained in this sentence: Omnes milites mecum profecti sunt. ACCOMPANIMENT"
    boni:
      - question: "."
        answer: "In these:"
      - question: "."
        answer: "Orationem magno studio habuit. MANNER"
      - question: "."
        answer: "Miles gladio usus est. SPECIAL VERB"
  - tossup:
      question: "What tense of the subjunctive is formed on the present active infinitive?"
      answer: "IMPERFECT handwritten number 798"
    boni:
      - question: "What is the third person singular active inperfect subjunctive of condo?"
        answer: "CONDERET"
      - question: "What is the second person plural passive imperfect subjunctive of mitto?"
