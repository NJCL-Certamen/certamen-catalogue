        answer: "THE FIRST PUNIC WAR"
      - question: "What Roman won the Battle of the Aegates Islands and thereby the whole war?"
        answer: "(C. LUTATIUS) CATULUS"
  - tossup:
      question: "."
      answer: "Translate into Latin: “I have come to see the games.” VENI UT LUDOS VIDEREM or VENI AD LUDOS VIDENDOS or VENI LUDORUM VIDENDORUM CAUSA/GRATIA or VENI LUDOS VISUM"
    boni:
      - question: "."
        answer: "Translate “I persuaded my friend to come with me.” AMICO PERSUASI UT MECUM VENIRET."
      - question: "."
        answer: "Translate “We will have to watch the games carefully.” LUDI NOBIS DILIGENTER (or CUM CURA) SPECTANDI ERUNT."
  - tossup:
      question: "Which of the following does not come from cedo: antecedent, success, secession, supersede?"
      answer: "SUPERSEDE"
