      - question: "* Of what words is vendere a contraction?"
        answer: "VENUM and DARE"
      - question: "* What words contract to a verb meaning “to be for sale”?"
        answer: "VENUM & IRE"
      - question: "."
        answer: "*"
  - tossup:
      question: "Who am I?"
      answer: "Cupid's lead arrow wounded me, but then his gold arrow struck Apollo who fell in love with me. DAPHNE"
    boni:
      - question: "* What was Daphne changed into?"
        answer: "LAUREL"
      - question: "* What gift did Apollo give those who won his favor?"
        answer: "LAUREL WREATH"
      - question: "."
        answer: "*"
  - tossup:
      question: "Who slew the Chimaera?"
      answer: "BELLEROPHON"
    boni:
      - question: "."
        answer: "* Spell C H I M A E R A."
      - question: "."
        answer: "* Spell B E L L E R P H O N."
      - question: "."
        answer: "*"
  - tossup:
      question: "Who made new armor for Achilles?"
      answer: "HEPHAESTUS"
    boni:
      - question: "* Who had died wearing Achilles' old armor?"
        answer: "PATROCLUS"
      - question: "* What did Hephaestus later make for Achilles?"
        answer: "A GOLDEN FUNERARY URN"
      - question: "."
        answer: "*"
  - tossup:
      question: "What disastrous defeat did the Romans suffer in 321 BC?"
      answer: "THE BATTLE OF THE CAUDINE FORKS"
