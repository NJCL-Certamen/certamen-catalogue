    boni:
      - question: "What is the ablative singular?"
        answer: "VI"
      - question: "What is the accusative singular of prex?"
        answer: "PRECEM"
  - tossup:
      question: "What is the Latin word for “today”?"
      answer: "HODIE"
    boni:
      - question: "For “tomorrow”?"
        answer: "CRAS"
      - question: "What English verb comes from cras?"
        answer: "PROCRASTINATE"
  - tossup:
      question: "."
      answer: "Name a first declension masculine noun. POETA, PIRATA, AGRICOLA, NAUTA, AURIGA, INCOLA, etc."
    boni:
      - question: "."
        answer: "Give the dative singular of the phrase “good sailor.” NAUTAE BONO"
      - question: "."
        answer: "Give the dative plural of the phrase “beatiful goddess.” DEABUS PULCHRIS"
  - tossup:
      question: "In the late Republic, what party represented the interests of the wealthy?"
      answer: "THE OPTIMATES"
    boni:
      - question: "What was the opposition party?"
        answer: "POPULARES"
      - question: "To which did Julius Caesar belong?"
        answer: "POPULARES"
  - tossup:
      question: "."
      answer: "Say in Latin: “I have touched.” TETIGI"
    boni:
      - question: "."
        answer: "Say: “I had been touched.” TACTUS ERAM"
      - question: "."
        answer: "Say: “I shall be touched.” TANGAR"
  - tossup:
      question: "What was the Roman army's largest unit?"
      answer: "THE LEGION"
    boni:
      - question: "Into how many cohorts was a legion divided?"
        answer: "TEN"
      - question: "How many men was a legion supposed to contain?"
        answer: "6000"
  - tossup:
      question: "What English verb meaning “improve” comes from the comparative of bonus?"
      answer: "MELIORATE (or AMELIORATE)"
    boni:
      - question: "What is the superlative of acer?"
        answer: "ACERRIMUS"
      - question: "What is the superlative of agilis?"
