      - question: "* Quot linguae tibi sunt?"
        answer: "UNA"
      - question: "* Quot labia tibi sunt?"
        answer: "DUO"
      - question: "."
        answer: "*"
  - tossup:
      question: "What is the vocative of Caesar?"
      answer: "CAESAR"
