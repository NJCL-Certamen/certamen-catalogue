      - question: "* What war was in progress?"
        answer: "THE SECOND SAMNITE WAR"
      - question: "* How many Samnite Wars were there?"
        answer: "THREE"
      - question: "."
        answer: "*"
  - tossup:
      question: "Who was the father of Zeus?"
      answer: "CRONUS"
    boni:
      - question: "* Who was the mother of Zeus?"
        answer: "RHEA"
      - question: "* What Relation to Zeus was Rhea besides mother?"
        answer: "MOTHER-IN-LAW/AUNT"
      - question: "."
        answer: "*"
  - tossup:
      question: "What baby did Hera try to kill by sending two serpents to attack him in his crib?"
      answer: "HERACLES"
    boni:
      - question: "* Who was Heracles' mortal half-brother?"
        answer: "IPHICLES"
      - question: "* Who instructed Heracles in music?"
        answer: "LINUS"
      - question: "."
        answer: "*"
  - tossup:
      question: "What Latin verb is the root of the English noun “verdict”?"
      answer: "DICO"
    boni:
      - question: "* What Latin noun lies at the root of “perjury”?"
        answer: "IUS"
      - question: "* What is the Latin noun which means “judge”?"
        answer: "IUDEX"
      - question: "."
        answer: "-12"
  - tossup:
      question: "Who was Rome's first king?"
      answer: "ROMULUS"
    boni:
      - question: "Who was her last king?"
        answer: "TARQUINIUS SUPERBUS"
      - question: "How many kings were there?"
        answer: "SEVEN"
  - tossup:
      question: "What leader of the pretorian guard usurped the power of the emperor Tiberius?"
      answer: "SEJANUS"
    boni:
      - question: "Where had Tiberius retreated?"
        answer: "CAPRI"
      - question: "During Tiberius' reign, what practice caused the execution of many prominent and wealthy Romans?"
        answer: "INFORMING - INFORMERS WERE REWARDED WITH PART OF THE ACCUSED'S ESTATE (also MAIESTAS)"
  - tossup:
      question: "What is the accusative singular of vis?"
