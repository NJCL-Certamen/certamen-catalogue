      - question: "7703 Although it is usually called the Pharsalia, what is its more proper title?"
        answer: "BELLUM CIVILE"
      - question: "What is its number of books?"
        answer: "TEN"
  - tossup:
      question: "."
      answer: "Translate this sentence: ne pugnemus. LET'S NOT FIGHT"
    boni:
      - question: "."
        answer: "65 Translate: “I know why you're here.” SCIO CUR ADSIS/-TIS"
      - question: "."
        answer: "Translate: “I know why you have come.” SCIO CUR VENERIS/-TIS"
  - tossup:
      question: "What is the syntax of O tempora O mores?"
      answer: "ACCUSATIVE OF EXCLAMATION"
