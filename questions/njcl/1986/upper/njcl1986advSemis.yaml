      - question: "B1 Being ambitious men, what else did they ask?"
        answer: "WHO WOULD RULE ROME NEXT"
      - question: "B2 What answer did the oracle give?"
        answer: "WHOEVER KISSED HIS MOTHER FIRST"
  - tossup:
