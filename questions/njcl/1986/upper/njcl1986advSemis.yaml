      - question: "2524 What son of Aeacus was Achilles' father?"
        answer: "PELEUS"
      - question: "Who killed Achilles?"
        answer: "PARIS (WITH APOLLO'S HELP)"
  - tossup:
      question: "How was the next emperor selected after the assassination of Domitian?"
      answer: "BY THE SENATE"
