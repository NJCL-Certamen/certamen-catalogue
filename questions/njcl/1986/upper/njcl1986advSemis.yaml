      - question: "320 What is the case of animis in Tantaene animis caelestibus irae?"
        answer: "DATIVE"
      - question: "What Latin verb is the root of the word “dative”?"
        answer: "DO, DARE"
  - tossup:
      question: "What king's name has become an English adjective for a victory too costly to be worthwhile?"
      answer: "PYRRHUS"
    boni:
      - question: "5052 Where was Pyrrhus king?"
        answer: "EPIRUS"
      - question: "Where is Epirus?"
        answer: "NW GREECE, WEST OF MACEDONIA"
  - tossup:
      question: "."
      answer: "Say in Latin: “the same animals.” EADEM ANIMALIA"
    boni:
      - question: "."
        answer: "890 Say “three thousand animals.” TRIA MILIA ANIMALIUM"
      - question: "."
        answer: "Say “one thousand animals.” MILLE ANIMALIA"
