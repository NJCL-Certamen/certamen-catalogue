        answer: "PHINEUS"
      - question: "At whose wedding did Eris hurl her famous apple?"
        answer: "THE WEDDING OF PELEUS AND THETIS"
  - tossup:
      question: "."
      answer: "Give the Latin and the English for R."
  - tossup:
      question: "."
      answer: "P."
