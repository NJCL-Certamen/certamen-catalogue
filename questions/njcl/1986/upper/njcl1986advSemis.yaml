      - question: "."
        answer: "REQUIESCAT IN PACE - MAY HE REST IN PEACE"
      - question: "."
        answer: "175 Give the Latin and the English for Q.E.D."
      - question: "."
        answer: "QUOD ERAT DEMONSTRANDUM - THAT WHICH HAD TO BE PROVED"
      - question: "."
        answer: "Give the Latin and the English for cf."
      - question: "."
        answer: "CONFER - COMPARE"
