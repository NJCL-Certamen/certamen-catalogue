      - question: "How did the Romans combat them?"
        answer: "SCARED THEM WITH FIERY MISSILES"
  - tossup:
      question: "Because the Romans' origins were agricultural, the words for “money” is related to the word for “herd.” What are they?"
      answer: "PECUNIA and PECUS"
