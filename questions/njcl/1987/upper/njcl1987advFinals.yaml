tournament: "NJCL Certamen"
year: 1987
division: "Advanced"
round: "Finals"
questions:

  - tossup:
      question: "What god had a naiad mistress named Menthe?"
      answer: "HADES"
    boni:
      - question: "3222 What was her punishment from a jealous Persephone?"
        answer: "SHE WAS CRUSHED UNDER HER FEET"
      - question: "What was her metamorphosis?"
        answer: "SHE BECAME THE HERB MINT - THE MORE IT IS CRUSHED, THE SWEETER IT SMELLS"
  - tossup:
      question: "Probably within a few hours of Edison's invention of the phonograph came the invention of lip syncing. What is the meaning of the Greek noun of which only the initial consonant remains in “sync”?"
      answer: "TIME"
    boni:
      - question: "Edison's wax cylinders have evolved into today's sophisticated stereo systems. What is the meaning of the Greek root of “stereo”?"
        answer: "SOLID (i.e., three-dimensional)"
      - question: "If you're really up to date, you use a compact disk player. The Latin participle <u>compactus</u> can be a form of <u>compaciscor</u>, but in this case it is from what other verb?"
        answer: "COMPANGO"
  - tossup:
      question: "."
      answer: "Using a prose alternative to the supine, say: a task easy to do. OPUS FACILE AD FACIENDUM"
    boni:
      - question: "Which of the two constructions could have an object?"
        answer: "THE GERUND(-IVE)"
      - question: "What is the poetic alternative to the supine and the gerund?"
        answer: "THE INFINITIVE"
  - tossup:
      question: "What does the nymph Hesperia have in common with Eurydice?"
      answer: "DEATH BY SNAKEBITE"
    boni:
      - question: "."
        answer: "Hesperia"
      - question: "What son of Priam was pursuing her when she was bitten?"
        answer: "AESACUS"
      - question: "What was Aesacus' fate?"
        answer: "GUILTILY HURLING HIMSELF OFF A CLIFF INTO THE SEA, HE WAS TURNED BY TETHYS INTO A DIVING SEABIRD"
  - tossup:
      question: "Where would a Roman keep his piper?"
      answer: "THE KITCHEN"
    boni:
      - question: "Where would he keep his <u>iumentum</u>?"
        answer: "THE BARN OR STABLE"
      - question: "Where would he keep his <u>fibula</u>?"
        answer: "BUREAU, JEWELRY BOX"
  - tossup:
      question: "What kind of defective words are diptotes?"
      answer: "NOUNS EXISTING IN ONLY TWO CASES"
    boni:
      - question: "What kind of nouns are heteroclites?"
        answer: "NOUNS VARYING IN DECLENSION (e.g., domus)"
      - question: "What is the term for nouns inconsistent in gender?"
        answer: "HETEROGENEOUS"
  - tossup:
      question: "."
      answer: "Hellen was the eponymous progenitor of the Hellenic peoples."
    boni:
      - question: "Who was his father?"
        answer: "DEUCALION"
      - question: "What nymph bore Hellen three sons?"
        answer: "ORSEIS"
      - question: "Who were they?"
        answer: "AEOLUS, XUTHUS, DORUS"
  - tossup:
      question: "Quintilian praised a Roman tragedy, the <u>Medea</u>, by a Roman poet not known for writing tragedy; thus its loss is all the more frustrating to us. Who wrote this lost <u>Medea</u>?"
      answer: "OVID"
    boni:
      - question: "What Roman tragedian wrote a <u>Medea</u>?"
        answer: "SENECA"
      - question: "What earlier tragedian did Cicero consider Rome's greatest?"
        answer: "PACUVIUS"
      - question: "."
        answer: "-34"
      - question: "."
        answer: "1987 CERTAMEN"
      - question: "."
        answer: "ROUND A100"
      - question: "."
        answer: "page 2"
  - tossup:
      question: "."
      answer: "Address your teammates and with one word say, “Let's have lunch.” PRANDEAMUS"
    boni:
      - question: "."
        answer: "Say: I hate fish; I want to eat chicken."
      - question: "."
        answer: "PISCEM ODI; PULLUM EDERE VOLO."
      - question: "."
        answer: "Say: Forget chicken; we have to have pizza."
      - question: "."
        answer: "OBLIVISCERE PULLI; PIZZA NOBIS HABENDA EST."
  - tossup:
      question: "What Greek historian was an eyewitness to the fall of both Carthage and Corinth?"
      answer: "POLYBIUS"
    boni:
      - question: "What accounts for his initial journey to Italy?"
        answer: "HE WENT AS A HOSTAGE AFTER THE WAR WITH MACEDON"
      - question: "To what important Roman's sons did he become tutor?"
        answer: "L. AEMILIUS PAULLUS'"
  - tossup:
      question: "What battle in 105 BC was Rome's most disastrous defeat since Cannae?"
      answer: "THE BATTLE OF ARAUSIO"
    boni:
      - question: "Who defeated the Romans at Arausio?"
        answer: "THE CIMBRI AND TEUTONES"
      - question: "Who were the losing Roman commanders?"
        answer: "Q. SERVILIUS CAEPIO AND CN. MALLIUS MAXIMUS"
  - tossup:
      question: "Which of the following word pairs does NOT represent two words from the same Latin root: seance/session, mortar/mortgage, ancestor/antecedent, trance/transit?"
      answer: "MORTAR/MORTGAGE"
    boni:
      - question: "What noun is the ultimate root of mortgage?"
        answer: "MORS"
      - question: "."
        answer: "Which of these is not from the same root as the others:"
      - question: "mordent, morsel, remorse, mortar?"
        answer: "MORTAR"
  - tossup:
      question: "."
      answer: "Name the two brothers who led the Roman forces in Spain against the Carthaginians from 217 to 211 BC."
    boni:
      - question: "."
        answer: "PUBLIUS AND GNAEUS SCIPIO"
      - question: "."
        answer: "Name the two Carthaginian brothers whom these Scipios fought. MAGO AND HASDRUBAL"
      - question: "Who later defeated both Mago and Hasdrubal?"
        answer: "P. CORNELIUS SCIPIO (AFRICANUS)"
  - tossup:
      question: "How do you translate the idiom infitias ire?"
      answer: "DENY"
    boni:
      - question: "The idiom verba dare?"
        answer: "DECEIVE, PRETEND, MISLEAD"
      - question: "The idiom in sententiam ire?"
        answer: "VOTE FOR, ACCEDE TO"
  - tossup:
      question: "."
      answer: "Name the usurper who in c290 AD proclaimed himself emperor of Britain. CARAUSIUS"
    boni:
      - question: "Who assassinated Carausius in 293/4 AD?"
        answer: "ALLECTUS"
      - question: "Who defeated and killed Allectus?"
        answer: "CONSTANTIUS I (CHLORUS)"
  - tossup:
      question: "What oration represents Cicero's first law case?"
      answer: "PRO QUINCTIO (81 BC)"
    boni:
      - question: "What case came next?"
        answer: "PRO ROSCIO AMERINO"
      - question: "What political figure's administration was cast in a poor light by the Roscius case?"
        answer: "SULLA'S"
  - tossup:
      question: "What king of Thebe in Asia Minor was Hector's father-in-law?"
      answer: "EETION"
    boni:
      - question: "What Greek warrior slew him?"
        answer: "ACHILLES"
      - question: "How many sons died with him?"
        answer: "ALL SEVEN"
  - tossup:
      question: "."
      answer: "What first-century AD poet, a great observer of human nature, said: Hominem pagina nostra sapit. MARTIAL"
    boni:
      - question: "What great first-century BC poet did Martial acknowledge as his master in the epigram form?"
        answer: "CATULLUS"
      - question: "What poet was mentioned by Martial alone of his contemporaries?"
        answer: "JUVENAL"
  - tossup:
      question: "What son of a triumvir formed a conspiracy against Augustus in 30 BC?"
      answer: "M. AEMILIUS LEPIDUS"
    boni:
      - question: "Who led a conspiracy against Augustus in 23 BC?"
        answer: "FANNIUS CAEPIO"
      - question: "Who led a conspiracy against Augustus in 19 BC?"
        answer: "M. EGNATIUS RUFUS"
  - tossup:
      question: "In Roman comedy you find many colloquial expressions. What is the expanded form of the contraction vin? VISNE? Of sis?"
      answer: "SI VIS"
    boni:
      - question: "OF ain? AISNE?"
        answer: "-36"