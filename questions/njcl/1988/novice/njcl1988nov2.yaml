      - question: "906 In a famous prophecy, In hoc signo vinces, what tense is vinces?"
        answer: "FUTURE"
      - question: "In the blessing Pax vobiscum, what construction is vobiscum?"
        answer: "ABLATIVE OF ACCOMPANIMENT"
