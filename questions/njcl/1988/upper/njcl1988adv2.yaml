      - question: "7556 What historian was personally encouraged by Augustus?"
        answer: "LIVY"
      - question: "Who was the literary patron of Tibullus?"
        answer: "(VALERIUS) MESSALA CORVINUS"
  - tossup:
      question: "Who in the Aeneid says: Durate et vosmet rebus servate secundis?"
      answer: "AENEAS"
