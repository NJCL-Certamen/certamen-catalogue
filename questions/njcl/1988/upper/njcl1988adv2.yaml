      - question: "7585 Who is the emperor?"
        answer: "CLAUDIUS"
      - question: "What is the name of the satire?"
        answer: "APOCOLOCYNTOSIS"
  - tossup:
      question: "During the reign of Nero, what ruler of the Parthian Empire put his own brother on the throne of Armenia?"
      answer: "VOLOGESES"
    boni:
      - question: "5875 Who was the brother?"
        answer: "TIRIDATES"
      - question: "In what year did Nero symbolically crown Tiridates in Rome?"
        answer: "66AD"
  - tossup:
      question: ""
      answer: "Name the three major poets who benefited from the patronage of Maecenas. VERGIL, HORACE, PROPERTIUS"
