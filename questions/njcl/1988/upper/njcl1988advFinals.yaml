tournament: "NJCL Certamen"
year: 1988
division: "Advanced"
round: "Finals"
questions:
  - tossup:
      question: "Victor over the Volsci, this hero named Gnaeus Marcius later joined his former enemies to march against Rome. By what name is he better known?"
      answer: "CORIOLANUS"
    boni:
      - question: "5871 What compassionate act had he opposed before leaving Rome?"
        answer: "GIVING OUT GRAIN TO THE STARVING PLEBS"
      - question: "When he marched on Rome at the head of the Volscian army, what women persuaded him to desist?"
        answer: "HIS MOTHER (VETURIA) AND WIFE (VOLUMNIA) or vice-versa"
  - tossup:
      question: "What part of your body lies hidden within the name of your VCR?"
      answer: "HEART"
    boni:
      - question: "1107 If you're old-fashioned, you still get your TV signal through an antenna on your roof. What does the Latin word antenna mean?"
        answer: "SHIP'S YARD (HORIZONTAL PART OF THE MAST)"
      - question: "If you're up to date, you get your signal from cable. What Latin noun, from what Latin verb, does ”cable“ come from?"
        answer: "CAPULUM (”LASSO“), FROM CAPIO"
  - tossup:
      question: "What emperor was born M. Annius Verus?"
      answer: "MARCUS AURELIUS"
    boni:
      - question: "5837 What emperor nicknamed him Verissimus?"
        answer: "HADRIAN"
      - question: "What emperor adopted him as M. Aelius Aurelius Verus Caesar?"
        answer: "ANTONINUS PIUS (in 138AD)"
  - tossup:
      question: "On what occasion might a poet write a genethliacon?"
      answer: "FOR SOMEONE'S BIRTHDAY"
    boni:
      - question: "7766 An epithalamion?"
        answer: "A WEDDING"
      - question: "A propempticon?"
        answer: "A GOING-AWAY"
  - tossup:
      question: "Who was the goddess of magic and witchcraft?"
      answer: "HECATE"
    boni:
      - question: "3267 According to Hesiod, who was her father?"
        answer: "COEUS"
      - question: "Who was her mother?"
        answer: "PHOEBE"
  - tossup:
      question: "Which poem by Vergil is called ”messianic“ and predicts the birth of a child whose rule will lead mankind into a new Golden Age?"
      answer: "ECLOGUE IV"
    boni:
      - question: "7705 What Greek poet was Vergil's model for most of the Eclogues, but not the fourth or the sixth?"
        answer: "THEOCRITUS"
      - question: ""
        answer: "Vergil in the first line of the Fourth Eclogue addresses Muses which he describes with Theocritus' birthplace. He separates himself from his Greek forebear by telling them he wants now to sing ”greater themes“ than he had been versifying."
      - question: "What was Theocritus' birthplace?"
        answer: "SICILY"
      - question: ""
        answer: "SICELIDES MUSAE, PAULO MAIORA CANAMUS"
  - tossup:
      question: ""
      answer: "Tene nasum vicini tui. PLAYER SHOULD HOLD TEAMMATE'S NOSE."
    boni:
      - question: ""
        answer: "1088 Surge et monstra mihi aurem sinistram. PLAYER SHOULD RISE AND POINT TO HIS LEFT EAR."
      - question: ""
        answer: "Surgite. omnes, et amplectimini. WHOLE TEAM SHOULD RISE AND HUG EACH OTHER."
  - tossup:
      question: "What was the Greek term for the Greek city which had established a colony?"
      answer: "METROPOLIS"
    boni:
      - question: "5902 What does that mean?"
        answer: "MOTHER-CITY"
      - question: "What was Tarentum's metropolis?"
        answer: "SPARTA"
  - tossup:
      question: "To what body part does ”pulmonary“ refer?"
      answer: "LUNGS"
    boni:
      - question: "1066 Corona means <emphasis>crown</emphasis>, but what part of the body is meant by ”coronary“?"
        answer: "HEART"
      - question: "The capillaries are part of the bloodstream, but named for what, to which someone saw a resemblance?"
        answer: "HAIR"
  - tossup:
      question: "Which is not a fourth-declension noun: vultus, metus, vetus, situs?"
      answer: "VETUS"
    boni:
      - question: "1077 What is vetus?"
        answer: "THIRD-DECLENSION ADJECTIVE"
      - question: "What is the genitive singular of the phrase vultus vetus?"
        answer: "VULTŪS VETERIS"
  - tossup:
      question: "What does Heracles' name mean?"
      answer: "GLORY OF HERA"
    boni:
      - question: "What does Hippodamia mean?"
        answer: "TAMER OF HORSES"
      - question: "What does Neoptolemus mean?"
        answer: "NEW WARRIOR"
  - tossup:
      question: "What son did Penelope bear Odysseus after his return?"
      answer: "PTOLIPORTHES (ACUSILAUS)"
    boni:
      - question: "3286 Whom did Penelope marry after Odysseus' death?"
        answer: "TELEGONUS"
      - question: "Whom did Telemachus marry?"
        answer: "CIRCE"
  - tossup:
      question: "What tense is vellem?"
      answer: "IMPERFECT"
    boni:
      - question: "1080 What tense is vellam?"
        answer: "PRESENT (SUBJ. or FUT. IND.)"
      - question: "What tense is velim?"
        answer: "PRESENT"
  - tossup:
      question: "Hissarlik doesn't have much of a ring to it; what ancient city stood in a place now called by that name?"
      answer: "TROY"
    boni:
      - question: "5854 How many Troys did Schliemann count in his archeological stack of pancakes?"
        answer: "NINE"
      - question: "Which one was Homer's Troy?"
        answer: "7A (accept 7)"
  - tossup:
      question: ""
      answer: "Distinguish between erga and ergo. ERGA=TOWARD, ERGO=THEREFORE"
    boni:
      - question: ""
        answer: "1085 Distinguish between ero and erro. ERO=I'LL BE, ERRO=I WANDER, I ERR"
      - question: ""
        answer: "Distinguish between uro and iuro. URO=I BURN, IURO=I SWEAR"
  - tossup:
      question: "What Jewish writer of the first century AD wrote a history of Rome's war with the Jews?"
      answer: "JOSEPHUS"
    boni:
      - question: "7771 In what language did he write the Bellum Judaicum?"
        answer: "ARAMAIC"
      - question: "In what language does it survive?"
        answer: "GREEK"
  - tossup:
      question: "In a Christian church, what is the abbreviation IHS for?"
      answer: "IN HOC SIGNO Iesus Hominum Salvator"
    boni:
      - question: "1108 What is the meaning of what looks like X P?"
        answer: "CHI RHO - FIRST TWO GREEK LETTERS OF CHRIST'S NAME"
      - question: ""
        answer: "In depictions of the Crucifixion, a sign often seen over Christ's head reads I N R"
  - tossup:
      question: "What Latin does that stand for?"
      answer: "IESUS NAZARENUS REX IUDAEORUM"
    boni:
      []
  - tossup:
      question: "What two Latin authors used the title De viris illustribus?"
      answer: "CORNELIUS NEPOS AND SUETONIUS"
    boni:
      - question: "7821 Which one wrote earlier?"
        answer: "NEPOS"
      - question: "Which one's work was limited to literary men?"
        answer: "SUETONIUS'"
  - tossup:
      question: "3283 What son of Minos drowned in a vat of honey?"
      answer: "GLAUCUS"
    boni:
      - question: "What seer restored Glaucus to life?"
        answer: "POLYIDUS"
      - question: "What omen showed Polyidus where to find Glaucus' body?"
        answer: "AN OWL (glaux) BEING BESET BY BEES AT THE STOREROOM DOOR"
  - tossup:
      question: "1067 What anagram of pirata is a verb meaning ”may he seize“?"
      answer: "RAPIAT"
    boni:
      - question: "What other anagram of pirata means ”may she give birth“?"
        answer: "PARIAT"
      - question: ""
        answer: "What anagram pair means ”on the side“ and ”may he crawl“"
      - question: ""
        answer: "PARTE and REPAT"
      - question: ""
        answer: "-78"
