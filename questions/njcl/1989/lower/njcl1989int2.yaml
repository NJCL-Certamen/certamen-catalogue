    boni:
      - question: "."
        answer: "Give another singular for nobis. ME"
      - question: "."
        answer: "Give another plural for me. NOS"
  - tossup:
      question: "."
      answer: "1121 What would be the Latin verb in this English sentence:"
    boni:
      - question: "."
        answer: "“All day long yesterday it was raining.” PLUEBAT"
      - question: "."
        answer: "“It will rain tomorrow.” PLUET"
      - question: "."
        answer: "“The crops need the water; let it rain all day.” PLUAT"
  - tossup:
      question: "."
      answer: "1013 In the sentence “She herself saw him,” say “him.” EUM"
    boni:
      - question: "."
        answer: "In the sentence “She herself saw him,” say “herself.” IPSA"
      - question: "."
        answer: "In the sentence “She saw herself,” say “herself.” SE"
