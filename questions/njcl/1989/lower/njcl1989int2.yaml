  - tossup:
      question: "What villain in mythology was known as the “club-bearer”?"
      answer: "3217 PERIPHETES/CORYNETES"
    boni:
      - question: "Who was called the “stretcher”?"
        answer: "PROCRUSTES/DAMASTES/POLYPEMON"
      - question: "Who was known as the “pine-bender”?"
        answer: "SINIS/PITYOCAMPTES"
  - tossup:
      question: "864 What case expresses time when?"
      answer: "ABLATIVE"
    boni:
      - question: "What case shows time within which?"
        answer: "ABLATIVE"
      - question: "What case shows duration of time?"
        answer: "ACCUSATIVE"
  - tossup:
      question: "6017 Who was Caesar's favorite lieutenant in Gaul, who later fought against him in the Civil War?"
      answer: "T. LABIENUS"
    boni:
      - question: "What associate of Caesar finished his work on the Gallic campaign?"
        answer: "AULUS HIRTIUS"
      - question: "In what battle, the last of Caesar's career, did Labienus die?"
        answer: "MUNDA (45 BC)"
