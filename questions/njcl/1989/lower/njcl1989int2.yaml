tournament: "NJCL Certamen"
year: 1989
division: "Intermediate"
round: "Round 2"
questions:

  - tossup:
      question: "What construction requiring the subjunctive is required in this sentence: “Tell me where you've been.”"
      answer: "INDIRECT QUESTION"
    boni:
      - question: "What construction requiring the subjunctive is required in this sentence: “I think the man who just left is a doctor.”"
        answer: "RELATIVE (SUBORDINATE) CLAUSE WITHIN INDIRECT STATEMENT"
      - question: "What construction requiring the subjunctive is required in this sentence: “We're going to the aquarium to see the dolphins.”"
        answer: "PURPOSE CLAUSE"
  - tossup:
      question: "Supply and translate the Latin noun at the root of the English adjective “lachrymose.”"
      answer: "LACRIMA = TEAR"
    boni:
      - question: "Supply and translate the Latin verb at the root of the English noun “lavatory.”"
        answer: "LAVO = WASH"
      - question: "Supply and translate the Latin verb at the root of the English noun “laboratory.”"
        answer: "LABORO = WORK"
  - tossup:
      question: "What was the name of Aphrodite's magic garment?"
      answer: "CESTUS"
    boni:
      - question: "What was Zeus' shield?"
        answer: "AEGIS"
      - question: "What were Hermes' sandals?"
        answer: "TALARIA"
  - tossup:
      question: "Who was Rome's second king?"
      answer: "NUMA POMPILIUS"
    boni:
      - question: "How many kings did Rome have?"
        answer: "SEVEN"
      - question: "Who was last?"
        answer: "TARQUINIUS SUPERBUS"
  - tossup:
      question: "1176 What is the meaning of the idiom consilium capere?"
      answer: "ADOPT A PLAN"
    boni:
      - question: "The idiom poenam dare?"
        answer: "PAY THE PENALTY, SUFFER THE PUNISHMENT"
      - question: "The idiom certiorem facere?"
        answer: "INFORM"
  - tossup:
      question: "5910 Who was Rome's second emperor?"
      answer: "TIBERIUS"
    boni:
      - question: "What dynasty was he part of?"
        answer: "JULIO-CLAUDIAN"
      - question: "To whom was Tiberius' mother married for 52 years?"
        answer: "AUGUSTUS"
  - tossup:
      question: "5952 From the beginning of the first to the end of the last, what are the years of the Punic Wars?"
      answer: "264 - 146 BC"
    boni:
      - question: "Which was ended by the Battle of Zama?"
        answer: "THE SECOND"
      - question: "Which gave Rome possession of Sicily?"
        answer: "THE FIRST"
