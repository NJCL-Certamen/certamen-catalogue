      - question: "What is the port of Athens?"
        answer: "PIRAEUS"
      - question: "Of what region is Thebes the principal city?"
        answer: "BOEOTIA"
  - tossup:
      question: "."
      answer: "Name a Latin ordinal number which is used as a praenomen. 5960 QUINTUS, SEXTUS, SEPTIMUS, DECIMUS"
    boni:
      - question: "."
        answer: "Name two which aren't. PRIMUS, SECUNDUS, TERTIUS, QUARTUS, OCTAVUS, NONUS, UNDECIMUS ETC."
  - tossup:
      question: "."
      answer: "Translate into Latin: “Let them be willing.” VELINT 862"
