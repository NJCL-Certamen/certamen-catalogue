      answer: "ANTIGONE"
    boni:
      - question: "What was the method of execution?"
        answer: "SHE WAS BURIED ALIVE (ENTOMBED)"
      - question: "How did she die?"
        answer: "SHE HANGED HERSELF IN THE TOMB"
