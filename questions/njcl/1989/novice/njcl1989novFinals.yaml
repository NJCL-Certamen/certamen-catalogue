  - tossup:
      question: "5942 What fortified plateau on the shore of the Dead Sea is a symbol of Jews' resistance to oppression?"
      answer: "MASADA"
    boni:
      - question: "."
        answer: "During a revolt in 66 AD, Jewish zealots captured the fortress."
      - question: "When did a Roman army retake it?"
        answer: "73 AD"
      - question: "After that six-month siege in 73, what Roman commander retook Masada?"
        answer: "FLAVIUS SILVA (Peter O'Toole)"
  - tossup:
      question: "1211 What do you know from Latin when you read that someone was decapitated?"
      answer: "THAT HE WAS BEHEADED"
    boni:
      - question: "What do you know when someone was defenestrated?"
        answer: "THAT HE WAS THROWN OUT A WINDOW"
      - question: "When something was regurgitated?"
        answer: "SPEWED UP FROM/THROUGH THE THROAT"
  - tossup:
