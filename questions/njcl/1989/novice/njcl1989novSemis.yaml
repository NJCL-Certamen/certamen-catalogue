tournament: "NJCL Certamen"
year: 1989
division: "Novice"
round: "Semifinals"
questions:

  - tossup:
      question: "What is the name given to the race of men sprung from ants on the 3415 island of Aegina?"
      answer: "MYRMIDONS"
    boni:
      - question: "What king watched over this transformation?"
        answer: "AEACUS"
      - question: "Who commanded an army of Myrmidons at Troy?"
        answer: "ACHILLES"
  - tossup:
      question: "To what god did Augustus Caesar dedicate his forum in 2 BC?"
      answer: "6046 MARS ULTOR"
    boni:
      - question: "Where had he made the pledge to build this forum?"
        answer: "PHILIPPI"
      - question: "What forum was dedicated by Julius Caesar in 46 BC?"
        answer: "THE FORUM JULIUM (or FORUM CAESARIS)"
  - tossup:
      question: "What is the first person singular future active indicative of 1185 scribo?"
      answer: "SCRIBAM"
    boni:
      - question: "Of canto?"
        answer: "CANTABO"
      - question: "Of scio?"
        answer: "SCIAM (SCIBO is found in Plautus)"
  - tossup:
      question: "What was the name of the grain supply in ancient Rome?"
      answer: "5986 ANNONA (or RES FRUMENTARIA)"
    boni:
      - question: "What officials were in charge of it during the last centuries of the Republic?"
        answer: "THE AEDILES"
      - question: "What official was created to maintain it during the time of Augustus?"
        answer: "THE PRAEFECTUS ANNONAE"
  - tossup:
      question: "Who was the wife of Romulus?"
      answer: "HERSILIA"
    boni:
      - question: "What tribe was she from?"
        answer: "SABINES"
      - question: "When she was deified, what was her new name?"
        answer: "HORA (HORA QUIRINI)"
  - tossup:
      question: "What king was torn to pieces by his mother and her sisters while 3433 they were under the influence of Bacchus?"
      answer: "PENTHEUS"
    boni:
      - question: "Who was his mother?"
        answer: "AGAVE"
      - question: "Their cruelty to whom was avenged by this carnage?"
        answer: "THEIR SISTER SEMELE"
  - tossup:
      question: "."
      answer: "Define the verb munire. FORTIFY, BUILD (A ROAD)"
    boni:
      - question: "."
        answer: "Define punire. PUNISH"
      - question: "."
        answer: "Define unire. UNITE, UNIFY"
      - question: "."
        answer: "-138"
  - tossup:
      question: "898 Quem sonum facit vacca?"
      answer: "MOO"
    boni:
      - question: "Quem sonum facit ovis?"
        answer: "BAA"
      - question: "Quem sonum facit porcus?"
        answer: "OINK"
  - tossup:
      question: "1021 What does **superabit** mean?"
      answer: "HE/SHE WILL CONQUER"
    boni:
      - question: "What does **persuaserant** mean?"
        answer: "THEY HAD PERSUADED"
      - question: "What does **docebamini** mean?"
        answer: "Y'ALL WERE (BEING) TAUGHT"
  - tossup:
      question: "1030 What Latin adjective gives us the noun “ingratitude”?"
      answer: "GRATUS"
    boni:
      - question: "What Latin pronoun gives us the noun “egotist”?"
        answer: "EGO"
      - question: "What Latin noun gives us the verb “exaggerate”?"
        answer: "AGGER"
  - tossup:
      question: "955 What is the present infinitive of the verb eo?"
      answer: "IRE"
    boni:
      - question: "What is the perfect infinitive?"
        answer: "IISSE or IVISSE or ISSE"
      - question: "What is the future infinitive?"
        answer: "ITURUS ESSE"
  - tossup:
      question: "976 What is the meaning of the Latin noun sagitta?"
      answer: "ARROW"
    boni:
      - question: "Of the noun arcus?"
        answer: "BOW"
      - question: "Of the noun pilum?"
        answer: "SPEAR, JAVELIN"
  - tossup:
      question: "848 Based on derivation, which is the unrelated word: anniversary, versatile, divergent, irreversible?"
      answer: "DIVERGENT"
    boni:
      - question: "Which is the unrelated word: vociferous, ferocious, collate, conifer?"
        answer: "FEROCIOUS"
      - question: "Which is the unrelated word: constant, obstacle, stable, stoical?"
        answer: "STOICAL"
  - tossup:
      question: "."
      answer: "1074 Make **ducite** singular. DUC"
    boni:
      - question: "."
        answer: "Make **regite** singular. REGE"
      - question: "."
        answer: "Make **facite** singular. FAC"
  - tossup:
      question: "5911 What gladiator led thousands of slaves against the Romans from 73 to 71 BC?"
      answer: "SPARTACUS"
    boni:
      - question: "They camped on the slopes of what mountain near Naples?"
        answer: "VESUVIUS"
      - question: "What was the punishment for those not killed in battle?"
        answer: "CRUCIFIXION (ALONG THE APPIAN WAY)"
  - tossup:
      question: "1076 What preposition goes with the dative of agent?"
      answer: "NONE"
    boni:
      - question: "."
        answer: "-139"
      - question: "With the ablative of agent?"
        answer: "A/AB"
      - question: "With the ablative of means?"
        answer: "NONE"
  - tossup:
      question: "What Roman woman is famous for swimming the Tiber?"
      answer: "CLOELIA"
    boni:
      - question: "."
        answer: "6027"
      - question: "What Roman free woman was killed by her father to prevent her rape by Appius Claudius?"
        answer: "VERGINIA"
      - question: "Who betrayed her city to the Sabines and was thrown from the rock which now bears her name?"
        answer: "TARPEIA"
  - tossup:
      question: "What creature's blood made Heracles' arrows poisonous?"
      answer: "THE HYDRA'S"
    boni:
      - question: "."
        answer: "3349"
      - question: "Whose blood made Heracles' robe fatal to him?"
        answer: "THE CENTAUR NESSUS'"
      - question: "Whom did the dying Nessus deceive into dipping the robe in his blood?"
        answer: "HERACLES' WIFE DEIANEIRA"
  - tossup:
      question: "The sight of what caused Aegeus to throw himself into the sea?"
      answer: "SAILS OF THE WRONG COLOR (BLACK)"
    boni:
      - question: "."
        answer: "3359"
      - question: "What did the sails erroneously indicate to Aegeus?"
        answer: "THAT THESEUS WAS DEAD"
      - question: "What success was Theseus returning from?"
        answer: "KILLING THE MINOTAUR"
  - tossup:
      question: "What was the name of the river of forgetfulness?"
      answer: "LETHE"
    boni:
      - question: "."
        answer: "3410"
      - question: "What is the name of the section of torments in the underworld?"
        answer: "TARTARUS"
      - question: "What is the pleasant section of the underworld?"
        answer: "THE ELYSIAN FIELDS (ELYSIUM)"