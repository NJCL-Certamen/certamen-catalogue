tournament: "NJCL Certamen"
year: 1989
division: "Advanced"
round: "Finals"
questions:

  - tossup:
      question: "735 What Latin word used in scholarly English writing is abbreviated sc?"
      answer: "SCILICET"
    boni:
      - question: "Of what is scilicet a contraction?"
        answer: "SCIRE LICET"
      - question: "What is the abbreviation for videlicet?"
        answer: "VIZ."
  - tossup:
      question: "3384 What water nymph witnessed Persephone's abduction, but melted from weeping before she could tell Demeter?"
      answer: "CYANE"
    boni:
      - question: "What dark goddess first told Demeter some of the story?"
        answer: "HECATE"
      - question: "What god did Hecate refer Demeter to for the rest?"
        answer: "HELIOS"
  - tossup:
      question: "3385 Around whose pre-existing heart did the baby Dionysus form?"
      answer: "ZAGREUS'"
    boni:
      - question: "Who was Zagreus' mother, pregnant by Zeus?"
        answer: "PERSEPHONE"
      - question: "Who were the killers of Zagreus?"
        answer: "THE TITANS"
  - tossup:
      question: "7840 What title is given to the collection of poems ascribed by ancient editors to Vergil?"
      answer: "APPENDIX VERGILIANA"
    boni:
      - question: "Which poem is about an insect?"
        answer: "THE CULEX"
      - question: "Which is about a farmer's breakfast?"
        answer: "MORETUM"
  - tossup:
      question: "1201 What order is a Roman giving you if he says the name of the Caribbean's largest island?"
      answer: "LIE DOWN, RECLINE"
    boni:
      - question: "What English derivative of that same verb means a mistress or courtesan?"
        answer: "CONCUBINE"
      - question: "What Latin noun for a part of the body comes from the same root?"
        answer: "CUBITUS = ELBOW"
  - tossup:
      question: "3401 Who was the first widow in mythology to remarry?"
      answer: "GORGOPHONE"
    boni:
      - question: "Who was her first husband?"
        answer: "PERIERES"
      - question: "Who was her second?"
        answer: "OEBALUS"
  - tossup:
      question: "."
      answer: "1106 Distinguish by part of speech between veteris and veteris."
    boni:
      - question: "."
        answer: "VETERIS = ADJECTIVE VETERIS = VERB"
      - question: "."
        answer: "Give the principal parts of the verb. VETO, VETARE, VETUI, VETITUS"
      - question: "."
        answer: "Give the adjective in all three degrees."
      - question: "."
        answer: "VETUS, VETUSTIOR, VETERRIMUS (VETUSTISSIMUS)"
      - question: "."
        answer: "-111"
  - tossup:
      question: "5922 What emperor is forever denigrated by a Roman historian's perceptive remark: “In everyone's opinion capable of ruling - except that he ruled”?"
      answer: "GALBA"
    boni:
      - question: "Who wrote that?"
        answer: "TACITUS"
      - question: "What legate of Gallia Lugdunensis persuaded Galba to let himself be elevated by parts of the army?"
        answer: "VINDEX"
  - tossup:
      question: "5937 To what city did Tarquinius Superbus first flee upon his expulsion from Rome?"
      answer: "CAERE"
    boni:
      - question: "What son-in-law of Tarquinius led the Latins against the Romans at the Battle of Lake Regillus?"
        answer: "MAMILIUS OCTAVIUS"
      - question: "What tyrant of Cumae provided Tarquinius' last asylum?"
        answer: "ARISTODEMUS"
  - tossup:
      question: "1195 A famous mythological character could be described as luscus. What does that mean?"
      answer: "ONE-EYED"
    boni:
      - question: "What does fuscus mean?"
        answer: "TAWNY, SWARTHY"
      - question: "What does Tuscus mean?"
        answer: "TUSCAN, ETRUSCAN"
  - tossup:
      question: "."
      answer: "5936 Name an emperor who visited Britain during his reign. CONSTANS, SEPTIMIUS SEVERUS, CLAUDIUS, HADRIAN, CONSTANTIUS CHLORUS, CONSTANTINE"
    boni:
      - question: "."
        answer: "Name another."
      - question: "."
        answer: "Name another."
  - tossup:
      question: "7819 In honor of a work commissioned by the Sibylline Books, what temple was in 207 BC set aside for writers and actors to meet and make dedications?"
      answer: "THE TEMPLE OF MINERVA (ON THE AVENTINE)"
    boni:
      - question: "Who was the author of this work?"
        answer: "LIVIUS ANDRONICUS"
      - question: "In what genre had he already distinguished himself?"
        answer: "DRAMA (TRAGEDY)"
  - tossup:
      question: "1189 What Latin word is the basic root of the English word “germ”?"
      answer: "GIGNO"
    boni:
      - question: "What Latin noun formed from gigno is the closer root of “germ”?"
        answer: "GERMEN, GERMINIS N"
      - question: "What English adjective meaning “kin” or “pertinent” has the same root?"
        answer: "GERMANE"
  - tossup:
      question: "."
      answer: "1186 Translate the English prepositional phrase into proper Latin: “The soldiers carried their provisions with them.” SECUM"
    boni:
      - question: "."
        answer: "Translate “him”: “Caesar ordered his soldiers to obey him.” SIBI"
      - question: "What verb would follow if that Latin sentence began: Caesar militibus...?"
        answer: "IMPERAVIT"
      - question: "."
        answer: "-112"
  - tossup:
      question: "3441 Who were the Argo's crew members endowed with the powers of prophecy?"
      answer: "IDMON AND MOPSUS"
    boni:
      - question: "What kind of animal killed Idmon?"
        answer: "A BOAR"
      - question: "What kind of animal killed Mopsus?"
        answer: "A SNAKE"
  - tossup:
      question: "1171 What tense of sum's subjunctive is the alternate form forem?"
      answer: "IMPERFECT"
    boni:
      - question: "What tense of the subjunctive is fuat?"
        answer: "PRESENT"
      - question: "What tense of the indicative is escunt?"
        answer: "FUTURE"
  - tossup:
      question: "7820 What Roman scholar of the Augustan period wrote several important reference works, including perhaps Rome's first dictionary, entitled De significatu verborum?"
      answer: "VERRIUS FLACCUS"
    boni:
      - question: "What service did he perform in the imperial household?"
        answer: "TUTOR TO AUGUSTUS' GRANDCHILDREN"
      - question: "What writer of the previous generation, author of De lingua latina in 25 books, authored at least 55 works and edited at least 490?"
        answer: "VARRO (MARCUS TERENTIUS VARRO)"
  - tossup:
      question: "7822 What nephew of Aristotle accompanied Alexander as his expedition's historian?"
      answer: "CALLISTHENES"
    boni:
      - question: "How did Callisthenes meet his death in 327 BC?"
        answer: "EXECUTED FOR ALLEGED CONSPIRACY AGAINST ALEXANDER"
      - question: "Whom did he cite as Alexander's father?"
        answer: "ZEUS"
