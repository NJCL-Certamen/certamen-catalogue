tournament: "NJCL Certamen"
year: 1990
division: "Novice"
round: "Round 2"
questions:

  - tossup:
      question: "Who was the wife of Hector?"
      answer: "ANDROMACHE"
    boni:
      - question: "Who was his son?"
        answer: "ASTYANAX"
      - question: "Who was his father?"
        answer: "PRIAM"
  - tossup:
      question: "Who was the mother of Romulus and Remus?"
      answer: "RHEA SILVIA / ILIA"
    boni:
      - question: "Who was Rhea Silvia's father?"
        answer: "NUMITOR"
      - question: "Who was Numitor's evil brother?"
        answer: "AMULIUS"
  - tossup:
      question: "Whose warning saved the Romans from total disaster when the city was attacked by the Gauls in 390 BC?"
      answer: "THE SACRED GEESE"
    boni:
      - question: "Who was the leader of the Gauls?"
        answer: "BRENNUS"
      - question: "Who was the Roman hero of the Capitoline?"
        answer: "MARCUS MANLIUS (CAPITOLINUS)"
  - tossup:
      question: "Translate the idiom <latin>iter facere</latin>."
      answer: "MAKE / TAKE A JOURNEY"
    boni:
      - question: "Translate <latin>orationem habere</latin>."
        answer: "MAKE / GIVE / DELIVER A SPEECH"
      - question: "Translate <latin>viam munire</latin>."
        answer: "BUILD A ROAD"
  - tossup:
      question: "Translate the verb form <latin>audeo</latin>."
      answer: "I DARE"
    boni:
      - question: "Translate <latin>audio</latin>."
        answer: "I HEAR"
      - question: "Translate <latin>augeo</latin>."
        answer: "I ENLARGE, INCREASE"
  - tossup:
      question: "Neptune was the Roman god of what domain?"
      answer: "THE SEA"
    boni:
      - question: "What land animal was sacred to him?"
        answer: "THE HORSE"
      - question: "Who was his wife?"
        answer: "AMPHITRITE"
  - tossup:
      question: "Who had the <latin>Ara Pacis</latin> built?"
      answer: "| AUGUSTUS ALTAR OF PEACE CAMPUS MARTIUS |"
    boni:
      - question: "What does <latin>Ara Pacis</latin> mean?"
        answer: "ALTAR OF PEACE"
      - question: "In what section of the city was it built?"
        answer: "CAMPUS MARTIUS"
  - tossup:
      question: "What is the Latin word for ”time“?"
      answer: "<latin>TEMPUS</latin>"
    boni:
      - question: "What is its gender?"
        answer: "NEUTER"
      - question: "Its declension?"
        answer: "THIRD"
  - tossup:
      question: "Who was transformed into a laurel?"
      answer: "DAPHNE"
    boni:
      - question: "Who became an anemone?"
        answer: "ADONIS"
      - question: "What couple became an oak and a linden?"
        answer: "BAUCIS = LINDEN / LIME, PHILEMON = OAK"
  - tossup:
      question: "What tense in Latin expresses time prior to another definite time in the past?"
      answer: "PLUPERFECT"
    boni:
      - question: "Give the Latin for ”I had seen.“"
        answer: "<latin>VIDERAM</latin>"
      - question: "Give the Latin for ”I had been seen.“"
        answer: "<latin>VISUS ERAM</latin>"
  - tossup:
      question: "Complete this analogy: The <latin>toga virilis</latin> was to a man as the ____ was to a boy."
      answer: "<latin>TOGA PRAETEXTA</latin>"
    boni:
      - question: "Who wore a <latin>toga candida</latin>?"
        answer: "A CANDIDATE FOR OFFICE"
      - question: "Who wore a <latin>tunica angusti clavi</latin>?"
        answer: "A KNIGHT / <latin>EQUES</latin>"
  - tossup:
      question: "Who offered Death her own life in place of that of her husband?"
      answer: "ALCESTIS"
    boni:
      - question: "Who was her husband?"
        answer: "ADMETUS"
      - question: "Who wrestled Death and saved Alcestis?"
        answer: "HERACLES / HERCULES"
  - tossup:
      question: "Which of these nouns does not have the ending <latin>-bus</latin> in the dative plural: <latin>corpus, filia, vis, liber, tempus</latin>?"
      answer: "<latin>LIBER</latin>"
    boni:
      - question: "What is the dative plural of <latin>liber</latin>?"
        answer: "<latin>LIBRIS</latin>"
      - question: "What is the dative plural of <latin>filia</latin>?"
        answer: "<latin>FILIABUS</latin>"
  - tossup:
      question: "Which of the following forms is not in the accusative case: <latin>quae, id, eas, illi, ipsa</latin>?"
      answer: "<latin>ILLI</latin>"
    boni:
      - question: "What two cases can the form <latin>illi</latin> be?"
        answer: "NOMINATIVE AND DATIVE"
      - question: "What cases can the form <latin>quibus</latin> be?"
        answer: "DATIVE AND ABLATIVE"
  - tossup:
      question: "From what Latin noun is the English adjective ”partial“ derived?"
      answer: "<latin>PARS</latin>"
    boni:
      - question: "The adjective ”facial“?"
        answer: "<latin>FACIES</latin>"
      - question: "The adjective ”cereal“?"
        answer: "<latin>CERES</latin>"
  - tossup:
      question: "In the sentence, ”He lived in the city of Rome,“ say ”in the city.“"
      answer: "<latin>IN URBE</latin>"
    boni:
      - question: "In the sentence, ”He walked into the city of Rome,“ say ”into the city.“"
        answer: "<latin>IN URBEM</latin>"
      - question: "In that same sentence, say ”of Rome.“"
        answer: "<latin>ROMAM</latin>"
  - tossup:
      question: "Caesar tells us he said <latin>Alea iacta est</latin> after crossing what river?"
      answer: "RUBICON"
    boni:
      - question: "What was the year?"
        answer: "49 BC"
      - question: "What action on January 1 had precipitated Caesar's boldness?"
        answer: "THE SENATE ORDERED HIM TO RELINQUISH HIS COMMAND"
  - tossup:
      question: "In what year was the Battle of the Mulvian Bridge?"
      answer: "312 AD"
    boni:
      - question: "Who was the victor?"
        answer: "CONSTANTINE I / THE GREAT"
      - question: "Over whose forces?"
        answer: "MAXENTIUS'"
  - tossup:
      question: "What determines the number and gender of a relative pronoun?"
      answer: "THE ANTECEDENT"
    boni:
      - question: "What determines the case?"
        answer: "USE WITHIN ITS OWN CLAUSE"
      - question: "Give the Latin words and their meanings from which we get the word ”antecedent.“"
        answer: "<latin>ANTE</latin> - BEFORE, <latin>CEDO</latin> - GO"
  - tossup:
      question: "Give the Latin noun and its meaning from which is derived the English adjective ”infinite.“"
      answer: "<latin>FINIS</latin> - END, LIMIT, BOUNDARY"
    boni:
      - question: "Do the same for ”feat.“"
        answer: "<latin>FACIO</latin> - DO, MAKE"
      - question: "What Latin verb, with its meaning, is the root of the English adjective ”frail“?"
        answer: "<latin>FRANGO</latin> - BREAK"
  - tossup:
      question: "With what part of the body does one produce a manuscript?"
      answer: "THE HAND"
    boni:
      - question: "Based on its Latin root, with what part of the body does one impede an event?"
        answer: "THE FOOT"
      - question: "According to its Latin root, where in your body do you record information?"
        answer: "THE HEART"
  - tossup:
      question: "What is the Latin word for ”today“?"
      answer: "<latin>HODIE</latin>"
    boni:
      - question: "What is the Latin word for ”yesterday“?"
        answer: "<latin>HERI</latin>"
      - question: "Of what two Latin words is <latin>hodie</latin> a contraction?"
        answer: "<latin>HOC DIE</latin>"
  - tossup:
      question: "Odysseus returned to Ithaca after how many years of absence?"
      answer: "TWENTY"
    boni:
      - question: "Who was his mother, dead before his return?"
        answer: "ANTICLEIA"
      - question: "Who was the faithful farmhand who helped him to annihilate the suitors?"
        answer: "EUMAEUS"
  - tossup:
      question: "How would a Roman say, ”She has seen me“?"
      answer: "<latin>ME VIDIT</latin>"
    boni:
      - question: "How would he say, ”I will see her“?"
        answer: "<latin>EAM VIDEBO</latin>"
      - question: "How would he say, ”The girls have been seen by the boys“?"
        answer: "<latin>PUELLAE A PUERIS VISAE SUNT</latin>"
  - tossup:
      question: "Antigone defied the harsh edict of what king of Thebes?"
      answer: "CREON"
    boni:
      - question: "What had Creon forbidden her to do?"
        answer: "BURY THE BODY OF HER BROTHER"
      - question: "Who had killed her brother Polynices?"
        answer: "THEIR BROTHER ETEOCLES"
  - tossup:
      question: "What is the first person singular imperfect passive indicative of <latin>do</latin>?"
      answer: "<latin>DABAR</latin>"
    boni:
      - question: "Make <latin>dabar</latin> perfect."
        answer: "<latin>DATUS SUM</latin>"
      - question: "Make <latin>datus sum</latin> active."
        answer: "<latin>DEDI</latin>"
  - tossup:
      question: "What is the nominative singular of the genitive form <latin>hominis</latin>?"
      answer: "<latin>HOMO</latin>"
    boni:
      - question: "What is the nominative singular of the genitive form <latin>nominis</latin>?"
        answer: "<latin>NOMEN</latin>"
      - question: "What is the nominative singular of the genitive form <latin>sanguinis</latin>?"
        answer: "<latin>SANGUIS</latin>"
  - tossup:
      question: "Who was the queen whose boasts about her daughter's beauty almost caused her daughter Andromeda to be sacrificed to a sea-monster?"
      answer: "CASSIOPEIA"
    boni:
      - question: "Who rescued Andromeda?"
        answer: "PERSEUS"
      - question: "Who was Andromeda's father?"
        answer: "CEPHEUS"
  - tossup:
      question: "How many years comprise a millennium?"
      answer: "1000"
    boni:
      - question: "When did the United States celebrate its centennial?"
        answer: "1876"
      - question: "When did it celebrate its sesquicentennial?"
        answer: "1926"
  - tossup:
      question: "Who was the ruler of the Titans?"
      answer: "CRONUS / SATURN"
    boni:
      - question: "Who were his parents?"
        answer: "URANUS AND GAIA"
      - question: "Who was his wife?"
        answer: "RHEA"
  - tossup:
      question: "In the consulship of C. Antonius and M. Tullius Cicero, who attempted to overthrow the government?"
      answer: "CATILINE / CATILINA"
    boni:
      - question: "What was his full name?"
        answer: "L. SERGIUS CATILINA"
      - question: "In what year did these events take place?"
        answer: "63 BC"
  - tossup:
      question: "What priest warned the Trojans against the wooden horse, but was killed by giant sea serpents?"
      answer: "LAOCOÖN"
    boni:
      - question: "What god did Laocoon serve?"
        answer: "POSEIDON / NEPTUNE / APOLLO"
      - question: "Who died with him?"
        answer: "HIS TWO SONS"
  - tossup:
      question: "Translate into Latin the indicative verb in the sentence, ”I had been able to fight.“"
      answer: "<latin>POTUERAM</latin>"
    boni:
      - question: "Translate the verb form <latin>poteram</latin>."
        answer: "I WAS ABLE, I COULD"
      - question: "Translate the verb form <latin>posueram</latin>."
        answer: "I HAD PLACED / PUT"
  - tossup:
      question: "To what declension does the noun <latin>latus</latin> belong?"
      answer: "THIRD"
    boni:
      - question: "The noun <latin>vultus</latin>?"
        answer: "FOURTH"
      - question: "The noun <latin>gradus</latin>?"
        answer: "FOURTH"
  - tossup:
      question: "Specify the case and case usage of the inanimate noun in this Latin sentence: <latin>Magistri libris docent</latin>."
      answer: "ABLATIVE OF MEANS"
    boni:
      - question: "Specify the case and case usage of the inanimate noun in this Latin sentence: <latin>A magistris bene docti sumus</latin>."
        answer: "ABLATIVE OF AGENT"
      - question: "Specify the case and case usage of the inanimate noun in this Latin sentence: <latin>Magno cum studio didicimus</latin>."
        answer: "ABLATIVE OF MANNER"
  - tossup:
      question: "The capture of what town in Spain ended the Roman wars there in the second century BC?"
      answer: "NUMANTIA"
    boni:
      - question: "What Roman general captured the town?"
        answer: "(P. CORNELIUS) SCIPIO AEMILIANUS / AFRICANUS MINOR / NUMANTINUS"
      - question: "What cousin and brother-in-law of Scipio Aemilianus served under him at Carthage?"
        answer: "TIBERIUS (SEMPRONIUS) GRACCHUS"
  - tossup:
      question: "What cases can show place at which or where?"
      answer: "ABLATIVE AND LOCATIVE"
    boni:
      - question: "What shows place to which?"
        answer: "ACCUSATIVE"
      - question: "What shows place from which?"
        answer: "ABLATIVE"
  - tossup:
      question: "What was the name of the series of Roman political offices?"
      answer: "THE <latin>CURSUS HONORUM</latin>"
    boni:
      - question: "What office began the official list?"
        answer: "QUAESTORSHIP"
      - question: "According to law, how many years had to elapse before an ex-consul could stand for that office again?"
        answer: "TEN"
  - tossup:
      question: "What ancient city is now called Brindisi?"
      answer: "BRUNDISIUM"
    boni:
      - question: "What modern city was called Lutetia?"
        answer: "PARIS"
      - question: "What modern city was called Lugdunum?"
        answer: "LYONS"
  - tossup:
      question: "Who for a few months was co-regent with the emperor Nerva?"
      answer: "TRAJAN"
    boni:
      - question: "What was Trajan's <latin>nomen gentilicum</latin>?"
        answer: "ULPIUS"
      - question: "What was Nerva's <latin>nomen gentilicum</latin>?"
        answer: "COCCEIUS"
