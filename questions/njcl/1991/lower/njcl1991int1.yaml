tournament: "NJCL Certamen"
year: 1991
division: "Intermediate"
round: "Round 1"
questions:
  - tossup:
      question: "Whom did Demeter punish with insatiable hunger?"
      answer: "ERYSICHTHON"
    boni:
      - question: "Who was his daughter, whom he sold to buy food?"
        answer: "MESTRA"
      - question: "a fire?"
        answer: "Who for neglect of Artemis was driven mad and so threw himself into // BROTEAS"
  - tossup:
      question: "Whose wound could be cured only by rust from the spear that inflicted it?"
      answer: "TELEPHUS'"
    boni:
      - question: "Whose was the spear?"
        answer: "ACHILLES'"
      - question: "Who correctly interpreted the oracle concerning the wound?"
        answer: "ODYSSEUS/ULYSSES"
  - tossup:
      question: "Make tollit perfect."
      answer: "SUSTULIT"
    boni:
      - question: "Make sustulit passive."
        answer: "SUBLATUS EST"
      - question: "Make sustulit future."
        answer: "TOLLET"
  - tossup:
      question: ""
      answer: "Distinguish in meaning between the verb forms ages and eges."
    boni:
      - question: ""
        answer: "AGES = YOU WILL DO EGES = YOU NEED"
      - question: ""
        answer: "Distinguish between the verb forms ibimus and scribimus. // IBIMUS = WE WILL GO SCRIBIMUS = WE WRITE // Distinguish between the verb forms poteram and potueram. // POTERAM = I WAS ABLE POTUERAM = I HAD BEEN ABLE"
  - tossup:
      question: "What son of Apollo and Coronis was a great physician?"
      answer: "ASCLEPIUS/AESCULAPIUS"
    boni:
      - question: "Who told Apollo about Coronis' infidelity?"
        answer: "A CROW"
      - question: "Whom did Apollo slay to avenge Zeus' killing of Asclepius?"
        answer: "THE CYCLOPES, WHO MADE THE THUNDERBOLT"
  - tossup:
      question: ""
      answer: "What English word for “lively and enthusiastic” comes from a Latin"
    boni:
      - question: "participle meaning “boiling over”?"
        answer: "EBULLIENT"
      - question: "adjective meaning “cheerful or lively”? sollicito, meaning “worry or vex”?"
        answer: "What English verb for “thrill or excite” has its root in a Latin // EXHILARATE // What English adjective meaning “carefree” comes from the Latin verb // INSOUCIANT"
  - tossup:
      question: "What Sueban chief did Caesar beat in 58BC?"
      answer: "ARIOVISTUS"
    boni:
      - question: ""
        answer: ""
      - question: "After what battle in 58BC did the Helvetians stop their migration? Which Haeduan leader was favorably disposed to the Romans?"
        answer: "BIBRACTE // DIVICIACUS"
  - tossup:
      question: "What grouping ended with Marcus Aurelius?"
      answer: "THE FIVE GOOD EMPERORS"
    boni:
      - question: "What son of Marcus Aurelius, unfortunately for Rome, succeeded him?"
        answer: "COMMODUS"
      - question: "What was the only earlier father-to-son succession in the Roman principate?"
        answer: "VESPASIAN - TITUS"
  - tossup:
      question: "What two Argonauts had wings?"
      answer: "ZETES AND CALAIS"
    boni:
      - question: "Who killed them?"
        answer: "HERACLES/HERCULES"
      - question: "Who was their father?"
        answer: "BOREAS"
  - tossup:
      question: "Distinguish between collis and collum?"
      answer: "COLLIS = HILL COLLUM = NECK"
    boni:
      - question: ""
        answer: "Distinguish between cinis and crinis."
      - question: "CANIS = DOG CANUS = WHITE, GRAY, HOARY (ESP."
        answer: "CINIS = ASH CRINIS = HAIR, LOCK // Distinguish between the noun canis and the adjective canus. // OF HAIR)"
  - tossup:
      question: "With whom did the Romans enter into the foedus Cassianum?"
      answer: "THE LATIN LEAGUE"
    boni:
      - question: "In what battle had the Romans defeated the Latin League in 496BC?"
        answer: "LAKE REGILLUS"
      - question: "What annual ceremony on July 15 celebrated the intervention of Castor and Pollux in this battle?"
        answer: "TRANSVECTIO EQUORUM"
  - tossup:
      question: "Marcus patrem non videre potest. Quis non videre potest?"
      answer: "MARCUS"
    boni:
      - question: "Quis non videtur?"
        answer: "PATER"
      - question: "Marcus omnino videre potest. What Latin adjective means that?"
        answer: "CAECUS /INVIDENS"
  - tossup:
      question: "Who was the first of the Etruscan kings of Rome?"
      answer: "TARQUINIUS PRISCUS"
    boni:
      - question: "Who was his wife?"
        answer: "TANAQUIL"
      - question: "What practice did she bring to Rome?"
        answer: "AUGURY"
  - tossup:
      question: "What were Roman tax collectors called?"
      answer: "PUBLICANI"
    boni:
      - question: "What were money lenders called?"
        answer: "NEGOTIATORES or ARGENTARII"
      - question: "What was a slave's property called?"
        answer: "PECULIUM"
  - tossup:
      question: "What is the meaning of the Greek word element common to “hydrophobia” and “hydraulic”?"
      answer: "WATER"
    boni:
      - question: "The element common to “antonym” and “pseudonym”?"
        answer: "NAME, NOUN"
      - question: "The element common to “paleography” and “paleontology”?"
        answer: "OLD"
  - tossup:
      question: "Complete this saying: Mens sana..."
      answer: "IN CORPORE SANO"
    boni:
      - question: "Complete: In vino..."
        answer: "VERITAS"
      - question: "Complete: Ad astra..."
        answer: "PER ASPERA"
  - tossup:
      question: "What maiden of mythology became a laurel tree?"
      answer: "DAPHNE"
    boni:
      - question: "Whom was she fleeing when she was transformed?"
        answer: "APOLLO"
      - question: "Who was Daphne's father?"
        answer: "PENEUS"
  - tossup:
      question: "What alternate form or “biform” exists for supremus?"
      answer: "SUMMUS"
    boni:
      - question: "What biform exists for extremus?"
        answer: "EXTIMUS"
      - question: "What biform exists for infimus?"
        answer: "IMUS"
  - tossup:
      question: "What case is needed to follow the verbs imploro, hortor and rogo?"
      answer: "ACCUSATIVE"
    boni:
      - question: "What case goes with impero and persuadeo?"
        answer: "DATIVE"
      - question: "What case goes with peto and postulo?"
        answer: "ABLATIVE"
  - tossup:
      question: ""
      answer: "Define praeclarus. (Be more precise)"
    boni:
      - question: ""
        answer: "VERY DISTINGUISHED, VERY FAMOUS"
      - question: "Define praecurro. Define praedo."
        answer: "RUN AHEAD, PRECEDE // ROBBER, THIEF // #"
