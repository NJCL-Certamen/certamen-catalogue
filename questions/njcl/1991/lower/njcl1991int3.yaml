tournament: "NJCL Certamen"
year: 1991
division: "Intermediate"
round: "Round 3"
questions:
  - tossup:
      question: ""
      answer: "Name Theseus' son by Antiope, who is also known as Glauce, Melanippe or Hippolyte."
    boni:
      - question: ""
        answer: "HIPPOLYTUS"
      - question: "Whom did Theseus abandon on Naxos? Name Theseus' last wife."
        answer: "ARIADNE // PHAEDRA"
  - tossup:
      question: "Name the last emperor of the Western Roman Empire."
      answer: "ROMULUS AUGUSTULUS"
    boni:
      - question: "Who deposed him, and in what year?"
        answer: "ODOACER, 476AD"
      - question: "Who was the emperor in the east at the time?"
        answer: "ZENO"
  - tossup:
      question: "What is the root verb of the English noun “sect”?"
      answer: "SEQUOR"
    boni:
      - question: "What is the root verb of the English noun “insect”?"
        answer: "SECO"
      - question: "Of the English noun “instinct”? STINGUO?"
        answer: "undefined"
  - tossup:
      question: ""
      answer: "What use of the ablative is found here: In Georgiam multis cum amicis veni."
    boni:
      - question: ""
        answer: "ABLATIVE OF ACCOMPANIMENT"
      - question: "What is this one: Media nocte dormiam."
        answer: "ABLATIVE OF TIME // What is this one: Alaska ceteris civitatibus longior est. // ABLATIVE OF COMPARISON"
  - tossup:
      question: "What is the nominative plural of ōs, “bone”?"
      answer: "OSSA"
    boni:
      - question: "What is the nominative plural of ōs, “mouth”?"
        answer: "ORA"
      - question: "Ōra can also be a nominative singular; what does that mean?"
        answer: "SHORE"
  - tossup:
      question: "What goddess was offended when Cassandra was raped in front of her statue?"
      answer: "ATHENA"
    boni:
      - question: "Who raped her?"
        answer: "AJAX THE LESSER (OILEAN)"
      - question: "Who killed Cassandra?"
        answer: "CLYTEMNESTRA"
  - tossup:
      question: "Who were the siblings of Eos?"
      answer: "HELIUS AND SELENE"
    boni:
      - question: "Whom did Eos turn into a grasshopper?"
        answer: "TITHONUS"
      - question: "What mortal did Selene love?"
        answer: "ENDYMION"
  - tossup:
      question: "Which declensions have nominative singular nouns ending with -us?"
      answer: "SECOND, THIRD AND FOURTH"
    boni:
      - question: "Which have neuter nouns ending with -a in the nominative plural?"
        answer: "SECOND, THIRD AND FOURTH"
      - question: "Which have nouns with accusative singular forms ending with -m?"
        answer: "ALL FIVE // ROUND B3, page 2"
  - tossup:
      question: "What king of Egypt, son of Poseidon, was killed by Heracles?"
      answer: "BUSIRIS"
    boni:
      - question: "What was Busiris' inhospitable custom?"
        answer: "ALL STRANGERS WERE SACRIFICED TO ZEUS"
      - question: "Why was Busiris seeking Zeus' favor?"
        answer: "TO END A DROUGHT"
  - tossup:
      question: ""
      answer: "Name the antagonistic sons of Tyro, one of whom usurped a throne from"
    boni:
      - question: ""
        answer: "the other."
      - question: "Who was Pelias' father? Who was Aeson's father?"
        answer: "PELIAS AND AESON // POSEIDON // CRETHEUS"
  - tossup:
      question: ""
      answer: "Name a temple in the Forum Romanum."
    boni:
      - question: ""
        answer: "CASTOR AND POLLUX, SATURN, VENUS AND ROME, DIVINE ROMULUS, JANUS,"
      - question: ""
        answer: "VESTA, DIVINE JULIUS, ANTONINUS AND FAUSTINA, CONCORD, DIVINE AUGUSTUS, // DIVINE VESPASIAN. // Name two more. // Name two more."
  - tossup:
      question: "What gender are the months of the year?"
      answer: "MASCULINE"
    boni:
      - question: "What gender are trees?"
        answer: "FEMININE"
      - question: "What gender are indeclinable nouns?"
        answer: "NEUTER"
  - tossup:
      question: ""
      answer: "Name the battle in 48BC which Julius Caesar lost to Pompey."
    boni:
      - question: ""
        answer: "DYRHACCHIUM"
      - question: "Where did Julius Caesar finally defeat Pompey decisively? At what battle did Julius Caesar finally defeat the sons of Pompey?"
        answer: "PHARSALUS // MUNDA"
  - tossup:
      question: ""
      answer: "Translate this sentence into idiomatic English: Galli poenam dant."
    boni:
      - question: ""
        answer: "THE GAULS SUFFER/UNDERGO PUNISHMENT (PAY THE PENALTY)."
      - question: "Romani Germanos in fugam dant. Germani ad flumen in fugam se dant."
        answer: "THE ROMANS PUT THE GERMANS TO FLIGHT. // THE GERMANS FLEE TO THE RIVER."
  - tossup:
      question: ""
      answer: "Define robur. OAK TREE or any hard wood (STRENGTH)"
    boni:
      - question: "Define fraxinus."
        answer: "ASH TREE"
      - question: "Define tilia."
        answer: "LINDEN/LIME TREE"
  - tossup:
      question: "Who persuaded the plebeians to return to Rome in 494BC?"
      answer: "MENENIUS AGRIPPA"
    boni:
      - question: "How many recorded plebeian secessions were there?"
        answer: "FIVE"
      - question: "What hill was the traditional rallying place for them?"
        answer: "AVENTINE"
  - tossup:
      question: "Quot supercilia tibi sunt?"
      answer: "DUO"
    boni:
      - question: "Quot pulmones tibi sunt?"
        answer: "DUO"
      - question: "Quot iecora tibi sunt?"
        answer: "UNUM"
  - tossup:
      question: "For what was the <emphasis>corona muralis</emphasis> awarded?"
      answer: "BEING FIRST OVER THE ENEMY RAMPART/BESIEGED CITY'S WALL"
    boni:
      - question: "For what was the <emphasis>corona civica</emphasis> awarded?"
        answer: "SAVING FELLOW CITIZEN'S LIFE"
      - question: "In what kind of engagement could a Roman win a <emphasis>corona classica</emphasis>?"
        answer: "A NAVAL BATTLE"
  - tossup:
      question: "What Latin word is abbreviated <emphasis>viz</emphasis>?"
      answer: "VIDELICET"
    boni:
      - question: ""
        answer: ""
      - question: "What related word is abbreviated <emphasis>sc</emphasis>? What does c (C with superscript line) mean?"
        answer: "SCILICET // CUM"
  - tossup:
      question: ""
      answer: "Distinguish between <emphasis>mos</emphasis> and <emphasis>mox</emphasis>."
    boni:
      - question: ""
        answer: "MOS = CUSTOM MOX = SOON"
      - question: ""
        answer: "Distinguish between <emphasis>mus</emphasis> and <emphasis>murus</emphasis>. // MUS = MOUSE MURUS = WALL // Distinguish between <emphasis>mora</emphasis> and <emphasis>morus</emphasis>. // MORA = DELAY, PAUSE MORUS = MULBERRY // #"
