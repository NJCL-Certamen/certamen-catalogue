tournament: "NJCL Certamen"
year: 1991
division: "Intermediate"
round: "Semifinals"
questions:
  - tossup:
      question: "Nactus is a participle of what verb?"
      answer: "NANCISCOR"
    boni:
      - question: "Give the third person plural present indicative of nanciscor."
        answer: "NANCISCUNTUR"
      - question: "What other participle exists as an alternative to nactus?"
        answer: "NANCTUS"
  - tossup:
      question: "What enemy commander invaded Greece in 480BC?"
      answer: "XERXES"
    boni:
      - question: "What deposed king of Sparta had defected to the Persians and accompanied him?"
        answer: "DEMARATUS"
      - question: "Where did Xerxes suffer his most telling defeat?"
        answer: "SALAMIS"
  - tossup:
      question: "What are the two root Latin verbs and their meanings represented by the English adjectives “desperate” and “disparate”?"
      answer: "SPERO = HOPE AND PARO = PREPARE"
    boni:
      - question: "What is the root verb of “conspiracy”?"
        answer: "SPIRO = BREATHE"
      - question: "What is the root verb of “disappear”?"
        answer: "PAREO = APPEAR, OBEY"
  - tossup:
      question: "Who was the father of brothers named Deicoon, Creontidas and Thersimachus?"
      answer: "HERACLES"
    boni:
      - question: "Who was their mother?"
        answer: "MEGARA"
      - question: "How did mother and sons die?"
        answer: "KILLED BY HERACLES IN A FIT OF MADNESS"
  - tossup:
      question: "Who besides Echo was turned into an echo?"
      answer: "CANENS"
    boni:
      - question: "Who was her beloved?"
        answer: "PICUS"
      - question: "Whose advances to Picus were rebuffed?"
        answer: "CIRCE'S"
  - tossup:
      question: "What Roman noble led a revolt in Gaul in 68AD?"
      answer: "VINDEX"
    boni:
      - question: "Who defeated Vindex?"
        answer: "VERGINIUS RUFUS"
      - question: "What candidate for the throne did Verginius support after his success against Vindex?"
        answer: "GALBA"
  - tossup:
      question: "Missi sunt : mitto :: ________ : infero."
      answer: "ILLATI SUNT"
    boni:
      - question: "Miserimus : mitto :: ________ : aufero."
        answer: "ABSTULERIMUS"
      - question: "Sum : sunt :: inquam : ________."
        answer: "INQUIUNT"
  - tossup:
      question: "What was a malum Punicum?"
      answer: "POMEGRANATE"
    boni:
      - question: "What was a malum Persicum?"
        answer: "PEACH"
      - question: "What was a malum Armeniacum?"
        answer: "APRICOT"
  - tossup:
      question: "What Argonaut jumped overboard because of the song of the Sirens?"
      answer: "BUTES"
    boni:
      - question: "What deity saved him?"
        answer: "APHRODITE"
      - question: "What son did she bear him?"
        answer: "ERYX"
  - tossup:
      question: "What English command is represented by the Latin abbreviation cf?"
      answer: "COMPARE"
    boni:
      - question: "What is the Latin that cf stands for?"
        answer: "CONFER"
      - question: "What is the plural of that command?"
        answer: "CONFERTE"
  - tossup:
      question: "A form of what Latin verb would be in the main clause of: “Marcus said that he wasn't hungry.”"
      answer: "NEGO"
    boni:
      - question: ""
        answer: "Translate: Quintus said that he was a citizen."
      - question: ""
        answer: "QUINTUS DIXIT SE CIVEM ESSE. // Translate: Livia said she wasn't tired. // LIVIA NEGAVIT SE FESSAM ESSE."
  - tossup:
      question: ""
      answer: "Distinguish between the verbs hortor and vertor."
    boni:
      - question: ""
        answer: "HORTOR = URGE, ENCOURAGE VERTOR = TURN"
      - question: ""
        answer: "Distinguish between the nouns partus and portus. // PARTUS = BIRTH PORTUS = HARBOR, PORT // Distinguish between the verbs patior and potior. // PATIOR = SUFFER, ALLOW POTIOR = TAKE POSSESSION"
  - tossup:
      question: "Which Roman king disappeared into a storm and was deified?"
      answer: "ROMULUS"
    boni:
      - question: "Which king was murdered by his own daughter and son-in-law?"
        answer: "SERVIUS TULLIUS"
      - question: "Which king built the Temple of Jupiter Capitolinus?"
        answer: "TARQUINIUS PRISCUS AND/OR TARQUINIUS SUPERBUS"
  - tossup:
      question: "What do the neuter nouns fas and nihil have in common?"
      answer: ""
    boni:
      - question: ""
        answer: "THEY ARE INDECLINABLE"
      - question: "What two forms of nemo are not found? What two forms of vis are not found?"
        answer: "GENITIVE AND ABLATIVE SINGULAR // GENITIVE AND DATIVE SINGULAR"
  - tossup:
      question: "From what monster's spittle did the poisonous plant aconite spring?"
      answer: "CERBERUS"
    boni:
      - question: "Who used aconite to try to poison her stepson?"
        answer: "MEDEA"
      - question: "Who was the stepson?"
        answer: "THESEUS"
  - tossup:
      question: "What is the meaning of the Greek word element common to “palindrome” and “palimpsest”?"
      answer: "AGAIN, BACK"
    boni:
      - question: "What is the meaning of the Greek word element common to “dactylic” and “pterodactyl”?"
        answer: "FINGER"
      - question: "Of the element common to “pterodactyl” and “helicopter”?"
        answer: "WING"
  - tossup:
      question: "Translate into English: Esne servus annon?"
      answer: ""
    boni:
      - question: "ARE YOU A SLAVE OR NOT? Translate: Utrum defenditis an oppugnatis Romam?"
        answer: ""
      - question: "ARE YOU DEFENDING ROME OR ATTACKING HER? Translate: Sunt haec tua verba necne? ARE THESE YOUR WORDS OR AREN'T THEY? (...OR NOT?"
        answer: "// )"
  - tossup:
      question: "What three gods had priests called maiores flamines?"
      answer: "JUPITER, MARS AND QUIRINUS"
    boni:
      - question: "How many flamines minores were there?"
        answer: "TWELVE"
      - question: "For whom was Marc Antony a flamen?"
        answer: "JULIUS CAESAR"
  - tossup:
      question: ""
      answer: "What dynasty ruled the Roman Empire for almost all of the period 193-"
    boni:
      - question: "235AD?"
        answer: "SEVERAN"
      - question: "Name the founder of this dynasty. Name the interloper who ruled briefly between Caracalla and Elagabalus."
        answer: "SEPTIMIUS SEVERUS // MACRINUS"
  - tossup:
      question: "What deity's protection did Camilla's father invoke for her?"
      answer: "DIANA'S"
    boni:
      - question: "Who was Camilla's mother?"
        answer: "CASMILLA"
      - question: "What tribe did Camilla lead against Aeneas?"
        answer: "THE VOLSCI // #"
