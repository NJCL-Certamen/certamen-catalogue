tournament: "NJCL Certamen"
year: 1991
division: "Novice"
round: "Round 2"
questions:
  - tossup:
      question: "What is the noun of either feminine or masculine gender that means “spouse”?"
      answer: "CONIUNX"
    boni:
      - question: "What is the noun for “husband”?"
        answer: "MARITUS/VIR"
      - question: "What is the noun for “wife”?"
        answer: "UXOR or MULIER"
  - tossup:
      question: ""
      answer: "Distinguish between the anagrammatic nouns corpus and porcus."
    boni:
      - question: ""
        answer: "CORPUS = BODY PORCUS = PIG"
      - question: ""
        answer: "Distinguish between the nouns latus and litus. // LATUS = SIDE LITUS = SHORE, COAST // Distinguish between regia and regina. // REGIA = PALACE REGINA = QUEEN"
  - tossup:
      question: ""
      answer: "Say in Latin:"
    boni:
      - question: ""
        answer: "I will walk."
      - question: ""
        answer: "AMBULABO // Say: I will run. // CURRAM // Say: I will go. // IBO/CEDAM"
  - tossup:
      question: "What two datives make up the so-called double dative?"
      answer: "DATIVE OF REFERENCE AND DATIVE OF PURPOSE"
    boni:
      - question: "What other type of dative is in this sentence: Multae villae Ciceroni erant?"
        answer: "POSSESSION"
      - question: "What type of dative is this: Puer domino bene servit?"
        answer: "SPECIAL VERB"
  - tossup:
      question: "What Latin noun gives us the English verb “aviate”?"
      answer: "AVIS"
    boni:
      - question: "What is the English noun for a place birds are kept?"
        answer: "AVIARY"
      - question: "What English noun for “supervision or sponsorship” comes from avis and specio?"
        answer: "AUSPICE(S)"
  - tossup:
      question: "What future emperor of Rome was born in the year of Cicero's consulship?"
      answer: "AUGUSTUS/OCTAVIAN"
    boni:
      - question: "Who was elected Pontifex Maximus the same year?"
        answer: "JULIUS CAESAR"
      - question: "What king of Pontus and enemy of Rome died that year?"
        answer: "MITHRIDATES"
  - tossup:
      question: "What modern nation lies opposite Greece across the Aegean?"
      answer: "TURKEY"
    boni:
      - question: ""
        answer: "For five points each, name any two of the modern nations bordering the Adriatic Sea."
      - question: ""
        answer: "GREECE, ITALY, YUGOSLAVIA, ALBANIA"
  - tossup:
      question: "What Roman praenomen is abbreviated C?"
      answer: "GAIUS"
    boni:
      - question: "Which one does T. stand for?"
        answer: "TITUS"
      - question: "Which one does Cn. stand for?"
        answer: "GNAEUS"
  - tossup:
      question: "Genealogically speaking, what was a <emphasis>stirps</emphasis>?"
      answer: "BRANCH OF A GENS (ALL WITH SAME COGNOMEN)"
    boni:
      - question: "What was true of someone described as <emphasis>sui iuris</emphasis>?"
        answer: "HE WAS LEGALLY INDEPENDENT"
      - question: "What Latin phrase was applied to someone old enough to run for office?"
        answer: "HE WAS SAID TO BE SUO ANNO"
  - tossup:
      question: "Which of his wives did Zeus swallow?"
      answer: "METIS"
    boni:
      - question: "Who was her child?"
        answer: "ATHENA"
      - question: "Based on whose prophecy was Zeus afraid to let Metis bear his child?"
        answer: "GAIA'S (or GAIA'S AND URANUS' or PROMETHEUS')"
  - tossup:
      question: "Who was the fourth of the Five Good Emperors?"
      answer: "ANTONINUS PIUS"
    boni:
      - question: "Who was Antoninus' adoptive father?"
        answer: "HADRIAN"
      - question: "Who was the natural son of Marcus Aurelius?"
        answer: "COMMODUS"
  - tossup:
      question: "In what way must an appositive agree with its antecedent?"
      answer: "CASE ONLY"
    boni:
      - question: "How does that differ from the requirement for a relative pronoun?"
        answer: "A RELATIVE PRONOUN MUST AGREE IN GENDER AND NUMBER"
      - question: "What determines the case of a relative pronoun?"
        answer: "ITS USE WITHIN ITS OWN CLAUSE"
  - tossup:
      question: ""
      answer: "What god punished Cassandra for spurning him with the gift of unheeded"
    boni:
      - question: "prophecy?"
        answer: "APOLLO"
      - question: "What Greek warrior raped Cassandra despite a deity's protection? Who was the deity?"
        answer: "AJAX THE LESSER (OILEAN) // ATHENA"
  - tossup:
      question: ""
      answer: "What part of Hades was the realm of souls which had been neither cursed"
    boni:
      - question: "nor blessed - that is, most of them?"
        answer: "THE FIELDS OF ASPHODEL"
      - question: "Where do the blessed go? Where do the wicked go?"
        answer: "ELYSIUM (ISLES OF THE BLESSED) // TARTARUS"
  - tossup:
      question: "What are the nominative singular forms of the relative pronoun?"
      answer: "QUI, QUAE, QUOD"
    boni:
      - question: "What are the nominative singular forms of the interrogative pronoun?"
        answer: "QUIS, QUID"
      - question: "What are the nominative singular forms of the interrogative adjective?"
        answer: "QUI, QUAE, QUOD"
  - tossup:
      question: "With his deathbed baptism, who became the first Christian emperor?"
      answer: "CONSTANTINE"
    boni:
      - question: "Where did he establish a “new Rome” in 324AD?"
        answer: "CONSTANTINOPLE/BYZANTIUM"
      - question: "What part of the Roman military did he disband?"
        answer: "THE PRETORIAN GUARD"
  - tossup:
      question: ""
      answer: "ROUND C2, page 3"
  - tossup:
      question: "What woman chose a mortal over Apollo for her lover?"
      answer: "MARPESSA"
    boni:
      - question: ""
        answer: ""
      - question: "Whom did she pick? What Spartan youth did Apollo accidentally kill with a discus?"
        answer: "IDAS // HYACINTHUS"
  - tossup:
      question: ""
      answer: "Translate the phrase “in the middle of the night.”"
    boni:
      - question: ""
        answer: "MEDIA NOCTE"
      - question: "What Latin phrase means “late at night”? What Latin phrase means “on the fourth day”?"
        answer: "MULTA NOCTE // QUARTO DIE"
  - tossup:
      question: ""
      answer: "Name a simple Latin verb with no final vowel in its singular active"
    boni:
      - question: ""
        answer: "imperative."
      - question: ""
        answer: "FACIO DUCO DICO FERO SUM // Name another. // Name another."
  - tossup:
      question: "What monster did Perseus slay without ever looking directly at it?"
      answer: "THE GORGON MEDUSA"
    boni:
      - question: "From what three sisters did he get help in his quest for the Gorgons' lair?"
        answer: "THE GRAEAE"
      - question: "What maiden was rescued from a sea monster by the same hero?"
        answer: "ANDROMEDA // #"
