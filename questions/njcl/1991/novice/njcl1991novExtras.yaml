tournament: "NJCL Certamen"
year: 1991
division: "Novice"
round: "Extra Questions"
questions:
  - tossup:
      question: "What kind of ablative is used in the sentence: Stilo scribo?"
      answer: "MEANS"
  - tossup:
      question: "What kind of flower is a little sword?"
      answer: "GLADIOLUS"
  - tossup:
      question: "What is the third principal part of pello?"
      answer: "PEPULI"
  - tossup:
      question: "What case would “consuls” be in: The Romans called their leaders consuls?"
      answer: "ACCUSATIVE"
  - tossup:
      question: "What is the ablative singular of dies?"
      answer: "DIE"
  - tossup:
      question: "Translate mare."
      answer: "SEA"
  - tossup:
      question: "Make velit indicative."
      answer: "VULT"
  - tossup:
      question: "Translate diu."
      answer: "FOR A LONG TIME"
  - tossup:
      question: "What Latin verb is the root of “nonsense”?"
      answer: "SENTIO"
  - tossup:
      question: "Sta et monstra genua tua."
      answer: "STUDENT SHOULD STAND AND POINT TO HIS/HER KNEES."
  - tossup:
      question: "Who was the mother of Heracles?"
      answer: "ALCMENA"
  - tossup:
      question: "Who was Achilles' best friend?"
      answer: "PATROCLUS"
  - tossup:
      question: "What deity was robbed of his cattle by the day-old Hermes?"
      answer: "APOLLO"
  - tossup:
      question: "What did Odysseus tell Polyphemus his name was?"
      answer: "NOMAN/NOBODY"
  - tossup:
      question: "To whom did Zeus appear as a shower of gold?"
      answer: "DANAE"
  - tossup:
      question: "Whose conspiracy threatened the government during Cicero's consulship?"
      answer: "CATILINE'S"
  - tossup:
      question: "Who was Augustus' first designated heir?"
      answer: "MARCELLUS"
  - tossup:
      question: "What Roman admiral returned to Carthage as proof of Roman fides?"
      answer: "REGULUS"
  - tossup:
      question: "Who was made dictator and defeated the Aequi?"
      answer: "CINCINNATUS"
  - tossup:
      question: "What was the name of Rome's sewer system?"
      answer: "CLOACA MAXIMA"
