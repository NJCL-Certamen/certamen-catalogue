tournament: "NJCL Certamen"
year: 1991
division: "Novice"
round: "Finals"
questions:
  - tossup:
      question: "What Argonaut was so swift that he ran across the waves?"
      answer: "EUPHEMUS"
    boni:
      - question: "What disguised god gave Euphemus an odd gift?"
        answer: "TRITON"
      - question: "What was the gift?"
        answer: "A CLOD OF DIRT"
  - tossup:
      question: "What would your doctor put on a prescription he wants you to take twice a day?"
      answer: "B."
  - tossup:
      question: "D."
      answer: "(BIS IN DIE)"
    boni:
      - question: "What does the Latin abbreviation et seq tell you?"
        answer: "AND THE FOLLOWING"
      - question: "What does SPQR stand for?"
        answer: "SENATUS POPULUSQUE ROMANUS"
  - tossup:
      question: "What former shepherd commanded the Lusitanians in their last stand against the expanding power of Rome and is still a national hero in that country?"
      answer: "VIRIATHUS"
    boni:
      - question: "What country is that?"
        answer: "PORTUGAL"
      - question: "How did Viriathus die?"
        answer: "THE ROMANS BRIBED ASSOCIATES TO ASSASSINATE HIM"
  - tossup:
      question: "Which of these would be arrested now: pistor fessus, auriga ebrius, magister piger, nomenclator stultus?"
      answer: "AURIGA EBRIUS"
    boni:
      - question: "What does that mean?"
        answer: "DRUNK DRIVER"
      - question: "What is a pistor fessus? What is a pistor fessus?"
        answer: "TIRED BAKER // TIRED BAKER"
  - tossup:
      question: "In whose honor was the naming of a Roman colony at the site of modern Cologne?"
      answer: "AGRIPPINA THE YOUNGER (IT WAS CALLED COLONIA AGRIPPINENSIS)"
    boni:
      - question: "Who was her first husband, father of her son Nero?"
        answer: "GNAEUS DOMITIUS AHENOBARBUS"
      - question: "Agrippina was exiled by her brother Caligula. Why? Who was her father? What god sent the monster that Heracles killed to save Hesione?"
        answer: "SUSPICION OF BEING PART OF THE CONSPIRACY OF LENTULUS GAETULICUS // LAOMEDON // POSEIDON"
  - tossup:
      question: "What is the term for the kind of perfect tense form shared by caedo, 218 pello and spondeo?"
      answer: "REDUPLICATED"
    boni:
      - question: "What is the perfect active infinitive of tango?"
        answer: "TETIGISSE"
      - question: "Of iungo?"
        answer: "IUNXISSE"
  - tossup:
      question: ""
      answer: "Translate the interrogative pronoun in this sentence: Whom did you"
    boni:
      - question: "persuate to lend you money?"
        answer: "CUI/QUIBUS"
      - question: "built in the Forum were tourist attractions. which she was carried was sent to Psyche by the gods."
        answer: "Translate the relative pronoun in this sentence: The temples which were // QUAE // Translate the entire relative clause in this sentence: The wind by // QUO PORTATA EST"
  - tossup:
      question: "Who, by Apollodorus' account, was Priam's wife before Hecuba?"
      answer: "ARISBE"
    boni:
      - question: ""
        answer: "What son of Hecuba was sent away from Troy for safety, but was"
      - question: "murdered for his treasure? Who was the killer, eventually killed by Hecuba herself?"
        answer: "POLYDORUS // POLYMESTOR"
  - tossup:
      question: ""
      answer: "Distinguish in meaning between the verb forms audetis and auditis."
    boni:
      - question: ""
        answer: "AUDETIS = Y'ALL DARE AUDITIS = Y'ALL HEAR"
      - question: ""
        answer: "Distinguish between the verb forms peperi and peperci. // PEPERI = I'VE BORNE PEPERCI = I'VE SPARED // Distinguish between the verb forms cecinit and cecidit. // CECINIT = HE SANG CECIDIT = HE FELL"
  - tossup:
      question: "What mood of the verb is normally introduced by quamquam, “although”?"
      answer: "INDICATIVE"
    boni:
      - question: ""
        answer: "What tense and mood are normally found in clauses introduced by dum when"
      - question: "it means “while”? What mood do you need to say: “Let's go to San Diego next year”?"
        answer: "PRESENT INDICATIVE // SUBJUNCTIVE"
  - tossup:
      question: "Victory over the Goths gave the agnomen Gothicus to what emperor?"
      answer: "CLAUDIUS II"
    boni:
      - question: "What emperor did he succeed?"
        answer: "GALLIENUS"
      - question: "claimed to be Claudius Gothicus' descendant?"
        answer: "In tribute to him but utterly without substance, what later emperor // CONSTANTINE"
  - tossup:
      question: "What is the superlative of graviter?"
      answer: "GRAVISSIME"
    boni:
      - question: ""
        answer: ""
      - question: "What is the superlative of the adverb parum? What is the superlative of the adverb facile?"
        answer: "MINIME // FACILLIME"
  - tossup:
      question: "What would a wealthy Roman patronus call his dependents or proteges?"
      answer: "CLIENTES = CLIENTS"
    boni:
      - question: "Clientes comes from an archaic Latin verb meaning what?"
        answer: "HEAR or HEAR ONESELF BEING CALLED"
      - question: "What Latin noun meant “clienthood” or “clientship”?"
        answer: "CLIENTELA"
  - tossup:
      question: "What priest of Dionysus in Calydon prayed to the god to avenge his unrequited love?"
      answer: "CORESUS"
    boni:
      - question: "Who was Coresus' hard-hearted beloved?"
        answer: "CALLIRHOE"
      - question: "The Calydonians were told what as the solution to the madness Dionysus punished them with?"
        answer: "CALLIRHOE HAD TO BE SACRIFICED IF SHE COULDN'T FIND A WILLING SUBSTITUTE // (AT THE MOMENT OF THE SACRIFICE, CORESUS KILLED HIMSELF RATHER THAN HER; // SHE THEN KILLED HERSELF FROM REMORSE)"
  - tossup:
      question: "Who are the nymphs of ash trees?"
      answer: "MELIAE"
    boni:
      - question: "From the blood of whose wound did they spring?"
        answer: "URANUS"
      - question: "What famous figure, woman turned to beast, was in some sources the daughter of Inachus and one of the Meliae?"
        answer: "IO"
  - tossup:
      question: "What did you call an uninvited or unexpected guest at a banquet, in Latin slang?"
      answer: "UMBRA"
    boni:
      - question: "A triclinium was built to accommodate how many persons?"
        answer: "NINE"
      - question: "What name was given to the most honored spot in the room?"
        answer: "LOCUS CONSULARIS"
  - tossup:
      question: "What was the most important city in Italy to defect to Hannibal in the Second Punic War?"
      answer: "CAPUA"
    boni:
      - question: "What important southern city did he capture in 212BC by treason?"
        answer: "TARENTUM"
      - question: "What consul reconquered Capua for Rome?"
        answer: "Q. FULVIUS FLACCUS"
  - tossup:
      question: "Identify and translate the Latin adjective at the root of “umpire.”"
      answer: "PAR = EQUAL"
    boni:
      - question: "Identify and translate the Latin noun at the root of “interval.”"
        answer: "VALLUM = WALL, RAMPART, BATTLEMENT"
      - question: "Identify and translate the Latin noun at the root of “ruminate.”"
        answer: "RUMEN = CUD // #"
