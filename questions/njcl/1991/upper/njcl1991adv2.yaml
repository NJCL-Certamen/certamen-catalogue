tournament: "NJCL Certamen"
year: 1991
division: "Advanced"
round: "Round 2"
questions:
  - tossup:
      question: ""
      answer: "What creature, half woman and half snake, mated with several monsters"
    boni:
      - question: "and produced several more?"
        answer: "ECHIDNA"
      - question: "mates? Who killed Echidna?"
        answer: "What hound by some accounts was both one of her offspring and one of her // ORTHUS/ORTHRUS // ARGUS (ARGUS PANOPTES)"
  - tossup:
      question: ""
      answer: "Translate the motto of Arizona: Ditat deus."
    boni:
      - question: ""
        answer: "GOD ENRICHES"
      - question: ""
        answer: "Translate the motto of Wyoming: Cedant arma togae. // LET ARMS YIELD TO THE TOGA // Of Missouri: Salus populi suprema lex esto. // THE PEOPLE'S WELFARE SHALL BE THE SUPREME LAW"
  - tossup:
      question: "Define huc."
      answer: "HITHER, TO THIS PLACE"
    boni:
      - question: "Define hinc."
        answer: "HENCE, FROM THIS PLACE"
      - question: "Define illuc."
        answer: "THITHER, TO THAT PLACE"
  - tossup:
      question: ""
      answer: "Name a verb whose only imperative is future in form."
    boni:
      - question: ""
        answer: "SCIO MEMINI HABEO “CONSIDER”"
      - question: "What is the third person plural future imperative of scio?"
        answer: "Name another. // SCIUNTO"
  - tossup:
      question: ""
      answer: "Distinguish between the verbs sero and tero."
    boni:
      - question: ""
        answer: "SERO = SOW/JOIN, COMPOSE TERO = RUB, WEAR DOWN"
      - question: ""
        answer: "Distinguish between them by their fourth parts. // SERO -> SATUS/SERTUS TERO -> TRITUS // Distinguish between the verbs cero and gero. // CERO = (COAT WITH) WAX // GERO = CARRY ON, WAGE, CONDUCT, TRANSACT, ETC."
  - tossup:
      question: "How often do you take a prescription labeled q.i.d.?"
      answer: "FOUR TIMES DAILY = QUATER IN DIE"
    boni:
      - question: "When do you take it if it says a.c.?"
        answer: "BEFORE MEALS = ANTE CIBUM"
      - question: "How do you take it if it says p.o.?"
        answer: "ORALLY = PER OS"
  - tossup:
      question: "What Latin noun is the root of the English noun “treason”?"
      answer: "TRADITIO"
    boni:
      - question: "What related Latin noun means “treason”?"
        answer: "PRODITIO"
      - question: "What related Latin noun means “surrender” in the military sense?"
        answer: "DEDITIO"
  - tossup:
      question: "What Latin verb is the ultimate root of “taste”?"
      answer: "TANGO"
    boni:
      - question: ""
        answer: ""
      - question: "What English verb meaning “drain or sap” is ultimately from tango? Which of these is also from tango: taxi, taxidermy, tactical?"
        answer: "TAX // TAXI"
  - tossup:
      question: "Whose last words were, “Don't disturb my circles”?"
      answer: "ARCHIMEDES'"
    boni:
      - question: "What Roman commander captured Syracuse?"
        answer: "M. CLAUDIUS MARCELLUS"
      - question: "Where in the Mediterranean would you go to see Syracuse?"
        answer: "SICILY"
  - tossup:
      question: "Who is the first subject covered in Suetonius' Lives of the Caesars?"
      answer: "JULIUS CAESAR"
    boni:
      - question: "How many are covered?"
        answer: "TWELVE"
      - question: "Who is the last?"
        answer: "DOMITIAN"
  - tossup:
      question: "What Trojan river god was by some sources a grandfather of Anchises?"
      answer: "SIMOEIS"
    boni:
      - question: "Who was his daughter, Anchises' mother?"
        answer: "HIEROMNEME"
      - question: "Who was Anchises' father?"
        answer: "CAPYS"
  - tossup:
      question: "With what distinguished Roman jurist did Cicero study law?"
      answer: "Q. MUCIUS SCAEVOLA"
    boni:
      - question: "To what Greek island did Cicero go to study rhetoric?"
        answer: "RHODES"
      - question: "What Roman orator became Cicero's principal rival?"
        answer: "HORTENSIUS"
  - tossup:
      question: "At what event would you find a pronuba?"
      answer: "WEDDING"
    boni:
      - question: "What kind of tunic does a bride wear?"
        answer: "TUNICA RECTA"
      - question: "What was the name for the boy who bore symbolic offerings of fruit?"
        answer: "CAMILLUS"
  - tossup:
      question: "Name a helmsman of the Argo."
      answer: "TIPHYS or ANCAEUS (or ERGINUS)"
    boni:
      - question: ""
        answer: "Name another."
      - question: "How did Ancaeus die?"
        answer: "KILLED BY THE CALYDONIAN BOAR"
  - tossup:
      question: ""
      answer: "What is the technical term for the stressed long syllable which begins"
    boni:
      - question: "every foot of dactylic hexameter?"
        answer: "THESIS"
      - question: "What is the rest of the foot called? What is the name for metric stress?"
        answer: "ARSIS // ICTUS"
  - tossup:
      question: "What noted Roman general lost his command by the lex Manilia?"
      answer: "(L. LICINIUS) LUCULLUS"
    boni:
      - question: "What nation did he invade in 69BC because Mithridates had fled there?"
        answer: "ARMENIA"
      - question: "What brother-in-law of Lucullus led the mutiny against him in 68BC?"
        answer: "CLODIUS PULCHER"
  - tossup:
      question: "What king of Thebes was supremely talented at the lyre?"
      answer: "AMPHION"
    boni:
      - question: ""
        answer: "What task did he accomplish with his lyre that his brother Zethus was"
      - question: "doing with brute strength? What god gave Amphion the lyre?"
        answer: "PUTTING THE STONES OF THE CITY'S WALLS INTO PLACE // HERMES // ROUND A2, page 3"
  - tossup:
      question: ""
      answer: "Name something, according to Catullus, that Fabullus should bring with him in order to dine well at Catullus' house."
    boni:
      - question: ""
        answer: "DINNER/FOOD, WINE, GIRL, SALT (WIT), LAUGHTER"
      - question: ""
        answer: "Name another. // Name another."
  - tossup:
      question: "Quot iecora tibi sunt?"
      answer: "UNUM"
    boni:
      - question: "Quot femora tibi sunt?"
        answer: "DUO"
      - question: "Quot tempora tibi sunt?"
        answer: "DUO"
  - tossup:
      question: "Who was the power behind the throne of Honorius, the young ruler of the Western Empire?"
      answer: "STILICHO"
    boni:
      - question: "What barbarian invader did he defeat in 402AD at Pollentia and 403 at Verona?"
        answer: "ALARIC THE VISIGOTH"
      - question: "Who wrote poems praising Stilicho and his achievements?"
        answer: "CLAUDIAN // #"
