      - question: "What does that mean?"
        answer: "HELLO, GRANDFATHER"
      - question: "What alliterative sentence would mean, “We love the friendly aunts?"
        answer: "” // AMITAS AMICAS AMAMUS."
  - tossup:
      question: ""
      answer: "Give the dative singular of “that bolder soldier.”"
    boni:
      - question: ""
        answer: "ILLI FORTIORI MILITI"
      - question: ""
        answer: "Give the accusative plural of “the same good laws.” // EASDEM LEGES BONAS // Give the ablative singular of “each wise leader.” // QUOQUE DUCE SAPIENTI/PRUDENTI"
  - tossup:
      question: ""
      answer: "Distinguish between arx and arca."
    boni:
      - question: ""
        answer: "ARX = CITADEL ARCA = STRONGBOX"
      - question: ""
        answer: "Distinguish between arcus and artus. // ARCUS = BOW, ARCH ARTUS = JOINT // Distinguish between ara and aura. // ARA = ALTAR AURA = BREEZE, AIR"
  - tossup:
      question: "Who was the king of Scheria who welcomed the shipwrecked Odysseus?"
      answer: "ALCINOUS"
