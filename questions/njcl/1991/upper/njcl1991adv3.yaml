tournament: "NJCL Certamen"
year: 1991
division: "Advanced"
round: "Round 3"
questions:
  - tossup:
      question: ""
      answer: "Some accounts have two of Niobe's children surviving the attack by"
    boni:
      - question: "Apollo and Artemis because they prayed for mercy to what deity?"
        answer: "LETO"
      - question: "Who was the surviving boy? Who was the surviving girl?"
        answer: "AMYCLAS // MELIBOEA/CHLORIS"
  - tossup:
      question: ""
      answer: "Give the full name of the author of the <emphasis>Aeneid</emphasis>."
    boni:
      - question: ""
        answer: "PUBLIOS VERGILIUS MARO"
      - question: "What was his birthplace? In what Roman province was Andes located?"
        answer: "ANDES (MANTUA) // CISALPINE GAUL"
  - tossup:
      question: ""
      answer: "In what case will you find the infinitive's subject in the so-called"
    boni:
      - question: "historic infinitive?"
        answer: "NOMINATIVE"
      - question: "What is the case of the subject within indirect statement? What is the case of the subject within indirect question?"
        answer: "ACCUSATIVE // NOMINATIVE"
  - tossup:
      question: "What Argonaut could change his shape in battle?"
      answer: "PERICLYMENUS"
    boni:
      - question: "What divine grandfather had given him this gift?"
        answer: "POSEIDON/NEPTUNE"
      - question: "Who slew Periclymenus as he attacked in the shape of an eagle?"
        answer: "HERACLES"
  - tossup:
      question: "What confederacy of city-states evolved into the Athenian Empire?"
      answer: "THE DELIAN LEAGUE"
    boni:
      - question: "What confederacy was led by Sparta?"
        answer: "THE PELOPONNESIAN LEAGUE"
      - question: "Athens finally surrender?"
        answer: "The two inevitably clashed in the Peloponnesian War. In what year did // 404BC"
