      question: "What English verb for “show” comes from a Latin verb meaning “scatter”?"
      answer: "DISPLAY"
    boni:
      - question: "What is the Latin verb?"
        answer: "DISPLICO"
      - question: "What does the root verb plico mean?"
        answer: "FOLD"
