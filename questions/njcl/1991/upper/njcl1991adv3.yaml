      question: "Who was elected to four successive consulships in 87-84BC?"
      answer: "LUCIUS CORNELIUS CINNA"
    boni:
      - question: "How did Cinna acquire his second consulship?"
        answer: "DECLARED HIMSELF (ALONG WITH MARIUS) CONSUL AFTER MARCHING ON ROME"
      - question: "How did Cinna's third and fourth consulships come about?"
        answer: "HE REAPPOINTED HIMSELF"
