tournament: "NJCL Certamen"
year: 1991
division: "Advanced"
round: "Semifinals"
questions:
  - tossup:
      question: "What author served with Caesar in Africa and was the first governor of the the new province of Africa Nova?"
      answer: "SALLUST"
    boni:
      - question: "What humiliation had he undergone in 50BC?"
        answer: "EXPULSION FROM THE SENATE"
      - question: "Which of his monographs did he write first after his retirement from public office?"
        answer: "THE BELLUM CATILINAE"
  - tossup:
      question: "What Latin verb is the root of “leisure”?"
      answer: "LICEO"
    boni:
      - question: "What Latin adverb is the root of “asset”?"
        answer: "SATIS"
      - question: "What Latin verb is the root of “plea”?"
        answer: "PLACEO"
  - tossup:
      question: "What sister of Medea begged her to help the Argonauts?"
      answer: "CHALCIOPE"
    boni:
      - question: "Why?"
        answer: "CHALCIOPE'S FOUR CHILDREN HAD BEFRIENDED THE ARGONAUTS, ANGERING AEETES; ONLY WITH THE ARGONAUTS VICTORIOUS WOULD THEY ESCAPE HIS WRATH"
      - question: "Whom had Aeetes given Chalciope as a wife?"
        answer: "PHRIXUS"
  - tossup:
      question: ""
      answer: "Using an impersonal verb, say: “He pities his slaves.”"
    boni:
      - question: ""
        answer: "EUM SERVORUM MISERET."
      - question: "Say: “I am tired of school.” Say: “Are you ashamed of this crime?"
        answer: "ME SCHOLAE/LUDI TAEDET. // ” // PUDETNE TE HUIUS CRIMINIS/SCELERIS/FACINORIS"
  - tossup:
      question: ""
      answer: "Distinguish between the nouns habena and harena."
    boni:
      - question: ""
        answer: "HABENA = THONG HARENA = SAND"
      - question: ""
        answer: "Distinguish between sulcus and stultus. // SULCUS = FURROW STULTUS = FOOL // Distinguish between contio and cantio. // CONTIO = ASSEMBLY CANTIO = SONG, CHARM"
  - tossup:
      question: "What do the letters AUC stand for?"
      answer: "AB URBE CONDITA/ANNO URBIS CONDITAE"
    boni:
      - question: "What does the abbreviation q.v. stand for, and what does it mean?"
        answer: "QUOD VIDE = WHICH SEE"
      - question: "Op cit?"
        answer: "OPERE CITATO = IN THE WORK MENTIONED"
  - tossup:
      question: ""
      answer: "Name the emperor who defeated and captured Zenobia of Palmyra."
    boni:
      - question: ""
        answer: "AURELIAN"
      - question: "Aurelian defeated Tetricus in 273AD. Where had Tetricus tried to set up an independent kingdom? What title was given to Aurelian for his victories over Tetricus and Zenobia?"
        answer: "GAUL // RESTITUTOR ORBIS // ROUND A10, page 2"
  - tossup:
      question: "What was the mother city of the Syracusans?"
      answer: "CORINTH"
    boni:
      - question: "What word, still used in English for a great city, mean “mother city”?"
        answer: "METROPOLIS"
      - question: "What was the Tarentans' metropolis?"
        answer: "SPARTA"
  - tossup:
      question: "What Greek city was originally named Ephyra?"
      answer: "CORINTH"
    boni:
      - question: "What god originally gave Ephyra to his son to rule?"
        answer: "HELIOS (TO AEETES)"
      - question: "Aeetes' daughter, to rule as queen?"
        answer: "What king's death with no heir led the Corinthians to invite Medea, // CORINTHUS'"
  - tossup:
      question: "What Latin adjective is the root of the English word “viper”?"
      answer: "VIVUS"
    boni:
      - question: "What verb is the other root of “viper”?"
        answer: "PARIO, PARERE"
      - question: "What adjective is related to the noun coluber?"
        answer: "CELER"
  - tossup:
      question: "What author was born in 239BC in the Calabrian town of Rudiae?"
      answer: "ENNIUS"
    boni:
      - question: ""
        answer: "What striking expression did Ennius use to mean that he spoke Latin,"
      - question: "Oscan and Greek? What was the subject of his fabula praetexta?"
        answer: "THAT HE HAD THREE HEARTS // THE RAPE OF THE SABINE WOMEN"
  - tossup:
      question: ""
      answer: "Explain the difference between tesserae and tali."
    boni:
      - question: ""
        answer: "TESSERAE = SIX-SIDED DICE TALI = FOUR-SIDED KNUCKLE BONES"
      - question: "How many tali were normally used at one time? “Venus” was the best throw. What was that?"
        answer: "FOUR // EACH TALUS SHOWING A DIFFERENT FACE"
  - tossup:
      question: "Translate the question: Nonne Galli opprimuntur? AREN'T THE GAULS BEING CRUSHED?"
      answer: "or"
    boni:
      - question: "THE GAULS ARE BEING CRUSHED, AREN'T THEY? Translate: Num servi fugere conati sunt?"
        answer: ""
      - question: "THE SLAVES DIDN'T TRY TO ESCAPE, DID THEY? Translate: Num Vergilius magnum opus incensurus est? VERGIL ISN'T ABOUT TO BURN HIS MASTERPIECE, IS HE?"
        answer: "// undefined"
  - tossup:
      question: ""
      answer: "In which play by Euripides was a main character ripped to pieces by his"
    boni:
      - question: "mother?"
        answer: "THE BACCHAE"
      - question: "In which play did his stepmother fall in love with the title character? In which play did Menelaus allow Helen to give a defense of herself?"
        answer: "HIPPOLYTUS // THE TROJAN WOMEN"
  - tossup:
      question: ""
      answer: "In the Julio-Claudian family, what pair of brothers married mother and"
    boni:
      - question: "daughter?"
        answer: "CLAUDIUS AND GERMANICUS"
      - question: ""
        answer: "Name two children of Germanicus and his wife. // NERO CAESAR, DRUSUS CAESAR, GAIUS CAESAR (CALIGULA), DRUSILLA, // AGRIPPINA MINOR, LIVILLA (JULIA)"
  - tossup:
      question: "Vergil uses a syncopated verb form <emphasis>accestis</emphasis>. What is the prose norm?"
      answer: "ACCESSISTIS"
    boni:
      - question: "What poetic variant exists for <emphasis>sequeris</emphasis>?"
        answer: "SEQUERE"
      - question: "For <emphasis>deorum</emphasis>?"
        answer: "DEUM"
  - tossup:
      question: "Who was Odysseus' unfaithful goatherd?"
      answer: "MELANTHEUS"
    boni:
      - question: "Who was Melantheus' sister, also treacherous and mistress to one of the suitors?"
        answer: "MELANTHO"
      - question: "Who was their father, a loyal subject of Odysseus whose other six sons were also loyal?"
        answer: "DOLIUS"
  - tossup:
      question: ""
      answer: "What Greek chieftain fudged his promise of 50 ships for the Greek"
    boni:
      - question: "expedition to Troy by sending one real one and 49 little clay models?"
        answer: "CINYRAS"
      - question: "Myrrha? What offended deity had cursed Myrrha with a passion for her father?"
        answer: "Whom did Cinyras father in incestuous union with his own daughter // ADONIS // APHRODITE"
  - tossup:
      question: "What byform or alternative form exists for <emphasis>postremus</emphasis>?"
      answer: "POSTUMUS"
    boni:
      - question: ""
        answer: ""
      - question: "What byform exists for <emphasis>infimus</emphasis>? What byform exists for <emphasis>supremus</emphasis>?"
        answer: "IMUS // SUMMUS"
  - tossup:
      question: ""
      answer: "What author's <emphasis>Saturnalia</emphasis> is an important piece of Vergilian scholarship"
    boni:
      - question: "from antiquity?"
        answer: "MACROBIUS'"
      - question: "Who was Vergil's fourth-century AD biographer and commentator? What commentator of shortly thereafter used Donatus heavily?"
        answer: "AELIUS DONATUS // SERVIUS // #"
