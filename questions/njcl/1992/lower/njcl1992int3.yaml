questions:
  - tossup:
      question: "Who was the father-in-law Lavinia never met?"
      answer: "ANCHISES"
    boni:
      - question: "Who was her father?"
        answer: "LATINUS"
      - question: "Who was her original fiance?"
        answer: "TURNUS"
  - tossup:
      question: "What single English verb translates the idiom pedem referre?"
      answer: "RETREAT, WITHDRAW"
    boni:
      - question: "What Latin verb phrase translates the English “intend”?"
        answer: "IN ANIMO HABERE"
      - question: "How do you translate the idiom certiorem facere?"
        answer: "INFORM"
  - tossup:
      question: "Who was the blacksmith of the gods?"
      answer: "HEPHAESTUS/VULCAN"
    boni:
      - question: "Who was his divine wife?"
        answer: "APHRODITE/VENUS"
      - question: "Who was her divine lover?"
        answer: "ARES/MARS"
  - tossup:
      question: "What is the antonym of parvus?"
      answer: "MAGNUS (or a synonym)"
    boni:
      - question: "What is the adverb of parvus?"
        answer: "PARUM"
      - question: "What is the superlative of parum?"
        answer: "MINIME"
  - tossup:
      question: "Which of your teeth are named for the animal whose teeth they resemble?"
      answer: "CANINES"
    boni:
      - question: "Which of your teeth are the slicers?"
        answer: "INCISORS"
      - question: "Which are two-pointed?"
        answer: "BICUSPIDS"
  - tossup:
      question: ""
      answer: "Identify the case of the common noun in this famous line from Latin literature: Quo usque tandem abutere, Catilina, patientia nostra."
    boni:
      - question: ""
        answer: "ABLATIVE"
      - question: "Why is patientia ablative? What is the use of the ablative in this quote from Cicero: O fortunatam natam me consule Romam?"
        answer: "OBJECT OF SPECIAL VERB (UTOR) // ABLATIVE ABSOLUTE"
  - tossup:
      question: "Who was called from his plowing to be dictator of Rome?"
      answer: "(L. QUINCTIUS) CINCINNATUS"
    boni:
      - question: "What tribe had trapped a Roman army?"
        answer: "THE AEQUI"
      - question: "Where did the Romans defeat the Aequi?"
        answer: "MOUNT ALGIDUS"
  - tossup:
      question: "Which of the following verbs does <emphasis>not</emphasis> govern the dative: suadeo, iubeo, ignosco, parco?"
      answer: "IUBEO"
