      - question: "Make <emphasis>illud</emphasis> genitive."
        answer: "ILLIUS"
      - question: "Make <emphasis>illius</emphasis> feminine and dative."
        answer: "ILLI"
  - tossup:
      question: "A European capital sadly in the news this year is on the site of a Roman city named Singidunum. What is it now?"
      answer: "BELGRADE"
    boni:
      - question: "What province was this?"
        answer: "MOESIA"
      - question: "What did the Romans call the river Singidunum sat beside?"
        answer: "DANUVIUS"
  - tossup:
