      - question: ""
        answer: "Name a synonym for <emphasis>iubeo</emphasis> that does govern the dative."
      - question: ""
        answer: "MANDO, IMPERO"
  - tossup:
      question: "What is the neuter accusative singular of <emphasis>ille</emphasis>?"
      answer: "ILLUD"
