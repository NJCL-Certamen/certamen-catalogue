tournament: "NJCL Certamen"
year: 1992
division: "Advanced"
round: "Round 2"
questions:
  - tossup:
      question: "What trio in mythology were individually named Enyo, Pemphredo and Deino?"
      answer: "THE GRAEAE"
    boni:
      - question: "Who were their parents?"
        answer: "CETO AND PHORCYS"
      - question: "What other trio were their sisters?"
        answer: "THE GORGONS"
  - tossup:
      question: "After his victory in what battle did Augustus' troops force his appointment as consul?"
      answer: "MUTINA"
    boni:
      - question: "What region's importance did Augustus emphasize by living here for three years, from 15 to 13BC?"
        answer: "GAUL'S"
      - question: "What two areas were annexed as imperial provinces in 16 and 15BC?"
        answer: "RAETIA AND NORICUM"
  - tossup:
      question: "Make dem perfect."
      answer: "DEDERIM"
    boni:
      - question: "Make fracti erunt active."
        answer: "FREGERINT"
      - question: "Make partus sis active."
        answer: "PEPERERIS"
  - tossup:
      question: ""
      answer: "Some ceremonies required that the celebrant be patrimus et matrimus. Define that."
    boni:
      - question: ""
        answer: "WITH LIVING FATHER AND MOTHER"
      - question: "What did it mean when a woman was called by the adjective univira? That adjective applied to a Roman matron of honor at a wedding; what is the Latin term?"
        answer: "SHE HAD BEEN MARRIED ONLY ONCE // PRONUBA"
  - tossup:
      question: "What is the Latin word for “gold”?"
      answer: "AURUM"
    boni:
      - question: "For “silver”?"
        answer: "ARGENTUM"
      - question: "For “iron”?"
        answer: "FERRUM"
  - tossup:
      question: ""
      answer: "Using the adjective peritus, say “skilled in speaking.”"
    boni:
      - question: ""
        answer: "PERITUS LOQUENDI/DICENDI/FANDI"
      - question: ""
        answer: "Using the adjective fretus, say “relying on trickery.” // FRETUS DOLO // Using the adjective propinquus, say “near the forest.” // PROPINQUUS SILVAE"
  - tossup:
      question: "What Latin verb with what meaning is the root of “volatile”?"
      answer: "VOLO = FLY"
    boni:
      - question: "What tennis shot is from the same verb?"
        answer: "VOLLEY"
      - question: "What Latin verb is the root of “voluble”?"
        answer: "VOLVO"
  - tossup:
      question: "Who wrote an epic poem on Roman history called Annales?"
      answer: "ENNIUS"
    boni:
      - question: "What meter did he adapt from Greek poetry into Latin?"
        answer: "DACTYLIC HEXAMETER"
      - question: "Ennius' work made the transmission of Greek literature into Latin much easier. Who was his chief patron, and why is this ironic?"
        answer: "CATO THE ELDER, WHO SCORNED ALL THINGS GREEK"
  - tossup:
      question: "Which of these is from the Latin verb cado: decade, cavalcade, cascade, arcade?"
      answer: "CASCADE"
    boni:
      - question: "What is the meaning of the Latin noun at the basic root of “cavalcade”?"
        answer: "HORSE"
      - question: "What noun for gallantry is from the same root?"
        answer: "CHIVALRY"
  - tossup:
      question: "Where did the Romans suffer a disastrous defeat at the hands of the Cimbri and Teutones?"
      answer: "ARAUSIO"
    boni:
      - question: "Who finally defeated the Teutones?"
        answer: "MARIUS"
      - question: "In a battle where?"
        answer: "AQUAE SEXTIAE"
  - tossup:
      question: "Who wrote Dulce et decorum est pro patria mori?"
      answer: "HORACE"
    boni:
      - question: "What work is it from?"
        answer: "THE ODES"
      - question: "What is the line's meter?"
        answer: "ALCAIC"
  - tossup:
      question: "Spell periphrastic."
      answer: "P E R I P H R A S T I C"
    boni:
      - question: "Spell participle."
        answer: "P A R T I C I P L E"
      - question: "Spell pluperfect."
        answer: "P L U P E R F E C T"
  - tossup:
      question: "In English we have the idiom “pay the penalty.” What is the literal translation of the corresponding Latin idiom?"
      answer: "GIVE THE PENALTY"
    boni:
      - question: "What is the literal translation of the Latin idiom that means “inform”?"
        answer: "MAKE MORE CERTAIN"
      - question: "What is the literal translation of the military idiom that means “retreat”?"
        answer: "BRING BACK THE FOOT"
  - tossup:
      question: "On what occasion had Zeus made the night three nights long?"
      answer: "TO LIE WITH ALCMENA AND FATHER A GREAT HERO"
    boni:
      - question: "What treacherous Taphian princess had betrayed her father out of love for Amphitryon?"
        answer: "COMAETHO"
      - question: "What did Amphitryon do to repay her?"
        answer: "KILLED HER"
  - tossup:
      question: "What is the meaning of the Greek word element common to “orthodox” and “paradox”?"
      answer: "OPINION, THOUGHT"
    boni:
      - question: "What is the meaning of the Greek word element common to “pathetic” and “telepathy”?"
        answer: "FEELING, SENSE"
      - question: "What is the meaning of the Greek word element common to “hierarchy” and “hieroglyphic”?"
        answer: "HOLY, SACRED"
  - tossup:
      question: "Who was the deity accused in mythology’s first murder trial?"
      answer: "ARES"
    boni:
      - question: "Whom had he killed?"
        answer: "HALIRRHOTHIUS (SON OF POSEIDON)"
      - question: "Whom had Halirrhothius raped?"
        answer: "ALCIPPE (DAUGHTER OF ARES)"
  - tossup:
      question: "Who received command of Roman forces in Spain in 210BC?"
      answer: "P. CORNELIUS SCIPIO (AFRICANUS MAJOR)"
    boni:
      - question: "Where did he defeat Hamilcar Barca in 208BC?"
        answer: "BAECULA"
      - question: "What battle in 206BC established Roman dominion in Spain?"
        answer: "ILIPA"
  - tossup:
      question: "Where was Livy born?"
      answer: "PATAVIUM"
    boni:
      - question: "Where did Vergil die?"
        answer: "BRUNDISIUM"
      - question: "In what year was Ovid born?"
        answer: "43BC"
  - tossup:
      question: "Which Roman author stood trial for bewitching a woman?"
      answer: "APULEIUS"
    boni:
      - question: "What was the title of his most famous work, a novel?"
        answer: "THE GOLDEN ASS (or ASINUS AUREUS or METAMORPHOSES)"
      - question: "What two characters from mythology are prominently featured in Books IV through VI?"
        answer: "CUPID AND PSYCHE"
  - tossup:
      question: "Where did the judgment of Paris take place?"
      answer: "MT. IDA"
    boni:
      - question: "What was Paris doing there?"
        answer: "TENDING SHEEP"
      - question: "Who was the wife Paris deserted?"
        answer: "OENONE // #"
