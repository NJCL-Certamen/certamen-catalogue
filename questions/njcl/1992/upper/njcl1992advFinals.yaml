tournament: "NJCL Certamen"
year: 1992
division: "Advanced"
round: "Finals"
questions:
  - tossup:
      question: "What ancient priestly college of 12 members was restored by Augustus and included men from Rome’s most important families?"
      answer: "THE ARVAL BROTHERHOOD"
    boni:
      - question: "In what deity‘s honor was their festival celebrated every May?"
        answer: "DEA DIA"
      - question: "What hymn of the brothers, dating from the fifth century BC, is even in its poorly restored form a valuable example of very early Latin?"
        answer: "THE CARMEN ARVALE"
  - tossup:
      question: "What did the Romans call their pound, the basic unit of weight?"
      answer: "LIBRA"
    boni:
      - question: "What were its twelve subdivisions?"
        answer: "UNCIAE"
      - question: "What monetary unit was originally meant to be one pound of bronze?"
        answer: "THE AS"
  - tossup:
      question: "What type of dependent subjunctive is illustrated in oderint dum metuant?"
      answer: "PROVISO"
    boni:
      - question: ""
        answer: "Besides dum, name an introductory word for a proviso clause."
      - question: ""
        answer: "MODO, DUMMODO, TANTUM UT // Name another."
  - tossup:
      question: "What is the meaning of the Greek word element common to “episode” and “period”?"
      answer: "ROAD"
    boni:
      - question: "Common to “cinema” and “kinetic”?"
        answer: "MOVEMENT, MOTION"
      - question: "Common to “analgesic” and “nostalgia”?"
        answer: "PAIN"
  - tossup:
      question: "In what Latin work do you find the opening line Tityre, tu patulae recubans sub tegmine fagi?"
      answer: "THE ECLOGUES"
    boni:
      - question: "Where does Vergil use the line again, altering it significantly to: Tityre, te patulae cecini sub tegmine fagi?"
        answer: "THE FINAL LINE OF THE GEORGICS"
      - question: "What poem does he begin: Sicelides Musae, paulo maiora canamus?"
        answer: "THE FOURTH (MESSIANIC) ECLOGUE // ROUND A100, page 2"
  - tossup:
      question: "What governor of Syria in 175AD had himself proclaimed emperor because he thought the real emperor had died?"
      answer: "C. AVIDIUS CASSIUS"
    boni:
      - question: "Who was the emperor, reports of whose death were greatly exaggerated?"
        answer: "M. AURELIUS"
      - question: "What wife of Marcus Aurelius was in some accounts in cahoots with Avidius?"
        answer: "FAUSTINA (FAUSTINA MINOR)"
  - tossup:
      question: "What author wrote lost works entitled Chronica and Exempla?"
      answer: "NEPOS"
    boni:
      - question: "What is the title of Nepos' only surviving work?"
        answer: "DE VIRIS ILLUSTRIBUS"
      - question: "Name an illustrious Roman subject of a Nepos biography longer than the brief ones in that work."
        answer: "CICERO or CATO THE CENSOR"
  - tossup:
      question: "According to one source, Heracles had made which of the Greek chieftains at Troy invulnerable to weapons by wrapping him in his lionskin?"
      answer: "AJAX THE GREATER"
    boni:
      - question: "According to this source, how then did Ajax die?"
        answer: "THE TROJANS BURIED HIM ALIVE"
      - question: "According to another source, how did Achilles' armor ultimately go to Ajax after all?"
        answer: "WHEN ODYSSEUS' SHIP WAS WRECKED, IT WASHED ASHORE AT AJAX' TOMB"
  - tossup:
      question: "Make the form bobus singular."
      answer: "BOVE or BOVI"
    boni:
      - question: "Make nummum singular."
        answer: "NUMMI"
      - question: "Make suis plural."
        answer: "SUUM"
  - tossup:
      question: "What first century AD author's twelve-book work on agriculture has Book X in verse as a tribute to Vergil?"
      answer: "COLUMELLA"
    boni:
      - question: ""
        answer: "COLUMELLA"
      - question: "What is the topic of Book X? What is the title of the work?"
        answer: "GARDENING // DE RE RUSTICA"
  - tossup:
      question: "From whose blood did Medea make the magic drug that protected Jason?"
      answer: "PROMETHEUS'"
    boni:
      - question: "At what deity's shrine did Jason and Medea first meet?"
        answer: "HECATE'S"
      - question: "What nephew of Medea, an Argonaut, led Jason there?"
        answer: "ARGUS // ROUND A100, page 3"
  - tossup:
      question: "Where are the Aeneadae when they fulfill a prophecy and invent pizza at the same time?"
      answer: "ON THE SHORES OF THE TIBER IN LATIUM"
    boni:
      - question: "Whose prophecy was it?"
        answer: "THE HARPY CELAENO’S (or ANCHISES’)"
      - question: "Who pointed out to Aeneas that the prophecy was now fulfilled?"
        answer: "ASCANIUS"
  - tossup:
      question: "What spiteful daughter did Eris bear to Zeus?"
      answer: "ATE"
    boni:
      - question: "How did Zeus punish Ate for the trick she played on him at the time of Heracles’ birth?"
        answer: "FLUNG HER FROM OLYMPUS (MADE HER LIVE AMONG MORTALS)"
      - question: "What set of his daughters did Zeus send to follow her around so mortals would have some recourse after her mischief?"
        answer: "THE LITAI (PRAYERS)"
  - tossup:
      question: ""
      answer: "I sub mensam et plaude."
    boni:
      - question: ""
        answer: "PLAYER SHOULD CLIMB BENEATH THE TABLE AND CLAP."
      - question: ""
        answer: "Coniungite omnes manus et pulsate solum pedibus. // TEAM SHOULD JOIN HANDS AND POUND THE FLOOR. // Pulsate mala ambabus manibus. // PLAYERS SHOULD BEAT THEIR CHEEKS WITH BOTH HANDS."
  - tossup:
      question: "What Roman general was Sulla’s primary military opponent in 83-82BC?"
      answer: "CN. PAPIRIUS CARBO"
    boni:
      - question: "Beneath the walls of what city did Sulla defeat Carbo‘s 70,000 Samnite allies in 82BC?"
        answer: "ROME"
      - question: "Which two members of the First Triumvirate aided Sulla in this campaign?"
        answer: "CRASSUS AND POMPEY"
  - tossup:
      question: "The word “gypsy” is a corruption of the Latin adjective that tells where gypsies were mistakenly thought to come from. Where was that?"
      answer: "EGYPT"
    boni:
      - question: "What island in the Caribbean means “bearded” because Columbus observed tufts of moss growing on its trees?"
        answer: "BARBADOS"
      - question: "What island group in the Mediterranean has a name derived from the Greek verb for “throw” because its natives were awesome slingmen?"
        answer: "THE BALEARIC ISLANDS"
  - tossup:
      question: "What official at Athens marked the year with his name, as consuls did later in Rome?"
      answer: "THE EPONYMOUS ARCHON"
    boni:
      - question: "For five points each, what were the titles of the other two archons?"
        answer: "ARCHON BASILEUS and POLEMARCH"
  - tossup:
      question: "What was Livius Andronicus' birthplace?"
      answer: "TARENTUM"
    boni:
      - question: "In what year did the Romans capture Tarentum, precipitating Livius' removal to Rome?"
        answer: "272BC"
      - question: "For the Ludi Romani of what year did Livius write the first Roman comedy and the first Roman tragedy?"
        answer: "240BC"
  - tossup:
      question: "What two Latin prepositions are the root of the English verb “advance”?"
      answer: "AB AND ANTE"
    boni:
      - question: "What Latin adjective is the root of “adulterate”?"
        answer: "ALTER"
      - question: "What Latin verb is the root of “alloy”?"
        answer: "LIGO"
  - tossup:
      question: "What is the meaning of the legal idiom censum habere?"
      answer: "TAKE A CENSUS, MAKE A COUNT"
    boni:
      - question: ""
        answer: "Give the meanings of these Ciceronian idioms:"
      - question: "<emphasis>uno ore.</emphasis> <emphasis>causam dicere.</emphasis>"
        answer: "UNANIMOUSLY // TO PLEAD A CASE // #"
