tournament: "NJCL Certamen"
year: 1993
division: "Advanced"
round: "Round 1"
questions:
  - tossup:
      question: "What was the Latin word for divination by the behavior of birds?"
      answer: "AUSPICIUM (AUGURIUM)"
    boni:
      - question: "Who were the public figures who interpreted the flights of birds?"
        answer: "AUGURS"
      - question: "Who were the public figures who interpreted the entrails of slaughtered animals?"
        answer: "HARUSPICES"
  - tossup:
      question: "What was the name of the spear a Roman soldier used mainly for thrusting?"
      answer: "HASTA"
    boni:
      - question: "What was the spear he threw?"
        answer: "PILUM"
      - question: "What would be the weapon of troops called funditores?"
        answer: "SLINGS"
  - tossup:
      question: "Who was the father of the Minotaur?"
      answer: "THE CRETAN BULL"
    boni:
      - question: "Who was the Minotaur's mother?"
        answer: "PASIPHAE"
      - question: "Who was Pasiphae's husband?"
        answer: "MINOS"
  - tossup:
      question: "To what historian are we indebted for the most detailed account of the conspiracy of Catiline?"
      answer: "C. SALLUSTIUS CRISPUS"
    boni:
      - question: "What political leader was Sallust's protector and sponsor?"
        answer: "JULIUS CAESAR"
      - question: "Of what province was Sallust the first governor?"
        answer: "AFRICA NOVA"
  - tossup:
      question: ""
      answer: "Distinguish in meaning between the nouns quercus and querella."
    boni:
      - question: ""
        answer: "QUERCUS = OAK TREE QUERELLA = COMPLAINT, MALADY"
      - question: "Distinguish in meaning between the nouns gutta and guttur."
        answer: "GUTTA=DROP GUTTUR=THROAT // Distinguish in meaning between the nouns aper and apis. // APER = BOAR APIS = BEE"
  - tossup:
      question: ""
      answer: "In the sentence, “My brother is in the country, but is coming home tomorrow,” translate the words “home” and “country.” DOMUM, RURI (RURE with explanation)"
    boni:
      - question: ""
        answer: "Do the same for the sentence, “I'm at home now but tomorrow I'm going to the country.”"
      - question: ""
        answer: "DOMI, RUS // In the sentence, “We're going to Rome to sit on the ground,” translate “Rome” and “ground.” // ROMAM, HUMI // ROUND A1, page 2"
  - tossup:
      question: "Who was the Macedonian ruler who died in Babylon?"
      answer: "ALEXANDER THE GREAT"
    boni:
      - question: "Who was his mother?"
        answer: "OLYMPIAS"
      - question: "What was his horse's name?"
        answer: "BUCEPHALUS"
  - tossup:
      question: "Si essem Cerberus, quot capita mihi essent?"
      answer: "TRIA"
    boni:
      - question: "Si essem Argus naupegus, quot oculi mihi essent?"
        answer: "DUO"
      - question: "Si essem Argus custos, quot oculi mihi essent?"
        answer: "CENTUM"
  - tossup:
      question: "What is Ovid's longest work?"
      answer: "THE METAMORPHOSES"
    boni:
      - question: "How many books are in it?"
        answer: "FIFTEEN"
      - question: "What meter is it in?"
        answer: "DACTYLIC HEXAMETER"
  - tossup:
      question: "Spell Mnemosyne."
      answer: "M N E M O S Y N E"
    boni:
      - question: "Spell Terpsichore."
        answer: "T E R P S I C H O R E"
      - question: "Spell Calliope."
        answer: "C A L L I O P E"
  - tossup:
      question: "What is the contracted version of futurum esse?"
      answer: "FORE"
    boni:
      - question: "What infinitive contracts to nosse?"
        answer: "NOVISSE"
      - question: "What infinitive contracts to cresse?"
        answer: "CREVISSE"
  - tossup:
      question: "The name of what poetic format comes from sonus?"
      answer: "SONNET"
    boni:
      - question: "What kind of contest or exhibition comes from pagina?"
        answer: "PAGEANT"
      - question: "What Latin verb is the root of “menu”?"
        answer: "MINUO"
  - tossup:
      question: ""
      answer: "What Greek hero's name came from the eagle who heralded"
    boni:
      - question: "his birth?"
        answer: "AJAX'"
      - question: "an answer to? great shield?"
        answer: "Whose prayer that Telamon have a brave son was the eagle // HERACLES' // What half-brother often fought from the shelter of Ajax' // TEUCER"
  - tossup:
      question: ""
      answer: "What is the meaning of the Greek word element common to"
    boni:
      - question: "“chronological” and “synchronize”?"
        answer: "TIME"
      - question: "“synchronize” and “synthesis”? “synthesis” and “parenthetical”?"
        answer: "What is the meaning of the Greek word element common to // WITH, TOGETHER // What is the meaning of the Greek word element common to // PUT, PLACE"
  - tossup:
      question: "As the Aeneid tells us early on, what place is second only to Carthage in Juno's affection?"
      answer: "SAMOS"
    boni:
      - question: "For five points each, what two things are said to be found as proof of her devotion?"
        answer: "WEAPONS AND CHARIOT"
      - question: ""
        answer: "116f: <latin>hic illius arma</latin> // <latin>hic currus fuit</latin>"
  - tossup:
      question: "To what tribe did Orgetorix belong?"
      answer: "HELVETIANS"
    boni:
      - question: "To what tribe did Vercingetorix belong?"
        answer: "ARVERNI"
      - question: "To what tribe did Dumnorix belong?"
        answer: "AEDUI"
  - tossup:
      question: "Who was told to look for a sow suckling 30 white piglets?"
      answer: "AENEAS"
    boni:
      - question: "Who told him to do so?"
        answer: "HELENUS"
      - question: "What was he to do when he saw this?"
        answer: "SETTLE"
  - tossup:
      question: "Pompey the Great built Rome's first permanent theatre in 55BC; fifty years later, how many more were there?"
      answer: "TWO (both built in 13BC)"
    boni:
      - question: "What philanthropist, a naturalized Roman, built the smaller one?"
        answer: "L. CORNELIUS BALBUS"
      - question: "For whom was the larger one named?"
        answer: "MARCELLUS"
  - tossup:
      question: "What Latin verb with what meaning is the root of “beverage”?"
      answer: "BIBO = DRINK"
    boni:
      - question: "What Latin verb with what meaning is the root of “leverage”?"
        answer: "LEVO = LIFT, RAISE"
      - question: "What Latin verb with what meaning is the root of “coverage”?"
        answer: "OPERIO (APERIO) = OPEN"
  - tossup:
      question: "“For how long, Catiline, will you --” What is a sudden stop midsentence called in rhetoric or poetry?"
      answer: "APOSIOPESIS"
    boni:
      - question: "What is the opening section of an oration, meant to grab the audience?"
        answer: "EXORDIUM (or PRINCIPIUM)"
      - question: "What section concludes an oration?"
        answer: "PERORATIO (or CONCLUSIO) // #"
