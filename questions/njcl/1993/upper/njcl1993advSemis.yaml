tournament: "NJCL Certamen"
year: 1993
division: "Advanced"
round: "Semifinals"
questions:
  - tossup:
      question: "What derivative of gratia means “free, at no charge”?"
      answer: "GRATIS"
    boni:
      - question: "What related adjective means “uncalled for, without cause or justification”?"
        answer: "GRATUITOUS"
      - question: "What related noun means “tip”?"
        answer: "GRATUITY"
  - tossup:
      question: "What deity had the epithet Polydegmon, “the hospitable one”?"
      answer: "HADES/DIS"
    boni:
      - question: "What epithet of Hermes meant “the conductor of souls”?"
        answer: "PSYCHOPOMPUS"
      - question: "What epithet of Hermes meant “the slayer of Argus”?"
        answer: "ARGEIPHONTES"
  - tossup:
      question: "What war was ended by the Treaty of Dardanus in 85BC?"
      answer: "FIRST MITHRIDATIC"
    boni:
      - question: ""
        answer: "Whose actions as Sulla's legate in Asia caused the"
      - question: "Second Mithridatic War? What precipitated the Third Mithridatic War?"
        answer: "L. LICINIUS MURENA'S // ROME'S DECISION TO ANNEX BITHYNIA (bequeathed to // Rome by Nicomedes IV)"
  - tossup:
      question: ""
      answer: "Of what genre are <latin>Cyclops</latin> and <latin>Ichneutai</latin> the only"
    boni:
      - question: "surviving examples?"
        answer: "SATYR PLAYS"
      - question: "Who wrote <latin>Cyclops</latin>? Who wrote <latin>Ichneutai</latin>?"
        answer: "EURIPIDES // SOPHOCLES"
  - tossup:
      question: ""
      answer: "Name an English verb meaning “get rid of” and the Latin"
    boni:
      - question: ""
        answer: "noun for “threshold” it comes from."
      - question: ""
        answer: "ELIMINATE FROM LIMEN // Name these other derivatives of limen: // “early, elementary, preparatory” PRELIMINARY // “subtle, suggested, insinuated” SUBLIMINAL"
  - tossup:
      question: ""
      answer: "What case would you need for the noun “father” in this"
    boni:
      - question: ""
        answer: "sentence: “I persuaded my father's friend to come to"
      - question: "dinner”? What case would you need for “friend”? he would come”?"
        answer: "GENITIVE // DATIVE // What case would you need for “me” in “He promised me // ACCUSATIVE // ROUND A10, page 2"
  - tossup:
      question: "What was the <latin>nomen</latin> of Tutor, Sabinus and Classicus, who led a revolt in Gaul in 70AD?"
      answer: "JULIUS"
    boni:
      - question: "Who defeated them?"
        answer: "Q. PETILIUS CERIALIS"
      - question: "What other rebel on the Rhine frontier did Cerialis defeat?"
        answer: "JULIUS CIVILIS"
  - tossup:
      question: "What poet called his work <latin>nugae</latin>?"
      answer: "CATULLUS"
    boni:
      - question: "What poet said his muse was his <latin>venter</latin> - his belly?"
        answer: "PERSIUS"
      - question: "Who called his work a <latin>lepidum novum libellum</latin>?"
        answer: "CATULLUS"
  - tossup:
      question: "What patron is addressed in the opening lines of <latin>De Rerum Natura</latin>?"
      answer: "C. MEMMIUS"
    boni:
      - question: "What author of a lost epic <latin>Zmyrna</latin> was also in Memmius’ circle?"
        answer: "HELVIUS CINNA"
      - question: "The daughter of what prominent Roman did Memmius marry?"
        answer: "SULLA’S"
  - tossup:
      question: "What wondrous object did Thyestes produce to win the throne of Mycenae over his brother Atreus?"
      answer: "A GOLDEN FLEECE"
    boni:
      - question: "What deity had sent the golden lamb to test Atreus’ piety?"
        answer: "ARTEMIS/DIANA"
      - question: "What marvel did Atreus with Zeus’ help produce to win the throne away from Thyestes?"
        answer: "THE SUN TRAVELED BACKWARD // (or THE PLEIADES CHANGED COURSE)"
  - tossup:
      question: "Who turned into a sunflower out of unrequited love for Apollo?"
      answer: "CLYTIË"
    boni:
      - question: "Who turned into poplars out of grief over their dead brother?"
        answer: "THE SISTERS OF PHAETHON"
      - question: "Who was turned into a grasshopper by his lover Aurora?"
        answer: "TITHONUS"
  - tossup:
      question: "What priestess of Athena at Tegea, pledged to perpetual virginity, was seduced by Heracles?"
      answer: "AUGE"
    boni:
      - question: "Who was their son?"
        answer: "TELEPHUS"
      - question: "What king of Mysia later married Auge and by coincidence adopted Telephus?"
        answer: "TEUTHRAS"
  - tossup:
      question: "To what age did Cicero's wife Terentia live?"
      answer: "YEARS"
    boni:
      - question: "After her divorce from Cicero in 48BC, what other author was her next husband?"
        answer: "SALLUST"
      - question: "To what other literary figure was she married after Sallust?"
        answer: "MESSALA CORVINUS"
  - tossup:
      question: "What was the first Greek colony on mainland Italy?"
      answer: "CUMAE (c750BC)"
    boni:
      - question: "What tyrant of Cumae defeated the Etruscans twice and harbored Tarquinius Superbus?"
        answer: "ARISTODEMUS"
      - question: "After what battle did Tarquinius Superbus seek this asylum?"
        answer: "THE BATTLE OF LAKE REGILLUS"
  - tossup:
      question: ""
      answer: "Translate into English: Cum beneficia deorum praedicta essent, populus laetatus est."
    boni:
      - question: ""
        answer: "WHEN THE GODS' BLESSINGS HAD BEEN FORETOLD, THE PEOPLE REJOICED."
      - question: ""
        answer: "Change the dependent clause to an ablative absolute. // BENEFICIIS DEORUM PRAEDICTIS // Change the independent clause to use a semi-deponent verb. // POPULUS GAVISUS EST."
  - tossup:
      question: "What is the meaning of the Greek word element common to “bucolic” and “butter”?"
      answer: "COW"
    boni:
      - question: "What is the meaning of the Greek word element common to “glossary” and “polyglot”?"
        answer: "TONGUE"
      - question: "What is the meaning of the Greek word element common to “athlete” and “pentathlon”?"
        answer: "PRIZE"
  - tossup:
      question: ""
      answer: "Translate the subjunctive clause in this sentence:"
    boni:
      - question: ""
        answer: "“He raised his shield in order not to be wounded.”"
      - question: "In this sentence: “He raised his shield quickly enough that he was not wounded.” In this sentence: “You should raise your shield lest anyone wound you.”"
        answer: "NE VULNERARETUR (LAEDERETUR, etc) // UT NON VULNERARETUR // NE QUIS TE VULNERET"
  - tossup:
      question: "What is the trade of a libitinarius?"
      answer: "UNDERTAKER"
    boni:
      - question: "What is the Latin word for a public funeral oration?"
        answer: "LAUDATIO"
      - question: "What was the place, separate from the grave, where a corpse was cremated?"
        answer: "USTRINA"
  - tossup:
      question: "Most third-declension nouns with the nominative singular ending -or are masculine. Name two that are not."
      answer: "SOROR, UXOR, ARBOR, COR, MARMOR, AEQUOR"
    boni:
      - question: ""
        answer: "Name two more."
      - question: ""
        answer: "Name two more."
  - tossup:
      question: "What did a <latin>lanista</latin> do for a living?"
      answer: "TRAINED GLADIATORS"
    boni:
      - question: "What was a lanius?"
        answer: "BUTCHER/EXECUTIONER"
      - question: "What was a leno?"
        answer: "PIMP // #"
