tournament: "NJCL Certamen"
year: 1994
division: "Intermediate"
round: "Finals"
questions:
  - tossup:
      question: "How many enemy dead were necessary for a Roman general's triumph?"
      answer: "FIVE THOUSAND"
    boni:
      - question: "What was the Latin name of the toga which the triumphator wore?"
        answer: "TOGA PICTA"
      - question: "What was the tribute given to a general who fell short of the requirements for a triumph?"
        answer: "OVATIO"
  - tossup:
      question: "What son of Priam was a seer?"
      answer: "HELENUS"
    boni:
      - question: ""
        answer: "For five points each, name two events he told the Greeks must occur for them to take Troy."
      - question: ""
        answer: "1) THEY MUST STEAL THE PALLADIUM. // 2) THEY MUST BRING PELOPS' BONES TO TROY. // 3) NEOPTOLEMUS MUST JOIN THE ARMY. // 4) PHILOCTETES MUST REJOIN THE ARMY AND BRING HERACLES' WEAPONS WITH HIM. // 5) THEY MUST BUILD THE HORSE."
  - tossup:
      question: "What region of Asia Minor was bequeathed to Rome by its king Nicomedes IV?"
      answer: "BITHYNIA"
    boni:
      - question: "With what neighboring region was it combined as a senatorial province?"
        answer: "PONTUS"
      - question: "What emperor made the area an imperial province?"
        answer: "MARCUS AURELIUS"
  - tossup:
      question: "What is the meaning of the Greek adjective at the root of “gymnasium”?"
      answer: "NAKED"
    boni:
      - question: "What is the meaning of the Greek adjective at the root of the trade name “Xerox”?"
        answer: "DRY"
      - question: "What is the meaning of the Greek noun in the first half of “xylophone”?"
        answer: "WOOD"
  - tossup:
      question: "The Etruscans' defeat in what battle marked the end of Etruscan power in Latium?"
      answer: "ARICIA"
    boni:
      - question: "Who was the Etruscan commander?"
        answer: "LARS PORSENNA (ARRUNS)"
      - question: "What battle a few years later pitted the Romans against their former Latin allies?"
        answer: "LAKE REGILLUS"
  - tossup:
      question: ""
      answer: "Distinguish in meaning between the verbs <latin>pando</latin> and <latin>pendo</latin>."
    boni:
      - question: ""
        answer: "PANDO = STRETCH OUT, OPEN, EXPAND"
      - question: "What do <latin>pando</latin> and <latin>patior</latin> have in common?"
        answer: "PENDO = HANG, SUSPEND (USED TRANSITIVELY!) // Distinguish in meaning between the verbs <latin>patior</latin> and <latin>potior</latin>. // PATIOR = SUFFER, ALLOW, PERMIT // POTIOR = GAIN POSSESSION OF // THE PRINCIPAL PART PASSUS"
  - tossup:
      question: ""
      answer: "Translate the verb in: “If only I had written that letter to my parents!”"
    boni:
      - question: ""
        answer: "SCRIPSISSEM"
      - question: "Translate the verb in: “If only I knew that cute boy's name!” Translate the verb in: “If only my teacher had taught me about contrary-to-fact wishes!”"
        answer: "COGNOSCEREM/SCIREM // DOCUISSET"
  - tossup:
      question: "What god lustfully pursued Juturna?"
      answer: "JUPITER/ZEUS"
    boni:
      - question: "Where did she hide from him?"
        answer: "BENEATH THE WATERS OF THE TIBER"
      - question: "When other local nymphs were helping Jupiter find her, what gossipy nymph blabbed to Juno about what he was up to?"
        answer: "LARA"
  - tossup:
      question: "What type of subjunctive would you illustrate if you said, “Oh, whatever shall I do?"
      answer: "”"
    boni:
      - question: ""
        answer: "DELIBERATIVE"
      - question: "When God said <latin>Fiat lux</latin>, what sort of independent subjunctive was He or She using? What type is <latin>di duint</latin>?"
        answer: "JUSSIVE or HORTATORY or OPTATIVE // OPTATIVE/JUSSIVE"
  - tossup:
      question: ""
      answer: "Translate the idiom <latin>potestatem facere</latin>."
    boni:
      - question: ""
        answer: "PROVIDE AN OPPORTUNITY, MAKE POSSIBLE"
      - question: ""
        answer: "Translate the idiom <latin>imperata facere</latin>. // CARRY OUT ORDERS, OBEY COMMANDS // Translate the idiom <latin>personam gerere</latin>. // PLAY A PART, ACT A ROLE, PORTRAY A CHARACTER // Round B100, Page 3"
  - tossup:
      question: "Who mediated the dispute over Adonis between Aphrodite and Persephone?"
      answer: "CALLIOPE"
    boni:
      - question: "Unhappy with her Solomonic solution, how did Aphrodite punish Calliope?"
        answer: "CAUSED HER SON ORPHEUS' DEATH"
      - question: "What metamorphosis did Aphrodite cause when Adonis was killed by a boar?"
        answer: "THE ANEMONE GREW FROM HIS BLOOD"
  - tossup:
      question: "What Ithacan seer foretold Odysseus' return, even after so many years?"
      answer: "HALITHERSES"
    boni:
      - question: "What visiting seer, on the day of the suitors' slaughter, told them of their imminent doom?"
        answer: "THEOCLYMENUS"
      - question: "What was Halitherses unable to do after the suitors' death?"
        answer: "PERSUADE THEIR KINSMEN NOT TO SEEK VENGEANCE"
  - tossup:
      question: "What Latin noun is the root of the English noun “aisle” (spell)?"
      answer: "ALA"
    boni:
      - question: "What is the root of “isle” (spell)?"
        answer: "INSULA"
      - question: "What two verbs, both meaning “separate” and “segregate,” come from insula?"
        answer: "INSULATE AND ISOLATE"
  - tossup:
      question: "What prince of Thebes, during the siege of the Seven against Thebes, threw himself off the city walls to appease Ares' anger?"
      answer: "MENOECEUS (or MEGAREUS)"
    boni:
      - question: "Why was Ares angry at the Theban royal house?"
        answer: "CADMUS HAD KILLED HIS SACRED SERPENT"
      - question: "Ares' curse demanded that a man be sacrificed. What had to be true of the victim?"
        answer: "HE HAD TO BE A VIRGIN AND/OR HE HAD TO BE DESCENDED FROM THE SPARTOI"
  - tossup:
      question: "What name is given to the series of wars fought in a two-century period over the independence of Delphi?"
      answer: "THE SACRED WARS"
    boni:
      - question: "How many were there?"
        answer: "THREE"
      - question: "Whose intervention ended the third and largest of the Sacred Wars?"
        answer: "PHILIP II'S (OF MACEDON) // Round B100, Page 4"
  - tossup:
      question: "In his notorious purchase at auction of the Roman throne, how much did Didius Julianus promise to pay each pretorian?"
      answer: "25,000 SESTERCES"
    boni:
      - question: "Whom did he outbid for the throne?"
        answer: "SULPICIANUS (the <latin>praefectus urbi</latin> and father-in-law of the just-deceased emperor Pertinax)"
      - question: "Who marched on Rome and succeeded Didius Julianus?"
        answer: "SEPTIMIUS SEVERUS"
  - tossup:
      question: "Change <latin>creverim</latin> to imperfect."
      answer: "CERNEREM or CRESCEREM"
    boni:
      - question: "Change <latin>cernerem/crescerem</latin> to present."
        answer: "CERNAM/CRESCAM"
      - question: "Change <latin>cernam/crescam</latin> to pluperfect."
        answer: "CREVISSEM"
  - tossup:
      question: "When universities bestow special degrees on prominent citizens, the recipient can put the degree after his/her name with the initials <latin>h.c.</latin> What Latin phrase with what meaning does that stand for?"
      answer: "HONORIS CAUSĀ = FOR HONOR'S SAKE, HONORARY"
    boni:
      - question: ""
        answer: "What Latin phrase with what meaning is abbreviated <latin></latin>D."
  - tossup:
      question: "<latin></latin>?"
      answer: "DEO VOLENTE - (WITH) GOD WILLING"
    boni:
      - question: "What related Latin phrase with what meaning is abbreviated <latin>D.G.</latin>?"
        answer: "DEI GRATIA = BY THE GRACE OF GOD"
  - tossup:
      question: "What Latin noun is the root of “chef”?"
      answer: "CAPUT"
    boni:
      - question: "Before you eat the meal the chef cooks, you must be seated by the maitre d'. What Latin noun is the root of that?"
        answer: "MAGISTER"
      - question: "Maitre d' is the shortened form of a French phrase, <latin>maitre d'hotel</latin>, that means “master of the inn.” What Latin noun for “guest” is the root of the French word for “inn”?"
        answer: "HOSPES"
  - tossup:
      question: "Change <latin>dem</latin> to pluperfect."
      answer: "DEDISSEM"
    boni:
      - question: "Change <latin>dedissem</latin> to imperfect."
        answer: "DAREM"
      - question: "Change <latin>darem</latin> to passive."
        answer: "DARER // #"
