tournament: "NJCL Certamen"
year: 1994
division: "Intermediate"
round: "Semifinals"
questions:
  - tossup:
      question: "What official selected the Vestal Virgins?"
      answer: "THE PONTIFEX MAXIMUS"
    boni:
      - question: "With what words did he tap a candidate?"
        answer: "TE, AMATA, CAPIO"
      - question: "How many Vestal Virgins were there in historic times?"
        answer: "SIX"
  - tossup:
      question: ""
      answer: "During the Trojan War, who was the first Greek to walk on"
    boni:
      - question: "Trojan soil and thus the first to die there?"
        answer: "PROTESILAUS"
      - question: "Who was his wife? What concession did Hermes make to her?"
        answer: "LAODAMIA (or POLYDORA) // (THE GHOST OF) // PROTESILAUS WAS ALLOWED TO VISIT HER FOR THREE HOURS; SHE // KILLED HERSELF WHEN HE LEFT (OR WAS ALLOWED TO DIE)"
  - tossup:
      question: "Cui deo vinum sacrum erat?"
      answer: "BACCHO/LIBERO/DIONYSO"
    boni:
      - question: "Qui deus currum solis agebat?"
        answer: "APOLLO/HELIOS/SOL"
      - question: "Quae dea lunae soror Apollinis erat?"
        answer: "DIANA/ARTEMIS"
  - tossup:
      question: ""
      answer: "What Latin correlative pair would be needed to say, “Your"
    boni:
      - question: "team is as smart as that one”?"
        answer: "TAM...QUAM"
      - question: "To say, “Our school is as big as yours”? To say, “We practice as often as you do”?"
        answer: "TANTUS...QUANTUS // TOTIENS...QUOTIENS"
  - tossup:
      question: "What city gave its name to Campania?"
      answer: "CAPUA"
    boni:
      - question: "What people founded Capua?"
        answer: "THE ETRUSCANS"
      - question: "linking Capua and Rome?"
        answer: "In what year did construction begin on the Appian Way, // 312BC"
  - tossup:
      question: ""
      answer: "“Flower” (spell) of course is related to <latin>flos</latin>. What"
    boni:
      - question: "Latin noun is the root of “flour”?"
        answer: "FLOS"
      - question: "What Latin verb is the root of “devour”? What Latin verb is the root of “devout”?"
        answer: "(DE) VORO, VORARE // (DE) VOVEO, VOVERE // Round B10, Page 2"
  - tossup:
      question: "Who was the second wife of Septimius Severus?"
      answer: "JULIA DOMNA"
    boni:
      - question: "Who was the mother of Severus Alexander?"
        answer: "JULIA MAMAEA (or JULIA AVITA MAMAEA)"
      - question: "Who was the mother of Elagabalus?"
        answer: "JULIA SOAEMIAS (or JULIA SOAEMIAS BASSIANA)"
  - tossup:
      question: "Change the noun form <latin>vis</latin> to plural."
      answer: "VIRES"
    boni:
      - question: "Change the verb form <latin>vis</latin> to plural."
        answer: "VULTIS"
      - question: "Change the noun form <latin>vis</latin> to ablative."
        answer: "VI"
  - tossup:
      question: "What head of the Praetorian Guard was responsible for much of the tyranny under Tiberius?"
      answer: "<latin>AELIUS SEJANUS</latin>"
    boni:
      - question: "Where was Tiberius' island retreat?"
        answer: "CAPRI"
      - question: "Who was Tiberius' nephew and eventual successor?"
        answer: "CLAUDIUS"
  - tossup:
      question: "What was the Athenian system of banishment called?"
      answer: "OSTRACISM"
    boni:
      - question: "What did <latin>ostraka</latin>, the voting pieces used for the ballot, mean?"
        answer: "POTSHERDS"
      - question: "How long was the banishment of ostracism?"
        answer: "TEN YEARS"
  - tossup:
      question: ""
      answer: "Dic mihi Anglice in qua civitate simus."
    boni:
      - question: ""
        answer: "KNOXVILLE/TENNESSEE"
      - question: ""
        answer: "Dic mihi ex qua civitate huc venerītis. // PLAYER SHOULD NAME HIS/HER HOME STATE // Dic mihi quis sis et qui sint socii. // PLAYER SHOULD NAME HIM/HERSELF AND TEAMMATES"
  - tossup:
      question: "Change <latin>sequitur</latin> to future."
      answer: "SEQUETUR"
    boni:
      - question: "Change <latin>sequetur</latin> to perfect."
        answer: "SECUTUS EST"
      - question: "Change <latin>secutus est</latin> to subjunctive."
        answer: "SECUTUS SIT"
  - tossup:
      question: ""
      answer: "What derivative of <latin>struo</latin> means to “raise” a building -"
    boni:
      - question: "R A I S E?"
        answer: "CONSTRUCT"
      - question: "R A Z E? What derivative of <latin>struo</latin> means teach?"
        answer: "What derivative of <latin>struo</latin> means to “raze” a building - // DESTROY // INSTRUCT"
  - tossup:
      question: ""
      answer: "Distinguish in meaning between <latin>cauda</latin> and <latin>caupo</latin>."
    boni:
      - question: ""
        answer: "CAUDA = TAIL CAUPO = INNKEEPER"
      - question: ""
        answer: "Distinguish in meaning between <latin>pons</latin> and <latin>pontus</latin>. // PONS = BRIDGE PONTUS = SEA // Distinguish in meaning between <latin>velamen</latin> and <latin>volumen</latin>. // VELAMEN = COVERING VOLUMEN = ROLL, VOLUME"
  - tossup:
      question: "What was the river by which the gods sealed their oaths?"
      answer: "STYX"
    boni:
      - question: "What river was the Underworld's river of forgetfulness?"
        answer: "LETHE"
      - question: "What was the river of fire?"
        answer: "PHLEGETHON or PYRIPHLEGETHON"
  - tossup:
      question: "What is the syntax of <latin>O tempora! O mores</latin>?"
      answer: "ACCUSATIVE OF EXCLAMATION"
    boni:
      - question: ""
        answer: "What use of the ablative is found in Cicero's famous"
      - question: "<latin>O fortunatam natam me consule Romam</latin>? What two cases are found in Cicero's question <latin>Quo usque tandem abutere, Catilina, patientiā nostrā</latin>?"
        answer: "ABLATIVE ABSOLUTE // ABLATIVE AND VOCATIVE"
  - tossup:
      question: "What is the meaning of the word element common to “isosceles” and “skeleton”?"
      answer: "LEG"
    boni:
      - question: "Common to “rhinoceros” and “triceratops”?"
        answer: "HORN"
      - question: "Common to “archaeopteryx” and “lepidopterist”?"
        answer: "WING"
  - tossup:
      question: "As only a Latinist would know, what do your knee and a cooking spit have in common?"
      answer: "BOTH ARE FOURTH-DECLENSION NEUTER NOUNS"
    boni:
      - question: "For five points each, name in Latin the other two fourth-declension neuter nouns."
        answer: "PECU, CORNU"
  - tossup:
      question: "What do these mythical men all have in common: Bellerophon, Tenes, Peleus and Hippolytus?"
      answer: "ALL WERE FALSELY ACCUSED OF RAPE/SEDUCTION"
    boni:
      - question: ""
        answer: "Two of them were accused by their stepmothers."
      - question: ""
        answer: "For five points, name one of the stepson-stepmother pairs. // TENES-PHILONOME, HIPPOLYTUS-PHAEDRA // Name the other pair. // Round B10, Page 4"
  - tossup:
      question: "Who was the hospitable king of the Phaeacians?"
      answer: "ALCINOUS"
    boni:
      - question: ""
        answer: "For five points each, give two names for his island."
      - question: ""
        answer: "SCHERIA, DREPANE, CORCYRA (now CORFU) // #"
