tournament: "NJCL Certamen"
year: 1994
division: "Advanced"
round: "Round 2"
questions:
  - tossup:
      question: "Whose life ended with his crash into the Eridanus River?"
      answer: "PHAETHON'S"
    boni:
      - question: "What were his weeping sisters turned into?"
        answer: "POPLARS"
      - question: "What were their tears turned into?"
        answer: "AMBER"
  - tossup:
      question: ""
      answer: "What Latin distributive adjective gives us an English"
    boni:
      - question: "verb meaning “join” or “unite”?"
        answer: "BINI (→“combine”)"
      - question: "What Latin verb is the root of “resource”? What Latin verb is the root of “employ”?"
        answer: "SURGO // PLICO"
  - tossup:
      question: "Who wrote a book on his conquest of Gaul?"
      answer: "GAIUS JULIUS <latin>CAESAR</latin>"
    boni:
      - question: ""
        answer: "What other war provided Caesar with material for another"
      - question: "book? March?"
        answer: "THE CIVIL WAR // In what year was Caesar assassinated on the Ides of // 44BC (710AUC)"
  - tossup:
      question: ""
      answer: "In what book of the Aeneid does Aeneas tell the story"
    boni:
      - question: "of the Trojan Horse?"
        answer: "BOOK TWO"
      - question: "Who are his audience? In what book does he reach Latium?"
        answer: "DIDO AND HER COURT // SIX"
  - tossup:
      question: ""
      answer: "Who was the first Roman historian to write his work in"
    boni:
      - question: "Latin?"
        answer: "CAT0 THE ELDER (or FABIUS PICTOR)"
      - question: "What consul of 133BC also wrote a history in Latin? by year since the Republic began?"
        answer: "CALPURNIUS PISO // What man, pontifex maximus in 130BC, published the // <latin>Annales Maximi</latin>, a compilation of the Roman officials // MUCIUS <latin>SCAEVOLA</latin>"
  - tossup:
      question: "What is an antonym of <latin>vacuus</latin>?"
      answer: "PLENUS, -PLETUS"
    boni:
      - question: "What is an antonym of <latin>vivus</latin>?"
        answer: "MORTUUS, EXANIMIS"
      - question: "What is an antonym of <latin>vetus</latin>?"
        answer: "NOVUS, IUVENIS, RECENS"
  - tossup:
      question: "Not long before the Battle of Pharsalus, where did Pompey repel Caesar's attack on his camp?"
      answer: "DYRRHACHIUM"
    boni:
      - question: "What was the year?"
        answer: "48BC"
      - question: "At what battle in Spain had Caesar the year before defeated Pompey's legates?"
        answer: "ILERDA"
  - tossup:
      question: "Who was the tutor of Achilles?"
      answer: "CHIRON THE CENTAUR (or PHOENIX)"
    boni:
      - question: ""
        answer: "Name two other students of Chiron for 5 points each."
      - question: ""
        answer: "JASON, ASCLEPIUS, MACHAON, PODALIRIUS, ACTAEON"
  - tossup:
      question: "Who was the first emperor born outside Europe?"
      answer: "SEPTIMIUS SEVERUS"
    boni:
      - question: "Who was the first emperor born outside Italy?"
        answer: "TRAJAN"
      - question: "What important North African city, made a colony by Trajan, was Septimius Severus' birthplace?"
        answer: "LEPCIS MAGNA"
  - tossup:
      question: "Change it to imperfect."
      answer: "IBAT"
    boni:
      - question: "Change ibat to subjunctive."
        answer: "IRET"
      - question: "Change iret to pluperfect."
        answer: "ĪSSET or IISSET or ĪVISSET"
  - tossup:
      question: "What work of Horace begins <latin>Qui fit</latin>?"
      answer: "<latin>SERMONES</latin>/<latin>SATIRES</latin>"
    boni:
      - question: "Whose name is the next word of the line?"
        answer: "MAECENAS'"
      - question: "What was the year of Horace's birth?"
        answer: "65BC"
  - tossup:
      question: "Of what material was the roof of the typical Roman house?"
      answer: "TERRA COTTA <latin>TILE</latin>"
    boni:
      - question: "What Latin name was given to the recesses to the right and left of the atrium?"
        answer: "ALAE"
      - question: "In the tablinum you might find an arca; what was that?"
        answer: "STRONGBOX OR SAFE"
  - tossup:
      question: ""
      answer: "The Greeks at Troy received a prophecy about the horses"
    boni:
      - question: "of what Thracian king?"
        answer: "RHESUS"
      - question: "By what Greeks was Rhesus killed and his horses taken? invincible?"
        answer: "ODYSSEUS AND DIOMEDES // What would the horses have done to render Troy // EATEN ITS GRASS AND/OR DRUNK FROM ITS RIVERS // Round A2, Page 3"
  - tossup:
      question: ""
      answer: "Distinguish in meaning between <latin>longaevus</latin> and <latin>longinquus</latin>."
    boni:
      - question: ""
        answer: "LONGAEVUS = LONG-LIVED LONGINQUUS = DISTANT, FAR OFF"
      - question: "What Latin noun with what meaning is contained in the adjective <latin>longaevus</latin>?"
        answer: "Distinguish in meaning between <latin>propinquus</latin> and <latin>propitius</latin>. // PROPINQUUS = NEAR, NEARBY // PROPITIUS = FAVORABLE, PROPITIOUS, WELL-DISPOSED // AEVUM = AGE, ERA"
  - tossup:
      question: "What Lydian vintner forced passersby to tend his vines?"
      answer: "SYLEUS"
    boni:
      - question: "Who killed Syleus?"
        answer: "HERACLES"
      - question: "What, fittingly enough, was Heracles' weapon?"
        answer: "A HOE"
  - tossup:
      question: "What is the meaning of the Greek word element common to “agony” and “antagonist”?"
      answer: "CONTEST, COMPETITION"
    boni:
      - question: "Common to “deuterium” and “Deuteronomy”?"
        answer: "SECOND"
      - question: "Common to “exodus” and “odometer”?"
        answer: "ROAD, WAY"
  - tossup:
      question: "Change <latin>pellerem</latin> to perfect."
      answer: "PEPULERIM"
    boni:
      - question: "Change <latin>pepulerim</latin> to passive."
        answer: "PULSUS SIM"
      - question: "Change <latin>pulsus sim</latin> to pluperfect."
        answer: "PULSUS ESSEM"
  - tossup:
      question: "Audite, omnes, magna cum cura. Cum Caesar in Galliam contendisset, hostes convocatos vidit. Quis in Galliam contendit?"
      answer: "CAESAR CONTENDIT"
    boni:
      - question: "Qui visi sunt?"
        answer: "HOSTES CONVOCATI VISI SUNT. (GALLI)"
      - question: "Quo Caesar iter fecit?"
        answer: "IN GALLIAM CAESAR ITER FECIT."
  - tossup:
      question: "Who was the third wife of Claudius?"
      answer: "VALERIA MESSALINA"
    boni:
      - question: "Who was her lover, consul for 48AD, with whom she went through a mock wedding ceremony during Claudius' absence from the city?"
        answer: "GAIUS SILIUS"
      - question: "In what year were the two executed?"
        answer: "48AD"
  - tossup:
      question: "What English noun for an event you might attend on a holiday comes from <latin>feriae</latin>?"
      answer: "FAIR"
    boni:
      - question: "What Latin base verb is the root of “affair”?"
        answer: "FACIO"
      - question: "What Latin verb is the root of “flair” (spell)?"
        answer: "FLAGRO, -ARE (or FRAGRO) // #"
