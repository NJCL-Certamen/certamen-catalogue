      answer: "VESTER"
  - tossup:
      question: "Translate the phrase <latin>tectum tollere</latin>."
      answer: "RAISE THE ROOF"
  - tossup:
      question: "<latin>Monstra mihi tuam ulnam.</latin>"
      answer: "PLAYER MUST POINT OUT HIS ELBOW"
  - tossup:
      question: "What Latin root verb is the source of “enclosure”?"
      answer: "CLAUDO"
