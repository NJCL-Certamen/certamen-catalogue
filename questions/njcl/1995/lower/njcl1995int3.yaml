tournament: "NJCL Certamen"
year: 1995
division: "Intermediate"
round: "Round 3"
questions:
  - tossup:
      question: "How did Atalanta and Hippomenes anger the goddess Cybele?"
      answer: "MADE LOVE IN HER TEMPLE"
    boni:
      - question: "What other angry goddess caused this unfortunate conduct?"
        answer: "APHRODITE / VENUS"
      - question: "Into what were Atalanta and Hippomenes transformed by Cybele?"
        answer: "LIONS"
  - tossup:
      question: "Who ordered the infant sons of his niece to be drowned in the Tiber?"
      answer: "AMULIUS"
    boni:
      - question: "Who was his niece?"
        answer: "RHEA SILVIA / RHEA SILVA / ILIA"
      - question: "How did Amulius die?"
        answer: "KILLED BY ROMULUS AND REMUS"
  - tossup:
      question: "Differentiate in meaning between levis and laevus."
      answer: "LEVIS -- LIGHT"
    boni:
      - question: ""
        answer: "LAEVUS -- LEFT"
      - question: "Differentiate in meaning between lēvis and lēnis. Differentiate in meaning between clāvus and clāvis."
        answer: "LĒVIS -- SMOOTH (TO TOUCH) // LĒNIS -- SOFT, MILD, GENTLE (SMOOTH) // CLĀVUS -- NAIL, STRIPE // CLĀVIS -- KEY"
  - tossup:
      question: "In what year did Etruscan rule come to an end at Rome?"
      answer: "BC"
    boni:
      - question: "Name the ruler expelled by the Romans in 510 BC?"
        answer: "TARQUINIUS SUPERBUS (PROUD)"
      - question: "What king of Clusium tried to help Superbus regain his throne in Rome?"
        answer: "(LARS) PORSENA"
  - tossup:
      question: "Give a synonym of perdō."
      answer: "ĀMITTŌ / DĒLEŌ / VASTŌ / DESTRUŌ / POPULOR / ANNIHILO"
    boni:
      - question: "Give a synonym of aiō."
        answer: "NĀRRŌ / DĪCŌ / INQUAM / FOR / LOQUOR / FERO / FATEOR"
      - question: "Give a synonym of crēdō."
        answer: "OPĪNOR / (CON)FĪDŌ / CENSEO"
  - tossup:
      question: "What centaur did not have the same ancestry as the others?"
      answer: "CHIRON"
    boni:
      - question: "Who was Chiron's father?"
        answer: "CRONUS"
      - question: "Who was Chiron's mother?"
        answer: "PHILYRA"
  - tossup:
      question: "What did the emperor Aurelian begin constructing in Rome in AD 271?"
      answer: "(CITY) WALLS"
    boni:
      - question: "Why did a later emperor, rather than Aurelian, complete the building of the walls?"
        answer: "HE WAS MURDERED (more than just died)"
      - question: "Which of Constantine's rivals doubled the height of the walls?"
        answer: "MAXENTIUS"
  - tossup:
      question: "What Latin word and what preposition combine to form the verb sūmō?"
      answer: "SUB + EMŌ"
    boni:
      - question: "What does sūmō mean?"
        answer: "TAKE / BORROW / PICK UP"
      - question: "What compound of emō means “take away?"
        answer: "” DĒMŌ / REDĪMO"
  - tossup:
      question: "What type of animal was made into a constellation by Hera in gratitude for its hindering one of Heracles' labors?"
      answer: "CRAB"
    boni:
      - question: "Which labor did the crab figure in?"
        answer: "THE HYDRA (ask for more info if ANY number is given)"
      - question: "How did it hinder Heracles?"
        answer: "BIT HIM ON THE FOOT"
  - tossup:
      question: "What is the present active participle of appellō, meaning name?"
      answer: "APPELLĀNS"
    boni:
      - question: "Change appellāns to future."
        answer: "APPELLĀTŪRUS / -UM / -A"
      - question: "Change appellātūrus to passive."
        answer: "APPELLANDUS"
  - tossup:
      question: "What type of subjunctive clause is found in the following sentence: Tantus erat impetus hostium ut fortiter pūgnāre nōn possent."
      answer: "RESULT / CONSECUTIVE"
    boni:
      - question: ""
        answer: "What type of subjunctive clause is found in the following sentence:"
      - question: "Fūgērunt nē caperentur. Timeō nē Lūcius fēcerit."
        answer: "(NEGATIVE) PURPOSE / FINAL // What type of subjunctive clause is found in the following sentence: // (POSITIVE) FEARING (SUBSTANTIVE PURPOSE)"
  - tossup:
      question: "What English noun for “elf” is from the Latin verb for “breathe?"
      answer: "” SPRITE"
    boni:
      - question: "What is the Latin noun meaning “breath” from which “sprite” is derived?"
        answer: "SPĪRITUS"
      - question: "What Latin noun is the root of “escutcheon,” meaning a coat of arms?"
        answer: "SCŪTUM"
  - tossup:
      question: ""
      answer: "Translate this sentence into English: Nūntius dominō dīxit coquum optimum morī."
    boni:
      - question: ""
        answer: "THE MESSENGER TOLD THE MASTER THAT (HIS) BEST COOK WAS DYING"
      - question: ""
        answer: "Translate this sentence into English: Dominus exclāmāvit sē floccī nōn facere. // THE MASTER EXCLAIMED THAT HE DIDN'T CARE // Translate this sentence into English: // Coquus sperat dominum brevī tempore moritūrum esse. // THE COOK HOPES THE MASTER WILL DIE IN A SHORT TIME"
  - tossup:
      question: "Until the time of Augustus, what hill was the “potter's field” of Rome -- that is, the burial site for those too poor to be given funerals?"
      answer: "ESQUILINE"
    boni:
      - question: "What emperor built his “Golden House” on the Esquiline?"
        answer: "NERO"
      - question: "What emperor built his Thermae on the Esquiline?"
        answer: "TRAJAN / TITUS"
  - tossup:
      question: "What king was the oldest of the Greek leaders at Troy?"
      answer: "NESTOR"
    boni:
      - question: "What was his kingdom?"
        answer: "PYLOS"
      - question: "Who came to him after the war seeking news of his father?"
        answer: "TELEMACHUS"
  - tossup:
      question: "In what Roman province was the city of Syracuse?"
      answer: "SICILIA / SICILY"
    boni:
      - question: "...the city of Pergamum?"
        answer: "ASIA (not MINOR)"
      - question: "...the city of Carthage?"
        answer: "AFRICA"
  - tossup:
      question: "Which of his grandsons did Augustus disinherit and exile?"
      answer: "MARCUS VIPSANIUS AGRIPPA POSTUMUS (also renamed AGRIPPA IULIUS CAESAR)"
    boni:
      - question: "For 5 pts. each, name Postumus' two brothers who were designated as Augustus' heirs, before their untimely deaths?"
        answer: "(GAIUS) CAESAR & (LUCIUS) CAESAR"
  - tossup:
      question: "Which, if any, of the following is NOT from the same Latin root as the others: lucid, deluxe, translucent, elucidate?"
      answer: "DELUXE"
    boni:
      - question: "What is the basic Latin verb with its meaning at the root of “lugubrious?"
        answer: "” LŪGEŌ -- GRIEVE / MOURN"
      - question: "Give the Latin verb and its meaning from which “luscious” is derived."
        answer: "DĒLICERE -- DELIGHT (LACERE - ENTICE)"
  - tossup:
      question: "Using lābor, translate this sentence into Latin: Manius, don't neglect your work!"
      answer: "MĀNĪ, NŌLĪ NEGLEGERE (TUUM) LĀBŌREM"
    boni:
      - question: ""
        answer: "MĀNĪ, CAVĒ NEGLEGAS (NEGLĒXERĪS) (TUUM) LĀBŌREM"
      - question: ""
        answer: "MĀNĪ, NĒ NEGLĒXERĪS (NEGLEGAS) (TUUM) LĀBŌREM // Translate the same sentence using a different construction. // Again, translate the same sentence using another construction."
  - tossup:
      question: "Given the following Latin sentence -- Publius Rōmam advēnit ut pācem peteret -- if advēnit were changed to advenit, how would the rest of the sentence change?"
      answer: "PETERET BECOMES PETAT (ask for the form i.e. don't accept peteret becomes present)"
    boni:
      - question: ""
        answer: "Using a gerundive, translate “Publius came to Rome to seek peace.”"
      - question: ""
        answer: "PUBLIUS RŌMAM ADVĒNIT (ADVENIEBAT) AD PĀCEM PETENDAM // PĀCIS PETENDAE CAUSĀ (GRATIĀ) // Translate the same sentence using a supine. // PUBLIUS RŌMAM ADVĒNIT PĀCEM PETĪTUM"
