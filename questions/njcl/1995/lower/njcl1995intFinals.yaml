tournament: "NJCL Certamen"
year: 1995
division: "Novice"
round: "Finals"
questions:
  - tossup:
      question: "What is the dative of the Latin for “broken knee?"
      answer: "” FRACTŌ GENŪ"
    boni:
      - question: "What is the dative of the Latin for “broken hand?"
        answer: "” FRACTAE MANUĪ"
      - question: "Genu and manus are fourth declension nouns. What verbal is also of the fourth declension?"
        answer: "SUPINE"
  - tossup:
      question: "Who tells Telemachus that Odysseus is being held on the island of Ogygia by Calypso?"
      answer: "MENELAUS"
    boni:
      - question: "From whom had Menelaüs learned Odysseus' whereabouts?"
        answer: "PROTEUS"
      - question: "Why had Menelaüs been forced to capture the prophetic sea-god Proteus?"
        answer: "BECALMED IN MOUTH OF NILE -- HE NEEDED TO KNOW SOURCE OF PROBLEM AND WHAT TO DO ABOUT IT"
  - tossup:
      question: ""
      answer: "From 217 - 211 BC two brothers led the Roman forces against the Carthaginians in Spain."
    boni:
      - question: "Name these brothers."
        answer: "SCIPIO (PUBLIUS & GNAEUS CORNELIUS)"
      - question: "Name the two Carthaginian brothers whom the Scipioes fought? Who later defeated both Mago and Hasdrubal?"
        answer: "MAGO & HASDRUBAL // PUBLIUS CORNELIUS SCIPIO (AFRICANUS MAIOR)"
  - tossup:
      question: ""
      answer: "Why is subjunctive used in the following sentence: dīxit amīcōs quōs vīdissēmus vēnisse."
    boni:
      - question: ""
        answer: "SUBORDINATE CLAUSE IN INDIRECT DISCOURSE"
      - question: "Using your best Latin, negate the introductory verb of that sentence. If negāvit were changed to negat, what tense would be used to translate the verb in the subordinate clause?"
        answer: "NEGĀVIT // PERFECT"
  - tossup:
      question: ""
      answer: "Mordeō : mordēbō :: līberāre : __________."
    boni:
      - question: ""
        answer: "LĪBERĀTŪRUS/A/UM ESSE or LĪBERĀTOR or LĪBERĀBERIS(-RE)"
      - question: "Līberātūrus esse : līberāvisse :: parient : __________."
        answer: "PEPERĒRUNT // Peperērunt : pariunt :: coepī : __________. INCIPIŌ, (COEPIŌ -- if designated as archaic) // 15 // Bloopg2"
  - tossup:
      question: "Whom did Demeter turn into a lizard for mocking how she drank as she quenched her thirst?"
      answer: "ASCALABUS"
    boni:
      - question: "What did Ascalaphus tell Hades that also angered Demeter?"
        answer: "PERSEPHONE HAD EATEN POMEGRANATE SEEDS"
      - question: "What did either Persephone or Demeter turn him into for this?"
        answer: "AN OWL"
  - tossup:
      question: ""
      answer: "Listen carefully to the following paragraph, which I will read twice, and answer in English the question about it. Ad rīvum fluentem lupus audax et āgnus innocens vēnerant, compulsī sitī. Ubi lupus cōnspexit āgnum bibentem, tantā fame incendēbātur ut subitō in āgnum infēlicem īnsilīret vēscēns."
    boni:
      - question: "Why are the lamb and wolf at the river?"
        answer: "THEY ARE THIRSTY"
      - question: "How are both animals characterized? Why does the wolf eat the lamb?"
        answer: "THE WOLF IS BOLD // THE LAMB IS INNOCENT (or UNLUCKY) // HE SEES THE LAMB DRINKING AND BECOMES HUNGRY"
  - tossup:
      question: "Give a synonym of dēlūbrum."
      answer: "FĀNUM / AEDĒS / TEMPLUM"
    boni:
      - question: "Give a synonym of tūtus."
        answer: "SOSPES / INCOLUMIS / SALVUS / SĒCŪRUS"
      - question: "Give a synonym of ferē."
        answer: "PAENE"
  - tossup:
      question: "A friend of yours says to you, “I'll pay you back the money ad calendas graecas.” Why should you be worried?"
      answer: "HE DOESN'T INTEND TO PAY IT BACK"
    boni:
      - question: "Translate ad calendas graecas."
        answer: "AT (ON) THE GREEK CALENDS"
      - question: "Why is this phrase equivalent to “never?"
        answer: "” THE GREEKS HAD NO CALENDS"
  - tossup:
      question: "What Athenian archon initiated the development of the port of Piraeus?"
      answer: "THEMISTOCLES"
    boni:
      - question: "In response to what crisis did he increase the Athenian navy from 70 ships to 200?"
        answer: "THE INVASION OF XERXES"
      - question: "Where was the great naval victory of 480 BC?"
        answer: "SALAMIS"
  - tossup:
      question: "Who was the mother with whom the twins Amphion and Zethus were reunited as adults?"
      answer: "ANTIOPE"
    boni:
      - question: "Who was Antiope's tormentor, whom Amphion and Zethus killed?"
        answer: "DIRCE"
      - question: "According to one version, what god then drove Antiope mad because Dirce had been a follower of his?"
        answer: "DIONYSUS"
  - tossup:
      question: "How many emperors had the name Gordianus?"
      answer: "THREE"
    boni:
      - question: "Which of the Gordiani ruled for only 22 days?"
        answer: "I & II"
      - question: "How old was Gordianus III when he was proclaimed emperor by the Praetorians?"
        answer: "13"
  - tossup:
      question: "What is the Latin term for orators like Cicero & Pliny the Younger who represented parties at a civil trial?"
      answer: "ADVOCATI"
    boni:
      - question: "In the Republic and early Empire what was the fee of an advocate?"
        answer: "NONE (BY LAW)"
      - question: "By the second century AD it was accepted that advocates could accept payment for their services. What was that payment called?"
        answer: "HONORARIUM or PALMARIUM"
  - tossup:
      question: "What is the meaning of the Greek verb at the root of the English word “prophecy?"
      answer: "”"
    boni:
      - question: ""
        answer: "SPEAK"
      - question: "...“phenomenon?...“phosphorus?"
        answer: "” SHOW // ” BEAR, CARRY"
  - tossup:
      question: "Who had the sad duty of bringing Achilles the news of Patroclus' death?"
      answer: "ANTILOCHUS"
    boni:
      - question: "Who was Antilochus' father?"
        answer: "NESTOR"
      - question: "How did Antilochus die?"
        answer: "KILLED BY MEMNON WHILE DEFENDING NESTOR IN BATTLE"
  - tossup:
      question: "Who conferred the title of “Augusta” upon his paternal grandmother Antonia?"
      answer: "GAIUS / CALIGULA"
    boni:
      - question: "Who were Antonia's parents?"
        answer: "MARCUS ANTONIUS & OCTAVIA"
      - question: ""
        answer: "Antonia was married to Drusus. Name their children. // GERMANICUS, LIVILLA (CLAUDIA LIVIA IULIA), & CLAUDIUS"
  - tossup:
      question: ""
      answer: "Which of the following does NOT have a Latin root: rouge, cologne, perfume, cosmetic."
    boni:
      - question: ""
        answer: "COSMETIC"
      - question: "What is the root meaning of the noun at the base of “perfume? What Latin noun is the root of “cologne?"
        answer: "” SMOKE // ” COLONIA"
  - tossup:
      question: ""
      answer: "Translate: Incertī erant utrum dux mortuus an vīvus esset."
    boni:
      - question: ""
        answer: "THEY WERE UNSURE WHETHER THE LEADER WAS DEAD OR ALIVE"
      - question: ""
        answer: "Sī ad urbem Rōmam iter faciāmus amphitheatrum vīsitēmus. // IF WE SHOULD TRAVEL TO THE CITY OF ROME, WE WOULD VISIT THE AMPHITHEATER // Salvius ab amīcīs monitus est nē barbarīs cōnfīderet. // SALVIUS WAS WARNED BY (HIS) FRIENDS NOT TO TRUST FOREIGNERS"
  - tossup:
      question: "Why did Zeus punish Hera by hanging anvils from her feet and hanging her from heaven?"
      answer: "FOR HER CRUELTY TO HERACLES"
    boni:
      - question: "In what form did Zeus first woo Hera?"
        answer: "CUCKOO"
      - question: "Who was the young Hera's nurse?"
        answer: "LOCRIS"
  - tossup:
      question: "What compound of dūcō can mean “build” when used with mūrum in an idiom?"
      answer: "PERDŪCŌ"
    boni:
      - question: "What compound of dūcō can mean “launch” when used with nāvem in an idiom?"
        answer: "DĒDŪCŌ"
      - question: "What idiom with dūcō means “to marry?"
        answer: "” // IN MĀTRIMŌNIUM DŪCERE // 18"
