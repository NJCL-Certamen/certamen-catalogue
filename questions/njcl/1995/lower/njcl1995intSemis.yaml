tournament: "NJCL Certamen"
year: 1995
division: "Intermediate"
round: "Semifinals"
questions:
  - tossup:
      question: ""
      answer: "Differentiate between the verb potior and the adjective potior."
    boni:
      - question: ""
        answer: "POTIOR (VERB) -- OBTAIN"
      - question: "...between nārē and nēre....between mōlīrī and molere."
        answer: "POTIOR (ADJ) -- BETTER, MORE IMPORTANT, MORE POWERFUL // NĀRE -- SWIM // NĒRE -- SPIN, WEAVE // MŌLĪRĪ -- TOIL, SET IN MOTION // MOLERE -- GRIND IN A MILL"
  - tossup:
      question: "Doctors often use Latin abbreviations in writing prescriptions. If your doctor indicates that you are to take a drug p.c., what is he instructing?"
      answer: "TO TAKE IT AFTER MEALS"
    boni:
      - question: "If he indicates a.c.?"
        answer: "BEFORE MEALS"
      - question: "A.C. is also the Latin equivalent of what common abbreviation for the reckoning of dates?"
        answer: "B.C."
  - tossup:
      question: "What is peculiar about the following adjectives: gracilis, facilis, humilis, similis?"
      answer: "SUPERLATIVES END IN -LIMUS"
    boni:
      - question: "sōlus, tōtus, ūllus, ūnus?"
        answer: "GENITIVE SINGULAR ENDS IN -ĪUS, DATIVE IN -Ī"
      - question: "frūgī, damnās, nēquam, necesse?"
        answer: "INDECLINABLE"
  - tossup:
      question: "Which, if any, of the following English words is NOT from the same Latin root as the others: require, requital, query, quest, inquisition?"
      answer: "REQUITAL"
    boni:
      - question: "From what Latin noun does requital come?"
        answer: "QUIĒS"
      - question: "What derivative of quiēs means “a hymn for the dead?"
        answer: "” REQUIEM"
  - tossup:
      question: "What holiday every year was the occasion for Roman boys of the right age to don their togae viriles?"
      answer: "THE LIBERALIA"
    boni:
      - question: "To what deities did they dedicate their childhood clothing?"
        answer: "THE LARES"
      - question: "On what day was the Liberalia celebrated?"
        answer: "MARCH 17"
  - tossup:
      question: "Which of the following, if any, is NOT derived from the same Latin root as the others: dialect, intellectual, legerdemain, negligence, legend."
      answer: "LEGERDEMAIN"
    boni:
      - question: "...sentry, scent, sense, sentient, sensuous."
        answer: "NONE"
      - question: "...invective, vestige, inveigh, vehicle, vector."
        answer: "VESTIGE // 11 // B10pg2"
  - tossup:
      question: "Whose sons arranged the murder of Tarquinius Priscus?"
      answer: "ANCUS MARCIUS'"
    boni:
      - question: "In spite of their crime, who arranged the succession of Servius Tullius?"
        answer: "TANAQUIL (TARQUINIUS PRISCUS' WIDOW)"
      - question: "What relation was Tanaquil to Servius Tullius?"
        answer: "MOTHER-IN-LAW"
  - tossup:
      question: "What two Argonauts chased the fleeing Harpies?"
      answer: "ZETES AND CALAIS"
    boni:
      - question: "Where did they turn back from their pursuits?"
        answer: "THE STROPHADES (“turning”) ISLANDS"
      - question: "How were they related to Phineus, their beneficiary?"
        answer: "BROTHERS-IN-LAW (BY THEIR SISTER CLEOPATRA)"
  - tossup:
      question: "By what triumphal agnomen do we know the brother of Scipio Africanus Maior?"
      answer: "ASIATICUS (or ASIAGENES or ASIAGENUS)"
    boni:
      - question: "What Asian king did he defeat for his triumph?"
        answer: "ANTIOCHUS"
      - question: "Where was the battle?"
        answer: "MAGNESIA (IN ASIA MINOR)"
  - tossup:
      question: "What is the 2nd person singular pluperfect subjunctive of volo, velle?"
      answer: "VOLUISSĒS"
    boni:
      - question: "Change voluissēs to imperfect."
        answer: "VELLĒS"
      - question: "Change vellēs to present."
        answer: "VELĪS"
  - tossup:
      question: "What is the meaning of the idiom plūrimum valēre?"
      answer: "TO BE VERY POWERFUL"
    boni:
      - question: "...of the idiom iūs iūrandum?"
        answer: "OATH"
      - question: "...of the idiom referre ad senātum?"
        answer: "TO MAKE A MOTION IN THE SENATE"
  - tossup:
      question: "Who commanded the left wing of Caesar's army at Pharsalus in 48 BC?"
      answer: "MARCUS ANTONIUS"
    boni:
      - question: "Against whom were Caesar and Marc Antony fighting?"
        answer: "POMPEY"
      - question: "In what year was M. Antonius Caesar's consular colleague?"
        answer: "44 BC"
  - tossup:
      question: "Who sacked Troy and killed King Laomedon?"
      answer: "HERACLES"
    boni:
      - question: "Why did Heracles kill Laomedon?"
        answer: "RENEGED ON PAYMENT FOR RESCUING"
      - question: "this son."
        answer: "DAUGHTER (HESIONE) FROM SEA MONSTER // Heracles killed all of Laomedon's sons but the one who advised his father to pay. Name // PODARCES / PRIAM"
  - tossup:
      question: ""
      answer: "Using iubeō translate: Titus ordered his children to leave."
    boni:
      - question: ""
        answer: "12"
      - question: "What type of clause is ut discēderent?"
        answer: "B10 py 3 // TITUS IUSSIT SUŌS LĪBERŌS DISCĒDERE // Translate the same sentence using imperō. // TITUS SUĪS LĪBERĪS IMPERĀVIT UT DISCĒDERENT // INDIRECT COMMAND (SUBSTANTIVE CLAUSE OF PURPOSE)"
  - tossup:
      question: "What son of Priam claimed Helen after Paris' death?"
      answer: "DEIPHOBUS"
    boni:
      - question: "What happened to Deiphobus the night Troy fell?"
        answer: "MENELAUS CUT OFF HIS NOSE, EARS, & HANDS"
      - question: "How did Aeneas learn of Deiphobus' fate?"
        answer: "HE MET HIM IN THE UNDERWORLD"
  - tossup:
      question: ""
      answer: "Listen carefully to the following paragraph, which I will read twice, and answer in English the question about it. Caesare duce, mīlitēs Rōmānī summā vī transīre in hostium nāvēs contendēbant. Expūgnātīs fortiter complūribus nāvibus, hostēs fugā salūtem petere contendērunt."
    boni:
      - question: "Where does the battle take place?"
        answer: "ON SHIPS, ON THE SEA"
      - question: "What method do the Romans plan to use in attacking the enemy? After fighting off several ships, what does the enemy do?"
        answer: "BOARDING THEIR SHIPS // RETREAT"
  - tossup:
      question: "When Odysseus reached the Underworld, what did he have to prevent all the other shades form doing before that of Tiresias?"
      answer: "DRINKING THE BLOOD OF THE SACRIFICED SHEEP"
    boni:
      - question: "What ghost appeared first?"
        answer: "ELPENOR"
      - question: "What ghost's appearance moved Odysseus to tears?"
        answer: "HIS MOTHER ANTICLEIA'S"
  - tossup:
      question: "What city, with walls built by Amphion, was the home of Oedipus?"
      answer: "THEBES"
    boni:
      - question: "How did Amphion build the walls of Thebes?"
        answer: "HIS MUSIC CHARMED THE STONES INTO PLACE"
      - question: "Who was Amphion's wife?"
        answer: "NIOBE"
  - tossup:
      question: "What use of the genitive is found in the following sentence: Habetne māter ōdium tuī?"
      answer: "OBJECTIVE"
    boni:
      - question: "Lucius fodiēbat fossam trium pedum."
        answer: "MEASURE (QUALITY)"
      - question: "Nēmō arguit mē furtī."
        answer: "CHARGE OR PENALTY"
  - tossup:
      question: "What significant event occurred on the 24th of August in AD 410?"
      answer: "ALARIC (& VISIGOTHS) SACKED ROME"
    boni:
      - question: "Who had defeated Alaric & the Visigoths in AD 402 & 403?"
        answer: "FLAVIUS STILICHO"
      - question: "Under what emperor did Stilicho serve?"
        answer: "HONORIUS // #"
