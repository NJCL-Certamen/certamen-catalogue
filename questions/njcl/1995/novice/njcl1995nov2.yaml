tournament: "NJCL Certamen"
year: 1995
division: "Novice"
round: "Round 2"
questions:
  - tossup:
      question: "From what Nereid does Achilles seek help in the first book of the Iliad?"
      answer: "THETIS"
    boni:
      - question: "Why does Achilles turn to her for help?"
        answer: "SHE IS HIS MOTHER"
      - question: "What epithet does Homer give her?"
        answer: "SILVER-FOOTED"
  - tossup:
      question: "What war was precipitated by the Mamertine request in 264 BC for help from the Romans?"
      answer: "FIRST PUNIC"
    boni:
      - question: "What territory did the Romans and Carthaginians fight over in the First Punic War?"
        answer: "SICILY"
      - question: ""
        answer: "What was necessary for the Romans to build to win this NAVAL FLEET / WAR SHIPS"
  - tossup:
      question: ""
      answer: "Listen to the following sentence, which I will read twice, and answer in Latin the question about it: Maximā cum cūrā poētae Rōmānī multa carmina composuērunt."
    boni:
      - question: "Quālēs poētae maximā cum cūrā multa carmina composuērunt?"
        answer: "RŌMĀNĪ"
      - question: "Quō modō poētae Rōmānī multa carmina composuērunt? Quās rēs poētae Rōmānī composuērunt?"
        answer: "MAXIMĀ (CUM) CŪRĀ // (MULTA) CARMINA"
  - tossup:
      question: "What is the LITERAL meaning of the idiom certiōrem facere?"
      answer: "TO MAKE MORE CERTAIN"
    boni:
      - question: "What does it mean idiomatically?"
        answer: "TO INFORM"
      - question: "What related idiom means “be informed?"
        answer: "” CERTIOR FIERĪ"
  - tossup:
      question: "Which Roman emperor established a new Christian city on the site of Byzantium in AD 324?"
      answer: "CONSTANTINE"
    boni:
      - question: "What was the name of this new city?"
        answer: "CONSTANTINOPLE"
      - question: "The city was a memorial to what victorious battle?"
        answer: "MILVIAN BRIDGE (DEFEAT OF MAXENTIUS)"
  - tossup:
      question: "Whom did the bathing Artemis transform out of modesty?"
      answer: "ACTAEON"
    boni:
      - question: "Into what was Actaeon transformed?"
        answer: "STAG"
      - question: "What happened to Actaeon?"
        answer: "TORN APART BY HIS OWN HOUNDS"
  - tossup:
      question: "Filius means “son.” Who is a filiolus?"
      answer: "A LITTLE SON"
    boni:
      - question: "Gladius means “sword.” What Latin word means “little sword?"
        answer: "” GLADIOLUS"
      - question: "Homō means “man.” What Latin word means “little man?"
        answer: "” HOMUNCULUS"
  - tossup:
      question: "To what animals did Heracles feed the flesh of their master?"
      answer: "MARES OF DIOMEDES"
    boni:
      - question: "What animal did Heracles capture which had bronze hooves and golden horns?"
        answer: "CERYNITIAN / CERYNEAN (ser - i - nē' - an) HIND"
      - question: "What savage animal did Heracles capture by driving it into a snow drift?"
        answer: "ERYMANTHIAN (er - i - man' - thi - an) BOAR"
  - tossup:
      question: "If your mother were a Roman and said to you, “Tempus est abīre,” what would she be saying?"
      answer: "IT'S TIME TO LEAVE"
    boni:
      - question: "If you then tell her, “Nōlō abīre,” what are you retorting?"
        answer: "I DON'T WANT TO LEAVE"
      - question: "When your mother becomes angry and says, “Necesse est tibi abīre,” what is she telling you?"
        answer: "IT'S NECESSARY FOR YOU TO LEAVE / YOU HAVE TO GO"
  - tossup:
      question: "What famous Greek hero abandoned Ariadne on the island of Naxos?"
      answer: "THESEUS"
    boni:
      - question: "What deity later rescued Ariadne?"
        answer: "BACCHUS / DIONYSUS"
      - question: "Who was Ariadne's father?"
        answer: "MINOS"
  - tossup:
      question: "Which Olympian god retained his Greek name in Rome?"
      answer: "APOLLO"
    boni:
      - question: "Give the Greek and Roman names for his sister?"
        answer: "ARTEMIS / DIANA"
      - question: "Give the Greek and Roman names for his father?"
        answer: "ZEUS / JUPITER"
  - tossup:
      question: "Change capitis to singular."
      answer: "CAPIS"
    boni:
      - question: "Change the noun capitis to plural."
        answer: "CAPITUM"
      - question: "Change the verb capitis to pluperfect."
        answer: "CĒPERĀTIS"
  - tossup:
      question: "What area of Rome was originally a flood plain of the Tiber?"
      answer: "CAMPUS MARTIUS / FORUM"
    boni:
      - question: "The Campus Martius was bounded by two of Rome's hills. For 5 pts. each, name these two hills."
        answer: "QUIRINAL & CAPITOLINE"
  - tossup:
      question: "Change magnam mēnsam to ablative."
      answer: "MAGNĀ MĒNSĀ"
    boni:
      - question: "Change magnā mēnsā to plural."
        answer: "MAGNĪS MĒNSĪS"
      - question: "accusative plural of what word?"
        answer: "Besides being the dative and ablative plural forms of mēnsa, mēnsīs can also be the // MĒNSIS"
  - tossup:
      question: "What Latin word, the feminine of an adjective meaning “relating to the father,” is a noun meaning “country?"
      answer: "” PATRIA"
    boni:
      - question: "What Latin noun, related to pater, means “defender, protector?"
        answer: "” PATRŌNUS"
      - question: "What related Latin noun means “uncle?"
        answer: "” PATRUUS"
  - tossup:
      question: "In the word prōdūcent, which syllable is the antepenult?"
      answer: "PRŌ-"
    boni:
      - question: "In prōdūcent, which syllable is the ultima?"
        answer: "-CENT"
      - question: "When is the penult of a three-syllable Latin word not stressed?"
        answer: "WHEN IT IS SHORT"
  - tossup:
      question: "Which, if any, of the following English words is NOT derived from the same Latin root as the others: arsenal, armistice, armory, alarm?"
      answer: "ARSENAL"
    boni:
      - question: "Armistice, armory, and alarm are all derived from arma. Give the Latin verb that is compounded with arma to give “armistice.”"
        answer: "STŌ"
      - question: "Give the Latin preposition that is compounded with arma to yield “alarm.”"
        answer: "AD"
  - tossup:
      question: "What did Caesar say when he crossed the Rubicon?"
      answer: "ALEA IACTA EST -- THE DIE IS (HAS BEEN) CAST"
    boni:
      - question: "What year was this?"
        answer: "49 BC"
      - question: "Who was Caesar's chief enemy in the war that followed?"
        answer: "(CN.) POMPEY (THE GREAT)"
  - tossup:
      question: "Give an antonym of salūs."
      answer: "AEGRŌTĀTIO / MORBUS / PERĪCULUM / DISCRĪMEN / INFIRMITAS"
    boni:
      - question: "Give an antonym of silentium."
        answer: "CLĀMOR / SONITUS / STREPITUS / RUMOR / SONUS / STRIDOR / MURMOR"
      - question: "Give an antonym of victor."
        answer: "CAPTĪVUS / VICTUS / VICTIMA"
  - tossup:
      question: "Which office normally possessed the supreme civil and military power in the Republic?"
      answer: "CONSUL"
    boni:
      - question: "Which office normally possessed the power of unlimited veto over a consul?"
        answer: "THE OTHER CONSUL"
      - question: "How did the legislation of the tribunes Licinius and Sextius effect the election of consuls?"
        answer: "COMPULSORY ELECTION OF AT LEAST ONE PLEBEIAN CONSUL // 6 // #"
