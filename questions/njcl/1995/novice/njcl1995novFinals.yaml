tournament: "NJCL Certamen"
year: 1995
division: "Novice"
round: "Finals"
questions:
  - tossup:
      question: "What use of the genitive is found in this sentence: Gaius est homō maximī animī?"
      answer: "QUALITY/DESCRIPTION"
    boni:
      - question: "Gaius magnam partem inimīcōrum interfēcērunt?"
        answer: "PARTITIVE/GENITIVE OF THE WHOLE"
      - question: "Maximus inimīcus canem eius interfēcit?"
        answer: "POSSESSION"
  - tossup:
      question: "What is the difference between the adjectives candidus and albus?"
      answer: "CANDIDUS -- SHINY WHITE"
    boni:
      - question: ""
        answer: "ALBUS -- DULL WHITE"
      - question: "What color did the Romans call cānus?"
        answer: "Distinguish between niger and ater. // NIGER -- GLOSSY BLACK // ATER -- FLAT BLACK // GREY"
  - tossup:
      question: ""
      answer: "Make novus agree with rērum."
    boni:
      - question: ""
        answer: "NOVĀRUM"
      - question: ""
        answer: "Make novus agree with tempore. // NOVŌ // Make novus agree with domuī. // NOVAE"
  - tossup:
      question: ""
      answer: "Which, if any, of the following English words is NOT derived from the same root as the others: emotion, mob, remove, motley, motor."
    boni:
      - question: ""
        answer: "MOTLEY"
      - question: ""
        answer: "...gerund, jest, engine, register, gesticulate. // ENGINE //...client, foreclose, seclude, sluice, closure. // CLIENT"
  - tossup:
      question: "What did the Romans call their three-person ball game?"
      answer: "TRIGON"
    boni:
      - question: "How many balls were used?"
        answer: "TWO"
      - question: "Besides air, what substance was inside the balls Romans used in their games?"
        answer: "HAIR and/or FEATHERS"
  - tossup:
      question: "To take its meaning literally, how long is a “sesquipedalian” word?"
      answer: "ONE AND A HALF FEET"
    boni:
      - question: "After how many years do you mark a “sesquicentennial?"
        answer: "”"
      - question: ""
        answer: "150 // Define sesquitertius. // ONE AND ONE THIRD"
  - tossup:
      question: "What was the decisive battle of the Third Samnite War?"
      answer: "SENTINUM"
    boni:
      - question: "Who was the consul who gave his life to insure a Roman victory?"
        answer: "DECIUS MUS"
      - question: "Who was the commander of the Samnite forces?"
        answer: "GELLIUS EGNATIUS"
  - tossup:
      question: "E.g. and v.g. may use slightly different wording to get the same point across, yet they share what one Latin word in common?"
      answer: "GRATIA"
    boni:
      - question: "What case is governed by gratiā?"
        answer: "GENITIVE"
      - question: "Metro-Goldwyn-Mayer uses gratiā in which phrase made famous as their trademark?"
        answer: "ARS GRATIA ARTIS"
  - tossup:
      question: "From which two deities was Romulus, the founder and first king of Rome, descended?"
      answer: "VENUS & MARS"
    boni:
      - question: "Who in the midst of a thunderstorm carried Romulus off to the heavens?"
        answer: "MARS"
      - question: "Romulus becomes the god Quirinus. What was the name of his deified wife?"
        answer: "HORA"
  - tossup:
      question: "Of the verbs reddō, dēmōnstrō, struō, and dūcō, which is not a 3rd conjugation verb?"
      answer: "DĒMŌNSTRŌ"
    boni:
      - question: "Of the verbs sequor, vereor, gradior, and petor, which is not a deponent verb?"
        answer: "PETOR"
      - question: "Of the verbs maneō, gaudeō, soleō, and fīdō, which is not a semi-deponent verb?"
        answer: "MANEŌ"
  - tossup:
      question: "Who taught the young Heracles to play the lyre?"
      answer: "LINUS or EUMOLPUS"
    boni:
      - question: "...to drive a chariot?"
        answer: "AMPHITRYON"
      - question: "...to shoot a bow and arrow?"
        answer: "EURYTUS"
  - tossup:
      question: "What god was rumored to be Bellerophon's father?"
      answer: "POSEIDON"
    boni:
      - question: "What king sent Bellerophon to kill the Chimaera?"
        answer: "IOBATES"
      - question: "What daughter of Iobates did Bellerophon marry?"
        answer: "PHILONOE (or ANTICLEA or CASSANDRA)"
  - tossup:
      question: ""
      answer: "Translate: Necesse est Iūliae convocāre suōs frātrēs quam celerrimē."
    boni:
      - question: ""
        answer: "IT IS NECESSARY FOR JULIA TO CALL"
      - question: ""
        answer: "TOGETHER HER BROTHERS AS QUICKLY AS POSSIBLE // Translate: Pater iubet Iūliam convocāre frātrēs quam celerrimē. // FATHER IS ORDERING JULIA TO CALL // TOGETHER HER BROTHERS AS QUICKLY AS POSSIBLE // Translate: Pater dīcit Iūliam convocāre frātrēs quam celerrimē. // FATHER SAYS THAT JULIA IS CALLING // HER BROTHERS TOGETHER AS QUICKLY AS POSSIBLE"
  - tossup:
      question: "By whom were the emperor Elagabalus and his mother murdered?"
      answer: "PRAETORIAN GUARDS"
    boni:
      - question: ""
        answer: "Name his aunt who had bribed the guards."
      - question: ""
        answer: "IULIA MAMAEA // Name Iulia Mamaea's son who then became emperor at"
  - tossup:
      question: ""
      answer: "SEVERUS ALEXANDER"
  - tossup:
      question: "What son of Pelias accompanied Jason?"
      answer: "ACASTUS"
    boni:
      - question: "What was the kingdom Pelias had usurped from Jason's father Aeson?"
        answer: "IOLCUS"
      - question: "Acastus king of Iolcus?"
        answer: "After the quest for the fleece was over, where did Jason and Medea go to rule, leaving // CORINTH"
  - tossup:
      question: "What did Lollius Urbicus build from AD 139 - 142 for Antoninus Pius?"
      answer: "WALL ACROSS SCOTLAND FROM FORTH TO CLYDE"
    boni:
      - question: "Of what material was this wall built?"
        answer: "TURF"
      - question: "In whose reign was the Antonine Wall abandoned?"
        answer: "COMMODUS'"
