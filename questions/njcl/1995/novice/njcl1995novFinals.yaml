        answer: "Give a synonym of antrum. // SPECUS / SPĒLUNCA / CAVERNA // 16 // C100 Pg4 // ALIMENTUM / VĪCTUS / ESCA"
  - tossup:
      question: "Who was the wife of Tiberius and mother of his son Drusus?"
      answer: "VIPSANIA AGRIPPINA"
    boni:
      - question: "Who was the wife of Germanicus and the mother of his nine children?"
        answer: "VIPSANIA AGRIPPINA MAIOR (THE ELDER)"
      - question: "Who was the wife of Cn. Domitius Ahenobarbus, then her uncle Claudius?"
        answer: "IULIA AGIPPINA MINOR (THE YOUNGER)"
  - tossup:
      question: ""
      answer: "According to Homer, who murders Agamemnon after he returns home from the Trojan"
    boni:
      - question: "War?"
        answer: "AEGISTHUS"
