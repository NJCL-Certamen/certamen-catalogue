tournament: "NJCL Certamen"
year: 1995
division: "Novice"
round: "Semifinals"
questions:
  - tossup:
      question: "What Latin verb meaning “build” has as its root the noun aedēs?"
      answer: "AEDIFICĀRE"
    boni:
      - question: "What does aedēs mean in the plural?"
        answer: "HOUSE"
      - question: "What public office in Rome took its name from aedēs?"
        answer: "AEDILIS / AEDILE"
  - tossup:
      question: ""
      answer: "Differentiate in meaning between the idioms grātiās agere and grātiam habēre."
    boni:
      - question: ""
        answer: "GRĀTIĀS AGERE -- THANK"
      - question: ""
        answer: "GRĀTIAM HABĒRE -- FEEL GRATEFUL //...between iter facere and iter dāre. // ITER FACERE -- MARCH // ITER DĀRE -- GIVE THE RIGHT OF WAY //...between castra pōnere and castra movēre. // CASTRA PŌNERE -- PITCH CAMP // CASTRA MOVĒRE -- BREAK CAMP"
  - tossup:
      question: ""
      answer: "What use of the dative is found in this sentence:"
    boni:
      - question: "Magister puerō librum dedit."
        answer: "INDIRECT OBJECT"
      - question: "Magister puerō librum scrīpsit."
        answer: "REFERENCE // Magister puerō auxiliō librum dedit DOUBLE DATIVE (reference & purpose (service))"
  - tossup:
      question: "What was the underworld river of forgetfulness?"
      answer: "LETHE"
    boni:
      - question: "Who explains to Aeneas that souls must drink of the River Lethe before they are reincarnated?"
        answer: "ANCHISES"
      - question: "Name three other rivers in the underworld."
        answer: "STYX, PHLEGETHON, COCYTUS, ACHERON"
  - tossup:
      question: "Change partis to plural."
      answer: "PARTIUM"
    boni:
      - question: "Change partium to accusative."
        answer: "PARTĒS"
      - question: "What case follows pars?"
        answer: "GENITIVE"
  - tossup:
      question: ""
      answer: "Claude oculum dextrum et aperī ōs."
    boni:
      - question: ""
        answer: "PLAYER SHOULD CLOSE RIGHT EYE AND OPEN MOUTH"
      - question: ""
        answer: "Surge et ambulā circum mēnsam. // ONE PLAYER SHOULD STAND AND WALK AROUND TABLE // Tollite vestrās manūs et lātrāte. // All PLAYERS SHOULD RAISE HANDS AND BARK // 10 // C10 pg2"
  - tossup:
      question: "Who instigated the assassination of the emperor Caracalla?"
      answer: "MACRINUS"
    boni:
      - question: "Name the woman who led the revolt against Macrinus' rule?"
        answer: "IULIA MAESA"
      - question: "Name Iulia Maesa's grandson whom she made emperor."
        answer: "ELAGABALUS / VARIUS AVITUS BASSIANUS"
  - tossup:
      question: "What childhood playmate did Athena accidentally kill?"
      answer: "PALLAS"
    boni:
      - question: "For five pts. each, what two things does Athena do to assuage her grief?"
        answer: "(1) PUT THE NAME OF PALLAS BEFORE HER OWN"
      - question: ""
        answer: "(2) MADE A WOODEN IMAGE OF PALLAS -- PALLADIUM"
  - tossup:
      question: "Change nōluistis to present."
      answer: "NŌN VULTIS"
    boni:
      - question: "Change nōn vultis to future."
        answer: "NOLĒTIS"
      - question: "Change nolētis to passive."
        answer: "DOES NOT EXIST"
  - tossup:
      question: "Give an antonym of validus."
      answer: "AEGER / AEGRŌTUS"
    boni:
      - question: "Give an antonym of angustus."
        answer: "LĀTUS / LAXUS / AMPLUS / PATĒNS / SPATIŌSUS"
      - question: "Give an antonym of semper."
        answer: "NUMQUAM"
  - tossup:
      question: "What two mortal men were honored by the gods' presence at their weddings?"
      answer: "PELEUS & CADMUS"
    boni:
      - question: "Whom was Peleus marrying?"
        answer: "THETIS"
      - question: "Whom was Cadmus marrying?"
        answer: "HARMONIA"
  - tossup:
      question: ""
      answer: "Listen carefully to the following paragraph, which I will read twice, and answer in English the question about it. Lucius, vēnātor nōtissimus, per silvam ambulābat ubi maximam ursam inspexit. Lucius ursam fortiter oppugnāvit sed necātus est. Quam miserābile!"
    boni:
      - question: "What kind of hunter was Lucius?"
        answer: "VERY FAMOUS"
      - question: "Describe the bear. What happened to Lucius?"
        answer: "VERY LARGE // HE WAS KILLED BY THE BEAR"
  - tossup:
      question: "What Latin verb is the root of the English noun “subsidy?"
      answer: "” SEDEŌ"
    boni:
      - question: "What Latin verb is the root of the English adjective “surreptitious?"
        answer: "” RAPIŌ"
      - question: "What Latin verb is the root of the English verb “supply?"
        answer: "” PLEŌ // 11 // C10 ps 3"
  - tossup:
      question: "What was organized as a result of a conference in Bononia in 43 BC?"
      answer: "SECOND TRIUMVIRATE"
    boni:
      - question: "What law gave legal authority to the triumvirate for five years?"
        answer: "LEX TITIA"
      - question: "Where did the Second Triumvirate get the money it needed to defeat Brutus, Cassius, and the other conspirators?"
        answer: "PROSCRIPTIONS"
  - tossup:
      question: ""
      answer: "Differentiate in meaning between accidō and occīdō."
    boni:
      - question: ""
        answer: "ACCIDŌ -- HAPPEN"
      - question: "...between occidō and dēcidō? What Latin noun related to occidō, dēcidō, and accidō means “opportunity?"
        answer: "OCCĪDŌ -- KILL // OCCĪDŌ -- FALL DOWN // DĒCIDŌ -- FALL DOWN // ” // CĀSUS / OCCĀSIO"
  - tossup:
      question: "Whom did Achilles kill for mocking him as he grieved over the body of Penthesilea?"
      answer: "THERSITES"
    boni:
      - question: "To what gods did Achilles have to sacrifice to expiate himself for killing Thersites?"
        answer: "APOLLO AND ARTEMIS (AND LETO)"
      - question: "What other Greek chieftain purified Achilles after the slaying of Thersites?"
        answer: "ODYSSEUS"
  - tossup:
      question: "Upon which emperor did the Senate confer the title “Pius”?"
      answer: "ANTONINUS"
    boni:
      - question: "Who adopted Antoninus as his successor?"
        answer: "HADRIAN"
      - question: "Whom did Hadrian insist that Antoninus adopt as his successors?"
        answer: "M. AURELIUS (M. ANNIUS VERUS) & L. VERUS (L. CEIONIUS COMMODUS)"
  - tossup:
      question: "What city recruited Pyrrhus of Epirus to help them fight Rome?"
      answer: "TARENTUM"
    boni:
      - question: "What minister of Pyrrhus came to Rome to try to negotiate peace?"
        answer: "CINEAS"
      - question: "What was the first of the battles Rome fought with Pyrrhus, and who won?"
        answer: "HERACLEA (280 BC), WON BY PYRRHUS"
  - tossup:
      question: "How was the start of a chariot race signaled?"
      answer: "WAVED A WHITE CLOTH (MAPPA)"
    boni:
      - question: "How was the starting line indicated?"
        answer: "WHITE CHALK"
      - question: "Around what structure in the circus did the chariots race?"
        answer: "SPINA"
  - tossup:
      question: "Where did Odysseus and his men land after escaping from the Cyclops Polyphemus?"
      answer: "ISLE OF AEOLUS (KING OF THE WINDS)"
    boni:
      - question: "After losing the winds given to them by Aeolus, to what land did they row?"
        answer: "LAESTRYGONIANS (CANNIBALS)"
      - question: "Escaping with only one ship, where did Odysseus land next?"
        answer: "AEAEA, CIRCE'S ISLAND"
