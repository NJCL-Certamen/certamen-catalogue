tournament: "NJCL Certamen"
year: 1995
division: "Advanced"
round: "Round 2"
questions:
  - tossup:
      question: "What Roman author was the <latin>arbiter elegantiae</latin> in Nero's court?"
      answer: "PETRONIUS"
    boni:
      - question: "What is the title of Petronius' novel?"
        answer: "<latin>SATYRICON</latin>"
      - question: "Who is the wealthy freedman whose banquet is the novel's most famous scene?"
        answer: "TRIMALCHIO"
  - tossup:
      question: "What flower grew in a meadow in Hades?"
      answer: "ASPHODEL (as' fō - del)"
    boni:
      - question: "According to Homer, who inhabited the meadow of asphodels?"
        answer: "SHADES OF HEROES"
      - question: "What nymph was transformed into a white poplar tree which grew beside the Pool of Memory?"
        answer: "LEUCE // paulatim"
  - tossup:
      question: ""
      answer: "Differentiate in meaning between paulō and paulatim -- (BY A) LITTLE, SOMEWHAT"
    boni:
      - question: ""
        answer: "PAULĀTIM -- LITTLE BY LITTLE, GRADUALLY"
      - question: "...in meaning between aeternus and aetās."
        answer: "...in meaning between cōnsuēscō and cōnsuētūdō -- BECOME ACCUSTOMED // cōnsuētūdō CŌNSUĒTŪDŌ -- CUSTOM // AETERNUS -- ETERNAL // AETĀS -- AGE"
  - tossup:
      question: "What Latin adjective with what meaning is the root of the English noun “anguish?"
      answer: "”"
    boni:
      - question: ""
        answer: "ANGUSTUS -- NARROW, THIN"
      - question: "What Latin verb with what meaning is the root of the English verb “hesitate? What Latin verb with what meaning is the root of the English noun “emergency?"
        answer: "” // HAEREŌ -- STICK, CLING, ADHERE // ” // MERGŌ -- DIP, PLUNGE, SINK, DROWN"
  - tossup:
      question: "Where was Hasdrubal, Hannibal's brother, defeated by the Romans in 207 BC?"
      answer: "THE METAURUS RIVER"
    boni:
      - question: "For five pts. each, name the two consuls, political enemies, who led the victorious Roman forces. (M. LIVIUS) SALINATOR & (C."
        answer: "CLAUDIUS) NERO"
  - tossup:
      question: "What poet wrote the line <latin>Nunc est bibendum, nunc pede libero pulsanda tellus</latin>?"
      answer: "HORACE"
    boni:
      - question: "What victory was Horace celebrating?"
        answer: "ACTIUM / OVER ANTONY & CLEOPATRA"
      - question: "To which of his poetic collections does the entire poem belong?"
        answer: "ODES (I, XXXVII)"
  - tossup:
      question: "What is the meaning of the idiom domī mīlitiaeque?"
      answer: "AT HOME AND IN THE FIELDS / AT PEACE AND IN WAR"
    boni:
      - question: "Besides cur, give a synonym of quā dē causā?"
        answer: "QUAM OB REM / QUARE / QUID"
      - question: "What idiom means “it is worthwhile?"
        answer: "” TANTĪ EST"
  - tossup:
      question: "What late Latin writer wrote <latin>The Consolation of Philosophy</latin>?"
      answer: "BOETHIUS"
    boni:
      - question: "Under what difficult circumstances did he write this work?"
        answer: "IMPRISONED OR FACING EXECUTION (FOR TREASON)"
      - question: "What 6th century Ostrogoth king of Italy had imprisoned him?"
        answer: "THEODORIC (THE GREAT)"
  - tossup:
      question: "Which of the following does NOT belong because of gender: ficus, acus, domus, vulnus, Īdūs?"
      answer: "VULNUS"
    boni:
      - question: "Acer, iūs, imber, gelu, pelagus?"
        answer: "IMBER"
      - question: "Poēta, poēma, pollex, polus, pons?"
        answer: "POĒMA"
  - tossup:
      question: "Which of Cicero's works includes the <latin>Somnium Scipionis</latin>?"
      answer: "DE RE PUBLICA"
    boni:
      - question: "Which Scipio is having a dream?"
        answer: "P. CORNELIUS SCIPIO AEMILIANUS"
      - question: "On what Greek author's work is the <latin>Somnium</latin> modeled?"
        answer: "AFRICANUS MINOR NUMANTINUS // PLATO'S"
  - tossup:
      question: "Who was the Roman general who defeated Attila & the Huns in A.D. 451 at the Battle of the Catalaunian Plains?"
      answer: "FLAVIUS AETIUS"
    boni:
      - question: "What group joined forces with Aetius to defeat the Huns?"
        answer: "VISIGOTHS"
      - question: "Under what emperor did Aetius serve?"
        answer: "VALENTINIAN III"
  - tossup:
      question: ""
      answer: "Translate: Gladiātor ad certāmen vincendum duōbus gladiīs ūsus est."
    boni:
      - question: ""
        answer: "THE GLADIATOR USED TWO SWORDS TO WIN THE STRUGGLE"
      - question: ""
        answer: "Illī gladiī maximō ūsuī gladiātōrī erant. // THOSE SWORDS WERE OF THE GREATEST USE / VERY USEFULTO THE GLADIATOR // Nōn est iam gladiātōrī ūsus ullīs gladiīs. // THE GLADIATOR NO LONGER NEEDS ANY SWORDS // (THERE IS NO LONGER A NEED OF ANY SWORDS FOR THE GLADIATOR)"
  - tossup:
      question: "Who was emperor of Rome when Boudicca and the Iceni revolted in Britain?"
      answer: "NERO"
    boni:
      - question: "...when BarCochba led the Jewish revolt in Palestine?"
        answer: "HADRIAN"
      - question: "...when Tacfarinas led a revolt in Africa?"
        answer: "TIBERIUS"
  - tossup:
      question: "How many case forms do dea and deus have in common?"
      answer: "NONE"
    boni:
      - question: "Besides dea and filia, name another noun which can end in -ābus in the dative and ablative plural."
        answer: "LĪBERTA, MŪLA, EQUA"
      - question: "Give an archaic ending for the genitive singular of 1st declension. -ĀS / -AI (e.g."
        answer: "FAMILIĀS)"
  - tossup:
      question: "The following words all have the Greek word nēsos (nay-sauce) in common: Indonesia, Micronesia, Polynesia, Peloponnesus. What does nēsos mean?"
      answer: "ISLAND"
    boni:
      - question: "What does Micronesia mean?"
        answer: "SMALL ISLANDS"
      - question: "What does Polynesia mean?"
        answer: "MANY ISLANDS"
  - tossup:
      question: "Translate into Latin the verbs in the following sentence: If a tornado should capture us, we would fly to the land of Oz."
      answer: "CAPIAT, VELIMUS"
    boni:
      - question: "If you had had ruby slippers like Dorothy's, you too would have returned home."
        answer: "HABUISSĒS / FUISSENT"
      - question: ""
        answer: "REVERSUS ESSĒS / REVERTISSĒS / REVĒNISSĒS / REDIISSĒS / REDISSĒS // If I only had a brain. HABĒREM / ESSET (UTINAM optional)"
  - tossup:
      question: "When Aeolus gave Odysseus a bag of winds, which wind did he NOT enclose?"
      answer: "ZEPHYRUS (WEST)"
    boni:
      - question: "Why did the men open the bag?"
        answer: "THEY THOUGHT IT CONTAINED TREASURE NOT SHARED WITH THEM"
      - question: "Where were they blown by all the released winds?"
        answer: "BACK TO AEOLIA"
  - tossup:
      question: "Quī deus cēterīs deīs arma faciēbat?"
      answer: "VULCĀNUS"
    boni:
      - question: "Quī deus fulmina iaciēbat?"
        answer: "IUPPITER"
      - question: "Quī deus tridentem ferēbat?"
        answer: "NEPTŪNUS"
  - tossup:
      question: "What king of Corinth gave his daughter to Jason as a wife?"
      answer: "CREON"
    boni:
      - question: "Who was the daughter?"
        answer: "GLAUCE (CREUSA)"
      - question: "How did Medea dispose of this rival?"
        answer: "GAVE HER A POISONED WEDDING GOWN WHICH BURNED HER (AND CREON) ALIVE // 6 // A2pg4"
  - tossup:
      question: "At what Roman festival was the presence of men prohibited?"
      answer: "THE BONA DEA FESTIVAL"
    boni:
      - question: "What animal was sacrificed to her?"
        answer: "A SOW"
      - question: "What plant was forbidden in the decorations?"
        answer: "THE MYRTLE // 7"
