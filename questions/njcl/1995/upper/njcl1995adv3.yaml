tournament: "NJCL Certamen"
year: 1995
division: "Advanced"
round: "Round 3"
questions:
  - tossup:
      question: "What Roman based his version of the tragedy on the <latin>Medea</latin> of Euripides?"
      answer: "SENECA THE YOUNGER"
    boni:
      - question: "How many tragedies are definitely Seneca's work?"
        answer: "NINE"
      - question: "How many of his tragedies have the name “Hercules” in their titles?"
        answer: "TWO"
  - tossup:
      question: ""
      answer: "Translate this sentence into English:"
    boni:
      - question: ""
        answer: "Senātor effūgit Rōmā vītandōrum inimīcōrum causā."
      - question: ""
        answer: "THE SENATOR FLED FROM ROME TO AVOID HIS ENEMIES // Translate this sentence into English: Cincinnātus praeest agrō arandō. // CINCINNATUS IS IN CHARGE OF PLOWING THE FIELD // Translate this sentence into English: Quis est quīn errandō discat. // WHO IS THERE WHO DOESN'T LEARN BY MAKING MISTAKES"
  - tossup:
      question: "What kinsman and lover of Phaethon was turned into a swan by Apollo?"
      answer: "CYCNUS"
    boni:
      - question: "This etiological myth explains why swans fly low. Why do they?"
        answer: "CYCNUS SHUNNED ZEUS' REALM BECAUSE ZEUS HAD KILLED PHAETHON"
      - question: "What English expression for a final act comes from this story?"
        answer: "SWAN SONG (BECAUSE SWANS WERE THOUGHT TO SING JUST BEFORE THEY DIE)"
  - tossup:
      question: "Whom did Heracles rescue while he was in Tartarus fetching Cerberus?"
      answer: "THESEUS"
    boni:
      - question: "What friend of Theseus was Heracles unable to rescue?"
        answer: "PEIRITHOÜS"
      - question: "Under what condition did Hades allow Heracles to take Cerberus?"
        answer: "COULD NOT USE WEAPONS / THAT HE BRING HIM BACK (UNHARMED)"
  - tossup:
      question: "What seer told Odysseus not to harm the cattle of Helios?"
      answer: "TIRESIAS"
    boni:
      - question: "What did he tell Odysseus about his own death?"
        answer: "THAT IT WOULD COME FROM THE SEA"
      - question: "What singular honor was bestowed on Tiresias' ghost, according to Homer?"
        answer: "HE ALONE KEPT HIS INTELLIGENCE AFTER DEATH / // COULD TALK w/o DRINKING BLOOD"
  - tossup:
      question: ""
      answer: "Differentiate in meaning between pingō and pinguis."
    boni:
      - question: ""
        answer: "PINGŌ --PAINT / DEPICT / PORTRAY"
      - question: ""
        answer: "PINGUIS -- FAT / SLEEK //...between torus and turris. // TORUS -- COUCH / KNOT // TURRIS -- TOWER //...between lītus and līnum. // LĪTUS -- SEA-SHORE // LĪNUM -- FLAX, LINEN, THREAD, ROPE, FISHING LINE"
  - tossup:
      question: "Who banished the poet Ovid to Tomi on the Black Sea?"
      answer: "AUGUSTUS"
    boni:
      - question: "Ovid tells us in three Latin words why he was exiled. What are those words?"
        answer: "CARMEN ET ERROR"
      - question: "In which of his works did Ovid describe his last night in Rome, the voyage to Tomi, and his exile?"
        answer: "TRISTIA"
  - tossup:
      question: ""
      answer: "Not counting assonance or alliteration, of what figure of speech is this an example:"
    boni:
      - question: "Poeni, velut apes, laborant."
        answer: "SIMILE"
      - question: ""
        answer: "... Turnus, leo ferox Rutulorum METAPHOR //... pulcher corpore, oculis maestus CHIASMUS / ASYNDETON"
  - tossup:
      question: "Who was the first known writer of tragedy in Latin?"
      answer: "LIVIUS ANDRONICUS"
    boni:
      - question: "Name another genre of literature written by Andronicus."
        answer: "EPIC / COMEDY / LYRIC"
      - question: "In what capacity did he come to Rome?"
        answer: "AS A PRISONER OF WAR / SLAVE"
  - tossup:
      question: "What type of conditional is found in the following sentence: Sī respexeris, aliquid mīrī vidēbis."
      answer: "FUTURE MORE VIVID / SIMPLE CONDITION"
    boni:
      - question: "What use of the genitive is found in that sentence?"
        answer: "PARTITIVE"
      - question: ""
        answer: "Translate the sentence in the toss-up. // IF YOU (WILL) LOOK BEHIND (BACK), YOU WILL SEE SOMETHING AMAZING (STRANGE, WONDERFUL, MARVELOUS, etc.)"
  - tossup:
      question: "Which of the Five Good Emperors was chosen by the Senate?"
      answer: "NERVA"
    boni:
      - question: "What precedent did Nerva establish for imperial succession?"
        answer: "ADOPTION OF AN HEIR (OF PROVEN ABILITY)"
      - question: "Which of the Five Good Emperors broke with this precedent?"
        answer: "MARCUS AURELIUS"
  - tossup:
      question: ""
      answer: "What use of the ablative case is found in the following sentence:"
    boni:
      - question: "Discipulī linguae Latīnae virtūte praecēdunt."
        answer: "SPECIFICATION (RESPECT)"
      - question: "Agrum vēndidit sēstertium sex mīlibus. Quō minus cupiditātis, eō plūs auctōritātis."
        answer: "PRICE // DEGREE (MEASURE) OF DIFFERENCE // (Translation: Where there is less ambition, there is more leadership.)"
  - tossup:
      question: "Whom did Orestes marry?"
      answer: "HERMIONE"
    boni:
      - question: "Who were her parents?"
        answer: "MENELAUS AND HELEN"
      - question: "What Greek warrior did Orestes slay because of Hermione?"
        answer: "PYRRHUS / NEOPTOLEMUS"
  - tossup:
      question: "What is the accusative singular of “broken bone?"
      answer: "” OS FRACTUM / RUPTUM"
    boni:
      - question: "Change os fractum to plural."
        answer: "OSSA FRACTA"
      - question: "The Latin word Ossifragus is a compound of os and frangō. What bird did the Romans call ossifragus, perhaps because of its ability to break bones?"
        answer: "SEA-EAGLE, OSPREY, BEARDED VULTURE"
  - tossup:
      question: "What great honor did M. Claudius Marcellus win in 222 BC by killing the enemy chieftain Viridomarus in single combat?"
      answer: "SPOLIA OPIMA"
    boni:
      - question: "What Greek city did Marcellus capture in 211 BC?"
        answer: "SYRACUSE"
      - question: "By what nickname was Marcellus known?"
        answer: "THE SWORD OF ROME"
  - tossup:
      question: "According to tradition, which of Rome's kings founded the Senate?"
      answer: "ROMULUS"
    boni:
      - question: "Which Roman king built the Curia or Senate House?"
        answer: "TULLUS HOSTILIUS"
      - question: "Which Roman king added to the Senate a hundred members, who were called minores gentes?"
        answer: "TARQUINIUS PRISCUS"
  - tossup:
      question: "Where have the Roman world's earliest known baths been found?"
      answer: "POMPEII"
    boni:
      - question: "Which of the several baths in Pompeii has this distinction?"
        answer: "THE STABIAN BATHS (1st century BC)"
      - question: "Who built the first public baths in Rome?"
        answer: "AGRIPPA (c. 20 BC)"
  - tossup:
      question: ""
      answer: "Translate the motto of the kings of Scotland, Nēmō mē impūne lacessit."
    boni:
      - question: ""
        answer: "NO ONE PROVOKES ME “SCOT”-FREE / UNPUNISHED / WITH IMPUNITY"
      - question: ""
        answer: "Translate the motto of Paris, Fluctuat nec mergitur. // IT IS TOSSED BY THE WAVES BUT DOES NOT SINK / IT IS TOSSED ABOUT NOR IS IT SUBMERGED // Translate the motto of the City and Guilds of the London Institute, coram deō labōrāmus. // WE WORK IN THE PRESENCE OF (FACE TO FACE WITH) GOD"
  - tossup:
      question: "What are the comparative and superlative forms of ēgregius?"
      answer: "MAGIS ĒGREGIUS & MAXIMĒ ĒGREGIUS"
    boni:
      - question: "...of īnferus?"
        answer: "ĪNFERIOR & ĪNFIMUS (ĪMUS)"
      - question: "...of frūgī?"
        answer: "FRŪGĀLIOR & FRŪGĀLISSIMUS (indeclinable adj.)"
  - tossup:
      question: "What two verbs, with what meanings, combine to form the verb tumefaciō?"
      answer: "TUMEŌ -- SWELL, BE BOMBASTIC"
    boni:
      - question: ""
        answer: "FACIŌ -- DO, MAKE"
      - question: "What Latin adjective, related to tumeō, means “swollen? What related Latin noun means “mound of earth?"
        answer: "” TUMIDUS // ” TUMULUS // 11"
