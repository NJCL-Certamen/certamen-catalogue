tournament: "NJCL Certamen"
year: 1995
division: "Advanced"
round: "Semifinals"
questions:
  - tossup:
      question: "Give an antonym of dominor."
      answer: "SERVIO"
    boni:
      - question: "Give an antonym of nectō."
        answer: "LAXŌ / SOLVŌ / REMITTŌ / LĪBERŌ / EXIMŌ / EXPEDIŌ"
      - question: "What English verb derived from nectō means “to incorporate into an existing country?"
        answer: "” ANNEX"
  - tossup:
      question: "Sāl means “salt” in the singular. What does it mean in the plural?"
      answer: "WITTICISMS"
    boni:
      - question: "Comitium means “place of assembly.” What does comitia mean?"
        answer: "ELECTION (an assembly FOR THE PURPOSE OF ELECTION)"
      - question: "Opera means “work.” Who are operae?"
        answer: "DAY-LABOURERS"
  - tossup:
      question: "Who was Achilles' charioteer?"
      answer: "AUTOMEDON"
    boni:
      - question: "For what other warrior did Automedon drive the chariot?"
        answer: "PATROCLUS"
      - question: "What Trojan did Automedon kill to avenge Achilles' death?"
        answer: "ARETUS"
  - tossup:
      question: "What government bulletin was a daily gazette of important social and political news -- sometimes called history's first daily newspaper?"
      answer: "ACTA DIURNA"
    boni:
      - question: "What was the year of their beginnings?"
        answer: "59 BC"
      - question: "What historian tells us that Julius Caesar instituted the acta diurna?"
        answer: "SUETONIUS"
  - tossup:
      question: "What book of the <latin>Aeneid</latin> contains the description of Aeneas' armor?"
      answer: "EIGHT"
    boni:
      - question: "Who in Book 8 takes Aeneas on a prophetic tour of the future Rome?"
        answer: "EVANDER"
      - question: "What animal omen appears to Aeneas on the banks of the Tiber?"
        answer: "A WHITE SOW WITH 30 YOUNG"
  - tossup:
      question: "What god prophesied that Aeneas would rule over Troy and save from extincion the house of Dardanus?"
      answer: "POSEIDON"
    boni:
      - question: "At what age was Aeneas brought to his father Anchises by the nymphs who had cared for him?"
        answer: "FIVE"
      - question: "Where specifically was Aeneas born?"
        answer: "DARDANIA, ON THE SLOPES OF MT. IDA"
  - tossup:
      question: ""
      answer: "Translate: Spērō Latīnam semper in scholā doctum īrī."
    boni:
      - question: ""
        answer: "I HOPE THAT LATIN WILL ALWAYS BE TAUGHT IN SCHOOL"
      - question: "Fore is a contraction of what?"
        answer: "Transform the sentence in the toss-up to a clause of result using fore ut. // SPĒRŌ FORE UT LATĪNA SEMPER IN SCHOLĀ DOCEĀTUR // FUTŪRUS/A/UM ESSE"
  - tossup:
      question: ""
      answer: "Distinguish between pecus, -oris and pecus, -udis."
    boni:
      - question: ""
        answer: "PECUS, -ORIS -- HERD OF CATTLE"
      - question: ""
        answer: "PECUS, -UDIS -- A SINGLE HEAD OF CATTLE // Define pectus. // CHEST, BREAST // Define pecū. // SHEEP, FLOCKS"
  - tossup:
      question: "What is the 3rd person plural imperfect subjunctive of prōsum?"
      answer: "PRŌDESSENT"
    boni:
      - question: ""
        answer: "Change prōdessent to perfect."
      - question: "What case does prōsum take?"
        answer: "PRŌFUERINT // DATIVE"
  - tossup:
      question: ""
      answer: "Faciō : fac :: meminī : __________."
    boni:
      - question: ""
        answer: "MEMENTŌ"
      - question: ""
        answer: "Amō : amābō :: habēte : __________. // HABĒTŌTE // Amās : amat :: habētōte : __________. // HABĒNTŌ"
  - tossup:
      question: "What ancient historian is our chief source of information on the Peloponnesian War?"
      answer: "THUCYDIDES"
    boni:
      - question: "... on the Persian Wars?"
        answer: "HERODOTUS"
      - question: "What great Greek historian chronicled the rise of Rome into the second century BC?"
        answer: "POLYBIUS"
  - tossup:
      question: "What son of Theseus was brought back to life by Asclepius?"
      answer: "HIPPOLYTUS"
    boni:
      - question: "How had Hippolytus died?"
        answer: "DRAGGED TO DEATH BEHIND HIS CHARIOT"
      - question: "What minor Italian deity did Hippolytus become?"
        answer: "VIRBIUS"
  - tossup:
      question: "Whom did the Athenians defeat in the Battle of Marathon?"
      answer: "THE PERSIANS"
    boni:
      - question: "What was the year?"
        answer: "BC"
      - question: "Who commanded the Greeks?"
        answer: "MILTIADES"
  - tossup:
      question: "Whose improvement of the “grapnel” helped him to win decisive naval victories at Mylae and Naulochus?"
      answer: "<latin>MARCUS VIPSANIUS AGRIPPA</latin>"
    boni:
      - question: "Whom did he defeat?"
        answer: "<latin>SEXTUS POMPEIUS</latin>"
      - question: "What lake near Cumae did Agrippa convert into the harbor Portus Iulius to train a new fleet for the campaign against Sextus?"
        answer: "<latin>LACUS AVERNUS</latin>"
  - tossup:
      question: "Which, if any, of the following is NOT derived from the same Latin word as the others: plait, pliant, appliance, explicate, plywood."
      answer: "<latin>NONE</latin>"
    boni:
      - question: "...astringent, stratify, constrict, constraint, strait."
        answer: "<latin>STRATIFY</latin>"
      - question: "...incumbent, incubate, cubicle, cumbersome, concubine."
        answer: "<latin>CUMBERSOME</latin>"
  - tossup:
      question: "Who became the emperor of Italy, Africa, and Illyricum upon the death of Constantine in AD 337?"
      answer: "<latin>CONSTANS</latin>"
    boni:
      - question: "Which of his brothers and co-emperors did he defeat and kill in AD 340?"
        answer: "<latin>CONSTANTINE II</latin>"
      - question: "Which of his brothers and co-emperors became the sole ruler in AD 350 when Constans was killed by Magnentius?"
        answer: "<latin>CONSTANTIUS II</latin>"
  - tossup:
      question: "Which of Penelope's suitors dissuaded the others from murdering Telemachus on his return to Ithica?"
      answer: "<latin>AMPHINOMUS</latin>"
    boni:
      - question: "Where had Telemachus been?"
        answer: "<latin>SPARTA AND PYLOS</latin>"
      - question: "Who killed Amphinomus when the fighting broke out?"
        answer: "<latin>TELEMACHUS</latin>"
  - tossup:
      question: "Who wrote the <latin>Noctes Atticae</latin>?"
      answer: "<latin>AULUS GELLIUS</latin>"
    boni:
      - question: "Why did Gellius name this collection of short essays “Attic Nights”?"
        answer: "either BEGAN WRITING THEM WHEN STUDYING IN ATHENS"
      - question: "What was the stated purpose of these essays?"
        answer: "or WRITTEN IN MEMORY OF HAPPY TIMES STUDYING IN ATHENS // <latin>FOR THE BENEFT / EDIFICATION OF HIS CHILDREN</latin>"
  - tossup:
      question: ""
      answer: "Listen carefully to the following sentence, which I will read twice, and answer in Latin the question about it. Cōmissātiōne perfectā, saltātrīcēs quae vīnum effūderant magnō pretiō ēmptae sunt."
    boni:
      - question: "Quō factō saltātrīcēs ēmptae sunt?"
        answer: "CŌMISSĀTIŌNE PERFECTĀ"
      - question: "Quid saltātrīcēs fēcerant? Quantī saltātrīcēs ēmptae sunt?"
        answer: "VĪNUM EFFŪDERANT // MAGNŌ PRETIŌ or MAGNĪ"
  - tossup:
      question: "Whose great work begins <latin>Urbem Romam a principio reges habuere</latin>?"
      answer: "TACITUS'"
    boni:
      - question: "What is this work?"
        answer: "<latin>ANNALES</latin>"
      - question: "From what event in history does the Annales begin?"
        answer: "THE DEATH OF AUGUSTUS (ab excessu divi Augusti) // #"
