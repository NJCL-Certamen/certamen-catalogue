tournament: "NJCL Certamen"
year: 1996
division: "Intermediate"
round: "Extra Questions"
questions:
  - tossup:
      question: "Whose pet white fawn was regarded by the Lusitanians as a sign of divine protection?"
      answer: "SERTORIUS"
    boni:
      - question: "Whose failed coup in Italy in 78-77 BC supplied disaffected officers to Sertorius’ cause?"
        answer: "LEPIDUS"
      - question: "By whom was Sertorius murdered in 72 BC?"
        answer: "M. PERPERNA"
  - tossup:
      question: "What sacred object supposedly fell from the sky as a gift from Jupiter to Numa?"
      answer: "THE <latin>ANCILE</latin>, MARS’ FIGURE-8 SHIELD"
    boni:
      - question: "What priestly order wore replicas of it?"
        answer: "<latin>SALLII</latin>"
      - question: "What god besides Mars was their order connected with?"
        answer: "HERCULES or QUIRINUS"
  - tossup:
      question: "What two proven commanders vied for the command of the East against Mithridates?"
      answer: "GAIUS MARIUS & LUCIUS CORNELIUS SULLA"
    boni:
      - question: "What tribune, in return for political support, secured the passage of a law transferring the command from Sulla to Marius?"
        answer: "SULPICIUS RUFUS"
      - question: "How did Sulla respond to the loss of this command?"
        answer: "MARCHED ON ROME & TOOK THE CITY BY FORCE"
  - tossup:
      question: "Who divorced his wife for adultery with Julius Caesar and shortly thereafter married Caesar’s daughter?"
      answer: "POMPEY (CN. POMPEIUS MAGNUS)"
    boni:
      - question: "Name Caesar’s daughter."
        answer: "JULIA"
      - question: "What political alliance did the marriage of Pompey and Julia strengthen?"
        answer: "FIRST TRIUMVIRATE"
  - tossup:
      question: "Which emperor closed all pagan temples in AD 391?"
      answer: "THEODOSIUS I (THE GREAT)"
    boni:
      - question: "Name the bishop of Milan who exerted great influence over Theodosius?"
        answer: "AMBROSE / AMBROSIUS"
      - question: "What work by what author did Ambrose revise as <latin><title>De officiis ministrorum</title></latin>?"
        answer: "CICERO’S <latin><title>DE OFFICIIS</title></latin>"
  - tossup:
      question: "Who was the faithful companion of Aeneas?"
      answer: "ACHATES"
    boni:
      - question: "Who was Aeneas’ Trojan wife?"
        answer: "CREUSA"
      - question: "Who was Creusa’s father?"
        answer: "PRIAM"
  - tossup:
      question: "What was the breastplate of Zeus and Athena called?"
      answer: "AEGIS"
    boni:
      - question: "Whose head was depicted in the center of the aegis?"
        answer: "MEDUSA’S"
      - question: "Who made the aegis?"
        answer: "HEPHAESTUS"
  - tossup:
      question: "What creature did Apollo have to slay to claim Delphi for his oracle?"
      answer: "THE PYTHON"
    boni:
      - question: "What epithet did Apollo receive for this?"
        answer: "PYTHIAN (PYTHIUS)"
      - question: "To what other deity had this site already been consecrated?"
        answer: "GAIA or THEMIS or PHOEBE"
  - tossup:
      question: "What deity protected the original oracle at Delphi before Apollo took it over?"
      answer: "GAIA"
    boni:
      - question: "What guise did Apollo take to compel a ship full of Cretans to divert to Delphi and become his first priests there?"
        answer: "A DOLPHIN"
      - question: "What was the name of the first Pythia?"
        answer: "PHENOMOE"
  - tossup:
      question: "What goddess plagued the women of Lemnos with a foul odor?"
      answer: "APHRODITE"
    boni:
      - question: "What queen of the island received the Argonauts?"
        answer: "HYPSIPYLE"
      - question: "Who were the two sons Hypsipyle bore to Jason?"
        answer: "EUNEOS AND THAOS / NEBROPHONUS / DEIPHYLUS"
  - tossup:
      question: "There is a city in Sicily with the marvelous name of Linquaglossa. What is peculiar about this name?"
      answer: "<latin>LINGUA</latin> is the Latin and <latin>GLOSSA</latin> the Greek for “TONGUE” or “LANGUAGE”"
    boni:
      - question: "What does Neapolis, the original name of Naples, mean?"
        answer: "NEW CITY"
      - question: "What does Andros, the name of an island in Greece, mean?"
        answer: "MAN, i.e. the masculine kind, not humankind"
  - tossup:
      question: "Differentiate in meaning between <latin>altus</latin> and <latin>almus</latin>."
      answer: "<latin>ALTUS</latin> -- HIGH, DEEP, ANCIENT / <latin>ALMUS</latin> -- NOURISHING, KIND, PROPITIOUS"
    boni:
      - question: "Differentiate in meaning between <latin>ōrdior</latin> and <latin>orior</latin>."
        answer: "<latin>ŌRDIOR</latin> -- BEGIN / <latin>ORIOR</latin> -- RISE"
      - question: "Differentiate in meaning between <latin>dēdicō</latin> and <latin>dēdūcō</latin>."
        answer: "<latin>DĒDICŌ</latin> -- I DEDICATE, DECLARE, PREPARE, SET APART / <latin>DĒDŪCŌ</latin> -- I LEAD AWAY, WITHDRAW, MISLEAD"
  - tossup:
      question: "Give an antonym of <latin>terrēo</latin>."
      answer: "<latin>TIMEŌ, VEREOR, METUŌ, FORMĪDŌ</latin>"
    boni:
      - question: "Give an antonym of <latin>gaudeō</latin>."
        answer: "<latin>DOLEŌ, MAEREŌ, LŪGEŌ</latin>"
      - question: "Give an antonym of <latin>compleō</latin>."
        answer: "<latin>VACUŌ, HAURIŌ, ABSORBEŌ, ĒPŌTŌ, INCIPIŌ, INCOHŌ, COEPIŌ</latin> (archaic)"
  - tossup:
      question: "Differentiate in meaning between <latin>augeō</latin> and <latin>egeō</latin>."
      answer: "<latin>AUGEŌ</latin> -- INCREASE / <latin>EGEŌ</latin> -- LACK"
    boni:
      - question: "Differentiate in meaning between <latin>cāreō</latin> and <latin>cāneō</latin>."
        answer: "<latin>CĀREŌ</latin> -- I LACK / <latin>CĀNEŌ</latin> -- I AM GRAY, WHITE"
      - question: "Differentiate in meaning between <latin>dēnī</latin> and <latin>dēnique</latin>."
        answer: "<latin>DĒNĪ</latin> -- TEN BY TEN, TENTH / <latin>DĒNIQUE</latin> -- FINALLY, AT LAST"
  - tossup:
      question: "Give a synonym of <latin>vescor</latin>."
      answer: "<latin>MANDŌ, MASTICŌ, MANDŪCŌ, EDŌ, CONSŪMŌ, DĒVORŌ</latin>"
    boni:
      - question: "Give a synonym of <latin>ordior</latin>."
        answer: "<latin>INCIPIŌ, INCOHŌ, EXORDIOR</latin>"
      - question: "Give a deponent of <latin>reor</latin>."
        answer: "<latin>ARBITROR, EXISTIMŌ, PUTŌ, etc.</latin>"
  - tossup:
      question: "Give the comparative and superlative forms of <latin>ācriter</latin>."
      answer: "<latin>ĀCRIUS, ĀCERRIMĒ</latin>"
    boni:
      - question: "Give the comparative and superlative forms of <latin>beneficus</latin>."
        answer: "<latin>BENEFICENTIOR, BENEFICENTISSIMUS</latin>"
      - question: "Give the comparative and superlative forms of <latin>dexter</latin>."
        answer: "<latin>DEXTERIOR, DEXTIMUS</latin>"
  - tossup:
      question: "Change <latin>iactī erant</latin> to subjunctive."
      answer: "<latin>IACTĪ ESSENT</latin>"
    boni:
      - question: "Change <latin>iactī essent</latin> to perfect."
        answer: "<latin>IACTĪ SINT</latin>"
      - question: "Change <latin>iactī sint</latin> to active."
        answer: "<latin>IĒCERINT</latin>"
  - tossup:
      question: "Make the phrase <latin>hoc lūmen</latin> accusative plural."
      answer: "<latin>HAEC LŪMINA</latin>"
    boni:
      - question: "Make <latin>haec lumina</latin> ablative."
        answer: "<latin>HĪS LŪMINIBUS</latin>"
      - question: "Make <latin>hīs lūminibus</latin> genitive singular."
        answer: "HUIUS LŪMINIS"
  - tossup:
      question: "What use of the genitive case is found in the following sentence: “<latin>Tē damnō pecūlātūs</latin>.”?"
      answer: "WITH VERBS OF ACCUSING, CONDEMNING, AND ACQUITTING / CHARGE OR PENALTY"
    boni:
      - question: "What use of the genitive case is found in the following sentence: “<latin>Convīvium vīcīnōrum compleō</latin>.”?"
        answer: "WITH VERBS OF PLENTY AND WANT"
      - question: "What use of the genitive case is found in the following sentence: “<latin>Foederis heu tacitī</latin>.”?"
        answer: "EXCLAMATION"
  - tossup:
      question: "Listen carefully to the following sentences, which I will read twice, and answer in Latin the question about them: “<latin>Rōmānī antīquī multās viās in Ītaliā fēcērunt. Viae erant bonae, minimē malae, quārum nōtissima erat Via Appia.</latin>”"
      answer: "<latin>IN ĪTALIĀ</latin>"
    boni:
      - question: "Putatne narrātor viās esse bonās aut malās?"
        answer: "<latin>BONĀS / MINIMĒ MALĀS (ESSE)</latin>"
      - question: "Quod nōmen dābātur nōtissimae viae?"
        answer: "<latin>VIA APPIA</latin>"
  - tossup:
      question: "Listen carefully to the following sentence, which I will read twice, and answer in Latin the question about it. “<latin>Helvētiī, omnium rērum inopiā adductī, lēgātōs dē dēditiōne ad Caesarem mīsērunt.</latin>”"
      answer: "<latin>LĒGĀTĪ</latin>"
    boni:
      - question: "<latin>Quā dē causā lēgātī ad Caesarem mīsī sunt?</latin>"
        answer: "<latin>(DĒ) DĒDITIONE</latin>"
      - question: "<latin>Cur Helvētiī dēdidērunt?</latin>"
        answer: "<latin>OMNIUM RĒRUM INOPIĀ ADDUCTĪ SUNT</latin>"
  - tossup:
      question: "Give the second person plural present indicative of <latin>nōlō</latin>."
      answer: "<latin>NŌN VULTIS</latin>"
    boni:
      - question: "Change <latin>nōn vultis</latin> to subjunctive."
        answer: "<latin>NŌLĪTIS</latin>"
      - question: "Change <latin>nōlītis</latin> to the imperfect."
        answer: "<latin>NŌLLĒTIS</latin>"
  - tossup:
      question: "Change <latin>magnum iter</latin> to dative."
      answer: "<latin>MAGNŌ ITINERĪ</latin>"
    boni:
      - question: "Change <latin>magnō itinerī</latin> to plural."
        answer: "<latin>MAGNĪS ITINERIBUS</latin>"
      - question: "Change <latin>magnīs itineribus</latin> to genitive."
        answer: "<latin>MAGNŌRUM ITINERUM</latin>"
  - tossup:
      question: "What use of the infinitive is found in this sentence: “<latin>Dolēre malum est</latin>.”?"
      answer: "SUBJECTIVE"
    boni:
      - question: "What use of the infinitive is found in this sentence: “<latin>Oblīvīscī nōn possum quae volō</latin>”?"
        answer: "COMPLEMENTARY"
      - question: "What use of the infinitive is found in this sentence: “<latin>Volō tē dīcere</latin>”?"
        answer: "OBJECTIVE"
  - tossup:
      question: "What use of the subjunctive is found in this sentence: “<latin>Hōs latrōnēs interficiāmus</latin>”?"
      answer: "HORTATORY"
    boni:
      - question: "What use of the subjunctive is found in this sentence: “<latin>Quid agam, iūdicēs? quō mē vertam</latin>?”"
        answer: "DELIBERATIVE"
      - question: "What use of the subjunctive is found in this sentence: “<latin>Utinam mē mortuum vīdissēs.</latin>”?"
        answer: "OPTATIVE"
  - tossup:
      question: "Give a synonym of <latin>cōnor</latin>."
      answer: "<latin>PERĪCLITOR / TEMPTŌ / EXPERIOR</latin>"
    boni:
      - question: "Give a synonym of <latin>dēficiō</latin>."
        answer: "<latin>DĒSUM</latin>"
      - question: "Give a synonym of <latin>rogō</latin>."
        answer: "<latin>POSCŌ / PETŌ / QUAERŌ</latin>"
  - tossup:
      question: "Give an antonym of <latin>nēmō</latin>."
      answer: "<latin>ALIQUIS / QUIS / QUISPIAM</latin>"
    boni:
      - question: "Give an antonym of <latin>silentium</latin>."
        answer: "<latin>CLĀMOR / SONITUS / STREPITUS</latin>"
      - question: "Give an antonym of <latin>victor</latin>."
        answer: "<latin>CAPTĪVUS</latin>"
  - tossup:
      question: "Differentiate in meaning between <latin>ita</latin> and <latin>item</latin>."
      answer: "<latin>ITA</latin> -- SO / <latin>ITEM</latin> -- LIKEWISE"
    boni:
      - question: "Differentiate in meaning between <latin>orior</latin> and <latin>ōrdior</latin>."
        answer: "<latin>ORIOR</latin> -- RISE / <latin>ŌRDIOR</latin> -- BEGIN"
      - question: "Differentiate in meaning between <latin>oblīvīscor</latin> and <latin>ulcīscor</latin>."
        answer: "<latin>OBLĪVĪSCOR</latin> -- FORGET / <latin>ULCĪSCOR</latin> -- AVENGE"
  - tossup:
      question: "What two compounds of <latin>cēdō</latin> mean “leave”?"
      answer: "<latin>EXCĒDŌ, DISCĒDŌ</latin>"
    boni:
      - question: "What compound of <latin>cēdō</latin> means “approach”?"
        answer: "<latin>ACCĒDŌ</latin>"
      - question: "What compound of <latin>cēdō</latin> means “yield”?"
        answer: "<latin>CONCĒDŌ</latin>"
  - tossup:
      question: "What Latin noun related to <latin>fruor</latin> means “enjoyment”?"
      answer: "<latin>FRŪCTUS</latin>"
    boni:
      - question: "What Latin noun related to <latin>iungō</latin> means “spouse”?"
        answer: "<latin>CONIŪNX</latin>"
      - question: "What Latin adjective related to <latin>pariō</latin> means “whirlwind”?"
        answer: "<latin>TURBŌ</latin>"
  - tossup:
      question: "What Latin verb with what meaning is the root of the English verb “imbibe”?"
      answer: "<latin>BIBŌ</latin> -- DRINK"
    boni:
      - question: "What derivative English adjective means “prone to drink”?"
        answer: "BIBULOUS"
      - question: "What French-influenced derivative means “a substance for drinking”?"
        answer: "BEVERAGE"
  - tossup:
      question: "A minister is sometimes called a “pastor.” What does that Latin noun mean?"
      answer: "SHEPHERD"
    boni:
      - question: "What verb is it based on?"
        answer: "<latin>PASCOR</latin>"
      - question: "What staple of Italian food is derived from <latin>pascor</latin>?"
        answer: "PASTA"
  - tossup:
      question: "What verb with what meaning is the root of “liable” (spell)?"
      answer: "<latin>LĪGŌ</latin> -- TIE, BIND"
    boni:
      - question: "What noun with what meaning is the root of “libel”?"
        answer: "<latin>LIBER</latin> -- BOOK"
      - question: "What noun with what meaning is the root of “lieutenant”?"
        answer: "<latin>LOCUS</latin> -- PLACE"
  - tossup:
      question: "What Latin verb is the root of “vanquish”?"
      answer: "<latin>VINCŌ</latin>"
    boni:
      - question: "...of “vault”?"
        answer: "<latin>VOLVŌ</latin>"
      - question: "...of “vaunt”?"
        answer: "<latin>VĀNITĀS</latin>"
  - tossup:
      question: "What is the meaning of the Greek word element common to “atom” and “appendectomy”?"
      answer: "CUT"
    boni:
      - question: "...common to “lithograph” and “monolith”?"
        answer: "STONE"
      - question: "...common to “orthopedic” and “orthodox”?"
        answer: "STRAIGHT, RIGHT"
  - tossup:
      question: "The abbreviation <latin>p.m.</latin> represents two separate Latin phrases. Give one of the phrases and its meaning for which <latin>p.m.</latin> is an abbreviation."
      answer: "<latin>POST MERIDIEM</latin> -- AFTERNOON or <latin>POST MORTEM</latin> -- AFTER DEATH"
    boni:
      - question: "Give the other."
        answer: "<latin>POST MERIDIEM</latin> -- AFTERNOON or <latin>POST MORTEM</latin> -- AFTER DEATH"
      - question: "Give the two Latin phrases abbreviated <latin>p.c.</latin>."
        answer: "<latin>POST CIBUM</latin> & <latin>PER CENTUM</latin>"
