tournament: NJCL Certamen
year: 1996
division: Novice
round: Round 2
questions:
- tossup:
    question: As we speak, the Olympics are taking place in Atlanta, and if you turn
      on a television, you might get a chance to see the equestrian events. From what
      Latin noun with what meaning is "equestrian" derived?
    answer: <latin>EQUUS</latin> -- HORSE (not <latin>eques</latin>)
  boni:
  - question: Perhaps you don’t like the equestrian events, but you really like the
      pole vault. From what Latin verb with what meaning is "vault" derived?
    answer: <latin>VOLVERE</latin> -- TO TURN
  - question: From what two Latin words with what meanings is "centennial" derived?
    answer: <latin>CENTUM</latin> -- HUNDRED & <latin>ANNUS</latin> -- YEAR
- tossup:
    question: Who was prophesied to appear, wearing only one shoe, to King Pelias?
    answer: JASON
  boni:
  - question: How had he lost the other shoe?
    answer: HELPING THE DISGUISED HERA ACROSS A STREAM (ANAURUS/OS)
  - question: What relation to Jason was Pelias?
    answer: UNCLE
- tossup:
    question: Which Roman goddess was a virgin huntress?
    answer: DIANA
  boni:
  - question: What was she called as goddess of the moon?
    answer: LUNA (not Selene)
  - question: What was she called when invoked in magic rites?
    answer: HECATE / TRIVIA
- tossup:
    question: Before what battle did Constantine have a dream in which he was instructed
      to put the OC (Chi-Rho) monogram on his soldiers’ shields?
    answer: BATTLE OF MILVIAN (or MULVIAN) BRIDGE / SAXA RUBRA
  boni:
  - question: What powerful rival did he defeat and kill in this battle?
    answer: MAXENTIUS
  - question: Who remained to rule jointly with Constantine for an uneasy ten years?
    answer: LICINIUS
- tossup:
    question: Who was Antigone’s lover?
    answer: HAEMON
  boni:
  - question: Who was his father?
    answer: CREON
  - question: Who was his mother?
    answer: EURYDICE
- tossup:
    question: Give the nominative plural of the phrase <latin>hoc corpus</latin>.
    answer: <latin>HAEC CORPORA</latin>
  boni:
  - question: Make <latin>haec corpora</latin> dative.
    answer: <latin>HĪS CORPORIBUS</latin>
  - question: Make <latin>hīs corporibus</latin> singular.
    answer: <latin>HUIC CORPORĪ</latin>
- tossup:
    question: 'Translate "sing" in this sentence: "The teacher’s students sing well."'
    answer: <latin>CANTANT</latin> / <latin>CANUNT</latin>
  boni:
  - question: 'Translate "frighten" in this sentence: "Dogs can frighten me."'
    answer: <latin>(PER)TERRĒRE</latin>
  - question: 'Translate "listen" in this sentence: "John, listen to me carefully"'
    answer: <latin>AUDĪ</latin>
- tossup:
    question: Give the first person singular, future active indicative of <latin>timeō</latin>.
    answer: <latin>TIMĒBŌ</latin>
  boni:
  - question: Change <latin>timēbō</latin> to pluperfect.
    answer: <latin>TIMUERAM</latin>
  - question: Change <latin>timueram</latin> to perfect.
    answer: <latin>TIMUĪ</latin>
- tossup:
    question: In the word <latin>aedēs</latin>, why is the first syllable long?
    answer: IT CONTAINS A DIPHTHONG
  boni:
  - question: Why is the <latin>i</latin> in <latin>via</latin> short?
    answer: IT COMES BEFORE ANOTHER VOWEL
  - question: Name the two vowels that can also be consonants in Latin?
    answer: '"I" and "U"'
- tossup:
    question: What English word for a writ instructing a jailer to hold a prisoner
      is borrowed directly from the Latin for "we send"?
    answer: MITTIMUS
  boni:
  - question: What English word for a quack remedy is borrowed directly from the Latin
      for "ours"?
    answer: NOSTRUM
  - question: What English word for a medication used in a research control group
      is borrowed directly from the Latin for "I shall please"?
    answer: PLACEBO
- tossup:
    question: As part of their war effort against whom did the Romans build their
      first great road, the Via Appia?
    answer: THE SAMNITES
  boni:
  - question: Who was its builder?
    answer: APPIUS CLAUDIUS THE CENSOR / CAECUS
  - question: What else did he build that was the first great example of its kind?
    answer: <latin>AQUA APPIA</latin> / THE APPIAN AQUEDUCT
- tossup:
    question: Which Roman emperor abandoned a plan to invade Britain in AD 40?
    answer: GAIUS / CALIGULA
  boni:
  - question: What emperor did invade Britain in order to gain military glory for
      his reign?
    answer: CLAUDIUS
  - question: What future emperor conquered the British tribes along the channel?
    answer: VESPASIAN
- tossup:
    question: Differentiate in meaning between <latin>pēs</latin> and <latin>rēs</latin>.
    answer: <latin>PĒS</latin> -- FOOT; <latin>RĒS</latin> -- THING, MATTER, ETC.
  boni:
  - question: Differentiate in meaning between <latin>mōns</latin> and <latin>mēns</latin>.
    answer: <latin>MŌNS</latin> -- MOUNTAIN; <latin>MĒNS</latin> -- MIND, INTELLECT
  - question: Differentiate in meaning between <latin>spēs</latin> and <latin>speciēs</latin>.
    answer: <latin>SPĒS</latin> -- HOPE; <latin>SPECIĒS</latin> -- VIEW, APPEARANCE,
      VISION
- tossup:
    question: In what building was the main treasury of Rome housed?
    answer: TEMPLE OF SATURN
  boni:
  - question: What is the Latin term for the "public treasury"?
    answer: <latin>AERARIUM</latin>
  - question: Until the time of Julius Caesar, what officials were in charge of the
      aerarium?
    answer: QUAESTORS
- tossup:
    question: What creature’s eyes became a part of the peacock’s tail?
    answer: ARGUS/OS
  boni:
  - question: What couple became an oak and a linden?
    answer: BAUCIS AND PHILEMON
  - question: Who became a weeping pillar of stone?
    answer: NIOBE
- tossup:
    question: 'Translate: <latin>Primā lūce servī ē villā in agrōs īvērunt.</latin>'
    answer: AT DAWN, THE SLAVES WENT OUT OF THE HOUSE (AND) INTO THE FIELDS
  boni:
  - question: 'Translate: <latin>Uxor Luciī verba nūntiī intellegere nōn poterat.</latin>'
    answer: THE WIFE OF LUCIUS COULDN’T UNDERSTAND THE WORDS OF THE MESSENGER
  - question: 'Translate: <latin>Capitne noster dux umquam captīvōs barbarōs?</latin>'
    answer: DOES OUR LEADER EVER TAKE FOREIGN CAPTIVES?
- tossup:
    question: <latin>Quot sunt quattuor et duo</latin>?
    answer: <latin>SEX</latin>
  boni:
  - question: <latin>Quot sunt septem minus quattuor</latin>?
    answer: <latin>TRĒS</latin>
  - question: <latin>Quot sunt vīgintī et trēs minus quīnque</latin>?
    answer: <latin>DUODĒVĪGINTĪ</latin>
- tossup:
    question: Who reformed the Roman constitution, returning power to the <latin>Optimates</latin>
      in 81-79 BC?
    answer: (L. CORNELIUS) SULLA (FELIX)
  boni:
  - question: What office did Sulla hold when he reformed the constitution?
    answer: DICTATOR
  - question: What foreign enemy had Sulla defeated in Asia Minor?
    answer: MITHRIDATES (VI) (EUPATOR MAGNUS)
- tossup:
    question: What sea god fell in love with the maiden Scylla?
    answer: GLAUCUS
  boni:
  - question: From whom did Glaucus seek help when the frightened Scylla ran from
      him?
    answer: CIRCE
  - question: Why did Circe turn Scylla into a horrible monster?
    answer: CIRCE WAS ANGRY / JEALOUS / OFFENDED / HURT / BECAUSE SHE LOVED GLAUCUS
- tossup:
    question: Give an antonym of <latin>caelum</latin>.
    answer: <latin>TERRA, TELLŪS, HUMUS, SOLUM, MARE, PONTUS,
      PELAGUS, AEQUOR, SAL, ALTUM</latin>
  boni:
  - question: Give an antonym of <latin>hiems</latin>.
    answer: <latin>AESTĀS</latin>
  - question: Give an antonym of <latin>lentē</latin>.
    answer: <latin>CELERITER, VĒLŌCITER, CITO, PROPERĒ, FESTĪNANTER,
      RAPIDĒ, CELERE</latin>
