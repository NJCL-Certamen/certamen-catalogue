tournament: NJCL Certamen
year: 1996
division: Novice
round: Extra Questions
questions:
- tossup:
    question: In what kind of structure were <latin>munera gladiatoria</latin> performed?
    answer: ARENA, AMPHITHEATRE
  boni:
  - question: Where were <latin>ludi scaenici</latin> performed?
    answer: THEATRE
  - question: Where were <latin>ludi circenses</latin> performed?
    answer: CIRCUS
- tossup:
    question: The best example of the use of the dome in Roman architecture is the
      Pantheon. Who added the dome to the Pantheon?
    answer: (P. AELIUS) HADRIAN(US)
  boni:
  - question: Where outside of Rome is Hadrian's great villa complex?
    answer: TIBUR / TIVOLI
  - question: Where did Hadrian complete a long unfinished great temple to Zeus?
    answer: ATHENS
- tossup:
    question: What was the alliance of eight Latin cities of Latium against the emerging
      power of Rome called?
    answer: LATIN LEAGUE
  boni:
  - question: At what lake did the Romans defeat the Latin League in 496 BC?
    answer: REGILLUS
  - question: According to tradition, who intervened in the battle on behalf of the
      Romans?
    answer: CASTOR & POLLUX / POLYDEUCES
- tossup:
    question: Which toga was often worn by emperors?
    answer: <latin>TOGA PICTA</latin>
  boni:
  - question: Describe it.
    answer: CRIMSON EMBROIDERED IN GOLD
  - question: Describe the <latin>toga praetexta</latin>.
    answer: PURPLE BORDER (HEM) ALONG CURVED EDGE (SINUS)
- tossup:
    question: What two social classes struggled for power in the "Conflict of Orders"?
    answer: PATRICIANS & PLEBEIANS
  boni:
  - question: The plebeians did not resort to violence in the "Conflict of Orders."
      How did they force the patricians to listen to their demands?
    answer: SECESSION
  - question: What positions developed as the spokesmen and protectors of plebeian
      interests?
    answer: <latin>TRIBUNI PLEBIS</latin>
- tossup:
    question: What nine sisters were in charge of the arts?
    answer: MUSES
  boni:
  - question: What three sisters avenged unjust deaths?
    answer: FURIES
  - question: What three sisters were named Clotho, Lachesis, and Atropos?
    answer: FATES
- tossup:
    question: Who in the Underworld was condemned to carry water in jars which leaked
      like sieves?
    answer: DANAÏDAE
  boni:
  - question: What was their crime?
    answer: KILLING HUSBANDS ON THEIR WEDDING NIGHT
  - question: With what weapon had they murdered their bridegrooms?
    answer: LONG SHARP PIN
- tossup:
    question: Who took away Echo's normal power of speech?
    answer: HERA
  boni:
  - question: Why?
    answer: ECHO'S CHATTERING DISTRACTED HER FROM ZEUS & HIS LOVE AFFAIRS
  - question: What ability did Hera leave with Echo?
    answer: TO REPEAT LAST WORDS SPOKEN TO HER
- tossup:
    question: What mountain god declared Apollo the winner of a music contest?
    answer: TMOLUS
  boni:
  - question: Who was foolish enough to announce his disagreement with Tmolus' judgement?
    answer: MIDAS
  - question: How did Apollo punish Midas?
    answer: GAVE HIM THE EARS OF AN ASS
- tossup:
    question: What king was his host when Theseus was exiled from Athens?
    answer: LYCOMEDES
  boni:
  - question: Who persuaded the Athenians to banish Theseus?
    answer: MENESTHEUS
  - question: How did Theseus die?
    answer: LYCOMEDES PUSHED HIM OFF A CLIFF
- tossup:
    question: 'What use of the Dative case is found in the following sentence: <latin>Mercātor
      multās tunicās servō mōnstrat.</latin>'
    answer: INDIRECT OBJECT
  boni:
  - question: 'What use of the Dative case is found in the following sentence: <latin>Nōn
      licet puerīs in Cūriam īre.</latin>'
    answer: SPECIAL VERBS (IMPERSONAL VERBS)
  - question: 'What use of the Dative case is found in the following sentence: <latin>Mihi
      est fortiter pugnandum.</latin>'
    answer: POSSESSION
- tossup:
    question: What part of your eye comes from the Latin for "little girl"?
    answer: PUPIL
  boni:
  - question: What part of your eye comes from the Latin for "net"?
    answer: RETINA
  - question: What part of your eye comes from the Latin for "horn"?
    answer: CORNEA
- tossup:
    question: What Latin word is used in science and medicine for "a specified portion
      of a chemical substance" and literally means "some"?
    answer: <latin>ALIQUOT</latin>
  boni:
  - question: What Latin phrase is used in chemistry for "the mixture of hydrochloric
      and nitric acids that can dissolve gold" and literally means "royal water"?
    answer: <latin>AQUA REGIA</latin>
  - question: What Latin word is used in physics for "a body’s mass times velocity"
      and literally means "motion"?
    answer: <latin>MOMENTUM</latin>
- tossup:
    question: Differentiate in meaning between <latin>ordō</latin> and <latin>ardēō</latin>.
    answer: <latin>ORDŌ</latin> -- ROW, ORDER; <latin>ARDEŌ</latin> -- I AM ON FIRE,
      BURN
  boni:
  - question: Differentiate in meaning between <latin>soleō</latin> and <latin>sileō</latin>.
    answer: <latin>SOLEŌ</latin> -- I AM ACCUSTOMED, USED TO; <latin>SILEŌ</latin>
      -- I AM SILENT
  - question: Differentiate in meaning between <latin>probō</latin> and <latin>praebeō</latin>.
    answer: <latin>PROBŌ</latin> -- I PROVE, COMMEND, TEST; <latin>PRAEBEŌ</latin>
      -- I PROVIDE, OFFER, YIELD, SURRENDER
- tossup:
    question: Give an antonym of <latin>diū</latin>.
    answer: <latin>PAULĪSPER</latin> / <latin>BREVITER</latin>
  boni:
  - question: Give an antonym of <latin>suprā</latin>.
    answer: <latin>INFRĀ</latin> / <latin>SUBTER</latin> / <latin>SUB</latin>
  - question: Give an antonym of <latin>puppis</latin>.
    answer: <latin>PRŌRA</latin>
- tossup:
    question: Differentiate in meaning between <latin>octō</latin> and <latin>acta</latin>.
    answer: <latin>OCTŌ</latin> -- EIGHT; <latin>ACTA</latin> -- ACTS, DEEDS, THINGS
      THAT HAVE BEEN DONE
  boni:
  - question: Differentiate in meaning between <latin>fāma</latin> and <latin>fāta</latin>.
    answer: <latin>FĀMA</latin> -- RUMOR, REPUTATION; <latin>FĀTA</latin> -- FATES,
      DEATHS, MISHAPS
  - question: Differentiate in meaning between <latin>ibi</latin> and <latin>sibī</latin>.
    answer: <latin>IBI</latin> -- THERE; <latin>SIBĪ</latin> -- TO/FOR HIMSELF, HERSELF,
      ITSELF
- tossup:
    question: What two Latin words combine to form the English word "mollify"?
    answer: <latin>MOLLIS</latin> and <latin>FACERE</latin>
  boni:
  - question: What Latin verb is the ultimate root of "defy"?
    answer: <latin>FĪDERE</latin> -- TO TRUST
  - question: What compound Latin verb is the root of "edify"?
    answer: <latin>AEDIFICĀRE</latin> -- TO BUILD
- tossup:
    question: Give a synonym of <latin>grātus</latin>.
    answer: <latin>IUCUNDUS / GRĀTIŌSUS / ACCEPTUS</latin>
  boni:
  - question: Give a synonym of <latin>pulcher</latin>.
    answer: <latin>BELLUS</latin> / <latin>VENUSTUS</latin> / <latin>FORMŌSUS</latin>
  - question: Give a synonym of <latin>saevus</latin>.
    answer: <latin>ATROX</latin> / <latin>DĪRUS</latin> / <latin>HORRIBILIS</latin> / <latin>TORVUS</latin>
- tossup:
    question: Give a synonym of <latin>mūrus</latin>.
    answer: <latin>PARIĒS</latin> / <latin>MOENIA</latin> / <latin>MĀCERIA</latin>
  boni:
  - question: Give a synonym of <latin>mūnus</latin>.
    answer: <latin>DŌNUM</latin> / <latin>LARGĪTIŌ</latin>
  - question: Give a synonym of <latin>mūtus</latin>.
    answer: <latin>TACITUS</latin> / <latin>TACITURNUS</latin> / <latin>SILENS</latin>
- tossup:
    question: What use of the ablative is found in <latin>Lucius ab ursā caesus est</latin>?
    answer: AGENCY
  boni:
  - question: <latin>Augustus vehēbātur ab urbe.</latin>
    answer: PLACE FROM WHICH
  - question: <latin>Catō est Cicerōne ēloquentior.</latin>
    answer: COMPARISON
- tossup:
    question: 'Translate: Numa was praised by all the Romans.'
    answer: <latin>NUMA AB OMNIBUS RŌMĀNĪS LAUDĀBĀTUR</latin>
  boni:
  - question: 'Translate: Numa was desirous of peace.'
    answer: <latin>NUMA CUPIDUS PĀCIS ERAT</latin>
  - question: 'Translate: Numa was a better king than Hostilius.'
    answer: <latin>NUMA RĒX MELIOR QUAM HOSTĪLIUS ERAT / NUMA RĒX MELIOR
      HOSTĪLIŌ ERAT</latin>
- tossup:
    question: 'Listen to the following sentence, which I will read twice, and answer
      in Latin the question about it: <latin>Captīvī et servī quōs dominī in amphitheātrum
      mīserant in mediā arēnā pugnāre cōgēbantur.</latin>'
    answer: <latin>DOMINĪ</latin>
  boni:
  - question: Quī servōs in amphitheātrum mīsērunt?
    answer: <latin>DOMINĪ</latin>
  - question: Ubi captīvī et servī pugnāvērunt?
    answer: <latin>IN AMPHITHEĀTRŌ</latin> or <latin>IN MEDIĀ ARĒNĀ</latin>
- tossup:
    question: What do we call indicative, imperative, and infinitive?
    answer: MOODS
  boni:
  - question: What do we call sets of endings for nouns?
    answer: DECLENSIONS
  - question: What do we call sets of endings for verbs?
    answer: CONJUGATIONS
- tossup:
    question: Give a synonym of <latin>epistula</latin>.
    answer: <latin>LITTERAE</latin>
  boni:
  - question: Give a synonym of <latin>lītus</latin>.
    answer: <latin>RĪPA / ŌRA / ACTA</latin>
  - question: Give a synonym of <latin>fortitūdō</latin>.
    answer: <latin>ANIMUS / CONSTANTE / VIRTŪS / AUDĀCIA</latin>
- tossup:
    question: Differentiate among <latin>cupiō, cupidus, and cupiditās</latin>.
    answer: <latin>CUPIŌ</latin> -- DESIRE; <latin>CUPIDUS</latin> -- DESIROUS; <latin>CUPIDITĀS</latin>
      -- DESIRE
  boni:
  - question: '...among <latin>amō, amīcus, and amīcitia</latin>.'
    answer: <latin>AMŌ</latin> -- LOVE; <latin>AMĪCUS</latin> -- FRIEND; <latin>AMĪCITIA</latin>
      -- FRIENDSHIP
  - question: '...among <latin>vincō, victor, and victōria</latin>.'
    answer: <latin>VINCŌ</latin> -- CONQUER; <latin>VICTOR</latin> -- CONQUEROR; <latin>VICTŌRIA</latin>
      -- VICTORY
- tossup:
    question: Differentiate in meaning between <latin>mors</latin> and <latin>mora</latin>.
    answer: <latin>MORS</latin> -- DEATH; <latin>MORA</latin> -- DELAY
  boni:
  - question: '...between <latin>ita</latin> and <latin>item</latin>.'
    answer: <latin>ITA</latin> -- SO; <latin>ITEM</latin> -- LIKEWISE
  - question: '...between <latin>hiems</latin> and <latin>hīberna</latin>.'
    answer: <latin>HIEMS</latin> -- WINTER; <latin>HĪBERNA</latin> -- WINTER QUARTERS
- tossup:
    question: What two compounds of <latin>faciō</latin> mean "finish"?
    answer: <latin>PERFICIŌ</latin>, <latin>CŌNFICIŌ</latin>
  boni:
  - question: What compound of <latin>faciō</latin> means "kill"?
    answer: <latin>INTERFICIŌ</latin>
  - question: What compound of <latin>faciō</latin> means "fail"?
    answer: <latin>DĒFICIŌ</latin>
- tossup:
    question: What vegetable comes from the Latin noun for "head"?
    answer: CABBAGE
  boni:
  - question: 'What vegetable comes from the Latin noun for "root"?'
    answer: RADISH
  - question: What fruit comes from the Latin noun for "gold"?
    answer: ORANGE
- tossup:
    question: What Romance language is spoken in the land the Romans called <latin>Hispania</latin>?
    answer: SPANISH
  boni:
  - question: What Romance language is spoken in the land the Romans called <latin>Lusitania</latin>?
    answer: PORTUGESE
  - question: In the land the Romans called <latin>Gallia</latin>?
    answer: FRENCH
- tossup:
    question: What noun is the root of "accompany"?
    answer: <latin>PANIS</latin>
  boni:
  - question: '...of "accustom"?'
    answer: <latin>CONSUESCŌ</latin>
  - question: '...of "accountant"?'
    answer: <latin>PUTŌ</latin>
- tossup:
    question: What Latin noun with what meaning is the root of the English noun "coronation"?
    answer: <latin>CORŌNA</latin> -- CROWN
  boni:
  - question: '...of the English noun "carnation"?'
    answer: <latin>CARŌ</latin> -- FLESH, MEAT
  - question: '...of the English noun "incarceration"?'
    answer: <latin>CARCER</latin> -- PRISON
- tossup:
    question: What Latin verb is the ultimate root of "defeat"?
    answer: <latin>FACIŌ</latin>
  boni:
  - question: 'What Latin verb is the ultimate root of "defy"?'
    answer: <latin>FĪDŌ</latin>
  - question: 'What Latin verb is the ultimate root of "defray"?'
    answer: <latin>FRANGŌ</latin>
- tossup:
    question: Give the Latin and the English for the abbreviation <latin>a.c.</latin>
    answer: <latin>ANTE CIBUM</latin> -- BEFORE MEALS
  boni:
  - question: 'Give the Latin and the English for the abbreviation <latin>ad lib.</latin>'
    answer: <latin>AD LIBITUM</latin> -- SPONTANEOUSLY, EXTEMPORANEOUSLY, ETC.
  - question: 'Give the Latin and the English for the abbreviation <latin>ad loc.</latin>'
    answer: <latin>AD LOCUM</latin> -- TO (or AT) THE PLACE
