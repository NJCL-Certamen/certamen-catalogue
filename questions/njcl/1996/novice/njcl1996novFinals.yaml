tournament: NJCL Certamen
year: 1996
division: Novice
round: Round 100
questions:
- tossup:
    question: Which Greek god was known as "the Cloudgatherer"?
    answer: ZEUS
  boni:
  - question: According to Hesiod, on what island did Rhea give birth to Zeus?
    answer: CRETE
  - question: What two sisters furnished the milk and honey to feed the infant Zeus?
    answer: AMALTHEA & MELISSA
- tossup:
    question: Who captured Placidia, the daughter of Theodosius I and half-sister
      of Honorius, when he sacked Rome in A.D. 410?
    answer: ALARIC
  boni:
  - question: Of what barbarian tribe was Alaric the king?
    answer: VISIGOTHS
  - question: What Roman general had defeated Alaric in A.D. 402 & 403?
    answer: STILICHO
- tossup:
    question: 'What verb mood is found in the following quotation from Horace: <latin>Carpe
      diem?</latin>'
    answer: IMPERATIVE
  boni:
  - question: What degree of adverb is found in the motto of the Olympics, <latin>Citius,
      altius, fortius</latin>?
    answer: COMPARATIVE
  - question: 'What tense of the indicative is found in the following quotation from
      Caesar: <latin>Alea iacta est</latin>?'
    answer: PERFECT
- tossup:
    question: What building in Rome had eighty entrances?
    answer: FLAVIAN AMPHITHEATER / COLOSSEUM
  boni:
  - question: How did the spectators know which entrance to use?
    answer: NUMBER ON TICKET CORRESPONDED TO NUMBER OVER ENTRANCE
  - question: What part of the Colosseum was called the <latin>podium</latin>?
    answer: BOTTOM ROWS OF SEATS (2 or at most 3 rows of marble chairs)
- tossup:
    question: Differentiate in meaning between <latin>valē</latin> and <latin>valdē</latin>.
    answer: <latin>VALĒ</latin> -- GOODBYE!, BE WELL!; <latin>VALDĒ</latin> -- STRONGLY,
      VERY MUCH
  boni:
  - question: Differentiate in meaning between <latin>sine</latin> and <latin>sānē</latin>.
    answer: <latin>SINE</latin> -- WITHOUT; <latin>SĀNĒ</latin> -- CERTAINLY, YES
  - question: Differentiate in meaning between <latin>vīlla</latin> and <latin>vīlis</latin>.
    answer: <latin>VILLA</latin> -- FARMHOUSE; <latin>VĪLIS</latin> -- CHEAP, WORTHLESS
- tossup:
    question: Name the emperor who recalled Agricola from his post as governor of
      Britain.
    answer: DOMITIAN
  boni:
  - question: Which emperor had appointed Agricola to this governorship?
    answer: VESPASIAN
  - question: For what naval feat is Agricola known?
    answer: CIRCUMNAVIGATION OF BRITAIN
- tossup:
    question: What object does Aeneas use to persuade Charon to ferry him across the
      River Styx?
    answer: GOLDEN BOUGH
  boni:
  - question: Who in the Underworld begs Aeneas for proper burial rites?
    answer: PALINURUS
  - question: Who shows Aeneas the future Roman heroes?
    answer: ANCHISES
- tossup:
    question: 'Translate into English the following quotation from Publilius Syrus:
      <latin>Stultum est timēre quod vītāre nōn potes.</latin>'
    answer: IT IS STUPID TO FEAR WHAT YOU CANNOT AVOID
  boni:
  - question: 'Translate into English the following quotation from Curtius Rufus:
      <latin>Canis timidus vehementius lātrat quam mordet.</latin>'
    answer: A TIMID DOG BARKS LOUDER THAN IT BITES
  - question: 'Translate into English the following quotation from Cicero: <latin>Trahimur
      omnēs laudis studiō.</latin>'
    answer: WE ARE ALL DRIVEN BY THE EAGERNESS FOR PRAISE
- tossup:
    question: Which Roman king captured and destroyed the city of Alba Longa?
    answer: TULLUS HOSTILIUS
  boni:
  - question: During this war, what three Alban brothers were killed in combat by
      what three Roman brothers?
    answer: CURIATII (ALBAN) KILLED BY HORATII (ROMAN)
  - question: Why did the surviving Horatius kill his sister Horatia?
    answer: SHE MOURNED THE DEATH OF HER BETROTHED, ONE OF THE CURIATII
- tossup:
    question: Listen to the following paragraph, which I will read twice. And answer
      in Latin the question about it. Remember to use only the information given.
      <latin>Herculēs, fortissimus omnium virōrum, ōlim in Graeciā habitābat. Cum
      Herculēs īnfans erat, duae serpentēs in cubiculum eius vēnērunt, at Herculēs
      minimē territus est. Parvīs sed fortibus manibus Herculēs serpentēs cēpit et
      colla eārum magnā vī pressit.</latin>
    answer: <latin>FORTISSIMUS</latin>
  boni:
  - question: <latin>Ā quibus Herculēs nōn territus est?</latin>
    answer: <latin>(Ā) DUĀBUS SERPENTIBUS</latin>
  - question: <latin>Quō modō Herculēs serpentēs rapuit?</latin>
    answer: <latin>MAGNĀ (CUM) VĪ</latin>
- tossup:
    question: Who was elected quaestor in 68, aedile in 65, and praetor in 62 B.C.?
    answer: (C.) JULIUS CAESAR
  boni:
  - question: To what position was Caesar elected in 63 B.C.?
    answer: PONTIFEX MAXIMUS
  - question: For what year was Caesar elected consul for the first time?
    answer: 59 BC
- tossup:
    question: <latin>Rapiō</latin> means "snatch." What compound of <latin>rāpiō</latin>
      means "rescue"?
    answer: <latin>ĒRIPIO, ĒRIPERE</latin>
  boni:
  - question: <latin>Dō</latin> means "give." What compound of <latin>dō</latin> means
      "surround"?
    answer: <latin>CIRCUMDŌ, CIRCUMDARE</latin>
  - question: <latin>Veniō</latin> means "come." What compound of <latin>veniō</latin>
      means "arrive"?
    answer: <latin>ADVENIŌ, ADVENĪRE / PERVENIŌ, PERVENĪRE</latin>
- tossup:
    question: Give the third person plural, perfect active indicative of the verb
      <latin>vincō, vincere</latin>.
    answer: <latin>VĪCĒRUNT</latin>
  boni:
  - question: Change <latin>vīcērunt</latin> to the passive.
    answer: <latin>VICTĪ SUNT</latin>
  - question: Change <latin>vīcērunt</latin> to future.
    answer: <latin>VINCENT</latin>
- tossup:
    question: What king of Teuthrania, a son of Hercules, repulsed the Greeks when
      they landed there in error on their way to Troy?
    answer: TELEPHUS
  boni:
  - question: Whose spear had wounded Telephus?
    answer: ACHILLES'
  - question: According to an oracle, only the rust from the spear could cure the
      wound. How did Telephus then repay the Greeks for curing his wound?
    answer: HE GUIDED THEM TO TROY
- tossup:
    question: The word "possess" is derived from the combination of two Latin verbs.
      Name them.
    answer: <latin>POSSE</latin> & <latin>SEDĒRE</latin>
  boni:
  - question: What two Latin words combine to yield the English word "mollify"?
    answer: <latin>MOLLIS</latin> & <latin>FACERE</latin>
  - question: What two Latin words combine to yield the English word "transient"?
    answer: <latin>TRANS</latin> & <latin>ĪRE</latin>
- tossup:
    question: Who was the son of Eteocles?
    answer: LAODAMAS
  boni:
  - question: Who was regent for the young Laodamas after Eteocles' death?
    answer: CREON
  - question: What leader of the Epigoni did Laodamas kill?
    answer: AEGIALEUS
- tossup:
    question: What king of Troy was notorious for breaking his word?
    answer: LAOMEDON
  boni:
  - question: What two gods were forced to work for him for a year?
    answer: APOLLO AND POSEIDON / NEPTUNE
  - question: Whom did he promise a prize for saving his daughter Hesione, only to
      break his word yet again?
    answer: HERACLES / HERCULES
- tossup:
    question: What English word from the Latin word for "guest" means "a shelter or
      lodging for travelers, children, the destitute, and the infirm"?
    answer: HOSPICE
  boni:
  - question: What English word derived from the Latin word for "road" means "a messenger
      or agent sent on a mission"?
    answer: ENVOY
  - question: What English euphemism for "death" is a derivative of <latin>mittō</latin>?
    answer: DEMISE
- tossup:
    question: Give the comparative and superlative forms of <latin>levis</latin>.
    answer: <latin>LEVIOR</latin>, <latin>LEVISSIMUS</latin>
  boni:
  - question: 'Give the comparative and superlative forms of <latin>miser</latin>.'
    answer: <latin>MISERIOR</latin>, <latin>MISERRIMUS</latin>
  - question: 'Give the comparative and superlative forms of <latin>gracilis</latin>.'
    answer: <latin>GRACILIOR</latin>, <latin>GRACILLIMUS</latin>
- tossup:
    question: 'Identify all the nouns in the accusative case in this sentence: <latin>Multōs
      diēs per silvam atram iter faciebamus.</latin>'
    answer: <latin>DIĒS</latin>, <latin>SILVAM</latin>, & <latin>ITER</latin>
  boni:
  - question: Why is <latin>iter</latin> in the accusative?
    answer: DIRECT OBJECT
  - question: Why is <latin>diēs</latin> in the accusative?
    answer: DURATION OF TIME
