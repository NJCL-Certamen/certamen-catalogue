tournament: "NJCL Certamen"
year: 1997
division: "Novice"
round: "Finals"
questions:
  - tossup:
      question: "What tribune of the people was a victim of the same kind of mob violence which he had used to control Rome from 103 to 100 BC?"
      answer: "(L. APPULEIUS) SATURNINUS"
    boni:
      - question: "For what Roman commander’s veterans did Saturninus secure land?"
        answer: "(C.) MARIUS’"
      - question: "For having what rival murdered did Saturninus lose Marius’ support?"
        answer: "(C.) MEMMIUS"
  - tossup:
      question: "Which of the following Latin words, if any, does NOT share a common root with the others: <latin>agmen, āctiō, agilis, cōgere, agrārius</latin>?"
      answer: "<latin>AGRĀRIUS</latin>"
    boni:
      - question: "Which of the following Latin words, if any, does NOT share a common root with the others: <latin>sēditiō, sessiō, residuus, subsidium, obsidēre</latin>?"
        answer: "<latin>SĒDITIŌ</latin>"
      - question: "Which of the following Latin words, if any, does NOT share a common root with the others: <latin>obīre, īrātus, initium, ambitiō, exitium</latin>?"
        answer: "<latin>ĪRĀTUS</latin>"
  - tossup:
      question: "During the Trojan War, what son of Zeus was the leader of the Lycians and an ally of the Trojans?"
      answer: "SARPEDON"
    boni:
      - question: "Who was the mother of Sarpedon?"
        answer: "EUROPA / LAODAMEIA / DEIDAMEIA"
      - question: "What miracle did Zeus create upon the death of his son at the hands of Patroclus?"
        answer: "ZEUS CAUSED BLOODY RAIN TO FALL / SPIRITED HIS BODY AWAY (TO LYCIA BY THANATOS & HYPNOS)"
  - tossup:
      question: "Translate this sentence: <latin>Cūr mātrēs suīs līberīs nōn crēdunt?</latin> "
      answer: "WHY DO MOTHERS NOT BELIEVE / TRUST THEIR CHILDREN?"
    boni:
      - question: "Translate this sentence: <latin>Nōlunt manēre domī dum sōl lūcet.</latin> "
        answer: "THEY DON’T WANT TO STAY HOME WHILE THE SUN IS SHINING"
      - question: "Translate this sentence: <latin>Multī crēdunt adulēscentēs numquam cogitāre</latin>"
        answer: "MANY BELIEVE THAT ADOLESCENTS/TEENAGERS NEVER THINK"
  - tossup:
      question: "Of <latin>rapiō</latin>, give the third person singular, present, passive, indicative"
      answer: "<latin>RAPITUR</latin>"
    boni:
      - question: "Change <latin>rapitur</latin> to future"
        answer: "<latin>RAPIĒTUR</latin>"
      - question: "Change <latin>rapiētur</latin> to imperfect"
        answer: "<latin>RAPIEBĀTUR</latin>"
  - tossup:
      question: "What Amazon-like leader of the Volscians was an ally of Turnus?"
      answer: "CAMILLA"
    boni:
      - question: "What exiled Etruscan king was also an ally of Turnus?"
        answer: "MEZENTIUS"
      - question: "What Greek warrior, now living in his recently founded city of Argyripa, refused to aid Turnus in his fight against Aeneas?"
        answer: "DIOMEDES"
  - tossup:
      question: "Which of the Flavian emperors restored the Temple of Jupiter Optimus Maximus on the Capitoline Hill?"
      answer: "DOMITIAN"
    boni:
      - question: "In whose honor did Domitian dedicate a triumphal arch in A.D. 81?"
        answer: "TITUS’"
      - question: "What relation was Titus to Domitian?"
        answer: "TITUS WAS DOMITIAN’S OLDER BROTHER."
  - tossup:
      question: "In what numbered position on this simplified chart of the Julio-Claudian family, should you find the name of the emperor Gaius, commonly called Caligula?"
      answer: "“T”"
    boni:
      - question: "In what numbered position, should you find the emperor Claudius?"
        answer: "“S”"
      - question: "In what numbered position, should you find the emperor Tiberius?"
        answer: "“W”"
  - tossup:
      question: "According to one account, what goddess breast-fed Heracles when he was still a baby?"
      answer: "HERA"
    boni:
      - question: "Who had placed the baby Heracles to Hera’s breast while she was sleeping?"
        answer: "ZEUS / HERMES (* Athena persuaded Hera to breast-feed Heracles, but this occurred while Hera was awake)"
      - question: "When Hera woke up, she pushed the baby Heracles away, but her milk spurted from her breast and formed what celestial phenomenon?"
        answer: "MILKY WAY"
  - tossup:
      question: "What is the meaning of the Latin idiom at the root of the English adjective “belligerent”?"
      answer: "WAGE WAR"
    boni:
      - question: "What is the LITERAL meaning of the Latin idiom at the root of “republic”?"
        answer: "PUBLIC MATTER (THING)"
      - question: "Using your knowledge of Latin idioms, tell me what would have been the occupation of a <latin>causidicus</latin> in ancient Rome?"
        answer: "LAWYER (i.e. one who “pleads cases”)"
  - tossup:
      question: "What kingdom in the Middle East did Shapur I rule?"
      answer: "PERSIA"
    boni:
      - question: "Which Roman emperor was captured by Shapur and died in Persia?"
        answer: "VALERIAN (VALERIANUS)"
      - question: "Name Valerian’s son and successor who with the help of the king of Palmyra drove Shapur out of Asia Minor"
        answer: "GALLIENUS"
  - tossup:
      question: "Define <latin>undēvīgintī</latin>"
      answer: "NINETEEN"
    boni:
      - question: "What does <latin>undēvīgintī</latin> literally mean?"
        answer: "ONE FROM TWENTY"
      - question: "Say in Latin “twenty-one.”"
        answer: "<latin>VĪGINTĪ (ET) ŪNUS</latin>"
  - tossup:
      question: "In what Roman province was the city of <title>Colonia Agrippinensis</title>?"
      answer: "GERMANIA or GERMANIA INFERIOR (LOWER GERMANY)"
    boni:
      - question: "In whose honor was the city named?"
        answer: "AGRIPPINA THE YOUNGER (WIFE OF CLAUDIUS)"
      - question: "On what river was <latin>Colonia Agrippinensis</latin> located?"
        answer: "RHENUS / RHINE"
  - tossup:
      question: "A standard feature of Roman houses was the <latin>ātrium</latin>, a room into which one would pass after entering through the front door. The origin of the word <latin>ātrium</latin> is uncertain, but the most probable explanation is that it derives from the room’s color. According to this theory, from what Latin adjective with what meaning is <latin>ātrium</latin> derived?"
      answer: "<latin>ĀTER</latin> -- BLACK"
    boni:
      - question: "Sometimes a Roman house contained a <latin>piscīna</latin>. According to its root, what would one find in a <latin>piscīna</latin>?"
        answer: "FISH"
      - question: "A more exclusive house might even have had a <latin>sōlārium</latin>. According to its root, what would someone have done in a <latin>sōlārium</latin>?"
        answer: "SUN-BATHED"
  - tossup:
      question: "What use of the accusative case is found in the following sentence: <latin>Monstrā mihi pecūniam</latin>!"
      answer: "DIRECT OBJECT"
    boni:
      - question: "What use of the accusative case is found in the following sentence: <latin>Trēs hōrās in silvā ambulābāmus</latin>"
        answer: "DURATION OF TIME"
      - question: "What use of the accusative case is found in the following sentence: <latin>Mē principem nōmināvērunt</latin>"
        answer: "PREDICATE"
  - tossup:
      question: "According to Ovid, to what daughter of Cecrops did Mercury take a fancy?"
      answer: "HERSE"
    boni:
      - question: "Whom did Mercury ask to help him in his quest for Herse?"
        answer: "AGLAURUS / AGRAULUS"
      - question: "What did Aglaurus become after she tried to prevent Mercury from seeing Herse?"
        answer: "A STONE (or MARBLE) STATUE"
  - tossup:
      question: "What English noun meaning “unimportant matters” comes from the Latin for “three roads” because it describes the conversations that occur in the places where three roads intersect?"
      answer: "TRIVIA"
    boni:
      - question: "What related English adjective means “impenetrable”?"
        answer: "IMPERVIOUS"
      - question: "What related English verb means “carry from one place to another”?"
        answer: "CONVEY"
  - tossup:
      question: "According to some accounts, what giant hunter was the son of Poseidon?"
      answer: "ORION"
    boni:
      - question: "Who was the first wife of Orion?"
        answer: "SIDE"
      - question: "Why was Side sent to the Underworld?"
        answer: "FOR BOASTING THAT SHE WAS MORE BEAUTIFUL THAN HERA (JUNO)"
  - tossup:
      question: "How must a demonstrative pronoun agree with the noun it modifies?"
      answer: "GENDER, NUMBER, AND CASE"
    boni:
      - question: "How must a relative pronoun agree with its antecedent?"
        answer: "GENDER AND NUMBER"
      - question: "To what does a reflexive pronoun always refer?"
        answer: "THE SUBJECT OF THE SENTENCE"
  - tossup:
      question: "Listen carefully to the following Latin passage, which I will read twice, and answer in Latin the question that follows: <latin>Ōlim fuit pauper senex, Licinius nōmine, quī habitābat in villā rusticā cum duōbus fīliīs. Fīlia tamen habitābat nōn cum Liciniō, sed Romae cum suō marītō.</latin>  <latin>Quod nōmen pauperī senī est?</latin>"
      answer: "<latin>LICINIUS / LICINIŌ</latin>"
    boni:
      - question: "<latin>Quibuscum habitābat Licinius?</latin>"
        answer: "<latin>CUM DUŌBUS FĪLIĪS</latin>"
      - question: "Ubi habitābat fīlia Liciniī?"
        answer: "<latin>RŌMAE (CUM MARĪTŌ</latin>)"
