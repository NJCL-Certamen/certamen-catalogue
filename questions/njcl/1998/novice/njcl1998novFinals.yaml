tournament: "NJCL Certamen"
year: 1998
division: "Novice"
round: "Finals"
questions:
  - tossup:
      question: "World Cup ē98 is now only a recent memory, but, for Latin students, there is still a need to know about soccer. What noun with what meaning is the root of “soccer”?"
      answer: "<latin>SOCIUS</latin> – ALLY, PARTNER, SUPPORTER, COMRADE, FRIEND"
    boni:
      - question: "What Latin noun with what meaning lies at the root of “travesty”, as in “the performance of the U.S. team was a travesty”?"
        answer: "<latin>VESTIS</latin> – CLOTHES, ATTIRE, CLOTH, DRAPERY"
      - question: "What is the meaning of the Latin word <latin>socer</latin>?"
        answer: "FATHER-IN-LAW (EITHER SIDE)"
    communityNotes:
      - "There is no reason for anyone to know about soccer"
  - tossup:
      question: "During which of Ovid’s “Four Ages of Man” was righteousness replaced by trickery, slyness, and violence?"
      answer: "IRON AGE"
    boni:
      - question: "Which of Ovid’s “Four Ages of Men” preceded the Iron Age?"
        answer: "BRONZE AGE"
      - question: "Who was the last immortal to flee from the bloody earth during the Age of Iron?"
        answer: "ASTRAEA / IUSTITIA / MAIDEN JUSTICE"
  - tossup:
      question: "It is not uncommon for certain prefixes to have more than one meaning. The prefix “<latin>in</latin>-” is a good example of this. What is its meaning when incorporated into the Latin word <latin>inimīcus</latin>?"
      answer: "NOT"
    boni:
      - question: "What is the meaning of the prefix “<latin>in</latin>-” when incorporated into the Latin word <latin>incidō</latin>?"
        answer: "IN, INTO"
      - question: "“<latin>Per</latin>-” is another example of a prefix that may have more than one shade of meaning. What is the difference between its meaning in <latin>perterreō</latin> and in <latin>percurrō</latin>?"
        answer: "<latin>PERterreō</latin> – THOROUGHLY, THROUGH AND THROUGH, COMPLETELY; <latin>PERcurrō</latin> – THROUGH"
  - tossup:
      question: "Differentiate in meaning between <latin>decimus</latin> and <latin>dīcimus</latin>."
      answer: "<latin>DECIMUS</latin> – TENTH; <latin>DĪCIMUS</latin> – WE SPEAK, TELL, SAY, ETC."
    boni:
      - question: "Differentiate in meaning between <latin>cēnō</latin> and <latin>cēnseō</latin>."
        answer: "<latin>CĒNŌ</latin> – DINE; <latin>CĒNSEŌ</latin> – TAX, VALUE, ESTIMATE, ASSESS, THINK, TAKE A CENSUS, VOTE"
      - question: "Differentiate in meaning between <latin>hērēs</latin> and <latin>hērōs</latin>."
        answer: "<latin>HĒRĒS</latin> – HEIR, SUCCESSOR; <latin>HĒRŌS</latin> – HERO"
  - tossup:
      question: "What was the job of a <latin>lanista</latin>?"
      answer: "TRAINER / MANAGER OF GLADIATORS"
    boni:
      - question: "When was a gladiator called a <latin>tīrō</latin>?"
        answer: "<emphasis>BEFORE</emphasis> HIS FIRST PUBLIC APPEARANCE"
      - question: "What did the title of <latin>prīmus pālūs</latin> indicate about a gladiator?"
        answer: "BEST OF HIS CLASS"
  - tossup:
      question: "Translate: <latin>Fīlia cōnsulis pulchrior quam tribūnī erat</latin>"
      answer: "THE CONSUL’S DAUGHTER WAS MORE BEAUTIFUL THAN THE TRIBUNE’S"
    boni:
      - question: "Translate: <latin>Fīlia cōnsulis longē pulcherrima omnium erat</latin>"
        answer: "THE CONSUL’S DAUGHTER WAS BY FAR THE MOST BEAUTIFUL OF ALL"
      - question: "Translate: <latin>Nēmō erat tam similis deae</latin>"
        answer: "NO ONE WAS SO SIMILAR TO A GODDESS"
  - tossup:
      question: "Give the full Latin name of the former censor, known for his building activities, who convinced the Senate to reject a peace offer from Pyrrhus"
      answer: "APPIUS CLAUDIUS CAECUS"
    boni:
      - question: "Appius Claudius built Rome’s first aqueduct. What was its name?"
        answer: "<latin>AQUA APPIA</latin>"
      - question: "Appius Claudius also built the Via Appia from Rome to what city?"
        answer: "CAPUA"
  - tossup:
      question: "Which of the Furies was fetched from the Underworld to incite both Amata and Turnus against Aeneas?"
      answer: "ALECTO"
    boni:
      - question: "Who had fetched Alecto from the Underworld?"
        answer: "HERA / JUNO"
      - question: "After the abdication of King Latinus, what did Juno do to signal the coming of war?"
        answer: "SHE OPENED THE GATES OF THE TEMPLE OF JANUS"
  - tossup:
      question: "What is the meaning of <latin>quod</latin> in this Latin sentence: <latin>Marcus vult legere volūmen quod fabulae semper eī placent</latin>?"
      answer: "BECAUSE"
    boni:
      - question: "Besides “because”, what is the meaning of <latin>quod</latin> in this Latin sentence: <latin>Marcus vult legere volūmen quod dē mīlitibus scrīptum est</latin>?"
        answer: "WHICH"
      - question: "Assuming that <latin>quod</latin> means “which”, if <latin>volūmen</latin> were changed to <latin>volūmina</latin> in <latin>“Marcus vult legere volūmen quod dē mīlitibus scrīptum est”</latin>, what other alterations would have to be made to the rest of the sentence?"
        answer: "<latin>QUOD</latin> WOULD CHANGE TO <latin>QUAE</latin> & <latin>SCRĪPTUM EST</latin> WOULD BECOME <latin>SCRĪPTA SUNT</latin>"
  - tossup:
      question: "Whose influence with both her husband and her father strengthened the First Triumvirate?"
      answer: "JULIA"
    boni:
      - question: "Who was Julia’s husband?"
        answer: "(CN.) POMPEIUS / POMPEY (MAGNUS / THE GREAT)"
      - question: "Who were the parents of Julia?"
        answer: "(C.) JULIUS CAESAR & CORNELIA"
  - tossup:
      question: "What mythological character is identified by the letter “A”?"
      answer: "ATHAMAS"
    boni:
      - question: "Who was the mother of the characters labeled “B” and “C”?"
        answer: "NEPHELE"
      - question: "Who was the mother of the character identified with the letter “D”?"
        answer: "THEOPHANE"
  - tossup:
      question: "When you use the abbreviation <latin>ibid.</latin> in the footnote section of your research paper, what does it tell your teacher about the location of the information that you used for the research?"
      answer: "IN THE SAME PLACE (PAGE & BOOK) AS <emphasis>THE</emphasis> PREVIOUSLY DOCUMENTED SOURCE"
    boni:
      - question: "If you use the abbreviation <latin>loc. cit.</latin> in your paper, what does it tell your teacher about the location of the information?"
        answer: "IT IS IN A <emphasis>PASSAGE</emphasis> PREVIOUSLY CITED"
      - question: "If you use the abbreviation <latin>op. cit.</latin> in your paper, what does it tell your teacher about the location of the information?"
        answer: "IT IS IN A <emphasis>WORK</emphasis> PREVIOUSLY CITED"
  - tossup:
      question: "According to Hesiod, who was the first consort of Zeus?"
      answer: "METIS"
    boni:
      - question: "Again, according to Hesiod, who became the consort of Zeus after Metis?"
        answer: "THEMIS"
      - question: "Name one of the offspring of Zeus and Metis <emphasis>and</emphasis> Zeus and Themis, respectively"
        answer: "METIS = (PALLAS) ATHENA & THEMIS = THE FATES / MOERAE / MOIRAI (CLOTHO, LACHESIS, ATROPOS) OR THE SEASONS / HORAE (EUNOMIA, DIKE, EIRENE)"
  - tossup:
      question: "Using standard Latin, translate “of the men” for this sentence: Ten of the men were killed in battle"
      answer: "<latin>Ē / DĒ VIRĪS, EX / DĒ HOMINIBUS</latin>"
    boni:
      - question: "Using standard Latin, translate “of the men” for this sentence: Most of the men were spared"
        answer: "<latin>VIRŌRUM, HOMINUM</latin>"
      - question: "Using standard Latin, translate “of the men” for this sentence: All of the men were wounded"
        answer: "<latin>VIRĪ, HOMINĒS</latin>"
  - tossup:
      question: "Give an antonym of <latin>vēritās</latin>"
      answer: "<latin>DOLUS ,FRAUS, FALLĀCIA, MENDĀCIUM, CALLIDITĀS, ASTŪTIA, FALSUM</latin>"
    boni:
      - question: "Give an antonym of <latin>fēlīcitās</latin>"
        answer: "<latin>TRISTITIA, TRĪSTIMŌNIA, MAESTITIA, MAESTITŪDŌ, CALĀMITĀS</latin>"
      - question: "Give an antonym of <latin>paupertās</latin>"
        answer: "<latin>OPĒS, DĪVITIAE, FACULTĀS (-TĒS), BONA, FORTŪNAE, RĒS SECUNDAE</latin>"
  - tossup:
      question: "Which of the following battle sites was closest to Rome: Munda, Cannae, Zama, Philippi, or Actium?"
      answer: "CANNAE"
    boni:
      - question: "Which of the following cities was the closest to Rome: Veii, Clusium, Neapolis, Tarentum, or Capua?"
        answer: "VEII"
      - question: "Which of the following cities was farthest from Rome: Puteoli, Ostia, Beneventum, Baiae, or Brundisium?"
        answer: "BRUNDISIUM"
  - tossup:
      question: "What reward did the greedy Trojan Dolon want in return for volunteering to spy on the Greek camp by night?"
      answer: "THE (IMMORTAL) HORSES (XANTHUS & BALIUS AND THE CHARIOT) OF ACHILLES"
    boni:
      - question: "Who accepted this offer on behalf of the Trojans?"
        answer: "HECTOR"
      - question: "Who actually killed Dolon?"
        answer: "DIOMEDES"
  - tossup:
      question: "Make the phrase <latin>duae rānae</latin> dative"
      answer: "<latin>DUĀBUS RĀNĪS</latin>"
    boni:
      - question: "Give the corresponding form of <latin>trēs ursī</latin>"
        answer: "<latin>TRIBUS URSĪS</latin>"
      - question: "Give the corresponding form of <latin>quattuor leōnēs</latin>"
        answer: "<latin>QUATTUOR LEŌNIBUS</latin>"
  - tossup:
      question: "What empress traveled extensively with her husband and was present at his death at Selinus in Cilicia in AD 117?"
      answer: "(POMPEIA) PLOTINA"
    boni:
      - question: "According to the message which she sent to the Senate, whom did her husband Trajan adopt as his heir on his death-bed?"
        answer: "HADRIAN"
      - question: "Not everyone accepted the adoption. How many of Trajan’s right-hand men were executed in AD 118 by the Praetorian Prefect for conspiring against Hadrian?"
        answer: "FOUR"
  - tossup:
      question: "<latin>Audī et rēspondē Latīnē. Cōtīdiē prīmā lūce surgō. Tum coepī meōs agrōs colere. Rūrī in fundō habitō cum meā familiā. Quae occupātiō mihi est?</latin>"
      answer: "<latin>COLONUS, RUSTICUS, AGRICOLA (ES)</latin>"
    boni:
      - question: " <latin>Cōtīdiē prīmā lūce surgō. Nōn agrōs, sed discipulōs in lūdō colō. Docendō discō. Quae occupātiō mihi est?</latin>"
        answer: "<latin>MAGISTER (-TRA) / LITTERĀTOR (ES) / DOCTOR, RHETOR</latin>"
      - question: " <latin>Cōtīdiē prīmā lūce surgō. Nec agrōs nec discipulōs sed pānem colō eīs quī edere volunt. Sine mē nōn est pānis circensibus. Quae occupātiō mihi est?</latin>"
        answer: "<latin>PISTOR (-TRIX) (ES)</latin>"
