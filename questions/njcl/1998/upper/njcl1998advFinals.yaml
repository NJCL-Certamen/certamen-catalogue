tournament: "NJCL Certamen"
year: 1998
division: "Advanced"
round: "Finals"
questions:
  - tossup:
      question: "Differentiate in meaning between <latin>dēligō, dēligere</latin> and <latin>dēligō, dēligāre</latin>"
      answer: "<latin>DĒLIGERE</latin> – PLUCK OFF, PICK OFF, CHOOSE, ENROLL <latin>DĒLIGĀRE</latin> – TIE UP, FASTEN, BANDAGE"
    boni:
      - question: "Differentiate in meaning between <latin>glīs</latin> and <latin>glīscō</latin>"
        answer: "<latin>GLĪS</latin> – DORMOUSE <latin>GLĪSCŌ</latin> – SWELL, INCREASE, GROW IN POWER"
      - question: "Differentiate in meaning between <latin>germen</latin> and <latin>grāmen</latin>"
        answer: "<latin>GERMEN</latin> - SEED, <latin>GRAMEN</latin> - GRASS"
  - tossup:
      question: "The 1998 NCAA College World Series provided some of the most memorable moments for serious college baseball fans as records were shattered, and it is with little surprise that one of America’s favorite sports has a classical root. What is the meaning of the Greek root of “baseball”?"
      answer: "STEP / WALK / PLATE / GROUND / PEDESTAL // (TO) WALK"
    boni:
      - question: "Any college baseball fan would know that LSU’s Alex Box Stadium is one of the toughest places to play in. Give the meaning of the Greek root preserved in the word “stadium”"
        answer: "A FIXED STANDARD OF LENGTH (600 GREEK OR 606 3/4 ENGLISH FEET, ABOUT 1/8 OF A ROMAN MILE) / STADE / RACE-COURSE"
      - question: "Most college baseball players are superb athletes. Give the <emphasis>ultimate</emphasis> Greek root of “athlete”"
        answer: "PRIZE, AWARD"
  - tossup:
      question: "Who came, as envoys, to Troy to negotiate the return of Helen?"
      answer: "MENELAÜS & ODYSSEUS"
    boni:
      - question: "What Trojan elder protected the envoys from others who would have harmed them, a deed which was repaid the night Troy fell?"
        answer: "ANTENOR"
      - question: "What was placed over the door to protect the household of Antenor from the attacking Greeks?"
        answer: "A LEOPARD SKIN"
  - tossup:
      question: "What is the title commonly given to a collection of biographies of Roman emperors, Caesars, and usurpers from AD 117 to 284?"
      answer: "<title><latin>HISTORIA AUGUSTA</latin></title>"
    boni:
      - question: "How many authors were believed to have composed the <title><latin>Historia Augusta</latin></title>?"
        answer: "SIX"
      - question: "Name one of these six authors"
        answer: "AELIUS SPARTIANUS, JULIUS CAPTOLINUS, VOLCATIUS GALLICANUS, AELIUS LAMPRIDIUS, TREBELLIUS POLLIO, & FLAVIUS VOPISCUS"
  - tossup:
      question: "Name the wife of one of the conspirators who was aware of the plot to assassinate Julius Caesar"
      answer: "PORCIA (THE WIFE OF BRUTUS)"
    boni:
      - question: "Name the mother of Brutus who had been Caesar’s mistress for many years and whose daughter was married to Cassius"
        answer: "SERVILIA"
      - question: "Name the wife of Julius Caesar who urged him not to go to the Senate meeting on the Ides of March"
        answer: "CALPURNIA"
  - tossup:
      question: "The term “Dioscuri” literally means “sons of Zeus,” and usually refers to Castor and Pollux. Based on the definition of the word, what two early kings of Thebes might be considered as the “Theban Dioscuri”?"
      answer: "AMPHION & ZETHUS"
    boni:
      - question: "Who was the mother of the “Theban Dioscuri”?"
        answer: "ANTIOPE"
      - question: "In what form did Zeus pursue Antiope?"
        answer: "A SATYR"
  - tossup:
      question: "What Jewish priest was often referred to by Jerome as “the Greek Livy” on account of his literary works?"
      answer: "(FLAVIUS) JOSEPHUS"
    boni:
      - question: "What is the Latin title of Josephus’ account of the Jewish War against the Romans?"
        answer: "<title><latin>BELLUM JUDAICUM</latin></title>"
      - question: " In what language was his work written before being translated into Greek?"
        answer: "ARAMAIC"
  - tossup:
      question: "Say in Latin: three-fifths"
      answer: "<latin>TRĒS QUĪNTAE (PARTĒS)</latin>"
    boni:
      - question: "Say in Latin: one-seventh"
        answer: "<latin>SEPTIMA PARS</latin>"
      - question: "Quae sunt duae sextae et sexta pars?"
        answer: "DĪMIDIA PARS / DĪMIDIUM (IF <latin>TRĒS SEXTAE [PARTĒS]</latin> IS GIVEN, SAY “SIMPLIFY THAT FRACTION”)"
  - tossup:
      question: "Who laid the foundations for Macedonian power by uniting Macedonia and forging a professional army?"
      answer: "PHILIP II"
    boni:
      - question: "With what battle formation did Philip train his army to fight?"
        answer: "PHALANX"
      - question: "What Athenian invited Philip to lead all of Greece against Persia?"
        answer: "ISOCRATES"
  - tossup:
      question: "Make the phrase <latin>as amissus</latin> plural"
      answer: "<latin>ASSĒS AMISSĪ</latin> (MUST SPELL)"
    boni:
      - question: "Make the phrase <latin>femur fractum</latin> plural"
        answer: "<latin>FEMORA/FEMINA FRACTA</latin>"
      - question: "Make the phrase <latin>carbasus candida</latin> plural"
        answer: "<latin>CARBASA CANDIDA</latin>"
  - tossup:
      question: "<latin>consul suffectus</latin> was appointed to fill a vacancy in the consulship. What is the title of the person appointed to rule in the event of the death of <emphasis>both</emphasis> consuls?"
      answer: "<latin>INTERREX</latin>"
    boni:
      - question: "Who was eligible to be selected as the <latin>interrex</latin>?"
        answer: "<emphasis>PATRICIAN</emphasis> SENATORS"
      - question: "How long was the term of an <latin>interrex</latin>?"
        answer: "FIVE DAYS"
  - tossup:
      question: "What modern weapon derives its name from the Roman name for a certain long, round fish that applied a numbing electric shock to anyone who touched it, and ultimately from a Latin verb meaning “be numb”?"
      answer: "TORPEDO"
    boni:
      - question: "What English adjective meaning “shy and modest” derives from a Latin noun meaning “delay”?"
        answer: "DEMURE"
      - question: "What English verb meaning “entice by beguiling methods” derives from a Latin phrase meaning “without eyes”?"
        answer: "INVEIGLE (<latin>ab oculīs</latin>)"
  - tossup:
      question: "In which of his speeches of 56 B.C. did Cicero attempt to unite the aristocratic party in an effort to defeat the First Triumvirate?"
      answer: "<title><latin>PRO SESTIŌ</latin></title>"
    boni:
      - question: "Which of Cicero’s enemies brought up the charge of rioting against Sestius?"
        answer: "(P.) CLODIUS (PULCHER)"
      - question: "What speech dealing with the same case, also delivered in 56 BC, is an attack on a witness against Sestius?"
        answer: "<title><latin>IN VATINIUM</latin></title>"
  - tossup:
      question: "Translate: <latin>Formīcae, quamvīs parvae sint, animalia māgnī labōris sunt</latin>"
      answer: "ANTS, ALTHOUGH THEY ARE SMALL, ARE CREATURES OF GREAT TOIL"
    boni:
      - question: "Translate: <latin>Formīcae operantur tamquam sī hūmānī sint.</latin> "
        answer: "ANTS WORK AS IF THEY WERE HUMAN"
      - question: "Translate: <latin>Formīcae intelligunt sē, sī nōn labōrāverint, ēsurītūrās esse.</latin> "
        answer: "THE ANTS UNDERSTAND THAT, IF THEY DON’T WORK, THEY WILL BE HUNGRY"
  - tossup:
      question: "According to Homer, who was the only other mortal who knew about the secret of Odysseus’ bed besides Penelope and Odysseus?"
      answer: "ACTORIS"
    boni:
      - question: "How did Actoris learn the secret of Odysseus’ bed?"
        answer: "SHE WAS PENELOPE’S HANDMAIDEN AND SHE TENDED THE DOORS OF ODYSSEUS’ BEDCHAMBER"
      - question: "Who had given Actoris to Penelope as her handmaiden?"
        answer: "(PENELOPE’S FATHER) ICARIUS"
  - tossup:
      question: "What conjunction would be required to translate the dependent clause into Latin for this sentence: Jack scarcely restrained himself from going up the hill?"
      answer: "<latin>QUĪN</latin>"
    boni:
      - question: "What conjunction would be required to translate the dependent clause into Latin for this sentence: Jack did not fear that he would break his crown"
        answer: "<latin>NĒ</latin>"
      - question: "What conjunction would be required to translate the dependent clause into Latin for this sentence: Jill went up the hill so they could fetch a pail of water more easily"
        answer: "<latin>QUŌ</latin>"
  - tossup:
      question: "Of what city on the Moselle River was the <title>Porta Nigra</title> a major entrance?"
      answer: "TRIER / <title>AUGUSTA TREVERORUM</title>"
    boni:
      - question: "Name one of the two tetrarchs who had their imperial residence at Trier. <title>see below for answer</title>"
        answer: "SEE BELOW"
      - question: "Name another"
        answer: "CONSTANTIUS I / CHLORUS AND CONSTANTINE I / THE GREAT"
  - tossup:
      question: "Which of the extant plays of Aeschylus was the third tragedy in the tetralogy of <title>Laius</title>, <title>Oedipus</title>, and the satyr play <title>The Sphinx</title>?"
      answer: "<title>SEVEN AGAINST THEBES</title>"
    boni:
      - question: "According to Aristophanes, <title>Seven Against Thebes</title> and one other of Aeschylus’ extant plays was “full of war.” What is that other play, which was based upon an historical event?"
        answer: "<title>THE PERSIANS</title>"
      - question: "In which of Aristophanes’ works is Aeschylus made to defend his use of “high-flown” language?"
        answer: "THE FROGS"
  - tossup:
      question: "Who filled the bedchamber of Admetus with snakes because he had forgotten to include her in his wedding-sacrifice?"
      answer: "ARTEMIS / DIANA"
    boni:
      - question: "Who, having been courted by two gods, boasted that she was more beautiful than Artemis and was punished for this impiety?"
        answer: "CHIONE"
      - question: "What daughter of Meropes was shot by Artemis because she had stopped worshipping her?"
        answer: "ETHEMEA"
  - tossup:
      question: "(PASS OUT THE VISUALS--REMIND THE PLAYERS NOT TO OPEN THE VISUALS UNTIL THEY ARE TOLD TO DO SO--WHEN EVERYONE HAS A VISUAL, SAY “PLEASE OPEN THE VISUAL NOW”) The handout in front of you is a picture of the sarcophagus of Lucius Cornelius Scipio Barbatus and was the oldest sarcophagus discovered in 1782 when the tomb of the Scipios on the Via Appia was excavated. This inscription, in Saturnian meter, was most likely chiseled into the side of the sarcophagus approximately 50 years after the death of Scipio Barbatus. <latin>Cornelius Lucius Scipio Barbatus, [–] Gnaivod patre / prognatus, fortis vir sapiensque, – quoius forma virtutei parisuma / fuit, – consol, censor, aidilis quei fuit apud vos; – Taurasia, Cisauna / Samnio capit, – subigit omne Loucanam opsidesque abdoucit.</latin> There are many words in the inscription which contain forms archaic to classical Latin. Name three of those and their classical equivalents."
      answer: "SEE BELOW"
      boni:
      - question: "Name four more"
        answer: "<latin>GNAIVOD - GNAEO / QUOIUS - CUIUS / VIRTUTEI - VIRTUTI / PARISUMA - PARISSIMA / CONSOL - CONSUL / AIDILIS - AEDILIS / QUEI - QUI / LOUCANAM - LUCANAM / OPSIDES - OBSIDES / ABDOUCIT - ABDUCIT</latin>"
      - question: Translate the inscription from <latin>fortis</latin> to <latin>vos</latin>
        answer: "A BRAVE AND WISE MAN, WHOSE LOOKS WERE VERY EQUAL TO HIS VALOR, WHO WAS AEDILE, CONSUL, (AND) CENSOR AMONG YOU"
