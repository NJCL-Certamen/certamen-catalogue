tournament: "NJCL Certamen"
year: 1998
division: "Advanced"
round: "Semifinals"
questions:
  - tossup:
      question: "According to Homer, Helen climbed above the walls of what gate when she went to see the duel between Paris and Menelaüs?"
      answer: "SCAEAN GATE"
    boni:
      - question: "Who called upon Helen to name the various heroes of the Greeks?"
        answer: "PRIAM / PODARCES"
      - question: "When Helen was pointing out the various heroes of the Greeks, whose absence did she specifically notice?"
        answer: "THE ABSENCE OF (HER BROTHERS) CASTOR AND POLLUX / POLYDEUCES"
  - tossup:
      question: "What use of the genitive case is found in “<latin>virtutēs continēntiae, gravitātis, iūstitiae, fideī</latin>”?"
      answer: "SPECIFICATION / RESPECT"
    boni:
      - question: "“<latin>Dēsine mollium tandem querēllārum</latin>”?"
        answer: "SEPARATION"
      - question: "“<latin>Habeō parvī Marsum augurem</latin>”?"
        answer: "(INDEFINITE) VALUE"
  - tossup:
      question: "What Roman priesthood was so circumscribed by taboos that its holder could not have a political career?"
      answer: "<latin>FLAMEN DIALIS</latin>"
    boni:
      - question: "To what social class must the <latin>Flamen</latin> and his wife belong?"
        answer: "PATRICIAN"
      - question: "Describe the hat which the <latin>Flamen Dialis</latin> was required to wear"
        answer: "WHITE (LEATHER) CONICAL (CALLED THE <latin>APEX</latin> - WITH A SPRIG OF OLIVE or A SPIKE OF OLIVE WOOD AT THE TOP)"
  - tossup:
      question: "Using <latin>confiteor</latin>, translate into Latin the protasis of the following condition: If you had confessed, you would have been punished less severely"
      answer: "<latin>SĪ CONFESSUS (-A / -UM) ESSĒS / SĪ CONFESSĪ (-AE / -A) ESSĒTIS</latin>"
    boni:
      - question: "Using <latin>confiteor</latin>, translate into Latin the protasis of the following condition: If you should confess, you would be punished with a lesser penalty"
        answer: "<latin>SĪ CONFITEĀRIS (-RE) / SĪ CONFITEĀMINĪ</latin>"
      - question: "Change your answer to future more vivid"
        answer: "<latin>SĪ CONFITĒBERIS, SĪ CONFITĒBIMINĪ</latin>"
  - tossup:
      question: "What Latin poet died a few months after his patron and friend Maecenas in 8 BC?"
      answer: "HORACE / Q. HORATIUS FLACCUS"
    boni:
      - question: "What two men introduced Horace to Maecenas?"
        answer: "VERGIL & VARIUS RUFUS"
      - question: "Which books of what collection of lyric poems, published in 23 BC, did Horace address to Maecenas?"
        answer: "<title>ODES / <latin>CARMINA</latin></title> BOOK I"
  - tossup:
      question: "What part of your body comes from a Greek word meaning “fence”?"
      answer: "DIAPHRAGM"
    boni:
      - question: "What is the meaning of the Greek noun at the root of “phlebitis”?"
        answer: "VEIN"
      - question: "What is the meaning of the Greek verb at the root of “dystrophy”?"
        answer: "NOURISH"
  - tossup:
      question: "On certain works of what Greek comedian did Plautus model his <title><latin>Cistellaria, Bacchides,</latin></title> and <title><latin>Poenulus</latin></title>?"
      answer: "MENANDER"
    boni:
      - question: "On certain works of what Greek comedian did Plautus model his <title><latin>Casīna</latin></title> and <title><latin>Rudens</latin></title>?"
        answer: "DIPHILUS"
      - question: "On certain works of what Greek comedian did Plautus model his <title><latin>Mercator</latin></title> and <title><latin>Trinummus</latin></title>?"
        answer: "PHILEMON"
  - tossup:
      question: "Listen carefully to the following Latin passage, which I will read twice, and answer IN ENGLISH the question about it. <latin>Quaerunt multī cūr Vergilius Aenēam prīmum ad Italiam vēnisse dīxerit, cum paulō post dīcat Antēnorem ante adventum Aenēae fundāsse cīvitātem. Antēnor nōn ad Italiam vēnit, sed ad Galliam Cisalpīnam, quae nōn erat pars Italiae annō urbis Aenēiae conditae!</latin>  What do many people ask in regard to Aeneas and Antenor?"
      answer: "WHY VERGIL SAID THAT AENEAS CAME TO ITALY FIRST (WHEN A LITTLE LATER HE SAYS THAT ANTENOR HAD FOUNDED A CITY BEFORE THE ARRIVAL OF AENEAS)"
    boni:
      - question: "According to the passage, where was Antenor the first to found a city?"
        answer: "CISALPINE GAUL* <emphasis>DO NOT PROMPT</emphasis>"
      - question: "Why then, according to the passage, was Antenor NOT the first to come to Italy?"
        answer: "BECAUSE CISALPINE GAUL WAS NOT PART OF ITALY WHEN AENEAS FOUNDED HIS CITY"
  - tossup:
      question: "What pair of mythological dwarfs were warned by their mother “to beware of the black-bottomed man”?"
      answer: "CERCOPES / PASSALUS & ACMON"
    boni:
      - question: "To whom does this prophecy refer?"
        answer: "HERACLES / HERCULES"
      - question: "How did Heracles punish them after he caught them stealing his weapons?"
        answer: "(HE TIED THEIR FEET TO A POLE AND) CARRIED THEM OFF ON HIS SHOULDERS HANGING UPSIDE DOWN"
  - tossup:
      question: "What name is given to the oligarchs who ruled Athens at the end of the Peloponnesian War?"
      answer: "THIRTY TYRANTS"
    boni:
      - question: "What long time associate of Socrates was the leader of the extremists?"
        answer: "CRITIAS"
      - question: "Name the victorious Spartan commander who supported the rule of the Tyrants"
        answer: "LYSANDER"
  - tossup:
      question: "Give a synonym of <latin>fiō</latin>"
      answer: "<latin>ACCIDŌ, ĒVENIŌ, CONTINGŌ, LĀBOR, PRŌLĀBOR, ALLĀBOR</latin>"
    boni:
      - question: "Give a synonym of <latin>supplicō</latin>"
        answer: "<latin>ŌRŌ, OBSECRŌ, ROGŌ, PŌSCŌ, QUAERŌ, PETŌ, POSTULŌ, FLĀGITŌ</latin>"
      - question: "Give a synonym of <latin>excitō</latin>"
        answer: "<latin>COMMOVEŌ, INCITŌ, INSTIGŌ, IRRITŌ, SUSCITŌ, AGITŌ, CIEŌ</latin>"
  - tossup:
      question: "Whom did Veturia and Volumnia stop from leading an army against Rome?"
      answer: "(CN. MARCIUS) CORIOLANUS"
    boni:
      - question: "What enemy army was Coriolanus leading against Rome?"
        answer: "VOLSCIANS / VOLSCIAN ARMY / <title>VOLSC</title>Ī"
      - question: "Why had Coriolanus been exiled from Rome?"
        answer: "TYRANNICAL CONDUCT (or OPPOSING DISTRIBUTION OF GRAIN TO STARVING PLEBS)"
  - tossup:
      question: "Who was the charioteer of Amphiaraüs?"
      answer: "BATON / ELATO"
    boni:
      - question: "What was Baton’s fate during the siege of Thebes by the “Seven Against Thebes”?"
        answer: "HE VANISHED / WAS ENGULFED IN A <emphasis>CHASM</emphasis>"
      - question: " (WITH HIS MASTER AND CHARIOT) Who was about to spear Amphiaraüs in the back when Zeus split the earth open to engulf Baton and his master?"
        answer: "PERICLYMENUS"
  - tossup:
      question: "What 2nd century AD author of many apologetic and theological works was the first major writer in Latin to proclaim and defend Christianity?"
      answer: "(Q. SEPTIMIUS FLORUS) TERTULLIAN(US)"
    boni:
      - question: "What later Christian author dedicated <title><latin>Institutionēs Divinae</latin></title>, a work justifying Christianity to educated pagans, to the emperor Constantine?"
        answer: "(L. CAELIUS / CAECILIUS FIRMIANUS) LACTANTIUS"
      - question: "What classical author greatly influenced the language and style of Lactantius’ works?"
        answer: "(M. TULLIUS) CICERO"
  - tossup:
      question: "What is the meaning of the Latin verb at the root of “polite”?"
      answer: "POLISH, HULL (GRAIN), CLEAR GROUND BY WEEDING, GIVE FINISH TO"
    boni:
      - question: "What is the meaning of the Latin verb at the root of “redolent”?"
        answer: "(GIVE OFF A) SMELL, BE FRAGRANT OR ODOROUS, STINK"
      - question: "What is the meaning of the Latin verb at the root of “succinct”?"
        answer: "GATHER UP, GIRD UP, SURROUND CLOSELY, HEM AROUND, SURROUND, ENCIRCLE"
  - tossup:
      question: "(PASS OUT THE VISUALS--REMIND THE PLAYERS NOT TO OPEN THE VISUALS UNTIL THEY ARE TOLD TO DO SO--WHEN EVERYONE HAS A VISUAL, SAY “PLEASE OPEN THE VISUAL NOW”) This family tree shows the family of Cadmus. Name the mythological character identified by the letter “B”"
      answer: "ECHION"
    boni:
      - question: "Name the mythological character identified by the letter “D”"
        answer: "LEARCHUS"
      - question: "Name the mythological character identified by the letter “C”"
        answer: "NYCTEIS"
  - tossup:
      question: "Against whom did Lucilla, the daughter of Marcus Aurelius, lead a revolt in AD 182?"
      answer: "COMMODUS (HER BROTHER)"
    boni:
      - question: "Lucilla may have poisoned her first husband, her father’s co-emperor. Name him"
        answer: "L. VERUS"
      - question: "Name Commodus’ mistress who was involved in the plot which succeeded in killing the “Herculean” emperor"
        answer: "MARCIA"
  - tossup:
      question: "What Silver Age poet may have been criticizing the emperor Nero in the first and fourth of his six satires?"
      answer: "(A.) PERSIUS (FLACCUS)"
    boni:
      - question: "Persius died very young. Who revised his satires before publication and may have toned them down?"
        answer: "(ANNAEUS) CORNUTUS"
      - question: "Which of Persius’ satires eulogizes Cornutus?"
        answer: "FIFTH"
  - tossup:
      question: "Give both of the possible present active infinitives for <latin>edō</latin>"
      answer: "<latin>ĒSSE, EDERE</latin>"
    boni:
      - question: "Give both of the possible second person singular imperatives of <latin>edō</latin>"
        answer: "<latin>ĒS, EDE</latin>"
      - question: "Give both possible forms for the second person plural, present active imperatives of <latin>edō</latin>"
        answer: "<latin>ĒSTE, EDITE</latin>"
  - tossup:
      question: "Give the second person plural, imperfect active subjunctive for <latin>plangō</latin>"
      answer: "<latin>PLANGERĒTIS</latin>"
    boni:
      - question: "Change <latin>plangerētis</latin> to pluperfect"
        answer: "<latin>PLANXISSĒTIS</latin>"
      - question: "Change <latin>planxissētis</latin> to passive"
        answer: "<latin>PLANCTĪ (-AE/-A) ESSĒTIS</latin>"
