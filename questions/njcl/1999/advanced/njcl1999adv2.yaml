tournament: "NJCL Certamen"
year: 1999
division: "Advanced"
round: "Round 2"
questions:
  - tossup:
      question: "What two migrating tribes caused a panic in Italy and the provinces of Cisalpine and Transalpine Gaul in the late 2nd century BC?"
      answer: "CIMBRI & TEUTONES"
    boni:
      - question: "Where did the combined tribes destroy a Roman army in 105 BC?"
        answer: "ARAUSIO (modern ORANGE)"
      - question: "What Roman general was elected consul every year from 104 to 101 BC to destroy these tribes?"
        answer: "(C.) MARIUS"
  - tossup:
      question: "Where did Julius Caesar defeat the sons of Pompey and his former legate Labienus in 45 BC?"
      answer: "MUNDA (PASS OUT THE VISUAL)"
    boni:
      - question: "Which letter on the map corresponds to the site of the battle of Munda?"
        answer: "“A”"
      - question: "Which letter on the map corresponds to the site of the battle of Zela?"
        answer: "“E”"
  - tossup:
      question: "Make the phrase <latin>obses locuplēs</latin> genitive singular"
      answer: "<latin>OBSIDIS LOCUPLĒTIS</latin>"
    boni:
      - question: "Make the phrase <latin>aetās concors</latin> genitive singular"
        answer: "<latin>AETĀTIS CONCORDIS</latin>"
      - question: "Make the phrase <latin>pater Anchīsēs</latin> genitive singular"
        answer: "<latin>PATRIS ANCHĪSAE</latin>"
  - tossup:
      question: "What Roman elegiac poet and friend of Messala Corvinus was described by Quintilian as <latin>“tersus atque elegans”</latin> because his literary style is simple and luminous, free and refined?"
      answer: "TIBULLUS"
    boni:
      - question: "To whom did Tibullus address the first six elegies of his first book of elegies?"
        answer: "DELIA / PLANIA"
      - question: "What later author declared that Delia was in fact a woman named Plania?"
        answer: "APULEIUS"
  - tossup:
      question: "Who sent Odysseus to consult the spirit of Teiresias in order to find out how he could be certain of returning to Ithaca?"
      answer: "CIRCE"
    boni:
      - question: "What did the ghost of Teiresias say to Odysseus regarding his return?"
        answer: "THAT ODYSSEUS WOULD RETURN ALONE TO ITHACA ON A FOREIGN SHIP / HE WOULD TAKE REVENGE OF THE SUITORS"
      - question: "Give another prophecy that was given to Odysseus by Teiresias"
        answer: "HE WOULD TAKE REVENGE OF THE SUITORS / HE WOULD SET OFF, WITH ONE OAR ON HIS SHOULDER, IN SEARCH OF A PEOPLE WHO KNEW NOTHING ABOUT SAILING (AND THERE HE MUST OFFER A SACRIFICE TO POSEIDON) / HE WOULD FINALLY DIE DURING A HAPPY OLD AGE, FAR FROM THE SEA"
  - tossup:
      question: "Which slaves were known as <latin>vernae</latin>?"
      answer: "THOSE BORN IN THE HOUSEHOLD"
    boni:
      - question: "What is the Latin term for the “marriage” of slaves?"
        answer: "<latin>CONTUBERNIA/-UM</latin>"
      - question: "In general it was cheaper to buy than to raise a slave. In the Aegean, where was the principal slave market?"
        answer: "DELOS"
  - tossup:
      question: "What Greek warrior killed Memnon, the king of the Ethiopians?"
      answer: "ACHILLES / LIGYRON"
    boni:
      - question: "Who were the parents of Memnon?"
        answer: "EOS & TITHONUS"
      - question: "Which of Nestor’s sons was killed by Memnon?"
        answer: "ANTILOCHUS"
  - tossup:
      question: "Translate: <latin>Hostēs in castra ventūrī sunt mīlitum interficiendōrum causā</latin>"
      answer: "THE ENEMY IS ABOUT TO/ ARE GOING TO COME INTO THE CAMP FOR THE SAKE OF KILLING / TO KILL THE SOLDIERS"
    boni:
      - question: "Translate: <latin>Hostēs vēnerant in spē potiendōrum castrōrum.</latin>"
        answer: "THE ENEMY HAD COME IN THE HOPE OF / IN THE EXPECTATION OF / IN ANTICIPATION OF GAINING / HOPING TO GAIN POSSESSION OF THE CAMP"
      - question: "Translate: <latin>Bellī gerendī ars difficillima semper fuit.</latin>"
        answer: "THE ART OF WAGING WAR HAS ALWAYS BEEN / WAS VERY DIFFICULT"
  - tossup:
      question: "Rancor towards society and hidden resentment at not belonging to it are important elements in the indignant satires of what silver-age poet?"
      answer: "JUVENAL"
    boni:
      - question: "How many of Juvenal’s satires have survived to us?"
        answer: "SIXTEEN"
      - question: "What emperor is often depicted unfavorably in Juvenal’s satires?"
        answer: "DOMITIAN"
  - tossup:
      question: "What is the meaning of the Caesarian idiom <latin>sub corōnā vendere</latin>?"
      answer: "TO SELL INTO SLAVERY"
    boni:
      - question: "What is the meaning of the Caesarian idiom <latin>sub iugum mittere</latin>?"
        answer: "TO SEND UNDER THE YOKE, TO DEFEAT DECISIVELY, HUMILIATE / ENSLAVE /SUBJUGATE A DEFEATED ARMY"
      - question: "What is the meaning of the Caesarian idiom <latin>prīmum pīlum dūcere</latin>?"
        answer: "TO HOLD THE RANK OF FIRST CENTURION"
  - tossup:
      question: "What Latin adjective with what meaning lies at the root of “extravagant”?"
      answer: "<latin>VAGUS</latin> – WANDERING, CHANGING, RAMBLING"
    boni:
      - question: "What Latin verb meaning “wander” is derived from <latin>vagus</latin>?"
        answer: "<latin>VAGOR, VAGĀRĪ / VAGŌ, VAGĀRE</latin>"
      - question: "What English noun, also derived from <latin>vagus</latin>, means “a flight of fancy”?"
        answer: "VAGARY"
  - tossup:
      question: "In this line from Lucan, what is the oxymoron: <latin>temporis angustī mānsit concordia discors</latin>?"
      answer: "<latin>CONCORDIA DISCORS</latin> / DISHARMONIOUS HARMONY"
    boni:
      - question: "What literary device, besides alliteration, can be found in the following line from Vergil: <latin>quae mē cumque vocant terrae</latin>?"
        answer: "TMESIS"
      - question: "What literary device, besides alliteration, can be found in the following line from Vergil: <latin>paterīs lībāmus et aurō</latin>?"
        answer: "HENDIADYS"
  - tossup:
      question: "According to the usual accounts, why did Apollo kill the Cyclopes?"
      answer: "BECAUSE THEY HAD FORGED (ZEUS’/JUPITER’S) THUNDERBOLTS (or LIGHTNINGBOLTS) THAT WERE USED <emphasis>TO KILL ASCLEPIUS / AESCULAPIUS</emphasis>"
    boni:
      - question: "What was Apollo’s punishment?"
        answer: "TO WORK FOR ONE YEAR AS A MORTAL’S HIRELING"
      - question: "Under what Thessalian king did Apollo serve as a herdsman?"
        answer: "ADMETUS"
  - tossup:
      question: "What use of the ablative case is found in the following Latin sentence: <latin>Sōlus potītus est imperiō Rōmulus</latin>?"
      answer: "MEANS / SPECIAL DEPONENT VERBS / SUNDRY VERBS"
    boni:
      - question: "What use of the ablative case is found in the following Latin sentence: <latin>Vīgintī talentīs ūnam ōrātiōnem Īsocratēs vēndidit.</latin>"
        answer: "(DEFINITE / SPECIFIC) PRICE"
      - question: "What use of the ablative case is found in the following Latin sentence: <latin>Mūrus dēfensōribus nūdātus est</latin>?"
        answer: "SEPARATION"
  - tossup:
      question: "What category of numerals is used with plural-only nouns such as <latin>litterae</latin> and <latin>castra</latin> to express amounts greater than one?"
      answer: "DISTRIBUTIVES"
    boni:
      - question: "What is the Latin numeral for “twenty each”?"
        answer: "<latin>VĪCĒNĪ</latin>"
      - question: "What is the Latin numeral for “one hundred each”?"
        answer: "<latin>CENTĒNĪ</latin>"
  - tossup:
      question: "Who was appointed emperor in the east by Gratian in AD 379?"
      answer: "THEODOSIUS (I or GREAT)"
    boni:
      - question: "Whom did Theodosius replace?"
        answer: "VALENS"
      - question: "By what barbarian invaders had Valens been killed at the battle of Adrianople in AD 378?"
        answer: "(VISI)GOTHS (OCD3 says GOTHS)"
  - tossup:
      question: "According to Ovid, whose sisters were transformed into poplar trees?"
      answer: "PHAETHON’S"
    boni:
      - question: "Into what were the tears of Phaethon’s sisters transformed?"
        answer: "AMBER"
      - question: "Into what river did these ambers fall?"
        answer: "ERIDANUS / PO"
  - tossup:
      question: "Give a synonym of <latin>turba</latin>"
      answer: "<latin>CATERVA, GLOBUS, GREX, MULTITŪDŌ, VULGUS</latin>"
    boni:
      - question: "Give a synonym of <latin>dolor</latin>"
        answer: "<latin>LŪCTUS, MAESTITIA, MISERIA, TRĪSTITIA</latin>"
      - question: "Give a synonym of <latin>scūtum</latin>"
        answer: "<latin>CLIPEUS, PARMA</latin>"
  - tossup:
      question: "Which of Varro’s works was an exhaustive systematic treatise of the Latin language?"
      answer: "<title><latin>DE LINGUA LATINA</latin></title>"
    boni:
      - question: "What was the more common title of Varro’s <title><latin>Rerum Rusticarum Libri Tres</latin></title>?"
        answer: "<title><latin>DE RE RUSTICA</latin></title>"
      - question: "Varro also wrote treatises and commentaries dealing with the comedies of what earlier author?"
        answer: "PLAUTUS"
  - tossup:
      question: "Listen carefully to the following Latin passage, which I will read twice, and answer in English the question about it: <latin>Vidua quaedam gallīnam habuit, quae singula ova cotīdiē peperit. At rata, sī plūs cibī gallīnae dedisset, hanc bīna cotīdiē ova paritūram, ita fēcit. Sed gallīna, pinguis facta, nē singula quidem posteā parere valēbat.</latin>  What was the problem with the hen that the widow was trying to fix?"
      answer: "IT WAS ONLY PRODUCING ONE EGG A DAY"
    boni:
      - question: "What was the widow’s solution to the problem, and what did she expect the result to be?"
        answer: "TO GIVE THE HEN MORE FOOD. SHE THOUGHT THE HEN WOULD THEN PRODUCE TWO EGGS A DAY"
      - question: "What was the result?"
        answer: "THE HEN (BECAME FAT) AND NO LONGER PRODUCED EGGS"
