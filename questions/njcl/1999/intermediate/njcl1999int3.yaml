tournament: "NJCL Certamen"
year: 1999
division: "Intermediate"
round: "Round 3"
questions:
  - tossup:
      question: "Whom did Metellus Pius, Marcus Crassus, and Gnaeus Pompey help to capture Rome?"
      answer: "(L. CORNELIUS) SULLA (FELIX)"
    boni:
      - question: "What consul had rifled the temples of Rome in order to fund armies to fight Sulla and his colleagues?"
        answer: "(CN. PAPIRIUS) CARBO"
      - question: "At what battle did Sulla destroy the last Marian army and its Samnite allies?"
        answer: "BATTLE OF THE COLLINE GATE"
  - tossup:
      question: "Which of the following, if any, <emphasis>is</emphasis> derived from a Latin adjective meaning “slow”: pestilent, benevolent, gent, relent, lentil?"
      answer: "RELENT"
    boni:
      - question: "Which of the following, if any, <emphasis>is</emphasis> derived from a Latin verb meaning “mix”: melee, fiancee, convey, clay, parlay?"
        answer: "MELEE"
      - question: "Which of the following, if any, <emphasis>is</emphasis> derived from a Latin noun meaning “key”: chef, clef, deaf, deft, cleft?"
        answer: "CLEF"
  - tossup:
      question: "Translate: <latin>Dūcēs lēgātōs mittunt quī auxilium petant.</latin>"
      answer: "THE LEADERS ARE SENDING ENVOYS TO SEEK AID / WHO ARE TO SEEK AID"
    boni:
      - question: "Translate: <latin>Dūcēs sēnsērunt quid hostēs factūrī essent.</latin>"
        answer: "THE LEADERS PERCEIVED WHAT THE ENEMY WAS / WERE ABOUT TO DO"
      - question: "Translate: <latin>Hoc faciunt quō tūtiōrēs sint.</latin>"
        answer: "THEY ARE DOING THIS SO THAT THEY MAY BE SAFER"
  - tossup:
      question: "In Homer’s <title>Odyssey</title>, who tells Telemachus that Odysseus is alive but detained on the island of Calypso?"
      answer: "MENELAUS"
    boni:
      - question: "Who had told Menelaus this news about Odysseus?"
        answer: "PROTEUS"
      - question: "Who drugged Telemachus during his visit to Sparta so that he could forget his sorrows for one day?"
        answer: "HELEN"
  - tossup:
      question: "What son of Hermes was the herald of the Argonauts?"
      answer: "AETHALIDES"
    boni:
      - question: "With what gift did Hermes endow his son?"
        answer: "A MEMORY SO UNFAILING THAT IT DIDN’T DESERT HIM EVEN IN HADES"
      - question: "Aethalides spent only a part of time after death in the Underworld, for his soul inhabited a new body from time to time. In what philosopher’s body did his soul turn up eventually?"
        answer: "PYTHAGORAS"
  - tossup:
      question: "For what purpose did Roman bakers use a <latin>mola</latin>?"
      answer: "TO GRIND GRAIN INTO FLOUR (PASS OUT THE VISUAL..)"
    boni:
      - question: "Please look at the diagram of a cross-section of a <latin>mola</latin> or mill. What is the Latin name of the part of the mill labeled with the letter “A”?"
        answer: "<latin>MĒTA</latin>"
      - question: "What is the Latin name of the part of the mill labeled with the letter “E”?"
        answer: "<latin>CATILLUS</latin>"
  - tossup:
      question: "Listen carefully to the following passage, which I will read twice, and answer IN ENGLISH the question about it: <latin>Vulpēs vīdit leōnem rētibus captum, et stāns prope, derīsit eum insolenter. Leō, autem, “Nōn tū,” inquit, “mē dērīdēs, sed malum quod in mē incidit.”</latin> What was the misfortune that had befallen the lion?"
      answer: "<emphasis>HE HAD BECOME TRAPPED</emphasis> IN NETS / IN A NET"
    boni:
      - question: "What did the fox do when he saw the lion?"
        answer: "(HE STOOD NEARBY) AND MADE FUN OF THE LION"
      - question: "What did the lion tell the fox?"
        answer: "“YOU ARE NOT LAUGHING AT ME, BUT THE MISFORTUNE THAT HAS BEFALLEN ME.”"
  - tossup:
      question: "Differentiate in meaning between <latin>pariō</latin> and <latin>pereō</latin>"
      answer: "<latin>PARIŌ</latin> – BRING FORTH, BEGET, PRODUCE, PROCURE <latin>PEREŌ</latin> – DISAPPEAR, DIE"
    boni:
      - question: "Differentiate in meaning between the nouns <latin>sōlum</latin> and <latin>solea</latin>"
        answer: "<latin>SŌLUM</latin> – GROUND <latin>SOLEA</latin> – SANDAL"
      - question: "Differentiate in meaning between the nouns <latin>mōtus</latin> and <latin>metus</latin>"
        answer: "<latin>MŌTUS</latin> – MOVEMENT <latin>METUS</latin> – FEAR"
  - tossup:
      question: "What use of the dative case is found in the following: <latin>Maximā cum fortitūdine nōbīs est pugnandum</latin>?"
      answer: "AGENCY"
    boni:
      - question: "Translate that line into English"
        answer: "WE MUST FIGHT WITH THE GREATEST COURAGE / BRAVERY"
      - question: "The Ablative of Agent with <latin>ab</latin> is sometimes used with the Passive Periphrastic construction. Name one circumstance when this might be preferred"
        answer: "FOR THE SAKE OF CLARITY (AMBIGUITY) / FOR EMPHASIS / STRONGER EXPRESSION / IF THE VERB ALREADY TAKES A DATIVE OBJECT / THERE IS ALREADY ANOTHER DATIVE IN THE SENTENCE"
  - tossup:
      question: "Which Roman king built the first Senate House?"
      answer: "(TULLUS) HOSTILIUS"
    boni:
      - question: "What is the Latin name for this building?"
        answer: "CURIA HOSTILIA"
      - question: "Hostilius incorporated into Rome the citizens of what conquered and destroyed town?"
        answer: "ALBA LONGA"
  - tossup:
      question: "Who was advised by both Cadmus and Teiresias to honor Dionysus as a god?"
      answer: "PENTHEUS"
    boni:
      - question: "How does Pentheus disguise himself in order to spy on the revels of Dionysus’ followers?"
        answer: "AS A WOMAN"
      - question: "How did Pentheus die?"
        answer: "HE WAS TORN APART BY THE FOLLOWERS OF DIONYSUS / BACCHAE / BACCHANALS / MAENADS (he was torn apart by HIS MOTHER & AUNTS [AUTONOË, AGAVE, INO])"
  - tossup:
      question: "From what Latin noun with what meaning is “proletariat” derived?"
      answer: "<latin>PRŌLĒS</latin> – OFFSPRING, GENERATION"
    boni:
      - question: "From what Latin noun with what meaning is “recrimination” derived?"
        answer: "<latin>CRĪMEN</latin> – CHARGE, ACCUSATION, MISDEED, CRIME"
      - question: "From what two Latin nouns with what meanings is “cormorant” derived?"
        answer: "<latin>CORVUS</latin> – CROW, <latin>MARE</latin> – SEA"
  - tossup:
      question: "What was the family name of the emperor who was commonly known as Elagabalus?"
      answer: "(VARIUS) BASSIANUS (AVITUS)"
    boni:
      - question: "Who did his mother claim was his real father?"
        answer: "CARACALLA"
      - question: "Who was responsible for Elagabalus’ murder and the accession of his cousin Severus Alexander?"
        answer: "JULIA MAESA (HIS GRANDMOTHER)"
  - tossup:
      question: "What use of the subjunctive is found in the following sentence: <latin>Accidit ut lūna plēna esset?</latin>"
      answer: "SUBSTANTIVE CLAUSE OF RESULT / SUBSTANTIVE NOUN CLAUSE"
    boni:
      - question: "What use of the subjunctive is found in the following sentence: <latin>Caesar dīxit sē, postquam hostēs fūsī essent, castra mūnītūrum esse</latin>"
        answer: "SUBORDINATE CLAUSE IN INDIRECT DISCOURSE"
      - question: "What use of the subjunctive is found in the following sentence: <latin>Omnēs cīvēs metuēbant nē urbs ab hostibus expugnārētur.</latin>"
        answer: "FEARING / SUBSTANTIVE CLAUSE OF PURPOSE"
  - tossup:
      question: "What Greek goddess had the epithets “Ergane” and “Protogeneia”?"
      answer: "ATHENA"
    boni:
      - question: "What does the epithet “Ergane” mean?"
        answer: "WORKER"
      - question: "What epithet of Athena means “Champion or Defender”?"
        answer: "PROMACHUS"
  - tossup:
      question: "Make the phrase <latin>Exercitus Rōmānus</latin> ablative singular"
      answer: "<latin>EXERCITŪ RŌMĀNŌ</latin>"
    boni:
      - question: "Change <latin>Exercitū Rōmānō</latin> to the genitive"
        answer: "<latin>EXERCITŪS RŌMĀNĪ</latin>"
      - question: "Change <latin>Exercitūs Rōmānī</latin> to the plural"
        answer: "<latin>EXERCITUUM RŌMĀNŌRUM</latin>"
  - tossup:
      question: "Who purified Heracles of the murders of his children, his nephews, and his wife Megara?"
      answer: "(KING) THESPIUS"
    boni:
      - question: "According to Apollodorus, on what earlier occasion had Heracles met King Thespius?"
        answer: "ON HIS WAY TO KILL THE LION OF MT. CITHAERON / THESPAIN LION"
      - question: "According to some sources, how many daughters of King Thespius <emphasis>had the chance</emphasis> to entertain Heracles in bed?"
        answer: "50 (49 PERFORMED THE SERVICE, ONE DECLINED)"
  - tossup:
      question: "Give the Latin motto of Florida State University"
      answer: "<latin>VĪRĒS, ARTĒS, MŌRĒS</latin>"
    boni:
      - question: "Translate the motto of the North Carolina, “<latin>Esse Quam Vidērī</latin>.”"
        answer: "TO BE RATHER THAN TO SEEM / TO BE SEEN"
      - question: "Translate the motto of Boston, “<latin>Sīcut Patribus, Sit Deus Nōbīs</latin>.”"
        answer: "JUST AS TO (OUR) FATHERS, MAY GOD BE TO US"
  - tossup:
      question: "At the end of the Julio-Claudian dynasty, what city was the capital of the province of Bithynia?"
      answer: "NICOMEDIA"
    boni:
      - question: "What city was the capital of Syria?"
        answer: "ANTIOCH(IA)"
      - question: "What city was the capital of Lusitania?"
        answer: "EMERITA AUGUSTA"
  - tossup:
      question: "Give all the active participles for the verb <latin>auferō</latin>"
      answer: "<latin>AUFERĒNS, ABLATŪRUS (-A, -UM)</latin>"
    boni:
      - question: "Give all the participles for the verb <latin>queror</latin>"
        answer: "<latin>QUERĒNS, QUESTUS (-A, -UM), QUESTŪRUS (-A, -UM),</latin>"
      - question: "<latin>QUERENDUS (-A, -UM)</latin>  Give all the participles for the verb <latin>rīdeō</latin>"
        answer: "<latin>RIDĒNS, RĪSUS (-A, -UM), RĪSŪRUS (-A, -UM), RĪDENDUS (-A, -UM)</latin>"
