tournament: "NJCL Certamen"
year: 1999
division: "Novice"
round: "Round 2"
questions:
  - tossup:
      question: "What nephew of Brontes, Steropes, and Arges eventually became the king of the Greek gods?"
      answer: "ZEUS"
    boni:
      - question: "How did the three Cyclopes repay Zeus for releasing them from Tartarus?"
        answer: "THEY FORGED HIS THUNDERBOLT(S)"
      - question: "Who had advised Zeus about releasing the Cyclopes and the Hecatoncheires?"
        answer: "GE / GAIA / GAEA / (MOTHER) EARTH"
  - tossup:
      question: "Give a synonym of <latin>recumbō</latin>"
      answer: "<latin>LATEŌ, RECUBŌ, ACCUMBŌ, ACCUBŌ, IACEŌ, RECLĪNŌ</latin>"
    boni:
      - question: "Give a synonym of <latin>bibō</latin>"
        answer: "<latin>HAURIŌ, PŌTŌ</latin>"
      - question: "Give a synonym of <latin>excēdō</latin>"
        answer: "<latin>DISCĒDŌ, EXEŌ, CEDŌ, (AB)EŌ, EGREDIOR</latin>"
  - tossup:
      question: "Which Roman emperor called himself <latin>Hercules Romanus</latin>?"
      answer: "(L. AURELIUS) COMMODUS"
    boni:
      - question: "Who was the father of Commodus?"
        answer: "MARCUS AURELIUS"
      - question: "After Commodus was strangled in a palace conspiracy, what action did the Senate take against him?"
        answer: "<latin>DAMNATIO MEMORIAE</latin> / ERASED MEMORY OF HIM (& NULLIFIED HIS ACTS)"
  - tossup:
      question: "What is the meaning of the Latin noun at the root of “courage”?"
      answer: "HEART"
    boni:
      - question: "What is the meaning of the Latin noun at the root of “coronation”?"
        answer: "CROWN, WREATH"
      - question: "What is the meaning of the Latin noun at the root of “corporation”?"
        answer: "BODY, ENTITY"
  - tossup:
      question: "Say in Latin: nineteen"
      answer: "<latin>UNDĒVĪGINTĪ</latin>"
    boni:
      - question: "Say in Latin: twenty-five"
        answer: "<latin>VĪGINTĪ (ET) QUĪNQUE</latin>"
      - question: "or <latin>QUINQUE</latin> <emphasis><latin>ET</latin></emphasis> <latin>VĪGINTĪ</latin> Say in Latin: twenty women"
        answer: "<latin>VĪGINTĪ FĒMINAE / MULIERĒS</latin>"
  - tossup:
      question: "In classical mythology, who was transformed into an eight-legged creature that spun thread from her belly?"
      answer: "ARACHNE"
    boni:
      - question: "Who was her father?"
        answer: "IDMON"
      - question: "What deity transformed Arachne?"
        answer: "(PALLAS) ATHENA / MINERVA"
  - tossup:
      question: "Using a preposition, say in Latin “without food”"
      answer: "<latin>SINE CIBŌ / VICTŪ</latin>"
    boni:
      - question: "Using a preposition, say in Latin “on behalf of Marcus.”"
        answer: "<latin>PRŌ MARCŌ</latin>"
      - question: "Using a preposition, say in Latin “to the foot of the mountain.”"
        answer: "<latin>SUB MONTEM</latin>"
  - tossup:
      question: "In what room of a Roman house was a cistern for rain water commonly built into the floor?"
      answer: "<latin>ATRIUM</latin>"
    boni:
      - question: "What usually separated the <latin>atrium</latin> from the <latin>tablinum</latin>?"
        answer: "CURTAIN (<latin>VELUM</latin>), FOLDING DOOR(S), WOOODEN PANELS,"
      - question: "or SCREEN What area of the house could be entered from the door in the back wall of the <latin>tablinum</latin>?"
        answer: "<latin>PERISTYLIUM</latin> / PERISTYLE"
  - tossup:
      question: "Which of the following is the name of the glands next to the eyes that cause tears: sessile, sacral, annular, convivial, lacrimal?"
      answer: "LACRIMAL (PASS OUT THE VISUAL)"
    boni:
      - question: "Which illustration contains a picture of an object that is “reniform”?"
        answer: "“D”"
      - question: "Which illustration contains a picture of an object that is “cinquefoil” (singk' foil')?"
        answer: "“F”"
  - tossup:
      question: "Make the phrase <latin>nostra lībertās</latin> accusative singular"
      answer: "<latin>NOSTRAM LĪBERTĀTEM</latin>"
    boni:
      - question: "Change <latin>nostram lībertātem</latin> to the plural"
        answer: "<latin>NOSTRĀS LĪBERTĀTĒS</latin>"
      - question: "Change <latin>nostrās lībertātēs</latin> to the ablative"
        answer: "<latin>NOSTRĪS LĪBERTĀTIBUS</latin>"
  - tossup:
      question: "What Roman statesman in the first half of the 2nd century BC considered the adulation of everything Greek as a decadent fad?"
      answer: "(M. PORCIUS) CATO THE ELDER / CENSOR"
    boni:
      - question: "From what office did he campaign against the growth of luxury?"
        answer: "CENSOR(SHIP)"
      - question: "On what two famous brothers did he instigate attacks?"
        answer: "(P. CORNELIUS) SCIPIO AFRICANUS & (L. CORNELIUS) SCIPIO ASIATICUS"
  - tossup:
      question: "What leader of the Trojan refugees was the ancestor of the first emperors of Rome?"
      answer: "AENEAS"
    boni:
      - question: "According to Vergil, who were the parents of Aeneas?"
        answer: "ANCHISES & VENUS"
      - question: "Why was Anchises crippled by the thunderbolt of Jupiter?"
        answer: "HE BOASTED THAT HE HAD SLEPT WITH A GODDESS"
  - tossup:
      question: "Differentiate in meaning between <latin>virga</latin> and <latin>virgō</latin>."
      answer: "<latin>VIRGA</latin> - STICK, ROD, WAND, TWIG, SWITCH <latin>VIRGŌ</latin> - MAIDEN, VIRGIN"
    boni:
      - question: "Differentiate in meaning between <latin>aestās</latin> and <latin>aestus</latin>."
        answer: "<latin>AESTĀS</latin> - SUMMER <latin>AESTUS</latin> - HEAT, SUMMER, TIDE, SURGE, TUMULT"
      - question: "Differentiate in meaning between <latin>simul</latin> and <latin>simulō</latin>."
        answer: "<latin>SIMUL</latin> - TOGETHER, AT THE SAME TIME, AS SOON AS <latin>SIMULŌ</latin> - PRETEND, SIMULATE, LOOK LIKE"
  - tossup:
      question: "What mortal of outstanding courage and superhuman strength was often called the “Averter of Evil” in classical mythology?"
      answer: "HERACLES / HERCULES"
    boni:
      - question: "Who was the divine father of Heracles?"
        answer: "ZEUS"
      - question: "What mortal was the adoptive father of Heracles?"
        answer: "AMPHITRYON"
  - tossup:
      question: "In whose honor did the Senate set up a golden shield in the Curia in 27 B.C.?"
      answer: "AUGUSTUS’ / OCTAVIAN’S"
    boni:
      - question: "What did Augustus return to the free disposal of the Senate and people in 27 B.C.?"
        answer: "THE STATE (CONTROL OF THE GOVERNMENT)"
      - question: "Augustus actually remained in control because he commanded the legions and three key provinces. Name one of those provinces"
        answer: "SPAIN, GAUL, & SYRIA (ALSO EGYPT)"
  - tossup:
      question: "What word would be used to introduce the following sentence into Latin: You do want to thank your parents for their generosity, don’t you?"
      answer: "<latin>NŌNNE</latin>"
    boni:
      - question: "Translate “to thank” into Latin"
        answer: "<latin>GRĀTIĀS AGERE</latin>"
      - question: "What case would be used to translate “parents” into Latin?"
        answer: "DATIVE"
  - tossup:
      question: "The abbreviation <latin>a.d.</latin> can mean more than one thing. What does the abbreviation <latin>a.d.</latin> mean when it stands for <latin>ante diem</latin>?"
      answer: "BEFORE THE DAY / THE DAY BEFORE"
    boni:
      - question: "What does the abbreviation <latin>A.D.</latin> mean when it stands for <latin>Annō Dominī</latin>?"
        answer: "IN THE YEAR OF (OUR) LORD"
      - question: "Classical Romans of course did not use the abbreviation <latin>A.D.</latin> for dates. They used <latin>A.U.C.</latin>, which stands for <latin>ab urbe conditā</latin>. What does this mean?"
        answer: "FROM THE FOUNDING OF THE CITY (i.e. Rome)"
  - tossup:
      question: "Listen carefully to the following Latin passage, which I will read twice, and answer IN ENGLISH the question about it: <latin>Marcus et Publius fratrēs sunt. Marcus, quī annōs quīndecim habet, est studiōsus et multa discit. Publius autem, quamquam senior, stultior est quod ignavissimus est.</latin>  Who is the older brother?"
      answer: "PUBLIUS"
    boni:
      - question: "Which of the brothers is more scholarly?"
        answer: "MARCUS"
      - question: "Why isn’t Publius as smart as his brother?"
        answer: "BECAUSE HE IS VERY LAZY / LAZIEST / LAZIER (*prompt if “LAZY” is given)"
  - tossup:
      question: "In the reign of Augustus, in what Roman province was the city of <latin>Carthago</latin>?"
      answer: "<latin>AFRICA</latin>"
    boni:
      - question: "In the reign of Augustus, in what Roman province was the city of <latin>Lugdunum</latin>?"
        answer: "<latin>(GALLIA) LUGDUNENSIS</latin> (*not TRANSALPINE GAUL)"
      - question: "In the reign of Augustus, in what Roman province was the city of <latin>Ephesus</latin>?"
        answer: "<latin>ASIA</latin>"
  - tossup:
      question: "What queen of Thebes married her own son?"
      answer: "JOCASTA / EPICASTA"
    boni:
      - question: "Who was her son?"
        answer: "OEDIPUS"
      - question: "Who was her first husband, the father of Oedipus?"
        answer: "LAIUS"
