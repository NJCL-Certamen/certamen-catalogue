tournament: "NJCL Certamen"
year: 2000
division: "Advanced"
round: "Extra Questions"
questions:
  - tossup:
      question: "Listen carefully to the following Latin passage, which I will read twice, and answer IN ENGLISH the question about it: <latin>Explōrātor optimus, Accipiter nōmine, ab diēbus ōtiōsīs revocātus, didicit imperātōrem opus quod fierī nōn possit dare velle. Vērō erat missiō impossibilis! Opus, sī Accipiter accipere optet, erat et invenīre et referre pestilentiam, Chimēram nōmine, et quoque eius remedium, Bellerophontem</latin>. From what was Hawk recalled?"
      answer: "DAYS OF LEISURE / VACATION"
    boni:
      - question: "What kind of task did the commander want to give him?"
        answer: "ONE THAT COULD NOT BE DONE / A “MISSION IMPOSSIBLE”"
      - question: "Under what condition was Hawk to find and bring back the plague and its cure?"
        answer: "IF HE SHOULD CHOOSE TO ACCEPT THE TASK"
  - tossup:
      question: "What is the meaning of the Greek noun at the root of the words “analogous” and “prologue”?"
      answer: "WORD, SPEECH, THOUGHT"
    boni:
      - question: "What derivative from the Greek noun logos is “the branch of zoology dealing with the study of fish”?"
        answer: "ICHTHYOLOGY"
      - question: "Other than logos, what is the meaning of the Greek noun root from which “anthology” is derived?"
        answer: "FLOWER"
  - tossup:
      question: "Differentiate in meaning between <latin>tamen</latin> and <latin>tamquam</latin>."
      answer: "<latin>TAMEN -</latin> NEVERTHELESS, YET, STILL, JUST THE SAME <latin>TAMQUAM</latin> -AS THOUGH, JUST AS"
    boni:
      - question: "Differentiate in meaning between <latin>uncus</latin> and <latin>unctus</latin>."
        answer: "<latin>UNCUS</latin> - HOOK(ED), BARBED, CROOKED, CLAMP <latin>UNCTUS</latin> - GREASY, RESINOUS, SUMPTUOUS, PERFUMED"
      - question: "Differentiate in meaning between <latin>quisquis</latin> and <latin>quīvīs</latin>."
        answer: "<latin>QUISQUIS</latin> - WHO(SO)EVER, EVERYONE (WHO), EACH <latin>QUĪVĪS</latin> - ANYONE AT ALL, ANYONE YOU PLEASE"
  - tossup:
      question: "For the verb <latin>canō</latin>, give the perfect active infinitive"
      answer: "<latin>CECINISSE</latin>"
    boni:
      - question: "Give the corresponding form for the verb <latin>pungō</latin>"
        answer: "<latin>PUPUGISSE / PEPUGISSE</latin>"
      - question: "Give the corresponding form for the verb <latin>pandō</latin>"
        answer: "<latin>PANDISSE</latin>"
  - tossup:
      question: "Why is there no preposition in the use of the ablative in the following sentence from Caesar: <latin>subsequēbātur omnibus cōpiīs</latin>?"
      answer: "BECAUSE <latin>CUM</latin> IS OFTEN OMITTED IN <emphasis>MILITARY</emphasis> PHRASES OF ACCOMPANIMENT"
    boni:
      - question: "What usage of the ablative is often used in place of ablative of agent in military phrases?"
        answer: "MEANS / INSTRUMENT"
      - question: "Under what circumstance is <latin>cum</latin> often omitted in the ablative of manner when the noun is not modified by an adjective?"
        answer: "IN POETRY / STOCK PHRASES THAT HAVE BECOME ADVERBS SUCH AS <latin>MODŌ, PACTŌ, RATIŌNE,</latin>"
  - tossup:
      question: "Make the phrase <latin>mythos Rōmānus</latin> accusative."
      answer: "<latin>MYTHON RŌMĀNUM</latin>"
    boni:
      - question: "Give the corresponding form for the phrase <latin>Aeneadēs clārus</latin>."
        answer: "<latin>AENEADĒN CLĀRUM</latin>"
      - question: "Give the corresponding form for the phrase <latin>hērōs fortis</latin>."
        answer: "<latin>HĒRŌA FORTEM</latin>"
  - tossup:
      question: "What Latin noun is shared by the abbreviations <latin>n.p.</latin> and <latin>n.n.</latin>?"
      answer: "<latin>NŌMEN</latin>"
    boni:
      - question: "For what Latin phrase with what meaning is <latin>n.n.</latin> an abbreviation?"
        answer: "<latin>NŌMEN NOVUM</latin> - NEW NAME"
      - question: "For what Latin phrase with what meaning is <latin>n.p.</latin> an abbreviation?"
        answer: "<latin>NŌMEN PROPRIUM</latin> - PROPER NAME"
  - tossup:
      question: "<latin>Quid significat: torvus?</latin>"
      answer: "FIERCE, GRIM<latin>, STERN</latin>"
    boni:
      - question: "Quid significat: raucus?"
        answer: "HOARSE, HARSH, RAUCOUS"
      - question: "<latin>Quid significat: pronus?</latin>"
        answer: "SLOPING FORWARD, EASY, FACING DOWN"
  - tossup:
      question: "Give the ultimate Latin verb root and its meaning from which we derive “circuit.”"
      answer: "<latin>EŌ, ĪRE</latin> - GO"
    boni:
      - question: "Give the ultimate Latin verb root and its meaning from which we derive “precise.”"
        answer: "<latin>CAEDŌ, CAEDERE</latin> - CUT"
      - question: "Give the ultimate Latin verb root and its meaning from which we derive “pretense.”"
        answer: "<latin>TENDŌ, TENDERE</latin> - STRETCH"
  - tossup:
      question: "Which of the following, if any, is <emphasis>not</emphasis> derived from the same Latin root as the others: salacious, somersault, desultory, salient, sallow?"
      answer: "SALLOW"
    boni:
      - question: "Which of the following, if any, is not derived from the same Latin root as the others: menu, dimension, mince, diminish, minute (mi - noot)?"
        answer: "DIMENSION"
      - question: "Which of the following, if any, is not derived from the same Latin root as the others: feisty, feign, fiction, figment, effigy?"
        answer: "FEISTY"
  - tossup:
      question: "Which of the following, if any, is <emphasis>not</emphasis> derived from the same Latin root as the others? decrepit, crevice, crest, discrepancy, crevasse CREST What is the Latin root of “crest?”"
      answer: "<latin>CRISTA</latin>"
    boni:
      - question: "What is the Latin root of the other words in the toss-up?"
        answer: "<latin>CREPŌ, CREPĀRE</latin>"
  - tossup:
      question: "What volatile nonmetallic liquid element belonging to the halogen family derives its name from a Greek adjective that means “stench”?"
      answer: "BROMINE"
    boni:
      - question: "What poisonous element belonging to the same chemical family derives its name from its violet color?"
        answer: "IODINE"
      - question: "What radioactive element from the same chemical family derives its name from a Greek adjective that means “unstable”?"
        answer: "ASTATINE <latin>HISTORY / GEOGRAPHY / LIFE</latin>"
  - tossup:
      question: "What is the name of the huge jars in which grape juice was fermented?"
      answer: "<latin>DOLIUM, DOLIA</latin>"
    boni:
      - question: "What is the name of the jars in which the fermented juice or wine was stored and matured?"
        answer: "<latin>AMPHORAE</latin>"
      - question: "What is a the Latin term for a drinking cup?"
        answer: "<latin>PŌCULUM</latin>"
  - tossup:
      question: "Which Roman republican magistrate was <emphasis>not</emphasis> subject to the <latin>intercessiō</latin> or the <latin>prōvocātiō</latin>?"
      answer: "DICTATOR ( not the <latin>Decemviri</latin> who were exempt only from the <latin>prōvocātiō</latin>)"
    boni:
      - question: "What was the <latin>intercessiō</latin>?"
        answer: "VETO (BY AN EQUAL OR SUPERIOR MAGISTRATE)"
      - question: "What was the <latin>prōvocātiō</latin>?"
        answer: "RIGHT OF APPEAL (TO THE PEOPLE AGAINST A MAGISTRATE’S VERDICT)"
  - tossup:
      question: "What king does tradition credit with building the first wall around Rome?"
      answer: "SERVIUS TULLIUS"
    boni:
      - question: "What emperor, prompted by barbarian invasions of Italy, began the building of a new wall in A.D. 271?"
        answer: "AURELIAN"
      - question: "Who doubled the height of the wall in A.D. 306-312?"
        answer: "MAXENTIUS"
  - tossup:
      question: "Who, after his victory at Baecula, was probably the first Roman commander to be hailed by his troops as <emphasis>imperator</emphasis>?"
      answer: "P. CORNELIUS SCIPIO ( LATER AFRICANUS)"
    boni:
      - question: "What Carthaginian general had Scipio defeated at Baecula?"
        answer: "HASDRUBAL ( HANNIBAL’S BROTHER)"
      - question: "What general did Scipio defeat at the Battle of Ilipa destroying the last Carthaginian field army in Spain?"
        answer: "HASDRUBAL (SON OF GISGO)"
  - tossup:
      question: "Where did Mithridates VI of Pontus fight his last battle against the Romans in 66 B.C.?"
      answer: "NICOPOLIS"
    boni:
      - question: "Who was the Roman commander at the battle?"
        answer: "POMPEY (CN. POMPEIUS MAGNUS)"
      - question: "What law had given Pompey the command against Mithridates?"
        answer: "LEX MANILIA"
  - tossup:
      question: "What emperor spent the last years of his reign at his lavish villa at Tibur?"
      answer: "HADRIAN"
    boni:
      - question: "Hadrian wanted Lucius Ceionius Commodus to succeed him as emperor. Who was Hadrian’s next choice after Lucius Ceionius Commodus?"
        answer: "(TITUS AURELIUS) ANTONINUS (PIUS)"
      - question: "Who was Antoninus Pius’ wife?"
        answer: "(ANNIA GALERIA) FAUSTINA"
  - tossup:
      question: "What emperor was repudiated by the Senate proclaiming Gordianus and his son of the same name as joint emperors?"
      answer: "MAXIMINUS THRAX"
    boni:
      - question: "For five points each: When the two Gordians died opposing Maximinus, which two of it’s own members did the Senate proclaim as the new emperors?"
        answer: "(M.) PUPIENUS (MAXIMUS)"
      - question: "and (D"
        answer: "CALVINUS) BALBINUS"
  - tossup:
      question: "Which of these is <emphasis>not</emphasis> a region of southern Italy: Lucania, Apulia, Ligura, or Calabria?"
      answer: "LIGURA"
    boni:
      - question: "Which of these is <emphasis>not</emphasis> a region in Asia Minor: Pannonia, Paphlagonia, Pontus, or Pisidia?"
        answer: "PANNONIA"
      - question: "Which of these is <emphasis>not</emphasis> a region in Greece: Achaea, Aeolis, Arcadia, or Attica?"
        answer: "AEOLIS <latin>LITERATURE</latin>"
  - tossup:
      question: "What former Greek slave founded the first poetic guild in Rome?"
      answer: "LIVIUS ANDRONICUS"
    boni:
      - question: "Why did Livius Andronicus translate Homer’s <title>Odyssey</title> into Latin?"
        answer: "BECAUSE HE NEEDED TEXTBOOKS FOR THE CHILDREN THAT HE WAS TEACHING"
      - question: "What later author credits Livius Andronicus with introducing plot into the plotless Roman stage performances?"
        answer: "TITUS LIVIUS / LIVY"
  - tossup:
      question: "Which of Cicero’s Catilinarian Orations was delivered at the Temple of Concord?"
      answer: "THE FOURTH CATILINARIAN"
    boni:
      - question: "Which of Cicero’s Catilinarian Orations were delivered from the <title>rostra</title> in the Forum?"
        answer: "SECOND AND THIRD CATILIANRIAN"
      - question: "Where and when did Cicero deliver his First Catilinarian Oration?"
        answer: "TEMPLE OF JUPITER STATOR ON NOVEMBER"
  - tossup:
      question: "Which of the following authors, if any, were <emphasis>not</emphasis> in the literary circle of Maecenas: Propertius, Vergil, SULPICIA, OVID, TIBULLUS How many books of elegies did Tibullus write?"
      answer: "THREE"
    boni:
      - question: "What woman was addressed by Tibullus in his first book of elegies?"
        answer: "DELIA / PLANIA"
  - tossup:
      question: "Who wrote a bitter denunciation of women in Book 2 of his satires?"
      answer: "(DECIMUS IUNIUS) <emphasis>JUVENALIS</emphasis>"
    boni:
      - question: "In which of his satires does Juvenal compliment Hadrian as a friend of literature?"
        answer: "#7"
      - question: "In which of his satires would we find the famous quote <latin>“mens sāna in corpore sānō”</latin>?"
        answer: "#10"
  - tossup:
      question: "Who said the following quote from Vergil’s <title>Aeneid</title>: <latin>“Crēditis āvectōs hostīs? Aut ūlla putātis  dōna carēre dolīs Danaum? Sīc nōtus Ulixēs?”</latin>"
      answer: "LAOCOON"
    boni:
      - question: "In which book of Vergil’s <title>Aeneid</title> can we find this quote?"
        answer: "BOOK II"
      - question: "Who asks the following questions in Vergil’s <title>Aeneid</title>: <latin>“Quō mōlem hanc immānis equī statuēre? Quis auctor?  Quidve petunt? Quae relligiō? Aut quae māchina bellī?”</latin>"
        answer: "PRIAM"
  - tossup:
      question: "Who wrote in the mid-second century A.D. a 24-book treatise in Greek on Rome’s wars, from the beginning to the Flavian era?"
      answer: "APPIAN"
    boni:
      - question: "Where was Appian a lawyer?"
        answer: "ROME"
      - question: "What city was his birthplace?"
        answer: "ALEXANDRIA"
  - tossup:
      question: "Who accused Peleus of attempting to seduce her?"
      answer: "ASTYDAMIA / HIPPOLYTE"
    boni:
      - question: "Who was the husband of Astydamia?"
        answer: "ACASTUS"
      - question: "In what city did Acastus and Astydamia reign as king and queen?"
        answer: "IOLCUS"
  - tossup:
      question: "Who was the unfaithful wife of Agamemnon?"
      answer: "CLYTEMNESTRA"
    boni:
      - question: "Who was the unfaithful wife of Idomeneus?"
        answer: "MEDA"
      - question: "Who was the unfaithful wife of Diomedes?"
        answer: "AEGIALE"
  - tossup:
      question: "What Fury was responsible for turning Amata and Turnus against Aeneas?"
      answer: "ALECTO"
    boni:
      - question: "Who sent Alecto to stir things up?"
        answer: "JUNO / HERA"
      - question: "Name the other two Furies"
        answer: "TISIPHONE & MEGARA"
  - tossup:
      question: "According to most versions, who is the only son of Zeus and his regular consort Hera?"
      answer: "ARES"
    boni:
      - question: "Though Ares had no wife, he engaged in frequent liaisons, especially with Aphrodite. Who is the daughter of Ares and Aphrodite?"
        answer: "HARMONIA"
      - question: "To whom did Ares give Harmonia in marriage?"
        answer: "CADMUS"
  - tossup:
      question: "What musician entertains a crwod including Odysseus and the crowd with a song about the love affair of Ares and Aphrodite?"
      answer: "DEMODOCUS"
    boni:
      - question: "In whose court did this take place?"
        answer: "ALCINOÜS’"
      - question: "What son of Alcinoüs asked Odysseus to join the Phaeacian games?"
        answer: "LAODAMAS"
