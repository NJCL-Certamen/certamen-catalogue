tournament: "NJCL Certamen"
year: 2000
division: "Advanced"
round: "Finals"
questions:
  - tossup:
      question: "Differentiate in meaning between <latin>nīdus</latin> and <latin>nōdus</latin>."
      answer: "<latin>NĪDUS</latin> - NEST; <latin>NŌDUS</latin> - KNOT"
    boni:
      - question: "Differentiate in meaning between <latin>lacus</latin> and <latin>lūcus</latin>."
        answer: "<latin>LACUS</latin> - BASIN, TUB, LAKE, VAT, SINK, POND, RESERVOIR, DEN, CAVE, PLACE OF THE DEAD; <latin>LŪCUS</latin> - (SACRED) GROVE, WOOD, THICKET OF TREES"
      - question: "Differentiate in meaning between <latin>vitta</latin> and <latin>vītis</latin>."
        answer: "<latin>VITTA</latin> - FILLET, (HEAD)BAND, RIBBON, BAND, STRAP; <latin>VĪTIS</latin> - CENTURION’S STAFF, VINE, GRAPEVINE, VINE BRANCH, OFFICE OF CENTURION"
  - tossup:
      question: "What is the Latin term for the mixture of salt and barley flour that was sprinkled on the head of a animal about to be sacrificed?"
      answer: "<latin>MOLA SALSA</latin>"
    boni:
      - question: "Who prepared the <latin>mola salsa</latin>?"
        answer: "VESTAL VIRGINS"
      - question: "What part of the animal was sprinkled with wine and mola salsa and burnt on the altar?"
        answer: "<latin>EXTA</latin> / ENTRAILS / INTESTINES"
  - tossup:
      question: "What historian was the author of a work entitled <title><latin>De Catilinae Coniuratione</latin></title>?"
      answer: "(C.) <emphasis>SALLUST</emphasis>IUS (CRISPUS)"
    boni:
      - question: "What extremely moralistic Greek historian did Sallust aspire to emulate?"
        answer: "THUCYDIDES"
      - question: "What is the title of Sallust’s greatest work, which was incomplete because Sallust died before he completed it?"
        answer: "<title><latin>HISTORIAE</latin> / HISTORIES</title>"
  - tossup:
      question: "Using the adverb <latin>abhinc</latin>, say in Latin “Would that the gladiator had come five years ago”"
      answer: "<latin>UTINAM GLADIĀTOR QUĪNQUE ANNŌS/ANNĪS ABHINC VĒNISSET</latin>"
    boni:
      - question: "Using the preposition <latin>penes</latin>, say in Latin “We know that the gladiator was under the control of the gladiator trainer”"
        answer: "<latin>SCĪMUS GLADIĀTŌREM LANISTAM PENES FUISSE</latin>"
      - question: "Using the preposition <latin>cōram</latin>, say in Latin “Everyone saw the gladiator fighting in the presence of the emperor”"
        answer: "<latin>OMNĒS VĪDĒRUNT GLADIĀTŌREM CŌRAM IMPERĀTŌRE PUGNANTEM</latin>"
  - tossup:
      question: "What unfortunate mortal was seduced by both Hermes and Apollo on the same day?"
      answer: "CHIONE"
    boni:
      - question: "Name the brother of Philammon who was the son of Hermes and Chione"
        answer: "AUTOLYCUS"
      - question: "Who was the father of Chione?"
        answer: "DAEDALION"
  - tossup:
      question: "What Jewish rebel leader captured Jerusalem and slaughtered an entire Roman legion in AD 132?"
      answer: "(SIMON) BAR-COSIBA(R) / COCHBAR / KOKHBA"
    boni:
      - question: "What commander did the emperor Hadrian send against the rebels?"
        answer: "JULIUS SEVERUS"
      - question: "After the rebellion was crushed and the Jewish population dispersed, what was the province of Judea renamed?"
        answer: "SYRIA PALESTINA"
  - tossup:
      question: "Translate the verb form <latin>audīsse</latin>?"
      answer: "TO HAVE HEARD"
    boni:
      - question: "Translate the verb form <latin>dīxtī</latin>?"
        answer: "YOU HAVE SAID"
      - question: "Translate the verb form <latin>faxō</latin>?"
        answer: "I SHALL HAVE DONE / MADE"
  - tossup:
      question: "What Roman author’s collection of biographies of writers was subdivided by genres – poets, orators, historians, philosophers, and grammarians?"
      answer: "(C.) SUETONIUS (TRANQUILLUS)"
    boni:
      - question: "Give the Latin title of the only section of this collection of biographies that has survived to us?"
        answer: "<title><latin>DE GRAMMATICIS ET RHETORIBUS</latin></title>"
      - question: "Give the Latin title of the other work by Suetonius that has survived to us intact, except for the introductory chapters of the first biography and the dedication of the work to Septicius Clarus?"
        answer: "<title><latin>DE VITA CAESARUM</latin></title>"
  - tossup:
      question: "According to Homer’s <title>Iliad</title>, which of Priam’s sons, was captured by Achilles twice and was killed during their second encounter twelve days later?"
      answer: "LYCAON"
    boni:
      - question: "What was Lycaon doing when he was captured by Achilles?"
        answer: "HE WAS CUTTING FIG SHOOTS (or GATHERING MATERIAL) TO MAKE RIMS / WHEELS FOR HIS CHARIOT"
      - question: "To what king of Lemnos was Lycaon sold as a slave?"
        answer: "EUNEÜS"
  - tossup:
      question: "Listen carefully to the following passage, which I will read twice, then answer in LATIN the question about it: <latin>Caesar urbem ingressus dictātōrem sē fēcit. Inde cum Hispāniās petīvisset, prope Mundam Pompēiī exercitūs validissimōs et fortissimōs cum tribus ducibus, Lūciō Afrāniō, Marcō Petrēiō, Marcō Varrōne, superāvit. Inde in Graeciam trānsiit et adversum Pompēium dīmicāvit.  Quis Caesarem dictātōrem creāvit?</latin>"
      answer: "<latin>CAESAR (IPSE)</latin>"
    boni:
      - question: "<latin>In quō locō erat Caesar ubi validissimōs exercitūs Pompēiī superāvit?</latin>"
        answer: "<latin>PROPE / AD / APUD MUNDAM / IN HISPĀNIĀ</latin> (do not accept <latin>MUNDAE</latin> since he was “near” Munda in the passage, not “at” Munda)"
  - tossup:
      question: "(PASS OUT THE VISUALS) DO NOT OPEN THE VISUALS BEFORE YOU ARE PROMPTED TO DO SO. (wait for all the visuals to be ready and in place) YOU MAY NOW OPEN YOUR VISUAL. YOU NOW HAVE 15 SECONDS TO EXAMINE IT. (wait 15 seconds) Where was the author of passage “D” born?"
      answer: "ROME"
    boni:
      - question: "How many of the remaining passages were written by authors who were born in Italy?"
        answer: "FOUR"
      - question: "In what literary work did the author of passage “F” praise the eloquence of the author of passage “D”?"
        answer: "<title>BRUTUS</title> (BY CICERO)"
  - tossup:
      question: "Who was the first foreign born man to be elected consul?"
      answer: "(L. CORNELIUS) BALBUS"
    boni:
      - question: "Who had secured citizenship for Balbus, a native of Gades?"
        answer: "POMPEY (CN. POMPEIUS MAGNUS)"
      - question: "Who defended Balbus when Balbus’ enemies contested the validity of his citizenship?"
        answer: "(M. TULLIUS) CICERO"
  - tossup:
      question: "What use of the infinitive is found in the following sentence: <latin>pars cēdere, aliī insequī; neque sīgna neque ōrdinēs observāre</latin>?"
      answer: "HISTORICAL"
    boni:
      - question: "What use of the infinitive is found in the following sentence: <latin>mēne inceptō dēsistere victam nec posse Ītaliā Teucrōrum āvertere rēgem</latin>?"
        answer: "EXCLAMATORY"
      - question: "What use of the infinitive is found in the following sentence: <latin>fīlius intrō iit vidēre quid agat</latin>?"
        answer: "INFINITIVE OF PURPOSE"
  - tossup:
      question: "What Lapith chieftain was born as a girl, but was transformed into a man by Neptune?"
      answer: "CAENEUS"
    boni:
      - question: "How did Caeneus meet his demise?"
        answer: "THE CENTAURS POUNDED HIM INTO THE GROUND WITH ROCKS OR TREES"
      - question: "What special ability did Neptune bestow on Caeneus?"
        answer: "INVULNERABILITY TO WEAPONS"
  - tossup:
      question: "What Latin noun with what meaning lies at the root of “vernacular”?"
      answer: "<latin>VERNA</latin> - SLAVE (BORN IN A MASTER’S HOUSE), NATIVE"
    boni:
      - question: "What Latin noun with what meaning lies at the root of “vermicular”?"
        answer: "<latin>VERMIS</latin> - WORM"
      - question: "What Latin noun with what meaning lies at the root of “vascular”?"
        answer: "<latin>VĀS</latin> - VESSEL, DISH, UTENSIL, IMPLEMENT, BAGGAGE"
  - tossup:
      question: "What governor of Syria was encouraged by a mob of Romans in the Circus Maximus to seize the imperial throne from Didius Iulianus?"
      answer: "PESCENNIUS NIGER"
    boni:
      - question: "What commander on Danube was proclaimed emperor by his troops?"
        answer: "(L.) SEPTIMIUS SEVERUS"
      - question: "Having been defeated by Severus, to what enemy of Rome did Niger attempt to flee?"
        answer: "PARTHIA"
  - tossup:
      question: "For the adjective <latin>malevola</latin>, give the comparative and superlative forms"
      answer: "<latin>MALEVOLENTIOR & MALEVOLENTISSIMA</latin>"
    boni:
      - question: "Give the comparative and superlative forms for the adjective <latin>māgnificum</latin>"
        answer: "<latin>MĀGNIFICENTIUS & MĀGNIFICENTISSIMUM</latin>"
      - question: "Give the two possible superlative forms for the adjective <latin>pius</latin>"
        answer: "<latin>PIISSIMUS & PIENTISSIMUS</latin>"
  - tossup:
      question: "Who was the father of Alcinoüs, the king of the Phaeacians?"
      answer: "NAUSITHOÜS"
    boni:
      - question: "Why did Nausithoüs lead the Phaeacians away from their home land in Hypereia to establish a new home on the island of Scherië?"
        answer: "BECAUSE THE PHAEACIANS WERE BEING HARASSED BY THEIR NEIGHBORS THE CYCLOPES"
      - question: "The island of Scherië is sacred to what nurse of Dionysus?"
        answer: "MACRIS"
  - tossup:
      question: "What future historian came to Italy as one of the thousand Achaean League hostages taken to Italy after the battle of Pydna in 168 BC?"
      answer: "POLYBIUS / POLYBIOS"
    boni:
      - question: "With what Roman did he develop an enduring friendship allowing him a unique insight into Rome’s rise to power?"
        answer: "(P. CORNELIUS) SCIPIO AEMILIANUS / NUMANTIUS / AFRICANUS MINOR"
      - question: "With what war does Polybius’ history begin?"
        answer: "SECOND PUNIC"
  - tossup:
      question: "How should one translate the verb form <latin>amābō</latin> into English for the following sentence: <latin>amābō, Libane, iam sat est</latin>"
      answer: "PLEASE"
    boni:
      - question: "What other single Latin word is used to say “please”?"
        answer: "<latin>SŌDĒS</latin>"
      - question: "Of what is <latin>sōdēs</latin> a contraction?"
        answer: "<latin>SĪ AUDĒS</latin>"
