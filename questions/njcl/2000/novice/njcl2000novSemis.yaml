tournament: "NJCL Certamen"
year: 2000
division: "Novice"
round: "Semifinals"
questions:
  - tossup:
      question: "What goddess brought famine to the earth for an entire year because her daughter had been kidnapped?"
      answer: "DEMETER / CERES"
    boni:
      - question: "Who had kidnapped Persephone?"
        answer: "HADES / AÏDONEUS"
      - question: "Who was sent to the Underworld by Zeus to fetch Persephone?"
        answer: "HERMES"
  - tossup:
      question: "Which of the following, if any, <emphasis>is</emphasis> a synonym of <latin>fēlīx: aeternus, perītus, alius, vicīnus, beātus</latin>?"
      answer: "<latin>BEĀTUS</latin>"
    boni:
      - question: "Which of the following, if any, <emphasis>is</emphasis> a synonym of <latin>nōtus: ingēns, ēgregius, tūtus, imprōbus, grātus</latin>?"
        answer: "<latin>ĒGREGIUS</latin>"
  - tossup:
      question: "What use of the genitive case is found in the following sentence: <latin>Tullia partem fābulae līberīs narrābat</latin>?"
      answer: "PARTITIVE GENITIVE / GENITIVE OF THE WHOLE"
    boni:
      - question: "What use of the dative case can be found in that sentence?"
        answer: "INDIRECT OBJECT"
      - question: "What change would you make if the sentence says “Tullia was telling <emphasis>two of the stories</emphasis> to the children”?"
        answer: "<latin>DUĀS Ē / EX / DĒ FĀBULĪS</latin>"
  - tossup:
      question: "Who made a mutual assistance pact with Hannibal in 215 BC?"
      answer: "PHILIP V (OF MACEDONIA)"
    boni:
      - question: "How many wars did Rome fight because of the aggression of Philip?"
        answer: "TWO (FIRST and SECOND MACEDONIAN WARS)"
      - question: "In 192 BC against what Eastern enemy did Philip V become a Roman ally?"
        answer: "ANTIOCHUS III"
  - tossup:
      question: "When you are recognized by the spotter, follow these directions: <latin>Surge et salī ūnō pede.</latin>"
      answer: "STUDENT SHOULD STAND & HOP ON ONE FOOT"
    boni:
      - question: "<latin>Pōnite pollicēs in auribus et cantāte</latin>"
        answer: "TWO OR MORE STUDENTS PUT THUMBS IN THEIR EARS AND SING"
      - question: "<latin>Susurrā Anglicē tē mortuōs vidēre</latin>"
        answer: "STUDENT SHOULD WHISPER (IN ENGLISH) “I SEE DEAD PEOPLE/THE DEAD”"
  - tossup:
      question: "(PASS OUT THE VISUALS) PLEASE DO NOT OPEN THE VISUAL UNTIL INSTRUCTED TO DO SO. OPEN THE VISUAL AND STUDY IT FOR 5 SECONDS (WAIT 5 SECONDS): For the funeral procession in “A”, one possible ending place is “B”. What is the Latin name of this structure in “B”?"
      answer: "<latin>COLUMBARIUM/-A</latin>"
    boni:
      - question: "If the funeral procession in scene “A” had just left the home of a <emphasis>very</emphasis> prominent citizen, to which of the other illustrations would it proceed next?"
        answer: "“C” (ROSTRA FOR A PUBLIC <latin>LAUDATIO</latin>)"
      - question: "Whose funeral procession would have ended at “F”?"
        answer: "HADRIAN’S"
  - tossup:
      question: "In Book II of Homer’s <title>Iliad</title>, which of the Olympians sends a deceitful dream to Agamemnon, telling him that all the gods of Olympus will support the Greeks for the duration of the war?"
      answer: "ZEUS"
    boni:
      - question: "What Greek leader appears in this dream and delivered this false message to Agamemnon?"
        answer: "NESTOR"
      - question: "According to this dream, which of the Olympians is responsible for winning the support of all the gods on behalf of the Greeks?"
        answer: "HERA"
  - tossup:
      question: "Translate into Latin: Caesar himself came out of the camp"
      answer: "<latin>CAESAR IPSE Ē/EX CASTRĪS VĒNIT / VENIĒBAT / DISCESSIT / DISCEDĒBAT / EXCESSIT / EXCEDĒBAT / EXIIT / EXĪBAT</latin>"
    boni:
      - question: "Translate into Latin: Caesar did not kill himself"
        answer: "<latin>CAESAR SĒ NŌN INTERFĒCIT</latin>"
  - tossup:
      question: "Give the two Latin roots and their meanings from which we get “vociferous.”"
      answer: "<latin>VOX</latin> - VOICE & <latin>FERŌ, FERRE</latin> - BEAR, CARRY"
    boni:
      - question: "Give the two Latin roots and their meanings from which we get “malevolent.”"
        answer: "<latin>MALUS</latin> - BAD, EVIL / <latin>MALE</latin> - EVIL, BADLY & <latin>VOLŌ, VELLE</latin> - WISH, WANT"
      - question: "Give the two Latin roots and their meanings from which we get “jurisdiction.”"
        answer: "<latin>IŪS</latin> - RIGHT, LAW & <latin>DĪCŌ, DĪCERE</latin> - SAY"
  - tossup:
      question: "What future emperor narrowly escaped death during the storming of the Capitol by Vitellius’ supporters in AD 69?"
      answer: "(T. FLAVIUS) DOMITIAN(US)"
    boni:
      - question: "Who led the Danubian troops who defeated the Vitellians?"
        answer: "(M. ANTONIUS) PRIMUS"
      - question: "Who acted as Vespasian’s regent until the new emperor could arrive in Rome?"
        answer: "(C. LICINIUS) MUCIANUS"
  - tossup:
      question: "Give all the possible forms of the ablative singular relative pronoun"
      answer: "<latin>QUŌ & QUĀ</latin>"
    boni:
      - question: "Give all the possible forms of the ablative singular interrogative pronoun"
        answer: "<latin>QUŌ</latin>"
      - question: "Give all the possible forms of the ablative singular intensive pronoun"
        answer: "<latin>IPSŌ & IPSĀ</latin>"
  - tossup:
      question: "Whose ghost asked Heracles to marry his younger sister Deianeira?"
      answer: "MELEAGER’S"
    boni:
      - question: "Who were the parents of Meleager?"
        answer: "OENEUS (or ARES) & ALTHAEA"
      - question: "How did Althaea kill her own son Meleager?"
        answer: "SHE BURNED HIS LIFE-BRAND / SHE CURSED HIM AND THE ERINYES KILLED HIM"
  - tossup:
      question: "What is the gender of the second declension noun <latin>pelagus</latin>?"
      answer: "NEUTER"
    boni:
      - question: "What is the gender of the second declension noun <latin>Aegyptus</latin>?"
        answer: "FEMININE"
      - question: "What is the gender of the second declension noun <latin>humus</latin>?"
        answer: "FEMININE"
  - tossup:
      question: "How many years was Pompey granted by the <title>lex Gabinia</title> to rid the Mediterranean of pirates?"
      answer: "3 YEARS"
    boni:
      - question: "How long did it take Pompey to clear out the pirates?"
        answer: "3 MONTHS"
      - question: "Why was it important to deal quickly with the pirates?"
        answer: "FAMINE (BECAUSE OF GRAIN SHORTAGE CAUSED BY PIRATES)"
  - tossup:
      question: "Listen carefully to the following passage, which I will read twice; then answer in ENGLISH the question about it: <latin>Sulpicia, fēmina maximā pulchritūdine, multa carmina composuit.  Quamquam Sulpicia fēmina erat, nōtissima tamen facta est, quod omnēs cīvēs Rōmānī carmina eius amābant. Sulpicia, igitur, magna et multa praemia ab imperātōre recēpit.</latin>  What was Sulpicia’s occupation?"
      answer: "POET(ESS), SONG-WRITER"
    boni:
      - question: "Why was it odd for Sulpicia to become very famous?"
        answer: "BECAUSE SHE WAS A WOMAN"
      - question: "What did the emperor do for Sulpicia?"
        answer: "GAVE HER (MANY GREAT) REWARDS"
  - tossup:
      question: "What two tokens of his birth did Theseus have to find under a rock?"
      answer: "A (GOLDEN) SWORD AND (A PAIR OF) SANDALS/SHOES"
    boni:
      - question: "Who had hidden these items under the rock for Theseus to find?"
        answer: "AEGEUS"
      - question: "Who was the mother of Theseus?"
        answer: "AETHRA"
  - tossup:
      question: "Which of the following, if any, is <emphasis>not</emphasis> derived from the same Latin root as the others: alleviate, levity, levy, elevator?"
      answer: "ALL ARE FROM SAME ROOT / NONE"
    boni:
      - question: "Which of the following, if any, is <emphasis>not</emphasis> derived from the same Latin root as the others: affair, classify, deficient, infection?"
        answer: "ALL ARE FROM SAME ROOT / NONE"
      - question: "Which of the following, if any, is <emphasis>not</emphasis> derived from the same Latin root as the others: belligerent, congested, jester, indigenous?"
        answer: "INDIGENOUS"
  - tossup:
      question: "According to Apollonius, who volunteered to join the Argonauts, but was politely refused by Jason because he believed that there would be enough causes for dissension on the <title>Argo</title> without the presence of a woman?"
      answer: "ATALANTA"
    boni:
      - question: "Again, according to Apollonius, who was by far the strongest of the crew that set sail to search for the Golden Fleece?"
        answer: "HERACLES / HERCULES"
      - question: "Again, according to Apollonius, which of the Argonauts was gifted with a vision so sharp that he could see even that which was hidden in the earth?"
        answer: "LYNCEUS"
  - tossup:
      question: "What Roman road was particularly difficult to build because it crossed the Alban Hills?"
      answer: "<latin>VIA APPIA</latin>"
    boni:
      - question: "Besides the <latin>Via Appia</latin>, name a major road which leaves Rome and crosses the Ap(p)ennines"
        answer: "<latin>VIA FLAMINIA / TRAJANA / SALARIA</latin>"
      - question: "Why was the <latin>Via Salaria</latin> built?"
        answer: "TO GET/OBTAIN SALT (FROM THE MOUH OF THE TIBER) / FOR SALT (TRADE)"
  - tossup:
      question: "Make the verb form <latin>cupit</latin> future"
      answer: "<latin>CUPIET</latin>"
    boni:
      - question: "Change <latin>cupiet</latin> to the 2nd person"
        answer: "<latin>CUPIĒS</latin>"
      - question: "Change <latin>cupiēs</latin> to the passive voice"
        answer: "<latin>CUPIĒRIS</latin>"
