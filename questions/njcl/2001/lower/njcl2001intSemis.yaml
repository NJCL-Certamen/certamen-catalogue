tournament: "NJCL Certamen"
year: 2001
division: "Intermediate"
round: "Semifinals"
questions:
  - tossup:
      question: "What is the ultimate Latin root verb and its meaning from which “indolent” is derived?"
      answer: "<latin>DOLEŌ/DOLĒRE</latin> - GRIEVE, FEEL PAIN, SUFFER, BE SORRY/AFFLICTED"
    boni:
      - question: "What is the ultimate Latin root verb and its meaning from which “accomplice” is derived?"
        answer: "<latin>PLICŌ/PLICĀRE</latin> - FOLD, TWINE"
      - question: "What is the ultimate Latin root verb and its meaning from which “condition” is derived?"
        answer: "<latin>DĪCŌ/DĪCERE</latin>"
  - tossup:
      question: "What emperor had won the titles of Germanicus, Parthicus, and Dacius?"
      answer: "(<latin>MARCUS ULPIUS</latin>) <latin>TRAIANUS</latin> / TRAJAN"
    boni:
      - question: "What other title, abbreviated O. P., was given to Trajan and stamped on coins because of his tactful and respectful attitude towards the Senate?"
        answer: "<latin>OPTIMUS PRINCEPS</latin>"
      - question: "The Senate later bestowed on some new emperors the compliment <latin>Fēlīcior Augustō</latin> <latin>Melior Traiānō</latin>. What does the Latin mean?"
        answer: "LUCKIER THAN AUGUSTUS, BETTER THAN TRAJAN"
  - tossup:
      question: "Who offered to make Odysseus immortal and ageless?"
      answer: "CALYPSO"
    boni:
      - question: "Who finally ordered Calypso to let Odysseus leave Ogygia?"
        answer: "ZEUS / HERMES"
      - question: "How did the escaping Odysseus avoid the notice of his enemy Poseidon?"
        answer: "POSEIDON WAS FAR OFF IN ETHIOPIA"
  - tossup:
      question: "Who voluntarily went into exile with Oedipus?"
      answer: "ANTIGONE"
    boni:
      - question: "In which Athenian suburb did Oedipus finally die?"
        answer: "COLONUS"
      - question: "Who prevented the kidnaping of Oedipus' body from Colonus?"
        answer: "THESEUS"
  - tossup:
      question: "Using the noun <latin>prīnceps</latin>, translate the genitive phrase in the sentence “That prince’s slave has escaped.”"
      answer: "<latin>EIUS / ILLĪUS</latin> /<latin>ISTĪUS PRĪNCIPIS</latin>"
    boni:
      - question: "Translate the entire prepositional phrase in the sentence “Icarus flew in the highest air.”"
        answer: "<latin>IN SUMMŌ</latin>/ <latin>ALTISSIMŌ</latin> <latin>ĀERE</latin>/ <latin>AETHERE</latin>/ <latin>IN AURĀ</latin> (<latin>SUMMĀ</latin>/ <latin>ALTISSIMĀ</latin>)"
      - question: "Translate the entire prepositional phrase in the sentence “I am lost in the middle of the sea.”"
        answer: "<latin>IN MEDIŌ</latin> <latin>MARĪ</latin> / <latin>AEQUORE</latin> / <latin>PONTŌ</latin> <latin>/</latin> <latin>ŌCEANŌ</latin> / <latin>ALTŌ</latin> / <latin>PELAGŌ</latin>"
  - tossup:
      question: "Pass out the visuals – as soon as all the visuals have been handed out, say: “YOU MAY OPEN YOUR VISUALS NOW!” You will now have 15 seconds to carefully examine the lines of graffiti. (<emphasis>wait 15 seconds</emphasis>) Which of these graffiti is the equivalent of “My boyfriend cheated on me!”?"
      answer: "C"
    boni:
      - question: "Which one is the equivalent of “Strangers welcome!”?"
        answer: "D"
      - question: "Which one is the equivalent of “No loitering!”?"
        answer: "A"
  - tossup:
      question: "Of <latin>plaustrum, hōrologium, solea, castra</latin>, and <latin>arx</latin>, which is described in this Latin sentence: <latin>Est vehiculum rēbus ferendis aptum, praesertim apud rusticōs</latin>"
      answer: "<latin>PLAUSTRUM</latin>"
    boni:
      - question: " . . . <latin>Est locus mūnītissimus urbis, summus et excelsus</latin>"
        answer: "<latin>ARX</latin>"
      - question: ". . . <latin>Est īnstrūmentum quō</latin> <latin>tempus dieī</latin> <latin>dēfīnītur</latin>"
        answer: "<latin>HŌROLOGIUM</latin>"
  - tossup:
      question: "How many tables of law were produced by the <latin>decemviri</latin> of 451 BC?"
      answer: "TEN"
    boni:
      - question: "Who was reappointed to the <latin>decemviri</latin> of 450 BC who produced the final two tables?"
        answer: "APPIUS CLAUDIUS"
      - question: "Who was killed by her own father to save her from Appius Claudius?"
        answer: "VERGINIA"
  - tossup:
      question: "What is the Latin term for the crown awarded for saving the life of a Roman citizen in battle?"
      answer: "<latin>CORŌNA CĪVICA</latin>"
    boni:
      - question: "Of what was the <latin>corōna cīvica</latin> made?"
        answer: "OAK LEAVES"
      - question: "From what obligation was the recipient of the <latin>corōna cīvica</latin> freed?"
        answer: "(PAYING) TAXES"
  - tossup:
      question: "<latin>In hāc sententiā, “Cibus, cuius partem maximam cōnsumpsimus, tepidus est.”, quid Anglicē</latin> <latin>significat “cuius”?</latin>"
      answer: "OF WHICH"
    boni:
      - question: "<latin>In hāc sententiā, quid Anglicē</latin> <latin>significat</latin> “<latin>Quī</latin>”? <latin>Quī</latin> <latin>errōrēs faciunt, pūnientur</latin>"
        answer: "THOSE WHO / THE ONES WHO / THEY WHO / WHO / PEOPLE WHO / WHOEVER"
      - question: "<latin>In hāc sententiā, quid Anglicē</latin> <latin>significat</latin> “<latin>Quam</latin>”? <latin>Quam stultus es!</latin>"
        answer: "HOW"
  - tossup:
      question: "Who instructed Heracles to perform labors for Eurystheus?"
      answer: "(APOLLO THROUGH) PYTHIA / ORACLE OF DELPHI"
    boni:
      - question: "How did Hera memorialize the Nemean lion after Heracles killed it?"
        answer: "MADE IT A CONSTELLATION (LEO)"
      - question: "What other animal, now a constellation, attacked Heracles while the hero was trying to kill the Hydra?"
        answer: "CANCER / THE CRAB"
  - tossup:
      question: "Translate the following sentence into English: <latin>Pōns fabrīs faciendus erat</latin>"
      answer: "THE CRAFTSMEN HAD TO BUILD / MAKE A BRIDGE"
    boni:
      - question: "<latin>Fabrī</latin> <latin>pontem trāns Tiberim factūrī</latin> <latin>sunt</latin>"
        answer: "THE CRAFTSMEN / WORKMEN / ARE GOING TO / ABOUT TO / INTENDING TO / MAKE / FABRICATE / ERECT / A BRIDGE / ACROSS THE TIBER"
      - question: "<latin>Fabrī</latin> <latin>in urbe manēbunt dum pōns factus sit</latin>"
        answer: "THE CRAFTSMEN WILL REMAIN IN THE CITY UNTIL THE BRIDGE IS / HAS BEEN / WILL HAVE BEEN BUILT"
  - tossup:
      question: "What was Poseidon's gift to the yet-unnamed city of Athens?"
      answer: "SALT SPRING"
    boni:
      - question: "or HORSE What did Athena give to the city?"
        answer: "OLIVE TREE"
      - question: "What deity was the patron of the isthmus of Corinth?"
        answer: "POSEIDON"
  - tossup:
      question: "Give the Latin and English for the abbreviation <latin>ad inf</latin>"
      answer: "<latin>AD INFĪNĪTUM</latin> - TO INFINITY; FOREVER; WITHOUT LIMIT"
    boni:
      - question: ". . . <latin>ad int</latin>"
        answer: "<latin>AD INTERIM</latin> - IN THE MEANTIME, MEANWHILE; TEMPORARILY"
      - question: ". . . <latin>ad lib</latin>"
        answer: "<latin>AD LIBITUM</latin>"
  - tossup:
      question: "Listen carefully to the following passage, which I will read twice; then answer in LATIN the question about it: <latin>Cum eandem fēminam pulchram amārent, Herculēs et deus flūminis</latin>  <latin>cōnstituērunt inter sē</latin> <latin>pugnātūrōs esse. Quod deus flūminis Herculem potentissimum vincere nōn poterat, in serpentem sē</latin> <latin>mūtāvit. Statim</latin>  <latin>Herculēs collum serpentis rapuit et vehementer pressit. Deō</latin> <latin>superātō, Herculēs fēminam pulchram in mātrimōnium dūxit.</latin>  <latin>Quis ā</latin> <latin>duōbus deīs amābātur?</latin>"
      answer: "FĒMINA (PULCHRA)"
    boni:
      - question: "In quāle animal deus flūminis sē <latin>mūtāvit?</latin>"
        answer: "(IN) SERPENTEM"
      - question: "Quō <latin>factō, Herculēs fēminam in mātrimonium dūxit?</latin> "
        answer: "<latin>DEŌ</latin> <latin>SUPERĀTŌ</latin> <latin>/ VICTŌ</latin>"
  - tossup:
      question: "Which of the following words, if any, does <emphasis>not</emphasis> have the same Latin root as the others: discord, core, cordial, cordon, concordance?"
      answer: "CORDON"
    boni:
      - question: "Which of the following words, if any, does <emphasis>not</emphasis> have the same Latin root as the others: crescent, concrete, increase, accrue, recruit?"
        answer: "NONE OF THEM"
      - question: "Which of the following words, if any, does <emphasis>not</emphasis> have the same Latin root as the others: crucial, excruciating, crutch, crusade, cruise?"
        answer: "CRUTCH"
  - tossup:
      question: "Using a deponent verb, say in Latin “Aulus, don’t delay here!”"
      answer: "SEE ANSWERS BELOW"
    boni:
      - question: "Using a different construction, translate that command again"
        answer: "<latin>AULE, NŌLĪ</latin> <latin>HĪC MORĀRĪ</latin> <latin>AULE, NĒ</latin> <latin>HĪC MORĀTUS SĪS (MORĒRIS)</latin>"
  - tossup:
      question: "By what collective name do we know Enyo, Pemphredo & Deino?"
      answer: "GRAEAE"
    boni:
      - question: "or GREY SISTERS Whose sisters were they?"
        answer: "GORGONS', ALSO ECHIDNA'S AND LADON'S"
      - question: "How many eyes in total did the Graeae and Polyphemus have?"
        answer: "TWO"
  - tossup:
      question: "Whose head was displayed during a performance of Euripides’ <emphasis>Bacchae</emphasis> at the Parthian Court in 53 B. C.?"
      answer: "(M. LICINIUS) CRASSUS’"
    boni:
      - question: "At what battle had Crassus and seven legions been annihilated by the Parthians?"
        answer: "CARRHAE"
      - question: "What future assassin of Julius Caesar escaped from Carrhae with the remnants of Crassus’ army?"
        answer: "(C.) CASSIUS (LONGINUS)"
  - tossup:
      question: "Who earned the reputation of being the second founder of the principate by restoring stability to the empire in A"
      answer: "D."
    boni:
      - question: "69?"
        answer: "VESPASIAN"
      - question: "In spite of his achievements and reforms, what group of philosophers was opposed to Vespasian’s rule?"
        answer: "STOIC"
      - question: "and/or CYNICS What action was Vespasian finally forced to take against them?"
        answer: "EXPELLED FROM ROME"
