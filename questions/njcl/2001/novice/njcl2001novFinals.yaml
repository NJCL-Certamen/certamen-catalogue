tournament: "NJCL Certamen"
year: 2001
division: "Novice"
round: "Finals"
questions:
  - tossup:
      question: "When should you take a medicine if the doctor’s directions are abbreviated <latin>p.c.</latin>?"
      answer: "AFTER FOOD"
    boni:
      - question: "or MEALS / EATING / DINNER / ON A FULL STOMACH (<latin>POST CIBUM / CIBŌS / CĒNAM</latin>) How should you take your medicine if the doctor’s directions are abbreviated <latin>p.o.</latin>?"
        answer: "BY MOUTH/ORALLY (<latin>PER ŌS</latin>)"
      - question: "Where should you put a medicine if the doctor’s directions are abbreviated <latin>o.d.</latin>?"
        answer: "IN RIGHT EYE (<latin>OCULUS DEXTER</latin>)"
  - tossup:
      question: "Translate the following sentence into Latin: “We have seen two towns.”"
      answer: "<latin>DUO OPPIDA VĪDIMUS / SPECTĀVIMUS</latin>"
    boni:
      - question: " . . . “He was eating a dead fish.”"
        answer: "<latin>PISCEM MORTUUM EDĒBAT / CŌNSŪMĒBAT</latin>"
      - question: ". . . “I will wash my whole body.”"
        answer: "<latin>CORPUS MEUM TŌTUM LAVĀBŌ / LUAM</latin>"
  - tossup:
      question: "Who was the father of the giant Antaeus?"
      answer: "POSEIDON"
    boni:
      - question: "Who were Poseidon's sons by Iphimedeia?"
        answer: "OTUS AND EPHIALTES"
      - question: "Who was Poseidon's son by the Nereid Thoosa?"
        answer: "(THE CYCLOPS) POLYPHEMUS"
  - tossup:
      question: "Who unsuccessfully advised his consular colleague Sempronius Longus not to meet Hannibal in battle?"
      answer: "(P. CORNELIUS) <emphasis>SCIPIO</emphasis>"
    boni:
      - question: "and one of the following pieces of info: FATHER OF AFRICANUS / CONSUL OF 218 B"
        answer: "C. / BROTHER OF GNAEUS"
      - question: "Where had Scipio already met Hannibal in a cavalry skirmish and been severely wounded?"
        answer: "TICINUS (RIVER)"
      - question: "Where did Hannibal defeat these two consuls who lost about 30,000 of their soldiers?"
        answer: "TREBIA (RIVER)"
  - tossup:
      question: "Listen carefully to the following passage, which I will read twice; then answer in LATIN the question about it: <latin>Argentarius dīves ad aulam rēgis vēnit et eī multa dōna obtulit. Rēx, vidēns dōna, dīxit, “num amīcitiam meam emere vīs? Ēripe haec dōna statim aut tū eris inimīcus meus. Amīcitia enim neque vēndī neque emī potest.”</latin>"
      answer: "(REPEAT)"
    boni:
      - question: "<latin>Quō īvit argentārius cum dōnīs? AD AULAM (RĒGIS) / RĒGIAM Quam rem rēx putāvit argentarium emere temptāre?</latin>"
        answer: "AMĪCITIAM"
      - question: "Quae verba dē <latin>amīcitiā dīxit rēx?</latin> "
        answer: "<latin>(AMĪCITIA ENIM) NEQUE VĒNDĪ NEQUE EMĪ POTEST / AMĪCITIAM NEQUE VĒNDĪ NEQUE EMĪ POSSE</latin>"
  - tossup:
      question: "What is the Latin name for the drink which was a mixture of wine and honey?"
      answer: "<latin>MULSUM</latin>"
    boni:
      - question: "What name for the appetizer course of a Roman dinner indicates that <latin>mulsum</latin> was served then?"
        answer: "<latin>PRŌMULSIS</latin>"
      - question: " What other term for the appetizer course indicates that the foods served were designed to whet the appetite and not simply to be eaten before dinner?"
        answer: "<latin>GUSTUS / GUSTATIO</latin>"
  - tossup:
      question: "Give the comparative and superlative forms of <latin>fortiter</latin>"
      answer: "<latin>FORTIUS, FORTISSIMĒ</latin>"
    boni:
      - question: "of the adjective <latin>facile</latin>"
        answer: "<latin>FACILIUS, FACILLIMUM</latin>"
      - question: ". . . of the adjective <latin>idōneus</latin>"
        answer: "<latin>MAGIS IDŌNEUS, MAXIMĒ IDŌNEUS</latin>"
  - tossup:
      question: "Why did red water run from the spring at the Syrian city of Joppa?"
      answer: "PERSEUS WASHED BLOOD FROM HIS HANDS THERE AFTER KILLING THE SEA MONSTER"
    boni:
      - question: "Who was the husband of the vain Cassiopeia?"
        answer: "CEPHEUS"
      - question: "Who placed Cepheus and Cassiopeia and the sea monster in the heavens as a constellation?"
        answer: "POSEIDON"
  - tossup:
      question: "Who returned to Rome in A"
      answer: "D."
    boni:
      - question: "2 after a self-imposed exile on the island of Rhodes?"
        answer: "TIBERIUS"
      - question: "The historian Tacitus tells us that one of Tiberius’ reasons for going to Rhodes may have been to get away from his unfaithful wife. Who was she?"
        answer: "JULIA (DAUGHTER OF AUGUSTUS)"
      - question: "The other reason for leaving Rome may have been his jealousy of Augustus’ grandsons. Name them"
        answer: "GAIUS & LUCIUS CAESAR"
  - tossup:
      question: "Of <latin>tempestās, bīgae, rētiārius, officīna</latin>, and <latin>lectīca</latin>, which is being described in the following Latin sentence: <latin>Est sella cum pulvīnō quā dīvitiōrēs ferēbantur</latin>"
      answer: "<latin>LECTĪCA</latin>"
    boni:
      - question: " . . . <latin>Est locus in quō artificēs opera faciunt</latin>"
        answer: "<latin>OFFICĪNA</latin>"
      - question: ". . . <latin>Sunt currus duōbus equīs iunctus</latin>"
        answer: "<latin>BĪGAE</latin>"
  - tossup:
      question: "Open your visuals"
      answer: "(WHEN ALL TEAMS HAVE OPENED THEIR VISUALS SAY:)"
    boni:
      - question: "This young man has been accused of a crime and has been exiled from his homeland. Study the picture for ten seconds"
        answer: "(WAIT TEN SECONDS)"
      - question: "The crime which he has supposedly committed is the seduction of his stepmother. Who is he?"
        answer: "HIPPOLYTUS"
      - question: "Who is his stepmother?"
        answer: "PHAEDRA"
      - question: "Explain the presence of the bull"
        answer: "THESEUS PRAYED TO POSEIDON TO PUNISH HIPPOLYTUS (AND THE HORSES WERE FRIGHTENED, HIPPOLYTUS WAS DRAGGED TO HIS DEATH OR DROWNED)"
  - tossup:
      question: "Who proscribed 90 senators, 15 men of consular rank, and 2,600 equites in 82 B. C.?"
      answer: "(L. CORNELIUS) SULLA"
    boni:
      - question: "Sulla’s victory at what battle had given him absolute power in Rome?"
        answer: "COLLINE GATE"
      - question: "What freedman of Sulla’s took advantage of the proscription lists to accumulate vast wealth?"
        answer: "(L. CORNELIUS) CHRYSOGONUS"
  - tossup:
      question: "What derivative of the Latin verb <latin>dīcō, dīcere</latin> means “to express the opposite?”"
      answer: "CONTRADICT"
    boni:
      - question: "means “a formal decree or proclamation?”"
        answer: "EDICT"
      - question: "means “to prohibit or forbid?”"
        answer: "INTERDICT"
  - tossup:
      question: "Who put Telemachus in the path of Odysseus' plow to prove that Odysseus was not crazy?"
      answer: "PALAMEDES"
    boni:
      - question: "Another Greek who tried to avoid going to the Trojan War was Achilles. In whose court was Achilles hidden as a girl?"
        answer: "LYCOMEDES"
      - question: "On what island was Lycomedes' court?"
        answer: "SKYRUS / SCYRUS"
  - tossup:
      question: "The noun <latin>rēs</latin> does NOT agree with which of the following adjectives: <latin>longus, longās, longae, longa</latin>?"
      answer: "<latin>LONGUS</latin>"
    boni:
      - question: "The noun <latin>puellae</latin> does NOT agree with which of the following adjectives: <latin>hae, haec, huic, huius</latin>?"
        answer: "<latin>HAEC</latin>"
      - question: "The noun <latin>puerī</latin> does NOT agree with which of the following adjectives: <latin>fortēs, fortis, fortī</latin>?"
        answer: "<latin>FORTĪ</latin>"
  - tossup:
      question: "Translate the following sentence into English: <latin>Paucīs hōrīs magna pars urbis destructa est.</latin> "
      answer: "IN A FEW HOURS A LARGE PART OF THE CITY WAS DESTROYED"
    boni:
      - question: "<latin>Omnium avium aquila est celerrima.</latin> "
        answer: "OF ALL BIRDS THE EAGLE IS SWIFTEST."
      - question: "<latin>Duo ex meīs frātribus eandem fābulam audīvērunt.</latin> "
        answer: "TWO OF MY BROTHERS HEARD THE SAME STORY / TALK / PLAY / CONVERSATION"
  - tossup:
      question: "What emperor of A"
      answer: "D."
    boni:
      - question: "193 was so unpopular that the people of Rome threw stones at him?"
        answer: "(<latin>M.) DIDIUS IULIANUS</latin> / DIDIUS JULIANUS"
      - question: "From whom had Julianus purchased the imperial throne?"
        answer: "PRAETORIAN GUARD"
      - question: "Who eventually gained the throne and replaced the Guard with 15,000 of his best legionary soldiers?"
        answer: "SEPTIMIUS SEVERUS"
  - tossup:
      question: "After the great flood, what monster was born to Mother Earth on Mt. Parnassus?"
      answer: "PYTHON"
    boni:
      - question: "Who killed it?"
        answer: "APOLLO"
      - question: "What happened soon thereafter as Apollo was boasting of his deed?"
        answer: "CUPID SHOT HIM WITH A GOLDEN ARROW"
  - tossup:
      question: "What use of the ablative case is illustrated in this sentence: <latin>oculīs vidēmus</latin>"
      answer: "MEANS/INSTRUMENT"
    boni:
      - question: "in this sentence: <latin>tertio diē revēnit</latin>"
        answer: "TIME (WHEN)"
      - question: "in this sentence: <latin>dominus ā cane excitātus est</latin>"
        answer: "AGENT"
  - tossup:
      question: "When you are recognized by the spotter, follow this direction: <latin>Dīc mihi Anglicē haec verba: “Quis canēs līberāvit?”</latin> "
      answer: "STUDENT SHOULD SAY “WHO LET THE DOGS OUT?”"
    boni:
      - question: "or something like “WHO HAS FREED THE DOGS?” but prompt for lameness <latin>Surge et dīc sociīs tuīs Anglicē fābulam brevem dē canibus.</latin> "
        answer: "STUDENT SHOULD RISE AND TELL HIS TEAMMATES SOME STORY ABOUT DOGS"
      - question: "<latin>Rogā mē Anglicē haec verba: Quod est pretium illīus canis in fenestr</latin><latin>ā?</latin>"
        answer: "STUDENT SHOULD AS MODERATOR “HOW MUCH IS THAT DOGGIE IN THE WINDOW?”"
