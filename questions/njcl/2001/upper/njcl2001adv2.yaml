tournament: "NJCL Certamen"
year: 2001
division: "Advanced"
round: "Round 2"
questions:
  - tossup:
      question: "Give the Latin verb and its meaning which is at the root of “ingredient,” “graduate,” and “congress.”"
      answer: "<latin>GRADIOR/GRADĪ</latin> - STEP, WALK, GO"
    boni:
      - question: "Give the Latin verb and its meaning which is at the root of “cohesion,” “hesitate,” and “adhesive.”"
        answer: "<latin>HAEREŌ/HAERĒRE</latin> - STICK, CLING, ADHERE, REMAIN FIRM"
      - question: "Give the Latin verb and its meaning which is at the root of “league,” “oblige,” and “ligament.”"
        answer: "<latin>LIGŌ/LIGĀRE</latin>"
  - tossup:
      question: "Name the consul of 249 B"
      answer: "C."
    boni:
      - question: "who suffered a major defeat at Drepana, losing 93 out of 123 ships"
        answer: "(P. CLAUDIUS) PULCHER"
      - question: "What bad omen had Pulcher ignored before the battle?"
        answer: "SACRED CHICKENS WOULDN’T EAT"
      - question: "Who was the Carthaginian commander at Drepana?"
        answer: "ADHERBAL"
  - tossup:
      question: "Give a synonym for the noun <latin>facinus</latin>?"
      answer: "<latin>SCELUS, FRAUS, MALEFICIUM, FLĀGITIUM</latin>"
    boni:
      - question: " Give a synonym for the noun <latin>pactum</latin>?"
        answer: "<latin>FOEDUS, PACTIŌ, CONVENTUM</latin>"
      - question: "Give a synonym for the noun <latin>blanditia</latin>?"
        answer: "<latin>ADŪLĀTIŌ, ASSENTĀTIŌ, BLANDĪMENTUM, LAUS</latin>"
  - tossup:
      question: "Give the genitive singular of the present active participle of the verb <latin>eō</latin>"
      answer: "EUNTIS"
    boni:
      - question: "Give the nominative future passive participle of the verb <latin>fiō</latin>"
        answer: "<latin>FACIENDUS</latin>"
      - question: "(-<latin>A /</latin> -<latin>UM</latin>) Give the perfect participle of <latin>loquor</latin>"
        answer: "<latin>LOCŪTUS</latin>"
  - tossup:
      question: "How did Perseus take his revenge on Polydectes?"
      answer: "BY TURNING HIM (& HIS FRIENDS) INTO STONE WITH MEDUSA’S HEAD"
    boni:
      - question: "What island was the home of Polydectes?"
        answer: "SERIPHUS"
      - question: "To whom did Perseus hand over the government of Seriphus?"
        answer: "DICTYS"
  - tossup:
      question: "What is the Latin term for the sacrifice of a pig, a ram, and a bull?"
      answer: "<latin>SUOVETAURILIA</latin>"
    boni:
      - question: "To what deity were the animals sacrificed?"
        answer: "MARS"
      - question: "Of what religious ritual was the <latin>suovetaurilia</latin> a part?"
        answer: "PURIFICATION OF THE (ENTIRE) PEOPLE / LUSTRATION / <latin>LUSTRUM</latin>"
  - tossup:
      question: "What author was summoned to Rome by Galba in AD 68 and began his work as a teacher of rhetoric?"
      answer: "(M. FABIUS) QUINTILIAN(US)"
    boni:
      - question: "Who in AD 78 appointed Quintilian as the first state professor with an annual salary of a hundred thousand sesterces?"
        answer: "VESPASIAN"
      - question: "Give the Latin title of Quintilian’s work which outlined the steps necessary for the training of an orator?"
        answer: "<title><latin>INSTITŪTIŌ</latin> <latin>ORĀTORIA</latin></title>"
  - tossup:
      question: "What is the translation of the Latin abbreviation <latin>H</latin>"
      answer: "I. S."
    boni:
      - question: "found on tombstones?"
        answer: "HERE LIES BURIED (<latin>HĪC IACET SEPULTUS</latin>)"
      - question: "<latin>aet</latin>. found on tombstones?"
        answer: "AT THE AGE OF/OF THE AGE (<latin>AETĀS</latin> or <latin>AETĀTIS</latin> or <latin>AETĀTE</latin>)"
      - question: "<latin>d.s.p.</latin> found on tombstones?"
        answer: "DIED WITHOUT ISSUE/OFFSPRING (<latin>DĒCESSIT SINE PRŌLE</latin>)"
  - tossup:
      question: "Who, in an attempt to popularize the Epicurean doctrine, wrote a didactic epic poem titled <title><latin>Dē</latin> <latin>Rērum Natūr</latin></title>ā?"
      answer: "(T.) LUCRETIUS (CARUS)"
    boni:
      - question: "In what meter was Lucretius’ <title><latin>Dē</latin> <latin>Rērum Natūr</latin></title>ā written?"
        answer: "DACTYLIC HEXAMETER"
      - question: "According to Jerome, who is said to have revised and published Lucretius’ <title><latin>Dē</latin> <latin>Rērum Natūr</latin></title>ā after the poet’s death?"
        answer: "(M. TULLIUS) CICERO"
  - tossup:
      question: "When you are recognized by the spotter, follow this direction: <latin>Dīc mihi, Anglicē, nōmen urbis ubi nātus es.</latin> "
      answer: "STUDENT SHOULD SAY IN ENGLISH THE NAME OF THE CITY WHERE THEY WERE BORN"
    boni:
      - question: "<latin>. . . Dīc mihi, Anglicē, quot annōs nātus sīs.</latin> "
        answer: "STUDENT SHOULD SAY IN ENGLISH HOW OLD THEY ARE"
      - question: "<latin>. . . Dīc mihi, Anglicē, quō mēnse nātus sīs</latin>"
        answer: "STUDENT SHOULD SAY IN ENGLISH THE NAME OF THE MONTH IN WHICH HE / SHE WAS BORN"
  - tossup:
      question: "Of the verb <latin>vereor</latin>, give the present imperative singular"
      answer: "<latin>VERĒRE</latin>"
    boni:
      - question: "Change <latin>verēre</latin> to the plural"
        answer: "<latin>VERĒMINĪ</latin>"
      - question: "Translate <latin>verēminī</latin> in its two different forms"
        answer: "FEAR (plural)! / BE AFRAID! & YOU (plural) ARE FEARING / ARE AFRAID"
  - tossup:
      question: "Which of the sons of Constantine was the sole emperor by A"
      answer: "D."
    boni:
      - question: "353?"
        answer: "CONSTANTIUS II"
      - question: "Whom did Constantius make his Caesar to handle a rebellion in Gaul and repel German invaders?"
        answer: "JULIAN"
      - question: "Julian became emperor in A"
        answer: "D."
      - question: "361 when Constantius died. Why was Julian called the Apostate?"
        answer: "RENOUNCED CHRISTIANITY"
  - tossup:
      question: "According to Homer’s <title>Odyssey</title>, what did Eurylochus urge Odysseus’ crew to do when they suffered from a shortage of food?"
      answer: "KILL THE CATTLE OF HELIUS / HYPERION / SUN"
    boni:
      - question: "What daughter of Helius reported the theft of the cattle to him?"
        answer: "LAMPETIE"
      - question: "What did Zeus do to punish those who had feasted on Helius’ cattle?"
        answer: "HE SENT A <emphasis>STORM</emphasis> THAT TORE ODYSSEUS’ SHIP APART & HE <emphasis>DROWNED</emphasis> ALL THE CREW (EXCEPT FOR ODYSSEUS)"
  - tossup:
      question: "Please consider the following line which I will read as prose: <latin>iam medium aetheriō cursū trāiēcerat āxem.</latin>  Where would the elision occur?"
      answer: "BETWEEN <latin>MEDIUM</latin> AND <latin>AETHERIŌ</latin> / BETWEEN THE SECOND AND THIRD WORDS / AFTER MEDIUM / AFTER THE SECOND WORD "
    boni:
      - question: "You now have 15 seconds to examine both lines of poetry. In what meter are these lines written?"
        answer: "DACTYLIC HEXAMETER"
      - question: "How many total dactyls are there in both lines?"
        answer: "SIX"
  - tossup:
      question: "According to the Delphic Oracle, what son of Amphiaraüs must lead the Epigoni in order for the campaign to be successful?"
      answer: "ALCMAEON"
    boni:
      - question: "Who was the only one of the Epigoni to die?"
        answer: "AEGIALEUS"
      - question: "What son of Eteocles was the king of Thebes when the Epigoni attacked the city?"
        answer: "LAODAMAS"
  - tossup:
      question: "Listen carefully to the following passage, which I will read twice; then answer in ENGLISH the question about it: <latin>Hannibal, cum nūntiī in Ītaliam missī essent quī eum Carthāginem</latin>  <latin>revocārent, summā īrā eīs acceptīs vix ab lacrimīs temperābat. Exclāmāns “nōn est dubium” inquit “quīn meī cīvēs odiō invidiāque, nōn ipsī Rōmānī, mē vīcerint.</latin>” Why were the messengers in Italy?"
      answer: "TO RECALL HANNIBAL <emphasis>TO CARTHAGE</emphasis>"
    boni:
      - question: "Precisely describe Hannibal’s anger at being recalled"
        answer: "HE WAS <emphasis>BARELY ABLE</emphasis> TO HOLD BACK HIS <emphasis>TEARS</emphasis>"
      - question: " According to Hannibal, who were his conquerors and what was their motivation?"
        answer: "HIS OWN (CARTHAGINIAN) CITIZENS, <emphasis>HATE</emphasis> AND <emphasis>ENVY</emphasis>"
  - tossup:
      question: "Although he was well known for his republican principles, what Roman historian became a good acquaintance of the emperor Augustus?"
      answer: "LIVY / (T.) LIVIUS"
    boni:
      - question: "What nickname did Augustus give to Livy on account of his criticisms of Julius Caesar and his admiration for the old republic?"
        answer: "POMPEIAN / <latin>POMPEIANUS</latin>"
      - question: "Some scholars think that Livy intended to end his history with the death of Augustus. With whose death does Livy’s history actually end?"
        answer: "DEATH OF DRUSUS (THE BROTHER OF TIBERIUS)"
  - tossup:
      question: "In what area of Italy were the cities of Ardea, Antium, Alba Longa, and Roma?"
      answer: "LATIUM"
    boni:
      - question: "were the cities of Capua, Nuceria, Neapolis, and Herculaneum?"
        answer: "CAMPANIA"
      - question: "were the cities of Clusium, Veii, Tarquinii, and Caere?"
        answer: "ETRURIA"
  - tossup:
      question: "Whom did Hera choose as the one who would travel to a foreign land and bring back the person who would cause the death of Pelias?"
      answer: "JASON"
    boni:
      - question: "According to Hera, who is this person?"
        answer: "MEDEA"
      - question: "According to most versions of the story, what promise did Medea make to the daughters of Pelias that eventually resulted in his death?"
        answer: "SHE PROMISED THAT SHE WOULD RESTORE HIS YOUTH (& MAKE HIM MORE HANDSOME)"
  - tossup:
      question: "Translate the following sentence into English: <latin>Pauper clāmābat sē cīvem Rōmānum esse</latin>"
      answer: "THE POOR MAN WAS SHOUTING / SHOUTED THAT HE WAS A ROMAN CITIZEN"
    boni:
      - question: "<latin>Mīlitēs putābant pauperem facile necātum īrī</latin>"
        answer: "THE SOLDIERS WERE THINKING / THOUGHT THAT THE POOR MAN WOULD BE EASILY KILLED"
      - question: "<latin>Nūlla spēs est fore ut pauperī parcātur</latin>"
        answer: "THERE IS NO HOPE THAT THE POOR MAN WILL BE SPARED"
