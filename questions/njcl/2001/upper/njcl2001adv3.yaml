tournament: "NJCL Certamen"
year: 2001
division: "Advanced"
round: "Round 3"
questions:
  - tossup:
      question: "Who attempted to dispel the notion that he was a revolutionary just like Catiline in his <title><latin>Dē</latin> <latin>Bellō</latin> <latin>Cīvīl</latin></title>ī?"
      answer: "(C.) <emphasis>IULIUS CAESAR</emphasis> / JULIUS CAESAR"
    boni:
      - question: "Caesar justifies his actions in the Civil War while proclaiming that unlike Catiline, he would not do what?"
        answer: "CANCEL DEBTS"
      - question: "What young man, who had been defended by Cicero in 56 BC on the charge of poisoning, was advocating drastic measures against Caesar for debt relief?"
        answer: "(M.) CAELIUS (RUFUS)"
  - tossup:
      question: "When you are recognized by the spotter, follow this direction: <latin>Tere caput comitis ūnā manū.</latin> "
      answer: "STUDENT SHOULD <emphasis>RUB</emphasis> HIS / HER HAND ON THE HEAD OF A TEAMATE"
    boni:
      - question: "<latin>. . . Sufflā buccās</latin>"
        answer: "ONE STUDENT SHOULD BLOW UP HIS CHEEKS"
      - question: "<latin>. . . Omnēs, coniungite manūs et singillātim flectite.</latin> "
        answer: "EVERYONE ON THE TEAM SHOULD JOIN HANDS AND BOW OR BEND ONE AT A TIME"
  - tossup:
      question: "In Homer’s <title>Iliad</title>, who are the three Greek chieftains who went to the camp of Achilles to ask him to rejoin the war?"
      answer: "ODYSSEUS, AJAX TELAMON / THE GREATER, & PHOENIX"
    boni:
      - question: "Which of the three addresses Achilles and informs him on how badly things have gone for the Greeks?"
        answer: "ODYSSEUS"
      - question: "After Achilles refuses to rejoin the fighting, which other Greek chieftain angrily says that Achilles should be left alone with his pride?"
        answer: "DIOMEDES"
  - tossup:
      question: "What renegade noble led a Volscian army against Rome in 491 BC ?"
      answer: "(CN. MARCIUS) CORIOLANUS"
    boni:
      - question: "Why had Coriolanus been expelled from Rome?"
        answer: "CHARGED WITH <emphasis>TYRANNICAL</emphasis> CONDUCT / DEMAGOGUERY OPPOSED DISTRIBUTION OF GRAIN TO STARVING PLEBS / OPPOSED FUNCTION OF TRIBUNES"
      - question: "What family members convinced Coriolanus not to attack Rome?"
        answer: "<emphasis>HIS MOTHER</emphasis> (VETURIA), <emphasis>HIS WIFE</emphasis> (VOLUMNIA), (& HIS 2 CHILDREN)"
  - tossup:
      question: "Who composed the hymn that a chorus of twenty-seven girls and twenty-seven boys was to perform during the <latin>Ludī Saeculārēs</latin> of 17 BC?"
      answer: "HORACE / (Q.) HORATIUS (FLACCUS)"
    boni:
      - question: "What is the Latin title of this hymn?"
        answer: "<title><latin>CARMEN SAECULĀRE</latin></title>"
      - question: "Who had commissioned Horace to compose the <title><latin>Carmen Saeculāre</latin></title>?"
        answer: "AUGUSTUS"
  - tossup:
      question: "Which of the following words, if any, is <emphasis>not</emphasis> derived from the same Latin root as the others: carnival, carnation, carrion, carnivorous, carnage?"
      answer: "NONE OF THEM"
    boni:
      - question: "Give the Latin root and its meaning which is the root of the words in the toss-up"
        answer: "<latin>CARŌ (CARNIS)</latin> - FLESH, MEAT"
      - question: "What English adjective derived from <latin>carō</latin> means “embodied in human form?”"
        answer: "INCARNATE(D)"
  - tossup:
      question: "<latin>Quid Anglicē significat</latin> “<latin>nemus</latin>”?"
      answer: "WOOD, GROVE, FOREST"
    boni:
      - question: "<latin>Quid Anglicē significat</latin> “<latin>nequitia</latin>”?"
        answer: "IMMORALITY, IDLENESS, NEGLIGENCE, WORTHLESSNESS, LEVITY, EVIL, BADNESS"
      - question: "<latin>Quid Anglicē significat</latin> “<latin>cinis</latin>”?"
        answer: "ASH, DEATH, RUIN"
  - tossup:
      question: "Which Flavian emperor indicated his intention of ruling as an autocrat by appearing before the Senate in the regalia of a triumphant general?"
      answer: "DOMITIAN"
    boni:
      - question: "In addition to 17 consulships, Domitian threatened the Senate by assuming for life what office?"
        answer: "CENSOR"
      - question: "What group did Domitian elevate to positions of power and authority formerly reserved for senators?"
        answer: "EQUITES/EQUESTRIANS"
  - tossup:
      question: "Translate the motto of the University of Chicago: <latin>Crēscat scientia, vīta excolātur</latin>"
      answer: "LET KNOWLEDGE GROW, LET LIFE BE ENRICHED / PERFECTED"
    boni:
      - question: "of the Liverpool College: <latin>Nōn sōlum ingeniī, vērum etiam virtūtis</latin>"
        answer: "NOT ONLY OF TALENT / SKILL / STRENGTH / NATURAL ABILITY, BUT ALSO OF VIRTUE / COURAGE / MANLINESS"
      - question: "of the University of Salford in the UK: <latin>altiōra petāmus</latin>"
        answer: "LET US STRIVE FOR/SEEK HIGHER/LOFTIER THINGS"
  - tossup:
      question: "According to Homer’s <title>Odyssey</title>, how many Sirens were there?"
      answer: "TWO "
    boni:
      - question: "You now have ten seconds to examine the visual carefully. Identify the name of the island labeled “A”"
        answer: "ANTHEMOESSA"
      - question: "Name the parents of the character labeled “B”"
        answer: "ACHELOUS / PHORCYS & MELPOMENE / TERPSICHORE / STEROPE"
  - tossup:
      question: "What conjunction would be required to introduce the dependent subjunctive clause in the following sentence if translated into Latin: “Caesar fears that his soldiers will be defeated.”"
      answer: "<latin>NĒ</latin>"
    boni:
      - question: "“There is no doubt that Caesar will win the war.”"
        answer: "<latin>QUĪN</latin>"
      - question: ". . . “The enemy is preventing Caesar from winning the war.”"
        answer: "<latin>NĒ</latin>"
  - tossup:
      question: "What pontifex maximus led the mob that killed Tiberius Gracchus and many of his supporters?"
      answer: "(P. CORNELIUS) SCIPIO NASICA (SERAPIO)"
    boni:
      - question: "Who said “If Gracchus intended to seize the government, he has been justly slain.”?"
        answer: "(P. CORNELIUS) SCIPIO AEMILIANUS (AFRICANUS MINOR)"
      - question: "Who was suspected of murdering Aemilianus when he died suddenly and unexpectedly?"
        answer: "SEMPRONIA (HIS WIFE and GRACCHUS’ SISTER)"
  - tossup:
      question: "Change the phrase <latin>Crassus dīves</latin> to the genitive singular"
      answer: "<latin>CRASSĪ DĪVITIS</latin>"
    boni:
      - question: "Change the phrase <latin>vetus Catō</latin> to the dative singular"
        answer: "<latin>VETERĪ CATŌNĪ</latin>"
      - question: "Change the phrase <latin>aequor atrōx</latin> to the accusative singular"
        answer: "<latin>AEQUOR ATRŌX</latin>"
  - tossup:
      question: "On what mountain did Heracles build a funeral pyre for himself?"
      answer: "MT. OETA"
    boni:
      - question: "What herald was killed by Heracles because he was the one who brought the poisoned robe to the hero?"
        answer: "LICHAS"
      - question: "Who promised Heracles that he would marry Iole?"
        answer: "HYLLUS"
  - tossup:
      question: "Listen carefully to the following passage, which I will read twice; then answer in LATIN the question about it: <latin>Ōlim poēta domum amīcī vēnit ut rogāret num sē adiuvāret. Servus negāvit magistrum domī esse, sed poēta intellēxit servum mentīrī. Postrīdiē cum īdem amīcus domum poētae vēnisset, poēta, cui nōn erat servus, ipse iānuam eī patefēcit. Quem simulac vīderat, vultū immōtō poēta exclāmāvit, “domī nōn est.”</latin>  <latin>Quid negāvit servus?</latin> "
      answer: "<latin>MAGISTRUM / DOMINUM (SUUM / AMĪCUM) DOMĪ ESSE / ADESSE</latin>"
    boni:
      - question: "Cūr poēta servō <latin>nōn imperāvit ut iānuam aperīret?</latin> "
        answer: "<latin>NŌN / NŪLLUM HABĒBAT SERVUM / SERVUS EĪ NŌN ERAT</latin>"
      - question: " <latin>Quid poēta amīcō dīxit?</latin>"
        answer: "DOMĪ <latin>NŌN EST / SĒ DOMĪ NŌN ESSE</latin>"
  - tossup:
      question: "Who is the author of the only Latin novel that has survived to us in its entirety?"
      answer: "(L.) APULEIUS"
    boni:
      - question: "What is the title of Apuleius’ romance novel?"
        answer: "<title><latin>METAMORPHOSES</latin> / <latin>METAMORPHOSEON LIBER</latin> / <latin>ASINUS AUREUS</latin></title> / GOLDEN <title>ASS</title>"
      - question: " What is the title of the speech Apuleius used to defend himself against the charge of witchcraft?"
        answer: "<title><latin>APOLOGY</latin></title> <latin>/</latin> <title><latin>APOLOGIA</latin></title> /<title><latin>APULEI PLATONICI PRO SE DE MAGIA LIBER</latin></title>"
  - tossup:
      question: "What satirist was a close friend of the epigrammatist Martial?"
      answer: "(DECIMUS IUNIUS) <emphasis>JUVENAL</emphasis>IS"
    boni:
      - question: "Which of Juvenal’s satires contains the famous tirade against the immorality and the vices of women?"
        answer: "SATIRE"
      - question: "6 Which of the following is described in Juvenal’s Satire 15: (A) the general decline in study and the wretched conditions in which the writers of the day are forced to live; (B) the dinner given by the rich Virro and the humiliating situation of the clients invited; or (C) an episode of cannibalism that took place in Egypt and was provoked by religious fanaticism?"
        answer: "THE EPISODE OF CANNIBALISM IN EGYPT / “C”"
  - tossup:
      question: "What mortal was able to trick Death and lock him in a dungeon?"
      answer: "SISYPHUS"
    boni:
      - question: "What happened on Earth while Death was chained and locked up?"
        answer: "NO ONE COULD DIE"
      - question: "Who was sent by the gods to free Death?"
        answer: "ARES / MARS"
  - tossup:
      question: "Using <latin>imperō</latin>, say in Latin: I ordered Titus to come"
      answer: "<latin>IMPERĀVĪ TITŌ UT VENĪRET / IMPERĀVĪ UT TITUS VENĪRET</latin>"
    boni:
      - question: "Name TWO other verbs which take an indirect command"
        answer: "<latin>HORTOR, MONEŌ, PERSUĀDEŌ, PETŌ, ROGŌ, POSTULŌ, ŌRŌ, MANDŌ</latin>"
      - question: "Now say in Latin: I fear that Titus is not coming"
        answer: "<latin>VEREOR / TIMEŌ / METUŌ UT TITUS VENIAT</latin>"
  - tossup:
      question: "At what annual festival did two youths, dressed only in aprons of goatskin, run around the Palatine Hill striking women with goatskin thongs?"
      answer: "<latin>LUPERCĀLIA</latin>"
    boni:
      - question: "On what day was <latin>Lupercālia</latin> celebrated?"
        answer: "FEBRUARY"
      - question: "15 In honor of what god was <latin>Lupercālia</latin> celebrated<latin>?</latin>"
        answer: "FAUNUS"
