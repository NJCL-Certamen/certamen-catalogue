        answer: "THOUGHT TO BE VERY FAITHFUL & LOYAL"
      - question: "and/or COULD BE TRAINED EARLIER THAN MOST SLAVES What was the general term for all of the slaves who worked in the master’s residence in Rome?"
        answer: "<latin>FAMILIA URBANA</latin>"
  - tossup:
