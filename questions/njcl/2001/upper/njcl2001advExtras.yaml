tournament: "NJCL Certamen"
year: 2001
division: "Advanced"
round: "Extra Questions"
questions:
  - tossup:
      question: "Listen carefully to the following passage, which I will read twice; then answer in LATIN the question about it: <latin>Novō bellō cum Gallīs exortō, ingens Gallus prōvōcāvit ūnum ex Rōmānīs ut sēcum armīs pugnāret. Marcus Valerius, tribūnus mīlitum, sē obtulit. Cum Valerius armātus prōcēderet, corvus suprā dextrum bracchium sēdit. Mox, pugnā commissā, corvus ex bracchiīs volāvit et oculōs Gallī oppugnāvit. Ita accidit ut Gallus facile ā Valeriō interficēretur.</latin>  <latin>Quis constituit pugnāre cum Gallō ingentī?</latin>"
      answer: "(MARCUS) VALERIUS"
    boni:
      - question: "Quid erat mīrābile dē <latin>Valeriō prōgrediente?</latin> "
        answer: "<latin>CORVUS SEDĒBAT SUPRĀ DEXTRUM BRACCHIUM</latin>"
      - question: " <latin>Quō modō Valerius facile superāre potuit?</latin> "
        answer: "<latin>CORVUS OCULŌS GALLĪ OPPUGNĀVIT</latin>"
  - tossup:
      question: "Of <latin>rēte, nimbus, vitta, fornāx</latin>, and <latin>lātifundium</latin>, which is described in this Latin sentence: <latin>Est locus ubi vāsa fictilia coquuntur</latin>"
      answer: "<latin>FORNĀX</latin>"
    boni:
      - question: ". . . <latin>Est īnstrūmentum quō avēs, ferae, et piscēs capiuntur</latin>"
        answer: "<latin>RĒTE</latin>"
      - question: ". . . <latin>Est ligāmentum capitis quō antīquī crīnēs cingēbant</latin>"
        answer: "<latin>VITTA</latin>"
  - tossup:
      question: "When you are recognized by the spotter, follow this direction: <latin>Simulā sonitum gallī māne.</latin> "
      answer: "STUDENT SHOULD IMITATE THE SOUND OF A ROOSTER IN THE MORNING"
    boni:
      - question: "<latin>. . . Simulāte fremitum leōnis</latin>"
        answer: "MORE THAN ONE STUDENT SHOULD IMITATE THE ROAR OF A LION"
      - question: "<latin>. . . Simulā anguem crepantem</latin>"
        answer: "ONE STUDENT SHOULD IMITATE A RATTLE SNAKE OR SNAKE THAT IS HISSING"
  - tossup:
      question: "Give the Latin verb and its meaning from which from which “tuition” is derived"
      answer: "<latin>TUEOR/TUĒRĪ</latin>"
    boni:
      - question: "<latin>-</latin> CARE FOR, WATCH OVER, PROTECT, PRESERVE, DEFEND, SUPPORT, LOOK AT, VIEW, BEHOLD . . . from which “remorse” is derived"
        answer: "<latin>MORDEŌ/MORDĒRE</latin>"
      - question: "(ask to take it back if compound is given) - BITE, CHEW, GNAW AT, CLASP, INDENT, WASH AWAY, PAIN, HURT . . . from which “collision” is derived"
        answer: "<latin>LAEDŌ/LAEDERE</latin>"
  - tossup:
      question: "Give the principal parts and the meaning of the Latin verb at the root of “toga,” “detective,” and “tegument.”"
      answer: "<latin>TEGŌ, TEGERE, TĒXĪ, TĒCTUM</latin> - HIDE, CONCEAL, PROTECT, DEFEND"
    boni:
      - question: "Give the principal parts and the meaning of the Latin verb at the root of “texture,” “context,” and “textile.”"
        answer: "<latin>TEXŌ, TEXERE, TEXUĪ, TEXTUM</latin> - WEAVE, PLAIT, FRAME, CONSTRUCT, FABRICATE, MAKE, COMPOSE"
      - question: "What derivative of <latin>texō, texere</latin> is the biological term for “the cells forming a basic structural element of an animal or plant body?”"
        answer: "TISSUE"
  - tossup:
      question: "What Latin phrase is commonly used in English as a noun meaning “an autopsy?”"
      answer: "<latin>POST MORTEM</latin>"
    boni:
      - question: " What Latin phrase is commonly used in English to mean “after the event?”"
        answer: "<latin>POST FACTUM</latin>"
      - question: " What Latin phrase is commonly used in English to mean “after childbirth?”"
        answer: "<latin>POST PARTUM</latin>"
  - tossup:
      question: "What is the English meaning of the Washington University motto: <latin>per virtūtem vīs</latin>?"
      answer: "STRENGTH THROUGH VIRTUE/COURAGE"
    boni:
      - question: "of the University of Florida motto: <latin>Cīvium in mōribus rēī publicae salūs</latin>?"
        answer: "IN THE MORALS / TRADITIONS OF THE CITIZENS (IS) THE WELFARE/SAFETY OF THE REPUBLIC / STATE."
      - question: "or THE WELFARE OF THE STATE (DEPENDS UPON) THE MORALS OF ITS CITIZENS . . . of the motto of Texas College: <latin>per lūmen scientiae viam invenient populī</latin>?"
        answer: "THROUGH THE LIGHT OF KNOWLEDGE THE"
  - tossup:
      question: "What Latin proverb is equivalent in meaning to “blood from a stone?”"
      answer: "<latin>AB ASINŌ LĀNAM</latin>"
    boni:
      - question: "or <latin>AQUAM Ē PŪMICĪ NUNC POSTULĀS</latin>  What Latin proverb is equivalent in meaning to “where there’s smoke, there’s fire?”"
        answer: "<latin>FLAMMA FŪMŌ EST PROXIMA</latin>"
      - question: " What Latin proverb is equivalent in meaning to “a word to the wise is sufficient?”"
        answer: "<latin>VERBUM (DICTUM) SAPIENTĪ SAT(IS) EST</latin>"
  - tossup:
      question: "Change the phrase <latin>obitus celer</latin> to the genitive singular"
