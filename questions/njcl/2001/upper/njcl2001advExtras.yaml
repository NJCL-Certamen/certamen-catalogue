      question: "Listen carefully to the following passage, which I will read twice; then answer in LATIN the question about it: <latin>Novō</latin> <latin>bellō</latin> <latin>cum Gallīs exortō, ingens Gallus prōvōcāvit ūnum ex Rōmānīs ut sēcum armīs pugnāret. Marcus Valerius, tribūnus mīlitum, sē</latin> <latin>obtulit. Cum Valerius armātus prōcēderet, corvus suprā</latin> <latin>dextrum bracchium sēdit. Mox, pugnā</latin> <latin>commissā, corvus ex bracchiīs volāvit et oculōs Gallī</latin> <latin>oppugnāvit. Ita accidit ut Gallus facile ā</latin> <latin>Valeriō</latin> <latin>interficēretur.</latin>  <latin>Quis constituit pugnāre cum Gallō</latin> <latin>ingentī?</latin>"
      answer: "(MARCUS) VALERIUS"
    boni:
      - question: "Quid erat mīrābile dē <latin>Valeriō</latin> <latin>prōgrediente?</latin> "
        answer: "<latin>CORVUS SEDĒBAT SUPRĀ</latin> <latin>DEXTRUM BRACCHIUM</latin>"
      - question: " <latin>Quō</latin> <latin>modō</latin> <latin>Valerius facile superāre potuit?</latin> "
        answer: "<latin>CORVUS OCULŌS GALLĪ</latin> <latin>OPPUGNĀVIT</latin>"
  - tossup:
      question: "Of <latin>rēte</latin>, <latin>nimbus</latin>, <latin>vitta</latin>, <latin>fornāx</latin>, and <latin>lātifundium</latin>, which is described in this Latin sentence: <latin>Est locus ubi vāsa fictilia coquuntur</latin>"
