tournament: "NJCL Certamen"
year: 2001
division: "Advanced"
round: "Semifinals"
questions:
  - tossup:
      question: "Give the first person singular, pluperfect passive subjunctive of the verb <latin>accipiō</latin>"
      answer: "<latin>ACCEPTUS, -A, -UM ESSEM</latin>"
    boni:
      - question: "Change <latin>acceptus essem</latin> to the active"
        answer: "<latin>ACCĒPISSEM</latin>"
      - question: "Change <latin>accēpissem</latin> to the perfect"
        answer: "<latin>ACCĒPERIM</latin>"
  - tossup:
      question: "Who was said to have fashioned a scepter for Zeus that was eventually owned by Agamemnon?"
      answer: "HEPHAESTUS"
    boni:
      - question: "What bronze giant was also said to have been manufactured by Hephaestus?"
        answer: "TALOS"
      - question: "What piece of jewelry, fashioned by Hephaestus, brought sorrow to all who possessed it?"
        answer: "NECKLACE OF HARMONIA"
  - tossup:
      question: "<latin>Dēscrībāmus nunc proprietātēs dictiōnum in hāc sententiā: “Quis fallere possit amantem”. Cuius numerī est “amantem”?</latin>"
      answer: "SINGULĀRIS"
    boni:
      - question: "“Possit”, cuius modī <latin>est?</latin>"
        answer: "SUBIUNCTĪVĪ <latin>/ CONIUNCTĪVĪ</latin>"
      - question: "<latin>“Quis”, dīc cāsum datīvum plūrālem</latin>"
        answer: "QUIBUS"
  - tossup:
      question: "What late-Latin author was called the “Christian Juvenal” because of his satirical presentations of both Christian and pagan daily life?"
      answer: "TERTULLIAN"
    boni:
      - question: "What native of North Africa, because of his style of writing, was known as the “Christian Cicero”?"
        answer: "(L. CAECILIUS) LACTANTIUS"
      - question: "What pagan emperor had commissioned Lactantius to teach Latin rhetoric at Nicomedia?"
        answer: "DIOCLETIAN"
  - tossup:
      question: "What is the diminutive form of the noun <latin>fīlia</latin>?"
      answer: "<latin>FĪLIOLA</latin>"
    boni:
      - question: ". . . of <latin>mūnus</latin>?"
        answer: "<latin>MŪNUSCULUM</latin>"
      - question: ". . . of <latin>auris</latin>?"
        answer: "<latin>AURĪCULA</latin>"
  - tossup:
      question: "Please open your visual and study it for 10 seconds. What deity is being worshiped in this scene?"
      answer: "MITHRAS"
    boni:
      - question: "What do the raven, lion, and other costumes worn by some of the participants indicate?"
        answer: "STEPS / RANK / STATUS / DEGREE OF INITIATION"
      - question: "For what part of the worship ceremony were the participants reclining?"
        answer: "<emphasis>RITUAL</emphasis> MEAL / COMMUNION"
  - tossup:
      question: "What Roman author went to Bithynia for a year as a member of the entourage of the governor Gaius Memmius c. 57 BC?"
      answer: "(C. VALERIUS) CATULLUS"
    boni:
      - question: "On the journey to Bithynia, what was Catullus able to do which inspired the immortal words <latin>“avē atque valē!”</latin>?"
        answer: "HE VISITED THE TOMB OF HIS BROTHER"
      - question: "In Catullus 63, what meter was used instead of hexameter, the standard meter for an epic, in order to express the frenzy of the cult of Cybele?"
        answer: "GALLIAMBIC"
  - tossup:
      question: "Who was the Roman consul who landed in Africa in 256 BC and advanced within one day’s march of Carthage?"
      answer: "(ATILIUS) REGULUS"
    boni:
      - question: "Name the Spartan who commanded the Carthaginian army which defeated and captured Regulus"
        answer: "XANTHIPPUS"
      - question: "What earlier naval victory had allowed the Romans to land an army in Africa in 256 BC?"
        answer: "BATTLE OF CAPE ECNOMUS"
  - tossup:
      question: "What mortal was the father of Bellerophon?"
      answer: "GLAUCUS"
    boni:
      - question: "Who was the mother of Bellerophon?"
        answer: "EURYNOME / EURYMEDE"
      - question: "According to another version of this myth, what god was said to be the father of Bellerophon?"
        answer: "POSEIDON / NEPTUNE"
  - tossup:
      question: "Listen carefully to the following passage, which I will read twice; then answer in ENGLISH the question about it: <latin>Quattuor causās Cicerō scrīpsit cūr senectūs misera videātur: ūnam, quod ā rēbus gerendīs senem āvocet; alteram, quod corpus faciat īnfirmius; tertiam, quod senem ēripiat ferē omnibus voluptātibus; quartum quod haud procul absit ā morte.</latin>  According to Cicero, what is the second reason why old age seems wretched?"
      answer: "IT MAKES THE BODY WEAK(ER)"
    boni:
      - question: "What is the fourth reason why old age seems wretched?"
        answer: "IT ISN’T FAR FROM DEATH"
      - question: "Give one of the other reasons Cicero gives as to why old age seems wretched"
        answer: "IT PREVENTS AN OLD MAN FROM DOING THINGS IT SNATCHES AN OLD MAN FROM NEARLY ALL DESIRES"
  - tossup:
      question: "Who was the half-sister of the emperor Honorius who was taken hostage by Alaric after his sack of Rome in A"
      answer: "D."
    boni:
      - question: "Name her son who became the western emperor in A"
        answer: "D."
      - question: "425?"
        answer: "VALENTINIAN III"
      - question: "Placidia ruled in her son’s name until she was forced to the sidelines by whom?"
        answer: "AETIUS"
  - tossup:
      question: "Give a Latin antonym for the verb <latin>profiteor</latin>?"
      answer: "<latin>NEGŌ, ABNUŌ, INFITEOR</latin>"
    boni:
      - question: "Give a Latin antonym for the verb <latin>noceō</latin>?"
        answer: "(<latin>AD</latin>-)<latin>IUVŌ, SUBVENIŌ, SUCCURRŌ</latin>"
      - question: "Give a Latin antonym for the verb <latin>sin ō</latin>?"
        answer: "<latin>VETŌ, INTERDĪCŌ, PROHIBEŌ, NEGŌ</latin>"
  - tossup:
      question: "Which of the comedies of Terence was his biggest hit with the public and his greatest commercial success?"
      answer: "<title><latin>EUNYCHUS</latin> / “THE EUNUCH</title><emphasis><title>”</title></emphasis>"
    boni:
      - question: "Which of Terence’s comedies was produced successfully only after two failures?"
        answer: "<title><latin>HECYRA</latin> / “MOTHER IN LAW</title>”"
      - question: "Which of Terence’s comedies was the first to be produced?"
        answer: "<title><latin>ANDRIA</latin> / “WOMAN OF ANDROS”</title>"
  - tossup:
      question: "Translate the following sentence into English: <latin>fruor legendō</latin>"
      answer: "I ENJOY/ DELIGHT IN READING / COLLECTING / GATHERING / CHOOSING"
    boni:
      - question: "<latin>Aqua illa idōnea bibendō est</latin>"
        answer: "THAT WATER IS SUITABLE FOR DRINKING"
      - question: "Using a form of <latin>cupidus</latin> and a gerund, say in Latin: We are desirous of sailing"
        answer: "<latin>CUPIDĪ NĀVIGĀNDĪ SUMUS</latin>"
  - tossup:
      question: "In Book IX of Vergil’s <title>Aeneid</title>, who is sent by Juno to inform Turnus that it is time for him to attack the camp of Aeneas?"
      answer: "IRIS"
    boni:
      - question: "Why was it a good time for Turnus to attack Aeneas’ camp?"
        answer: "AENEAS IS AWAY (IN PALLANTEUM FINDING ALLIES)"
      - question: "What had Aeneas instructed his men to do in case the camp was attacked?"
        answer: "NOT TO ENGAGE IN BATTLE / TO STAY BEHIND THE WALLS TO HOLD THE CAMP"
  - tossup:
      question: "Who is the speaker of the following lines from Vergil’s <title>Aeneid</title>: <latin>“Iuppiter omnipotēns, precibus sī flecteris ūllīs,</latin>  <latin>aspice nōs, hoc tantum, et sī pietāte merēmur,</latin>  <latin>dā deinde augurium, pater, atque haec ōmina firmā.”</latin> "
      answer: "ANCHISES (Book II, 689-691)"
    boni:
      - question: "Who is the speaker of the following lines from Vergil’s <title>Aeneid</title>: <latin>“. . . tuus, Ō rēgīna, quid optēs</latin>  <latin>explōrāre labor; mihi iussa capessere fās est.”</latin>"
        answer: "AEOLUS (Book I, 76-77)"
      - question: "Who is the speaker of the following lines from Vergil’s <title>Aeneid</title>: <latin>“. . . nāvīs, quae forte parātae,</latin>  <latin>corripiunt, onerantque aurō: portantur avārī Pygmaliōnis opēs pelagō; dux fēmina factī.”</latin>"
        answer: "VENUS (Book I, 362-364)"
  - tossup:
      question: "In Book I of the <title>Iliad</title>, what two heralds were sent to take Briseis away from Achilles?"
      answer: "TALTHYBIUS & EURYBATES"
    boni:
      - question: "Of which of the Greek leaders was Talthybius the chielf herald?"
        answer: "AGAMEMNON"
      - question: "Which of the family members of Agamemnon traveled to Aulis for a sacrifice in the company of Talthybius?"
        answer: "IPHIGEN(E)IA"
  - tossup:
      question: "Translate the following sentence into English: <latin>Scīsne cūr hī versūs mīrābilēs dictū sint</latin>?"
      answer: "DO YOU KNOW WHY THESE VERSES ARE WONDERFUL TO SAY?"
    boni:
      - question: "Using a supine, say in Latin: Do you know whether the games are horrible to see?"
        answer: "<latin>SCĪSNE UTRUM / NUM / SĪ LŪDĪ HORRIBILĒS VĪSŪ SINT</latin>? / <latin>SCĪSNE UTRUM / NUM / SĪ SPECTĀCULA / MŪNERA HORRIBILIA VĪSŪ SINT</latin>?"
      - question: "Other than <latin>dīcere</latin> and <latin>vidēre</latin>, there are only five more verbs in classical Latin that commonly have ablative supines. Name one"
        answer: "<latin>AUDĪRE, FACERE, INVENĪRE, MEMORĀRE, NASCĪ</latin>"
  - tossup:
      question: "After the Second Punic War into what two provinces was the conquered territory in Spain divided?"
      answer: "<latin>HISPANIA CITERIOR & ULTERIOR / NEARER & FURTHER SPAIN</latin>"
    boni:
      - question: "Name the three provinces into which Augustus divided Hispania"
        answer: "<latin>TARRACONENSIS, BAETICA, & LUSITANIA</latin>"
      - question: " Which of these provinces was roughly equivalent to Hispania Ulterior?"
        answer: "<latin>BAETICA</latin>"
  - tossup:
      question: "Give the Latin noun and its meaning which is at the root of “primeval.”"
      answer: "<latin>AEVUM</latin> - AGE, ETERNITY"
    boni:
      - question: ". . . of “estuary.”"
        answer: "<latin>AESTUS</latin> - TIDE, HEAT, FIRE, SURGE, PASSION"
      - question: "Give the Latin verb and its meaning which is at the root of “esteem.”"
        answer: "<latin>AESTIMŌ/AESTIMĀRE</latin>"
