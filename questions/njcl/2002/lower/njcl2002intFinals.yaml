tournament: "NJCL Certamen"
year: 2002
division: "Intermediate"
round: "Finals"
questions:
  - tossup:
      question: "Which emperor recommended the following to his successor and to the Roman people: restrict manumissions and the granting of citizenship, only choose officials of proven ability, keep the boundaries of the empire at its present limits?"
      answer: "AUGUSTUS"
    boni:
      - question: "Name the member of the imperial family who read the final revision of the <title><latin>Rēs Gestae</latin></title> to the Senate after Augustus’ death"
        answer: "DRUSUS (II)"
      - question: "In what town in Italy did Augustus die?"
        answer: "NOLA"
  - tossup:
      question: "What disguise did Zeus employ to trick Cronus into drinking a special potion that made him regurgitate?"
      answer: "<emphasis>CRONUS’</emphasis> CUPBEARER"
    boni:
      - question: "Who had prepared this special potion?"
        answer: "METIS"
      - question: "What was the first thing that came out of Cronus’ mouth after he drank this potion?"
        answer: "THE ROCK THAT RHEA USED TO TRICK CRONUS / OMPHALOS / NAVEL OF EARTH"
  - tossup:
      question: "What use of the genitive case can be found in the following sentence: <latin>Caesar, vir dīcendī</latin> <latin>perītus, omnibus persuādēre poterat</latin>?"
      answer: "SPECIAL ADJECTIVES / OBJECTIVE"
    boni:
      - question: "What use of the genitive case can be found in the following sentence: <latin>Invēnērunt circulum pūrī</latin> <latin>aurī</latin>?"
        answer: "MATERIAL / QUALITY / DESCRIPTION"
      - question: "What use of the genitive case can be found in the following sentence: <latin>Mē</latin> <latin>nēquitiae condemnō</latin>?"
        answer: "CHARGE / PENALTY /"
  - tossup:
      question: "Which of these expressions does <emphasis>not</emphasis> mean “from the beginning?” <latin>ab orīgine, ab ōvō, ab īmō</latin> <latin>pectore, ab initiō</latin>, ā <latin>prīncipiō</latin> <latin>AB ĪMŌ</latin> <latin>PECTORE</latin> What does <latin>ab īmō</latin> <latin>pectore</latin> means?"
      answer: "FROM THE (BOTTOM OF THE) HEART"
    boni:
      - question: "What is the Latin expression that means “from start to finish?”"
        answer: "<latin>AB ŌVŌ</latin> <latin>(USQUE) AD MĀLA</latin>"
  - tossup:
      question: "What king of Eryx entertained Aeneas and his followers in Sicily on their way to Italy?"
      answer: "ACESTES / AEGESTES"
    boni:
      - question: "From where had Aeneas just departed when he was received by Acestes the second time in Sicily?"
        answer: "CARTHAGE / AFRICA / DIDO’S PLACE"
      - question: "What important event took place in Acestes’ kingdom during this visit?"
        answer: "FUNERAL GAMES OF ANCHISES"
  - tossup:
      question: "In 191 BC, whom did Antiochus commission to equip a squadron of ships in Phoenicia to fight against Rhodes and the Romans?"
      answer: "HANNIBAL"
    boni:
      - question: "Name the Roman admiral who defeated Antiochus’ allies near Myonnessus"
        answer: "(LUCIUS AEMILIUS) REGILLUS"
      - question: "With whom did Antiochus unsuccessfully negotiate peace terms in 190 BC?"
        answer: "L. SCIPIO (BROTHER OF AFRICANUS) AND/OR SCIPIO AFRICANUS"
  - tossup:
      question: "Using your knowledge of this year’s NJCL motto, say in Latin, “Let us measure.”"
      answer: "<latin>MĒTIĀMUR</latin>"
    boni:
      - question: "Again, using your knowledge of the motto, say in Latin, “Let us not measure great men by fortune.”"
        answer: "<latin>NĒ</latin> <latin>MĒTIĀMUR MAGNŌS HOMINĒS FORTŪNĀ</latin>"
      - question: "  Finally, using your knowledge of this year’s motto, say in Latin, “We measure great students by knowledge, not by height.”"
        answer: "<latin>MAGNŌS DISCIPULŌS SCIENTIĀ</latin> <latin>MĒTĪMUR, NŌN ALTITŪDINE</latin>"
  - tossup:
      question: "Give a synonym of the noun <latin>dictum</latin>"
      answer: "<latin>VERBUM</latin>, <latin>VOCĀBULUM</latin>, <latin>MANDĀTUM</latin>, <latin>IMPERĀTUM</latin>, <latin>SENTENTIA</latin>"
    boni:
      - question: " . . . of <latin>multitūdō</latin>"
        answer: "<latin>VULGUS</latin>, <latin>PLĒBES</latin>, <latin>CŌPIA</latin>, <latin>POPULUS</latin>, <latin>TURBA</latin>"
      - question: ". . . of <latin>liber</latin>"
        answer: "<latin>LIBELLUS</latin>, <latin>VOLŪMEN</latin>, <latin>CŌDEX</latin>, <latin>CHARTA</latin>"
  - tossup:
      question: "What emotion is expressed by the Latin interjection <latin>vae</latin>?"
      answer: "WOE, SADNESS, ANGUISH, DISTRESS"
    boni:
      - question: "0ō?"
        answer: "ECSTASY, HAPPINESS, JOY, PLEASURE"
      - question: "Using an interjection, say in Latin, “Alas! My money has been stolen.”"
        answer: "<latin>EHEU! PECŪNIA MEA ABLĀTA EST</latin>"
  - tossup:
      question: "Of these vehicles: <latin>essedum, plaustrum, cisium, carpentum, raeda</latin>, which had two, solid-wood wheels with no spokes, was uncovered, and was used to transport large loads?"
      answer: "<latin>PLAUSTRUM</latin>"
    boni:
      - question: " For what special purpose was a <latin>petōritum</latin> used during a triumph?"
        answer: "TO CARRY THE SPOILS (<latin>N. B.</latin> THE <latin>TRIUMPHĀTOR</latin> DIDN’T RIDE IN IT)"
      - question: "What was the name of the luxurious traveling carriage which contained a bed for long journeys?"
        answer: "<latin>CARRŪCA</latin> / <latin>DORMITORIA</latin>"
  - tossup:
      question: "  According to the events of the Trojan War, list events A, B, and C in chronological order from earliest to latest"
      answer: "B, C, A"
    boni:
      - question: "List events D, E, and F in chronological order from earliest to latest"
        answer: "F, D, E"
      - question: "Of events A through F, which one was caused by Paris?"
        answer: "A"
  - tossup:
      question: "Which of the following, if any, is NOT derived from <latin>claudō</latin>? clause, cloister, clutter, sluice, exclusive CLUTTER What derivative of <latin>claudō</latin> means \"one who shuts himself off from human contact\"?"
      answer: "RECLUSE"
    boni:
      - question: "What derivative of <latin>claudō</latin> is a medical condition that is a faulty closure of the teeth?"
        answer: "MALOCCLUSION"
  - tossup:
      question: "Of the words <latin>aquila, corōna, lūcerna, collis</latin> and <latin>lītus</latin>, which does the following Latin sentence describe: <latin>Est terra proxima marī, quae flūctibus alluitur LĪTUS</latin> . . . <latin>Est ornāmentum capitis ā</latin> <latin>rēgibus gestum</latin>"
      answer: "CORŌNA"
    boni:
      - question: ". . . <latin>Rapāx et pugnācissima, in nīdō</latin> <latin>dormit</latin>"
        answer: "AQUILA"
  - tossup:
      question: "What Eleusinian prince was able to drive the winged chariot of Demeter?"
      answer: "TRIPTOLEMUS"
    boni:
      - question: "What knowledge did Triptolemus, acting as emissary for Demeter, share with the other mortals?"
        answer: "HOW TO SOW (WHEAT)"
      - question: "What king of Scythia was transformed into a lynx because he tried to kill Triptolemus?"
        answer: "LYNCUS"
  - tossup:
      question: "Listen carefully to the following selection from Cornelius Nepos about Cato the Elder,   which I will read twice, and then answer IN LATIN the question that follows: <latin>Catō</latin> <latin>Māior ab adulescentiā</latin> <latin>cōnfēcit ōrātiōnēs. Cum senex esset, historiās</latin>  <latin>scrībere instituit. Eārum sunt librī</latin> <latin>septem. Prīmus continet rēs gestās rēgum</latin>  <latin>populī</latin> <latin>Rōmānī; secundus et tertius, unde quaeque cīvitās Ītalica orta sit;</latin>  <latin>quam ob rem Nepōs omnēs “Ōrīginēs” vidētur appellāvisse</latin>. <latin>Catōne senescente, quid Catō</latin> <latin>facere coepit?</latin>"
      answer: "HISTORIĀS SCRĪBERE"
    boni:
      - question: "Quae rēs sunt in prīmō <latin>librō</latin> <latin>historiārum?</latin>"
        answer: "RĒS GESTAE RĒGUM (POPULĪ <latin>RŌMĀNĪ)</latin>"
      - question: "Quod nōmen hīs septem librīs historiārum dedit Cat<latin>ō?</latin>"
        answer: "<latin>ŌRĪGINĒS</latin>"
  - tossup:
      question: "Translate the following sentence into Latin: We know that Cicero can be heard"
      answer: "<latin>SCĪMUS CICERŌNEM AUDĪRĪ</latin> <latin>POSSE</latin>"
    boni:
      - question: " Translate the following sentence into Latin using a passive periphrastic: The citizens must hear the words of Cicero"
        answer: "<latin>VERBA CICERŌNIS CĪVIBUS AUDIENDA SUNT</latin>"
      - question: "Translate the following sentence into Latin using a purpose clause: The citizens came to the forum to hear the words of Cicero"
        answer: "<latin>CĪVĒS AD/IN FORUM VĒNĒRUNT UT VERBA CICERŌNIS AUDĪRENT</latin>"
  - tossup:
      question: "During a conflict with the Latins, who established a priestly college known as the <latin>fetiālēs</latin> when he detailed the proper rituals for obtaining divine approval for the declaration of a war?"
      answer: "ANCUS MARCIUS"
    boni:
      - question: "Which of the seven hills of Rome was annexed by Ancus Marcius to accommodate the Latin refugees coming into Rome?"
        answer: "AVENTINE"
      - question: "Which hill did Ancus Marcius annex for defense reasons?"
        answer: "JANICULUM"
  - tossup:
      question: "Who died from shock after drinking from a cold spring?"
      answer: "T(E)IRESIAS"
    boni:
      - question: "What was the name of this spring?"
        answer: "TELTHUSA / TELPHUSA"
      - question: "What daughter of Teiresias was also a prophetess?"
        answer: "MANTO / DAPHNE"
  - tossup:
      question: "Name the lieutenant Sulla left in command of his troops in Asia when he left for Italy in 83 BC"
      answer: "(LUCIUS LICINIUS) MURENA"
    boni:
      - question: "Who levied about 100,000 recruits in Italy which later failed to stop Sulla’s return from Asia in 83 BC?"
        answer: "(GAIUS PAPIRIUS) CARBO"
      - question: "What sort of men were chosen to be in Sulla’s corps of 10,000 personal bodyguards called the <latin>Corneliī</latin>?"
        answer: "FREED SLAVES (FORMER SLAVES OF [HIS] PROSCRIBED ENEMIES)"
  - tossup:
      question: "For the verb <latin>dō</latin>, <latin>dare</latin>, give the correct form of the present active participle to agree with the noun form <latin>puerōs</latin>"
      answer: "<latin>DANTĒS (-ĪS)</latin>"
    boni:
      - question: "For the verb <latin>crepō</latin>, give the correct form of the present active participle to agree with the noun form <latin>serpentium</latin>"
        answer: "<latin>CREPANTIUM</latin>"
      - question: "For the verb <latin>pōtō</latin>, give the correct form of the present active participle to agree with the noun form <latin>bōbus</latin>"
        answer: "<latin>PŌTANTIBUS</latin>"
