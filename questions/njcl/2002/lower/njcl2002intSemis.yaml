tournament: "NJCL Certamen"
year: 2002
division: "Intermediate"
round: "Semifinals"
questions:
  - tossup:
      question: "When you are recognized by the spotter, perform the following commands: <latin>Surge et clāmā</latin> <latin>Anglicē</latin> <latin>“Ad infīnītum et ultr</latin><latin>ā!”</latin> "
      answer: "STUDENT SHOULD STAND AND SHOUT “TO INFINITY AND BEYOND”"
    boni:
      - question: "<latin>Simulantēs mūrēs, rogāte mē</latin> <latin>Anglicē</latin> <latin>sī</latin> <latin>plūs cāseī</latin> <latin>habeām</latin>"
        answer: "MORE THAN ONE STUDENT SHOULD ASK THE MODERATOR “DO YOU HAVE <emphasis>MORE</emphasis> CHEESE” WHILE PRETENDING TO BE MICE"
      - question: "<latin>Stāns in tuā</latin> <latin>sellā</latin> <latin>et tollēns ambās manūs, clāmā</latin> <latin>Anglicē</latin> <latin>tē</latin> <latin>rēgem orbis terrārum esse</latin>"
        answer: "STUDENT SHOULD STAND ON THE CHAIR AND SHOUT “I AM KING OF THE WORLD” WHILE RAISING BOTH HANDS"
  - tossup:
      question: "Give the Latin verb at the ultimate root of \"frail.\""
      answer: "<latin>FRANGŌ</latin>"
    boni:
      - question: "of \"influenza.\""
        answer: "<latin>FLUŌ</latin>"
      - question: "of \"souffle.\""
        answer: "<latin>FLŌ</latin>"
  - tossup:
      question: "Which emperor rebuilt the Hagia Sophia in Constantinople, put down the “Nika” rebellion, but is best known for his codification of law in the 6th century AD?"
      answer: "JUSTINIAN"
    boni:
      - question: "Which emperor codified Roman law in A"
        answer: "D."
      - question: "438?"
        answer: "THEODOSIUS II"
      - question: "Who was Justinian’s influential wife?"
        answer: "THEODORA"
  - tossup:
      question: "What king of the Taphians was immortal as long as a strand of gold hair remained on his head?"
      answer: "PTERELAUS"
    boni:
      - question: "What deity, the grandfather of Pterelaus, implanted the golden hair?"
        answer: "POSEIDON / NEPTUNE"
      - question: "Who killed Pterelaus by cutting this strand of gold hair?"
        answer: "(HIS DAUGHTER) COMAETHO"
  - tossup:
      question: "Translate the following sentence into English: <latin>Marcus Antōnius dīxit Caesarem bonum esse</latin>"
      answer: "MARK ANTONY SAID THAT CAESAR WAS GOOD / A GOOD MAN"
    boni:
      - question: "<latin>Marcus Antōnius negāvit Brūtum et Cassium capiendōs esse.</latin> "
        answer: "MARK ANTONY DENIED THAT BRUTUS AND CASSIUS MUST BE CAPTURED / MARK ANTONY SAID THAT BRUTUS AND CASSIUS MUST NOT BE CAPTURED"
      - question: "<latin>Marcus Antōnius sperāvit sē</latin> <latin>cōnsulem futūrum esse.</latin> "
        answer: "MARK ANTONY HOPED THAT HE WOULD BE CONSUL / (Also accept translations such as “gonna”, “going to”, or “about to”)"
  - tossup:
      question: "What use of the ablative case can be found in the following sentence: <latin>Sulla amplissimō</latin> <latin>genere nātus est</latin>?"
      answer: "ORIGIN / SOURCE"
    boni:
      - question: "What use of the ablative case can be found in the following sentence: <latin>Hostēs exercitū</latin> <latin>superātō</latin> <latin>expugnāre nōn potuit imperātor</latin>?"
        answer: "ABSOLUTE"
      - question: "What use of the ablative case can be found in the following sentence: <latin>Mea māter meā</latin> <latin>fēlīcitāte laeta est</latin>?"
        answer: "CAUSE"
  - tossup:
      question: "When a boy was officially recognized as an adult, he put away his <latin>insignia puerītiae</latin>, or his emblems of boyhood. These consisted of his <latin>bulla</latin> and what other article of clothing?"
      answer: "<latin>TOGA PRAETEXTA</latin>"
    boni:
      - question: "  What was the name of the tunic a young man would wear under the <latin>toga virīlis</latin> at this ceremony?"
        answer: "<latin>TUNICA RĒCTA / TUNICA REGILLA</latin>"
      - question: " The ceremony of manhood usually took place at the age of sixteen. During which festival was it common for many Romans to hold these rituals?"
        answer: "<latin>LĪBERĀLIA</latin>"
  - tossup:
      question: "Excluding its compounds, give an antonym of <latin>crēdō</latin>"
      answer: "<latin>DUBITŌ, PENDEŌ</latin>"
    boni:
      - question: "Excluding its compounds, give an antonym of <latin>laudō</latin>"
        answer: "<latin>DĒRIDEŌ, LŪDŌ, LŪDIFICOR, IRRĪDEŌ, VITUPERŌ</latin>"
      - question: "Excluding its compounds, give an antonym of <latin>pellō</latin>"
        answer: "<latin>(RE)TRĀHŌ, (RE)VELLŌ</latin>"
  - tossup:
      question: "Who incurred the wrath of Jupiter when he claimed to be the king of the gods himself?"
      answer: "SALMONEUS"
    boni:
      - question: "How did Salmoneus imitate the sound of thunder?"
        answer: "HE DRAGGED (BRONZE) JARS (AND DRIED HIDE) BEHIND HIS CHARIOT / HAD JARS TIED TO THE WHEELS"
      - question: "What did Salmoneus use to imitate Jupiter’s thunderbolts?"
        answer: "TORCHES"
  - tossup:
      question: "Listen carefully to the following passage, which I will read twice, and answer IN ENGLISH the question that follows: <latin>Rēgibus expulsīs, Rōmānīs placuit imperium summum ā</latin> <latin>cōnsulibus tenērī.</latin>  <latin>Duo cōnsulēs aequae potestātis prō</latin> <latin>ūnō</latin> <latin>rēge creātī</latin> <latin>sunt. Sī</latin> <latin>ūnus magistrātus</latin>  <latin>malus esse vīsus est, alter quī</latin> <latin>potestātem similem habuit alterī</latin> <latin>persuadēre</latin>  <latin>poterat. Cōnsulēs ūnum annum sōlum populō</latin> <latin>servīvērunt nē</latin> <latin>nimium</latin>  <latin>potestātis colligerent</latin>. According to this passage, what did the consuls hold?"
      answer: "SIMILAR POWER / HIGHEST POWER"
    boni:
      - question: "Why was it safer to have two consuls?"
        answer: "IF ONE CONSUL SEEMED BAD, THE OTHER CONSUL CAN PERSUADE HIM OTHERWISE"
      - question: "Why did the consuls serve only one year?"
        answer: "SO THAT THEY WOULD NOT GAIN TOO MUCH POWER"
  - tossup:
      question: "What Latin phrase commonly used in English means “by virtue of the office?”"
      answer: "<latin>EX OFFICIŌ</latin>"
    boni:
      - question: "What Latin term commonly used in English means “retired”?"
        answer: "<latin>ĒMERITUS</latin> / <latin>ĒMERITA</latin>"
      - question: "What Latin phrase commonly used in English means “an impartial spokesman in a court of law” or “a friend of the court?”"
        answer: "<latin>AMĪCUS CŪRIAE</latin>"
  - tossup:
      question: "What year saw the Praetorians murder two emperors, three generals claim the throne for themselves, and the imperial throne auctioned by the guards for 25,000 sesterces per man?"
      answer: "A."
    boni:
      - question: "D.193 Which of the three would-be usurpers of Didius Iulianus was commander of the troops on the Danube?"
        answer: "SEPTIMIUS SEVERUS"
      - question: "In which provincial city was Septimius Severus born?"
        answer: "LEPCIS/LEPTIS MAGNA"
  - tossup:
      question: "Change <latin>faciēbāmus</latin> to the passive"
      answer: "<latin>FIĒBĀMUS</latin>"
    boni:
      - question: "Change <latin>fiēbāmus</latin> to the subjunctive"
        answer: "<latin>FIERĒMUS</latin>"
      - question: "Change <latin>fierēmus</latin> to the perfect"
        answer: "<latin>FACTĪ</latin> <latin>(-AE,</latin>"
  - tossup:
      question: "According to Homer, which of the following, if any, was NOT killed by Achilles: Hector, Hippodamas, Iphition, Priam?"
      answer: "PRIAM"
    boni:
      - question: "In whose form did Athena trick Hector into fighting the mighty Achilles?"
        answer: "DEIPHOBUS’"
      - question: "Who killed Priam?"
        answer: "NEOPTOLEMUS / PYRRHUS"
  - tossup:
      question: "Which governor in Gaul, when he rebelled and raised an army in A"
      answer: "D."
    boni:
      - question: "68, forced Nero to cancel his tour of Asia Minor and Egypt and then return to Rome?"
        answer: "(C. IULIUS) VINDEX"
      - question: "To whom had Nero given a special command in A"
        answer: "D."
      - question: "67 to quell the Jewish rebellion?"
        answer: "(T. FLAVIUS) VESPASIANUS/VESPASIAN"
      - question: "Which general did Nero recall from Britain in A"
        answer: "D."
      - question: "61 because he was jealous of his successes there?"
        answer: "SUETONIUS PAULINUS"
  - tossup:
      question: "(Inscription given here for reference. Do not read) <latin>Raedarum custos numquam latravit inepte;</latin>  <latin>Nunc silet et cineres vindicat umbra suos</latin>  Whose grave does this inscription mark?"
      answer: "A DOG’S (If the answer “a guard” or “a guard of carriages” is given, prompt for more information)"
    boni:
      - question: "What was the dog’s job when he was alive, and how did he perform in his duties?"
        answer: "HE GUARDED CARRIAGES & HE NEVER BARKED AT THE WRONG TIME / DID A GOOD JOB / NEVER BARKED FOOLISHLY"
      - question: "Translate the second line of the inscription"
        answer: "NOW HE IS SILENT AND HIS GHOST AVENGES / VINDICATES HIS ASHES"
  - tossup:
      question: "During which of his labors did Heracles anger the goddess Artemis?"
      answer: "CERYNITIAN / CERYNEAN HIND / STAG / DEER (prompt for more information if “3rd labor” is given)"
    boni:
      - question: "What was special about the physical appearance of the Cerynitian Hind?"
        answer: "GOLDEN HORNS / BODY BIGGER THAN BULLS / GIANT BODY"
      - question: "Onto whom did Heracles direct Artemis’ anger?"
        answer: "EURYSTHEUS"
  - tossup:
      question: "Using an ablative absolute, translate into Latin the phrase “after the commander had been captured.”"
      answer: "<latin>LEGĀTŌ</latin> <latin>/ DUCE / IMPERĀTŌRE CAPTŌ</latin> <latin>/ RAPTŌ</latin>"
    boni:
      - question: "Using an ablative absolute, translate into Latin the phrase “while I was walking in the forest.”"
        answer: "<latin>MĒ</latin> <latin>IN SILVĀ</latin> <latin>AMBULANTE</latin>"
      - question: "Using an ablative absolute, translate into Latin the phrase “during the consulship of Cicero and Antonius.”"
        answer: "<latin>CICERŌNE (ET) ANTONIŌ</latin> <latin>CONSULIBUS</latin>"
  - tossup:
      question: "Which enemy commander did the Romans defeat at the Metaurus River in 207 BC?"
      answer: "HASDRUBAL"
    boni:
      - question: "Who were the Roman commanders there?"
        answer: "(C.) CLAUDIUS NERO AND (LIVIUS) SALINATOR"
      - question: "Which of Hannibal’s brothers was defeated near Genoa in 205 BC?"
        answer: "MAGO"
  - tossup:
      question: "According to Ovid, into what was Ascalaphus transformed?"
      answer: "OWL"
    boni:
      - question: "Who transformed Ascalaphus into an owl?"
        answer: "PROSERPINA"
      - question: "Why did Proserpina transform Ascalaphus into an owl?"
        answer: "HE TOLD PLUTO THAT PROSERPINA HAD EATEN THE POMEGRANATE"
