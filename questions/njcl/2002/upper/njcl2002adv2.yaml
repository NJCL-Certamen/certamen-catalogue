tournament: "NJCL Certamen"
year: 2002
division: "Advanced"
round: "Round 2"
questions:
  - tossup:
      question: "Who innovated the genre of historical epic poetry by conceiving each book of his <title><latin>Annālēs</latin></title> as a single unit within an overall narrative?"
      answer: "(QUINTUS) ENNIUS"
    boni:
      - question: "What other innovation did Ennius make to the genre of Roman historical epic poetry?"
        answer: "USING DACTYLIC HEXAMETER / CONTINOUS NARRATIVE"
      - question: "What ability did Ennius often emphasize when referring to himself as having three personalities, or <latin>tria corda</latin>?"
        answer: "HIS ABILITY TO SPEAK"
  - tossup:
      question: "Translate: <latin>nōn dubitāvit quīn Germānī oppugnātūrī essent.</latin> "
      answer: "HE DID NOT DOUBT THAT THE GERMANS WERE GOING TO / WOULD ATTACK"
    boni:
      - question: "Translate: <latin>mē impedīvit quōminus in urbem inīrem</latin>"
        answer: "HE PREVENTED ME FROM GOING INTO THE CITY"
      - question: "Translate: <latin>num quisquam dubitāre potuit quīn sapiēns essēs?</latin> "
        answer: "SURELY NO ONE COULD HAVE DOUBTED THAT YOU WERE WISE? NO ONE COULD HAVE DOUBTED THAT YOU WERE WISE, COULD THEY?"
  - tossup:
      question: "Who sent a flying ram with golden fleece to rescue Phrixus and Helle?"
      answer: "NEPHELE"
    boni:
      - question: "Who was about to sacrifice Phrixus and Helle when they were rescued by the flying ram?"
        answer: "(THEIR FATHER) ATHAMAS"
      - question: "To what capital city of Colchis did the ram carry Phrixus?"
        answer: "AEA"
  - tossup:
      question: "Which emperor reigned eight months, reversed the anti-Christian laws of Julian, and died in Bithynia in A"
      answer: "D."
    boni:
      - question: "364?"
        answer: "JOVIAN"
      - question: "For five points each, who were co-emperors after Jovian?"
        answer: "VALENTINIAN (I) AND VALENS"
  - tossup:
      question: "On a tombstone, what is the English meaning of the Latin abbreviation <latin>aet.</latin>?"
      answer: "(OF THE) AGE <latin>/</latin> AGED"
    boni:
      - question: "What is the meaning of <latin>H. I. S</latin>.?"
        answer: "HERE LIES BURIED (<latin>HĪC IACET SEPULTUS</latin>)"
      - question: "What is the meaning of <latin>d.s.p.</latin>?"
        answer: "DIED WITHOUT ISSUE / OFFSPRING / CHILDREN (<latin>DĒCESSIT SINE PRŌLE</latin>)"
  - tossup:
      question: "Who provides a glimpse of the decadent life style of the Romans in his depiction of a banquet held by a wealthy freedman of annoying crudeness named Trimalchio?"
      answer: "PETRONIUS"
    boni:
      - question: "Of what larger work was this <latin>cēna Trīmalchiōnis</latin> an episode?"
        answer: "<title><latin>SATYRICON</latin></title>"
      - question: "Under what emperor did Petronius serve as <latin>arbiter ēlegantiae</latin>?"
        answer: "NERO"
  - tossup:
      question: "What was the Latin name for the courtyard outside the front door of a <latin>domus</latin> where clients awaited their patron for their morning <latin>salūtātiō</latin>?"
      answer: "<latin>VESTIBULUM</latin>"
    boni:
      - question: "What was the name for a slave who watched the doorway?"
        answer: "<latin>ŌSTIĀRIUS/IANITOR</latin>"
      - question: "What was the Latin term for the curtain which separated the <latin>vestibulum</latin> from the atrium?"
        answer: "<latin>VĒLUM</latin>"
  - tossup:
      question: "What two cases can be used with the preposition <latin>tenus</latin>?"
      answer: "ABLATIVE & GENITIVE"
    boni:
      - question: "What case is used with the preposition <latin>penes</latin>?"
        answer: "ACCUSATIVE"
      - question: "What case is used with the preposition <latin>cōram</latin>?"
        answer: "ABLATIVE"
  - tossup:
      question: "Give the Latin verb at the ultimate root of \"fondue.\""
      answer: "<latin>FUNDŌ</latin>"
    boni:
      - question: "of \"function.\""
        answer: "<latin>FUNGOR</latin>"
      - question: ". . . of \"future.\""
        answer: "<latin>SUM</latin>"
  - tossup:
      question: "Listen carefully to the following story, which I will read twice, then answer IN ENGLISH the question that follows: <latin>Prīmā lūce nōnnūllae ancillae in meum cubiculum ruērunt quae mihi</latin>  <latin>dicerent Londinium ardēre. statim ē lectō prosiluī ac ad proximam</latin>  <latin>fenestram cucurrī ut cognoscerem quid accideret; sed, rātus incendium</latin>  <latin>adhūc procul abesse, rūrsus cubitum īvī ac aliquot hōrās aequō animō dormīvī. Ego, quod monitīs ancillārum nōn crēdedī, nunc in ordine sum ut</latin>  <latin>rēgem mortuōrum videam.</latin>  Why did the narrator of this story run to the nearest window?"
      answer: "TO FIND OUT WHAT WAS HAPPENING"
    boni:
      - question: "What mistake did the narrator make?"
        answer: "HE WENT BACK TO SLEEP / IGNORED THE WARNINGS OF THE MAIDS /MISJUDGED THE DISTANCE OF THE FIRE"
      - question: "What is the result of this mistake?"
        answer: "HE IS NOW (IN LINE TO MEET THE KING OF THE) DEAD"
  - tossup:
      question: "Why was it important for Diomedes and Odysseus to steal the horses of King Rhesus?"
      answer: "TO PREVENT THEM FROM DRINKING FROM THE RIVER SCAMANDER (or XANTHUS BECAUSE HE WOULD BECOME INVINCIBLE AND WOULD BE ABLE TO STORM THE GREEK CAMP WITH SUCCESS)"
    boni:
      - question: "What two Olympians had suggested to Odysseus and Diomedes that they undertake their expedition that night and kill Rhesus before he and his horses drank from the river?"
        answer: "HERA & ATHENA"
      - question: "Who had revealed the location of King Rhesus’ camp?"
        answer: "DOLON"
  - tossup:
      question: "Change the phrase <latin>sedīle pulchrum</latin> to the accusative"
      answer: "<latin>SEDĪLE PULCHRUM</latin>"
    boni:
      - question: "Change <latin>sedīle pulchrum</latin> to the plural"
        answer: "<latin>SEDĪLIA PULCHRA</latin>"
      - question: "Change <latin>sedīlia pulchra</latin> to the genitive"
        answer: "<latin>SEDĪLIUM PULCHRŌRUM</latin>"
  - tossup:
      question: "Where was Odysseus when he was first informed of the havoc created by Penelope’s suitors?"
      answer: "EDGE OF OCEAN / LAND OF THE CIMMERIANS / (AT THE ENTRANCE OF THE) UNDERWORLD"
    boni:
      - question: "With whom was Odysseus wanting to consult while in the land of the Cimmerians?"
        answer: "T(E)IRESIAS"
      - question: "What must Teiresias be allowed to do before he could make his prophecy known to Odysseus?"
        answer: "DRINK THE BLOOD (OF THE SACRIFICED RAM & EWE)"
  - tossup:
      question: "After which battle in 260 BC did the Romans erect in the forum a column decorated with Carthaginian <latin>rostra</latin>?"
      answer: "MYLAE"
    boni:
      - question: "Which Roman commander led the invasion of Africa but was defeated and captured in 255 BC?"
        answer: "(M. ATILIUS) REGULUS"
      - question: "Who was the Spartan mercenary whom the Carthaginians hired to fight Regulus and the Romans?"
        answer: "XANTHIPPUS"
  - tossup:
      question: "What literary device, excluding any forms of alliteration, is demonstrated in the following line: <latin>multaque per caecam congressī proelia noctem</latin>?"
      answer: "SYNCHESIS"
    boni:
      - question: "What literary device, excluding any forms of alliteration, is demonstrated in the following line: <latin>clāmōrēs simul horrendōs ad sīdera tollit</latin>?"
        answer: "HYPERBOLE"
      - question: "  What literary device, excluding any forms of alliteration, is demonstrated in the following lines: <latin>sub pedibusque deae clipeīque sub orbe</latin>?"
        answer: "CHIASMUS"
  - tossup:
      question: "<latin>Dēscrībāmus nunc proprietātēs dictiōnum in hāc sententiā: “vīvāmus, mea Lesbia, atque amēmus.” Cuius coniugātiōnis est “amēmus”?</latin>"
      answer: "PRĪMAE"
    boni:
      - question: "“amēmus”, cuius modī <latin>est?</latin>"
        answer: "SUBIŪNCTĪVĪ <latin>/ CONIŪNCTĪVĪ</latin>"
      - question: "<latin>“vīvāmus”, cuius temporis est?</latin>"
        answer: "PRAESENTIS"
  - tossup:
      question: "Whose poetic genius and his affinity for expressions of intense emotions can be found in his poems addressed to a certain lady named Cynthia?"
      answer: "(SEXTUS) PROPERTIUS"
    boni:
      - question: "With what member of Messalla Corvinus’ literary circle did Propertius have close ties?"
        answer: "(P.) OVID(IUS NASO) A"
      - question: "funeral song dedicated to what relative of Augustus can be found in Book 3 of Propertius’ elegies?"
        answer: "MARCELLUS"
  - tossup:
      question: "Say in Latin: “Would that I were sleeping at home today!”"
      answer: "<latin>UTINAM HODIĒ DOMĪ DORMĪREM</latin>"
    boni:
      - question: ". . . Say in Latin “Would that I had gone to sleep yesterday!” using a supine"
        answer: "<latin>UTINAM HERĪ DORMĪTUM Ī(V)ISSEM / ĪSSEM</latin>"
      - question: " . . . Say in Latin “Would that I were not saying these things!”"
        answer: "<latin>UTINAM NĒ / NŌN HAEC DĪCEREM</latin>"
  - tossup:
      question: "What king of Thebes was such a fantastic musician that rocks were charmed to move on their own accord?"
      answer: "AMPHION"
    boni:
      - question: "Name the character identified with the letter “B”"
        answer: "ANTIOPE"
      - question: "Name the character identified with the letter “D”"
        answer: "ZETHUS"
  - tossup:
      question: "What king of Thebes was such a fantastic musician that rocks were charmed to move on their own accord?"
      answer: "AMPHION"
    boni:
      - question: "Who was Amphion’s mother?"
        answer: "ANTIOPE"
      - question: "Who was Amphion’s twin brother?"
        answer: "ZETHUS"
  - tossup:
      question: "Against which enemy leader did the following generals fight? Calpurnius Bestia, Postumius Albinus, Caecilius Metellus, Gaius Marius JUGURTHA Who betrayed Jugurtha to the Romans?"
      answer: "BOCCHUS (KING OF MAURETANIA)"
    boni:
      - question: "Which of Marius’ junior officers negotiated Bocchus’ betrayal?"
        answer: "(L. CORNELIUS) SULLA"
