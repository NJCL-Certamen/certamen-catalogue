tournament: "NJCL Certamen"
year: 2002
division: "Advanced"
round: "Round 3"
questions:
  - tossup:
      question: "What was the emblem of dignity that gave Hippolyta supreme power over the Amazons?"
      answer: "HER GIRDLE"
    boni:
      - question: "Who had given Hippolyta this girdle?"
        answer: "ARES / MARS"
      - question: "According to some sources, what Athenian king took Hippolyta as his wife?"
        answer: "THESEUS"
  - tossup:
      question: "Translate into English: <latin>cum mīlitēs Rōmānī hostēs vīdissent, impetum statim fēcērunt</latin>"
      answer: "WHEN / SINCE THE ROMAN SOLDIERS HAD SEEN THE ENEMY THEY IMMEDIATELY MADE AN ATTACK / ATTACKED"
    boni:
      - question: "Translate into English: <latin>cum hostēs victī essent, Rōmānī tamen per silvās cautē progrediēbantur</latin>"
        answer: "ALTHOUGH THE ENEMY/ENEMIES HAD BEEN DEFEATED, NEVERTHELESS THE ROMANS WERE PROCEEDING/PROCEEDED CAUTIOUSLY"
      - question: "Translate into English: <latin>laetissimus eram cum audīvī cōnsulem tē factum esse</latin>"
        answer: "I WAS VERY HAPPY WHEN/AFTER I HEARD THAT YOU HAD BECOME / BEEN MADE CONSUL"
  - tossup:
      question: "You are standing in the <latin>Forum Rōmānum</latin> in AD 350. Name the three major basilicas you can see from that point"
      answer: "BASILICA JULIA, BASILICA AEMILIA, BASILICA OF MAXENTIUS / CONSTANTINE / <latin>BASILICA NOVA</latin>"
    boni:
      - question: " Directly behind which temple would you see the <latin>Rēgia</latin>?"
        answer: "TEMPLE OF DIVINE JULIUS / TEMPLE OF CAESAR"
      - question: "The arch of Titus was directly adjacent to which very large temple?"
        answer: "TEMPLE OF VENUS & ROME"
  - tossup:
      question: "The writing of what Roman satirist displays a thorough blending of Greek and Roman culture during Scipio Aemilianus’ generation and became the model for later Roman satirists?"
      answer: "LUCILIUS’"
    boni:
      - question: "Of which member of the so-called “First Triumvirate” was Lucilius a great-uncle?"
        answer: "POMPEY (THE GREAT)"
      - question: "Who modeled his satires of a journey to Brundisium and of a chance encounter with a Bore on Lucilius’ works?"
        answer: "HORACE"
  - tossup:
      question: "What use of the genitive case can be found in the following sentence: <latin>sacerdōs nescīvit sē nimium vīnī bibisse</latin>?"
      answer: "PARTITIVE / OF THE WHOLE"
    boni:
      - question: "What use of the genitive case can be found in the following sentence: <latin>sacerdōs est homō minimae virtūtis</latin>?"
        answer: "DESCRIPTION / QUALITY / CHARACTERISTIC"
      - question: "What use of the genitive case can be found in the following sentence: <latin>sacerdōs</latin>  <latin>dēsīderium ōtī semper ostendit</latin>?"
        answer: "OBJECTIVE"
  - tossup:
      question: "According to Ovid’s <title>Metamorphoses</title>, what punishment was given to King Erysichthon?"
      answer: "INSATIABLE HUNGER / ATE HIMSELF (TO DEATH)"
    boni:
      - question: "Whose wrath earned Erysichthon this dreadful punishment?"
        answer: "CERES’ / DEMETER’S / DRYADS’"
      - question: "What was the name of his daughter whom Erysichthon sold over and over to provide food for himself?"
        answer: "MESTRA"
  - tossup:
      question: "From what defeat was Caesar fleeing when he reached Pharsalus in 48 BC?"
      answer: "DYRRACHIUM"
    boni:
      - question: "After what victory by Caesar in 46 BC did Cato the Younger commit suicide?"
        answer: "THAPSUS"
      - question: "Who led the Pompeians against Caesar at Thapsus?"
        answer: "METELLUS SCIPIO"
  - tossup:
      question: "What author reached levels of psychological analysis never reached before when he professed his distress over sin in his <title>Confessions</title>?"
      answer: "(SAINT) AUGUSTINE"
    boni:
      - question: "In which of his works does Augustine discuss the errors of paganism and the existence of an earthly city and a heavenly city?"
        answer: "<title><latin>DĒ</latin> <latin>CĪVITĀTE DE</latin></title>Ī <title>/ (ON / ABOUT) THE CITY OF GOD</title>"
      - question: "In what city in Roman Africa did Augustine serve as bishop?"
        answer: "HIPPO"
  - tossup:
      question: "Give an antonym of <latin>minuō</latin>"
      answer: "<latin>AUGEŌ, MULTIPLICŌ, AMPLIFICŌ, AMPLIŌ, EXTENDŌ, CRĒSCŌ</latin>"
    boni:
      - question: "of <latin>imperō</latin>"
        answer: "<latin>PĀREŌ, OBOEDIŌ, OBTEMPERŌ, AUSCULTŌ</latin>"
      - question: "of <latin>āmittō</latin>"
        answer: "<latin>INVENIŌ, REPERIŌ, NANCĪSCOR</latin>; (RE- CON- Ē-AD- PRŌ-)<latin>VOCŌ, CITŌ, APPELLŌ</latin>"
  - tossup:
      question: "What Latin phrase is being used when a potential employer asks for your <latin>c.v.</latin>?"
      answer: "<latin>CURRICULUM VĪTAE</latin>"
    boni:
      - question: " <latin>A c.v.</latin> to employers who do not know their Latin is called a resume. What Latin verb is the root of resume?"
        answer: "<latin>SUMŌ, SUMERE</latin>"
      - question: "What is the Latin phrase for your daily allowance for travel in your new job ?"
        answer: "<latin>PER DIEM</latin>"
  - tossup:
      question: "Give the syncopated form of “<latin>amāverō.</latin>”"
      answer: "<latin>AMĀRŌ</latin>"
    boni:
      - question: "Give the syncopated form of “<latin>dēlēvisse.</latin>”"
        answer: "<latin>DĒLĒSSE</latin>"
      - question: "Give the syncopated form of “<latin>audīvistī.</latin>”"
        answer: "<latin>AUDĪSTĪ</latin>"
  - tossup:
      question: "Give the Latin noun at the ultimate root of \"defy.”"
      answer: "<latin>FIDĒS</latin>"
    boni:
      - question: ". . . of \"suffocate.\""
        answer: "<latin>FAUCES</latin>"
      - question: ". . . of \"fuel.\""
        answer: "<latin>FOCUS</latin>"
  - tossup:
      question: "Why did Priam venture to Achilles’ tent in Book XXIV of the <title>Iliad</title>?"
      answer: "TO RANSOM / PLEAD FOR / GET BACK HECTOR’S BODY"
    boni:
      - question: "Which of the Olympians led old Priam to Achilles’ tent?"
        answer: "HERMES / MERCURY"
      - question: "As old Priam pleaded with Achilles for the return of Hector’s body, his speech was so poignant that it reminded Achilles of whom?"
        answer: "(HIS FATHER) PELEUS"
  - tossup:
      question: "What Roman author wrote a scientific encyclopedia entitled <title><latin>Historia Natūrālis</latin></title>?"
      answer: "PLINY THE ELDER / C. PLINIUS SECUNDUS"
    boni:
      - question: "To what future emperor did Pliny the Elder dedicate his <title><latin>Historia Natūrālis</latin></title>?"
        answer: "TITUS"
      - question: "What later historian modeled his work on Germany on Pliny the Elder’s <title><latin>Bellae</latin></title>  <title><latin>Germāniae</latin></title>?"
        answer: "TACITUS"
  - tossup:
      question: "Who am I? I was a senator who succeeded an assassinated emperor. I gave the order to execute Petronius Secundus, a praetorian who conspired to kill my successor. I adopted my co-regent and successor in AD 97. I died in AD 98"
      answer: "(M. COCCEIUS) NERVA"
    boni:
      - question: "You are looking at imperial busts. Which two of these emperors ruled consecutively?  "
        answer: "(THE ORDER IS NOT SPECIFICALLY ASKED FOR HERE) C (TRAJAN) AND B (HADRIAN)"
      - question: "Arrange the letters of these emperors in chronological order, earliest to latest"
        answer: "C (TRAJAN), B (HADRIAN), A (MARCUS AURELIUS) AND D (CARACALLA)"
  - tossup:
      question: "Who am I? I was a senator who succeeded an assassinated emperor. I gave the order to execute Petronius Secundus, a praetorian who conspired to kill my successor. I adopted my co-regent and successor in AD 97. I died in AD 98"
      answer: "(M. COCCEIUS) NERVA"
    boni:
      - question: "Name the next two emperors and the years of their reigns"
        answer: "TRAJAN (AD 98-117) HADRIAN (AD 117 - 138)"
      - question: "Name the next two emperors and the years of their reigns"
        answer: "ANTONINUS PIUS (138 - 161) MARCUS AURELIUS (161 - 180)"
  - tossup:
      question: "Listen carefully to the following passage, which I will read twice, then answer IN LATIN the question that follows: <latin>Herculis templum est apud Agrigentōs nōn longē</latin> ā <latin>forō. Ibi est ex aere statua ipsīus Herculis quā numquam cīvēs vīdērunt pulchriōrem. Quādam nocte cum duo latrōnēs ad hoc templum vēnissent auferendae stātuae grātiā, stātua subitō magnum strepitum tollit tamquam vīva. Duo itaque fūgērunt, nescientēs callidissimum custōdem quī sē post stātuam cēlāvisset clāmōrem sustulisse.</latin>  <latin>Ex quō statua facta est?</latin>"
      answer: "(EX) AERE"
    boni:
      - question: "Cūr latrōnēs ad templum vēnerant?"
        answer: "UT STĀTUM AUFERRENT/ AUFERENDAE STĀTUAE GRĀTIĀ <latin>(CAUSĀ)</latin>"
      - question: " <latin>Quid latrōnēs terruit?</latin>"
        answer: "(MAGNUM) STREPITUM STATUA CLĀMĀBAT / CLĀMĀVIT / CLĀMŌREM / VŌCEM STATUAE"
  - tossup:
      question: "Who in mythology, born immortal and with white hair, eventually had only one eye and one tooth remaining among them?"
      answer: "GRAEAE / GRAY SISTERS / DEINO, ENYO, PE(M)PHREDO"
    boni:
      - question: "Who were the parents of the Graeae?"
        answer: "PHORCYS AND CETO"
      - question: "What information did Perseus ascertain from the Graeae?"
        answer: "THE LOCATION OF THE NYMPHS WHO WOULD PROVIDE HIM WITH WEAPONS (NECESSARY FOR KILLING MEDUSA)/ THE LOCATION OF THE GORGONS"
  - tossup:
      question: "<latin>Respondē Latīnē: Quot sunt ter vīgintī?</latin>"
      answer: "SEXĀGINTĀ"
    boni:
      - question: "<latin>. . . Quot sunt bis centum?</latin>"
        answer: "<latin>DŪCENTĪ / -AE / -A</latin>"
      - question: ". . . Quot sunt quater mille passūs?"
        answer: "QUATTUOR MĪLIA PASSUUM"
  - tossup:
      question: "What Roman poet, because of his involvement in the battle at Philippi, had his family farm confiscated by the members of the 2nd Triumvirate?"
      answer: "Q. HORATIUS FLACCUS / HORACE"
    boni:
      - question: "Into whose literary circle did Vergil introduce Horace <latin>circa</latin> 38 BC?"
        answer: "MAECENAS’"
      - question: "What present did Maecenas give to Horace, giving him financial peace of mind and a place of refuge from the business and inconveniences of Roman life?"
        answer: "A FARM IN THE SABINE TERRITORY"
  - tossup:
      question: "Of <latin>pānis silīgneus, pānis castrēnsis, pānis sordidus,</latin> and <latin>pānis rūsticus</latin>, which is made   of pure wheat flour?"
      answer: "<latin>PĀNIS SILĪGNEUS</latin>"
    boni:
      - question: "One of the factors contributing to the quality of a bread are the settings of a mill. What is the Latin term for the mill used to grind flour?"
        answer: "<latin>MOLA</latin>"
      - question: "What Latin term refers to the upper stone of a mill?"
        answer: "<latin>CATILLUS</latin>"
