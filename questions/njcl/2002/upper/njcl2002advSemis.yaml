tournament: "NJCL Certamen"
year: 2002
division: "Advanced"
round: "Semifinals"
questions:
  - tossup:
      question: "Who brought tears to Odysseus’ eyes as he sang about the Trojan War?"
      answer: "DEMODOCUS"
    boni:
      - question: "At what king’s court did this occur?"
        answer: "ALCINOUS’"
      - question: "What modern name is given to the island believed to have been Scheria, the kingdom of Alcinous?"
        answer: "CORFU / CORCYRA"
  - tossup:
      question: "Translate the verb in this sentence into Latin: If only I hadn’t spoken those words"
      answer: "<latin>DĪXISSEM / LOCŪTUS (-A) ESSEM</latin>"
    boni:
      - question: " Translate the verb in this sentence into Latin: Would that you were king"
        answer: "<latin>ESSĒS</latin>"
      - question: "Translate the verb in this sentence into Latin: If only we hadn’t sneezed"
        answer: "<latin>STERNUISSĒMUS</latin>"
  - tossup:
      question: "In 479 BC, during a defeat at the hands of the people of Fidenae near the Cremera river, one detachment of troops, which was completely wiped out, consisted entirely of members of which Roman <latin>gēns</latin> and its clients?"
      answer: "<latin>GĒNS FABIA/</latin>THE FABIAN CLAN"
    boni:
      - question: "Around 420 BC who personally slew the king of the Veians and dedicated his captured armor to Jupiter Feretrius?"
        answer: "(A. CORNELIUS) COSSUS"
      - question: "Who was this vanquished king?"
        answer: "TOLUMNIUS"
  - tossup:
      question: "What feat did Theseus have to accomplish to prove that he was the son of Poseidon?"
      answer: "HAD TO RETRIEVE A GOLD RING THROWN INTO THE SEA BY MINOS"
    boni:
      - question: "Who gave Theseus a crimson robe and a crown in the palace of Poseidon?"
        answer: "AMPHITRITE"
      - question: "What Athenian girl was Theseus trying to defend from the lust of Minos when this “paternity” challenge took place?"
        answer: "ERIBOEA"
  - tossup:
      question: "What author’s book presents itself as collections of notes taken on evenings during a winter spent near Athens?"
      answer: "(AULUS) GELLIUS"
    boni:
      - question: "What was the Latin title of this work?"
        answer: "<title><latin>NOCTĒS ATTICAE</latin></title>"
      - question: "What famous story of a slave and a lion can be found in the <title><latin>Noctēs Atticae</latin></title>?"
        answer: "ANDROCLUS / ANDROCLES (& THE LION)"
  - tossup:
      question: "Translate: <latin>Nēmō scīvit cūr imperātor auctōritāte suā ūtī dubitāret.</latin> "
      answer: "NO ONE KNEW WHY THE EMPEROR / COMMANDER WAS HESITATING TO USE HIS AUTHORITY / POWER"
    boni:
      - question: "Translate: <latin>Nēmō est tam senex quīn sē annum arbitrētur posse vīvere</latin>"
        answer: "NO ONE IS SO OLD WHO THINKS (THAT) HIS IS NOT ABLE TO LIVE FOR A YEAR"
      - question: "or NO ONE IS SO OLD AS TO THINK... Translate: <latin>Sunt quī mortem meliōrem vītā esse dīcant.</latin> "
        answer: "THERE ARE THOSE WHO (MAY) SAY THAT DEATH IS BETTER THAN LIFE"
  - tossup:
      question: "At a Roman dinner table, to what general type of food would all of the following belong? <latin>rhombus, ostreae, mullus</latin> SEAFOOD Name 2 of the 3 main ingredients in the dish known as <latin>tyrotarīchus</latin>.  "
      answer: "(SALT) FISH, EGGS AND CHEESE"
    boni:
      - question: "What was the highly regarded delicacy <latin>glīs</latin>?"
        answer: "DORMOUSE / DORMICE"
  - tossup:
      question: "Give the Latin noun at the ultimate root of \"alarm.\""
      answer: "<latin>ARMA</latin>"
    boni:
      - question: ". . . of \"aisle.\""
        answer: "(SPELL a-i-s-l-e) <latin>ĀLA</latin>"
      - question: ". . . of \"oriole.\""
        answer: "<latin>AURUM</latin>"
  - tossup:
      question: "Give the 3rd person plural, perfect, active, subjunctive for the verb <latin>pangō</latin>"
      answer: "<latin>PEPIGERINT</latin>"
    boni:
      - question: "Change <latin>pepigerint</latin> to the singular pluperfect"
        answer: "<latin>PEPIGISSET</latin>"
      - question: "Change <latin>pepigisset</latin> to the passive"
        answer: "<latin>PACTUS (-A, -UM) ESSET</latin>"
  - tossup:
      question: "When two Roman envoys were sent to discuss the pirates in the Adriatic, which Illyrian ruler ignored and rejected them and may have arranged the death of one of them?"
      answer: "TEUTA"
    boni:
      - question: "What Greek adventurer betrayed Teuta by surrendering to the Romans the island of Corfu which he was sent to protect for the queen?"
        answer: "DEMETRIUS(OF PHAROS)"
      - question: "When Demetrius later betrayed the Romans as well, to which king did he flee seeking refuge?"
        answer: "PHILLIP V"
  - tossup:
      question: "You now have 15 seconds to examine the passages on your own. Please identify the author of passage B"
      answer: "(PUBLIUS) OVID(IUS NASO)"
    boni:
      - question: "passage D"
        answer: "VITRUVIUS (POLLIO)"
      - question: "passage E"
        answer: "(LUCIUS ANNAEUS) SENECA THE <emphasis>YOUNGER</emphasis>"
  - tossup:
      question: "What use of the dative case can be found in the following sentence: <latin>mihi hunc errōrem extorquērī volō</latin>?"
      answer: "SEPARATION"
    boni:
      - question: "What use of the dative case can be found in the following sentence: <latin>quid tibi vīs, īnsāne</latin>?"
        answer: "ETHICAL / REFERENCE / PERSONAL INTEREST"
      - question: "What poetic use of the dative case can be found in the following sentence: <latin>Karthāginī iam nōn ego nūntiōs mittam superbōs</latin>?"
        answer: "LOCAL / DIRECTION / PLACE TO WHICH"
  - tossup:
      question: "In Book IV of the <title>Aeneid</title>, what old nurse does Dido ask to find her sister?"
      answer: "BARCE / BARCA"
    boni:
      - question: "Who was this sister of Dido?"
        answer: "ANNA"
      - question: "Old Barce served as nurse to Dido and what other person?"
        answer: "SYCHAEUS / SICARBAS"
  - tossup:
      question: "Who was Tiberius’ grandson whom Caligula adopted early in his reign and later beheaded?"
      answer: "(TIBERIUS) GEMELLUS"
    boni:
      - question: "Which of his praetorian prefects did Caligula execute in A"
        answer: "D."
      - question: "37?"
        answer: "MACRO"
      - question: "Which general plotted to overthrow Caligula in A"
        answer: "D."
      - question: "39, perhaps in complicity with Agrippina the Younger?"
        answer: "(LENTULUS) GAETULICUS"
  - tossup:
      question: "Listen carefully to the following story, which I will read twice, then answer IN ENGLISH   the question about it: <latin>Fuit ōlim faber quī fēcit pōculum vitreum quod frangī nōn poterat. Voluit igitur id Caesarī dare. Admissus est ad Caesarem. Deinde pōculum offerēbat Caesarī sed subitō id proiēcit in pavīmentum. Caesar perterritus erat. at faber sustulit pōculum integrum dē terrā quāsī pōculum aēneum. Tum Caesar fabrō dīxit: “Num quis alius scit tale pōculum facere?” Cum faber negāvit, Caesar iussit fabrum interficī quod voluerit esse sōlus quī pōculum eius generis habēret.</latin>  What gift was the craftsman offering Caesar?"
      answer: "AN UNBREAKABLE CUP"
    boni:
      - question: "How did the craftsman prove that the cup was unbreakable?"
        answer: "THREW ONTO THE GROUND"
      - question: "Why did Caesar kill the craftsman?"
        answer: "BECAUSE CAESAR WANTED TO BE THE ONLY PERSON TO HAVE A CUP OF THIS KIND"
  - tossup:
      question: "Whose 6-book work was the first serious work of didactic poetry in the world of Latin literature?"
      answer: "(TITUS) LUCRETIUS (CARUS)"
    boni:
      - question: "To whom was Lucretius’ <title><latin>Dē</latin></title> <title><latin>Rērum Natūr</latin></title>ā dedicated?"
        answer: "(C.) MEMMIUS"
      - question: "Who mentions in a biography that Lucretius’ <title><latin>Dē</latin></title> <title><latin>Rērum Natūr</latin></title>ā was edited, after his death, by Cicero?"
        answer: "JEROME"
  - tossup:
      question: "Of what great exploit were the following members: Castor, Pollux, Jason, Theseus, Peleus, and Atalanta?"
      answer: "CALYDONIAN BOAR HUNT"
    boni:
      - question: "Which of the heroes mentioned in the toss-up accidentally killed Eurytion with his spear during the hunt?"
        answer: "PELEUS"
      - question: "Which of the participants of the Calydonian Boar Hunt not mentioned in the toss-up was the killer of Toxeus and Plexippus?"
        answer: "MELEAGER"
  - tossup:
      question: "What is meant when a recipe states that one should add salt <latin>ad gustum</latin>?"
      answer: "TO (ONE’S) TASTE"
    boni:
      - question: "What is the meaning of the Latin expression <latin>dē gustibus nōn est disputandum</latin>? (literally) ABOUT TASTES THERE IS NO DISPUTING THERE’S NO ACCOUNTING FOR TASTES THERE’S NO POINT IN ARGUING ABOUT TASTE (S). What is the meaning of the Latin expression <latin>sal sapit omnia</latin>?"
        answer: "SALT / WIT SEASONS EVERYTHING."
  - tossup:
      question: "<latin>Quid Anglicē significat</latin> “<latin>parturiō</latin>”?"
      answer: "BE PREGNANT, BE IN LABOR, GIVE BIRTH TO, MEDITATE ACTIONS, GIVE FORTH"
    boni:
      - question: "“<latin>quassō</latin>”?"
        answer: "SHAKE, BRANDISH, WAVE, SHATTER, DISTURB, WEAKEN (<emphasis>not “strike”</emphasis>)"
      - question: "“<latin>fatīscor</latin>”?"
        answer: "GAPE, SPLIT, CRACK, FALL APART"
  - tossup:
      question: "What is the Latin title of Cicero’s earliest extant speech?"
      answer: "<title><latin>PRŌ</latin></title> <title><latin>QUĪNCTI</latin></title>Ō"
    boni:
      - question: "In which of his speeches did Cicero offend Chrysogonus, a powerful freedman of Sulla?"
        answer: "<title><latin>PRŌ</latin></title> <title><latin>(SEXTŌ) ROSCIŌ</latin></title> <title><latin>AMERĪN</latin></title>Ō"
      - question: "<emphasis>or</emphasis> <title><latin>PRŌ</latin></title> <title><latin>SEXTŌ</latin></title> <title><latin>ROSCI</latin></title>Ō (OR any English translation of those answers) In which of his speeches did Cicero attack Clodia, the sister of his bitter enemy Clodius?"
        answer: "<title><latin>PRŌ</latin></title> <title><latin>CAELI</latin></title>Ō"
