tournament: "NJCL Certamen"
year: 2003
division: "Intermediate"
round: "Round 2"
questions:
  - tossup:
      question: "What bride, despite her father's urging her to stay in Sparta, went with her new husband to live on the island of Ithaca?"
      answer: "PENELOPE"
    boni:
      - question: "Whose form did Athena assume to protect and guide Penelope's son Telemachus?"
        answer: "MENTES OR MENTOR"
      - question: "Which of Penelope’s suitors organized a plot to ambush Telemachus?"
        answer: "ANTINOUS"
  - tossup:
      question: "What is the meaning of the motto of the state of Maine: <latin>Dīrigō.</latin>"
      answer: "I DIRECT/ LEAD / POINT THE WAY"
    boni:
      - question: "... of the state of New Mexico: <latin>Crēscit Eundō</latin>"
        answer: "IT GROWS BY GOING / AS IT GOES"
      - question: "... of the state of Idaho: <latin>Estō Perpetua</latin>"
        answer: "LET IT BE / MAY IT LAST FOREVER"
  - tossup:
      question: "What Italian city had the best harbor on the country's east coast, became a Latin colony in 244 BC, and was eventually the terminus of the Appian Way?"
      answer: "BRUNDISIUM/ BRINDISI"
    boni:
      - question: "What Italian city was the original southern terminus of the Appian Way?"
        answer: "CAPUA"
      - question: "What political office did Appius Claudius hold when he began the Appian Way?"
        answer: "CENSOR"
  - tossup:
      question: "What use of the genitive case is found in the following Latin sentence: <latin>Quis nostrum tibi dōnum dabit?</latin>"
      answer: "PARTITIVE / OF THE WHOLE"
    boni:
      - question: "<latin>Nēmō eōrum in Italiā remānsit</latin>"
        answer: "PARTITIVE / OF THE WHOLE"
      - question: "<latin>Reminīscāmur pristinae virtūtis quam Rōmānī quondam habuērunt</latin>"
        answer: "POSSESSION / WITH VERBS OF REMEMBERING"
  - tossup:
      question: "Which of the following characters was not one of the Argonauts? Heracles, Orpheus, Castor, Calais, Arcas, and Tiphys?"
      answer: "ARCAS"
    boni:
      - question: "After Hermes rescued Arcas from his dead mother’s womb, who reared the baby?"
        answer: "MAIA"
      - question: "By what name is Arcas known in the heavens?"
        answer: "URSA MINOR / LITTLE BEAR / ARCTOPHYLAX"
  - tossup:
      question: "What form of the comparative of the adjective <latin>malus</latin> agrees with the noun form <latin>mare</latin>?"
      answer: "<latin>PĒIUS</latin>"
    boni:
      - question: "What form of the comparative of the adjective <latin>magnus</latin> agrees with the noun form <latin>statuīs</latin>?"
        answer: "<latin>MĀIŌRIBUS</latin>"
      - question: "What form of the comparative of the adjective <latin>bonus</latin> agrees with the noun form <latin>reī</latin>?"
        answer: "<latin>MELIŌRIS</latin> OR <latin>MELIŌRĪ</latin>"
  - tossup:
      question: "Translate the following sentence into English: <latin>Crās Mīnōtaurum occīdet ad cīvēs servandōs</latin>."
      answer: "TOMORROW HE WILL KILL THE MINOTAUR TO SAVE THE CITIZENS."
    boni:
      - question: "What is the letter of the picture described by the following sentence? <latin>Ālās ingentēs cōnfēcit ex pennīs, quās cērā coniunxit et in umerīs fīliī fīxit.</latin>"
        answer: "B"
      - question: "What is the letter of the picture described by the following sentence? <latin>Arātor validōs bovēs prae sē agit.</latin>"
        answer: "D"
  - tossup:
      question: "Who cleared the pirates from the Mediterranean Sea in 67 BC?"
      answer: "POMPEY"
    boni:
      - question: "What law gave him that command?"
        answer: "<latin>LEX GABINIA</latin>"
      - question: "The following year what law gave Pompey command over the legions fighting Mithridates of Pontus?"
        answer: "<latin>LEX MANILIA</latin>"
  - tossup:
      question: "Who was the governor of Upper Germany in AD 97 when he learned that he had been adopted as the heir of the emperor Nerva?"
      answer: "TRAJAN"
    boni:
      - question: "What territory north of the Danube River did Trajan add to the Roman Empire?"
        answer: "DACIA"
      - question: "Trajan was returning to Rome after fighting what people to the east when he died in AD 117?"
        answer: "PARTHIANS"
  - tossup:
      question: "What English derivative of the Latin verb <latin>tangō, tangere</latin> means \"capable of being spread from person to person\"?"
      answer: "CONTAGIOUS"
    boni:
      - question: "... means \"untouchable or abstract\"?"
        answer: "INTANGIBLE"
      - question: "What Latin adjective related to the verb <latin>tangō</latin>, means “untouched?”"
        answer: "<latin>INTEGER / INTACTUS</latin>"
  - tossup:
      question: "<latin>Quid Anglicē significat \"tandem\"</latin>?"
      answer: "FINALLY/AT LAST/ PRAY TELL"
    boni:
      - question: "<latin>Quid Anglicē significat adverbium \"tantum\"</latin>?"
        answer: "ONLY / SO MUCH / SO GREATLY / TO SUCH A DEGREE / MERELY"
      - question: "<latin>Quid Anglicē significat adiectīvum \"tālis\"?</latin>"
        answer: "SUCH/ LIKE THAT"
  - tossup:
      question: "Who unknowingly facilitated the suicide of her sister Dido?"
      answer: "ANNA"
    boni:
      - question: "Of what city was Dido the queen?"
        answer: "CARTHAGE"
      - question: "From what city had Dido originally come?"
        answer: "TYRE"
  - tossup:
      question: "Listen carefully to the following passage, which I will read twice; then answer in ENGLISH the question about it: <latin>Propter vim atque multitūdinem pīrātārum nē mare Īnferum quidem tūtum erat ad nāvigandum. Nihil frūmentī ex Siciliā et ex Āfricā Rōmam advehēbātur. Quam ob rem pretium frūmentī semper augēbātur.</latin>  Why was the <latin>Mare Īnferum</latin> unsafe?"
      answer: "(THE STRENGTH AND NUMBER OF) PIRATES"
    boni:
      - question: "What was arriving in Rome?"
        answer: "NO GRAIN"
      - question: "What was the result?"
        answer: "GRAIN PRICES ROSE"
  - tossup:
      question: "The siege of what Spanish city prompted the Second Punic War?"
      answer: "SAGUNTUM"
    boni:
      - question: "Who led that siege?"
        answer: "HANNIBAL"
      - question: "With which Carthaginian had the Romans previously negotiated the so-called “Ebro Treaty” which supposedly assured Rome that Carthage would not cross that river with arms?"
        answer: "HASDRUBAL"
  - tossup:
      question: "Translate the following sentence into English: <latin>Mihi vidētur Marcum insānum esse</latin>"
      answer: "IT SEEMS TO ME (THAT) MARCUS IS CRAZY / INSANE"
    boni:
      - question: "<latin>Iūlius Caesar maximus imperātor Rōmānus habētur</latin>"
        answer: "JULIUS CAESAR IS CONSIDERED / HELD / DEEMED / THOUGHT (TO BE) THE GREATEST ROMAN GENERAL/COMMANDER"
      - question: "<latin>Fortasse victōrēs appellābimur</latin>"
        answer: "MAYBE/PERHAPS WE WILL BE CALLED/NAMED CHAMPIONS/WINNERS/VICTORS"
  - tossup:
      question: "Change the verb <latin>māvultis</latin> to the perfect tense"
      answer: "<latin>MĀLUISTIS</latin>"
    boni:
      - question: "Change <latin>māluistis</latin> to the future tense"
        answer: "<latin>MĀLĒTIS</latin>"
      - question: "Change <latin>mālētis</latin> to present subjunctive"
        answer: "<latin>MĀLĪTIS</latin>"
  - tossup:
      question: "In order to put all of Argus' 100 eyes to sleep, Hermes told him the story of what nymph's metamorphosis into water reeds?"
      answer: "SYRINX"
    boni:
      - question: "Whom was Argus guarding?"
        answer: "IO (INTO A HEIFER)"
      - question: "Where did Io change back into a maiden?"
        answer: "EGYPT (CANOBUS OR MEMPHIS)"
  - tossup:
      question: "For what occasion was a <emphasis>synthesis</emphasis> worn?"
      answer: "DINNER PARTY (if “dinner” is given as an answer, prompt for more specific information showing that it is a special occasion of some kind, not just any dinner)"
    boni:
      - question: "What did a Roman do with a <latin>cōdicillus</latin>?"
        answer: "WROTE ON IT / READ IT"
      - question: "... with a <latin>lātifundium</latin>?"
        answer: "FARMED IT / OWN IT / CULTIVATE IT (anything that could reasonably be done with land would be acceptable)"
  - tossup:
      question: "When you have been recognized by the spotter, perform the following command: <latin>Amplectere discipulum iūxtā tē</latin>"
      answer: "HUG THE KID NEXT TO YOU"
    boni:
      - question: "<latin>Simulāte morī</latin>"
        answer: "(AT LEAST 2) PRETEND TO DIE"
      - question: "<latin>Orīre et loquere Anglicē tē ignāvum esse</latin>"
        answer: "STUDENT RISES AND SAYS IN ENGLISH THAT HE IS LAZY/COWARDLY/ SLOTHFUL"
  - tossup:
      question: "Who was the chief priest of the Greeks at Troy?"
      answer: "CALCHAS"
    boni:
      - question: "Calchas caused Agamemnon to sacrifice his own daughter in order to gain favorable winds to set sail from what port?"
        answer: "AULIS"
      - question: "When, according to a prophecy, was Calchas doomed to die?"
        answer: "AFTER HE MET A SEER BETTER THAN HIMSELF"
