tournament: "NJCL Certamen"
year: 2003
division: "Advanced"
round: "Finals"
questions:
  - tossup:
      question: "What deity fell in love with Cyrene as he watched her wrestling with a lion?"
      answer: "APOLLO"
    boni:
      - question: "To where did Apollo whisk Cyrene away in his golden chariot?"
        answer: "LIBYA"
      - question: "What mythological bee-keeper was the son of Apollo and Cyrene?"
        answer: "ARISTAEUS"
  - tossup:
      question: "What is the meaning of the Latin word “<latin>cedo</latin>,” which is found only in the imperative mood?"
      answer: "GIVE! TELL! HAND IT OVER! COME NOW! COME ON!"
    boni:
      - question: "Besides <latin>cedite</latin>, what is the plural form of the imperative “<latin>cedo</latin>?”"
        answer: "<latin>CETTE</latin>"
      - question: "What word, borrowed from Greek, and found in Latin only in the imperative mood, means “begone?”"
        answer: "<latin>APAGE</latin>"
  - tossup:
      question: "What was the result of a <latin>comitia</latin>’s decree of <latin>aquā</latin> <latin>et ignī</latin> <latin>interdictiō</latin>?"
      answer: "EXILE <latin>/ EXILIUM</latin>"
    boni:
      - question: "A person under indictment for a criminal offense could chose to exile himself to avoid prosecution and punishment. Under the empire, however, there were two distinct types of exile which could be imposed upon a guilty party. What is the Latin term for the practice of permanently exiling someone to a specific place with loss of property and citizenship?"
        answer: "<latin>DEPORTĀTIŌ</latin>"
      - question: "What is the Latin term for exile which is not necessarily permanent and merely excludes one from a specific place, such as from Rome or Italy, and may or may not deprive one of property and citizenship"
        answer: "<latin>RELEGĀTIŌ</latin>"
  - tossup:
      question: "What author proclaims in his instructional manual that the chief purpose of reading the greatest variety of authors is to shape the orator’s style?"
      answer: "(M. FABIUS) QUINTILIAN(US)"
    boni:
      - question: "While Quintilian’s ideal orator is a <latin>vir bonus dīcendī</latin> <latin>perītus</latin> who guides the Roman Senate and the people, what roughly contemporary author is more realistic in recognizing the reduced role and the political impotence of an orator?"
        answer: "TACITUS"
      - question: "Give the Latin titles of Quintilian’s and Tacitus’ contrasting works on Latin oratory"
        answer: "<title><latin>INSTITŪTI</latin></title>Ō Ō<title><latin>RĀTŌRIA</latin></title> (QUINTILIAN) & <title><latin>DIALOGUS D</latin></title>Ē Ō<title><latin>RĀTŌRIBUS</latin></title> (TACITUS)"
  - tossup:
      question: "Which, if any, of the following English words is not derived from the same Latin verb as the others? false, infallible, fallow, fail, falter?"
      answer: "FALLOW"
    boni:
      - question: "Give the principal parts of the Latin verb at the root of the other words in the toss-up question."
        answer: "<latin>FALLŌ, FALLERE, FEFELLĪ, FALSUM</latin>"
      - question: "What English derivative of <latin>fallō, fallere</latin> means “a mistaken assumption?”"
        answer: "FALLACY"
  - tossup:
      question: "Listen carefully to the following passage about Timoleon, which I will read twice, and answer in ENGLISH the question about it: <latin>Timoleon iūdiciō</latin> <latin>omnium magnus exstitit. Nam magnā</latin> <latin>vī</latin> <latin>laborāvit ut Syrācūsānōs metū</latin> <latin>tyrannī</latin> <latin>līberāret. Cum diem suprēmum Syrācūsīs obīsset, totā</latin> <latin>celebrante Siciliā, publicē</latin> ā <latin>Syrācūsānīs in locō</latin> <latin>quod Timoleontēum appellātur, sepultus est, .</latin>  Who buried Timoleon?"
      answer: "THE SYRACUSANS / PEOPLE OF SYRACUSE"
    boni:
      - question: "What had Timoleon done for the people of Syracuse?"
        answer: "HE HAD ATTEMPTED / STRUGGLED TO FREE THEM FROM (THE FEAR OF) TYRANNY"
      - question: "Besides celebrating him when he died, what did the Syracusans do to honor Timoleon?"
        answer: "THEY NAMED HIS BURIAL PLACE FOR HIM"
  - tossup:
      question: "Which of the following did NOT fight on the side of the Trojans: Hector, Aeneas, Deiphobus, Othryoneus, Podalirius?"
      answer: "PODALIRIUS"
    boni:
      - question: "What was Podalirius’ profession?"
        answer: "DOCTOR / SPECIALIST IN MEDICINE"
      - question: "Whose hand in marriage was Othryoneus seeking when he joined the Trojans?"
        answer: "CASSANDRA’S"
  - tossup:
      question: "Using the Latin word “<latin>ōrātor</latin>” for “moderator,” translate the following sentence into Latin: “Would that the moderator were taller.”"
      answer: "<latin>(</latin><latin>Ō) SĪ</latin> / <latin>UTINAM ŌRĀTOR ALTIOR ESSET</latin>"
    boni:
      - question: "Translate the following sentence into Latin:\"No one knows what the answer is.\""
        answer: "<latin>NĒMŌ</latin> <latin>SCIT QUID SIT RESPONSUM</latin>"
      - question: ". . . \"Am I the only person who can answer?\""
        answer: "<latin>SUMNE SŌLUS (HOMO-) QUĪ</latin> <latin>RESPONDEAM/ RESPONDĒRE POSSIM?</latin>"
  - tossup:
      question: "Translate into English the following sentence, which is from the Laws of the Twelve Tables, “<latin>Viam mūniuntō</latin>.”"
      answer: "LET THEM BUILD A ROAD / THEY SHALL BUILD A ROAD! / THEY MUST BUILD A ROAD / THEY WILL BUILD A ROAD!"
    boni:
      - question: "A fragment from table eight of the Twelve Tables contains the word “<latin>testārier</latin>.” Translate that word"
        answer: "TO BEAR WITNESS / TESTIFY"
      - question: "A fragment from table eight of the Twelve Tables contains the word “<latin>faxsit</latin>.” What is the classical Latin form for this word?"
        answer: "<latin>FĒCERIT</latin>"
  - tossup:
      question: "What Roman commander, initially defeated by the Parthians, rebounded to destroy the Persian army and capture Ctesiphon in A.D. 298?"
      answer: "(GAIUS) GALERIUS (VALERIUS MAXIMIANUS)"
    boni:
      - question: "Name the Persian king who had severely defeated Galerius near Carrhae in A.D. 297"
        answer: "NARSES"
      - question: "On what river was Ctesiphon located?"
        answer: "TIGRIS"
  - tossup:
      question: "Give the letter of the passage that was written by Gaius Valerius Catullus?"
      answer: "“E”"
    boni:
      - question: "Give the letter of the passage that was written by an author who flourished in the reign of Domitian?"
        answer: "“B”"
      - question: "Which passage was written by an author who was tried for witchcraft?"
        answer: "“A”"
  - tossup:
      question: "Listen to the following four Latin statements, one of which I will perform. When you are recognized by the spotter, repeat exactly the statement which describes my actions: <latin>Saliō</latin> <latin>sicut asinus.</latin>  <latin>Stertō</latin> <latin>sēmisomnus.</latin>  <latin>Lacrimō</latin> <latin>maest</latin><latin>ē.</latin>  <latin>Ūtor flābell</latin><latin>ō.</latin>  (The moderator cools himself with a fan.)"
      answer: "<latin>ŪTOR FLĀBELLŌ</latin>"
    boni:
      - question: "<latin>Respondētē</latin> <latin>Latīnē:sī</latin> <latin>vōs omnēs cyclōpēs essētis, quot oculī</latin> <latin>vōbīs omnibus essent?</latin>"
        answer: "ALL TEAM MEMBERS MUST SAY “QUATTUOR” (OR WHATEVER NUMBER CORRESPONDS TO THE NUMBER OF TEAM MEMBERS)"
      - question: "<latin>Ūtere cāsū</latin> <latin>locātīvō</latin> <latin>ut Latīnē</latin> <latin>respondeās: Dic mihi Latīnē</latin> <latin>in quā</latin> <latin>urbe Vergilius sepultus sit</latin>"
        answer: "NEĀPŌLĪ <latin>/ NEAPŌLE</latin>"
  - tossup:
      question: "After which battle near Tusculum was a treaty drawn up that recognized Rome as <latin>primus inter pares</latin> with respect to the other city-states of Latium?"
      answer: "LAKE REGILLUS"
    boni:
      - question: "What plebeian negotiated this treaty with the Latin League?"
        answer: "SPURIUS CASSIUS"
      - question: "The Latins and Romans built an altar and sanctuary on the Aventine Hill to which deity, thus signifying Rome as the center of Latin culture and religion?"
        answer: "DIANA"
  - tossup:
      question: "Whose song about the Trojan War brought so many sorrowful memories to Odysseus that he had to conceal his tears?"
      answer: "DEMODOCUS"
    boni:
      - question: "Who noticed Odysseus’ tears and suggested that the music of Demodocus should cease?"
        answer: "ALCINOUS"
      - question: "What illicit love affair did Demodocus later sing of?"
        answer: "ARES & APHRODITE"
  - tossup:
      question: "What early Roman author demonstrated his liking for alliteration with the line <latin>“at tūba terrībilī</latin> <latin>sonitū</latin> <latin>taratantara dīxit”</latin>?"
      answer: "(Q.) ENNIUS"
    boni:
      - question: "What nephew of Ennius was also a writer of tragedy?"
        answer: "PACUVIUS"
      - question: "Ennius, in the opening of the <title>Annales</title>, describes whose appearance to him in a dream?"
        answer: "HOMER (Saying, “You are my reincarnation.”)"
  - tossup:
      question: "What poet’s fondness for using the depiction of the rural world as the substitute for an ideal mythological world sharply distinguishes him from the other elegiac poets of the 1st century BC?"
      answer: "TIBULLUS"
    boni:
      - question: "What republican nobleman was the patron of Tibullus?"
        answer: "MESSALA CORVINUS"
      - question: "What poet depicts Tibullus as a withdrawn and melancholy man who spent his last days living in the countryside of Latium?"
        answer: "HORACE"
  - tossup:
      question: "<latin>Quid Anglicē</latin> <latin>significat “celsus?”</latin>"
      answer: "LOFTY / HIGH"
    boni:
      - question: "<latin>Quid Anglicē</latin> <latin>significat “aprīcus?”</latin>"
        answer: "SUNNY / HAVING A LOT OF SUN"
      - question: "<latin>Quid Anglicē</latin> <latin>significat “languidus?”</latin>"
        answer: "WEAK / EXHAUSTED / FAINT / SICK / LOUSY"
  - tossup:
      question: "What emperor celebrated a triumph and received the agnomen “Germanicus” for his successful war against the Chatti in A.D. 82-83?"
      answer: "(TITUS FLAVIUS) DOMITIAN(US)"
    boni:
      - question: "What king invaded the province of Moesia and killed the governor Oppius Sabinus in A.D. 85?"
        answer: "DECABALUS (KING OF DACIA)"
      - question: "Name Domitian’s praetorian prefect who was also killed in the fighting against the Dacians"
        answer: "(CORNELIUS) FUSCUS"
  - tossup:
      question: "What infant child of Lycurgus was killed by a serpent and was given the name Archemorus, “Beginner of Death”?"
      answer: "OPHELTES"
    boni:
      - question: "What former queen of Lemnos was the nursemaid of Opheltes?"
        answer: "HYPSIPYLE"
      - question: "Which of the Seven Against Thebes renamed Opheltes “Archemorus”?"
        answer: "AMPHIARAUS"
  - tossup:
      question: "What is the meaning of the Latin prepositional phrase, which is sometimes abbreviated <latin>sec. nat.</latin>, and in its full form is “<latin>secundum natūram</latin>?”"
      answer: "ACCORDING TO NATURE"
    boni:
      - question: "What is the meaning of the phrase “<latin>cōram populō</latin>?”"
        answer: "IN THE PRESENCE OF THE PEOPLE / IN THE PRESENCE OF SPECTATORS"
      - question: "What is the meaning of the phrase “<latin>hīc fīnis fandī</latin>,” which has been borrowed from Book X of Virgil’s <emphasis>Aeneid</emphasis>?"
        answer: "THIS IS THE END OF THE SPEAKING / THE SPEECH HAS ENDED"
