tournament: "NJCL Certamen"
year: 2004
division: "Intermediate"
round: "Round 2"
questions:
  - tossup:
      question: "Who tricked Zeus into choosing entrails and bones wrapped in fat as the portion of a sacrifice offered to the gods?"
      answer: "PROMETHEUS"
    boni:
      - question: "What did Zeus, in anger, deny to mankind?"
        answer: "FIRE"
      - question: "In what did Prometheus hide fire when he stole it from Olympus for mankind?"
        answer: "HOLLOW (FENNEL) STALK"
  - tossup:
      question: "Translate this motto from the state of Alabama: <latin>Audēmus iūra nostra dēfendere</latin>"
      answer: "WE DARE TO DEFEND OUR RIGHTS / LAWS."
    boni:
      - question: "Translate this motto from the state of Missouri: <latin>Salūs populī</latin> <latin>suprēma lex estō</latin>"
        answer: "LET THE WELFARE/SAFETY OF THE PEOPLE BE THE SUPREME LAW. THE WELFARE/SAFETY OF THE PEOPLE SHALL BE THE SUPREME LAW."
      - question: "Translate this motto from the state of South Carolina: <latin>animīs opibusque parātī</latin>"
        answer: "PREPARED IN SPIRITS/MINDS AND RESOURCES"
  - tossup:
      question: "What Roman general went into voluntary exile after he was accused of embezzling some of the plunder from the capture of Veii?"
      answer: "(M. FURIUS) CAMILLUS"
    boni:
      - question: "What happened in 390 BC which caused the Romans to recall Camillus and make him dictator?"
        answer: "INVASION OF GAULS (BRENNUS)"
      - question: "According to tradition, Camillus twice defeated the Gauls. More importantly, what did he convince the Romans not to do?"
        answer: "ABANDON ROME (AND MOVE TO VEII)"
  - tossup:
      question: "Who became the commander of the Carthaginian fleet in 247 B.C.?"
      answer: "HAMILCAR BARCA"
    boni:
      - question: "What Carthaginian leader hampered Hamilcar’s efforts by denying him ample manpower and supplies?"
        answer: "HANNO (THE GREAT)"
      - question: "With what victor of the battle of Aegates Islands did Hamiclar negotiate peace terms to end the war?"
        answer: "(C. LUTATIUS) CATULUS"
  - tossup:
      question: "Give a synonym of <latin>certē</latin>"
      answer: "<latin>IMMŌ, QUIDEM, MAXIMĒ, SĀNE, ITA, SĪC, ITA VĒRŌ, PLĀNĒ</latin>,"
    boni:
      - question: "... of <latin>subitō</latin>"
        answer: "<latin>REPENTE, REPENTĪNŌ, IMPRŌVĪSŌ, INEXSPECTĀTĒ</latin>"
      - question: "... of <latin>illīc</latin>"
        answer: "<latin>IBI, ISTĪC</latin>"
  - tossup:
      question: "Give the Latin root and its meaning from which “plethora,” “expletive,” “replete,” and “plenty” are derived"
      answer: "<latin>PLĒNUS</latin> - FULL, FILLED / <latin>PLĒRE</latin> - TO FILL"
    boni:
      - question: "What derivative of <latin>plēnus</latin> means “to fulfill?”"
        answer: "IMPLEMENT"
      - question: "What derivative of <latin>plēnus</latin> means “the quantity or number needed to make a whole?”"
        answer: "COMPLEMENT"
  - tossup:
      question: "For the verb <latin>cēdō</latin>, give the 3rd person singular present active indicative"
      answer: "<latin>CĒDIT</latin>"
    boni:
      - question: "Change <latin>cēdit</latin> to the imperfect subjunctive"
        answer: "<latin>CĒDERET</latin>"
      - question: "Change <latin>cēderet</latin> to the future"
        answer: "<latin>NO FUTURE SUBJUNCTIVE</latin>"
  - tossup:
      question: "Whom did Jason and Medea murder in order to escape with the golden fleece?"
      answer: "APSYRTUS (MEDEA’S HALF-BROTHER)"
    boni:
      - question: "Who purified Jason & Medea of this murder?"
        answer: "CIRCE"
      - question: "For whose murder were Jason & Medea later banished from Iolchus?"
        answer: "PELIAS’"
  - tossup:
      question: "What group of barbarians seized Carthage in A.D. 439 and sacked Rome in A.D. 455?"
      answer: "VANDALS"
    boni:
      - question: "Who was the commander of the Vandals?"
        answer: "GAISERIC"
      - question: "Who finally crushed the Vandals in A.D. 533?"
        answer: "BELISARIUS"
  - tossup:
      question: "Listen carefully to the following passage about Hannibal, which I will read twice, and answer IN ENGLISH the question that follows: <latin>Hannibal Rōmānōs adeō</latin> <latin>ōderat ut exercitum magnum trāns Alpēs montēs dūceret. Proelium cum cōnsulibus Rōmānīs commīsit. Rōmānī, quī</latin> <latin>impetum equitum hostium ferre nōn poterant, facile superātī</latin> <latin>sunt. Ūnus cōnsul vulnerātus et paene circumventus est. Sed ūnus eques Rōmānus perīculum vīderat auxiliumque eī</latin> <latin>tulit</latin>. Why did Hannibal lead an army across the Alps?"
      answer: "HE HATED THE ROMANS"
    boni:
      - question: "Why were the Romans easily defeated in this battle?"
        answer: "NOT ABLE TO ENDURE/SUSTAIN THE ATTACK OF THE CAVALRY OF THE ENEMY"
      - question: "Who saved the besieged Roman consul from Hannibal?"
        answer: "ONE HORSEMAN"
  - tossup:
      question: "What couple were turned into a lion and lioness for making love in Cybele’s temple?"
      answer: "ATALANTA AND HIPPOMENES / MELANION"
    boni:
      - question: "How had Hippomenes / Melanion won Atalanta as his wife?"
        answer: "BEAT HER IN A <emphasis>FOOTRACE</emphasis> BY <emphasis>THROWING</emphasis> (THREE) <emphasis>GOLDEN</emphasis>"
      - question: "<emphasis>APPLES</emphasis> IN HER PATH WHICH SHE STOPPED TO COLLECT Whom did Hippomenes forget to thank for the golden apples?"
        answer: "APHRODITE / VENUS"
  - tossup:
      question: "Whose reign began with the execution of Agrippa Postumus?"
      answer: "TIBERIUS"
    boni:
      - question: "Name Agrippa Postumus’ mother, who was also Tiberius’ wife"
        answer: "JULIA (AUGUSTUS’ DAUGHTER)"
      - question: "Name Julia’s surviving child"
        answer: "AGRIPPINA THE ELDER"
  - tossup:
      question: "<latin>Portō</latin> : <latin>portāvisse</latin> :: <latin>mūniō</latin> : _____ ?"
      answer: "<latin>MŪNĪVISSE</latin>"
    boni:
      - question: "Change <latin>mūnīvisse</latin> to the passive"
        answer: "<latin>MŪNĪTUS / -A / -UM ESSE</latin>"
      - question: "Change <latin>mūnītus esse</latin> to the future active"
        answer: "<latin>MŪNĪTŪRUS ESSE</latin>"
  - tossup:
      question: "Translate the following sentence into English: <latin>Pūnī</latin> <latin>eum sī</latin> <latin>discere nōnvult</latin>"
      answer: "PUNISH HIM IF HE DOES NOT WANT TO LEARN"
    boni:
      - question: "Translate the following sentence into English: <latin>frātre occīsō</latin> <latin>in silvam cucurrit</latin>"
        answer: "WITH (HIS) BROTHER KILLED, HE RAN INTO THE FOREST"
      - question: "Translate the following sentence into English: <latin>nūntius haec locūtus abiit</latin>"
        answer: "THE MESSENGER, HAVING SAID THESE THINGS, LEFT"
  - tossup:
      question: "What use of the ablative case is found in the following sentence: <latin>Rōmulus sē</latin> <latin>Iove maiōrem esse dīcēbat</latin>"
      answer: "COMPARISON"
    boni:
      - question: "<latin>Dīcēbat hunc sonum multō</latin> <latin>clāriōrem esse quam tonitrum</latin>"
        answer: "DEGREE OF DIFFERENCE"
      - question: "<latin>Amulius, minor nātū, frātrī</latin> <latin>optiōnem dedit</latin>"
        answer: "RESPECT / SPECIFICATION"
  - tossup:
      question: "Who brought the news to Odysseus that some of his men had been turned into swine by Circe?"
      answer: "EURYLOCHUS"
    boni:
      - question: "Identify the two males in left center of the picture"
        answer: "HERMES & ODYSSEUS"
      - question: "What is Hermes handing to Odysseus in this painting?"
        answer: "(THE PLANT) MOLY / MOLU"
  - tossup:
      question: "Which of the following words, if any, does not have the same Latin root as the others: tense, tenure, retinue, content, detention?"
      answer: "TENSE"
    boni:
      - question: "What Latin word and its meaning are at the root of “tense,” as in “present tense”?"
        answer: "<latin>TEMPUS</latin> - TIME"
      - question: "What other derivative of <latin>teneō, tenēre</latin> means “an established principle or belief”?"
        answer: "TENET"
  - tossup:
      question: "What Celtiberian city held out against the Romans for nine years until they were starved into submission in 133 BC?"
      answer: "NUMANTIA"
    boni:
      - question: "Name the successful Roman commander who sold the inhabitants into slavery and destroyed the town"
        answer: "(P. CORNELIUS) SCIPIO AEMILIANUS (AFRICANUS MINOR)"
      - question: "What <latin>agnomen</latin> was given to Scipio as a result of this?"
        answer: "NUMANTIUS"
  - tossup:
      question: "Of the words <latin>pontifex maximus, rēx, cōnsul, gubernātor</latin> and <latin>cōnsulāris</latin>, which is described by the following: <latin>Is quī</latin> <latin>regit rem publicam</latin>"
      answer: "CŌNSUL"
    boni:
      - question: "Is quī <latin>nōn iam est consul, sed quondam fuit</latin>"
        answer: "CŌNSULĀRIS"
      - question: "Is cuius nōmen omnēs bonī <latin>cīvēs Rōmānī</latin> <latin>ōdērunt</latin>"
        answer: "RĒX"
  - tossup:
      question: "Who married Harmonia, the daughter of Ares and Aphrodite?"
      answer: "CADMUS"
    boni:
      - question: "What two things did Cadmus give Harmonia as wedding gifts?"
        answer: "A ROBE AND A NECKLACE MADE BY HEPHAESTUS"
      - question: "Name the four daughters of Cadmus and Harmonia"
        answer: "INO, SEMELE, AUTONOË, & AGAVE"
