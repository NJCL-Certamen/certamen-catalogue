tournament: "NJCL Certamen"
year: 2004
division: "Intermediate"
round: "Finals"
questions:
  - tossup:
      question: "Which of the Argonauts had such keen eyesight that he could see what was hidden in the earth?"
      answer: "LYNCEUS"
    boni:
      - question: "Which of the Argonauts could run so fast over the waves of the sea that his feet stayed dry?"
        answer: "EUPHEMUS"
      - question: "Which of the Argonauts could take whatever shape he liked in battle?"
        answer: "PERICLYMENUS"
  - tossup:
      question: "This summer the Olympic Games return to their birthplace, Greece. What is the Latin motto of the Olympic Games?"
      answer: "<latin>CITIUS - ALTIUS - FORTIUS</latin>"
    boni:
      - question: "What is the English meaning of the motto?"
        answer: "SWIFTER - HIGHER - STRONGER"
      - question: "Despite the common translation of this motto, what is the grammatical form of those three words?"
        answer: "COMPARATIVE ADVERB"
  - tossup:
      question: "Who gave her husband Cephalus a hound that always caught its prey and a javelin that never missed its mark?"
      answer: "PROCRIS"
    boni:
      - question: "Why did Procris follow her husband into the forest?"
        answer: "SUSPECTED HE WAS HAVING AN AFFAIR (WITH EOS/ AURORA OR AURA)"
      - question: "What happened when Cephalus heard a noise in the forest?"
        answer: "KILLED PROCRIS WITH THE JAVELIN"
  - tossup:
      question: "What type of clauses usually begin with words such as <latin>sī</latin> and <latin>nisi</latin>?"
      answer: "CONDITIONAL"
    boni:
      - question: "Say in Latin, “If I go to Rome, I will visit the forum.”"
        answer: "<latin>SĪ RŌMAM Ī(V)ERŌ / EŌ, FORUM VĪSITĀBŌ / VĪSAM</latin>"
      - question: "Say in Latin, “Unless we prepare the food, we cannot eat.”"
        answer: "<latin>NISI CIBUM PARĀMUS, EDERE NŌN POSSUMUS / QUĪMUS / VALĒMUS SĪ CIBUM NŌN PARĀMUS, EDERE NŌN POSSUMUS / QUĪMUS / VALĒMUS</latin>"
  - tossup:
      question: "Which of the following words, if any, does not have the same Latin root as the others: congress, degree, ingredient, gradual, regressive?"
      answer: "NONE"
    boni:
      - question: "What is the Latin verb and its meaning at the root of these words?"
        answer: "<latin>GRADIOR, GRADĪ</latin> - WALK, STEP"
      - question: "What derivative of <latin>gradior, gradī</latin> means “slope?”"
        answer: "GRADIENT / GRADE"
  - tossup:
      question: "Wait until you are instructed to open your visuals. Open your visuals. Study these statues for 15 seconds. (Wait 15 seconds) Identify the letter and the name of the historical figure described by the following: He succeeded his father, killed his brother, possibly in his mother’s presence"
      answer: "LETTER"
    boni:
      - question: "F: CARACALLA Identify the letter and the name of the historical figure described by the following: He was fond of hunting as a youth and fond of architecture as an adult. He travelled extensively"
        answer: "LETTER"
      - question: "D: HADRIAN Identify the letter and the name of the historical figure here who was the object of Hadrian’s affections during a well-known extramarital affair"
        answer: "LETTER"
  - tossup:
      question: "Which of the sons of King Minos fell into a vat of honey and drowned?"
      answer: "GLAUCUS"
    boni:
      - question: "What Argive seer revived the boy?"
        answer: "POLY(E) IDUS"
      - question: "How did Polyidus learn which herb to use in reviving Glaucus?"
        answer: "(CONFINED BY MINOS IN GLAUCUS’ TOMB) POLYIDUS SAW A SNAKE & KILLED IT; A SECOND SNAKE APPEARED & REVIVED THE FIRST WITH AN HERB"
  - tossup:
      question: "What action by the Romans in 238 B.C. contradicted their reputation for fair dealing and fostered a spirit of revenge at Carthage?"
      answer: "SEIZURE / OCCUPATION OF SARDINIA (& CORSICA)"
    boni:
      - question: "What was distracting the Carthaginians at this time, which facilitated the Roman occupation of Sardinia?"
        answer: "MUTINY/REVOLT/INSURRECTION OF CARTHAGE’S MERCENARIES (& LIBYAN NATIVES)"
      - question: "What Carthaginian commander defeated these mercenaries?"
        answer: "HAMILCAR BARCA"
  - tossup:
      question: "Translate the following sentence into English: <latin>Cicerō crēdēbātur maximus ōrātōrum Rōmānōrum esse</latin>"
      answer: "CICERO IS / WAS BELIEVED TO BE THE GREATEST OF THE ROMAN ORATORS"
    boni:
      - question: "Translate the following sentence into English: <latin>Rogātus est ut cōnsulātum peteret</latin>"
        answer: "HE WAS ASKED TO SEEK THE CONSULSHIP"
      - question: "Translate the following sentence into English: <latin>Catilīna spērāvit mīlitēs suōs Rōmam incensūrōs esse</latin>"
        answer: "CATILINE HOPED THAT HIS SOLDIERS WOULD BURN ROME (Also accept “expected”, “trusted”, “anticipated” for “<latin>spērāvit</latin>”)"
  - tossup:
      question: "Who sent Bellerophon to kill the Chimaera?"
      answer: "(KING) IOBATES (OF LYCIA)"
    boni:
      - question: "Name Iobates’ daughter who had accused Bellerophon of trying to seduce her"
        answer: "STHENEBOEA or ANTEIA"
      - question: "According to Euripides, how does Bellerophon get revenge on Stheneboea?"
        answer: "LURES HER ONTO PEGASUS, FLIES HIGH, PUSHES HER OFF"
  - tossup:
      question: "What Latin phrase is commonly used in English to mean “actions speak louder than words”?"
      answer: "<latin>FACTA NŌN VERBA</latin>"
    boni:
      - question: "What Latin phrase is commonly used in English to mean “perfection”?"
        answer: "<latin>NĒ PLŪS ULTRĀ</latin>"
      - question: "What Latin phrase is commonly used in the military to mean “by force of arms”?"
        answer: "<latin>VĪ ET ARMĪS</latin>"
  - tossup:
      question: "Cicero says in his first oration against Catiline: “<latin>Dēcrēvit quondam senātus ut ... cōnsul vidēret nē quid rēs pūblica detrimentī caperet</latin>.” What use of the genitive is found in that sentence?"
      answer: "PARTITIVE/OF THE WHOLE"
    boni:
      - question: "For that same quotation, what use of the subjunctive is <latin>vidēret</latin>?"
        answer: "SUBSTANTIVE NOUN CLAUSE / INDIRECT COMMAND"
      - question: "Later on in the same speech, Cicero says, “ <latin>Quid est, Catilīna, quod iam amplius expectēs</latin>...” What use of the subjunctive is found in that quotation?"
        answer: "RELATIVE CLAUSE OF CHARACTERISTIC"
  - tossup:
      question: "What are the two possible genitive singular forms for the noun <latin>domus</latin>?"
      answer: "<latin>DOMŪS / DOMĪ</latin>"
    boni:
      - question: "What are the two possible genitive plural forms for <latin>domus</latin>?"
        answer: "<latin>DOMUUM / DOMŌRUM</latin>"
      - question: "What do we call nouns such as <latin>domus</latin>, which have forms from more than one declension?"
        answer: "HETEROCLITES"
  - tossup:
      question: "What is the Latin name of the region of ancient Italy which contained the cities of Murlo, Volterrae, Clusium and Tarquinii?"
      answer: "<latin>ETRURIA</latin>"
    boni:
      - question: "What is the Latin name of the region of ancient Italy which contained the city of Beneventum?"
        answer: "<latin>SAMNIUM</latin>"
      - question: "What is the Latin name of the region of ancient Italy which contained the city of Tarentum, which was the only city in Italy founded by the Spartans?"
        answer: "<latin>MAGNA GRAECIA</latin>"
  - tossup:
      question: "Listen to the following passage, which I will read twice, and answer in English the question that follows. <latin>Rūfus, vir ingeniī prāvī, Magnam Bibliothēcam Alexandrīae vīsitābat ut volūmina sēcrēta et rāra legeret. Dum volūmina sēcrēta legit, ea in sinūs togae suae pōnere coepit. Cēlātīs volūminibus, Rūfus ā cūrātōre librōrum comprehensus est. Rūfus sē statim excūsāvit et dēclārābat volūmina in sinūs suōs forte cecidisse.</latin>  The question: Why did Rufus visit the great library of Alexandria?"
      answer: "TO READ SECRET AND RARE SCROLLS / BOOKS (Accept either “secret” or “rare”, or both, but at least one is required)"
    boni:
      - question: "What did Rufus do with the scrolls?"
        answer: "<emphasis>HID / PUT / STASHED</emphasis> THEM IN THE FOLDS / POCKET / POUCHES OF HIS <emphasis>TOGA</emphasis>"
      - question: "(Accept “in his toga” and “stole”) What explanation did Rufus give the curator of the museum, who caught him attempting to steal the scrolls?"
        answer: "IT WAS ACCIDENTAL / THEY HAPPENED TO FALL INTO HIS POCKETS"
  - tossup:
      question: "Which of the Seven against Thebes was the only one to scale the city wall?"
      answer: "CAPANEUS"
    boni:
      - question: "What did Capaneus shout as he climbed over the wall?"
        answer: "NOT EVEN ZEUS COULD KEEP HIM FROM ENTERING THE CITY"
      - question: "How was Capaneus punished?"
        answer: "KILLED BY ZEUS’ THUNDER/LIGHTNING BOLT"
  - tossup:
      question: "Using <latin>causā</latin>, translate the purpose clause into Latin for the following sentence: Marcus sent the soldiers to find gold"
      answer: "<latin>AURĪ / AURUM INVENIENDĪ / REPERIENDĪ CAUSĀ</latin>"
    boni:
      - question: "Translate that purpose clause again using <latin>quī</latin>"
        answer: "<latin>QUĪ AURUM INVENĪRENT / REPERERENT</latin>"
      - question: "Translate that purpose clause again using a supine"
        answer: "<latin>AURUM INVENTUM / REPERTUM</latin>"
  - tossup:
      question: "In the Republic, which officials’ duties included the following: <latin>cūra lūdōrum sollemnium, cūra annōnae</latin>, and <latin>cūra urbis</latin>?"
      answer: "<latin>AEDĪLĒS</latin>"
    boni:
      - question: "In the late Republic, who created special <latin>aedīlēs Ceriālēs</latin> to manage the grain supply?"
        answer: "JULIUS CAESAR"
      - question: "Augustus replaced the <latin>aedīlēs Ceriālēs</latin> with new officials to manage the grain supply. What was the Latin title for these officials?"
        answer: "<latin>PRAEFECTUS ANNŌNAE</latin>"
  - tossup:
      question: "At the conference at Luca in 56 B.C., it was agreed that Pompey would govern what province for five years?"
      answer: "SPAIN (NEARER and FURTHER)"
    boni:
      - question: "Of what province was Crassus to be governor with the right to wage war against the Parthians?"
        answer: "SYRIA"
      - question: "What did Caesar get from the conference?"
        answer: "5 MORE YEARS (PROCONSULSHIP / COMMAND) IN GAUL"
  - tossup:
      question: "(As applause dies down from the score announcement, several replicas of mundane Roman items are placed on a small table to side of the stage. These items include a mirror, fibula, a comb, a ring and a few others.) We are now introducing a new question format that involves props. As of this point, the toss-up has begun. Do not confer with your teammates until the toss-up has been completed. I will commence reading the question when the props have been arranged. (Wait for props to be in place) When recognized by the spotter, follow these instructions: <latin>Ambulā ad mēnsam et tolle rem quae togās vel stolās adligit.</latin>"
      answer: "A PLAYER WALKS TO THE TABLE AND PICKS UP THE <latin>FIBULA</latin>"
    boni:
      - question: "(Moderator instructs remaining players on that team to join their teammate at the table to consult for bonuses) <latin>Tolle speculum et superbē dīc Anglicē spectātōribus dē pulchritūdine tuā</latin>"
        answer: "A PLAYER PICKS UP THE MIRROR AND PROUDLY TELLS THE AUDIENCE ABOUT HIS OR HER BEAUTY IN ENGLISH"
      - question: "<latin>Tolle pectinem et compōne crīnēs ūnīus sociī.</latin>"
        answer: "A PLAYER PICKS UP THE COMB AND ARRANGES THE HAIR OF A TEAMMATE"
