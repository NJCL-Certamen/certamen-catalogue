tournament: "NJCL Certamen"
year: 2004
division: "Intermediate"
round: "Semifinals"
questions:
  - tossup:
      question: "According to Homer, what deity saves Aeneas from death when he fights Achilles in single combat?"
      answer: "POSEIDON"
    boni:
      - question: "What other deity has urged Aeneas to fight Achilles?"
        answer: "APOLLO"
      - question: "What does Poseidon explain to Apollo and the other gods about Aeneas’s destiny?"
        answer: "AENEAS & HIS DESCENDANTS ARE DESTINED TO RULE TROY"
  - tossup:
      question: "What was the most common duty of the <latin>publicānī</latin>?"
      answer: "TAX COLLECTION (IN PROVINCES)"
    boni:
      - question: "What was Rome's <latin>aerārium</latin>?"
        answer: "(PUBLIC) TREASURY"
      - question: "What was the emperor's private treasury called?"
        answer: "<latin>FISCUS</latin>"
  - tossup:
      question: "What use of the subjunctive does Cicero employ in his frequently-used clause <latin>“Quae cum ita sint</latin>?”"
      answer: "(CUM) CAUSAL CLAUSE"
    boni:
      - question: "What type of conditional clause does Cicero employ when he says <latin>“Sī hoc Marcō Marcellō dīxissem...</latin>”?"
        answer: "CONTRARY TO FACT (IN PAST TIME)"
      - question: "What type of conditional clause does Cicero employ when he says : <latin>“Sī mēcum patria loquātur....</latin>”?"
        answer: "FUTURE LESS VIVID / IDEAL (Prompt: SHOULD-WOULD)"
  - tossup:
      question: "On what island did the sun god Helius pasture his herds of cattle and sheep?"
      answer: "THRINAC(R)IA / THRINACIË"
    boni:
      - question: "Which of Odysseus’ men urged the others to slaughter and eat some of Helius’ cattle?"
        answer: "EURYLOCHUS"
      - question: "Name Helius’ daughter who quickly reported the crime to her father"
        answer: "LAMPETIË/ LAMPETIA"
  - tossup:
      question: "Who, in name only, was in command of the Roman legions sent against the Parthian in A.D. 161?"
      answer: "LUCIUS (AURELIUS) VERUS"
    boni:
      - question: "What Syrian was actually in command?"
        answer: "AVIDIUS CASSIUS"
      - question: "What disaster did these troops bring back with them from Parthia?"
        answer: "PLAGUE"
  - tossup:
      question: "If you were a book editor for a publishing company, what Latin phrase would you use in the margin of a manuscript to mean “retain the word or passage previously corrected or omitted?”"
      answer: "<latin>STET</latin>"
    boni:
      - question: "What would be the Latin title of the list of corrections to be made <emphasis>before</emphasis> publishing the book?"
        answer: "<latin>CORRIGENDA</latin>"
      - question: "If additional mistakes were found <emphasis>after</emphasis> the book was published, what is Latin term for the list of errors and their corrections usually inserted in the front of the book?"
        answer: "<latin>ERRATA</latin>"
  - tossup:
      question: "Whose descendants does Prometheus predict will include the great hero Heracles?"
      answer: "IO’S"
    boni:
      - question: "On what mountain is Prometheus chained when he gives this prediction?"
        answer: "MT. CAUCASUS"
      - question: "What service does Heracles later render to Prometheus?"
        answer: "(SHOOTS THE EAGLE &) RELEASES PROMETHEUS (FROM HIS CHAINS)"
  - tossup:
      question: "Translate the following sentence into English: <latin>Aequō animō mortuus est</latin>"
      answer: "HE DIED WITH A CALM / PEACEFUL MIND / SPIRIT / CALMLY"
    boni:
      - question: "Translate the following sentence into English: <latin>Gnaeus fuit homō infirmō corpore</latin>"
        answer: "GNAEUS WAS A MAN OF WEAK BODY"
      - question: "Translate the following sentence into English: <latin>Requiēscant in pāce ossa eius</latin>"
        answer: "MAY HIS BONES REST IN PEACE"
  - tossup:
      question: "Give the Latin root and its meaning from which “prodigal,” “exigency,” “agile,” and “reaction” are derived"
      answer: "<latin>AGŌ, AGERE</latin> - DO, DRIVE"
    boni:
      - question: "What derivative of <latin>agō, agere</latin> means “the process of conducting business?”"
        answer: "TRANSACTION"
      - question: "What derivative of <latin>agō, agere</latin> means “one who is opposed to progress?’"
        answer: "REACTIONARY"
  - tossup:
      question: "Listen carefully to the following passage about Cato, which I will read twice, and answer IN LATIN the question that follows: <latin>Marcus Porcius Catō erat novus homō. Per omnēs gradūs cursūs</latin>  <latin>honōrum ad cōnsulātum progressus erat. Tandem, nōbilibus dissentientibus, populus Rōmānus Catōnem cēnsōrem fēcērunt. Per tōtam vītam Catō Carthāginem timuit et ōderat. Semper cupidus erat illīus urbis vastandae. Cum ōrātiōnem habēret, semper exclāmābat, “Dēlenda est Carthāgō!”</latin>  The question: <latin>Quotiēns dīcēbat Catō, ōrātiōnem habēns, Carthāginem dēlendam esse?</latin>"
      answer: "TOTIĒNS / SEMPER"
    boni:
      - question: "<latin>Quī nōlēbant Catōnem cēnsōrem fierī?</latin>"
        answer: "<latin>NŌBILĒS (RŌMĀNĪ)</latin>"
      - question: "<latin>Cuius erat Catō cupidus?</latin>"
        answer: "<latin>ILLAM URBEM / CARTHĀGINEM VASTANDĪ / ILLĪUS URBIS / CARTHĀGINIS VASTANDAE</latin>"
  - tossup:
      question: "Who was the first provincial governor to declare support for Galba against Nero?"
      answer: "OTHO"
    boni:
      - question: "What province did he rule?"
        answer: "LUSITANIA"
      - question: "Why did Otho withdraw his support from the emperor Galba?"
        answer: "GALBA HAD CHOSEN SOMEONE ELSE [(L.) PISO LICINIANUS, NOT OTHO] TO BE HIS SUCCESSOR"
  - tossup:
      question: "Please do not open your visual until directed to do so. (When the visuals are distributed, say ) “ Open your visual and study it for ten seconds. Please note that the animal in the center of the picture is a bull.” (10 seconds passes) Who is the lady in this mural from the House of the Vettii in Pompeii?"
      answer: "DIRCE (QUEEN OF THEBES)"
    boni:
      - question: "Who are the two young men?"
        answer: "ZETHUS & AMPHION"
      - question: "On what mountain does this scene occur?"
        answer: "MT. CITHAERON"
  - tossup:
      question: "What form of the proper noun <latin>Mercurius</latin> agrees with the adjective form <latin>celerī</latin>?"
      answer: "<latin>MERCURIŌ</latin>"
    boni:
      - question: "What form of the proper noun <latin>Iūnō</latin> agrees with the adjective form <latin>superbam</latin>?"
        answer: "<latin>IŪNŌNEM</latin>"
      - question: "What form of the proper noun <latin>Iuppiter</latin> agrees with the adjective form <latin>saevī</latin>?"
        answer: "<latin>IOVIS</latin>"
  - tossup:
      question: "You are at a restaurant in ancient Ostia and the waiter asks you “<latin>Vīsne pānem et mel?</latin>” What is he asking you?"
      answer: "IF YOU WOULD LIKE BREAD AND HONEY"
    boni:
      - question: "The waiter then asks you “<latin>Utrum vīs potāre? Aquam an lac?</latin>” What does the waiter want to know now?"
        answer: "WHAT YOU WANT TO DRINK, <emphasis>WATER</emphasis> OR <emphasis>MILK</emphasis>"
      - question: "You then respond to the waiter, “<latin>Nec aquam nec lac. Mālō vīnum album</latin>.” What are you saying to the waiter?"
        answer: "THAT YOU WANT <emphasis>NEITHER WATER NOR MILK</emphasis>, BUT THAT YOU PREFER/WANT <emphasis>WHITE WINE</emphasis>"
  - tossup:
      question: "What king of Athens called upon Poseidon to kill his son Hippolytus?"
      answer: "THESEUS"
    boni:
      - question: "Who told Theseus that she had been raped by Hippolytus?"
        answer: "PHAEDRA (HIS WIFE)"
      - question: "What deity told Theseus that his son was innocent?"
        answer: "ARTEMIS"
  - tossup:
      question: "Using an impersonal verb, say in Latin, “We are ashamed.”"
      answer: "<latin>NŌS PUDET</latin>"
    boni:
      - question: "... “They are sorry.”"
        answer: "<latin>EŌS / EĀS / ILLŌS / ILLĀS PAENITET</latin>"
      - question: "... “You were tired.”"
        answer: "<latin>TĒ / VŌS TAEDĒBAT / TAEDUIT</latin>"
  - tossup:
      question: "Where was the battle fought which ended the Second Macedonian War in 197 B.C.?"
      answer: "CYNOCEPHALAE"
    boni:
      - question: "Who was the victorious Roman general?"
        answer: "(TITUS QUINCTUS) FLAMININUS"
      - question: "Who was the losing Macedonian general?"
        answer: "PHILIP V"
  - tossup:
      question: "Which two of the following words have the same Latin root: presume, summit, summon, summer, assumption?"
      answer: "PRESUME & ASSUMPTION"
    boni:
      - question: "What Latin verb with what meaning is at the root of “presume” and “assumption?”"
        answer: "<latin>SUMŌ, SUMERE</latin> - TAKE, TAKE ON, SPEND"
      - question: "What derivative of <latin>sumō, sumere</latin> means involving great expense?"
        answer: "SUMPTUOUS"
  - tossup:
      question: "Give an antonym of <latin>sordidus</latin>"
      answer: "<latin>NITĒNS / ALBUS / CANDIDUS / CLĀRUS / PŪRUS / MUNDUS / INTEGER</latin>"
    boni:
      - question: ". . . of <latin>molestus</latin>"
        answer: "<latin>GRĀTUS / COMMODUS / AMĀBILIS / BLANDUS, IŪCUNDUS / PROBĀTUS / LEPIDUS / SUĀVIS</latin>"
      - question: "...of <latin>antīquus</latin>"
        answer: "<latin>NOVUS, RECENS, NOVELLUS (</latin>Do NOT accept <latin>“iuvenis”</latin>)"
  - tossup:
      question: "What city in ancient Spain was situated where modern Cartegena stands?"
      answer: "NEW CARTHAGE / CARTHAGO NOVA"
    boni:
      - question: "Carthago Nova was founded by Hasdrubal Barca. What modern Spanish city derives its name from “Barca?”"
        answer: "BARCELONA"
      - question: "The modern name of the Spanish city Saragossa evolved from the name of what ancient historical figure?"
        answer: "(CAESAR) AUGUSTUS"
