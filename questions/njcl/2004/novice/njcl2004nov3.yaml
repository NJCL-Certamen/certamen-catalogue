tournament: "NJCL Certamen"
year: 2004
division: "Novice"
round: "Round 3"
questions:
  - tossup:
      question: "Say in Latin, “Is your brother coming today?”"
      answer: "<latin>VENITNE FRĀTER TUUS / VESTER HODI</latin><latin>Ē?</latin>"
    boni:
      - question: "Say in Latin, “Have you not seen the procession in the forum?”"
        answer: "<latin>NŌNNE VĪDISTĪ</latin> <latin>/ VĪDISTIS POMPAM IN FORŌ</latin>"
      - question: "Say in Latin, “Romulus was not the king of Germany, was he?”"
        answer: "<latin>NUM RŌMULUS REX GERMANIAE FUIT / ERAT</latin>"
  - tossup:
      question: "Who avenged the murder of his father by killing his mother Clytemnestra?"
      answer: "ORESTES"
    boni:
      - question: "Name Orestes’ sister who encouraged, if not aided him"
        answer: "ELECTRA"
      - question: "At Orestes’ trial for matricide in Athens, who cast the final vote resulting in his acquittal?"
        answer: "ATHENA"
  - tossup:
      question: "What use of the ablative case is found in the following sentence: <latin>Marcus fēlem saxō</latin> <latin>interfēcit</latin>?"
      answer: "INSTRUMENT / MEANS"
    boni:
      - question: "What use of the ablative case is found in the following sentence: <latin>Marcus est saevior animālibus</latin>?"
        answer: "COMPARISON"
      - question: "What use of the ablative case is found in the following sentence: <latin>Necesse est Marcō</latin> ā <latin>mātre pūnīrī</latin>?"
        answer: "(PERSONAL) AGENT"
  - tossup:
      question: "Who won the support of the Samnites, Lucanians, Bruttians, and the Greek cities of southern Italy when he defeated the Romans at Heraclea in 280 B.C.?"
      answer: "PYRRHUS"
    boni:
      - question: "After what battle did Pyrrhus declare “Another such victory and I am lost!”?"
        answer: "ASCULUM"
      - question: "After what battle in 275 B. C., did Pyrrhus return home to Epirus?"
        answer: "MALVENTUM"
  - tossup:
      question: "Whose reckless driving caused Libya to become a desert?"
      answer: "PHAËTHON’S"
    boni:
      - question: "Name Phaethon’s father who had allowed him to drive his chariot"
        answer: "HELIUS/HELIOS/HYPERION/PHOEBUS/APOLLO"
      - question: "Who was Phaeton’s mother?"
        answer: "CLYMENE"
  - tossup:
      question: "Who became the sole ruler of the Roman empire in A.D. 392?"
      answer: "(FLAVIUS) THEODOSIUS (I or GREAT)"
    boni:
      - question: "Theodosius was called “the Great” as the result of his rigid adherence to the orthodoxy of what Christian creed?"
        answer: "NICENE /NICEAN CREED"
      - question: "What bishop influenced Theodosius to ban all forms of pagan worship?"
        answer: "AMBROSE"
  - tossup:
      question: "Whose suitors swore to protect the life and rights of whichever one of them succeeded in winning her hand in marriage?"
      answer: "HELEN’S"
    boni:
      - question: "Whose idea was it to have the suitors swear this oath?"
        answer: "ODYSSEUS’"
      - question: "Who did succeed in winning Helen’s hand in marriage?"
        answer: "MENELAUS"
  - tossup:
      question: "Give the Latin root and its meaning from which “cadaver,” “casualty,” “decay,” and “cascade” are derived"
      answer: "<latin>CADŌ, CADERE</latin> - FALL, DIE"
    boni:
      - question: "What derivative of <latin>cadō, cadere</latin> means “the beat of movement in marching?’"
        answer: "CADENCE"
      - question: "What derivative of <latin>cadō, cadere</latin> means “an occurrence, event?’"
        answer: "INCIDENT / OCCASION"
  - tossup:
      question: "What is the meaning of the motto of Elizabeth I of Great Britain: <latin>semper eadem</latin>?"
      answer: "ALWAYS THE SAME"
    boni:
      - question: "What is the meaning of her title: <latin>Deī</latin> <latin>Grātiā</latin> <latin>Britanniae Rēgīna</latin>?"
        answer: "QUEEN OF BRITAIN BY THE GRACE OF GOD"
      - question: "What is the meaning of this title given to Henry VIII and all British monarchs since him: <latin>Dēfensor Fideī</latin>?"
        answer: "DEFENDER OF THE FAITH"
  - tossup:
      question: "Listen carefully to the following passage, which I will read twice, and answer IN ENGLISH the question that follows: <latin>Ōlim Gallī</latin> <latin>, gēns barbara et fērōx, Rōmam occupāverant atque multī</latin> <latin>cīvēs ex urbe fūgērunt. Sed sēnātōrēs, quī</latin> <latin>sēnēs erant, Rōmae mānsērunt et mortem exspectāvērunt. Gallī</latin> <latin>attonitī</latin> <latin>sēnātōribus appropinquābant et ūnus ex Gallīs barbam ūnīus senis manū</latin> <latin>tetigit. Senātor īrātus caput Gallī</latin> <latin>verberāvit et statim ā</latin> <latin>Gallō</latin> <latin>interfectus est. Mox omnēs sēnātōres in sellīs suīs necātī</latin> <latin>sunt.</latin>  The question: Why were the Gauls astonished?"
      answer: "THE SENATORS HAD REMAINED IN ROME / THE SENATORS WERE WAITING FOR DEATH"
    boni:
      - question: "What did one of the Gauls do with respect to one of the Roman senators?"
        answer: "TOUCHED HIS BEARD"
      - question: "What happened to the senators who stayed?"
        answer: "KILLED (IN THEIR OWN CHAIRS)"
  - tossup:
      question: "What 14 year old became the emperor of Rome in A.D. 222?"
      answer: "ALEXANDER SEVERUS or SEVERUS ALEXANDER"
    boni:
      - question: "Name his mother who was virtually the empress of Rome during his reign"
        answer: "JULIA MAMAEA"
      - question: "Who led the mutiny in which Alexander and his mother were killed?"
        answer: "MAXIMINUS THRAX"
  - tossup:
      question: "<latin>Quid Anglicē</latin> <latin>significat “praesidium”</latin>?"
      answer: "GUARD, GARRISON, PROTECTION, HELP"
    boni:
      - question: "<latin>Quid Anglicē</latin> <latin>significat “vultus”</latin>?"
        answer: "FACE, EXPRESSION, LOOKS, FEATURES"
      - question: "<latin>Quid Anglicē</latin> <latin>significat “onus”</latin>?"
        answer: "BURDEN, LOAD"
  - tossup:
      question: "Give a synonym of <latin>laetus</latin>"
      answer: "<latin>BEĀTUS</latin>, <latin>FĒLĪX</latin>, <latin>FORTŪNĀTUS</latin>"
    boni:
      - question: ". . . of the adjective <latin>cēterī</latin>"
        answer: "<latin>ALIĪ,RELIQUĪ</latin>, <latin>SUPERFLUĪ, SUPERSTITĒS</latin>"
      - question: ". . . of <latin>nōtus</latin>"
        answer: "<latin>(PRAE)CLĀRUS</latin>, <latin>CELEBER</latin>, <latin>NŌBILIS, ĒGREGIUS,INSIGNIS</latin>"
  - tossup:
      question: "Who lays the curse on Aeneas and his descendants that they would always be enemies of Carthage?"
      answer: "DIDO"
    boni:
      - question: "Whom does Jupiter send to tell Aeneas that he cannot remain in Carthage with Dido, but must leave for Italy to fulfill his destiny?"
        answer: "MERCURY"
      - question: "What does Dido do as Aeneas leaves?"
        answer: "KILLS HERSELF (WITH THE SWORD THAT AENEAS HAD GIVEN HER)"
  - tossup:
      question: "Who was the mother of the minotaur?"
      answer: "PASIPHAE"
    boni:
      - question: "Which daughter of Minos did Theseus marry and make queen of Athens?"
        answer: "PHAEDRA"
      - question: "Which god did Ariadne marry after Theseus abandoned her on Naxos?"
        answer: "BACCHUS / DIONYSUS / BROMIOS"
  - tossup:
      question: "Consider these phrases: <latin>sub aquā, apud grammaticum, in silvā, in apodyteriō</latin>, <latin>humī</latin> Which of those phrases would be associated with this sentence: <latin>Vir tibi dīcit, “Tolle tabulās et scrībe meās sententiās.”</latin>"
      answer: "<latin>APUD GRAMMATICUM</latin>"
    boni:
      - question: "Which of those phrases would be associated with the sentence: <latin>Tū</latin> <latin>es nūdus et servīs vestīmenta trādis</latin>"
        answer: "IN APODYTERIŌ"
      - question: "... with this sentence: <latin>Tū</latin> <latin>vēnābulum tenēs et animālibus circumvenīris</latin>"
        answer: "IN SILVĀ"
  - tossup:
      question: "Against whom were C. Antonius Hybrida and Lucius Sergius Catilina running for the consulship of 63 B.C"
      answer: "(M. TULLIUS) CICERO"
    boni:
      - question: "Who, with the support of the equestrians, was the highest vote getter?"
        answer: "(M. TULLIUS) CICERO"
      - question: "What is the Latin term for men like Cicero who were the first of their family to be elected to high office and serve in the Senate?"
        answer: "NOVUS HOMO"
  - tossup:
      question: "Which of the following words, if any, is derived from a Latin root: mentor, maudlin, homage, gargantuan, stentorian?"
      answer: "HOMAGE"
    boni:
      - question: "Which of the following words, if any, is derived from a Latin root: viral, viridian, virtuoso, vernal, verisimilitude?"
        answer: "THEY ALL ARE"
      - question: "Which of the following words, if any, is NOT derived from a Latin word for a body part: auriferous, pedestrian, capitol, emancipate, indent?"
        answer: "AURIFEROUS"
  - tossup:
      question: "Give both the Latin word and the English word for the material used for the finish line at a chariot race"
      answer: "CALX; CHALK"
    boni:
      - question: "The gentleman on the left in this picture is presiding over chariot games in the circus. At what point of any given race would he be in this pose?"
        answer: "THE START"
      - question: "What is the Latin term for the object in his right hand?"
        answer: "<latin>MAPPA</latin>"
  - tossup:
      question: "Give the Latin and the English for the abbreviation “c.” when used before a date"
      answer: "<latin>CIRCA</latin> /ABOUT"
    boni:
      - question: "Give the Latin and the English for the abbreviation “cf.”"
        answer: "<latin>CONFER</latin> / COMPARE"
      - question: "Give the Latin and the English for the abbreviation “c.v.”"
        answer: "<latin>CURRICULUM VITAE /</latin> RESUMÉ / LIFE’S WORK / SUMMARY OF ACCOMPLISHMENT"
