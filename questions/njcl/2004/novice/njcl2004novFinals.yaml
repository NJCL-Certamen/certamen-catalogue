tournament: "NJCL Certamen"
year: 2004
division: "Novice"
round: "Finals"
questions:
  - tossup:
      question: "Give the Latin and the English for the motto of the state of Virginia"
      answer: "<latin>SĪC SEMPER TYRANNĪS /</latin> THUS EVER/ALWAYS TO TYRANTS"
    boni:
      - question: "Give the Latin and the English for the motto of the state of West Virginia"
        answer: "<latin>MONTĀNĪ SEMPER LĪBERĪ</latin> / MOUNTAINEERS ARE ALWAYS FREE (MEN)"
      - question: "Translate the motto of the University of Richmond, “<latin>Verbum vītae et lūmen scientiae”</latin>"
        answer: "(THE) WORD OF LIFE AND LIGHT OF WISDOM"
  - tossup:
      question: "What daughter of Evenus chose a mortal as her lover rather than the god Apollo?"
      answer: "MARPESSA"
    boni:
      - question: "Name this mortal who was one of the Argonauts"
        answer: "IDAS"
      - question: "Why did Marpessa reject Apollo?"
        answer: "AFRAID HE WOULD ABANDON HER WHEN SHE GREW OLD"
  - tossup:
      question: "For the verb <latin>nōlō, nōlle</latin>, give the 3rd person plural, imperfect indicative"
      answer: "<latin>NŌLĒBANT</latin>"
    boni:
      - question: "Using that same verb, say in Latin, “We did not want to stay at home.”"
        answer: "<latin>NŌLUIMUS DOMĪ MANĒRE</latin>"
      - question: "Using a related verb, say in Latin, “We prefer to go to Italy.”"
        answer: "<latin>MĀLUMUS ĪRE AD / IN ITALIAM</latin>"
  - tossup:
      question: "For what purpose did Roman fullers, or dry cleaners, place large clay pots on most street corners?"
      answer: "FOR URINE COLLECTION"
    boni:
      - question: "For which emperor were these urine collection pots nicknamed?"
        answer: "VESPASIAN"
      - question: "What had Vespasian done to earn this dubious honor?"
        answer: "HE HAD TAXED THE URINE"
  - tossup:
      question: "For which of his labors did Helius give Heracles a golden cup in which to sail upon the stream of Oceanus to Erythia?"
      answer: "FETCHING THE CATTLE OF GERYON"
    boni:
      - question: "Describe Geryon"
        answer: "THREE HEADS and/or THREE BODIES JOINED TOGETHER (FROM WAIST DOWN)"
      - question: "Heracles not only killed Geryon but also his giant herdsman and dog. Name them"
        answer: "EURYTION AND ORTHUS / ORTHRUS"
  - tossup:
      question: "You are in ancient Rome talking to a friend and you ask, <latin>“Quotā hōrā prandium cōnsūmes</latin>?” What are you asking your friend?"
      answer: "WHAT TIME (S)HE EATS LUNCH"
    boni:
      - question: "What one word would your friend use to say to you, “At noon.”"
        answer: "<latin>MERĪDIĒ</latin>"
      - question: "Using an impersonal verb, say in Latin, “It is necessary for us to eat lunch soon.”"
        answer: "<latin>NECESSE EST NŌBĪS MOX PRANDIUM CŌNSŪMERE</latin>"
  - tossup:
      question: "Which emperor was murdered on the order of the Praetorian prefect Macrinus?"
      answer: "CARACALLA"
    boni:
      - question: "Against what enemy was Caracalla preparing a spring campaign when killed?"
        answer: "PARTHIANS"
      - question: "Who plotted against Macrinus and within a year seized the imperial throne for her grandson Varius Avitus?"
        answer: "JULIA MAESA"
  - tossup:
      question: "Which of the following words, if any, is <emphasis>not</emphasis> derived from the same Latin root as the others: caption, intercept, anticipate, municipal, precipitate?"
      answer: "PRECIPITATE"
    boni:
      - question: "What is the root and its meaning of “precipitate?”"
        answer: "<latin>CAPUT</latin> - HEAD"
      - question: "What derivative of <latin>caput</latin> means “to repeat in concise form, summarize?”"
        answer: "RECAPITULATE"
  - tossup:
      question: "According to historical tradition, who was selected to replace Tarquinius Collatinus as consul in 509 B.C.?"
      answer: "<latin>(</latin>PUBLIUS VALERIUS) PUBLICOLA/POPLICOLA"
    boni:
      - question: "How many times was Publicola elected consul?"
        answer: "FOUR"
      - question: "What right of appeal did he secure for the people?"
        answer: "ANYONE CONDEMNED BY A MAGISTRATE COULD APPEAL TO THE PEOPLE (<latin>PRŌVŌCATIŌ</latin>)"
  - tossup:
      question: "Listen to the following passage which I will read twice and answer in ENGLISH the question that follows. <latin>Virginia erat puella pulcherrima quae quattuordecim annōs habēbat. Vīgintī iuvenēs eam in matrimōnium dūcere vōlēbant. Ūnō diē, illī iuvenēs domum eius vēnērunt et clāmāvērunt, “Ēlige ūnum ex nōbīs, Ō pulchra puella!” Quibus māter puellae respondit, “Bonī iuvenēs, hodiē est diēs fēlīx. Mea fīlia mox erit Virgō Vestālis. Virginia nōn est amatōribus!”</latin>  The question: Why had twenty young men come to Virginia’s house?"
      answer: "TO MARRY HER"
    boni:
      - question: "Why did Virginia’s mother think this day was so special?"
        answer: "VIRGINIA WAS TO BECOME A VESTAL (VIRGIN)"
      - question: "After announcing that Virginia would be a Vestal Virgin, what did her mother tell the suitors that really disappointed them?"
        answer: "VIRGINIA IS NOT FOR LOVERS"
  - tossup:
      question: "On what island does this scene take place?"
      answer: "SICILY"
    boni:
      - question: "According to Vergil, who gave Odysseus the wine he is pouring for Polyphemus?"
        answer: "MARON (PRIEST OF APOLLO AT ISMARUS)"
      - question: "What gift does Polyphemus promise to Odysseus in return?"
        answer: "TO EAT HIM LAST"
  - tossup:
      question: "Give the genitive singular of the phrase “one terrible day”"
      answer: "<latin>ŪNĪUS TERRIBILIS DIĒĪ</latin>"
    boni:
      - question: "Translate that same phrase “one horrible day” for the sentence: “He was a slave for one terrible day.”"
        answer: "<latin>ŪNAM / ŪNUM TERRIBILEM DIEM</latin>"
      - question: "Say in Latin, “On one terrible day.”"
        answer: "<latin>ŪNŌ / ŪNĀ TERRIBILĪ DIĒ</latin>"
  - tossup:
      question: "What monster in a battle with Zeus stole his sickle and cut out the sinews of the god’s hands and feet?"
      answer: "TYPHÖEUS / TYPHON / TYPHAON"
    boni:
      - question: "Who were the parents of Typhon?"
        answer: "GAIA / GAEA/ GE & TARTARUS"
      - question: "Who recovered the sinews and refitted them to Zeus’ limbs?"
        answer: "HERMES & AEGIPAN"
  - tossup:
      question: "Whose revolt against Nero did Galba, and perhaps Otho, support in A.D. 68?"
      answer: "(C. JULIUS) VINDEX’S"
    boni:
      - question: "Name the governor of Upper Germany who defeated Vindex and his undisciplined troops"
        answer: "(L. VERGINIUS) RUFUS"
      - question: "Vindex’s revolt having failed, who sent agents to Rome to bribe the Praetorians Guard to desert Nero?"
        answer: "GALBA"
  - tossup:
      question: "What Latin verb with what meaning is at the root of “succor,” (spell “succor”) “corridor,” “courier,” and “cursive”?"
      answer: "<latin>CURRŌ, CURRERE</latin> - RUN"
    boni:
      - question: "What derivative of <latin>currō, currere</latin> means “to agree”?"
        answer: "CONCUR"
      - question: "What derivative of <latin>currō, currere</latin> means “a short journey or outing”?"
        answer: "EXCURSION"
  - tossup:
      question: "Translate the following sentence into English: <latin>Multī Graecī</latin> ē <latin>patriā nāvibus discessērunt</latin>"
      answer: "MANY GREEKS LEFT FROM THE(IR) COUNTRY BY / IN SHIPS"
    boni:
      - question: "Translate the following sentence into English: <latin>Tribus hōrīs nūntiī vēnērunt</latin>"
        answer: "IN / WITHIN THREE HOURS MESSENGERS CAME"
      - question: "Translate the following sentence into English: <latin>Magnā vōce Publius dē bellō Pūnicō dīcēbat</latin>"
        answer: "WITH A GREAT VOICE / LOUDLY PUBLIUS SPOKE ABOUT THE PUNIC WAR"
  - tossup:
      question: "What use of the genitive is found in the following sentence: <latin>Paucī nostrum lūdōs spectāre poterāmus</latin>"
      answer: "PARTITIVE"
    boni:
      - question: "Translate the sentence in the toss-up"
        answer: "FEW OF US WERE ABLE TO / COULD WATCH THE GAMES"
      - question: "Without using a partitive genitive, say in Latin: Five of the gladiators were fighting in the arena"
        answer: "<latin>QUĪNQUE Ē GLADIĀTŌRIBUS IN ARĒNĀ PUGNĀBANT</latin>"
  - tossup:
      question: "What Roman consul of 218 B.C. was preparing to invade Carthage/Africa when he was recalled to Italy?"
      answer: "(TIBERIUS) SEMPRONIUS (LONGUS)"
    boni:
      - question: "Whose invasions of northern Italy caused the Senate to recall Sempronius?"
        answer: "HANNIBAL’S"
      - question: "At what river did Sempronius lead his army into a trap set by Hannibal?"
        answer: "TREBIA"
  - tossup:
      question: "Who rid the land route from Troezen to Athens of the numerous brigands and a monstrous sow?"
      answer: "THESEUS"
    boni:
      - question: "Near what village was the monster sow to be found?"
        answer: "CROMMYON"
      - question: "What was the sow’s name?"
        answer: "PHAEA"
  - tossup:
      question: "<latin>(As applause dies down from the score announcement, a “model” activates several glowsticks by bending and shaking them and hangs them with string from various body parts. The red stick hangs from the neck, the blue from the outstretched right arm, the white from the outstretched left arm, the yellow from the right ear and the green from the left ear.).</latin>  We are now introducing a new question format that involves props. As of this point, the toss-up has begun. Do not confer with your teammates until the toss-up has been completed. I will commence reading the question when the props have been arranged. <latin>Respondē Anglicē: Dē quā parte corporis pendet virga rubra?</latin>"
      answer: "NECK (The “model” takes off the sticks and places them on a small table to the side of the stage.)"
    boni:
      - question: "<latin>Vōs omnēs ambulātē ad mēnsam et pugnātē inter vōs quod virgam caeruleam cupitis.</latin>"
        answer: "ALL PLAYERS WALK TO THE TABLE AND FIGHT OVER THE BLUE STICK (The “model” removes all the sticks and places an unactivated glowstick in the table)"
      - question: "<latin>Flecte virgam et tolle eam ad caelum et clāmā Anglicē, “Lux fiat!”</latin>"
        answer: "ONE PLAYER BENDS THE STICK (HOPEFULLY IT WILL GLOW), LIFTS TOWARD THE SKY AND YELLS, “LET THERE BE LIGHT!”"
