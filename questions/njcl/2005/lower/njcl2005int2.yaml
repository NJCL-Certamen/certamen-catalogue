tournament: "NJCL Certamen"
year: 2005
division: "Intermediate"
round: "Round 2"
questions:
  - tossup:
      question: "Where did the Romans suffer their only serious naval defeat during the First Punic War?"
      answer: "DREPANA (NEAR SICILY IN 249 BC) (PASS OUT THE VISUAL)"
    boni:
      - question: "Who is “this guy”?"
        answer: "(ADMIRAL PUBLIUS) CLAUDIUS PULCHER"
      - question: "What prompted Clodius Pulcher’s actions in this picture?"
        answer: "THEY REFUSED TO EAT THE GRAIN / THEY WERE A BAD OMEN"
  - tossup:
      question: "What emperor made every free inhabitant of the empire a citizen and, therefore, a taxpayer?"
      answer: "CARACALLA"
    boni:
      - question: "Caracalla needed money for a military pay raise. To what amount had he raised the annual salary?"
        answer: "600 DENARII"
      - question: "The pay raise was Caracalla’s way of soothing the army’s anger over whose murder?"
        answer: "GETA’S"
  - tossup:
      question: "Where do Aeneas and his followers celebrate the funeral games in honor of Anchises?"
      answer: "SICILY (CITY OF ERYX)"
    boni:
      - question: "What does Juno cause some of the women to do in an effort to stop Aeneas from wandering and staying in Sicily?"
        answer: "SET FIRE TO THE SHIPS"
      - question: "What does Jupiter do to prevent the entire fleet from being destroyed?"
        answer: "SENDS RAINSTORM"
  - tossup:
      question: "Of the words <latin>stabulum, arcus, antrum, theātrum</latin>, and <latin>balneum</latin>, which is described here: <latin>Rōmānī</latin> <latin>mē</latin> <latin>aedificāvērunt ut imperātōrēs honōrārent</latin>."
      answer: "<latin>ARCUS</latin> "
    boni:
      - question: "Which of those words is described here: <latin>Saepe sacrum deō</latin> <latin>aut deae fuī. In</latin>  <latin>silvīs invenior</latin>."
        answer: "<latin>ANTRUM</latin> "
      - question: "Which of those words is described here: <latin>Iumenta et pecora in mē</latin> <latin>invenīrī</latin> <latin>possunt</latin>."
        answer: "<latin>STABULUM</latin> "
  - tossup:
      question: "Which of the following, if any, is <emphasis>not</emphasis> derived from the same Latin root as the others? cognate, nascent, renaissance, neonatal, nativity"
      answer: "NONE / THEY ALL ARE FROM <latin>NĀSCOR</latin> "
    boni:
      - question: "Give the principal parts of the Latin verb at the root of the words in the toss-up."
        answer: "<latin>NĀSCOR, NĀSCĪ, NĀTUS /-UM (SUM)</latin> "
      - question: "What derivative of <latin>nāscor</latin> is an English adjective used to describe someone who is lacking sophistication?"
        answer: "NAIVE"
  - tossup:
      question: "Who turns into a flower that follows the course of the sun through the sky each day?"
      answer: "CLYTIE / CLYTIË / CLYTIA"
    boni:
      - question: "Helios spurned Clytië because he was in love with what daughter of Orchamus?"
        answer: "LEUCOTHOË"
      - question: "When Leucothoë is buried alive by her father, into what does Helios transform her?"
        answer: "FRANKINCENSE TREE/SHRUB"
  - tossup:
      question: "Listen to the following passage about Athens and the Persian king Xerxes, which I will read twice, and answer IN ENGLISH the question that follows: <latin>Quīdam tyrannus dīcitur prīmus bibliothēcam pūblicam Athēnīs instituisse. Deinde cīvēs ipsī</latin> <latin>magnā</latin> <latin>dīligentiā</latin> <latin>cōpiam librōrum auxērunt, sed Xerxēs eam abstulit portāvitque in Persās.</latin>  Question: What was the tyrant the first to do?"
      answer: "ESTABLISH A PUBLIC LIBRARY"
    boni:
      - question: "Who increased the library’s collection?"
        answer: "CITIZENS/ATHENIANS"
      - question: "What happened to the library?"
        answer: "STOLEN BY XERXES & TAKEN TO PERSIA / TO THE PERSIANS"
  - tossup:
      question: "Translate the following sentence into Latin using a gerundive: They were sent to wage war."
      answer: "<latin>MISSĪ</latin> <latin>/ MISSAE SUNT AD BELLUM GERENDUM / MISSĪ</latin> <latin>/ MISSAE SUNT BELLĪ</latin> <latin>GERENDĪ</latin> <latin>CAUSĀ</latin> <latin>/ GRĀTIĀ</latin>"
    boni:
      - question: "Translate that same sentence again using a purpose clause."
        answer: "<latin>MISSĪ</latin> <latin>SUNT QUĪ</latin> <latin>BELLUM GERERENT</latin> / <latin>MISSAE SUNT QUAE BELLUM GERERENT</latin>  (If “ut” is given instead of “quī or quae,” accept the answer, but remind them of the better answer)"
      - question: "Translate this sentence using a passive periphrastic: The soldiers must wage war as soon as possible."
        answer: "<latin>MĪLITIBUS BELLUM QUAM PRĪMUM GERENDUM EST</latin> "
  - tossup:
      question: "<latin>Dēscrībāmus nunc proprietātēs dictiōnum in hāc sententiā, \"Gallia est omnis dīvīsa in partēs trēs.\" Quae pars ōrātiōnis est “est?”</latin>"
      answer: "<latin>VERBUM</latin>"
    boni:
      - question: "<latin>Quō</latin> <latin>cāsū</latin> <latin>est “partēs?”</latin>"
        answer: "<latin>ACCUSATĪVŌ</latin>"
      - question: "<latin>Quotae dēclīnātiōnis est “Gallia?”</latin>"
        answer: "<latin>PRĪMAE</latin> "
  - tossup:
      question: "During the Republic, who normally called meetings of the Senate?"
      answer: "CONSULS <latin>/ CŌNSULĒS</latin> "
    boni:
      - question: "If both consuls died in battle, who would summon the Senate?"
        answer: "<latin>INTERRĒX</latin> "
      - question: "In times of emergency, whose power superseded the consuls’ and allowed him to convene the Senate?"
        answer: "DICTATOR / <latin>MAGISTER EQUITUM</latin> "
  - tossup:
      question: "Make the form <latin>reddere</latin> perfect."
      answer: "<latin>REDDIDISSE</latin> "
    boni:
      - question: "Do the same for the form <latin>dīgredī</latin>."
        answer: "<latin>DĪGRESSUS / -A / -UM ESSE</latin> "
      - question: "Do the same for the form <latin>cavēre</latin>."
        answer: "<latin>CĀVISSE</latin>"
  - tossup:
      question: "Translate the following sentence into English: <latin>Nescīvimus ubi exercitus iter faceret.</latin>"
      answer: "WE DIDN’T KNOW WHERE THE ARMY WAS MARCHING / MARCHED"
    boni:
      - question: "<latin>Nōbīs ubi sumus manendum est</latin>."
        answer: "WE MUST STAY WHERE WE ARE"
      - question: "<latin>Timeō</latin> <latin>nē</latin> <latin>equitēs interfectī</latin> <latin>sint</latin>."
        answer: "I FEAR THAT THE HORSEMEN / KNIGHTS HAVE BEEN KILLED"
  - tossup:
      question: "What Latin phrase is used in English to mean “done as a formality”?"
      answer: "<latin>PRŌ</latin> <latin>FORMĀ</latin>"
    boni:
      - question: "What Latin phrase is used in English to mean “an illogical conclusion”?"
        answer: "<latin>NŌN SEQUITUR</latin> "
      - question: "“<latin>Rara avis</latin>” means “a rarity.” What Latin phrase is used in English to mean “one of a kind”?"
        answer: "<latin>SUĪ</latin> <latin>GENERIS</latin> "
  - tossup:
      question: "What group was promised victory by the Delphic oracle if Alcmaeon was their leader?"
      answer: "EPIGONI / EPIGONOI (THE SONS OF THE SEVEN AGAINST THEBES)"
    boni:
      - question: "Name the father of Alcmaeon, who had been one of the Seven against Thebes."
        answer: "AMPHIARAUS"
      - question: "Which member of the Seven against Thebes accompanied the Epigoni to Thebes?"
        answer: "ADRASTUS"
  - tossup:
      question: "Give an antonym of the participle <latin>rīdēns</latin>."
      answer: "<latin>LACRIMĀNS, DOLĒNS, FLĒNS, PLORĀNS</latin> "
    boni:
      - question: "<latin>struēns</latin>."
        answer: "<latin>DĒSTRUĒNS, DĒLĒNS, VASTĀNS, PERDĒNS</latin>"
      - question: "<latin>iuvāns</latin>."
        answer: "<latin>LAEDĒNS, NŌCĒNS, OBSTĀNS, PROHIBĒNS, IMPEDIĒNS</latin> "
  - tossup:
      question: "Complete the following analogy: <latin>amās</latin> : <latin>amāvistī</latin> :: <latin>manēs</latin> : ______?"
      answer: "<latin>MĀNSISTĪ</latin>"
    boni:
      - question: "<latin>mānsistī</latin> : <latin>manēbis</latin> :: <latin>mūnīvistī</latin> : _____?"
        answer: "<latin>MŪNIĒS</latin>"
      - question: "<latin>mūniēs</latin> : <latin>mūniēbās</latin> :: <latin>poteris</latin> : _____?"
        answer: "<latin>POTERĀS</latin> "
  - tossup:
      question: "What goddess of sorcery and witchcraft, who lived in the underworld, is linked to Artemis?"
      answer: "HECATE / TRIVIA"
    boni:
      - question: "Where were statues erected to Hecate in the ancient world?"
        answer: "AT CROSSROADS"
      - question: "What was unusual about Hecate’s physical form?THREE"
        answer: "HEADS/FACES and/or THREE BODIES (LION, DOG, & MARE)"
  - tossup:
      question: "When Tiberius was called away to suppress a revolt in Pannonia, who was given the command in Germany in 9 AD?"
      answer: "(QUINCTILIUS) VARUS"
    boni:
      - question: "Where did Varus suffer a disastrous rout in Germany?"
        answer: "TEUTOBURG FOREST"
      - question: "Name the German leader who ambushed Varus in the Teutoburg Forest."
        answer: "ARMINIUS / HERMAN"
  - tossup:
      question: "What unusual hospitality was offered to travelers who spent the night in Procrustes’ inn?"
      answer: "FIT THEM TO THE BED BY CUTTING OR STRETCHING THEIR LIMBS TO LENGTH OF THE BED"
    boni:
      - question: "What was Procrustes’ actual name?"
        answer: "DAMASTES or POLYPEMON"
      - question: "Who offered the same hospitality to Procrustes, but cut off his head when he was too tall for the bed?"
        answer: "THESEUS"
  - tossup:
      question: "In whose reorganization of the Roman legion, were soldiers taught to use the cut-and thrust techniques used by gladiators?"
      answer: "(C.) MARIUS"
    boni:
      - question: "What two Germanic tribes was Marius preparing his legions to fight?"
        answer: "CIMBRI and TEUTONES"
      - question: "Where did Marius and his co-consul Catulus defeat the Cimbri in 101 B.C.?"
        answer: "VERCELLAE"
