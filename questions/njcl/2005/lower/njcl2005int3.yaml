tournament: "NJCL Certamen"
year: 2005
division: "Intermediate"
round: "Round 3"
questions:
  - tossup:
      question: "What huge Greek warrior at Troy insults the gods by saying “With the help of the gods, any coward or fool can win glory; I trust to do so even without them!”"
      answer: "AJAX <emphasis>TELAMON /</emphasis> THE <emphasis>GREATER</emphasis> "
    boni:
      - question: "What decision so insults his honor and pride as a warrior that Ajax goes berserk?"
        answer: "DECISION TO AWARD ACHILLES’ ARMOR TO ODYSSEUS"
      - question: "What does Ajax do when he goes mad and what was his reasoning for doing so?"
        answer: "SLAUGHTERS CATTLE (OF THE GREEK FORCES) IMAGINING THEM TO BE THE GREEK LEADERS (WHO HAD INSULTED HIM)"
  - tossup:
      question: "Where did two Roman consuls defeat and slay Hasdrubal in 211 BC?"
      answer: "METAURUS RIVER (Pass out the visual)"
    boni:
      - question: "Who is letter “B”?"
        answer: "HANNIBAL"
      - question: "Who sent letter “A” to Hannibal?"
        answer: "(GAIUS) CLAUDIUS <emphasis>NERO</emphasis> (ONE OF THE VICTORIOUS CONSULS)"
  - tossup:
      question: "Why was the population of the island of Lemnos so happy to welcome the Argonauts?"
      answer: "NO MEN (WOMEN HAD KILLED ALL THE MEN or MEN HAD DESERTED THE WOMEN BECAUSE OF THEIR HORRIBLE SMELL)"
    boni:
      - question: "Who was the queen of Lemnos who royally entertained Jason?"
        answer: "HYPSIPYLE"
      - question: "Which of the Argonauts had to remind the others that they needed to get on with their expedition?"
        answer: "HERACLES / HERCULES"
  - tossup:
      question: "For the verb <latin>pingō</latin>, give the 3rd person plural, imperfect passive subjunctive."
      answer: "<latin>PINGERENTUR</latin> "
    boni:
      - question: "Change <latin>pingerentur</latin> to the present tense."
        answer: "<latin>PINGANTUR</latin> "
      - question: "Change <latin>pingantur</latin> to the perfect tense."
        answer: "<latin>PICTĪ</latin> <latin>/ -AE / -A SINT</latin> "
  - tossup:
      question: "Translate the following sentence into English: <latin>Quid accidit Rōmae, manet Rōmae.</latin>"
      answer: "WHAT HAPPENS / HAPPENED IN ROME STAYS IN ROME"
    boni:
      - question: "<latin>Virī</latin> <latin>multam pecūniam obtinēre volunt, mulierēs amōrem</latin>."
        answer: "MEN WANT TO GET A LOT OF MONEY. WOMEN (WANT TO WIN) LOVE"
      - question: "<latin>Cūr virī</latin> <latin>plūs pecūniae volunt? Quod mulierēs haud vīlēs sunt</latin>."
        answer: "WHY DO MEN WANT MORE MONEY? BECAUSE WIVES / WOMEN ARE HARDLY / NOT CHEAP"
  - tossup:
      question: "Differentiate in meaning between the nouns <latin>cāseus</latin> and <latin>cāsus</latin>."
      answer: "<latin>CĀSEUS</latin> - CHEESE <latin>CĀSUS</latin> - CASE, FALL, MISFORTUNE, DESTRUCTION, EVENT, OCCASION"
    boni:
      - question: "between the nouns <latin>conubium</latin> and <latin>convīvium</latin>."
        answer: "<latin>CONUBIUM</latin> - MARRIAGE, WEDLOCK <latin>CONVĪVIUM</latin> - PARTY, BANQUET, A LIVING TOGETHER"
      - question: "between the nouns <latin>nōmen</latin> and <latin>nūmen</latin>."
        answer: "<latin>NŌMEN</latin> - NAME <latin>NŪMEN</latin> - DIVINE ENTITY, DEITY, GOD"
  - tossup:
      question: "What derivative of the Latin noun for “gift or duty” means “having a total resistance to a disease”?"
      answer: "IMMUNE, IMMUNIZED"
    boni:
      - question: "What derivative of the Latin verb for “dip or plunge” means “to cover completely with liquid”?"
        answer: "IMMERSE, SUBMERGE, IMMERGE, SUBMERSE"
      - question: "What derivative of the Latin verb for “threaten” means “impending”?"
        answer: "IMMINENT"
  - tossup:
      question: "Who complained to Zeus that some of his cattle had been slaughtered and eaten by Odysseus’ men?"
      answer: "HELIOS / HELIUS/ HYPERION"
    boni:
      - question: "How did Zeus punish Odysseus’ men for their crime?"
        answer: "SENT A FIERCE STORM - (EVERYONE BUT ODYSSEUS DROWNED) / HE DROWNED THEM"
      - question: "On what island did Odysseus drift ashore nine days later?"
        answer: "OGYGIA"
  - tossup:
      question: "Who was torn limb from limb by Thracian Maenads because he avoided the company of women after the death of his wife Eurydice?"
      answer: "ORPHEUS"
    boni:
      - question: "Into what river did they throw Orpheus’ severed head?"
        answer: "HEBRUS"
      - question: "To what island did Orpheus’ head, still singing, float?"
        answer: "LESBOS"
  - tossup:
      question: "When recognized by the spotter, follow this Latin instruction: <latin>Dīc mihi Anglicē</latin> <latin>ubi sit triclīnium.</latin> "
      answer: "STUDENT SHOULD SAY IN ENGLISH WHERE THE DINING ROOM/HALL IS"
    boni:
      - question: "<latin>Ostendite mihi, quaesō, vestrās linguās</latin>."
        answer: "MORE THAN ONE STUDENT SHOULD SHOW THEIR TONGUES"
      - question: "<latin>Dīc mihi Anglicē</latin> <latin>quid heri cēnāverīs</latin> "
        answer: "ONE STUDENT SHOULD SAY WHAT HE ATE FOR DINNER YESTERDAY (Any reasonable answer should be taken, but use good judgement)"
  - tossup:
      question: "What building in the Forum Romanum, near the house of the Vestals, was the headquarters of the Pontifex Maximus and was the legendary home of Numa Pompilius?"
      answer: "REGIA"
    boni:
      - question: "Which god had a shrine in the Regia?"
        answer: "MARS or OPS (both did, but only one is required)"
      - question: "What items sacred to Mars were stored in the Regia for use once a year by the Salian priests?"
        answer: "(SACRED) SHIELDS / ANCILES / <latin>ANCILIA</latin> "
  - tossup:
      question: "How is a medicine administered if the prescription uses the abbreviation <latin>gutt</latin>.?"
      answer: "DROPS"
    boni:
      - question: "Where are those drops to be administered if the prescription says <latin>o. d.</latin>?"
        answer: "IN RIGHT EYE"
      - question: "When should those drops be administered if the prescription says <latin>n. et m</latin>.?"
        answer: "AT NIGHT & IN THE MORNING"
  - tossup:
      question: "Whom did Cicero attempt to defend for the murder of Clodius Pulcher?"
      answer: "(T. ANNIUS) MILO"
    boni:
      - question: "What building in the forum did a mob of Clodius’ supporters burn down during the riots after his death?"
        answer: "SENATE HOUSE / CURIA (HOSTILIA)"
      - question: "Who was given extraordinary powers to restore order in Rome at this time?"
        answer: "POMPEY / (CN.) POMPEIUS (MAGNUS)"
  - tossup:
      question: "Who unsuccessfully negotiated with the Roman ambassador Gaius Fabricius in an attempt to get the Romans to abandon all of southern Italy in 279 B.C.?"
      answer: "PYRRHUS"
    boni:
      - question: "Who convinced the Senate to reject these conditions for peace after the battle of Heraclea?"
        answer: "APPIUS CLAUDIUS <emphasis>CAECUS /</emphasis> <emphasis>CENSOR</emphasis> "
      - question: "Who was the Roman consul who later defeated Pyrrhus at Beneventum in 275 BC?"
        answer: "(MANIUS CURIUS) DENTATUS"
  - tossup:
      question: "What menial task did Eurystheus assign as one of Heracles’ labors in order to humiliate him?"
      answer: "CLEANING THE AUGEAN STABLES"
    boni:
      - question: "How did Heracles accomplish this task in one day and without getting his hands dirty?"
        answer: "BY DIVERTING ONE / TWO RIVERS (ALPHEUS & PENEUS or MENIUS) TO WASH OUT THE STABLES"
      - question: "How did Eurystheus penalize Heracles’ ingenuity?"
        answer: "REFUSED TO COUNT IT AS ONE OF LABORS / ADDED ANOTHER LABOR"
  - tossup:
      question: "Translate the following sentence into Latin: Quintus is saying that the Gauls are attacking our city."
      answer: "<latin>QUĪNTUS DĪCIT GALLŌS NOSTRAM URBEM OPPŪGNĀRE / AGGREDĪ</latin>"
    boni:
      - question: "Quintus, do you believe that the Gauls will fight bravely?"
        answer: "<latin>QUĪNTE, CRĒDISNE GALLŌS FORTITER PŪGNĀTŪRŌS ESSE</latin> "
      - question: "We fear that the Gauls are entering the city."
        answer: "<latin>TIMĒMUS / VERĒMUR NĒ</latin> <latin>GALLĪ</latin> <latin>(IN) URBEM INTRENT / INGREDIANTUR</latin>"
  - tossup:
      question: "What letter signifies the singular of the locative case for a second declension noun?"
      answer: "Ī"
    boni:
      - question: "What letters signify the plural of the locative case for a second declension noun?"
        answer: "<latin>ĪS</latin> "
      - question: "What letters signify the plural of the locative case for a third declension noun?"
        answer: "<latin>IBUS / BUS</latin> "
  - tossup:
      question: "Which Roman emperor founded Rome’s first known institution for higher education, with a concentration on Greek literature, in A.D. 135?"
      answer: "HADRIAN"
    boni:
      - question: "What was the name of this institution?"
        answer: "ATHENAEUM"
      - question: "What emperor was the first to pay the Latin and Greek rhetoricians in Rome?"
        answer: "VESPASIAN"
  - tossup:
      question: "Translate into Latin: A woman of great wisdom."
      answer: "<latin>MULIER / FĒMINA MAGNAE SAPIENTIAE / MAGNĀ</latin> <latin>SAPIENTIĀ</latin>"
    boni:
      - question: "What use of the genitive case is found in this sentence: <latin>Aliquot nostrōrum spem omnem āmīsimus.</latin>"
        answer: "PARTITIVE / OF THE WHOLE"
      - question: "Which of the following, if any, is NOT a use of the Genitive case: with verbs of remembering and forgetting, objective, charge & penalty, specification ."
        answer: "SPECIFICATION"
  - tossup:
      question: "Listen carefully to the following passage, which I will read twice, and answer IN ENGLISH the question that follows: <latin>Nox erat frīgida cum gladiātor, nōmine Pugnāx, vetus et fessus, prope ignem recumbēbat. Vehementer salūtābātur ā</latin> <latin>lanistā</latin> <latin>suō</latin> <latin>quī</latin> <latin>gladiātōrī</latin> <latin>ait, “Āvē, Pugnāx!” et lignum eī</latin> <latin>trādidit. Gladiātor gaudēns, multīs lacrimīs fūsīs, exclāmāvit, “Euge! Tandem līberor!” Contrā</latin> <latin>lanista dīxit, “Caudex! Tē</latin> <latin>lībertum nōn faciō! Pōne istum lignum in flāmmīs! Tempestās est frīgida!”</latin>  Question: What was Pugnax the gladiator doing when his trainer saluted him?"
      answer: "HE WAS SITTING / RECLINING BY THE FIRE"
    boni:
      - question: "Why was the gladiator happy?"
        answer: "HE THOUGHT THAT HE HAD BEEN GIVEN HIS FREEDOM (If student answers, “... because he was given a wooden stick,” ask for more information)"
      - question: "Why did the gladiator trainer really give Pugnax the stick?"
        answer: "BECAUSE IT WAS COLD OUTSIDE AND HE WANTED HIM TO PUT IT IN THE FIRE"
