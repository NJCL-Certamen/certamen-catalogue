tournament: "NJCL Certamen"
year: 2005
division: "Intermediate"
round: "Finals"
questions:
  - tossup:
      question: "Give the Latin verb and its meaning at the root of “pry,” ”prison,” and “apprehend.”"
      answer: "<latin>PREHENDŌ, PREHENDERE</latin> - TAKE HOLD OF, SEIZE, CATCH or <latin>PRAEHENDŌ, PRAEHENDERE</latin> "
    boni:
      - question: "What English derivative of the perfect participle of <latin>prehendō</latin> means “one who is learning a trade or occupation”?"
        answer: "APPRENTICE"
      - question: "What derivative of <latin>prehendō</latin> means “one who organizes, manages, and assumes the risks of a business”?"
        answer: "ENTREPRENEUR"
  - tossup:
      question: "Give the ablative singular of the phrase, “one wide sea.”"
      answer: "<latin>ŪNŌ</latin> <latin>LĀTŌ</latin> <latin>MARĪ</latin> <latin>/ MARE</latin> "
    boni:
      - question: "Give the ablative singular of the phrase, “that flowing river.”"
        answer: "<latin>ILLŌ</latin> <latin>FLŪMINE / FLUVIŌ</latin> <latin>FLUENTE / -Ī</latin>"
      - question: "Give the ablative singular of the phrase, “the gladiator himself about to die.”"
        answer: "<latin>GLADIĀTŌRE IPSŌ</latin> <latin>MORITŪRŌ</latin>"
  - tossup:
      question: "Aeneas and twenty boatloads of followers intended to settle in Thrace. Whose ghost warned them away?"
      answer: "GHOST OF POLYDORUS"
    boni:
      - question: "When the oracle of Apollo on Delos tells them to seek “the ancient mother of their race,” what land does Anchises think is their goal?"
        answer: "CRETE"
      - question: "Who finally tells Aeneas in a dream that the land they seek is Italy?"
        answer: "(HIS) PENATES"
  - tossup:
      question: "<latin>Ambulās in urbe Rōmā</latin> <latin>antīquā. Vidēs mōntem quī</latin> <latin>templum Iovis Optimī</latin> <latin>Maximī</latin> <latin>tenet. Quem montem vidēs?</latin> "
      answer: "<latin>(MŌNTEM) CAPITOLĪNUM / CAPITOLIUM</latin> "
    boni:
      - question: "<latin>Sub montem capitolīnum, vidēs locum in quō</latin> <latin>captīvī</latin> <latin>tenentur. Quem locum vidēs?</latin>"
        answer: "<latin>CARCEREM / TULLIĀNUM</latin>"
      - question: "<latin>Haud procul ab Circō</latin> <latin>Maximō</latin> <latin>vidēs flūmen famōsum quod per Rōmam fluit. Quod flūmen vidēs?</latin>"
        answer: "<latin>(FLŪMEN) TIBERIM</latin> (Ask student to spell answer. Check for the “-im” ending on “<latin>Tiberim</latin>”)"
  - tossup:
      question: "Wait until you are instructed to open your visuals. (PASS OUT THE VISUALS) Open your visual and study it for 5 seconds. (WAIT A MOMENT FOR THE STUDENTS TO OPEN AND STUDY THEM) What deity sent the chariot in which figure “A” is escaping?"
      answer: "HELIOS / HELIUS"
    boni:
      - question: "Identify by name the figures indicated by the letter ēC”."
        answer: "MERMERUS & PHERES (SONS OF JASON & MEDEA)"
      - question: "Identify the figures labeled “D” on both sides of the vase and explain why they are present in this scene."
        answer: "ERINYES / FURIES - THEY PUNISHED THOSE WHO MURDER / <emphasis>INJURE THEIR OWN KIN</emphasis> "
  - tossup:
      question: "What use of the ablative case is found in the following sentence? <latin>Victoria nōs omnī</latin> <latin>metū</latin> <latin>līberābit</latin>."
      answer: "SEPARATION"
    boni:
      - question: "<latin>Centum aureīs equum mihi vēndidit</latin>."
        answer: "(SPECIFIC) PRICE"
      - question: "Translate this sentence into Latin : He sold me a horse for a small price."
        answer: "<latin>EQUUM MIHI VĒNDIDIT PARVĪ</latin> <latin>(PRETIĪ)</latin> "
  - tossup:
      question: "<latin>Audī</latin> <latin>dīligenter et respondē</latin> <latin>aut Anglicē</latin> <latin>aut Latīnē: Quis sum? Iūdicābar uxor optima. Posteā</latin> <latin>manū</latin> <latin>meā</latin> <latin>mē</latin> <latin>cecīdī</latin> <latin>quod Sextus Tarquinius mihi vim attulit. Propter mē</latin> <latin>Rēs Publica incēpit.</latin> "
      answer: "<latin>LŪCRĒTIA</latin> / LUCRETIA"
    boni:
      - question: "<latin>Quis sum? Bellō</latin> <latin>contrā</latin> <latin>Rōmānōs confectō, Sulla quaestor Bocchō</latin> <latin>persuāsit ut mē</latin> <latin>Rōmānīs trāderet. Vinctus et ad Gāium Marium dēductus, in carcere necātus sum. Numidicus fuī.</latin> "
        answer: "<latin>IUGURTHA</latin> / JUGURTHA"
      - question: "<latin>Quis sum? In Bellō</latin> <latin>Punicō</latin> <latin>Prīmō, Carthāginiēnsēs pācem petere coēgī. Cum pācem eīs dare nōllem nisi dūrissimīs condiciōnibus, Xanthippum contrā</latin> <latin>mē</latin> <latin>mīsērunt, ā</latin> <latin>quō</latin> <latin>victus sum.</latin> "
        answer: "<latin>(MARCUS ATĪLIUS) RĒGULUS</latin> / (MARCUS ATILIUS) REGULUS"
  - tossup:
      question: "At what stop of the journey home did Odysseus lose all of his ships but one?"
      answer: "LAND OF LAESTRYGONIANS ( city called TELEPYLUS)"
    boni:
      - question: "How did the giant Laestrygonians destroy the ships in their harbor?"
        answer: "THREW STONES (WITH SLINGS FROM THE SURROUNDING CLIFFS & SANK THE SHIPS)"
      - question: "What happened to the crews?"
        answer: "LAESTRYGONIANS ATE THEM"
  - tossup:
      question: "In which modern country would you find the site of the ancient Roman city Aelia Capitolina?"
      answer: "ISRAEL (Aelia Capitolina is Jerusalem)"
    boni:
      - question: "In which modern country would you find the site of the ancient Roman city Colonia Agrippinensis?"
        answer: "GERMANY (Colonia Agrippinensis is Cologne)"
      - question: "In which modern country would you find the site of ancient Tomi?"
        answer: "ROMANIA (on the Black Sea coast)"
  - tossup:
      question: "Using <latin>iubeō</latin>, translate the following sentence into Latin: The consul ordered the lictors to follow."
      answer: "<latin>CŌNSUL IUSSIT LICTŌRĒS SEQUĪ</latin>"
    boni:
      - question: "Using <latin>rogō</latin>, translate: Rufus is asking why the lictors are not carrying the fasces."
        answer: "<latin>RŪFUS ROGAT CŪR LICTŌRĒS FASCĒS NŌN PORTENT</latin> "
      - question: "Using <latin>imperō</latin>, translate: The senate ordered the consul to stay at home."
        answer: "<latin>SENĀTUS CŌNSULĪ</latin> <latin>IMPERĀVIT UT DOMĪ</latin> <latin>MANĒRET /</latin>  <latin>SENĀTUS IMPERĀVIT UT CŌNSUL DOMĪ</latin> <latin>MANĒRET</latin> "
  - tossup:
      question: "Give a synonym of the verb <latin>inveniō</latin>."
      answer: "<latin>REPERIŌ, COMPERIŌ</latin>"
    boni:
      - question: "<latin>metuō</latin>."
        answer: "<latin>TIMEŌ, VEREOR</latin>"
      - question: "<latin>perdō</latin>."
        answer: "<latin>DĒSTRUŌ, VASTŌ, DĒLĒO</latin> "
  - tossup:
      question: "What guerrilla leader trapped an entire Roman army in Lusitania in 141 BC, but spared them in exchange for a treaty?"
      answer: "VIRIATHUS"
    boni:
      - question: "How did Rome, not wishing to honor this treaty respecting Lusitanian freedom, get rid of Viriathus?"
        answer: "ASSASSINATION (THE COMMANDER CAEPIO BRIBES LUSITANIANS TO SLIT HIS THROAT)"
      - question: "What Roman governor, the ancestor of a future emperor, had caused Viriathus’ revolt by massacring 30,000 unarmed Lusitanians?"
        answer: "(SERVIUS SULPICIUS) GALBA (Do not accept “Servius ... Galba <emphasis>Maximus</emphasis>”)"
  - tossup:
      question: "Who seduced the wife of Atreus in order to be the rule of Mycenae?"
      answer: "THYESTES"
    boni:
      - question: "Who was the wife of Atreus?"
        answer: "AEROPE"
      - question: "How did Atreus get revenge?"
        answer: "FED THYESTES HIS OWN SONS AT A BANQUET"
  - tossup:
      question: "What would your profession be if you were listed in the <title><latin>Lexicon Recentis Latīnitātis</latin></title>, or <title>Dictionary of Modern Latin</title>, as a “<latin>medicus dentium</latin>?”"
      answer: "DENTIST"
    boni:
      - question: "What item is described in this dictionary as “<latin>quod splendidōs facit dentēs et</latin>  <latin>confirmat</latin>?”"
        answer: "TOOTHPASTE"
      - question: "Who would you be if you were listed in the dictionary as an “<latin>armentārius</latin>” or “<latin>pecuārius</latin>?”"
        answer: "COWBOY / HORSEMAN / CATTLEMAN / HERDER"
  - tossup:
      question: "Listen carefully to the following passage, which I will read twice, and answer IN LATIN the question that follows: <latin>Multī</latin> <latin>cīvēs extrā</latin> <latin>templum manēbant. Nam indicium exspectābant quod novum Pontificem Maximum significāret. Intrā</latin> <latin>templum, autem, paucī</latin> <latin>pullī</latin> <latin>sacrī</latin> <latin>in ignem forte cecidērunt et mortuī</latin> <latin>sunt. Quā</latin> <latin>dē</latin> <latin>caus</latin><latin>ā,</latin> <latin>āter fūmus sursum ex templō</latin> <latin>ascendit. Tam attonitī</latin> <latin>erant cīvēs ut gaudērent, dīcentēs, “Pontificem Maximum habēmus!”</latin>  Question: <latin>Cūr cīvēs extrā</latin> <latin>templum manēbant</latin>?"
      answer: "<latin>INDICIUM EXSPECTĀBANT (QUOD NOVUM PONTIFICEM MAXIMUM SIGNIFICĀRET) /</latin>  <latin>NOVUM PONTIFICEM MAXIMUM EXSPECTĀBANT</latin> "
    boni:
      - question: "<latin>Quid accidit in templō</latin>?"
        answer: "<latin>(PAUCĪ) PULLĪ</latin> <latin>IN IGNEM CECIDĒRUNT / MORTUĪ</latin> <latin>SUNT</latin> "
      - question: "<latin>Fūmō</latin> <latin>vīsō, quid putābant cīvēs</latin>?"
        answer: "<latin>(NOVUM) PONTIFICEM MAXIMUM HABĒRE / ESSE / HABĒBANT / HABUĒRUNT / NOVUS PONTIFEX MAXIMUM ERAT / FUIT</latin> "
  - tossup:
      question: "Who oversaw a temporary autocracy in Rome in Caesar’s absence as his <latin>magister equitum</latin>?"
      answer: "(MARK) ANTONY / (M.) ANTONIUS"
    boni:
      - question: "In 47 BC soldiers under Antony’s command quelled a riot in Rome, leaving some 800 dead in the forum. These riots were a result of a failed bill for the cancellation of debts proposed by which tribune and son-in-law of Cicero?"
        answer: "(P. CORNELIUS) DOLABELLA"
      - question: "Antony apparently lost favor with Caesar to some degree due to his heavy-handed tactics in dealing with this riot. Whom did Caesar choose to replace Antony as his next <latin>magister equitum</latin>?"
        answer: "(M. AEMILIUS) LEPIDUS"
  - tossup:
      question: "Whose daughters threw themselves off the Acropolis when they saw the baby Erichthonius?"
      answer: "CECROPS’"
    boni:
      - question: "What was so terrifying about the baby’s appearance?"
        answer: "SNAKE’S TAIL IN PLACE OF LEGS / IT WAS A SNAKE / SNAKE COILED AROUND A BABY"
      - question: "Erichthonius was the result of whose attempt to make love to Athena?"
        answer: "HEPHAESTUS’"
  - tossup:
      question: "You are a devout vegetarian in ancient Pompeii. Which of the following would you refuse to eat: <latin>frumentum, mālum, cicer, faba, iecur.</latin> "
      answer: "<latin>IECUR</latin> "
    boni:
      - question: "Living on an ancient Roman farm, you have a beloved pet pig, named Metellus, who is your <latin>vade mecum</latin>, and you can’t stand the thought of eating any pig meat. Which of the following <emphasis>would</emphasis> you eat: <latin>sūs, aper, būbula, scrōfa.</latin> "
        answer: "<latin>BŪBULA</latin> "
      - question: "You live on the Mediterranean in ancient Capreae and, tragically, you are allergic to seafood. Which of the following <emphasis>could</emphasis> you eat: <latin>mullus, rhombus, glīs, ostreae.</latin>"
        answer: "<latin>GLĪS</latin> "
  - tossup:
      question: "Translate the following sentence into English: <latin>Avāritia magnō</latin> <latin>malō</latin> <latin>est hominibus</latin>."
      answer: "GREED IS A GREAT EVIL / WRONG FOR MEN / HUMANS"
    boni:
      - question: "<latin>Nōn solum virī</latin> <latin>sed etiam fēminae fēlīciter vīvere volunt</latin>."
        answer: "NOT ONLY MEN BUT WOMEN WANT TO LIVE HAPPILY"
      - question: "<latin>Nē</latin> <latin>inimīcōs iuvēmus nēve amīcīs noceāmus.</latin> "
        answer: "LET US NOT HELP (OUR) ENEMIES, AND LET US NOT HARM OUR FRIENDS"
  - tossup:
      question: "On a Roman tombstone, what is the Latin and English for the abbreviation <latin>DM</latin>?"
      answer: "<latin>DIS MANIBUS</latin> - TO THE SPIRITS OF THE DEPARTED / DEAD"
    boni:
      - question: "What is the Latin and English for the abbreviation <latin>HIS</latin>?"
        answer: "<latin>HIC IACET SEPULTUS</latin> - LIES BURIED HERE or any variation"
      - question: "What is the Latin and English for the abbreviation <latin>STTL</latin>?"
        answer: "<latin>SIT TIBI TERRA LEVIS</latin> - MAY THE LAND REST LIGHTLY UPON YOU / MAY THE EARTH BE LIGHT FOR YOU"
