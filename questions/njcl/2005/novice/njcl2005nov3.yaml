tournament: "NJCL Certamen"
year: 2005
division: "Novice"
round: "Round 3"
questions:
  - tossup:
      question: "You are a doctor in ancient Rome, and since you speak Latin, you know that the word for “fever” is <latin>febris</latin>. What are you asking a patient when you say, “<latin>Quamdiū</latin> <latin>habēs febrem</latin>?”"
      answer: "<emphasis>HOW LONG</emphasis> HE HAS HAD THE FEVER / <emphasis>HOW LONG</emphasis> HAVE YOU HAD THE FEVER?"
    boni:
      - question: "You then tell the patient, “<latin>Necesse est tibi manēre in lectō</latin> <latin>trēs diēs</latin>.” What is your diagnosis?"
        answer: "HE NEEDS TO STAY IN BED FOR THREE DAYS"
      - question: "Finally, you say, <latin>“Quārtō</latin> <latin>diē, sacrificā</latin> <latin>caprum in templō</latin> <latin>Apollinis</latin>.” What are your instructions?"
        answer: "ON THE FOURTH DAY, THEY ARE TO SACRIFICE A GOAT IN THE TEMPLE OF APOLLO"
  - tossup:
      question: "Say in Latin, “They have sailed.”"
      answer: "<latin>NĀVIGĀVĒRUNT</latin> "
    boni:
      - question: "Say in Latin, “They have wanted.”"
        answer: "<latin>VOLUĒRUNT</latin> / <latin>CUPĪVĒRUNT</latin> / <latin>DĒSĪDERĀVĒRUNT / OPTĀVĒRUNT</latin> "
      - question: "Say in Latin, “We do not want to fly.”"
        answer: "<latin>VŌLĀRE NŌLUMUS / VŌLĀRE NŌN DĒSĪDERĀMUS / CUPIMUS</latin> "
  - tossup:
      question: "Who appears to Aeneas in a dream and warns him to flee burning Troy?"
      answer: "HECTOR"
    boni:
      - question: "Whom does Aeneas carry out of Troy on his shoulders?"
        answer: "(HIS FATHER) ANCHISES"
      - question: "What does Anchises carry in his arms?"
        answer: "THE PENATES or HOUSEHOLD GODS"
  - tossup:
      question: "Who was pursued by the Erinyes for the murder of his mother Clytemnestra?"
      answer: "ORESTES"
    boni:
      - question: "In what city was Orestes eventually tried in court for the murder of his mother?"
        answer: "ATHENS"
      - question: "Who cast the tie-breaking vote for Orestes’ acquittal?"
        answer: "ATHENA"
  - tossup:
      question: "Listen carefully to the following passage, which I will read twice, and answer IN ENGLISH, the question that follows: <latin>Miser poēta versūs suōs imperātōrī</latin> <latin>dedit. Posterō</latin> <latin>diē</latin> <latin>poēta eī</latin> <latin>dīxit, “Quī</latin> <latin>versūs tibi placēbant,” Cui respondit imperātor, “Illī</latin> <latin>versūs quōs mihi nōn dedistī.” Hīs verbīs attonitus, poēta mīles fiēbat.</latin>  Question: What did the poet ask the emperor about his poems?"
      answer: "WHICH VERSES / POEMS THE EMPEROR LIKED / WHICH VERSES / POEMS WERE PLEASING TO THE EMPEROR"
    boni:
      - question: "How many poems did the emperor like?"
        answer: "ZERO / NONE OF THEM"
      - question: "How did the poet take this information, and what did he do?"
        answer: "HE WAS ASTONISHED / DISTRAUGHT and HE BECAME A SOLDIER"
  - tossup:
      question: "How often should you take your medicine if the prescription includes the abbreviation <latin>t.i.d.</latin>?"
      answer: "<latin>THREE TIMES A DAY</latin> "
    boni:
      - question: "When should you take the medicine if the prescription includes the abbreviation <latin>p.c.</latin>?"
        answer: "<latin>AFTER MEALS</latin> "
      - question: "How much medicine should you take if the prescription contains the abbreviation <latin>coch. parv.</latin>?"
        answer: "<latin>TEASPOON</latin> or <latin>SMALL SPOONFUL</latin> "
  - tossup:
      question: "Who led an attack against Rome in an attempt to restore Tarquin to the throne?"
      answer: "LARS <emphasis>PORSENA</emphasis> (KING OF CLUSIUM) (PASS OUT THE VISUAL)"
    boni:
      - question: "Who is the Roman soldier labeled “A”?"
        answer: "HORATIUS (COCLES / ONE-EYED)"
      - question: "Which bridge is depicted here?"
        answer: "(<latin>PONS</latin>) <latin>SUBLICIUS</latin> / SUBLICIAN"
  - tossup:
      question: "Whom does Circe tell Odysseus he must consult in the Underworld if he wants to return to his home Ithaca?"
      answer: "T(E)IRESIAS"
    boni:
      - question: "What does Hermes give Odysseus on his way to rescue his men that protects him from Circe’s magic?"
        answer: "MOLY"
      - question: "Who brings the news to Odysseus that Circe has turned the men of his scouting party into swine?"
        answer: "EURYLOCHUS"
  - tossup:
      question: "Name the consul of 217 B.C. who was ambushed by Hannibal at Lake Trasimene."
      answer: "(C.) FLAMINIUS"
    boni:
      - question: "After this defeat, what political opponent of Flaminius was named as dictator?"
        answer: "(QUINTUS) FABIUS MAXIMUS (VERRUCOSUS CUNCTATOR)"
      - question: "After employing his now famous tactics of delaying, Fabius Maximus trapped Hannibal’s army in a valley. How did Hannibal fool Fabius into moving his forces and giving Hannibal an escape route?"
        answer: "BY ATTACHING TORCHES TO OXEN AND STAMPEDING THEM (AT NIGHT)"
  - tossup:
      question: "Which of the following words, if any, is <emphasis>not</emphasis> derived from the same Latin word as the others: duke, conduit, aqueduct, dulcet, seduction"
      answer: "DULCET"
    boni:
      - question: "What is the Latin root of “dulcet”?"
        answer: "<latin>DULCIS</latin> "
      - question: "What musical instrument’s name is derived from <latin>dulcis</latin>?"
        answer: "DULCIMER"
  - tossup:
      question: "Translate the following sentence into English: <latin>Servī, cūr cibum in triclīnium nōn fertis</latin>?"
      answer: "SLAVES, WHY ARE YOU NOT CARRYING FOOD (IN)TO THE DINING ROOM?"
    boni:
      - question: "Translate: <latin>Nōnne, Publī, fortiter pugnāre vīs</latin>?"
        answer: "PUBLIUS, DO YOU NOT WANT TO FIGHT BRAVELY PUBLIUS, SURELY YOU WANT TO FIGHT BRAVELY, RIGHT? PUBLIUS, YOU WANT TO FIGHT BRAVELY, DON’T YOU?"
      - question: "Translate: <latin>Quot annōs rēgēbant cōnsulēs?</latin> "
        answer: "(FOR) HOW MANY YEARS DID THE CONSULS RULE / (FOR) HOW MANY YEARS WERE THE CONSULS RULING"
  - tossup:
      question: "Which of the Julio-Claudian emperors, the son and brother of great military heroes, had been born with serious physical handicaps?"
      answer: "CLAUDIUS"
    boni:
      - question: "Who had demanded that the Senate confirm Claudius as emperor?"
        answer: "PRAETORIAN GUARD / CASSIUS CHAEREA"
      - question: "What area did Claudius conquer in order to gain military glory?"
        answer: "BRITAIN"
  - tossup:
      question: "Whom did the Lycian king Iobates send to kill the Chimaera?"
      answer: "BELLEROPHON"
    boni:
      - question: "Who were the parents of the Chimaera?"
        answer: "TYPHON & ECHIDNA"
      - question: "How was Bellerophon able to get close enough to kill the monster without being in range of its fiery breath?"
        answer: "FLEW ABOVE IT ON <emphasis>PEGASUS</emphasis> (& SHOT IT WITH ARROWS / DROPPED A LUMP OF LEAD DOWN ITS THROAT)"
  - tossup:
      question: "Differentiate in meaning between the nouns <latin>lūdus</latin> and <latin>lupus</latin>."
      answer: "<latin>LUPUS</latin> - WOLF <latin>LŪDUS</latin> - SCHOOL, GAME"
    boni:
      - question: "between the nouns <latin>hōra</latin> and <latin>ōra</latin>."
        answer: "<latin>HŌRA</latin> - HOUR <latin>ŌRA</latin> - COAST"
      - question: "between the nouns <latin>locus</latin> and <latin>lacus</latin>."
        answer: "<latin>LOCUS</latin> - PLACE <latin>LACUS</latin> - LAKE"
  - tossup:
      question: "Translate the following sentence into Latin: To love is to live."
      answer: "<latin>AMĀRE EST VĪVERE</latin> / <latin>HABITĀRE</latin> "
    boni:
      - question: "It is better to rule for a long time."
        answer: "<latin>MELIUS EST DIŪ</latin> <latin>RĒGNĀRE / REGERE</latin> "
      - question: "It is necessary for us to answer carefully."
        answer: "<latin>NECESSE EST NŌBĪS DĪLIGENTER / CUM CŪRĀ</latin> <latin>RESPONDĒRE / NŌS OPORTET DĪLIGENTER / CUM CŪRĀ</latin> <latin>RESPONDĒRE /</latin>  <latin>DĒBĒMUS DĪLIGENTER / CUM CŪRĀ</latin> <latin>RESPONDĒRE</latin> "
  - tossup:
      question: "Of what was the <latin>praefectus vigilum</latin> in charge?"
      answer: "FIREMEN / POLICE (Prompt for an explanation if “<latin>vigilēs</latin>” is given as the answer.)"
    boni:
      - question: "Of what was the <latin>praefectus annōnae</latin> in charge?"
        answer: "GRAIN SUPPLY OF ROME (Prompt for an explanation if “<latin>annōna</latin>” is given as the answer.)"
      - question: "Of what was the <latin>praefectus urbī</latin> in charge?"
        answer: "PUBLIC ORDER IN ROME"
  - tossup:
      question: "What Thracian king had four savage mares that he fed the flesh of unsuspecting guests?"
      answer: "DIOMEDES"
    boni:
      - question: "How did Heracles calm or tame the mares?"
        answer: "FED DIOMEDES TO THEM"
      - question: "Where did Heracles set the mares free after showing them to Eurystheus?"
        answer: "ON (SLOPES OF) MT. OLYMPUS"
  - tossup:
      question: "What 2nd century emperor’s building achievements include the following: a colony for soldiers at Timgad in northern Africa; a new, hexagonal harbor at Ostia to supplement Claudius’; an impressive bridge on the Danube; and a column in Rome."
      answer: "TRAJAN’S /(M. ULPIUS) TRAIANUS"
    boni:
      - question: "What infamous structure was gradually replaced by Titus’ and Trajan’s baths, and the Colosseum?"
        answer: "(NERO’S) GOLDEN HOUSE / DOMUS AUREA"
      - question: "How did Trajan fund his massive building projects?"
        answer: "SPOILS FROM <emphasis>DACIA</emphasis> "
  - tossup:
      question: "Translate the relative pronoun into Latin for the following sentence: “Romulus was a king whom everyone loved.”"
      answer: "<latin>QUEM</latin> "
    boni:
      - question: "“Mine are the parents whose love I desire.”"
        answer: "<latin>QUŌRUM</latin> "
      - question: "“I give thanks to the animals which inhabit the earth.”"
        answer: "<latin>QUAE</latin> "
  - tossup:
      question: "What use of the ablative case is found in the following sentence? <latin>Cicerō</latin> <latin>cum cūrā</latin> <latin>litterās discēbat</latin>."
      answer: "MANNER"
    boni:
      - question: "<latin>Proximā</latin> <latin>aestāte domum ībō</latin>."
        answer: "TIME WHEN / WITHIN WHICH"
      - question: "<latin>Caesar ā</latin> <latin>multīs hominibus interfectus est</latin>."
        answer: "AGENCY / AGENT"
