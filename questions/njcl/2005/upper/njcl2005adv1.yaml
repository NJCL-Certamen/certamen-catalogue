tournament: "NJCL Certamen"
year: 2005
division: "Advanced"
round: "Round 1"
questions:
  - tossup:
      question: "In whose hut did the child of Zeus and Danae grow uneventfully to manhood?"
      answer: "DICTYS’ (HAND OUT THE VISUAL)"
    boni:
      - question: "Identify the characters labeled “C”."
        answer: "GRAEAE / GRAIAE (D[E]INO, ENYO, PEMPHREDO)"
      - question: "Name the constellation which represents “A”."
        answer: "CETUS"
  - tossup:
      question: "What is the Latin word for a writing instrument made from a feather?"
      answer: "<latin>PENNA</latin> "
    boni:
      - question: "What is the Latin word for a pen made from a reed?"
        answer: "<latin>CALAMUS</latin> "
      - question: "How would a <latin>scalprum</latin> aid in the use of a <latin>calamus</latin>?"
        answer: "TO SHARPEN IT"
  - tossup:
      question: "Who asked Zeus to give her the following as gifts: 60 ocean nymphs to be her companions; 20 river nymphs from Crete to look after her hunting gear and her hounds; bow and arrows; and eternal virginity?"
      answer: "ARTEMIS"
    boni:
      - question: "Which of the Cyclopes annoyed Artemis so much during her visit to the workshop of Hephaestus that she tore a handful of hair from his chest?"
        answer: "BRONTES"
      - question: "For what deity were the Cyclopes building a silver trough when Artemis came in to their workshop and demanded that they stop working on the trough and make her a silver bow and a quiver for her arrows?"
        answer: "POSEIDON"
  - tossup:
      question: "What is the Latin motto of the state of Missouri?"
      answer: "<latin>SALŪS POPULĪ SUPRĒMA LĒX ESTŌ</latin>"
    boni:
      - question: "From the writings of what famous Roman is that motto excerpted?"
        answer: "CICERO (<title><latin>DĒ LĒGIBUS</latin></title>)"
      - question: "The seal for the University of Missouri contains the abbreviation (SPELL ALOUD) “<latin>sigill</latin>.” What is that an abbreviation of, and what is the meaning?"
        answer: "<latin>SIGILLUM</latin> - SEAL, SIGN, EMBLEM"
  - tossup:
      question: "The scholar Varro supposedly said that if the Muses had spoken Latin, they would have spoken the type of Latin that appeared in the works of what playwright from Sarsina?"
      answer: "(T. MACCIUS) PLAUTUS"
    boni:
      - question: "Which of Plautus’ plays is of special interest because it included a passage in the Punic language followed by a scene in which the Latin is liberally sprinkled with Punic words and phrases?"
        answer: "<title><latin>POENULUS</latin> / “THE CARTHAGINIAN</title>”"
      - question: "Which of Plautus’ plays has no female characters at all and deals with the efforts of a well-to-do father to ransom his son who has been taken prisoner of war?"
        answer: "<title><latin>CAPTĪVĪ</latin> / “THE CAPTIVES”</title>"
  - tossup:
      question: "Give the Latin verb and its meaning at the root of “desultory.”"
      answer: "<latin>SALIŌ, SALĪRE</latin> - LEAP, JUMP (Not from “<latin>saltō, saltāre</latin>.” If “<latin>dēsiliō</latin>” is given, prompt student to take it back.)"
    boni:
      - question: "Give the Latin noun and its meaning at the root of “profane.”"
        answer: "<latin>FĀNUM -</latin> TEMPLE"
      - question: "Give the Latin noun and its meaning at the root of “amenable.”"
        answer: "<latin>MINAE</latin> - THREATS"
  - tossup:
      question: "Using a subjunctive clause, translate the following sentence into Latin: Horatius defended a bridge in order to save Rome."
      answer: "<latin>HORĀTIUS PŌNTEM DĒFENDIT /DĒFENDĒBAT UT RŌMAM SERVĀRET</latin> "
    boni:
      - question: "Following the rules of standard Latin prose, translate: The bridge was so wide that he could not do this quickly."
        answer: "<latin>PŌNS ERAT TAM LĀTUS UT HOC CELERITER FACERE NŌN POSSET</latin> "
      - question: "Following the rules of standard Latin prose, translate: Horatius did this in order to more quickly save the city."
        answer: "<latin>HORĀTIUS HOC FĒCIT / FACIĒBAT QUŌ CELERIUS URBEM SERVĀRET / HORĀTIUS HOC FĒCIT / FACIĒBAT UT EŌ CELERIUS URBEM SERVĀRET</latin> "
  - tossup:
      question: "After Odysseus filled a trench near the entrance of the Underworld with the blood of a young ram and a black ewe, whose ghost was the first to approach him?"
      answer: "ELPENOR’S"
    boni:
      - question: "What did Elpenor beg Odysseus to do?"
        answer: "TO GIVE HIM A PROPER BURIAL"
      - question: "What had happened to Elpenor?"
        answer: "HE FELL OFF OF CIRCE’S ROOF (WHILE INTOXICATED)"
  - tossup:
      question: "What use of the genitive is found in the following sentence? <latin>Hī barbarī pontēs aedificandī perītī videntur</latin>."
      answer: "SPECIAL ADJECTIVES"
    boni:
      - question: "<latin>Praetor accūsātus est prōditiōnis</latin>."
        answer: "CHARGE / PENALTY / ACCUSING AND ACQUITTING (if student answers “special verbs,” ask him to explain his answer)"
      - question: "<latin>Spērō tē forum Rōmānum vīsitātūrum esse propter studium rēs nōvās videndī.</latin>"
        answer: "OBJECTIVE"
  - tossup:
      question: "Harry Potter mania mercilessly rages on. Listen carefully to the following excerpt from the Latin translation of Harry Potter, in which the characters of Snape, Harry, and Voldemort are discussed. I will read the passage twice. Answer IN ENGLISH, the question about it: <latin>“Quid igitur?” clāmāvit Harrius. “Nōnne intelligitis? Sī Snape Lapidem adeptus erit, redībit Voldemort! Nōnne audīvistis quālis esset vīta cum rērum potīrī cōnārētur? Nōn erit Schola Hogvuartēnsis ā quā expellāmur. Funditus eam dēlēbit, aut mūtābit in scholam Nigrīs Artibus docendīs!”</latin>  Question: According to the passage, what will happen first if Snape gets a hold of the Stone?"
      answer: "VOLDEMORT WILL RETURN"
    boni:
      - question: "For 5 points each, name the two things that Voldemort might do if he were to return"
        answer: "UTTERLY DESTROY (THE SCHOOL OF) HOGWARTS CHANGE HOGWARTS INTO A SCHOOL FOR TEACHING THE BLACK / DARK ARTS"
  - tossup:
      question: "What hostile tribe entrapped a Roman consul and his army on Mt. Algidus circa 460 BC?"
      answer: "<latin>AEQUI /</latin>AEQUIANS"
    boni:
      - question: "Give the full name of the person appointed dictator to rescue the entrapped army?"
        answer: "LUCIUS QUINCTIUS CINCINNATUS"
      - question: "Who was the consul Cincinnatus rescued at Mt. Algidus?"
        answer: "(L.) MINUCIUS"
  - tossup:
      question: "<latin>Audī dīligenter et respondē aut Anglicē aut Latīnē: Quis sum? Dēstitī ēsse. Nīl nisi vōx mea rēmānsit. Cūr hoc fēcī? Quod Narcissus meum amōrem sprēvit.</latin>"
      answer: "<latin>ĒCHŌ</latin> / ECHO"
    boni:
      - question: "<latin>Respondē aut Anglicē aut Latīnē: Quī sumus? Iuppiter nōs in quercum et tīliam mūtāvit quod eī et alterī deō hospitium et requiem dedimus. Domum nostram speciē mortālī vīsitāvērunt.</latin> "
        answer: "<latin>PHILĒMŌN ET BAUCIS /</latin> PHILEMON AND BAUCIS"
      - question: "<latin>Respondē aut Anglicē aut Latīnē: Quis sum? Agamemnōnī, ad Trōiam nāvigantī, Calchās dedit ōrāculum quō sacrificanda essem.</latin> "
        answer: "<latin>IPHIGENIA</latin> / IPHIGENIA"
  - tossup:
      question: "As a youth, what Augustan Age poet detested his studies of Plautus, Naevius, and Livius Andronicus while attending the school of Orbilius?"
      answer: "(Q.) HORATIUS (FLACCUS) / HORACE"
    boni:
      - question: "Horace says in his <title>Satires</title> that he was dreadfully embarrassed and went away thinking that his interview with what literary patron had been a colossal failure?"
        answer: "MAECENAS"
      - question: "In which of Horace’s works do we find a bitter protest against the civil war and poems dealing with aspects of Horace’s friendship to Maecenas?"
        answer: "<title>EPODES</title>"
  - tossup:
      question: "What Roman first supported Catiline but later secretly gave evidence against him to the consul Cicero?"
      answer: "(M. LICINIUS) CRASSUS"
    boni:
      - question: "In what form was that evidence?"
        answer: "LETTERS WRITTEN FROM THE CONSPIRATORS"
      - question: "What foreigners also gave Cicero information about the conspiracy?"
        answer: "ALLOBROGES / ALLOBROGAN ENVOYS"
  - tossup:
      question: "What poet had a small farm at Nomentum–so small that it could hide under the wing of a cricket, according to one of his epigrams?"
      answer: "(M. VALERIUS) <emphasis>MARTIAL</emphasis>IS"
    boni:
      - question: "Which of Martial’s works contains a number of interesting depictions of some of the “acts” of animal-baiting and gladiatorial combat that took place in the Roman arena?"
        answer: "<title><latin>LIBER SPECTĀCULŌRUM</latin></title> "
      - question: "What two types of meters were most common in Martial’s epigrams?"
        answer: "ELEGIAC COUPLETS & HENDECASYLLABIC"
  - tossup:
      question: "Translate the following sentence into English: <latin>Discipulī locūtī sunt quasi īnsānī essent</latin>."
      answer: "THE STUDENTS SPOKE AS IF THEY WERE CRAZY"
    boni:
      - question: "<latin>Cum verba scīrent, ignōrābant tamen quid dīcendum esset.</latin> "
        answer: "ALTHOUGH THEY KNEW THE WORDS, NEVERTHELESS THEY DIDN’T KNOW WHAT TO SAY / WHAT SHOULD BE SAID"
      - question: "<latin>Animadvertendum est discipulōs saepe errōrēs facere</latin>."
        answer: "IT MUST BE / OUGHT TO BE / SHOULD BE NOTED / NOTICED THAT STUDENTS OFTEN MAKE MISTAKES / ERRORS"
  - tossup:
      question: "For the verb <latin>vagor</latin>, give the 1st person plural, present subjunctive."
      answer: "<latin>VAGĒMUR</latin> "
    boni:
      - question: "Change <latin>vagēmur</latin> to the pluperfect tense."
        answer: "<latin>VAGĀTĪ / -AE ESSĒMUS</latin> "
      - question: "Change <latin>vagātī essēmus</latin> to the imperfect tense."
        answer: "<latin>VAGĀRĒMUR</latin> "
  - tossup:
      question: "Who ruled the province of Syria in the name of her young son Vaballathus?"
      answer: "ZENOBIA"
    boni:
      - question: "What city was her capital?"
        answer: "PALMYRA"
      - question: "For his victory over whom had Odaenathus been rewarded with quasi independence from Rome?"
        answer: "OVER <emphasis>SHAPUR</emphasis> I OF PERSIA (WHO HAD CAPTURED & KILLED VALERIAN)"
  - tossup:
      question: "Of the words <latin>later, lanx, laqueus, līmen</latin>, and <latin>līmes</latin>, which is described here: <latin>Sum vinculum ita nexum ut collum in mē pōnī possit</latin>."
      answer: "<latin>LAQUEUS</latin> "
    boni:
      - question: "Which of those words is described here: <latin>Fīnēs agrōrum ā mē dīstinguuntur</latin>."
        answer: "<latin>LĪMES</latin> "
      - question: "Which of those words is described here: <latin>Vel coctus vel crūdus, sum ūtilis ad aedificandum</latin>."
        answer: "<latin>LATER</latin>"
  - tossup:
      question: "Whose writings contained clear narratives about the terrain, the important personalities, and the various peoples of the province of <latin>Gallia</latin>?"
      answer: "(C.) IULIUS CAESAR"
    boni:
      - question: "Who was the intended audience of Caesar’s <title><latin>Dē Bellō Gallicō</latin></title>?"
        answer: "SENATE (& THE ROMAN PEOPLE)"
      - question: "How many books of the <title><latin>Dē Bellō Gallicō</latin></title> were written by Caesar himself?"
        answer: "SEVEN"
