tournament: "NJCL Certamen"
year: 2006
division: "Novice"
round: "Round 2"
questions:
  - tossup:
      question: "What derivative of the Latin word for “word” means “word for word”?"
      answer: "VERBATIM"
    boni:
      - question: "What derivative of the Latin noun for “word” means “full of an excessive number of words”?"
        answer: "VERBOSE"
      - question: "What derivative of the Latin noun for “word” means “a saying expressing a well known truth”?"
        answer: "PROVERB"
  - tossup:
      question: "Translate into English: <latin>Numquam montēs movēre potuī</latin>."
      answer: "I HAVE NEVER BEEN ABLE TO MOVE MOUNTAINS"
    boni:
      - question: "<latin>Mihi nūlla potestās est</latin>."
        answer: "I HAVE NO POWER"
      - question: "Using <latin>habeō</latin>, say in Latin, “I have no power.”"
        answer: "<latin>NŪLLAM POTESTĀTEM HABEŌ /</latin>  <latin>NŌN HABEŌ (</latin><latin>ŪLLAM) POTESTĀTEM /</latin>  <latin>NIHIL POTESTĀTIS HABEŌ</latin>"
  - tossup:
      question: "Without using a number, name the labor in which Heracles uses a bronze rattle?"
      answer: "STYMPHALIAN BIRDS"
    boni:
      - question: "What deity had given the rattle to Heracles?"
        answer: "ATHENA"
      - question: "What deity had made the rattle?"
        answer: "HEPHAESTUS"
  - tossup:
      question: "Against what tribune did the Senate issue a <latin>senātūs cōnsultum ultimum</latin> in 100 BC?"
      answer: "(L. APPULEIUS) SATURNINUS"
    boni:
      - question: "Whom did the Senate empower to act against Saturninus and his ally Glaucia?"
        answer: "(C.) MARIUS"
      - question: "What favor had Saturninus previously done for Marius’ veterans?"
        answer: "SECURED LAND (IN GAUL)"
  - tossup:
      question: "Which Latin phrase on the great seal of the United States reveals our multinational society?"
      answer: "Ē <latin>PLŪRIBUS ŪNUM</latin> "
    boni:
      - question: "Which of the Latin phrases on the great seal of the United States shows that our founding fathers believed that they had God’s support?"
        answer: "<latin>ANNUIT COEPTĪS</latin> "
      - question: "The great seal also says 1776 in Roman numerals. What are those Roman numerals?"
        answer: "MDCCLXXVI"
  - tossup:
      question: "Which governors’ rebellion in Gaul caused Nero to cancel his trip to the East in A.D. 68?"
      answer: "(GAIUS IULIUS) VINDEX’"
    boni:
      - question: "Which two future emperors supported Vindex in this rebellion?"
        answer: "(SERVIUS SULPICIUS) GALBA & (MARCUS SALVIUS) OTHO"
      - question: "Which governor of Upper Germany overwhelmed and defeated Vindex’ army?"
        answer: "(LUCIUS) VERGINIUS RUFUS - (Accept either “Verginius” or “Rufus” by itself)"
  - tossup:
      question: "For the verb <latin>iaceō, iacēre</latin>, give the 3rd person plural, perfect indicative."
      answer: "<latin>IACUĒRUNT</latin> "
    boni:
      - question: "Change <latin>iacuērunt</latin> to the imperfect."
        answer: "<latin>IACĒBANT</latin> "
      - question: "For this same verb, give the accusative singular masculine form of the present participle."
        answer: "<latin>IACENTEM</latin> "
  - tossup:
      question: "Which emperor, although he did not prohibit others from worshiping the pagan gods, was a Christian by A.D. 312?"
      answer: "CONSTANTINE (I / THE GREAT)"
    boni:
      - question: "Whose death in A.D. 324 gave Constantine greater freedom to push the spread of Christianity?"
        answer: "LICINIUS’"
      - question: "When did Constantine finally receive his first baptism?"
        answer: "ON HIS DEATHBED / AD 337"
  - tossup:
      question: "What type of person in Roman society was called a <latin>mātrōna</latin>?"
      answer: "(RESPECTABLE) <emphasis>MARRIED</emphasis> WOMAN"
    boni:
      - question: "What two items of clothing were the characteristic dress of a <latin>mātrōna</latin>?"
        answer: "<latin>PALLA & STOLA</latin> "
      - question: "At what festival celebrated on the Kalends of March did Roman matrons march in procession to the temple of Juno to offer flowers and libations?"
        answer: "<latin>MĀTRŌNĀLIA</latin> "
  - tossup:
      question: "Listen carefully to the following passage, which I will read twice, and answer IN ENGLISH the question that follows: <latin>In parvō oppidō prope Rōmam erant duo amātōrēs, Rūfus et Victōria. Rūfus cōtīdiē quīnque annōs fenestrae Victōriae appropinquābat hōc modō eam salūtāns - “T</latin><latin>ū,</latin> Ō <latin>pulcherrima Victōria, es sōl meus. Quando</latin>  <latin>poterō tē in mātrimōnium dūcere?” Semper idem respondit puella - “Ubi quīndecim annōs habēbō!” Tandem virgō ad illam aetātem pervēnit. Rūfus fēlīciter per tōtum oppidum clāmābat, “Victōria est mea!”</latin>  Question: How does Rufus describe Victoria when he greets her every day?"
      answer: "VERY BEAUTIFUL / AS HIS SUN"
    boni:
      - question: "For five years Rufus asked Victoria to marry him. What was her response during that time?"
        answer: "“WHEN I AM FIFTEEN YEARS OLD!” / THAT SHE WOULD MARRY HIM WHEN SHE WAS FIFTEEN."
      - question: "What did Rufus do and say once Victoria had reached the age of fifteen?"
        answer: "HE RAN THROUGH THE (ENTIRE) TOWN & SHOUTED, “VICTORY IS MINE!” or “Victoria is mine!”"
  - tossup:
      question: "Besides on Mt. Olympus, where was the “smithy” or workshop of Hephaestus?"
      answer: "UNDER / IN MT. AETNA or ON ISLAND OF LEMNOS (PASS OUT THE VISUAL)"
    boni:
      - question: "You now have 5 seconds to examine the visual. (WAIT 5 SECONDS) Identify the Titan who is stealing fire from Hephaestus’ workshop."
        answer: "PROMETHEUS"
      - question: "What specifically is Prometheus using as a container in which to transport the fire?"
        answer: "<emphasis>FENNEL</emphasis> STALK (If the student says, “A hollow reed” without using the word “fennel,” tell him that we will accept the answer, since one mythology dictionary describes it this way, but that fennel, which is not hollow, is the preferable answer.)"
  - tossup:
      question: "Give the Latin verb and its meaning at the root of “cache,” “ essay,” “exact,” and “agenda”."
      answer: "<latin>AGŌ, AGERE</latin> - DO, DRIVE, ACT"
    boni:
      - question: "What derivative of <latin>agō, agere</latin> means “to upset, disturb”?"
        answer: "AGITATE"
      - question: "What derivative of <latin>agō, agere</latin> means “nimble”?"
        answer: "AGILE"
  - tossup:
      question: "Give the form of the relative pronoun in the sentence: “I know the girl whom you’ve been seeing.”"
      answer: "<latin>QUAM</latin> "
    boni:
      - question: "“Are those the gentlemen to whom you showed the forum?”"
        answer: "<latin>QUIBUS</latin> "
      - question: "“Is he the boy with whom you are going to the prom?”"
        answer: "<latin>QUŌCUM</latin> or <latin>(CUM) QUŌ</latin>"
  - tossup:
      question: "In which ancient Roman province were the Roman towns of Viroconium, Mamucium, Deva and Eburacum?"
      answer: "BRITANNIA"
    boni:
      - question: "Which emperor’s temple was destroyed at Camulodunum during the rebellion of Boudicca?"
        answer: "CLAUDIUS’"
      - question: "What is the modern name for the Roman town of Camulodunum?"
        answer: "COLCHESTER"
  - tossup:
      question: "Which of the following Latin words is NOT synonymous with the others: <latin>terra, ager, tēlum, patria, regiō</latin>?"
      answer: "<latin>TĒLUM</latin> "
    boni:
      - question: "Give a synonym of the noun <latin>populus</latin>."
        answer: "<latin>GĒNS, NĀTIŌ, PLĒBS, VULGUS, CĪVITĀS, CĪVĒS</latin> "
      - question: "Give a synonym of the noun <latin>mēns</latin>."
        answer: "<latin>ANIMUS, ANIMA, INGENIUM, COR</latin> "
  - tossup:
      question: "What poor and elderly couple were transformed into an oak and linden tree that grew from a single trunk?"
      answer: "BAUCIS & PHILEMON"
    boni:
      - question: "For what were Zeus and Hermes rewarding the couple with this transformation?"
        answer: "HOSPITALITY"
      - question: "What happened to the rest of the people who lived in the valley?"
        answer: "DROWNED BY A SUDDEN FLOOD"
  - tossup:
      question: "<latin>Quid Anglicē significat “aperīre”?</latin>"
      answer: "(TO) OPEN"
    boni:
      - question: "<latin>Quid Anglicē significat “natāre”?</latin>"
        answer: "(TO) SWIM"
      - question: "<latin>Quid Anglicē significat “relinquere”?</latin>"
        answer: "(TO) LEAVE, ABANDON"
  - tossup:
      question: "What Latin case is typically used to tell how long something happens?"
      answer: "ACCUSATIVE"
    boni:
      - question: "What Latin case is typically used to tell when something happens?"
        answer: "ABLATIVE"
      - question: "What Latin case is typically used to tell where you are going?"
        answer: "ACCUSATIVE"
  - tossup:
      question: "What city was terrorized by a winged monster with a woman's head and a lion's body?"
      answer: "THEBES"
    boni:
      - question: "By what name was this monster known?"
        answer: "SPHINX / PHIX"
      - question: "Who taught the Sphinx the riddle which she asked her victims?"
        answer: "MUSES"
  - tossup:
      question: "Whom did Zeus strike with a thunderbolt for bragging about a love affair?"
      answer: "ANCHISES"
    boni:
      - question: "By what goddess had the handsome Anchises been seduced?"
        answer: "APHRODITE"
      - question: "Who was the son of Anchises and Aphrodite?"
        answer: "AENEAS"
