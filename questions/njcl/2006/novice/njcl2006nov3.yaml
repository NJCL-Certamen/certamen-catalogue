tournament: "NJCL Certamen"
year: 2006
division: "Novice"
round: "Round 3"
questions:
  - tossup:
      question: "What Greek divinity represented strategy in war and wisdom?"
      answer: "ATHENA"
    boni:
      - question: "In what unusual way was Athena born?"
        answer: "FROM ZEUS' HEAD (FULLY-ARMED) (AFTER HEPHAESTUS, PROMETHEUS, OR PALAEMON CLEAVED WITH AX)"
      - question: "What was her wooden statue enshrined at Troy called?"
        answer: "PALLADIUM"
  - tossup:
      question: "Give the ablative singular of the phrase <latin>virgō pulchra</latin>."
      answer: "<latin>VIRGINE PULCHRĀ</latin>"
    boni:
      - question: "of <latin>magnum animal</latin>."
        answer: "<latin>MAGNŌ ANIMĀLĪ</latin>"
      - question: "Give the ablative of <latin>duae manūs</latin>."
        answer: "<latin>DUĀBUS MANIBUS</latin> "
  - tossup:
      question: "Say in Latin: “Mother is here with three slaves.”"
      answer: "<latin>MĀTER ADEST / HĪC EST CUM TRIBUS SERVĪS / ANCILLĪS</latin> "
    boni:
      - question: "“They have been carrying a part of the dinner.”"
        answer: "<latin>(ŪNAM) PARTEM CĒNAE PORTĀVĒRUNT</latin>   <latin>(VEXĒRUNT/ TULĒRUNT)</latin> "
      - question: "“Now I can give food to my daughters.”"
        answer: "<latin>NUNC / IAM (MEĪS) FĪLIĀBUS CIBUM DARE/ DŌNĀRE POSSUM</latin> "
  - tossup:
      question: "What name did the Romans give to the teacher of basic reading, writing, and arithmetic?"
      answer: "<latin>LITTERĀTOR / MAGISTER (LITTERĀRUM) / MAGISTER (LŪDĪ / SCHOLAE)</latin> "
    boni:
      - question: "What is the Latin term for the school in which children learned reading, writing, and arithmetic?"
        answer: "<latin>LŪDUS</latin> or <latin>SCHOLA</latin> "
      - question: "Sometimes parents would pay extra for a special teacher called <latin>calculator</latin>. What did he teach?"
        answer: "ARITHMETIC/MATHEMATICS"
  - tossup:
      question: "What derivative of the Latin verb for “teach” means “teachable”?"
      answer: "DOCILE"
    boni:
      - question: "What derivative of the Latin verb for “teach” means “a guide in a museum’?"
        answer: "DOCENT"
      - question: "What derivative of the Latin verb for “teach” means “ a rule or principle”?"
        answer: "DOCTRINE"
  - tossup:
      question: "<latin>Ante mortem</latin> is one of the three Latin phrases abbreviated a.m. What is another?"
      answer: "<latin>ANTE MERĪDIEM / ARTIUM MAGISTER</latin> "
    boni:
      - question: "<latin>Ante diem</latin> is one of the three Latin phrases abbreviated a.d. What is another?"
        answer: "<latin>AURE DEXTRĀ/ ANNŌ DOMINĪ</latin>"
      - question: "<latin>Ante Chrīstum</latin> is one of the three Latin phrases abbreviated A.C. What is another?"
        answer: "<latin>ANTE CĒNAM / ANTE CIBUM</latin>"
  - tossup:
      question: "What thirty-year-old was elected consul for 198 B.C. to conduct the war against Philip V of Macedonia?"
      answer: "(TITUS QUINCTIUS) FLAMININUS"
    boni:
      - question: "Where did Flamininus decisively defeat Philip in 197 B.C.?"
        answer: "CYNOSCEPHALAE"
      - question: "At what event in 196 B.C. did Flamininus announce the freedom of Greece?"
        answer: "ISTHMIAN GAMES"
  - tossup:
      question: "Translate the following sentence into English: <latin>Fēminam videō quae piscēs vēndit</latin>."
      answer: "I SEE THE WOMAN WHO IS SELLING FISH / I SEE THE WOMAN SELLING FISH"
    boni:
      - question: "Say in Latin, “The woman who is selling the fish sees me.”"
        answer: "<latin>FĒMINA QUAE PISCĒS VĒNDIT MĒ VIDET /</latin>  <latin>FĒMINA PISCĒS VĒNDĒNS MĒ VIDET</latin> "
      - question: "Translate into English: <latin>Librōs quōs legere volēbam in bibliothēcā invēnī.</latin>"
        answer: "THE BOOKS WHICH I WANTED TO READ I FOUND IN THE LIBRARY"
  - tossup:
      question: "What request did Patroclus make of Achilles when the Trojans were about to set fire to the Greeks ships?"
      answer: "ASKED TO LEAD MYRMIDONS <emphasis>INTO BATTLE</emphasis> WEARING <emphasis>ACHILLES’ ARMOR</emphasis> "
    boni:
      - question: "Who killed Patroclus after he pushed the Trojans back to their walls?"
        answer: "HECTOR"
      - question: "Achilles was given a second set of armor by his mother Thetis. Who ultimately was the recipient of this divinely manufactured armor?"
        answer: "ODYSSEUS"
  - tossup:
      question: "A funerary inscription for a Roman named Priscus contains the words “<latin>frāter fēcit</latin>.” Translate that."
      answer: "THE / HIS <emphasis>BROTHER DID</emphasis> IT / <emphasis>MADE</emphasis> IT / <emphasis>DEDICATED</emphasis> IT THE BROTHER WAS ENTRUSTED WITH THE FUNERAL ARRANGEMENTS / THE BROTHER MADE THE INSCRIPTION / TOMB or HAD IT MADE (PASS OUT THE VISUAL)"
    boni:
      - question: "You are looking at a funerary inscription from the later Roman empire. During this period, most people were less knowledgeable of the rules governing Latin noun cases. Using the information contained in the inscription, what case would have been used instead of “<latin>annīs</latin>” in classical times?"
        answer: "ACCUSATIVE (<latin>ANNŌS</latin>)"
      - question: "On what specific date in our modern calendar did Priscus die?"
        answer: "MAY 28"
  - tossup:
      question: "What conquest financed Trajan’s building program?"
      answer: "DACIA"
    boni:
      - question: "Name the Dacian king defeated by Trajan."
        answer: "DECEBALUS"
      - question: "What did Trajan dedicate in Rome in A.D. 112?"
        answer: "HIS FORUM (<latin>FORUM TRAIĀNĪ / FORUM ULPIUM</latin>)"
  - tossup:
      question: "What barbarian invasion had Flavius Aetius stopped in AD 451?"
      answer: "THE INVASION OF <emphasis>ATTILA</emphasis> AND THE HUNS (OF GAUL)"
    boni:
      - question: "Which emperor murdered his general Flavius Aetius with his own hands?"
        answer: "VALENTINIAN III"
      - question: "Who had made Valentinian emperor of the West?"
        answer: "THEODOSIUS II"
  - tossup:
      question: "Give any three Latin adjectives or pronouns which end in <latin>-īus</latin> in the genitive singular."
      answer: "<latin>ŪLLUS / (NŌN)NŪLLUS / UTER(QUE) / SŌLUS / NEUTER / ALIUS / ŪNUS / TŌTUS / ALTER / HIC / ILLE / IPSE / IS / QUĪ / QUIS</latin> "
    boni:
      - question: "Most of these words (reread them) also end in -<latin>i</latin> in the dative singular. Which one does NOT?"
        answer: "<latin>HIC / HUIC</latin> "
      - question: "What is the ablative plural of <latin>Quis</latin>?"
        answer: "<latin>QUIBUS / QUĪS</latin> "
  - tossup:
      question: "Listen carefully to the following passage about the Etruscans, which I will read twice, and answer IN LATIN the question that follows: <latin>Etruscī Rōmam multōs annōs rēgnābant. Ultimus rēx Etruscus erat</latin>  <latin>Tarquinius Superbus, quī</latin> ā <latin>Rōmānīs expulsus est. Rōmānī tamen multa retinēbant quae ab Etruscīs accepta erant, inter quae erant haruspicēs et augurēs, quī erant auxiliō Rōmānīs ubi rēs pūblica in perīculō erat.</latin>  Question: <latin>Quī Tarquinium Superbum expulērunt?</latin>"
      answer: "<latin>RŌMĀNĪ</latin>"
    boni:
      - question: "<latin>Nōminā duās rēs Etruscōrum quās Rōmānī retinēbant.</latin> "
        answer: "<latin>HARUSPICĒS (ET) AUGURĒS</latin> "
      - question: "<latin>Erantne subsidiō urbī Rōmae haruspicēs et augurēs?</latin> "
        answer: "<latin>ERANT / ITA / VĒRŌ / SĪC / CERTĒ / RĒCTĒ</latin>"
  - tossup:
      question: "What king had his two grand-nephews thrown into the Tiber River to drown?"
      answer: "AMULIUS"
    boni:
      - question: "Who were his grand-nephews?"
        answer: "ROMULUS & REMUS"
      - question: "Of what city had Amulius seized the throne?"
        answer: "ALBA LONGA"
  - tossup:
      question: "What seer had experienced life both as a man and as a woman?"
      answer: "TEIRESIAS"
    boni:
      - question: "Who blinded Teiresias for revealing that women had the greater pleasure in love-making?"
        answer: "HERA/JUNO"
      - question: "What did Zeus / Jupiter give Teiresias in compensation?"
        answer: "GIFT OF PROPHECY (& A LONG LIFE)"
  - tossup:
      question: "<latin>Quid Anglicē significat “extrā”?</latin>"
      answer: "OUTSIDE (OF) / WITHOUT / BEYOND"
    boni:
      - question: "Differentiate in meaning between <latin>inter</latin> and <latin>intrā</latin>."
        answer: "<latin>INTER</latin> - BETWEEN, AMONG, DURING <latin>INTRĀ</latin> - WITHIN, INSIDE OF"
      - question: "<latin>Quid Anglicē significat “ultrā”?</latin> "
        answer: "<latin>ULTRĀ</latin> - BEYOND, ON THE OTHER SIDE OF"
  - tossup:
      question: "To which modern country would you go to visit the location of the ancient Roman province of Galatia?"
      answer: "TURKEY"
    boni:
      - question: "From ancient Galatia, would you need to travel north, south, east or west to go to ancient Cilicia?"
        answer: "SOUTH"
      - question: "Which of these ancient provinces was closest to Cilicia: Cyrene, Aquitania, Baetica, Mauretania, Lugdunensis."
        answer: "CYRENE"
  - tossup:
      question: "What expedition included the day's foremost young men, many of whom became the fathers of the great warriors who fought at Troy?"
      answer: "VOYAGE OF THE ARGO / QUEST FOR THE GOLDEN FLEECE"
    boni:
      - question: "Which of the Argonauts was the father of Achilles?"
        answer: "PELEUS"
      - question: "Which of the Argonauts was the father of Ajax of Salamis?"
        answer: "TELAMON"
  - tossup:
      question: "What English derivative of the Latin verb <latin>emō</latin> means “money paid to release a prisoner”?"
      answer: "RANSOM"
    boni:
      - question: "What English derivative of <latin>emō</latin> means “a specimen or sample“?"
        answer: "EXAMPLE / EXEMPLAR / EXEMPLUM"
      - question: "What English derivative of <latin>emō</latin> means “to appropriate the time slot or possession of something”?"
        answer: "PREEMPT"
