tournament: "NJCL Certamen"
year: 2006
division: "Novice"
round: "Finals"
questions:
  - tossup:
      question: "Who became the <latin>de facto</latin> dictator of Rome after the sudden death of Marius in 86 BC?"
      answer: "(L. CORNELIUS) CINNA"
    boni:
      - question: "Whom did Cinna choose as his consular colleague in 85 BC?"
        answer: "(CN. PAPIRIUS) CARBO"
      - question: "Whom did Cinna send to remove Sulla and to take command against Mithridates, but was murdered by his own troops?"
        answer: "(L. VALERIUS) FLACCUS"
  - tossup:
      question: "As a result of the tremendous popularity of Dan Brown’s <title>Da Vinci Code</title>, the Latin phrase <latin>Opus Deī</latin> is frequently in the news. What is the meaning of this Latin phrase?"
      answer: "THE WORK OF GOD"
    boni:
      - question: "One of the characters in the novel, the albino Silas, uses the phrase “<latin>Castīgō corpus meum</latin>.” Translate that."
        answer: "I CASTIGATE / CHASTISE / BEAT / CORRECT MY BODY"
      - question: "From what Latin noun, with what meaning, does the English noun “Code” derive?"
        answer: "<latin>CŌDEX / CAUDEX</latin>   BLOCK OF WOOD / BLOCKHEAD / BOOK (MADE FROM WOOD)"
  - tossup:
      question: "What was the fate of the twelve maidservants who had \"consorted\" with the unwanted suitors of Penelope?"
      answer: "HANGED (AFTER CLEANING THE HALL)"
    boni:
      - question: "For five points each, name the minstrel and the herald whom Odysseus spared because they had served the suitors against their will."
        answer: "PHEMIUS (MINSTREL) & MEDON (HERALD)"
  - tossup:
      question: "Tell me in Latin “You are always the best teacher.”"
      answer: "<latin>(TŪ) OPTIMUS /-A MAGISTER /-A SEMPER ES</latin> "
    boni:
      - question: "“The rest of the children were smaller.”"
        answer: "<latin>CĒTERĪ / ALTERĪ LĪBERĪ MINŌRĒS ERANT / FUĒRUNT</latin> "
      - question: "“Some were reading faster than others.”"
        answer: "<latin>ALIĪ LEGĒBANT CELERIUS ALIĪS/ QUAM ALIĪ</latin>"
  - tossup:
      question: "Listen carefully to the following passage about the worship of the goddess Diana in Rome, which I will read twice, and answer IN LATIN the question that follows: <latin>Pūblius scrīpsit Rōmānōs deam Diānam magnā cum cūrā adōrāre. Cīvēs hanc deam centum annōs amābant. Itaque statuam eī in Monte Aventīnō dēdicāvērunt. Haec est īnscrīptiō in illā statuā: “Diānae, maximae deae, cīvēs hanc statuam dant.”</latin>  Question: <latin>In quā deā cīvēs Rōmānī fidem posuērunt?</latin>"
      answer: "<latin>(IN) DIĀNĀ</latin>"
    boni:
      - question: "<latin>Quamdiū cīvēs Rōmānī hanc deam amābant?</latin>"
        answer: "<latin>CENTUM ANNŌS</latin>"
      - question: "<latin>Verte in Anglicum īnscrīptiōnem hūius statuae.</latin> "
        answer: "THE CITIZENS GIVE THIS STATUE TO DIANA, THE GREATEST GODDESS"
  - tossup:
      question: "What Latin phrase is the legal term for “according to law”?"
      answer: "<latin>DĒ JŪRE</latin> "
    boni:
      - question: "What Latin phrase is the legal term for “the fundamental facts of the crime”?"
        answer: "<latin>CORPUS DĒLICTĪ</latin>"
      - question: "What Latin phrase is the legal term for evidence that is “sufficient at first appearance”?"
        answer: "<latin>PRĪMĀ FACIĒ</latin>"
  - tossup:
      question: "In most years of the period of 444-367 BC, what officers did the Romans elect in the place of the consuls?"
      answer: "<emphasis><latin>MILITARY</latin></emphasis> <latin>TRIBUNES WITH CONSULAR POWERS (TRIBŪNĪ MĪLITUM CŌNSULĀRĪ POTESTĀTE)</latin> "
    boni:
      - question: "Because the office of military tribune was open to plebeians, what new patrician magistracy was created in 443 BC to keep a balance?"
        answer: "<latin>CENSOR</latin> "
      - question: "Name the tribunes of 376 BC who proposed the restoration of the consulship and that one consul should be a plebeian?"
        answer: "<latin>(C.) LICINIUS (STOLO) & (L.) SEXTIUS (LATERANUS)</latin> "
  - tossup:
      question: "How had Cacus tried to confuse Heracles when he stole the cattle of Geryon?"
      answer: "HE DRAGGED THEM BY THEIR TAILS (SO TRACKS WOULD APPEAR TO GO IN THE OPPOSITE DIRECTION)"
    boni:
      - question: "How did Heracles find the cattle which Cacus had stolen from him by the Tiber?"
        answer: "HE HEARD A MOO (IN RESPONSE TO THE REMAINING CATTLE / HERACLES MOOING)"
      - question: "Name the local king who thanked Heracles for killing the fire-breathing Cacus by paying him divine honors."
        answer: "EVANDER"
  - tossup:
      question: "<latin>Audī dīligenter et respōndē aut Anglicē aut Latīnē: Cīvēs Rōmānī saepe in ūsū tria nōmina habēbant - nōmen, praenōmen et cognōmen. Aliquando autem aliud nōmen ā mīlitibus aut ā cīvibus dabātur hominī quī victōriam dē hostibus reportāverat. Quid est hoc nōmen?</latin>"
      answer: "<latin>AGNŌMEN</latin> / AGNOMEN / AGNOMINA <latin>COGNŌMEN</latin> <emphasis><latin>EX VIRT</latin></emphasis><emphasis>Ū</emphasis><emphasis><latin>TE</latin></emphasis> "
    boni:
      - question: "<latin>Quod agnōmen datum est hominī nōtissimō quī Carthāginem superāvit?</latin>"
        answer: "<latin>ĀFRICĀNUS</latin> "
      - question: "Which of the possible names of a Roman citizen is descibed by the following Latin sentence: <latin>Id fīlium ā patre aliquando distinguēbat</latin>."
        answer: "<latin>PRAENŌMEN</latin> / PRAENOMEN"
  - tossup:
      question: "Give the English meaning and the principal parts of the verb at the ultimate root of “recollect”?"
      answer: "<latin>LEGŌ, LEGERE, LĒGĪ, LĒCTUS</latin> - READ, COLLECT, GATHER"
    boni:
      - question: "Now, give the English meaning and the principal parts of the verb at the root of “reconnoiter.”"
        answer: "<latin>COGNŌSCŌ, COGNŌSCERE, COGNŌVĪ, COGNITUS</latin> - UNDERSTAND, RECOGNIZE, BECOME ACQUAINTED WITH, LEARN, PERCEIVE or <latin>NŌSCŌ, NŌSCERE, NŌVĪ, NŌTUS</latin> - KNOW, UNDERSTAND"
      - question: "Give the English meaning and the principal parts of the verb at the root of “recruit”?"
        answer: "<latin>CRĒSCŌ, CRĒSCERE, CRĒVĪ, CRĒTUS -</latin> GROW"
  - tossup:
      question: "Give a synonym for the Latin adjective <latin>timidus</latin>."
      answer: "<latin>PAVIDUS / (PER)TERRITUS / TREPIDUS</latin> "
    boni:
      - question: "for the noun <latin>cīvitās</latin>."
        answer: "<latin>RĒS PŪBLICA / RĒGNUM / IMPERIUM / URBS /</latin>   <latin>POPULUS / GĒNS / NĀTIŌ / TRIBUS</latin> "
      - question: "Give a synonym for the noun <latin>ignis</latin>."
        answer: "<latin>FLAMMA / INCENDIUM / FOCUS</latin> "
  - tossup:
      question: "Who told Aegina's father that she had been abducted by Zeus?"
      answer: "SISYPHUS"
    boni:
      - question: "Who was the father of Aegina?"
        answer: "ASOPUS"
      - question: "What did Asopus give Sisyphus in return for the information?"
        answer: "A SPRING (ON CORINTHIAN ACROPOLIS)"
  - tossup:
      question: "Say in Latin, “Tomorrow, Marcus will be a man of great wisdom.”"
      answer: "<latin>CRĀS MARCUS ERIT VIR MAGNAE PRŪDENTIAE / MAGNĀ PRŪDENTIĀ</latin>"
    boni:
      - question: "Say in Latin, “Every day, Marcus runs with swiftness.”"
        answer: "<latin>CŌTĪDIĒ MARCUS (CUM) CELERITĀTE / ALACRITĀTE / CELERITER CURRIT</latin> "
      - question: "Say in Latin, “Yesterday, Marcus killed ten enemies with one sword.”"
        answer: "<latin>HERI, MARCUS DECEM HOSTĒS / INIMĪCŌS</latin>  <latin>ŪNŌ GLADIŌ NECĀVIT / INTERFĒCIT</latin>  (Forms of the imperfect are also acceptable)"
  - tossup:
      question: "Who used special effects to create thunder and lightning while pretending to be Zeus driving his chariot?"
      answer: "SALMONEUS"
    boni:
      - question: "How did Zeus destroy Salmoneus and his entire city?"
        answer: "WITH A THUNDERBOLT"
      - question: "Name Salmoneus' grandsons whom his daughter Tyro bore."
        answer: "PELIAS & NELEUS"
  - tossup:
      question: "(PASS OUT THE VISUAL TO ALL TEAMS) Please do NOT open your visuals until instructed to do so. (WAIT UNTIL ALL THE TEAMS HAVE THEIR VISUALS) Open up your visuals. You now have 10 seconds to examine it. (WAIT 10 SECONDS) Which king of Athens is figure “B” on the visual?"
      answer: "AEGEUS"
    boni:
      - question: "Why is Aegeus knocking over the cup of wine in the visual?"
        answer: "HAS JUST RECOGNIZED THE SWORD & KNOWS “C” IS HIS SON THESEUS"
      - question: "Identify figure “A” and explain why she has poisoned the wine."
        answer: "MEDEA HAS POISONED THE WINE TO PROTECT HER SON’S (MEDUS’ / MEDEUS’) CLAIM TO THE THRONE OF ATHENS"
  - tossup:
      question: "Many famous Romans bore the name “Agrippa”. Which Agrippa is legendary for his rhetorical skills which he used to reunite the Roman people?"
      answer: "(AGRIPPA) MENENIUS (LANATUS)"
    boni:
      - question: "Which Agrippa, in accordance with his family’s unfortunate habit of getting exiled, spent his last days on the island of Planasia?"
        answer: "(M. VIPSANIUS AGRIPPA) POSTUMUS"
      - question: "Which Agrippa spent his childhood in Rome in the household of Antonia the Younger, was a schoolmate of the future emperor Claudius, facilitated Claudius’ accession to the throne and, therefore, was rewarded by Claudius with additional lands in the Middle East to rule?"
        answer: "HEROD (AGRIPPA I) / AGRIPPA I"
  - tossup:
      question: "What English derivative of the Latin verb <latin>iaciō, iacere</latin> means “a guess or speculation”?"
      answer: "CONJECTURE / PROJECTION"
    boni:
      - question: "“the path of something hurtling through space”?"
        answer: "TRAJECTORY"
      - question: "“items discarded at sea”?"
        answer: "JETSAM"
  - tossup:
      question: "Change the verb form <latin>scrībit</latin> to future passive."
      answer: "<latin>SCRĪBĒTUR</latin> "
    boni:
      - question: "Change the verb form <latin>capis</latin> to future passive."
        answer: "<latin>CAPIĒRIS</latin> "
      - question: "Change the verb form <latin>sumus</latin> to future passive."
        answer: "CANNOT BE DONE"
  - tossup:
      question: "Which of Rome’s seven hills had to be partially excavated to provide room for Trajan’s market and forum?"
      answer: "QUIRINAL"
    boni:
      - question: "What infamous structure was buried, and in later years provided the foundation for Trajan’s baths?"
        answer: "<latin>DOMUS AUREA</latin> / GOLDEN HOUSE (OF NERO)"
      - question: "The 100-foot high and half-mile wide “structure” in Rome called the <latin>Mōns Testaceus</latin> and known today as Monte Testaccio was an organized accumulation of what material?"
        answer: "PIECES OF BROKEN POTTERY / JARS / <latin>AMPHORAE</latin>  (UNLOADED FROM SHIPS AT THE EMPORIUM / WHARF, SOME OF WHICH WAS USED AS BALLAST)"
  - tossup:
      question: "What two uses of the dative case are found in the following sentence: <latin>Rēx patrī cīvibus erat</latin>."
      answer: "REFERENCE & PURPOSE"
    boni:
      - question: "Translate that sentence into English."
        answer: "THE KING WAS A FATHER TO THE CITIZENS"
      - question: "Say in Latin, “The king was not loved by the citizens."
        answer: "<latin>RĒX Ā CĪVIBUS NŌN AMĀBĀTUR / AMĀTUS EST</latin>"
