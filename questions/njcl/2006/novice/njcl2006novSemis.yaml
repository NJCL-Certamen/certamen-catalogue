tournament: "NJCL Certamen"
year: 2006
division: "Novice"
round: "Semifinals"
questions:
  - tossup:
      question: "Name one first conjugation verb whose third principle part ends <latin>-uī</latin> instead of <latin>-</latin><latin>āvī</latin>."
      answer: "<latin>CREPŌ</latin> <latin>/ CŪBŌ</latin> <latin>/ DOMŌ</latin> <latin>/ FRICŌ</latin> <latin>/ MICŌ</latin> <latin>/ SECŌ</latin> <latin>/ SONŌ</latin> <latin>/ TŌNŌ</latin> <latin>/ VETŌ</latin>"
    boni:
      - question: "Name another."
        answer: "<latin>CREPŌ</latin> <latin>/ CŪBŌ</latin> <latin>/ DOMŌ</latin> <latin>/ FRICŌ</latin> <latin>/ MICŌ</latin> <latin>/ SECŌ</latin> <latin>/ SONŌ</latin> <latin>/ TŌNŌ</latin> <latin>/ VETŌ</latin>"
      - question: "Name another."
        answer: "<latin>CREPŌ</latin> <latin>/ CŪBŌ</latin> <latin>/ DOMŌ</latin> <latin>/ FRICŌ</latin> <latin>/ MICŌ</latin> <latin>/ SECŌ</latin> <latin>/ SONŌ</latin> <latin>/ TŌNŌ</latin> <latin>/ VETŌ</latin>"
  - tossup:
      question: "Who appeared to Aeneas in a dream and warned him to escape from Troy?"
      answer: "HECTOR"
    boni:
      - question: "Which of the Trojans gods was Aeneas to take with him?"
        answer: "PENATES"
      - question: "Name the two members of Aeneas’ family who escaped with him."
        answer: "ANCHISES (FATHER) & IULUS / ASCANIUS (SON)"
  - tossup:
      question: "What war was the result of the Romans’ discovery of an alliance between Hannibal and the ruler of an eastern kingdom?"
      answer: "FIRST MACEDONIAN"
    boni:
      - question: "Name the Macedonian king who wanted to take advantage of Rome’s preoccupation with Hannibal."
        answer: "PHILIP V"
      - question: "With what Greek confederacy did Rome then form an alliance in order to neutralize Philip."
        answer: "AETOLIAN LEAGUE"
  - tossup:
      question: "Give the Latin verb and its meaning from which “lavish” is derived."
      answer: "<latin>LAVŌ, LAVĀRE</latin> - WASH, CLEAN"
    boni:
      - question: "Give the Latin noun and its meaning from which “appease” is derived."
        answer: "<latin>PĀX</latin> - PEACE"
      - question: "Give the Latin verb and its meaning from which “address” is derived."
        answer: "<latin>REGŌ, REGERE</latin> -RULE, GUIDE, DIRECT, GOVERN"
  - tossup:
      question: "Give the nominative singular of the present participle of the verb <latin>eō</latin>, <latin>īre</latin>."
      answer: "<latin>IĒNS</latin> "
    boni:
      - question: "Change <latin>iēns</latin> to the accusative singular."
        answer: "<latin>EUNTEM</latin> "
      - question: "Give the future active participle of the same verb."
        answer: "<latin>ITŪRUS / -A / -UM</latin> "
  - tossup:
      question: "Translate the following sentence into English: <latin>Amīcī, num pecūniam cupimus</latin>?"
      answer: "FRIENDS, SURELY WE DO NOT DESIRE / WANT MONEY? / FRIENDS, WE DON’T DESIRE MONEY, DO WE?"
    boni:
      - question: "<latin>Servīne estis an lībertī</latin>?"
        answer: "ARE YOU (ALL) SLAVES OR FREEDMEN"
      - question: "Using an irregular verb, say in Latin: “Julius, do you want to do this?”"
        answer: "<latin>VĪSNE, IŪLĪ, HOC FACERE / AGERE?</latin>"
  - tossup:
      question: "Why does Penelope want to talk with the old beggar who has just arrived at the palace?"
      answer: "TO SEE IF HE HAS ANY NEWS OF ODYSSEUS"
    boni:
      - question: "Who does the disguised Odysseus tell Penelope he is?"
        answer: "BROTHER OF IDOMENEUS, (KING OF CRETE)"
      - question: "Whom does Penelope summon to bathe Odysseus' feet?"
        answer: "(HIS OLD NURSE) EURYCLEIA"
  - tossup:
      question: "Who, with Chariclo, fathered a daughter, named Ocyrrhoe, a girl who had the power of divination?"
      answer: "CHIRON"
    boni:
      - question: "Whose future did she reveal against the will of the gods?"
        answer: "AESCULAPIUS' / ASCLEPIUS’"
      - question: "Into what was Ocyrrhoe transformed?"
        answer: "HORSE"
  - tossup:
      question: "What form of the adjective <latin>gravis</latin> agrees with the singular noun form <latin>baculum</latin>?"
      answer: "<latin>GRAVE</latin> "
    boni:
      - question: "with the noun form <latin>gladium</latin>?"
        answer: "<latin>GRAVEM</latin> "
      - question: "with the noun form <latin>capitum</latin>?"
        answer: "<latin>GRAVIUM</latin> "
  - tossup:
      question: "(PASS OUT THE VISUAL TO ALL TEAMS) Please do NOT open your visuals until instructed to do so. (WAIT UNTIL ALL THE TEAMS HAVE THEIR VISUALS) Open up your visuals. (SLIGHT PAUSE) These two pictures portray legendary events from one of the darkest hours of the early Republic. Which chieftain led the invasion of barbarians seen in these pictures?"
      answer: "BRENNUS"
    boni:
      - question: "Explain why all of the Romans that can be seen in the top picture are old men, and why no younger men can be seen."
        answer: "ABLE-BODIED MEN WERE FIGHTING / DEFENDING (THE CAPITOLINE) / HAD FLED THE CITY THE OLD MEN (SENATORS) STAYED BEHIND IN THE LOWER CITY"
      - question: "Which deity considered the “fowl” creatures seen in the bottom picture to be sacred?"
        answer: "JUNO (NOT HERA) (LATER “MONETA”)"
  - tossup:
      question: "What desert kingdom did Odenathus rule as a Roman client?"
      answer: "PALMYRA"
    boni:
      - question: "What Persian King did Odenathus defeat on behalf of the emperor Gallienus?"
        answer: "SHAPUR or SHAPOR(I)"
      - question: "Having been made commander of all Roman forces in the Near East, what invaders did Odenathus drive out of Asia Minor?"
        answer: "GOTHS"
  - tossup:
      question: "Listen carefully to the following passage, which I will read twice, and answer IN ENGLISH the question that follows: <latin>Ōlim in quādam cīvitāte erat fēmina quae serpentem prō</latin> <latin>marītō</latin> <latin>habēre volēbat. Sollemniter nūpsit serpentī</latin> <latin>venēnōsō. Vīcīnī</latin> <latin>hūius fēminae</latin>  <latin>dīxērunt, “Illa mulier est īnsāna!” Mulier autem hoc sōlum dīxit,</latin>  <latin>“Quamquam marītus meus est serpēns, neque dīcere neque ad multam noctem lūdere potest!”</latin>  Question: What did the woman want to do with the snake?"
      answer: "MARRY IT / HAVE IT FOR A HUSBAND"
    boni:
      - question: "What did her neighbors think about this unusual arrangement?"
        answer: "THEY THOUGHT SHE WAS CRAZY"
      - question: "What two reasons did the woman give for marrying a snake?"
        answer: "IT CANNOT SPEAK & IT CANNOT PLAY (UNTIL LATE AT NIGHT)"
  - tossup:
      question: "On this campus you will find the Latin phrase <latin>Indiānēnsis Ūniversitātis Sigillum</latin>? Of what Latin noun is <latin>sigillum</latin> a diminutive?"
      answer: "<latin>SIGNUM</latin>"
    boni:
      - question: "<latin>Respondē</latin> <latin>Anglicē: Cūius generis et quō</latin> <latin>cāsū</latin> <latin>est “Ūniversitātis”?</latin>"
        answer: "FEMININE & GENITIVE"
      - question: "The seal also contains the year in which the university was founded. What year is "
        answer: "<latin>MDCCCXX</latin>? 1820"
  - tossup:
      question: "Differentiate in meaning between the noun <latin>būbō</latin> and the verb <latin>bibō</latin>."
      answer: "<latin>BŪBŌ</latin> - OWL <latin>BIBŌ</latin> - DRINK"
    boni:
      - question: "between the noun <latin>solum</latin> and the adjective <latin>sōlus</latin>."
        answer: "<latin>SOLUM</latin> - GROUND, EARTH, LAND, FLOOR, SOLE <latin>SŌLUS</latin> - ALONE, ONLY, SINGLE"
      - question: "between the noun <latin>vōx</latin> and the adverb <latin>vix</latin>."
        answer: "<latin>VŌX</latin> - VOICE, SOUND & <latin>VIX</latin> - HARDLY, SCARCELY"
  - tossup:
      question: "What warrior was the sibling of Pegasus?"
      answer: "CHRYSAOR"
    boni:
      - question: "What daughter of Oceanus did Chrysaor marry?"
        answer: "CALLIR(R)HOE"
      - question: "What son of Chrysaor and Callirrhoe did Heracles encounter in one of his labors?"
        answer: "GERYON"
  - tossup:
      question: "During the early years of the 2nd Triumvirate, who led the pirates that cut off commerce between Rome and Africa?"
      answer: "SEXTUS POMPEIUS / SEXTUS POMPEY"
    boni:
      - question: "After failing in battle at Messana, Octavian turned over command to the more talented Agrippa. Where did Agrippa decisively defeat the pirate fleet?"
        answer: "NAULOCHUS"
      - question: "When Lepidus sailed to support the land attack with his troops, what did those troops do that left Lepidus at Octavian’s mercy?"
        answer: "THEY DESERTED HIM AND JOINED OCTAVIAN"
  - tossup:
      question: "What is the Latin term for games sponsored by a private individual or individuals to honor the death or memory of a relation or friend?"
      answer: "<latin>MŪNERA / LŪDĪ</latin> <latin>FŪNEBRĒS</latin> "
    boni:
      - question: "What is the Latin term for the public games celebrated on fixed days and recurring annually?"
        answer: "<latin>LŪDĪ</latin>"
      - question: "Distingush between <latin>lūdī</latin> <latin>scaenicī</latin> and <latin>lūdī</latin> <latin>circensēs</latin>."
        answer: "<latin>SCAENICĪ</latin> = IN THEATER <latin>CIRCENSĒS</latin> = CHARIOT RACES / EVENTS HELD IN A CIRCUS"
  - tossup:
      question: "What gender are infinitives in Latin?"
      answer: "NEUTER"
    boni:
      - question: "Of what gender are nouns for trees such as <latin>laurus</latin>, <latin>quercus</latin> and <latin>pīnus</latin>."
        answer: "FEMININE"
      - question: "Differentiate in meaning among those trees."
        answer: "<latin>LAURUS</latin> - LAUREL <latin>QUERCUS</latin> - OAK <latin>PĪNUS</latin> - PINE"
  - tossup:
      question: "<latin>Audī</latin> <latin>dīligenter et respondē</latin> <latin>aut Anglicē</latin> <latin>aut Latīnē: Quis sum? Eram superbus et fōrmōsus iuvenis. Ōlim in aquīs fontis imāginem meam vīdī</latin> <latin>et mē</latin> <latin>ipsum amāre coepī. Quamquam multae nymphae mē</latin> <latin>amābant, nēminem praeter imāginem meam amābam. Quis sum?</latin> "
      answer: "NARCISSUS"
    boni:
      - question: "<latin>Respondē</latin> <latin>aut Anglicē</latin> <latin>aut Latīnē: Eram fīlia rēgis quae saepe cum amīcīs in campīs lūdēbam. Ōlim Iuppiter mē</latin> <latin>vīdit et subitō</latin> <latin>in magnum amōrem meī</latin> <latin>cecidit. Itaque Iuppiter sē</latin> <latin>in taurum pulchrum trānsfōrmāvit. Hunc taurum diū</latin> <latin>spectābam; tandem in tergum taurī</latin> <latin>ascendī. Taurus mē</latin> <latin>ad īnsulam Crētam portāvit. Quis sum?</latin>"
        answer: "EUROPA"
      - question: "<latin>Respondē</latin> <latin>aut Anglicē</latin> <latin>aut Latīnē: Erāmus amantēs, quī</latin> <latin>in domīs vīcīnīs habitābāmus. Pārentēs amōrem nostrum prohibēre temptāvērunt, sed per rīmam in mūrō</latin> <latin>inter domōs cōtīdiē</latin> <latin>in sēcrētō</latin> <latin>inter nōs dīcēbāmus. Ūnā</latin> <latin>nocte cōnsilium cēpimus convenīre, sed erat magnus īnfēlīx error ob leōnem et nōs gladiō</latin> <latin>interfēcimus. Quī</latin> <latin>sumus?</latin>"
        answer: "PYRAMUS & THISBE"
  - tossup:
      question: "Which of the following words, if any, does not have the same Latin root as the others: seance, sedentary, obsession, sedan, sedition?"
      answer: "SEDITION"
    boni:
      - question: "What Latin verb is the root of “sedition”?"
        answer: "<latin>E</latin><latin>Ō,</latin> <latin>ĪRE</latin> - GO"
      - question: "What derivative from the same root as the other words in the toss-up means “one who disagrees”?"
        answer: "DISSIDENT"
