tournament: "NJCL Certamen"
year: 2006
division: "Advanced"
round: "Round 1"
questions:
  - tossup:
      question: "What was the job of the <latin>praefectus annōnae</latin>?"
      answer: "SUPERVISE THE GRAIN SUPPLY"
    boni:
      - question: "What emperor built a new deep-water harbor near Ostia in the first century A.D. to improve the transport of the grain supply?"
        answer: "CLAUDIUS"
      - question: "What commodity did the emperor Septimius Severus add to the <latin>annōna</latin>?"
        answer: "OLIVE OIL"
  - tossup:
      question: "<latin>Somnium Mediā Aestāte</latin> is the Latin title of which of Shakespeare’s works?"
      answer: "A MIDSUMMER NIGHT’S DREAM"
    boni:
      - question: "<latin>Duo Venustī Verōnae</latin>?"
        answer: "TWO GENTLEMEN OF VERONA"
      - question: "<latin>Labōrēs Amōris Perditī</latin>?"
        answer: "LOVE’S LABORS LOST"
  - tossup:
      question: "Name the three Cyclopes born to Uranus and Gaea."
      answer: "ARGES, BRONTES, & (A)STEROPES ( or PYRACMON)"
    boni:
      - question: "Where did Uranus imprison these one-eyed monsters?"
        answer: "TARTARUS (Prompt if the answer is “Hades” or “Underworld”)"
      - question: "Name the Cyclopes’ siblings who were also imprisoned in Tartarus?"
        answer: "HECATONCHIRES or THE HUNDRED-HANDED"
  - tossup:
      question: "What poet did Augustus ask to write a fourth book of <title>Odes</title> that was published in 13 BC?"
      answer: "HORACE (Q. HORATIUS FLACCUS)"
    boni:
      - question: "What Greek poet inspired many of the patriotic lyrics in this fourth book?"
        answer: "PINDAR"
      - question: "The fourth book of <title>Odes</title> was dedicated to Augustus’ friend Paulus Fabius Maximus. To whom had the first three books of Odes been dedicated?"
        answer: "(C.) MAECENAS"
  - tossup:
      question: "What Latin phrase is used in English to mean “from the bottom of the heart”?"
      answer: "<latin>AB IMŌ PECTORE</latin> "
    boni:
      - question: "What Latin phrase is used in English to mean “from the beginning”?"
        answer: "Ā <latin>PRĪNCIPIŌ / AB INITIŌ / AB OVŌ</latin>"
      - question: "What Latin phrase is used in English to mean “deductive reasoning” or “from cause to effect”??"
        answer: "Ā <latin>PRIŌRĪ</latin>"
  - tossup:
      question: "Give the Latin noun and its meaning from which “primeval” is derived."
      answer: "<latin>AEVUM</latin> - AGE, ETERNITY"
    boni:
      - question: "Give the Latin noun and its meaning from which “debacle” is derived."
        answer: "<latin>BACULUM</latin> - ROD, WALKING STICK"
      - question: "Give the Latin noun and its meaning from which “cardinal” is derived."
        answer: "<latin>CARDŌ</latin> - HINGE, PIVOT, TURNING POINT"
  - tossup:
      question: "What war began with the Roman people’s vote to send an army overseas for the first time in 264 BC?"
      answer: "FIRST PUNIC"
    boni:
      - question: "What group, which had captured Messana, invited the Romans to interfere in Sicily?"
        answer: "MAMERTINES"
      - question: "In what year had the Mamertines seized Messana?"
        answer: "288 B.C."
  - tossup:
      question: "What exposed infant was suckled by a she-bear before being found by a shepherd on Mt. Ida?"
      answer: "PARIS / ALEXANDROS / ALEXANDER"
    boni:
      - question: "At what event did Paris unknowingly compete against his own brothers?"
        answer: "GAMES HELD BY PRIAM IN MEMORY OF HIS BELIEVED-TO-BE-DEAD SON PARIS"
      - question: "Who recognized Paris after he won every event at the games?"
        answer: "CASSANDRA / DEIPHOBUS"
  - tossup:
      question: "What two islands were administered as Rome’s second province?"
      answer: "SARDINIA & CORSICA"
    boni:
      - question: "What two provinces were created in 197 BC in Spain?"
        answer: "NEARER SPAIN / <latin>HISPANIA CITERIOR</latin> & FARTHER SPAIN / <latin>HISPANIA ULTERIOR</latin> "
      - question: "What city and its surrounding territory became the province of Africa in 146 BC?"
        answer: "CARTHAGE"
  - tossup:
      question: "What second century AD writer of a miscellany or collection of brief compositions on a wide variety of subjects records the story of Androclus and the lion?"
      answer: "(AULUS) GELLIUS"
    boni:
      - question: "What is the Latin title of Gellius’ miscellany?"
        answer: "<title><latin>NOCTĒS ATTICAE</latin></title> "
      - question: "Why did Gellius entitle this work <title><latin>Noctēs Atticae</latin></title>?"
        answer: "BEGIN <emphasis>WRITING</emphasis> AT <emphasis>NIGHT</emphasis> DURING YEAR IN <emphasis>ATHENS</emphasis>"
  - tossup:
      question: "In a passage of the <title>Attic Nights</title>, Aulus Gellius explains that the ancient Romans and Greeks wore their wedding rings on a specific finger which he describes in Latin as <latin>“est in manū sinistrā minimō proximus</latin>.” Which specific finger is this?"
      answer: "THE ONE THAT IS ON THE <emphasis>LEFT</emphasis> HAND NEXT TO THE SMALLEST FINGER STUDENT CAN ALSO POINT OUT HIS / HER RING FINGER VISUALLY (if student just says “the ring finger”, prompt for them to show you or to specify the exact finger) (PASS OUT THE VISUAL) — this is the visual — <emphasis>for moderator reference only</emphasis>  X<latin>. . . .</latin>Causam esse hūius reī Apiōn in librīs Aegyptiacīs hanc dīcit, quod īnsectīs apertīsque hūmānīs corporibus, ut mōs in Aegyptō fuit, quās Graecī anatomas appellant, repertum est nervum quendam tenuissimum ab eō ūnō digitō, dē quō dīximus, ad cor hominis pergere ac pervenīre. (Gellius, X.10) — end of the visual —"
    boni:
      - question: "You now have 15 seconds to examine the visual, wherein Gellius continues his discussion of why this finger was used for wedding rings. (WAIT 15 SECONDS) What unique custom of the Egyptians is mentioned in this passage?"
        answer: "CUTTING AND OPENING UP HUMAN BODIES / PERFORMING AUTOPSIES / DISSECTION / ANATOMICAL STUDIES (If student answers simply “anatomy,” ask for more information)"
      - question: "By performing these dissections, what discovery was purportedly made, leading them to choose this specific finger for wedding rings?"
        answer: "(A CERTAIN VERY SLENDER) NERVE THAT GOES FROM THAT FINGER (ALL THE WAY) TO THE HEART"
  - tossup:
      question: "In which of his works did Caesar repeatedly claim that his political enemies had forced on him a war he never wanted?"
      answer: "<title><latin>COMMENTĀRIĪ DĒ BELLŌ CĪVĪLĪ</latin></title>"
    boni:
      - question: "Of how many books is the <title><latin>Dē Bellō Cīvīlī</latin></title> composed?"
        answer: "THREE"
      - question: "<title><latin>Dē Bellō Cīvīlī</latin></title> does not contain an account of the crossing of the Rubicon. Name a Roman author who does record this beginning of the civil war."
        answer: "<latin>LUCAN, SUETONIUS</latin> "
  - tossup:
      question: "Under what circumstances can the subject of an infinitive be in the nominative case?"
      answer: "AN HISTORICAL INFINITIVE"
    boni:
      - question: "What tense does an historical infinitive replace?"
        answer: "IMPERFECT"
      - question: "What usual function of the subjunctive mood can an infinitive only very rarely replace?"
        answer: "PURPOSE"
  - tossup:
      question: "What name was shared by these three women: the youngest daughter of the Athenian king Erechtheus, the daughter of the Corinthian king Creon, and the Trojan wife of Aeneas?"
      answer: "CREUSA"
    boni:
      - question: "Aeneas' wife Creusa appeared in a vision to him to tell him that she was now in the care of what divinity?"
        answer: "CYBELE / MAGNA MATER / VENUS / APHRODITE"
      - question: "Who were Creusa's parents?"
        answer: "PRIAM AND HECUBA / HECABE"
  - tossup:
      question: "What poet stopped his flattery of the emperor Domitian in his last three books of epigrams?"
      answer: "MARTIAL (M. VALERIUS MARTIALIS)"
    boni:
      - question: "How many books of epigrams did Martial publish?"
        answer: "TWELVE"
      - question: "Where was Martial living when he wrote the twelfth and last book?"
        answer: "BILBILIS, SPAIN (HISPANIA TERRACONENSIS)"
  - tossup:
      question: "Listen carefully to the following excerpt from Caesar’s <title><latin>Commentāriī Dē Bellō Gallicō</latin></title>, which I will read twice, and answer IN ENGLISH the question that follows: <latin>Suēvōrum gēns est longē maxima et bellicōsissima Germānōrum omnium. Hī centum pāgōs habēre dīcuntur, ex quibus quotannīs singula mīlia armātōrum bellandī causā ex fīnibus ēdūcunt. Reliquī, quī domī mānsērunt, sē atque illōs alunt.</latin>  Question: What does Caesar say the Suevi have?"
      answer: "A HUNDRED DISTRICTS / REGIONS / CANTONS"
    boni:
      - question: "Why do the Suevi pull a thousand men from each district every year?"
        answer: "IN ORDER TO WAGE WAR"
      - question: "What do the remaining Suevi, who have stayed home, do?"
        answer: "THEY FEED THEMSELVES AND THOSE WHO HAVE BEEN CALLED OUT TO WAR / THEY SEE TO IT THAT THEY FEED THEMSELVES AND THOSE WHO ARE AT WAR"
  - tossup:
      question: "What emperor was forced by public opinion to send his mistress home to Judaea in A.D. 79?"
      answer: "TITUS (FLAVIUS VESPASIANUS)"
    boni:
      - question: "Who was Titus’ Jewish mistress who reminded the people of Cleopatra?"
        answer: "BERENICE"
      - question: "What was the name of Titus’ only child, a daughter by his second wife?"
        answer: "JULIA"
  - tossup:
      question: "Give the first person singular, future passive indicative of <latin>faciō</latin>."
      answer: "<latin>FĪAM</latin> "
    boni:
      - question: "Change that form to present subjunctive."
        answer: "<latin>FĪAM</latin> "
      - question: "Change that form to perfect subjunctive."
        answer: "<latin>FACTUS / -A / -UM SIM</latin> "
  - tossup:
      question: "Translate the following sentence into English: <latin>Mārcus nescit quis patrem suum occīderit</latin>."
      answer: "MARCUS DOES NOT KNOW WHO KILLED HIS FATHER"
    boni:
      - question: "<latin>Tē rogāvī quandō frāter tuus reditūrus esset</latin>."
        answer: "I ASKED YOU WHEN YOUR BROTHER WAS GOING TO / WOULD RETURN"
      - question: "<latin>Tē, Pūblī, rogāre volō num hoc fēcerīs</latin>."
        answer: "PUBLIUS, I WANT TO ASK YOU WHETHER YOU DID THIS"
  - tossup:
      question: "What Greek saw through Odysseus’ feigned madness and forced Odysseus to leave for Troy?"
      answer: "PALAMEDES"
    boni:
      - question: "Odysseus supposedly forged a letter from whom to whom, promising a reward of gold if he would betray the Greeks?"
        answer: "FROM PRIAM TO PALAMEDES"
      - question: "Who claimed to be a kinsman of Palamedes and therefore an implacable enemy of Odysseus?"
        answer: "SINON"
