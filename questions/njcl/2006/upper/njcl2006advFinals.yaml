tournament: "NJCL Certamen"
year: 2006
division: "Advanced"
round: "Finals"
questions:
  - tossup:
      question: "Whose daughters were given the ability by Dionysus to produce olives, corn, and wine by touching anything?"
      answer: "ANIUS’"
    boni:
      - question: "Why did Agamemnon kidnap these girls on the way to Troy?"
        answer: "TO FEED THE GREEK ARMY"
      - question: "Into what did Dionysus transform the girls?"
        answer: "(WHITE) DOVES"
  - tossup:
      question: "What grammatical peculiarity do all of the following have in common: <latin>carbasus, epulum, balneum, dēlicium</latin>?"
      answer: "HETEROGENES / DIFFERENT GENDERS IN THE SINGULAR AND PLURAL"
    boni:
      - question: "Make the phrase <latin>carbasus alta</latin> plural."
        answer: "<latin>CARBASA ALTA</latin> "
      - question: "Make the phrase <latin>epulum fūnebre</latin> plural."
        answer: "<latin>EPULAE FâNEBRĒS</latin> "
  - tossup:
      question: "Which dictator increased the number of senators in order to create more eligible jurors in 81 BC?"
      answer: "(L. CORNELIUS) SULLA"
    boni:
      - question: "Sulla’s judicial reforms created several types of courts, each hearing specific types of cases. What sort of crime would have been tried in a court known as a <latin>quaestiō dē sicāriīs et vēneficiīs</latin>?"
        answer: "MURDER / POISONINGS / ASSASINATION"
      - question: "Another portion of Sulla’s reforms involved a revival and revision of the <latin>lēx Villia Annālis</latin> of 180 BC, which involved the <latin>cursus honōrum</latin>. What were the minumum ages prescribed by Sulla for the quaestorship, praetorship, and consulship?"
        answer: "30, 40 AND 43 RESPECTIVELY"
  - tossup:
      question: "From what Latin noun, with what meaning, do we derive the English word “chivalry”?"
      answer: "<latin>CABALLUS</latin> - HORSE"
    boni:
      - question: "What English derivative of <latin>caballus</latin> is an English adjective meaning “carefree” or “nonchalant”?"
        answer: "CAVALIER"
      - question: "From what Latin noun, with what meaning, do we derive the English word “cabaret”?"
        answer: "<latin>CAMERA -</latin> ROOM"
  - tossup:
      question: "Who defeated Eurytus and his sons in an archery contest?"
      answer: "HERACLES"
    boni:
      - question: "With what daughter of Eurytus did Heracles fall in love?"
        answer: "IOLE"
      - question: "To whom did Eurytus’ son Iphitus give his father’s great bow as a present?"
        answer: "ODYSSEUS"
  - tossup:
      question: "What poet accompanied Marcus Fulvius Nobilior to Greece in order to compose an account of his military campaign?"
      answer: "(QUINTUS) ENNIUS"
    boni:
      - question: "What was the title of the <latin>fābula praetexta</latin> that resulted from this trip?"
        answer: "<title><latin>AMBRACIA</latin></title> "
      - question: "What writer and politician, who had originally brought Ennius to Rome, harshly criticized this practice as little more than writing propaganda?"
        answer: "CATO THE ELDER / CENSOR (MARCUS PORCIUS CATO MAIOR)"
  - tossup:
      question: "For the verb <latin>ulcīscor</latin>, give the 3rd person plural, imperfect subjunctive."
      answer: "<latin>ULCĪSCERENTUR</latin> "
    boni:
      - question: "Change <latin>ulcīscerentur</latin> to the perfect tense."
        answer: "<latin>ULTĪ /-AE /-A SINT</latin> "
      - question: "For the verb <latin>ulcīscor</latin>, give the singular present and future imperatives."
        answer: "<latin>ULCĪSCERE</latin> & <latin>ULCĪSCITOR</latin> "
  - tossup:
      question: "Translate the following sentence into Latin: Would that Caesar had not conquered Gaul."
      answer: "<latin>UTINAM NĒ / NŌN CAESAR GALLIAM VĪCISSET / SUPERĀVISSET</latin> (The usage of “<latin>nōn</latin>” is listed as less common in the A&G, but not odd. In the OLD, it is listed without distinction in the negative. In Gildersleeve, p. 172 “<latin>Utinam</latin> was perhaps originally interrogative... Hence the frequent use of <latin>nōn</latin>.)"
    boni:
      - question: "Translate this sentence into Latin: It happened that Caesar was made dictator."
        answer: "<latin>ACCIDIT / ĒVĒNIT / FACTUM EST UT CAESAR DICTĀTOR CREĀRĒTUR / FIERET</latin> "
      - question: "Using a standard Latin idiom, translate this sentence: “By writing commentaries, Caesar has informed us.”"
        answer: "<latin>COMMENTĀRIĪS SCRĪBENDĪS, CAESAR NŌS CERTIŌRĒS FĒCIT</latin> or <latin>COMMENTĀRIŌS SCRĪBENDŌ</latin>... (Forms of <latin>compōnō</latin> and other “writing” words acceptable also)"
  - tossup:
      question: "Listen carefully to the following lines from Vergil, which I will read twice as prose, and answer IN LATIN the question that follows: <latin>tū regere imperiō populōs, Rōmāne, mementō hae tibi erunt artēs, pācīque impōnere mōrem,</latin>  <latin>parcere subiectīs et dēbellāre superbōs.</latin>  Question: <latin>Cui persōnae necesse est regere imperiō populōs?</latin> "
      answer: "<latin>RŌMĀNŌ / AENĒAE</latin>  If the student answers“<latin>tibi</latin>”, ask him or her to be more specific."
    boni:
      - question: "<latin>Quibus ā Rōmānīs parcendum est?</latin>"
        answer: "<latin>SUBIECTĪS</latin>"
      - question: "<latin>Respondē aut Anglicē aut Latīnē: Vergilius scīlicet haec verba scrīpsit. Quis autem haec in Aenēide loquitur?</latin>"
        answer: "<latin>ANCHĪSĒS</latin> / ANCHISES"
  - tossup:
      question: "What legal Latin phrase would describe Paris Hilton being “caught in the act”?"
      answer: "<latin>(IN) FLAGRANTE DĒLĪCTŌ</latin>"
    boni:
      - question: "What Latin legal phrase would describe the “burden of proof” placed on the federal government to convict Enron executive Ken Lay, until his untimely demise?"
        answer: "<latin>ONUS PROBANDĪ</latin>"
      - question: "What Latin legal term, often mispronounced on Fox News, did Chief Justice John Roberts use to explain that he was prepared to stand on past court decisions concerning Roe v. Wade?"
        answer: "<latin>STĀRE DĒCĪSĪS</latin> "
  - tossup:
      question: "Of the words “annotation,” “anarchy,” “devaluation,” “morality,” or “rheumatism,” which is described in the <title><latin>Lexicon Recentis Latīnitātis,</latin></title> or <title>Dictionary of Modern Latin</title>, as <latin>“cum nūllīs iūribus, officiīs, lēgibus cīvitās continētur</latin>”?"
      answer: "ANARCHY"
    boni:
      - question: "Which of the following would NOT be found in the <title><latin>Lexicon Recentis Latīnitātis</latin></title>  as a translation for the English word “gang”? <latin>amplior mercātus, praedōnum sodālicium, malefactōrum grex, rapīnātōrum cōnsociātiō</latin> "
        answer: "<latin>AMPLIOR MERCĀTUS</latin> "
      - question: "What single English word is translated in the <title><latin>Lexicon Recentis Latīnitātis</latin></title> as “<latin>casa glaciē īnstructa</latin>”?"
        answer: "IGLOO"
  - tossup:
      question: "Name the daughter of the Thessalian king Elatus who was ravished by Poseidon."
      answer: "CAENIS"
    boni:
      - question: "What was one of the boons that Poseidon granted to Caenis?"
        answer: "TRANSFORMED INTO A MAN (SO THAT WOULD NOT SUFFER THAT INDIGNITY AGAIN & MADE INVULNERABLE TO WEAPONS)"
      - question: "What was Caenis’ name as a man?"
        answer: "CAENEUS"
  - tossup:
      question: "Give the Latin term for the ancient Roman custom described in the following Latin sentence: <latin>Sī pater pūpum ad pedēs positum tollere volēbat neque statim eum expōnere, hōc rītū sollemnī pūpum sustulit et dēclārāvit eum vel fīlium suum vel fīliam suam esse.</latin>"
      answer: "<latin>SUSCEPTIŌ / SUSCEPTIŌNE</latin>"
    boni:
      - question: "<latin>Respondē Latīnē: Quod nōmen ā Rōmānīs datum est eī ipsī diē</latin><latin>ī, nōnō puerīs et octāvō puellīs, quō rītū sollemnī praenōmina līberīs data sunt?</latin> "
        answer: "<latin>(DIĒS) LâSTRICUS / LâSTRICŌ / (DIĒS) NŌMINUM / NŌMINĀLIA</latin>"
      - question: "<latin>Respondē aut Anglicē aut Latīnē: Dīcuntur puerī genium habuisse. Quid habuēre puellae?</latin>"
        answer: "<latin>IâNŌNEM / IâNŌ</latin> / JUNO"
  - tossup:
      question: "What Roman commander celebrated a triumph in 177 BC for his defeat and settlement of the Celtiberians?"
      answer: "(TI.) SEMPRONIUS GRACCHUS (FATHER OF THE GRACCHI)"
    boni:
      - question: "Sempronius Gracchus celebrated a second triumph for his suppression of a revolt on what large island?"
        answer: "SARDINIA"
      - question: "What building did Sempronius Gracchus erect in the Forum Romanum during his censorship?"
        answer: "<latin>BASILICA SEMPRONIA</latin>"
  - tossup:
      question: "(PASS OUT THE VISUAL TO ALL TEAMS) Please do NOT open your visuals until instructed to do so. (WAIT UNTIL ALL THE TEAMS HAVE THEIR VISUALS) Open up your visuals. You now have 10 seconds to examine it. (WAIT 10 SECONDS) Identify two instances of antithesis in this poem."
      answer: "<latin>ODĪ ET AMŌ; FACIAM . . . FIERĪ</latin> (ALSO ACCEPT KNOWING VS. FEELING (<latin>NESCIŌ... SENTIŌ</latin>) ; QUESTION VS. ANSWER)"
    boni:
      - question: "Locate the two diaereses in line 2."
        answer: "AFTER <latin>NESCIŌ</latin> & AFTER <latin>FIERĪ</latin>."
      - question: "Using the caesuras, diaereses, and sentence ends to break the poem into segments, what is the name given to the revealed structure?"
        answer: "RING COMPOSITION / CHIASMUS / CHIASTIC RING"
  - tossup:
      question: "In January 27 BC, Octavian handed back all his authority to the Senate and people. In order to dispel the fear of civil war, he immediately consented to remain consul and take responsibilty for six critical provinces. Name the two imperial provinces in Spain."
      answer: "<latin>LUSITANIA</latin> & <latin>TARRACONENSIS</latin> "
    boni:
      - question: "What city did Augustus establish in Lusitania in 25 BC as the provincial capital?"
        answer: "<latin>EMERITA (AUGUSTA)</latin> / MERIDA"
      - question: "Augustus makes Tarraco the capital of Tarraconensis, replacing what other port city?"
        answer: "<latin>CARTHAGO NOVA</latin> / CARTAGENA"
  - tossup:
      question: "With the exception of alliteration, consonance, and assonance, what figure of speech is in this line from Lucretius: <latin>mollia quae fīunt, āër aqua terra vapōrēs</latin>?"
      answer: "ASYNDETON"
    boni:
      - question: "in this line: <latin>Nam prō sāncta deum tranquillā pectora pāce</latin>?"
        answer: "SYNCHYSIS or INTERLOCKING WORD ORDER"
      - question: "in this line: <latin>Cēdit enim rērum novitāte extrūsa vetustās</latin>?"
        answer: "OXYMORON"
  - tossup:
      question: "As we have been hearing a lot lately, Chuck Norris excels in many things. One of his talents is his ability to speak Latin. Listen to this boasting by Chuck Norris and tell me what his claim is: <latin>Quamquam omnēs verēbantur nē horrendās Gorgōnēs conspicerent, Gorgōnēs verēbantur nē mē conspicerent.</latin> "
      answer: "ALTHOUGH EVERYONE WAS AFRAID TO LOOK AT THE TERRIBLE GORGONS, THE GORGONS WERE AFRAID TO LOOK AT CHUCK NORRIS"
    boni:
      - question: "<latin>Cum Caesar Galliam decem annīs vīcerit, egomet tamen, sī dux fuissem, id decem diēbus perfēcissem.</latin> "
        answer: "ALTHOUGH CAESAR CONQUERED GAUL WITHIN TEN YEARS, CHUCK NORRIS, IF HE HAD BEEN GENERAL, WOULD HAVE ACCOMPLISHED IT IN TEN DAYS"
      - question: "<latin>Omnēs cognōscunt id quīnque et vīgintī līctōrēs mihi habēre licuisse sī dictātor fuissem.</latin> "
        answer: "EVERYONE KNOWS THAT CHUCK NORRIS WOULD HAVE BEEN PERMITTED TWENTY FIVE LICTORS, IF HE HAD BEEN DICTATOR"
  - tossup:
      question: "Who was punished in Hades for trying to set fire to Apollo's temple at Delphi?"
      answer: "PHLEGYAS"
    boni:
      - question: "Whose death was Phlegyas trying to avenge with this attack?"
        answer: "(HIS DAUGHTER) CORONIS’"
      - question: "Who was the father of Phlegyas?"
        answer: "ARES"
  - tossup:
      question: "Give the Latin title of the work in which Ovid claims that he has created an original type of poetry?"
      answer: "<title><latin>HERŌIDĒS / HERŌIDUM EPISTULAE</latin></title> "
    boni:
      - question: "What is the subject matter of the <title><latin>Herōidēs</latin></title>?"
        answer: "LETTERS FROM FAMOUS WOMEN / HEROINES IN MYTH TO THEIR ABSENT HUSBANDS / LOVERS / MEN"
      - question: "Most of Ovid’s heroines were based primarily upon those found in Greek epics or tragedies. Name one of the two heroines that was based on recent Latin sources.."
        answer: "DIDO (Vergil’s <title>Aeneid</title>) or ARIADNE (Catullus 64)"
