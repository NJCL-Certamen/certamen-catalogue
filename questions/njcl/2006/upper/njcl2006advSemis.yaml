tournament: "NJCL Certamen"
year: 2006
division: "Advanced"
round: "Semifinals"
questions:
  - tossup:
      question: "Translate into English: <latin>Quis dubitat quīn linguam Latīnam intellegam</latin>?"
      answer: "WHO DOUBTS THAT I UNDERSTAND (THE) LATIN (LANGUAGE)? or WHO DOUBTS BUT THAT I (SHOULD) UNDERSTAND (THE) LATIN (LANGUAGE)?"
    boni:
      - question: "<latin>Nēmō tam stultus est quīn ad hoc respondēre possit</latin>."
        answer: "NO ONE IS SO STUPID THAT HE CANNOT ANSWER / RESPOND (TO) THIS"
      - question: "<latin>Paulum absum quīn moderātōrem interficiam</latin>."
        answer: "I’M NOT FAR FROM / (VERY) CLOSE TO KILLING THE MODERATOR or I’M A LITTLE AWAY FROM THAT I (SHOULD) KILL THE MODERATOR"
  - tossup:
      question: "What Latin proverb is the equivalent in meaning to “a word to the wise is sufficient”?"
      answer: "<latin>VERBUM SAT SAPIENTĪ (EST)</latin> "
    boni:
      - question: "What Latin proverb is the equivalent in meaning to “blood from a stone”?"
        answer: "<latin>AB ASINŌ LANAM</latin> or <latin>AQUAM Ē PUMICE NUNC POSTULĀS</latin> "
      - question: "What Latin proverb is equivalent in meaning to the latin phrase “<latin>quid prō quō</latin>” and the English saying “I’ll scratch your back if you scratch mine”?"
        answer: "<latin>MANUS MANUM LAVAT / ASINUS ASINUM FRICAT</latin> "
  - tossup:
      question: "What Roman politician asked the poet Lucius Lucceius to commemorate his exploits as consul during Catiline’s conspiracy?"
      answer: "(MARCUS TULLIUS) CICERO"
    boni:
      - question: "After Lucceius refused, what was the title of the epic poem that Cicero himself composed?"
        answer: "<title>ON HIS (OWN) CONSULSHIP / <latin>DĒ CŌNSULĀTâ SUŌ</latin></title>"
      - question: "Translate this line preserved from the epic, which was often sited in criticisms of Cicero’s ability as a poet:” Ō <latin>fortūnātam nātam, mē cōnsule, Rōmam</latin>!”"
        answer: "“O FORTUNATE ROME, BORN WHEN I WAS CONSUL”"
  - tossup:
      question: "According to Vergil, where did Aeneas and the others who escaped the fall of Troy take refuge and build ships?"
      answer: "MT. IDA"
    boni:
      - question: "Having set sail, where did Aeneas first land intending to found a new city?"
        answer: "THRACE (not AENEADAE)"
      - question: "Whose ghost warned Aeneas and his Trojans against settling in Thrace?"
        answer: "POLYDORUS"
  - tossup:
      question: "What poet included an epicedion or funeral song for Marcellus, the son-in-law of Augustus, in his third book of elegies?"
      answer: "(SEXTUS) PROPERTIUS"
    boni:
      - question: "How many books of elegies did Propertius publish?"
        answer: "FOUR"
      - question: "What woman was the subject of many of Propertius’ elegies?"
        answer: "CYNTHIA / HOSTIA"
  - tossup:
      question: "(PASS OUT THE INSCRIPTION) You now have 10 seconds to examine the visual, which contains an inscription describing the two statues shown in the above picture. After the ten seconds, you will be asked a question concerning the inscription. (WAIT 10 SECONDS) <latin>Respondē Latīnē: Quō portāta sunt haec simulācra?</latin> "
      answer: "<latin>IN / AD CAPITOLIUM or IN /AD MONTEM CAPITOLĪNUM</latin> "
    boni:
      - question: "<latin>Respondē aut Anglicē aut Latīnē: Dīc, quaesō, duo nōmina hīs duōbus simulācrīs quī iuxtā equōs suōs stant.</latin> "
        answer: "CASTOR & POLLUX / POLYDEUCES or GEMINI & DIOSCOURI"
      - question: "<latin>Respondē aut Anglicē aut Latīnē: Haec īnscrīptiō nōs certiōrēs facit dē locō quō statuae inventae sunt. Dīc praenōmen, nōmen et cognōmen virō quī id aedificium mūniendum cūrāvit, prope quod hae statuae inventae sunt.</latin>"
        answer: "<latin>GNAEUS & POMPĒIUS /</latin> POMPEY & <latin>MAGNUS /</latin> THE GREAT"
  - tossup:
      question: "To whom did Hermes grant the power to escape detection whenever he stole?"
      answer: "AUTOLYCUS"
    boni:
      - question: "From what Corinthian king did Autolycus repeatedly steal cattle?"
        answer: "SISYPHUS"
      - question: "How did Sisyphus stop this thievery?"
        answer: "MARKED THE HOOVES OF HIS CATTLE (WITH HIS NAME OR THE PHRASE \"AUTOLYCUS STOLE ME\")"
  - tossup:
      question: "Which dictator was not appointed in the usual manner, by the consuls, but rather was directly elected by the Centuriate Assembly in 217 BC?"
      answer: "(Q.) FABIUS MAXIMUS (VERRUCOSUS)"
    boni:
      - question: "A dictator was usually allowed to appoint his own Master of the Cavalry, but the Assembly chose one for Fabius Maximus. Who was this <latin>magister equitum</latin>?"
        answer: "(M.) MINUCIUS (RUFUS)"
      - question: "Minucius criticized Fabius’ delaying tactics for the duration of 217. Whom did the Centuriate Assembly elect as consuls for the next year, partly as a result of this criticism?"
        answer: "(C. TERENTIUS) VARRO & (L. AEMILIUS) PAULLUS"
  - tossup:
      question: "Who, acting as Aedile in 33 BC, restored Rome’s sewers and constructed the Aqua Julia?"
      answer: "(MARCUS VIPSANIUS) AGRIPPA"
    boni:
      - question: "During Augustus’ reign, Agrippa reorganized Rome’s water system. Which of Agrippa’s aqueducts, which entered the city from the north, was built in 19 BC to supply water to the city’s first public baths? Even today it supplies Rome with some of its best cool water."
        answer: "AQUA VIRGO"
      - question: "Which of Rome’s aqueducts, built much earlier in 144 BC, was the first to employ arches on a large scale?"
        answer: "AQUA MARCIA"
  - tossup:
      question: "Listen carefully to the following passage, which I will read twice, and answer IN ENGLISH the question that follows: <latin>Duo frātrēs, quī erant fīliī imperātōris Rōmānī, herēdēs ex testāmentō</latin> ā <latin>patre suō factī sunt. Alter alterum crūdēliter necāvit. Cum eum occīdisset ac, verēns nē tyrannus ā populō nōminārētur, audīret facinus mītigārī posse, sī dīvum frātrem appellāret, dīxisse fertur: “Sit dīvus, dum nōn sit vīvus.”</latin> Question: What provision had the emperor made in his will?"
      answer: "HIS SONS WERE HIS HEIRS / THE BROTHERS WERE THE HEIRS"
    boni:
      - question: "Why did the murderous heir have his brother named “divine”?"
        answer: "HE FEARED THAT HE WOULD BE CALLED A TYRANT BY THE PEOPLE / HE HEARD THAT IT WOULD LESSEN HIS CRIME"
      - question: "Translate what the tyrannical brother said with regard to making his brother a god?"
        answer: "“LET HIM BE DIVINE / A GOD, SO LONG AS HE IS NOT LIVING”"
  - tossup:
      question: "Who demanded the hand of Honoria, the sister of Valentinian III, with half of the Western Empire as her dowry?"
      answer: "ATTILA (THE HUN)"
    boni:
      - question: "When the emperor refused, Attila invaded Gaul. Name the Roman commander who defeated him at the Catalaunian Plains in AD 451."
        answer: "(FLAVIUS) AETIUS"
      - question: "Aetius’ victory was due in large part to his allies. What people were these allies?"
        answer: "VISIGOTHS"
  - tossup:
      question: "Which of the following words, if any, does <latin>NOT</latin> have the same Latin root as the others: infatuate, infallible, default, failure, fallacious?"
      answer: "INFATUATE"
    boni:
      - question: "Give the English meaning and the principal parts of the verb at the root of the other words in the toss-up."
        answer: "<latin>FALLŌ, FALLERE, FEFELLĪ, FALSUM</latin> - DECEIVE, FAIL"
      - question: "What derivative of the same verb means “to waver”or “to stumble”?"
        answer: "FALTER"
  - tossup:
      question: "Say in Latin: “If this were easy, we would answer.”"
      answer: "<latin>SĪ HOC/ ID FACILE ESSET, RESPONDĒRĒMUS</latin> "
    boni:
      - question: "“If that had been difficult, we might not have answered.”"
        answer: "<latin>SĪ ILLUD / ID DIFFICILE FUISSET, NŌN RESPONDISSĒMUS</latin> "
      - question: "“If we should win, we would be very happy.”"
        answer: "<latin>SĪ VINCĀMUS / SUPERĒMUS, LAETISSIMĪ / FĒLĪCISSIMĪ / BEĀTISSIMĪ SĪMUS</latin> "
  - tossup:
      question: "What Silver Age writer was thought in the Middle Ages to have been a Christian because of his <title><latin>Epistulae mōrālēs</latin></title>?"
      answer: "(LUCIUS ANNAEUS) SENECA THE YOUNGER / MINOR / PHILOSOPHER"
    boni:
      - question: "To whom are <title><latin>Epistulae mōrālēs</latin></title> addressed?"
        answer: "(GAIUS) LUCILIUS"
      - question: "With what apostle did Jerome and others believe that Seneca had corresponded?"
        answer: "(SAINT) PAUL(US) / SAUL"
  - tossup:
      question: "Translate the conjunction in the following sentence into Latin: “We must work so that we may be more successful.”"
      answer: "<latin>QUŌ</latin> (w/ comparative in clause)"
    boni:
      - question: "“Why would I prevent you from doing your best?”"
        answer: "<latin>NĒ / QUŌMINUS / QUĪN</latin> "
      - question: "“I hope that you have tried to do your best.”"
        answer: "NO CONJUNCTION NEEDED"
  - tossup:
      question: "What brothers built the walls and seven gates of the city of Thebes?"
      answer: "AMPHION & ZETHUS"
    boni:
      - question: "What unique method of construction did Amphion employ?"
        answer: "PLAYED LYRE / MUSIC & STONES MOVED (INTO PLACE)"
      - question: "What had been the name of the city before Amphion and Zethus changed it to Thebes?"
        answer: "CADMEIA"
  - tossup:
      question: "<latin>Audī dīligenter et respondē aut Anglicē aut Latīnē: Quis in</latin> <title><latin>Aenēide</latin></title> <latin>dīcit: Ut vīdit sociōs, “Tempus dēsistere pūgnae;</latin>  <latin>sōlus ego in Pallanta feror, sōlī mihi Pallās</latin>  <latin>dēbētur; cuperem ipse parēns spectātor adesset.”</latin> "
      answer: "TURNUS (TO HIS SOLDIERS / COMRADES-IN-ARMS)"
    boni:
      - question: "<latin>“Neque tē Phoebī cortīna fefellit,</latin>  <latin>dux Anchīsiadē, nec mē deus aequore mersit;</latin>  <latin>namque gubernāclum multā vī forte revulsum,</latin>  <latin>praecipitāns trāxī mēcum.</latin> "
        answer: "PALINURUS (TO AENEAS)"
      - question: "<latin>cōnsiliīs pārē quae nunc pulcherrima Nautēs</latin>  <latin>dat senior; lēctōs iuvenēs, fortissima corda,</latin>  <latin>dēfer in Italiam; gēns dūra atque aspera cultū dēbellanda tibī Latiō est</latin>."
        answer: "ANCHISES (TO AENEAS)"
  - tossup:
      question: "What Latin noun, related in etymology to the verb <latin>medeor</latin>, means “a cure”?"
      answer: "<latin>REMEDIUM / MEDICĪNA</latin> "
    boni:
      - question: "What Latin noun, related to the verb <latin>taedet</latin>, means “weariness”?"
        answer: "<latin>TAEDIUM</latin> "
      - question: "What Latin noun, related to the verb <latin>sōlor</latin>, means “consolation”?"
        answer: "<latin>SŌLĀCIUM / SŌLĀTIUM / CŌNSŌLĀTIŌ</latin>"
  - tossup:
      question: "Circus games were very popular with the Romans. By the end of the first century A. D., there were three circuses in or near Rome. Name them."
      answer: "<latin>CIRCUS FLAMINIUS CIRCUS MAXIMUS</latin>  <latin>CIRCUS GĀI(Ī) ET NERŌNIS / CIRCUS VATICĀNUS</latin>  (OR THE ENGLISH NAMES ARE FINE)"
    boni:
      - question: "Later there were three other circuses just outside of Rome, but within easy reach of the citizens. Name one."
        answer: "<latin>CIRCUS OF MAXENTIUS, CIRCUS OF THE ARVAL BRETHREN,</latin>  <latin>CIRCUS AT BOVILLAE</latin> "
      - question: "What emperor built a <emphasis>stadium</emphasis> in the Campus Martius which is now a popular piazza for ice cream and, according to a certain popular novel, for murdering cardinals?"
        answer: "DOMITIAN"
  - tossup:
      question: "In what land was Hylas pulled into a spring by a nymph to be her consort?"
      answer: "MYSIA"
    boni:
      - question: "Who heard Hylas' cries and told Heracles?"
        answer: "(ARGONAUT) POLYPHEMUS"
      - question: "What sea god told the arguing Argonauts not to go back for Heracles and Polyphemus?"
        answer: "GLAUCUS"
