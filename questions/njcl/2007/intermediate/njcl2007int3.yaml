tournament: "NJCL Certamen"
year: 2007
division: "Intermediate"
round: "Round 3"
questions:
  - tossup:
      question: "To what goddess did Zeus order that the first victim of every public sacrifice be dedicated because she prevented strife from breaking out on Olympus?"
      answer: "HESTIA"
    boni:
      - question: "How did Hestia prevent strife from breaking out on Olympus?"
        answer: "SHE ASKED TO REMAIN FOREVER A VIRGIN"
      - question: "What two gods had been rivals for the love of Hestia?"
        answer: "APOLLO & POSEIDON"
  - tossup:
      question: "What use of the Dative case can be found in the following sentence? <latin>Haec prōvincia vōbīs dēfendenda est</latin>"
      answer: "AGENT"
    boni:
      - question: "<latin>Mīlitēs ad urbem missī</latin> <latin>sunt subsidiō</latin>"
        answer: "PURPOSE"
      - question: "Say in Latin: The senate put Cato in charge of the cohort"
        answer: "<latin>SENĀTUS CATŌNEM COHORTĪ</latin> <latin>PRAEFĒCIT</latin>"
  - tossup:
      question: "Using a deponent verb, translate the following sentence into Latin: That guest is wondering where the food is"
      answer: "<latin>ILLE HOSPES MĪRĀTUR UBI CIBUS / VĪCTUS SIT</latin>"
    boni:
      - question: "The master does not know where the cook has fled"
        answer: "<latin>MAGISTER NESCIT / IGNŌSCIT QUŌ</latin> <latin>COQUUS FŪGERIT</latin>"
      - question: "The wife persuaded her son to find him"
        answer: "<latin>UXOR / DOMINA FĪLIŌ</latin> <latin>PERSUĀSIT / PERSUĀDĒBAT</latin>   <latin>UT EUM / ILLUM INVENĪRET</latin> / <latin>REPERĪRET</latin>"
  - tossup:
      question: "Listen carefully to the following passage, which I will read twice, and answer IN ENGLISH the question that follows: <latin>Mūs ab agricolā</latin> <latin>dēprehēnsus tam acrī</latin> <latin>morsū</latin> <latin>digitōs eius vulnerāvit ut ille eum dīmitteret. “Nihil,” inquit mūs “tam īnfirmum est ut sē</latin> <latin>dēfendere nōn dēbeat. Nam necesse est nōn modo hominibus sed etiam omnibus animalibus sē</latin> <latin>dēfendere.”</latin>  Question: What is it necessary for both men and animals to do?"
      answer: "DEFEND THEMSELVES"
    boni:
      - question: "Why did the farmer release the mouse?"
        answer: "THE MOUSE BIT THE FARMER(’S FINGERS) If just “wounded the farmer” is given, ask for more information"
      - question: "Translate the first sentence spoken by the mouse, “<latin>Nihil tam īnfirmum est ut sē</latin> <latin>dēfendere nōn dēbeat</latin>.”"
        answer: "NOTHING IS SO WEAK / INFIRM THAT IT <emphasis>OUGHT / SHOULD</emphasis> NOT DEFEND ITSELF"
  - tossup:
      question: "The rights of fathers, the procedures of preliminary judicial hearings and trials, and rules regulating funeral rites were all part of what set of Roman law codes produced in 451 and 450 BC?"
      answer: "TWELVE TABLES / <latin>DUODECIM TABULAE</latin>"
    boni:
      - question: "What group was commissioned to codify existing Roman laws and produced the Twelve Tables as a result?"
        answer: "<latin>DECEMVIRĪ</latin> <latin>(LĒGIBUS SCRĪBUNDĪS)</latin>"
      - question: "Who was the only man to serve on both commissions of the <latin>decemvirī</latin>?"
        answer: "APPIUS CLAUDIUS"
  - tossup:
      question: "Give the Latin verb and its meaning from which we derive “precocious”?"
      answer: "<latin>COQUŌ, COQUERE</latin> - COOK"
    boni:
      - question: "What derivative from <latin>dīligō</latin>, <latin>dīligere</latin> means “a preference”?"
        answer: "PREDILECTION"
      - question: "What derivative of a Latin verb meaning “lead” is an English verb meaning “to bring under control”?"
        answer: "SUBDUE"
  - tossup:
      question: "Give the correct form of the noun <latin>arma</latin> to agree with the adjective form <latin>nostrōrum</latin>"
      answer: "ARMŌRUM"
    boni:
      - question: "Give the correct form of the noun <latin>adventus</latin> to agree with the adjective form <latin>recentis</latin>"
        answer: "ADVENTŪS"
      - question: "Give the two correct forms of the noun <latin>fuga</latin> that agree with the adjective form <latin>celerī</latin>"
        answer: "FUGAE / FUGĀ"
  - tossup:
      question: "Who became “husband and wife” while hiding in a cave near Carthage during a storm?"
      answer: "AENEAS & DIDO"
    boni:
      - question: "What had Aeneas and Dido been doing before they were forced to take shelter in a cave during a violent storm?"
        answer: "HUNTING"
      - question: "What mortal woman had encouraged Dido to yield to her passion for Aeneas?"
        answer: "(DIDO’S SISTER) ANNA"
  - tossup:
      question: "At what battle in 256 BC were the Roman consuls Regulus and Vulso able to capture fifty ships and sink thirty others with a loss of only twenty-four?"
      answer: "CAPE ECNOMUS"
    boni:
      - question: "What Carthaginian commander lost at Cape Ecnomus because of the incompetence of his two subordinate admirals?"
        answer: "HASDRUBAL"
      - question: "The victory at Cape Ecnomus gave Regulus what strategic advantage?"
        answer: "LAND IN / INVADE AFRICA WITHOUT (TOO MUCH) OPPOSITION"
  - tossup:
      question: "For the verb <latin>relinquō</latin>, give the 3rd and 4th principal parts"
      answer: "<latin>RELĪQUĪ, RELICTUS (-A, -UM)</latin>"
    boni:
      - question: "Give those same principal parts for the verb <latin>rēiciō</latin>"
        answer: "<latin>RĒIĒCĪ, RĒIECTUS (-A, -UM)</latin>"
      - question: "Spell the 3rd and 4th principal parts the verb <latin>reperiō</latin>"
        answer: "<latin>REPPERĪ, REPERTUS (-A, -UM)</latin>  (Note: the long <latin>-ī</latin> on <latin>repperī</latin> is not an essential macron and need not be mentioned)"
  - tossup:
      question: "Which of the following cities is furthest east: Segovia, Cirta, Beneventum, Carrhae?"
      answer: "CARRHAE"
    boni:
      - question: "Which of the following cities is furthest north: Memphis, Camulodunum, Cyrene, Volubilis?"
        answer: "CAMULODUNUM"
      - question: "Which of the following cities is furthest south: Alesia, Verona, Tarentum, Vindobona?"
        answer: "TARENTUM"
  - tossup:
      question: "Which was the first of Heracles' labors to take him off the Greek mainland?"
      answer: "CAPTURING THE BULL OF CRETE (Accept “Marathonian” bull, but let the player know that the bull was not yet “Marathonian” at that time)"
    boni:
      - question: "What queen of Crete had borne the bull a monstrous offspring?"
        answer: "PASIPHAË"
      - question: "After Heracles brought the bull back to Tiryns and released it, who sent Theseus nearly two decades later to capture this bull?"
        answer: "AEGEUS"
  - tossup:
      question: "From what Latin noun with what meaning do we derive the English word ēincarnation’?"
      answer: "<latin>CARŌ</latin> - FLESH, MEAT"
    boni:
      - question: "What use of the ablative case is found in the first four lines of this inscription?"
        answer: "TIME WHEN"
      - question: "Using the information given in this inscription, what Latin words do the letters P.M. stand for in line 1?"
        answer: "<latin>PONTIFEX MAXIMUS</latin>"
  - tossup:
      question: "Who, the only surviving son of Faustina and Marcus Aurelius, was named ēAugustus’ in 177 A.D.?"
      answer: "COMMODUS"
    boni:
      - question: "Which member of Commodus’ immediate family unsuccessfully plotted against him?"
        answer: "LUCILLA (HIS SISTER)"
      - question: "Who was Lucilla’s first husband?"
        answer: "LUCIUS VERUS"
  - tossup:
      question: "Translate the following sentence into English: <latin>Augur dīcit avēs mox reventūrās esse</latin>"
      answer: "THE AUGUR / PROPHET / SEER SAYS THAT THE BIRDS WILL RETURN SOON"
    boni:
      - question: "<latin>Haruspex crēdidit exercitum magnā</latin> <latin>tempestāte periisse.</latin>"
        answer: "THE HARUSPEX / PROPHET / SEER BELIEVED THAT THE ARMY HAD PERISHED IN A GREAT STORM"
      - question: "<latin>Ancilla numquam cōnfitēbitur dominum suum interfectum esse</latin>"
        answer: "THE SLAVE(GIRL) WILL NEVER ADMIT / CONFESS THAT HER MASTER HAS BEEN KILLED"
  - tossup:
      question: "Identify the mood of the verb in Idaho’s state motto, “<latin>Estō</latin> <latin>Perpetua”</latin>"
      answer: "(FUTURE / 3rd PERSON) IMPERATIVE"
    boni:
      - question: "What use of the Ablative case is found in South Carolina’s state motto, “<latin>Animīs Opibusque Parātī</latin>”?"
        answer: "RESPECT / SPECIFICATION"
      - question: "Identify the respective tenses of both verbs in Connecticut’s state motto, “<latin>Quī</latin> <latin>Trānstulit Sustinet</latin>”"
        answer: "PERFECT & PRESENT"
  - tossup:
      question: "Which of the following was NOT one of the women encountered by Odysseus at the edge of the Underworld: Alcmene, Leda, Phaedra, Iphimedeia, Eurycleia?"
      answer: "EURYCLEIA"
    boni:
      - question: "What two animals did Odysseus have to sacrifice before he could talk to the soul of the seer Tiresias?"
        answer: "(YOUNG) RAM & (A BLACK) EWE"
      - question: "Whose shade warns Odysseus to be careful when he returns home?"
        answer: "AGAMEMNON"
  - tossup:
      question: "What type of toga was worn by Romans of the lower class to demonstrate publicly their sympathy for a fallen leader?"
      answer: "<latin>TOGA PULLA</latin>"
    boni:
      - question: "What type of toga did curule magistrates wear for the same occasion?"
        answer: "<latin>TOGA PŪRA / VIRĪLIS / LĪBERA</latin>"
      - question: "Give the Latin phrase for this common form of public demonstration of sympathy for a fallen leader"
        answer: "<latin>VESTIS MŪTĀTIŌ</latin>"
  - tossup:
      question: "Which of the following does NOT belong because of meaning: <latin>caterva, grex, turba, multitūdō, questus?</latin>"
      answer: "QUESTUS"
    boni:
      - question: "<latin>negō</latin>, <latin>recūsō</latin>, <latin>moror</latin>, <latin>īnfitior</latin>, <latin>abnuō</latin>?"
        answer: "<latin>MOROR</latin>"
      - question: "<latin>fors</latin>, <latin>opus</latin>, <latin>pēnsum</latin>, <latin>labor</latin>, <latin>negōtium</latin>?"
        answer: "<latin>FORS</latin>"
  - tossup:
      question: "Why was the Theban king Pentheus punished by Bacchus?"
      answer: "BECAUSE HE REFUSED TO RECOGNIZE THE DIVINITY OF BACCHUS"
    boni:
      - question: "What group of people killed Pentheus, and how?"
        answer: "HE WAS TORN APART BY THE MAENADS / BACCHAE / BACCHANTES"
      - question: "What did Agave, who had been among the Maenads, bring back to Thebes as her trophy?"
        answer: "THE HEAD OF PENTHEUS, (BELIEVING THAT IT WAS THE HEAD OF A MOUNTAIN LION SHE HAD KILLED WITH HER BARE HANDS)   <latin>2007 NJCL CERTAMEN</latin>  <latin>INTERMEDIATE DIVISION</latin>"
