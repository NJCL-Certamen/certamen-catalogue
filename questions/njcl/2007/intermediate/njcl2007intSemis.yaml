      - question: "Using a standard idiom, say in Latin: They were coming to inform the emperor"
        answer: "<latin>VĒNIĒBANT UT / QUĪ</latin> <latin>IMPERĀTŌREM CERTIŌREM FACERENT</latin>"
  - tossup:
      question: "Imagine that you are an ancient Roman examining reliefs depicting the imperial family in a sacrificial procession. What structure, built during the reign of Augustus on the Campus Martius, would you be admiring?"
      answer: "ARA PACIS / ALTAR OF PEACE"
    boni:
