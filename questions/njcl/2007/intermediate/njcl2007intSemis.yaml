tournament: "NJCL Certamen"
year: 2007
division: "Intermediate"
round: "Semifinals"
questions:
  - tossup:
      question: "In Book VII of Homer’s <title>Iliad</title>, what Greek warrior was chosen by lot to answer Hector’s challenge to a duel?"
      answer: "AJAX/AIAS TELAMON or AJAX / AIAS THE GREATER or TELAMONIAN AJAX /AIAS or SALAMONIAN AJAX / AIAS"
    boni:
      - question: "What was the end result of the duel, which lasted until dark?"
        answer: "IT WAS A TIE / STALEMATE"
      - question: "As Hector and Ajax departed from the battlefield, they exchanged gifts. Name one of the gifts that was exchanged"
        answer: "HECTOR GAVE AJAX HIS (SILVER-STUDDED) SWORD / AJAX GAVE HECTOR HIS (FINELY-EMBROIDERED) BELT"
  - tossup:
      question: "Give a synonym of the noun <latin>mors</latin>"
      answer: "<latin>LĒTUM</latin>, <latin>CASUS</latin>, <latin>INTERITUS</latin>, <latin>NEX</latin>, <latin>OBITUS</latin>, <latin>EXITIUM</latin>, <latin>CAEDĒS</latin>, <latin>TRUCĪDĀTIŌ</latin>, <latin>EXITUS</latin>, <latin>PERNICIĒS</latin>, <latin>TENEBRAE, NOX</latin>"
    boni:
      - question: "Give a synonym of the noun <latin>āmentia.</latin>"
        answer: "<latin>DĒMENTIA, ĪNSĀNIA</latin>, <latin>FUROR, RABIĒS</latin>"
      - question: "Which of the following CANNOT be a synonym of <latin>umbra</latin>? <latin>imāgō</latin>, <latin>fūnus</latin>, <latin>persōna</latin>, <latin>tenebrae</latin>, <latin>larva</latin>"
        answer: "<latin>FŪNUS</latin>"
  - tossup:
      question: "Using an Ablative Absolute, say in Latin, “When Orbilius was the teacher.”"
      answer: "<latin>ORBILIŌ</latin> <latin>MAGISTRŌ</latin> / <latin>LITTERĀTŌRE</latin> / <latin>GRAMMĀTICŌ</latin> <latin>/ RHĒTORE</latin>"
    boni:
      - question: "Use <latin>ubi</latin> to say in Latin, “When Orbilius had forgotten the children.”"
        answer: "<latin>UBI ORBILIUS LĪBERŌS</latin> / <latin>LĪBERŌRUM OBLĪTUS ERAT</latin>  or <latin>PUERŌS</latin> / <latin>PUERŌRUM</latin>"
      - question: "Using the verb <latin>oblīvīscor</latin> and an Ablative Absolute, say in Latin, “When the children had been forgotten.”"
        answer: "CANNOT BE DONE"
  - tossup:
      question: "What emperor, an ardent Christian, immediately reversed the religious policies of Julian the Apostate after he assumed the throne?"
      answer: "JOVIAN"
    boni:
      - question: "Jovian, after he became emperor, was obliged to conclude an unpopular peace that resulted in the surrender of territorial gains made by which earlier emperor?"
        answer: "DIOCLETIAN"
      - question: "Jovian died at Dadastana while on his way to what city in February of 364 A.D.?"
        answer: "CONSTANTINOPLE"
  - tossup:
      question: "Of the words <latin>caliga</latin>, <latin>scūtum</latin>, <latin>ālea</latin>, <latin>petasus</latin>, and <latin>aedēs</latin>, which is described in the following Latin sentence: <latin>Est īnstrūmentum quō</latin> <latin>mīles Rōmānus sē</latin> <latin>dēfendit</latin>"
      answer: "<latin>SCŪTUM</latin>"
    boni:
      - question: "<latin>Id est quod imperātor nōtissimus iēcisse dīcitur</latin>"
        answer: "ĀLEA"
      - question: "<latin>Respondē</latin> <latin>Anglicē: Quot hōrum vocābulōrum omnium ab ūnō</latin> <latin>iuvene iactārī</latin> <latin>nōn possunt?</latin>"
        answer: "ONE"
  - tossup:
      question: "Who was voted a thanksgiving festival and given the title <latin>pater patriae</latin> because he had delivered Rome from danger in 63 BC?"
      answer: "(MARCUS TULLIUS) CICERO"
    boni:
      - question: "Near what town had Catiline encamped forces in preparation for a rebellion against Rome that never took place because the plan had been exposed by Cicero?"
        answer: "FAESULAE / FIESOLE / FLORENTIA / FIRENZE / FLORENCE"
      - question: "Cicero was able to expose members of Catiline’s plot to overthrow the Roman government by presenting evidence gathered from members of what Gallic tribe?"
        answer: "ALLOBROGES"
  - tossup:
      question: "Translate the motto of the University of Tennessee: <latin>Vēritātem cognōscētis et vēritās tē</latin> <latin>līberābit</latin>"
      answer: "YOU WILL LEARN / UNDERSTAND / RECOGNIZE THE TRUTH AND THE TRUTH WILL FREE YOU"
    boni:
      - question: "Translate the motto of the University of Vermont: <latin>Studiīs et rēbus honestīs?</latin>"
        answer: "TO / WITH / BY HONORABLE PURSUITS AND DEEDS"
      - question: "Translate the motto of Columbia University: <latin>In lūmine tuō</latin> <latin>vidēbimus lūmen?</latin>"
        answer: "IN YOUR/THY LIGHT WE SHALL SEE LIGHT"
  - tossup:
      question: "What old herdsman was punished by Mercury because he was greedy and tattled on the young god?"
      answer: "BATTUS"
    boni:
      - question: "What event did Battus witness?"
        answer: "MERCURY STEALING APOLLO’S CATTLE"
      - question: "Into what was Battus transformed as punishment?"
        answer: "(TOUCH)STONE"
  - tossup:
      question: "Alcaeus, Electryon, and Gorgophone were all children of what great hero?"
      answer: "PERSEUS"
    boni:
      - question: "Who was the oldest son of Perseus and Andromeda?"
        answer: "PERSES"
      - question: "Whom did Perses succeed as the king of Ethiopia?"
        answer: "CEPHEUS"
  - tossup:
      question: "Listen carefully to the following passage about Caesar, which I will read twice, and answer IN LATIN the question that follows: <latin>Tandem bellum cīvīle vītāre quam maximē</latin> <latin>cōnātus, Caesar ē</latin> <latin>Galliā</latin> <latin>in Italiam profectus est. Cum ad parvum flūmen Rubicōnem vēnisset, duās hōrās ibi morātus est: nam nōn licuit imperātōrī</latin> <latin>Rōmānō</latin> <latin>cum legiōnibus hoc flūmen trānsīre. Caesar clāmāvit, “Ālea iacta est,” flūmenque cum cōpiīs trānsiit.</latin>  Question: <latin>Quamdiū</latin> <latin>iuxtā</latin> <latin>Rubicōnem exercitus Caesaris morābātur?</latin>"
      answer: "<latin>DUĀS HŌRĀS</latin>"
    boni:
      - question: "<latin>Sententiā</latin> <latin>Caesaris, quid vītandum erat?</latin>"
        answer: "<latin>BELLUM CĪVĪLE / FLŪMEN TRĀNSĪRE</latin>"
      - question: "Use the same vocabulary that is found at the end of this passage to say in Latin: Caesar shouted that the die had been cast"
        answer: "<latin>CAESAR CLĀMĀVIT ĀLEAM IACTAM ESSE</latin>"
  - tossup:
      question: "You may now open your visuals.  Please examine these items from Roman daily life.  Identify the letter and give the Latin name for the item that a Roman would associate with a <latin>lacerna</latin>"
      answer: "“<latin>E</latin>” , <latin>FIBULA</latin>"
    boni:
      - question: "Identify the letter and give the Latin name for the item that a Roman associated with <latin>ōleum et pūmicēs</latin>?"
        answer: "“<latin>B</latin>”, <latin>STRIGILIS</latin>"
      - question: "Give the Latin term for the public facility in which item “A” would have been used"
        answer: "<latin>LATRĪNA</latin>"
  - tossup:
      question: "Differentiate in meaning between <latin>humus</latin> and <latin>fūmus</latin>"
      answer: "<latin>HUMUS</latin> - GROUND / <latin>FŪMUS</latin> - SMOKE"
    boni:
      - question: "Differentiate in meaning between the noun <latin>mentum</latin> and the verb <latin>mentior</latin>"
        answer: "<latin>MENTUM</latin> - CHIN / <latin>MENTIOR</latin> - TO LIE"
      - question: "Differentiate in meaning between <latin>usquam</latin> and <latin>umquam</latin>"
        answer: "<latin>USQUAM</latin> - ANYWHERE / IN ANY WAY / AT ALL <latin>UMQUAM</latin> - EVER, AT ANY TIME"
  - tossup:
      question: "Translate the following sentence into English: <latin>Cum Mārcus tandem opus perfēcisset, omnēs plausērunt</latin>"
      answer: "WHEN MARCUS HAD FINALLY FINISHED HIS WORK, EVERYBODY CLAPPED"
    boni:
      - question: "<latin>Cum Marcus nōn laetus esset, vehementer tamen rīdēbat.</latin>"
        answer: "ALTHOUGH MARCUS WAS NOT HAPPY, HE (NEVERTHELESS) LAUGHED LOUDLY"
      - question: "<latin>Cum Marcus nōn gaudēbat, nōn rīdēbat.</latin>"
        answer: "BECAUSE / SINCE /WHEN MARCUS WAS NOT HAPPY / REJOICING, HE WAS NOT LAUGHING / HE DID NOT LAUGH"
  - tossup:
      question: "Name the king of Rome who is often said to have introduced Etruscan customs, cults, and craftsmanship to Rome"
      answer: "TARQUINIUS PRISCUS / FIRST"
    boni:
      - question: "Who was the wife of Tarquinius Priscus?"
        answer: "TANAQUIL / GAIA CAECILIA"
      - question: "Tarquinius Priscus was murdered at the instigation of whose sons?"
        answer: "ANCUS MARC/TIUS"
  - tossup:
      question: "Give the Latin adjective and its meaning from which “mollusk” is derived?"
      answer: "<latin>MOLLIS</latin> = SOFT, TENDER, MILD, PLEASANT"
    boni:
      - question: "Give the Latin noun and its meaning from which “morose” is derived?"
        answer: "<latin>MŌS</latin> = CUSTOM, USAGE, WILL, INCLINATION"
      - question: "Give the Latin noun and its meaning from which “molasses” is derived?"
        answer: "<latin>MEL</latin> = HONEY, SWEETNESS, PLEASANTNESS"
  - tossup:
      question: "Who shunned the society of men and devoted herself to hunting because the oracle at Delphi had warned her against marriage?"
      answer: "ATALANTA"
    boni:
      - question: "What goddess once rescued Atalanta from thirst by striking the earth with the point of her spear and thus caused a stream of water to gush forth?"
        answer: "ARTEMIS / DIANA"
      - question: "Who finally married Atalanta?"
        answer: "HIPPOMENES / MELANION"
  - tossup:
      question: "With rare exception, what two tenses of the subjunctive can be used in a result clause?"
      answer: "PRESENT & IMPERFECT"
    boni:
      - question: "If the main verb of the sentence is in the future tense, what tense of the subjunctive do you need in a purpose clause?"
        answer: "PRESENT"
      - question: "Of <latin>an</latin>, <latin>sī</latin>, <latin>utrum</latin>, or <latin>num</latin>, which could not normally be used to introduce an Indirect Question?"
        answer: "<latin>SĪ</latin>"
  - tossup:
      question: "What emperor sent Julius Agricola to the province of Britannia to serve as governor?"
      answer: "VESPASIAN"
    boni:
      - question: "Name another man of great renown whom Vespasian had sent to Britannia to serve as governor"
        answer: "(PETILIUS) CEREALIS / (IULIUS) FRONTINUS"
      - question: "What emperor recalled Agricola from Britannia?"
        answer: "DOMITIAN"
  - tossup:
      question: "Which of the following, if any, does NOT belong with the others because of case: <latin>turris, nōminis, ignis, corpus, caput?</latin>"
      answer: "NŌMINIS"
    boni:
      - question: "<latin>leō, poēta, Mārce, mīlitī, amīcī?</latin>"
        answer: "MĪLITĪ"
      - question: "<latin>manuum, rēgum, agrōrum, ōtiī, aprum?</latin>"
        answer: "APRUM"
  - tossup:
      question: "Who escaped the vengeance of her husband by fleeing in a chariot drawn by winged dragons?"
      answer: "MEDEA"
    boni:
      - question: "Who had provided the chariot?"
        answer: "(HER GRANDFATHER) HELIUS / HELIOS"
      - question: "To what king of Athens did she flee for refuge?"
        answer: "AEGEUS   <latin>2007 NJCL CERTAMEN</latin>  <latin>INTERMEDIATE DIVISION</latin>  <latin>FINALS</latin>"
  - tossup:
      question: "What Latin phrase is often found where in English we would say “in memory of”?"
      answer: "<latin>IN MEMORIAM</latin>"
    boni:
      - question: "What Latin phrase meaning “into the middle of things” is used in English with reference to entering into the middle of events in literary narratives?"
        answer: "<latin>IN MEDIĀS RĒS</latin>"
      - question: "What Latin phrase is used in English to mean “in its natural or proper place”?"
        answer: "<latin>IN LOCŌ</latin> or <latin>IN SITŪ</latin>"
  - tossup:
      question: "What two uses of the Accusative are found in the following sentence: <latin>mihi scrīpsit tē</latin> <latin>domum redīre?</latin>"
      answer: "SUBJECT OF AN INDIRECT STATEMENT& PLACE TO WHICH"
    boni:
      - question: "<latin>Mē</latin> <latin>sententiam rogāvit?</latin>"
        answer: "DOUBLE ACCUSATIVE"
      - question: "<latin>Vītam vivere volēbat?</latin>"
        answer: "COGNATE"
  - tossup:
      question: "What goddess gave Erichthonius two vials, each containing a drop of Medusa’s blood, one to bring death and the other to cure?"
      answer: "ATHENA / MINERVA"
    boni:
      - question: "To whom did <latin>Athena / Minerva</latin> also give some of Medusa’s blood, which he used for healing and restoring life?"
        answer: "ASCLEPIUS / AESCULAPIUS"
      - question: "What part of Medusa did <latin>Athena / Minerva</latin> give to Cepheus of Tegea so that he could protect his city?"
