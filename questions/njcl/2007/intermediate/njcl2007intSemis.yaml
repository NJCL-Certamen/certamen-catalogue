    boni:
      - question: "Who is character “A”?"
        answer: "INO / LEUCOTHEA"
      - question: "Arrange the illustrations in order from earliest to latest"
        answer: "PICTURE 4, PICTURE 3, PICTURE 1, PICTURE 2"
  - tossup:
      question: "Using a gerundive in the Genitive case, say in Latin: He came to salute the emperor"
