      - question: "What “token” burial was performed for Polyneices?"
        answer: "(ANTIGONE) SPRINKLED HIS BODY WITH (THREE HANDFULS OF) EARTH/DIRT"
  - tossup:
      question: "When you are recognized by the spotter, perform the following command: <latin>Imperā</latin> <latin>sociīs tuīs nē</latin> <latin>umquam dēspērent.</latin>"
      answer: "STUDENT SHOULD ORDER HIS/HER TEAMMATES NOT TO EVER DESPAIR"
    boni:
      - question: "<latin>Salientēs, prōclāmāte mihi Anglicē</latin> <latin>cūr certāmen amētis.</latin>"
        answer: "WHILE JUMPING, STUDENTS SHOULD SHOUT OUT WHY THEY LIKE CERTAMEN"
      - question: "Using a passive periphrastic, tell the audience, “We have to go now.”"
