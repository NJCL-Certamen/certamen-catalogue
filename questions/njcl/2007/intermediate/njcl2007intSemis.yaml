        answer: "<latin>URBEM AGGREDIANTUR</latin>"
      - question: "The form <latin>aggredere</latin> can have two different meanings. Translate <latin>aggredere</latin> in both of those ways"
        answer: "ATTACK! (sing. pres. imperative) and YOU ARE ATTACKING (2nd sing. pres.indicative)"
  - tossup:
      question: "What war was brought to an end when the Roman generals Papirius Cursor and Curius Dentatus invaded enemy territories <latin>circa</latin> 290 BC?"
