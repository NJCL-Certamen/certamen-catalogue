  - tossup:
      question: "Based on its root, what must an “amanuensis” use for his job?"
      answer: "HIS HAND (One who is employed to take dictation or to copy manuscript.) [Latin <latin>āmanuēnsis</latin>, from the phrase (<latin>servus</latin>) <latin>ā</latin> <latin>manū</latin>, (slave) at handwriting]"
    boni:
      - question: "Using the same root, give the English derivative which means a skillful move"
        answer: "MANEUVER"
      - question: "Using the same root again, give two English derivatives which mean to free or liberate"
        answer: "EMANCIPATE & MANUMIT"
  - tossup:
      question: "What rare <latin>praenōmen</latin> was only used by members of the <latin>gēns Aemilia</latin>?"
      answer: "<latin>MAMERCUS</latin>"
    boni:
      - question: "The <latin>praenōmen Vopiscus</latin> was used only by members of which <latin>gēns?</latin>"
        answer: "GĒNS IŪLIA / IŪLIĪ / JULIAN"
      - question: "What <latin>gēns</latin> refused to use the <latin>praenōmen Marcus</latin> near the end of the 1st century BC?"
        answer: "<latin>GĒNS ANTŌNIA / ANTŌNIĪ</latin> <latin>/</latin> ANTONIAN"
  - tossup:
      question: "Who grew to manhood in the court of his grandfather Pittheus?"
      answer: "THESEUS"
    boni:
      - question: "What daughter of Pittheus was the mother of Theseus?"
        answer: "AETHRA"
      - question: "Where did Theseus go to offer the first clippings of his hair to Apollo?"
        answer: "DELPHI"
  - tossup:
      question: "What is the usual plural form of the noun <latin>balneum</latin>?"
      answer: "<latin>BALNEAE</latin>"
    boni:
      - question: "<latin>Balneum</latin> changes both its declension and its gender in moving to the plural. What are the two respective terms for these types of changes which some nouns undergo?"
        answer: "HETEROCLITE / HETEROCLITICAL & HETEROGENE(OUS)"
      - question: "Translate the phrase “<latin>trīna castra</latin>” into English"
        answer: "THREE CAMPS"
  - tossup:
      question: "What English noun meaning “an award or honor” was originally recorded in English in 1623 with reference to the ceremonial bestowal of knighthood and derives from the Latin prefix “ad” and a 2nd declension noun meaning “neck”?"
      answer: "ACCOLADE"
    boni:
      - question: "Which of the following English adjectives meaning “laudatory” is NOT derived from Latin: eulogistic, acclamatory, commendatory, approbative, adulatory?"
        answer: "EULOGISTIC"
      - question: "What English verb from the Latin noun meaning “price” means “to express approval or admiration”?"
        answer: "PRAISE"
  - tossup:
      question: "Who forced his men to march under the burning desert sun while on their way to meet the forces of Jugurtha in 109 BC?"
