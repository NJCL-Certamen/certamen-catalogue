    boni:
      - question: ": <latin>iānua, līmes, ostium, valvae, foris?</latin>"
        answer: "LĪMES"
      - question: ": <latin>attonitus, dīrus, horribilis, saevus, torvus?</latin>"
        answer: "ATTONITUS"
  - tossup:
      question: "According to Vergil, who was the first husband of Dido?"
