    boni:
      - question: "Name one of the Roman generals who had been unsuccessful against the forces of Jugurtha"
        answer: "(L. CALPURNIUS) BESTIA / POSTUMIUS <emphasis>ALBINUS</emphasis>"
      - question: "What noble presided over the court that found Bestia and Albinus guilty of being bribed by Jugurtha?"
        answer: "(M.) AEMILIUS SCAURUS"
  - tossup:
      question: "Harry Potter mania, like Harry himself, refuses to die. Listen carefully to the following passage taken from <title><latin>Harrius Potter Et Camera Sēcrētōrum</latin></title> and answer IN LATIN the question that follows: <latin>“Aliquid in mūrō</latin> <latin>adversō</latin> <latin>fulgēbat. Appropinquāvērunt, lentē, oculīs līmīs per tenebrās spectantēs. Verba ūnum pedem alta in mūrō, quī</latin> <latin>erat inter duās fenestrās, picta erant litterīs rudibus sub līmine facum flammantium micantibus: CAMERA SĒCRĒTŌRUM APERTA EST</latin>"
      answer: "HOSTĒS HERĒDIS, CAVĒTE!”  Question: <latin>Quam alta erant verba picta? ŪNUM PEDEM</latin>"
    boni:
      - question: "<latin>Quibus cavendum est?</latin>"
        answer: "HOSTIBUS (HERĒDIS)"
      - question: "<latin>Quae rēs suprā</latin> <latin>haec verba in mūrō</latin> <latin>fixae sunt?</latin>"
        answer: "FACĒS (FLAMMANTĒS)"
  - tossup:
      question: "Give all three participial forms of <latin>aggredior</latin>"
