tournament: "NJCL Certamen"
year: 2007
division: "Novice"
round: "Round 3"
questions:
  - tossup:
      question: "Who turned Polydectes and Phineus to stone with the head of Medusa?"
      answer: "PERSEUS"
    boni:
      - question: "Of what small island was Polydectes king?"
        answer: "SERIPHOS"
      - question: "Why was Polydectes attacking Perseus?"
        answer: "HE WANTED TO MARRY DANAË"
  - tossup:
      question: "When you are recognized by the spotter, perform the following commands: <latin>Surge et ambulā circum mēnsam.</latin>"
      answer: "THE STUDENT SHOULD RISE & WALK AROUND A TABLE/DESK"
    boni:
      - question: "<latin>Iungite manūs et clāmāte Anglicē “nōs sumus optim</latin><latin>ī”.</latin>"
        answer: "STUDENTS JOIN HANDS AND SHOUT “WE ARE THE BEST / VERY GOOD”"
      - question: "<latin>Plaudēns, magnā voce dīc mihi nōmen tuum!</latin>"
        answer: "WHILE CLAPPING, ONE STUDENT SHOULD YELL OUT HIS NAME"
  - tossup:
      question: "What derivative of <latin>stō, stāre</latin> means ‘an impediment or challenge’?"
      answer: "OBSTACLE"
    boni:
      - question: "What derivative of <latin>ligō, ligāre</latin> means “to bind by a favor or service”?"
        answer: "OBLIGE / OBLIGATE"
      - question: "What is the meaning of the Latin ordinal number from which we derive ‘octave’?"
        answer: "EIGHTH"
  - tossup:
      question: "After the siege of what Sicilian town in 262 BC did the Romans decide to turn their attention toward building a navy?"
      answer: "AGRIGENTUM / AGRIGENTO"
    boni:
      - question: "Where did Rome win her first naval victory?"
        answer: "MYLAE"
      - question: "Which Roman commander won the battle of Mylae?"
        answer: "(GAIUS) DUILIUS"
  - tossup:
      question: "Translate the following sentence into English: <latin>Quam altae sunt fīliae illīus cōnsulis</latin>!"
      answer: "HOW TALL ARE THE DAUGHTERS OF THAT CONSUL!"
    boni:
      - question: "<latin>Fīlia cōnsulis est multō stultior quam mercātōris.</latin>"
        answer: "THE CONSUL’S DAUGHTER IS MUCH MORE STUPID / FOOLISH THAN THE MERCHANT’S"
      - question: "<latin>Sed fīlia cōnsulis est tam pulchra quam dea.</latin>"
        answer: "BUT THE CONSUL’S DAUGHTER IS AS PRETTY AS A GODDESS"
  - tossup:
      question: "Which ironically-named emperor, although never recognized by the Eastern Empire, is traditionally considered the last western Roman emperor?"
      answer: "ROMULUS AUGUSTULUS"
    boni:
      - question: "Romulus Augustulus never exercised any real power. Who was the puppet master who pulled Romulus’ strings?"
        answer: "ORESTES"
      - question: "How were Romulus Augustulus and Orestes related by birth?"
        answer: "ROMULUS AUGUSTULUS WAS THE SON OF ORESTES"
  - tossup:
      question: "Give an antonym of <latin>aperiō</latin>"
      answer: "CLAUDŌ, OPERIŌ, <latin>INCLŪDŌ, CĒLŌ</latin>"
    boni:
      - question: "Which of the following is an EXACT opposite of the phrase <latin>prīmā lūce</latin>? <latin>Māne, merīdiē, mediā nocte, sōlis occāsū, diē cōnstitūtā</latin>"
        answer: "<latin>SŌLIS OCCĀSŪ</latin>"
      - question: "Give an antonym of <latin>iuvō.</latin>"
        answer: "<latin>IMPEDIŌ, OBSTŌ, NOCEŌ, DISPLICEŌ, OPPUGNŌ, LAEDŌ</latin>"
  - tossup:
      question: "What term for a Roman military unit literally means “a handful”?"
      answer: "MANIPLE / <latin>MANIPULUS</latin>"
    boni:
      - question: "In the Roman army, the maniple eventually came to be a division of a legion, but until the third century BC the Romans used it as part of what battle formation borrowed from the Greeks?"
        answer: "PHALANX"
      - question: "What sort of weapon did soldiers called <latin>hastātī</latin> use?"
        answer: "SPEARMEN / (FRONT LINE SOLDIERS) WITH SPEARS"
  - tossup:
      question: "Which lover of Zeus failed to live up to the standards of Niobe since she had twelve fewer children than Niobe had?"
      answer: "LETO"
    boni:
      - question: "Which child of Leto is depicted in this visual and on what island was she born?"
        answer: "ARTEMIS & DELOS or ORTYGIA"
      - question: "Other than the animals and anything relating to hunting shown here, what other clue tells you that this is Artemis?"
        answer: "MOON (IN THE SKY OR ON HER HEAD) / SHORT TUNIC"
  - tossup:
      question: "Give the meaning of the abbreviation <latin>D.V.</latin>, which stands for ‘<latin>deō volente</latin>’"
      answer: "GOD WILLING"
    boni:
      - question: "Give the meaning of the abbreviation <latin>D.G.</latin>, which stands for ‘<latin>deī grātiā</latin>’"
        answer: "BY THE GRACE OF GOD"
      - question: "Give the meaning of the abbreviation <latin>LL.D</latin>, which stands for ‘<latin>lēgum doctor</latin>’"
        answer: "DOCTOR OF LAW(S)"
  - tossup:
      question: "At what battle did the Romans, supposedly with the help of Castor and Pollux, defeat the Latins circa 496 BC?"
      answer: "LAKE REGILLUS"
    boni:
      - question: "At what battle circa 506 B.C. did the Latins defeat Arruns, the son of Porsena, and gain freedom from the Etruscans?"
        answer: "ARICIA"
      - question: "What ruler of Cumae aided the Latins at this battle?"
        answer: "ARISTODEMUS"
  - tossup:
      question: "Which of the Seven Against Thebes was the only one to survive?"
      answer: "ADRASTUS"
    boni:
      - question: "Of what woman in mythology was Parthenopaeus, one of the Seven Against Thebes, the son?"
        answer: "ATALANTA"
      - question: "Which of the Seven Against Thebes was struck down by Zeus for his hubris of proclaiming that not even Zeus could stop him from invading the city?"
        answer: "CAPANEUS"
  - tossup:
      question: "For the verb <latin>audeō, audēre</latin>, give the 3rd person plural, future, indicative form"
      answer: "<latin>AUDĒBUNT</latin>"
    boni:
      - question: "Give the corresponding form for the verb <latin>audiō, audīre</latin>"
        answer: "<latin>AUDIENT</latin>"
      - question: "Translate: <latin>Audē audīre</latin>!”"
        answer: "DARE TO HEAR / LISTEN"
  - tossup:
      question: "Translate the following sentence into Latin using <latin>iubeō</latin>: He ordered the slaves to prepare dinner"
      answer: "<latin>IUSSIT SERVŌS CĒNAM PARĀRE</latin>"
    boni:
      - question: "Again, using <latin>iubeō</latin>, translate this sentence: The slaves have been ordered by their master to leave quickly"
        answer: "<latin>SERVĪ IUSSĪ SUNT Ā DOMINŌ CELERITER EXĪRE / DISCĒDERE</latin> (not <latin>relinquere</latin> or <latin>dēserere</latin>)"
      - question: "Again, using <latin>iubeō</latin>, translate this sentence: We will order the slaves to be quiet"
        answer: "<latin>IUBĒBIMUS SERVŌS TACĒRE / SILĒRE / TACITŌS / SILENTĒS ESSE</latin>"
  - tossup:
      question: "Who entered a goddess’ garden disguised as an old woman and cleverly convinced her to love him?"
      answer: "VERTUMNUS"
    boni:
      - question: "Who was this goddess?"
        answer: "POMONA"
      - question: "What Roman author of mythology is the only one who tells this story which actually originated with the Etruscans?"
        answer: "(PUBLIUS) OVID(IUS NASO)"
  - tossup:
      question: "In what ways must a relative pronoun agree with its antecedent?"
      answer: "IN GENDER & NUMBER"
    boni:
      - question: "A noun used in apposition to describe another noun must agree with it in what manner?"
        answer: "IN CASE ONLY"
      - question: "In what ways does a participle agree with the noun it modifies?"
        answer: "GENDER, NUMBER, CASE"
  - tossup:
      question: "Who ordered the execution of Tiberius Gemellus and the Praetorian Prefect Macro and in 38 A.D.?"
      answer: "CALIGULA"
    boni:
      - question: "Name the commander of the Upper Rhine army who led a conspiracy to murder Caligula"
        answer: "(GNAEUS CORNELIUS LENTULUS) GAETULICUS"
      - question: "Who assassinated Caligula along with his wife and daughter?"
        answer: "CASSIUS CHAEREA (A TRIBUNE OF THE PRAETORIAN GUARD)"
  - tossup:
      question: "Who was the first Greek off the boats at Troy?"
      answer: "PROTESILAÜS"
    boni:
      - question: "Who killed Protesilaüs?"
        answer: "HECTOR"
      - question: "Who was Protesilaüs’ wife, who asked for an hour with her husband after he died?"
        answer: "LAODAMEIA"
  - tossup:
      question: "Complete this analogy: <latin>servus : servum :: poēta : _____</latin>"
      answer: "POĒTAM"
    boni:
      - question: "<latin>servus : servum :: tempus : _____</latin>"
        answer: "TEMPUS"
      - question: "<latin>servus : servum :: castra : _____</latin>"
        answer: "CASTRA"
  - tossup:
      question: "Listen carefully to the following passage about Roman history, which I will read twice, and answer IN LATIN the question that follows: <latin>Rōmulus, quī erat prīmus rēx Rōmānōrum, manū suā frātrem interfēcit. Nam ubi mūrōs novae urbis aedificābat, Remus eōs mūrōs trānsiluit et rīsit. Post hoc, Remus ā Rōmulō interfectus est: “Quī”, inquit, “mūrōs meōs trānsilierit, mortuus erit.”</latin>  Question: <latin>Quōrum erat Rōmulus prīmus rēx?</latin>"
      answer: "RŌMĀNŌRUM"
    boni:
      - question: "<latin>Cūr Rōmulus Remum interfēcit?</latin>"
        answer: "<latin>(RŌMULUS EŌS) MŪRŌS (NOVAE URBIS) TRĀNSILUIT/ TRĀNSILUERAT</latin>"
      - question: "<latin>Quālēs erunt eī quī mūrōs trānsiluerint?</latin>"
        answer: "MORTUĪ (not <latin>MORTUUS</latin>) <latin>2007 NJCL CERTAMEN</latin>  <latin>NOVICE DIVISION</latin>"
