tournament: "NJCL Certamen"
year: 2007
division: "Advanced"
round: "Round 2"
questions:
  - tossup:
      question: "What herb helped Odysseus avoid the fate of his men on the isle of Aeaea?"
      answer: "MOLY"
    boni:
      - question: "What god provided Odysseus this herb and warned him of the isle’s inhabitant?"
        answer: "HERMES"
      - question: "Though Circe caused them problems, only one of Odysseus’ men actually died on Circe’s island, from falling off of her roof. Who was he?"
        answer: "ELPENOR"
  - tossup:
      question: "Which of the following clauses would you not normally find followed by a clause with the verb in the subjunctive mood? <latin>Dignus erat quī, senex latrōnibus imperāvit, tantum abest, numquam crēdidī, nesciēbat cūr</latin>"
      answer: "NUMQUAM CRĒDIDĪ"
    boni:
      - question: "Using one of the remaining clauses and an impersonal verb, say in Latin, “The priest didn’t know why it was hailing.”"
        answer: "<latin>PONTIFEX NESCIĒBAT / NESCĪ(V)IT CŪR GRANDINĀRET</latin>"
      - question: "Using one of the remaining clauses and a neutral-passive verb, say in Latin, “The horse was worthy of being made consul.”"
        answer: "<latin>EQUUS / CABALLUS DIGNUS ERAT QUĪ CŌNSUL FIERET</latin>"
  - tossup:
      question: "Who induced Livilla to poison her husband Drusus the Younger?"
      answer: "(LUCIUS AELIUS) SEJANUS"
    boni:
      - question: "Who was the father of Drusus?"
        answer: "TIBERIUS (CLAUDIUS NERO CAESAR)"
      - question: "Whom did Tiberius send to Rome to denounce Sejanus and execute him?"
        answer: "MACRO"
  - tossup:
      question: "Which of the following IS a multiplicative numeral? <latin>Centuplex, octōnī, sexāgēnsimus, septendecim, dīmidia</latin>"
      answer: "CENTUPLEX"
    boni:
      - question: "<latin>Quot sunt sescentī et ducentī?</latin>"
        answer: "OCTINGENTĪ"
      - question: "<latin>Audī dīligenter et respondē Anglicē: Titus Pullō et Lūcius Vorēnus sunt</latin>  <latin>gallīnāriī maximā industriā. Nam quinque hortōs prope Rōmam tenent. Quisque hortus trīgintā gallīnās habet quae trīna ōva cōtīdiē pariunt. Pullōnī Vorēnōque, quot ōva quōque diē sunt?</latin>"
        answer: "FOUR HUNDRED AND FIFTY"
  - tossup:
      question: "Name the figure of speech, besides alliteration, assonance, and consonance, in the following sentence: <latin>Modo memineram illīus commeātūs Italiam ad cum Aemiliā</latin>"
      answer: "ANASTROPHE"
    boni:
      - question: "Name the figure of speech, besides alliteration, assonance, and consonance, in the following sentence: <latin>Tum Caesar linguā farrem lambit, et attonitī spectātōrēs clāmābant</latin>"
        answer: "PLEONASM"
      - question: "Name the figure of speech, besides alliteration, assonance, and consonance, in the following sentence: <latin>sīc togā amictus, tunicam induit</latin>"
        answer: "HYSTERON PROTERON"
  - tossup:
      question: "Listen carefully to the following advice from Ovid, which I will read twice as prose, and answer IN ENGLISH the question that follows: <latin>discite, quae faciem commendet cūra, puellae:</latin>  <latin>et quō sit vōbīs fōrma tuenda modō.</latin>  <latin>nec tamen indignum: sit vōbīs cūra placendī,</latin>  <latin>cum comptōs habeant saecula nostra virōs</latin>. Question: What is the subject matter of this didactic poem?"
      answer: "THE CARE <emphasis>GIRLS</emphasis> OUGHT TO HAVE FOR THEIR <emphasis>LOOKS</emphasis> (BOTH FACE AND FORM), AND IN WHAT WAY THEY OUT TO GO ABOUT IT"
    boni:
      - question: "Why should girls see to it that they are pleasing?"
        answer: "“OUR AGE HAS MEN WITH COMBED HAIR” MEN ARE TAKING CARE TO LOOK DECENT, HAVE COMBED HAIR / OVID’S AGE WAS FULL OF METROSEXUALS (LONG BEFORE HOWARD DEAN) / WOMEN SHOULD LOOK PRETTY BECAUSE THE MEN ARE, TOO"
      - question: "Using the information contained in this passage, and your literary knowledge, of what work of Ovid are these the opening lines?"
        answer: "<title><latin>MEDICĀMINA FACI</latin></title>ĒĪ <title><latin>FĒMINĒAE / MEDICĪNA FACI</latin></title>ĒĪ /  <title>THE COSMETICS OF / FOR WOMEN</title>"
  - tossup:
      question: "Who led the expedition against Troy which dethroned the Trojan king Laomedon?"
      answer: "HERAKLES / HERCULES"
    boni:
      - question: "What daughter of Laomedon did Herakles save and expect to marry, only to be denied by her tergiversating father?"
        answer: "HESIONE"
      - question: "What two gods had Laomedon refused to pay for building his walls, resulting in the need to sacrifice Hesione to a sea monster?"
        answer: "POSEIDON (NOT NEPTUNE IF THE STUDENT ANSWERED HERAKLES ABOVE) & APOLLO"
  - tossup:
      question: "What derivative from the Latin verb meaning “fold” is an English noun meaning “a doubleness of thought, speech, or action, especially a deception by pretending to feel and act one way while acting another”?"
      answer: "DUPLICITY"
    boni:
      - question: "What derivative from the Latin noun for “meadow” is an English noun meaning “a tract of grassland”?"
        answer: "PRAIRIE (from <latin>pratum</latin>)"
      - question: "What is the meaning of the Latin word from which ēforest’ and ēforeign’ are derived?"
        answer: "OUT-OF-DOORS (<latin>forīs</latin>) / DOOR (<latin>foris</latin>)"
  - tossup:
      question: "Whose conquest and fair settlement of the Celtiberians in 179 BC resulted in 25 years of peace in Spain?"
      answer: "TIBERIUS (SEMPRONIUS) GRACCHUS (FATHER OF THE PLEBEIAN TRIBUNE)"
    boni:
      - question: "On what island province did Sempronius Gracchus repress a revolt?"
        answer: "SARDINIA"
      - question: "Name his wife by whom he had twelve children?"
        answer: "CORNELIA (DAUGHTER OF SCIPIO AFRICANUS)"
  - tossup:
      question: "Which work of Cicero is also referred to as <title><latin>Laelius</latin></title>?"
      answer: "<title><latin>DĒ</latin></title> <title><latin>AMĪCITI</latin></title>Ā / <title>ON FRIENDSHIP</title>"
    boni:
      - question: "Which six-book work of Cicero is preserved in part by a commentary of Macrobius and partly only on palimpsests?"
        answer: "<title><latin>DĒ</latin></title> <title><latin>RĒ</latin></title> <title><latin>PŪBLIC</latin></title>Ā / <title>ON THE REPUBLIC</title>"
      - question: "Which work of Cicero addresses his view of the gods?"
        answer: "<title><latin>DĒ</latin></title> <title><latin>NĀTŪRĀ</latin></title> <title><latin>DEŌRUM</latin></title> / <title>ON THE NATURE OF THE GODS</title>"
  - tossup:
      question: "<latin>Dīcō</latin> : <latin>dīxisse</latin> :: <latin>tangō</latin> : _____ ?"
      answer: "<latin>TETIGISSE</latin>"
    boni:
      - question: "<latin>Dīcō</latin> : <latin>dīxisse</latin> :: <latin>neō</latin> : _____ ?"
        answer: "<latin>NĒVISSE</latin>"
      - question: "<latin>Dīcō</latin> : <latin>dīxisse</latin> :: <latin>scalpō</latin> : _____ ?"
        answer: "<latin>SCALPSISSE</latin>"
  - tossup:
      question: "What was the Latin term for the fixed number of laps in a chariot race at a Roman circus?"
      answer: "<latin>MISSUS</latin>"
    boni:
      - question: "What was the Latin name for the ceremonial gate at the end of a Roman circus opposite the <latin>carcerēs</latin>?"
        answer: "<latin>PORTA TRIUMPHĀLIS</latin>"
      - question: "On which end of the <latin>spīna</latin> was the <latin>mēta prīma</latin> positioned?"
        answer: "THE END CLOSEST TO THE <latin>PORTA TRIUMPHĀLIS</latin>  or THE END FARTHEST FROM THE <latin>CARCERĒS</latin> / STARTING GATES"
  - tossup:
      question: "What man received as a lover’s gift a dog named Laelaps which always caught its prey, and a javelin which never missed its target?"
      answer: "CEPHALUS"
    boni:
      - question: "What goddess at one point had kidnapped Cephalus, only to be abandoned for the love of a mortal woman?"
        answer: "EOS / AURORA"
      - question: "Who was Cephalus’ wife, whom he accidentally killed with the unerring spear?"
        answer: "PROCRIS"
  - tossup:
      question: "What Roman author’s father, a freedman, had a great effect on his education when he sent him to school in Rome, instead of a school closer to his home in Venusia?"
      answer: "(QUINTUS) HORATIUS (FLACCUS) / HORACE"
    boni:
      - question: "What great friend of Horace died only months before him in 8 B.C.?"
        answer: "(GAIUS CILNIUS) MAECENAS"
      - question: "Which of Horace’s known works was published first?"
        answer: "<title><latin>EPODĒS</latin></title> / <title><latin>IAMB</latin></title>Ī"
  - tossup:
      question: "Change the phrase <latin>magna sitis</latin> to the Ablative singular"
      answer: "<latin>MAGNĀ SITĪ</latin>"
    boni:
      - question: "The noun <latin>nūbēs</latin> is a mixed i-stem and has a Genitive plural of nūbium. Change the phrase <latin>magna nūbēs</latin> to the Ablative singular"
        answer: "<latin>MAGNĀ NŪBE</latin>"
      - question: "Give two possible forms for the Accusative plural of <latin>nox</latin>"
        answer: "<latin>NOCTĒS, NOCTĪS</latin> (<latin>NOCTEIS</latin>)"
  - tossup:
      question: "<latin>Quid Anglicē significat ēclipeus’</latin>?"
      answer: "(ROUND/BRONZE/ORNAMENTAL) SHEILD / DISC OF THE SUN"
    boni:
      - question: "You now have 15 seconds to examine the visual  The item you see in the visual is a large, honorary <latin>clipeus</latin> which is now housed in a museum in Arles, France. Upon whom, according to the inscription, was this honorary <latin>clipeus</latin> bestowed?"
        answer: "AUGUSTUS"
      - question: "You may have noticed that the attributes listed in this inscription are in the Genitive case, which means that they modify the <latin>clipeus</latin> itself. What are the four attributes of this <latin>clipeus</latin>?"
        answer: "(1) VIRTUE, COURAGE, EXCELLENCE, VALOR (2) CLEMENCY, MERCY, MILDNESS, FORGIVENESS (3) JUSTICE, EQUITY (4) PIETY, SENSE OF DUTY (TOWARDS THE GODS AND COUNTRY)"
  - tossup:
      question: "Whose works include four books of satires, as well as the <title><latin>Euhemerus</latin></title>, the <title><latin>Ambracia</latin></title>, and the <title><latin>Annālēs</latin></title>?"
      answer: "(QUINTUS) ENNIUS"
    boni:
      - question: "What relative of Ennius wrote tragedies called <title><latin>Paullus</latin></title>, <title><latin>Dulorestes</latin></title>, and <title><latin>Niptra</latin></title>?"
        answer: "(MARCUS) PACUVIUS"
      - question: "What ancestor of Pompey the Great was the first Roman to write satires in dactylic hexameter?"
        answer: "(GAIUS) LUCILIUS"
  - tossup:
      question: "Where would one find all of the following things: a man plaiting a rope only to have it eaten by a donkey, a creature with fifty heads, and a group attempting to carry water in vessels that have holes in the bottom?"
      answer: "TARTARUS (if “The Underworld” is given, prompt for more information)"
    boni:
      - question: "To what group does the creature with fifty heads belong?"
        answer: "THE HEKATONCHEIRES"
      - question: "Who was the man forced to weave a rope together only to have it eaten by a donkey because his wife spent more than he could afford?"
        answer: "OCNUS"
  - tossup:
      question: "Translate the following sentence of Latin taken from the legal profession: <latin>nēmō bis pūnītur prō eōdem dēlictō</latin>"
      answer: "NO ONE IS PUNISHED TWICE FOR THE SAME CRIME"
    boni:
      - question: "<latin>Optima lēgum interpres est cōnsuētūdō</latin>"
        answer: "CUSTOM IS THE BEST INTERPRETER OF THE LAW(S)"
      - question: "<latin>Lēx ūnō ōre omnēs alloquitur</latin>"
        answer: "THE LAW SPEAKS TO EVERYONE WITH ONE MOUTH / UNANIMOUSLY"
  - tossup:
      question: "Which Roman king founded a colony at Ostia at the mouth of the Tiber?"
      answer: "ANCUS MARCIUS"
    boni:
      - question: "On what hill across the Tiber did Ancus Marcius build a fortress as a protection against the Etruscans?"
        answer: "JANICULUM"
      - question: "Name the bridge Ancus built to join the city with the Janiculum"
        answer: "SUBLICIAN BRIDGE <latin>/ PONS SUBLICIUS</latin>   <latin>2007 NJCL CERTAMEN</latin>  <latin>ADVANCED DIVISION</latin>"
