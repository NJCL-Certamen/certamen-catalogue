tournament: "NJCL Certamen"
year: 2007
division: "Advanced"
round: "Round 3"
questions:
  - tossup:
      question: "What animal derives its name from a Latin verb meaning “twist”?"
      answer: "TORTOISE/TURTLE"
    boni:
      - question: "What English verb from the Latin “to send” is a synonym of “omit”?"
        answer: "PRETERMIT"
      - question: "What noun from the Latin verb <latin>stringō</latin> is “the power to impress or influence”?"
        answer: "PRESTIGE (<latin>STRINGŌ</latin>)"
  - tossup:
      question: "What Roman comedian on multiple occasions used the prologues of his plays to defend himself against the accusations that, among other things, he mixed multiple Greek plays together to make his own?"
      answer: "TERENCE / (PUBLIUS) TERENTIUS (AFER)"
    boni:
      - question: "What was the practice of mixing multiple plays together called in Latin?"
        answer: "<latin>CONTĀMINĀTIŌ</latin>"
      - question: "What was Terence’s first work, which he supposedly had to present to the older comedian Caecilius Statius?"
        answer: "<title><latin>ANDRIA</latin></title>"
  - tossup:
      question: "Differentiate in meaning between <latin>paulātim</latin> and <latin>paulīsper</latin>"
      answer: "<latin>PAULĀTIM</latin> - LITTLE BY LITTLE, GRADUALLY, BIT BY BIT <latin>PAULISPER</latin> - FOR A SHORT TIME"
    boni:
      - question: "Give a synonym of the verb <latin>dominor</latin>"
        answer: "<latin>REGŌ, RĒGNŌ, IMPERŌ, IUBEŌ, PRAESUM</latin>"
      - question: "Give a synonym of the noun <latin>lītus</latin>"
        answer: "<latin>ŌRA (MARITIMA) / ACTA / RĪPA</latin>"
  - tossup:
      question: "As Pan pursued Syrinx she was turned into a bed of reeds. Into what was Pitys transformed when Pan pursued her?"
      answer: "PINE TREE"
    boni:
      - question: "In one of his rare romantic successes, Pan did obtain the favors of Selene by bribing her. With what did he bribe her?"
        answer: "(HERD OF PURE) WHITE OXEN"
      - question: "Who was turned into a fountain to escape from the pursuit of the river Alpheius?"
        answer: "ARETHUSA"
  - tossup:
      question: "What military tribune in 437 BC slew with his own hand a king named Tolumnius?"
      answer: "(A. CORNELIUS) COSSUS"
    boni:
      - question: "Of which city was Tolumnius king?"
        answer: "VEII"
      - question: "What prize was awarded to Cossus for killing Tolumnius?"
        answer: "SPOLIA OPIMA"
  - tossup:
      question: "Translate the following sentence into Latin using a <emphasis>deponent</emphasis> verb: We promised that tomorrow we would come"
      answer: "<latin>POLLICĒBĀMUR NŌS CRĀS VENTŪRŌS (-ĀS) ESSE</latin>  <latin>POLLICITĪ (-AE) SUMUS NŌS CRĀS VENTŪRŌS (-ĀS) ESSE</latin>"
    boni:
      - question: "Translate the following sentence using a relative clause: I can see that the man who is sitting under the tree is sleeping"
        answer: "<latin>VIDĒRE POSSUM HOMINEM / VIRUM QUĪ SUB ARBORE SEDEAT DORMĪRE</latin>"
      - question: "Without using an infinitive, say in Latin, “I want you to buy more books.”"
        answer: "<latin>VOLŌ (UT) EMĀS PLŪS LIBRŌRUM</latin>"
  - tossup:
      question: "Who began a work of history at the age of thirty and spent about forty years on it, publishing it in installments until it covered all of Roman history up to the year before the death of Maecenas?"
      answer: "(TITUS) LIVIUS / LIVY"
    boni:
      - question: "What is the term for the summaries of Livy that tell us about the subject matter of many of the books that are lost?"
        answer: "PERIOCHAE"
      - question: "What event concludes Book V of Livy’s <title><latin>Ab Urbe Condit</latin></title>ā?"
        answer: "THE SACK OF ROME BY THE GAULS"
  - tossup:
      question: "In the trailer for the upcoming movie “The Last Legion,” an item is flashed onscreen with an inscription that roughly reads as “<latin>Gāī Iūlī Caesaris Ēnsis</latin>”. What is the translation of this inscription?"
      answer: "GAIUS JULIUS CAESAR’S SWORD"
    boni:
      - question: "You are now in charge of writing an inscription on a sword for yet another cheesy classically-themed shlockbuster. This time it’s Cato the Elder who receives onscreen action. Translate “Cato’s sword” into Latin using his full Roman name and a synonym of the words <latin>ēnsis</latin> and <latin>gladius</latin>"
        answer: "<latin>MĀRCĪ PORCI(Ī) CATŌNIS FERRUM / MUCRŌ</latin>"
      - question: "Never to be outdone in Hollywood, this new production includes a scene where Cato the Elder rides a CGI Pegasus by means of time travel through the smoldering ashes of Pompeii. They have contracted you to create an inscription for a wall in their version of Pompeii to add to the realism. You, however, cheat and give them an authentic inscription that reads “<latin>Pecūnia nōn olet</latin>”. What does this translate as?"
        answer: "MONEY DOESN’T STINK / SMELL"
  - tossup:
      question: "Which of the following common Latin sayings is roughly equivalent to “When pigs fly”?"
      answer: "Ā <latin>Deucaliōne, Hannibal ad portās, ad Kalendās Graecās, rem acū tetigistī, vir sapit quī pauca loquitur. AD KALENDĀS GRAECĀS</latin>"
    boni:
      - question: "What common Latin phrase meaning “break out the champagne” comes from the opening line of one of Horace’s <title><latin>Odes</latin></title>?"
        answer: "<latin>NUNC EST BIBENDUM</latin>"
      - question: "What common Latin phrase means “speak kindly of the dead”?"
        answer: "<latin>DĒ MORTUĪS (DĪC) NĪL/ NIHIL NISI BONUM</latin>"
  - tossup:
      question: "The title of Aeschylus’ play, <title>The Libation Bearers</title>, refers to a group of ladies, led by Electra. On whose grave do they pour libations?"
      answer: "AGAMEMNON’S"
    boni:
      - question: "One of Aeschylus’ other plays dramatizes the trial that resulted from the crime depicted in the visual. Name the play in which that trial takes place, and then identify by letter and name the defendant of that trial who is in this visual"
        answer: "<title>EUMENIDES</title> or <title>THE FURIES</title>; B- ORESTES"
      - question: "Identify by letter and name the two victims of this crime"
        answer: "A - CLYTEMNESTRA, C - AEGISTHUS"
  - tossup:
      question: "What god fathered children by Chione and Aphrodite, helped Aegipan save Zeus’ sinews from the giant Typhon, helped king Priam find his way to Achilles’ tent, and invented the lyre?"
      answer: "HERMES"
    boni:
      - question: "What does Hermes’ epithet Argeiphontes denote about him?"
        answer: "HE KILLED ARGUS (PANOPTES)"
      - question: "What does Hermes’ epithet Psychopompos denote about him?"
        answer: "HE LED SOULS TO THE UNDERWORLD"
  - tossup:
      question: "Who is described in this quotation from Vergil’s <title>Aeneid</title>? “<latin>arma diū senior dēsuēta trementibus aevō circumdat nēquīquam umerīs et inūtile ferrum cingitur</latin>.”"
      answer: "PRIAM"
    boni:
      - question: "Who in the <title>Aeneid</title> speaks this quotation? “<latin>hoc illud, germāna fuit? Mē fraude petēbās? Hoc rogus iste mihi, hoc ignēs āraeque parābant</latin>?”"
        answer: "DIDO"
      - question: "Who in the <title>Aeneid</title> is described by this quotation? “<latin>Ast illī solvuntur frīgore membra vītaque cum gemitū fugit indignāta sub umbrās</latin>.”"
        answer: "TURNUS"
  - tossup:
      question: "Which of these terms is not related to the others? <latin>stirps, vīcus, pagus, mūnicipium, colōnia</latin>, or <latin>cīvitās</latin>?"
      answer: "<latin>STIRPS</latin>"
    boni:
      - question: "Which of these terms is not related to the others? <latin>dupondius, āër, sestertius,</latin>  <latin>aureus, solidī, denarius</latin>?"
        answer: "<latin>ĀËR</latin>"
      - question: "Which of the following items does NOT belong with the others because of how an ancient Roman would use it? <latin>triptych, vellum, ātrāmentum, volūmen, codex</latin>?"
        answer: "<latin>ĀTRĀMENTUM</latin>"
  - tossup:
      question: "What Roman writer, a legate in 50 B.C., lost his Senatorial rank due to a scandal involving the wife of Annius Milo but had it restored by Caesar the following year?"
      answer: "(GAIUS) SALLUST(IUS) (CRISPUS)"
    boni:
      - question: "What work did Sallust write in five books about the period between 78 and 67 B.C.?"
        answer: "<title><latin>HISTORIAE</latin></title>"
      - question: "Give the Latin title of Sallust’s work in which he describes a character as “<latin>nōbilī genere nātus, fuit magnā vī et animī et corporis, sed ingeniō malō prāvōque</latin>”?"
        answer: "<latin>BELLUM CATILĪNAE</latin>"
  - tossup:
      question: "Listen carefully to the following passage about Caesar, which I will read twice, and answer IN LATIN the question that follows: <latin>Amīcī saepissimē Iūlium Caesarem monuerant ut prīncipātum, armīs quaesītum, armīs tenēret. Ille autem, dictitāns sē morī quam timērī mālle, sē clēmentem esse praestitit. Nam clēmentiam et ab aliīs exspectāvit; itaque Caesar adeō incautus factus est ut ab inimīcīs oppugnātus necārētur.</latin>  Question: <latin>Quō modō amīcī dīcēbant Caesarem prīncipātum tenēre dēbēre?</latin>"
      answer: "ARMĪS"
    boni:
      - question: "<latin>Cuius erat Caesar cupidior quam timendī?</latin>"
        answer: "MORIENDĪ"
      - question: "<latin>Cum Caesar incautior sit factus, quid accidit?</latin>"
        answer: "<latin>OPPUGNĀTUS EST / NECĀTUS EST / OCCĪSUS EST /</latin>   <latin>INTERFECTUS EST / TRUCĪDĀTUS EST</latin>"
  - tossup:
      question: "Which word in the following sentence is derived from a Latin verb meaning \"weigh\" (spelled w-e-i-g-h)? The compensatory reimbursement for your arduous yet inadequate service seemed suitable"
      answer: "COMPENSATORY"
    boni:
      - question: "What word in that sentence is derived from a Latin word meaning “purse”??"
        answer: "REIMBURSEMENT"
      - question: "How many of the words in the following sentence ARE derived from Latin? The imperial retinue ambled by the volatile crowd with shameful arrogance"
        answer: "FIVE"
  - tossup:
      question: "Which first century emperor married the daughter of the Roman general Gnaeus Domitius Corbulo?"
      answer: "DOMITIAN"
    boni:
      - question: "This daughter, Domitia, conspired with which imperial servant to kill Domitian?"
        answer: "STEPHANUS"
      - question: "How did Stephanus kill Domitian as he read a report about a supposed conspiracy?"
        answer: "HE STABBED HIM"
  - tossup:
      question: "Translate the following sentence into English: <latin>Nōn possumus reperīre quantus sit barbarōrum vīcus</latin>"
      answer: "WE CANNOT FIND OUT / DISCOVER HOW BIG THE FOREIGNERS’ / BARBARIANS’ VILLAGE IS"
    boni:
      - question: "<latin>Hī barbarī nōn eī sunt quōs spernere dēbeāmus</latin>"
        answer: "THESE BARBARIANS / FOREIGNERS <emphasis>ARE NOT THE TYPE / SORT</emphasis> (OF MEN) WHOM WE OUGHT / SHOULD SPURN / REJECT"
      - question: "<latin>Barbarī recūsāvērunt quōminus vīcum relinquerent dum cōnsul advenīret</latin>"
        answer: "THE FOREIGNERS / BARBARIANS REFUSED TO ABANDON / LEAVE (THEIR) VILLAGE <emphasis>UNTIL</emphasis> THE CONSUL ARRIVED"
  - tossup:
      question: "When Maximian was forced to retire in 305 A.D., who replaced him as Augustus?"
      answer: "CONSTANTIUS I (or CHLORUS)"
    boni:
      - question: "Who became the Caesar in the West?"
        answer: "(FLAVIUS VALERIUS) SEVERUS"
      - question: "Who was the Eastern Augustus?"
        answer: "GALERIUS"
  - tossup:
      question: "Though Odysseus was still married to Penelope, what queen of the Thesprotians did he marry on a journey inland after his return from Troy?"
      answer: "CALLIDICE"
    boni:
      - question: "Who had set Odysseus on this inland journey?"
        answer: "TEIRESIAS"
      - question: "Teiresias told Odysseus that if he performed this task death would come from the sea. Who unwittingly fulfilled this prophecy by killing Odysseus with a spear tipped with the sting of a stingray?"
        answer: "TELEGONUS   <latin>2007 NJCL CERTAMEN</latin>  <latin>ADVANCED DIVISION</latin>"
