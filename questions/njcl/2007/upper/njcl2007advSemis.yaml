  - tossup:
      question: "Listen carefully to the following passage about <latin>dōna mīlitāria</latin>, or military decorations, which I will read twice, and answer IN LATIN, the question about it that follows: <latin>Multa genera dōnōrum mīlitārium in exercitū Rōmānō fuērunt, quōrum ūna erat corōna cīvica, quae dabātur mīlitī quī in proeliō cīvem servāverat. Alia corōna erat mūrālis quae ab imperātōre dabātur mīlitī quī tam fortis erat ut prīmus mūrum hostium scanderet atque oppidum intrāret. Magnō pretiō haec dōna mīlitāria Rōmānī habēbant.</latin>  Question: <latin>Quid mīlitī necesse erat facere ut corōnā cīvicā dōnārētur?</latin>"
