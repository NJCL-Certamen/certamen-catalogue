tournament: "NJCL Certamen"
year: 2008
division: "Intermediate"
round: "Round 3"
questions:
  - tossup:
      question: "Who created a “counter-Senate” from Italian refugees and anti-Sullan Romans in Lusitania in the first century BC?"
      answer: "(Q.) SERTORIUS"
    boni:
      - question: "Who arrived in Spain in 76 BC and conducted an over-all successful campaign against Sertorius?"
        answer: "POMPEY"
      - question: "Who finally murdered Sertorius?"
        answer: "PERPERNA"
  - tossup:
      question: "What type of dependent subjunctive clause is found in the following sentence: <latin>Tam attonitus sum ut nihil loquī possim</latin>"
      answer: "RESULT CLAUSE"
    boni:
      - question: "<latin>Puella mīrābātur quis puer esset</latin>"
        answer: "INDIRECT QUESTION"
      - question: "<latin>Servōs mīsit quī cibum emerent</latin>?"
        answer: "(RELATIVE) CLAUSE OF PURPOSE"
  - tossup:
      question: "What native of Mauretania became the first equestrian to ascend the imperial throne without having entered the senatorial order?"
      answer: "MACRINUS"
    boni:
      - question: "In order to appease the Severan faction, what did Macrinus secure for the deceased Caracalla?"
        answer: "DEIFICATION"
      - question: "On whom did Macrinus bestow the title of <latin>Caesar</latin> as soon as he was hailed <latin>Imperātor</latin>?"
        answer: "(HIS SON) DIADUMENIANUS"
  - tossup:
      question: "Some abbreviations stand for more than one possible Latin word or phrase. Give one possible Latin word for which <latin>A.U.C.</latin> is an abbreviation"
      answer: "(SEE ANSWERS AFTER BONUS 1)"
    boni:
      - question: "Name another"
        answer: "<latin>AB URBE CONDITĀ</latin> or <latin>ANNŌ URBIS CONDITAE</latin>"
      - question: "The abbreviation <latin>sc.</latin> is another such abbreviation. Give one possible Latin word for which <latin>sc.</latin> is an abbreviation"
        answer: "<latin>SCĪLICET</latin> & <latin>SCULPSIT</latin>"
  - tossup:
      question: "Give a Latin deponent verb which means “to attack.”"
      answer: "<latin>ADORIOR, ADORĪRĪ</latin> / <latin>AGGREDIOR, AGGREDĪ</latin>"
    boni:
      - question: "“to suffer.”"
        answer: "<latin>PATIOR, PATĪ</latin>"
      - question: "“to complain.”"
        answer: "<latin>QUEROR, QUERĪ</latin>"
  - tossup:
      question: "In the <latin>Forum Rōmānum</latin>, which temple was circular in shape and had a vent on its roof?"
      answer: "TEMPLE OF VESTA"
    boni:
      - question: "Please identify the letter that indicates the Temple of Castor and Pollux"
        answer: "“A”"
      - question: "Please identify the letter that indicates the Temple of Divine Julius Caesar"
        answer: "“D”"
  - tossup:
      question: "What English noun derived from <latin>volō</latin>, <latin>velle</latin> means “conscious choice” or “free will”?"
      answer: "VOLITION"
    boni:
      - question: "What English noun derived <latin>moneō</latin> means “a place of manufacture or invention”?"
        answer: "MINT"
      - question: "From what Latin verb with what meaning do we derive “commensurate”?"
        answer: "<latin>METIOR</latin>, <latin>METĪRĪ</latin> - MEASURE"
  - tossup:
      question: "What princess of Thebes defied the decree of her uncle and gave her brother a proper burial?"
      answer: "ANTIGONE"
    boni:
      - question: "Who was the brother whom Antigone buried?"
        answer: "POLYN(E)ICES"
      - question: "Who was the uncle who forbade the burial of Polyneices?"
        answer: "CREON"
  - tossup:
      question: "<latin>Dēscrībāmus nunc proprietātēs dīctiōnum in hāc sententiā: “labor omnia vincit.” quae pars ōrātiōnis est “labor”?</latin>"
      answer: "NŌMEN"
    boni:
      - question: "<latin>quae pars ōrātiōnis est “vincit”?</latin>"
        answer: "VERBUM"
      - question: "<latin>quō cāsū est “omnia”?</latin>"
        answer: "ACCŪSĀTĪVŌ"
  - tossup:
      question: "How many <latin>lictōrēs</latin> escorted a <latin>cōnsul</latin> outside the <latin>pōmerium</latin> of the city?"
      answer: "TWELVE"
    boni:
      - question: "How many <latin>lictōrēs</latin> escorted a <latin>praetor</latin>?"
        answer: "SIX"
      - question: "How many <latin>lictōrēs</latin> escorted a <latin>dictātor</latin>?"
        answer: "TWENTY-FOUR"
  - tossup:
      question: "What two brothers who often appeared to sailors as St. Elmo’s fire were also known as the Dioscouri?"
      answer: "CASTOR & POLLUX / POLYDEUCES"
    boni:
      - question: "For what skill was Castor renowned?"
        answer: "HORSEMANSHIP"
      - question: "For what skill was Pollux renowned?"
        answer: "BOXING"
  - tossup:
      question: "Listen carefully to the following passage about our good friend Aurelia, which I will read twice, and answer IN ENGLISH, the question that follows: <latin>Aurēlia patrem rogāvit quis esset deus. Cui pater, “Deus,” inquit “est quī neque initium neque fīnem habeat. Meherculē, tū es fīlia deae Veneris. Quā dē causā tot sorōrēs et frātrēs habēs!” Tum Aurēlia rogāvit quis Venus esset. Pater autem nihil respondit.</latin> Question: What two questions did Aurelia ask her father?"
      answer: "WHAT A GOD IS & WHO VENUS IS"
    boni:
      - question: "According to the father, what is a god?"
        answer: "A TYPE OF PERSON / THING THAT HAS NEITHER A BEGINNING NOR AN END"
      - question: "What seemingly miraculous piece of information does Aurelia’s father reveal to her?"
        answer: "SHE IS THE DAUGHTER OF VENUS"
  - tossup:
      question: "What creature pulled the chariot that brought Zeus his thunder and lightning?"
      answer: "PEGASUS"
    boni:
      - question: "Who were the parents of Pegasus?"
        answer: "POSEIDON & MEDUSA"
      - question: "What spring did Pegasus create with a stamp of his hoof?"
        answer: "HIPPOCRENE"
  - tossup:
      question: "According to Livy, what massacre was so fierce that neither the Romans nor the army of Hannibal realized an earthquake had occurred during their battle in 217 BC?"
      answer: "LAKE TRASIMENE"
    boni:
      - question: "Who was the leader of the Roman forces at Lake Trasimene?"
        answer: "(C.) FLAMINIUS"
      - question: "Whom did the Roman people appoint as <latin>dictātor</latin> after the disaster at Lake Trasimene?"
        answer: "(Q.) FABIUS MAXIMUS (CUNCTATOR)"
  - tossup:
      question: "What use of the dative case is found in the following sentence: <latin>Saepe tibi meum somnium nārrāvī</latin>"
      answer: "INDIRECT OBJECT"
    boni:
      - question: "<latin>Equus et canis sunt fidēlissimī hominī</latin>"
        answer: "DATIVE WITH SPECIAL ADJECTIVES / <latin>FIDĒLIS</latin>"
      - question: "What is the name for verbs such as <latin>imperō</latin>, <latin>ignōscō</latin>, <latin>pāreō</latin>, and <latin>crēdō</latin>, which commonly have the dative case as their only object?"
        answer: "INTRANSITIVE / SPECIAL VERBS"
  - tossup:
      question: "Into what type of animal was Callisto transformed?"
      answer: "A BEAR"
    boni:
      - question: "Who was the son of Callisto and Jupiter?"
        answer: "ARCAS"
      - question: "Into what two constellations were Callisto and Arcas transformed?"
        answer: "BIG DIPPER & LITTLE DIPPER / <latin>URSA MAJOR & URSA MINOR /</latin> BIG BEAR & LITTLE BEAR"
  - tossup:
      question: "Translate the following sentence into English: <latin>Licet tibi currere</latin>"
      answer: "YOU MAY RUN / YOU CAN RUN / YOU ARE ALLOWED TO RUN / IT IS PERMITTED FOR YOU TO RUN"
    boni:
      - question: "<latin>Mēns meminit amīcōrum</latin>"
        answer: "THE MIND REMEMBERS FRIENDS"
      - question: "<latin>Tē miseret hostium</latin>"
        answer: "YOU PITY (YOUR / THE) ENEMIES / ENEMY"
  - tossup:
      question: "Of suspiration, sprite, expiry, and spiracle, which refers to a sigh?"
      answer: "SUSPIRATION"
    boni:
      - question: "Of vesture, vestige, vestry, vestibule, and vestment, which is a storage room?"
        answer: "VESTRY"
      - question: "Of congregate, gregarious, egregious, and aggregate, which means “tending to flock together with one’s kind”?"
        answer: "GREGARIOUS"
  - tossup:
      question: "Change the phrase <latin>haec dea</latin> to the genitive singular"
      answer: "<latin>HUIUS DEAE</latin>"
    boni:
      - question: "Change <latin>hūius deae</latin> to the dative singular"
        answer: "<latin>HUIC DEAE</latin>"
      - question: "Change <latin>huic deae</latin> to the plural"
        answer: "<latin>HĪS DEĀBUS</latin>"
  - tossup:
      question: "On what island devoid of men did Jason & his Argonauts make a temporary stop?"
      answer: "LEMNOS"
    boni:
      - question: "What queen of Lemnos invited Jason and his men to enjoy the hospitality of the Lemnian women?"
        answer: "HYPSIPYLE"
      - question: "Who finally got his fellow Argonauts to leave Lemnos by making them feel ashamed of their indulgent behavior?"
        answer: "HERACLES / HERCULES  <latin>2008 NJCL CERTAMEN INTERMEDIATE DIVISION</latin>"
