      question: "Listen carefully to the following passage, which I will read twice, and answer IN LATIN the question that follows: <latin>Interfectō Caesare, bella cīvīlia orta sunt. Senātus favēbat interfectōribus Caesaris. Mārcus Antonius autem Caesaris factiōnī favēbat. Tam turbāta erat rēs pūblica ut multī occīderentur.</latin> Question: <latin>Quibus favēbat senātus?</latin>"
