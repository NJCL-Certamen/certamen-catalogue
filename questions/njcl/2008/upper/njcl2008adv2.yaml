tournament: "NJCL Certamen"
year: 2008
division: "Advanced"
round: "Round 2"
questions:
  - tossup:
      question: "What title, conferred upon Augustus in 2 BC, a title previously given to Cicero and Julius Caesar literally means “father of the country”?"
      answer: "PATER PATRIAE"
    boni:
      - question: "Despite his great popularity, Augustus was the target of a number of assassination plots. For five points each, name the two chief conspirators who plotted against Augustus' life in 23 B.C"
        answer: "(LUCIUS LICINIUS) MURENA & (FANNIUS) CAEPIO"
  - tossup:
      question: "<latin>Quid Anglicē significat “cis”?</latin>"
      answer: "ON THIS SIDE OF"
    boni:
      - question: "<latin>Quid Anglicē significat “cisium”?</latin>"
        answer: "(LIGHT, TWO-WHEELED) CARRIAGE"
      - question: "<latin>Quid Anglicē significat “cisterna”?</latin>"
        answer: "(UNDERGROUND OR COVERED STORAGE) TANK FOR WATER (If student says, “cistern,” ask him or her to explain what a cistern is)"
  - tossup:
      question: "Heracles once fathered three sons by a woman in The Forest north of the Black Sea. Which son became the king of his tribe, the Scythians?"
      answer: "SCYTHES"
    boni:
      - question: "What did Scythes have to do to earn the crown?"
        answer: "BEND/DRAW A BOW WHICH HERACLES HAD LEFT BEHIND."
      - question: "What animals had Heracles been trying to find when he met that woman?"
        answer: "(HIS OWN) HORSES / MARES"
  - tossup:
      question: "What Augustan poet’s father was a public auctioneer in the southern Italian town of Venusia?"
      answer: "(QUINTUS) HORATIUS (FLACCUS) / HORACE"
    boni:
      - question: "Because of the money his father earned, Horace was able to achieve what rank, usually reserved for equites, in the army of Brutus and Cassius?"
        answer: "<latin>TRIBŪNUS MĪLITUM /</latin> MILITARY TRIBUNE"
      - question: "After fleeing from Philippi, what job did Horace get in Rome to pay his bills?"
        answer: "<latin>SCRĪBA</latin> / SCRIBE"
  - tossup:
      question: "What type of conditional clause is found in the following sentence? <latin>Sī id crēdidissēs, errāvissēs</latin>"
      answer: "CONTRARY TO FACT (PAST TIME)"
    boni:
      - question: "What mood and tense would be used to translate the following sentence into Latin? “If you should believe that, you would be a fool.”"
        answer: "PRESENT SUBJUNCTIVE"
      - question: "Name one word or set of words that are used in Latin to introduce a conditional clause of comparison"
        answer: "<latin>TAMQUAM (SĪ), QUASI, AC SĪ, UT SĪ, VELUT (SĪ), QUAM SĪ</latin>"
  - tossup:
      question: "What Greek author, born at Antioch, wrote a Latin history of Rome from Nerva to Valens?"
      answer: "AMMIANUS MARCELLINUS"
    boni:
      - question: "What contemporary author wrote a much less detailed history, the <title><latin>Breviārium ab Urbe Conditā</latin></title>?"
        answer: "EUTROPIUS"
      - question: "In what military expedition did both Ammianus and Eutropius participate?"
        answer: "EXPEDITION OF 363 AD / JULIAN AGAINST THE PERSIANS (not Parthians)"
  - tossup:
      question: "What Latin proverb is the equivalent in meaning to “there’s no accounting for taste”?"
      answer: "<latin>DĒ GUSTIBUS NŌN (EST) DISPUTANDUM</latin>"
    boni:
      - question: "to “forewarned is forearmed”?"
        answer: "<latin>PRAEMONITUS, PRAEMŪNĪTUS</latin>"
      - question: "to “between a rock and a hard place”?"
        answer: "<latin>INTER CANEM ET LUPUM or Ā FRONTE PRAECIPITIUM, Ā TERGŌ LUPĪ</latin>"
  - tossup:
      question: "What female, after being raped, was changed into a male?"
      answer: "CAENIS"
    boni:
      - question: "From whom did Caenis request that transformation?"
        answer: "NEPTUNE/POSEIDON"
      - question: "How did the male Caeneus die?"
        answer: "<emphasis>CENTAURS HIT</emphasis> HIM OVER THE HEAD WITH (FIR) <emphasis>TREES</emphasis>/ <emphasis>BURIED</emphasis> HIM UNDER <emphasis>TREE</emphasis> TRUNKS"
  - tossup:
      question: "After the Battle of Cannae, the Carthaginians were said to have scavenged many buckets of a what item which senatorial sons were wearing?"
      answer: "RINGS"
    boni:
      - question: "What was the actual function of these rings?"
        answer: "SIGNET RING/SEAL RING"
      - question: "How were these worn differently from the way we wear rings today?"
        answer: "WORN ON THE KNUCKLE / NOT ALL THE WAY DOWN"
  - tossup:
      question: "Listen carefully to the following passage from one of Cicero’s letters, which I will read twice, and answer IN LATIN the question that follows: <latin>Clodius inim</latin>§<latin>cus mihi est. Pompeius cÇnfirmat eum nihil esse factãrum contr</latin>~ <latin>m</latin>‘<latin>. Mihi per</latin>§<latin>culÇsum est cr</latin>‘<latin>dere, ad resistendum m</latin>‘ <latin>par</latin>Ç<latin>.</latin> Question: <latin>Quid Cicerōnī perīculōsum est?</latin>"
      answer: "CRĒDERE (POMPEIŌ / VERBĪS POMPEIĪ) / NŌN PĀRĀRE / NIHIL FACERE"
    boni:
      - question: "<latin>Sententiā Cicerōnis, quid necesse est?</latin>"
        answer: "RESISTERE / PARĀRE AD RESISTENDUM"
      - question: "<latin>Cuius amor nūllus est Clodiō?</latin>"
        answer: "CICERŌNIS"
  - tossup:
      question: "Which of the following, if any, is NOT derived from the same Latin root as the others? Treatise, Trinidad, travel, trident, trivial"
      answer: "TREATISE"
    boni:
      - question: "Give all the principal parts of the frequentative verb from which we derive “treatise”"
        answer: "<latin>TRACTŌ, TRACTĀRE, TRACTĀVĪ, TRACTĀTUS</latin>"
      - question: "From what Latin noun with what meaning do we derive “treasure”?"
        answer: "<latin>THĒ(N)SAURUS</latin> – TREASURE, VAULT"
  - tossup:
      question: "Translate the following sentence into English: <latin>Timeō nē vincāmur</latin>"
      answer: "I FEAR THAT WE WILL / ARE BEING CONQUERED / BEATEN I FEAR THAT WE MAY BE CONQUERED"
    boni:
      - question: "Translate: <latin>Māter eum monuit nē sōlus noctū ambulāret</latin>"
        answer: "(HIS) MOTHER WARNED HIM NOT TO WALK AT NIGHT ALONE"
      - question: "Translate: <latin>Nōn dubitō quīn sapientissimus omnium sim</latin>"
        answer: "I DO NOT DOUBT THAT I AM THE SMARTEST OF ALL"
  - tossup:
      question: "Name the literary device besides assonance, consonance, and alliteration found in the following quotation from Sallust: <latin>satis ēloquentiae, sapientiae parum</latin>"
      answer: "CHIASMUS / ASYNDETON"
    boni:
      - question: "Name the literary device besides assonance, consonance, and alliteration found in the following quotation from Pliny the Younger: <latin>Fruēris marī, fontibus, viridibus, agrō, villā amoenissimā</latin>"
        answer: "ASYNDETON"
      - question: "Name the literary device besides assonance, consonance, and alliteration found in the following quotation from Horace: <latin>mētaque fervidīs ēvītāta rotīs</latin>"
        answer: "SYNCHESIS / INTERLOCKED WORD ORDER / METAPHOR"
  - tossup:
      question: "What emperor was originally named Varius Avitus but changed his name to Marcus Aurelius Antoninus when he claimed to be a son of Caracalla?"
      answer: "ELAGABALUS / HELIOGABALUS"
    boni:
      - question: "Who was his mother?"
        answer: "JULIA MAESA"
      - question: "How did he die?"
        answer: "MURDERED BY THE PRAETORIANS / PRAETORIAN GUARD"
  - tossup:
      question: "For the phrase <latin>fluctus quīdam</latin>, spell the dative singular"
      answer: "<latin>F-L-U-C-T-U-Ī C-U-I-D-A-M</latin>"
    boni:
      - question: "Give the dative singular form for the phrase <latin>quodque cornū</latin>"
        answer: "CUIQUE CORNŪ"
      - question: "As with all declensions, archaic forms exist for the 4th declension. What is the case and number for the ending <latin>–uis</latin>, as in “<latin>senātuis</latin>”?"
        answer: "GENITIVE SINGULAR"
  - tossup:
      question: "What king of Seriphos demanded that each subject present him with a horse in order to help him win the hand of Hippodamia? Because Perseus was unable to do so, he was then given the task of bringing back Medusa’s head"
      answer: "POLYDECTYS"
    boni:
      - question: "During his return, Perseus stopped in Ethiopia and rescued what king’s daughter from a horrible monster?"
        answer: "CEPHEUS"
      - question: "How did Perseus dispose of Medusa’s head?"
        answer: "HE GAVE IT TO ATHENA (WHO AFFIXED IT TO THE AEGIS)"
  - tossup:
      question: "What year saw the death of the author of Book 8 of <title><latin>Dē Bellō Gallicō</latin></title> and the birth of the author of the <title><latin>Ars Amātōria</latin></title>?"
      answer: "43 BC"
    boni:
      - question: "According to Ovid, what happened when he tried to write prose?"
        answer: "IT CAME OUT AS POETRY"
      - question: "What book of the <title><latin>Ars Amātōria</latin></title> did Ovid write for women?"
        answer: "3"
  - tossup:
      question: "<latin>Respondē Latīnē: Tū es Rōmānus antīquus in Forō Rōmānō ambulāns. Valdē vidēre dēsīderās virginēs et sacrum ignem. Quō īre velīs ut haec videās?</latin>"
      answer: "AD TEMPLUM VESTAE"
    boni:
      - question: "You are now looking at a map of the center of Rome during the imperial period. You are standing on the location marked “<latin>Hīc stās</latin>”, note the direction of north using the key at the top of the map, and decide to see one of the sites labeled A, B, C, or D. <latin>Respondē Latīnē: Dēcrēvistī ut ad septentriōnem ambulārēs. Dīc mihi nōmen locī quem vīsitāre dēstināvistī</latin>"
        answer: "FORUM AUGUSTĪ / TEMPLUM MARTIS ULTŌRIS"
      - question: "Of the remaining locations A, C, or D, which is described by the following Latin sentence: <latin>Hic locus situs est prope Campum Martium. Initiō cīvis Rōmānus, Nepōs cognōmine, mē aedificandum cūrāvit</latin>"
        answer: "A / CIRCUS OF FLAMINIUS / CIRCUS FLAMININUS / <latin>CIRCUS FLAMIN(I)Ī</latin>)"
  - tossup:
      question: "What tribune proposed a law to grant a single general authority over the entire Mediterranean in 67 BC, thus allowing Pompey to pursue his campaign against the pirates?"
      answer: "(AULUS) GABINIUS"
    boni:
      - question: "After Pompey's three-month campaign, what law then transferred him to the East, to conclude the war against Mithridates?"
        answer: "<latin>LĒX MANILIA</latin>"
      - question: "Name the recalled general, who vehemently protested and insulted Pompey's humble origins?"
        answer: "(GAIUS) LICINIUS LUCULLUS"
  - tossup:
      question: "What son of Eos and Astraeus caused the death of Hyacinthus?"
      answer: "ZEPHYRUS"
    boni:
      - question: "Which harpy did Zephyrus impregnate?"
        answer: "PODARGE"
      - question: "Name their two immortal equine offspring"
        answer: "XANTHUS AND BALIUS  <latin>2008 NJCL CERTAMEN ADVANCED DIVISION</latin>"
