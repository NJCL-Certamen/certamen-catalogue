tournament: "NJCL Certamen"
year: 2009
division: "Advanced"
round: "Round 3"
questions:
  - tossup:
      question: "The death of what Trojan ally caused the sky to rain blood?"
      answer: "SARPEDON"
    boni:
      - question: "Who killed Sarpedon?"
        answer: "PATROCLUS"
      - question: "What two deities carried the body of Sarpedon back to Lycia?"
        answer: "HYPNOS & THANATOS / SLEEP & DEATH"
  - tossup:
      question: "Where was Fabius Rullianus defeated by the Samnites in 315 BC?"
      answer: "LAUTULAE"
    boni:
      - question: "What city revolted and turned to the Samnites as a result of the loss at Lautulae?"
        answer: "CAPUA"
      - question: "According to Livy, where in 304 BC were the Samnites defeated and forced to negotiate a peace with the Romans, thus ending the Second Samnite War?"
        answer: "BOVIANUM"
  - tossup:
      question: "What Latin author, whose father had fought on the losing side at Bedriacum, received the <latin>iūs trium līberōrum</latin> from Trajan in 110 AD for the success of his <title><latin>Dē Virīs Illūstribus</latin></title>?"
      answer: "(GAIUS) SUETONIUS (TRANQUILLUS)"
    boni:
      - question: "What other work of Suetonius details the lives of Julius Caesar and the emperors up to Domitian?"
        answer: "<title><latin>DĒ VĪTĀ CAESARUM</latin></title>"
      - question: "About which Roman emperor does Suetonius write the following: “<latin>cognōmen castrēnsī iocō trāxit quia manipulāriō habitū inter mīlitēs educābātur</latin>”?"
        answer: "CALIGULA / GAIUS IULIUS CAESAR AUGUSTUS GERMANICUS"
  - tossup:
      question: "Translate the following sentence into English: <latin>Dux nescit duōs equitēs iter quīndecim diērum facere</latin>"
      answer: "THE COMMANDER / LEADER / GENERAL DOES NOT KNOW THAT (THE) TWO KNIGHTS / HORSEMEN ARE MAKING / MAKE A FIFTEEN-DAY JOURNEY / JOURNEY OF FIFTEEN DAYS"
    boni:
      - question: "Translate: <latin>Spērābam epistulam quam heri exspectārem hodie adventūram esse</latin>"
        answer: "I WAS HOPING THAT THE LETTER WHICH I WAS WAITING FOR / EXPECTING YESTERDAY WOULD ARRIVE TODAY"
      - question: "Using only four Latin words and an infinitive of exclamation, say in Latin: Mother is sailing to Italy?"
        answer: "<latin>MĀTREM(NE) AD / IN ĪTALIAM NĀVIGĀRE</latin>"
  - tossup:
      question: "In what speech of Cicero does he defend a man against the charge of attempting to poison his lover Clodia?"
      answer: "<title><latin>PRŌ CAELIŌ</latin></title>"
    boni:
      - question: "In what work, written in 46 BC, does Cicero outline the long series of successful orators and give a brief history of his own career in oratory?"
        answer: "<title><latin>BRŪTUS / DĒ ŌRĀTŌRE</latin></title>"
      - question: "In what work, written in 45 BC, do Lucilius Balbus the Stoic, Aurelius Cotta the Academic, and Velleius the Epicurean debate their different schools of philosophy?"
        answer: "<title><latin>DĒ NĀTŪRĀ DEŌRUM</latin></title>"
  - tossup:
      question: "Give a synonym of <latin>lītus</latin>"
      answer: "ACTA / ŌRA (MARITIMA) / RĪPA / (H)ARĒNA"
    boni:
      - question: "Give a synonym of <latin>cūnctor</latin>"
        answer: "MOROR"
      - question: "Give a synonym of <latin>dūdum</latin>"
        answer: "DIŪ, NŪPER, MODO, ANTE, ANTEĀ, PRIUS, PRĪDEM"
  - tossup:
      question: "<latin>Respondē Latīnē: Quot sunt cāsūs Linguae Latīnae?</latin>"
      answer: "SEPTEM"
    boni:
      - question: "<latin>Respondē Latīnē: Temporibus Rōmānīs, quot in ūnciās lībra dīvīsa est?</latin>"
        answer: "(IN) DUODECIM"
      - question: "<latin>Respondē Latīnē: Dum legis Aeneidem, vidēs haec verba Vergilī: “Conticuēre omnēs intentīque ōra tenēbant.” Quot dactylī sunt in versū?</latin>"
        answer: "DUO"
  - tossup:
      question: "What regent of Thebes was overthrown by Amphion and Zethus?"
      answer: "LYCUS"
    boni:
      - question: "What Theban princess was the mother of Amphion and Zethus?"
        answer: "ANTIOPE"
      - question: "Who had mistreated Antiope so badly that Amphion and Zethus tied her to a bull to avenge their mother?"
        answer: "DIRCE"
  - tossup:
      question: "Identify the mood and tense of the verb form <latin>audīssem</latin>"
      answer: "PLUPERFECT SUBJUNCTIVE"
    boni:
      - question: "Identify the mood and tense of the form <latin>faxō</latin>"
        answer: "FUTURE PERFECT INDICATIVE"
      - question: "Identify the mood and tense of the form <latin>duim</latin>, spelled <latin>d-u-i-m</latin>"
        answer: "PRESENT SUBJUNCTIVE"
  - tossup:
      question: "Who was the mother of Elagabalus?"
      answer: "JULIA SO(A)EMIAS"
    boni:
      - question: "Name the grandmother of Elagabalus in whose hands he left the control of the Roman government while indulging in strange religious rituals"
        answer: "JULIA MAESA"
      - question: "What group killed both Elagabalus and Julia Soemias, mutilated their bodies, and threw them into the public sewer?"
        answer: "PRAETORIAN GUARD"
  - tossup:
      question: "What author, according to Donatus, died after a fit of madness on the same day Vergil assumed his <latin>toga virīlis</latin>?"
      answer: "(TITUS) LUCRETIUS (CARUS)"
    boni:
      - question: "Into how many books was the unfinished <title><latin>Dē Rērum Nātūrā</latin></title> divided?"
        answer: "SIX"
      - question: "With what major catastrophe of 430 BC does Book 6 end?"
        answer: "THE PLAGUE OF ATHENS (430-429 BC)"
  - tossup:
      question: "Listen carefully to the following inscription from a Roman tomb, and answer IN LATIN the question that follows: <latin>Īnscrīptor, rogō tē ut trānseās hoc monumentum. Cūius candidātī nōmen in hōc monumentō īnscrīptum fuerit, repulsam ferat neque honōrem ūllum umquam gerat.</latin> Question: <latin>Quid in monumentō īnscrībendum nōn est?</latin>"
      answer: "NŌMEN (CANDIDĀTĪ)"
    boni:
      - question: "<latin>Quid īnscrīptōrī necesse est facere?</latin>"
        answer: "TRĀNSĪRE (MONUMENTUM) / UT TRANSEAT"
      - question: "<latin>Quālis honōs candidātō erit sī nōmen eius in hōc monumentō īnscrīptum erit?</latin>"
        answer: "NŪLLUS / NEQUE ŪLLUS / NŌN ŪLLUS"
  - tossup:
      question: "America runs on Dunkin, but the world lives on Starbucks! You are looking for a break from the rigors of Convention and head over to the ARC building for a tasty beverage. Feeling overwhelemed and desperate for a needed reprieve, you decide to order a Tazo™ “Passion” herbal infusion tea. Give the ultimate Latin verb and its meaning from which “infusion” is derived"
      answer: "<latin>FUNDŌ / -ERE</latin> – POUR"
    boni:
      - question: "Accompanying you at Starbucks are your Certamen teammates who are also in need of a pick-me-up. Your first teammate is a connoisseur of the “Classic” list of drinks. From what Latin noun with what meaning is the word “classic” derived?"
        answer: "<latin>CLASSIS</latin> – FLEET / (ORDERED) ROW"
      - question: "Another of your teammates, who happens to be of artistic persuasion, always orders a café caramel macchiato. Intrigued by the look of the drink, she decides to research the etymology of the word “macchiato” only to discover that it means “stained” in Italian and that it further derives from a Latin noun meaning “stain.” What is this Latin noun?"
        answer: "<latin>MACULA</latin>"
  - tossup:
      question: "What type of <latin>ātrium</latin> was covered all over and had neither <latin>implūvium</latin> nor <latin>complūvium</latin>?"
      answer: "<latin>TESTŪDINĀTUM /</latin> TESTUDINATE"
    boni:
      - question: "What type of <latin>ātrium</latin> had four pillars supporting the intersections of the beams that supported the room?"
        answer: "<latin>TETRASTYLON /</latin> TETRASTYLE"
      - question: "What type of <latin>ātrium</latin> differed from the <latin>tetrastylon</latin> in that it had more than four supporting pillars?"
        answer: "<latin>CORINTHIUM /</latin> CORINTHIAN"
  - tossup:
      question: "Spell the accusative singular form of the noun <latin>tussis</latin>"
      answer: "<latin>T-U-S-S-I-M</latin>"
    boni:
      - question: "Spell the accusative singular form of the proper name <latin>Atlās</latin>"
        answer: "<latin>A-T-L-A-N-T-A</latin> or <latin>A-T-L-A-N-T-E-M</latin>"
      - question: "Spell the accusative singular form of the noun <latin>fel</latin>"
        answer: "<latin>F-E-L</latin>"
  - tossup:
      question: "According to Hesiod’s <title>Theogony</title>, the goddess Ate, the personification of moral blindness and delusion, was what goddess’s daughter?"
      answer: "ERIS"
    boni:
      - question: "According to Homer, Ate was whose oldest daughter?"
        answer: "ZEUS"
      - question: "What group of goddesses was sent to follow Ate and to help heal the troubles Ate caused among deluded humanity?"
        answer: "LITAI / THE PRAYERS"
  - tossup:
      question: "Give one impersonal Latin verb that means “it concerns” or “it is for the interest of.”"
      answer: "<latin>INTEREST</latin> / <latin>RĒFERT</latin>"
    boni:
      - question: "Using an impersonal verb, say in Latin, “The emperor pities the dead soldiers.”"
        answer: "<latin>PRĪNCIPEM / IMPERĀTŌREM MISERET MORTUŌRUM MĪLITUM</latin>"
      - question: "Using an impersonal verb, say in Latin, “The poet is ashamed of all his works.”"
        answer: "<latin>POĒTAM PUDET OMNIUM OPERUM (SUŌRUM)</latin>"
  - tossup:
      question: "In which book of the <title>Aeneid</title> does Juppiter send Mercury to remind Aeneas of his destiny?"
      answer: "BOOK 4"
    boni:
      - question: "You are looking at a montage of scenes from Book 4 of the <title>Aeneid</title>. Identify the letter that represents Passage #1"
        answer: "“D”"
      - question: "Identify the letter that represents Passage #2"
        answer: "“C”"
  - tossup:
      question: "Who, as tribune in 103 BC, assigned land in Africa to Marius’ veterans and passed a law to establish a special court for the crime of <latin>maiestās</latin>?"
      answer: "(LUCIUS APPULEIUS) SATURNINUS"
    boni:
      - question: "Who almost succeeded in expelling the violent Saturninus from the Senate?"
        answer: "(QUINTUS CAECILIUS) METELLUS (NUMIDICUS)"
      - question: "What <latin>praetor</latin>, also a supporter of Marius, was in cahoots with Saturninus?"
        answer: "(GAIUS SERVILIUS) GLAUCIA"
  - tossup:
      question: "What two mythological architects, the sons of King Erginus, were credited with the construction of Alcmene’s bridal chamber at Thebes and the temple of Apollo at Delphi?"
      answer: "AGAMEDES & TROPHONIUS"
    boni:
      - question: "For whom did Agamedes and Trophonius build a supposedly impenetrable treasury?"
        answer: "HYRIEUS"
      - question: "What had Agamedes and Trophonius done during the building process that allowed them to enter the treasury of Hyrieus to steal the king’s gold undetected?"
        answer: "THEY INSERTED A MOVABLE STONE INTO THE WALL THEY BUILT  <latin>2009 NJCL CERTAMEN ADVANCED DIVISION</latin>"
