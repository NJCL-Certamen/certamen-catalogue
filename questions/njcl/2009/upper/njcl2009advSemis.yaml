    boni:
      - question: "Who was their mother?"
        answer: "MOLIONE"
      - question: "What mortal was sometimes said to be their father?"
        answer: "ACTOR"
  - tossup:
      question: "Do not open your visuals until you are instructed to do so.   You may now open your visuals and examine it for ten seconds"
      answer: "TU: Who is the probable speaker of these lines? THE HUSBAND OF ATISTIA"
    boni:
      - question: "There are four words in this inscription that show distinct linguistic markers of the second half of the first-century BC. Name two of them and SPELL their counterparts as you would find them in your school textbooks today"
        answer: "<latin>MIHEI</latin> = <latin>MIHĪ</latin>, <latin>OPTVMA</latin> = <latin>OPTIMA</latin>, <latin>VEIXSIT</latin> = <latin>VĪXIT</latin>, <latin>QVOIVS</latin> = <latin>CUIUS</latin> (macrons are not necessary for spellings in this answer because they are non essential)"
      - question: "What do the words <latin>“corporis reliquiae”</latin> imply about the contents of this tomb?"
        answer: "IT HOLDS THE REMAINS OF HER BODY"
  - tossup:
