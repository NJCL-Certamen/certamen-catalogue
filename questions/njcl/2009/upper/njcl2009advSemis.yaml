tournament: "NJCL Certamen"
year: 2009
division: "Advanced"
round: "Semifinals"
questions:
  - tossup:
      question: "Where did the Romans, with the help of a fleet from Rhodes under the command of Eudamas, defeat the naval forces of Antiochus III and thereby secure the command of the seas and prepare for the Roman army’s passage into Asia IN 190 BC?"
      answer: "MYONESSUS"
    boni:
      - question: "Who was the commander of the victorious Roman fleet?"
        answer: "(LUCIUS AEMILIUS) REGILLUS"
      - question: "What former enemy of Rome participated on the losing side of the Battle of Myonessus?"
        answer: "HANNIBAL"
  - tossup:
      question: "What use of the accusative case is found in the following quotation from Cicero?"
      answer: "“<latin>Ō tempora, Ō mōrēs!</latin>” EXCLAMATION"
    boni:
      - question: "What use of the accusative case is found in this quotation from Cicero? “<latin>Quid hoc differt</latin>?”"
        answer: "RESPECT / SPECIFICATION"
      - question: "What use of the accusative case is found in this sentence? “<latin>Mel flōrēs redolet unde collēctum est.</latin>”"
        answer: "KINDRED MEANING / COGNATE"
  - tossup:
      question: "In Book 8 of the <title>Aeneid</title>, who comes to Aeneas in a dream and tells him that he needs to go to Pallanteum and seek the help of Evander?"
      answer: "TIBERINUS / TIBER (RIVER)"
    boni:
      - question: "In Book 11 of the <title>Aeneid</title>, who, out of jealousy, berates Turnus and tries to talk the Rutulians into making peace with the Trojans?"
        answer: "DRANCES"
      - question: "In Book 12 of the <title>Aeneid</title>, whose shape does Juturna assume in an attempt to get Turnus to safety?"
        answer: "TURNUS’ CHARIOTEER / METISCUS"
  - tossup:
      question: "What author included short pieces about philosophy, history, law, grammar, and science in his <title><latin>Noctēs Atticae</latin></title>?"
      answer: "(AULUS) GELLIUS"
    boni:
      - question: "For whose entertainment and instruction did Gellius compose the <title><latin>Noctēs Atticae</latin></title>?"
        answer: "(HIS) CHILDREN"
      - question: "What famous story, originally told by Apion, does Gellius retell in Book 5 of his <title><latin>Noctēs Atticae</latin></title>?"
        answer: "ANDROCLES & THE LION"
  - tossup:
      question: "Listen carefully to the following lines from Book VI of Ovid’s <title><latin>Fastī</latin></title>, which I will read as prose, about a location in Rome. Answer IN ENGLISH the question that follows: <latin>Hoc, ubī nunc fora sunt, ūdae tenuēre palūdēs; amne redundātīs fossa madēbat aquīs. Curtius ille lacus, siccās quī sustinet ārās, nunc solida est tellūs, sed lacus ante fuit.</latin> The question: According to the first half of the passage, what type of terrain predated the location of the Roman fora?"
      answer: "SWAMPS/WETLANDS/MARSHES"
    boni:
      - question: "What is the name given to this location?"
        answer: "LACUS CURTIUS / THE LAKE OF CURTIUS"
      - question: "Translate the last line of the passage, “<latin>nunc solida est tellūs, sed lacus ante fuit.”</latin>"
        answer: "NOW IT IS SOLID EARTH BUT IT WAS PREVIOUSLY A LAKE"
  - tossup:
      question: "Using an adverb, say in Latin “for the longest time.”"
      answer: "<latin>DIŪTISSIMĒ</latin>"
    boni:
      - question: "What is the superlative form of <latin>potius</latin>?"
        answer: "<latin>POTISSIMUM</latin>"
      - question: "What is the comparative form of <latin>secus</latin>?"
        answer: "<latin>SĒTIUS</latin>"
  - tossup:
      question: "What modern city did the Romans call <latin>Vindobona?</latin>"
      answer: "VIENNA"
    boni:
      - question: "What modern city did the Romans call <latin>Deva?</latin>"
        answer: "CHESTER"
      - question: "What modern city did the Romans call <latin>Aquincum?</latin>"
        answer: "BUDAPEST"
  - tossup:
      question: "What Latin author, primarily a dramatist, arrogantly remarked, “<latin>Fātō Metellī Rōmae fīunt cōnsulēs,</latin>” in a work he composed after returning from service in the First Punic War?"
      answer: "(GNAEUS) NAEVIUS"
    boni:
      - question: "Where did Naevius die in 204 BC?"
        answer: "UTICA"
      - question: "In addition to his <title><latin>Bellum Poenicum</latin></title>, Naevius also introduced a new genre of Latin literature with his <title><latin>Romulus</latin></title> and <title><latin>Clastidium</latin></title>. What is the Latin term for this new genre?"
        answer: "<latin>FĀBULA(E) PRAETEXTA(E)</latin>"
  - tossup:
      question: "<latin>Quid Anglicē significat “exuviae”?</latin>"
