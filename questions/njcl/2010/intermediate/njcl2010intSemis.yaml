tournament: "NJCL Certamen"
year: 2010
division: "Intermediate"
round: "Semifinals"
questions:
  - tossup:
      question: "What goddess provided a set of bronze castanets that allowed Heracles to flush out the Stymphalian birds?"
      answer: "ATHENA"
    boni:
      - question: "Who assisted Heracles in cauterizing the necks of the Hydra?"
        answer: "IOLAUS"
      - question: "Heracles first six labors, with the possible exception of the fourth, were performed in what region of Greece?"
        answer: "THE PELOPONNESUS"
  - tossup:
      question: "What third principal part is common to both <latin>cernō</latin> and <latin>crēscō</latin>?"
      answer: "<latin>CRĒVĪ</latin>"
    boni:
      - question: "What fourth principal part do these two verbs share?"
        answer: "<latin>CRĒTUS (-A, -UM)</latin>"
      - question: "What third principal part is common to both <latin>pascō</latin> and <latin>paveō</latin>?"
        answer: "<latin>PĀVĪ</latin>"
  - tossup:
      question: "Using a defective verb, say in Latin “we will hate.”"
      answer: "<latin>ŌDERIMUS</latin>"
    boni:
      - question: "Using a defective verb, say in Latin “let me remember.”"
        answer: "<latin>MEMINERIM</latin>"
      - question: "Using a defective verb, say in Latin “they speak.”"
        answer: "<latin>INQUIUNT/AIUNT/FANTUR</latin>"
  - tossup:
      question: "Against what former ally of Rome did Lucius Calpurnius Bestia lead an expedition in 111 BC?"
      answer: "NUMIDIA (ALSO ACCEPT JUGURTHA)"
    boni:
      - question: "The sack of what city and massacre of its inhabitants had quickly changed the Roman attitude towards Numidia and its king Jugurtha?"
        answer: "CIRTA"
      - question: "Who had taken refuge from Jugurtha in Cirta, a popular town for Italian traders?"
        answer: "ADHERBAL (JUGURTHA’S BROTHER)"
  - tossup:
      question: "Listen carefully to the following passage, which I will read twice, and answer IN LATIN the question that follows: <latin>Māne Aurēlia ē lectō surgit, cōgitāns dē omnibus rēbus quae sibi faciendae sunt. “Per deōs immortālēs!” inquit. “Dēfessissima sum, nam ad multam noctem cum amīcō fuī. Itaque nunc ad lectum redībō ad dormiendum!”</latin>  Question: <latin>Quōcum Aurēlia nocte fuit?</latin>"
      answer: "(<latin>CUM</latin>) <latin>AMĪCŌ</latin>"
    boni:
      - question: "<latin>Cūr Aurēlia in cubiculum redit?</latin>"
        answer: "<latin>AD</latin> <latin>DORMIENDUM</latin> / <latin>UT DORMIAT / DORMĪTUM / DĒFESS(ISSIM)A EST</latin>"
      - question: "<latin>Per quōs Aurēlia iūrat?</latin>"
        answer: "<latin>(PER) DEŌS (IMMORTĀLĒS)</latin>"
  - tossup:
      question: "From what Latin verb do we derive the English words “puny,” “renaissance,” “nascent,” and “nativity”?"
      answer: "<latin>NĀSCOR</latin>"
    boni:
      - question: "From what Latin verb do we derive the English words “approval” and “probity”?"
        answer: "PROBŌ"
      - question: "From what Latin verb do we derive the English words “impertinent,” “incontinent,” and “tennis”?"
        answer: "<latin>TENEŌ</latin>"
  - tossup:
      question: "Which of the Spartoi fathered a king of Thebes who would later be torn apart by his mother and aunts?"
      answer: "ECHION"
    boni:
      - question: "What daughter of Cadmus married Echion?"
        answer: "AGAVE"
      - question: "What long-lived advisor to both Pentheus but also Oedipus was descended from Echion’s “brother” Chthonius?"
        answer: "TIRESIAS"
  - tossup:
      question: "Who was the first emperor to be succeeded by his natural-born son?"
      answer: "VESPASIAN"
    boni:
      - question: "Who was the first emperor to be succeeded by a son-in-law?"
        answer: "AUGUSTUS"
      - question: "Who was the first emperor to be succeeded by someone he chose from outside of his family?"
        answer: "NERVA"
  - tossup:
      question: "Which of the following adjective forms <emphasis>cannot</emphasis> agree with the noun form <latin>rēs</latin>: <latin>aliquās, eaedem, haec, illī</latin>?"
      answer: "<latin>ILLĪ</latin>"
    boni:
      - question: "Which of the following adjective forms, if any, can agree with the noun form <latin>amīce</latin>: <latin>bonī, celere, idōnea, pulcher</latin>?"
        answer: "<latin>PULCHER</latin>"
      - question: "Which of these adjective forms is NOT in the same degree as the others: <latin>ēgregius, meliōra, maius, humilius</latin>?"
        answer: "<latin>ĒGREGIUS</latin>"
  - tossup:
      question: "Please do not open the visual until you are instructed to do so.  Now, please open your visuals and examine the pictures for ten seconds.  Tossup: Let’s take a visual tour of Rome! Picture “A” is of a location you certainly want to visit. In the background stands the famous tomb of Caecilia Metella. Furthermore, many thousands of slaves were crucified along this location after a revolt in 73 BC. Of which road is this a picture?"
      answer: "APPIAN (WAY) / <latin>VIA APPIA</latin>"
    boni:
      - question: "Picture B shows a famous building in the Roman Forum. While it is now the Church of St. Lorenzo, to what two people was this temple previously dedicated?"
        answer: "(DIVINE) ANTONINUS (PIUS) & (HIS WIFE) FAUSTINA"
      - question: "Picture C shows a fountain of Triton in the foreground and a circular temple in the background. The deity to whom this temple is probably dedicated was often called “<latin>Olīvārius</latin>” because he was the protector of olive-oil producers. What deity is this?"
        answer: "HERCULES (VICTOR)"
  - tossup:
      question: "With what athletic nymph did Apollo father the famous beekeper Aristaeus?"
      answer: "CYRENE"
    boni:
      - question: "Where did Apollo carry Cyrene after becoming enamored with her beauty and physical prowess?"
        answer: "AFRICA/LIBYA"
      - question: "By wrestling what creature did Cyrene so impress Apollo?"
        answer: "A LION"
  - tossup:
      question: "Translate the following sentence into English: <latin>Scīs cūr gladiātor mortuus mōtus sit</latin>"
      answer: "YOU KNOW WHY THE DEAD GLADIATOR HAS BEEN MOVED"
    boni:
      - question: "Now translate this sentence: <latin>Rogō num tua māter domī sit</latin>"
        answer: "I AM ASKING WHETHER/IF YOUR MOTHER IS (AT) HOME"
      - question: "Finally, translate this sentence: <latin>Nōn intellegō quōmodo illud fēcerīs</latin>"
        answer: "I DO NOT UNDERSTAND HOW YOU DID THAT"
  - tossup:
      question: "What use of the genitive case would be found in the sentence, “I was building a thirty-one-foot statue”?"
      answer: "GENITIVE OF MEASURE/QUALITY/DESCRIPTION"
    boni:
      - question: "Give that sentence in Latin"
        answer: "<latin>AEDIFICĀBAM STATUAM/SIGNUM</latin>  <latin>TRĪGINTĀ (ET) ŪNĪUS PEDUM</latin> or <latin>ŪNĪUS ET TRĪGINTĀ</latin>"
      - question: "If the sentence had been “I built a thirty-one-foot high statue,” the word “high” would be expressed with the Latin noun <latin>altitūdō.</latin> What case and use would be used for <latin>altitūdō</latin>?"
        answer: "ABLATIVE OF SPECIFICATION/RESPECT"
  - tossup:
      question: "What Campanian city, controlled by the Samnites and besieged by the Romans in 327 B.C. shows its origins as a Greek colony in name, which means “new city”?"
      answer: "<latin>NEĀPOLIS</latin> / NAPLES"
    boni:
      - question: "What war, which started the next year, did this siege precipitate?"
        answer: "SECOND SAMNITE WAR"
      - question: "In what year did the Samnites finally beg for peace in the Second Samnite War?"
        answer: "304 B.C."
  - tossup:
      question: "In what town did Demeter stop and take a job as a babysitter during her search for Persephone?"
      answer: "ELEUSIS"
    boni:
      - question: "What king hired her to take care of his son?"
        answer: "CELEUS"
      - question: "Who was his son, whom Demeter was caught setting in the fire to burn away his mortality?"
        answer: "TRIPTOLEMUS / DEMOPHOÖN"
  - tossup:
      question: "Translate the following sentence from Latin to English: “<latin>Tantī sunt deī ut nōn sit fīnis suae potestātī</latin>.”"
      answer: "THE GODS ARE SO GREAT THAT THERE IS NO END TO/OF THEIR POWER"
    boni:
      - question: "Now, translate, “<latin>Mortālēs quī similēs deīs esse cōnantur, saepe celeriter moriuntur</latin>.”"
        answer: "MORTALS WHO TRY TO BE LIKE / SIMILAR TO THE GODS OFTEN DIE QUICKLY"
      - question: "Finally, translate, “<latin>Urbēs quae deōs deāsque honōrant, multō beātiōrēs sunt</latin>.”"
        answer: "CITIES WHICH HONOR THE GODS AND GODDESSES ARE MUCH HAPPIER / MORE BLESSED"
  - tossup:
      question: "What fourteen-year-old boy’s manners, modesty, and managerial mother helped usher in an age of relative peace between the tumultuous regime of his predecessor Elagabalus and the end of the family’s dynasty in 235 AD?"
      answer: "(MARCUS AURELIUS) SEVERUS ALEXANDER / ALEXANDER SEVERUS"
    boni:
      - question: "Who was this managerial mother, who helped restore the prestige of the Senate by utilizing their support in controlling the frontier armies?"
        answer: "JULIA MAMAEA"
      - question: "Who was responsible for the deaths of both Alexander Severus and Julia Mamaea, thus precipitating forty-nine years of barracks emperors and civil strife?"
        answer: "(GAIUS IULIUS VERUS) MAXIMINUS THRAX"
  - tossup:
      question: "What noun with what meaning is at the root of “reality”?"
      answer: "<latin>RĒS</latin> THING/MATTER/AFFAIR/CIRCUMSTANCE"
    boni:
      - question: "What verb with what meaning is the ultimate root of “gesticulate”?"
        answer: "<latin>GERŌ, -ERE</latin> BEAR/WEAR/WAGE/CARRY/SPEND/DISPLAY/ ENTERTAIN/BRING/ACCOMPLISH"
      - question: "What verb with what meaning is at the root of “torment”?"
        answer: "<latin>TORQUEŌ, -ĒRE</latin> TWIST/WIND/CURL/BEND OUT OF SHAPE/TORTURE/HURL"
  - tossup:
      question: "What warrior, trained in warfare from a young age by Metabus, killed many Trojan warriors while she was fighting for Turnus and the Latins?"
      answer: "CAMILLA"
    boni:
      - question: "What Trojan killed Camilla?"
        answer: "ARRUNS"
      - question: "What goddess, according to the <title>Aeneid</title>, sent her helper to avenge Camilla by killing Arruns?"
        answer: "DIANA"
  - tossup:
      question: "What Latin phrase is used in English to refer to a constant companion, whether a book or a friend?"
      answer: "<latin>VĀDE MĒCUM</latin>"
    boni:
      - question: "What Latin phrase, literally meaning “remember to die,” describes any reminder of mortality, such as skulls or timepieces featured in paintings?"
        answer: "<latin>MEMENTŌ MORĪ</latin>"
      - question: "The Latin phrase <latin>in caudā venēnum</latin> reminds one to stay alert through the entirety of a situation, whether one is engaging in a policy debate or dodging the sting of a scorpion. Translate this Latin phrase"
        answer: "<latin>VENOM/POISON/RUIN (IS) IN/AT THE TAIL/END</latin>  <latin>2010 NJCL CERTAMEN INTERMEDIATE DIVISION FINALS</latin>"
  - tossup:
      question: "The 2012 NJCL Convention will be held in North Carolina. Give both the Latin and the English for the motto of North Carolina"
      answer: "<latin>ESSE QUAM VIDĒRĪ</latin> – TO BE RATHER THAN TO SEEM/BE SEEN"
    boni:
      - question: "South Carolina has two official Latin mottoes. For five points each, give both the Latin and English for each motto"
        answer: "<latin>DUM SPĪRŌ, SPĒRŌ</latin> – WHILE I BREATHE, I HOPE <latin>ANIMĪS OPIBUSQUE PARĀTĪ</latin> – PREPARED IN MIND/SPIRIT(S) AND RESOURCES"
  - tossup:
      question: "In whose triumph did Tetricus, the last leader of the so-called Gallic Empire, walk, alongside the similarly deposed queen of Palmyra, Zenobia?"
      answer: "AURELIAN’S / LUCIUS DOMITIUS AURELIANUS’"
    boni:
      - question: "After his triumph, Aurelian treated both Tetricus and Zenobia with surprising magnanimity. In what town near Rome did Aurelian set up a residence for Zenobia?"
        answer: "TIBUR / TIVOLI"
      - question: "Name one of the two Latin honorific titles Aurelian received in recognition of his conquests in the East, before he was ultimately awarded the well-known title <latin>Restitūtor Orbis</latin> two years later"
        answer: "<latin>RESTITŪTOR ORIENTIS, PARTHICUS MAXIMUS</latin>"
  - tossup:
      question: "Under what name was the god Dionysus first born to Kore and Zeus, according to the Orphic mysteries, but later dismembered and devoured by the devious Titans?"
      answer: "ZAGREUS"
    boni:
      - question: "What part of the baby Zagreus, which had been recovered by Athena, did Zeus use to recreate him in the body of Semele?"
        answer: "HEART"
      - question: "What creatures rose from the ashes of the Titans who had been destroyed by Zeus’ thunderbolts for their crime?"
        answer: "MAN(KIND)/HUMANS"
  - tossup:
      question: "Translate this sentence into English: <latin>Cicerō cōnsul factus est reī pūblicae servandae causā</latin>. Model answer: “Cicero was made consul for the sake of saving the republic”"
      answer: "CICERO WAS/HAS BEEN MADE/BECAME CONSUL FOR (THE SAKE OF) SAVING THE REPUBLIC/STATE / TO SAVE/GUARD/PROTECT THE REPUBLIC"
    boni:
      - question: "Now, translate the dependent clause “to save the republic” using the preposition <latin>ad</latin> and a gerund"
        answer: "<latin>AD REM PŪBLICAM SERVANDUM</latin>"
      - question: "Finally, translate the dependent clause “to save the republic” using a relative clause of purpose"
        answer: "<latin>QUĪ REM PŪBLICAM SERVĀRET</latin>"
  - tossup:
      question: "What name was given to the type of Roman schoolteacher who would use a variety of Greek and Roman authors in teaching literature and composition?"
      answer: "<latin>GRAMMĀTICUS</latin>"
    boni:
      - question: "Roman boys who continued their education past the age of fifteen would study what topic?"
        answer: "RHETORIC / ORATORY / PUBLIC SPEAKING / DEBATE"
      - question: "Besides the <latin>paedagōgus</latin>, what slave might accompany a wealthy child to school in order to carry his books?"
        answer: "<latin>PEDISEQUUS</latin>"
  - tossup:
      question: "Give the Latin verb and its meaning at the root of “mince,” “menu,” and “diminish.”"
      answer: "<latin>MINUŌ/MINUERE</latin> - TO LESSEN / MAKE SMALLER"
    boni:
      - question: "The name of what courtly dance, popular in the seventeenth and eighteenth centuries, ultimately comes from that same Latin verb?"
        answer: "MINUET"
      - question: "What English word, borrowed directly from Latin and related to that same verb, means “trifles, details, or the particulars of a situation”?"
        answer: "MINUTIA(E)"
  - tossup:
      question: "What man in Homer’s <title>Odyssey</title> scolded Eumaeus and Philoetius for weeping over the bow of Odysseus, a weapon that would claim his life first of all the suitors?"
      answer: "ANTINOUS"
    boni:
      - question: "Who, specifically, was Eumaeus?"
        answer: "ODYSSEUS’ <emphasis>SWINE</emphasis>HERD"
      - question: "The swineherd Eumaeus and the cowherd Philoetius were loyal to Odysseus, but what goatherd transferred his allegiance to the suitors?"
        answer: "MELANTHIUS"
  - tossup:
      question: "What use of the ablative can be found in the following Latin sentence: <latin>Aurēlia dīxit sē</latin> <latin>dēspicere puerōs calceīs veteribus</latin>?"
      answer: "DESCRIPTION/QUALITY"
    boni:
      - question: "What use of the ablative can be found in the following Latin sentence: <latin>Quantō calceī puerōrum sordidiōrēs fiēbant, tantō Aurēlia eōs vituperābat</latin>?"
        answer: "DEGREE OF DIFFERENCE"
      - question: "What two uses of the ablative can be found in the following Latin sentence: <latin>Calceīs pluviō lavātīs, Aurēlia cōnstituit saltāre</latin>?"
        answer: "ABLATIVE ABSOLUTE & MEANS"
  - tossup:
      question: "What Roman, during the Second Punic War, led a force from Emporiae to capture Tarraco and defeated Hasdrubal in a naval battle before finally joining his brother Publius, the proconsul in charge of the campaign?"
      answer: "GNAEUS (CORNELIUS) SCIPIO CALVUS (n.b. Only one of “Scipio” or “Calvus” is required)"
    boni:
      - question: "Where did the two brothers defeat Hasdrubal in 211 BC by breaking through his center, which he had weakened in an unsuccessful attempt to emulate the tactics of Hannibal at Cannae?"
        answer: "DERTOSA / IBERA"
      - question: "Where in Spain was Gnaeus defeated and killed by Carthaginian forces under Hasdrubal?"
        answer: "CARTHAGO NOVA / CARTAGENA / ILORCA / ILOURGEIA / ILORCI"
  - tossup:
      question: "Listen carefully to the following passage, which I shall read twice, and answer IN LATIN the question that follows: <latin>Ubi potentia Catilīnae crēscēbat, aliquot mulierēs eī sē coniūnxērunt, quibus aes aliēnum magnum erat. Per eās Catilīna spērābat sē servōs urbānōs sollicitātūrum esse, urbem incēnsūrum, et virōs interfectūrum.</latin>  Question: <latin>Quae aes aliēnum habēbant?</latin>"
      answer: "(<latin>ALIQUOT/MULTAE</latin>) <latin>MULIERĒS / FĒMINĀE</latin> (<latin>CATILĪNAE</latin>)"
    boni:
      - question: "<latin>Quō auctō mulierēs Catilīnae sē coniūnxērunt?</latin>"
        answer: "<latin>POTENTIĀ / AERE ALIĒNĀ</latin> (<latin>FĒMINĀRUM</latin>)"
      - question: "<latin>Respondē Anglicē. Dīc mihi trēs rēs quās Catilīna auxiliō fēminārum facere volēbat?</latin>"
        answer: "ROUSE URBAN SLAVES, BURN THE CITY, KILL MEN"
  - tossup:
      question: "Please do not open the visual until you are instructed to do so.  Now, please open your visuals and examine the picture for ten seconds.  Tossup: If the figure labeled “D” is the goddess Artemis, identify the figure labeled"
      answer: "“C” IPHIGENIA/IPHIANASSA"
    boni:
      - question: "Identify the figures labeled “A” and"
        answer: "“E” A = CLYTEMNESTRA; E = AGAMEMNON"
      - question: "Apropos to this myth, what is the figure labeled “B” doing?"
        answer: "(A NYMPH) IS <emphasis>BRINGING</emphasis> <emphasis>A</emphasis> <emphasis>STAG</emphasis> TO <emphasis>SUBSTITUTE</emphasis> FOR <emphasis>IPHIGENIA</emphasis> (ON THE SACRIFICIAL ALTAR)"
  - tossup:
      question: "Which of the following words, if any, is not from the same Latin root as the others: conversant, divorce, varsity, revulsion, vertical?"
      answer: "REVULSION"
    boni:
      - question: "From what Latin verb with what meaning do we derive “conversant,” “divorce,” “varsity,” and “vertical”?"
        answer: "<latin>VERTŌ</latin> – TO TURN"
      - question: "What English noun derived from <latin>vertō</latin> can refer to any distraction designed to redirect someone’s attention?"
        answer: "DIVERSION"
  - tossup:
      question: "Who died in Rhegium in the same year as her father, sixteen years after her initial exile to the island of Pandateria in 2 BC?"
      answer: "JULIA, THE ELDER / MAIOR / DAUGHTER OF AUGUSTUS (AND SCRIBONIA)"
    boni:
      - question: "Name the five children of Julia and Agrippa"
        answer: "GAIUS CAESAR, LUCIUS CAESAR, AGRIPPINA THE ELDER/MAIOR, AGRIPPA POSTUMUS, JULIA/JULILLA"
      - question: "Which of these five children, exiled in 7 AD to the island of Planasia because of brutish behavior, was killed upon the death of Augustus?"
        answer: "AGRIPPA POSTUMUS"
  - tossup:
      question: "Differentiate in meaning between the Latin verbs <latin>ardeō</latin> and <latin>arceō</latin>"
      answer: "<latin>ARDEŌ</latin> – BURN/GLOW/BE ON FIRE <latin>ARCEŌ</latin> – CONFINE/KEEP AWAY/HOLD OFF/HINDER/PREVENT"
    boni:
      - question: "Differentiate in meaning between the Latin verbs <latin>orior</latin> and <latin>ōrō</latin>"
        answer: "<latin>ORIOR</latin> – RISE/BE BORN/PROCEED/BEGIN/APPEAR <latin>ŌRŌ</latin> – BEG/PRAY/PLEAD/ARGUE WITH/"
      - question: "Differentiate in meaning between the Latin verbs <latin>tendō</latin> and <latin>terō</latin>"
        answer: "<latin>TENDŌ</latin> – TO STRETCH/STRIVE/AIM/SHOOT/TUNE/TRAVEL/ FIGHT  <latin>TERŌ</latin> – TO RUB/WEAR DOWN/SMOOTH/POLISH/SHARPEN"
  - tossup:
      question: "For the verb <latin>proficīscor</latin>, give the 2nd person plural perfect subjunctive"
      answer: "<latin>PROFECTĪ SĪTIS</latin>"
    boni:
      - question: "Make <latin>profectī sītis</latin> present"
        answer: "<latin>PROFICĪSCĀMINĪ</latin>"
      - question: "Make <latin>proficīscāminī</latin> imperfect"
        answer: "<latin>PROFICĪSCERĒMINĪ</latin>"
  - tossup:
      question: "Who became a man, a horse, a bird, an ox, and a stag all to help feed her starving father, using her ability to shape-shift to escape from her masters so that she could be sold over and over again?"
      answer: "MESTRA"
    boni:
      - question: "According to Ovid, what god transformed her each time?"
        answer: "NEPTUNE"
      - question: "Mestra eventually married what man, who, according to some stories, was also able to transform his own shape as disguise?"
        answer: "AUTOLYCUS"
  - tossup:
      question: "When recognized by the spotter, perform the following commands: Surge et dīc Anglicē, “Spectāte vestrōs sociōs; nunc spectāte meōs.”"
      answer: "STUDENT SHOULD STAND AND SAY IN ENGLISH, “LOOK AT YOUR TEAM(MATES); NOW LOOK AT MINE.”"
    boni:
      - question: "Now perform these commands: <latin>Surge et, velut rēgīna Brittānica, dīc tuam patriam optimam esse</latin>"
        answer: "ONE PLAYER SHOULD STAND AND, JUST LIKE THE QUEEN OF ENGLAND, SHOULD SAY THAT HIS/HER COUNTRY IS THE BEST"
      - question: "Now perform these commands: <latin>Surge et simulā tē corōnam auream in capite comitis pōnere.</latin>"
        answer: "ONE PLAYER SHOULD STAND AND PRETEND THAT (S)HE IS PLACING A GOLDEN CROWN ON A TEAMMATE’S HEAD"
  - tossup:
      question: "Who attempted to assault a maiden named Eriboea while sailing on a ship laden with the tribute of seven young men and seven young women?"
      answer: "MINOS"
    boni:
      - question: "When Theseus intervened on Eriboea’s behalf, Minos essentially claimed immunity for his behavior because he was descended from Zeus. How did Minos challenge Theseus to prove his own rival claims of divine parentage?"
        answer: "THREW A RING INTO THE SEA FOR THESEUS TO RETRIEVE (WHICH HE DID WITH THE HELP OF DOLPHINS/POSEIDON)"
      - question: "What lesser-known item, which is sometimes said to have assisted Theseus in navigating the labyrinth, did the hero receive from Amphitrite during his visit to the kingdom of Poseidon?"
        answer: "LIGHTED/LUMINOUS/GOLD CROWN/WREATH"
  - tossup:
      question: "Whose career as tribune began in 103 BC with legislation to provide land settlements to Marius’ veterans and ended with a <latin>senātūs cōnsultum ultimum</latin> and a shower of roof tiles?"
      answer: "(LUCIUS APPULEIUS) SATURNINUS"
    boni:
      - question: "What leader of the Senate had proposed the <latin>senātūs cōnsultum ultimum</latin> against Saturninus?"
        answer: "(MARCUS AEMILIUS) SCAURUS"
      - question: "Whose illegal bid for the consulship did Saturninus support using rough and heavy tactics, contributing to a climate of mob violence that ultimately led to the <latin>senātūs cōnsultum ultimum</latin>?"
        answer: "(GAIUS SERVILIUS) GLAUCIA’S"
  - tossup:
      question: "World Cup fever, though not vuvuzelas, has come to the NJCL convention. Say in Latin, “For a long time all the men ran as quickly as possible.”"
      answer: "<latin>OMNĒS/CŪNCTĪ (VIRĪ/HOMINĒS) QUAM CELERRIMĒ/VELŌCISSIMĒ/RAPIDISSIMĒ/CITISSIMĒ DIŪ CURRĒBANT / CUCURRĒRUNT</latin>"
    boni:
      - question: "Now say in Latin, using the first-declension noun <latin>vuvuzēla, vuvuzēlae</latin>, feminine, “The vuvuzela is the sweetest of all horns.”"
        answer: "<latin>VUVUZĒLA DULCISSIMA/SUĀVISSIMA EST OMNIUM CORNUUM/TUBĀRUM/BUCCINĀRUM</latin>"
      - question: "Finally, using the noun <latin>arbiter</latin> for referee, say in Latin, “The referee seems to see rather badly.”"
        answer: "<latin>ARBITER PEIUS VIDĒRE VIDĒTUR</latin>"
