  - tossup:
      question: "Listen carefully to the following passage based on Martial about the Argo, which I will read twice, and answer IN ENGLISH the question that follows: <latin>Hoc fragmentum quod inūtile lignum putās, ōlim fuit prīma nāvis maris. Quam nec undae frangere potuēre nec īra maris, saecula vīcērunt: sed quamvīs cesserit annīs, sanctior est haec parva tabella quam nāvis salva.</latin> Question: What happened to the ship over time?"
