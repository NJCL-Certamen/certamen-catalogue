tournament: "NJCL Certamen"
year: 2010
division: "Advanced"
round: "Semifinals"
questions:
  - tossup:
      question: "About what victory, in which 30,000 <latin>optimātēs</latin> under Labienus died, is Caesar reported to have said, “On other occasions I have fought for victory, but here I fought for life”?"
      answer: "MUNDA"
    boni:
      - question: "Who escaped to Sicily and was the only major general from the losing side to survive the battle of Munda?"
        answer: "SEXTUS POMPEIUS"
      - question: "What Pontifex Maximus was instrumental in Agrippa’s victory over Sextus Pompeius at Naulochus in 36 BC, though he rarely seems to receive credit?"
        answer: "(MARCUS AEMILIUS) LEPIDUS"
  - tossup:
      question: "Of the verbs <latin>saepiō, cingō, dīvellō</latin>, and <latin>abdō</latin>, which is being described in the following sentence? <latin>mīlitī balteum circumdō</latin>"
      answer: "<latin>CINGŌ</latin>"
    boni:
      - question: "Of the verbs <latin>saepiō, cingō, dīvellō</latin>, and <latin>abdō</latin>, give the principal parts of the verb that means “to pluck out, to extirpate.”"
        answer: "<latin>DĪVELLŌ, DĪVELLERE, DĪVELLĪ / DĪVULSĪ, DĪVULSUS –A –UM</latin> or <latin>DĪVOLSUS –A –UM</latin>"
      - question: "What Latin noun, related to one of the above verbs, refers to a hedge?"
        answer: "<latin>SAEPĒS / SAEPS / SAEPICULA</latin> (<latin>saeptiō</latin> and <latin>saeptum</latin> are hedged-in places, but not hedges)"
  - tossup:
      question: "What descendant of Melampus married Adrastus’ sister Eriphyle and agreed to abide by her decisions in any instance in which he and Adrastus disagreed?"
      answer: "AMPHIARAÜS"
    boni:
      - question: "Why did Eriphyle insist upon Amphiaraüs’ participation in the attack on Thebes?"
        answer: "<emphasis>POLYNEICES BRIBED</emphasis> HER WITH THE <emphasis>NECKLACE OF HARMONIA</emphasis>"
      - question: "Name the two sons of Amphiaraüs and Eriphyle whom Amphiaraüs charged with avenging his impending death"
        answer: "ALCM(A)EON, AMPHILOCHUS"
  - tossup:
      question: "What author, whom Quintilian called “<latin>vir Rōmānōrum ērudītissimus</latin>,” published some seventy-four books on topics such as grammar, history, philosophy, geography, and law?"
      answer: "(MARCUS TERENTIUS) VARRO"
    boni:
      - question: "Among Varro’s surviving works are some 600 fragments of what specific genre, consisting of sketches in either dialogue or dramatic form criticizing the negative values of his own time?"
        answer: "<latin>SATURAE MENIPPEAE</latin> / MENIPPEAN SATIRE (prompt on “satire”)"
      - question: "Why is so much of Varro’s voluminous writing now lost to us?"
        answer: "HIS <emphasis>LIBRARY</emphasis> (AT REATE) WAS <emphasis>DESTROYED</emphasis> (BY 2ND TRIUMVIRATE / MARK ANTONY)"
  - tossup:
      question: "Translate the following sentence into idiomatic English: <latin>Sī Aeneās quam nāvem solvisset, Dīdō sine dubiō animadvertisset</latin>"
      answer: "IF AENEAS HAD LAUNCHED <emphasis>ANY</emphasis> SHIP, DIDO WITHOUT DOUBT / INDUBITABLY/SURELY/CERTAINLY / FO’ SHO’ WOULD HAVE NOTICED / BLAMED (HIM / IT)"
    boni:
      - question: "Now translate this sentence into English: <latin>Sī Pygmaliōn nāvem Dīdōnis intercipiat, multum aurī inveniat</latin>"
        answer: "IF PYGMALION SHOULD INTERCEPT DIDO’S SHIP, HE WOULD FIND MUCH GOLD"
      - question: "Finally, translate this sentence: <latin>Sī ductōrēs Africānī paulō sapientiōrēs essent, rēgīna fīnēs nōn habēret.</latin>"
        answer: "IF THE AFRICAN CHIEFTAINS/LEADERS WERE A LITTLE WISER, THE QUEEN WOULD HAVE NOT HAVE TERRITORY/LAND/BORDERS/ENDS"
  - tossup:
      question: "Please do not open the visual until you are instructed to do so.  Now, please open your visuals and examine the inscription for ten seconds.  Tossup: As found in this inscription, give the gender and case of <latin>trīs</latin>?"
