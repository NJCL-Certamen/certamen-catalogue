tournament: "NJCL Certamen"
year: 2011
division: "Intermediate"
round: "Round 3"
questions:
  - tossup:
      question: "What English derivative of <latin>tempus</latin> is an adjective meaning “performed with little or no advance preparation”?"
      answer: "<latin>EXTEMPORANEOUS</latin> "
    boni:
      - question: "The noun “tense” also comes from <latin>tempus</latin>, but the adjective “tense” is derived from a Latin verb. Name it"
        answer: "<latin>TENDŌ</latin> "
      - question: "What derivative of <latin>tendō</latin> is a synonym for the English word “omen”?"
        answer: "PORTENT "
  - tossup:
      question: "What was Bellerophon named before he killed a man called Bellerus?"
      answer: "HIPPONOÜS"
    boni:
      - question: "What king sent Bellerophon to kill the Chimera?"
        answer: "IOBATES"
      - question: "After Bellerophon proved to Iobates that there was no task he could send him on that would kill him, what daughter did Iobates promise him in marriage?"
        answer: "ANTICLEA / CASANDRA / PHILONOË"
  - tossup:
      question: "One of the seven states that border Kentucky is Virginia. What is Virginia’s Latin motto and its meaning?"
      answer: "<latin>SĪC SEMPER TYRANNĪS -</latin> THUS ALWAYS TO TYRANTS"
    boni:
      - question: "Indiana’s English motto might be rendered in Latin as “<latin>Trīvium Americae</latin>.” What would that mean?"
        answer: "CROSSROADS OF AMERICA"
      - question: "Let’s leave the borders of Kentucky for the West. What is the Latin motto and its meaning for the state of Idaho?"
        answer: "<latin>ESTŌ PERPETUA</latin> – LET IT BE / IT SHALL BE / BE IT / FOREVER / ETERNAL"
  - tossup:
      question: "Who became archon of Athens in 111 or 112 A.D., two years before he was named governor of Syria and about six years before he became emperor?"
      answer: "(PUBLIUS AELIUS) HADRIAN(US)"
    boni:
      - question: "Hadrian had earlier rushed to inform Trajan of what man’s death in 98 A.D.?"
        answer: "(MARCUS COCCEIUS) NERVA’S"
      - question: "Trajan delayed the announcement of his successor until the end of his life, which gave rise to a rumor that his wife had kept his death secret until the adoption of Hadrian became certain. Name this wife of Trajan"
        answer: "(POMPEIA) PLOTINA"
  - tossup:
      question: "Using the verb <latin>iubeō</latin>, translate this sentence into Latin: They are ordering the consul to remain in the province"
      answer: "<latin>CŌNSULEM MANĒRE IN PRŌVINCIĀ</latin> IUBENT "
    boni:
      - question: "Now translate the same sentence using the verb <latin>imperō</latin>. "
        answer: "<latin>CŌNSULĪ</latin> IMPERANT <latin>UT IN PRŌVINCIĀ</latin> MANEAT "
      - question: "Translate the relative clause in this sentence into Latin: The consul thinks that men who cannot fight ought not to command"
        answer: "<latin>QUĪ PUGNĀRE NŌN POSSINT/QUEANT / NEQUEANT</latin> "
  - tossup:
      question: "What hero, the founder of Mycenae, made a name for himself by killing a monster that could turn men to stone with only a look?"
      answer: "PERSEUS"
    boni:
      - question: "What king had asked Perseus to kill Medusa?"
        answer: "POLYDECTES"
      - question: "Polydectes asked Perseus to kill the Gorgon because Perseus was unable to contribute what to the bride-gift for Hippodameia?"
        answer: "HORSES"
  - tossup:
      question: "Make the phrase <latin>“rēs pūblica vetus</latin>” nominative plural"
      answer: "<latin>RĒS PŪBLICAE VETERĒS</latin> "
    boni:
      - question: "Keeping the number the same, change that phrase to the genitive. "
        answer: "<latin>RĒRUM PŪBLICĀRUM VETERUM</latin> "
      - question: "Make the same phrase ablative singular."
        answer: "<latin>RĒ PŪBLICĀ VETERE / VETERĪ</latin> "
  - tossup:
      question: "What name is given to nouns such as <latin>mūnusculum, ātriolum, rīvulus</latin>, and <latin>fīliola</latin>?"
      answer: "DIMINUTIVE"
    boni:
      - question: "What does the ending <latin>-ōsus</latin> indicate, as in <latin>fluctuōsus</latin> and <latin>perīculōsus</latin>?"
        answer: "PLENITUDE / ABUNDANCE / “FULL OF” / “PRONE TO”"
      - question: "Complete this analogy: <latin>audeō</latin> : <latin>audāx</latin> :: <latin>pugnō</latin> : _____?"
        answer: "<latin>PUGNĀX</latin> "
  - tossup:
      question: "Besides <latin>toga pūra</latin>, give a name for the toga that was assumed by men when they came of age"
      answer: "<latin>TOGA LĪBERA/VIRĪLIS</latin> "
    boni:
      - question: "Give another name for the <latin>toga splendēns</latin>, which was worn by those seeking political office"
        answer: "<latin>TOGA CANDIDA</latin>"
      - question: "Give another name for the <latin>toga sordida</latin>, which was worn by those in mourning"
        answer: "<latin>TOGA PULLA</latin> "
  - tossup:
      question: "Homer’s <title>Iliad</title> clearly states that the future of the Trojan race rested in the leadership of what son-in-law of Priam?"
      answer: "AENEAS"
    boni:
      - question: "(PASS OUT THE VISUAL) Why is the figure labeled “B” crippled?"
        answer: "JUPITER / ZEUS ZAPPED HIM FOR BRAGGING ABOUT HIS AFFAIR WITH VENUS / APHRODITE"
      - question: "What are figures “B” and “C”, respectively, carrying?"
        answer: "B – CARRIES THE PENATES / HOUSEHOLD GODS; C – CARRIES THE FIRE OF VESTA"
  - tossup:
      question: "Because the breadth and instability of the Empire had begun to require multiple rulers, who chose Maximian as his imperial colleague in 286 A.D.?"
      answer: "(GAIUS AURELIUS VALERIUS) DIOCLETIAN(US AUGUSTUS)"
    boni:
      - question: "What title had Maximian held from 285 until he was promoted to Augustus?"
        answer: "CAESAR"
      - question: "What other man became Caesar under Maximian upon his promotion to Augustus?"
        answer: "(MARCUS FLAVIUS VALERIUS) CONSTANTIUS I (HERCULIUS AUGUSTUS) / CONSTANTIUS CHLORUS"
  - tossup:
      question: "Translate the following sentence into English: <latin>Ad Graeciam nāvigābunt ut loca nōta vīsitent</latin>"
      answer: "THEY WILL SAIL TO GREECE TO / SO THAT THEY MAY VISIT (THE) FAMOUS PLACES "
    boni:
      - question: "Translate: <latin>Flavia mīrāta</latin> est <latin>quārē Cornēlia in lectō mānsisset</latin>"
        answer: "FLAVIA WONDERED WHY CORNELIA HAD REMAINED IN BED"
      - question: "Translate: <latin>Flavia sē multa loca vīsūram esse scīvit.</latin>"
        answer: "FLAVIA KNEW THAT SHE WOULD SEE MANY PLACES / LOCATIONS"
  - tossup:
      question: "According to Ovid, lilies, multicolored flowers, amber droplets, and painted balls were only some of the gifts that what man gave to a statue he had carved and then fallen in love with?"
      answer: "PYGMALION"
    boni:
      - question: "To whom did Pygmalion pray in the hope of finding a woman just like his beloved statue?"
        answer: "VENUS"
      - question: "Pygmalion’s wildest dreams were surpassed when the statue came to life, perhaps because he lived on what island sacred to Venus?"
        answer: "CYPRUS"
  - tossup:
      question: "Using the Latin verb <latin>videō</latin>, say in Latin “they seem.”"
      answer: "VIDENTUR "
    boni:
      - question: "Now using the verb <latin>comprehendō</latin>, say “they will be arrested”"
        answer: "<latin>COMPREHENDENTUR</latin>"
      - question: "Now using the verb <latin>relinquō</latin>, say “they were about to leave”"
        answer: "<latin>RELICTŪRĪ/-AE/-A ERANT</latin> "
  - tossup:
      question: "What English word derived from “<latin>arma</latin>” means “a temporary stopping of warfare by mutual agreement”?"
      answer: "<latin>ARMISTICE</latin> "
    boni:
      - question: "What is the Latin root verb also present in “armistice”?"
        answer: "<latin>STŌ</latin> "
      - question: "What other derivative of <latin>arma</latin> means “a fleet of warships”?"
        answer: "<latin>ARMADA</latin> "
  - tossup:
      question: "In what war did Rome suffer crushing defeats at Lautulae and Caudine Forks?"
      answer: "SECOND SAMNITE"
    boni:
      - question: "Which defeat happened first?"
        answer: "CAUDINE FORKS"
      - question: "What Samnite commander tricked and defeated the Romans at the Caudine Forks?"
        answer: "(GAVIUS) PONTIUS"
  - tossup:
      question: "Give a deponent synonym for “<latin>oppugnō</latin>.”"
      answer: "<latin>AGGREDIOR / ADORIOR</latin> "
    boni:
      - question: "Give a deponent synonym for “<latin>discēdō</latin>.”"
        answer: "<latin>ĒGREDIOR / PRŌFICĪSCOR</latin> "
      - question: "Give a synonym for “<latin>vereor</latin>.”"
        answer: "<latin>TIMEŌ / PERTIMĒSCŌ / METUŌ</latin> "
  - tossup:
      question: "Who had a rude awakening – or a rude unawakening – when he fell to his death after sleeping drunk on the roof of Circe?"
      answer: "ELPENOR"
    boni:
      - question: "Who in the <title>Odyssey</title> tells Odysseus of Elpenor’s death?"
        answer: "(THE GHOST OF) ELPENOR"
      - question: "When he encounters Odysseus in the Underworld, what does Elpenor ask of him?"
        answer: "TO BURY HIM (PROPERLY)"
  - tossup:
      question: "Name two traits described as “great” of the wild oxen"
      answer: "STRENGTH, SPEED, or SIZE"
    boni:
      - question: "How do the wild oxen compare to elephants and bulls, respectively?"
        answer: "A BIT SMALLER THAN AN ELEPHANT SIMILAR IN SHAPE / LOOK / COLOR TO A BULL"
      - question: "What does the last sentence tell us about the <latin>ūrī</latin>?"
        answer: "THEY ARE <emphasis>AGGRESSIVE</emphasis> ANIMALS TO BOTH MAN AND BEAST / THEY ARE FEARFUL OF NO CREATURES / THEY WILL ATTACK"
  - tossup:
      question: "What in Rome could be described as <latin>russāta, albāta, veneta</latin>, and <latin>prasina</latin> when they competed against each other?"
      answer: "CHARIOT FACTIONS / <latin>FACTIŌNĒS</latin> "
    boni:
      - question: "Which of the factions from the tossup was the blue one?"
        answer: "<latin>VENETA</latin> "
      - question: "<latin>Respondē Anglicē.</latin> What two faction colors were added by the emperor Domitian?"
        answer: "PURPLE and GOLD <latin>2011 NJCL CERTAMEN INTERMEDIATE DIVISION</latin>"
