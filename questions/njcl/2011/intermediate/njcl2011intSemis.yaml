      - question: "After the emperor Nero crowned Tiridates as king of Armenia in 66 A.D., what did he tell Corbulo to do when they met in Greece?"
        answer: "KILL HIMSELF"
  - tossup:
      question: "Which of the following, if any, does not belong by etymology: joust, perjury, adjust, conjuror, or jurisprudence?"
