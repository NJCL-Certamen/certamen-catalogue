tournament: "NJCL Certamen"
year: 2011
division: "Intermediate"
round: "Semifinals"
questions:
  - tossup:
      question: "Who in the Underworld is punished by having his liver eaten by two vultures every day?"
      answer: "TITYUS"
    boni:
      - question: "What was Tityus’ offense?"
        answer: "HE TRIED TO RAPE LETO / LATONA (AT HERA’S / JUNO’S BEHEST)"
      - question: "Into what were the Lycian peasants transformed when they refused to let Leto drink from a well?"
        answer: "FROGS"
  - tossup:
      question: "Give a synonym for the adjective <latin>fīnitimus</latin>"
      answer: "<latin>PROPINQUUS</latin> / <latin>VĪCĪNUS / SIMILIS / PROXIMUS / COGNĀTUS</latin> "
    boni:
      - question: "Give a monosyllabic synonym for the adjective <latin>aequus</latin>"
        answer: "<latin>PĀR</latin> "
      - question: "What is the meaning of the noun <latin>pār</latin>, as in the phrase <latin>pār columbārum</latin>?"
        answer: "PAIR"
  - tossup:
      question: "In the <title>Aeneid</title>, who sends Venulus to ask Diomedes for help in the coming war in Italy?"
      answer: "TURNUS"
    boni:
      - question: "What wicked Etruscan king and ally of Turnus did Aeneas kill in single combat?"
        answer: "MEZENTIUS"
      - question: "What other ally of Turnus was a companion of Diana until she was killed by Arruns?"
        answer: "CAMILLA"
  - tossup:
      question: "<latin>Respondēns Latīnē, dīc</latin> mihi quot <latin>cōnsulēs in ūnō annō in rē pūblicā Rōmāna</latin> fuerint"
      answer: "<latin>DUO (ERANT / FUĒRUNT)</latin>  "
    boni:
      - question: "<latin>Bene factum! Nunc dīc</latin> mihi <latin>nōmina honōrum in</latin> ordine <latin>in cursū honōrum</latin>. "
        answer: "<latin>QUAESTOR, (AEDĪLIS), PRAETOR, CŌNSUL</latin>  (also accept opposite order) "
      - question: "<latin>Quam in prōvinciam Cicerō prō quaestōre īvit</latin>?"
        answer: "IN SICILIAM (<latin>ĪVIT</latin>) "
  - tossup:
      question: "Translate the first line into English"
      answer: "I WONDER / AM AMAZED, O WALL, THAT YOU HAVE NOT FALLEN DOWN FROM RUIN / DECAY"
    boni:
      - question: "According to line 2 of this inscription, what does this wall do?"
        answer: "IT SUSTAINS / HOLDS UP THE BORING THINGS / WEARINESS OF SO MANY WRITERS / A LOT OF BORING GRAFFITI"
      - question: "Which two of the seven cases of Latin are NOT found in this inscription?"
        answer: "DATIVE & LOCATIVE"
  - tossup:
      question: "Which of the following, if any, does not belong by etymology: abject, adjacent, jetty, trajectory, or conjecture?"
      answer: "ADJACENT"
    boni:
      - question: "Give the root verb and meaning from which “adjacent” comes"
        answer: "(AD)<latin>IACEŌ</latin> - TO LIE / LIE NEXT TO "
      - question: "What derivative of <latin>iaceō</latin> is an English adjective that means “a vague feeling of discomfort, lethargy, or anxiety”?"
        answer: "MALAISE / DIS-EASE / UNEASINESS"
  - tossup:
      question: "What former governor of Hispania Tarraconensis was the first Sulpicius to become emperor, ascending the throne in 68 but deposed in 69 A.D.?"
      answer: "GALBA"
    boni:
      - question: "What new commander of the praetorians in Rome spread a rumor that Nero had fled to Egypt and secured the allegiance of the praetorians by the promise of a huge donative in Galba’s name?"
        answer: "NYMPHIDIUS SABINUS"
      - question: "What governor of Africa did Galba have executed because he had revolted against Nero and cut off the grain supply to Rome?"
        answer: "(LUCIUS) CLODIUS MACER"
  - tossup:
      question: "Using a first conjugation deponent verb, say in Latin “we were trying.”"
      answer: "<latin>CŌNĀBĀMUR</latin> "
    boni:
      - question: "Change <latin>cōnābāmur</latin> to the subjunctive"
        answer: "<latin>CŌNĀRĒMUR</latin> "
      - question: "Change <latin>cōnārēmur</latin> to the present tense"
        answer: "<latin>CŌNĒMUR</latin> "
  - tossup:
      question: "Which one of the following has two wheels instead of four? <latin>petōritum, carrūca, carpentum, plaustrum</latin>, <latin>raeda</latin>"
      answer: "<latin>CARPENTUM</latin>"
    boni:
      - question: "Which of the above carriages was a travelling carriage more luxurious than the <latin>raeda</latin>?"
        answer: "<latin>CARRŪCA</latin>"
      - question: "You’re a Roman man hoping to be transported to your patron’s house at noon. Why would you call for a <latin>lectīca</latin>, or a litter, instead of a carriage?"
        answer: "REGULATIONS <emphasis>PROHIBITED USE OF</emphasis> MOST <emphasis>VEHICLES</emphasis>   <emphasis>WITHIN CITY</emphasis> DURING FIRST TEN HOURS OF DAY"
  - tossup:
      question: "What use of the subjunctive is seen in the sentence, “<latin>Gladius imperātōris erat ita gravis ut nēmō eum portāre posset”?</latin>"
      answer: "RESULT CLAUSE"
    boni:
      - question: " Translate that sentence"
        answer: "THE EMPEROR’S / COMMANDER’S SWORD WAS SO HEAVY THAT NO ONE COULD CARRY IT"
      - question: "Translate the subordinate clause of this sentence using a subjunctive: The empress sent twelve slaves to lift the emperor’s sword. "
        answer: "<latin>QUĪ / QUAE / UT GLADIUM IMPERĀTŌRIS / PRĪNCIPIS TOLLERENT / LEVĀRENT</latin> "
  - tossup:
      question: "What Roman king, an Etruscan also known as Mastarna, was murdered by his own daughter?"
      answer: "SERVIUS TULLIUS"
    boni:
      - question: "Name this daughter"
        answer: "TULLIA MINOR / THE SECOND / THE YOUNGER (prompt on “Tullia”)"
      - question: "Tullia killed not only her father but also her first husband. Name this man, who was also a brother of Tarquinius Superbus"
        answer: "ARRUNS"
  - tossup:
      question: "What king of Thebes refused to give up power when his year to rule was up?"
      answer: "ETEOCLES"
    boni:
      - question: "What Argive king helped Polyneices by putting together an army to march on Thebes?"
        answer: "ADRASTUS"
      - question: "During the campaign of the Epigoni, what son of Adrastus was the only one to die?"
        answer: "AEGIALEUS"
  - tossup:
      question: "<latin>Cuius ad pedēs īnfāns positus est?</latin>"
      answer: "PATRIS "
    boni:
      - question: "<latin>Sī pater īnfantem rēiēcit, quid fēcit?</latin>"
        answer: "<latin>RELĪQUIT (EUM) HUMĪ (UT MORERĒTUR)</latin>  "
      - question: "<latin>Cūr pater hoc facere poterat?</latin>"
        answer: "(<latin>QUOD / QUIA) POTESTĀTEM HABĒBAT (IN</latin> OMNEM FAMILIAM SUAM) "
  - tossup:
      question: "The abbreviation <latin>M.A.</latin> is usually associated with a college degree. What are the Latin and the English for this abbreviation in a college context?"
      answer: "<latin>MAGISTER ARTIUM</latin> / <latin>ARTIUM MAGISTER</latin>, MASTER OF ARTS"
    boni:
      - question: "One useful phrase to describe the college experience might be Horace’s line “<latin>eheu fugācēs labuntur annī</latin>.” What is the meaning of this quotation?"
        answer: "ALAS, THE FLEETING YEARS GLIDE BY / TIME FLIES"
      - question: "A phrase that we hope will not describe your college experience is “<latin>semel insānīvimus omnēs</latin>.” What is the meaning of this quotation?"
        answer: "WE HAVE ALL BEEN MAD ONCE / EVERYONE GOES CRAZY AT SOME POINT"
  - tossup:
      question: "What man, a senator of distinguished origin and a former lieutenant of Trebonianus Gallus, became the first Roman emperor to be captured by a foreign power in 260 A.D.?"
      answer: "(PUBLIUS LICINIUS) VALERIAN(US)"
    boni:
      - question: "What son of Valerian was co-ruler at the time of his capture and continued as emperor until 268 A.D.?"
        answer: "(PUBLIUS LICINIUS) GALLIENUS (EGNATIUS)"
      - question: "Valerian and Gallienus are unusual in that they were a father and son who differed in their treatment of the Christians. Which of the two persecuted the Christians?"
        answer: "VALERIAN"
  - tossup:
      question: "What son of Eupeithes was the first killed by Odysseus because he was the most impudent of Penelope’s suitors?"
      answer: "ANTINOUS"
    boni:
      - question: "What other suitor, the richest of them and the son of Polybus, was the second to die at Odysseus’ hand?"
        answer: "EURYMACHUS"
      - question: "After the deaths of Antinous and Eurymachus, what suitor rushed at Odysseus and was killed by Telemachus?"
        answer: "AMPHINOMUS"
  - tossup:
      question: "Which of the following, if any, is NOT etymologically related to the others:  mix, meddle, melee, promiscuous, or melange?"
      answer: "NONE"
    boni:
      - question: "From what root verb do all of these derive?"
        answer: "<latin>MISCEŌ / MISCĒRE</latin> "
      - question: "What derivative of <latin>misceō</latin>, besides “mix” and “mixture,” means “a collection of various kinds”?"
        answer: "MISCELLANY / MEDLEY / MELANGE "
  - tossup:
      question: "What governor of Upper Germany, the first senator in his family, started a revolt at Moguntiacum, but was quickly defeated by Lappius Maximus before the emperor Domitian could even arrive there?"
      answer: "(LUCIUS ANTONIUS) SATURNINUS"
    boni:
      - question: "What natural event reportedly prevented Saturninus’ German allies from crossing the Rhine and joining him?"
        answer: "(SUDDEN) THAW / FLOODING"
      - question: "In what year did this all take place?"
        answer: "89 A.D."
  - tossup:
      question: "Make the phrase “<latin>parva turris”</latin> nominative plural"
      answer: "<latin>PARVAE TURRĒS</latin> "
    boni:
      - question: "Now put the phrase “no tower” into the genitive singular"
        answer: "N<latin>ŪLLĪUS TURRIS</latin> "
      - question: "Change that phrase to the accusative singular"
        answer: "<latin>NŪLLAM TURRIM / TURREM</latin> "
  - tossup:
      question: "What son of Heracles and son-in-law of Priam was wounded by Achilles and subsequently guided the Greeks to Troy, although he did not take part in the fighting?"
      answer: "TELEPHUS"
    boni:
      - question: "Where on his body did Telephus receive this wound from Achilles?"
        answer: "THIGH"
      - question: "When Odysseus explained to Telephus that his wound must be healed by the inflictor, what did Telephus do to heal it?"
        answer: "USED <emphasis>RUST</emphasis> FROM <emphasis>ACHILLES’ SPEAR</emphasis>  <latin>2011 NJCL CERTAMEN INTERMEDIATE DIVISION FINALS</latin>"
  - tossup:
      question: "What deity fathered Thaumas, Eurybia, Nereus, and Phorcys?"
      answer: "PONTUS"
    boni:
      - question: "Who was the mother of Pontus’ children?"
        answer: "GAIA/GE"
      - question: "What sea-monster daughter of Pontus and Ge bore the Graeae, Echidna, and Ladon?"
        answer: "CETO"
  - tossup:
      question: "What derivative of <latin>gradior</latin> means “able to be broken down by living organisms”?"
      answer: "(BIO)DEGRADABLE"
    boni:
      - question: "What other derivative of <latin>gradior</latin> means “a slope, tilt or incline”?"
        answer: "GRADIENT <latin>/</latin> GRADE"
      - question: "What derivative of <latin>gradior</latin> can be used in a psychological context to describe a reversion to childhood habits and in a mathematical context to describe a form of analysis predicated upon fitting one line to many points of data?"
        answer: "REGRESSION"
  - tossup:
      question: "Give all of the principal parts of a Latin deponent verb meaning “urge” or “encourage.”"
      answer: "<latin>HORTOR, HORTĀRĪ, HORTĀTUS (SUM) (ADHORTOR/COHORTOR, EXHORTOR)</latin> "
    boni:
      - question: "What is a deponent synonym for “<latin>dīcō</latin>”?"
        answer: "<latin>LOQUOR / FOR</latin> "
      - question: "Give all the principal parts for the Latin deponent meaning “to die.”"
        answer: "<latin>MORIOR, MORĪ, MORTUUS (SUM)</latin> "
  - tossup:
      question: "What emperor was elevated, deposed, and killed by the Praetorian Guard under the command of their prefect Laetus?"
      answer: "(PUBLIUS HELVIUS) PERTINAX"
    boni:
      - question: "Who was the only member of Pertinax’s retinue not to desert him when the praetorians invaded the Palatine?"
        answer: "ECLECTUS"
      - question: "Which emperor secured deification for Pertinax?"
        answer: "(LUCIUS) SEPTIMIUS SEVERUS"
  - tossup:
      question: "Who was rewarded with a spring on the Acrocorinth for informing on the whereabouts of Zeus and Aegina?"
      answer: "SISYPHUS"
