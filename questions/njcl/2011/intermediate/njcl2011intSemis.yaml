        answer: "(SANDY) PYLOS and then SPARTA"
  - tossup:
      question: "For the verb <latin>volō</latin>, <latin>velle</latin>, give the third person singular present subjunctive form"
      answer: "<latin>VELIT</latin> "
    boni:
      - question: "Give the second person plural perfect active subjunctive of <latin>ferō</latin>."
        answer: "<latin>TULERĪTIS</latin> "
      - question: "Change <latin>tulerītis</latin> to the pluperfect passive subjunctive"
        answer: "<latin>LĀTĪ /-AE /-A ESSĒTIS</latin> "
  - tossup:
      question: "Who in the <title>Iliad</title> wounded the Greek warriors Menelaus and Diomedes with his arrows?"
      answer: "PANDARUS"
    boni:
      - question: "What goddess induced Pandarus to wound Menelaus and break the truce between the Greeks and Trojans?"
        answer: "ATHENA"
      - question: "Who killed Pandarus?"
        answer: "DIOMEDES"
  - tossup:
      question: "Who defeated Servilius Vatia for the consulship of 87 B.C. despite the express wishes of Sulla?"
