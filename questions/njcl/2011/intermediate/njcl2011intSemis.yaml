    boni:
      - question: "From what Latin verb is “joust” derived?"
        answer: "<latin>IUNGŌ</latin> "
      - question: "From what noun root with what meaning are the others derived?"
        answer: "<latin>IŪS</latin>, RIGHT/LAW"
  - tossup:
      question: "What did the suitors of Penelope decide to do when they found out that Telemachus had left Ithaca to go find word of his father?"
      answer: "TO <emphasis>AMBUSH</emphasis> HIS SHIP AND <emphasis>KILL</emphasis> HIM (ON HIS RETURN VOYAGE)"
