  - tossup:
      question: "<latin>Bōs</latin>, meaning “cow,” also has unusual forms in the dative plural. Give one"
      answer: "<latin>BŌBUS / BŪBUS</latin> "
    boni:
      - question: "Now spell the unusual genitive plural form of <latin>bōs</latin>"
        answer: "<latin>BOUM</latin>"
      - question: "Give the unusual dative plural form for “<latin>sūs</latin>,” meaning “swine.” "
        answer: "<latin>SŪBUS</latin>"
  - tossup:
      question: "Translate the correlative pair <latin>sīve</latin>... <latin>sīve</latin>"
      answer: "WHETHER... OR / EITHER... OR"
