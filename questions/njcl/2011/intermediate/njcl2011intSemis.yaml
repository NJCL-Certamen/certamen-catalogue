      - question: "The person bearing what role in the family could not be adopted through the process of <latin>adoptiō</latin>?"
        answer: "<latin>PATERFAMILIĀS</latin>"
      - question: "Give the Latin term for the special and serious adoption procedure used when adopting a <latin>paterfamiliās</latin>, which had to be approved by the <latin>pontifex maximus</latin>."
