      - question: "Besides <latin>aut</latin>... <latin>aut</latin>, name another pair of correlatives that can mean “either... or.”"
        answer: "<latin>VEL... VEL</latin> / <latin>SEU</latin>... <latin>SEU</latin>"
      - question: "Besides “when... then,” what is the meaning of the correlative pair <latin>cum</latin>... <latin>tum</latin>?"
        answer: "BOTH... AND / NOT ONLY... BUT ALSO "
  - tossup:
      question: "Quid pauperibus difficile est?"
      answer: "(SINE VULNERE) ITER <latin>CŌNFICERE / (IN VIĪS) PROPERĀRE</latin>"
    boni:
      - question: "<latin>Quid facit turba ubi dīves per viās īre vult?</latin>"
        answer: "<latin>CĒDIT</latin> "
      - question: "<latin>Cūr</latin> pauperibus difficile est <latin>in viīs properāre</latin>?"
        answer: "<latin>(QUOD / QUIA) DĒNSA EST MULTITŪDŌ etc.</latin> "
  - tossup:
      question: "What site is shown in these pictures? It covers approximately 33 acres, held a public library, contained a hypocaust, and was built between 212 and 216 A.D"
      answer: "BATHS / <latin>THERMAE</latin> OF CARACALLA"
    boni:
      - question: "Now turn to page 2, which shows a photo, diagram, and reconstruction of a building located in the Campus Martius. What structure is this?"
        answer: "MAUSOLEUM OF AUGUSTUS"
      - question: "Now turn to page 3, which shows two temples near the Tiber as they look today. The one in the top and bottom left is the Temple of Portunus. The one in the bottom right is the Temple of Hercules Victor. What was the Latin name of the ancient forum in which these pictures were taken?"
        answer: "<latin>FORUM BOĀRIUM</latin>"
  - tossup:
      question: "What king founded the city of Elis before he retired to Mount Latmus to sleep forever?"
      answer: "ENDYMION"
    boni:
      - question: "Sometimes Endymion’s father is said to have founded Elis. Name him"
        answer: "AËTHLIUS"
      - question: "According to one account, Endymion fell in love with Hera and was flung into Hades by Zeus for this transgression. Who committed a similar offense and was similarly punished?"
        answer: "IXION"
  - tossup:
      question: "The official Latin motto for Kentucky, “<latin>Deō grātiam habeāmus,”</latin> was adopted in 2002. Translate that motto"
      answer: "LET US HAVE / GIVE THANKS TO GOD   (officially, “let us be grateful to God”)"
    boni:
      - question: "If Kentucky’s English motto were translated into Latin, it might be <latin>Stāmus coniūnctī, disiūnctī cadimus</latin>. What would that mean?  "
        answer: "“UNITED WE STAND, DIVIDED WE FALL” (or similar)"
      - question: "The motto of the University of Louisville is “It’s Happening Here” Give the Latin for that saying?"
        answer: "<latin>HĪC FIT / ACCIDIT</latin>"
  - tossup:
      question: "What are the case and use of the Latin word meaning “wisdom” for the sentence, “<latin>Multī Caesarem virum maximae sapientiae esse putābant</latin>”? "
      answer: "GENITIVE OF DESCRIPTION / QUALITY"
    boni:
      - question: "Translate that sentence"
        answer: "MANY (MEN/PEOPLE) THOUGHT / WERE THINKING / USED TO THINK THAT CAESAR WAS A MAN OF THE GREATEST / VERY GREAT WISDOM"
      - question: "Using the verb <latin>praeficiō</latin>, translate this sentence into Latin: “Caesar has placed Quintus in charge of the soldiers.”"
        answer: "<latin>CAESAR QUĪNTUM MĪLITIBUS PRAEFĒCIT</latin> "
  - tossup:
      question: "What governor of Cappadocia and Galatia began a war against the Parthians over Armenia, and later earned the governorship of Syria and a <latin>maius imperium</latin> to continue the war after the king he had installed was deposed?"
