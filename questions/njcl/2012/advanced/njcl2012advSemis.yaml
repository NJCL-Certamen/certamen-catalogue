tournament: "NJCL Certamen"
year: 2012
division: "Advanced"
round: "Semifinals"
questions:
  - tossup:
      question: "Many nouns are formed with adjective suffixes. What does the suffix –<latin>ārius</latin> denote, as in the word <latin>argentārius</latin>?"
      answer: "PERSON EMPLOYED / ONE WHO WORKS ON"
    boni:
      - question: "What does the suffix –<latin>ētum</latin> denote, as in the word <latin>arborētum</latin>?"
        answer: "PLACE (OF A THING)"
      - question: "Although the word <latin>poculum</latin> may sound like a diminutive, its suffix –<latin>culum</latin>, which is added to a verb root, actually indicates what about the noun?"
        answer: "INSTRUMENT / MEANS"
  - tossup:
      question: "What collective name is given to Passalus and Acmon, who were warned by their mother not to fall into the hands of Blackbottom?"
      answer: "CERCOPES"
    boni:
      - question: "Only after Blackbottom had captured them did they realize that he was what man?"
        answer: "HERACLES/HERCULES"
      - question: "What did Heracles eventually do with them?"
        answer: "LET THEM GO (BECAUSE THEY AMUSED HIM)"
  - tossup:
      question: "Who was only thirteen when he took the throne as the sixth and final emperor of the year 238 AD?"
      answer: "GORDIAN III"
    boni:
      - question: "Because of his age, Gordian appointed a praetorian prefect to become the de facto ruler in Rome. Who was this man, Gordian’s first praetorian prefect?"
        answer: "TIMESITHEUS"
      - question: "When Timesitheus died on the eastern frontier, he was replaced by what man, who eventually defeated the Persians?"
        answer: "(MARCUS IULIUS) PHILLIP(US THE ARAB)"
  - tossup:
      question: "What four-word quotation from Terence reminds us that each person has his or her own opinion?"
      answer: "<latin>QUOT HOMINĒS TOT SENTENTIAE</latin> "
    boni:
      - question: "What is the English equivalent of the Latin phrase <latin>oleum addere camīnō</latin>?"
        answer: "(ADDING) FUEL TO THE FIRE / MAKING THINGS WORSE (OR SIMILAR)"
      - question: "What is the English equivalent of the Latin phrase <latin>ad praesēns ōva crās pullīs sunt meliōra</latin>?"
        answer: "A BIRD IN THE HAND IS WORTH TWO IN THE BUSH (OR SIMILAR)"
  - tossup:
      question: "Why does Jupiter open the house of all-powerful Olympus?"
      answer: "TO CONVOKE A COUNCIL (OF THE GODS)"
    boni:
      - question: "How, specifically, is the council chamber described?"
        answer: "(A) STARRY / GLEAMING (SEAT)"
      - question: "According to the passage, what three things does Jupiter see?"
        answer: "(ALL THE) LANDS, CAMP OF THE DARDANIANS/TROJANS, LATIN PEOPLES"
  - tossup:
      question: "What Olympian’s children included the Argonauts Erytus and Echion; Myrtilus, the charioteer of Oenomaus; and Autolycus, the master thief?"
      answer: "HERMES’"
    boni:
      - question: "Hermes once fell in love with a maiden named Apemosyne, but discovered that winning her would be difficult. What was Apemosyne’s special talent?"
        answer: "SHE COULD RUN FAST(ER THAN HERMES)"
      - question: "Hermes eventually won Apemosyne by trickery and she became pregnant. Why did no child result from this union?"
        answer: "APEMOSYNE’S BROTHER (ALTHAEMENES) KILLED HER / KICKED HER TO DEATH"
  - tossup:
      question: "Which of the following, if any, does not belong because of meaning: <latin>coluber, phōca, unguis, mūsca, vulpēs?</latin>"
      answer: "UNGUIS"
    boni:
      - question: "Which of the following, if any, does not belong because of meaning: <latin>rhētor, mētātor, mangō, adhortor, fullō</latin>?"
        answer: "<latin>ADHORTOR</latin>"
      - question: "Which of the following, if any, does not belong because of meaning: <latin>fīcus, almus, cerasus, pirus, fraxinus?</latin>"
        answer: "ALMUS"
  - tossup:
      question: "What Silver Age author, born at Calagurris, did Martial call the “supreme guide of wayward youth” because of his sound literary and pedagogical advice?"
      answer: "(MARCUS FABIUS) QUINTILIAN"
    boni:
      - question: "Give the Latin title of Quintilian’s extant twelve-book textbook. "
        answer: "<latin>ĪNSTITŪTIŌ ŌRĀTŌRIA</latin> "
      - question: "What earlier author receives the majority of praise and focus in the <title><latin>Īnstitūtiō Ōrātōria</latin></title>?"
        answer: "(MARCUS TULLIUS) CICERO"
  - tossup:
      question: "At what battle in 190 BC, the last Roman naval victory over a foreign enemy, did the Romans outmaneuver Antiochus and his allies to take the upper hand in Asia?"
      answer: "MYONESSUS"
    boni:
      - question: "Who commanded the Roman fleet at Myonessus?"
        answer: "(LUCIUS AEMILIUS) REGILLUS"
      - question: "What Rhodian exile and compatriot of Antiochus commanded the losing fleet at Myonessus?"
        answer: "POLYXENIDAS"
  - tossup:
      question: "What seer, the son of Polypheidus and great-grandson of Melampus, was brought by Telemachus to Ithaca from Pylos and warned Penelope's suitors of their impending doom?"
      answer: "THEOCLYMENUS"
    boni:
      - question: "What other seer had given the suitors a similar warning at a council of Ithacan noblemen?"
        answer: "HALITHERSES"
      - question: "Odysseus later spared Theoclymenus, along with what bard who had played for the suitors?"
        answer: "PHEMIUS"
  - tossup:
      question: "Which of the following, if any, is not a derivative of <latin>eō, īre</latin>: trance, issue, sudden, vintage, circuit?"
      answer: "VINTAGE"
    boni:
      - question: "From what Latin verb with what meaning is “vintage” derived?"
        answer: "<latin>EMŌ / EMERE</latin>, BUY"
      - question: "What derivative of <latin>emō</latin> means “made or done without previous preparation”?"
        answer: "IMPROMPTU"
  - tossup:
      question: "What poet, a friend of Vergil, wrote voluminous amounts of elegiac poetry to a woman he called Lycoris, although only one line remains?"
      answer: "(GAIUS) CORNELIUS GALLUS"
    boni:
      - question: "What was the real name of Lycoris?"
        answer: "CYTHERIS"
      - question: "Gallus took his own life in 26 BC after being recalled by Augustus as prefect of what province?"
        answer: "EGYPT"
  - tossup:
      question: "Translate the verb form <latin>nequīre</latin>"
      answer: "TO BE UNABLE"
    boni:
      - question: "Give the only participle that exists for this verb"
        answer: "<latin>NEQUIĒNS</latin> (<latin>NEQUEUNTIS</latin>)"
      - question: "What neutral passive verb, another compound of <latin>eō</latin>, means “to be sold”? "
        answer: "<latin>VĒNEŌ / VĒNĪRE</latin>"
  - tossup:
      question: "Identify the author and title of the work from which passage 4 is taken"
      answer: "VARRO, <title><latin>DĒ LINGUĀ LATĪNĀ</latin></title>"
    boni:
      - question: "Identify the author and title of the work from which passage 3 is taken"
        answer: "OVID, <title><latin>REMEDIA AMŌRIS</latin></title>"
      - question: "Identify the author and title of the work from which passage 1 is taken"
        answer: "SUETONIUS, <title><latin>DĒ POĒTĪS</latin> / <latin>DĒ VIRĪS ILLŪSTRIBUS</latin></title>"
  - tossup:
      question: "Translate into English: <latin>Vēndat vestēs dummodo nē frīgidus fīat</latin>"
      answer: "LET HIM SELL HIS CLOTHES PROVIDED THAT HE DOES NOT BECOME COLD"
    boni:
      - question: "Translate into English: <latin>Cum cōpiae māne perventūrae sint, trēs legiōnēs sufficient</latin>"
        answer: "SINCE REINFORCEMENTS WILL ARRIVE IN THE MORNING, THREE LEGIONS WILL SUFFICE"
      - question: "Translate into English: <latin>Quamvīs Rōmānī nōn nūllōs hostēs arcēre possent, arx obsidēbātur</latin>"
        answer: "ALTHOUGH THE ROMANS WERE ABLE TO HOLD OFF SOME (OF THE) ENEMY, THE CITADEL WAS BESIEGED"
  - tossup:
      question: "Trajan twice defeated Decebalus in battle at what Dacian capital?"
      answer: "SARMIZEGETHUSA"
    boni:
      - question: "What general gained notoriety for his assistance to Trajan in the first Dacian War?"
        answer: "(LUSIUS) QUIETUS"
      - question: "In what year did Trajan finally declare Dacia a province?"
        answer: "107 AD"
  - tossup:
      question: "What son of Ceuthonymus encountered Heracles twice – once in the Underworld where he challenged Heracles to wrestle, and once in life when he was serving as the herdsman of Hades?"
      answer: "MENOETES"
    boni:
      - question: "Heracles broke Menoetes’ ribs and would have injured him more severely if not for the intervention of what deity?"
        answer: "PERSEPHONE"
      - question: "What did Heracles do in the Underworld that caused Menoetes to attack him?"
        answer: "KILLED ONE OF HADES’ CATTLE (SO THAT THE SHADES COULD DRINK ITS BLOOD)"
  - tossup:
      question: "What do the nouns <latin>hortus, pars, sāl, rōstrum, fīnis</latin>, and <latin>castrum</latin> all have in common?"
      answer: "DIFFERENT MEANINGS IN PLURAL"
    boni:
      - question: "What name is given to nouns such as <latin>fors</latin>, which have forms in only two cases?"
        answer: "DIPTOTES"
      - question: "Greek words can have irregular declensions in Latin. What is the vocative form of the proper noun <latin>Aenēās</latin>?"
        answer: "<latin>AENĒĀ</latin>"
  - tossup:
      question: "Caesar extended the Roman frontier as far north as the Rhine when he defeated what chieftain of the Suebi in 58 BC?"
      answer: "ARIOVISTUS"
    boni:
      - question: "What lieutenant of Caesar brought up reinforcements at the battle of Vosges to secure the defeat of the Suebi?"
        answer: "PUBLIUS CRASSUS"
      - question: "What Aeduan leader had originally requested aid from Caesar in fending off the advances of Ariovistus?"
        answer: "DIVITIACUS / DIVICIACUS"
  - tossup:
      question: "What author patterned his antithesis, asymmetry, and <latin>inconcinnitās</latin> on the style of Thucydides as he wrote his historical monographs?"
      answer: "(GAIUS) SALLUST(IUS CRISPUS)"
    boni:
      - question: "Sallust received the governorship of what province in 46 BC for his services to Caesar?"
        answer: "<latin>AFRICA (NOVA)</latin> "
      - question: "Which work of Sallust was left unfinished at the time of his death?"
        answer: "<title><latin>HISTORIAE</latin></title> <latin>2012 NJCL CERTAMEN ADVANCED DIVISION FINALS</latin> "
  - tossup:
      question: "The English word “necklace” is derived from what Latin noun meaning “noose”?"
      answer: "LAQUEUS"
    boni:
      - question: "From what Latin noun, with what meaning, do we derive the English words “control” and “enroll”?"
        answer: "<latin>ROTA</latin>, WHEEL"
      - question: "From what diminutive Latin noun, with what meaning, do we derive the English word “tinsel”?"
        answer: "<latin>SCINTILLA</latin>, SPARK"
  - tossup:
      question: "What Latin author wrote lost works entitled <title><latin>Agave</latin></title> and <title><latin>Dē Bellō Germānicō</latin></title>, but is more famous for his mythological epic in twelve books entitled <title>Thebaid</title>?"
      answer: "(PUBLIUS PAPINIUS) STATIUS"
    boni:
      - question: "What work of Statius in five books is a collection of poems so named because of its unedited, impromptu nature?"
        answer: "<title><latin>SILVAE</latin></title>"
      - question: "Most of Statius’ work flatters what emperor, whom Juvenal mocked in his <title>Satires</title>?"
        answer: "DOMITIAN"
  - tossup:
      question: "Using the verb <latin>micō</latin>, say in Latin, “to have glittered.”"
      answer: "<latin>MICUISSE</latin>"
    boni:
      - question: "Many first conjugation verbs in addition to <latin>micō</latin> have irregular third principal parts. Which of the following first conjugation verbs, if any, does NOT have an irregular third principal part: <latin>sonō, iuvō, stīpō, tonō, fricō</latin>?"
        answer: "<latin>STĪPŌ</latin>"
      - question: "Give the principal parts of the Latin verb at the root of the English word “fissure.”"
        answer: "<latin>FINDŌ, FINDERE, FIDĪ, FISSUM</latin>"
  - tossup:
      question: "Differentiate in meaning between <latin>tergeō</latin> and <latin>turgeō</latin>"
      answer: "<latin>TERGEŌ</latin>, WIPE; <latin>TURGEŌ</latin>, SWELL"
    boni:
      - question: "Differentiate in meaning between <latin>farciō</latin> and <latin>sarciō</latin>"
        answer: "<latin>FARCIŌ</latin>, STUFF; <latin>SARCIŌ</latin>, PATCH"
      - question: "Differentiate in meaning between <latin>cūdō</latin> and <latin>rudō</latin>"
        answer: "<latin>CŪDŌ</latin>, STRIKE; <latin>RUDŌ</latin>, ROAR"
  - tossup:
      question: "At what battle in 283 BC did the Romans cut off the advancing armies of the Boii and their Etruscan contingents?"
      answer: "LAKE VADIMO"
    boni:
      - question: "Who was the victorious general at the battle of Lake Vadimo?"
        answer: "(PUBLIUS) CORNELIUS DOLABELLA"
      - question: "What Roman general’s suppression of the Gauls a few years earlier had provoked the Boii to preemptively attack?"
        answer: "(MANIUS) CURIUS DENTATUS’"
  - tossup:
      question: "Name one rhetorical device exemplified by all the phrases highlighted in yellow"
      answer: "TRICOLON / ASYNDETON"
    boni:
      - question: "All of the yellow phrases include both tricolon and asyndeton. Now identify by first and last word a phrase that exemplifies tricolon and polysyndeton. "
        answer: "<latin>CLĀRISSIMĪ … AMANTISSIMĪ</latin> "
      - question: "Cicero adopted the persona of the man depicted here when he delivered these lines. This strategy is an example of what rhetorical device?"
        answer: "<emphasis>PROSOPOPOEIA</emphasis>"
  - tossup:
      question: "What king of Arcadia won acclaim by winning the wrestling match at the Olympic Games held by Heracles, and later killed Heracles’ son Hyllus in a duel during the invasion of the Heraclids?"
      answer: "ECHEMUS"
    boni:
      - question: "From what uncle had Echemus inherited the throne of Arcadia after his uncle’s sons Epochus, Amphidamas, and Iasus died young?"
        answer: "LYCURGUS"
      - question: "Lycurgus was invited to join the Argonauts but declined so that he could rule for his agéd father. What son, along with his uncles, did he send in his place?"
        answer: "ANCAEUS"
  - tossup:
      question: "What construction is illustrated in phrases from the <title>Aeneid</title> such as <latin>it clāmor caelō</latin> and <latin>facilis dēscēnsus Avernō</latin>?"
      answer: "DATIVE OF DIRECTION / LOCAL DATIVE"
    boni:
      - question: "What use of the dative case is illustrated in this poetic phrase? <latin>Vēlīs immitte rudentēs</latin>"
        answer: "REFERENCE / ADVANTAGE / COMPOUND VERBS"
      - question: "Use the dative to say in Latin, “I was easily persuaded.” "
        answer: "<latin>FACILE MIHI PERSUĀSUM EST / PERSUĀDĒBĀTUR</latin> "
  - tossup:
      question: "What Gallic chieftain, following the upheaval of 69 AD, led a revolt to become ruler of the <latin>Imperium Galliārum</latin>?"
      answer: "(IULIUS) CLASSICUS"
    boni:
      - question: "What general, who later became governor of Britain, did Vespasian send to quell the uprising of Classicus?"
        answer: "(QUINTUS PETILIUS) CERIALIS"
      - question: "Near what city, the capital of the so-called <latin>Imperium Galliārum</latin>, did Cerialis destroy Classicus’ force?"
        answer: "<latin>AUGUSTA TRĒVERŌRUM</latin> / TRIER"
  - tossup:
      question: "<latin>Quās duās artēs Brūtus in Graeciā</latin> didicit?"
      answer: "<latin>PHILOSOPHIAM (ET) ĒLOQUENTIAM</latin>"
    boni:
      - question: "<latin>Quae gēns ā maiōribus Marcī Brūtī Rōmā ēiecta erat</latin>?"
        answer: "<latin>TARQUINIA</latin> "
      - question: "<latin>Quōcum Brūtus gravem invidiam gesserat</latin>?"
        answer: "<latin>(CUM) POMPĒIŌ</latin>"
  - tossup:
      question: "Translate into English: <latin>Crēdō vōs ad omnia perīcula subeunda parātiōrēs esse</latin>"
      answer: "I BELIEVE THAT YOU ARE RATHER PREPARED TO UNDERGO ALL DANGERS"
    boni:
      - question: "Translate into English: <latin>Facinora maiōrum tuōrum luēs donec templa aedificāverīs</latin>"
        answer: "YOU WILL ATONE FOR THE CRIMES OF YOUR ANCESTORS UNTIL YOU (WILL) HAVE REBUILT THE TEMPLES"
      - question: "Translate into English: <latin>Cōgitāmus nūllam calamitātem ā nostrā familiā āfūtūram esse, sī interficerēmur</latin>"
        answer: "WE THINK THAT NO DISASTER WILL BE ABSENT FROM OUR FAMILY, IF WE WERE KILLED"
  - tossup:
      question: "What Latin author picked up where Tacitus left off, compiling a Roman history that began with the accession of Nerva and was entitled <title><latin>Rēs Gestae</latin></title>?"
      answer: "AMMIANUS MARCELLINUS"
    boni:
      - question: "With what event did the <title><latin>Rēs Gestae</latin></title> culminate?"
        answer: "BATTLE OF ADRIANOPLE"
      - question: "Under what emperor did Ammianus serve as a soldier in the army?"
        answer: "CONSTANTIUS II / JULIAN"
  - tossup:
      question: "In mythology, whose secrets were betrayed by his daughter Eidothea when she took pity on Menelaus and decided to help him gain her father’s gifts of prophecy?"
      answer: "PROTEUS’"
    boni:
      - question: "On what Egyptian island had Menelaus been marooned when Eidothea aided him?"
        answer: "PHAROS"
      - question: "Vergil included Proteus in his <title>Eclogues</title> when he described whose efforts to gain the Old Man of the Sea’s advice?"
        answer: "ARISTAEUS’"
  - tossup:
      question: "Who proclaimed himself <latin>Restitūtor Galliārum</latin>, as well as emperor, in 260 AD following the death of Valerian?"
      answer: "(MARCUS CASSIANUS LATINIUS) POSTUMUS"
    boni:
      - question: "What <latin>magister equitum</latin> of Gallienus initially led the attack against Postumus in 265 AD, but was demoted due to his defeat?"
        answer: "AUREOLUS"
      - question: "After his demotion, Aureolus defected and attempted to march on Rome. Where did Gallienus defeat Aurelous shortly before Gallienus himself was assassinated there in 268 AD?"
        answer: "<latin>MEDIOLĀNUM</latin> / MILAN"
  - tossup:
      question: "The <title><latin>Dialogī</latin></title>, twelve books of letters dealing with such topics as leisure, the blessed life, providence, and anger, was compiled after what author’s death by suicide in 65 AD?"
      answer: "(LUCIUS ANNAEUS) SENECA THE YOUNGER"
    boni:
      - question: "Separate from the <title><latin>Dialogī</latin></title> is what set of twenty books of over 120 letters addressed to Seneca’s friend Lucilius?"
        answer: "<title><latin>EPISTULAE MŌRĀLĒS</latin></title> (<title><latin>AD LŪCILIUM</latin></title>)"
      - question: "In which of his works, a foundational text for Pliny the Elder, does Seneca remark, “<latin>Quō nūllum maius est, nōsse nātūram</latin>”?"
        answer: "<title><latin>NĀTŪRĀLĒS QUAESTIŌNĒS</latin></title>"
  - tossup:
      question: "What consul of 50 BC not only denied Caesar’s request for a longer command in Gaul but recommended that it be curtailed by a year?"
      answer: "(GAIUS) MARCELLUS"
    boni:
      - question: "What tribune, a staunch supporter of Caesar, vetoed Marcellus’ legislation and offered a joint-disarmament proposal that passed later in 50 BC?"
        answer: "(GAIUS) SCRIBONIUS CURIO"
      - question: "Although Curio’s motion passed, Pompey’s mobilization forced Caesar to act likewise. In what northern Italian city did Caesar summon his forces from Gaul before crossing the Rubicon?"
        answer: "RAVENNA"
  - tossup:
      question: "Which of the Greeks is given the unsavory tasks of snatching Astyanax from his mother’s arms and accompanying Eurybates to repossess Briseis from Achilles, far cries from his main duty as chief herald of the Greek army?"
      answer: "TALTHYBIUS"
    boni:
      - question: "Also with Odysseus, Talthybius went to the court of what Cypriot king to enlist his aid in the war effort?"
        answer: "CINYRAS"
      - question: "On two different occasions, Talthybius had to lead maidens to sacrifice. Name these two maidens"
        answer: "IPHIGENEIA & POLYXENA"
  - tossup:
      question: "Using an impersonal verb, say in Latin, “Why does it concern you?” "
      answer: "<latin>CŪR / QUĀRĒ / QUID RĒFERT / INTEREST TUĀ / VESTRĀ</latin> "
    boni:
      - question: "Using the verb <latin>rēfert</latin>, say in Latin, “It concerned me more than them.” "
        answer: "<latin>RĒFERĒBAT / RETULIT MEĀ MAGIS / POTIUS QUAM EŌRUM / ILLŌRUM</latin> "
      - question: "Using the verb <latin>interest</latin>, say in Latin, “It is of great importance that we be happy.”"
        answer: "<latin>MAGNĪ INTEREST NŌS FĒLĪCĒS / LAETŌS (ESSE)</latin> "
  - tossup:
      question: "What lesser-known author fought in the Second Punic War and was a member of the embassy to Delphi after Cannae, and was the first author to write a history of Rome, albeit in Greek?"
      answer: "(QUINTUS) FABIUS PICTOR"
    boni:
      - question: "What dramatist was often said to be superior to his contemporaries Plautus and Terence, but is often forgotten since none of his works are extant?"
        answer: "CAECILIUS STATIUS"
      - question: "What prominent historian of the Sullan age wrote a tragic history from the Social War to the death of Sulla, as well as <title><latin>Fābulae Mīlēsiae</latin></title>?"
        answer: "(LUCIUS CORNELIUS) SISENNA"
  - tossup:
      question: "Who, in the form of both Thoas and Calchas, encourages the Greek troops at Troy, disobeying Zeus' order to the gods that none should interfere?"
      answer: "POSEIDON"
    boni:
      - question: "How did Hera help Poseidon lead the Greek surge?"
        answer: "SEDUCED ZEUS (TO DISTRACT HIM)"
      - question: "To what minor god did Hera offer the nymph Pasithea for his help in this matter?"
        answer: "HYPNOS"
