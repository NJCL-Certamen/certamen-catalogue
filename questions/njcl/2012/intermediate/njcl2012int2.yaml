tournament: "NJCL Certamen"
year: 2012
division: "Intermediate"
round: "Round 2"
questions:
  - tossup:
      question: "The only thing preventing Minos from seizing the city of Megara was what king’s purple lock of hair?"
      answer: "NISUS’"
    boni:
      - question: "Who, out of love for Minos, cut off Nisus’ purple lock?"
        answer: "SCYLLA"
      - question: "What Taphian king had a similar reliance on a golden hair, which his daughter Comaetho subsequently plucked out?"
        answer: "PTERELAUS"
  - tossup:
      question: "What Latin noun with what meaning is at the ultimate root of “precipitate”?"
      answer: "<latin>CAPUT</latin>, HEAD"
    boni:
      - question: "What Latin noun with what meaning is at the root of “posthumous”?"
        answer: "HUMUS, GROUND"
      - question: "What Latin noun with what meaning is at the root of “corroborate”? "
        answer: "<latin>RŌBUR</latin>/<latin>RŌBOR</latin>, OAK TREE / STRENGTH"
  - tossup:
      question: "In order to extend Roman power into Caledonia, what emperor built a wall in Britannia that was even farther north than Hadrian’s?"
      answer: "(TITUS AURELIUS FULVIUS BOIONIUS) ANTONINUS (PIUS)"
    boni:
      - question: "Out of what material did Antoninus build his wall?"
        answer: "TURF / SOD"
      - question: "What former legionary legate built the wall for Antoninus?"
        answer: "(QUINTUS) LOLLIUS URBICUS"
  - tossup:
      question: "Besides its compounds, give a synonym of <latin>ignōrō</latin>"
      answer: "<latin>NESCIŌ</latin>"
    boni:
      - question: "Give a synonym of <latin>polliceor</latin>"
        answer: "<latin>PRŌMITTŌ / FIDEM DŌ</latin>"
      - question: "Give a synonym of <latin>quaerō</latin>"
        answer: "<latin>PETŌ / VĒNOR / ROGŌ / POSTULŌ</latin>"
  - tossup:
      question: "At whose court did Heracles, on his way to capture the mares of Diomedes, find hospitality until he came to the embarrassing realization that the king was in mourning for his wife Alcestis?"
      answer: "ADMETUS’"
    boni:
      - question: "Whom did Heracles wrestle for the soul of Alcestis?"
        answer: "DEATH / THANATOS"
      - question: "What young companion of Heracles was eaten by the mares of Diomedes after Heracles left them in his care?"
        answer: "ABDERUS"
  - tossup:
      question: "What is the meaning of the motto of North Carolina, <latin>esse quam vidērī</latin>?"
      answer: "TO BE RATHER THAN TO SEEM"
    boni:
      - question: "Please identify by COLOR the state that has the shortest motto of the four states shown, and then give that Latin motto"
        answer: "YELLOW – <latin>DĪRIGŌ</latin>"
      - question: "Please identify by COLOR the state whose motto uses a contracted form of the Latin word <latin>nihil</latin>, and then give that Latin motto"
        answer: "BLUE – <latin>NĪL SINE NŪMINE</latin>"
  - tossup:
      question: "Who in mythology forever sits on the Chair of Forgetfulness in the Underworld?"
      answer: "PEIRITHOUS"
    boni:
      - question: "What vow had Peirithous and Theseus made together that prompted their ill-fated journey to the Underworld?"
        answer: "THAT THEY WOULD BOTH MARRY DAUGHTERS OF ZEUS"
      - question: "When Heracles rescued Theseus from the chair, he prepared to do the same for Peirithous. What sign did Hades send that told Heracles to desist?"
        answer: "AN EARTHQUAKE / THE GROUND SHOOK"
  - tossup:
      question: "What English word, derived from a Latin verb meaning “to throw,” means “a missile designed to be fired from a rocket or gun”?"
      answer: "PROJECTILE"
    boni:
      - question: "What English word, derived from a Latin verb meaning “to close,” means “to prevent the presence, existence, or occurrence of”?"
        answer: "PRECLUDE / EXCLUDE"
      - question: "What English word, derived from a Latin verb meaning “to fold,” means “to show someone to be involved in a crime”?"
        answer: "IMPLICATE"
  - tossup:
      question: "Give the correct form of the adjective <latin>potēns</latin> to agree with the noun form <latin>agricolam</latin>. "
      answer: "POTENTEM"
    boni:
      - question: "Give the correct form of the adjective <latin>potēns</latin> to agree with the noun form <latin>duce</latin>. "
        answer: "<latin>POTENTĪ / POTENTE</latin> "
      - question: "Give BOTH correct forms of the adjective <latin>potēns</latin> that could agree with the singular noun form <latin>reī</latin>"
        answer: "<latin>POTENTIS</latin> & <latin>POTENTĪ</latin>"
  - tossup:
      question: "What Roman commander, who lost 93 of his 123 ships in a crushing defeat at the battle of Drepana, had earlier drowned his sacred chickens for giving him unfavorable omens?"
      answer: "(PUBLIUS) CLAUDIUS PULCHER / CLODIUS PULCHER"
    boni:
      - question: "What Carthaginian admiral defeated Pulcher at this battle?"
        answer: "ADHERBAL"
      - question: "At what battle did Lutatius Catulus defeat the Carthaginians to end the First Punic War?"
        answer: "AEGATES ISLANDS"
  - tossup:
      question: "What happened when Hera sat in the throne built for her by Hephaestus?"
      answer: "SHE COULD NOT GET OUT OF IT"
    boni:
      - question: "Who finally convinced Hephaestus to release Hera?"
        answer: "DIONYSUS"
      - question: "Most accounts say that the wife of Hephaestus was Aphrodite, but others claim that he married what youngest member of the Graces?"
        answer: "AGLAIA"
  - tossup:
      question: "In the sentence “Pyrrhus thought that Fabricius was a man of the greatest virtue,” translate “of the greatest virtue.”"
      answer: "<latin>MAXIMĀ / SUMMĀ VIRTŪTE</latin> // <latin>MAXIMAE / SUMMAE VIRTŪTIS</latin> "
    boni:
      - question: "In the sentence, “Fabricius wondered whether Pyrrhus would arrive in the city on the fifth day,” translate “fifth day.”"
        answer: "<latin>QUĪNTŌ DIĒ</latin>"
      - question: "In that same sentence, what Latin word would be used to introduce the indirect question?"
        answer: "<latin>NUM</latin> / -<latin>NE</latin>"
  - tossup:
      question: "What emperor was killed as the result of a conspiracy by the chamberlain Eclectus, his mistress Marcia, and the praetorian prefect Laetus, after a disappointing reign spent fighting as a gladiator?"
      answer: "(LUCIUS/MARCUS AELIUS AURELIUS) COMMODUS"
    boni:
      - question: "Commodus sometimes costumed himself as what god?"
        answer: "HERCULES"
      - question: "Who was Commodus' sister, who had led a conspiracy ten years earlier?"
        answer: "LUCILLA"
  - tossup:
      question: "Translate: <latin>Et Sextus et Iūlius</latin> eandem <latin>fēminam</latin> pulchram <latin>in mātrimōnium dūcere</latin> volunt."
      answer: "BOTH SEXTUS AND JULIUS WANT TO MARRY THE SAME BEAUTIFUL WOMAN"
    boni:
      - question: "Translate: <latin>Fēmina, nōmine Pompeia, Sextō quam Iūliō nūbere māvult</latin>"
        answer: "THE WOMAN, NAMED POMPEIA, PREFERS TO MARRY SEXTUS RATHER THAN JULIUS"
      - question: "Translate: <latin>Amat pater Pompeiae virum quī plūs pecūniae offert</latin>"
        answer: "POMPEIA’S FATHER LIKES THE MAN WHO OFFERS MORE MONEY"
  - tossup:
      question: "<latin>Quālis erat arbor tempestāte vastāta?</latin>"
      answer: "<latin>VETUS / VALIDA / FORTIS</latin> "
    boni:
      - question: "<latin>Quōmodo arbor parva tempestātī restitit</latin>?"
        answer: "(<latin>SĒ</latin>) <latin>FLECTENDŌ / NŌN</latin>/<latin>NEC RESISTENDŌ</latin> "
      - question: " <latin>Cūr arbor valida vastāta est</latin>?"
        answer: "(<latin>SĒ</latin>) <latin>FLECTERE NŌLĒBAT</latin>"
  - tossup:
      question: "In the sentence “<latin>Athēnīs Sulla cōpiīs Rōmānīs praeerat</latin>”, translate “<latin>cōpiīs Rōmānīs praeerat</latin>”"
      answer: "WAS IN CHARGE OF THE ROMAN TROOPS / WAS LEADING THE ROMAN TROOPS"
    boni:
      - question: "How would the word “<latin>Athēnīs</latin>” be translated in that same sentence?"
        answer: "IN / AT ATHENS"
      - question: "Now translate this sentence: “<latin>Quibuscum Sulla Athēnīs ad Āsiam nāvigābit?</latin>”"
        answer: "WITH WHOM WILL SULLA SAIL FROM ATHENS TO ASIA?"
  - tossup:
      question: "In Ovid’s <title>Metamorphoses</title>, what maiden is the daughter of the river-god Peneus?"
      answer: "DAPHNE"
    boni:
      - question: "How did Apollo mock Cupid, thus provoking Cupid’s revenge of making Apollo fall in love with Daphne?"
        answer: "MOCKED THE FACT THAT THE PUERILE AND LASCIVIOUS CUPID USED A BOW / SAID THAT THE BOW WAS HIS PROVINCE"
      - question: "What feat does Apollo cite as evidence that he is the supreme wielder of the bow?"
        answer: "KILLING THE PYTHON"
  - tossup:
      question: "What form of the verb <latin>sum</latin> would be required to translate this sentence into Latin: “I knew that he was a good man!”"
      answer: "<latin>ESSE</latin>"
    boni:
      - question: "If the sentence had said “I knew that he had been a good man,” what form of <latin>sum</latin> would be required?"
        answer: "<latin>FUISSE</latin>"
      - question: "If the sentence were changed to “I know that she will be a good daughter,” what would be the form of <latin>sum</latin>?"
        answer: "<latin>FUTŪRAM ESSE / FORE</latin>"
  - tossup:
      question: "How many of the Twelve Tables were written by the first board of <latin>decemvirī</latin> in 451 BC?"
      answer: "TEN"
    boni:
      - question: "Who was the only member of the first board of <latin>decemvirī</latin> to serve on the second board the next year?"
        answer: "APPIUS CLAUDIUS (CRASSUS INREGILLENSIS)"
      - question: "Whose murder heralded the end of the commission of the <latin>decemvirī</latin>?"
        answer: "VERGINIA’S"
  - tossup:
      question: "Where in imperial Rome would one find <latin>dimachaerī, essedāriī, thracēs, andabatae, murmillōnēs</latin>, and <latin>retiāriī</latin>?"
      answer: "AMPHITHEATER / ARENA / COLOSSEUM / AT A GLADIATORIAL GAME"
    boni:
      - question: "What was distinctive about the way an <latin>essedārius</latin> fought?"
        answer: "HE WAS MOUNTED / ATOP A CHARIOT"
      - question: "What was distinctive about the way a <latin>dimichaerus</latin> fought?"
        answer: "HE HAD TWO SWORDS <latin>2012 NJCL CERTAMEN INTERMEDIATE DIVISION</latin>"
