      - question: "Procne, Philomela, and Tereus were transformed into birds. Into what type of bird was Tereus transformed?"
        answer: "HOOPOE"
      - question: "What Athenian king was the father of Procne and Philomela?"
        answer: "PANDION"
  - tossup:
      question: "Translate: <latin>Caesarī nūntiātum est Helvētiōs per prōvinciam nostram iter facere</latin>"
      answer: "IT WAS ANNOUNCED TO CAESAR THAT THE HELVETIANS WERE MAKING A JOURNEY / TRAVELING THROUGH OUR PROVINCE"
    boni:
      - question: "Now translate this sentence: <latin>Helvētiī Caesarem secūtūrum esse nōn crēdidērunt</latin>"
        answer: "THE HELVETIANS DID NOT BELIEVE THAT CAESAR WOULD FOLLOW"
