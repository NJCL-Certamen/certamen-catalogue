tournament: "NJCL Certamen"
year: 2012
division: "Intermediate"
round: "Semifinals"
questions:
  - tossup:
      question: "What Latin term, used by John Locke to describe the human mind at birth, can refer to an emptied tablet or a “blank slate”?"
      answer: "<latin>TABULA RĀSA</latin> "
    boni:
      - question: "What Latin term was coined by Horace but could refer to Aristotle’s philosophy of the “golden mean”?"
        answer: "<latin>AUREA MEDIOCRITĀS</latin> "
      - question: "What two-word Latin phrase, which completes Horace’s quotation used as the motto of this convention, was popularized by Immanuel Kant’s essay <title>“What is Enlightenment?”</title> and literally means “dare to be wise”?"
        answer: "<latin>SAPERE AUDĒ</latin>"
  - tossup:
      question: "Identify the case and use of the form of the Latin word <latin>pēs</latin> in this Latin sentence: <latin>Hostibus appropinquantibus, mīlitēs Rōmānī mūrum quīnque pedum altitūdine maximā cum celeritāte aedificāvērunt</latin>"
      answer: "GENITIVE OF MEASURE / QUALITY / DESCRIPTION"
    boni:
      - question: "In that same sentence, what are the case and use of <latin>altitūdine</latin>?"
        answer: "ABLATIVE OF RESPECT / SPECIFICATION"
      - question: "What two other uses of the ablative can be found in this sentence?"
        answer: "ABLATIVE OF MANNER & ABLATIVE ABSOLUTE"
  - tossup:
      question: "Who killed and dismembered her son Itys in order to feed him to her husband as revenge for the rape of her sister Philomela?"
      answer: "PROCNE"
