  - tossup:
      question: "Of the nouns <latin>currus</latin>, <latin>cursus</latin>, <latin>cūra</latin>, <latin>cūria</latin>, and <latin>cycnus</latin>, which is being described in the following Latin sentence? <latin>Est locus ubi imperātor in pompā triumphālī</latin> stat"
