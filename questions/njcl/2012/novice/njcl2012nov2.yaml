tournament: "NJCL Certamen"
year: 2012
division: "Novice"
round: "Round 2"
questions:
  - tossup:
      question: "What Roman king supposedly received advice from a water nymph?"
      answer: "NUMA (POMPILIUS)"
    boni:
      - question: "What was this nymph’s name?"
        answer: "EGERIA"
      - question: "Numa was supposedly a native of what tribe?"
        answer: "SABINES"
  - tossup:
      question: "<latin>Quis Mārcum in</latin> Forum <latin>Rōmānum mīsit</latin>?"
      answer: "<latin>AGRICOLA</latin> "
    boni:
      - question: "<latin>Quae Mārcum amant</latin>?"
        answer: "<latin>IŪLIA ET CLAUDIA</latin> / <latin>IŪLIA CLAUDIAQUE</latin> "
      - question: "<latin>Quot rēs Mārcus emere iubēbātur</latin>?"
        answer: "<latin>OCTŌ (PĀNEM ET SEPTEM ŌVA)</latin> / <latin>DUĀS</latin> <latin>(PĀNEM ET ŌVA)</latin> / <latin>DUO</latin>"
  - tossup:
      question: "Translate this sentence: <latin>Multī in forō Cicerōnem audiēbant</latin>"
      answer: "MANY (MEN / PEOPLE) WERE LISTENING / USED TO LISTEN / LISTENED TO CICERO IN THE FORUM"
    boni:
      - question: "Translate this sentence: <latin>Cicerō in forō nōn</latin> iam <latin>dīcēbat</latin>"
        answer: "CICERO WAS NO LONGER SPEAKING IN THE FORUM"
      - question: "Now translate this sentence: <latin>Cicerō in forō nōbīs nōn dīcet</latin>"
        answer: "CICERO WILL NOT SPEAK TO US IN THE FORUM"
  - tossup:
      question: "Eioneus was the victim of the first murder of kin in Greek mythology. Name his son-in- law, who had killed him by throwing him into a fiery pit and so was eternally punished in the Underworld by being strapped to a fiery wheel"
      answer: "IXION"
    boni:
      - question: "Ixion had been invited to Olympus by Zeus, who was planning on purifying him for this murder. How did Ixion promptly betray Zeus’ kindness?"
        answer: "HE TRIED TO SEDUCE HERA / SEDUCED HERA’S LIKENESS (IN THE FORM OF A CLOUD)"
      - question: "Ixion lay with a cloud resembling Hera. According to some sources, this cloud gave birth to the progenitor of what race of monsters?"
        answer: "CENTAURS"
  - tossup:
      question: "Where on his body would a Roman wear <latin>mulleī, sculpōneae, cothurnī, soleae, caligae,</latin> and <latin>calceī</latin>?"
      answer: "ON HIS/HER FEET"
    boni:
      - question: "You are looking at a picture of various types of Roman footwear. Which of these pictures represents the shoes known as <latin>caligae</latin>?"
        answer: "A"
      - question: "What type of footwear is illustrated by picture “B”?"
        answer: "<latin>SOLEAE</latin>"
  - tossup:
      question: "The abbreviation <latin>AD</latin> (a-period-d-period) is used to reckon modern years. Give the Latin and the English for that abbreviation"
      answer: "<latin>ANNŌ DOMINĪ</latin> – (IN) THE YEAR OF THE/OUR LORD"
    boni:
      - question: "Give the Latin and the English for the abbreviation used by Romans to reckon the specific dates of events, <latin>A.U.C.</latin> (a-period-u-period-c-period)"
        answer: "<latin>AB URBE CONDITĀ / ANNŌ URBIS</latin> CONDITAE – FROM THE FOUNDING OF THE CITY / FROM THE CITY HAVING BEEN FOUNDED"
      - question: "An abbreviation found on some tombstones is <latin>aet</latin>. (a-e-t-period) What does that abbreviation indicate about the deceased?"
        answer: "HIS/HER AGE AT THE TIME OF DEATH"
  - tossup:
      question: "Which island in mythology is described here? It was the site to which Dionysus took Ariadne after he rescued her from Naxos. Its entire male population was murdered by its dissatisfied women. Name this island, where Hephaestus landed after being thrown from heaven"
      answer: "LEMNOS"
    boni:
      - question: "What daughter of the Lemnian king Thoas spared her father’s life during the women’s uprising by setting him afloat?"
        answer: "HYPSIPYLE"
      - question: "To what later visitor to Lemnos did Hypsipyle bear two sons?"
        answer: "JASON"
  - tossup:
      question: "The blood vessels known as “capillaries” are so named because of their physical resemblance to what body part?"
      answer: "HAIR"
    boni:
      - question: "The Latin word for what body part can be found in the word “frontal”?"
        answer: "FOREHEAD / FACE"
      - question: "The Latin word for what body part is found in the word “supercilious”?"
        answer: "EYEBROW / EYELID"
  - tossup:
      question: "Using a preposition, say in Latin “around the fields.”"
      answer: "<latin>CIRCUM AGRŌS / CAMPŌS</latin> (<latin>IUXTĀ</latin> & <latin>PROPE</latin> ARE ACCEPTABLE, BUT LAME)"
    boni:
      - question: "Using a preposition, say in Latin “on behalf of the senator.”"
        answer: "<latin>PRŌ SENĀTŌRE</latin>"
      - question: "Use a preposition and one other word to say in Latin “at the home of the merchants.”"
        answer: "<latin>APUD / AD MERCĀTŌRĒS</latin> "
  - tossup:
      question: "Who was Julius Caesar’s <latin>lēgātus</latin> and most trusted subordinate in Gaul?"
      answer: "(TITUS) LABIENUS"
    boni:
      - question: "Who was co-consul with Julius Caesar in 59 BC?"
        answer: "(MARCUS CALPURNIUS) BIBULUS"
      - question: "Who was co-consul with Julius Caesar in 44 BC?"
        answer: "MARC ANTONY / MARCUS ANTONIUS"
  - tossup:
      question: "When the Trojans awoke to find the horse sitting outside their city, they found only one man with it. Who was this supposedly abandoned Greek soldier?"
      answer: "SINON"
    boni:
      - question: "What two Trojan prophets unsuccessfully warned their countrymen about the horse – one with dire warnings, the other by launching a spear into its side?"
        answer: "CASSANDRA & LAOCOON"
      - question: "Sinon’s convincing story was that he had been abandoned by the contrivance of Odysseus and one of the Greek prophets. What Greek prophet was implicated in Sinon’s lie?"
        answer: "CALCHAS"
  - tossup:
      question: "Which of the following Latin words, if any, does not belong because of gender: <latin>multitūdō, mare, nāvis, lūx, fēmina</latin>?"
      answer: "<latin>MARE</latin>"
    boni:
      - question: "Which of these Latin words, if any, does not belong because of gender: <latin>somnium</latin>, <latin>vulnus, cornū, carmen</latin>?"
        answer: "NONE / ALL THE SAME GENDER (NEUTER)"
      - question: "Which of the following Latin words, if any, is a different declension from the others: <latin>aedificium, stilus, puer, tumultus</latin>?"
        answer: "<latin>TUMULTUS</latin>"
  - tossup:
      question: "Silenus, the companion of Dionysus, is sometimes said to be the brother and sometimes the son of what Greek woodland deity?"
      answer: "PAN"
    boni:
      - question: "Silenus, who was usually too drunk to walk, is often depicted riding what kind of animal?"
        answer: "DONKEY / ASS"
      - question: "Silenus is also said to be the father of what centaur accidentally killed by Hercules?"
        answer: "PHOLUS"
  - tossup:
      question: "In the sentence \"Marcus warned his brother Quintus,\" translate “brother Quintus” into Latin"
      answer: "<latin>FRĀTREM QUĪNTUM</latin>"
    boni:
      - question: "What is the term for this grammatical construction, in which two words or phrases define or refer to each other and appear in the same Latin case?"
        answer: "APPOSITION / APPOSITIVES"
      - question: "Now translate this sentence: \"Quintus has scolded Marcus with great anger.\""
        answer: "<latin>QUĪNTUS MĀRCUM MAGNĀ (CUM) ĪRĀ VITUPERĀVIT</latin> "
  - tossup:
      question: "What Roman emperor’s <latin>nōmen</latin> was Ulpius?"
      answer: "(MARCUS ULPIUS) TRAJAN(US)"
    boni:
      - question: "What Roman emperor’s <latin>nōmen</latin> was Cocceius?"
        answer: "(MARCUS COCCEIUS) NERVA"
      - question: "What Roman emperor was born Lucius Aelius Aurelius, but upon his ascension to the throne changed his first two names to Marcus Aurelius after his father?"
        answer: "(MARCUS AURELIUS) COMMODUS (ANTONINUS)"
  - tossup:
      question: "What mythological husband and wife were turned into kingfishers after the husband drowned on his way to Delphi?"
      answer: "CEYX & ALCYONE"
    boni:
      - question: "Apollodorus tells a much different tale of Ceyx and Alcyone, one in which he claims that their transformation was a punishment for what transgression?"
        answer: "THEY CALLED EACH OTHER ZEUS & HERA"
      - question: "In life, Ceyx had been known as a hospitable man, famously hosting a hero who repaid him by driving the Dryopes from his kingdom. Who was this hero?"
        answer: "HERACLES"
  - tossup:
      question: "Give the comparative form of the adjective <latin>trīstis</latin>"
      answer: "<latin>TRĪSTIOR</latin>"
    boni:
      - question: "Give the comparative form of the adjective form <latin>lātum</latin>"
        answer: "<latin>LĀTIUS</latin>"
      - question: "Give the comparative form of the adjective form <latin>magnum</latin>"
        answer: "<latin>MAIUS</latin>"
  - tossup:
      question: "What derivative of the Latin noun <latin>lēx</latin> means “faithful adherence to a person, cause, or concept; fidelity”?"
      answer: "LOYALTY"
    boni:
      - question: "What other derivative from the same Latin noun means “an associate or co-worker”?"
        answer: "COLLEAGUE"
      - question: "What other derivative of the Latin noun <latin>lēx</latin> means “a right, immunity, or benefit enjoyed by a person beyond the advantages of most others”?"
        answer: "PRIVILEGE"
  - tossup:
      question: "Nero Claudius Drusus was the brother of what Roman emperor?"
      answer: "TIBERIUS (JULIUS CAESAR AUGUSTUS)"
    boni:
      - question: "Who was Tiberius’ first wife?"
        answer: "VIPSANIA (AGRIPP(IN)A)"
      - question: "How many children were born to Tiberius and his second wife Julia?"
        answer: "ONE (WHO DIED IN INFANCY)"
  - tossup:
      question: "What are the case and use of the personal pronoun in the Latin sentence: <latin>Sunt mihi trēs sorōrēs</latin>?"
      answer: "DATIVE OF POSSESSION"
    boni:
      - question: "What other use of the dative case can be found in the sentence: <latin>Meae sorōrēs simillimae deābus fōrmā sunt</latin>?"
        answer: "DATIVE WITH SPECIAL ADJECTIVES"
      - question: "What third use of the dative can be found in this sentence: <latin>Sorōrēs pecūniam sibi obtinēbant</latin>?"
        answer: "DATIVE OF REFERENCE / (DIS)ADVANTAGE <latin>2012 NJCL CERTAMEN NOVICE DIVISION</latin>"
