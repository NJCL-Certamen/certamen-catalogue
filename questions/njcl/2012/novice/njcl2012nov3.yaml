tournament: "NJCL Certamen"
year: 2012
division: "Novice"
round: "Round 3"
questions:
  - tossup:
      question: "Give the Latin adjective and its English meaning from which we derive “assimilate.” "
      answer: "SIMILIS, LIKE / SIMILAR"
    boni:
      - question: "Give the Latin adjective and its English meaning from which we derive “potential.” "
        answer: "<latin>POTĒNS, POWERFUL / MIGHTY</latin>"
      - question: "Give the Latin adjective and its English meaning from which we derive “abbreviate.”"
        answer: "<latin>BREVIS</latin>, SHORT / BRIEF"
  - tossup:
      question: "With what general are the battles of Heraclea, Asculum, and Beneventum associated?"
      answer: "PYRRHUS"
    boni:
      - question: "What country was Pyrrhus’ homeland?"
        answer: "EPIRUS (prompt on “Greece”)"
      - question: "In what year was the battle of Beneventum, after which Pyrrhus withdrew from Italy and returned to Epirus?"
        answer: "275 BC"
  - tossup:
      question: "What deity, the offspring of the Titan Thaumas and the Oceanid Electra, served as the messenger used by Juno in the Aeneid, and was the goddess of the rainbow?"
      answer: "IRIS"
    boni:
      - question: "In the <title><latin>Argonautica</latin></title>, Iris appears in the nick of time to keep what two men from harming her sisters the Harpies?"
        answer: "ZETES & CALAIS"
      - question: "Zetes and Calais had been pursuing the Harpies to save what king of Salmydessus?"
        answer: "PHINEUS"
  - tossup:
      question: "What use of the ablative case can be found in the sentence: <latin>Hodiē sextā horā amīcam vidēbō</latin>?"
      answer: "TIME WHEN / WITHIN WHICH"
    boni:
      - question: "Which TWO sentences illustrate the ablative of manner?"
        answer: "1 & 3"
      - question: "What use of the ablative case is found in sentence #2?"
        answer: "CAUSE"
  - tossup:
      question: "After defeating a rival at Issus and another at Lugdunum, who gained undisputed possession of the imperial throne in 197 AD?"
      answer: "(LUCIUS) SEPTIMIUS SEVERUS"
    boni:
      - question: "What two rival claimants for the throne were defeated by Severus?"
        answer: "PESCENNIUS NIGER (AT ISSUS) & CLODIUS ALBINUS (AT LUGDUNUM)"
      - question: "In the same year he defeated Albinus, Severus mounted an expedition against what people, sacking their capital at Ctesiphon and carrying off thousands of slaves?"
        answer: "PARTHIANS"
  - tossup:
      question: "Translate the sentence: <latin>Mea māter mē numquam vocat</latin>"
      answer: "MY MOTHER NEVER CALLS ME"
    boni:
      - question: "Now translate this sentence: <latin>Māne exsurgere nōn possum</latin>"
        answer: "I AM NOT ABLE TO GET UP IN THE MORNING"
      - question: "Now translate this sentence: <latin>Crās ā meā mātre diū vīsitābor</latin>"
        answer: "TOMORROW I WILL BE VISITED BY MY MOTHER FOR A LONG TIME"
  - tossup:
      question: "Which of the Olympians gave oracles via the rustling of oak leaves at the Greek city Dodona?"
      answer: "ZEUS"
    boni:
      - question: "What deity, called the mother of Aphrodite by Homer, was worshipped alongside Zeus at Dodona?"
        answer: "DIONE"
      - question: "Athena once harvested an oak at Dodona to make what part of the Argo with what unusual characteristic?"
        answer: "TALKING BEAM / MAST"
  - tossup:
      question: "Of the words <latin>īnsula</latin>, <latin>arēna</latin>, <latin>patria</latin>, <latin>ager</latin>, and <latin>portus</latin>, which is best described by this Latin sentence? <latin>Est māteria</latin> super <latin>quam gladiātōrēs in Colossēō</latin> pugnant"
      answer: "<latin>ARĒNA</latin>"
    boni:
      - question: "Of the words <latin>īnsula</latin>, <latin>arēna</latin>, <latin>patria</latin>, <latin>ager</latin>, and <latin>portus</latin>, which is best described by this Latin sentence? <latin>Est locus prope terram in quem nāvēs ē marī nāvigant</latin>"
        answer: "<latin>PORTUS</latin>"
      - question: "Of the words <latin>īnsula</latin>, <latin>arēna</latin>, <latin>patria</latin>, <latin>ager</latin>, and <latin>portus</latin>, which is best described by this Latin sentence? <latin>Est locus in marī</latin> cuius <latin>fīnēs ā nūllā terrā</latin> tanguntur"
        answer: "<latin>ĪNSULA</latin>"
  - tossup:
      question: "What was the name of Julius Caesar’s mother?"
      answer: "AURELIA"
    boni:
      - question: "What astounding discovery did Aurelia make at the festival of the <latin>Bona Dea</latin> in 62 BC?"
        answer: "SHE FOUND CLODIUS PULCHER DRESSED AS A WOMAN"
      - question: "What unusual political move did Clodius Pulcher make in 59 BC?"
        answer: "ALTHOUGH HE WAS A PATRICIAN, HE WAS ADOPTED INTO A PLEBEIAN <latin>GĒNS</latin>"
  - tossup:
      question: "What is the Latin dative singular for the phrase “this sacred law”? "
      answer: "<latin>HUIC LĒGĪ SACRAE / HUIC IŪRĪ SACRŌ</latin> "
    boni:
      - question: "Change <latin>huic lēgī sacrae</latin> to the nominative plural"
        answer: "<latin>HAE LĒGĒS SACRAE</latin> "
      - question: "Change <latin>hae lēgēs sacrae</latin> to the genitive plural"
        answer: "<latin>HĀRUM LĒGUM SACRĀRUM</latin>"
  - tossup:
      question: "When sent to the court of King Strophius at Phocis, who met his best friend and companion Pylades?"
      answer: "ORESTES"
    boni:
      - question: "As recounted in Aeschylus’ Eumenides, where did Apollo send Orestes to stand trial for the murders of Clytemnestra and Aegisthus?"
        answer: "ATHENS / THE AREOPAGUS"
      - question: "Although acquitted at his trial, Orestes was still hounded by the Furies. Apollo promised that he would regain his sanity if he recovered what item from the land of the Taurians?"
        answer: "(A WOODEN) STATUE OF ARTEMIS"
  - tossup:
      question: "What kind of authority of one person over another is described by the Latin phrase <latin>dominica potestās</latin>?"
      answer: "POWER OF MASTER OVER SLAVE / <latin>PATERFAMILIĀS</latin> OVER THE HOUSEHOLD"
    boni:
      - question: "What similar Latin phrase described the authority that the <latin>paterfamiliās</latin> held over his family?"
        answer: "<latin>PATRIA POTESTĀS / PATRIA MAIESTĀS / PATRIUM IŪS / IMPERIUM PATERNUM</latin> "
      - question: "Although women in Rome were usually <latin>in potestāte</latin>, it was possible for a woman to be in control of her affairs. What Latin phrase describes such a woman?"
        answer: "<latin>SUĪ IŪRIS</latin> "
  - tossup:
      question: "What Latin word can be found in the mottoes of both Johns Hopkins University and Yale University?"
      answer: "<latin>VĒRITĀS</latin>"
    boni:
      - question: "Give the full motto of Yale, and translate"
        answer: "<latin>LŪX ET VĒRITĀS</latin>, LIGHT AND TRUTH"
      - question: "Give the full motto of Johns Hopkins, and translate. "
        answer: "<latin>VĒRITĀS VŌS LĪBERĀBIT</latin>, THE TRUTH WILL SET YOU FREE"
  - tossup:
      question: "What was the name of the first mortal-born woman in Greek mythology, the daughter of Epimetheus and Pandora?"
      answer: "PYRRHA"
    boni:
      - question: "Who was the eldest son of Pyrrha and her husband Deucalion who gave his name to the peoples of Greece?"
        answer: "HELLEN"
      - question: "Deucalion and Pyrrha were the only survivors of the flood sent against humanity. Upon what mountain did their boat run aground?"
        answer: "MOUNT PARNASSUS"
  - tossup:
      question: "Whom did Marcus love?"
      answer: "FULVIA"
    boni:
      - question: "Why did Marcus kill the horse?"
        answer: "HE DIDN’T LIKE IT / HE LOVED FULVIA"
      - question: "What did Fulvia do when she discovered what Marcus had done?"
        answer: "SHE FLED TO THE PRAETOR (BECAUSE SHE WAS AFRAID OF MARCUS)"
  - tossup:
      question: "Which of the following words, if any, does NOT come from the same Latin root as the others: libel, liberal, liberty, libertine?"
      answer: "LIBEL"
    boni:
      - question: "From what Latin noun with what meaning is “libel” derived?"
        answer: "<latin>LIBER</latin> (<latin>LIBRĪ</latin>), BOOK"
      - question: "What other derivative of the Latin noun liber means “the text of a work for a musical production or opera”?"
        answer: "LIBRETTO"
  - tossup:
      question: "What Roman emperor became the first to succeed his own brother when he ascended to the throne in 81 AD?"
      answer: "(TITUS FLAVIUS CAESAR) DOMITIAN(US)"
    boni:
      - question: "In what year was Domitian assassinated?"
        answer: "96 AD"
      - question: "Almost immediately after his death, the new emperor Nerva ordered that all public mention of Domitian’s name be obliterated. What is the Latin term for this action?"
        answer: "<latin>DAMNĀTIŌ MEMORIAE</latin> "
  - tossup:
      question: "<latin>Audī dīligenter et respondē Latīnē. Tū</latin> es servus <latin>et lavās sub lectō in quō</latin> dominus <latin>cottīdiē</latin> dormit. <latin>In quā</latin> parte <latin>domūs</latin> ades?"
      answer: "(<latin>IN) CUBICULŌ</latin>"
    boni:
      - question: "<latin>Respondē Latīnē</latin>. Nunc <latin>ambulās et</latin> prope <latin>implūvium stās. In quā</latin> parte <latin>domūs</latin> ades?"
        answer: "(<latin>IN) ĀTRIŌ</latin> "
      - question: "<latin>Respondē Latīnē</latin>. Nunc es domina, <latin>spectāns ancillās quae cēnam</latin> parant. <latin>In quā</latin> parte <latin>domūs</latin> ades?"
        answer: "(<latin>IN) CULĪNĀ</latin>"
  - tossup:
      question: "Say in Latin: \"The children cannot find the horses.\""
      answer: "<latin>LĪBERĪ EQUŌS INVENĪRE / REPERĪRE NŌN POSSUNT</latin> "
    boni:
      - question: "Now, say in Latin: “The children could not find the horses.”"
        answer: "<latin>LĪBERĪ EQUŌS INVENĪRE / REPERĪRE NŌN POTERANT / POTUĒRUNT</latin>"
      - question: "In the sentence \"One of the girls finally found the horses,\" translate “one of the girls” into Latin"
        answer: "<latin>ŪNA Ē (EX) PUELLĪS</latin>"
  - tossup:
      question: "In mythology, whose father is given alternately as Iasus or Schoeneus, although it is agreed that this father abandoned her in a forest where she was reared by a she-bear?"
      answer: "ATALANTA’S"
    boni:
      - question: "Two names are also given to the man who successfully won Atalanta’s hand by defeating her in a footrace. Give both names for this man"
        answer: "HIPPOMENES & MELANION"
      - question: "Atalanta gave birth to one child of disputed paternity. Name this child, who went on to become one of the Seven Against Thebes"
        answer: "PARTHENOPAEUS <latin>2012 NJCL CERTAMEN NOVICE DIVISION</latin>"
