    boni:
      - question: "What English word is derived from two Latin verbs, “to fall” and “to prepare”?"
        answer: "PARACHUTE"
      - question: "What other English word derived from the verb “to fall” describes the beat, rhythm, or measure of music or dancing?"
        answer: "CADENCE"
  - tossup:
      question: "Translate this sentence: <latin>Quīnque mēnsibus, dictātor rem pūblicam servāverit</latin>"
      answer: "(WITH)IN FIVE MONTHS, THE DICTATOR WILL HAVE SAVED THE REPUBLIC / STATE"
    boni:
      - question: "Translate: <latin>Dictātor cīvitātem magnō perīculō līberābit</latin>"
        answer: "THE DICTATOR WILL FREE THE STATE FROM / WITH / BY GREAT DANGER"
      - question: "Translate: <latin>Dictātor vir maximae prūdentiae esse vidētur</latin>"
        answer: "THE DICTATOR SEEMS TO BE A MAN OF GREATEST PRUDENCE / CAUTION"
  - tossup:
      question: "What Greek was blinded in his youth by his father Amyntor, had his sight restored by the centaur Cheiron, took part in the Calydonian Boar Hunt, went to Troy with Achilles, and, with Ajax and Odysseus, comprised the embassy sent to Achilles to convince him to rejoin the fight?"
      answer: "PHOENIX"
    boni:
      - question: "Although Phoenix died along the way, with whom did he set out for Greece after the end of the war?"
        answer: "NEOPTOLEMUS / PYRRHUS"
      - question: "What king of Phthia and father of Achilles had earlier installed Phoenix as king of the Dolopians?"
        answer: "PELEUS <latin>2012 NJCL CERTAMEN NOVICE DIVISION FINALS</latin> "
  - tossup:
      question: "Give the form of the Latin verb <latin>cōnferō</latin> for the following sentence: The rather sad women have been carried out of the sea into the harbor"
      answer: "<latin>COLLĀTAE SUNT</latin> "
    boni:
      - question: "Give the Latin for the entire subject of that same sentence"
        answer: "<latin>MISERIŌRĒS / TRĪSTIŌRĒS FĒMINAE / MULIERĒS</latin> "
      - question: "Give the Latin for both prepositional phrases in that sentence. "
        answer: "<latin>Ā / AB / Ē / EX MARĪ, IN</latin> PORTUM "
  - tossup:
      question: "The Social War had its roots in the plans of what Roman tribune to offer citizenship to all of the Italian allies?"
      answer: "(MARCUS) LIVIUS DRUSUS / DRUSUS THE YOUNGER"
    boni:
      - question: "In what year was Drusus assassinated?"
        answer: "91 BC"
      - question: "Drusus transferred control of the courts from the equestrians to the senators because of the equestrians’ unfair conviction of what man in 92 BC?"
        answer: "(PUBLIUS) RUTILIUS RUFUS"
  - tossup:
      question: "The official known in Republican Rome as the <latin>praefectus annōnae</latin> was in charge of what commodity?"
      answer: "GRAIN / GRAIN SUPPLY"
    boni:
      - question: "What other staple was added to the <latin>annōna</latin> in the 3rd century AD?"
        answer: "WINE"
      - question: "Until the institution of the <latin>praefectus annōnae</latin> in the late Republic, what other official took on the duties of overseeing the grain supply?"
