      - question: "Which of the following is NOT an antonym for the verb <latin>pūniō</latin>: <latin>parcō, laudō, laedō,</latin> and the idiom <latin>poenam dare</latin>?"
        answer: "<latin>LAEDŌ</latin>"
  - tossup:
      question: "Translate the following sentence into English: <latin>Proelium ācriter inter trēs gladiātōrēs contendēbātur.</latin> "
