    boni:
      - question: "Give the Latin verb at the root of “provost” and “postage”?"
        answer: "<latin>PŌNŌ / PŌNERE</latin>"
      - question: "Give the Latin verb at the root of “ravish” and “usurpation”?"
        answer: "<latin>RAPIŌ / RAPERE</latin>"
  - tossup:
      question: "What Roman emperor opened his reign by naming his son Gallienus as Caesar, and closed it with a disastrous defeat at the battle of Edessa, after which he was captured by the Persian king Shapur?"
      answer: "(PUBLIUS LICINIUS) VALERIAN(US)"
    boni:
      - question: "How did Shapur use his captive Valerian for the remainder of the Roman emperor’s life?"
        answer: "AS A MOUNTING BLOCK / TO HELP HIM GET ON HIS HORSE"
      - question: "Before the disaster with Shapur, Valerian had successfully recovered what Eastern city from Sassanid rebels?"
        answer: "ANTIOCH"
  - tossup:
      question: "What is the meaning of the verb <latin>faveō</latin>?"
      answer: "TO FAVOR / SUPPORT / BEFRIEND"
    boni:
      - question: "What is the meaning of the verb <latin>lātrō</latin>?"
        answer: "TO BARK / SNARL (AT)"
      - question: "What is the meaning of the verb <latin>cēlō</latin>?"
        answer: "TO HIDE / CONCEAL / DARKEN"
  - tossup:
