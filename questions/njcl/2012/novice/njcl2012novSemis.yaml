      - question: "In the Latin sentence “<latin>Barbarōrum vestēs sordidae cruentaeque erant</latin>”, what are the case and use of the word <latin>barbarōrum</latin>?"
        answer: "GENITIVE OF POSSESSION"
  - tossup:
      question: "Which one of the seven Pleiades’ lights is said to be dim because she is blushing at having married a mortal, Sisyphus, while her six sisters all had dalliances with gods?"
