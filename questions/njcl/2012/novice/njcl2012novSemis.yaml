tournament: "NJCL Certamen"
year: 2012
division: "Novice"
round: "Semifinals"
questions:
  - tossup:
      question: "When Telemachus first encountered his father upon his return to Ithaca, Odysseus was staying in the hut of what loyal Ithacan swineherd?"
      answer: "EUMAEUS"
    boni:
      - question: "Odysseus learned from Eumaeus that his father Laertes was also living in a hut, because he was disgusted at the behavior of the suitors and grieving his wife’s death. Who was his wife, the mother of Odysseus?"
        answer: "ANTICLEIA"
      - question: "In the conclusion of the <title>Odyssey</title>, Laertes killed Eupeithes, the father of which most arrogant of Penelope’s suitors?"
        answer: "ANTINOUS"
  - tossup:
      question: "Third-declension nouns ending in <latin>–ns</latin> or <latin>–rs</latin>, one-syllable third-declension nouns whose stems end in two or more consonants, and third-declension nouns ending in <latin>–is</latin> or <latin>–ēs</latin> with the same number of syllables in the nominative and genitive singulars are part of what subset of third-declension nouns?"
      answer: "I-STEMS"
    boni:
      - question: "Name the three endings that signal that a third-declension neuter noun is definitely an i-stem."
        answer: "<latin>-E, -AL, -AR</latin>"
      - question: "There are exceptions to every rule. What common third-declension noun for an animal fits the rules for i-stem nouns, but is NOT in fact an i-stem?"
        answer: "<latin>CANIS</latin>"
  - tossup:
      question: "At the beginning of the First Punic War, Appius Claudius Caudex and Marcus Valerius Messalla conducted a successful Roman offensive against what king of Syracuse?"
      answer: "HIERO (II) / HIERON"
    boni:
      - question: "By the end of the First Punic War, what Carthaginian was the commander of his country’s fleet?"
        answer: "HAMILCAR (BARCA)"
      - question: "Name the three sons of Hamilcar Barca, all of whom held positions of leadership against the Romans during the Second Punic War"
        answer: "HANNIBAL, HASDRUBAL, MAGO"
  - tossup:
      question: "To what group do all of the following mythological figures belong: Eurytus, Agrius, Mimas, Porphyrion, Alcyoneus, Enceladus?"
      answer: "GIANTS / GIGANTES"
    boni:
      - question: "What usually peaceful trio killed Agrius during the Gigantomachy by beating him to death with bronze clubs?"
        answer: "FATES / MOIRAE / PARCAE"
      - question: "In some stories, Enceladus was not killed but imprisoned. What mountain was thrown on top of him?"
        answer: "MT. ETNA"
  - tossup:
      question: "<latin>Quot legiōnēs cum cōnsule pugnant?</latin>"
      answer: "<latin>DUAE</latin> "
    boni:
      - question: "<latin>Quid mīlitēs servāvērunt</latin>?"
        answer: "<latin>PATRIAM / RŌMAM / URBEM</latin> "
      - question: "<latin>Cuius locī cōnsul crēdit mīlitēs virōs optimōs esse</latin>?"
        answer: "<latin>(HUIUS) URBIS / MUNDĪ / RŌMAE</latin>"
  - tossup:
      question: "What form of the Latin adjective <latin>dulcis</latin> would be needed to modify the noun form <latin>poētam</latin>?"
      answer: "<latin>DULCEM</latin>"
    boni:
      - question: "What form of the Latin adjective <latin>dulcis</latin> would be needed to modify the noun form <latin>diērum</latin>?"
        answer: "<latin>DULCIUM</latin>"
      - question: "What form of the Latin adjective <latin>dulcis</latin> would be needed to modify the noun form <latin>praemium</latin>?"
        answer: "<latin>DULCE</latin>"
  - tossup:
      question: "You are looking at a map of the regions of Italy as divided by Augustus. What number on the map corresponds to the region of Etruria?"
      answer: "VII (7)"
    boni:
      - question: "What number on the map shows where the Romans were defeated at the battle of the Trebia River?"
        answer: "IX (9)"
      - question: "What number on the map shows the region in which Bovianum, the ancient Samnite capital, was found?"
        answer: "IV (4)"
  - tossup:
      question: "Which two of the following Latin verbs are synonymous: <latin>cōnsūmō</latin>, <latin>ostendō</latin>, <latin>impellō</latin>, <latin>dēmōnstrō</latin>, <latin>saliō</latin>?"
      answer: "<latin>OSTENDŌ</latin> & <latin>DĒMŌNSTRŌ</latin>"
    boni:
      - question: "What are the meanings of the other verbs in the tossup – <latin>cōnsūmō</latin>, <latin>impellō</latin>, and <latin>saliō</latin>?"
        answer: "<latin>CŌNSŪMŌ</latin> – TO CONSUME / EAT; <latin>IMPELLŌ</latin> – TO FORCE / STRIKE / PUSH; <latin>SALIŌ</latin> – TO LEAP, JUMP"
      - question: "Give the principal parts of <latin>saliō</latin>"
        answer: "<latin>SALIŌ, SALĪRE, SALUĪ, SALTUS/-UM</latin> "
  - tossup:
      question: "The Isthmian games were instituted by Sisyphus in honor of his nephew, the child of Athamas and Ino, who died when his mother jumped into the sea with him. Name this child"
      answer: "MELICERTES"
    boni:
      - question: "Melicertes and Ino were transformed into sea deities. By what names were they then known?"
        answer: "PALAEMON & LEUCOTHEA"
      - question: "Ino had jumped into the sea because she had been driven mad by what goddess?"
        answer: "HERA"
  - tossup:
      question: "With one Latin word, translate into Latin the word “writing” in this sentence: “Marcia watched the senator writing letters.”"
      answer: "<latin>SCRĪBENTEM</latin>"
    boni:
      - question: "With one word, translate \"written\" in this sentence: \"The senator gave the written letters to Marcia.\""
        answer: "<latin>SCRĪPTĀS</latin>"
      - question: "Now translate this sentence: \"Marcia saw many things about the war in the written letters.\""
        answer: "<latin>MARCIA MULTĀS RĒS</latin> / MULTA <latin>DĒ BELLŌ IN LITTERĪS / EPISTULĪS SCRĪPTĪS VĪDIT / VIDĒBAT</latin> "
  - tossup:
      question: "What would the name <latin>centēnārius</latin> signify about a racing horse?"
      answer: "HE HAD WON 100 RACES"
    boni:
      - question: "Added during the reign of Augustus were the factions <latin>veneta</latin> and <latin>prasina</latin>. What colors represented these two factions?"
        answer: "BLUE & GREEN"
      - question: "What Latin word is used to describe the most common racing chariot, one that yoked four horses together?"
        answer: "<latin>QUADRĪGA</latin>"
  - tossup:
      question: "What youth, inspired by either the spine of a fish or the jawbone of a snake, invented the saw, an achievement that made his uncle Daedalus so envious that he threw the young man off the Acropolis?"
      answer: "PERDIX / TALUS"
    boni:
      - question: "Into what kind of bird did Athena change Perdix?"
        answer: "PARTRIDGE"
      - question: "Perdix is sometimes given credit for having invented two other useful items. Name either one"
        answer: "COMPASS / POTTER’S WHEEL"
  - tossup:
      question: "The Latin form <latin>capite</latin> can be both a noun and a verb. Identify both forms"
      answer: "PLURAL IMPERATIVE (SECOND PERSON, PRESENT ACTIVE OF <latin>CAPIŌ</latin>), ABLATIVE SINGULAR (NEUTER OF <latin>CAPUT</latin>)"
    boni:
      - question: "Make the form <latin>capite</latin> negative"
        answer: "<latin>NŌLĪTE CAPERE</latin>"
      - question: "Now, in Latin, order Publius and Sextus to sleep the entire day"
        answer: "<latin>DORMĪTE, PUBLĪ ET SEXTE, TŌTUM / OMNEM DIEM!</latin> "
  - tossup:
      question: "Why was Marius elected to a new consulship for 104 BC before he had even returned to Rome from Africa?"
      answer: "TO DEAL WITH THE INVADING NORTHMEN / GERMANS (CIMBRI & TEUTONES) // BECAUSE OF THE DISASTER AT ARAUSIO / ORANGE"
    boni:
      - question: "Marius defeated the Cimbri and Teutones one at a time. Where did he defeat the Cimbri?"
        answer: "VERCELLAE"
      - question: "What king of the Cimbri, victorious at Arausio, was later killed in the Roman victory at Vercellae in 101 BC?"
        answer: "BOIORIX"
  - tossup:
      question: "It’s time to compete in the Olympics! When recognized by the spotter, perform the following commands: <latin>Surge et in sitū</latin> curre"
      answer: "STUDENT SHOULD RISE AND RUN IN PLACE"
    boni:
      - question: "Perform the following commands: <latin>Surgite, omnēs, et celeriter natāre simulāte</latin>!"
        answer: "ALL STUDENTS SHOULD RISE AND PRETEND TO SWIM QUICKLY"
      - question: "Perform the following command: <latin>Dīc mihi Anglicē tē novem praemia aurea accēpisse</latin>"
        answer: "CAPTAIN SAYS IN ENGLISH THAT (S)HE HAS WON NINE GOLD MEDALS (GOLDEN AWARDS)"
  - tossup:
      question: "Which of the following states does NOT have a Latin motto that is exactly three words long: Mississippi, Colorado, Wyoming, Arkansas, Oregon?"
      answer: "ARKANSAS"
    boni:
      - question: "Give the three-word motto and its meaning for Wyoming"
        answer: "<latin>CĒDANT ARMA TOGAE</latin>, LET ARMS YIELD TO THE TOGA"
      - question: "Give the three-word motto and its meaning for Mississippi. "
        answer: "<latin>VIRTŪTE ET ARMĪS</latin>, BY VALOR AND ARMS"
  - tossup:
      question: "What emperor issued the <latin>Cōnstitūtiō Antōnīniāna</latin>, thus granting Roman citizenship to all the empire’s freedmen, although he is more unfavorably known for devaluing the <latin>dēnārius</latin> and ordering the murder of his younger brother Geta?"
      answer: "(MARCUS AURELIUS SEVERUS ANTONINUS) CARACALLA"
    boni:
      - question: "What praetorian prefect succeeded Caracalla?"
        answer: "(MARCUS OPELLIUS SEVERUS) MACRINUS"
      - question: "Macrinus fled from a defeat at Antioch in 218 AD and was killed shortly thereafter. What Severan was then installed as emperor?"
        answer: "(MARCUS AURELIUS ANTONINUS) ELAGABALUS / HELIOGABALUS / (VARIUS AVITUS) BASSIANUS"
  - tossup:
      question: "Give the meaning of the Latin word from which we derive all of the following: chance, decay, casualty, accident"
