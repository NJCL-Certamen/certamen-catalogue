      - question: "Who was the single offspring of Sisyphus and Merope?"
        answer: "GLAUCUS"
      - question: "The other account of the dim Pleiad says that it was not Merope, but which of her sisters, who is mourning the destruction of Troy and her son Dardanus?"
        answer: "ELECTRA"
  - tossup:
      question: "You are looking at a Roman frieze. What one mythological character is depicted in each scene?"
