  - tossup:
      question: "What Roman emperor precipitated his own assassination when he named Lucius Calpurnius Piso as his successor instead of one of his major early supporters, Otho?"
      answer: "(SERVIUS SULPICIUS) GALBA"
    boni:
      - question: "During Galba’s short reign, where did legions rebel and proclaim Vitellius as their emperor?"
        answer: "THE RHINE / GERMANIA / (LOWER) GERMANY"
      - question: "At what battle did the forces of Vitellius defeat the forces of Otho?"
        answer: "FIRST BATTLE OF CREMONA / BEDRIACUM"
  - tossup:
      question: "In the Latin sentence “<latin>Clientēs Caesaris magnum timōrem barbarōrum habuērunt”</latin>, what are the case and use of the word <latin>barbarōrum</latin>?"
      answer: "OBJECTIVE GENITIVE"
    boni:
      - question: "In the Latin sentence <latin>Caesar clientibus dīxit magnam partem barbarōrum amīcissimam esse</latin>”, what are the case and use of the word <latin>barbarōrum</latin>?"
