    boni:
      - question: "Identify the labor depicted in the scene labeled “A”"
        answer: "LERNEAN HYDRA"
      - question: "Identify the labor depicted in the scene labeled “B”"
        answer: "STYPMHALIAN BIRDS"
  - tossup:
      question: "Which of the following words, if any, is derived from the same Latin word as “somber”: insomnia, soundless, umbrella, consumption?"
