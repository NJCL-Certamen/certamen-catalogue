    boni:
      - question: "Give the Latin noun and its meaning from which “insomnia” is derived"
        answer: "<latin>SOMNUS, SOMNĪ</latin> – SLEEP / <latin>SOMNIUM, SOMNĪ</latin> – DREAM"
      - question: "Give the ultimate verb from which we derive “consumption.”"
        answer: "<latin>SUMŌ</latin>"
  - tossup:
      question: "What consul of 503 BC was awarded a triumph for his defeat of the Sabines, but is better known for a speech he made in 494 BC in which he compared the patrician class in Rome to the stomach?"
      answer: "MENENIUS AGRIPPA"
    boni:
      - question: "What specific type of laws were the plebeians protesting when they seceded to the <latin>Mōns</latin> <latin>Sacer</latin>?"
        answer: "DEBT LAWS"
      - question: "In what year did the plebs secede a second time after the patricians balked at adopting the Twelve Tables?"
        answer: "449 BC"
  - tossup:
      question: "What Latin quotation, ascribed to Juvenal, urges people to train their mental and physical abilities to the highest degree possible?"
      answer: "<latin>MĒNS SĀNA IN</latin> CORPORE <latin>SĀNŌ</latin> "
    boni:
      - question: "In another famous quotation, Juvenal refers to the scarcity of virtuous women in his time. Give that two-word Latin phrase"
        answer: "<latin>RĀRA AVIS</latin>"
      - question: "To what actual rare bird is Juvenal referring with the quotation <latin>rāra avis</latin>?"
        answer: "A BLACK SWAN"
  - tossup:
      question: "What native Italian claimed descent from Danae, the mother of Perseus, was the son of Daunus and Venilia, and had been engaged to the princess Lavinia before she was offered to Aeneas?"
