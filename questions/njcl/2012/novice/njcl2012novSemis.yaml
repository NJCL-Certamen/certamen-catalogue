      question: "Using a dative, say in Latin: “In every town, the Romans had soldiers.” "
      answer: "<latin>IN OMNĪ OPPIDŌ</latin>/URBE / OMNIBUS <latin>OPPIDĪS</latin>/URBIBUS ERANT / <latin>FUĒRUNT MĪLITĒS RŌMĀNĪS</latin> "
    boni:
      - question: "Change the phrase <latin>in omnī oppidō</latin> to the plural"
        answer: "<latin>IN OMNIBUS OPPIDĪS</latin> "
      - question: "Now, with three words, say in Latin: “Where did the soldiers come from?” "
        answer: "<latin>UNDE MĪLITĒS VĒNĒRUNT?</latin> "
