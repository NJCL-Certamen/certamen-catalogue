        answer: "PALLAS"
      - question: "In the climactic battle between Turnus and Aeneas, Turnus loses all of his strength and sinks to his knees after attempting to kill Aeneas in what way?"
        answer: "THROWING A ROCK (A HUGE ROCK, A HUGE ANCIENT ROCK) AT HIM"
  - tossup:
      question: "What Latin verb is at the root of “grant” and “incredulity”?"
