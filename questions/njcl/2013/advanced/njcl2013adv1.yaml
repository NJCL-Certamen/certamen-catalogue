tournament: "NJCL Certamen"
year: 2013
division: "Advanced"
round: "Round 1"
questions:
  - tossup:
      question: "What playwright was criticized for spoiling many of his plays by adding foreign material, a charge which he defended in the prologue of his play <title><latin>Andria</latin></title>?"
      answer: "(PUBLIUS TERENTIUS AFER) TERENCE"
    boni:
      - question: "What was the name of this process of adding foreign material into Latin works?"
        answer: "<latin>CONTĀMINĀTIŌ</latin> "
      - question: "Which of Terence’s plays was perhaps his worst, since it had to be performed three times before it could keep an audience?"
        answer: "<title><latin>HECYRA</latin></title>"
  - tossup:
      question: "“Defy”, “Federalist”, and “Fiancé” all come from what Latin verb with what meaning?"
      answer: "<latin>FĪDŌ</latin> – TRUST"
    boni:
      - question: "“Rally” and “Lien” are derived from what Latin verb with what meaning?"
        answer: "<latin>LIGŌ</latin> – BIND"
      - question: "“Situation” is derived from what Latin verb with what meaning?"
        answer: "<latin>SINŌ</latin> – ALLOW"
  - tossup:
      question: "What foster son of Polybus and Merope left Corinth and travelled to Thebes where he became king?"
      answer: "OEDIPUS"
    boni:
      - question: "What goddesses taught the Sphinx the riddle that Oedipus eventually solved?"
        answer: "THE MUSES"
      - question: "What son of Creon had tried to answer the Sphinx’s riddle and failed?"
        answer: "HAEMON"
  - tossup:
      question: "What case is regularly used with the preposition <latin>cōram</latin>?"
      answer: "ABLATIVE"
    boni:
      - question: "What case is used with the preposition <latin>cis</latin>?"
        answer: "ACCUSATIVE"
      - question: "What case is used with the preposition <latin>praeter</latin>?"
        answer: "ACCUSATIVE"
  - tossup:
      question: "According to legend, who was the first Roman to win the <latin>Spōlia Opīma</latin>?"
      answer: "ROMULUS"
    boni:
      - question: "For what feat in general was the <latin>Spōlia Opīma</latin> awarded?"
        answer: "DEFEATING AN ENEMY COMMANDER IN SINGLE COMBAT"
      - question: "What Sabine chieftain did Romulus vanquish to win the <latin>Spōlia Opīma</latin>?"
        answer: "ACRON"
  - tossup:
      question: "Give a synonym for the Latin noun <latin>antrum</latin>"
      answer: "<latin>SPĒLUNCA / CAVERNA / CĀVUM</latin>"
    boni:
      - question: "Give a synonym for the Latin noun <latin>stirps</latin>"
        answer: "<latin>RĀMUS / PRŌLĒS / RĀDĪX / GĒNS / GENUS / LĪBERĪ / FAMILIA / SUBOLES / PRŌGENIĒS / TRUNCUS</latin>"
      - question: "Give a synonym for the Latin noun <latin>nebula</latin>"
        answer: "<latin>NIMBUS / FŪMUS / NŪBĒS / ĀĒR / CĀLĪGŌ</latin> "
  - tossup:
      question: "Who accused Hippolytus of rape, which led Theseus to curse and kill him?"
      answer: "PHAEDRA"
    boni:
      - question: "How did Hippolytus die?"
        answer: "(A BULL JUMPED OUT OF THE SEA, STARTLED HIPPOLYTUS’ HORSES AND) HE WAS DRAGGED TO DEATH"
      - question: "Who came to tell Theseus that Phaedra had fooled him and that he had killed his son for no reason?"
        answer: "ARTEMIS / DIANA"
  - tossup:
      question: "Alfenus Varus, Hortensius Hortalus, Gaius Calvus, Cornelius Nepos and Gaius Memmius are all mentioned in what Neoteric poet’s work, which he often referred to as <latin>nūgae</latin>?"
      answer: "(GAIUS VALERIUS) CATULLUS"
    boni:
      - question: "Of the authors mentioned in the toss-up, which one did Catullus accompany on a journey to Bithynia, during which Catullus visited the tomb of his brother?"
        answer: "(GAIUS) MEMMIUS"
      - question: "Of the authors mentioned in the toss-up, to which one did Catullus address his translation of Callimachus’ <title>Lock Of Berenice</title>?"
        answer: "HORTENSIUS (HORTALUS)"
  - tossup:
      question: "What office was created at the start of the Republic to aid a dictator in times of distress, and literally means “master of the cavalry”?"
      answer: "<latin>MAGISTER EQUITUM</latin> "
    boni:
      - question: "Most of the time, the Dictator was able to choose his own <latin>magister equitum</latin>, but occasionally, what might give the Senate that power?"
        answer: "(ISSUING A) <latin>SENĀTŪS CŌNSULTUM ULTIMUM</latin> "
      - question: "Ceremonially, how many <latin>lictōrēs</latin> accompanied a <latin>magister equitum</latin>?"
        answer: "12"
  - tossup:
      question: "Make the phrase <latin>anceps impetus</latin> dative singular"
      answer: "<latin>ANCIPITĪ IMPETUĪ</latin>"
    boni:
      - question: "Make <latin>ancipitī impetuī</latin> plural"
        answer: "<latin>ANCIPITIBUS IMPETIBUS</latin>"
      - question: "Make <latin>ancipitibus impetibus</latin> genitive"
        answer: "<latin>ANCIPITIUM IMPETUUM</latin>"
  - tossup:
      question: "What Latin quotation from Juvenal reminds us that even those in charge must be monitored?"
      answer: "<latin>QUIS CUSTŌDIET IPSŌS CUSTŌDĒS</latin>  "
    boni:
      - question: "Complete this quotation from Vergil, which questions why the heavens can allow such evils to occur: “<latin>Tantaene animīs _____</latin>"
        answer: "<latin>CAELESTIBUS ĪRAE</latin>"
      - question: "What Latin quotation from Cicero reminds us that we are not born for just our own   purposes, but also for others?"
        answer: "<latin>NŌN NŌBĪS SŌLUM NĀTĪ SUMUS</latin> "
  - tossup:
      question: "Play Ball! Although the Romans didn’t have most of the sports we enjoy today, it’s fun to imagine what it would be like if they did. Of course, no matter the sport, they would certainly need an experienced <latin>arbiter</latin>. What would this be?"
      answer: "REFEREE / UMPIRE / JUDGE"
    boni:
      - question: "In American football, what bonus scoring might be called a <latin>pūnctum additīcium</latin>?"
        answer: "(KICKING AN) EXTRA POINT"
      - question: "What sport might the Romans have referred to simply as <latin>pilamālleus</latin>?"
        answer: "GOLF / CROQUET / POLO / FIELD HOCKEY"
  - tossup:
      question: "According to some Greek traditions, what specific event preceding the sack of Troy prompted Aeneas to abandon the city and take refuge on Mt. Ida?"
      answer: "DEATH OF LAOCOON"
    boni:
      - question: "According to other traditions, to what man, represented by letter “A”, was Aeneas given as a slave?"
        answer: "NEOPTOLEMUS / PYRRHUS"
      - question: "Who is labeled “B”?"
        answer: "PRIAM"
  - tossup:
      question: "What emperor served as a Praetorian Prefect under his father, was deified by his brother, and remarked on his deathbed “I have made but one mistake” in 81 A.D.?"
      answer: "TITUS (FLAVIUS CAESAR VESPASIANUS AUGUSTUS)"
    boni:
      - question: "During his first campaign against Jerusalem, what princess did Titus meet and engage in a prolonged affair?"
        answer: "BERENICE"
      - question: "What office did Titus assume for his entire reign to underscore his promise not to cause or connive the death of any man?"
        answer: "<latin>PONTIFEX MAXIMUS</latin> "
  - tossup:
      question: "What Silver Age author strayed from his philosophical writing when he wrote a Menippean satire concerning the transformation of the emperor Claudius into a pumpkin?"
      answer: "(LUCIUS ANNAEUS) SENECA THE YOUNGER"
    boni:
      - question: "What Latin term was given to works such as Seneca’s <title><latin>Herculēs Furēns</latin></title> and <title><latin>Mēdēa</latin></title>, which were tragedies involving Greek subjects?"
        answer: "<title><latin>FĀBULAE COTHURNĀTAE / FĀBULAE CREPIDĀTAE</latin></title>"
      - question: "In which work of Seneca, dedicated to his brother Gallio as a complement to <title><latin>Dē Īrā</latin></title>, does he argue that Nature is the true reason for man’s happiness?"
        answer: "<title><latin>DĒ VĪTĀ BEĀTĀ</latin></title> <latin>/</latin> <title>ON THE BLESSED LIFE</title>"
  - tossup:
      question: "Metallurgy, cosmology, anthropology, geography, botany, and physiology are all topics covered in what 37 book encyclopedia by Pliny the Elder?"
      answer: "<title><latin>NĀTŪRĀLIS HISTORIA</latin></title> <title>/ NATURAL HISTORY</title> "
    boni:
      - question: "To what future emperor did Pliny the Elder dedicate the <title><latin>Nātūrālis Historia</latin></title>?"
        answer: "TITUS"
      - question: "What author, who wrote just as voluminously as Pliny, was Pliny’s single most important reference in writing his <title><latin>Nātūrālis Historia</latin></title>?"
        answer: "VARRO"
  - tossup:
      question: "Translate into Latin using a passive periphrastic: I must sail to Athens"
      answer: "<latin>MIHI ATHĒNĀS NĀVIGANDUM EST</latin> "
    boni:
      - question: "Now using a passive periphrastic, say in Latin: We must obey the law to become citizens"
        answer: "<latin>Ā NŌBĪS LĒGĪ PARENDUM EST UT CĪVĒS FIĀMUS</latin> "
      - question: "Finally, using a passive periphrastic, say in Latin: Unless we are free, the ships will have to be burned"
        answer: "<latin>NISI LĪBERĪ ERIMUS / FUERIMUS, NĀVĒS ŪRENDAE / INCENDENDAE ERUNT</latin> "
  - tossup:
      question: "Who was transformed into a myrrh tree after suffering the shame of committing incest with her father Cinyras?"
      answer: "MYRRHA / SMYRNA"
    boni:
      - question: "What son of Myrrha was “born” when a boar broke open the trunk of the tree, thus letting him out?"
        answer: "ADONIS"
      - question: "Who was transformed into frankincense when her father discovered that she had lain with Helius?"
        answer: "LEUCOTHOË"
  - tossup:
      question: "<latin>Quōrum imperātor erat perītus?</latin>"
      answer: "<latin>ARMŌRUM ET EQUITANDĪ</latin> "
    boni:
      - question: "<latin>Quantā celeritāte viās cōnfēcit?</latin>"
        answer: "<latin>INCRĒDIBILĪ / ULTRĀ QUAM CRĒDIBILE</latin>"
      - question: "<latin>Quō modō imperātor flūmina trānsīvit?</latin>"
        answer: "<latin>NANDŌ / INNITENDŌ INFLĀTĪS ŪTRIBUS</latin>"
  - tossup:
      question: "What emperor, despite initially disbanding the Praetorian Guard, saw the rise of both Falvius Plautianus and Papinian as Praetorian Prefects during his reign from 193 to 211 A.D.?"
      answer: "(LUCIUS) SEPTIMIUS SEVERUS"
    boni:
      - question: "Although his relations with the Senate were never good, Severus was a talented general and expanded Rome’s boundaries. What Parthian capitol did he sack in 198 A.D., extending the <latin>līmēs Arabicus</latin>?"
        answer: "CTESIPHON"
      - question: "Upon his death, Severus left his sons with three pieces of advice. Name them"
        answer: "BE HARMONIOUS (TO EACH OTHER), ENRICH THE SOLDIERS, SCORN ALL OTHER MEN <latin>2013 NJCL CERTAMEN ADVANCED DIVISION</latin>"
