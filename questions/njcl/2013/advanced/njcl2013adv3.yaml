tournament: "NJCL Certamen"
year: 2013
division: "Advanced"
round: "Round 3"
questions:
  - tossup:
      question: "Which labor of Herakles forced him to deal with Helios, who angered Herakles because of the searing heat in northern Africa?"
      answer: "CATTLE OF GERYON (prompt if “10th” is given)"
    boni:
      - question: "What item did Helios lend Herakles as a reward for his bravado?"
        answer: "A GOLDEN CUP / VESSEL"
      - question: "When Herakles reached the land of Geryon, what herdsman of Hades told Geryon about Herakles’ presence?"
        answer: "MENOETES"
  - tossup:
      question: "What author, instead of invoking the <latin>Camēnae</latin> of previous authors, appealed to <latin>Mūsae</latin> to begin his 18-book epic, the <title><latin>Annālēs</latin></title>?"
      answer: "(QUINTUS) ENNIUS"
    boni:
      - question: "Ennius refused to cover the First Punic War out of respect for the work of which of his contemporaries?"
        answer: "(GNAEUS) NAEVIUS"
      - question: "What work of Ennius recounts the campaigns of Marcus Fulvius Nobilior against the Aetolians?"
        answer: "<title><latin>AMBRACIA</latin></title>"
  - tossup:
      question: "Give a synonym for the Latin adjective <latin>flāvus</latin>"
      answer: "<latin>AUREUS / AUREŌLUS / CROCEUS</latin>"
    boni:
      - question: "Give an antonym for the Latin adjective <latin>locuplēs</latin>"
        answer: "<latin>MISER / PAUPER / HUMILIS</latin> "
      - question: "Give an antonym for the Latin adjective <latin>crassus</latin>"
        answer: "<latin>GRACILIS / MACER / TENUIS</latin> "
  - tossup:
      question: "What temple was commissioned by Augustus to commemorate the battle of Philippi?"
      answer: "<latin>MĀRS ULTOR</latin> / MARS THE AVENGER"
    boni:
      - question: "What temple, denoted by the letter “A”, was commissioned by Hadrian and thought to be the largest temple in Ancient Rome?"
        answer: "<latin>VENUS ET RŌMA</latin> / VENUS AND ROME"
      - question: "What temple, denoted by the letter “B” and located in the <latin>Forum Boarium</latin>, is sometimes erroneously identified as the Temple of Vesta?"
        answer: "<latin>HERCULES (VICTOR / INVICTUS)</latin> / HERCULES (VICTOR / THE UNCONQUERED)"
  - tossup:
      question: "For the verb <latin>terō, terere</latin>, give the 2nd person plural pluperfect active subjunctive"
      answer: "<latin>TRĪVISSĒTIS</latin>"
    boni:
      - question: "Make <latin>trīvissētis</latin> singular and perfect"
        answer: "<latin>TRĪVERĪS</latin>"
      - question: "Make <latin>trīverīs</latin> passive and indicative"
        answer: "<latin>TRĪTUS (A/UM) ES</latin>"
  - tossup:
      question: "In Latin abbreviations, what effect does adding an additional final letter have on the meaning of the abbreviation, as in the abbreviation <latin>seqq.</latin>?"
      answer: "MAKES IT PLURAL"
    boni:
      - question: "Give the Latin and English for the abbreviation <latin>seqq</latin>"
        answer: "<latin>SEQUENTĒS</latin> – (THOSE) FOLLOWING"
      - question: "Give the Latin and English for the abbreviation <latin>ff</latin>"
        answer: "<latin>FOLIĪS</latin> – ON THE (FOLLOWING) PAGES"
  - tossup:
      question: "What general’s reduction of Germany and recovery of two of the three standards lost at Teutoburg Forest earned him a triumph from Tiberius and a cognomen befitting his success?"
      answer: "GERMANICUS (JULIUS CAESAR)"
    boni:
      - question: "What relation was Tiberius to Germanicus?"
        answer: "UNCLE"
      - question: "What governor of Syria did Germanicus recall from his duty, an action that many believe led to his mysterious poisoning and death in 19 A.D.?"
        answer: "(GNAEUS CALPURNIUS) PISO"
  - tossup:
      question: "What rhetorical device, other than alliteration, is seen in the phrase <latin>prōra in</latin> portum <latin>nāvigāvit</latin>?"
      answer: "SYNECDOCHE (prompt on metonymy)"
    boni:
      - question: "What rhetorical device, other than assonance, is seen in the phrase <latin>hōstēs exercitus interfēcit et proelium coepit</latin>?"
        answer: "HYSTERON PROTERON / SYNCHYSIS "
      - question: "What rhetorical device, other than alliteration, is seen in this line from the <title>Aeneid</title>: <latin>Longa tibi exsilia et vāstum maris aequor arandum</latin>?"
        answer: "ZEUGMA"
  - tossup:
      question: "What son of Aeolus and Enarete was punished in the Underworld for impersonating Zeus by throwing torches to simulate lightning?"
      answer: "SALMONEUS"
    boni:
      - question: "What god seduced Salmoneus’ daughter Tyro in the guise of a river god?"
        answer: "POSEIDON"
      - question: "What king of Iolcus was the son of Tyro and Poseidon?"
        answer: "PELIAS"
  - tossup:
      question: "Which of the following, if any, does NOT belong because of derivation: Surprise, reply, pry, entrepreneur, apprehend?"
      answer: "REPLY"
    boni:
      - question: "From what Latin verb, with what meaning, is “reply” derived?"
        answer: "<latin>PLICŌ</latin> – FOLD"
      - question: "What English word, derived from the root of the other words in the toss-up, means “a person who works for another in order to learn a trade”?"
        answer: "APPRENTICE"
  - tossup:
      question: "The adjective <latin>differtus</latin>, the phrase <latin>ūsus est</latin>, and the verb <latin>vescor</latin> all take what case in Latin?"
      answer: "ABLATIVE"
    boni:
      - question: "What adjective that regularly takes an ablative means “relying on”?"
        answer: "<latin>FRĒTUS</latin>"
      - question: "What use of the ablative case can be associated with the use of all of these words?"
        answer: "MEANS / INSTRUMENT"
  - tossup:
      question: "Who proposed confiscating all but 500 <latin>iūgera</latin> of the <latin>ager publicus</latin> from existing landowners and distributing the rest of the land acquired from the 2nd Punic War as part of his reforms of 133 B.C.?"
      answer: "TIBERIUS (SEMPRONIUS) GRACCHUS"
    boni:
      - question: "Gracchus had the help of certain key nobles in the Senate who helped pass his reform. Name one of them"
        answer: "(APPIUS) CLAUDIUS PULCHER / (PUBLIUS) LICINIUS CRASSUS / (PUBLIUS) MUCIUS SCAEVOLA"
      - question: "While his allies were strong, so too was opposition. What tribune did some senators coerce into vetoing Gracchus’ agrarian legislation?"
        answer: "(MARCUS) OCTAVIUS"
  - tossup:
      question: "Translate into English: <latin>Aliquisne prōgrediētur ut praemium rapiat?</latin>"
      answer: "WILL ANYONE (SOMEONE) COME FORWARD TO CLAIM / GRAB THE PRIZE?"
    boni:
      - question: "Translate into English: <latin>Tametsī Quīntus modo duābus legiōnibus praeest, multitūdō hostium eī vincenda erit</latin>"
        answer: "ALTHOUGH / EVEN IF QUINTUS IS IN CHARGE OF ONLY TWO LEGIONS, HE WILL (STILL) HAVE TO DEFEAT A LARGE NUMBER OF ENEMIES"
      - question: "Translate into English: <latin>Barbarī morārī iūssī sunt quoad portae aperīrentur</latin>"
        answer: "THE FOREIGNERS / BARBARIANS HAVE BEEN / WERE ORDERED TO DELAY / WAIT UNTIL THE GATES WERE OPENED"
  - tossup:
      question: "What author’s <latin>magnum opus</latin> ends with the great Athenian plague of 430 B.C. to illustrate the power of natural phenomena?"
      answer: "(TITUS) LUCRETIUS (CARUS)"
    boni:
      - question: "What author’s book of 150 satires was the first to combine prose with poetical features?"
        answer: "(MARCUS TERENTIUS) VARRO"
      - question: "What author’s sixteen-book history is divided into eight pairs, and includes a book on foreign military leaders?"
        answer: "(CORNELIUS) NEPOS"
  - tossup:
      question: "What Greek warrior at Troy had been a member of the Calydonian boar hunt, and had survived an attack of the boar by using his spear to vault onto a tree?"
      answer: "NESTOR"
    boni:
      - question: "Which son of Nestor died at Troy?"
        answer: "ANTILOCHUS"
      - question: "What other son survived the Trojan War and returned home with Nestor?"
        answer: "THRASYMEDES"
  - tossup:
      question: "What Greek was stoned to death after being framed for collaborating with the Trojans, thus giving Odysseus the revenge he wanted for this man’s revelation that he was not crazy, proven by throwing Telemachus in front of a plow?"
      answer: "PALAMEDES"
    boni:
      - question: "Who took vengeance upon the Greeks for Palamedes’ death as they sailed home from Troy?"
        answer: "NAUPLIUS"
      - question: "What Cretan woman, who had been sold to him by her father, did Nauplius rape to father Palamedes?"
        answer: "CLYMENE"
  - tossup:
      question: "What Latin author, born at Thagaste, did Jerome call “<latin>conditor antīquae rūrsum fidēi</latin>” for his reinvigoration of Christian writing?"
      answer: "AUGUSTINE"
    boni:
      - question: "Which work of Augustine takes the form of an apology in 22 books?"
        answer: "<title>CITY OF GOD / <latin>DĒ CĪVITĀTE DEĪ</latin></title>"
      - question: "Other than paganism, name another belief system Augustine adhered to before his conversion to orthodox Christianity"
        answer: "MANICHAEISM / (NEO) PLATONISM"
  - tossup:
      question: "Name one thing that Catiline’s body is able to endure"
      answer: "HUNGER / STARVATION / (FRIGID) COLD / LACK OF SLEEP"
    boni:
      - question: "How is Catiline’s mentality described?"
        answer: "BOLD / UNDERHANDED / CAPRICIOUS"
      - question: "What does Sallust say about Catiline with his final chiasmus in this passage?"
        answer: "ENOUGH ELOQUENCE (BUT) LITTLE WISDOM"
  - tossup:
      question: "Name one of the two men who were elected consuls in 297 B.C. to take charge of the 3rd Samnite War"
      answer: "(QUINTUS) FABIUS (MAXIMUS) RULLIANUS / (PUBLIUS) DECIUS MUS"
    boni:
      - question: "At what battle in 297 B.C. did both Fabius Rullianus and Decimus Mus reverse the course of the war with a rousing victory?"
        answer: "TIFERNUM"
      - question: "What commander, the first notable member of a famous military <latin>gēns</latin>, fought an indecisive battle at Volterra in 298 B.C. before serving as legate under Rullianus at Tifernum?"
        answer: "(LUCIUS CORNELIUS) SCIPIO BARBATUS"
  - tossup:
      question: "<latin>Respondē Latīnē: Quot sunt ter quīndecim?</latin>"
      answer: "<latin>QUADRĀGINTĀ (ET) QUĪNQUE / QUĪNQUE ET QUADRĀGINTĀ</latin> "
    boni:
      - question: "<latin>Respondē Latīnē: Quot sunt quater dīmidium?</latin>"
        answer: "DUO "
      - question: "Say in Latin: two camps"
        answer: "<latin>BĪNA CASTRA 2013 NJCL CERTAMEN ADVANCED DIVISION</latin>"
