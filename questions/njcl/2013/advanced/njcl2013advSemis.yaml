    boni:
      - question: "According to Suetonius, Caecilius Statius commanded such respect that Terence demanded him to hear which play and render a judgment of it?"
        answer: "<title><latin>ANDRIA</latin></title>"
      - question: "What stagehand and producer originally worked for Statius, but left after Terence’s career began to outshine Statius’?"
        answer: "(LUCIUS AMBIVIUS) TURPIO"
  - tossup:
      question: "Why does Seneca prefer the definition of wind put forth in this passage?"
      answer: "BECAUSE AIR IS NEVER SO IMMOBILE THAT IT IS NOT IN SOME MOVEMENT"
    boni:
      - question: "What is the definition of wind that Seneca prefers?"
        answer: "(WIND IS) AIR FLOWING / MOVING INTO ONE DIRECTION"
      - question: "According to the passage, what conditions must exist for a sea to be considered calm?"
        answer: "THE SEA IS MOVED LIGHTLY / GENTLY AND IS NOT SLOPED / BENT (INTO ONE DIRECTION)"
  - tossup:
      question: "<latin>Loquāmur</latin> nunc <latin>dē aestū cōtīdiānō</latin>: verte in Anglicum <latin>sermōnem “Nōnnūllī mīrantur quārē</latin> tantus sit calor”."
      answer: "SOME WONDER WHY IT IS SO HOT / THE HEAT IS SO GREAT"
    boni:
      - question: "Now, using an optative subjunctive, translate into Latin: Would that I were not enclosed in an oven!"
        answer: "<latin>UTI (NAM) NE / NON (IN) FORNĀCE</latin> CLAUDERER "
      - question: "Finally, say in Latin: I don’t doubt that you could cook an egg lying on the ground"
        answer: "<latin>NŌN DUBITŌ QUĪN COQUERE POSSĪS / POSSĪTIS OVUM IACĒNS HUMĪ</latin>"
  - tossup:
      question: "Whom did Phrontis, Melas, Cytissorus, and Argus run into on a barren island sacred to Ares?"
