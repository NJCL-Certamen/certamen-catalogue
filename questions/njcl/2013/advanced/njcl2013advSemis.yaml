    boni:
      - question: "Give the meaning of the Latin noun at the root of “crayon” CHALK; CLAY ("
        answer: "<latin>CRĒTA</latin>)"
      - question: "Give the meaning of the Latin noun at the root of “portcullis” and “percolate.”"
