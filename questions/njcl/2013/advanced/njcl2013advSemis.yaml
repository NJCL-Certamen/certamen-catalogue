tournament: "NJCL Certamen"
year: 2013
division: "Advanced"
round: "Semifinals"
questions:
  - tossup:
      question: "After chasing him around the Bosphorus, where in September of 324 A.D. did the forces of Constantine finally defeat Licinius?"
      answer: "CHRYSOPOLIS"
    boni:
      - question: "Which son of Constantine, who served with him at the battle of Chrysopolis, is pictured on the coin labeled “A”?"
        answer: "CRISPUS"
      - question: "What name is given to the specific type of standard identified on coin “B”, which was invented and pioneered by Constantine after the battle of the Milvian Bridge?"
        answer: "<latin>LABARUM</latin> "
  - tossup:
      question: "Who gave Herakles every reason to be angry when he refused to purify Herakles for the murder of Iphitus and when his sons murdered Herakles’ cousin Oeonus?"
      answer: "HIPPOCOÖN"
    boni:
      - question: "Whose throne had Hippocoön usurped?"
        answer: "TYNDAREUS’"
      - question: "What other king had refused Herakles’ purification for Iphitus’ murder?"
        answer: "NELEUS"
  - tossup:
      question: "Differentiate in meaning between the adjectives <latin>lacer</latin> and <latin>macer</latin>"
      answer: "<latin>LACER</latin> – TORN, MANGLED / <latin>MACER</latin> - THIN, LEAN"
    boni:
      - question: "Differentiate in meaning between the adjectives <latin>mūtus</latin> and <latin>mūtuus</latin>"
        answer: "<latin>MŪTUS</latin> – SILENT, MUTE / <latin>MŪTUUS</latin> – BORROWED, MUTUAL, RECIPROCAL"
      - question: "Differentiate in meaning between the adjectives <latin>torpidus</latin> and <latin>torridus</latin>"
        answer: "<latin>TORPIDUS</latin> – BENUMBED, STUPIFIED, TORPID / <latin>TORRIDUS</latin> – DRY, PARCHED, TORRID"
  - tossup:
      question: "What derivative of a Latin verb meaning, “gnaw”, means, “capable of destroying solid materials”?"
      answer: "CORROSIVE / EROSIVE"
    boni:
      - question: "What derivative of a Latin verb meaning, “weigh”, means, “a dignified, self-confident manner or bearing”?"
        answer: "POISE"
      - question: "What derivative of a Latin verb meaning, “prick”, means, “keenly distressing to the feelings”?"
        answer: "POIGNANT"
  - tossup:
      question: "What author, born at Forum Iulii, wrote four books of elegies before falling into disfavor with Augustus and committing suicide?"
      answer: "(GAIUS) CORNELIUS GALLUS"
    boni:
      - question: "What name did Gallus give to his book of elegies?"
        answer: "<title><latin>AMŌRĒS</latin></title>"
      - question: "What was the actual name of the woman Cytheris, to whom many of Gallus’ elegies are addressed?"
        answer: "VOLUMNIA"
  - tossup:
      question: "What Latin phrase is used in discussions of logic to rule out extraneous factors that may interfere with a causal relationship, and literally means, “with the other things equal”?"
      answer: "<latin>CETERĪS PARIBUS</latin> "
    boni:
      - question: "What Latin phrase is used in legal matters to refer to an argument where the establishment of one fact as true leads even more strongly to the inference of another fact?"
        answer: "<latin>Ā FORTIORĪ</latin>"
      - question: "What other Latin legal phrase is used to denote a transfer or gift made during one's lifetime, as opposed to a testamentary transfer?"
        answer: "<latin>INTER VĪVŌS</latin>"
  - tossup:
      question: "What father of Melanthius protected Laertes while Odysseus was at Troy?"
      answer: "DOLIUS"
    boni:
      - question: "What servant of Penelope, the daughter of Dolius, became the mistress of Eurymachus?"
        answer: "MELANTHO"
      - question: "Which of Odysseus’ servants, a prince from the island of Syris, had been kidnapped by Phoenician merchants and sold to Laertes?"
        answer: "EUMAEUS"
  - tossup:
      question: "What pioneer of agrarian reform, during his third consulship in 486 B.C., was killed for demanding public redistribution of wealth?"
      answer: "SPURIUS CASSIUS"
    boni:
      - question: "Under what dictator, whom Livy identifies as the very first, did Cassius serve as <latin>magister equitum</latin>?"
        answer: "TITUS LARTIUS"
      - question: "What man, attempting to distribute grain to the poor, was killed by Servilius Ahala in 439 B.C.?"
        answer: "SPURIUS MAELIUS"
  - tossup:
      question: "What use of the accusative case is found in this phrase: <latin>Tam percussa novā mentem formīdine?</latin>"
      answer: "GREEK / SYNECDOCHICAL / RESPECT / SPECIFICATION"
    boni:
      - question: "What use of the accusative case is found in the following sentence: <latin>Coniūnx diūtissimē populum dōtem cēlāvit?</latin>"
        answer: "DOUBLE / SECONDARY OBJECT / (DIRECT OBJECT)"
      - question: "What use of the accusative case, besides direct object, is found in this sentence: <latin>Praedō sē ducem tōtīus orbis praebuit?</latin>"
        answer: "PREDICATE  "
  - tossup:
      question: "What author discusses geometry, town-planning, civil machines, and building-materials in his 10-book treatise?"
      answer: "VITRUVIUS (POLLIO)"
    boni:
      - question: "To whom did Vitruvius dedicate his <title><latin>Dē Architectūrā</latin></title>?"
        answer: "AUGUSTUS"
      - question: "By his own admission, Vitruvius gained much of his engineering knowledge from serving as a <latin>lībrātor</latin>. What was his job?"
        answer: "OPERATOR OF BALLISTA / PROJECTILE WEAPONS / LEVELLER / SURVEYOR"
  - tossup:
      question: "What author primarily wrote tragedies concerning the Trojan War and its aftermath, including <title>Antiope</title>, <title>Niptra</title>, and <title>Chryses</title>, and was regarded by Cicero as the greatest Roman tragedian?"
      answer: "(MARCUS) PACUVIUS"
    boni:
      - question: "Which work of Pacuvius, his only known work of the kind, is a <latin>fābula praetexta</latin> concerning the battle of Pydna?"
        answer: "<title>PAULLUS</title> "
      - question: "In which work of Cicero does he praise and rank Pacuvius, as well as a number of other authors?"
        answer: "<title><latin>DĒ OPTIMŌ GENERE ŌRĀTŌRUM</latin></title> / ON THE BEST TYPE OF ORATORS"
  - tossup:
      question: "Translate into Latin: I do not doubt that you will spare me"
      answer: "<latin>NŌN DUBITŌ QUĪN MIHI PARCĀS</latin> <latin>/ PARCĀTIS</latin> "
    boni:
      - question: "Now using <latin>quīn</latin>, translate into Latin: No soldier was so strong that he did not carry a sword"
        answer: "<latin>NŪLLUS MĪLES ERAT TAM FORTIS / VALIDUS QUĪN FERRUM / GLADIUM / ĒNSEM FERRĒT / PORTĀRET</latin> "
      - question: "Finally, say in Latin using two subjunctives: Let no fault hinder Marcus from becoming the best soldier"
        answer: "<latin>NŪLLUM VITIUM / NŪLLA CULPA IMPEDIĀT MARCUM</latin>  <latin>QUŌMINUS OPTIMUS MĪLES FĪĀT</latin>"
  - tossup:
      question: "What king of Troy, the son of the river Scamander, married off his daughter to a stranger from Samothrace named Dardanus?"
      answer: "TEUCER "
    boni:
      - question: "Who were the parents of Dardanus?"
        answer: "ZEUS AND ELECTRA"
      - question: "What two sons did Dardanus father with Teucer’s daughter, Bateia?"
        answer: "ERICHTHONIUS AND ILUS"
  - tossup:
      question: "Who was the first Plebeian to hold the office of Dictator in 356 B.C.?"
      answer: "(GAIUS MARCIUS) RUTILUS"
    boni:
      - question: "Who was the first Plebeian to act as a <latin>prō consule</latin> during the siege of Naples in 326 B.C.?"
        answer: "(QUINTUS) PUBLILIUS PHILO"
      - question: "Through his office, Philo was also able to further advance the Plebeian agenda. Name one of the things he did to increase the power of the Plebeians"
        answer: "ABOLISHED PATRICIAN VETO IN <latin>COMITIA TRIBŪTA</latin> / MAGISTRATE PROPOSING LAW HAD TO DISCUSS IT BEFORE SENATE BEFORE VOTING ON IT"
  - tossup:
      question: "What deponent inceptive verb, related to a noun meaning “peace”, means, “to bargain” or “agree”?"
      answer: "<latin>PACĪSCOR</latin>"
    boni:
      - question: "What inceptive verb, related to an adjective meaning “dull”, means, “to blunt”?"
        answer: "<latin>HEBĒSCŌ</latin>"
      - question: "What inceptive verb means, “to gape open”?"
        answer: "<latin>FATĪSCŌ / HĪSCŌ / HIĀSCŌ</latin>"
  - tossup:
      question: "About what author did Pliny the Younger remark “<latin>scrībēbat carmina maiōre cūrā quam ingeniō</latin>” because of his extremely long and poorly written epic?"
      answer: "(TIBERIUS CATIUS ASCONIUS) SILIUS ITALICUS"
    boni:
      - question: "What title was given to Italicus’ 17-book epic, the longest surviving original Latin text?"
        answer: "<title><latin>PŪNICA</latin></title>"
      - question: "What author did Italicus admire so much that he purchased his tomb, visiting it frequently for inspiration?"
        answer: "VERGIL"
  - tossup:
      question: "What emperor, in the memory of his wife, did the following: deified her, had various coins struck with her name and likeness, and erected a temple in the <latin>Forum Rōmānum</latin> bearing her name?"
      answer: "ANTONINUS PIUS"
    boni:
      - question: "Although he is said to have had one of the most peaceful reigns in Roman history, Pius did take preventative measures. What governor of Britain did he appoint to construct a new wall from the Firth of Forth to the Firth of Clyde in Scotland?"
        answer: "(QUINTUS) LOLLIUS URBICUS"
      - question: "Upon his death in 161 A.D., where in ancient Rome was Pius’ body laid to rest?"
        answer: "MAUSOLEUM OF HADRIAN"
  - tossup:
      question: "What feat had Caesar accomplished earlier?"
      answer: "CROSS THE RHINE <emphasis>TWICE</emphasis>"
    boni:
      - question: "What did Augustus want to do as a result of this feat?"
        answer: "MAKE GERMANY A PROVINCE (IN CAESAR’S HONOR)"
      - question: "What did the narrator lament about Augustus?"
        answer: "IF ONLY HE HAD NOT THOUGHT / CONSIDERED IT WORTH SO MUCH TO CONQUER GERMANY"
  - tossup:
      question: "Whose sandal did Zeus steal and give to Hermes, ensuring romantic favors for Hermes?"
      answer: "APHRODITE’S"
    boni:
      - question: "In what river was Aphrodite bathing at the time?"
        answer: "ACHELOÜS"
      - question: "Who was the product of this union?"
        answer: "HERMAPHRODITUS / ATLANTIUS"
  - tossup:
      question: "Change <latin>sōlum ardēns verū</latin> to the genitive"
