      - question: "Who was the father of Broteas?"
        answer: "TANTALUS"
      - question: "Broteas was credited with carving the first image of what goddess?"
        answer: "CYBELE / CYBEBE"
  - tossup:
      question: "Differentiate in meaning between the nouns <latin>lepus</latin> and <latin>lepōs</latin>. "
      answer: "LEPUS— HARE <latin>LEPŌS</latin>— CHARM, PLEASANTNESS"
    boni:
      - question: "Differentiate in meaning between the nouns <latin>scālae</latin> and <latin>scapulae</latin>"
        answer: "<latin>SCĀLAE</latin>—LADDER(S), STAIRS <latin>SCAPULAE</latin>—SHOULDER(S)"
      - question: "Differentiate in meaning between the nouns <latin>lībamen</latin> and <latin>ligamen</latin>"
        answer: "<latin>LĪBAMEN</latin>—DRINK OFFERING <latin>LIGAMEN</latin>—BANDAGE, THREAD"
  - tossup:
      question: "Which historical work of Latin literature ends with the praetorship of Sulpicius Galba, is seven books long, and is the first Latin historiography?"
      answer: "<title><latin>ŌRĪGINĒS</latin></title> <title>/ BEGINNINGS</title>"
    boni:
      - question: "Which historical work of Latin literature was written around 395 A.D. and is purported to have six authors?"
