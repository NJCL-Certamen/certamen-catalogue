    boni:
      - question: "In the apodosis, Cicero wrote \"<latin>nōn potuit fierī sapiēns</latin>\". Explain his use of the indicative?"
        answer: "(A VERB OF) POSSIBILITY, (NECESSITY, PROPRIETY, OR DUTY) IN THE APODOSIS (OF A) CONDITION CONTRARY TO FACT."
      - question: "Which participle, with <latin>eram</latin> or <latin>fuī</latin>, may replace an imperfect or pluperfect subjunctive in the apodosis of a condition contrary to fact?"
        answer: "FUTURE ACTIVE"
