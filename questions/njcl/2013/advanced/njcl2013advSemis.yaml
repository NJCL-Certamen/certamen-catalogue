      - question: "What had their uncle Augeias offered them in return for their help in defending Elis from Herakles?"
        answer: "A SHARE IN THE GOVERNMENT / KINGDOM"
  - tossup:
      question: "What Latin author’s <title><latin>fabulae palliatae</latin></title>, which include <title><latin>Plōchium</latin></title>, are often overshadowed by the success of his contemporaries Plautus and Terence?"
