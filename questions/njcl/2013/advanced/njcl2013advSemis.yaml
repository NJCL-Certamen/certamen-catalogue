    boni:
      - question: "Who were the parents of Argus, Phrontis, Melas, and Cytissorus?"
        answer: "PHRIXUS AND CHALCIOPE"
      - question: "What attackers had the Argonauts just fought off when they encountered the brothers?"
        answer: "STYMPHALIAN / KILLER BIRDS"
  - tossup:
      question: "Using three words, translate into Latin the protasis of the following Ciceronian sentence: \"He could not have become wise, if he had not been born\""
