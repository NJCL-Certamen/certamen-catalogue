      - question: "What use of the dative is seen in the first line of this passage?"
        answer: "SEPARATION"
  - tossup:
      question: "What propraetor in Spain, gained the confidence of the Celtiberians as no other Roman since Scipio Africanus, allowing him to effect a stable peace in the region in 179 B.C.?"
