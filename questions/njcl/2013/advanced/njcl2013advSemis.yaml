        answer: "<latin>DĒ AMĪCITIĀ</latin> "
  - tossup:
      question: "What legate under Nero revolted and cut off the corn supply from Africa to Rome in 68 A.D.?"
      answer: "(LUCIUS) CLODIUS MACER"
    boni:
      - question: "What imperial hopeful encouraged Macer’s revolt, but later withdrew that support?"
        answer: "(SERVIUS SULPICIUS) GALBA"
      - question: "By whose order was Macer executed?"
        answer: "(SERVIUS SULPICIUS) GALBA  "
