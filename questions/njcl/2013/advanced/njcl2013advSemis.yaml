  - tossup:
      question: "What use of the genitive can be found in the following sentence: <latin>Nōn putō hominem scelestissimum absolūtūrum esse caedis</latin>"
      answer: "GENITIVE OF CHARGE / PENALTY"
    boni:
      - question: "What use of the genitive is exemplified by this quotation from Horace: <latin>integer vītae scelerisque pūrus</latin>?"
        answer: "GENITIVE OF RESPECT / SPECIFICATION"
      - question: "What use of the genitive is exemplified by this quotation from Propertius: <latin>foederis heu tacitī</latin>?"
        answer: "GENITIVE OF EXCLAMATION"
  - tossup:
      question: "Who, along with Triton, helped Neptune correct the damage done by the storm sent at the behest of Juno against the fleet of Aeneas?"
