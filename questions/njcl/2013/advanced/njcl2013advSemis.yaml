      - question: "During which games, usually held in late April, did mime productions make their debut?"
        answer: "<latin>LUDĪ FLŌRĀLĒS</latin>"
  - tossup:
      question: "What statesman and general, having captivated Hispania as a leader of the <latin>Populārēs</latin>, waged a war against Rome until he was cut off by Pompey and assassinated in 72 B.C.?"
