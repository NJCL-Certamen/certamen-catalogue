      - question: "What city was the first capital of the Italian confederacy before it was moved to Bovianum Vetus?"
        answer: "CORFINIUM"
      - question: "What law of 90 B.C. ended the Social War?"
        answer: "<latin>LEX IŪLIA</latin> "
  - tossup:
      question: "What tribe, encountered by Odysseus, was ruled from its capital city, Telepylus, by king Antiphates and destroyed all but one of Odysseus’ ships?"
      answer: "LAESTRYGONIANS"
    boni:
