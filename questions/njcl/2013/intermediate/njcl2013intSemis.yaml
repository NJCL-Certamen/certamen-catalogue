        answer: "ELAGABALUS"
  - tossup:
      question: "In what war did the Samnite commander Papius Mutilus lead operations in the south until he was defeated decisively by Sulla who then captured the enemy capital at Bovianum Vetus?"
      answer: "SOCIAL / ITALIAN / MARSIC WAR"
