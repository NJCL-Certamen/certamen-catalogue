        answer: "ANTIOCH"
      - question: "Agrippina opposed Tiberius’ desire to name his biological grandson, the son of Drusus the Younger, as his heir. Who was this man, whom Caligula adopted upon the death of Tiberius only to have him killed later in the year 37 AD?"
        answer: "(TIBERIUS) GEMELLUS"
  - tossup:
      question: "What emperor named after a travelling cloak assassinated his brother and granted citizenship to all free males in the empire?"
