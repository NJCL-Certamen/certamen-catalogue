tournament: "NJCL Certamen"
year: 2013
division: "Intermediate"
round: "Semifinals"
questions:
  - tossup:
      question: "What two Latin verbs both have the third principal part “<latin>crēvī</latin>”?"
      answer: "<latin>CERNŌ & CRĒSCŌ</latin>"
    boni:
      - question: "What two Latin verbs both have the third principal part “<latin>sustulī</latin>”?"
        answer: "<latin>TOLLŌ & SUFFERŌ (SUBFERŌ)</latin> "
      - question: "The Latin verbs <latin>cadō</latin> and <latin>caedō</latin> have very similar third principal parts, but there is a slight difference. What is the difference?"
        answer: "<latin>CADŌ</latin> - <latin>CECIDI</latin> (SHORT FIRST “I”); <latin>CAEDŌ – CECĪDĪ</latin> (LONG FIRST “I”)"
  - tossup:
      question: "What law of 445 B.C. allowed intermarriage between patricians and plebeians?"
      answer: "LEX CANULEIA"
    boni:
      - question: "What law of 300 B.C. permitted plebeians to hold high priesthoods?"
        answer: "LEX OGULNIA"
      - question: "What two consuls of 449 B.C. rectified some of the oversights of the Twelve Tables, in order to appease the plebeians, including restoring the right to appeal a magistrate’s decisions and making tribunes sacrosanct?"
        answer: "(LUCIUS) VALERIUS (POTITUS) (MARCUS) HORATIUS (BARBATUS)"
  - tossup:
      question: "What creatures was Abderus watching over when he was killed and eaten by them?"
      answer: "HORSES / MARES OF DIOMEDES"
    boni:
      - question: "What god was the father of Abderus?"
        answer: "HERMES / MERCURY"
      - question: "How did Herakles honor Abderus after his death?"
        answer: "HE FOUNDED A CITY AND NAMED IT AFTER HIM (Abdera)"
  - tossup:
      question: "For the Latin verb <latin>iungō</latin>, give the 1st person singular perfect active subjunctive"
      answer: "<latin>IŪNXERIM</latin> "
    boni:
      - question: "Make <latin>iūnxerim</latin> passive"
        answer: "<latin>IŪNCTUS / -A SIM</latin> "
      - question: "Make <latin>iūnctus sim</latin> imperfect"
        answer: "<latin>IUNGERER</latin> "
  - tossup:
      question: "According to the passage, what is one type of law that people use?"
      answer: "THEIR OWN / INDIVIDUAL LAW / LAW COMMON TO ALL PEOPLE"
    boni:
      - question: "Why is civil law named thus?"
        answer: "EACH PEOPLE / CITIZENSHIP DECIDES THIS KIND OF LAW FOR THEMSELVES"
      - question: "According to Justinian, by what two characteristics must people be ruled in order to use this system?"
        answer: "BY LAWS AND MORALS / CHARACTER"
  - tossup:
      question: "What was the job of the <latin>capsārius</latin> at the baths?"
      answer: "CARRYING TOWELS AND CLOTHES / GUARDING THE CUBBIES WITH PEOPLE’S JANK"
    boni:
      - question: "What room in the Roman baths was a dry sweat bath?"
        answer: "<latin>LACŌNICUM</latin>"
      - question: "The <latin>lacōnicum</latin> was so named by the Romans because it was considered the only acceptable type of warm bath by what people?"
        answer: "SPARTANS (prompt on “Greeks”)"
  - tossup:
      question: "Using a participle, say in Latin: “The woman was not able to see her son sitting in the tree.”"
      answer: "<latin>FĒMINA</latin> FĪLIUM IN ARBORE SEDENTEM VIDĒRE NŌN POTERAT. "
    boni:
      - question: "Using an irregular verb, say in Latin: “The boy wanted to stay in the tree for a long time.”"
        answer: "<latin>PUER IN ARBORE DIŪ</latin> MANĒRE VOLĒBAT / VOLUIT "
      - question: "Using a compound of <latin>eō</latin> and a subjunctive purpose clause, say in Latin: “The boy returned home to eat dinner.”"
        answer: "<latin>PUER DOMUM REDIIT UT CĒNAM EDERET (ĒSSET) / CONSŪMERET / CĒNĀRET</latin> "
  - tossup:
      question: "What monsters could be killed only by a mortal, thus making it necessary for the gods to enlist the aid of Herakles?"
      answer: "THE GIANTS / GIGANTES"
    boni:
      - question: "With what weapon did Herakles kill most of the Giants?"
        answer: "BOW (AND ARROWS)"
      - question: "Which of the Giants tried to rape Hera, but was preempted by a lightning strike from Zeus?"
        answer: "PORPHYRION"
  - tossup:
      question: "According to the BACK of this coin, what are two titles held by the emperor?"
      answer: "<latin>PATER PATRIAE</latin> / CONSUL / PONTIFEX MAXIMUS / TRIBUNE"
    boni:
      - question: "On one side of the coin you see the abbreviation “TR P.” For what Latin phrase does this stand?"
        answer: "<latin>TRIBŪNICIA POTESTĀS / TRIBŪNICIĀ POTESTĀTE</latin> "
