        answer: "SCYLLA AND POLYPHEMUS"
  - tossup:
      question: "Translate the following sentence into English: <latin>Surgam ad tria carmina canenda</latin>"
      answer: "I WILL RISE / LET ME RISE TO SING THREE SONGS"
