      - question: "Translate: <latin>Sunt quī mē dīcant nōn esse poētam</latin>"
        answer: "THERE ARE THOSE WHO WOULD SAY (THAT) I AM NOT A POET"
      - question: "Translate: <latin>Crēdō mē perītum canendī esse</latin>"
        answer: "I BELIEVE THAT I AM SKILLED IN SINGING"
  - tossup:
      question: "What is the meaning of the Latin word at the ultimate root of all of the following English words: quarantine, squadron, quarry, and quadruple?"
      answer: "FOUR"
    boni:
      - question: "From what two separate Latin numbers does the English word dozen come?"
        answer: "<latin>DUO & DECEM</latin>"
      - question: "The Latin numeral <latin>quinque</latin> does not have many derivatives, but it does have one that means “the perfect embodiment of something” and was so named because it was thought to be the fifth element of the universe, the other four being earth, air, fire, and water. What is this English noun?"
        answer: "QUINTESSENCE"
  - tossup:
      question: "Euryalus, Entellus, Cloanthus, and Acestes were all victors in different games at whose funeral?"
      answer: "ANCHISES’"
