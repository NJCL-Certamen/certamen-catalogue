  - tossup:
      question: "<latin>Respondē Latinē</latin>: Add the number of emperors in the year 238 AD to the number of days after a death when the funeral dinner was held, then multiply that total by the number of children Oedipus fathered on his mother Jocasta and give your answer in Latin"
      answer: "<latin>SEXĀGINTA</latin>̄ "
    boni:
      - question: "Take the number of laps in a standard chariot race and add it to the number of the year in which the Battle of Vercellae took place. Multiply that number by the number of heads that the dog Orthrus had. Your answer is a number that when you add BC to it gives the year in which a famous Roman battle took place. What is the battle?"
        answer: "CANNAE"
      - question: "Start with the number of the year in which construction began on the <latin>Via Appia</latin>. Multiply by the number of goddesses involved in the Judgment of Paris. Add the number of the year in which Spartacus began his famous revolt. If you take the result and write it in Roman numerals, you will make an English word. What is the English word?"
        answer: "MIX"
  - tossup:
      question: "What woman of ancient Rome was celebrated for her successful childbearing – having borne nine children, of whom six lived to adulthood; one of her sons going on to become emperor and one of her daughters giving birth to a future emperor?"
