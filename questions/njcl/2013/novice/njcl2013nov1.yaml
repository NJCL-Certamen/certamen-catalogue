tournament: "NJCL Certamen"
year: 2013
division: "Novice"
round: "Round 1"
questions:
  - tossup:
      question: "Translate this sentence into English: <latin>Mercātor rēgī vīnum vēndit</latin>"
      answer: "THE MERCHANT SELLS / IS SELLING WINE TO / FOR THE KING."
    boni:
      - question: "Translate this sentence: <latin>Rēx vīnum bibere nōn dēbet</latin>"
        answer: "THE KING SHOULD / OUGHT NOT DRINK THE WINE."
      - question: "Finally, translate this sentence: <latin>Quod rēgīna et rēx sedent, ancilla eīs vīnum portat</latin>"
        answer: "BECAUSE THE QUEEN AND KING ARE SITTING, THE SLAVE GIRL BRINGS / CARRIES THE WINE TO THEM."
  - tossup:
      question: "What city fell to a Roman siege in 146 BC thanks to the generalship of Scipio Aemilianus and the rhetoric of Cato the Elder?"
      answer: "CARTHAGE"
    boni:
      - question: "When had the siege of Carthage begun?"
        answer: "149 BC"
      - question: "What other city fell to the Romans in 146 BC?"
        answer: "CORINTH"
  - tossup:
      question: "Who spent seven years on Ogygia pining for his homeland of Ithaca?"
      answer: "ODYSSEUS / ULYSSES"
    boni:
      - question: "What divine being held him there?"
        answer: "CALYPSO"
      - question: "Who came to Calypso in the seventh year, demanding that she release Odysseus?"
        answer: "HERMES"
  - tossup:
      question: "From what Latin noun with what meaning do we derive the word “invulnerable”?"
      answer: "<latin>VULNUS (VULNERIS)</latin> – WOUND"
    boni:
      - question: "From what Latin noun with what meaning do we derive the word “fumigate”?"
        answer: "<latin>FŪMUS</latin> – SMOKE"
      - question: "From what Latin noun with what meaning do we derive the word “hospitality”?"
        answer: "<latin>HOSPES</latin> – GUEST; HOST"
  - tossup:
      question: "What baby, unflustered by the surprising insertion of snakes into his crib, saved his own life and that of his half-brother by strangling the snakes?"
      answer: "HERAKLES / HERCULES"
    boni:
      - question: "What angry deity had placed the snakes in the crib?"
        answer: "HERA / JUNO"
      - question: "Why, according to some stories, did Amphitryon not interfere with the snakes?"
        answer: "HE WANTED TO KNOW WHICH CHILD WAS THE SON OF ZEUS / JUPITER"
  - tossup:
      question: "Which state has as its Latin motto “<latin>Esse quam vidērī</latin>”, “to be rather than to seem”?"
      answer: "NORTH CAROLINA"
    boni:
      - question: "Please make sure that you are looking at the four states marked A, B, C, and D. You are looking at the great seals of four U.S. states which all portray their Latin mottoes. Please arrange these four states in alphabetical order by the letter marked next to each."
        answer: "B, D, C, A (COLORADO, MAINE, MISSOURI, NEW MEXICO)"
      - question: "Please make sure that you are now looking at the four states marked W, X, Y, and Z. Please arrange these four states in alphabetical order."
        answer: "Z, W, Y, X (ARIZONA, MASSACHUSETTS, OKLAHOMA, SOUTH CAROLINA)"
  - tossup:
      question: "Translate this sentence into Latin: “Julia used to love to run in the fields.”"
      answer: "<latin>IŪLIA IN AGRĪS</latin> CURRERE <latin>AMĀBAT</latin> "
    boni:
      - question: "What is the grammatical term for the use of the infinitive “<latin>currere</latin>” in that sentence?"
        answer: "COMPLEMENTARY / OBJECTIVE / COMPLEMENT / PROLITIVE"
      - question: "Now translate into Latin, also using a complementary infinitive: “Julia can see the river.”"
        answer: "<latin>IŪLIA FLŪMEN / RĪVUM VIDĒRE POTEST</latin> "
  - tossup:
      question: "What emperor won competitions for chariot racing and musical performance while touring Greece during his reign from 54-68 AD?"
      answer: "NERO"
    boni:
      - question: "What future emperor was punished for falling asleep at a musical performance of Nero?"
        answer: "VESPASIAN"
      - question: "What disaster of 64 AD cost Nero the support of the people when he chose to construct his <latin>Domus Aurea</latin> in part of the damaged city?"
        answer: "THE GREAT FIRE OF ROME"
  - tossup:
      question: "For the verb <latin>parō</latin>, give the 2nd person singular, future active indicative"
      answer: "<latin>PARĀBIS</latin> "
    boni:
      - question: "Make <latin>parābis</latin> passive"
        answer: "<latin>PARĀBERIS</latin> "
      - question: "Make <latin>parāberis</latin> 3rd person plural"
        answer: "<latin>PARĀBUNTUR</latin> "
  - tossup:
      question: "What woman, determined never to marry, became a laurel tree rather than submit to the advances of a lusty god?"
      answer: "DAPHNE"
    boni:
      - question: "Which god was pursuing Daphne?"
        answer: "APOLLO"
      - question: "According to Ovid, Cupid shot Apollo and caused him to fall in love with Daphne because Apollo had been insufferably smug over his defeat of what monster?"
        answer: "PYTHON"
  - tossup:
      question: "Who in Roman culture would wear a toga brightened with white chalk called the <latin>toga candida</latin>?"
      answer: "A CANDIDATE FOR PUBLIC OFFICE"
    boni:
      - question: "Who would wear a toga that was intentionally made dingy called the <latin>toga sordida</latin>?"
        answer: "A MOURNER / SOMEONE WHO HAD LOST A FAMILY MEMBER"
      - question: "Who would wear a red toga with gold trim called the <latin>toga picta</latin>?"
        answer: "A VICTORIOUS GENERAL"
  - tossup:
      question: "When recognized, perform the following commands: <latin>Ter pulsā mēnsam</latin>"
      answer: "STUDENT KNOCKS ON / POUNDS / STRIKES / MAKES SOMEWHAT VIOLENT CONTACT WITH THE TABLE / DESK THREE TIMES / THRICE"
    boni:
      - question: "When recognized, perform the following commands: <latin>Vituperā sociōs quasī es parens et illī sunt tuī līberī</latin>"
        answer: "CAPTAIN SHOULD SCOLD / UPBRAID / REMONSTRATE WITH / YELL AT / CUSS OUT / REPRIMAND HIS / HER TEAMMATES / ALLIES / ASSOCIATES / BROTHERS-AND-SISTERS-IN- ARMS AS IF HE / SHE IS THE PARENT AND THEY ARE HIS / HER CHILDREN"
      - question: "When recognized, perform the following commands: <latin>Canite, omnēs, carmina dissimilia</latin>"
        answer: "ALL TEAM MEMBERS SHOULD SING DIFFERENT SONGS"
  - tossup:
      question: "Identify the use of the ablative in the following sentence: <latin>Puer ad oppidum ex agrīs cucurrit.</latin> "
      answer: "ABLATIVE OF PLACE FROM WHERE / WHICH"
    boni:
      - question: "Identify the use of the ablative in the following sentence: <latin>Mātrēs cum duodecim līberīs ad forum īvērunt.</latin> "
        answer: "ABLATIVE OF ACCOMPANIMENT"
      - question: "Identify the use of the ablative in the following sentence: A<latin>ncillae cēnam minimā cum cūrā ferēbant</latin>"
        answer: "ABLATIVE OF MANNER"
  - tossup:
      question: "What daughter of Belus or Agenor did Cupid cause to fall in love with the Trojan Aeneas so that she would be more willing to protect him and the Trojans in her kingdom of Carthage?"
      answer: "DIDO / ELISSA"
    boni:
      - question: "What two goddesses agreed to create a situation where Dido and Aeneas were trapped together in a cave by themselves?"
        answer: "JUNO AND VENUS"
      - question: "When Aeneas left to pursue his destiny in Italy, what did Dido do?"
        answer: "KILLED HERSELF (WITH HIS SWORD)"
  - tossup:
      question: "What part of his body does the slave tell Marcus to wash?"
      answer: "HIS EARS"
    boni:
      - question: "What reason does Marcus give for not needing to wash his ears?"
        answer: "THEY ARE NOT ON / PART OF HIS FACE"
      - question: "What action does the slave take?"
        answer: "HE PLUNGES MARCUS’ ENTIRE HEAD INTO THE WATER AND WASHES HIS EARS (VIGOROUSLY)"
  - tossup:
      question: "By reincorporating the Gallic Empire and the kingdom of Palmyra into the Empire in the late 3rd century AD, who won the title <latin>restitūtor orbis</latin>?"
      answer: "AURELIAN"
    boni:
      - question: "What queen of Palmyra had claimed the eastern half of the Roman Empire as her territory?"
        answer: "ZENOBIA"
      - question: "What Gallic emperor did Aurelian relocate to Italy after dismantling his empire?"
        answer: "TETRICUS"
  - tossup:
      question: "Which of the following words, if any, does not derive from the same Latin verb as the others: mutiny, mob, mission, motion?"
      answer: "MISSION"
    boni:
      - question: "Give the Latin verb and its meaning at the root of “mission.”"
        answer: "<latin>MITTŌ</latin> – TO SEND"
      - question: "Give the Latin verb and its meaning at the root of “motion,” mob,” and “mutiny.”"
        answer: "<latin>MOVEŌ</latin> – TO MOVE"
  - tossup:
      question: "Differentiate in meaning between the Latin nouns <latin>vir</latin> and <latin>vīs</latin>?"
      answer: "<latin>VIR</latin> – MAN; HUSBAND; HERO / <latin>VĪS</latin> – FORCE, STRENGTH"
    boni:
      - question: "Differentiate in meaning between the Latin nouns <latin>cēna</latin> and <latin>cēra</latin>?"
        answer: "<latin>CĒNA</latin> – DINNER, MEAL; <latin>CĒRA</latin> – WAX"
      - question: "Differentiate in meaning between the Latin nouns <latin>umbra</latin> and <latin>unda</latin>?"
        answer: "<latin>UMBRA</latin> – SHADE, SHADOW, GHOST, UNINVITED GUEST; <latin>UNDA</latin> - WAVE"
  - tossup:
      question: "What sea goddess bore the children Rhode, Benthesicyme, and Triton to her husband Poseidon?"
      answer: "AMPHITRITE"
    boni:
      - question: "Originally, Amphitrite did not want to marry Poseidon, and she fled his advances and hid with what Titan?"
        answer: "ATLAS"
      - question: "What kind of creature discovered where Amphitrite was hiding and convinced her to marry Poseidon, an act that caused the grateful Poseidon to place him in the heavens as a constellation?"
        answer: "DOLPHIN"
  - tossup:
      question: "Answering the call of Terentilius Harsa, what board was created in 451 BC in order to codify Roman law?"
      answer: "<latin>DECEMVIRĪ</latin> (<latin>LĒGIBUS SCRIBUNDĪS</latin>)"
    boni:
      - question: "What code of laws was the result of the work of the <latin>decemvirī</latin>?"
        answer: "THE TWELVE TABLES"
      - question: "A second group of <latin>decemvirī</latin> was convened the following year. Who was the only person to serve on both boards of <latin>decemvirī</latin>?"
        answer: "APPIUS CLAUDIUS (CRASSUS INREGILLENSIS)"
