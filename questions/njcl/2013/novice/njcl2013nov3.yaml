tournament: "NJCL Certamen"
year: 2013
division: "Novice"
round: "Round 3"
questions:
  - tossup:
      question: "What emperor captured Sarmizegethusa, defeating Decebalus and securing the annexation of the new province of Dacia in 106 A.D.?"
      answer: "(M. ULPIUS) TRAJAN (US)"
    boni:
      - question: "Name one other province annexed by Trajan"
        answer: "SEE BELOW"
      - question: "Name another"
        answer: "ARABIA PETRAEA / ARMENIA / MESOPOTAMIA / ASSYRIA"
  - tossup:
      question: "In the sentence, “The Greek woman killed one of the men with a broken rock,” give the Latin for “broken rock.”"
      answer: "<latin>FRACTŌ SAXŌ / LAPIDE</latin> "
    boni:
      - question: "In that same sentence, “The Greek woman killed one of the men with a broken rock,” give the Latin for “one of the men.”"
        answer: "<latin>ŪNUM Ē / EX VIRĪS</latin> "
      - question: "In the sentence, “Part of me was glad that man was dead,” give the Latin for “part of me.”"
        answer: "<latin>PARS MEĪ</latin> "
  - tossup:
      question: "To what deity did Cadmus give the dragon’s teeth that he did not use to help populate his new city?"
      answer: "ATHENA / MINERVA / ONCA (GIVE THE TEAM 200 POINTS IF THEY ACTUALLY SAY THIS)"
    boni:
      - question: "To what god was the dragon that Cadmus killed sacred?"
        answer: "ARES / MARS"
      - question: "To whom did Athena give the teeth that Cadmus saved for her?"
        answer: "AEËTES"
  - tossup:
      question: "Give the Latin adjective and meaning at the root of all of the following words: nonpareil, umpire, peerless, parity"
      answer: "<latin>PĀR</latin>—EQUAL"
    boni:
      - question: "Give the Latin adjective and its meaning at the root of “sexton” and “execrate.”"
        answer: "<latin>SACER</latin> – HOLY; SACRED"
      - question: "Give the Latin adjective and its meaning at the root of “daub,” “auburn,” and “albino.”"
        answer: "<latin>ALBUS</latin> - WHITE"
  - tossup:
      question: "<latin>Quid Mārcus maximē timēbat?</latin>"
      answer: "<latin>ĪRAM (MĀTRIS) / MĀTREM</latin>"
    boni:
      - question: " <latin>Cūr Mārcus īre ad Circum nōn vult?</latin>"
        answer: "<latin>EQUŌS TIMET / TIMŌREM EQUŌRUM HABET</latin> "
      - question: " <latin>Quid amīcus Mārcī ad flumēn facere volēbat?</latin>"
        answer: "<latin>NATĀRE (AMĪCUS VOLĒBAT)</latin> "
  - tossup:
      question: "In what region of ancient Italy would you find Rome?"
      answer: "LATIUM"
    boni:
      - question: "In what region would you find Pompeii?"
        answer: "CAMPANIA"
      - question: "In what region would you find Rhegium?"
        answer: "CALABRIA"
  - tossup:
      question: "What is the meaning of the Latin verb <latin>doleō</latin>?"
      answer: "TO GRIEVE, MOURN, HURT"
    boni:
      - question: "What is the meaning of the Latin verb <latin>dēleō</latin>?"
        answer: "TO DESTROY, ERASE, DELETE"
      - question: "What is the meaning of the Latin verb <latin>dēlectō</latin>?"
        answer: "TO DELIGHT, PLEASE"
  - tossup:
      question: "What would be the first word of the following sentence if it were to be translated into Latin: “I don’t have to repeat myself, do I?”"
      answer: "<latin>NUM</latin>"
    boni:
      - question: "Using a different interrogative word, say in Latin, “Didn’t I do well?”"
        answer: "<latin>NŌNNE BENE FĒCĪ / ĒGĪ</latin>"
      - question: "Finally, say in Latin, “Who are they?”"
        answer: "<latin>QUĪ SUNT (EĪ / ILLĪ / HĪ)?</latin> "
  - tossup:
      question: "Which mythological hero was born partly due to his grandfather Pittheus’ correctly interpreting the Delphic Oracle’s advice that Aegeus should not open his wineskin before returning to Athens?"
      answer: "THESEUS "
    boni:
      - question: "You are looking at a map of the Peloponnesus detailing Theseus’ journey from Troezen to Athens. Please identify the villain that Theseus defeated at the place numbered 4"
        answer: "SC(E)IRON"
      - question: "Whom did Theseus defeat at number 1?"
        answer: "PERIPHETES / CORYNETES"
  - tossup:
      question: "Give the Latin for “to be ruled.”"
      answer: "<latin>REGĪ</latin>"
    boni:
      - question: "Give the Latin for “to have believed.”"
        answer: "<latin>CRĒDIDISSE</latin>"
      - question: "Give the Latin for “to be about to begin.”"
        answer: "<latin>INCEPTŪRUS / COEPTŪRUS (-A, -UM) ESSE</latin>"
  - tossup:
      question: "Who established the Isthmian Games in honor of his nephew when a dolphin brought the boy’s corpse ashore at the Isthmus of Corinth?"
      answer: "SISYPHUS"
    boni:
      - question: "Who was the boy, who had drowned along with his mother Ino?"
        answer: "MELICERTES"
      - question: "Sisyphus was buried in a secret tomb on the isthmus alongside what king of Pylos, the father of Nestor?"
        answer: "NELEUS"
  - tossup:
      question: "Which of the many powers bestowed upon him was so important to Augustus that he dated his reign from 23 B.C., the year he received it?"
      answer: "<latin>TRIBŪNĪCIA POTESTĀS</latin> / THE POWER OF A TRIBUNE"
    boni:
      - question: "What office did Augustus assume in 12 B.C. upon Lepidus’ death in exile?"
        answer: "<latin>PONTIFEX MAXIMUS</latin> "
      - question: "Upon receiving what title in 2 B.C. did Augustus weep?"
        answer: "<latin>PATER PATRIAE</latin> "
  - tossup:
      question: "Of the words <latin>gaudium</latin>, <latin>clāmor</latin>, <latin>praesidium</latin>, <latin>pictūra</latin>, and <latin>mulier</latin>, which is being described in the following sentence: <latin>Est quod homo sentit ubi laetus est</latin>"
      answer: "GAUDIUM"
    boni:
      - question: "Of the words <latin>gaudium</latin>, <latin>clāmor</latin>, <latin>praesidium</latin>, <latin>pictūra</latin>, and <latin>mulier</latin>, which is being described in the following sentence: <latin>Dīcitur hoc mīlle verbōrum esse</latin>"
        answer: "<latin>PICTŪRA</latin>"
      - question: "Of the words <latin>gaudium</latin>, <latin>clāmor</latin>, <latin>praesidium</latin>, <latin>pictūra</latin>, and <latin>mulier</latin>, which is being described in the following sentence: <latin>Sunt mīlitēs aut aliī hominēs quī aliquid custōdiunt</latin>"
        answer: "PRAESIDIUM "
  - tossup:
      question: "Who bore a total of seven children – three lesser known named Timandra, Phoebe, and Philonoë, and four very well-known, Helen, Clytemnestra, Castor, and Pollux?"
      answer: "LEDA"
    boni:
      - question: "What man, driven from the throne of Sparta in his youth, fled to Aetolia and there married Leda?"
        answer: "TYNDAREUS"
      - question: "In a fairly well-known story, Helen was not born live, but rather hatched from an egg. In some versions of this story, however, it was not Leda who produced the egg, but what goddess of vengeance?"
        answer: "NEMESIS"
  - tossup:
      question: "Translate the following sentence into English: <latin>Puer benignus flōrem pulchrum mātrī aegrae petēbat.</latin>"
      answer: "THE KIND BOY WAS SEEKING / LOOKING FOR A BEAUTIFUL FLOWER FOR HIS ILL / WEARY MOTHER"
    boni:
      - question: "Translate: <latin>Māter, attonita filiī dōnō, lacrimāre coepit.</latin>"
        answer: "THE MOTHER, AMAZED BY HER SON’S GIFT, BEGAN TO CRY"
      - question: "Finally, translate: <latin>Propter lacrimās puer mātrem flōrem nōn amāre putāvit</latin>"
        answer: "BECAUSE OF THE TEARS, THE BOY THOUGHT THAT HIS MOTHER DID NOT LIKE THE FLOWER"
  - tossup:
      question: "What Roman general’s victories included the Battles of Campi Magni, Ilipa, Baecula, and Zama?"
      answer: "(P. CORNELIUS) SCIPIO AFRICANUS (PROMPT ON “SCIPIO”)"
    boni:
      - question: "Put those four battles in chronological order, starting with the earliest"
        answer: "BAECULA, ILIPA, CAMPI MAGNI, ZAMA"
      - question: "What name was shared by the generals that Scipio defeated at Ilipa and Baecula?"
        answer: "HASDRUBAL"
  - tossup:
      question: "Which of the following words, if any, does not derive from the Latin verb <latin>cadō</latin>: parachute, chance, accident, casual?"
      answer: "ALL FROM <latin>CADŌ</latin> "
    boni:
      - question: "What other derivative of <latin>cadō</latin> can describe a waterfall, especially a series of shallow or step-like waterfalls?"
        answer: "CASCADE"
      - question: "What other derivative of <latin>cadō</latin> can describe a type of tree or a type of tooth?"
        answer: "DECIDUOUS"
  - tossup:
      question: "Name one of the two Muses alternatively said to be the mother of the Sirens, one of whom was the Muse of tragedy, the other, the muse of dance"
      answer: "MELPOMENE OR TERPSICHORE"
    boni:
      - question: "Some writers claim that the Sirens were originally women who were transformed by what goddess as punishment for idly standing by while her daughter was abducted?"
        answer: "DEMETER"
      - question: "The Argonauts passed by the Sirens safely, but one of them, Butes, heard the Sirens’ song and began swimming towards their island until he was rescued by what goddess?"
        answer: "APHRODITE"
  - tossup:
      question: "Who became emperor of Rome after the previous emperor was strangled by his wrestling partner Narcissus on December 31, 192 A.D.?"
      answer: "(MARCUS HELVIUS) PERTINAX"
    boni:
      - question: "Pertinax was the only contender in 193 A.D. whose reign was legitimized by what eventual sole emperor who ruled from 193 A.D. until his death in 211 A.D.?"
        answer: "SEPTIMIUS SEVERUS"
      - question: "Pertinax was aware of the dangers of assuming the imperial purple and took specific steps to ensure that his wife and son would not be killed if he were to be overthrown. What did Pertinax do?"
        answer: "HE REFUSED TO ISSUE THEM ANY IMPERIAL TITLES / PRIVILEGES"
  - tossup:
      question: "Which of the following colleges or universities does NOT have a Latin word meaning “light” in its motto: Columbia University, Yale University, University of Michigan, University of Washington?"
      answer: "UNIVERSITY OF MICHIGAN"
    boni:
      - question: "What three nouns make up the motto of the University of Michigan?"
        answer: "<latin>ARTĒS, SCIENTIA, VĒRITĀS</latin> "
      - question: "Of the three schools in the tossup that did have “light” in their motto, which one uses the word <latin>lūmen</latin> rather than the word <latin>lux</latin>?"
        answer: "COLUMBIA UNIVERSITY <latin>2013 NJCL CERTAMEN NOVICE DIVISION</latin>"
