tournament: "NJCL Certamen"
year: 2014
division: "Advanced"
round: "Round 1"
questions:
  - tossup:
      question: "Please differentiate in meaning between the Latin nouns <latin>faber</latin> and <latin>faba</latin>"
      answer: "<latin>FABER</latin> – WORKER, CRAFTSMAN, SMITH, CARPENTER, ENGINEER // <latin>FABA</latin> – BEAN, PELLET, BEAD"
    boni:
      - question: "Please differentiate in meaning between <latin>fricō</latin> and <latin>frīgō</latin> (N.B. - spell <latin>frīgō</latin> with macra)"
        answer: "<latin>FRICŌ</latin> – (TO) RUB (DOWN) // <latin>FRĪGŌ</latin> – (TO) ROAST, TOAST, PARCH, FRY"
      - question: "Please differentiate in meaning between <latin>dēns</latin> and <latin>dēnsō</latin>"
        answer: "<latin>DĒNS – TOOTH // DĒNSŌ</latin> – (TO) THICKEN, PRESS TOGETHER"
  - tossup:
      question: "The quotation “<latin>sī animus est aequus tibi, sat habēs, quī bene vītam colās</latin>” can be found in Act II of which author’s <title><latin>Aululāria</latin></title>?"
      answer: "(T. MACCIUS) PLAUTUS"
    boni:
      - question: "In which of Plautus’ plays does the god Mercury disguise himself as the slave Sosia so that he can buy his father Jupiter more time?"
        answer: "<title>AMPHITRYON / <latin>AMPHITRUŌ</latin></title>"
      - question: "In which of Plautus’ plays does the mistaken identity of the twin sons of Moschus provide the main plot line?"
        answer: "<title><latin>MENAECHMĪ</latin></title>"
  - tossup:
      question: "Please translate this sentence into English: <latin>Gladiātōrēs amphitheātrum intrāvērunt animālium ferōcium necandōrum causā</latin>"
      answer: "THE GLADIATORS ENTERED THE AMPHITHEATER FOR THE SAKE OF KILLING / TO KILL FEROCIOUS ANIMALS"
    boni:
      - question: "Keeping everything else the same, please translate the expression of purpose in that sentence into Latin using a subjunctive"
        answer: "<latin>UT ANIMĀLIA FERŌCIA NECĀRENT</latin>"
      - question: "Keeping everything else the same, please translate the expression of purpose in that sentence into Latin using a supine"
        answer: "<latin>ANIMĀLIA FERŌCIA NECĀTUM</latin>"
  - tossup:
      question: "What future emperor sped from Spain to Upper Germany to suppress a revolt in 89 AD?"
      answer: "(M. ULPIUS) TRAIANUS / TRAJAN"
    boni:
      - question: "Who was the governor of Upper Germany at the time who had been proclaimed emperor by his troops?"
        answer: "(L. ANTONIUS) SATURNINUS"
      - question: "That same year also saw the surrender of what foreign ruler, who accepted the role of a Roman client in exchange for Domitian recognizing him as legitimate king of the Dacians?"
        answer: "DECEBALUS"
  - tossup:
      question: "Who was shocked when the cuckoo she sheltered became Zeus and seduced her?"
      answer: "HERA"
    boni:
      - question: "In what form did Zeus seduce Mnemosyne?"
        answer: "SHEPHERD"
      - question: "In what form did Zeus seduce Nemesis?"
        answer: "SWAN"
  - tossup:
      question: "What patriotic, old-fashioned, and politically conservative author provided his moralistic interpretation of Roman history when he recounted the adventures of Camillus and Cato the Elder, among others, in his <title><latin>Ab Urbe Conditā</latin></title>?"
      answer: "(TITUS) LIVIUS / LIVY"
    boni:
      - question: "Who called Livy a “Pompeian” because the author was so full of praise of Pompey?"
        answer: "AUGUSTUS"
      - question: "What Latin word was coined to refer to Livy’s use of expressions unique to the place of his birth?"
        answer: "<latin>PATAVĪNITĀS</latin> "
  - tossup:
      question: "Please give the Latin verb and its meaning from which we derive the words “routine” and “abrupt”"
      answer: "<latin>RUMPŌ / RUMPERE</latin> – TO BREAK, BURST, TEAR"
    boni:
      - question: "Please give the Latin verb and its meaning from which we derive the words “toil” and “obtuse”"
        answer: "<latin>TUNDŌ / TUNDERE</latin> – TO BEAT, STRIKE, THUMP, POUND, BRUISE, BRAY"
      - question: "Please give the Latin adjective and its meaning from which we derive the words “relish” and “leash”"
        answer: "<latin>LAXUS</latin> – WIDE, LOOSE, SPACIOUS, ROOMY"
  - tossup:
      question: "What type of Roman funeral was called <latin>fūnus plēbēium</latin>?"
      answer: "FUNERALS FOR THE POOR / PLEBEIAN FUNERAL"
    boni:
      - question: "What type of Roman funeral was called <latin>fūnus acerbum</latin>?"
        answer: "FUNERAL OF A CHILD / CHILDREN"
      - question: "When did these <latin>fūnera acerba</latin> usually take place?"
        answer: "AT NIGHT"
  - tossup:
      question: "In Homer’s <title>Iliad</title>, which Greek chieftain is given the ability to distinguish immortals from mortals?"
      answer: "DIOMEDES"
    boni:
      - question: "Who gave Diomedes this power?"
        answer: "(PALLAS) ATHENA"
      - question: "Name the two immortals wounded by Diomedes"
        answer: "APHRODITE & ARES"
  - tossup:
      question: "What use of the dative case can be found in the following sentence: <latin>Rēx mīlitibus servandus est</latin>?"
      answer: "DATIVE OF AGENT"
    boni:
      - question: "What use of the genitive case can be found in the following sentence: <latin>Ē Britanniā semper est aliquid novī</latin>?"
        answer: "PARTITIVE GENITIVE / GENITIVE OF THE WHOLE"
      - question: "What use of the ablative case can be found in the following sentence: <latin>Omnēs cīvēs timōre effūgērunt</latin>?"
        answer: "CAUSE"
  - tossup:
      question: "Why were the times not right for a wedding?"
      answer: "THERE WAS A WAR / WERE WARS / (ROMANS) PEOPLE WERE FIGHTING"
    boni:
      - question: "What are the only things necessary for this wedding?"
        answer: "(SACRED MARRIAGE) TREATIES / VOWS / AGREEMENTS / PACTS"
      - question: "What will not appear on the doorway?"
        answer: "(FESTIVE) GARLANDS / WREATHS"
  - tossup:
      question: "After withstanding siege devices such as the <latin>sambūca</latin>, a floating siege tower with grappling hooks, and ship-mounted scaling walls, what city on Sicily finally fell to the Romans in 212 BC?"
      answer: "SYRACUSE / <latin>SYRĀCŪSAE</latin>  "
    boni:
      - question: "Please identify “This Guy”, who was responsible for creating some of the devices that helped the Syracusans withstand Roman attacks"
        answer: "ARCHIMEDES"
      - question: "What Roman general ordered his soldiers not to kill “This Guy” after the Romans breached the city, though one of the soldiers did end up killing “This Guy” because he didn’t know who he was?"
        answer: "(M. CLAUDIUS) MARCELLUS"
  - tossup:
      question: "A powerful portrait of decadent Roman society at the close of the 1st century AD can be found in whose sixteen satires published between 110 and 128 AD?"
      answer: "(DECIMUS IUNIUS) IUVENAL(IS)"
    boni:
      - question: "Into how many books were these sixteen satires grouped?"
        answer: "FIVE BOOKS"
      - question: "In which of Juvenal’s <title>Satires</title> does Umbricius list all the many ways in which Rome has become an unbearable place to live?"
        answer: "SATIRE 3 (IN BOOK 1)"
  - tossup:
      question: "What Latin phrase might one use to refer to the characters in a play?"
      answer: "<latin>DRĀMĀTIS PERSŌNAE</latin> "
    boni:
      - question: "What Latin phrase might one use to refer to the ratfink who blabbed all your plans and is now unwelcome around you?"
        answer: "<latin>PERSŌNA NŌN GRĀTA</latin> "
      - question: "What Latin phrase might one use to refer to the most senior person of a group sharing the same rank?"
        answer: "<latin>PRĪMUS INTER PARĒS</latin> "
  - tossup:
      question: "In Vergil’s <title>Aeneid</title>, who accompanies Aeneas in a cloud to observe Carthage?"
      answer: "ACHATES"
    boni:
      - question: "Which god disguises himself as Aeneas’ son so that he can “kindle the fire” between Aeneas and Dido?"
        answer: "CUPID"
      - question: "Who unknowingly built a funeral pyre for her sister Dido?"
        answer: "ANNA"
  - tossup:
      question: "What figure of speech, other than alliteration, can be found in <latin>“haud ignōta loquor”?</latin>"
      answer: "LITOTES"
    boni:
      - question: "… “<latin>passer mortuus est meae puellae”?</latin>"
        answer: "CHIASMUS"
      - question: "… “<latin>eōs morte, exsiliō, vinculīs, damnō coercent”?</latin>"
        answer: "ASYNDETON"
  - tossup:
      question: "In Book 6 of Ovid’s <title>Metamorphoses</title>, into what kind of creatures were the inhabitants of Lycia transformed by Latona?"
      answer: "FROGS"
    boni:
      - question: "Why did Latona transform these rude peasants?"
        answer: "THEY WOULDN’T LET HER DRINK / THEY MADE THE WATER (THAT SHE WAS ABOUT TO DRINK) MUDDY"
      - question: "What was Latona doing when she arrived in Lycia in need of water?"
        answer: "FLEEING JUNO"
  - tossup:
      question: "Complete the following analogy: <latin>scrībō : scrīpsissētis :: tollō : _____</latin>"
      answer: "<latin>SUSTULISSĒTIS</latin> "
    boni:
      - question: "Change <latin>sustulissētis</latin> to the passive voice"
        answer: "<latin>SUBLATĪ (-AE, -A) ESSĒTIS</latin>"
      - question: "Change <latin>sublatī (-ae, -a) essētis</latin> to the present tense"
        answer: "<latin>TOLLĀMINĪ</latin>"
  - tossup:
      question: "Though he did not acquire any new provinces in the East, Sulla detached Cisalpine Gaul from Italy, bringing the total number of Roman provinces to ten. Of the other nine provinces, name any two."
      answer: "AFRICA, SICILIA, SARDINIA ET CORSICA, HISPANIA CITERIOR, HISPANIA ULTERIOR, GALLIA TRANSALPINA, MACEDONIA, ASIA, CILICIA"
    boni:
      - question: "Name two more."
        answer: "AFRICA, SICILIA, SARDINIA ET CORSICA, HISPANIA CITERIOR, HISPANIA ULTERIOR, GALLIA TRANSALPINA, MACEDONIA, ASIA, CILICIA"
      - question: "Name two more."
        answer: "AFRICA, SICILIA, SARDINIA ET CORSICA, HISPANIA CITERIOR, HISPANIA ULTERIOR, GALLIA TRANSALPINA, MACEDONIA, ASIA, CILICIA"
  - tossup:
      question: "What is the gender of the Latin nouns <latin>lac, vulgus,</latin> and <latin>bellum</latin>?"
      answer: "NEUTER"
    boni:
      - question: "What is the gender of the Latin nouns <latin>laurus</latin> and <latin>Aegyptus</latin>?"
        answer: "FEMININE"
      - question: "What is the gender of the Latin nouns <latin>gummī</latin> and <latin>Sōracte</latin>?"
        answer: "NEUTER <latin>2014 NJCL CERTAMEN ADVANCED DIVISION</latin>"
