tournament: "NJCL Certamen"
year: 2014
division: "Advanced"
round: "Round 3"
questions:
  - tossup:
      question: "Please give all the active infinitives for the verb <latin>spondeō</latin>"
      answer: "<latin>SPONDĒRE, SPOPONDISSE, SPŌNSŪRUS/-UM/-A(M) ESSE</latin> "
    boni:
      - question: "Please give all three passive infinitives for the verb <latin>spernō</latin>."
        answer: "<latin>SPERNĪ, SPRĒTUS/-UM/-A(M) ESSE, SPRĒTUM ĪRĪ</latin>"
      - question: "Please give all the infinitives of <latin>ōdī</latin>"
        answer: "<latin>ŌDISSE, ŌSŪRUS/-UM/-A(M) ESSE</latin> "
  - tossup:
      question: "Who, because of the novelty of the crime and the danger to which the state was exposed, documented the events of the Catilinarian conspiracy in his <title><latin>Bellum Catilīnae</latin></title>?"
      answer: "(C.) SALLUST(IUS CRISPUS)"
    boni:
      - question: "What term refers to single-topic works such as Sallust’s <title><latin>Bellum Catilīnae</latin></title>?"
        answer: "MONOGRAPH(S)"
      - question: "In how many books did Sallust write his <title>Histories</title>, which dealt with the events from 78 to 67 BC?"
        answer: "5 BOOKS"
  - tossup:
      question: "What did the Romans call bread made of pure wheat flour?"
      answer: "<latin>PĀNIS SILĪGINEUS</latin>   "
    boni:
      - question: "Give the Latin term for “This Thing”"
        answer: "<latin>MŌLA</latin> "
      - question: "Give the Latin terms for the upper and lower millstone of the <latin>mōla</latin>"
        answer: "<latin>CATILLUS</latin> (UPPER MILLSTONE) & <latin>MĒTA</latin> (LOWER MILLSTONE)"
  - tossup:
      question: "Who were known as the Aloadae?"
      answer: "OTUS & EPHIALTES"
    boni:
      - question: "Who was their mother?"
        answer: "IPHIMEDIA"
      - question: "Who was the step-mother of the Aloadae who informed Hermes that the twin giants had imprisoned Ares in a bronze jar?"
        answer: "ERIBOEA"
  - tossup:
      question: "Please give the Latin verb root and its meaning from which we derive “toilet” and “tissue”"
      answer: "<latin>TEXŌ / TEXERE</latin> – TO WEAVE"
    boni:
      - question: "Please give the Latin deponent verb root and its meaning from which we derive “stray” and “vagabond”"
        answer: "<latin>VAGOR / VAGĀRĪ</latin> – TO WANDER, ROAM, ROVE"
      - question: "Please give the Latin deponent verb root and its meaning from which we derive “prom”"
        answer: "<latin>MINOR / MINĀRĪ</latin> – TO THREATEN"
  - tossup:
      question: "A Latin student consulting the <title><latin>Lexicon Recentis Latīnitātis</latin></title> will know that <latin>medicāmenta stupefactīva</latin> are things that he should say “no” to all the time. What are <latin>medicāmenta stupefactīva</latin>?"
      answer: "DRUGS"
    boni:
      - question: "The drug-free Latin student is dining with a friend one night and says “<latin>volō aequissimam partītiōnem</latin>” to his friend when their bill arrives. What does he want to do with the bill?"
        answer: "(SPLIT IT) FIFTY-FIFTY"
      - question: "The friend then responds that he is currently <latin>invītē ōtiōsus</latin>. The Latin student sighs at the predicament of his friend and pays the bill. What is his friend’s current situation, according to the <title><latin>Lexicon Recentis Latīnitātis</latin></title>?"
        answer: "UNEMPLOYED"
  - tossup:
      question: "What foreign king and temporary ally of Rome began retraining his armies and preparing for war when, in 78 BC, the Roman Senate rejected his request to ratify the Treaty of Dardanus?"
      answer: "MITHRIDATES (VI / EUPATOR)"
    boni:
      - question: "What Roman commander had written the Treaty of Dardanus with Mithridates several years earlier?"
        answer: "SULLA"
      - question: "Mithridates began the Third Mithridatic War by invading what kingdom bequeathed to Rome in 75 BC?"
        answer: "BITHYNIA"
  - tossup:
      question: "What author, although his literary works included tragedies, comedies, and satires, attained his literary fame with an epic poem of over 20,000 lines called the <title><latin>Annālēs</latin></title>?"
      answer: "(Q.) ENNIUS"
    boni:
      - question: "What famous Roman statesman and author brought Ennius to Rome from his humble roots?"
        answer: "(M. PORCIUS) CATO MAIOR / THE CENSOR / THE ELDER"
      - question: "To what ability was Ennius referring when he claimed that he had <latin>tria corda</latin>?"
        answer: "THE ABILITY TO SPEAK GREEK, LATIN, AND OSCAN"
  - tossup:
      question: "In what region of the Underworld do most shades of the dead remain?"
      answer: "FIELD(S)/PLAIN OF ASPHODEL"
    boni:
      - question: "According to Vergil, which of the judges of the Underworld rules over Tartarus?"
        answer: "RHADAMANTHUS"
      - question: "Name the river that forms the boundary of Tartarus along with three strong walls"
        answer: "(PYRI)PHLEGETHON"
  - tossup:
      question: "What should sensible men not do?"
      answer: "(THEY SHOULD NOT) BECOME <emphasis>DRUNK</emphasis>"
    boni:
      - question: "How does chronic drunkenness affect people’s minds?"
        answer: "MAKE THEM WILD / CRAZY / ANGRY / DIFFICULT / SAVAGE"
      - question: "What happens to pleasure when people have gone beyond their limit?"
        answer: "IT BECOMES / WILL BECOME PUNISHMENT"
  - tossup:
      question: "In Vergil’s <title>Aeneid</title>, when Aeneas settled on Crete, who told him that Italy was in fact his foretold destination?"
      answer: "THE PENATES"
    boni:
      - question: "Who had determined Crete as the destination of the prophecy?"
        answer: "ANCHISES"
      - question: "Which king of Delos was a friend to Anchises?"
        answer: "ANIUS"
  - tossup:
      question: "Please give a synonym of <latin>incolumis</latin>"
      answer: "<latin>TŪTUS, INTEGER, SALVUS, INTACTUS, SŌSPES, CAUTUS, SECŪRUS</latin> "
    boni:
      - question: "Please give a synonym of <latin>nēquīquam</latin>"
        answer: "<latin>FRŪSTRĀ, INCASSUM</latin> "
      - question: "Please give a synonym of <latin>cūnctus</latin>"
        answer: "<latin>TŌTUS, ŪNIVERSUS, OMNIS, QUISQUE</latin> "
  - tossup:
      question: "Who showed his appreciation for the works of Catullus by modeling his own 12 books of <title>Epigrams</title> after those of Catullus?"
      answer: "(M. VALERIUS) MARTIAL(IS)"
    boni:
      - question: "What Latin word did both Martial and Catullus use to refer to their own works?"
        answer: "<latin>LIBELLUS / LIBELLĪS</latin> "
      - question: "Give the titles of Martial’s two other works, sometimes appearing as Books 13 and 14 of his <title>Epigrams</title>, which are verse mottoes written to accompany gifts"
        answer: "<title><latin>XENIA & APOPHORĒTA</latin></title> "
  - tossup:
      question: "Please translate into Latin: If the soldiers had fought more bravely, we would have won"
      answer: "<latin>SĪ MĪLITĒS FORTIUS PUGNĀVISSENT, VĪCISSĒMUS / SUPERĀVISSĒMUS</latin> "
    boni:
      - question: "What type of conditional sentence is the toss-up an example?"
        answer: "(PAST) CONTRARY-TO-FACT"
      - question: "Please translate into Latin: If the soldiers should fight more bravely, we would win"
        answer: "<latin>SĪ MĪLITĒS FORTIUS PUGNENT, VINCĀMUS / SUPERĒMUS</latin> "
  - tossup:
      question: "The First Punic War began in earnest in 264 BC when the city of Messana was seized by which Roman consul?"
      answer: "APPIUS CLAUDIUS (CAUDEX)"
    boni:
      - question: "What group of mercenaries had appealed to Rome for help upon finding that their previous allies, the Carthaginians, had no intentions of leaving the city?"
        answer: "MAMERTINES"
      - question: "Against what king of Syracuse had the Mamertines and Carthaginians successfully defended Messana in 265 BC?"
        answer: "HIERO(N II)"
  - tossup:
      question: "Who, because he had killed its former monarch, preferred not to rule the kingdom of Argos and exchanged it for Tiryns, the realm of one of his cousins?"
      answer: "PERSEUS"
    boni:
      - question: "Name this cousin of Perseus with whom he exchanged his kingdom"
        answer: "MEGAPENTHES"
      - question: "Name the daughter of Perseus who was the first widow in mythology to remarry"
        answer: "GORGOPHONE"
  - tossup:
      question: "<latin>Dēscrībāmus</latin> nunc <latin>prōprietātēs dictiōnum in hāc sententiā</latin>: “Idem velle atque idem <latin>nōlle</latin> ea <latin>dēmum fīrma amīcitia</latin> est.” <latin>Quō cāsū</latin> est “idem”?"
      answer: "<latin>ACCŪSĀTĪVŌ</latin>"
    boni:
      - question: "<latin>Cūius modī sunt “velle” et “nōlle”?</latin>"
        answer: "<latin>ĪNFĪNĪTĪVĪ</latin>"
      - question: "<latin>“Fīrma”, dā mihi gradum superlātīvum</latin>"
        answer: "<latin>FĪRMISSIMA</latin> "
  - tossup:
      question: "Which of Horace’s works imitates the works of Archilochus but also betrays Hellenistic origins in its 17 poems?"
      answer: "<title>EPODES /</title> <title><latin>IAMBĪ</latin></title>"
    boni:
      - question: "Which of Horace’s works is a choral ode in praise of Augustus?"
        answer: "<title><latin>CARMEN SAECULĀRE</latin></title> "
      - question: "Which of Horace’s works, published between 23 and 13 BC, contains lyrics on diverse themes which display complete mastery of form and economy of language?"
        answer: "<title>ODES</title> "
  - tossup:
      question: "Please translate into English the motto of Queens College, “<latin>discimus ut serviāmus”.</latin>"
      answer: "WE (ARE) LEARN(ING) (IN ORDER) TO SERVE / SO THAT WE MAY SERVE"
    boni:
      - question: "Please give the Latin motto for Columbia University"
        answer: "<latin>IN LŪMINE TUŌ VIDĒBIMUS LŪMEN</latin> "
      - question: "Which university has the motto “<latin>suōs cultōrēs scientia corōnat”</latin>, which means “knowledge crowns those who seek her”?"
        answer: "SYRACUSE"
  - tossup:
      question: "At what battle were Calgacus and the Caledonian tribes defeated by the Roman general Agricola in  84 AD?"
      answer: "<latin>MŌNS</latin> / MT. GRAUPIUS"
    boni:
      - question: "Agricola was preceded as governor of Britannia by what man who pushed into Wales and defeated the Silures from 74 to 78 AD?"
        answer: "(SEX. IULIUS) FRONTINUS"
      - question: "Who served as Vespasian’s first governor of Britannia from 69 to 71 AD?"
        answer: "(MARCUS) VETTIUS (BOLANUS)  <latin>2014 NJCL CERTAMEN ADVANCED DIVISION</latin>"
