  - tossup:
      question: "Elected consul in 115 BC with Marcus Caecilius Metellus and censor in 109 BC with Marcus Livius Drusus, what man served as <latin>princeps senatus</latin>from 120 BC until his death and called for the <latin>senatus consultum ultimum</latin> against Saturninus in 100 BC?"
