        answer: "<latin>SCAPHA</latin> "
      - question: "…: <latin>Est ligneum instrumentum quod bovēs duōs simul iungit et colligat</latin>?"
        answer: "<latin>IUGUM</latin> "
  - tossup:
      question: "Who devoted himself to writing in defence of the Church against popular charges of atheism and magic after he converted to Christianity <latin>circa</latin> 195 AD and was regarded as the 1st Latin theologian?"
