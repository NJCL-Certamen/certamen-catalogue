    boni:
      - question: "Give the Latin root and its meaning from which we derive “refrain”, as in “to cease”?"
        answer: "<latin>FRĒNUM</latin> – A BRIDLE, BIT, CURB"
      - question: "Give the Latin root and its meaning from which we derive “sagebrush”?"
        answer: "<latin>SALVUS</latin> - HEALTHY"
  - tossup:
      question: "I am now going to hand each of you a visual. Please do not open the visual until you are told to do so. Please open the visual and you have 10 seconds to study the visual. Pictures A, B, and C all depict events that can be found in which book of Caesar’s <title><latin>Dē Bellō Gallicō</latin></title>?"
