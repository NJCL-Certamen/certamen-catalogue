tournament: "NJCL Certamen"
year: 2014
division: "Novice"
round: "Round 3"
questions:
  - tossup:
      question: "What Roman general was portrayed on Greek coins and even worshipped as a god in some Greek  cities following his proclamation of the liberation of Greece at the Isthmian Games of 196 BC?"
      answer: "(TITUS QUINCTIUS) FLAMININUS"
    boni:
      - question: "In what Greek city, sacked by the Romans fifty years later, did Flamininus make his proclamation?"
        answer: "CORINTH"
      - question: "The Greek city Sikyon took over the administration of the Isthmian Games after the destruction of Corinth by what Roman general in 146 BC?"
        answer: "(LUCIUS) MUMMIUS"
  - tossup:
      question: "Which of the following verbs does NOT form its present active singular imperative in the same way as the others: <latin>amō, canō, dūcō, trahō?</latin>"
      answer: "<latin>DŪCŌ</latin>"
    boni:
      - question: "Give two other basic Latin verbs that form their present active singular imperative in the same manner as <latin>dūcō</latin>"
        answer: "<latin>DĪCŌ, FACIŌ, FERŌ</latin>"
      - question: "For the verb <latin>ferō</latin>, give the present active plural imperative"
        answer: "<latin>FERTE</latin>"
  - tossup:
      question: "What sister of Meleager was the prize in a wrestling match between a river god and Heracles and shortly afterward became Heracles’ second wife?"
      answer: "DEIANEIRA"
    boni:
      - question: "What river god did Heracles defeat?"
        answer: "ACHELOÜS"
      - question: "Where did Heracles meet Meleager, at which point Meleager suggested that Heracles should wed his sister?"
        answer: "THE UNDERWORLD / HADES / ORCUS"
  - tossup:
      question: "Using <latin>ille</latin><title><latin>,</latin></title> translate “that river” into Latin"
      answer: "<latin>ILLUD FLŪMEN // ILLE AMNIS/FLUVIUS/RĪVUS</latin>"
    boni:
      - question: "Make <latin>illud flūmen</latin> accusative singular"
        answer: "<latin>ILLUD FLŪMEN</latin> "
      - question: "Make <latin>illud flūmen</latin> genitive singular"
        answer: "<latin>ILLĪUS FLŪMINIS</latin>"
  - tossup:
      question: "The following are all Latin names for what: <latin>Dānuvius, Rhodanus</latin>, <latin>Rhēnus</latin>, and <latin>Euphrātes</latin>?"
      answer: "RIVERS"
    boni:
      - question: "Which of the above rivers is farthest East?"
        answer: "<latin>EUPHRATES</latin>"
      - question: "What is the modern name for the <latin>Rhēnus</latin>?"
        answer: "RHINE"
  - tossup:
      question: "Which of the following words, if any, does NOT derive from the same Latin root as the others:  habitual, able, homicide, exhibition?"
      answer: "HOMICIDE"
    boni:
      - question: "Give the principal parts of the Latin verb from which we derive “habitual”, “able”, and “exhibition”"
        answer: "<latin>HABEŌ, HABĒRE, HABUĪ, HABITUS</latin>/-<latin>UM</latin>"
      - question: "Give the Latin words and their meanings from which we derive “homicide”"
        answer: "<latin>HOMŌ</latin> – MAN & <latin>CAEDŌ</latin>/<latin>CAEDERE</latin> – TO KILL"
  - tossup:
      question: "What character in the <title>Odyssey</title> was left in charge of looking after Telemachus in Odysseus’ absence, and therefore gives his name to an English word for a teacher or guide?"
      answer: "MENTOR"
    boni:
      - question: "Athena in the form of Mentor acquired a ship and crew for Telemachus so that he could sail to what mainland city?"
        answer: "(SANDY) PYLOS"
      - question: "What king of Pylos did Telemachus ask for news of his father?"
        answer: "NESTOR"
  - tossup:
      question: "Who accompanied Diana into the cave?"
      answer: "SLAVE GIRLS"
    boni:
      - question: "What two things did Diana’s slave-girls do as soon as they saw the hunter approaching?"
        answer: "HURRIED TO HER AND HID HER"
      - question: "The story continues: <latin>Diāna, vēnātōrem pūnīre cupiēns, quod</latin> nihil aliud <latin>habēbat</latin>, aquam in vultum <latin>vēnātōris iēcit</latin>. Why did Diana throw water against the hunter’s face AND what circumstance forced her to use only water?"
        answer: "SHE WANTED TO <emphasis>PUNISH THE HUNTER</emphasis> & SHE <emphasis>HAD NOTHING ELSE</emphasis> (TO USE EXCEPT WATER)"
  - tossup:
      question: "The expansion of the Senate to 600 members, the removal of the position of <latin>prīnceps senātūs</latin>, a  limitation on the tribune’s right to veto, and a reinstitution of the Senatorial veto over the <latin>concilium plebis</latin> were all parts of the political agenda of what Optimate leader and dictator of the first century BC?"
      answer: "(LUCIUS CORNELIUS) SULLA (FELIX)"
    boni:
      - question: "The full powers of the tribunes were restored in legislation brought forth personally by what two consuls of 70 BC?"
        answer: "POMPEY AND CRASSUS"
      - question: "In what year did Pompey and Crassus serve as co-consuls for the second time?"
        answer: "55 BC"
  - tossup:
      question: "Please translate this sentence into Latin: The doctor will write a letter with a pen"
      answer: "<latin>MEDICUS EPISTULAM/LITTERĀS/-AM STILŌ/CALAMŌ/PENNĀ/PINNĀ SCRĪBET</latin> "
    boni:
      - question: "Translate into Latin: My brother will teach me wisdom and the Latin language"
        answer: "<latin>FRĀTER (MEUS) MĒ SAPIENTIAM ET LINGUAM LATĪNAM DOCĒBIT</latin> "
      - question: "Translate into Latin using <latin>similis</latin>: You and I will always be like the Romans"
        answer: "<latin>EGO ET TŪ SEMPER ERIMUS SIMILĒS RŌMĀNĪS</latin>"
  - tossup:
      question: "The city now known as Thebes originally drew its name from what son of Agenor and founder of the city?"
      answer: "CADMUS"
    boni:
      - question: "Cadmus originally travelled from Phoenicia to Greece to find whom?"
        answer: "EUROPA (PROMPT ON “HIS SISTER”)"
      - question: "What king of Thebes renamed the city after his wife?"
        answer: "ZETHUS"
  - tossup:
      question: "Which of the following is the closest synonym for the Latin verb <latin>dēmōnstrō</latin>: <latin>rīdeō</latin>, <latin>ostendō</latin>, <latin>pulsō</latin>,  <latin>cēlō</latin>, or <latin>haereō</latin>?"
      answer: "<latin>OSTENDŌ</latin>"
    boni:
      - question: "Which of the words in the tossup would be the best antonym for <latin>dēmōnstrō</latin>?"
        answer: "<latin>CĒLŌ</latin>"
      - question: "<latin>rīdeō</latin>, <latin>pulsō</latin>, and <latin>haereō</latin>"
        answer: "<latin>RĪDEŌ</latin> – TO SMILE (AT); LAUGH / <latin>PULSŌ</latin> – TO KNOCK; BEAT; STRIKE / <latin>HAEREŌ</latin> – TO CLING, STICK"
  - tossup:
      question: "For the verb <latin>trahō</latin>, please give the third person singular imperfect passive indicative"
      answer: "<latin>TRAHĒBĀTUR</latin> "
    boni:
      - question: "Change <latin>trahēbātur</latin> to the perfect tense"
        answer: "<latin>TRACTUS (-A, -UM) EST</latin>"
      - question: "Change <latin>tractus est</latin> to the plural"
        answer: "<latin>TRACTĪ SUNT</latin> "
  - tossup:
      question: "Because King Oeneus had forgotten to make a sacrifice to Artemis, she sent what kind of animal to  ravage the countryside of Calydon?"
      answer: "(THE GIANT/CALYDONIAN) BOAR"
    boni:
      - question: "In the hunt that ensued, who was the first to wound the boar?"
        answer: "ATALANTA"
      - question: "What son of Oeneus killed the boar?"
        answer: "MELEAGER"
  - tossup:
      question: "What does it mean to speak ad lib.?"
      answer: "AT PLEASURE / OFF THE CUFF / UNPREPARED"
    boni:
      - question: "For what Latin word does the <latin>lib</latin>. of that abbreviation stand?"
        answer: "LIBITUM"
      - question: "The Latin abbreviation <latin>lb</latin>. stands for what Latin word?"
        answer: "<latin>LĪBRA</latin>"
  - tossup:
      question: "What use of the ablative case is found in the following sentence: <latin>omnēs hostēs mediā nocte discēdere constituērunt?</latin>"
      answer: "TIME WHEN"
    boni:
      - question: "What use of the ablative case is found in the following sentence: <latin>omnēs hostēs duābus noctibus discēdent?</latin>"
        answer: "TIME WITHIN WHICH"
      - question: "Say in Latin: All the enemies marched for two hundred days"
        answer: "<latin>OMNĒS HOSTĒS DUCENTŌS DIĒS ITER FĒCĒRUNT/FACIĒBANT</latin> "
  - tossup:
      question: "With the aid of what incredibly old woman was Aeneas able to travel to the underworld?"
      answer: "THE (CUMAEAN) SIBYL / DEIPHOBE"
    boni:
      - question: "On what did the Sibyl write her prophecies?"
        answer: "(OAK) LEAVES"
      - question: "Who had given the Sibyl an extremely long life, but did not give her youth as well?"
        answer: "APOLLO"
  - tossup:
      question: "The first dynasty of Roman emperors came to a close with the suicide of which emperor in 68 AD?"
      answer: "NERO"
    boni:
      - question: "Nero committed suicide after the Senate named him a public enemy and declared what general as the rightful emperor of Rome?"
        answer: "(SERVIUS SULPICIUS) GALBA"
      - question: "Of the four emperors who ruled in the year 69 AD, how many committed suicide?"
        answer: "ONE"
  - tossup:
      question: "Translate into English: <latin>Tē iubeō cunīculum servāre</latin>"
      answer: "I ORDER/ AM ORDERING YOU TO SAVE/GUARD THE RABBIT / BUNNY"
    boni:
      - question: "Translate into English: <latin>Nōlī fugere, parve cunīcule!</latin>"
        answer: "DON’T FLEE/ RUN AWAY, LITTLE RABBIT / BUNNY"
      - question: "Translate into English: <latin>Ille homō malus tē edere cupit.</latin>"
        answer: "THAT BAD MAN / PERSON WANTS/ DESIRES TO EAT / PUBLISH YOU."
  - tossup:
      question: "How did the spectators at the amphitheater distinguish the <latin>rētiāriī</latin> from other types of gladiators?"
      answer: "ARMED WITH TRIDENT AND A NET"
    boni:
      - question: "Give the Latin term for the type of event you see depicted here"
        answer: "<latin>VĒNĀTIŌ</latin>"
      - question: "Give the Latin term for the type of gladiator identified by the letter “A”"
        answer: "<latin>BĒSTIĀRIUS / VĒNĀTOR 2014 NJCL CERTAMEN NOVICE DIVISION</latin>"
