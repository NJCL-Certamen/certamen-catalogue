tournament: "NJCL Certamen"
year: 2015
division: "Intermediate"
round: "Round 1"
questions:
  - tossup:
      question: "What use of the genitive case can be found in the following sentence?"
      answer: "<latin>“Numquam odium librōrum  habēbō.”</latin> OBJECTIVE GENITIVE"
    boni:
      - question: "What use of the genitive case can be found in the following sentence? “<latin>quid novī, Pūblī?</latin>"
        answer: "<latin>”</latin> PARTITIVE / OF THE WHOLE"
      - question: "What use of the genitive case can be found in the following sentence?"
        answer: "“<latin>Pūblius est vir summae  virtūtis.”</latin> DESCRIPTION / QUALITY"
  - tossup:
      question: "What son of Zeus turned Battus into stone, invented the lyre, and stole Apollo’s cattle, all on the day  he was born?"
      answer: "HERMES"
    boni:
      - question: "Who was Hermes’ mother?"
        answer: "MAIA"
      - question: "What perspicacious servant of Hera did Hermes kill to rescue Io?"
        answer: "ARGUS (PANOPTES)"
  - tossup:
      question: "What did the Romans call modern-day Lyon in France?"
      answer: "LUGDUNUM / LUGUDUNUM"
    boni:
      - question: "What did the Romans call modern-day Cartagena in Spain?"
        answer: "CARTHAGO NOVA"
      - question: "What did the Romans call modern-day Cologne in Germany?"
        answer: "COLONIA AGRIPPINENSIS / AGRIPPINENSIUM // OPPIDUM UBIORUM"
  - tossup:
      question: "Translate the following sentence into English: “<latin>Mārcus, saxō vulnerātus, ad medicum festīnāvit.”</latin>"
      answer: "MARCUS, (HAVING BEEN) WOUNDED BY THE ROCK, HURRIED TO THE DOCTOR"
    boni:
      - question: "Translate the following sentence into English: <latin>“Medicō labōrante, ancillae auxiliō Mārcō  arcessītae sunt.”</latin>"
        answer: "WHILE/AS THE DOCTOR WAS WORKING / WITH THE DOCTOR WORKING, SLAVE GIRLS / SLAVE-WOMEN WERE / HAVE BEEN SUMMONED AS HELP TO MARCUS / TO  HELP MARCUS"
      - question: "Translate the following sentence into English: <latin>“Vulnere sānātō, Mārcus domum rediit ut  quiēsceret.”</latin>"
        answer: "WITH THE WOUND (HAVING BEEN) HEALED / AFTER THE WOUND WAS HEALED /  AFTER THE WOUND HAD BEEN HEALED, MARCUS RETURNED HOME TO REST"
  - tossup:
      question: "Give the Latin motto and its English meaning for Idaho."
      answer: "<latin>ESTŌ PERPETUA</latin> – LET / MAY IT / HER BE PERPETUAL / FOREVER"
    boni:
      - question: "What European city shares this Latin motto?"
        answer: "VENICE"
      - question: "Give the Latin motto for the city that the Romans called “<latin>Lūtētia</latin>”."
        answer: "<latin>FLUCTUAT NEC MERGITUR</latin>"
  - tossup:
      question: "<latin>Dēscrībāmus nunc propriētātēs dictiōnum in hāc sententiā: “arma virumque canō”. Cūius  dēclīnātiōnis est “arma”?</latin>"
      answer: "<latin>SECUNDAE</latin>"
    boni:
      - question: "<latin>Cūius generis est “virum”?</latin>"
        answer: "<latin>MASCULĪNĪ</latin>"
      - question: "<latin>Quae pars ōrātiōnis est “-que”?</latin>"
        answer: "<latin>CONIŪNCTIŌ</latin>"
  - tossup:
      question: "Who, upon seeing his brother Deiphobus, turned to fight Achilles, who was determined to avenge his  friend Patroclus?"
      answer: "HECTOR"
    boni:
      - question: "What deity impersonated Deiphobus in order to trick Hector into fighting?"
        answer: "ATHENA / MINERVA"
      - question: "Before dying, Hector predicts Achilles’ death. What brother of Hector killed Achilles?"
        answer: "PARIS"
  - tossup:
      question: "What Roman general had his revenge against Sulla cut short when he died suddenly in 86 BC, the  year of his seventh and last consulship?"
      answer: "(C.) MARIUS ("
    boni:
      - question: "Identify the letter corresponding to the bust of Marius."
        answer: "B"
      - question: "Now identify the letter corresponding to the bust of Sulla."
        answer: "A"
  - tossup:
      question: "Give an antonym of <latin>salūs.</latin>"
      answer: "<latin>PERĪCULUM / ĪNSĀNITĀS / ĪNFIRMITĀS / AEGRITŪDŌ</latin>"
    boni:
      - question: "Give an antonym of <latin>nāscor.</latin>"
        answer: "<latin>MORIOR / PEREŌ</latin>"
      - question: "Give an antonym of <latin>plēnus.</latin>"
        answer: "<latin>INĀNIS / VACUUS</latin>"
  - tossup:
      question: "Which of the following tenses does not apply to Latin infinitives: perfect, imperfect, present, future?"
      answer: "IMPERFECT"
    boni:
      - question: "Which of the following terms does not belong because of some point of Latin grammar: indicative,  imperative, gerundive, subjunctive?"
        answer: "GERUNDIVE"
      - question: "Which of the following terms does not belong because of some point of Latin grammar: adverbial  purpose clause, result clause, indirect statement, fearing clause?"
        answer: "INDIRECT STATEMENT"
  - tossup:
      question: "Who accidentally killed the pet stag of Tyrrhus and in so doing started a war between the Latins, led  by Latinus, and the Trojans, led by his father, Aeneas?"
      answer: "ASCANIUS / IULUS"
    boni:
      - question: "What Fury did Juno send to incite the war?"
        answer: "ALLECTO"
      - question: "What Latin queen was especially adamant that the Latins make war on the Trojans?"
        answer: "AMATA"
  - tossup:
      question: "What governor of Panonnia Superior, proclaimed emperor at Carnuntum twelve days after the murder  of Pertinax, was recognized by the Senate and was allowed to enter Rome unopposed in 193 AD?"
      answer: "(SEPTIMIUS) SEVERUS"
    boni:
      - question: "Who briefly held the imperial throne immediately after the death of Pertinax thanks to his huge  wealth that let him bribe the Praetorian Guard for support?"
        answer: "DIDIUS JULIANUS"
      - question: "Name the governor of Britain who initially supported Severus’s claim to the throne after Severus  named him Caesar, but who later revolted."
        answer: "(CLODIUS SEPTIMIUS) ALBINUS"
  - tossup:
      question: "Change the phrase <latin>quīdam āthlēta</latin> to the accusative singular."
      answer: "<latin>QUENDAM ĀTHLĒTAM</latin>"
    boni:
      - question: "Change <latin>quendam āthlētam</latin> to the genitive."
        answer: "<latin>CŪIUSDAM ĀTHLĒTAE</latin>"
      - question: "Change <latin>cūiusdam āthlētae</latin> to the plural."
        answer: "<latin>QUŌRUNDAM ĀTHLĒTĀRUM</latin>"
  - tossup:
      question: "Give the Latin adjective and its English meaning at the root of “obdurate”."
      answer: "<latin>DŪRUS</latin> – HARD, HARSH"
    boni:
      - question: "Give the Latin word and its English meaning at the root of “corsage”."
        answer: "<latin>CORPUS</latin> - BODY"
      - question: "Give the Latin word and its English meaning at the root of “sample”."
        answer: "<latin>EMŌ</latin> – TO BUY"
  - tossup:
      question: "Who killed Leodes, Eurymachus, Antinoüs, and many others after they invaded his home, slaughtered  his herds for their meals, and tried to marry his wife, Penelope?"
      answer: "ODYSSEUS / ULYSSES / ULIXES"
    boni:
      - question: "Who was Odysseus’ son who helped him slaughter Penelope’s suitors?"
        answer: "TELEMACHUS"
      - question: "Name one of the faithful herdsmen who also took Odysseus’ side in the massacre?"
        answer: "EUMAEUS / PHILOETIUS"
  - tossup:
      question: "What Latin term for a category of clothing, literally meaning “put on”, includes <latin>tunicae</latin>?"
      answer: "<latin>INDŪTUS</latin>"
    boni:
      - question: "What is the distinguishing feature for tunics called <latin>tunicae talārēs</latin>?"
        answer: "THEY REACHED THE FEET / ANKLES"
      - question: "What is the distinguishing feature for tunics called <latin>tunicae manicātae</latin>?"
        answer: "SLEEVES REACHING TO THE WRISTS"
  - tossup:
      question: "Using the verb <latin>eō</latin>, say in Latin, “We are about to go to Rome.”"
      answer: "<latin>(NŌS) RŌMAM ITŪRĪ SUMUS</latin>"
    boni:
      - question: "Using the verb <latin>discēdō</latin>, say in Latin, “They were intending to leave Pompeii.”"
        answer: "<latin>(EĪ / ILLĪ / HĪ) POMPĒIĪS DISCESSŪRĪ ERANT / IN ANIMŌ HABĒBANT DISCĒDERE</latin>"
      - question: "Say in Latin using the verb <latin>necō:</latin> The enemies had been killed with swiftness by the Roman soldiers."
        answer: "<latin>HOSTĒS CUM CELERITĀTE/CELERITER Ā/AB RŌMĀNĪS MĪLITIBUS NECĀTĪ ERANT</latin>"
  - tossup:
      question: "Listen to the following passage, which I shall read twice, then answer the question that follows in  Latin:  <latin>Postrīdiē Caesar, ut solēbat, ē bīnīs castrīs cōpiās suās ēdūxit paulumque progressus aciem  prope maiōra castra īnstrūxit. Hostēs diū exspectābat. Quod tamen illī nōn exiērunt ut  pugnārent, circum merīdiem exercitum in castra redūxit.</latin> (repeat)  The question: <latin>Ubi Caesar aciem īnstrūxit?</latin>"
      answer: "<latin>PROPE MAIŌRA CASTRA</latin>"
    boni:
      - question: "<latin>Quandō Caesar cōpiās ad castra redūxit?</latin>"
        answer: "<latin>AD / PROPE / CIRCUM MERĪDIEM // MERĪDIĒ</latin>"
      - question: "<latin>Cūr Caesar exercitum redūxit?</latin>"
        answer: "<latin>QUOD (HOSTĒS) NŌN EXIĒRUNT / QUOD (HOSTĒS) NŌN PUGNĀVĒRUNT</latin>"
  - tossup:
      question: "During the reign of which emperor did Trajan march from Spain toward Upper Germany in an  attempt to suppress the rebellion of Lucius Antonius Saturninus in 89 AD?"
      answer: "DOMITIAN"
    boni:
      - question: "What king of the Dacians surrendered all captives and accepted a role as client of Rome in that same  year?"
        answer: "DECEBALUS"
      - question: "During the reign of which emperor did Decebalus revolt against Rome once more?"
        answer: "TRAJAN"
  - tossup:
      question: "Who manipulated the flows of the Alpheius and Peneius rivers to help him clean Augeias’ stables, his  fifth labor?"
      answer: "HERAKLES / HERCULES"
    boni:
      - question: "Why did Herakles later return to Elis to depose and kill Augeias?"
        answer: "AUGEIAS REFUSED TO PAY HIM (AS THEY HAD AGREED)"
      - question: "What son of Augeias, who had urged his father to pay Herakles, did Herakles place on the throne of  Elis?"
        answer: "PHYLEUS"
