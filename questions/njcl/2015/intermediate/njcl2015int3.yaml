tournament: "NJCL Certamen"
year: 2015
division: "Intermediate"
round: "Round 3"
questions:
  - tossup:
      question: "What daughter of Phoebe and Coeus was seduced by Zeus and was forced to flee from Hera to the  island of Delos where she bore twins, Apollo and Artemis?"
      answer: "LETO"
    boni:
      - question: "Which twin was born first and helped with the birth of the other?"
        answer: "ARTEMIS"
      - question: "Into what did Leto transform some Lycian peasants when they refused to let her drink from a well?"
        answer: "FROGS"
  - tossup:
      question: "For the verb <latin>iaciō</latin>, give the 2nd person singular, future perfect passive indicative."
      answer: "<latin>IACTUS (-A, -UM) ERIS</latin>"
    boni:
      - question: "Change <latin>iactus eris</latin> to the 3rd person plural."
        answer: "<latin>IACTĪ (-AE, -A) ERUNT</latin>"
      - question: "Change <latin>iactī erunt</latin> to the active voice."
        answer: "<latin>IĒCERINT</latin>"
  - tossup:
      question: "What Latin term refers to the act by which the <latin>paterfamiliās</latin> recognized a newborn as his own and  admitted it to all the rights and privileges that membership in a Roman family implied?"
      answer: "<latin>SUSCEPTIŌ</latin>"
    boni:
      - question: "During the reign of Marcus Aurelius, the father was required to register the date of birth and name of  his child within how many days?"
        answer: "THIRTY"
      - question: "Give a term for the day on which a purification ceremony was performed and a name was given to a  child?"
        answer: "<latin>DIĒS LŪSTRICUS / NŌMINĀLIA / DIĒS NŌMINUM</latin>"
  - tossup:
      question: "Translate into idiomatic Engish, “<latin>Nautae parant ad nāvēs solvendās.</latin>”"
      answer: "THE SAILORS ARE PREPARING TO LAUNCH (THE) SHIPS"
    boni:
      - question: "Translate into idiomatic English “<latin>Senātōrēs in cūriā convēnērunt ōrātiōnum habendārum gratiā.</latin>”"
        answer: "THE SENATORS GATHERED / MET IN THE SENATE HOUSE (IN ORDER)  TO GIVE SPEECHES / FOR THE SAKE OF GIVING SPEECHES"
      - question: "Translate into idiomatic English, “<latin>Imperātor ā mīlitibus petīvit ut proelium committerent.</latin>”"
        answer: "THE COMMANDER / EMPEROR ASKED THE SOLDIERS TO BEGIN / GIVE BATTLE"
  - tossup:
      question: "What king of Thebes made the mistake of spying on a band of wild maenads and, when he was  caught, got torn to bits by his aunts and his mother, Agave?"
      answer: "PENTHEUS"
    boni:
      - question: "According to Euripides, who convinced Pentheus to spy on the maenads?"
        answer: "DIONYSUS"
      - question: "Where were the maenads when they ripped Pentheus apart?"
        answer: "MT. CITHAERON"
  - tossup:
      question: "Give a synonym of <latin>formōsus.</latin>"
      answer: "<latin>PULCHER / VENUSTUS / BELLUS</latin>"
    boni:
      - question: "Give a synonym of <latin>cōnor.</latin>"
        answer: "<latin>TEMPTŌ / ATTEMPTŌ / PROBŌ / AFFECTŌ</latin>"
      - question: "Give a synonym of <latin>pondus.</latin>"
        answer: "<latin>ONUS / GRAVITĀS / MOLĒS / IMPEDIMENTUM</latin>"
  - tossup:
      question: "Suetonius writes that what emperor exclaimed “<latin>Quīnctilī Vāre, lēgiōnēs redde</latin>!” upon the loss of  three legions at the Teutoburg Forest in 9 AD?"
      answer: "AUGUSTUS"
    boni:
      - question: "Name the leader of the Cherusci who defeated Varus at the Teutoburg Forest."
        answer: "ARMINIUS / HERMAN (THE GERMAN)"
      - question: "What Roman general defeated Arminius in 16 AD before celebrating a triumph and heading east to  crown the Armenian king?"
        answer: "GERMANICUS"
  - tossup:
      question: "What two uses of the ablative case can be found in the following sentence: “<latin>Cicerō vīllam magnā  pulchritūdine centum aureīs vēndidit.</latin>”"
      answer: "DESCRIPTION & PRICE / (DEFINITE) VALUE"
    boni:
      - question: "What two uses of the ablative case can be found in the following sentence: “<latin>Cicerōne et Hybridā   cōnsulibus, Catilīna īrā coniūrātiōnem contrā rem pūblicam fēcit.</latin>”"
        answer: "ABSOLUTE & CAUSE"
      - question: "What two uses of the ablative case can be found in the following sentence: “<latin>Cicerō sentit patriam  multō cāriōrem vītā suā esse</latin>?"
        answer: "” DEGREE OF DIFFERENCE & COMPARISON"
  - tossup:
      question: "<latin>Dēscrībāmus nunc propriētātēs dictiōnum in hāc sententiā: “urbem ā prīncipiō rēgēs  habuērunt.” quō cāsū est “rēgēs”?</latin>"
      answer: "<latin>NŌMINĀTĪVŌ</latin>"
    boni:
      - question: "<latin>“habuērunt.” quā persōnā est?</latin>"
        answer: "<latin>TERTIĀ</latin>"
      - question: "<latin>“prīncipiō,” cuius generis est?</latin>"
        answer: "<latin>NEUTRĪ(US)</latin>"
  - tossup:
      question: "What derivative of the Latin word for “foot” means “to accomplish promptly; to hasten”?"
      answer: "EXPEDITE"
    boni:
      - question: "What derivative of the Latin word for “sharp” means “appealing and delightfully charming”?"
        answer: "CUTE"
      - question: "What derivative of the Latin word for “to bind” means “to depend confidently; to put trust in”?"
        answer: "RELY"
  - tossup:
      question: "Name the two immediate family members who escaped Troy with Aeneas."
      answer: "ANCHISES AND ASCANIUS / IULUS"
    boni:
      - question: "Whose ghost appeared to Aeneas shortly after he lost track of her while the whole family fled Troy?"
        answer: "CREUSA’S"
      - question: "Where did Aeneas meet with the other surviving refugees before sailing for a new home?"
        answer: "MT. IDA/ THE (DESERTED) TEMPLE OF CERES (OUTSIDE OF TROY)"
  - tossup:
      question: "Which of the following structures in Rome was NOT located in the Campus Martius: Pantheon,  Theater of Marcellus, Temple of Mars Ultor, or Stadium of Domitian?"
      answer: "TEMPLE OF MARS ULTOR"
    boni:
      - question: "Where in Rome was the Temple of Mars Ultor located?"
        answer: "FORUM OF AUGUSTUS"
      - question: "Which of the structures from the tossup was located nearest to the Tiber River?"
        answer: "THEATER OF MARCELLUS"
  - tossup:
      question: "Listen carefully to the following passage, which I shall read twice, then answer the question that  follows in Latin:  <latin>Nōbilēs quīdam Rōmānī coniūrātiōnem fēcērunt ut cōnsulēs interficerent domūsque  senātōrum incenderent. In coniūrātiōne erat Quīntus Cūrius, homō audāx quī ē senātū  superbiā expulsus erat. Nec tacēre dē rēbus audītīs nec scelera sua cēlāre poterat.</latin> (repeat) The question: <latin>quō cōnsiliō quīdam Rōmānī coniūrātiōnem fēcērunt?</latin>"
      answer: "<latin>UT CŌNSULĒS INTERFICERENT / DOMŪS SENĀTŌRUM INCENDERENT</latin>"
    boni:
      - question: "<latin>Quārē Quīntus Cūrius expulsus erat?</latin>"
        answer: "<latin>SUPERBIĀ / QUOD ERAT SUPERBUS</latin>"
      - question: "<latin>Quae potestās Cūriō dēerat?</latin>"
        answer: "<latin>TACĒRE (DĒ RĒBUS  AUDĪTĪS) / CĒLĀRE SCELERA (SUA)</latin>"
  - tossup:
      question: "Who created people by throwing their mother’s bones over their shoulders in order to repopulate the  world after a flood?"
      answer: "DEUCALION AND PYRRHA"
    boni:
      - question: "Who gave Deucalion and Pyrrha the advice that they should veil their heads and throw the bones of  their mother over their shoulders?"
        answer: "THEMIS"
      - question: "What did Themis mean by “the bones of their mother?"
        answer: "” ROCKS"
  - tossup:
      question: "Translate the following sentence into Latin: “I know that the queen was attacked with a rock.”"
      answer: "<latin>(EGO) SCIŌ / NŌVĪ RĒGĪNAM SAXŌ / LAPIDE / RUPE / SCOPULŌ OPPUGNĀTAM /  PETĪTAM / ADITAM / INVĀSAM ESSE</latin>"
    boni:
      - question: "Translate the following sentence into Latin: “I knew that the queen would be attacked by the guards.”"
        answer: "<latin>(EGO) SCIĒBAM / SCĪVĪ / NOVERAM RĒGĪNAM Ā / AB CUSTŌDIBUS / VIGILIBUS  OPPUGNĀTUM ĪRĪ</latin>"
      - question: "Translate the following sentence into Latin: “I knew why the queen had been killed.”"
        answer: "<latin>(EGO) SCIĒBAM/SCĪVĪ/NOVERAM CŪR/QUĀRĒ RĒGĪNA   NECĀTA/INTERFECTA/OCCĪSA ESSET</latin>"
  - tossup:
      question: "What man succeeded in arranging the execution of his younger brother Demetrius and thus ensured  his undisputed control of Macedon as the last ruler of the Antigonid dynasty, until his defeat in 168  BC at the battle of Pydna?"
      answer: "PERSEUS"
    boni:
      - question: "What consul defeated Perseus at the battle of Pydna?"
        answer: "(L.) AEMILIUS PAULLUS"
      - question: "Earlier in 189 BC, Aemilius Paullus served as one of the ten commissioners who administered the  treaty of Apamea that ended Rome’s conflict with what Seleucid king?"
        answer: "ANTIOCHUS III"
  - tossup:
      question: "What Latin phrase used nowadays indicates that a person holds a certain position on a committee by  virtue of their position within the larger organization?"
      answer: "<latin>EX OFFICIŌ</latin>"
    boni:
      - question: "What Latin word used nowadays indicates a retired college professor?"
        answer: "<latin>ĒMERITUS/A</latin>"
      - question: "What Latin phrase used nowadays translates as a “slip of the tongue?"
        answer: "” <latin>LĀPSUS LINGUAE</latin>"
  - tossup:
      question: "While crossing Libya, who became so frustrated that he shot an arrow at the Sun?"
      answer: "HERACLES / HERCULES  ("
    boni:
      - question: "Who is “This Guy,” who is also depicted on the upper left wall panel of your visual?"
        answer: "GERYON"
      - question: "Who were the parents of this guy?"
        answer: "CHRYSAOR AND CALLIRHOE"
  - tossup:
      question: "Which of the following does NOT have a reduplicative perfect: <latin>tundō, fallō, pariō, poscō, spargō?</latin>"
      answer: "<latin>SPARGŌ</latin>"
    boni:
      - question: "Which of the following is NOT the same type of number as the others:  <latin>singulī, vīcēnī, centēnī, bīnāriī, dēnī</latin>?"
        answer: "<latin>BĪNĀRIĪ</latin>"
      - question: "Which of the following cannot take an ablative object: <latin>tenus, absque, ergā, prae, cōram?</latin>"
        answer: "<latin>ERGĀ</latin>"
  - tossup:
      question: "Who died at Consentia in 410 AD only months after becoming the first non-Roman leader in eight  hundred years to attack and successfully invade the city of Rome?"
      answer: "ALARIC"
    boni:
      - question: "Of what tribe was Alaric the chieftain?"
        answer: "VISIGOTHS"
      - question: "Two years after the death of Alaric, the Visigoths gave their military assistance to what ruler of the  western empire?"
        answer: "HONORIUS"
