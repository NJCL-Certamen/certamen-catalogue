tournament: "NJCL Certamen"
year: 2015
division: "Novice"
round: "Round 1"
questions:
  - tossup:
      question: "What Theban king, the adopted son of Polybus and Merope, got his name from the piercings in his  feet which he received when he was exposed on Mt. Cithaeron because he was destined to kill his  father and marry his mother?"
      answer: "OEDIPUS"
    boni:
      - question: "When Oedipus returned to Thebes, he earned the kingship by saving the city from a threat that had  already taken the lives of several Thebans. What was this threat?"
        answer: "THE SPHINX"
      - question: "Who was Oedipus’ birth-father, whom he killed on the road to Thebes?"
        answer: "LAIUS"
  - tossup:
      question: "Say in Latin, “The horse is running through the fields.”"
      answer: "<latin>EQUUS PER AGRŌS / CAMPŌS CURRIT</latin>"
    boni:
      - question: "Now say: “The slaves are angrily shouting at the horse.”"
        answer: "<latin>SERVĪ EQUUM ĪRĀTĒ / CUM ĪRĀ / ĪRĀTĪ (ask for clarification) CLĀMANT</latin>"
      - question: "Finally, say: “The horse does not hear the slaves.”"
        answer: "<latin>EQUUS SERVŌS NŌN AUDIT</latin>"
  - tossup:
      question: "Differentiate in meaning between the nouns <latin>mare</latin> and <latin>marītus</latin>."
      answer: "<latin>MARE</latin> – SEA; <latin>MARĪTUS</latin> – HUSBAND, SPOUSE"
    boni:
      - question: "Differentiate in meaning between the nouns <latin>proelium</latin> and <latin>praemium</latin>."
        answer: "<latin>PROELIUM</latin> – BATTLE; <latin>PRAEMIUM</latin> - REWARD"
      - question: "Differentiate in meaning between the nouns <latin>cēna</latin> and <latin>cēra</latin>."
        answer: "<latin>CĒNA</latin> – MEAL, DINNER; <latin>CĒRA</latin> – WAX; WAX TABLET"
  - tossup:
      question: "How many of the Roman kings, either by marriage or by blood, were members of Etruscan families?"
      answer: "THREE (TARQUINIUS PRISCUS, SERVIUS TULLIUS, TARQUINIUS SUPERBUS)"
    boni:
      - question: "How many of the seven Roman kings were members of Sabine families?"
        answer: "TWO (ANCUS MARCIUS & NUMA POMPILIUS)"
      - question: "How many of the Roman kings were descendants of earlier kings?"
        answer: "TWO"
  - tossup:
      question: "Give the Latin accusative singular for the phrase “good beginning.”"
      answer: "<latin>INITIUM / INCEPTUM / COEPTUM BONUM; ORĪGINEM BONAM</latin>"
    boni:
      - question: "Give the same form for the phrase “immortal body.”"
        answer: "<latin>CORPUS IMMORTĀLE</latin>"
      - question: "Give the same form for the phrase “dangerous wife.”"
        answer: "<latin>CONIUGEM</latin> / <latin>UXŌREM / FĒMINAM PERĪCULŌSAM</latin>"
  - tossup:
      question: "Who in the <title>Aeneid</title> offers the nymph Deiopeia as an incentive to entice the wind god Aeolus to send a  storm to destroy Aeneas’ fleet?"
      answer: "JUNO"
    boni:
      - question: "What god reproaches the winds and stops the storm before the whole fleet can be destroyed?"
        answer: "NEPTUNE"
      - question: "Where does Aeneas’ fleet land after the storm?"
        answer: "AFRICA / CARTHAGE"
  - tossup:
      question: "<latin>Respondē Latīnē: Quam partem corporis ego dēscrībō?</latin>"
      answer: "<latin>Est hominibus ūnum et hoc in umerīs  sedet. CAPUT / COLLUM / CERVIX / CERVICEM</latin>"
    boni:
      - question: "<latin>Respondē Latīnē: Quam partem corporis ego dēscrībō?</latin>"
        answer: "<latin>Sunt hominibus duo et hīs hominēs  multa vident. OCULĪ / OCULŌS</latin>"
      - question: "<latin>Respondē Latīnē: Quam partem corporis ego dēscrībō?</latin>"
        answer: "<latin>Sunt hominibus multī in ōre et hī in  colōre sunt candidī. DENTĒS</latin>"
  - tossup:
      question: "Give the two-word Latin phrase used in English to mean “the existing state of affairs.”"
      answer: "<latin>STĀTUS QUŌ</latin>"
    boni:
      - question: "Give the full three-word Latin phrase meaning “for the public good,” a phrase that is usually  shortened when used in modern-day English."
        answer: "<latin>PRŌ BONŌ PUBLICŌ</latin>"
      - question: "Give the common Latin phrase spoken in the movie “Tombstone,” among other places, meaning “in  wine there is truth.”"
        answer: "<latin>IN VĪNŌ VĒRITĀS</latin>"
  - tossup:
      question: "Who disrupted the wedding of Peleus and Thetis and ultimately caused the Trojan War by pitting three goddesses against each other?"
      answer: "ERIS / DISCORD / DISCORDIA"
    boni:
      - question: "What mortal did Zeus appoint as judge for the contest of the golden apple?"
        answer: "PARIS"
      - question: "Among what three goddesses did Paris judge on Zeus’ behalf?"
        answer: "HERA / ATHENA / APHRODITE"
  - tossup:
      question: "A clever certamen player might coin the phrase “the Six Good Emperors” because of what man who  co-ruled the empire until his death in 169 AD with his adoptive brother Marcus Aurelius?"
      answer: "LUCIUS VERUS"
    boni:
      - question: "Lucius Verus was in fact a name that he adopted after his ascension to the throne in 161 AD. His  original <latin>cognōmen</latin> is shared with what man who succeeded Marcus Aurelius as sole ruler of the  empire in 180 AD?"
        answer: "COMMODUS"
      - question: "Who had adopted both Lucius Verus and Marcus Aurelius in 138 AD?"
        answer: "ANTONINUS PIUS"
  - tossup:
      question: "Listen carefully to the following passage, which I will read twice, and answer the question that  follows IN ENGLISH:   <latin>Pater uxōrī fīliōque dīxit, “Audīte! Aliquid audiō. Quid est?” Pater, quī erat fortis vir, ad  iānuam iit. Ante vīllam paucī leōnēs stābant. Pater magnā vōce clāmāvit, “Abīte! Revenīte ad  silvās!” sed leōnēs iānuam rūpērunt et tōtam familiam cōnsūmpsērunt.</latin> (Repeat) Question: Why did the father shout with a large voice?"
      answer: "TO GET THE LIONS TO LEAVE (HIS)  HOUSE ALONE AND GO BACK TO THE WOODS) / THERE WERE LIONS AT HIS HOUSE"
    boni:
      - question: "How many lions were in front of the door?"
        answer: "A FEW"
      - question: "Assuming that the father addressed everyone in the house with his first statement, how many people  do the lions eat in total at the end of the story?"
        answer: "THREE"
  - tossup:
      question: "Give the correct form of the Latin adjective <latin>laetus</latin> to agree with the noun form <latin>frātribus</latin>?"
      answer: "<latin>LAETĪS</latin>"
    boni:
      - question: "Make the phrase <latin>frātribus laetīs</latin> genitive."
        answer: "<latin>FRĀTRUM LAETŌRUM</latin>"
      - question: "Now give the genitive plural of the phrase <latin>cīvis ignāvus</latin>."
        answer: "<latin>CĪVIUM IGNĀVŌRUM</latin>"
  - tossup:
      question: "In what province of Rome could the ancient cities of Aquae Sextiae, Lugdunum, and Lutetia be found?"
      answer: "GAUL / <latin>GALLIA</latin>  ("
    boni:
      - question: "You are looking at a map of the Roman Empire during the age of Trajan. Which letter on the map  most closely corresponds to the city rebuilt by Trajan’s successor with the name Aelia Capitolina?"
        answer: "B (JERUSALEM)"
      - question: "Which letter on the map most closely corresponds to a city known to the Romans as Manucium?"
        answer: "A (MANCHESTER)"
  - tossup:
      question: "Translate the following sentence into English: <latin>Mīles iubet mē fortiter pugnāre</latin>."
      answer: "THE SOLDIER ORDERS / IS ORDERING ME TO FIGHT BRAVELY / STRONGLY"
    boni:
      - question: "Now translate this sentence: <latin>Ambulābō ad silvam quod nōlō pugnāre.</latin>"
        answer: "I WILL WALK TO THE FOREST BECAUSE I DO NOT WANT / AM UNWILLING TO FIGHT"
      - question: "Finally, translate this sentence: <latin>In silvā, multa pulchra vīdī.</latin>"
        answer: "IN THE FOREST, I SAW MANY BEAUTIFUL THINGS"
  - tossup:
      question: "What son of Gaia was the primordial Greek sky deity, fathered the Hekatoncheires, Cyclopes, and  Titans on his mother, and was the original ruler of the immortals until he was castrated by his son  Cronus?"
      answer: "OURANOS / URANUS"
    boni:
      - question: "Which Greek goddess is sometimes said to be the child of Zeus and Dione, but is also said to have  been spawned as a direct result of Uranus’ castration."
        answer: "APHRODITE"
      - question: "Name a group of immortals who are also said to have been born from the blood of Uranus."
        answer: "FURIES / ERINYES / EUMENIDES / SEMNAI THEAI  MELIAE / ASH NYMPHS,  GIANTS / GIGANTES"
  - tossup:
      question: "What pair of English antonyms, one derived from the Latin word meaning “to owe” and the other from  the Latin word meaning “to believe” are used to head the opposite sides of an account ledger?"
      answer: "DEBIT & CREDIT"
    boni:
      - question: "Another word derived from the Latin word “to owe” can be an English verb meaning “to make an  effort” or “strive” and can also be a noun meaning “a strenuous effort or attempt.” What is that  word?"
        answer: "ENDEAVO(U)R"
      - question: "Another word derived from the Latin word “to believe” means “a system of beliefs or a statement of  that belief.” What is that word?"
        answer: "CREED / CREDO"
  - tossup:
      question: "Whose law, drafted primarily by Appius Claudius Pulcher and the jurists Crassus and Scaevola, was an  agrarian bill introduced directly to the <latin>concilium plēbis</latin> during his tribune year of 133 BC?"
      answer: "TIBERIUS GRACCHUS"
    boni:
      - question: "What fellow tribune attempted to block the bill’s passage in the <latin>concilium plēbis</latin>?"
        answer: "(M.) OCTAVIUS"
      - question: "The <latin>lēx Rubria</latin>, which authorized a Roman colony on the ruins of Carthage, was passed by what  tribune in 122 BC, the year of his second and last tribunate?"
        answer: "GAIUS (SEMPRONIUS) GRACCHUS"
  - tossup:
      question: "Give the case and use of that case that would be used for Marcus if the following English sentence were translated into Latin. “Show Marcus the picture.”"
      answer: "DATIVE, INDIRECT OBJECT"
    boni:
      - question: "Give the Latin case and use of Marcus in the following English sentence. “The boy is named  Marcus.”"
        answer: "NOMINATIVE, PREDICATE (NOUN)"
      - question: "Give the Latin case and use of Marcus in the following English sentence. “I will not play with  Marcus.”"
        answer: "ABLATIVE, ACCOMPANIMENT"
  - tossup:
      question: "Who recounted the story of his travels, including his battle with the Cicones, his encounter with huge  cannibalistic giants, and his voyage to the Underworld to a group of hospitable Phaeacians?"
      answer: "ODYSSEUS / ULYSSES"
    boni:
      - question: "What group of cannibalistic giants ate several of Odysseus’ crew and destroyed all but one of his  ships?"
        answer: "THE LAESTRYGONIANS"
      - question: "Whose advice was Odysseus seeking in the Underworld?"
        answer: "TEIRESIAS’"
  - tossup:
      question: "What kind of authority was described by the Latin term <latin>patria potestās</latin>?"
      answer: "THE AUTHORITY OF A FATHER / <latin>PATERFAMILIĀS</latin> OVER HIS FAMILY / DESCENDANTS"
    boni:
      - question: "The Latin noun <latin>manus</latin> was used to describe the <latin>paterfamiliās’</latin> authority over whom?"
        answer: "HIS WIFE"
      - question: "Which of the following persons would not be automatically included within a father’s <latin>patria  potestās</latin>, according to Roman law: his son, his son’s wife in a <latin>cum manū</latin> marriage, his unmarried  daughter, or his daughter’s children?"
        answer: "DAUGHTER’S CHILDREN"
