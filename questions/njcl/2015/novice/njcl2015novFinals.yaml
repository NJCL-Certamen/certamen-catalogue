tournament: "NJCL Certamen"
year: 2015
division: "Novice"
round: "Finals"
questions:
  - tossup:
      question: "What Roman general, whose first triumph for the defeat of Papirius Carbo was grudgingly allowed by Sulla in 81 BC, triumphed a second time immediately before taking the consulship of 70 BC  and a third time in 62 BC for his defeat of Mediterranean pirates, his victory over Mithridates,  and his sweeping political arrangements in the eastern provinces?"
      answer: "(CN.) POMPEIUS (MAGNUS)"
    boni:
      - question: "Sulla also triumphed in 81 BC for his success in what war?"
        answer: "FIRST MITHRIDATIC WAR"
      - question: "Pompey used his own extremely brief and largely unasked-for assistance in defeating what rebel as a pretext for his second triumph in 71 BC?"
        answer: "SPARTACUS"
  - tossup:
      question: "Listen carefully to the following passage, which I will read twice, and answer the question that follows IN LATIN:  <latin>In bellō magister discipulōs hostibus trādere volēbat. Ubi in castra Rōmānōrum ad  imperātōrem puerōs dūxit et illī eōs trādidit, imperātor autem puerōs capere nōlēbat.  Deinde magistrum, manibus ligātīs, dedit discipulīs quōs rūrsus ad urbem mīsit.</latin> (repeat)  The question: <latin>Cui magister puerōs trādidit?</latin>"
      answer: "<latin>IMPERĀTŌRĪ (TRĀDIDIT PUERŌS)</latin>"
    boni:
      - question: "<latin>Ubi magister discipulōs obtulit, quod erat imperatoris responsum?</latin>"
        answer: "<latin>PUERŌS CAPERE NŌLĒBAT</latin>"
      - question: "<latin>Quō modō magister ad urbem cum discipulīs missus est?</latin>"
        answer: "<latin>MANŪS LĪGATAE SUNT /  MANIBUS LIGATĪS / IN MANŪ / IN MANIBUS / IN POSTESTĀTE DISCIPULŌRUM /  SUB MANŪ …</latin>"
  - tossup:
      question: "Which two of the following five words are derived from the same Latin root:  secular, salute, insulting, assail, saline?"
      answer: "INSULTING & ASSAIL"
    boni:
      - question: "Which two of the following six words are derived from the same Latin root:  accountant, pit, disappoint, pillow, computer, pure?"
        answer: "ACCOUNTANT & COMPUTER"
      - question: "The following list of seven words has three pairs of words that are share a Latin verb root; give the  word that does NOT share a verb root with any of the others:   decay, opponent, proposition, infraction, influx, occasion, fragile?"
        answer: "INFLUX"
  - tossup:
      question: "SAY: “PLEASE DO NOT OPEN YOUR VISUAL UNTIL YOU ARE TOLD TO DO SO!” SAY: “OPEN YOUR VISUAL AND EXAMINE IT FOR 10 SECONDS”  (WAIT 10 SECONDS)  Give the Greek name of the mythological figure corresponding to the letter E."
      answer: "NYX"
    boni:
      - question: "Give the letter and name of “This Guy.”"
        answer: "B, TYPHON"
      - question: "Identify the figure corresponding to the letter D, whose name meant doom."
        answer: "MOROS"
  - tossup:
      question: "For the Latin verb <latin>tollō,</latin> give the future active participle."
      answer: "<latin>SUBLĀTŪRUS</latin>"
    boni:
      - question: "Give the same form of <latin>lavō.</latin>"
        answer: "<latin>LAVĀTŪRUS / LAUTŪRUS / LŌTŪRUS</latin>"
      - question: "For the Latin verb <latin>rīdeō</latin>, give all its active participles."
        answer: "<latin>RĪDĒNS, RISŪRUS (-A, -UM)</latin>"
  - tossup:
      question: "In the <latin>vīcī</latin> or precincts, where were the gods known as the <latin>Larēs Compitalēs</latin> worshipped?"
      answer: "CROSSROADS"
    boni:
      - question: "Which goddess’s worship was imported to Rome from the nearby town of Falerii?"
        answer: "MINERVA"
      - question: "Whose <latin>genius</latin> was worshipped in the cave of the <latin>sēvirī Augustālēs</latin>?"
        answer: "THE EMPEROR’S"
  - tossup:
      question: "As a direct result of the murder of Iphitus after a confrontation, Heracles was compelled to serve  what queen of Lydia for the period of one year?"
      answer: "OMPHALE"
    boni:
      - question: "About what had Iphitus come to confront Herakles?"
        answer: "STOLEN HORSES (MARES) / CATTLE"
      - question: "Shortly before his death, whom had Iphitus befriended and given as a gift his father Eurytus’ bow?"
        answer: "ODYSSEUS"
  - tossup:
      question: "Translate the following sentence into Latin: <latin>Vīnum dulce in pōculum ā nautīs scelestīs pōnī  poterit.</latin>"
      answer: "THE SWEET WINE WILL BE ABLE TO BE PLACED INTO THE CUP BY THE  SAILORS"
    boni:
      - question: "Now translate: <latin>Ā quibus vīnum nautārum ablātum erat?</latin>"
        answer: "BY WHOM HAD THE WINE OF THE SAILORS BEEN STOLEN"
      - question: "Translate: <latin>Erit multum perīculum nautīs petentibus pōculum iterum.</latin>"
        answer: "THERE WILL BE MUCH DANGER FOR THE SAILORS SEEKING THE CUP AGAIN"
  - tossup:
      question: "What Roman general, born in Illyricum circa 270 AD, committed suicide at Tarsus in 313 AD following his defeat at Adrianople at the hands of Licinius, eight years after his uncle Galerius  raised him to the position of Caesar in the East?"
      answer: "MAXIMINUS DAIA"
    boni:
      - question: "Whom did Galerius elevate to the position of Augustus in the West in 306 AD?"
        answer: "(FLAVIUS VALERIUS) SEVERUS"
      - question: "Who captured Severus at Ravenna in 307 AD and forced his execution?"
        answer: "MAXIMIAN"
  - tossup:
      question: "You are wandering around Trinity University’s campus when you catch sight of Cicero, magically  transported forward in time. He comes up to you and asks in his native tongue, “<latin>Cūr aqua  calida balneīs dēest?</latin>” What does Cicero want to know?"
      answer: "WHY THE BATH (HOUSES) / SHOWERS DON’T HAVE HOT WATER"
    boni:
      - question: "Cicero then looks at you ruefully and says, “<latin>Nōlī temptāre lūdere in fontibus cum amīcīs!</latin>”  What warning is he giving you?"
        answer: "DON’T TRY TO PLAY IN THE FOUNTAINS WITH  (YOUR) FRIENDS"
      - question: "As you and Cicero proceed along and walks past by Laurie auditorium, Cicero jumps aside and  says: “<latin>In hōc locō, certē omnia sunt maiōra.</latin>“ What observation has Cicero made?"
        answer: "EVERYTHING IS CERTAINLY BIGGER HERE IN TEXAS"
  - tossup:
      question: "Give the Latin word and its English meaning at the root of “cormorant,” “rosemary,” and “maritime.”"
      answer: "<latin>MARE</latin> - SEA"
    boni:
      - question: "Give the Latin word and its English meaning at the root of “damsel” and “dungeon.”"
        answer: "<latin>DOMUS</latin> – HOUSE; HOME"
      - question: "Give the Latin word and its English meaning at the root of “desire” and “reconsider.”"
        answer: "<latin>SĪDUS</latin> - STAR"
  - tossup:
      question: "Who installed Menestheus as king of Athens while Theseus was trapped on the Seat of Forgetfulness after they had invaded Athens to rescue Helen?"
      answer: "CASTOR & POLLUX / THE DIOSCURI"
    boni:
      - question: "In revenge, whom did the Dioscuri kidnap?"
        answer: "AETHRA (THESEUS’ MOTHER)"
      - question: "Aethra was eventually rescued after the fall of Troy by her two grandsons. Name them."
        answer: "DEMOPHON & ACAMAS"
  - tossup:
      question: "Which of the following cities was furthest north? Bilbilis, Cirta, Aquincum, Aquae Sulis, or  Moguntiacum?"
      answer: "AQUAE SULIS"
    boni:
      - question: "Which of the following cities was furthest east? Oea, Augusta Emerita, Augusta Taurinorum,  Carthage, or Tingis?"
        answer: "OEA"
      - question: "Which of the following cities was furthest west? Apamea, Thessalonica, Tigranocerta, Tarsus,  Ecbatana?"
        answer: "THESSALONICA"
  - tossup:
      question: "Say in Latin: “Isn’t there a river across this field?”"
      answer: "<latin>NŌNNE FL̄UMEN / RĪVUS / AMNIS EST TRĀNS HUNC / EUM AGRUM / CAMPUM?</latin>"
    boni:
      - question: "Now, say in Latin: “We were about to go across the river by boat.”"
        answer: "<latin>NĀVE TRĀNSITŪRĪ ERĀMUS FLŪMEN / RĪVUM / AMNEM</latin>"
      - question: "Finally, say in Latin, “You are heard by the soldiers in the boat.”"
        answer: "<latin>AUDĪRIS / AUDĪMINĪ Ā MĪLITIBUS IN NĀVE</latin>"
  - tossup:
      question: "What youth in mythology, the brother of Assaracus and Ilus and son of Tros, was spirited away to  Olympus and given a job among the gods as their cupbearer?"
      answer: "GANYMEDE"
    boni:
      - question: "Ilus, the eldest son of Tros, gave up his claim to his father’s throne in order to rule the newly  founded city of Ilium, which became Troy. Who ruled Ilium after Ilus?"
        answer: "LAOMEDON"
      - question: "Laomedon’s sister Themiste became the mother of Anchises after marrying her cousin, the son of  Assaracus. Name him."
        answer: "CAPYS"
  - tossup:
      question: "Give the principal parts of the only verb that appears in the motto of Wyoming, <latin>cēdant arma togae</latin>?"
      answer: "<latin>CĒDŌ, CĒDERE, CESSĪ, CESSUS (-A, -UM) / CESSŪRUS (-A, -UM)</latin>"
    boni:
      - question: "What are the principal parts of the indicative verb found in the motto of New Mexico?"
        answer: "<latin>CRĒSCŌ, CRĒSCĒRE, CRĒVĪ, CRĒTUM</latin>"
      - question: "What are the principal parts of the indicative verb found in the motto of Alabama?"
        answer: "<latin>AUDEŌ, AUDĒRE, AUSUS SUM</latin>"
  - tossup:
      question: "Which of the following Latin words, if any, does NOT belong because of its part of speech? <latin>vigintī, December, crās, nōnus.</latin>"
      answer: "<latin>CRĀS</latin>"
    boni:
      - question: "Which of the following Latin words, if any, does NOT belong because of its part of speech? <latin>antequam, ōlim, interim, mox</latin>"
        answer: "<latin>ANTEQUAM</latin>"
      - question: "Which of the following Latin words, if any, does NOT belong because of its part of speech? <latin>vigil, vīta, vir, vix.</latin>"
        answer: "<latin>VIX</latin>"
  - tossup:
      question: "Visited by Aeneas during his travels, a “New Troy” in northwestern Greece had been built by what  Trojan prince and seer?"
      answer: "HELENUS"
    boni:
      - question: "What former sister-in-law did Helenus marry and make his queen?"
        answer: "ANDROMACHE"
      - question: "To whom had both Helenus and Andromache been assigned as slaves after the fall of Troy?"
        answer: "PYRRHUS / NEOPTOLEMUS"
  - tossup:
      question: "What Roman politician strongly opposed the passage of the <latin>lēx Ogulnia</latin> in 300 BC, twelve years after he embraced the <latin>lēx Ovīnia</latin> that let him actively make use of <latin>lectiō senātūs</latin> in his famed  role as censor?"
      answer: "(APPIUS) CLAUDIUS CAECUS"
    boni:
      - question: "The <latin>lēx Ogulnia</latin> guaranteed plebeian membership for what office?"
        answer: "PRIESTS / AUGURS / PONTIFFS"
      - question: "Who held the power of <latin>lectiō senātūs</latin> before the <latin>lex Ovīnia</latin> transferred it to the censors?"
        answer: "CONSULS"
  - tossup:
      question: "What would be the Latin case and use of “foot” if the following sentence were put into Latin?"
      answer: "“That   wall is one foot higher than this wall.” ABLATIVE, DEGREE OF DIFFERENCE"
    boni:
      - question: "If the English sentence “I built a fifty mile long wall” were put into Latin, the English adjective  “long” would become a noun in Latin. What would be the case and use of that noun?"
        answer: "ABLATIVE, SPECIFICATION / RESPECT"
      - question: "In that same sentence, “I built a fifty mile long wall,” what case and use would be used for  “mile”?"
        answer: "GENITIVE, MEASURE"
