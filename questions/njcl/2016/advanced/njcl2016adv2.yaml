tournament: "NJCL Certamen"
year: 2016
division: "Advanced"
round: "Round 2"
questions:
  - tossup:
      question: "Who had her tongue shot out by Diana after criticizing the goddess’s appearance, and bore twins to  Apollo, who waited until nightfall, and Mercury, who could not delay?"
      answer: "CHIONE"
    boni:
      - question: "Who was the father of Chione?"
        answer: "DAEDALION"
      - question: "Name these two sons of Chione."
        answer: "PHILAMMON & AUTOLYCUS"
  - tossup:
      question: "For the verb <latin>hortor,</latin> give the 1st person plural, present subjunctive."
      answer: "<latin>HORTĒMUR</latin>"
    boni:
      - question: "Change <latin>hortēmur</latin> to the imperfect."
        answer: "<latin>HORTĀRĒMUR</latin>"
      - question: "Change <latin>hortārēmur</latin> to the perfect."
        answer: "<latin>HORTĀTĪ (-AE, -A) SĪMUS</latin>"
  - tossup:
      question: "What favorite of Domitian dedicated to the emperor a twelve book work that tells the story of the sibling rivalry between Eteocles and Polynices which tore apart the city of Thebes."
      answer: "(PUBLIUS PAPINIUS) STATIUS"
    boni:
      - question: "What famous Greek is the subject of Statius’ other epic poem, now mostly lost?"
        answer: "ACHILLES"
      - question: "In what year did Statius die?"
        answer: "96 AD"
  - tossup:
      question: "What king of Rome is credited with conquests of Politorium, Tellenae, and Ficana, but is better  known for claiming the salt-pits near the mouth of the Tiber?"
      answer: "ANCUS MARCIUS"
    boni:
      - question: "What priesthood did he establish that performed duties pertaining to foreign affairs and declarations  of war?"
        answer: "<latin>FĒTIĀLĒS</latin>"
      - question: "What hill did Ancus Marcius incorporate with the building of the <latin>Pōns Sublicius</latin>?"
        answer: "JANIULULUM"
  - tossup:
      question: "What product of bathroom use may be defined by the <title><latin>Lexicon Recentis Latīnitātis</latin></title> as <latin>capitilāvium</latin>?"
      answer: "” SHAMPOO"
    boni:
      - question: "What specific Italian food may be defined by the <title><latin>Lexicon Recentis Latīnitātis</latin></title> as “<latin>pasta rmiculāta</latin>”?"
        answer: "SPAGHETTO/SPAGHETTI"
      - question: "What game of chance may be defined by the <title><latin>Lexicon Recentis Latīnitātis</latin></title> as “<latin>rōtula lūdicra</latin>”?"
        answer: "A ROULETTE WHEEL"
  - tossup:
      question: "Give all the participles for the verb <latin>spernō.</latin>"
      answer: "<latin>SPERNĒNS, SPRĒTUS, SPRĒTŪRUS, SPERNENDUS</latin>"
    boni:
      - question: "Give all the active infinitive for the same verb."
        answer: "<latin>SPERNERE, SPRĒVISSE, SPRĒTŪRUS (-UM) ESSE</latin>"
      - question: "Give all three passive infinitiveS for the same verb."
        answer: "<latin>SPERNĪ, SPRĒTUS (-UM) ESSE, SPRĒTUM ĪRĪ</latin>"
  - tossup:
      question: "Nūcleus, <latin>rūdus, dorsum, statūmen</latin> are all associated with what facet of Roman life?"
      answer: "ROADS ("
    boni:
      - question: "Please match up the four layers of a Roman road depicted in this picture to the terms mentioned in the  toss-up."
        answer: "<latin>A</latin> = <latin>DORSUM; B = NŪCLEUS; C = STATŪMEN; D = RŪDUS</latin>"
      - question: "What was the Latin term for <latin>“E”,</latin> which are curbstones that bound the <latin>agger</latin> on each side of a road?"
        answer: "<latin>UMBŌNĒS</latin>"
  - tossup:
      question: "What hero drown Dionysus in the Lernean lake, killed Athis with a flaming branch from the  marriage altar, slew Phineus by petrification, and beheaded the Gorgon Medusa?"
      answer: "PERSEUS"
    boni:
      - question: "How did Perseus accidentally kill his father?"
        answer: "HIT HIM WITH A <emphasis>DISCUS</emphasis> IN THE <emphasis>FOOT</emphasis>"
      - question: "What king of Larissa held the funeral games at which Perseus killed Acrisius?"
        answer: "TEUTAMIDES"
  - tossup:
      question: "What Latin idiom means “to deliver a speech”?"
      answer: "<latin>ŌRĀTIŌNEM HABĒRE</latin>"
    boni:
      - question: "What Latin idiom means “to pitch camp”?"
        answer: "<latin>CASTRA PŌNERE</latin>"
      - question: "What Latin idiom means “to retreat”?"
        answer: "<latin>SĒ RECIPERE/ SĒ REFERRE</latin>"
  - tossup:
      question: "What Augustan poet, in a poem addressed to a Melpomenus, claims <latin>“exēgī monumentum aere perennius”</latin> in the third book of his <title><latin>Carmina</latin></title>?"
      answer: "HORACE / (Q.) HORATIUS FLACCUS"
    boni:
      - question: "Which of Horace’s works did he publish first?"
        answer: "<title><latin>EPODES/IAMBĪ</latin></title>"
      - question: "Which of Horace’s works displays the poet’s dual purpose of personal invective and aggressive  moralizing?"
        answer: "<title>SATIRES /</title> <title><latin>SERMŌNĒS</latin></title>"
  - tossup:
      question: "Please listen to the following selection from a letter written by Cicero to Atticus, which I will read  twice, and answer the question that follows in English:  <latin>Numquam ante arbitror tē epistulam meam lēgisse nisi meā manū scrīptam. Ex eō colligere  poteris quantā occupātiōne distinear. Nam cum vacuī temporis nihil habērem et cum  recreandae vōculae causā necesse esset mihi ambulāre, haec dictāvī ambulāns.</latin> (repeat) The question: What is Atticus able to learn about Cicero?"
      answer: "HOW BUSY HE IS / BY HOW GREAT OF BUSINESS HE IS DISTRACTED"
    boni:
      - question: "What does Cicero not have?"
        answer: "FREE TIME / STRONG VOICE / GOOD VOICE"
      - question: "Under what circumstance did Cicero dictate his letters to Atticus?"
        answer: "WHILE (HE WAS) WALKING / WHEN HE HAD TO RECOVER HIS POOR VOICE"
  - tossup:
      question: "Who was sent to the east to confirm Artaxes as the king of Armenia in 18 BC?"
      answer: "(IULIUS CAESAR) GERMANICUS / (NERO CLAUDIUS DRUSUS) GERMANICUS"
    boni:
      - question: "What relative of Germanicus had performed a similar diplomatic mission forty years prior?"
        answer: "TIBERIUS"
      - question: "What governor of Syria did Germanicus’ wife, Agrippina the Elder, accuse of poisoning him?"
        answer: "(CN.) CALPURNIUS PISO"
  - tossup:
      question: "The English noun “danger” is derived from what Latin noun?"
      answer: "<latin>DOMUS</latin> (*prompt to “take it back further please” if <latin>dominus</latin> is given)"
    boni:
      - question: "The English verb “disdain” is derived from what Latin adjective?"
        answer: "<latin>DIGNUS</latin>"
      - question: "The English verb “recruit” is derived from what Latin word?"
        answer: "<latin>CRĒSCŌ</latin>"
  - tossup:
      question: "Who exposed that Epipole, daughter of Trachion, had dressed up as a man to sail with the Greek  army, and also threatened Telemachus with his sword to prove that Odysseus was not mad and  could sail to Troy?"
      answer: "PALAMEDES"
    boni:
      - question: "How was Epipole put to death for her deception, the same way Palamedes himself was later killed?"
        answer: "STONING"
      - question: "Which Greek or Roman letter of the alphabet is Palamedes supposed to have come up with after  observing the shape of a flock of cranes in the sky?"
        answer: "Y or UPSILON"
  - tossup:
      question: "Admitting a “haphazard” method of collecting and recording his ideas, which author assembled his diverse knowledge into a single volume “during the long winter nights spent in the land of Attica”?"
      answer: "AULUS GELLIUS"
    boni:
      - question: "Gellius publish his <title><latin>Noctēs Atticae</latin></title> shortly before 170 AD. What orator and tutor to Marcus Aurelius and Lucius Verus, who was considered a “new Cicero” and a significant influence on Gellius’ literary style, died in the year 170?"
        answer: "(MARCUS CORNELIUS) FRONTO"
      - question: "On what continent was Marcus Cornelius Fronto born?"
        answer: "AFRICA"
  - tossup:
      question: "What type of condition sentence can be found in the following: <latin>sī lupōs vīdissent, interfectī essent?</latin>"
      answer: "PAST CONTRARY-TO-FACT"
    boni:
      - question: "Please translate that sentence into English."
        answer: "IF THEY HAD SEEN THE WOLVES, THEY WOULD HAVE BEEN KILLED"
      - question: "Please translate into Latin: If they don’t hear you, they will not be able to respond."
        answer: "<latin>NISI TĒ AUDĪVERINT / AUDIENT, RESPONDĒRE NŌN POTERUNT</latin>"
  - tossup:
      question: "After seizing Apollo’s tripod and trying to set up his own oracle, who did Heracles sell himself to as a  slave for three years to atone for murder?"
      answer: "OMPHALE"
    boni:
      - question: "What centaur and drinking companion of Heracles accidentally died after dropping a poisoned arrow  on his foot?"
        answer: "PHOLUS"
      - question: "What thug, who was invulnerable when in contact with his mother Earth, did Heracles kill by lifting  him off the ground and strangling him?"
        answer: "ANTAEUS"
  - tossup:
      question: "Using a Greek accusative, say in Latin: He loved a Naiad."
      answer: "<latin>NĀIDA AMĀBAT / AMĀVIT</latin>"
    boni:
      - question: "What is the vocative of <latin>Orpheus</latin>?"
        answer: "<latin>ORPHEU</latin>"
      - question: "What is the vocative of <latin>Aenēās</latin>?"
        answer: "<latin>AENĒĀ / AENĒA</latin>"
  - tossup:
      question: "This great-uncle of Pompey the Great, said by Quintilian to have possessed “overflowing wit,” advocated Stoic doctrines of humility and simplicity through his innovative satire published in 131 BC."
      answer: "(C.) LUCILIUS"
    boni:
      - question: "To what famous literary circle did Lucilius belong?"
        answer: "SCIPIO/SCIPIONIC"
      - question: "Though not all of his satires were composed in this meter, what meter did Lucile's establish as the  standard for Latin satire?"
        answer: "DACTYLIC HEXAMETER"
  - tossup:
      question: "What use of the dative case is in the following sentence: <latin>Nec mihi errōrem extorquērī volō</latin>?"
      answer: "SEPARATION"
    boni:
      - question: "<latin>…: Domum novīs nūptiīs vacuēfēcit</latin>?"
        answer: "PURPOSE"
      - question: "<latin>…: Tibi habētō, aufer.</latin>"
        answer: "ETHICAL (* prompt if “reference” is given)"
