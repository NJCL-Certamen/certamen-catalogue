tournament: "NJCL Certamen"
year: 2016
division: "Advanced"
round: "Semifinals"
questions:
  - tossup:
      question: "What son of Theia was a son-in-law of Oceanus through his wife Perse and is famous for driving a  four-horse chariot across the sky as a god of the sun like his father Hyperion?"
      answer: "HELIUS"
    boni:
      - question: "Helius and Perse had three children, and apparently golden eyes and infamous deeds ran in the family.  Name two of these children."
        answer: "SEE BELOW"
      - question: "Now, name the third."
        answer: "AEËTES, CIRCE, PASIPHAË"
  - tossup:
      question: "Translate the following sentence from English to Latin: “The soldier said the battle would happen on  this side of the river.”"
      answer: "<latin>MILES DIXIT PROELIUM CIS FLUMEN/RIVUM FACTUM IRI</latin>"
    boni:
      - question: "Using a participle, translate this sentence into Latin: “Caesar killed the Gauls who were captured.”"
        answer: "<latin>CAPTĪS GALLĪS CAESAR GALLOS NECĀVIT /   CAESAR CAPTŌS GALLŌS NECĀVIT</latin>"
      - question: "Translate this sentence into Latin: “What did the dying women confess?”"
        answer: "<latin>QUID/QUAE (FEMINAE) MORITURAE / MORIENTĒS CONFESSAE/FASSAE SUNT?</latin>"
  - tossup:
      question: "According to gossip, what corrupt Praetorian prefect, a freedman from Phrygia, is said to have sold  twenty-five consulships in a day during Commodus’s reign?"
      answer: "(M. AURELIUS) CLEANDER"
    boni:
      - question: "What Praetorian prefect helped orchestrate the assassination of Commodus?"
        answer: "(Q. AEMILIUS) LAETUS"
      - question: "What Christian mistress of Commodus also participated in his murder?"
        answer: "MARCIA"
  - tossup:
      question: "What use of the genitive case is found in the phrase “<latin>Ubinam nos gentium abscondimus</latin>”?"
      answer: "PARTITIVE"
    boni:
      - question: "What use of the genitive is found in the following phrase from Ovid? <title><latin>“</latin></title><latin>addita sunt illis auri bis  quinque talenta”</latin>?"
        answer: "MATERIAL/QUALITY"
      - question: "<latin>Of the verbs obliviscor, recordor, reminiscor, potior and memini, which does NOT take the  genitive?</latin>"
        answer: "<latin>RECORDOR</latin>"
  - tossup:
      question: "Which play of Plautus employs the usual Plautine characters (a pimp, a courtesan, a young lover, etc)  but cleverly accounts for the setting of the play by utilizing a chorus of fisherman, as the play  takes place on the north African seashore in the aftermath of a shipwreck."
      answer: "<title><latin>RUDĒNS</latin></title>"
    boni:
      - question: "Name one of the two Plautus plays which Cicero later claimed was a favorite of his."
        answer: "<title><latin>PSEUDOLUS/TRUCULENTUS</latin></title>"
      - question: "What other playwright, whom Cicero called <latin>malus auctor Latīnitātis</latin>, was brought to Rome as a  slave from Gaul before being freed and becoming a <latin>contubernālis</latin> of Ennius during part of his  career?"
        answer: "CAECILIUS STATIUS"
  - tossup:
      question: "Translate the following sentence from Latin to English: “<latin>Dignae sunt quae omnes Romanos  regant.</latin>”"
      answer: "THEY ARE WORTHY TO RULE ALL THE ROMANS"
    boni:
      - question: "Translate this sentence from Latin to English: “<latin>Etiamsi me non adiuves, te adiuvem.”</latin>"
        answer: "EVEN IF YOU SHOULD NOT HELP ME, I WOULD HELP YOU"
      - question: "Translate this sentence from Latin to English: “<latin>Singulae domūs consulibus erant.</latin>”"
        answer: "THE CONSULS EACH HAD ONE HOUSE / THE CONSULS HAD ONE HOUSE APIECE"
  - tossup:
      question: "Which king of Delos and old friend of Anchises kindly received Aeneas and his followers after they  discovered the body of Polydorus, and led them to Apollo’s temple where they received the  prophecy to return to the land of their roots?"
      answer: "He was a son of Apollo and famously had three  daughters who could produce oil, grain, and wine from the earth. ANIUS"
    boni:
      - question: "Who was Anius’s wife?"
        answer: "DORIPPE(/A)"
      - question: "What son of Adamastus did Aeneas discover on Sicily, abandoned by the crew of Ulysses?"
        answer: "ACHAEMENIDES"
  - tossup:
      question: "What derivative of the adjective <latin>pār</latin> means “without equal”?"
      answer: "SEE BELOW"
    boni:
      - question: "Give another derivative of <latin>pār</latin> with the same meaning."
        answer: "SEE BELOW"
      - question: "Give another derivative of <latin>pār</latin> with the same meaning."
        answer: "INCOMPARABLE / NONPAREIL / PEERLESS"
  - tossup:
      question: "What emperor was deposed by Ricimer in 472 AD partly due to a failure of a three-pronged attack on  Gaiseric that diminished his already small support in the West?"
      answer: "ANTHEMIUS"
    boni:
      - question: "What eastern emperor had originally appointed Anthemius to rule in the West?"
        answer: "LEO (I)"
      - question: "Name the western emperors that came directly before and after Anthemius."
        answer: "(LIBIUS) SEVERUS & OLYBRIUS"
  - tossup:
      question: "In what series of speeches does Cicero for the first time employ the tactic of personifying the state,  which is then envisioned as addressing the nobleman whom Cicero is accusing of trying to  overthrow the Roman state in 63 BC?"
      answer: "<title><latin>IN CATILĪNAM</latin></title>/<title>CATILINARIANS</title>"
    boni:
      - question: "After Pompey’s defeat, Cicero delivered three so-called “Caesarian speeches,” in 46 and 45 BC, all of  which were in defense of men accused of crimes against Caesar. Name one of these speeches."
        answer: "SEE BELOW"
      - question: "Name another."
        answer: "<title><latin>PRŌ MARCELLŌ/ PRŌ LIGĀRIŌ/ PRŌ RĒGE DĒIOTARŌ</latin></title>"
  - tossup:
      question: "Using a periphrastic construction, say in Latin, “She had been about to go out.”"
      answer: "<latin>EXITŪRA FUERAT</latin>"
    boni:
      - question: "Using a periphrastic construction, say in Latin, “She said that they must know.”"
        answer: "<latin>DIXIT EĪS SCIENDUM ESSE</latin>"
      - question: "Using a periphrastic construction, say in Latin: “she wondered why we had to leave.”"
        answer: "<latin>MIRĀTA EST CUR NOBIS DISCENDUM ESSET / FUISSET</latin>"
  - tossup:
      question: "Which goddess did Zeus have a secret affair with in the days of Cronus’ rule and later became his  third wife, bearing him such children as Eilithyia, Hebe, Hephaestus, and Ares?"
      answer: "HERA"
    boni:
      - question: "Who was Zeus’ second wife, mother of the Horae and the Fates?"
        answer: "THEMIS"
      - question: "Which daughter of Oceanus was Zeus’ first wife?"
        answer: "METIS"
  - tossup:
      question: "What is the modern name for the ancient city Augusta Treverorum?"
      answer: "TRIER"
    boni:
      - question: "What is the modern name for the ancient city Cirta?"
        answer: "CONSTANTINE"
      - question: "What is the modern name for the ancient city Aquincum?"
        answer: "BUDAPEST"
  - tossup:
      question: "What Latin poet begins his <title>magnum opus</title> with the lines “<latin>in nova fert animus mūtātās dīcere  formās/ corpora</latin>”?"
      answer: "(PUBLIUS) OVID(IUS NASO)"
    boni:
      - question: "What Latin poet begins his <title>magnum opus</title> with the lines “<latin>bella per Ēmathiōs plūs quam cīvilia  campōs/ iūsque datum scelerī canimus</latin>”?"
        answer: "(MARCUS ANNAEUS) LUCAN(US)"
      - question: "What Latin poet begins his <title>maximum opus</title> with the line “<latin>ōrdior arma, quibus caelō sē glōria  tollit/ Aeneadum, patiturque ferōx Oenōtria iūra/ Carthāgō.</latin>”?"
        answer: "SILIUS ITALICUS"
  - tossup:
      question: "Please listen to the following sentences, which I will read twice, and answer the question that follows   in English:  <latin>C. Caesar, quod suspectam habēbat Aegyptiōrum fīdem, per speciem sēcūritātis īnspectiōnī  urbis atque operum ac simul licentiōribus convīviīs dēditus, vidērī voluit captum sē grātiā  locōrum: atque inter eam dissimulātiōnem praeparātis subsidiīs occupāvit Aegyptum.</latin>  (repeat)  The question: What did Gaius Caesar want to seem?"
      answer: "ENTRANCED/CAPTURED BY THE BEAUTY/CHARM OF THE PLACE(S)"
    boni:
      - question: "How did he conduct his tour of the city and its works?"
        answer: "PRETENDING UNCONCERN/TO BE CAREFREE (or similar)"
      - question: "What did he also do before capturing Egypt?"
        answer: "HE PREPARED REINFORCEMENTS/AUXILIARIES"
  - tossup:
      question: "Distinguish in meaning between the verbs <latin>pariō</latin> and <latin>pareō</latin>."
      answer: "OBEY / YIELD TO // GIVE BIRTH TO / INVENT / PRODUCE"
    boni:
      - question: "Distinguish in meaning between the adjective <latin>rudis</latin> and the noun <latin>rudis.</latin>"
        answer: "ROUGH / RAW / WILD // SLENDER STICK / WOODEN SWORD"
      - question: "Distinguish in meaning between the verbs <latin>lateō</latin> and <latin>latrō</latin>."
        answer: "LIE HIDDEN / BE UNKOWN TO // BARK / RANT"
  - tossup:
      question: "A native of Palestine, what author displays a fierce concern for the underprivileged and a theology  that attempts to reconcile pagan beliefs with those of Christianity by identifying the Roman gods  as the children of angels and men, beliefs which are uniquely expressed in poetry."
      answer: "COMMODIAN"
    boni:
      - question: "What unusual feature does Commodian’s hexameter poem <title><latin>Īnstructiōnēs</latin></title> display?"
        answer: "ACROSTIC VERSE"
      - question: "What is the subject of Commodian’s <title><latin>Carmen Apologeticum</latin></title>?"
        answer: "HISTORY OF THE WORLD / ISRAEL"
  - tossup:
      question: "What foreign king, after being a hostage in Rome since 189 BC, invaded Egypt and laid siege to  Alexandria?"
      answer: "ANTIOCHUS IV (THEOS EPIPHANES)"
    boni:
      - question: "Who led an embassy to compel Antiochus IV to withdraw from Egypt in 168 BC?"
        answer: "(C.) POPILLIUS LAENAS"
      - question: "What did Laenas do after the Seleucid king began to argue with the Roman envoy?"
        answer: "HE DREW A RING / LINE IN THE SAND AROUND ANTIOCHUS IV"
  - tossup:
      question: "What use of the subjunctive is found in the following sentence?"
      answer: "“<latin>Quo melius familiam servaret,  mercator gladium acquisivit.</latin>” PURPOSE"
    boni:
      - question: "...:<latin>“Antequam nefanda facta, bonus homo videretur.”</latin>"
        answer: "POTENTIAL"
      - question: "….”<latin>Qualis femina sit patefaciendum est.”</latin>"
        answer: "INDIRECT QUESTION"
  - tossup:
      question: "Who wished to marry Pero the daughter of Neleus, but needed to acquire the herds of Phylacus as a  wedding present, the obtaining of which got his brother Melampus thrown in prison?"
      answer: "BIAS"
    boni:
      - question: "Melampus and Bias each acquired a third of the kingdom of Argos by curing the daughters of which  king, who were wandering the country madly thinking they were cows?"
        answer: "PROETUS"
      - question: "How did Melampus get his name, which means “Blackfoot”?"
        answer: "(after his birth) HIS MOTHER LEFT HIM IN THE SHADE WITH HIS FEET IN THE SUN"
