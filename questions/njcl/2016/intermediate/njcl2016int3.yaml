tournament: "NJCL Certamen"
year: 2016
division: "Intermediate"
round: "Round 3"
questions:
  - tossup:
      question: "What two-word Latin phrase, containing the name of a flower, means that something is done in   private?"
      answer: "SUB ROSĀ ("
    boni:
      - question: "Identify by letter the motto of Scotland and give the English meaning of this Latin motto."
        answer: "B – NO ONE PROVOKES WITH IMPUNITY"
      - question: "Give the English meaning of the Latin motto seen in “A”."
        answer: "(SHE IS) TOSSED BUT NOT SUNK"
  - tossup:
      question: "Who tied his men to the bellies of giant sheep so that they could escape from the cave of   Polyphemus?"
      answer: "ODYSSEUS"
    boni:
      - question: "While trapped in the cave, what had Odysseus told the Cyclops was his name?"
        answer: "NOBODY / NO ONE / OUTIS"
      - question: "How did Polyphemus discover Odysseus' real name?"
        answer: "ODYSSEUS SHOUTED IT TO HIM FROM   HIS SHIP"
  - tossup:
      question: "Who was clubbed to death along with 300 of his followers on the Capitol?"
      answer: "TIBERIUS GRACCHUS"
    boni:
      - question: "What ex-consul led the mob that lynched Tiberius Gracchus?"
        answer: "SCIPIO NASICA"
      - question: "Tiberius Gracchus had been the first over the walls of what city, earning him the corōna mūrālis?"
        answer: "CARTHAGE"
  - tossup:
      question: "Please translate into English: Māter dīxit coquum cēnam parāvisse."
      answer: "MOTHER SAID THAT THE COOK HAD PREPARED THE DINNER"
    boni:
      - question: "…: Servus spērābat dominum sē laudātūrum esse."
        answer: "THE SLAVE WAS HOPING THAT THE MASTER WOULD PRAISE HIM"
      - question: "…: Fīliī vīdērunt gladiātōrem fortiter in amphitheātrō pugnāre."
        answer: "THE SONS SAW THAT THE GLADIATOR FOUGHT BRAVELY IN THE AMPHITHEATER"
  - tossup:
      question: "For the verb pellō, give the 2nd person singular, perfect, passive, indicative."
      answer: "PULSUS (-A, -UM) ES"
    boni:
      - question: "Change pulsus es to the active voice."
        answer: "PEPULISTĪ"
      - question: "Change pepulistī to the subjunctive."
        answer: "PEPULERĪS"
  - tossup:
      question: "At what battle were the Romans defeated and had their commander Regulus captured in 256 BC?"
      answer: "BAGRADAS VALLEY"
    boni:
      - question: "Who was the Spartan mercenary that captured Regulus on behalf of the Carthaginians?"
        answer: "XANTHIPUS"
      - question: "Where had Regulus won a battle earlier in 256 BC, in which he landed his fleet on the coast of   Africa?"
        answer: "CAPE ECNOMUS"
  - tossup:
      question: "Quid significat Anglicē “ōtium”?"
      answer: "LEISURE / PEACE / QUIET"
    boni:
      - question: "Quid significat Anglicē “āter”?"
        answer: "BLACK / DARK"
      - question: "Quid significat Anglicē “unde”?"
        answer: "WHENCE / FROM WHERE"
  - tossup:
      question: "After he consulted the Delphic Oracle about his chances of having a son, who was told not to loosen   the wine stopper until he returned home to Athens?"
      answer: "AEGEUS"
    boni:
      - question: "Who understand this message and sent his daughter into the bedroom of the intoxicated Aegeus?"
        answer: "PITTHEUS"
      - question: "Who was the daughter of Pittheus who was sent to lie with Aegeus?"
        answer: "AETHRA"
  - tossup:
      question: "What activity, often enjoyed by the rich and famous, may be defined by the Lexicon Rēcentis   Latīnitātis\" as vēnātiō Āfricāna?"
      answer: "SAFARI"
    boni:
      - question: "What fun activity may be defined by the Lexicon Rēcentis Latīnitātis\" as pilamālleus minūtus?"
        answer: "MINIATURE GOLF"
      - question: "What item of clothing may be defined by the Lexicon Rēcentis Latīnitātis\" as braccae līnteae   caerūleae?"
        answer: "BLUE JEANS"
  - tossup:
      question: "Pokemon Go fever has taken over the world. Using the Latin noun pokēmō, pokēmōnis, masculine,   say in Latin: I want to catch twenty blue pokemons."
      answer: "VOLŌ CAPERE / CAPTĀRE VIGINTĪ CAERULEŌS / VENĒTŌS POKĒMŌNĒS"
    boni:
      - question: "…: It is difficult to capture many pokemons."
        answer: "DIFFICILE EST CAPERE / CAPTĀRE MULTŌS   POKĒMŌNĒS"
      - question: "Using a gerund, say in Latin: He has a love of capturing pokemons."
        answer: "AMŌREM CAPIENDĪ / CAPTANDĪ POKĒMŌNĒS HABET"
  - tossup:
      question: "Who in Book 3 of the Iliad proposed single-combat, the stakes of which would be Helen and the   treasure taken from Sparta, in which he would fight Menelaüs?"
      answer: "PARIS"
    boni:
      - question: "Which fighter died in this single-combat?"
        answer: "NEITHER"
      - question: "Who rescued Paris from certain death at the hands of Menelaüs and delivered him to Helen's bed?"
        answer: "APHRODITE (NOT VENUS BECAUSE ILIAD)"
  - tossup:
      question: "Who, after he offered each member of the Praetorian Guard 20,000 sestserces, failed to win the   auction for the imperial throne in 193 AD?"
      answer: "SULPICIANUS"
    boni:
      - question: "Name the short-lived emperor and his winning bid."
        answer: "DIDIUS JULIANUS – 25,000 SESTERCES PER PRAETORIAN GUARD"
      - question: "Where did the Roman people stage a revolt in response to Didius Julianus’ rise to power?"
        answer: "CIRCUS MAXIMUS"
  - tossup:
      question: "Using a deponent verb, say in Latin: “I will speak.”"
      answer: "FĀBOR / LOQUAR"
    boni:
      - question: "Using a deponent verb, say in Latin: “She has obtained.”"
        answer: "NA(N)CTA / ADEPTA EST"
      - question: "Using a deponent verb, say in Latin: “The rooster about to die”"
        answer: "GALLUS MORITŪRUS"
  - tossup:
      question: "What is the Latin term that categorizes clothing which is wrapped around as opposed to put on the   body?"
      answer: "AMICTUS"
    boni:
      - question: "What garment was a dinner dress worn by the ultrafashionable?"
        answer: "SYNTHESIS / VESTIS CĒNĀTŌRIA"
      - question: "What type of garment was an abolla?"
        answer: "HEAVY WOOLEN CLOAK (TYPICALLY WORN BY THE POOR)"
  - tossup:
      question: "Please listen carefully to the following sentences about the Athenian Cimon, which I will read twice,   and answer the question that follows in Latin:    Athēniēnsis Cīmōn erat benignus vir. Cum in complūribus locīs vīllās hortōsque habēret, in   eīs locīs tamen custōdēs ad frūctūs servandōs numquam pōnēbat ut līberī frūctūs carpere et   edere possent. (repeat)   The question: Ubi Cīmōn vīllās et hortōs habēbat?"
      answer: "IN COMPLŪRIBUS / MULTĪS LOCĪS"
    boni:
      - question: "Quō cōnsiliō custōdēs ab omnibus praeter Cīmōnem in hortīs positī sunt?"
        answer: "AD FRŪCTŪS SERVANDŌS / UT FRŪCTŪS SERVĀRENT / FRŪCTUUM   SERVANDŌRUM CAUSĀ/GRĀTIĀ"
      - question: "Cūr Cīmōn custōdēs in hortīs nōn pōnēbat?"
        answer: "UT LĪBERĪ FRŪCTŪS CARPERE / EDERE POSSENT"
  - tossup:
      question: "How did Cadmus' slaying of a dragon help him to populate the newly founded city of Cadmeia?"
      answer: "HE SOWED / PLANTED THE DRAGON'S TEETH AND MEN GREW //   THE DRAGON WAS GUARDING A SPRING & PEOPLE CAN'T LIVE WITHOUT WATER"
    boni:
      - question: "What Greek term was used for the five “sown men” who survived the initial scrum and helped   Cadmus to populate Cadmeia?"
        answer: "SPARTOI"
      - question: "Which of the Spartoi fathered a son with Cadmus' daughter Agave?"
        answer: "ECHION"
  - tossup:
      question: "When the Romans tried to build a new city on the site of Jerusalem and a Temple of Jupiter in the   city, who led a revolt against the Romans in Judaea in the 2nd century AD?"
      answer: "SIMON BAR KOKHBA / KOCHBA / COSIBA"
    boni:
      - question: "Who was the Roman general who crushed Simon Bar Kokhba’s rebellion and subdued Judaea?"
        answer: "(SEXTUS) JULIUS SEVERUS"
      - question: "What was the name of the new province that Hadrian established after Simon Bar Kokhba was   defeated, which was comprised of Judea and the surrounding areas?"
        answer: "SYRIA PALESTĪNA"
  - tossup:
      question: "What use of the dative case can be found in the following sentence: Imperātor multīs mīlitibus   praeest?"
      answer: "WITH COMPOUND VERB / WITH SPECIAL VERB (PRAESUM)"
    boni:
      - question: "…: Ille candidātus est simillimus sīmiae."
        answer: "WITH SPECIAL ADJECTIVE (SIMILIS)"
      - question: "…: Dīxit multās segetēs agricolae futūrās esse."
        answer: "POSSESSION"
  - tossup:
      question: "What derivative of the verb fluō means “redundant, too much”?"
      answer: "SUPERFLUOUS"
    boni:
      - question: "What derivative of the verb fluō means “abundance of material goods”?"
        answer: "AFFLUENT"
      - question: "What derivative of the verb flō means “the quality of taste of a thing”?"
        answer: "FLAVOR"
  - tossup:
      question: "While sailing to Crete, who defended Eëriboea from the advances of Minos and then got into a   dispute with him in which both men proved their divine parentage?"
      answer: "THESEUS"
    boni:
      - question: "What son of Minos had been killed on the mainland which led him to demand Athenian youths to be   fed to the Minotaur?"
        answer: "ANDROGEUS"
      - question: "What Cretan princess helped Theseus to kill the Minotaur and escape the Labyrinth?"
        answer: "ARIADNE"
