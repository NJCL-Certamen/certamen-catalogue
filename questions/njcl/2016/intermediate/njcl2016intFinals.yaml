tournament: "NJCL Certamen"
year: 2016
division: "Intermediate"
round: "Finals"
questions:
  - tossup:
      question: "Whom did Alcmeon send to Delphi as spoil from his sack of Thebes after fathering Amphilochus and  Tisiphone with her and after her father Teiresias died during the flight from Thebes?"
      answer: "MANTO"
    boni:
      - question: "At what spring did Teiresias die of shock?"
        answer: "TELPHUSA"
      - question: "What Cretan or Mycenean was the father of Manto's prophetic son Mopsus?"
        answer: "RHACIUS"
  - tossup:
      question: "What king of Rome is credited with using timocratic principles in his reorganization of the Roman people, as well as establishing a temple to Diana and building a wall?"
      answer: "SERVIUS TULLIUS"
    boni:
      - question: "According to the Roman emperor and historian Claudius, Servius Tullius was actually an Etruscan with  what name?"
        answer: "MASTARNA"
      - question: "Into how many centuries were the Roman people divided in the time of Servius Tullius?"
        answer: "193"
  - tossup:
      question: "Distinguish in meaning between the adjective <latin>citus</latin> and the adverb <latin>citrā</latin>."
      answer: "QUICK / SWIFT //  ON THIS SIDE OF / BELOW / INFERIOR TO"
    boni:
      - question: "Distinguish in meaning between <latin>cōnstituere</latin> and <latin>cōnsistere</latin>."
        answer: "PLACE / ESTABLISH / FORM /  DETERMINE //STAND / STAY / HALT"
      - question: "Distinguish in meaning between <latin>fugere</latin> and <latin>fugāre</latin>."
        answer: "FLEE // PUT TO FLIGHT"
  - tossup:
      question: "According to some accounts, who were destined to die if they could not complete any chase and thus  met their end when they failed to catch the Harpies, whom they were pursuing to protect Phineus  of Salmydessus?"
      answer: "ZETES AND CALAÏS / THE BOREADES"
    boni:
      - question: "In this version of the story, what happened to the Harpies?"
        answer: "DIED OF EXHAUSTION (FROM THE CHASE)"
      - question: "Into what Peloponnesian river did one of the dead Harpies fall?"
        answer: "TIGRES / HARPYS"
  - tossup:
      question: "Translate the following sentence from Latin to English: “<latin>Imperātor poētās optāvit quī imperium  celebrārent.”</latin>"
      answer: "THE EMPEROR CHOSE POETS  TO (WHO MIGHT) CELEBRATE HIS RULE (THE EMPIRE)"
    boni:
      - question: "Translate the following sentence from Latin to English: “<latin>Brūtus nōn erat quī amīcum leviter  necāret.”</latin>"
        answer: "BRUTUS WAS NOT ONE/SOMEONE TO (WHO WOULD)  LIGHTLY/THOUGHTLESSLY KILL HIS FRIEND"
      - question: "Translate the following sentence from Latin to English: “<latin>Puella puerum, quem soror amāret, sē amāre negāvit.”</latin>"
        answer: "THE GIRL DENIED THAT SHE LOVED THE BOY,  WHOM HER SISTER LOVED"
  - tossup:
      question: "(WHEN ALL OF THE VISUALS HAVE BEEN PASSED OUT SAY...)  Now open your visuals  (WAIT UNTIL ALL VISUALS HAVE BEEN OPENED)  Please explain how the items labeled A and the item labeled C were used together."
      answer: "A WAS PUT INTO C (SHAKEN UP AND) THROWN  ONTO A TABLE // FOR THE PURPOSE OF GAMBLING"
    boni:
      - question: "What is the Latin term for the item labeled C?"
        answer: "FRITILLUS"
      - question: "When using four dice in the picture labeled “A”, what numbers did you have to get to achieve the highest  throw, Venus?"
        answer: "1, 3, 4, 6"
  - tossup:
      question: "What use of the ablative is found in this sentence?"
      answer: "“<latin>Magnā stirpe ortus est.</latin>” ORIGIN/SOURCE"
    boni:
      - question: "What use of the ablative is found in the following sentence?"
        answer: "“<latin>Cum mīlitēs vīnō sē explēvissent, in  hostem cucurrērunt.”</latin> MEANS/INSTRUMENT / WITH VERBS OF FILLING AND  EMPTYING"
      - question: "What use of the genitive is found in this sentence?"
        answer: "“<latin>Mox patricīdae absolvētur.”</latin> CRIME/CHARGE"
  - tossup:
      question: "Give the genitive form of the phrase “three ugly pigs.”"
      answer: "<latin>TRIUM TURPIUM PORCŌRUM</latin>"
    boni:
      - question: "Give the dative of the phrase “two hundred very pretty flowers.”"
        answer: "<latin>DUCENTĪS PULCHERRIMĪS FLŌRIBUS</latin>"
      - question: "Give the accusative of the phrase “fifty golden crowns.”"
        answer: "<latin>QUĪNQUĀGINTĀ CORŌNĀS AUREĀS</latin>"
  - tossup:
      question: "Listen carefully to the following passage about the Certamen player Publia, which I will read twice.  Then answer, in LATIN, the question that follows:  <latin>Pūblia tam vehementer linguae Latīnae studēbat ut linguae Anglicae oblīvīscerētur. Pūblia  dīxit, “Optimē! Nunc Certāminibus totiēns superābō ut taedeat mē vincere.” Sed ūnō diē in  mediō certāmine, moderātor rogāvit, “Quid Anglicē significat ‘omnīnō’?” Publia stupefacta  est maestissimaque exclāmāvit “Ēheu!!”</latin>  Question: <latin>Cūr Pūblia linguae Anglicae oblīta est?</latin>"
      answer: "<latin>(TAM) VEHEMENTER (LINGUAE) LATĪNAE STUDĒBAT</latin>"
    boni:
      - question: "<latin>Prō sententiā Pūbliae, quid fiet propter suum studium?</latin>"
        answer: "<latin>VINCET / SUPERĀBIT / TAEDĒBIT EAM VINCERE</latin>"
      - question: "<latin>Respondē Anglicē rēctē quaestiōnī cuī Pūblia respondēre nōn potuit.</latin>"
        answer: "ALTOGETHER/ENTIRELY"
  - tossup:
      question: "According to Book Six of the <title>Aeneid, w</title>hat son of Aeneas and Lavinia, as predicted by Anchises’ ghost,  would found Alba Longa?"
      answer: "SILVIUS"
    boni:
      - question: "According to Anchises’ ghost, who would succeed Silvius?"
        answer: "PROCA(S)"
      - question: "Name another legendary king of Alba Longa predicted by Anchises’ ghost?"
        answer: "CAPYS / NUMITOR / AENEAS SILVIUS / SILVIUS AENEAS"
  - tossup:
      question: "Which of the following is farthest north: Esquiline, Palatine, Viminal, Quirinal, and Aventine?"
      answer: "QUIRINAL"
    boni:
      - question: "Which is the following is farthest east: Thracia, Moesia Superior, Dalmatia, Epirus, and Macedonia?"
        answer: "THRACIA"
      - question: "Which of the following is farthest south: Rome, Ostia, Luca, Pompeii, and Ravenna?"
        answer: "POMPEII"
  - tossup:
      question: "Of the adjective forms <latin>exterius, īnfimus, proximus,</latin> and <latin>summus</latin>, which is NOT a superlative?"
      answer: "<latin>EXTERIUS</latin>"
    boni:
      - question: "Give the alternate form of <latin>īnfimus.</latin>"
        answer: "<latin>ĪMUS</latin>"
      - question: "Give the comparative forms of <latin>īnfimus</latin> and <latin>summus.</latin>"
        answer: "<latin>ĪNFERIOR</latin> and <latin>SUPERIOR</latin>"
  - tossup:
      question: "Avidius Nigrinus, Publius Celsus, Cornelius Palma, and Lusius Quietus were all executed at the  beginning of which Roman emperor’s reign?"
      answer: "HADRIAN’S"
    boni:
      - question: "What praetorian prefect arrested and sentenced these four ex-consuls to death in Hadrian’s absence?"
        answer: "(PUBLIUS ACILIUS) ATTIANUS"
      - question: "On what structure in the city of Rome is Lusius Quietus’s Moorish cavalry depicted for its service in  the military campaigns during the preceding reign?"
        answer: "TRAJAN’S COLUMN / <latin>COLUMNA TRAIĀNA</latin>"
  - tossup:
      question: "In Books 20 and 21 of the <title>Iliad,</title> what two brothers, both bastard sons of Priam by Laothoë, does Achilles  kill?"
      answer: "POLYDORUS AND LYCAON"
    boni:
      - question: "What had Lycaon been doing when Achilles previously captured him?"
        answer: "CUTTING SHOOTS / FIG SAPLINGS FOR CHARIOT WHEELS / RAILS"
      - question: "What king of Lemnos purchased Lycaon from the Greeks, later ransoming him to Eëtion?"
        answer: "EUNEÜS"
  - tossup:
      question: "Which of the following words, if any, is NOT derived from the same Latin word as the others? transitive, sensitive, initial, county, issue"
      answer: "SENSITIVE"
    boni:
      - question: "Which of the following words, if any, is NOT derived from the same Latin word as the others? emit, example, prompt, redeem, vintage"
        answer: "EMIT"
      - question: "Which of the following words, if any, is NOT derived from the same Latin word as the others? feign, feint (spell), effigy, crucifix, fiction"
        answer: "CRUCIFIX"
  - tossup:
      question: "For the verb <latin>mālō</latin>, give the 2nd person plural imperfect active subjunctive."
      answer: "<latin>MALLĒTIS</latin>"
    boni:
      - question: "Make <latin>māllētis</latin> perfect."
        answer: "<latin>MĀLUERĪTIS</latin>"
      - question: "Make <latin>māluerītis</latin> present indicative."
        answer: "<latin>MĀVULTIS</latin>"
  - tossup:
      question: "Translate the subordinate clause into Latin from the following sentence: “Caesar said that he wanted  to pitch camp.”"
      answer: "<latin>SĒ / EUM VELLE CASTRA PŌNERE</latin>"
    boni:
      - question: "Translate the subordinate clause into Latin from the following sentence: “Caesar asked why she  wanted to swim to the shore.”"
        answer: "<latin>CŪR (EA) NATĀRE AD LĪTUS / RĪPAM / ŌRAM VELLET</latin>"
      - question: "Translate the subordinate clause into Latin from the following sentence: “Caesar is so angry that he  will not eat the eggs.”"
        answer: "<latin>UT ŌVA NŌN CŌNSŪMAT / EDAT</latin>"
  - tossup:
      question: "What wanderer riding a one-eyed donkey agreed to lead the descendants of Heracles into the  Peloponnesus in exchange for the kingship of Elis?"
      answer: "OXYLUS"
    boni:
      - question: "What Peloponnesian king fought and killed Heracles' son Hyllus in single-combat 100 years earlier,  postponing the Heraclid conquest of the Peloponessus?"
        answer: "ECHEMUS"
      - question: "How had Hyllus’ misinterpretation of an oracle led to his death?"
        answer: "AN ORACLE SAID THEY WOULD CONQUER <emphasis>“IN THE THIRD CROP”</emphasis>  WHICH HYLLUS <emphasis>THOUGHT MEANT 3 YEARS</emphasis> BUT IN FACT <emphasis>MEANT 3 GENERATIONS</emphasis>"
  - tossup:
      question: "What distance did the Romans represent with the abbreviation MP?"
      answer: "ONE MILE"
    boni:
      - question: "Who assumed authority with a decree that the Romans abbreviated SCU?"
        answer: "THE SENATE"
      - question: "Whose money had been used on a building dedicated with the inscription PPP?"
        answer: "THE BUILDER’S OWN"
  - tossup:
      question: "In what city did Octavian’s forces, led by Salvidienus and Agrippa, trap Lucius Antonius, eventually  starving him into surrender?"
      answer: "PERUSIA"
    boni:
      - question: "What infamous woman, the wife of Marcus Antonius, helped instigate the so-called  Perusian War?"
        answer: "FULVIA"
      - question: "Following the aftermath of the Perusian War, what agreement renewed the Second  Triumvirate in 40 BC?"
        answer: "(PACT OF) BRUNDISIUM"
