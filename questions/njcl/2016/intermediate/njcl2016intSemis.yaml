tournament: "NJCL Certamen"
year: 2016
division: "Intermediate"
round: "Semifinals"
questions:
  - tossup:
      question: "What son of Dolius did Eumaeus and Philoetius string up in the storeroom during the battle between  Odysseus and the suitors and later drag into the courtyard and cut off his nose and ears and fed his  vitals to the dogs?"
      answer: "MELANTHIUS / MELANTHEUS"
    boni:
      - question: "What sister of Melanthius was the mistress of the suitor Eurymachus?"
        answer: "MELANTHO"
      - question: "What was the job of Odysseus' faithful servant Dolius, the father of Melanthius and Melantho?"
        answer: "TAKING CARE OF LAERTES (IN THE COUNTRY)"
  - tossup:
      question: "Give the comparative and superlative forms of the adverb “<latin>difficile</latin>.”"
      answer: "<latin>DIFFICILIUS, DIFFICILLIME</latin>"
    boni:
      - question: "Give the comparative and superlative forms of the adjective “idoneus.”"
        answer: "<latin>MAGIS IDONEUS, MAXIME IDONEUS</latin>"
      - question: "Give the comparative and superlative form of the adjective “vetus.”"
        answer: "<latin>VETUSTIOR, VETERRIMUS</latin>"
  - tossup:
      question: "Marius held an unprecedented number of consulships primarily to lead the Romans in a war against  which two Germanic tribes?"
      answer: "CIMBRI AND TEUTONES"
    boni:
      - question: "Give the name and the year of the battle at which the Teutones were finally defeated."
        answer: "AQUAE SEXTIAE, 102 BC"
      - question: "Give the name and the year for the battle at which the Cimbri were finally defeated."
        answer: "VERCELLAE, 101 BC"
  - tossup:
      question: "Translate the following sentence from Latin to English: “<latin>Utinam regem interficere ausi essemus!</latin>”"
      answer: "WOULD THAT WE HAD DARED TO KILL THE KING!"
    boni:
      - question: "Translate this sentence into English: “<latin>Ne foeda in templis heroum loquaris!”</latin>"
        answer: "DO NOT SPEAK FOUL THINGS (WORDS) IN THE TEMPLES OF HEROES/DEMIGODS!"
      - question: "Translate this sentence into English: “<latin>Pauciora dicas.”</latin>"
        answer: "(MAY YOU / LET YOU) SAY  FEWER THINGS / LESS"
  - tossup:
      question: "What were the first two chariot factions known in Rome?"
      answer: "RED AND WHITE / RUSSATA AND ALBATA"
    boni:
      - question: "What is the term for a horse that had won a hundred victories?"
        answer: "CENTENARIUS"
      - question: "In the circus, what was the Latin term for the horizontal spaces between the <latin>praecinctiones</latin> which were  divided into <latin>cunei</latin> by stairways?"
        answer: "<latin>MAENIANA / MAENIANUM</latin>"
  - tossup:
      question: "What use of the dative is found in the following sentence?"
      answer: "“<latin>Impedimento milites instructi erant.”</latin> PURPOSE"
    boni:
      - question: "What use of the dative is found in this sentence from Cicero?"
        answer: "“<latin>nec mihi hunc errorem extorqueri  volo</latin>.” SEPARATION"
      - question: "What use of the dative is found in this sentence?"
        answer: "“<latin>Nulla mihi erunt</latin>.” POSSESSION"
  - tossup:
      question: "According to the Latin motto of the state of Michigan, what will you see if you look around?"
      answer: "A PLEASANT PENINSULA"
    boni:
      - question: "According to the Latin motto of the state of Kansas, what will you reach if you pass through  difficulties?"
        answer: "THE STARS"
      - question: "According to the Latin motto of the state of Missouri, what is the highest law?"
        answer: "THE WELFARE OF THE PEOPLE"
  - tossup:
      question: "Who were the parents of Eurybia, Thaumas, Nereus, Phorcys, and Ceto?"
      answer: "PONTUS AND GAIA / GE / TERRA / TELLUS"
    boni:
      - question: "What messenger deity was the child of Thaumas?"
        answer: "IRIS"
      - question: "Which of these was not a child of Phorcys and Ceto: Euryale, Doris, Pemphredo, or Echidna?"
        answer: "DORIS"
  - tossup:
      question: "Using a supine, say in Latin: “That book was easy to read.”"
      answer: "<latin>ILLE / IS LIBER ERAT / FUIT FACILIS LECTŪ</latin>"
    boni:
      - question: "Using a supine, say in Latin: “He came to see the city of Athens."
        answer: "<latin>VĒNIT VISUM ATHENĀS</latin>"
      - question: "Now translate that sentence using something other than a supine."
        answer: "<latin>VĒNIT UT VIDERET / AD VIDENDAM / AD VIDENDUM / URBEM ATHENĀS  // VĒNIT VIDENAE URBIS ATHENARUM CAUSA / GRATIA  // VĒNIT URBEM VIDENDI CAUSA / GRATIA</latin>"
  - tossup:
      question: "Despite the death of Pompey, the republican forces that opposed Caesar remained entrenched in  Africa. At what battle were Metellus Scipio and Juba defeated by Caesar?"
      answer: "(BATTLE OF) THAPSUS"
    boni:
      - question: "What king of Mauretania assisted Caesar in his fight against Juba?"
        answer: "BOCCHUS II"
      - question: "Which of Caesar’s enemies committed suicide after the battle of Thapsus?"
        answer: "(MARCUS PORCIUS) CATO UTICINENSIS / THE YOUNGER"
  - tossup:
      question: "Which of the following words, if any, is NOT derived from the same Latin verb as the others? oust, cost, arrest, stagnant, culprit"
      answer: "STAGNANT"
    boni:
      - question: "From what Latin verb do the other four words come?"
        answer: "<latin>STŌ</latin>"
      - question: "What derviative of <latin>stō</latin> means “not destroyed or lost”?"
        answer: "EXTANT"
  - tossup:
      question: "Who welcomes Telemachus and reminisces about Telemachus' father when Telemachus sails to the  mainland to visit him at Pylos?"
      answer: "NESTOR"
    boni:
      - question: "Which daughter of Nestor, the loveliest, washed Telemachus’ feet before they ate dinner?"
        answer: "POLYCASTE"
      - question: "What son does Nestor send with Telemachus to Sparta?"
        answer: "PEISISTRATUS"
  - tossup:
      question: "Listen carefully to the following passage, which I will read twice. Then answer, in ENGLISH, the  question that follows. Then answer, in LATIN, the question that follows:  <latin>Urbe hostium capta, milites iter facere non potuerunt et ducentos dies erraverunt.  Ducentesimo primo die, exercitus festissimus cupidusque cibi oppidum parvum invenerunt.  Dux populum appropinquavit sed incoles in fugam milites dederunt.</latin>  Question: What did the inhabitants of the small town tell the general when he approached them?"
      answer: "THAT THEY HAD BEEN THE CITIZENS OF THE CAPTURED/SACKED CITY"
    boni:
      - question: "On what day after the city’s capture did the army find the small town?"
        answer: "DAY 201"
      - question: "What did the town’s residents do to the army?"
        answer: "PUT THEM TO FLIGHT"
  - tossup:
      question: "Which emperor of Rome confiscated the endowment of the Vestal Virgins, removed the Altar of  Victory from the senate house, and renounced the title of Pontifex Maximus?"
      answer: "GRATIAN"
    boni:
      - question: "Gratian became emperor of Rome after the death of what Western emperor, his father?"
        answer: "VALENTINIAN I"
      - question: "Who, proclaimed emperor in 383 AD, captured and killed Gratian?"
        answer: "MAGNUS MAXIMUS"
  - tossup:
      question: "What man with a snake’s tail succeeded to the rule of Attica after marrying the daughter of his  predecessor, Actaeüs, ended human sacrifice, and was named as the arbiter of the contest between  Athena and Poseidon over the patronage of Athens?"
      answer: "CECROPS"
    boni:
      - question: "Who succeeded Cecrops and renamed the region then known as Cecropia after his daughter Atthis? CRANAÜS (PANDION?"
        answer: ")"
      - question: "What son-in-law of Cranaüs deposed him?"
        answer: "AMPHICTYON"
  - tossup:
      question: "Which of the following words, if any, does not belong with the others because of meaning? <latin>ferreus, plumeus, argenteus, aureus</latin>"
      answer: "<latin>PLUMEUS</latin>"
    boni:
      - question: "Which of the following words, if any, does not belong with the others because of meaning? <latin>postridiē, posteā, numquam, frūstrā</latin>"
        answer: "<latin>FRŪSTRĀ</latin>"
      - question: "Which of the following words, if any, does not belong with the others because of declension? <latin>speciēs, comes, merīdiēs, spēs</latin>"
        answer: "<latin>COMES</latin>"
  - tossup:
      question: "<latin>Dēscrībāmus nunc prōprietātēs dictiōnum in hāc sententiā: “nec aspera terrent.” Quae pārs  ōrātiōnis est “nec”?</latin>"
      answer: "<latin>CONIUNCTIŌ</latin>"
    boni:
      - question: "<latin>Cuius temporis est “terrent”?</latin>"
        answer: "<latin>PRAESENTIS</latin>"
      - question: "<latin>Cuius coniugātiōnis est “terrent”?</latin>"
        answer: "<latin>SECUNDAE</latin>"
  - tossup:
      question: "Heracles settled 50 of his sons on the island of Sardinia. These sons were the children of 50 sisters who  were all children of what Boeotian king?"
      answer: "THESPIUS"
    boni:
      - question: "What beast had Heracles been hunting when he impregnated all 50 of Thespius' daughters?"
        answer: "CITHAERONIAN LION/ LION OF CITHAERA"
      - question: "Some sources say that Heracles gave what punishment to the daughter of Thespius who refused to lie with  him?"
        answer: "TO REMAIN A VIRGIN FOREVER / SERVE IN HIS TEMPLE"
  - tossup:
      question: "Where in Rome did a triumphal procession begin?"
      answer: "CAMPUS MARTIUS"
    boni:
      - question: "Where did the procession end?"
        answer: "TEMPLE OF JUPITER OPTIMUS MAXIMUS / TEMPLE OF JUPITER CAPITOLINUS"
      - question: "What childhood garment did a triumvir wear to ward off bad luck?"
        answer: "BULLA"
  - tossup:
      question: "Using an impersonal verb, translate this sentence into Latin: “We are disgusted by the candidate’s  deeds.”"
      answer: "<latin>PIGET/TAEDET NOS FACTORUM CANDIDATI / CANDIDATORUM</latin>"
    boni:
      - question: "Using an impersonal verb, translate this sentence into Latin: “It does not concern you”"
        answer: "<latin>NON TUĀ REFERT</latin>"
      - question: "Using that same verb, say in Latin: “It concerns your father”."
        answer: "<latin>REFERT PATRIS TUI</latin>"
