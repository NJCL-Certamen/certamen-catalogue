tournament: "NJCL Certamen"
year: 2017
division: "Advanced"
round: "Round 3"
questions:
  - tossup:
      question: "Give a Latin synonym for <latin>grex</latin>."
      answer: "<latin>CATERVA / VULGUS / PECŪ / PECUS / AGMEN / EXERCITUS</latin>"
    boni:
      - question: "Give a Latin synonym for <latin>trāmēs</latin>."
        answer: "SEE BELOW"
      - question: "Give two more synonyms of <latin>trāmēs</latin>."
        answer: "<latin>VIA / ITER / CURSUS / SĒMITA / ACTUS / LĪMES</latin>"
  - tossup:
      question: "What was the term for the trustworthy slave that accompanied the boy of a rich family to school?"
      answer: "<latin>PAEDAGŌGUS / PEDISEQUUS / COMES / CUSTŌS / MONITOR / RĒCTOR</latin>"
    boni:
      - question: "What type of slave accompanied his master and prompted him if he forgot the name of someone who greeted him?"
        answer: "<latin>NŌMENCLĀTOR</latin>"
      - question: "What type of slave operated similarly to a butler and was responsible for doing the buying, keeping  \tthe accounts, and supervising the house and furniture?"
        answer: "<latin>ĀTRIĒNSIS</latin>"
  - tossup:
      question: "<latin>Pauper aquae, nōtus animī paternī,</latin> and <latin>integer vītae scelerisque pūrus</latin> are all examples of what use of the Genitive?"
      answer: "SPECIFICATION /RESPECT"
    boni:
      - question: "<latin>Īnstar</latin> is an example of a word that is often seen with the Genitive. Many more words that expect a Genitive are postpositional. Give an example."
        answer: "<latin>CAUSĀ, GRĀTIĀ, ERGŌ</latin>"
      - question: "Using <latin>causā</latin> and a gerund, say in Latin: for the sake of sparing the hostages."
        answer: "<latin>OBSIDIBUS PARCENDĪ CAUSĀ</latin>"
  - tossup:
      question: "Who is being described by the following sentences?  Macrobius writes of him as one “born in the Veneto of country parents and brought up amongst the woods and shrubs.” According to Donatus, his father is sometimes described as a potter and a courier who married the boss’s daughter. He received education in Cremona and Milan, and he associated with Epicureanism. He eventually joined the literary circle of Maecenas and became acquainted with Augustus. His works sang of pastures, fields, and leaders."
      answer: "(P.) VERGIL(IUS MARO)"
    boni:
      - question: "Which of Vergil’s works covering the idyllic life included allusions to the coming birth of a child who will lead a “golden age,” which some, namely Christians, believed to be the advent of a Messianic figure?"
        answer: "<title>ECLOGUES / BUCOLICS</title>"
      - question: "Vergil’s second work, the <title>Georgics</title>, explores agriculture and is influenced by the Greek Hesiod’s <title>Works and Days</title>. What Latin didactic poem with the goal of explaining Epicureanism to a Roman audience served as a model for this genre and style?"
        answer: "<title><latin>DĒ RĒRUM NĀTŪRĀ</latin></title>"
  - tossup:
      question: "Who in the Underworld is stretched over nine acres while vultures eat his liver?"
      answer: "TITYUS"
    boni:
      - question: "Which letter represents the son of Zeus and Pluto?"
        answer: "A"
      - question: "Which letter represents the father of the centaurs?"
        answer: "D"
  - tossup:
      question: "Listen carefully to the following passage, which I will read twice; then answer the question that follows in LATIN. <latin>Caesar, cum dē actīs senātūs nūntius allātus esset, apud mīlitēs cōntiōnātus est. Quid patrēs ēgissent, quā causā ēgissent exposuit. Novem annōs sē suōsque reī pūblicae fidēliter servīsse, multās victoriās reportasse, dictātōrem nōn factum īrī.</latin> \tQuestion<latin>: Quamdiū Caesar reī pūblicae servierat, sententiā patrum?</latin>"
      answer: "<latin>NOVEM ANNŌS</latin>"
    boni:
      - question: "<latin>Quae, sententiā patrum, ā Caesare reportāta sunt?</latin>"
        answer: "<latin>(MULTAE) VICTŌRIAE</latin>"
      - question: "<latin>Quis, sententiā patrum, dictator fīet?</latin>"
        answer: "<latin>NĒMŌ</latin>"
  - tossup:
      question: "In 103 BC, what two men carried out an uprising of slaves in Sicily in the Second Servile War?"
      answer: "SALVIUS / TRYPHON AND ATHENION"
    boni:
      - question: "What Roman commander ended the war in 101 BC?"
        answer: "(MANIUS) AQUILIUS"
      - question: "What two men had led an earlier uprising in Sicily around 133 BC?"
        answer: "EUNUS / ANTIOCHUS AND CLEON"
  - tossup:
      question: "The suffixes -<latin>bulum,</latin> -<latin>crum</latin>, and -<latin>trum</latin> often denote means or instrument.  Therefore, what Latin noun denotes a “means of burial”?"
      answer: "<latin>SEPULCRUM</latin>"
    boni:
      - question: "The suffixes <latin>-ia, -tās, -iēs,</latin> and <latin>-tūdō</latin> denote an abstract quality.  Therefore, what Latin noun literally describes the abstract quality of a lazy person?"
        answer: "<latin>IGNĀVIA / SEGNITIĒS</latin>"
      - question: "Yet another suffix denotes a place where something is grown.  Therefore, what Latin noun, also an English word, denotes a place where trees are grown?"
        answer: "<latin>ARBORĒTUM /</latin> ARBORETUM"
  - tossup:
      question: "What Latin playwright’s innovation consisted of manipulating a prologue to conduct feuds with his critics and involve his audience more directly in the emotions of his characters, most notably how women are misunderstood, maligned, and mistreated by men in his <title>Hecyra</title>?"
      answer: "(P.) TERENTIUS (AFER) / TERENCE"
    boni:
      - question: "What Latin term was used to describe Terence's practice of combining multiple sources to create new plays, which he defended in one of his prologues?"
        answer: "<latin>CONTĀMINĀTIŌ</latin>"
      - question: "Which of Terence’s plays was commissioned by Publius Cornelius Scipio Aemilianus and his brother for performance at their father’s funeral games in 160 BC?"
        answer: "<title><latin>ADELPHOE / ADELPHOI / ADELPHI</latin></title>"
  - tossup:
      question: "For the verb <latin>agō, agere</latin>, give the 2nd person singular, future active imperative."
      answer: "<latin>AGITŌ</latin>"
    boni:
      - question: "Now make <latin>agitō</latin> plural."
        answer: "<latin>AGITŌTE</latin>"
      - question: "Now give the singular and plural, future active imperatives of the verb <latin>pūniō</latin>."
        answer: "<latin>PŪNĪTŌ, PŪNĪTŌTE</latin>"
  - tossup:
      question: "After Heracles released the Cretan Bull, it began to terrorize the land around what town near Athens?"
      answer: "MARATHON"
    boni:
      - question: "Who captured the Marathonian Bull?"
        answer: "THESEUS"
      - question: "What other beast, whose name was Phaea, did Theseus kill?"
        answer: "THE CROMMYONIAN SOW"
  - tossup:
      question: "Translate the following sentence into idiomatic English: <latin>Nil nōs impediet quōminus castra pōnāmus.</latin>"
      answer: "<latin>NOTHING WILL STOP US FROM PITCHING CAMP</latin>"
    boni:
      - question: "Translate this sentence: <latin>Mediā nocte, ursa maxima nōbīs clam dētrāxit cibum.</latin>"
        answer: "<latin>AT MIDNIGHT/IN THE MIDDLE OF THE NIGHT, A VERY LARGE BEAR SECRETLY STOLE OUR FOOD / STOLE FOOD FROM US //DRAGGED AWAY</latin>"
      - question: "Translate: <latin>ūnus ex nōbīs ursam vēnābātur nē quis ientāculō egēret.</latin>"
        answer: "ONE OF US HUNTED THE BEAR SO THAT NOBODY LACKED BREAKFAST."
  - tossup:
      question: "Who, after his throne was usurped by his brother, fled to Argos and received a wife and military aid from the king Adrastus, who raised an army to put him back on the throne of Thebes?"
      answer: "POLYN(E)ICES"
    boni:
      - question: "Whom did Polynices meet and struggle with while waiting for his audience with Adrastus?"
        answer: "TYDEUS"
      - question: "Who was Polynices’ brother who died at Polynices’ hand while Polynices died at his?"
        answer: "ETEOCLES"
  - tossup:
      question: "<latin>“Nātūra, hoc est vīta, nārrātur”</latin> concisely indicates the broad scope of topics covered in whose 37-book encyclopedia, <title><latin>Nātūrālis Historia</latin></title>?"
      answer: "(C.) PLINIUS / PLINY (SECUNDUS) MAIOR / THE ELDER"
    boni:
      - question: "To what future emperor did Pliny the Elder dedicate his <title><latin>Nātūrālis Historia</latin></title>?"
        answer: "TITUS"
      - question: "What other work of Pliny the Elder in 20 books, which recounted Roman military campaigns, did the Roman historian Tacitus later use for his own writings?"
        answer: "<latin>BELLŌRUM GERMĀNIAE XX LIBRĪ</latin> / <title><latin>BELLA GERMANIA /</latin></title> <title>THE WARS OF GERMANY</title>"
  - tossup:
      question: "In 6 AD, to what island did Tiberius retire, in self-exile?"
      answer: "RHODES"
    boni:
      - question: "To what island was Agrippa Postumus exiled in 7 AD?"
        answer: "PLANASIA"
      - question: "To what island was Agrippina the Elder banished by Tiberius?"
        answer: "PANDATERIA"
  - tossup:
      question: "Whom did Nestor send to guide Telemachus from Pylos to Sparta?"
      answer: "PEISISTRATUS (PROMPT ON “HIS SON”)"
    boni:
      - question: "Who in Sparta gave Telemachus the news that Odysseus was still alive?"
        answer: "MENELAÜS"
      - question: "Who in Sparta drugged Telemachus and Peisistratus with the drug Nepenthe?"
        answer: "HELEN"
  - tossup:
      question: "<latin>Quid Anglice significat “dīmicō?”</latin>"
      answer: "FIGHT / STRUGGLE / CONTEND / BRANDISH"
    boni:
      - question: "<latin>Quid Anglice significat “temnō?”</latin>"
        answer: "SCORN / DESPISE / REJECT"
      - question: "<latin>Quid Anglice significat “glomerō?”</latin>"
        answer: "WIND/FORM INTO A BALL //  \t\t\tGATHER INTO A ROUND HEAP // COLLECT TOGETHER"
  - tossup:
      question: "What Latin noun, with what meaning, is the ultimate root of the English word \"trireme\"?"
      answer: "<latin>RĒMUS</latin> - OAR"
    boni:
      - question: "What Latin noun, with what meaning, is the ultimate root of the English word \"expectorate\"?"
        answer: "<latin>PECTUS</latin> - CHEST"
      - question: "What does the English verb \"to expectorate\" mean?"
        answer: "TO SPIT/ EXPEL PHLEGM (from one’s chest)"
  - tossup:
      question: "What fourth-century AD writer was heavily influenced by the <title>Hortensius</title> of Cicero and by Manichaeism, and was the only Latin philosopher to fail to master Greek, though he transformed Latin Christianity with his Neoplatonism as evidenced in his <title><latin>Dē Cīvitāte Deī</latin></title>?"
      answer: "(AURELIUS) AUGUSTINUS / AUGUSTINE"
    boni:
      - question: "Which of Augustine’s works, the earliest extant Western autobiography, was marked by the radical doctrine of grace?"
        answer: "<title><latin>CŌNFESSIŌNĒS</latin></title> / <title>CONFESSIONS</title>"
      - question: "In what city in North Africa did Augustine serve as a bishop?"
        answer: "HIPPO"
  - tossup:
      question: "In 426 BC, whom did Cornelius Cossus kill in hand-to-hand combat, winning the <latin>spolia opīma</latin>?"
      answer: "(LARS) TOLUMNIUS"
    boni:
      - question: "Where had Tolumnius been king?"
        answer: "VEII"
      - question: "To what temple was the breastplate of the slain opponent dedicated?"
        answer: "JUPITER FERETRIUS"
