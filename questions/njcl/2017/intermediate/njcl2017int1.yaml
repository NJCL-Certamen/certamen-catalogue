tournament: "NJCL Certamen"
year: 2017
division: "Intermediate"
round: "Round 1"
questions:
  - tossup:
      question: "Name two of the three men who were married to Augustus' daughter, Julia."
      answer: "any two of MARCELLUS / AGRIPPA / TIBERIUS"
    boni:
      - question: "Julia's marriage to Agrippa was the only one that produced children, two of whom Augustus groomed to become his successors until their untimely deaths in 2 and 4 AD. Who were these two grandchildren?"
        answer: "GAIUS and LUCIUS CAESAR"
      - question: "Julia's repeated affairs with men and other debauchery repeatedly embarrassed the conservative sensibilities of Augustus until he snapped in 2 BC and sent her into exile on what island?"
        answer: "PANDATERIA"
  - tossup:
      question: "From what Latin adjective, with what meaning, do we ultimately derive “double,” “dozen,” and “duodenum?”"
      answer: "<latin>DUO -</latin> TWO"
    boni:
      - question: "From what Latin verb, with what meaning, do we ultimately derive “coddle,” “chauffeur,” and “cauldron?”"
        answer: "<latin>CALEŌ</latin> - BE WARM"
      - question: "From what Latin noun, with what meaning, do we ultimately derive “granny,” “dungeon” and “madonna”?"
        answer: "<latin>DOMUS –</latin> HOUSE"
  - tossup:
      question: "What king of Thebes put a curse on his half-brothers, who were also his sons, before abdicating the throne because he had killed his father and married his mother?"
      answer: "OEDIPUS"
    boni:
      - question: "Who was Oedipus’ birth-father, whom he killed on the road to Thebes?"
        answer: "LAIUS"
      - question: "Who, according to Sophocles, first accused Oedipus of murdering his predecessor on the throne of Thebes?"
        answer: "TEIRESIAS"
  - tossup:
      question: "In what region of the city of Rome could you find monuments such as the <latin>Āra Pācis</latin>, the Stadium of Domitian, and the <latin>Pantheon</latin>?"
      answer: "<latin>CAMPUS MARTIUS</latin>"
    boni:
      - question: "Identify the monument labeled D, which could be found in the <latin>Campus Mārtius</latin>."
        answer: "MAUSOLEUM OF AUGUSTUS"
      - question: "Identify the arches labeled A and B."
        answer: "A – ARCH OF SEPTIMIUS SEVERUS, B – ARCH OF CONSTANTINE"
  - tossup:
      question: "What use of the Ablative case is found in the following sentence: <latin>Captīvus ā carcere solūtus est</latin>."
      answer: "SEPARATION \\ PLACE FROM WHICH"
    boni:
      - question: "What use of the Ablative case is found in the following sentence: <latin>Nāvis mea multō celerior quam tua est.</latin>"
        answer: "DEGREE OF DIFFERENCE"
      - question: "What use of the Ablative case is found in the following sentence: <latin>Nāvem meam decem talentīs vēndere voluī.</latin>"
        answer: "(DEFINITE) PRICE"
  - tossup:
      question: "Who had the help of Athena, Hermes, and the Graiai in his quest to kill the Gorgon Medusa?"
      answer: "PERSEUS"
    boni:
      - question: "What wicked king set Perseus on this quest and was later turned to stone by Medusa’s head?"
        answer: "POLYDECTES"
      - question: "What bride did Perseus pick up on the way back?"
        answer: "ANDROMEDA"
  - tossup:
      question: "For the phrase <latin>hic ingēns leō</latin>, give the Genitive plural."
      answer: "<latin>HŌRUM INGENTIUM LEŌNUM</latin>"
    boni:
      - question: "Make that phrase singular."
        answer: "<latin>HUIUS INGENTIS LEŌNIS</latin>"
      - question: "Make that phrase Dative."
        answer: "<latin>HUIC INGENTĪ LEŌNĪ</latin>"
  - tossup:
      question: "What is the Latin word for the substance used by wealthy Romans to seal their letters?"
      answer: "<latin>CĒRA</latin>"
    boni:
      - question: "The wax was designed to prove that the letter's contents had not been read during its journey from the writer to the addressee because it sealed the thread lining of a letter, known as what?"
        answer: "<latin>LĪNUM</latin>"
      - question: "What was the term for slaves who specialized in the transportation of private letters?"
        answer: "<latin>TABELLĀRIUS / -Ī / -IĪ</latin>"
  - tossup:
      question: "What use of the dependent subjunctive is found in the following sentence? <latin>Vēnimus ut gemmās pretiōsās vidērēmus</latin>."
      answer: "(ADVERBIAL) PURPOSE"
    boni:
      - question: "Translate that sentence."
        answer: "WE CAME / HAVE COME TO SEE THE EXPENSIVE / PRECIOUS GEMS / JEWELS"
      - question: "If <latin>vēnimus</latin> were change to the present in that sentence, give the correct form of the subjunctive for that sentence."
        answer: "<latin>VIDEĀMUS</latin>"
  - tossup:
      question: "Which king of Rome was propelled onto the throne through \tthe augury and ambition of his wife, Tanaquil?"
      answer: "TARQUINIUS PRISCUS"
    boni:
      - question: "Tarquinius Priscus was not his original name as he changed it to avoid any controversy that might arise from his Etruscan origins. What was his birth name?"
        answer: "LUCUMO"
      - question: "Name Priscus' father, who had been a citizen of Corinth before immigrating to the Italian peninsula."
        answer: "DEMARATUS"
  - tossup:
      question: "<latin>Quid Anglicē significat “pingō?”</latin>"
      answer: "TO PAINT / DRAW / DEPICT"
    boni:
      - question: "<latin>Quid Anglicē significat “pinguis?”</latin>"
        answer: "SLEEK / FAT / FERTILE / RICH"
      - question: "<latin>Quid Anglicē significat “pignus?”</latin>"
        answer: "OATH / PLEDGE"
  - tossup:
      question: "Who is punished in the Underworld by being surrounded by food and drink that he can never reach?"
      answer: "TANTALUS"
    boni:
      - question: "What was Tantalus’ crime?"
        answer: "FED / TRIED TO FEED HUMAN FLESH (HIS SON PELOPS) TO THE GODS"
      - question: "What daughter of Tantalus lost all her children because of her thoughtless boasting?"
        answer: "NIOBE"
  - tossup:
      question: "What Latin preposition, with what meaning, is an ultimate root of the English word \"ancestry\"?"
      answer: "<latin>ANTE</latin> - BEFORE/IN FRONT OF"
    boni:
      - question: "What Latin noun, with what meaning, is the ultimate root of the English word \"oriole\"?"
        answer: "<latin>AURUM</latin> - GOLD"
      - question: "What Latin verb, with what meaning, is the ultimate root of the English word \"decay\"?"
        answer: "<latin>CADŌ</latin> / <latin>CADERE</latin> - FALL"
  - tossup:
      question: "Who traveled to Hesperia and married the daughter of Latinus and fathered descendants who would continue the Trojan race in Italy?"
      answer: "AENEAS"
    boni:
      - question: "What was the name of Aeneas’ Italian wife?"
        answer: "LAVINIA"
      - question: "With what Carthaginian widow did Aeneas have a dalliance before meeting Lavinia?"
        answer: "DIDO / ELISSA"
  - tossup:
      question: "Differentiate in meaning between the nouns <latin>mēns</latin> and <latin>mentum</latin>."
      answer: "MIND, CHIN"
    boni:
      - question: "Differentiate in meaning between <latin>mūs</latin> and <latin>rūs</latin>."
        answer: "MOUSE, COUNTRY(SIDE)"
      - question: "Differentiate in meaning between <latin>mōs</latin> and <latin>mox</latin>."
        answer: "CUSTOM, SOON"
  - tossup:
      question: "Listen carefully to the following passage, which I will read twice; then answer IN ENGLISH the question that follows. <latin>Mīles glōriōsus audientibus fābulam nārrat. “Cum multōs diēs iter fēcissēmus neque potuissēmus hostēs invenīre,” inquit mīles, “postrēmō noster imperātor virōs rūsticōs mulierēsque convocāvit, quī dīxērunt hostēs perterritōs in silvā latēre. Quā rē audītā, castra haud procul collocāvimus. Nam nōs mīlitēs semper sumus parātī audācter pugnāre!”</latin>  \tQuestion: As the braggart soldier story begins, what were the soldiers unable to do?"
      answer: "FIND THE ENEMY"
    boni:
      - question: "What did the general learn from questioning the local men and women?"
        answer: "THE (FRIGHTENED)  \t\t\tENEMY WERE HIDING IN THE FOREST / THAT THE ENEMY WAS FRIGHTENED"
      - question: "According to the braggart soldier, what are soldiers like?"
        answer: "THEY ARE ALWAYS PREPARED TO FIGHT (BOLDLY)"
  - tossup:
      question: "The final defeat in Caesar's military career came outside Dyrrhachium, when he overextended his army in an unsuccessful attempt to blockade and crush the forces of what enemy general?"
      answer: "(Cn.) POMPEY / POMPEIUS (MAGNUS)"
    boni:
      - question: "Prior to Dyrrhachium, Caesar had suffered only one defeat, one which had come at the hands of Vercingetorix outside of what town?"
        answer: "GERGOVIA"
      - question: "Caesar recovered quickly from his defeat at Dyrrhachium and won a decisive battle later in the same year near what Greek city?"
        answer: "PHARSALUS"
  - tossup:
      question: "Translate this sentence: <latin>Scīmus magistram nostram hodiē nōn docēre.</latin>"
      answer: "WE KNOW THAT OUR TEACHER IS NOT TEACHING TODAY"
    boni:
      - question: "Translate the following sentence into good English: <latin>Māter nostra putāvit certāmen crās futūrum esse.</latin>"
        answer: "OUR MOTHER THOUGHT THAT (THE) CERTAMEN / CONTEST WOULD BE TOMORROW"
      - question: "Translate this sentence: <latin>Hae quaestiōnēs facilēs nōbīs esse videntur</latin>."
        answer: "THESE QUESTIONS SEEM (TO BE) EASY TO US"
  - tossup:
      question: "According to Ovid, who, as a reward for being the only hospitable couple in Phrygia, became an oak and a linden?"
      answer: "BAUCIS AND PHILEMON"
    boni:
      - question: "What two Roman deities dined at the house of Baucis and Philemon?"
        answer: "JUPITER AND MERCURY"
      - question: "What animal did Baucis and Philemon chase around the backyard after they discovered their guests were gods?"
        answer: "A GOOSE"
  - tossup:
      question: "Say in Latin: Marcus returned the money to Julius."
      answer: "<latin>MĀRCUS PECŪNIAM IŪLIŌ REDDIDIT.</latin>"
    boni:
      - question: "Now say in Latin: Marcus stole the money for the sake of his children."
        answer: "<latin>MĀRCUS PECUNIAM RAPUIT / ABSTULIT LĪBERŌRUM (SUŌRUM) CAUSĀ / GRĀTIĀ</latin>"
      - question: "Using an Ablative Absolute, say in Latin: Since the money had been stolen, Julius became very angry."
        answer: "<latin>PECŪNIĀ RAPTĀ / ABLĀTĀ, IŪLIUS</latin> <latin>ĪRĀTISSIMUS / VALDĒ ĪRĀTUS FIĒBAT / FACTUS EST</latin>"
