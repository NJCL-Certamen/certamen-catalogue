tournament: "NJCL Certamen"
year: 2017
division: "Intermediate"
round: "Round 3"
questions:
  - tossup:
      question: "What Latin verb, with what meaning, is the ultimate root of the English word \"second\"?"
      answer: "<latin>SEQUOR</latin> / <latin>SEQUĪ</latin> - FOLLOW"
    boni:
      - question: "What Latin verb, with what meaning, is the ultimate root of the English word \"natural\"?"
        answer: "<latin>NĀSCOR</latin> / <latin>NĀSCĪ</latin> - BE BORN"
      - question: "What Latin verb, with what meaning, is the ultimate root of the English word \"passion\"?"
        answer: "<latin>PATIOR</latin> / <latin>PATĪ</latin> - TO SUFFER/BEAR/ENDURE"
  - tossup:
      question: "Which emperor's overzealous campaigns in the east turned into one the great humiliations of Roman military history when, after a pitched battle outside Edessa, the emperor was captured by the Sassanid emperor Shapur I in 260 AD?"
      answer: "(P. LĪCINIUS) VALERIAN(US)"
    boni:
      - question: "Valerian's capture left what son and co-emperor to fend off dozens of insurrections across the empire alone?"
        answer: "GALLIENUS"
      - question: "Before Valerian's death, what did Shapur I use the former emperor as?"
        answer: "STEP-STOOL"
  - tossup:
      question: "Using one word, translate “to play” in this sentence: We went outside to play."
      answer: "<latin>LŪSUM</latin>"
    boni:
      - question: "Using a supine, translate “to say” in this sentence: The fun which we had is difficult to say."
        answer: "<latin>DICTŪ</latin>"
      - question: "What use of the Ablative is <latin>dictū</latin> as it would be translated in that sentence?"
        answer: "RESPECT / SPECIFICATION"
  - tossup:
      question: "Translate the following sentence into English: <latin>Līberī verentur nē pūniantur ā parentibus.</latin>"
      answer: "THE CHILDREN FEAR THAT THEY WILL BE / MAY BE / ARE BEING PUNISHED BY THEIR PARENTS"
    boni:
      - question: "Translate: <latin>Agricolae animālia cēlāvērunt nē quis ea raperet.</latin>"
        answer: "THE FARMERS HID/HAVE HIDDEN THEIR ANIMALS LEST SOMEONE STEAL THEM / SO THAT NOT ANYONE / NO ONE MIGHT / WOULD / MAY STEAL THEM"
      - question: "Translate: <latin>Nescīmus quid respōndendum sit</latin>."
        answer: "WE DO NOT KNOW WHAT TO RESPOND / WHAT MUST BE / IS TO BE ANSWERED"
  - tossup:
      question: "Who made the Furies cry when he visited the Underworld?"
      answer: "ORPHEUS"
    boni:
      - question: "Who visited the Underworld and left with Cerberus?"
        answer: "HERACLES / HERCULES"
      - question: "Who was trapped forever on the Seat of Forgetfulness when he visited the Underworld to abduct a wife?"
        answer: "PIRITHOÜS"
  - tossup:
      question: "<latin>Dēscrībāmus nunc proprietātēs dictiōnum in hāc sententiā: Omnis ars nātūrae imitātiō est. Quae pars ōrātiōnis est “imitātiō?”</latin>"
      answer: "<latin>NŌMEN</latin>"
    boni:
      - question: "<latin>Cuius generis est “imitātiō?”</latin>"
        answer: "<latin>FĒMINĪNĪ</latin>"
      - question: "<latin>Quō cāsū est “omnis?”</latin>"
        answer: "<latin>NŌMINĀTĪVŌ</latin>"
  - tossup:
      question: "Whose peaceful death in retirement at Puteoli belies his long and bloodstained reign as dictator, which is most infamous for the widespread state-sanctified executions of political enemies that were called 'proscriptions'?"
      answer: "(L. CORNELIUS) SULLA (FELIX)"
    boni:
      - question: "Sulla's dictatorship began after he won a close victory against Papirius Carbo near which gate leading into Rome?"
        answer: "COLLINE"
      - question: "Aiding Carbo at the battle was what tribe, which particularly hated Sulla for his brutal suppression of their insurrection during the Social War?"
        answer: "SAMNITES"
  - tossup:
      question: "What lover of Apollo became a flower when Apollo accidentally hit him with a discus?"
      answer: "HYACINTHUS"
    boni:
      - question: "What jealous wind blew the discus into Hyacinthus?"
        answer: "ZEPHYR(US)"
      - question: "What Trojan War hero was also transformed into a hyacinth?"
        answer: "BIG / GREAT / TELAMON(IAN) / SALAMINIAN AJAX"
  - tossup:
      question: "Make the phrase <latin>tōtus orbis</latin> Dative singular."
      answer: "<latin>TŌTĪ ORBĪ</latin>"
    boni:
      - question: "Change <latin>tōtī orbī</latin> to Genitive."
        answer: "<latin>TŌTĪUS ORBIS</latin>"
      - question: "Make <latin>tōtīus orbis</latin> plural."
        answer: "<latin>TŌTŌRUM ORBIUM</latin>"
  - tossup:
      question: "What emperor added the provinces of Assyria, Mesopotamia, and Dacia to the empire, thus bringing Rome's territory to its largest extent?"
      answer: "(M. ULPIUS) TRAJAN(US)"
    boni:
      - question: "The two pictures on page 1 represent the territorial extent of Rome at the end of the reign of Augustus in 14 AD and at the end of what other emperor's reign in which four provinces were added?"
        answer: "CLAUDIUS'"
      - question: "Looking at page 2, identify the province labeled 1, which Claudius annexed in 42 AD."
        answer: "MAURETANIA (TINGITANA / CAESARIENSIS)"
  - tossup:
      question: "At a fancy restaurant with your family, your appetizer is a hard-boiled egg, and for dessert you have an apple pie. Remembering your Latin training, what Latin phrase could you quip to your family to describe your meal from beginning to end?"
      answer: "<latin>AB ŌVŌ USQUE AD MĀLA</latin>"
    boni:
      - question: "Our northern neighbor, Canada, has a national motto very similar to this phrase. What is the Latin and English for this motto?"
        answer: "<latin>Ā MARĪ USQUE AD MARE -</latin> FROM SEA TO (SHINING) SEA"
      - question: "Nevertheless, your family does not appreciate your vast Latin knowledge, to which you say “<latin>Dē gustibus nōn est disputandum.”</latin> What are you saying?"
        answer: "THERE’S NO ACCOUNTING FOR TASTE"
  - tossup:
      question: "On what island did Aeneas and his followers suffer a plague causing them to rethink whether it was in fact the “ancient mother” that an oracle had told them to seek?"
      answer: "CRETE"
    boni:
      - question: "Where had Aeneas been told by an oracle to “seek your ancient mother”?"
        answer: "DELOS"
      - question: "What Trojan ancestor had come from Crete, causing Anchises to identify Crete as the “ancient mother”?"
        answer: "TEUCER"
  - tossup:
      question: "Listen carefully to the following passage, which I will read twice; then answer IN LATIN the question that follows. <latin>Mīles aliam fābulam nārrāre coepit. “Ōlim longē in terrīs ignōtīs cum contrā ferōcissimōs hominēs pugnārēmus, fēmina appāruit, perīta bellandī, alta capillīs micantibus et faciē dīvīnā. Decem diēs noctēsque fortiter pugnāvit. Sī hanc fēminam spectāvissētis, hanc aut deam aut rēgīnam esse putāvissētis. Tum proeliīs factīs ēvanuit.”</latin> \tQuestion: <latin>Quālis erat fēmina quae appāruit dum mīlitēs pugnant?</latin>"
      answer: "<latin>ALTA / DĪVĪNA /  \t\t\tRĒGĀLIS / PERĪTA (BELLANDĪ) / CAPILLĪS MICANTIBUS / FACIĒ DĪVĪNĀ</latin>"
    boni:
      - question: "<latin>Quid fēcit fēmina post proelia?</latin>"
        answer: "<latin>ĒVĀNUIT</latin>"
      - question: "<latin>Ubi haec proelia facta sunt?</latin>"
        answer: "<latin>LONGĒ / IN TERRĪS IGNŌTĪS</latin>"
  - tossup:
      question: "What is the term for the less common alternative to the <latin>caldārium</latin> usually found in private residences that while still a hot room, was used for sweating without the presence of water to bathe in?"
      answer: "LACŌNICUM"
    boni:
      - question: "More common in public bathhouses was an area designated for exercise, named what?"
        answer: "PALAESTRA"
      - question: "One major distinction between the <latin>caldārium</latin> and <latin>lacōnicum</latin> was that the <latin>caldārium</latin> featured what massive water tank where the men or women took their bath?"
        answer: "ALVEUS"
  - tossup:
      question: "Which king of Rome constructed the infamous dungeon of the Mamertine Prison, the <latin>Tulliānum</latin>?"
      answer: "ANCUS MARCIUS"
    boni:
      - question: "Ancus Marcius is also credited with the construction of what port city at the mouth of the Tiber River?"
        answer: "OSTIA"
      - question: "Marcius' territorial expansion also led to the annexation of which hill, situated across the Tiber from the famous seven hills?"
        answer: "JANICULUM"
  - tossup:
      question: "How long did Odysseus remain on the island of Aeaea?"
      answer: "1 YEAR"
    boni:
      - question: "Where did Odysseus sail immediately after leaving Aeaea the first time?"
        answer: "THE UNDERWORLD / EDGE OF THE OCEAN / LAND OF THE CIMMERIANS"
      - question: "Who fell off Circe’s roof and died on Aeaea, then met with Odysseus in the Underworld to ask for burial?"
        answer: "ELPENOR"
  - tossup:
      question: "<latin>Quid Anglicē significat prex?</latin>"
      answer: "PRAYER"
    boni:
      - question: "<latin>Quid Anglicē significat nex</latin>?"
        answer: "MURDER / DEATH / SLAUGHTER"
      - question: "<latin>Quid Anglicē significat duplex</latin>?"
        answer: "TWO-FOLD / DOUBLE"
  - tossup:
      question: "Distinguish in meaning among <latin>iūrō, iubeō</latin>, and <latin>iūdico</latin>."
      answer: "<latin>IŪRŌ</latin> – SWEAR / TAKE AN OATH; <latin>IUBEŌ</latin> – ORDER / COMMAND; <latin>IŪDICŌ</latin> – (SERVE AS A) JUDGE / DECIDE"
    boni:
      - question: "Distinguish in meaning between <latin>perficiō</latin> and <latin>dēficiō</latin>."
        answer: "<latin>PERFICIŌ –</latin> FINISH / COMPLETE; <latin>DĒFICIŌ</latin> – FAIL / DEFECT"
      - question: "Distinguish in meaning between <latin>praeficere</latin> and <latin>praeesse</latin>."
        answer: "<latin>PRAEFICERE</latin> – TO PUT (SOMEONE) IN CHARGE OF; <latin>PRAEESSE</latin> – TO BE IN CHARGE / AT HEAD OF"
  - tossup:
      question: "Who became the father of the Lemnian king Euneus when the Argo reached a Lemnos populated only by women?"
      answer: "JASON"
    boni:
      - question: "Who was the mother of Euneus and his brother Nebrophonus?"
        answer: "HYPSIPYLE"
      - question: "Why was Hypsipyle later exiled from Lemnos?"
        answer: "(THE OTHER WOMEN FOUND OUT THAT) SHE HAD LET HER FATHER (THOAS) ESCAPE THE SLAUGHTER OF THE MEN ON LEMNOS"
  - tossup:
      question: "From what Latin noun, with what meaning, do we derive “ceiling?”"
      answer: "<latin>CAELUM</latin> - SKY / HEAVEN"
    boni:
      - question: "From what Latin verb, with what meaning, do we derive “cult?”"
        answer: "<latin>COLŌ -</latin> TILL, WORSHIP"
      - question: "From what Latin verb, with what meaning do we ultimately derive “conceal?”"
        answer: "<latin>CĒLŌ –</latin> HIDE / CONCEAL"
