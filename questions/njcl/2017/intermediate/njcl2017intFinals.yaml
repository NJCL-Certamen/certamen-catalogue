tournament: "NJCL Certamen"
year: 2017
division: "Intermediate"
round: "Finals"
questions:
  - tossup:
      question: "The English word \"incinerate” derives from what Latin noun, with what meaning?"
      answer: "<latin>CINIS (CINERIS)</latin> - ASH(ES)"
    boni:
      - question: "What Latin noun, with what meaning, is the ultimate root of the English word \"turret\"?"
        answer: "<latin>TURRIS -</latin> TOWER"
      - question: "What Latin noun, with what meaning, is the ultimate root of the English word “poop” as in “poop deck”"
        answer: "<latin>PUPPIS</latin> – SHIP / POOP (DECK) / STERN"
  - tossup:
      question: "Change the verb form <latin>cōnfīdātis</latin> to the perfect."
      answer: "<latin>CŌNFĪSĪ SĪTIS</latin>"
    boni:
      - question: "Complete the following analogy: <latin>cōnfīdātis</latin> : <latin>cōnfīsī sītis</latin> :: <latin>sepeliātis</latin> : _____?"
        answer: "<latin>SEPELĪVERĪTIS</latin>"
      - question: "Now complete this analogy: <latin>cōnfīdit</latin> : <latin>cōnfīdāt</latin> :: <latin>vult</latin> : _____?"
        answer: "<latin>VELIT</latin>"
  - tossup:
      question: "An often-forgotten element of early republican history is that for almost the entirety of the period between 444 BC and 367 BC, the power of the consulship was allotted to three men holding what office?"
      answer: "(MILITARY) TRIBUNE"
    boni:
      - question: "The period of tribunes came to a conclusion when the Licinio-Sextian laws restored the consulship with the stipulation that one plebeian be named consul. Who was elected as the first plebeian consul?"
        answer: "(LUCIUS) SEXTIUS"
      - question: "What new office was created in the same year that the consulship was restored, 367 BC?"
        answer: "CURULE AEDILESHIP"
  - tossup:
      question: "What member of Odysseus’ household was the child of Ctesius, the king of Syra, but was abducted by Phoenician sailors with the aid of a household servant and ended up a herdsman in Ithaca?"
      answer: "EUMAEUS"
    boni:
      - question: "What herdsman in the household of Odysseus was the son of Laertes’ servant Dolius?"
        answer: "MELANTHEUS / MELANTHIUS"
      - question: "What member of Odysseus’ household was a child of Ops and was bought by Laertes for 20 oxen?"
        answer: "EURYCLEIA"
  - tossup:
      question: "Differentiate in meaning between <latin>nix</latin> and <latin>vix</latin>."
      answer: "<latin>NIX –</latin> SNOW; <latin>VIX -</latin> HARDLY / SCARCELY"
    boni:
      - question: "Differentiate in meaning between <latin>petō</latin> and <latin>vetō</latin>."
        answer: "<latin>PETŌ –</latin> SEEK / HEAD FOR / ASK / ETC; <latin>VETŌ -</latin> FORBID/OPPOSE/NOT ALLOW"
      - question: "Differentiate in meaning between <latin>plūs</latin> and <latin>rūs</latin>."
        answer: "<latin>PLŪS</latin> – MORE; <latin>RŪS –</latin> COUNTRY(SIDE)"
  - tossup:
      question: "Translate the following sentence into English: <latin>Frāter ad forum īvit ut dēnāriīs suīs pānem et ōva emeret.</latin>"
      answer: "THE BROTHER WENT TO THE FORUM TO BUY BREAD AND EGGS WITH HIS (OWN) MONEY / DENARII"
    boni:
      - question: "Translate: <latin>Tam vacuum erat forum ut nec pānis nec ōva ā mercātōribus vēnderentur.</latin>"
        answer: "THE MARKET / FORUM WAS SO EMPTY THAT NEITHER BREAD NOR EGGS WERE BEING SOLD BY THE MERCHANTS"
      - question: "Translate: <latin>Iūlia verēbātur ut satis pecūniae ad cibum emendum habēret.</latin>"
        answer: "JULIA FEARED / WAS FEARING THAT SHE WOULD / DID / MAY / MIGHT / SHALL NOT HAVE ENOUGH MONEY TO BUY (THE) FOOD."
  - tossup:
      question: "Whom did Circe transform into a woodpecker?"
      answer: "PICUS"
    boni:
      - question: "What lover of Picus wasted away out of grief for him?"
        answer: "CANENS"
      - question: "What son of Picus was an Italian woodland god?"
        answer: "FAUNUS"
  - tossup:
      question: "Galerius' grueling campaign against the Sassanids began when the province of Mesopotamia was attacked by what newly installed king of Persia?"
      answer: "NARSES"
    boni:
      - question: "Whom had Narses succeeded as ruler of the Sassanids?"
        answer: "BAHRAM (II)"
      - question: "What Armenian king's conversion to Christianity alienated the ruler from the Sassanids and thereby further strengthened Rome's position in the east?"
        answer: "TIRIDATES (III)"
  - tossup:
      question: "Give the full Latin phrase and its English meaning that is abbreviated <latin>non seq.</latin>"
      answer: "<latin>NŌN SEQUITUR</latin> – (IT) DOES NOT FOLLOW"
    boni:
      - question: "What similar abbreviation describes a legal judgement where the plaintiff does not appear?"
        answer: "<latin>NON PROS.</latin>"
      - question: "What similar abbreviation using a one-word ablative absolute means notwithstanding?"
        answer: "<latin>NON OBS.</latin>"
  - tossup:
      question: "Listen carefully to the following passage, which I will read twice; then answer IN LATIN the question that follows. <latin>Mīles glōriōsus fābulam continuit. “Cum impetum facerem contrā barbarōs quī rapiendī causā incolās novae urbis minābantur, subitō ignēs sagittaeque in mūrōs adiectī sunt. Quibus rēbus cognitīs, omnēs mīlitēs in ūnum convēnērunt. Cīvēs exīstimābant hostēs urbem dēlētūrōs esse. Nōs mīlitēs autem salvātōrēs urbis factī sumus. Nimis pulcher sum!”</latin> \tQuestion: <latin>Quā dē causā barbarī incolās minābantur?</latin>"
      answer: "<latin>RAPIENDĪ CAUSĀ</latin>"
    boni:
      - question: "<latin>Quibus barbarī incolās urbis aggrediēbantur?</latin>"
        answer: "<latin>IGNĪ SAGITTĪSQUE / (IGNĪ ET) SAGITTĪS / IGNIBUS</latin>"
      - question: "<latin>Respondē Anglicē: fābulā pernarrātā, quid mīles glōriōsus prōfessus est?</latin>"
        answer: "“I AM TOO PRETTY!”"
  - tossup:
      question: "Identify by letter and name the son of Poseidon who was invulnerable to weapons and died at the hands of Achilles."
      answer: "C – CYCNUS / CYGNUS"
    boni:
      - question: "Identify by letter and name the soldier whom Achilles slew when he ridiculed Achilles for falling in love with a dead woman."
        answer: "B – THERSITES"
      - question: "Give the name of the warrior whom Eos is carrying in letter D."
        answer: "MEMNON"
  - tossup:
      question: "What was the ancient Latin term for people connected to you only through marriage?"
      answer: "<latin>ADFĪNĒS</latin>"
    boni:
      - question: "What was the Latin term for people connected to you by any form of blood in ancient Rome?"
        answer: "<latin>COGNĀTĪ</latin>"
      - question: "In ancient Rome, the closest form of relationship came from those who could trace their mutual lineage through male ancestors. What was the Latin term for those related to you in this way?"
        answer: "<latin>AGNĀTĪ</latin>"
  - tossup:
      question: "Using the verb <latin>ōdī</latin>, say in Latin: “I hated lunch.”"
      answer: "<latin>PRANDIUM ŌDERAM</latin>"
    boni:
      - question: "Using the most common constructions, use the verb <latin>meminī</latin> and a <latin>cum</latin> clause to say in Latin: “Since you saved me from death, I will always remember you.”"
        answer: "<latin>CUM MĒ (Ā) MORTE SERVĀVERĪS, TUĪ SEMPER MEMINERŌ</latin>"
      - question: "Now say in Latin: “If we were to now become gods, we would rejoice.”"
        answer: "<latin>SĪ NUNC / IAM (NŌS) DĪVĪ / DĪ / DEĪ FIERĒMUS, GAUDĒRĒMUS</latin>"
  - tossup:
      question: "What daughter of Polyxo and Nycteus fled Thebes when she was impregnated by Zeus?"
      answer: "ANTIOPE"
    boni:
      - question: "What king of Sicyon married Antiope?"
        answer: "EPOPEUS"
      - question: "What brother of Nycteus dragged Antiope back to Thebes?"
        answer: "LYCUS"
  - tossup:
      question: "Place the following cities in correct order from furthest west to furthest east. <latin>Lindum, Aquincum, Augusta Emerita, Lutetia, Vindobona</latin>."
      answer: "<latin>AUGUSTA EMERITA, LINDUM, LUTETIA, VINDOBONA, AQUINCUM</latin>"
    boni:
      - question: "Correctly identify the modern name for three of the five cities listed in the tossup."
        answer: "<latin>LINDUM</latin> = LINCOLN, <latin>AQUINCUM</latin> = BUDAPEST, <latin>AUGUSTA EMERITA</latin> = MERIDA, <latin>LUTETIA</latin> = PARIS, <latin>VINDOBONA</latin> = VIENNA"
      - question: "Now order the following list of cities from furthest south to furthest North. <latin>Gades, Dēva, Rōma, Arausiō</latin>."
        answer: "<latin>GADES, RŌMA, ARAUSIŌ, DĒVA</latin>"
  - tossup:
      question: "What two uses of the Genitive case are found in the following sentence: <latin>Aestimāmus nostrum bōvem māiōris esse quam tuī.</latin>"
      answer: "(INDEFINITE) VALUE / PRICE & POSSESSION"
    boni:
      - question: "What two uses of the Ablative case can be found in the following sentence: <latin>Minimā cum audāciā nāvem ūnō talentō vēndidit.</latin>"
        answer: "MANNER & (DEFINITE) PRICE"
      - question: "What two uses of the Ablative case are found in the following sentence: <latin>Quod Catilīna nātus erat genere nōbilī, eī sella aurō erat.</latin>"
        answer: "SOURCE / ORIGIN & MATERIAL"
  - tossup:
      question: "What Latin verb, with what meaning, is the ultimate root of the English word \"degree\"?"
      answer: "<latin>GRADIOR / GRADĪ</latin> – STEP / WALK"
    boni:
      - question: "What Latin noun, with what meaning, is the ultimate root of the English word \"common\"?"
        answer: "<latin>MŪNUS</latin> – DUTY / GIFT / PAYMENT"
      - question: "What Latin adjective, with what meaning, is the ultimate root of the English word \"milieu\"?"
        answer: "<latin>MEDIUS /-A /-UM</latin> - MIDDLE (OF)"
  - tossup:
      question: "What is the name for nouns such as <latin>carbasus</latin> and <latin>epulum</latin>, which vary in gender?"
      answer: "HETEROGENEOUS"
    boni:
      - question: "Make the phrase <latin>alba carbasus</latin> plural."
        answer: "<latin>ALBA CARBASA</latin>"
      - question: "Make the phrase <latin>fūnestum epulum</latin> plural."
        answer: "<latin>FŪNESTAE EPULAE</latin>"
  - tossup:
      question: "What king’s forces did the Athenians under Theseus or his son Demophon battle at Marathon to protect the suppliants who had sought protection at the altar of Mercy after the death of their father, Heracles?"
      answer: "EURYSTHEUS’"
    boni:
      - question: "What daughter of Heracles sacrificed her life to ensure victory for Athens and the Heraclids?"
        answer: "MACARIA"
      - question: "Who pursued Eurystheus as far as the Isthmus of Corinth, where he captured or killed him?"
        answer: "HYLLUS / IOLAÜS"
  - tossup:
      question: "Failed efforts to replicate Hannibal's tactics at the battle of Cannae can be seen as recently as the German invasion of Belgium during the First World War, however a more proximate example came at what battle, only one year after Hannibal's victory, which ended in disaster when Hasdrubal Barca attempted to recreate the famous collapsed center but was instead overrun by the Scipio brothers?"
      answer: "DERTOSA"
    boni:
      - question: "The Scipio brother's fight with Hasdrubal in Spain lasted for six years, beginning with what battle, the only serious naval engagement of the Second Punic War?"
        answer: "EBRO RIVER"
      - question: "Although the Scipio brothers were both ultimately killed in battle, the year prior to both their deaths they captured what city in Spain, a major symbolic victory?"
        answer: "SAGUNTUM"
