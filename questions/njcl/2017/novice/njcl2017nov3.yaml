tournament: "NJCL Certamen"
year: 2017
division: "Novice"
round: "Round 3"
questions:
  - tossup:
      question: "What English noun meaning \"help given to those in need\" is derived from the Latin adjective <latin>levis</latin>?"
      answer: "RELIEF/ ALLEVIATION"
    boni:
      - question: "What English adjective meaning \"not pertinent\" is derived from the same adjective?"
        answer: "IRRELEVANT"
      - question: "What English adjective meaning \"without yeast\" is derived from the same adjective?"
        answer: "UNLEAVENED"
  - tossup:
      question: "What Roman praenomen was abbreviated Cn.?"
      answer: "GNAEUS"
    boni:
      - question: "How many days after birth did a boy receive his praenomen?"
        answer: "9"
      - question: "What was this naming day called?"
        answer: "<latin>DIĒS LŪSTRICUS</latin>"
  - tossup:
      question: "What Greek god married Themis, Metis, and finally his sister Hera?"
      answer: "ZEUS"
    boni:
      - question: "Give the letters and names of the two gods depicted in your visual who had the same mother?"
        answer: "A – APOLLO AND B – ARTEMIS"
      - question: "Identify the deities portrayed in pictures C and D?"
        answer: "C – POSEIDON, D - ATHENA"
  - tossup:
      question: "Lautulae, Bovianum, and Caudine Forks were all battles waged during what war in the fourth century BC?"
      answer: "SECOND SAMNITE WAR"
    boni:
      - question: "Which Samnite general trapped the Roman army at Caudine Forks?"
        answer: "(GAVIUS) PONTIUS"
      - question: "In what year was the Battle of Caudine Forks?"
        answer: "321 BC"
  - tossup:
      question: "Listen carefully to the following passage about a boy and his dog, which I will read twice; then answer IN ENGLISH the question that follows. <latin>Puer, quī cānem parvum amīsit, canem novum ā mātre accēpit. Statim cum hōc cane lūdere voluit. Subitō mercātor ē mediā silvā cum cane eius ērūpit et cum celeritāte ad puerum accurrit. “Puer,” inquit “tuus canis inventus est!”</latin> Question: What did the boy want to do immediately?"
      answer: "TO PLAY WITH THE (NEW) DOG"
    boni:
      - question: "What did the merchant shout as he came out of the forest?"
        answer: "HE WAS YELLING THAT  \t\t\tTHE BOY’S DOG HAS BEEN FOUND / “BOY! YOUR DOG HAS BEEN FOUND!” The passage continues: <latin>Mercātor novum canem cōnspexit et eī respondit “Mīrābile! Nunc nōn modo ūnum canem sed etiam duōs canēs habēs. Quam fortūnātus es!”</latin>"
      - question: "According to the merchant, why is the boy fortunate?"
        answer: "HE NOW HAS (NOT ONLY ONE BUT) TWO DOGS"
  - tossup:
      question: "What use of the Ablative case is found in the following sentence: <latin>Aurēlia magnā cum audāciā ante mīlitem stābat.</latin>"
      answer: "MANNER"
    boni:
      - question: "What use of the Ablative case is found in this sentence: <latin>Lūcius celeriter ē forō cucurrit.</latin>"
        answer: "PLACE FROM WHICH"
      - question: "What use of the Ablative case can be found in this sentence: <latin>Medicō multa bāsia ā fēminīs dantur quod valdē pulcher est.</latin>"
        answer: "(PERSONAL) AGENT"
  - tossup:
      question: "Who helped to build the walls of Thebes by playing his lyre to charm the stones and wood into doing the work themselves?"
      answer: "AMPHION"
    boni:
      - question: "Whose wife, named Thebe, was honored when the city was re-named Thebes?"
        answer: "ZETHUS'"
      - question: "Whom had Amphion married, a union that resulted in tragedy?"
        answer: "NIOBE"
  - tossup:
      question: "During the reign of which emperor did Lycia, Thrace, Mauretania, and Britain become Roman provinces?"
      answer: "CLAUDIUS"
    boni:
      - question: "Whom did Claudius appoint to lead the Roman invasion of Britain in 43 AD, successfully defeating the British chieftain Caratacus, and becoming the first governor of Britain?"
        answer: "(AULUS) PLAUTIUS"
      - question: "What Brigantian queen defeated and handed over Caratacus to the Romans?"
        answer: "CARTIMANDUA"
  - tossup:
      question: "Make <latin>is, ea, id</latin> agree with the noun form <latin>nōmen</latin>."
      answer: "<latin>ID</latin>"
    boni:
      - question: "Make <latin>is, ea, id</latin> agree with the noun form <latin>domus</latin>."
        answer: "<latin>EA</latin>"
      - question: "Make <latin>is, ea, id</latin> agree with the noun form <latin>astra</latin>."
        answer: "<latin>EA</latin>"
  - tossup:
      question: "What peasant from Dalmatia rose through the ranks of the military and, after becoming emperor, instituted the system of government known as the tetrarchy, which divided imperial power amongst four men?"
      answer: "(C. AURELIUS VALERIUS) DIOCLETIAN(US)"
    boni:
      - question: "In what year did Diocletian abdicate the throne, becoming the first emperor not to die in power?"
        answer: "305 AD"
      - question: "During the formation of the tetrarchy, whom did Diocletian appoint as his second in command to take over as emperor of the east after Diocletian's retirement?"
        answer: "(GAIUS) GALERIUS (VALERIUS MAXIMIANUS)"
  - tossup:
      question: "<latin>Dēscrībāmus nunc proprietātēs dictiōnum in hāc sententiā:   Hoc certāmen ā nōbīs vincētur. Quō cāsū est “nōbīs”?</latin>"
      answer: "<latin>ABLĀTĪVŌ</latin>"
    boni:
      - question: "<latin>Cuius vōcis est “vincētur”?</latin>"
        answer: "<latin>PASSĪVAE</latin>"
      - question: "<latin>Nunc dīc mihi Anglicē</latin> : <latin>haec certāmina ā nōbīs vincentur</latin>."
        answer: "THESE CONTESTS / CERTAMENS / CERTAMINA / CAGE-MATCHES WILL BE WON BY US"
  - tossup:
      question: "What baby girl was hurled on a spear across a river by her father to keep her safe and then grew to be a fierce, Volscian warrior?"
      answer: "CAMILLA"
    boni:
      - question: "Who eventually killed Camilla?"
        answer: "ARRUNS"
      - question: "Who was her husband?"
        answer: "NO ONE (SHE WAS A VIRGIN FOLLOWER OF DIANA)"
  - tossup:
      question: "Differentiate in meaning between <latin>volō, volāre</latin>, and <latin>volō, velle</latin>."
      answer: "<latin>VOLĀRE –</latin> FLY; <latin>VELLE -</latin> WISH"
    boni:
      - question: "Differentiate in meaning between <latin>haereō</latin> and <latin>hauriō</latin>."
        answer: "<latin>HAEREŌ -</latin> STICK / CLING; <latin>HAURIŌ -</latin> DRAIN / DRINK"
      - question: "Differentiate in meaning between <latin>unda</latin> and <latin>unde</latin>."
        answer: "<latin>UNDA –</latin> WAVE; <latin>UNDE -</latin> WHENCE / FROM WHERE"
  - tossup:
      question: "For the verb <latin>intellegō</latin>, give the 3rd person singular pluperfect active indicative."
      answer: "<latin>INTELLĒXERAT</latin>"
    boni:
      - question: "Change <latin>intellēxerat</latin> to the Future Perfect."
        answer: "<latin>INTELLĒXERIT</latin>"
      - question: "Make <latin>intellēxerit</latin> plural."
        answer: "<latin>INTELLĒXERINT</latin>"
  - tossup:
      question: "What Thracian king, because of his military aid to Pandion, received the hand of Pandion’s daughter, Procne, in marriage?"
      answer: "TEREUS"
    boni:
      - question: "Into what bird was Philomela, the unfortunate sister of Procne, transformed?"
        answer: "NIGHTINGALE / SWALLOW"
      - question: "Into what bird was Tereus transformed?"
        answer: "HOOPOE"
  - tossup:
      question: "Say in Latin: The general fell from his horse."
      answer: "<latin>DUX / IMPERĀTOR / PRĪNCEPS DĒ EQUŌ (SUŌ) CECIDIT / DĒCIDIT</latin>"
    boni:
      - question: "Now say in Latin: Caesar swam to the shore very quickly."
        answer: "<latin>CAESAR AD RĪPAM / ŌRAM / LĪTUS CELERRIMĒ NĀVIT / NATĀVIT</latin>"
      - question: "Finally, say in Latin: All of the soldiers standing on the shore happily laughed."
        answer: "<latin>OMNĒS MĪLITĒS IN RĪPĀ / ŌRĀ / LĪTORE STANTĒS LAETĒ / FĒLĪCITER (DĒ)RĪSĒRUNT. (laetī</latin> and <latin>fēlīcēs</latin> in the Nominative also work.<latin>)</latin>"
  - tossup:
      question: "At what event in ancient Rome would you likely see a person wearing a <latin>flammeum</latin><title>,</title> <latin>nōdus Herculāneus</latin>, and <latin>tunica rēcta</latin>?"
      answer: "WEDDING"
    boni:
      - question: "In a wedding, what was the Latin term for the matron of honor?"
        answer: "<latin>PRŌNUBA</latin>"
      - question: "What was the Latin term for the bridal procession during which the bride was formally taken to the husband’s house?"
        answer: "<latin>DĒDUCTIŌ</latin>"
  - tossup:
      question: "Which of the following is NOT a part of the body: <latin>gena, genū, nāsus, manus, māne.</latin>"
      answer: "<latin>MĀNE</latin>"
    boni:
      - question: "Which of the following is NOT an animal: <latin>unguis, testūdō, vacca, cunīculus, avis</latin>."
        answer: "<latin>UNGUIS</latin>"
      - question: "Which of the following CANNOT be a Latin adverb: <latin>vix, bōs, diū, clam, bene</latin>?"
        answer: "<latin>BŌS</latin>"
  - tossup:
      question: "The verb <latin>gerō</latin> has numerous derivatives in English. What derivative of <latin>gerō</latin> means “to mention or introduce for consideration or possible action”?"
      answer: "SUGGEST"
    boni:
      - question: "What derivative of <latin>gerō</latin> means “the use of the movement or position of a part of the body to express thought or emotion”?"
        answer: "GESTURE / GESTICULATION"
      - question: "What derivative of <latin>gerō</latin> means “to convert food in the alimentary canal into absorbable form for assimilation into the system”?"
        answer: "DIGEST"
  - tossup:
      question: "What maiden, the daughter of Alcinoüs and a native of Scheria, discovered Odysseus washed up on her shore?"
      answer: "NAUSICAÄ"
    boni:
      - question: "What goddess saved Odysseus with her veil when Poseidon had wrecked his craft just off the shore of Scheria?"
        answer: "LEUCOTHEA"
      - question: "What had Leucothea's previous, mortal identity been?"
        answer: "INO"
