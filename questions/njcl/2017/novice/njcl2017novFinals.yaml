tournament: "NJCL Certamen"
year: 2017
division: "Novice"
round: "Finals"
questions:
  - tossup:
      question: "What gift did Hephaestus craft for the wedding of Cadmus and Harmonia that ultimately led to the ruination of their dynasty?"
      answer: "(GOLDEN) NECKLACE"
    boni:
      - question: "What terrible gift did he make for his mother in retaliation for her casting him away?"
        answer: "A CHAIR / THRONE THAT TRAPS THE PERSON WHO SITS ON IT"
      - question: "According to the Iliad, who cared for Hephaestus after he was thrown out of heaven by Hera?"
        answer: "EURYNOME / THETIS"
  - tossup:
      question: "Complete the following analogy: <latin>dīcō : dīxī :: opprimō : ________</latin> ?"
      answer: "<latin>OPPRESSĪ</latin>"
    boni:
      - question: "Complete the following analogy: <latin>dīcō : dīcit :: mālō : _______</latin> ?"
        answer: "<latin>MĀVULT</latin>"
      - question: "Complete the following analogy: <latin>dīcō : dīcēns :: eō : _______</latin> ?"
        answer: "<latin>IĒNS</latin>"
  - tossup:
      question: "From this list of Latin nouns, <latin>ferrum, flamma, fūmus, flōs,</latin> and <latin>frūmentum</latin>, which am I describing? <latin>est materia quā arma facta sunt. saepe verbum alium est quod gladium significat.</latin>"
      answer: "<latin>FERRUM</latin>"
    boni:
      - question: "From this list of Latin nouns, <latin>gladius, grātiae, genū, gēns,</latin> and <latin>genus</latin>, which am I describing? <latin>hominem ambulāre adiuvat. pars crūris est.</latin>"
        answer: "<latin>GENŪ</latin>"
      - question: "From this list of Latin nouns, <latin>tempus, templum, terra, thermae,</latin> and <latin>tempestas</latin>, which am I describing?  <latin>hominibus nocēre potest, sed nōn vīvit. in terrā aut aquā accidit. saepe ventīs fulminibusque dēlet.</latin>"
        answer: "<latin>TEMPESTĀS</latin>"
  - tossup:
      question: "What English adjective, meaning \"no longer in general use\" is derived from the Latin verb <latin>soleō</latin>?"
      answer: "OBSOLETE / OBSOLESCENT"
    boni:
      - question: "What English adjective, meaning \"gloomy\" or \"ill-humored\" is derived from the Latin adjective s<latin>ōlus?</latin>"
        answer: "SULLEN"
      - question: "What English noun, meaning \"a small number of persons assigned to a task\" is derived from the Latin adjective <latin>quattuor</latin>?"
        answer: "SQUAD(RON)"
  - tossup:
      question: "Whose refusal to compromise on his views of Roman political behavior could arguably be cited as one of the major causes of the Republic's fall, as his refusal to bend on even small or symbolic gestures, such as granting Pompey a triumph after his conquests, led Pompey to join Caesar and Crassus in the First Triumvirate?"
      answer: "CATO THE YOUNGER"
    boni:
      - question: "Cato's moral intransigence again backfired when he acted as the head prosecutor for Clodius Pulcher's trial during the Bona Dea Scandal. Once Clodius was elected to the tribunate in 58 BC, Cato was sent away to govern what province under the pretense that Cato was the only man honorable enough to oversee a province so far from Rome?"
        answer: "CYPRUS"
      - question: "In keeping with his often Stoic sensibilities, Cato committed suicide in what city following Caesar's victory at Thapsus?"
        answer: "UTICA"
  - tossup:
      question: "Which of the sentences in the visual contains a word in the vocative case?"
      answer: "2"
    boni:
      - question: "Which two sentences contain neuter nouns?"
        answer: "3 and 5"
      - question: "Which sentence contains an impersonal verb?"
        answer: "4"
  - tossup:
      question: "What fisherman was transformed into a merman after eating some strange herbs?"
      answer: "GLAUCUS"
    boni:
      - question: "What maiden did Glaucus love?"
        answer: "SCYLLA"
      - question: "Who was responsible for Scylla’s transformation into a terrible monster?"
        answer: "CIRCE"
  - tossup:
      question: "What name was given to the massive public crypts used for storage of urns?"
      answer: "<latin>COLUMBĀRIUM / COLUMBARIA</latin>"
    boni:
      - question: "The great number of dead contained in these <latin>columbāria</latin> required them to be ordered systematically by rows and columns, both of which received specific names. Provide the name given to either the rows or the columns of the <latin>columbāria</latin>."
        answer: "ROWS: <latin>GRADŪS</latin>   COLUMNS: <latin>ŌRDINĒS</latin>"
      - question: "What Latin word denoted a tomb with no body in it?"
        answer: "<latin>CENOTAPHIUM</latin>"
  - tossup:
      question: "Give the other proper name by which Aeneas calls Dido, the Carthaginian queen."
      answer: "ELISSA"
    boni:
      - question: "Name Dido's brother."
        answer: "PYGMALION"
      - question: "What was the name of Dido’s childhood nurse?"
        answer: "BARCE"
  - tossup:
      question: "Listen carefully to the conclusion of the saga of a boy and his dogs, which I will read twice; then answer the question that follows IN ENGLISH <latin>Puer, cupiēns grātiās agere mercātōrī quī canem eī reddiderat, ad templum Mercuriī revēnit. Hīs verbīs auxilium ā deō petīvit: “Mercātōrem invenīre volō. Adiuvā mē!” Subitō statua deī, vōce mercātōris, respondit, “Ō puer fidēlis, eram ego, deus Mercurius, quī canem tibi reddidī quod canem tuum magnopere amās.” Puer attonitus laetissimē domum recurrere coepit. Euge!</latin> Question: For what did the boy ask Mercury?"
      answer: "HELP <emphasis>TO FIND THE MERCHANT</emphasis>"
    boni:
      - question: "What unexpected response did the statue give?"
        answer: "THAT MERCURY AND THE MERCHANT WERE ONE AND THE SAME / THAT IT WAS MERCURY (IN THE GUISE OF A MERCHANT) WHO RETURNED THE DOG"
      - question: "Why did Mercury give the boy’s dog back?"
        answer: "BECAUSE THE BOY LOVED HIS DOG (GREATLY) (prompt for “who he” on “he loved his dog”)"
  - tossup:
      question: "Give the comparative and superlative forms for the neuter adjective <latin>malum</latin>."
      answer: "<latin>PĒIUS, PESSIMUM</latin>"
    boni:
      - question: "Give the comparative and superlative forms for the adverb <latin>sānē</latin>."
        answer: "<latin>SĀNIUS, SĀNISSIMĒ</latin>"
      - question: "Give the comparative and superlative forms for the adjective <latin>anxius</latin>."
        answer: "<latin>MAGIS ANXIUS, MAXIMĒ ANXIUS</latin>"
  - tossup:
      question: "Who received the governorship of Lusitania in exchange for his wife, Poppaea Sabina, whom Nero took as second wife?"
      answer: "(M. SALVIUS) OTHO"
    boni:
      - question: "Name Nero's first wife, whom Nero exiled in order to 'make room' for Poppaea Sabina."
        answer: "OCTAVIA"
      - question: "Nero's marriage with Poppaea Sabina was short-lived. Rather than deal with the paperwork of an exile, he decided that killing her would be far more efficient. Sabina's sudden and violent death paved the way for whom to become Nero's final wife?"
        answer: "STATILIA MESSALINA"
  - tossup:
      question: "What is the case and use of the pronoun in the following sentence: <latin>Ad thermās herī mēcum ambulābās.</latin>"
      answer: "ABLATIVE ACCOMPANIMENT"
    boni:
      - question: "What is the case and use of the pronoun in the following sentence? <latin>Cūr nōbīs invident?</latin>"
        answer: "DATIVE SPECIAL VERBS / COMPOUND VERBS"
      - question: "What use of the Ablative case is found in this sentence: <latin>Deō volente, nostra potestās crēscet.</latin>"
        answer: "ABSOLUTE"
  - tossup:
      question: "What monstrous dog, child of Typhon and Echidna, helped Eurytion guard Geryon's cattle?"
      answer: "ORTH(R)US / ORTHRYS"
    boni:
      - question: "What loyal hound helped Erigone find her father's grave?"
        answer: "MAERA"
      - question: "What magical, amazing canine never missed his quarry, until the day he pursued the un-catchable Teumessian fox?"
        answer: "LAELAPS"
  - tossup:
      question: "In what modern country was the province of <latin>Cilicia</latin> located?"
      answer: "TURKEY"
    boni:
      - question: "What modern country's northern territory comprises what was once the Roman province of <latin>Mauretania Caesariēnsis</latin>?"
        answer: "ALGERIA"
      - question: "What two modern countries overlap with the land the Romans knew as <latin>Sarmatia</latin>?"
        answer: "UKRAINE AND RUSSIA"
  - tossup:
      question: "Say in Latin: I was not easily able to breathe."
      answer: "<latin>FACILE SPĪRĀRE NŌN POTERAM / POTUĪ / NEQUĪBAM / NEQUĪVĪ</latin>"
    boni:
      - question: "Using only four words, now say in Latin: Publius, you are laughing with me, aren’t you?"
        answer: "<latin>PUBLĪ, NŌNNE MĒCUM RĪDĒS?</latin>"
      - question: "And finally, say in Latin: We who are about to win salute you."
        answer: "(<latin>NŌS) VICTŪRĪ/-AE / SUPERĀTŪRĪ/-AE TĒ / VŌS SALŪTĀMUS</latin>"
  - tossup:
      question: "Name one of the Graeae."
      answer: "ENYO / PAMPHREDO / DEINO"
    boni:
      - question: "Name one of the daughters of Anius and Dorippe also known as the Oenotropae."
        answer: "ELAIS / SPERMO / OINO"
      - question: "Name one of the Pleiades:"
        answer: "MAIA / ALCYONE / ASTEROPE / CELAENO / TAYGETE / ELECTRA / MEROPE"
  - tossup:
      question: "Translate the following sentence into English: <latin>cupiditās pecūniae fūrem rapere coēgit</latin>."
      answer: "THE DESIRE OF / FOR MONEY COMPELLED THE THIEF TO STEAL"
    boni:
      - question: "Now translate: <latin>Pontificēs plūs argentī retinēre nōlēbant.</latin>"
        answer: "THE PRIESTS DID NOT WANT TO KEEP / RETAIN MORE SILVER / MONEY"
      - question: "Now translate: <latin>Vīgintī virginēs virtūtem quam vim voluerant.</latin>"
        answer: "(THE) TWENTY MAIDENS HAD WANTED VIRTUE / COURAGE  RATHER THAN POWER / VIOLENCE"
  - tossup:
      question: "Whose elevation to the position of <latin>magister mīlitum</latin> during Theodosius' reign placed him in an ideal position to seize an enormous amount of power during the reign of Theodosius' son, Honorius, who had him beheaded?"
      answer: "STILICHO"
    boni:
      - question: "Stilicho served as a key military officer during Theodosius' victory at what battle that gave the emperor uncontested control over the entire empire?"
        answer: "FRIGIDUS RIVER"
      - question: "What king of the Visigoths did Stilicho agree to pay a hefty ransom in 406 AD despite defeating the man in two battles a few years prior?"
        answer: "ALARIC"
  - tossup:
      question: "What derivative from a Latin verb meaning “to turn” means “to announce or praise a product or service in some public medium of communication in order to induce people to buy or use it?”"
      answer: "ADVERTISE"
    boni:
      - question: "What derivative from the same root means “a dizzying sensation of tilting within stable surroundings or of being in tilting or spinning surroundings?”"
        answer: "VERTIGO"
      - question: "What derivative from the same root means “a total separation or disunion?”"
        answer: "DIVORCE"
