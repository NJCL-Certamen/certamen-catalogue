tournament: "NJCL Certamen"
year: 2018
division: "Advanced"
round: "Round 3"
questions:
  - tossup:
      question: "What pair of brothers in mythology received the greatest gift mortals could obtain—death in their sleep—after they carried their mother from Argos to a festival honoring Hera?"
      answer: "CLEOBIS and BITON"
    boni:
      - question: "Who was the mother of Cleobis & Biton?"
        answer: "CYDIPPE"
      - question: "According to one version of the story, Agamedes and Trophonius were also rewarded with eternal sleep after they built the temple of Apollo at Delphi.  These two are also credited with building the treasury of what king, whom they subsequently robbed?"
        answer: "HYRIEUS"
  - tossup:
      question: "Using one word, complete the following analogy: <latin>lūna : lūnula :: castrum : _____</latin>"
      answer: "<latin>CASTELLUM</latin>"
    boni:
      - question: "Using one word, complete the following analogy: <latin>lūna : lūnula:: corpus : ____</latin>"
        answer: "<latin>CORPUSCULUM</latin>"
      - question: "Using one word, complete the following analogy: <latin>lūna : lūnula:: oculus : ____</latin>"
        answer: "<latin>OCELLUS</latin>"
  - tossup:
      question: "For the verb <latin>tondeō</latin>, give the third person singular, pluperfect active subjunctive."
      answer: "<latin>TOTONDISSET</latin>"
    boni:
      - question: "Make <latin>totondisset</latin> passive."
        answer: "<latin>TŌNSUS ESSET</latin>"
      - question: "Now say “you may be shaven,” using <latin>tondeō.</latin>"
        answer: "<latin>TONDEĀRIS / TONDEĀMINĪ</latin>"
  - tossup:
      question: "Where in a wealthy patron’s house would his clients gather to receive their <latin>sportula</latin>?"
      answer: "<latin>VESTIBULUM / ĀTRIUM</latin>"
    boni:
      - question: "What was the Latin term for the entrance doorway, not the door, of the house through which one entered into the <latin>vestibulum</latin> courtyard?"
        answer: "<latin>ŌSTIUM</latin> (NOT <latin>IANUA</latin> or <latin>FORĒS</latin>, that’s the door itself)"
      - question: "What important part of a <latin>confarreātiō</latin> began in the <latin>vestibulum</latin>?"
        answer: "<latin>DĒDUCTIŌ</latin> / BRIDAL PROCESSION"
  - tossup:
      question: "What author from Rudiae compared knowing Latin, Greek, and Oscan to having three hearts?"
      answer: "(Q.) ENNIUS"
    boni:
      - question: "What Roman author helped Ennius get to Rome?"
        answer: "(M. PORCIUS) CATO THE ELDER / CENSOR / <latin>CĒNSORĪNUS / MĀIOR</latin>"
      - question: "What <latin>fābula praetexta</latin> of Naevius celebrates the military exploits of Fulvius Nobilior?"
        answer: "<title><latin>AMBRACIA</latin></title>"
  - tossup:
      question: "What author’s suicide, according to Tacitus, was marked by starts and stops on a whim along with the recitation of light verse with some friends, mirroring the light subject matter of his novel, the <title>Satyricon</title>?"
      answer: "PETRONIUS (ARBITER)"
    boni:
      - question: "What nouveau riche freedman hosts a disgustingly lavish dinner in a part of what survives of the <title>Satyricon</title>?"
        answer: "TRIMALCHIO"
      - question: "What character narrates the <title>Satyricon</title>?"
        answer: "ENCOLPIUS"
  - tossup:
      question: "Give the future passive infinitive of the verb <latin>sciō</latin>, meaning “to be about to be known.”"
      answer: "<latin>SCĪTUM ĪRĪ</latin>"
    boni:
      - question: "Make <latin>scītum īrī</latin> active."
        answer: "<latin>SCĪTŪRUS/A/UM ESSE</latin>"
      - question: "Make <latin>scītūra esse</latin> perfect tense."
        answer: "<latin>SCĪVISSE</latin>"
  - tossup:
      question: "Translate the following sentence into English: <latin>Aedīlēs tot mūnera ēdidērunt ut aerārium vacuārent</latin>."
      answer: "THE AEDILES PRESENTED SO MANY GLADIATORIAL SHOWS / GAMES THAT THEY EMPTIED THE TREASURY"
    boni:
      - question: "Translate this sentence: <latin>Peregrīnātōrēs veritī sunt nē in mūrēs ā muliere scelestā mūtārentur</latin>."
        answer: "THE TRAVELERS FEARED THAT THEY WOULD BE CHANGED INTO MICE BY THE EVIL WOMAN"
      - question: "Translate this sentence: <latin>Puella lepida in spēluncā latet nē rēgīna fiat</latin>."
        answer: "THE CHARMING  GIRL HIDES / IS LYING HIDDEN IN A CAVE (IN ORDER/SO THAT SHE) NOT TO BE MADE QUEEN / LEST SHE BE MADE QUEEN"
  - tossup:
      question: "What Lydian outlaw forced passers-by to till his vineyard until he was killed by Heracles?"
      answer: "SYLEUS ("
    boni:
      - question: "Please list by letter these images, which have to do with another adventure Heracles engaged in between labors, in chronological order."
        answer: "D, B, A, C"
      - question: "Identify the god that Heracles has just successfully defeated in a wrestling match at the time of the image labelled C."
        answer: "THANATOS"
  - tossup:
      question: "Who refused to listen to Mucianus and marched his army of just under 50,000 troops to a stunning victory over a numerically superior army at the second Battle of Cremona?"
      answer: "(ANTONIUS) PRIMUS"
    boni:
      - question: "Although Vitellius was the presiding emperor whom Primus was seeking to overthrow, his side of the battle was actually led by what two men, whose previous victories had allowed Vitellius to seize the throne?"
        answer: "(FABIUS) VALENS and (A.) CAECINA (ALIENUS)"
      - question: "After defeating Valens and Caecina, Primus marched on Rome with a plan to capture the city and hold it for Vespasian while the future emperor marched his army from what province to Rome?"
        answer: "EGYPT"
  - tossup:
      question: "What Latin verb lies at the root of the English word \"jester\"?"
      answer: "<latin>GERŌ / GERERE</latin>"
    boni:
      - question: "What is the meaning of the English adjective \"ineluctable\"?"
        answer: "INESCAPABLE, ETC."
      - question: "What is the 4th principal part of the verb at the root of the English adjective “lugubrious\"?"
        answer: "<latin>LŪCTUS (-A / -UM)</latin>"
  - tossup:
      question: "What native Greek speaker from Antioch served in the army of Julian the Apostate before taking up the pen and earning the epithet “the last great Roman Historian”?"
      answer: "AMMIANUS MARCELLINUS"
    boni:
      - question: "Ammianus' <title><latin>Rēs Gestae</latin></title> picks up where what earlier historian's work leaves off?"
        answer: "(CORNELIUS) TACITUS"
      - question: "What emperor's death ends the <title><latin>Rēs Gestae</latin></title>?"
        answer: "VALENS'"
  - tossup:
      question: "According to Ovid, Caenis and Iphis shared what unusual transformation?"
      answer: "CHANGED SEX / GENDER"
    boni:
      - question: "What god violated Caenis, prompting her to ask to be changed into a man?"
        answer: "NEPTUNE"
      - question: "Iphis’ transformation was for a different reason, however—Isis changed her into a man to allow her to marry what girl from Phaestus?"
        answer: "IANTHE"
  - tossup:
      question: "Please listen to the following passage, which I shall read twice; then answer the question that  \t\tfollows in English: \t\t<latin>lēgātus improbus, postquam ad castra pervēnit, pecūniā et dōnīs īnfimōs mīlitum \t\tiūvābat. cum veterēs centuriōnēs, sevērōs tribūnōs dēmōvisset, locaque eōrum clientibus  \t\tsuīs attribuisset, dēsidiam in castrīs et mīlitēs lascīvientēs per agrōs sinēbat.</latin>  (repeat) \tThe question:  Name one of the things that caused the wicked leader to help the most disreputable  \t\tof the soldiers."
      answer: "BRIBERY / (GENEROUS) GIFTS / LARGESS / MONEY"
    boni:
      - question: "What two types of people in the legion did the commander remove?"
        answer: "OLD/VETERAN CENTURIONS & STRICT TRIBUNES"
      - question: "Name one of the things that this wicked commander allowed his soldiers to do."
        answer: "IDLENESS / BEING IDLE IN THE CAMP // RUNNING WILD / BEING NAUGHTY THROUGH THE FIELDS"
  - tossup:
      question: "Despite his defeats at Verona and Pollentia, what leader was able to invade central Italy and pull off an act unprecedented in the time of the Empire, the sacking of Rome?"
      answer: "ALARIC"
    boni:
      - question: "Alaric’s successful invasion is often attributed to the emperor Honorius’s decision to execute what capable military leader and advisor, who had previously defeated Alaric at the two aforementioned battles?"
        answer: "STILICHO"
      - question: "During the sack of Rome, Alaric captured what sister of Honorius, which led to a lengthy search and rescue mission that only succeeded years later?"
        answer: "(GALLA) PLACIDIA"
  - tossup:
      question: "What author's tongue was so sharp that Fulvia, the wife of Marc Antony, stuck a pin through it when his severed head was brought to the Rostra?"
      answer: "(M. TULLIUS) CICERO'S"
    boni:
      - question: "In which of his works did Cicero expound in three books his conception of the best way to live, behave, and observe moral obligations?"
        answer: "<title><latin>DĒ OFFICIĪS</latin></title>"
      - question: "What work of Cicero contains the <title><latin>Somnium Scīpiōnis</latin></title>?"
        answer: "<title><latin>DĒ RĒ PŪBLĪCĀ</latin></title>"
  - tossup:
      question: "What English noun or adjective meaning \"an assistant\" is derived from the Latin verb <latin>iuvō, iuvāre</latin>?"
      answer: "ADJUTANT / ADJUVANT"
    boni:
      - question: "What English noun or adjective meaning “ear-piercingly noisy” is derived from the Latin verb <latin>strīdō, strīdere</latin>?"
        answer: "STRIDENT"
      - question: "What English noun meaning “free time” is derived from the Latin verb <latin>licēre</latin>?"
        answer: "LEISURE"
  - tossup:
      question: "<latin>Quid Anglicē significat “trāiciō?”</latin>"
      answer: "THROW ACROSS / PASS OVER / PIERCE / CROSS"
    boni:
      - question: "<latin>Quid Anglicē significat “trānō?”</latin>"
        answer: "SWIM ACROSS/OVER/THROUGH"
      - question: "Name a deponent verb that means “to walk across”."
        answer: "<latin>TRĀNSGREDIOR</latin>"
  - tossup:
      question: "What god was worshipped on the island of Dia in the form of a meteorite, had a sacred dragon at the spring of Dirce in Thebes, and protected the grove where the Golden Fleece was kept?"
      answer: "ARES"
    boni:
      - question: "What hero killed Ares’ dragon at Thebes and was forced to serve the god for eight years?"
        answer: "CADMUS"
      - question: "Ares also gives his name to what hill in Athens, where he was acquitted during the first ever murder trial?"
        answer: "AREOPAGUS"
  - tossup:
      question: "The suspicious ineptitude of Lucius Opimius and Calpurnius Bestia led which Roman tribune to declare that members of the Roman military and government were in the pocket of Jugurtha?"
      answer: "(C.) MEMMIUS"
    boni:
      - question: "Investigations into Jugurtha’s actions in Numidia came after he massacred a group of Roman citizens during the sack of what city?"
        answer: "CIRTA"
      - question: "Whom did the Romans send to capture Jugurtha immediately after he declared that Rome was “a city for sale and doomed to quick destruction, if it should find a buyer”?"
        answer: "(SP.) POSTUMIUS ALBINUS"
