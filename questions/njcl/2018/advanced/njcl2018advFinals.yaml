tournament: "NJCL Certamen"
year: 2018
division: "Advanced"
round: "Finals"
questions:
  - tossup:
      question: "According to Ovid’s <title>Metamorphoses</title>, what early Roman praetor was told that if he entered the city and showed off his newly-acquired horns, he would become king, but refused and went into self-imposed exile?"
      answer: "CIPUS"
    boni:
      - question: "Just before this, Ovid tells the story of what first Etruscan prophet, who supposedly arose from a  \t\tmound of dirt?"
        answer: "TAGES"
      - question: "Just after this, Ovid tells the story of what god, whom the Romans imported from Epidaurus to save themselves from a plague?"
        answer: "AESCULAPIUS"
  - tossup:
      question: "<latin>Comāna</latin>, <latin>Sinōpē</latin>, <latin>Tarsus</latin>, and <latin>Ephesus</latin> were all ancient cities which would now be located in what modern country?"
      answer: "TURKEY"
    boni:
      - question: "<latin>Segōvia</latin>, <latin>Emporiae</latin>, <latin>Mālaga</latin>, and <latin>Tarraco</latin> were all ancient cities which would now be located in what modern day country?"
        answer: "SPAIN"
      - question: "<latin>Lambaesis</latin>, <latin>Caesarēa</latin>, <latin>Madaurus</latin>, and <latin>Hippō</latin> <latin>Rēgius</latin> were all ancient cities which would now be located in what modern day country?"
        answer: "ALGERIA"
  - tossup:
      question: "<latin>Respondē Latīnē: Nunc dē parte ōrātiōnis loquimur quae capit partem verbī et partem adiectīvī.  Ōdī, ōdisse. Dīc mihi fōrmam participiī futūrī.</latin>"
      answer: "<latin>ŌSŪRŪS /-A /-UM</latin>"
    boni:
      - question: "Now, using your best Latin grammar, and using the verb <latin>coepī</latin>, say in Latin, “The question began to be doubted.”"
        answer: "<latin>QUAESĪTUM / INTERROGĀTUM DUBITĀRĪ COEPTUM EST</latin>"
      - question: "<latin>Quam perītī estis Latīnē loquendī! Nunc dīc mihi verbum dēfectīvum quod Anglicē significat “Get outta here!” sed ōrīgine et nātūrā est verbum Graecum.</latin>"
        answer: "<latin>APAGE</latin>"
  - tossup:
      question: "What Greek speaking native of Alexandria wrote an <title><latin>Epithalamium</latin></title> and the <title><latin>Fescennīna</latin></title> for the marriage of the emperor Honorius, but is best known for attacking the enemies and praising the accomplishments of his patron, Stilicho?"
      answer: "(CLAUDIUS) CLAUDIAN(US)"
    boni:
      - question: "Name one of the two works of Claudian that mercilessly ridiculed ministers of the Eastern emperor, Arcadius, who were enemies of Stilicho?"
        answer: "<title><latin>IN RŪFĪNUM / IN EUTROPIUM</latin></title>"
      - question: "What poem of Claudian may have been inspired by Alaric's destruction of Eleusis in 396 AD?"
        answer: "<title><latin>RAPTUS PRŌSERPINAE / DĒ RAPTŪ PRŌSERPINAE</latin></title>"
  - tossup:
      question: "What two men, although born almost four hundred years apart, both rose up the ranks of the Roman military only to rebel, one against Sulla and the restoration government, one against the tetrarchy, and found opposition states only to be assassinated by their seconds-in-command, Perperna and Allectus?"
      answer: "SERTORIUS and CARAUSIUS"
    boni:
      - question: "Although Perperna was Sertorius’ second-in-command for administrative purposes, Sertorius did not trust Perperna as a military general and instead relied on what other lieutenant of his to fight Metellus Pius while Sertorius himself combatted Pompey?"
        answer: "(L.) HIRTULEIUS"
      - question: "Although Hirtuleius had little success against Pius, Sertorius was able to defeat Pompey several times, most famously at what battle, in which the two men reportedly fought in hand to hand combat?"
        answer: "LAURO (RIVER)"
  - tossup:
      question: "Identify by letter the image that depicts a scene from a work written by a man from Madaura who also had to defend himself from a charge of witchcraft."
      answer: "C"
    boni:
      - question: "What is being discussed in the poem of Juvenal depicted in image A?"
        answer: "THE PROPER WAY TO COOK A (GIGANTIC) FISH / TURBOT ("
      - question: "What author's work is depicted in image D, an excerpt of which has been provided to you on the additional visual page?"
        answer: "(M. ANNAEUS) LUCAN(US)'S"
  - tossup:
      question: "What mythological object belonged variously to Demophon, who carried it off from Phalerum in a raid, to Ilus, who took its arrival as a propitious omen for his city’s foundation, and to Diomedes, who stole it during the Trojan War and so enabled Troy’s fall?"
      answer: "PALLADIUM"
    boni:
      - question: "What woman clung to the Palladium to avoid Zeus’ embraces, causing him to fling it from heaven and drop it right in front of Ilus’ tent?"
        answer: "ELECTRA"
      - question: "Name the citadel of Troy, in which the Palladium had a place of honor thereafter."
        answer: "PERGAMUM / PERGAMON"
  - tossup:
      question: "Translate the following sentence into English: <latin>Ārātōribus ad opus redīre recūsantibus, segetēs in agrīs putrēscēbant</latin>."
      answer: "SINCE THE PLOWMEN WERE REFUSING TO RETURN TO THEIR WORK, THE CROPS WERE ROTTING IN THE FIELDS."
    boni:
      - question: "Translate this sentence: <latin>Utinam anguis ingēns eōs nōn perterruisset</latin>!"
        answer: "IF ONLY A HUGE SNAKE HAD NOT FRIGHTENED THEM!"
      - question: "Translate this sentence: <latin>Vīlicus dominō prō certō adfirmāvit servōs probōs poenās nōn datūrōs</latin>."
        answer: "THE OVERSEER ASSURED THE MASTER / CONFIRMED AS CERTAIN TO THE MASTER THAT THE HONEST SLAVES WOULD NOT BE PUNISHED"
  - tossup:
      question: "What English adjective from a Latin word meaning “hair” means “untidy or disarranged”?"
      answer: "DISHEVELED"
    boni:
      - question: "What English verb from a Latin word meaning “footstep” means “examine or study”?"
        answer: "INVESTIGATE"
      - question: "What English adjective from a Latin word meaning “scale” means “covered with scales”?"
        answer: "SQUAMATE"
  - tossup:
      question: "Express in Latin the fraction one-sixth."
      answer: "<latin>SEXTA PARS</latin> / <latin>SEXTĀNS</latin>"
    boni:
      - question: "Using one Latin word, express the fraction five-twelfths."
        answer: "<latin>QUĪNCUNX</latin>"
      - question: "Using one Latin word, express the fraction two-thirds."
        answer: "<latin>BĒS</latin>"
  - tossup:
      question: "When he asked the seer Phrasius how to end a famine, what son of Lysianassa was advised to sacrifice a stranger to Zeus each year, and carried out the policy successfully until he tried to sacrifice Heracles, who killed him and his son?"
      answer: "BUSIRIS"
    boni:
      - question: "Name this son of Busiris, who seems to have been in the wrong place, at the wrong time, with the wrong father."
        answer: "AMPHIDAMAS / IPHIDAMAS"
      - question: "Busiris had also sent a band of pirates to abduct what group of sisters, whom Heracles was on his way to visit as he came to Busiris’ kingdom?"
        answer: "HESPERIDES"
  - tossup:
      question: "Distinguish in meaning between <latin>taenia</latin> and <latin>taeda</latin>."
      answer: "<latin>TAENIA</latin> – BAND/FILLET, <latin>TAEDA</latin> – TORCH"
    boni:
      - question: "Distinguish in meaning between <latin>vōmer</latin> and <latin>vomō</latin>."
        answer: "<latin>VŌMER –</latin> PLOWSHARE, <latin>VOMŌ</latin> - VOMIT"
      - question: "Distinguish in meaning between <latin>rūga</latin> and <latin>rūgiō</latin>."
        answer: "<latin>RŪGA –</latin> WRINKLE, <latin>RŪGIŌ</latin> – BELLOW"
  - tossup:
      question: "What pupil of Antiochus of Ascalon and Aelius Stilo wrote several Menippean Satires between 81 and 67 BC of which we have 90 titles and 600 fragments?"
      answer: "(M. TERENTIUS) VARRO (REATINUS / OF REATE)"
    boni:
      - question: "Whom did Varro fight for in one of the civil wars of the period?"
        answer: "(CN.) POMPEY / POMPEIUS (MAGNUS)"
      - question: "What work on famous Romans and Greeks did Varro finish in 39 BC?"
        answer: "<title><latin>HEBDOMADĒS (VEL DĒ IMĀGINIBUS) / IMĀGINĒS</latin></title>"
  - tossup:
      question: "Listen to the following passage, adapted from Book 2 of Livy right after the expulsion of Tarquin, which I will read twice; then answer the questions that follow in ENGLISH \t\t<latin>Līberōrum Rōmānōrum iam hinc rēs pāce bellōque gestās, imperiaque lēgum potentiōra quam hominum peragam. Superbia ultimī rēgis fēcerat ut haec nova lībertās esset laetior, nam priōrēs rēgēs ita rēgnārunt ut in numerō patrum urbis habērentur.</latin> Question: According to the passage, what had made Romans’ new freedom more pleasing ?"
      answer: "THE ARROGANCE / PRIDE OF THE LAST / PREVIOUS KING"
    boni:
      - question: "Again, according to the passage, what became more powerful as a result of Tarquin’s expulsion / laws ?"
        answer: "THE RULE OF LAW (RATHER THAN THE RULE OF MEN)"
      - question: "What do we learn about the previous rulers in the last sentence of the passage?"
        answer: "THEY WERE CONSIDERED TO BE FOUNDERS OF THE CITY / COUNTRY"
  - tossup:
      question: "The strange foreign policy decisions Rome made in Asia Minor throughout the 2nd century BC, such as not taking any territory in the Treaty of Apamea, are perhaps owed to the influence of what Pergamene ruler, who had assisted the Romans throughout the Seleucid War?"
      answer: "EUMENES II"
    boni:
      - question: "Whom did Rome send to invade Galatia in 189 BC, a decision which is attributed to Eumenes’ influence?"
        answer: "(CN. MANLIUS) VULSO"
      - question: "Another example of Eumenes’ influence came when what Cappadocian leader was let off lightly despite his decision to send troops to Antiochus III’s aid at Magnesia?"
        answer: "ARIARATHES"
  - tossup:
      question: "By setting up a statue of Terror and establishing a yearly festival in which children wore black and cut their hair, the Corinthians attempted to propitiate the baby-killing ghosts of what two brothers, whom they had had stoned when their mother, Medea, fled from Corinth?"
      answer: "MERMERUS and PHERES"
    boni:
      - question: "The Corinthians claimed to have stoned the brothers because they brought a poisoned robe to what woman?"
        answer: "GLAUCE / CREÜSA"
      - question: "According to some stories, however, Mermerus was killed by what kind of creature after he followed his father to Corcyra?"
        answer: "LION(ESS)"
  - tossup:
      question: "What dramatic genre was sometimes used as an <latin>exodium</latin>, or follower, to a tragedy and sometimes involved parodies of tragedies along with stock characters such as the <latin>Pappus</latin>, <latin>Dossenus</latin>, <latin>Maccus</latin>, and <latin>Bucco</latin>?"
      answer: "ATELLAN FARCE / (<latin>FĀBULAE) ATELLĀNA(E)</latin>"
    boni:
      - question: "What was the role of the stock character referred to as <latin>Maccus</latin>?"
        answer: "THE FOOL / CLOWN"
      - question: "Name one of the principal exponents of Atellan Farce during its peak in the time of Sulla?"
        answer: "(L.) POMPONIUS / NOVIUS"
  - tossup:
      question: "What Latin word would be added to the noun <latin>pāvō</latin> to designate it specifically as a peacock instead of a peahen?"
      answer: "<latin>MĀS / MASCULUS / MASCULĪNUS</latin>"
    boni:
      - question: "What Latin term is used to refer to Latin nouns such as <latin>Quīnquātrūs</latin> and <latin>optimātēs</latin>?"
        answer: "<latin>PLŪRĀLIA TANTUM</latin>"
      - question: "The heteroclite <latin>penus</latin> has forms in which declensions?"
        answer: "2ND, 3RD, & 4TH"
  - tossup:
      question: "During the reign of Septimius Severus, what tribe overran the north of England and captured Eboracum, and in the process damaged Hadrian’s Wall so badly that later historians thought the wall had been completed by Severus himself?"
      answer: "MAEATAE / CALEDONIANS / CALEDONII / PICTS"
    boni:
      - question: "Who was the governor of Britain at the time, who managed to drive them out of Eboracum and back north of Hadrian’s Wall?"
        answer: "VIRIUS LUPUS"
      - question: "Who did Septimius Severus appoint to repair the damaged portions of Hadrian’s wall, a task which took two years to complete?"
        answer: "(LUCIUS ALFENUS) SENECIO"
  - tossup:
      question: "What Latin noun derived from the Latin word for ‘milk’ is a leafy vegetable that is often used in salads?"
      answer: "<latin>LACTŪCA</latin>"
    boni:
      - question: "What Latin verb derived from a Latin word meaning ‘people’ means ‘to destroy’ or ‘plunder’?"
        answer: "<latin>(DĒ)POPULOR /-ĀRĪ</latin>"
      - question: "What Latin noun derived from a Latin verb meaning ‘be numb’ or ‘amazed’ means ‘an illicit affair, dishonor’?"
        answer: "<latin>STUPRUM</latin>"
