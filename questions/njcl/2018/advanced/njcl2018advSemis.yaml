tournament: "NJCL Certamen"
year: 2018
division: "Advanced"
round: "Semifinals"
questions:
  - tossup:
      question: "What four-word legal phrase means, “Ignorance of the law is not an excuse”?"
      answer: "<latin>IGNŌRANTIA IŪRIS NŌN EXCŪSAT / IGNŌRANTIA LĒGIS NŌN EXCŪSAT /  \tIGNŌRANTIA LĒGIS NĒMINEM EXCŪSAT /  \t\t\tIGNŌRANTIA IŪRIS NĒMINEM EXCŪSAT / \t\t\tNĒMŌ CĒNSĒTUR IGNŌRĀRE LĒGEM</latin>"
    boni:
      - question: "Above the age of 10, a child who has committed a crime may be treated as an adult.  Give the two-word Latin phrase that can be used to describe this situation where the child is being treated as an adult for his crime."
        answer: "<latin>DOLĪ CAPĀX</latin>"
      - question: "Give the Latin and English for the abbreviation <latin>sec. reg.</latin>"
        answer: "<latin>SECUNDUM RĒGULAM</latin> - ACCORDING TO THE RULE"
  - tossup:
      question: "Name the Roman general who, at the first Battle of Tapae, defeated the Dacian king Decebalus."
      answer: "(L.) TETTIUS JULIANUS"
    boni:
      - question: "What Roman governor of Moesia, along with a legion, was annihilated by Decebalus in 85 AD?"
        answer: "OPPIUS SABINUS"
      - question: "What Prefect of the Praetorian Guard was killed in battle in 86 AD fighting against Decebalus?"
        answer: "(CORNELIUS) FUSCUS"
  - tossup:
      question: "What name in mythology is shared by a son of Endymion who won a footrace for the rule of Elis and a Phocian leader who built the Trojan Horse with the aid of Athena?"
      answer: "EPEIUS"
    boni:
      - question: "What brother of the Elean Epeius lost the footrace but took over the rule of Elis when Epeius died childless before being banished to the land of the Curetes for an accidental killing?"
        answer: "AETOLUS"
      - question: "In Book 23 of the <title>Iliad</title>, the latter Epeius defeated what son of Mecisteus in the boxing match at the funeral games of Patroclus?"
        answer: "EURYALUS"
  - tossup:
      question: "<latin>Dēscrībāmus nunc proprietātēs dictiōnum in hāc sententiā:  Cēdant arma togae, concēdat laurea linguae.  Cūius modī est “concēdat?”</latin>"
      answer: "<latin>SUBIŪNCTĪVĪ / CONIŪNCTĪVĪ</latin>"
    boni:
      - question: "<latin>In eādem sententiā: Cēdant arma togae, concēdat laurea linguae. Quō cāsū est “linguae?”</latin>"
        answer: "<latin>DATĪVŌ</latin>"
      - question: "<latin>Dīc praenōmen, nōmen, cognōmenque auctōris illīus sententiae.</latin>"
        answer: "<latin>MARCUS TULLIUS CICERO</latin>"
  - tossup:
      question: "What author’s <title><latin>Hamartigenia</latin></title>, <title><latin>Peristephanon</latin></title>, <title><latin>Psychomachia</latin></title> and <title><latin>Cathemerinon,</latin></title> among other poems, earned him recognition as one of the greatest ancient Christian poets?"
      answer: "(AURELIUS) PRUDENTIUS (CLEMENS)"
    boni:
      - question: "In what Spanish town was Prudentius born?"
        answer: "CALAGURRIS / CALAHORRA"
      - question: "What native of Burdigala and pupil of Ausonius was the only other ancient Christian poet with a reputation close to that of Prudentius?"
        answer: "PAULINUS (OF NOLA)"
  - tossup:
      question: "Consider this quote: “We the members of the Junior Classical League, covenant to hand on the torch of classical civilization to the modern world.”  What Latin verb, with what meaning, is the ultimate root of the English noun “torch”?"
      answer: "<latin>TORQUEŌ / -ĒRE</latin> - TO TWIST"
    boni:
      - question: "The English word “toilet” is derived from what Latin noun with what meaning?"
        answer: "<latin>TĒLA</latin> – A WEB"
      - question: "Give the Latin verb and its meaning from which we derive “farce”?"
        answer: "<latin>FARCIŌ, FARCĪRE</latin> – TO STUFF / CRAM"
  - tossup:
      question: "What type of wall facing was formed by arranging the square side of pyramid-shaped blocks in a  \t\tnet-like pattern?"
      answer: "<latin>OPUS RĒTICULĀTUM</latin>"
    boni:
      - question: "Of what specific type of limestone were these blocks typically made?"
        answer: "TUFA / TUFF"
      - question: "What is the Latin term for a wall constructed of squared stone blocks laid in parallel rows?"
        answer: "<latin>OPUS QUADRĀTUM</latin>"
  - tossup:
      question: "Listen to the following passage about Eumenes, which I will read twice; then answer the question  \t\tthat follows in ENGLISH: <latin>Eumenēs intellegēbat, sī cōpiae suae cognōssent adversus quōs dūcerentur, eās nōn ītūrās esse.  Itaque hoc eī vīsum est prūdentissimum, ut dēviīs itineribus mīlitēs dūceret, in quibus vēra audīre nōn possent.  Eumenēs igitur prius proelium committere cōnstituit quam mīlitēs suī scīrent quibuscum pugnārent.</latin>  (repeat) \tThe question:  What was the fear of Eumenes?"
      answer: "THAT HIS TROOPS WON’T GO IF THEY KNEW AGAINST WHOM THEY WERE \t\t\tBEING LED"
    boni:
      - question: "Why did Eumenes decide to lead his soldiers with circuitous routes ?"
        answer: "SO THAT THEY \t\t\tWON’T FIND OUT THE TRUTH // SO THAT THEY WON’T FIND OUT ABOUT THE \t\t\tENEMY // IT SEEMED MOST SENSIBLE/PRUDENT TO HIM"
      - question: "Once they had reached the enemy, what did Eumenes decide to do before his soldiers discovered with whom they were fighting?"
        answer: "TO ENGAGE IN BATTLE"
  - tossup:
      question: "What Greek equivalent of the Roman Fortuna was said to be one of the Fates?"
      answer: "TYCHE"
    boni:
      - question: "What minor Roman goddess, sometimes associated with the Greek Enyo, was said to be the wife of Mars?"
        answer: "NERIO / BELLONA"
      - question: "What Italian spring nymph was originally worshipped on the banks of the Numicus before having her cult moved to Rome with a spring dedicated to her in the <latin>Forum Rōmānum</latin>?"
        answer: "JUTURNA"
  - tossup:
      question: "<title><latin>Librī Rērum Memoriā Dignārum</latin></title>, <title><latin>Dē Obscūrīs Catōnis</latin></title>, and <title><latin>Dē Verbōrum Significātū</latin></title> were all works of what author who also served as the tutor of Augustus' grandchildren?"
      answer: "VERRIUS FLACCUS"
    boni:
      - question: "The <title><latin>Dē Verbōrum Significātū</latin></title> is lost, but we know some of the content of the work from the abridgment made by what grammarian in the 2nd or 3rd century AD?"
        answer: "(SEXTUS POMPEIUS) FESTUS"
      - question: "For what work did Ovid use Flaccus extensively?"
        answer: "<title><latin>FASTĪ</latin></title>"
  - tossup:
      question: "Identify by number the home province of the emperor Diocletian, Dalmatia."
      answer: "7"
    boni:
      - question: "What number corresponds with the province of Noricum?"
        answer: "5"
      - question: "What number corresponds with the province of Galatia?"
        answer: "10"
  - tossup:
      question: "Using the verb <latin>impediō</latin>, say in Latin:  No one is preventing you from doing this."
      answer: "<latin>NĒMŌ (TĒ / VŌS) IMPEDIT QUŌMINUS / QUĪN / NĒ (TŪ/VŌS) HOC FACIĀS / FACIĀTIS // NĒMŌ IMPEDIT TĒ / VŌS HOC FACERE</latin>"
    boni:
      - question: "Using an impersonal verb, say in Latin:  This concerns both you and all the Roman citizens."
        answer: "<latin>(HOC) ET TUĀ / VESTRĀ ET OMNIUM RŌMĀNŌRUM CĪVIUM REFERT / INTEREST</latin>"
      - question: "Say in Latin:  There was no doubt that you had done this."
        answer: "<latin>NŌN DUBIUM ERAT / FUIT QUĪN HOC/ID FĒCISSĒ(TI)S // NĒMŌ DUBITĀVIT QUĪN HOC/ID FĒCISSĒ(TI)S</latin>"
  - tossup:
      question: "Give the forms used for the comparative and superlative of <latin>frūgī.</latin>"
      answer: "<latin>FRŪGĀLIOR, FRŪGĀLISSIMUS</latin>"
    boni:
      - question: "Give the forms used for the comparative and superlative of <latin>dē.</latin>"
        answer: "<latin>DĒTERIOR, DĒTERRIMUS</latin>"
      - question: "Give the forms used for the comparative and superlative of <latin>magnificus.</latin>"
        answer: "<latin>MAGNIFICENTIOR, MAGNIFICENTISSIMUS</latin>"
  - tossup:
      question: "In the <title>Aeneid</title>, a contingent of one-shoed slingers from Praeneste was led by which of Turnus’ allies, who supposedly was conceived when a spark flew into his mother’s lap?"
      answer: "CAECULUS"
    boni:
      - question: "What king, whom Vergil describes as “despiser of the gods,” came to Turnus’ aid with his son Lausus?"
        answer: "MEZENTIUS"
      - question: "Name Turnus’ Marruvian ally—a priest who could make snakes fall asleep and cure their bites."
        answer: "UMBRO"
  - tossup:
      question: "What figure of speech besides assonance, consonance, and alliteration can be found in this quotation from Silius Italicus: “<latin>reservāvit Dardanus arcēs / ductor Agenoreas</latin>”?"
      answer: "SYNCHYSIS"
    boni:
      - question: "What figure of speech besides assonance, consonance, and alliteration can be found in this quotation from Cicero: “<latin>Tandem aliquandō, Quirītēs, Lūcium Catilīnam fūrentem audāciā, scelus anhēlantem, pestem patriae nēfāriē molientem… ex urbe… ēmīsimus</latin>”?"
        answer: "ASYNDETON / TRICOLON (CRESCENS)"
      - question: "What figure of speech besides assonance, consonance, and alliteration can be found in this quotation from Vergil: “<latin>intonuēre polī, et crēbrīs micat ignibus aethēr</latin>”?"
        answer: "HYSTERON PROTERON"
  - tossup:
      question: "<latin>Forās, dicam,</latin> and <latin>spontis</latin> are all Latin nouns that are found only in two cases.  What is the grammatical term for these nouns?"
      answer: "DIPTOTE(S) (PROMPT ON DEFECTIVE)"
    boni:
      - question: "What similar grammatical term is used to categorize <latin>diciōnis</latin>?"
        answer: "TETRAPTOTE(S)"
      - question: "The verbs <latin>petessō</latin> and <latin>arcessō</latin> belong to what specific category of verbs?"
        answer: "INTENSIVES / MEDITATIVES"
  - tossup:
      question: "What <latin>nōmen</latin> was shared by the two brothers who were responsible for the passage of a law that allowed plebeians to enter the priestly colleges in 300 BC?"
      answer: "OGULN(E)IUS"
    boni:
      - question: "Approximately fifty years after the passage of the <latin>Lēx Ogulneia,</latin> what man became the first plebeian to become <latin>Pontifex Maximus</latin>?"
        answer: "(TI.) CORUNCANIUS"
      - question: "Coruncanius’ ascension to the office of Pontifex Maximus came an entire century after what man was chosen as the first plebeian dictator?"
        answer: "(C. MARCIUS) RUTILUS"
  - tossup:
      question: "Of the verbs <latin>complector, cōnspicor, coörior, cōnsequor</latin>, and <latin>colloquor</latin>, which is described by the following Latin sentence: <latin>Hoc verbum, quod significat animadvertere, prīmae coniugātiōnis est</latin>."
      answer: "<latin>CŌNSPICOR</latin>"
    boni:
      - question: "<latin>Cōnsequor: Dīc imperātīvum huius verbī, tempore praesentī, singulāriter</latin>."
        answer: "<latin>CŌNSEQUERE</latin>"
      - question: "<latin>Cōnsequere: verte in tempus futūrum</latin>"
        answer: "<latin>CŌNSEQUITOR</latin>"
  - tossup:
      question: "What mythological group was advised to proceed via “the narrows” and “in the third crop” in its invasion of the Peloponnesus, but met initial disappointment in recovering the birthright of its progenitor, the son of Alcmene, from the descendants of Eurystheus?"
      answer: "HERACLIDS"
    boni:
      - question: "What son of Heracles and Melite led the first assault of the Heraclids upon the Peloponnesus?"
        answer: "HYLLUS"
      - question: "When the Heraclids eventually did conquer the Peloponnesus in the third generation, what city was ruled by Procles and Eurysthenes?"
        answer: "SPARTA / LACEDAEMON"
  - tossup:
      question: "What author wrote “<latin>poēmata</latin>” about gastronomy, a <title><latin>Concilium Deōrum</latin></title>, and a journey to Sicily, and inspired later poets such as Persius and Horace?"
      answer: "(C.) LUCILIUS"
    boni:
      - question: "When Horace imitated Lucilius’ journey to Sicily, what was <title>his</title> literary destination?"
        answer: "BRUNDISIUM"
      - question: "What Campanian town was Lucilius’ birthplace?"
        answer: "SUESSA AURUNCA"
