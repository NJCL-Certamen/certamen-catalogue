tournament: "NJCL Certamen"
year: 2018
division: "Novice"
round: "Finals"
questions:
  - tossup:
      question: "What hero defeated the Amazons, the Solymi, and a lion-headed, goat-bodied, serpent-tailed monster at Iobates’ insistence?"
      answer: "BELLEROPHON / HIPPONOÜS"
    boni:
      - question: "What object did Athena give to Bellerophon to help him tame Pegasus?"
        answer: "(MAGICAL) GOLDEN BRIDLE / HARNESS (PROMPT ON “BRIDLE”)"
      - question: "Bellerophon received this golden bridle in a dream after what seer suggested that he sleep at the altar of Athena?"
        answer: "POLYEIDUS"
  - tossup:
      question: "In April of this year, a column in the New York Times was titled “Get set to lose your ‘collusion’ delusions.” Give the Latin verb and its meaning from which we derive the words “collusion” and “delusion.”"
      answer: "<latin>LŪDŌ –</latin> PLAY, RIDICULE"
    boni:
      - question: "From what Latin noun with what gender and meaning do we derive “impeach”?"
        answer: "<latin>PĒS</latin>, MASCULINE - FOOT"
      - question: "From what Latin verb with what meaning do we derive “prosecution”?"
        answer: "<latin>(PRO)SEQUOR</latin> – FOLLOW, PURSUE"
  - tossup:
      question: "What tense and voice of the participle is found in the abbreviation <latin>Q E F</latin>?"
      answer: "FUTURE PASSIVE"
    boni:
      - question: "Now give the Latin and English for that phrase."
        answer: "<latin>QUOD ERAT FACIENDUM</latin> – (THAT) WHICH WAS / HAD TO BE DONE"
      - question: "What is the grammatical term for this type of phrase, where the future passive participle is combined with a form of <latin>sum</latin>, <latin>esse</latin>?"
        answer: "PASSIVE / 2nd PERIPHRASTIC / GERUNDIVE OF OBLIGATION (& PROPRIETY)"
  - tossup:
      question: "What governor of Syria, acting on the false rumor of the death of Marcus Aurelius, proclaimed himself emperor in 175 AD?"
      answer: "(C.) AVIDIUS CASSIUS"
    boni:
      - question: "What woman, the wife of Marcus Aurelius, was alleged to have encouraged the rebellion of Avidius Cassius?"
        answer: "(ANNIA GALERIA) FAUSTINA THE YOUNGER"
      - question: "What honorific title did Marcus Aurelius earn for defeating the Iazyges, before he was forced to make a hasty peace agreement due to the insurrection of Avidius Cassius?"
        answer: "SĀRMATICUS"
  - tossup:
      question: "What Titan found time to father the Hyades, the Pleiades, and Calypso despite his full-time job holding up the sky?"
      answer: "ATLAS"
    boni:
      - question: "Which of the Pleiades was the mother of Hermes?"
        answer: "MAIA"
      - question: "Which of the Pleiades is said to be the dimmest in the constellation out of shame for being the only of her sisters to marry a mere mortal, Sisyphus?"
        answer: "MEROPE"
  - tossup:
      question: "One of the states that borders Ohio is West Virginia.  Give the Latin and the English for the state motto of West Virginia."
      answer: "<latin>MONTĀNĪ SEMPER LĪBERĪ</latin> – MOUNTAINEERS ARE ALWAYS FREE"
    boni:
      - question: "Another state that borders Ohio is Michigan.  Please give both the Latin & the English for the state motto of Michigan."
        answer: "<latin>SĪ QUAERIS P(A)ENĪNSULAM AMOENAM, CIRCUMSPICE</latin> – IF YOU SEEK A PLEASANT PENINSULA, LOOK ABOUT / AROUND YOU"
      - question: "The motto on the seal of Xavier University, which is located in Cincinnati, is “<latin>Vīdit mīrābilia magna</latin>.” Translate that motto."
        answer: "(S)HE SAW GREAT / BIG MIRACLES / MIRACULOUS THINGS"
  - tossup:
      question: "Consider the sentence:  <latin>discipulī semper grātiam beneficī magistrōrum habēre dēbent.</latin>  This sentence contains two uses of the genitive case. Identify those two Latin nouns and their respective case usages."
      answer: "<latin>BENEFICĪ</latin> – OBJECTIVE & <latin>MAGISTRŌRUM</latin> - POSSESSION"
    boni:
      - question: "In the sentence, <latin>“meus frater est paulō altior quam mē altitūdine</latin>,” identify all the words that are in the ablative and the respective usage of the ablative case for each word."
        answer: "<latin>PAULŌ</latin> – DEGREE OF DIFFERENCE & <latin>ALTITŪDINE</latin> – RESPECT/SPECIFICATION"
      - question: "In the sentence, <latin>“ūnum annum mē cōnsulem creāre cōnstituērunt”,</latin> identify all the nouns in the  \t\taccusative case and identify the respective usage of the accusative case for each noun."
        answer: "<latin>ANNUM</latin> – DURATION OF TIME & <latin>MĒ CŌNSULEM</latin> – PREDICATE ACCUSATIVE / DOUBLE ACCUSATIVE"
  - tossup:
      question: "Give the Latin term for a slave who, in a reversal of the typical Roman social order, was called <latin>dominus</latin> by a wealthy Roman boy, whom he accompanied to and from school?"
      answer: "<latin>PAEDAGŌGUS</latin>"
    boni:
      - question: "What slave carried a student’s books?"
        answer: "<latin>PEDISEQUUS / PEDISEQUĪ</latin>"
      - question: "What Latin term describes the rhetorical exercise in which a student assumed the character of a historical figure and made a speech about taking a course of action?"
        answer: "<latin>SUĀSŌRIA(E)</latin>"
  - tossup:
      question: "Using the verb <latin>faveō,</latin> translate into Latin: The queen, whom the citizens were supporting, will win."
      answer: "<latin>RĒGĪNA, CUI CĪVĒS FĀVĒBANT, VINCET</latin>"
    boni:
      - question: "Now say in Latin:  We walked from Brundisium to Rome within thirty days."
        answer: "<latin>AMBULĀVIMUS / AMBULĀBĀMUS (EX URBE) BRUNDISIŌ</latin> <latin>(AD URBEM) RŌMAM TRĪGINTĀ DIĒBUS</latin>"
      - question: "Using an ablative absolute and the idiom <latin>ōrātiōnem habēre</latin>, translate into Latin:  The queen was  \t\tattacked after the speech was delivered."
        answer: "<latin>ŌRĀTIŌNE HABITĀ, RĒGĪNA OPPUGNĀTA EST / OPPUGNĀBĀTUR</latin>"
  - tossup:
      question: "What Megarian seer enjoyed such renown in Greece that Agamemnon personally came to his house and begged him to come to Troy?"
      answer: "CALCHAS"
    boni:
      - question: "Following the Trojan War, Calchas died of a broken heart after losing to what seer in a contest?"
        answer: "MOPSUS"
      - question: "In that contest, Mopsus correctly predicted the precise number of figs on a fig tree and the correct number of offspring to be borne by what kind of animal?"
        answer: "SOW / PIG"
  - tossup:
      question: "You may now open your visual, Identify by letter and name which one of these lovely busts does not represent an emperor of Rome?"
      answer: "B"
    boni:
      - question: "Identify by letter and name the figure who died last?"
        answer: "C"
      - question: "Who is pictured in the bust labeled A, who held lavish <latin>Lūdī</latin> <latin>Saeculārēs</latin> to celebrate a most momentous occasion in Rome’s history."
        answer: "PHILLIP (THE ARAB)"
  - tossup:
      question: "In mythology, into what bird were Cycnus and Zeus both transformed, Cycnus as he mourned Phaëthon and Zeus as he pursued Leda?"
      answer: "SWAN"
    boni:
      - question: "Zeus also transformed into a swan to pursue what goddess, whom he seduced with Aphrodite’s help?"
        answer: "NEMESIS"
      - question: "According to Aeschylus’ <title>Prometheus Bound</title>, what one-eyed, one-toothed trio were shaped like swans?"
        answer: "GRAEAE / GRAY WOMEN / PHORCIDES"
  - tossup:
      question: "Early in the first century BC, the armies of both Lucius Porcius Cato and Quintus Servilius Caepio were defeated by what Marsic chieftain during the Social War?"
      answer: "(Q.) POPPAEDIUS SILO"
    boni:
      - question: "Poppaedius Silo was later defeated and killed by what Roman commander in 88 BC?"
        answer: "(Q.) CAECILIUS METELLUS PIUS"
      - question: "What Samnite noble commanded the rebel Italians on the Southern front of the Social War until his eventual defeat at the hands of Sulla?"
        answer: "(C.) PAPIUS MUTILUS"
  - tossup:
      question: "Translate the following sentence into English: <latin>Domō vēnit et tum rūs īvit</latin>."
      answer: "HE CAME FROM HOME AND THEN WENT TO THE COUNTRY"
    boni:
      - question: "Translate this sentence into Latin:  We fought against the barbarians for two years."
        answer: "<latin>DUŌS ANNŌS CONTRĀ BARBARŌS PUGNĀBĀMUS / PUGNĀVIMUS</latin>"
      - question: "Translate this sentence into Latin: In the third hour, we will read about horses and  \t\tanimals."
        answer: "<latin>TERTIĀ HŌRĀ, LEGĒMUS DĒ EQUĪS ET ANIMĀLIBUS</latin>"
  - tossup:
      question: "From what Latin verb with what meaning do we ultimately derive “conference”?"
      answer: "<latin>FERŌ</latin> - BEAR, CARRY"
    boni:
      - question: "What English noun, also derived from “<latin>ferō,</latin>” means “an outcry”?"
        answer: "VOCIFERATION or VOCIFERANCE"
      - question: "What English adjective, also derived from “<latin>ferō,</latin>” means troublesome, annoying, or even pernicious?"
        answer: "PESTIFEROUS"
  - tossup:
      question: "Listen to the following passage, which I will read twice; then answer the questions that follow in LATIN \t\t<latin>Cicerō, cōnsul factus, Catilīnae coniūrātiōnem singulārī virtūte compressit. Catilīna metū cōnsulis Rōmā profūgit ; sociī ēius in carcere necātī sunt. Senātus populusque Rōmānus Cicerōnem patrem patriae appellāvit.</latin> Question: <latin>Cūr Catilīna Rōmā profūgit?</latin>"
      answer: "<latin>METUIT / METŪ / PROPTER METUM (CŌNSULIS) // \t\t\tTIMUIT / VERITUS EST (CŌNSULEM)</latin>"
    boni:
      - question: "<latin>Ubi sociī mortuī sunt?</latin>"
        answer: "<latin>IN CARCERE</latin>"
      - question: "<latin>Quō nōmine Cicerō posteā appellātus est?</latin>"
        answer: "<latin>PATER / PATRE PATRIAE</latin>"
  - tossup:
      question: "Many of the Argonauts had talents which proved crucial on the voyage. For instance, what Argonaut was chosen to find a way past the Clashing Rocks because he was swift enough to run across waves?"
      answer: "EUPHEMUS"
    boni:
      - question: "What Argonaut killed Amycus, king of the Bebryces, by employing his skill in boxing?"
        answer: "POLYDEUCES / POLLUX"
      - question: "Which of the Argonauts had such keen vision that he could see even what was hidden in the earth?"
        answer: "LYNCEUS"
  - tossup:
      question: "Change <latin>tōta difficilis multitūdō</latin> to the genitive singular."
      answer: "<latin>TŌTĪUS DIFFICILIS MULTITŪDINIS</latin>"
    boni:
      - question: "Change <latin>tōtīus difficilis multitūdinis</latin> to the dative singular."
        answer: "<latin>TŌTĪ DIFFICILĪ MULTITŪDINĪ</latin>"
      - question: "Change <latin>tōtī difficilī multitūdini</latin> to the nominative plural."
        answer: "<latin>TŌTAE DIFFICILĒS MULTITŪDINĒS</latin>"
  - tossup:
      question: "<latin>Dēscrībāmus nunc propriētātēs dictiōnum in hāc sententiā: “caecī sunt oculī, cum animus aliās rēs agit”.  quae pārs ōrātiōnis est “caecī”?</latin>"
      answer: "<latin>ADIECTĪVUM</latin>"
    boni:
      - question: "<latin>Dēscrībāmus nunc propriētātēs dictiōnum in hāc sententiā: “Mārcia Mārcusque multa mūnera mīsērunt”. quā persōnā est verbum in illā sententiā?</latin>"
        answer: "<latin>TERTIĀ (PERSŌNĀ)</latin>"
      - question: "<latin>Dēscrībāmus nunc propriētātēs dictiōnum in hāc sententiā” “Nūlla rēs agitur”.  quō tempore est verbum in illā sententiā?</latin>"
        answer: "<latin>PRAESENTE / PRAESENTĪ</latin>"
  - tossup:
      question: "What type of person in ancient Rome would you see wearing a tunica <latin>lātī</latin> <latin>clāvī</latin>, which was adorned with wide crimson stripes?"
      answer: "SENATOR"
    boni:
      - question: "What type of tunic had sleeves that extended down to the wrists?"
        answer: "<latin>TUNICA(E) MANICĀTA(E)</latin>"
      - question: "What term describes a long tunic which fell to the ankles?"
        answer: "<latin>TUNICAE TĀLĀRĒS // TUNICA TĀLĀRIS</latin>"
