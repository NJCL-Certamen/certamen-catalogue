tournament: NJCL Certamen
year: 2019
division: Advanced
round: Round 1
questions:
  - tossup:
      question: "What Roman king secured a reliable supply of salt for Rome by founding Ostia on the Tyrrhenian coast?"
      answer: "ANCUS MARCIUS"
    boni:
      - question: "What wooden bridge was built during Ancus’ reign to facilitate travel to Ostia?"
        answer: "PONS SUBLICIUS"
      - question: "What group of priests, charged with declaring war, did Ancus found?"
        answer: "<latin>FĒTIĀLĒS</latin>"
  - tossup:
      question: "Translate into English: “<latin>īra fūror</latin> brevis est.</latin>”"
      answer: "ANGER IS A BRIEF (TEMPORARY) MADNESS (RAGE) // THERE IS A BRIEF RAGE IN / BECAUSE OF ANGER // IRE IS A BRIEF FUROR"
    boni:
      - question: "Translate this other quotation from Horace: “<latin>exēgī</latin> monumentum aere perennius.</latin>”"
        answer: "I HAVE BUILT A MONUMENT MORE LASTING THAN BRONZE"
      - question: "Translate this quotation from Horace: “<latin>nīl mortālibus arduī</latin> est.</latin>”"
        answer: "NOTHING IS DIFFICULT FOR MORTALS"
  - tossup:
      question: "What Latin poet of the first century B.C. was rumored to have been driven to insanity by a love potion but is more well known for rendering the <latin><title>Peri Physeos</title></latin> of Epicurus into a six-book Latin epic poem, <title><latin>Dē Rērum Nātūrā</latin></title>?"
      answer: "(T.) LUCRETIUS (CARUS)"
    boni:
      - question: "To whom was Lucretius’s <title><latin>Dē Rērum Nātūrā</latin></title> addressed?"
        answer: "(C.) MEMMIUS"
      - question: "According to Roman tradition, which later Latin author assumed the <latin>toga virīlis</latin> in 55 B.C., the same year that Lucretius died?"
        answer: "(P.) VERGIL(IUS) (MARO)"
  - tossup:
      question: "<latin>Respondē</latin> aut <latin>Anglicē</latin> aut <latin>Latīnē</latin>: <latin>quī prīnceps futūrus dormīvit</latin> per <latin>mūsicam Nerōnis</latin> et erat pater <latin>duōrum imperātōrum aliōrum</latin><latin>?"
      answer: "(T. FLAVIUS) VESPASIANUS / VESPASIAN"
    boni:
      - question: "<latin>Respondē</latin> aut <latin>Anglicē</latin> aut Latine: <latin>quō Nerō Vespasiānum mīsit</latin>?"
        answer: "<latin>(AD) JUDAEAM / TO JUDAEA</latin>"
      - question: "<latin>Respondē</latin> aut <latin>Anglicē</latin> aut <latin>Latīnē</latin>: quae erant <latin>nōmina fīliōrum Vespasiānī quī ambō imperātōrēs factī</latin> sunt?</latin>"
        answer: "<latin>TITUS (FLAVIUS VESPASIANUS) ET DOMITIANUS</latin> / TITUS & DOMITIAN"
  - tossup:
      question: "<latin>Quid Anglicē significat nōnnumquam</latin>?"
      answer: "SOMETIMES / NOT NEVER"
    boni:
      - question: "<latin>Quid Anglicē significat nōnnūsquam</latin>?"
        answer: "SOMEWHERE / NOT NOWHERE"
      - question: "<latin>Quid Anglicē significat nōnnūllī</latin>?"
        answer: "SOME / SEVERAL / NOT NONE"
  - tossup:
      question: "What goddess refused marriage with both Poseidon and Apollo, preferring to remain a virgin and tend to the home and the hearth?"
      answer: "HESTIA"
    boni:
      - question: "Hestia normally received a prefatory offering during feasts and sacrifices, but in Book XIV of the <title>Odyssey</title>, what swineherd begins a feast for his master Odysseus and spurns any offering to Hestia?"
        answer: "EUMAEUS"
      - question: "Hestia’s story is similar to what daughter of Asopus, who, when asked by Zeus for her greatest wish, replied “I wish to remain a virgin.”"
        answer: "SINOPE"
  - tossup:
      question: "From what Latin noun with what meaning are the English words bugle, beef, and bovine all derived?"
      answer: "<latin>BŌS</latin> - OX / COW"
    boni:
      - question: "From what Latin noun with what meaning do we get the English words chivalry and cavalry?"
        answer: "<latin>CABALLUS</latin> - HORSE"
      - question: "From what Latin noun with what meaning do we get the English words acre and pilgrim?"
        answer: "<latin>AGER</latin> – FIELD"
  - tossup:
      question: "<latin>Respondē</latin> aut <latin>Anglicē</latin> aut <latin>Latīnē</latin>: Ubi <latin>Rōmānī mīmōs, cuneōs, saltātōrēs</latin>, et scaenam <latin>vidēbant</latin>?"
      answer: "<latin>(IN) THEĀTRŌ // AD / APUD THEĀTRUM</latin> // (IN / AT) THE THEATER // <latin>(IN) FĀBULĀ RĪCĪNIĀTĀ</latin> / (IN A) MIME (IF ONLY “<latin>THEĀTRUM</latin>” IS GIVEN PROMPT FOR “MORE INFORMATION”)"
    boni:
      - question: "<latin>Respondē Latīnē</latin>: Ubi <latin>Rōmānī</latin> camillum, <latin>nōdum Herculāneum</latin>, flammeum, et farreum <latin>lībum vidēbant</latin>?"
        answer: "<latin>APUD / AD NŪPTIĀS / CŌNFARREĀTIŌNEM // IN NŪPTIĪS / CŌNFARREĀTIŌNE</latin>"
      - question: "<latin>Respondē Latīnē: Ubi Rōmānī ostreās, ōva, carnem, lēctōs, et ferculum inveniēbant</latin>?"
        answer: "<latin>AD / APUD TRICLĪNIUM // (IN) TRICLĪNIŌ</latin>"
  - tossup:
      question: "What substance was provided for the Trojan forces by Euneüs, led to the death of the Athenian Icarius, was given to Odysseus by Maron in twelve jars, and had Dionysus as its divine patron?"
      answer: "WINE"
    boni:
      - question: "The gift that Maron gave to Odysseus played a vital role in Odysseus’s interactions with which monster?"
        answer: "POLYPHEMUS"
      - question: "Two sons of Dionysus often associated with wine were Staphylus and Oenopion, his children by what woman, whom Theseus abandoned on the island of Naxos?"
        answer: "ARIADNE"
  - tossup:
      question: "A Roman inscription in Britain finishes with “<latin>Fuscō</latin> et <latin>Dextrō cōnsulibus</latin>.” Translate that."
      answer: "WHEN FUSCUS AND DEXTER / DEXTRUS WERE CONSULS // WITH FUSCUS AND DEXTER / DEXTRUS BEING CONSULS"
    boni:
      - question: "You now have 10 seconds to examine this inscription, which was found on a dedicatory slab from part of a fort in Great Chesters, England."
        answer: "What type of building was restored from the ground up, according to this dedication? GRANARY / BARN / STOREHOUSE"
      - question: "Why had the granary fallen down? FROM OLD AGE"
        answer: ""
  - tossup:
      question: "What early Latin author wrote <latin>fābulae palliātae</latin> such as <title>Tarentilla</title> as well as the seven-volume epic poem <latin><title>Bellum <latin>Pūnicum</latin></title></latin>?"
      answer: "(CN.) NAEVIUS"
    boni:
      - question: "What contemporary of Naevius served as a tutor to the family of Marcus Livius Salinator?"
        answer: "LIVIUS ANDRONICUS"
      - question: "What meter did Livius Andronicus use to translate Homer’s <title>Odyssey</title> into Latin?"
        answer: "SATURNIAN"
  - tossup:
      question: "Translate into Latin, “we heard that the soldier had fled from the field.”"
      answer: "<latin>AUDĪVIMUS / AUDIĒBĀMUS MĪLITEM</latin> CAMPUM AGRUM / <latin>Ē</latin>/<latin>Ā CAMPŌ</latin> / EX/AB <latin>AGRŌ</latin> (EF)<latin>FŪGISSE</latin>"
    boni:
      - question: "Translate into Latin, “we heard that the wagon was being brought to the fountain.”"
        answer: "<latin>AUDĪVIMUS / AUDIĒBĀMUS</latin> PLAUSTRUM / CARPENTUM / <latin>PĪLENTUM</latin> / RAEDAM / CISIUM / <latin>CARRŪCAM</latin> AD FONTEM <latin>FERRĪ</latin>"
      - question: "Translate into Latin, “we heard that the city would be captured.”"
        answer: "<latin>AUDĪVIMUS / AUDIĒBĀMUS</latin> URBEM / OPPIDUM CAPTUM <latin>ĪRĪ</latin> Or FORE UT URBS / OPPIDUM <latin>CAPERĒTUR</latin>"
  - tossup:
      question: "In the <title>Aeneid</title>, a cave with a hundred openings is home to what woman, who tells Aeneas to pluck a golden bough and serves as his guide in the Underworld?"
      answer: "CUMAEAN SIBYL / DEIPHOBË"
    boni:
      - question: "According to the <title>Aeneid</title>, the Cumaean Sibyl was the daughter of what man, who was best known as a fisherman who ate an herb that made him immortal?"
        answer: "GLAUCUS"
      - question: "Apollo’s temple at Cumae was built by what man, who according to the <title>Aeneid</title> “dared on swift wings to trust himself to the sky” while “fleeing from Minos’ realm”?"
        answer: "DAEDALUS"
  - tossup:
      question: "What author declares his hatred for the vulgar crowd in one of the most famous poems from his <title>Odes</title>?"
      answer: "(Q.) HORATIUS (FLACCUS) / HORACE"
    boni:
      - question: "Along with Sappho, what Greek poet from Lesbos was a major influence on Horace?"
        answer: "ALCAEUS"
      - question: "In what Roman military colony was Horace born?"
        answer: "VENUSIA"
  - tossup:
      question: "What is the case and reason of “Italy” in the following sentence: <latin>Iūnō</latin> classem <latin>Ītaliā longē arcēbat</latin>.</latin>"
      answer: "ABLATIVE OF SEPARATION"
    boni:
      - question: "What is the case and reason of “Italians” in the following sentence: <latin>nēmō Italōrum Rōmānōs</latin> vincere potuit.</latin>"
        answer: "PARTITIVE GENITIVE (GENITIVE OF THE WHOLE)"
      - question: "What is the case and reason of “age” in the following sentence: <latin>tertiam aetātem hominum vīvēbat</latin>."
        answer: "COGNATE ACCUSATIVE or DURATION OF TIME"
  - tossup:
      question: "Against which enemy did the Romans begin a conflict in Oscan territory when the city of Capua requested aid against marauders in 343 BC?"
      answer: "SAMNITES"
    boni:
      - question: "How many wars did the Romans fight with the Samnites?"
        answer: "3"
      - question: "Capua originally allied with Rome to play off the Romans against the Samnites, but they came to regret Roman domination of southern Italy, with what later invader did they side when all of central Italy remained with Rome?"
        answer: "HANNIBAL (BARCA) / CARTHAGE"
  - tossup:
      question: "Listen carefully to the following passage, which I will read twice, and answer IN ENGLISH the question that follows: <latin>Dārīus, rēx Persārum</latin> bellum gerere <latin>contrā Scythās volēbat</latin> sed <latin>trāns</latin> magnum <latin>flūmen</latin> exercitum <latin>trādūcere</latin> necesse erat.  <latin>Fabrīs</latin> igitur <latin>imperāvit</latin> ut pontem in <latin>flūmine</latin> facerent. <latin>Quō factō, Dārīus prīncipēs Graecōs relīquit</latin> ad pontem <latin>custōdiendum</latin>. Inter <latin>hōs</latin> erat <latin>quīdam Miltiadēs quī lībertātem Graecōrum dēfenderat</latin>.</latin> The question:  Whom did Darius order to build a bridge?"
      answer: "ENGINEERS / WORKERS / CARPENTERS / CRAFTSPEOPLE / ARTISANS"
    boni:
      - question: "Why did Darius build a bridge?"
        answer: "BECAUSE HE WANTED TO/IN ORDER TO MAKE WAR ON THE SCYTHIANS // TO CROSS THE RIVER // TO GET TO THE OTHER SIDE"
      - question: "What did Darius do after the bridge was built?"
        answer: "HE LEFT (CHIEF) GREEKS TO GUARD THE BRIDGE"
  - tossup:
      question: "“<latin>Homō</latin> sum, <latin>hūmānī nīl ā mē aliēnum putō</latin>” is a famous quote from the <latin><title>Heauton Timorumenos</title></latin> of what second century BC Latin playwright?"
      answer: "(P.) TERENTIUS/TERENCE (AFER)"
    boni:
      - question: "To what philhellenic society of authors and philosophers, which also included the Greek historian Polybius, did Terence belong?"
        answer: "SCIPIONIC CIRCLE"
      - question: "What member of the Scipionic Circle was an ancestor of Pompey and the father of Satire?"
        answer: "(C.) LUCILIUS"
  - tossup:
      question: "Built by a son of Arestor and Argeia, featuring a specific beam taken from Dodona, and originally steered by Tiphys, what ship bore dozens of heroes in their quest to retrieve the Golden Fleece?"
      answer: "ARGO"
    boni:
      - question: "That son of Arestor and Argeia was Argus, who built the ship with the help of what goddess?"
        answer: "ATHENA"
      - question: "After Tiphys’s death during the voyage of the Argonauts, what native of Miletus and son of Poseidon volunteered to steer the Argo, but was declined in favor of another?"
        answer: "ERGINUS"
  - tossup:
      question: "Which of the following English words, if any, does not come from the same Latin root as the others: measure, meticulous, commensurate, immense?"
      answer: "METICULOUS"
    boni:
      - question: "Which of the following words, if any, does not come from the same Latin root as the others: mesa, commensal, semester?"
        answer: "SEMESTER"
      - question: "From what Latin noun do we derive the English words comment and dementia?"
        answer: "<latin>MĒNS</latin>"
