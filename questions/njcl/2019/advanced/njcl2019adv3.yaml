tournament: NJCL Certamen
year: 2019
division: Advanced
round: Round 3
questions:
  - tossup:
      question: "What noun, a derivative of <latin>laedō</latin>, can be defined as “the omission of a sound or a syllable in pronunciation”?"
      answer: "ELISION"
    boni:
      - question: "What adjective, a derivative of lapis, means “having fallen into a state of disrepair or neglect”?"
        answer: "DILAPIDATED"
      - question: "What noun, a derivative of <latin>lavō</latin>, can be defined as “a severe flood”?"
        answer: "DELUGE"
  - tossup:
      question: "Who led his tribe into direct conflict with both the Eastern and Western Empires when he took over as king upon the death of his brother Bleda and led his Huns as far as Northern Italy?"
      answer: "ATTILA (THE HUN)"
    boni:
      - question: "What general, born in modern Bulgaria, defeated Attila in battle at the Catalaunian Fields but was put to death soon afterwards?"
        answer: "(FLAVIUS) AETIUS"
      - question: "As a pretext for his invasion of the Western Empire, Attila demanded marriage with what sister of the emperor Valentinian III?"
        answer: "HONORIA"
  - tossup:
      question: "What author of the later Roman Empire, known as the “father of Church song” for his contributions to the Christian musical tradition, authored a variety of works on religious subjects, including a number of homiletic commentaries on the Old Testament and a <title><latin>Dē Officiīs Ministrōrum</latin></title> that was modeled on the <title><latin>Dē Officiīs</latin></title> of Cicero?"
      answer: "(SAINT AURELIUS) AMBROSIUS/AMBROSE"
    boni:
      - question: "Ambrose had mixed relationships with a number of emperors during his tenure as the bishop of Milan.  For example, despite a generally positive rapport with Theodosius I, he made the decision to excommunicate the emperor for what offense in 390 A.D.?"
        answer: "MASSACRE OF (7,000 CITIZENS AT) THESSALONICA"
      - question: "Which follower of Arianism and prominent opponent of the Nicene creed had Ambrose replaced as bishop of Milan?"
        answer: "AUXENTIUS"
  - tossup:
      question: "According to Ovid’s Metamorphoses, what shape-shifting Roman god of fertility took the form of an old woman in order to win the love of the fruit-goddess Pomona?"
      answer: "VERTUMNUS"
    boni:
      - question: "To convince Pomona, Vertumnus warned of the perils of rejecting a suitor, recounting the tale of what Cypriot would-be couple?"
        answer: "IPHIS AND ANAXARETE"
      - question: "During his speech, Vertumnus also tells Pomona to “fear the vengeful gods, and Idalian Venus,” and what goddess “of Rhamnusia?”"
        answer: "NEMESIS"
  - tossup:
      question: "Which of the following words does NOT use the ending -a in any form? <latin>āēr, gubernātor, scelus, cornū</latin>"
      answer: "<latin>GUBERNĀTOR</latin>"
    boni:
      - question: "Which of the following words CAN NOT use the ending -im in the accusative singular?  <latin>Ignis, sanguis, vīs</latin>"
        answer: "<latin>SANGUIS</latin>"
      - question: "Which of the following words does NOT use the ending -ium in the genitive plural?  <latin>arx, caedēs, lūx, stirps</latin>."
        answer: "<latin>LŪX</latin>"
  - tossup:
      question: "What emperor’s death put Rome out of her misery when a conspiracy led by those close to him, including his mistress Marcia, succeeded in killing him on December 31, 192 AD?"
      answer: "COMMODUS"
    boni:
      - question: "The man who actually did the deed was a man named Narcissus, who was Commodus’s partner and trainer in what athletic endeavor?"
        answer: "WRESTLING"
      - question: "What sister of Commodus had attempted to overthrow him 10 years earlier?"
        answer: "LUCILLA (PROMPT ON “HIS SISTER”)"
  - tossup:
      question: "Translate the following sentence: <latin>Dummodo nē mē vituperēs, nōn lacrimābō</latin>."
      answer: "SO LONG AS / PROVIDED THAT / AS LONG AS YOU DO NOT SCOLD / CRITICIZE / YELL AT ME, I WILL NOT CRY"
    boni:
      - question: "Translate this sentence: <latin>Sī mē vituperēs, tot lacrimās quot sīdera in caelō lacrimem</latin>."
        answer: "IF YOU SHOULD SCOLD / CRITICIZE / YELL AT ME, I WOULD CRY AS MANY TEARS AS (THERE ARE) STARS IN THE SKY"
      - question: "Translate this sentence: <latin>Quod mē nōn vituperāvistī, incēdō nitēns sīcut sōl</latin>."
        answer: "BECAUSE YOU HAVE NOT SCOLDED / CRITICIZED / YELLED AT ME, I WALK / PROCEED BEAMING / BRILLIANT (JUST) LIKE THE SUN"
  - tossup:
      question: "Which deity travelled from the Underworld and threw a serpent into the heart of Amata, hence inflaming a war between the Latins and the Trojans, before returning to her sisters, Megaera and Tisiphone?"
      answer: "ALLECTO"
    boni:
      - question: "In which part of the Underworld did these three sisters torture souls?"
        answer: ""
      - question: "According to Hesiod, what two other mythological groups sprang from the blood of Uranus’ severed genitalia along with the Furies?"
        answer: "MELIAE / ASH NYMPHS AND GIANTS / GIGANTES"
  - tossup:
      question: "What Latin playwright, called “doctus” because of his Hellenistic influences, wrote a collection of Roman tragedies that included <latin><title>Dūlorestes</title>, <title>Teucer</title>, <title>Ilīona</title></latin>, and <latin><title>Niptra</title></latin>?"
      answer: "(MARCUS) PACUVIUS"
    boni:
      - question: "What was the term for such tragedies, which are written in Latin but cover Greek subjects?"
        answer: "<latin>FĀBULAE COTHURNĀTAE</latin>"
      - question: "Pacuvius also wrote one <latin>fābula</latin> praetexta.  What was its title?"
        answer: "<title>PAULLUS</title>"
  - tossup:
      question: "The Latin terms <latin>amphorae, dōlia, mustum</latin>, and <latin>ūvae</latin> all relate to the manufacturing of what important product for the ancient Romans?"
      answer: "WINE"
    boni:
      - question: "What was mustum?"
        answer: "GRAPE JUICE / UNFERMENTED JUICE"
      - question: "What was the name for the drink made from mixing wine and honey?"
        answer: "<latin>(VĪNUM) MULSUM</latin>"
  - tossup:
      question: "Say in Latin: Surely you all enjoy playing certamen?"
      answer: "<latin>NŌNNE (VŌS) FRUIMINĪ CERTĀMEN LŪDERE // CERTĀMINE / CERTĀMEN LŪDENDŌ</latin>"
    boni:
      - question: "Say in Latin: We love playing certamen more than everything!"
        answer: "<latin>AMĀMUS CERTĀMEN LŪDERE MAGIS OMNIBUS / OMNĪ / QUAM OMNIA / QUAM OMNE // CERTĀMEN LŪDERE MAGIS OMNIBUS / OMNĪ NŌBIS PLACET</latin>"
      - question: "Say in Latin: Our love for playing certamen makes it such that we know these things."
        answer: "<latin>AMOR (NOSTER) LŪDENDĪ CERTĀMINIS / CERTĀMEN EFFICIT / FACIT UT HAEC SCIĀMUS</latin>."
  - tossup:
      question: "For the verb <latin>prōsum</latin>, give the second person plural, present active indicative form, which means “you all are useful.”"
      answer: "<latin>PRŌDESTIS</latin>"
    boni:
      - question: "Put <latin>prōdestis</latin> into the subjunctive mood."
        answer: "<latin>PRŌSĪTIS</latin>"
      - question: "Put <latin>prōsītis</latin> into the pluperfect tense."
        answer: "<latin>PRŌFUISSĒTIS</latin>"
  - tossup:
      question: "What great Theban seer uttered prophecies even in the Underworld, as when he informed Odysseus how to return to Ithaca?"
      answer: "T(E)IRESIAS"
    boni:
      - question: "Among other things, Teiresias advised Odysseus not to eat the Thrinacian cattle of what god?"
        answer: "HELIUS / HELIOS"
      - question: "Teiresias says that returning to Ithaca will not, however, release Odysseus from his journeys. Rather he must wander, carrying what object, until it is mistaken for a winnowing fan?"
        answer: "OAR (FROM HIS SHIP)"
  - tossup:
      question: "What monument in Rome was built by Augustus and named for someone described in this passage, which I will read as prose? <latin>heu pietās, heu prīsca fidēs invictaque bellō dextera! nōn illī sē quisquam impūnē tulissetobvius armātō, seu cum pedes īret in hostemseu spūmantis equī foderet calcaribus armōs.heu, miserande puer</latin>."
      answer: "THEATER OF MARCELLUS"
    boni:
      - question: "Give the letter and the name for the monument described in this passage of Martial, which I will read as prose: <latin>Barbara pyramidum sileat mīrācula Memphis, Assiduus iactet nec Babylōna labor. Nec Trīviae Templō mollēs laudentur honōrēs, Dissimuletque Deum cornibus āra frequēns. Āere nec vacuō pendentia Mausōlēa Laudibus immodicīs Cārēs in astra ferant. Omnis Caesareō cēdat labor Amphitheātrō: Ūnum prō cunctās Fāma loquātur opus</latin>."
        answer: "A – COLOSSEUM / FLAVIAN AMPHITHEATER"
      - question: "Give the letter and the name for the monument described in this passage of Ovid, which I will read as prose: <latin>Vesta eadem est et terra: subest vigil ignis utrīque: significant sēdem terra focusque suam.</latin>"
        answer: "C – TEMPLE OF VESTA / <latin>AEDĒS VESTAE</latin>"
  - tossup:
      question: "The consul Lucius Marcius Philippus and the praetor Quintus Servilius Caepio were among the influential opponents to the legislation proposed by what man who had been elected tribunes of the plebs for 91 BC and was murdered late in that same year?"
      answer: "(M. LIVIUS) DRUSUS THE YOUNGER"
    boni:
      - question: "What man, a prominent orator who had been Cicero’s teacher, died at a crucial point in the senatorial debates on Drusus’s legislation, thus robbing him of his most influential ally?"
        answer: "LUCIUS (LICINIUS) CRASSUS"
      - question: "What chieftain of the Marsi, who would go on to lead the Italians in the subsequent Social War, was known to be a supporter and frequent visitor to Drusus’s home in the months leading up to Drusus’s assassination?"
        answer: "(Q.) POPPAEDIUS / SILO"
  - tossup:
      question: "What case can be used after all of the following words? <latin>tenus, ergō</latin>, and <latin>īnstar</latin>?"
      answer: "GENITIVE"
    boni:
      - question: "Using one of these words, give a Latin phrase equivalent to the English, “a horse huge as a mountain”."
        answer: "<latin>EQUUS ĪNSTAR MONTIS</latin>"
      - question: "The word <latin>tenus</latin> can also be used with the ablative, as seen in line 553 of Book II of the <title>Aeneid</title>, when Neoptolemus is described stabbing Priam with the phrase “<latin>ac laterī capulō tenus abdidit ēnsem</latin>.” According to this phrase, how deeply into his side did Neoptolemus stab Priam?"
        answer: "AS FAR AS / UP TO THE HILT (OF THE SWORD)"
  - tossup:
      question: "Where were Ophion and Eurynome the original rulers, before eventually being succeeded by Cronus and Rhea, who were themselves supplanted by Zeus and Hera?"
      answer: "(MT.) OLYMPUS"
    boni:
      - question: "It is reputed that the guardians of Olympus were Alexiares and Anicetus, the children of Heracles by what goddess?"
        answer: "HEBE"
      - question: "What pair of giants attempted to storm Mount Olympus, piling Mount Pelion upon Mount Ossa in the attempt?"
        answer: "OTUS AND EPHIALTES / (THE) ALO(E)ADAE"
  - tossup:
      question: "“<latin>Bella per Emathiōs plūs quam cīvīlia campōs</latin>” is the first line of what epic poem, written by the short-lived poet Lucan?"
      answer: "<title><latin>BELLUM CĪVĪLE / PHARSĀLIA</latin> / <latin>DE BELLŌ CĪVĪLĪ</latin> / THE CIVIL WAR</title>"
    boni:
      - question: "Whom is Lucan addressing, in Book One of the <title><latin>Bellum Cīvīle</latin></title>, when he writes: “<latin>Multum Rōma tamen dēbet cīvīlibus armīs/ quod tibi rēs acta est</latin>”?"
        answer: "NERO"
      - question: "In what year did Nero force Lucan to commit suicide?"
        answer: "65 AD"
  - tossup:
      question: "Listen carefully to the following passage, which I will read twice, and answer IN ENGLISH the question that follows: <latin>Prope Pharsālum, cum Pompēius exercitum multō māiōrem dūceret, Caesar tamen vīcit et Pompēium fugientem ad Aegyptum persecūtus est.  Antequam Caesar Pompēium dēprehendere posset, Ptolemaeus, rēx Aegyptī, eum interficī iussit.  Itaque Ptolemaeus, cum Caesar Alexandriam advēnit, mandāvit ut caput Pompēī Caesarī darētur nam crēdidit hoc dōnum Caesarī fore voluptātī</latin>. The question:  How does Ptolemy spoil Caesar’s pursuit of Pompey?"
      answer: "HE ORDERED POMPEY TO BE KILLED"
    boni:
      - question: "Why would some have expected Pompey to win the battle?"
        answer: "BECAUSE HE HAD A (MUCH) LARGER ARMY"
      - question: "How did Ptolemy believe that Caesar would react to his “gift”?"
        answer: "WITH PLEASURE / HAPPILY"
  - tossup:
      question: "The royal family has been a topic of interest over the past year, and many of us forget to appreciate the Latin roots of their royal titles. What Latin verb is the ultimate root of the English word “prince”?"
      answer: "<latin>CAPIŌ / CAPERE</latin>"
    boni:
      - question: "The English word “duchess” is ultimately derived from what Latin verb?"
        answer: "<latin>DŪCŌ / DŪCERE</latin>"
      - question: "The royal title “count” is ultimately derived from what Latin verb?"
        answer: "<latin>EŌ / ĪRE</latin>"
