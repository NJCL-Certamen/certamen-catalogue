tournament: NJCL Certamen
year: 2019
division: Advanced
round: Finals
questions:
  - tossup:
      question: "What is the genitive singular of <latin>Thisbē</latin>, as the name is seen in book 4 of Ovid’s <title>Metamorphoses</title>?"
      answer: "<latin>THISBĒS</latin>"
    boni:
      - question: "Ovid refers to Daphne as her patronymic <latin>Penēide</latin>. What is the best meaning of <latin>Penēide</latin>?"
        answer: "DAUGHTER OF PENEUS"
      - question: "Aeneas is referred to by what patronymic noun that directly references the name of his father?"
        answer: "<latin>ANCHĪSEUS / ANCHĪSIADĒS</latin>"
  - tossup:
      question: "Sallust is known as a monographic historian in the model of Thucydides, although it is debated whether he truly pioneered this genre in Latin.  What second century B.C. jurist and author had written a seven-book monograph on the Second Punic War much earlier?"
      answer: ""
    boni:
      - question: "While celebrated as an author, Sallust had mixed success as a politician and public servant.  Over what province had Sallust served as governor when he was charged with extortion?"
        answer: "NUMIDIA / AFRICA NOVA"
      - question: "Which work of Cicero did Sallust use as his reference in his famed monograph about Catiline?"
        answer: "<latin>DĒ CŌNSULĀTU SUŌ</latin>̄"
  - tossup:
      question: "During the voyage to Crete, Minos became enamored with what daughter of Alcathoüs, whom Theseus defended from his advances?"
      answer: "EËRIBOEA / PERIBOEA"
    boni:
      - question: "In most stories, the tribute owed to Minos was ended when Theseus killed the Minotaur, but in others, it was Theseus’ defeat of what Cretan noble and captain of Minos’ navy that caused the remission of payment?"
        answer: "TAURUS"
      - question: "On his voyage home following the cancellation of the tribute, Theseus stopped at what island, whose inhabitants danced the “Crane Dance” in his honor thereafter?"
        answer: "DELOS"
  - tossup:
      question: "Which forum designed by Apollodorus of Damascus included a Greek and Latin library, the Basilica Ulpia, and a massive column commemorating the Dacian Wars in sculptural relief?"
      answer: "TRAJAN’S FORUM / <latin>FORUM ULPIUM / FORUM TRĀIĀNĪ</latin>"
    boni:
      - question: "Into what hill was Trajan’s forum carved?"
        answer: "QUIRINAL"
      - question: "What large building complex in Rome, located at the junction of the Quirinal and Viminal hills, gave the main train station of Rome its name “Termini”?"
        answer: "BATHS OF DIOCLETIAN / <latin>THERMAE DIOCLETIĀNĪ</latin>"
  - tossup:
      question: "Translate the following sentence into English: <latin>mē hoc fēcisse nōn paenitēbit</latin>."
      answer: "I WILL NOT REGRET / BE SORRY FOR DOING / HAVING DONE IT / TO HAVE DONE IT"
    boni:
      - question: "Now translate: <latin>cōnstat rēgēs Rōmam multōs per annōs oppressisse</latin>."
        answer: "IT IS AGREED THAT KINGS OPPRESSED ROME THROUGH / FOR MANY YEARS"
      - question: "Now translate: <latin>Cadmī Minervam miseret quod eum sorōris quaerendae taedēbat</latin>."
        answer: "MINERVA PITIES CADMUS BECAUSE HE WAS TIRED OF LOOKING FOR HIS SISTER"
  - tossup:
      question: "Because of the variety of meters employed, “Polymetra” is a term applied to the first sixty poems of what neoteric poet’s Carmina?"
      answer: "(C. VALERIUS) CATULLUS"
    boni:
      - question: "Which poem of Catullus’s “carmina docta” recounts the marriage of Peleus and Thetis, with an ecphrasis that retells the story of Theseus’s abandonment of Ariadne?"
        answer: "64"
      - question: "Whom is Catullus addressing with these words from poem 49: “<latin>tantō pessimus omnium poēta quantō tū optimus omnium patrōnus</latin>”?"
        answer: "(M. TULLIUS) CICERO"
  - tossup:
      question: "What German of Suevic and Gothic ancestry could not become emperor himself but had a hand in the rise, fall, and sometimes both, of several emperors between 456 and 472 AD, including Majorian, Libius Severus, and Olybrius?"
      answer: "(FLAVIUS) RICIMER"
    boni:
      - question: "What emperor, nominated by the Eastern emperor Leo, married his daughter to Ricimer to gain his support, but still ended up falling out with him and dying after Ricimer besieged and captured Rome?"
        answer: "ANTHEMIUS"
      - question: "What nephew of Ricimer also tried his hand at king-making when he raised Glycerius to the purple in opposition to Leo’s nominee, Julius Nepos?"
        answer: "GUNDOBAD"
  - tossup:
      question: "Many important medical terms are derived from the Latin language. What is the meaning of the Latin noun at the root of tuberculosis?"
      answer: "TUMOR / LUMP / BUMP / SWELLING"
    boni:
      - question: "What is the meaning of the Latin noun at the root of the word gland?"
        answer: "ACORN / NUT / ACORN-SHAPED FRUIT"
      - question: "Two medical conditions that sound alike are goiter and gout. However, these two medical terms have different Latin roots. Give the ultimate Latin roots for both goiter and gout."
        answer: "GOITER – GUTTUR, GOUT - GUTTA"
  - tossup:
      question: "What spring near Halicarnassus supposedly caused bathers to lose virility, or else become half-men, after its eponymous nymph prayed to be forever joined to Hermaphroditus?"
      answer: "SALMACIS"
    boni:
      - question: "Hermaphroditus was the descendant of what famous Titan, the namesake of a mountain range in northwestern Africa?"
        answer: "ATLAS"
      - question: "In speaking of the story of Hermaphroditus and Salmacis, Ovid passed over the story of what youth, who became a saffron plant after an unhappy love affair with the nymph Smilax?"
        answer: "CROCUS"
  - tossup:
      question: "In the <title>Aeneid</title>, to what character does Juno address the following lines, which I will read as prose: “<latin>Tū prō germānō sī quid praesentius audēs,/ perge; decet. Forsan miserōs meliōra sequentur</latin>”?"
      answer: "JUTURNA"
    boni:
      - question: "In book twelve of the <title>Aeneid</title>, who addresses the following lines to Turnus, which I will read as prose? “<latin>Quid miserōs totiēns in aperta perīcula cīvis / prōicis, ō Latiō caput hōrum et causa malōrum</latin>?”"
        answer: "DRANCES"
      - question: "In book eleven of the <title>Aeneid</title>, following the death of Camilla, who speaks the following words, which I will read as prose? “<latin>Nōn tamen indecōrum tua tē rēgīna reliquit / extrēma iam in morte, neque hoc sine nōmine lētum / per gentis erit aut fāmam patiēris inultae</latin>.”"
        answer: "OPIS"
  - tossup:
      question: "Prior to his own ascent to the throne, Diocletian served in the bodyguard of which emperor, who according to classical sources, came to power alongside his brother, Carinus, after a freak lightning accident?"
      answer: "(M. AURELIUS NUMERIUS) NUMERIAN(US)"
    boni:
      - question: "What praetorian prefect assassinated Numerian, leading Diocletian to seek revenge?"
        answer: "APER"
      - question: "What rival did Diocletian then defeat at the Margus River?"
        answer: "CARINUS"
  - tossup:
      question: "Using <latin>quīn</latin> and <latin>possum</latin>, say in Latin, “there was no doubt that the Romans were the most powerful.”"
      answer: "<latin>NŌN / NŪLLUM ERAT DUBIUM QUĪN RŌMĀNĪ PLŪRIMUM POSSENT</latin>"
    boni:
      - question: "Using <latin>dum</latin>, say in Latin, “the Romans were always victorious provided that the flame of Vesta remained.”"
        answer: "<latin>RŌMĀNĪ SEMPER VINCĒBANT / ERANT VICTŌRĒS DUM / MODO / TANTUM UT / DUMMODO / FLAMMA VESTAE MANĒRET</latin>"
      - question: "Using <latin>obstō</latin>, Say in Latin, “who is there who would oppose the Romans?”"
        answer: "<latin>QUIS EST QUĪ RŌMĀNĪS OBSTET</latin>?"
  - tossup:
      question: "To what classification do the verbs arcessere, <latin>cantāre, cursāre</latin>, and <latin>vēnditāre</latin> belong?"
      answer: "THEY ARE FREQUENTATIVES / INTENSIVE / ITERATIVES"
    boni:
      - question: "Using a different frequentative, say “to have been sleepy”?"
        answer: "<latin>DORMĪTĀVISSE</latin>"
      - question: "Using another frequentative, say “to have been hunted”."
        answer: "<latin>AGITĀTUS (-A/-UM) ESSE</latin>"
  - tossup:
      question: "According to Macrobius, what Roman knight paid the price for his criticism of Julius Caesar when he was forced by the tyrant to act in mimes that he had written himself?"
      answer: "(DECIMUS) LABERIUS"
    boni:
      - question: "What contemporary and archrival of Decimus Laberius became known for the maxims derived from his plays, one of which, “<latin>Iūdex damnātur cum nocēns absolvitur</latin>,” became the motto for the Edinburgh Review?"
        answer: "(PUBLILIUS) SYRUS"
      - question: "According to our best historical record, what author and contemporary of both Decimus Laberius and Publilius Syrus wrote a wide range of works, including a geographical poem called <title><latin>Chorographica</latin></title>, satires in the model of Lucilius, and an epic poem on Caesar’s campaign against Ariovistus called <title><latin>Bellum Sēquānicum</latin></title>?"
        answer: "(PUBLIUS TERENTIUS) VARRO ATACINUS / OF ATAX"
  - tossup:
      question: "(HAND OUT THE VISUAL AND GIVE 10 SECONDS TO INSPECT IT)"
      answer: "TU: Given that each letter and each picture represent a person on a family tree, identify the mythological characters who are represented by the letters A and B. CADMUS AND HARMONIA"
    boni:
      - question: "What is D?"
        answer: "SEMELE"
      - question: "Who is C?"
        answer: "AUTONOË"
  - tossup:
      question: "Which of the following words, if any, does not belong because of derivation: demur, commorant, moratorium, immure?"
      answer: "IMMURE"
    boni:
      - question: "From what Latin noun are commorant, moratorium, and demur derived?"
        answer: "MORA"
      - question: "From what Latin adjective with what meaning do we derive the English word demure?"
        answer: "<latin>MĀTŪRUS</latin>"
  - tossup:
      question: "In one of his letters, Pliny the Younger writes about the death of the daughter of his friend: I have never seen a girl more worthy of a longer life.  Translate that into Latin."
      answer: "<latin>NUMQUAM PUELLAM DIGNIŌREM LONGIŌRE VITĀ VĪDĪ</latin>"
    boni:
      - question: "Later Pliny writes: <latin>Ut nūtrīcēs, ut paedagōgōs, ut praeceptōrēs prō suō quemque officiō dīligēbat</latin>!  What two figures of speech are in this sentence?"
        answer: "TRICOLON (CRESCENS), ANAPHORA"
      - question: "Translate that line of Pliny."
        answer: "HOW SHE LOVED HER NURSES, HER CHAPERONES, AND HER TEACHERS, EACH IN ACCORD WITH THEIR WORTH"
  - tossup:
      question: "Upon encountering a lion in the desert, what son of Polymnestus let out such a yell of terror that he both frightened away the beast and cured himself of his stammer?"
      answer: "BATTUS"
    boni:
      - question: "Battus was a reputed descendant in the seventeenth generation of which Argonaut, who was so swift that he could run across waves without wetting his feet?"
        answer: "EUPHEMUS"
      - question: "Battus had come to the desert with colonizers from what Greek island, who with his help eventually found a site at Cyrene?"
        answer: "THERA / SANTORINI"
  - tossup:
      question: "What standing political body, reformed and re-reformed by the likes of Sulla, Livius Drusus, Servilius Glaucia, Servilius Caepio, and Gaius Gracchus, was originally established in 149 BC by Calpurnius Piso as a reaction to the embarrassing acquittal of Sulpicius Galba on charges of provincial corruption?"
      answer: "<latin>QUAESTIŌ DĒ (RĒBUS) REPETUNDĪS</latin> // COURT <latin>DĒ (RĒBUS) REPETUNDĪS</latin>"
    boni:
      - question: "How did Gaius Gracchus change the make-up of the <latin>quaestiō dē repetundīs</latin>?"
        answer: "MADE ALL MEMBERS EQUESTRIANS"
      - question: "Gracchus’ reform, whether intended or not, led to a court that rarely acquitted those before it, especially when the defendant had taken a stand against the equestrian tax collectors in the province.  What ex-consul was convicted by the court and then spent his exile among the people he supposedly abused?"
        answer: "(P.) RUTILIUS (RUFUS)"
  - tossup:
      question: "Listen carefully to the following modified excerpt of a letter from Cicero to Atticus, which I will read twice, and answer IN LATIN the question that follows: <latin>Multī in senātū dē rēbus gestīs Pompēī Magnī locūtī sunt. Metellus, cōnsul dēsignātus, contrā dīxerat, et plānē eius verba erant quae Crassus voluisset.  Ille hērōs, noster Catō, erat dictūrus, sed, propter brevitātem diēī perventum nōn est.  Quid aliud scrībam ad tē? Luccēium scītō cōnsulātum habēre in animō statim petere; duo enim sōlī dīcuntur petītūrī: Caesar et Bibulus.  Rīdēs?  Nōn sunt haec rīdicula, mihi crēde</latin>! The question: <latin>Cūr Catō nōn dīxit</latin>?"
      answer: "<latin>PROPTER BREVITĀTEM DIĒĪ</latin>"
    boni:
      - question: "<latin>Quī cōnsentiunt dē rēbus gestīs Pompēī</latin>"
        answer: "<latin>CRASSUS ET METELLUS (CŌNSENTIUNT</latin>)"
      - question: "<latin>Quōs Cicerō crēdit petītūrōs cōnsulātum</latin>?"
        answer: "<latin>(CICERŌ CRĒDIT) CAESAREM, BIBULUM ET LUCCĒIUM PETĪTŪRŌS CŌNSULĀTUM</latin>"
