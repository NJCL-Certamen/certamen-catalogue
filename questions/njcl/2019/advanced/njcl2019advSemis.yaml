tournament: NJCL Certamen
year: 2019
division: Advanced
round: Semifinals
questions:
  - tossup:
      question: "Using just one word, say in Latin, “we had not known”."
      answer: "<latin>NESCĪ(V)ERĀMUS</latin>"
    boni:
      - question: "Using just one word, say in Latin, “let her not want”."
        answer: "<latin>NŌLIT</latin>"
      - question: "Once again, using just one word, say in Latin, “we are unable”."
        answer: "<latin>NEQUĪMUS</latin>"
  - tossup:
      question: "When their father, a champion of hereditary succession, died, what three sons split the empire among themselves in 337 AD?"
      answer: "CONSTANS, CONSTANTIUS II, CONSTANTINE II"
    boni:
      - question: "What older son had Constantine had executed in 326 AD in a mysterious scandal?"
        answer: "CRISPUS"
      - question: "Name one of the two sons of Constantine’s half-brother who was also groomed for rule."
        answer: ""
  - tossup:
      question: "Consider the following English sentence: The author discovered miscellaneous accounts of the city’s strange collection. Identify and give the Latin root of two words in the sentence."
      answer: "SEE BELOW"
    boni:
      - question: "Identify two more words in the sentence that are derived from Latin and give their ultimate Latin roots."
        answer: "AUTHOR - <latin>AUGEŌ / AUCTOR</latin> // DISCOVER - <latin>OPERIŌ</latin> // MISCELLANEOUS - <latin>MISCEŌ</latin> / ACCOUNTS - <latin>PUTŌ</latin> // CITY - <latin>CĪVIS</latin> // STRANGE - <latin>EXTRĀ</latin> // COLLECTION - <latin>LEGŌ</latin>"
      - question: "How many words in the sentence are derived from Latin?"
        answer: "SEVEN"
  - tossup:
      question: "Since his landlocked Arcadia knew nothing of the sea, what king of Tegea led his men to Troy in sixty ships which he had borrowed from Agamemnon?"
      answer: "AGAPENOR"
    boni:
      - question: "Agapenor was the son of what Arcadian king, who was chosen by the Argonauts to row beside Heracles due to his strength?"
        answer: "ANCAEÜS"
      - question: "Agapenor succeeded what other Arcadian king, who killed Heracles’ son Hyllus in a duel, thus defending the Peloponnesus against the Heraclids?"
        answer: "ECHEMUS"
  - tossup:
      question: "<latin>Quid Anglicē significat “naucum” vel “nugae</latin>”?"
      answer: "TRIFLE/SOMETHING WORTH LITTLE"
    boni:
      - question: "<latin>Quid Anglicē significat “lacer”</latin>?"
        answer: "TORN (APART) / MANGLED / LACERATED"
      - question: "<latin>Quid Anglicē significat “pulvīnar</latin>”?"
        answer: "COUCH / CUSHION"
  - tossup:
      question: "What Latin author included several of his contemporaries, including Praetextatus, Nicomachus, and Symmachus, but avoided the common conceit of using himself as a character in his work set in December of 383 AD, entitled <title><latin>Saturnālia</latin></title>?"
      answer: "(AMBROSIUS THEODOSIUS) MACROBIUS"
    boni:
      - question: "Macrobius’s Saturnalia is set over a span of three days. During the second and third mornings, what much more celebrated author is the center of discussion and is effusively praised for his use of rhetoric and grammar and his use of earlier poets, both Greek and Roman?"
        answer: "(P.) VERGIL(IUS MARO)"
      - question: "Another of Macrobius’s known works is a commentary about what subsection of Cicero’s <latin><title>Dē Rē Pūblicā</title></latin>?"
        answer: "<latin><title>SOMNIUM SCĪPIŌNIS</title></latin>"
  - tossup:
      question: "Consider the sentence “<latin>haud perīculum est ut mortem optet.</latin>” What type of subordinate clause does that sentence contain, which is more usually introduced by verbs such as <latin>vereor</latin> and <latin>timeō</latin>"
      answer: "FEAR CLAUSE"
    boni:
      - question: "Using a fear clause and the verb <latin>timeō</latin>, say in Latin, “I fear that the soldier may not kill the enemy.”"
        answer: "<latin>TIMEŌ NĒ NŌN / UT MĪLES HOSTEM / HOSTĒS / INIMĪCUM / INIMĪCŌS INTERFICIAT</latin> (and many other words for “kill”)"
      - question: "Using another fear clause and the verb vereor, say in Latin, “Marcus was afraid that the captives had been able to escape the prison.”"
        answer: "<latin>MĀRCUS VERĒBĀTUR / VERITUS EST NĒ CAPTĪVĪ CARCEREM / Ē CARCERE (EF)FUGERE POTUISSENT</latin>"
  - tossup:
      question: "What emperor built an <latin>ōdēon</latin> and stadion in the <latin>Campus Mārtius</latin>, the latter of which would become the modern Piazza Navona?"
      answer: "(T. FLAVIUS) DOMITIAN(US)"
    boni:
      - question: "What structure on the edge of the forum did Domitian build to memorialize his brother’s sack of Jerusalem?"
        answer: "ARCH OF TITUS"
      - question: "By what name do we know the forum on which Domitian began construction before his death?"
        answer: "<latin>FORUM TRĀNSITORIUM</latin> / FORUM OF NERVA"
  - tossup:
      question: "Listen carefully to the following passage in which a shepherd pursues his lover, which I will read twice, and answer IN ENGLISH the question that follows: <latin>Amāns, cupiēns persuādēre amantī sīc dīcit.  “Ō crūdēlis!  Nihil mea carmina cūrās?  Nē crēde nimium iuventūtī!  Hiems omnibus venit.  Tibi dēspectus sum nec tū quaeris quis sim!  Nescīs quam dīves pecoris, quam abundāns lactis niveī sim!  Venī mēcum et tibi līlia et violās papāveraque dabō plēnīs calathīs</latin>. The question: What does the speaker warn his lover not to trust too much?"
      answer: "(HIS/HER) YOUTH"
    boni:
      - question: "What is the metaphorical meaning of the sentence Hiems omnibus venit in the context of the passage?"
        answer: "EVERYONE DIES / GETS OLD"
      - question: "What three things does the speaker promise if his lover comes with him?"
        answer: "LILIES, VIOLETS AND POPPIES (IN FULL BASKETS)"
  - tossup:
      question: "Nine days after sacrificing bulls to certain dryads, what son of Cyrene was amazed to see bees swarming amidst the carcasses, indicating that he had discharged his debt for accidentally killing Eurydice?"
      answer: "ARISTAEÜS"
    boni:
      - question: "Whom had Aristaeüs captured to find out why his bees were dying?"
        answer: "PROTEUS"
      - question: "In what Thessalian valley had Aristaeüs been living when he inadvertently caused the death of"
        answer: "Eurydice? (VALE / VALLEY OF) TEMPE"
  - tossup:
      question: "<latin>Responde Latinē: quis in familiā Rōmānā est soror mātris tuae</latin>?"
      answer: "<latin>MĀTERTERA</latin>"
    boni:
      - question: "<latin>Responde Latinē: quis in familiā Rōmānā est soror patris tuī</latin>?"
        answer: "<latin>AMITA</latin>"
      - question: "<latin>Responde Latinē: quis in familiā Rōmānā est pater aviae tuae</latin>?"
        answer: "<latin>PROAVUS</latin>"
  - tossup:
      question: "Which Latin author’s wide-ranging works include all of the following: Medea, Andromache, Sota, Thyestes, Euhemerus, and Hedyphagetica?"
      answer: "(Q.) ENNIUS"
    boni:
      - question: "Which <latin>fābula palliāta</latin> of Ennius, of which only a fragment survives today, concerns as its subject a “little hostess?”"
        answer: "CAUPUNCULA"
      - question: "Ennius’s Hedyphagetica, a mock epic poem on gastronomy, comes to us through what later work?"
        answer: "APOLOGIA (OF LUCIUS APULEIUS MADAURENSIS)"
  - tossup:
      question: "Of the words <latin>fundā, pilleō, conciliō</latin>, and <latin>femore</latin>, which word completes the following sentence best? <latin>Cotta lēgātus in adversum ōs vulnerātur</latin>."
      answer: "<latin>FUNDĀ</latin>"
    boni:
      - question: "Of the words <latin>fundā, pilleō, conciliō</latin>, and <latin>femore</latin>, which word completes the following sentence best? <latin>Neque alius mīles ambulāre poterat ____ fractō</latin>."
        answer: "FEMORE"
      - question: "Of the words <latin>fundā, pilleō, conciliō</latin>, and <latin>femore</latin>, which word completes the following phrase best?  <latin>____ Gallōrum Samarobrīvae perāctō</latin>."
        answer: "<latin>CONCILIŌ</latin>"
  - tossup:
      question: "What mythological name is shared by two characters in Ovid’s Metamorphoses—an Assyrian king whose daughters were transformed into the stone steps of a temple and a king of Cyprus, the son of Paphos, who killed himself after conceiving a child with his daughter, Myrrha?"
      answer: "CINYRAS"
    boni:
      - question: "Minerva wove the Assyrian Cinyras as one of the four examples of mortal presumptiveness with which she admonished Arachne. She also included what mythological couple, who were changed into mountains for calling themselves Zeus and Hera?"
        answer: "HAEMUS AND RHODOPE"
      - question: "The Cypriot Cinyras had been punished for the blasphemy of what wife of his, who claimed that Myrrha was lovelier than the goddess of love?"
        answer: "CENCHREÏS / METHARME"
  - tossup:
      question: "Which of the following English words, if any, does not come from the same ultimate Latin root as the others: illumine, sublime, elimination, subliminal?"
      answer: "ILLUMINE"
    boni:
      - question: "From what Latin noun with what meaning do we derive the English word illumine?"
        answer: "<latin>LŪMEN</latin> - “LIGHT”"
      - question: "Which of the following English words does not come from the same Latin root as the others: deliberate, equilibrium, libation, level?"
        answer: "LIBATION"
  - tossup:
      question: "Given that each letter represents a battle, what war is depicted in this visual, a war which began when an Asian monarch invaded Greece and ended with the liberation of the Greek city-states of Asia minor from Seleucid rule?"
      answer: "WAR WITH ANTIOCHUS / SELEUCID WAR"
    boni:
      - question: "Give the letter and the name of the battle where the aid of the Rhodian Eudamus was critical to a Roman victory."
        answer: "B - MYONNESUS"
      - question: "Give the letter and the name of the battle where Acilius Glabrio, with the help of his subordinate, Cato the Elder, used a knowledge of history to outflank Antionchus’ forces."
        answer: "A – THERMOPYLAE"
  - tossup:
      question: "A poem to his wife Claudia encouraging her and his stepdaughter to leave Rome and join him in his home town of Naples is a notable part of what 1st-century AD Roman author’s collection entitled Silvae?"
      answer: "(P. PAPINIUS) STATIUS"
    boni:
      - question: "Six of the thirty-two poems of the Silvae are addressed to which Roman emperor?"
        answer: "DOMITIAN"
      - question: "Which other work did Statius consider his magnum opus, a work which he claimed took him twelve years to write, one for each of the epic’s twelve books?"
        answer: "THEBAID"
  - tossup:
      question: "Translate this sentence: <latin>Sūtor rogāvit quid aliud factum esse dēbēret</latin>."
      answer: "THE COBBLER / SHOE-MAKER ASKED WHAT ELSE (WHAT OTHER THING) OUGHT TO HAVE BEEN DONE / MADE // SHOULD HAVE BEEN DONE / MADE"
    boni:
      - question: "Translate this sentence: <latin>Sūtor dīxit sī tempestās oriātur, futūrum fuisse ut nūllī lūdī essent</latin>."
        answer: "THE COBBLER / SHOE-MAKER SAID THAT IF A STORM SHOULD ARISE, THERE WOULD BE NO GAMES / IT WOULD HAVE BEEN THAT THERE WERE NO GAMES"
      - question: "Translate this sentence: <latin>Rēbus cūrae Brūtō dīvīnīs, rēgem sacrōrum novus cōnsul creāvit</latin>."
        answer: "SINCE RELIGIOUS MATTERS WERE A CARE TO BRUTUS, THE NEW CONSUL CREATED / MADE / BROUGHT FORTH / BEGAT A KING OF SACRIFICES / SACRED THINGS"
  - tossup:
      question: "What native of Cirta, born around 100 AD, became a famous orator and eventually served as a tutor to Lucius Verus and Marcus Aurelius?"
      answer: "(MARCUS CORNELIUS) FRONTO"
    boni:
      - question: "In what second-century AD work does the Christian apologist Minucius Felix rebut Fronto’s attacks on Christianity?"
        answer: "<title>OCTĀVIUS</title>"
      - question: "What student of Fronto also studied with Herodes Atticus, Sulpicius Apollinaris, and the sophist philosopher Favorinus?"
        answer: "AULUS GELLIUS"
  - tossup:
      question: "Who was induced to smile at the quips of Iambe, servant of Metaneira, distracting her from grief over the loss of her daughter Persephone?"
      answer: "DEMETER"
    boni:
      - question: "Gladdened, Demeter accepted a cup of what drink, comprising water mixed with meal and pennyroyal?"
        answer: "KYKEON"
      - question: "While wandering, Demeter had also received a cup of kykeon from Misme, the mother of what youth, who laughed at her drinking speed and was changed into a spotted lizard for his impudence?"
        answer: "ASCALABUS"
