tournament: NJCL Certamen
year: 2019
division: Intermediate
round: Round 2
questions:
  - tossup:
      question: "Who did not think to feel beneath the bellies of his rams as they left his cave, thereby allowing Odysseus and his men to reach safety?"
      answer: "POLYPHEMUS"
    boni:
      - question: "Name Polyphemus’ divine father, whose enmity played a major role in Odysseus’ failure to reach home for ten years."
        answer: "POSEIDON"
      - question: "What soothsayer had come to the land of the Cyclopes many years before and informed Polyphemus that Odysseus would arrive one day and deprive him of his eyesight?"
        answer: "TELEMUS"
  - tossup:
      question: "From what Latin noun do we derive the English words “defy” and “fiancé”?"
      answer: "<latin>FIDĒS</latin>"
    boni:
      - question: "From what Latin noun do we derive the English word “ferrous”?"
        answer: "FERRUM"
      - question: "From what Latin noun do we derive the English word “flourish”?"
        answer: "<latin>FLŌS</latin>"
  - tossup:
      question: "Please listen to the following sentences, which I shall read twice, and answer the question that follows in English: <latin>Ubi quartadecima nox tempestātis vēnit, mediā nocte nōnnūllī nautae crēdēbant sē terrae appropinquāre.  Timentēs autem nē in saxa inciderent, dē puppī ancorās quattuor mīsērunt. Quīdam ex nautīs, cupiēntēs tamen ē nāve effugere, nautae scapham dēmittēbant in mare, simulantēs sē ancorās dē prōrā extensūrōs esse</latin>.  (repeat) The question:  What did some sailors believe on the 14th night of the storm?"
      anwer: "THAT THEY WERE APPROACHING LAND"
    boni:
      - question: "What step did these sailors take to prevent the ship from hitting the rocks?"
        answer: "THEY LOWERED / SENT (FOUR) ANCHORS (FROM THE STERN / SHIP) // DROPPED ANCHOR (DO NOT ACCEPT “DROPPED AN ANCHOR” IT’S NOT IN THE IDIOM)"
      - question: "Wanting to save their own skin, what did certain sailors pretend to do after they lowered the skiff?"
        answer: "THAT THEY WERE STRETCHING / EXTENDING THE ANCHORS (FROM THE PROW / SHIP)"
  - tossup:
      question: "<latin>Respondē</latin> aut <latin>Anglicē</latin> aut <latin>Latīnē</latin>: In <latin>quā</latin> parte <latin>vīllae Rōmānī imāginēs, larārium</latin>, et impluvium <latin>vidēbant</latin>?"
      answer: "(IN THE) ATRIUM / (IN) <latin>ĀTRIŌ</latin>"
    boni:
      - question: "<latin>Respondē Latīnē</latin>: Ubi <latin>Rōmānī cērās, stilōs, grammāticum</latin>, et <latin>discipulōs inveniēbant</latin>?"
        answer: "IN <latin>LŪDŌ / SCHOLĀ / PERGULĀ / AULĀ</latin>"
      - question: "<latin>Respondē Latīnē</latin>: Ubi <latin>Rōmānī</latin> palaestram, <latin>ūnctōrium</latin>, et <latin>tepidārium intrābant</latin>?"
        answer: "AD / APUD <latin>THERMĀS / BALNEĀ</latin>(S) / BALNEUM // IN <latin>THERMĪS / BALNEĪS / BALNEŌ</latin>"
  - tossup:
      question: "What god appears in Book I of the Aeneid and is offered the nymph Deiopea by Juno?"
      answer: "AEOLUS"
    boni:
      - question: "According to the Aeneid, what would Aeolus have to do in order to obtain Deiopea as a wife?"
        answer: "SET HIS WINDS UPON THE SHIPS OF AENEAS / SINK AENEAS’ SHIPS [ACCEPT EQUIVALENTS]"
      - question: "According to the Aeneid, how many nymphs does Juno have, of whom Deiopea is the prettiest?"
        answer: "14"
  - tossup:
      question: "Change the phrase magna manus to the nominative plural."
      answer: "MAGNAE <latin>MANŪS</latin>"
    boni:
      - question: "Change magnae <latin>manūs</latin> to the genitive plural."
        answer: "<latin>MAGNĀRUM</latin> MANUUM"
      - question: "Change <latin>magnārum</latin> manuum to the ablative singular."
        answer: "<latin>MAGNĀ MANŪ</latin>"
  - tossup:
      question: "What use of the ablative case can be found in the following Latin sentence:  <latin>Aurēlia</latin> celerius <latin>Quīntō currēbat</latin>?"
      answer: "COMPARISON"
    boni:
      - question: "...:  <latin>Aurēlia multō</latin> celerius quam <latin>Quīntus currēbat</latin>?"
        answer: "DEGREE / MEASURE OF DIFFERENCE"
      - question: "...:  <latin>Quīntō superātō, Aurēlia</latin> statim domum rediit?"
        answer: "ABSOLUTE"
  - tossup:
      question: "Who surrounded herself with a large group of learned people that included Philostratus and used her influence to guide the reigns of her husband, Septimius Severus, and her son, Caracalla?"
      answer: "JULIA DOMNA"
    boni:
      - question: "Give the letter of the bust that represents Julia Domna."
        answer: "B"
      - question: "Identify by their letters and names, the two women pictured here that shared the same name."
        answer: "A – FAUSTINA THE ELDER, C – FAUSTINA THE YOUNGER"
  - tossup:
      question: "The noise made by a pair of bronze castanets borrowed from Athena so frightened what creatures that they flew away from their lake, completing Heracles’ sixth labor?"
      answer: "STYMPHALIAN BIRDS"
    boni:
      - question: "Chasing away the Stymphalian birds was Heracles’ third labor in the Greek region of Arcadia. His first was when he captured what animal sacred to Artemis?"
        answer: ""
      - question: "His second labor in Arcadia immediately followed that of the Cerynitian Hind. What huge beast did he capture in the snow in order to complete that labor?"
        answer: "ERYMANTHIAN BOAR"
  - tossup:
      question: "Please translate into English:  in <latin>prōvinciā</latin> semper <latin>pluēbat</latin>."
      answer: "IT WAS ALWAYS RAINING IN THE PROVINCE"
    boni:
      - question: "...:  <latin>nōbīs nōn</latin> licet <latin>clāmāre</latin>."
        answer: "WE ARE NOT PERMITTED / ALLOWED TO SHOUT // IT IS NOT PERMITTED / ALLOWED FOR US TO SHOUT"
      - question: "...:  <latin>vōs taedēbit mendāciōrum imperātōris</latin>."
        answer: "YOU (PL.) / Y’ALL WILL BE TIRED OF THE EMPEROR’S LIES"
  - tossup:
      question: "Verte <latin>Anglicē</latin>: “<latin>dēfendēmus</latin>”."
      answer: "WE WILL DEFEND"
    boni:
      - question: "Verte <latin>Anglicē</latin>: “<latin>amāta</latin> erit”."
        answer: "SHE WILL HAVE BEEN LOVED"
      - question: "Verte <latin>Anglicē</latin>: “<latin>scrīptum</latin> erat”."
        answer: "IT HAD BEEN WRITTEN"
  - tossup:
      question: "What reformer’s push for citizenship for Rome’s Italian allies and subsequent assassination led in large part to the Social War?"
      answer: "(LIVIUS) DRUSUS THE YOUNGER"
    boni:
      - question: "Who tried to propose a law in 125 BC, which would have prevented the Social War 30 years later by giving citizenship to all Italian allies who wanted it, but was rejected by the Senate?"
        answer: ""
      - question: "What law of 90 BC finally granted citizenship to all loyal Italians and probably all those who laid down their arms as well?"
        answer: "<latin>LĒX IŪLIA</latin>"
  - tossup:
      question: "Give a synonym of celer."
      answer: "RAPIDUS / <latin>VĒLŌX / EXPEDĪTUS</latin> / PROMPTUS / <latin>CITĀTUS</latin> / CITUS"
    boni:
      - question: "Give a synonym of mare."
        answer: "AEQUOR / PELAGUS / PONTUS / ALTUM / SAL / FLUCTUS / UNDA / OCEANUS"
      - question: "Give a synonym of propter."
        answer: "OB / <latin>CAUSĀ / GRĀTIĀ / ERGŌ</latin> / PROPE / <latin>IUXTĀ</latin> / AD"
  - tossup:
      question: "A rod, a spindle, and a pair of shears were employed by what mythological trio when they determined how long mortals would live?"
      answer: "FATES / MOIRAI / PARCAE / <latin>FĀTA</latin>"
    boni:
      - question: "Which of the three members of the Fates ended the lives of mortals by cutting their life-threads with her shears?"
        answer: "ATROPOS"
      - question: "The three Fates were the daughters of what personification of night?"
        answer: "NYX"
  - tossup:
      question: "When applying for a job in academia, it is customary to submit a list of one's relevant education and job experiences.  This listing is often called a C.V.  For what Latin phrase does that abbreviation stand?"
      answer: "CURRICULUM <latin>VĪTAE</latin>"
    boni:
      - question: "What Latin phrase is used nowadays to indicate that a meeting is adjourned and the date of the next meeting has not yet been determined?"
        answer: "SINE <latin>DIĒ</latin>"
      - question: "What Latin phrase, found among the titles of the queen of England, literally means “defender of the faith”?"
        answer: "<latin>FIDEĪ DĒFĒNSOR / DĒFĒNSĀTRĪX</latin> (EITHER ORDER!)"
  - tossup:
      question: "How many tenses are there in the indicative mood?"
      answer: "SIX"
    boni:
      - question: "How many tenses are there in the subjunctive mood?"
        answer: "FOUR"
      - question: "How many tenses are there for participles?"
        answer: "THREE"
  - tossup:
      question: "Who had his hat taken off and returned by an eagle and took it as a sign that he would rule Rome, ushering in an era of Etruscan domination in Rome?"
      answer: "(L.) TARQUINIUS PRISCUS / LUCUMO"
    boni:
      - question: "Who was Priscus’ wife, who probably helped him interpret this and many other omens?"
        answer: "TANAQUIL / GAIA CAECILIA"
      - question: "What other king did Tanaquil help bring to the throne by covering up the death of Priscus until this man could round up his killers?"
        answer: "SERVIUS TULLIUS"
  - tossup:
      question: "Using a subjunctive, say in Latin “let them sleep!”"
      answer: "DORMIANT"
    boni:
      - question: "Using a subjunctive, say “let the book be recited by the students.”"
        answer: "LIBER <latin>Ā</latin> / AB <latin>DISCIPULĪS RECITĒTUR / LEGĀTUR</latin>"
      - question: "Using a subjunctive, say “let us sing as sweetly as possible.”"
        answer: "QUAM <latin>SUĀVISSIMĒ / DULCISSIMĒ CANĀMUS / CANTĒMUS</latin>"
  - tossup:
      question: "Actaeon, Jason, and Achilles were students of whom, sometimes said to have been king of the Centaurs?"
      answer: "CH(E)IRON"
    boni:
      - question: "In addition to his tutelage of Actaeon, Jason, and Achilles, Cheiron also taught medicine to what god of healing?"
        answer: "ASCLEPIUS"
      - question: "Together with the rest of the centaurs, Cheiron was driven from Mt. Pelion by the members of what tribe?"
        answer: "LAPITHS"
  - tossup:
      question: "The cities <latin>Dēva, Camulodūnum</latin>, and <latin>Eborācum</latin> were all located in what Roman province?"
      answer: "BRITAIN / BRITANNIA"
    boni:
      - question: "Which of the following cities was not located in Italy: <latin>Vērōna, Aquīncum, Mediōlānum</latin>, Genua?"
        answer: "<latin>AQUĪNCUM</latin>"
      - question: "Give the modern name of <latin>Aquīncum</latin>."
        answer: "BUDAPEST"
