tournament: NJCL Certamen
year: 2019
division: Intermediate
round: Round 3
questions:
  - tossup:
      question: "Who was a capable watchman because even as some of his eyes slept, others of his hundred eyes remained awake?"
      answer: "ARGUS (PANOPTES)"
    boni:
      - question: "After Hermes killed Argus as he guarded Io, where did Hera place his eyes?"
        answer: "(TAIL OF) PEACOCK"
      - question: "Earlier in his life, Argus had killed what monster, who bore several children to Typhon?"
        answer: "ECHIDNA"
  - tossup:
      question: "When you are recognized, please perform the following commands:  Claude <latin>oculōs</latin> et vehementer <latin>rīdē</latin>."
      answer: "STUDENT CLOSES AT LEAST TWO EYES & LAUGHS LOUDLY"
    boni:
      - question: "...:  <latin>Iacē</latin> in <latin>pavīmentō</latin> et <latin>simulā tē morī</latin>."
        answer: "STUDENT LIES ON THE GROUND AND PRETEND THAT THEY ARE DYING / DEAD"
      - question: "...:  <latin>Simulāte, sonitū</latin> et gestibus <latin>propriīs, vōs</latin> vehiculum agere."
        answer: "STUDENT PRETENDS TO DRIVE A CAR (MUST HAVE GESTURES & SOUND)"
  - tossup:
      question: "In order to avoid repeating mistakes of earlier imperial dynasties, Diocletian made sure that when he and Maximian abdicated that the new <latin>Augustī</latin> didn’t choose their relatives as <latin>Caesarēs</latin>.  Name the two sons of tetrarchs who would be declared emperor in 306 AD, despite the will of the tetrarchs."
      answer: "AND (M. AURELIUS VALERIUS) MAXENTIUS"
    boni:
      - question: "In what provincial city was Constantine declared Augustus by his father’s troops?"
        answer: "<latin>EBORĀCUM</latin> / YORK"
      - question: "What two tetrarchs tried and failed to take Rome back from Maxentius before Constantine"
        answer: "successfully defeated him at the Milvian Bridge?"
  - tossup:
      question: "Complete this analogy:  <latin>amō</latin> : <latin>amāverim</latin> :: <latin>frangō</latin> : _____."
      answer: "<latin>FRĒGERIM</latin>"
    boni:
      - question: "Change <latin>frēgerim</latin> to the passive."
        answer: "<latin>FRĀCTUS</latin> (-A, -UM) SIM"
      - question: "Change <latin>frāctus</latin> sim to the present tense."
        answer: "FRANGAR"
  - tossup:
      question: "The phrases <latin>mediā</latin> nocte and <latin>hōc annō</latin> both contain what use of the ablative case?"
      answer: "TIME WHEN"
    boni:
      - question: "What use of the ablative case is in the following sentence:  <latin>Iūlia, fēmina maximā virtūte, omnēs</latin>"
        answer: "<latin>iuvenēs</latin> facile <latin>superāvit</latin>? DESCRIPTION / CHARACTERISTIC"
      - question: "What use of the ablative case is in the following sentence:  <latin>Iūlia</latin> et <latin>Lūcia</latin> inter <latin>sē sententiā</latin>"
        answer: "differunt? SPECIFICATION / RESPECT"
  - tossup:
      question: "The <latin>Lēx</latin> Titia of 43 BC gave control of the Roman empire to which three men?"
      answer: ""
    boni:
      - question: "Which of the triumvirs took on the role of pontifex maximus vacated by Caesar?"
        answer: "LEPIDUS"
      - question: "Where in Cisalpine Gaul had Antony and Octavian faced off in 43 BC before joining forces and"
        answer: "forming the Second Triumvirate? MUTINA"
  - tossup:
      question: "Please translate into English:  Necesse est tibi quam <latin>plūrimōs sociōs habēre</latin>."
      answer: "IT IS NECESSARY FOR YOU TO / YOU MUST HAVE AS MANY FRIENDS / ALLIES AS POSSIBLE"
    boni:
      - question: "Please translate into English:  <latin>Sī dīligenter</latin> studueris, <latin>respondēre</latin> poteris."
        answer: "IF YOU STUDY / WILL HAVE STUDIED DILIGENTLY / HARD, YOU WILL BE ABLE TO ANSWER"
      - question: "Please translate into English:  Celeriter <latin>currēbāmus nē caperēmur</latin>."
        answer: "WE RAN / WERE RUNNING QUICKLY IN ORDER NOT TO / LEST WE BE CAPTURED / CAUGHT / TAKEN"
  - tossup:
      question: "Along with his sons Thrasymedes and Antilochus, who led ninety ships to the Trojan War in his old"
      answer: "age from sandy Pylos? NESTOR"
    boni:
      - question: "What news does Antilochus bring to Achilles in Book XVIII of the Iliad?"
        answer: "THE DEATH OF PATROCLUS"
      - question: "According to Pindar, who was attacking Nestor when Antilochus sacrificed himself to save his father?"
        answer: "MEMNON"
  - tossup:
      question: "Please listen to the following passage about <latin>Cīmōn</latin>, which I shall read twice, and answer the question that follows in Latin: <latin>Cīmōn habēbat satis prūdentiae nōn sōlum iūris cīvīlis sed etiam reī mīlitāris, quod cum patre suō in exercitibus decem annōs fuerat versātus.  Itaque hic et populum urbānum in suā potestāte tenuit et apud exercitum auctōritāte plūrimum valuit</latin>.  (repeat) The question:  <latin>Quōcum Cīmōn in exercitibus mīlitāverat</latin>?"
      answer: "<latin>CUM PATRE (SUŌ)</latin>"
    boni:
      - question: "Quam <latin>diū Cīmōn</latin> cum patre <latin>suō mīlitābat</latin>?"
        answer: "DECEM <latin>ANNŌS</latin>"
      - question: "Quibus <latin>rēbus Cīmōn</latin> et populum tenuit et apud exercitum <latin>plūrimum</latin> valuit?"
        answer: "<latin>POTESTĀTE</latin> ET <latin>AUCTŌRITĀTE</latin>"
  - tossup:
      question: "Which of Rome’s hills sat southwest of the Forum <latin>Rōmānum</latin> and was the site of the homes of Rome’s wealthiest 1%, including most of the emperors?"
      answer: "PALATINE"
    boni:
      - question: "Identify the hill of Rome marked E."
        answer: "AVENTINE"
      - question: "Give the letter that indicates the Caelian hill."
        answer: "D"
  - tossup:
      question: "What inhabitants of Anthemoëssa sang so beautifully that sailors leapt into the sea to be closer to their voices?"
      answer: "SIRENS / SEIRENES"
    boni:
      - question: "How did Odysseus prevent his crew from hearing the song of the Sirens as they sailed by the island of the Sirens?"
        answer: "FILLED THEIR EARS WITH WAX"
      - question: "In Book XII of the Odyssey, as Odysseus struggled to break his bonds in order to hear more of the Sirens’ song, two of his men tightened his bond and added more ropes to prevent him from breaking free.  Name one of these men."
        answer: "EURYLOCHUS / PERIMEDES"
  - tossup:
      question: "What use of the dependent subjunctive is illustrated in the following sentence: <latin>Petīvit ā mē</latin> quid"
      answer: "<latin>sentīrem</latin>. INDIRECT QUESTION"
    boni:
      - question: "What use of the dependent subjunctive is illustrated in the following sentence: Cum <latin>valdē timērem</latin>,"
        answer: "ego tamen in <latin>nāvem</latin> ingressus sum? CUM CONCESSIVE CLAUSE"
      - question: "What use of the dependent subjunctive is illustrated in the following sentence: <latin>Nāvis</latin> erat tam parva"
        answer: "ut <latin>nēmō sedēre</latin> posset? RESULT CLAUSE"
  - tossup:
      question: "Which of the following does NOT belong because of meaning:  nix, nimbus, imber, arbor, fulmen?"
      answer: "ARBOR"
    boni:
      - question: "...:  <latin>pariēs, mūrus</latin>, moenia, <latin>fōns, vāllum</latin>?"
        answer: "<latin>FŌNS</latin>"
      - question: "...:  <latin>tabernāria</latin>, opifex, <latin>pulmō, ēmptor, negōtiātor</latin>?"
        answer: "<latin>PULMŌ</latin>"
  - tossup:
      question: "A recent trend has been infusing water with fruits and vegetables like lemons, strawberries, and cucumber. What Latin verb is at the ultimate root of “infusion”?"
      answer: "<latin>FUNDŌ</latin>"
    boni:
      - question: "From what Latin noun do we derive “fundamental”, “profound”, and “founder”?"
        answer: "FUNDUS"
      - question: "From what Latin verb do we ultimately derive the English word “insipid”?"
        answer: "<latin>SAPIŌ</latin>"
  - tossup:
      question: "Idaea, the Curetes, Adrasteia, and Amaltheia all assisted in the rearing of what deity, whom Rhea hid on Mt. Ida in Crete so that he could grow up to become king of the gods?"
      answer: "ZEUS"
    boni:
      - question: "Rhea had hidden her son on Mt. Ida so that which king of the Titans could not find him?"
        answer: "CRONUS"
      - question: "Which of the figures listed in the tossup—Idaea, Adrasteia, and Amaltheia—was the goat whose milk nourished Zeus?"
        answer: "AMALTHEIA"
  - tossup:
      question: "Who regretfully declined Atalanta’s request to accompany his voyage because he feared that dissension would arise if there were a woman aboard the Argo?"
      answer: "JASON"
    boni:
      - question: "The crew of the Argo originally wanted what hero as captain, though he declined in favor of Jason, which is good because he later left the expedition to search for his lost friend, Hylas?"
        answer: "HERACLES"
      - question: "Which Argonaut was so young that he had to be accompanied by a chaperone, his half-brother Laocoön?"
        answer: "MELEAGER"
  - tossup:
      question: "Who declared himself emperor when he refused to renew his oath to Galba on January 1st 69 AD and was the third emperor recognized by the Roman senate that year because Otho overthrew Galba in Rome before the legions of the Rhine could descend upon Italy?"
      answer: "(A.) VITELLIUS"
    boni:
      - question: "The battles that began and ended Vitellius’ short reign both occurred near what northern Italian city?"
        answer: "CREMONA / BEDRIACUM"
      - question: "What lieutenant of Vitellius attempted to betray Ravenna to Vespasian’s troops but was abandoned by his men?"
        answer: "(A.) CAECINA (ALIENUS)"
  - tossup:
      question: "Which university has the Latin motto <latin>Deī</latin> sub <latin>nūmine</latin> viget, which means “under God’s power she flourishes”, on its university seal?"
      answer: "PRINCETON (UNIVERSITY)"
    boni:
      - question: "Give the Latin motto and its meaning for Brown University."
        answer: "IN <latin>DEŌ SPĒRĀMUS</latin> – IN GOD WE HOPE"
      - question: "Give the Latin motto and its meaning for Columbia University."
        answer: "IN <latin>LŪMINE TUŌ VIDĒBIMUS LŪMEN</latin> – IN THY / YOUR LIGHT WE SHALL / WILL SEE LIGHT"
  - tossup:
      question: "What Latin term refers to the dark and bitter fluid that would come out of the olives from their first pressing?"
      answer: "AMURCA"
    boni:
      - question: "For what purpose was the amurca largely used?"
        answer: "FERTILIZER"
      - question: "Olive oil had several purposes in Ancient Rome including bathing and meal preparation.  What common household item used olive oil as fuel?"
        answer: "LAMP / LUCERNA"
  - tossup:
      question: "Using <latin>oppugnō</latin>, please translate this sentence into Latin:  Yesterday, we saw the soldiers attacked"
      answer: "by rocks. (<latin>NŌS</latin>) <latin>HERĪ MĪLITĒS OPPUGNĀTŌS SAXĪS VĪDIMUS / SPECTĀVIMUS</latin>"
    boni:
      - question: "Using precor, say in Latin:  The girls, having prayed to the goddess, left from the temple."
        answer: "PUELLAE, DEAM <latin>PRECĀTAE</latin>, EX / <latin>Ē</latin> / AB / <latin>Ā TEMPLŌ DISCESSĒRUNT</latin>"
      - question: "Using <latin>eō</latin>, Say in Latin:  The soldiers are about to go to the Campus Martius in two hours."
        answer: "<latin>MĪLITĒS</latin> AD CAMPUM <latin>MĀRTIUM DUĀBUS HŌRĪS ITŪRĪ</latin> SUNT"
