tournament: NJCL Certamen
year: 2019
division: Intermediate
round: Finals
questions:
  - tossup:
      question: "To what classification do the verbs <latin>audeō, fidō, gaudeō</latin>, and <latin>soleō</latin> belong?"
      answer: "SEMI-DEPONENTS"
    boni:
      - question: "Using the verb <latin>gaudeō</latin>, say in Latin, “we rejoiced”."
        answer: "<latin>GĀVĪSĪ</latin> (-AE/-A) SUMUS"
      - question: "Using another semi-deponent verb, say in Latin “she has become”."
        answer: "FACTA EST"
  - tossup:
      question: "What hero’s funeral saw his mourners transformed into guinea fowls, his wife Cleopatra hang herself from grief, and his mother Althaea commit suicide from the guilt of burning his life-brand?"
      answer: "MELEAGER’S"
    boni:
      - question: "Who had earlier informed Althaea that Meleager would die if his life-brand was consumed?"
        answer: "ATROPOS / FATES / MOIRAI / PARCAE / FATA"
      - question: "What two brothers of Althaea had been killed by Meleager, resulting in Althaea killing her own son?"
        answer: "TOXEUS & PLEXIPPUS"
  - tossup:
      question: "North Dakota borders two Canadian provinces, Manitoba and Saskatchewan, and both have Latin mottoes.  Please translate the Latin motto of Manitoba, “<latin>glōriōsus</latin> et <latin>līber</latin>”?"
      answer: "GLORIOUS / FAMOUS / AMBITIOUS / BOASTFUL & FREE"
    boni:
      - question: "Please give the Latin motto for Alberta, which is similar to the motto of Manitoba and means “strong and free”."
        answer: "FORTIS ET <latin>LĪBER</latin>"
      - question: "Please give the Latin and the English for the motto of Saskatchewan."
        answer: "<latin>MULTĪS Ē</latin> GENTIBUS <latin>VĪRĒS</latin> – FROM MANY PEOPLES, STRENGTH"
  - tossup:
      question: "Using the verb <latin>appropinquō</latin>, please translate the following sentence into Latin:  They heard that within two hours the senator would approach the city."
      answer: "<latin>AUDĪVĒRUNT SENĀTŌREM URBĪ</latin> / AD URBEM <latin>DUĀBUS HŌRĪS APPROPINQUĀTŪRUM</latin> (ESSE)"
    boni:
      - question: "Using the verb <latin>vulnerō</latin>, say in Latin:  I saw that the soldiers had been wounded by the enemies."
        answer: "<latin>MĪLITĒS Ā</latin> / AB HOSTIBUS <latin>VULNERĀTŌS</latin> (ESSE)"
      - question: "Using the verb <latin>vulnerō</latin>, say in Latin:  We knew that the enemies would be wounded by the soldiers with daggers."
        answer: "(<latin>NŌS</latin>) <latin>SCĪVIMUS / SCIĒBĀMUS HOSTĒS Ā</latin> / AB <latin>MĪLITIBUS PUGIŌNIBUS / SICCĪS / CULTELLĪS / GLADIOLĪS VULNERĀTUM ĪRĪ</latin>"
  - tossup:
      question: "After trying unsuccessfully to coin new, uninflated currency, what further step did Diocletian take to try to stabilize prices and wages in the empire?"
      answer: "(PASSED AN EDICT) MANDATING MAXIMUM PRICES // THE EDICT OF (MAXIMUM) PRICES / <latin>ĒDICTUM DĒ PRETIĪS</latin>"
    boni:
      - question: "What penalty did the Edict of Prices mandate for its violation?"
        answer: "DEATH"
      - question: "What new coin made of gold did Constantine introduce to try to resolve the problem?"
        answer: "SOLIDUS"
  - tossup:
      question: "Please do not open the visual until you are told to do so.  Remember, this is the beginning of this toss-"
      answer: "up question and no consultation may take place starting now. <latin>Respondē Latīnē</latin>: <latin>dīc</latin> numerum <latin>pictūrae</latin> quae tantum ostendit arma <latin>mīlitis Rōmānī nōmine scūtum</latin>? QUATTUOR / QUARTA"
    boni:
      - question: "You may now consult.  <latin>Respondē Latīnē</latin>: In <latin>prīmā pictūrā</latin>, quid est <latin>nōmen tēlī</latin> quod <latin>mīles</latin> iactat?"
        answer: "<latin>PĪLUM</latin>"
      - question: "<latin>Respondē Latīnē</latin>: Quid est <latin>nōmen reī</latin> in <latin>pictūrā secundā, sīcut scūtum</latin> sed <latin>rōtundum</latin>?"
        answer: "CLIPEUS"
  - tossup:
      question: "According to Ovid’s Metamorphoses, what Theban serving-girl so startled the goddess Lucina that she jumped up and unclasped her hands and uncrossed her legs, allowing Alcmene to give birth to Hercules?"
      answer: "GALANTHIS"
    boni:
      - question: "Furious at having been tricked, Lucina transformed Galanthis into what kind of animal?"
        answer: "WEASEL"
      - question: "The Thebans told a similar story, however they identified the heroine not as Galanthis, but as what daughter of Tiresias?"
        answer: "HISTORIS"
  - tossup:
      question: "Please listen to the following epitaph, which I shall read twice, and answer the question that follows in English:"
      answer: "<latin>vīdī</latin> pȳ<latin>rāmidās</latin> sine <latin>tē</latin>, dulcissime <latin>frāter</latin>, et tibi, quod <latin>potuī, lacrimās hīc</latin> ego maesta <latin>profūdī</latin>, et <latin>nostrī</latin> memorem <latin>lūctūs</latin> hanc <latin>sculpō querēlam</latin>.  sit <latin>nōmen Decimī Gentiānī</latin> pȳ<latin>rāmide altā</latin>, pontificis comitisque <latin>tuīs, Trāiāne, triumphīs</latin>.  (repeat) The question: In what emotional state did the author carve this epitaph? GRIEVING / SAD / MOURNFUL / SORROWFUL"
    boni:
      - question: "Who wrote these lines?"
        answer: "THE SISTER OF DECIMUS / GENTIANUS"
      - question: "In what two ways did Decimus Gentianus serve Trajan?"
        answer: "AS HIS PRIEST & COMPANION IN HIS TRIUMPHS"
  - tossup:
      question: "On the island of Chryse, which Malian leader received a snakebite which smelled so bad that the other Greeks, at Odysseus’ urging, left him on the island of Lemnos?"
      answer: "PHILOCTETES"
    boni:
      - question: "The Greeks were eventually forced to rescue Philoctetes, since he possessed the bow and arrows of which great hero—items that Helenus prophesied the Greeks needed to take Troy?"
        answer: "HERACLES"
      - question: "To possess the bow and arrows of Heracles was one of the four conditions for capturing Troy outlined by Helenus. Name any two of the remaining three."
        answer: "NEOPTOLEMUS / PYRRHUS (THE SON OF ACHILLES) FIGHTS WITH THE GREEKS, THE BONES OF PELOPS ARE BROUGHT TO TROY, THE PALLADIUM (IS STOLEN)"
  - tossup:
      question: "Whose veterans, not content to farm, had a taste for influencing the politics of Rome, and were loyal supporters of the oligarchy whose power he had restored?"
      answer: "(L. CORNELIUS) SULLA (FELIX)’S"
    boni:
      - question: "What rebel of 77 BC was defeated by Lutatius Catulus with the help of Sulla’s veterans?"
        answer: ""
      - question: "Which insurgent, who lost the consulship despite promising the cancellation of debts, gathered a rebel army made up primarily of Sulla’s veterans?"
        answer: "(L. SERGIUS) CATILINA / CATILINE"
  - tossup:
      question: "<latin>Dēscrībāmus</latin> nunc <latin>proprietātēs dictiōnum</latin> in <latin>hāc sententiā</latin>:   Nec verbum <latin>verbō cūrābis</latin> reddere <latin>fīdus</latin> interpres. <latin>Quō cāsū</latin> est “verbum”?"
      answer: "(IN) <latin>ACCŪSĀTĪVŌ</latin>"
    boni:
      - question: "<latin>Quō</latin> tempore est “<latin>cūrābis</latin>”?"
        answer: "(IN) <latin>FUTŪRŌ</latin>"
      - question: "Reddere est <latin>Infīnītīvum</latin>.  <latin>Dīc</latin> mihi <latin>fōrmam</latin> tempore <latin>perfectō</latin>."
        answer: "REDDIDISSE"
  - tossup:
      question: "In Book VII of the Aeneid, what maiden’s hair goes up in flames, prompting her father to learn from the oracle of Faunus that she must marry a foreigner?"
      answer: "LAVINIA’S"
    boni:
      - question: "Lavinia’s father had initially betrothed her to Turnus but retracted that promise after hearing the oracle’s words, while her mother insisted on keeping the promise of her betrothal to Turnus. Name the father and mother of Lavinia."
        answer: "LATINUS AND AMATA"
      - question: "Name the son of Aeneas and Lavinia, whom Aeneas sees “leaning on a headless spear” during his katabasis in Book VI of the Aeneid."
        answer: "SILVIUS"
  - tossup:
      question: "Of the words unguis, <latin>rōstrum, zōna, machinātrix</latin>, and malleus, which is being described in the following sentence: est <latin>ōs</latin> quod <latin>animālia</latin> habent ut cibum capiant?"
      answer: "<latin>RŌSTRUM</latin>"
    boni:
      - question: "...:  est vinculum <latin>quō</latin> cingimur?"
        answer: "<latin>ZŌNA</latin>"
      - question: "...:  est <latin>fābrīle īnstrūmentum</latin> ad tundendum?"
        answer: "MALLEUS"
  - tossup:
      question: "Rome’s first foray into the affairs of the Hellenistic successor states of the Eastern Mediterranean came when Valerius Laevinus was sent east to fight what Macedonian king who had allied with an enemy of Rome?"
      answer: "PHILIP V"
    boni:
      - question: "With what enemy had Philip V allied himself?"
        answer: "HANNIBAL / CARTHAGE"
      - question: "The Second Macedonian War started when Pergamene and Rhodian envoys requested aid in their war against Philip V, though they had refused a similar request from the Aetolians the previous year.  Rome’s change of heart may have been caused by Philip’s secret alliance with what other Hellenistic monarch?"
        answer: "ANTIOCHUS III"
  - tossup:
      question: "Change the phrase hoc <latin>tōtum</latin> oppidum to the dative singular."
      answer: "HUIC <latin>TŌTĪ OPPIDŌ</latin>"
    boni:
      - question: "Change illa magna carbasus to the plural."
        answer: "ILLA MAGNA CARBASA"
      - question: "Change id <latin>sumptuōsum</latin> epulum to the plural."
        answer: "EAE <latin>SUMPTUŌSAE</latin> EPULAE"
  - tossup:
      question: "Please translate into English:  Cum uxor <latin>senātōris</latin> ad forum <latin>ambulāret</latin>, eam ad <latin>cēnam invītāvimus</latin>."
      answer: "WHEN THE SENATOR’S WIFE WAS WALKING TO THE FORUM, WE INVITED HER TO DINNER"
    boni:
      - question: "Please translate into English:  <latin>Timēbāmus nē</latin> uxor <latin>senātōris</latin> ad <latin>cēnam nōn invītāta</latin> esset."
        answer: "WE WERE AFRAID / FEARED THAT THE SENATOR’S WIFE HAD NOT BEEN INVITED TO DINNER"
      - question: "Please translate into English:  Nisi <latin>uxōrem senātōris</latin> ad <latin>cēnam invitāverimus</latin>, erit <latin>īrātissima</latin>."
        answer: "IF WE DON’T / SHALL / WILL NOT HAVE INVITE / UNLESS WE SHALL HAVE INVITED THE SENATOR’S WIFE TO DINNER, SHE WILL BE VERY ANGRY"
  - tossup:
      question: "Who set up Parthamaspates as a client-king in Parthia after capturing Ctesiphon and earning the title Parthicus, capping off his conquest of the Parthians that created the Roman provinces of Armenia and Mesopotamia?"
      answer: "TRAJAN"
    boni:
      - question: "Who was Trajan’s wife, who aided in the accession of Hadrian after Trajan’s death?"
        answer: "PLOTINA"
      - question: "What equestrian of Italica and praetorian prefect helped Plotina secure Hadrian’s throne?"
        answer: ""
  - tossup:
      question: "Which of the following English words, if any, does NOT come from the same ultimate Latin root as “adore”: usher, abortive, osculate, inexorable?"
      answer: "ABORTIVE"
    boni:
      - question: "Which of the following English words, if any, does NOT come from the same ultimate Latin root as “naive”: puny, renaissance, cognate, nascent?"
        answer: "ALL OF THEM COME FROM THE SAME LATIN ROOT AS NAIVE"
      - question: "Which of the following English words, if any, does NOT come from the same ultimate Latin root as the others: potable, potency, poison, potion?"
        answer: "POTENCY"
  - tossup:
      question: "What use of the ablative case can be found in the following sentence:  <latin>Discipulī optimī</latin> semper <latin>legendō</latin> fruuntur?"
      answer: "WITH SPECIAL / DEPONENT VERB (FRUOR) // MEANS / INSTRUMENT"
    boni:
      - question: "What use of the ablative case can be found in the following sentence:  <latin>Cīvēs timōre effugiēbant</latin>?"
        answer: "CAUSE"
      - question: "What use of the ablative case can be found in the following sentence:  <latin>Mercātor quīndecim dēnāriīs</latin> togam <latin>vēndēbat</latin>?"
        answer: "PRICE"
  - tossup:
      question: "Which of the Seven Against Thebes was ambushed by fifty Theban youths but was able to kill all of them except for their leader, Maeon?"
      answer: "TYDEUS"
    boni:
      - question: "What act committed by Tydeus so grossed out the goddess Athena that she changed her mind about making Tydeus immortal?"
        answer: "HE ATE THE BRAINS OF (HIS ENEMY) MELANIPPUS"
      - question: "Which of the Seven Against Thebes was killed by Zeus’ thunderbolt because he had boasted that not even Zeus could prevent him from invading Thebes?"
        answer: "CAPANEUS"
