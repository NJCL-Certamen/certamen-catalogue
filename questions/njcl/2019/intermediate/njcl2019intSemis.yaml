tournament: NJCL Certamen
year: 2019
division: Intermediate
round: Semifinals
questions:
  - tossup:
      question: "After the deaths of Gordian I and Gordian II, what senate-appointed emperor marched out to meet Maximinus Thrax in battle only to find that Thrax had been murdered?"
      answer: ""
    boni:
      - question: "In what city where Maximinus was murdered did Pupienus meet the enemy legions and send them back to their posts?"
        answer: "AQUILEIA"
      - question: "What co-Augustus of Pupienus took charge of managing domestic affairs in Rome, while Pupienus was out in the field?"
        answer: "(DECIUS CAELIUS CALVINUS) BALBINUS"
  - tossup:
      question: "<latin>Dēscrībāmus</latin> nunc <latin>prōprietātēs dictiōnum</latin> in <latin>hāc sententiā</latin>: <latin>dā mī plūrēs quaestiōnēs</latin>! <latin>Quō cāsū</latin> est “<latin>mī</latin>”?"
      answer: "<latin>DATĪVŌ</latin>"
    boni:
      - question: "Cuius <latin>mōdī</latin> est “<latin>dā</latin>”?"
        answer: "<latin>IMPERĀTĪVĪ</latin>"
      - question: "Cuius <latin>numerī</latin> est “<latin>quaestiōnēs</latin>”?"
        answer: "<latin>PLŪRĀLIS</latin>"
  - tossup:
      question: "What monstrous son of Vulcan hid in the Aventine Hill after he stole the cattle of Geryon that Hercules was leading home through Italy?"
      answer: "CACUS"
    boni:
      - question: "In the Aeneid, who tells the story of Cacus and Hercules to Aeneas?"
        answer: "EVANDER"
      - question: "Vulcan was also the purported father of what Latin leader in the Aeneid, who was conceived when a"
        answer: "spark flew into his mother’s lap? CAECULUS / SERVIUS TULLIUS"
  - tossup:
      question: "Please translate into English:  <latin>cīvēs</latin> ad urbem <latin>ībant</latin> ut <latin>rēgem audīrent</latin>."
      answer: "THE CITIZENS WERE GOING / WENT TO THE CITY TO HEAR / LISTEN TO THE KING"
    boni:
      - question: "Please translate into English:  <latin>cīvēs rēgem ōrābant nē</latin> hostibus parceret."
        answer: "THE CITIZENS WERE BEGGING / BEGGED THE KING NOT TO SPARE THE ENEMY / ENEMIES"
      - question: "Please translate into English:  <latin>cīvēs nesciēbant quārē rēx</latin> hostibus parcere voluisset."
        answer: "THE CITIZENS DIDN’T KNOW WHY THE KING HAD WANTED TO SPARE THE ENEMY / ENEMIES"
  - tossup:
      question: "Where should you apply a medication labeled o.d.?"
      answer: "RIGHT EYE"
    boni:
      - question: "How often should a medication be applied if it is labeled q.h.?"
        answer: "EVERY HOUR"
      - question: "Where should you apply a medication labeled a.s.?"
        answer: "LEFT EAR"
  - tossup:
      question: "Please do not open the visual until you are told to do so.  Remember, this is the beginning of this toss-"
      answer: "up question and no consultation may take place starting now. What goddess is depicted in this visual carrying the body of her son off the field of Troy?  Later Zeus transformed the smoke from his pyre into birds at her behest. EOS / AURORA"
    boni:
      - question: "You may now consult with your teammates.  Give the letter of the pot that shows a man who has already murdered his father and is on the way to marrying his mother?"
        answer: "A"
      - question: "Give the letter of the pot on which one of the Eumenides appears?"
        answer: "B"
  - tossup:
      question: "The establishment of an assembly based on wealth and the construction of a wall around Rome are two of the achievements attributed to which king of Rome who ruled during a period of Etruscan domination in Rome?"
      answer: "SERVIUS TULLIUS"
    boni:
      - question: "Aside from aiding in the planning, how is Tullius’ daughter said to have participated in his death?"
        answer: "RAN HIM / HIS CORPSE OVER WITH A CHARIOT"
      - question: "With what Etruscan hero did the emperor Claudius identify Servius Tullius?"
        answer: "MASTARNA (OF VULCI)"
  - tossup:
      question: "Please translate into Latin using a gerundive:  We must praise the poet."
      answer: "<latin>POĒTA NŌBĪS</latin> LAUDANDUS EST"
    boni:
      - question: "Please translate into Latin using a gerundive:  I will have to lead the legion."
        answer: "<latin>LEGIŌ</latin> MIHI <latin>DŪCENDA</latin> ERIT"
      - question: "Please translate into Latin using a gerundive:  The daughters had to tell the longest stories."
        answer: "LONGISSIMAE <latin>FĀBULAE FĪLIĀBUS NĀRRANDAE</latin> ERANT"
  - tossup:
      question: "Differentiate in meaning between manus and <latin>mūnus</latin>."
      answer: "MANUS – HAND / BAND (OF MEN), <latin>MŪNUS</latin> – OFFICE / DUTY / FUNCTION / GIFT / (PUBLIC) SHOW"
    boni:
      - question: "Differentiate in meaning between <latin>nāscor</latin> and <latin>īrāscor</latin>."
        answer: "<latin>NĀSCOR</latin> – TO BE BORN / BEGOTTEN / TO RISE / SPRING FORTH // <latin>ĪRĀSCOR</latin> – TO BE(COME) ANGRY / TO BE IN A RAGE"
      - question: "Differentiate in meaning between <latin>īdem</latin> and identidem."
        answer: "<latin>ĪDEM</latin> – THE SAME // IDENTIDEM – REPEATEDLY / AGAIN & AGAIN"
  - tossup:
      question: "Complete the following analogy: bonus : melior :: <latin>extrā</latin> : _____."
      answer: "EXTERIOR"
    boni:
      - question: "Complete the following analogy: bonus : optimus :: <latin>extrā</latin> : _____."
        answer: "<latin>EXTRĒMUS</latin>"
      - question: "Complete the following analogy: bene : melius :: prae : _____."
        answer: "PRIUS"
  - tossup:
      question: "Who, in 31 AD, revealed to her brother-in-law the abuses of power that Sejanus was committing, leading Tiberius to remove him from his position decisively?"
      answer: "ANTONIA (MINOR)"
    boni:
      - question: "Name the three surviving children of Antonia and Drusus."
        answer: "GERMANICUS, LIVILLA / CLAUDIA LIVIA JULIA, CLAUDIUS"
      - question: "What emperor bestowed upon Antonia the title of Augusta, but later may have driven her to suicide?"
        answer: "GAIUS (IULIUS CAESAR GERMANICUS) / CALIGULA"
  - tossup:
      question: "What use of the accusative can be found in the following sentence:  <latin>Athlētae</latin> quattuor <latin>mīlia</latin> passuum <latin>currēbant</latin>?"
      answer: "EXTENT (OF SPACE)"
    boni:
      - question: "Say in Latin using <latin>fodiō</latin> and fossa:  They dug a fifteen foot trench."
        answer: "FOSSAM <latin>QUĪNDECIM</latin> PEDUM <latin>FŌDĒRUNT / FODIĒBANT</latin>"
      - question: "Say in Latin using talentum, <latin>talentī</latin>, n.: The gladiator bought his freedom for two talents."
        answer: "<latin>GLADIĀTOR LĪBERTĀTEM DUŌBUS TALENTĪS ĒMIT / EMĒBAT</latin>"
  - tossup:
      question: "After attaching dried hides and bronze kettles to the rear of his chariot, which son of Aeolus sped through his city, throwing torches and pretending to be the god Zeus?"
      answer: "SALMONEUS"
    boni:
      - question: "Name Salmoneus’ second wife, who was seduced by Poseidon in the form of the river god Enipeus and bore twins to him."
        answer: "TYRO"
      - question: "Name those twins, who were abandoned at birth and reared by horse-herders."
        answer: "NELEUS AND PELIAS"
  - tossup:
      question: "Please listen to the following sentences, which I shall read twice, and answer the question that follows in Latin:"
      answer: "<latin>Quīdam</latin> vir in <latin>amphitheātrō oculōs</latin> clausit <latin>nē</latin> in <latin>voluptātēs vulgī</latin> incideret.  Utinam <latin>aurēs interclūsisset</latin>!  Nam ubi <latin>ūnus ē gladiātōribus</latin> cecidit et <latin>clāmor</latin> ortus est, ille, <latin>cūriōsitāte</latin> victus, <latin>oculōs</latin> aperuit.  Simulatque <latin>vīdit</latin> sanguinem, <latin>saevitātem</latin> quandam simul imbibit. The question:  <latin>Quō cōnsiliō</latin> vir <latin>oculōs</latin> in <latin>amphitheātrō</latin> clauserat? <latin>NĒ</latin> IN <latin>VOLUPTĀTĒS</latin> (<latin>VULGĪ</latin>) INCIDERET"
    boni:
      - question: "Quid hic vir facere <latin>nōn</latin> potuerat?"
        answer: "<latin>AURĒS INTERCLŪDERE</latin>"
      - question: "Postquam sanguinem <latin>vīdit, quō</latin> hic vir captus est?"
        answer: "<latin>SAEVITĀTE</latin> (<latin>QUĀDAM</latin>)"
  - tossup:
      question: "<latin>Respondē</latin> aut <latin>Anglicē</latin> aut <latin>Latīnē</latin>: <latin>Quālem</latin> togam <latin>imperātor Rōmānus</latin> in <latin>triumphō gerēbat</latin>?"
      answer: "(TOGAM) PICTAM / TOGA PICTA / PAINTED TOGA / THE RED-PURPLE TOGA"
    boni:
      - question: "<latin>Respondē Latīnē</latin>: <latin>Quālem</latin> togam <latin>Rōmānus magnā</latin> cum <latin>maestitiā gerēbat</latin>?"
        answer: "(TOGAM) PULLAM / SORDIDAM"
      - question: "<latin>Respondē Latīnē</latin>: <latin>Quālem</latin> togam <latin>clāvum</latin> purpureum <latin>habēbat</latin>?"
        answer: "(TOGAM) PRAETEXTAM"
  - tossup:
      question: "According to Ovid’s Metamorphoses, what outlaw’s bones hardened into rocks after Theseus kicked him over a cliff, reversing the method by which he himself killed passers-by on the Isthmus of Corinth?"
      answer: "SC(E)IRON"
    boni:
      - question: "Sceiron kicked passers-by into the waiting jaws of what giant pet?"
        answer: "(SEA) TURTLE / TORTOISE"
      - question: "Which ruler of Eleusis was also slain by Theseus after the hero outwrestled him?"
        answer: "CERCYON"
  - tossup:
      question: "What English adjective, derived from the Latin verb <latin>noceō</latin>, means “harmful, poisonous, or unpleasant to living things”?"
      answer: "NOXIOUS / NOCUOUS"
    boni:
      - question: "What noun, derived from the Latin verb <latin>quaerō</latin>, can be defined as “a long period of intensive and harsh interrogation or questioning”?"
        answer: "INQUISITION"
      - question: "What English noun, derived from the Latin verb <latin>parcō</latin>, can mean “unwillingness to spend money or"
        answer: "resources”? PARSIMONY / PARSIMONIOUSNESS"
  - tossup:
      question: "Colus, <latin>iūgerum, vās</latin>, and <latin>famēs</latin> are nouns that have forms in different declensions.  What grammatical term is used to describe these noun that vary in declensions?"
      answer: "HETEROCLITES"
    boni:
      - question: "What TWO possibilities exist for the ablative singular of domus?"
        answer: "<latin>DOMŌ, DOMŪ</latin>"
      - question: "Between which declensions does <latin>iūgerum</latin> vary its forms?"
        answer: "2ND & 3RD"
  - tossup:
      question: "What mythological island was the location where Jason and Medea were purified of the murder of Apsyrtus and the birthplace of Telegonus?"
      answer: "AEAEA"
    boni:
      - question: "Hermes gave what Aeaean herb to Odysseus so that he might ward off the charms of Circe?"
        answer: "MOLY"
      - question: "Which of Odysseus’ crew led the twenty-three-man expedition originally sent to scout Circe’s house on Aeaea?"
        answer: "EURYLOCHUS"
  - tossup:
      question: "What temple in the Campus Martius was rebuilt during Hadrian’s reign, though its pedimental inscription harkens to its original builder, Marcus Agrippa?"
      answer: "PANTHEON"
    boni:
      - question: "In what city, eighteen miles east of Rome, did Hadrian build a spectacular villa containing eight palaces, a Temple to Serapis, a palaestra, a library, and a stadium?"
        answer: "TIBUR / TIVOLI"
      - question: "What building, located between the Colosseum and the northeast corner of the Roman Forum, was built by Hadrian and contained two back to back chambers dedicated to two different goddesses?"
        answer: "TEMPLE OF VENUS AND ROME / TEMPLUM VENERIS ET <latin>RŌMAE</latin>"
