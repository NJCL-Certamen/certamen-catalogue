tournament: NJCL Certamen
year: 2019
division: Novice
round: Round 1
questions:
  - tossup:
      question: "Balius, Arion, Xanthus, and Pegasus were all what kind of animal?"
      answer: "HORSE(S)"
    boni:
      - question: "What Greek hero at Troy was the owner of Xanthus and Balius?"
        answer: "ACHILLES"
      - question: "What hero used Pegasus to aid in his defeat of the Chimaera?"
        answer: "BELLEROPHON"
  - tossup:
      question: "From what Latin verb do we derive the English words contaminate and intact?"
      answer: "<latin>TANGŌ</latin>"
    boni:
      - question: "From what Latin verb do we derive the English words accent, enchant, and cantor?"
        answer: "<latin>CANŌ / CANTŌ</latin>"
      - question: "From what Latin verb do we derive the English words remain and mansion?"
        answer: "<latin>MANEŌ</latin>"
  - tossup:
      question: "What general surprised the Romans after his sack of Saguntum in Spain by marching over the Alps, elephants and all, and defeating every Roman army he faced in Italy, almost winning the Second Punic War for Carthage?"
      answer: "HANNIBAL (BARCA)"
    boni:
      - question: "What Roman general was the only one to defeat Hannibal on the battlefield during this war, at the battle of Zama?"
        answer: "(P. CORNELIUS) SCIPIO AFRICANUS (MAIOR)"
      - question: "At what cavalry skirmish more than a decade earlier had Scipio saved his father’s life during a confrontation with Hannibal’s army?"
        answer: "TICINUS (RIVER)"
  - tossup:
      question: "Using the verb <latin>scrībō</latin>, give the 1st person plural, pluperfect, active, indicative form, which means “we had written.”"
      answer: "<latin>SCRĪPSERĀMUS</latin>"
    boni:
      - question: "Make <latin>scrīpserāmus</latin> future perfect."
        answer: "<latin>SCRĪPSERIMUS</latin>"
      - question: "Now say “we will write.”"
        answer: "<latin>SCRĪBĒMUS</latin>"
  - tossup:
      question: "Translate this Latin motto found on the $1 bill:  \"Novus <latin>Ōrdō Seclōrum</latin>\"."
      answer: "A NEW ORDER OF THE GENERATIONS / AGES"
    boni:
      - question: "Translate this Latin motto found on the $1 bill:  \"Annuit <latin>Coeptīs</latin>\"."
        answer: "HE HAS SMILED UPON / NODDED ON THE / OUR BEGINNINGS / UNDERTAKINGS"
      - question: "Translate this, the Latin motto of the United States:  \"<latin>Ē Plūribus Ūnum</latin>\"."
        answer: "OUT OF MANY, ONE / ONE FROM MANY / MORE"
  - tossup:
      question: "In August of 70 AD, what future emperor led the sack of Jerusalem after his father Vespasian had relinquished the command in Judaea to him?"
      answer: "TITUS (FLAVIUS VESPASIANUS)"
    boni:
      - question: "Though Jerusalem fell in 70 AD, the Flavians continued to persecute the Jews for three more years. What Judaean stronghold was the last to fall in May of 73 after a six-month siege?"
        answer: "MASADA"
      - question: "What general led the 7,000 legionaries and auxiliaries needed to take Masada?"
        answer: "FLAVIUS SILVA"
  - tossup:
      question: "Which of the following prepositions does NOT take the same case as the others: ad, <latin>extrā</latin>, ante, sine, ob?"
      answer: "SINE"
    boni:
      - question: "What case does sine take?"
        answer: "ABLATIVE"
      - question: "What case do the others take?"
        answer: "ACCUSATIVE"
  - tossup:
      question: "What city had a citadel called the “Cadmeia,” named after its founder Cadmus?"
      answer: "THEBES"
    boni:
      - question: "Cadmus populated the city in part by planting what object?"
        answer: "SERPENT / DRAGON’S TEETH"
      - question: "Originally the entire city was named Cadmeia, but it was renamed for Thebe, the wife of what king of Thebes?"
        answer: "ZETHUS"
  - tossup:
      question: "A dedication to Mars in Martlesham, England simply states, “Glaucus <latin>fēcit</latin>.” What did Glaucus do?"
      answer: "HE MADE IT / CREATED THE DEDICATION // IT // MAKE"
    boni:
      - question: "You are now looking at a different inscription from England. What type of group erected this marker?"
        answer: "(A) LEGION(S)"
      - question: "Give the numbers of the two legions which erected this marker."
        answer: "6 / SIXTH & 20 / TWENTIETH"
  - tossup:
      question: "Fac sonum <latin>ursī</latin>."
      answer: "STUDENT SHOULD MAKE A BEAR SOUND"
    boni:
      - question: "Facite, <latin>omnēs</latin>, sonum <latin>lupōrum</latin> ululantium."
        answer: "ALL STUDENTS SHOULD MAKE WOLF HOWLS"
      - question: "Facite, <latin>omnēs</latin>, sonum <latin>gallōrum māne</latin> cantantium."
        answer: "ALL STUDENTS SHOULD CROW LIKE ROOSTERS IN THE MORNING"
  - tossup:
      question: "Whom did Veturia and Volumnia famously talk out of attacking Rome?"
      answer: ""
    boni:
      - question: "What enemy tribe had Coriolanus led to the gates of Rome?"
        answer: "VOLSCI(ANS)"
      - question: "What much later barbarian enemy of Rome was talked out of attacking Rome or invading deeper into Italy by Pope Leo I?"
        answer: "ATTILA (THE HUN)"
  - tossup:
      question: "What mythological trio was comprised of two immortal monsters, Stheno and Euryale, and one mortal monster, Medusa?"
      answer: "GORGONS"
    boni:
      - question: "What hero killed the mortal monster, Medusa?"
        answer: "PERSEUS"
      - question: "The Gorgons were generally believed to be the children of the ancient sea-monster Ceto with what sea-god, her brother?"
        answer: "PHORCYS"
  - tossup:
      question: "Which of the following English words, if any, does not belong by derivation: accident, herbicide, scissor, concise?"
      answer: "ACCIDENT"
    boni:
      - question: "The English word accident is derived from what Latin verb with what meaning?"
        answer: "<latin>CADŌ</latin> – TO FALL"
      - question: "Which of the following English words, if any, does not belong by derivation: captive, captain, capable, accept?"
        answer: "CAPTAIN"
  - tossup:
      question: "Listen carefully to the following passage, which I will read twice, and answer IN ENGLISH the question that follows:<latin>Ōlim</latin>, agricola <latin>amīcum</latin> in urbe <latin>Rōmā vīsitābat</latin>.  <latin>Prīmō diē</latin> agricola <latin>rogāvit</latin> “<latin>Mōnstrā</latin> mihi templa magna in urbe.”  Itaque <latin>amīcus</latin> agricolam ad forum <latin>dūxit</latin>.  In <latin>forō</latin> duo <latin>amīcī</latin> templum <latin>Dīvī Iūlī</latin>, et templum Vestae <latin>spectābant</latin>.  Tum <latin>amīcus</latin> et agricola montem <latin>Capitōlium ascendērunt</latin> et templum Iovis <latin>spectābant</latin>."
      answer: "The question: What did the farmer ask his friend? TO SHOW HIM THE (GREAT) TEMPLES (IN THE CITY) Very good!  Now answer these bonus questions IN LATIN"
    boni:
      - question: "Ubi in urbe <latin>Rōmā</latin> erat templum <latin>Dīvī Iūlī</latin>?"
        answer: "(IN) <latin>FORŌ</latin>"
      - question: "Quod templum in monte <latin>Capitōliō amīcī spectābant</latin>?"
        answer: "TEMPLUM IOVIS"
  - tossup:
      question: "What are the two <latin>praenōmina</latin> abbreviated by the letters C. and S.?"
      answer: "<latin>GĀIUS</latin> and SPURIUS / SEXTUS"
    boni:
      - question: "What is the abbreviation for the <latin>praenōmen</latin> Gnaeus?"
        answer: "CN"
      - question: "What information would the letters M. f. indicate in an inscription?"
        answer: "SON OF MARCUS"
  - tossup:
      question: "What woman announced that whoever shot an arrow through twelve axe-heads would be her new husband, though the only successful contestant was her disguised husband Odysseus?"
      answer: "PENELOPE"
    boni:
      - question: "Odysseus arrived disguised to Ithaca claiming to be the brother of “prince Idomeneus.” What island did he claim to be from?"
        answer: "CRETE"
      - question: "When the disguised Odysseus reached his house, what old serving-woman recognized him by the scar on his thigh?"
        answer: "EURYCLEIA"
  - tossup:
      question: "Of the nouns <latin>homō, ordō, virgō</latin>, and <latin>ōrātiō</latin>, which forms its stem differently than the others?"
      answer: "<latin>ŌRĀTIŌ</latin>"
    boni:
      - question: "Of the nouns <latin>vōx</latin>, nox, <latin>rēx</latin>, and dux, which two have genitive forms that end in -cis?"
        answer: "<latin>VŌX</latin> & DUX"
      - question: "Which of the following words, if any, is feminine:  tempus, animus, iter, domus? DOMUS"
        answer: ""
  - tossup:
      question: "Who killed his own brother after that brother jumped over a wall which he was building on the Palatine hill in the mid-8th century BC, in what is sometimes considered the original sin of Rome?"
      answer: "ROMULUS"
    boni:
      - question: "From what town, purportedly founded by Ascanius, did Romulus and Remus set out to found a new city?"
        answer: "ALBA LONGA"
      - question: "What animal had nursed the infants Romulus and Remus?"
        answer: "(SHE-)WOLF"
  - tossup:
      question: "Verte <latin>Anglicē</latin>: “<latin>stābās</latin>”"
      answer: "YOU WERE STANDING / USED TO STAND / KEPT STANDING"
    boni:
      - question: "Verte <latin>Anglicē</latin>: “<latin>stetistī</latin>”"
        answer: "YOU STOOD / HAVE STOOD / YOU DID STAND"
      - question: "Verte <latin>Anglicē</latin>: “steterant”"
        answer: "THEY HAD STOOD"
  - tossup:
      question: "What Trojan was condemned to the worst fate that can befall a seer: to utter predictions, but never be believed?"
      answer: "CASSANDRA"
    boni:
      - question: "Which deity condemned her to that fate when she refused his advances?"
        answer: "APOLLO"
      - question: "Cassandra unsuccessfully warned that the Greeks hid inside what device?"
        answer: "TROJAN HORSE"
