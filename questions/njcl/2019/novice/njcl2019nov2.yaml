tournament: NJCL Certamen
year: 2019
division: Novice
round: Round 2
questions:
  - tossup:
      question: "By what nickname do we better know Ptolemy XV Caesar, whom Marc Antony claimed to be Caesar’s acknowledged son?"
      answer: "CAESARION"
    boni:
      - question: "Give the name of Caesarion’s mother and give the letter of the image that represents her?"
        answer: "B – CLEOPATRA (VII)"
      - question: "Who is represented in the sculpture marked A along with the young prince Britannicus?"
        answer: ""
  - tossup:
      question: "When humans were unable to keep warm or to cook their food, who aided them by using a fennel stalk to steal fire from heaven?"
      answer: "PROMETHEUS"
    boni:
      - question: "Either Prometheus or Hephaestus aided in the birth of which goddess by splitting Zeus’ head with an axe?"
        answer: "ATHENA"
      - question: "Prometheus’ name means “forethought.” What brother of Prometheus had a name which meant “afterthought?”"
        answer: "EPIMETHEUS"
  - tossup:
      question: "In which declension or declensions are nouns in the neuter gender not found?"
      answer: "FIRST AND FIFTH"
    boni:
      - question: "The noun domus has endings in which two declensions?"
        answer: "SECOND AND FOURTH"
      - question: "In which declension are the nouns <latin>salūs, virtūs, lītus</latin>, and genus?"
        answer: "THIRD"
  - tossup:
      question: "Which one of these forms does not belong because of person: <latin>portāvī, vīxistī</latin>, surgitis, fugis?"
      answer: "<latin>PORTĀVĪ</latin>"
    boni:
      - question: "Which of these forms does not belong because of person: <latin>bibēbam, pōnēmus, laudātus erās, sūmptus erō, cēnābō</latin>?"
        answer: "<latin>LAUDĀTUS ERĀS</latin>"
      - question: "Which of these forms does not belong because of tense: capiet, <latin>tenēmus, habitābis</latin>, agam, <latin>cōnsūmētis</latin>?"
        answer: "<latin>TENĒMUS</latin>"
  - tossup:
      question: "What derivative of the Latin word <latin>trahō</latin> means “to teach someone a skill through practice and instruction over time”?"
      answer: "TRAIN"
    boni:
      - question: "What derivative of the Latin word <latin>trahō</latin> is defined as “a formally ratified agreement between two countries”?"
        answer: "TREATY"
      - question: "What derivative of <latin>trahō</latin> can be defined as “a summary of the contents of a book or article”?"
        answer: "ABSTRACT"
  - tossup:
      question: "The bronze giant Talus and the watchdog Laelaps were given by Zeus to what woman, whom he carried off from the seashore in the form of a bull?"
      answer: "EUROPA"
    boni:
      - question: "Name any of the three sons whom Europa had with Zeus."
        answer: "MINOS / RHADAMANTHYS / SARPEDON"
      - question: "What other lover of Zeus was transformed into a white heifer?"
        answer: "IO"
  - tossup:
      question: "<latin>Respondē</latin> aut <latin>Anglicē</latin> aut <latin>Latīnē</latin>: <latin>Quālis Rōmānus</latin> aut <latin>Rōmāna</latin> tunicam, pallam, et stolam <latin>gerēbat</latin>?"
      answer: "<latin>MĀTRŌNA / FĒMINA / MĀTER</latin> / DOMINA / PUELLA MATRON / WOMAN / MOTHER / MISTRESS / GIRL"
    boni:
      - question: "<latin>Respondē</latin> aut <latin>Anglicē</latin> aut <latin>Latīnē</latin>: <latin>Quālis Rōmānus</latin> aut <latin>Rōmāna</latin> lacernam, <latin>caligās</latin>, et <latin>lōrīcam gerēbat</latin>?"
        answer: "<latin>MĪLES</latin> / SOLDIER"
      - question: "<latin>Respondē</latin> aut <latin>Anglicē</latin> aut <latin>Latīnē</latin>: <latin>Quālis Rōmānus</latin> aut <latin>Rōmāna</latin> tunicam, togam praetextam, et <latin>mulleōs gerēbat</latin>?"
        answer: "<latin>MAGISTRĀTUS / SENĀTOR</latin> / MAGISTRATE / SENATOR"
  - tossup:
      question: "Listen carefully to the following passage, which I will read twice, and answer IN ENGLISH the question that follows: <latin>Postrīdiē, agricola et amīcus ad theātrum ambulāvērunt.  Fābula erat dē Hercule et Leōne Nemaeā.  In fābulā, leō āctrīcem oppugnāvit et āctrīx clāmāvit, “Ubi est Herculēs? Herculēs sōlus mē servāre potest!”  Tum āctor quī in fābulā erat Herculēs intrāvit.  Sed āctor erat vir parvus, et omnēs in theātrō magnā vōce rīdēbant.  Deinde agricola clāmāvit “Nōn est Herculēs, est rīdiculus mūs</latin>!” The question: In the play, who attacked the actress?"
      answer: "(AN ACTOR PLAYING) A/THE (NEMEAN) LION / DUDE IN A LION SUIT (PROMPT ON “ACTOR”)"
    boni:
      - question: "Why was everyone in the theater laughing?"
        answer: "BECAUSE THE ACTOR PLAYING HERCULES WAS A SMALL MAN"
      - question: "What does the farmer shout out?"
        answer: "THAT IT WAS NOT HERCULES BUT A (LAUGHABLE) MOUSE"
  - tossup:
      question: "What man received Chalciope’s hand in marriage after he came to Colchis on the back of a golden-"
      answer: "fleeced ram? PHRIXUS"
    boni:
      - question: "What sister of Phrixus fell off the ram on the way to Colchis?"
        answer: "HELLE"
      - question: "How many sons did Phrixus and Chalciope raise?"
        answer: "4"
  - tossup:
      question: "What two-word Latin phrase is the motto of the US Marine Corps?"
      answer: "SEMPER <latin>FIDĒLIS</latin>"
    boni:
      - question: "What two-word Latin phrase meaning 'a slip of the tongue' is used to indicate something that should not have been said?"
        answer: "LAPSUS LINGUAE"
      - question: "What two-word Latin phrase meaning ‘let the buyer beware’ is the motto the discerning consumer?"
        answer: "CAVEAT <latin>ĒMPTOR</latin>"
  - tossup:
      question: "Change the noun <latin>lēx</latin> to the genitive plural."
      answer: "<latin>LĒGUM</latin>"
    boni:
      - question: "Change the noun <latin>māter</latin> to the genitive plural."
        answer: "<latin>MĀTRUM</latin>"
      - question: "Change the noun corpus to the genitive plural."
        answer: "CORPORUM"
  - tossup:
      question: "Which is the best synonym of <latin>rēs pūblica</latin>:  <latin>rēgnum</latin>, imperium, <latin>cīvis, cīvitās</latin>?"
      answer: "<latin>CĪVITĀS</latin>"
    boni:
      - question: "Which is the best synonym of incendium:  Ignis, <latin>ascēnsus</latin>, beneficium, excessus?"
        answer: "IGNIS"
      - question: "Now, to change things up a little, which of the following is the best ANTONYM of <latin>frāctus</latin>: <latin>perīculōsus, īnsānus, tōtus</latin>, sollicitus?"
        answer: "<latin>TŌTUS</latin>"
  - tossup:
      question: "<latin>Respondē</latin> aut <latin>Anglicē</latin> aut <latin>Latīnē</latin>:  <latin>quī prīnceps</latin> Augustum <latin>secūtus</latin> est et <latin>vīgintī trēs annōs rēxit</latin>?"
      answer: "TIBERIUS (JULIUS CAESAR AUGUSTUS)"
    boni:
      - question: "<latin>Respondē</latin> aut <latin>Anglicē</latin> aut <latin>Latīnē</latin>: <latin>quī hērēs Augustī</latin> erat dux magnus, <latin>quī nāvibus Augustī</latin> praeerat apud Actium?"
        answer: "(M. VIPSANIUS) AGRIPPA"
      - question: "<latin>Respondē</latin> aut <latin>Anglicē</latin> aut <latin>Latīnē</latin>: quis erat <latin>Augustī hērēs prīmus</latin>, cui Augustus <latin>theātrum</latin> post mortem <latin>cōnstrūxit</latin>?"
        answer: "(M. CLAUDIUS) MARCELLUS"
  - tossup:
      question: "For the sentence, “The mother was playing in the atrium with her children,” what case and use would the phrase “with her children” be, if translated into Latin?"
      answer: "ABLATIVE OF ACCOMPANIMENT"
    boni:
      - question: "For the same sentence, what case and use would “in the atrium” be, if translated into Latin?"
        answer: "ABLATIVE OF PLACE WHERE"
      - question: "Now translate that full sentence into Latin."
        answer: "<latin>MĀTER</latin> CUM <latin>LĪBERĪS</latin> IN <latin>ĀTRIŌ LŪDĒBAT</latin>."
  - tossup:
      question: "What Latin verb is at the ultimate root of all the following English words: cuisine, concoct, cookie?"
      answer: "<latin>COQUŌ</latin>"
    boni:
      - question: "What derivative of <latin>coquō</latin> is a soft, white unsalted Italian cheese?"
        answer: "RICOTTA"
      - question: "What derivative of <latin>coquō</latin> is an English adjective that describes someone who has developed certain abilities at an earlier age than usual?"
        answer: "PRECOCIOUS"
  - tossup:
      question: "What province proved so vulnerable to the attacks of tribes such as the Selgovae and Novantae during the reigns of the Five Good Emperors that two of those emperors ordered that walls be built in the north of the province to define the boundary and allow defensive troops a place from which to muster?"
      answer: "BRITANNIA / BRITAIN"
    boni:
      - question: "Which wall was built between the firths of Tyne and Solway by Platorius Nepos?"
        answer: "HADRIAN’S (WALL)"
      - question: "For what emperor did Lollius Urbicus build of a turf wall further north?"
        answer: "ANTONINUS PIUS"
  - tossup:
      question: "Severed heads proliferated throughout the racecourse on which what woman defeated her suitors in footraces?"
      answer: "ATALANTA"
    boni:
      - question: "What suitor eventually defeated Atalanta in a footrace by distracting her with golden apples, thus winning her hand in marriage?"
        answer: "HIPPOMENES / MELANION"
      - question: "Another lover of Atalanta may have been what son of Oeneus, who awarded her the skin of the Calydonian boar after she was the first to wound the fierce wild beast?"
        answer: "MELEAGER"
  - tossup:
      question: "What was the result of the tribune Terentilius Harsa’s demand that Roman law be written and on display so that the laws would be fixed and everyone in Rome could view and understand them?"
      answer: "THE TWELVE TABLES / THE ESTABLISHMENT OF THE DECEMVIRI"
    boni:
      - question: "According to Roman lore, what was the Latin term for the board that was formed to codify Roman law into the Twelve Tables?"
        answer: "<latin>DECEMVIRĪ</latin> (<latin>LĒGIBUS SCRĪBUNDĪS</latin>)"
      - question: "What right, forbidden in the Twelve Tables, was granted 6 years later in 445 BC by the <latin>Lēx Canulēia</latin>?"
        answer: "INTERMARRIAGE BETWEEN PATRICIANS AND PLEBEIANS"
  - tossup:
      question: "Translate into Latin: the pigs have never seen the sky"
      answer: "<latin>PORCĪ / SUĒS / SCRŌFAE / APRĪ</latin> NUMQUAM CAELUM <latin>VĪDĒRUNT</latin>"
    boni:
      - question: "Now translate: many pigs want to fly."
        answer: "<latin>MULTĪ PORCĪ / SUĒS VOLĀRE</latin> VOLUNT / CUPIUNT"
      - question: "Now translate: the pigs are sad because they cannot fly."
        answer: "<latin>PORCĪ / SUĒS MISERĪ / TRĪSTĒS</latin> SUNT / MAERENT / <latin>LŪGENT</latin> / DOLENT, QUOD <latin>VOLĀRE NŌN</latin> POSSUNT / NEQUIUNT"
  - tossup:
      question: "What youth was taunted for not being a true son of Polybus and Merope, prompting him to journey to"
      answer: "Delphi and learn that he would kill his father and marry his mother? OEDIPUS"
    boni:
      - question: "Worried that he would kill Polybus and marry Merope, Oedipus immediately left what city, where he had grown up?"
        answer: "CORINTH"
      - question: "Name Oedipus’ mother, whom he unknowingly married after defeating the Sphinx at Thebes."
        answer: "JOCASTA / EPICASTA"
