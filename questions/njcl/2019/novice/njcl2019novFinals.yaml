tournament: NJCL Certamen
year: 2019
division: Novice
round: Finals
questions:
  - tossup:
      question: "What Latin verb is at the ultimate root of molt, commute, and permutation?"
      answer: "<latin>MŪTŌ</latin>"
    boni:
      - question: "From what Latin noun do we ultimately derive the English word muscle?"
        answer: "<latin>MŪS</latin>"
      - question: "From what Latin noun do we ultimately derive the English word amount?"
        answer: "<latin>MŌNS</latin>"
  - tossup:
      question: "On the tenth day after their slaughter, the gods themselves buried the twelve slain sons and daughters of what woman, who had declared that she was superior to the goddess Leto because of her children?"
      answer: "NIOBE"
    boni:
      - question: "What divine son and daughter of Leto conducted the slaughter of Niobe’s children?’"
        answer: "APOLLO AND ARTEMIS"
      - question: "To what co-king of Thebes had Niobe borne her children?"
        answer: "AMPHION"
  - tossup:
      question: "What was the Latin term for the person who accompanied a boy to school and ensured he arrived at home safely?"
      answer: "<latin>PAEDAGŌGUS</latin>"
    boni:
      - question: "What three subjects were taught to a Roman boy by a <latin>litterātor</latin>?"
        answer: "READING, WRITING, ARITHMETIC"
      - question: "What type of teacher would teach subjects such as Greek, geometry, history, and ethics to Roman boys?"
        answer: "<latin>GRAMMĀTICUS</latin>"
  - tossup:
      question: "Translate “courage” into Latin for the sentence, “The Gauls believed that they were greater in courage than the Romans.”"
      answer: "<latin>VIRTŪTE</latin>"
    boni:
      - question: "What use of the ablative is <latin>virtūte</latin> in that sentence?"
        answer: "(ABLATIVE OF) SPECIFICATION / RESPECT"
      - question: "Now translate: The Gauls were not greater in wealth than the Romans."
        answer: "<latin>GALLĪ NŌN</latin> ERANT <latin>CŌPIĀ / DĪVITIĪS</latin> / OPIBUS <latin>MĀIŌRĒS</latin> // <latin>DĪ</latin>(VI)<latin>TIŌRĒS RŌMĀNĪS</latin> / QUAM <latin>RŌMĀNĪ</latin>"
  - tossup:
      question: "Complete this analogy: movet : <latin>movēbit</latin> :: <latin>pōnō</latin> : _____."
      answer: "<latin>PŌNAM</latin>"
    boni:
      - question: "Complete this analogy: <latin>pōnam</latin> : <latin>pōnēmus</latin> :: <latin>laudāta</latin> es :: _____."
        answer: "<latin>LAUDĀTAE</latin> ESTIS"
      - question: "Complete this analogy: <latin>laudātae</latin> estis : <latin>laudāminī</latin> :: <latin>tetigērunt</latin>:: _____."
        answer: "TANGUNT"
  - tossup:
      question: "(HAND OUT THE VISUAL AND GIVE 5 SECONDS TO INSPECT IT)"
      answer: "This map shows not one, but three empires into which Europe and Asia Minor were split until what emperor, having overcome the opposition of his predecessor’s brother, Quintillus, brought both of the offshoot empires back under the sway of Rome, earning himself the title <latin>Restitūtor</latin> Orbis?"
    boni:
      - question: "Give the name of the emperor who ruled the green portion before being dethroned by Aurelian."
        answer: "TETRICUS (II)"
      - question: "What ruler had gained possession of the yellow portion when Gallienus could not defend his Eastern possessions, though this ruler’s widow, ruling in the name of his son, refused to acquiesce to renewed Roman control?"
        answer: "ODAENATHUS"
  - tossup:
      question: "What ruthless son of Triopas so scorned the gods that he cut down an oak tree sacred to Demeter and was punished with an insatiable hunger?"
      answer: "ERYSICHTHON"
    boni:
      - question: "When Erysichthon had eaten all his food, what daughter of his did he sell in order to buy more food?"
        answer: "MESTRA"
      - question: "Mestra, however, had the power to change shape, allowing her to escape. What god had granted her this power?"
        answer: "POSEIDON"
  - tossup:
      question: "<latin>Respondē Latīnē</latin>:  Augur <latin>avēs numerābat</latin>.  Erant novem <latin>avēs</latin> in <latin>terrā</latin> et novem <latin>avēs</latin> in <latin>caelō</latin>.  Quot <latin>avēs numerābat</latin>?"
      answer: "<latin>DUODĒVĪGINTĪ</latin>"
    boni:
      - question: "<latin>Serpēns trēs avēs cōnsūmpsit</latin>.  Quot <latin>avēs</latin> remanent?"
        answer: "<latin>QUĪNDECIM</latin>"
      - question: "Quot sunt <latin>quīndecim</latin> et <latin>quīndecim</latin>?"
        answer: "<latin>TRĪGINTĀ</latin>"
  - tossup:
      question: "What is the Latin phrase that is used for the list of characters in a play?"
      answer: "<latin>DRĀMATIS PERSŌNAE</latin>"
    boni:
      - question: "What three-word quotation from Vergil indicates how easy it is to get into the Underworld?"
        answer: "FACILIS <latin>DĒSCĒNSUS AVERNŌ</latin>"
      - question: "What two-word Latin phrase means “something you forgot or that slipped you mind”?"
        answer: "LAPSUS MEMORIAE / LAPSUS MENTIS"
  - tossup:
      question: "What goddess had an Ethiopian son who died in single combat with Achilles and a Trojan lover who became a cicada after she abandoned him in his old age?"
      answer: "EOS / AURORA"
    boni:
      - question: "Name both that son and that lover of Eos."
        answer: "MEMNON AND TITHONUS [RESPECTIVELY]"
      - question: "Eos also had several children with the Titan Astraeüs, including the winds and what embodiment of the morning star, the father of Ceyx?"
        answer: "EOSPHORUS"
  - tossup:
      question: "What emperor became so fed up with the philosophers’ opposition to his plan to treat the empire as a hereditary possession that he banished them from Italy and even executed Helvidius Priscus in 75 AD?"
      answer: "(T. FLAVIUS) VESPASIAN(US) DOMITIAN(US)"
    boni:
      - question: "For Priscus, being condemned to death was a family occupation.  Who was his father-in-law who had been condemned to death by Nero?"
        answer: "(P. CLODIUS) THRASEA PAETUS"
      - question: "Name one of the two sects of philosophers that led the opposition to the Flavians?"
        answer: "STOICS / CYNICS"
  - tossup:
      question: "Now translate:  Quaedam mulier ex <latin>currū</latin> quam <latin>celerrimē</latin> excessit A CERTAIN WOMAN DEPARTED / LEFT THE (FROM) CHARIOT/CAR AS QUICKLY AS POSSIBLE."
      answer: ""
    boni:
      - question: "Translate this sentence into English:  <latin>Quī cīvium quīnque mulierēs</latin> mittere <latin>cōnstituit</latin>?"
        answer: "WHICH / WHO OF THE CITIZENS DECIDED TO SEND FIVE WOMEN?"
      - question: "Now translate:  <latin>Trēs</latin> ex mulieribus per multa maria <latin>nāvem solvērunt</latin>."
        answer: "THREE OF THE WOMEN SET SAIL THROUGH MANY SEAS"
  - tossup:
      question: "Listen to the following passage, which I will read twice, and answer IN LATIN the question that follows:"
      answer: "<latin>Nāvis</latin> quae <latin>plūrimōs diēs</latin> et <latin>noctēs nāvigāverat, dēnique</latin> ad <latin>īnsulam vēnit</latin>.  In <latin>īnsulā</latin> erant <latin>multī bovēs</latin>, et nautae in <latin>nāve</latin> nihil <latin>cibī habēbant</latin>. Itaque nautae <latin>bovēs</latin> interficere et <latin>cēnāre valdē cupiēbant</latin>.  Sed dux <latin>nautārum</latin> inquit, “Scelestum est interficere <latin>hōs bovēs</latin>!  Pontifex <latin>nōs bōbus nocēre</latin> vetuit.  <latin>Sī bovēs ā vōbīs</latin> interficientur, <latin>vōs ipsī interficiēminī</latin>.” The question:  Quid accidet <latin>sī bovēs</latin> interficientur? NAUTAE (<latin>IPSĪ</latin>) INTERFICIENTUR"
    boni:
      - question: "Quid nautae facere <latin>cupiēbant</latin>?"
        answer: "INTERFICERE <latin>BOVĒS</latin> // <latin>CĒNĀRE</latin> / EDERE / <latin>CŌNSŪMERE</latin> (<latin>BOVĒS</latin>)"
      - question: "<latin>Respondē</latin> aut <latin>Anglicē</latin> aut <latin>Latīnē</latin>: Quis est dux <latin>nautārum</latin>?"
        answer: "ULIXES / ULYSSES"
  - tossup:
      question: "What city witnessed all of the following mythological events: an altar erected to Heracles the Glorious Victor, a youth ransomed with his sister’s veil, an infant bursting into tears at the sight of his father’s helmet, and a defeated warrior dragged three times around its walls."
      answer: "TROY"
    boni:
      - question: "Who could not stand the sight of his father’s flashing helm?"
        answer: "ASTYANAX / SCAMANDRIUS"
      - question: "Who was ransomed with the veil of Hesione?"
        answer: "PODARCES / PRIAM"
  - tossup:
      question: "Change the Latin name for the month December to agree with the ablative <latin>mēnse</latin>."
      answer: "<latin>DECEMBRĪ</latin>"
    boni:
      - question: "Give me the names of two of the four seasons in the ablative singular."
        answer: "SEE BELOW"
      - question: "Give the other two of the four seasons in the ablative singular."
        answer: "<latin>VĒRE, AESTĀTE, AUTUMNŌ</latin>, HIEME / <latin>BRŪMĀ</latin>"
  - tossup:
      question: "<latin>Dēscrībāmus</latin> nunc <latin>prōprietātēs dictiōnum</latin> in <latin>hāc sententiā</latin>: “<latin>Aurēlia</latin> currum patris in vallum <latin>ēgit</latin>. <latin>Ēheu</latin>!” Quae <latin>pārs ōrātiōnis</latin> est “in”?"
      answer: "<latin>PRAEPOSITIŌ</latin>"
    boni:
      - question: "Cuius temporis est “<latin>ēgit</latin>”?"
        answer: "<latin>PERFECTĪ</latin> / (IN) <latin>PERFECTŌ</latin>"
      - question: "<latin>Quō cāsū</latin> est “patris”?"
        answer: "(IN) <latin>GENITĪVŌ</latin>"
  - tossup:
      question: "Who was cremated in the <latin>Cūria Hostīlia</latin> with such enthusiasm that it burnt down in 52 BC?"
      answer: ""
    boni:
      - question: "What rival murdered him on the Appian Way?"
        answer: "(T. ANNIUS) MILO"
      - question: "Who began construction of a new <latin>Cūria</latin> but did not live to see its completion?"
        answer: "(C. IULIUS) CAESAR"
  - tossup:
      question: "An image of “the Danaids’ crime” was engraved on what youth’s sword belt, which the Rutulian chieftain Turnus seized after killing him?"
      answer: "PALLAS"
    boni:
      - question: "Pallas was the son of what Arcadian founder of Pallantium?"
        answer: "EVANDER"
      - question: "The death of Pallas parallels the death of what other youth, the son of Mezentius, during the Aeneid?"
        answer: "LAUSUS"
  - tossup:
      question: "Which of the following words does not belong because of derivation: immiserate, miser, commissive, miserable?"
      answer: "COMMISSIVE"
    boni:
      - question: "From what Latin adjective do we ultimately derive immiserate, miser, and miserable?"
        answer: "MISER"
      - question: "What derivative of <latin>mittō</latin> is an object that is propelled at a target, sometimes a weapon carrying explosive materials?"
        answer: "MISSILE"
  - tossup:
      question: "What emperor permanently abandoned the wall of Antoninus in Britain and pulled the boundary back to Hadrian’s wall, though Septimius Severus would later build outposts beyond Hadrian’s Wall to keep the lowland tribes pacified?"
      answer: ""
    boni:
      - question: "What commander fought the Caledonians back to the Antonine wall before pulling back to Hadrian’s wall?"
        answer: "ULPIUS MARCELLUS"
      - question: "What emperor removed all Roman troops from Britain in 410 AD?"
        answer: "(FLAVIUS) HONORIUS"
