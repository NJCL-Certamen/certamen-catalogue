tournament: NJCL Certamen
year: 2019
division: Novice
round: Semifinals
questions:
  - tossup:
      question: "Who twice defeated usurpers who had deposed the Western emperor Valentinian II before taking sole control of the empire in 394 AD, but then split it between his two sons when he died the next year, making him the last emperor to rule a united Roman empire?"
      answer: "THEODOSIUS I / THE GREAT"
    boni:
      - question: "Where did Theodosius defeat the usurper Eugenius in 394 to reunite the empire for the last time?"
        answer: "FRIGIDUS (RIVER)"
      - question: "What previous emperor did Theodosius’ father serve in Britain and Africa before being mysteriously executed in 376 AD?"
        answer: "VALENTINIAN I / THE GREAT"
  - tossup:
      question: "From what Latin verb with what meaning do we ultimately derive the English word “deposit”?"
      answer: "<latin>PŌNŌ</latin> - PUT / PLACE"
    boni:
      - question: "From what Latin noun with what meaning do we ultimately derive the English word “pontoon”?"
        answer: "<latin>PŌNS</latin> - BRIDGE"
      - question: "From what Latin noun with what meaning do we ultimately derive the English word “pact”?"
        answer: "PAX – PEACE"
  - tossup:
      question: "Listen to the following passage, which I will read twice, and answer IN LATIN the question that follows"
      answer: "Quinque <latin>annōs, Rōmānī</latin> bellum magnum <latin>contrā Graecōs</latin> in <latin>Italiā gerēbant</latin>. <latin>Rēx</latin> Pyrrhus, <latin>imperātor</latin> Graecus, <latin>multīs proeliīs vīcit</latin>, sed <latin>Rōmānōs</latin> vincere <latin>nōn</latin> poterat.  Tandem, Pyrrhus ad urbem Tarentum pedem rettulit, et <latin>Fābricius, imperātor Rōmānus</latin>, castra <latin>Rōmāna</latin> posuit proxima <latin>castrīs Pyrrhī</latin>. The question: Quid Pyrrhus facere <latin>nōn</latin> poterat? (<latin>NŌN</latin> POTERAT) VINCERE <latin>RŌMĀNŌS</latin>"
    boni:
      - question: "The passage continues:"
        answer: "Nocte, medicus <latin>Pyrrhī</latin> ad <latin>Fābricium imperātōrem Rōmānum vēnit</latin>.  “<latin>Prōmittō</latin>,” inquit medicus, “mortem <latin>Pyrrhī venēnō sī tū</latin> mihi multum <latin>aurī</latin> dabis.”  <latin>Fābricius</latin>, autem, medicum ad Pyrrhum <latin>revenīre</latin> iussit. The question: Quid cupit medicus? (CUPIT) AURUM / MULTUM <latin>AURĪ</latin> / PRAEMIUM"
      - question: "<latin>Medicō audītō</latin>, quid <latin>Fābricius fēcit</latin>?"
        answer: "<latin>MĪSIT</latin> MEDICUM AD PYRRHUM / IUSSIT MEDICUM AD PYRRHUM <latin>REVENĪRE</latin>"
  - tossup:
      question: "What case and use is <latin>barbarī</latin> for the sentence, “<latin>Fīlia barbarī</latin> gladium <latin>magnā</latin> cum <latin>cūrā portābat</latin>”?"
      answer: "GENITIVE OF POSSESSION"
    boni:
      - question: "For the same sentence, what case and use is the phrase “<latin>magnā</latin> cum <latin>cūrā</latin>”?"
        answer: "ABLATIVE OF MANNER"
      - question: "Now translate this into Latin:  The girl of great daring often carried a sword."
        answer: "PUELLA MAGNAE <latin>AUDĀCIAE / MAGNĀ AUDĀCIĀ</latin> SAEPE GLADIUM <latin>PORTĀVIT / PORTĀBAT</latin>"
  - tossup:
      question: "As a punishment for endless chatter and distraction, Hera gave what nymph a curious speech impediment—she could begin no conversation, but only repeat the words of others?"
      answer: "ECHO"
    boni:
      - question: "With what aloof son of Liriope did Echo fall in love, though he cared more for his own reflection than for her?"
        answer: "NARCISSUS"
      - question: "Echo was a nymph of what mountain, where Pegasus created the Hippocrene spring with a stamp of his hoof?"
        answer: "MT. HELICON"
  - tossup:
      question: "What man’s rise and fall are evidenced by a still visible emendation in the inscription on the Arch of Septimius Severus, which removed his name yet ironically helped us remember how his brother Caracalla tried to remove all traces of him from Rome?"
      answer: "(L. SEPTIMIUS) GETA"
    boni:
      - question: "What is the Latin term for this posthumous punishment?"
        answer: "<latin>DAMNĀTIŌ</latin> MEMORIAE"
      - question: "Name an emperor that suffered the <latin>damnātiō</latin> memoriae before Geta."
        answer: "NERO / DIDIUS JULIANUS / DOMITIAN / COMMODUS"
  - tossup:
      question: "<latin>Dēscrībāmus</latin> nunc <latin>prōprietātēs dictiōnum</latin> in <latin>hāc sententiā</latin>: “auribus <latin>teneō</latin> lupum.” quae pars <latin>ōrātiōnis</latin> est “<latin>teneō</latin>”?"
      answer: "VERBUM"
    boni:
      - question: "Quae pars <latin>ōrātiōnis</latin> est “lupum”?"
        answer: "<latin>NŌMEN</latin>"
      - question: "<latin>Quō cāsū</latin> est “auribus”?"
        answer: "<latin>ABLĀTĪVŌ</latin>"
  - tossup:
      question: "What monster lived in a cave with two entrances and had skin impervious to both steel and fire, forcing Heracles to use its own claws to kill it for his first labor?"
      answer: "NEMEAN LION"
    boni:
      - question: "Some stories say that the Nemean lion had been suckled by what goddess of the moon?"
        answer: "SELENE"
      - question: "What constellation is generally said to represent the Nemean lion?"
        answer: "LEO"
  - tossup:
      question: "For what college is “<latin>Vōx clāmantis</latin> in <latin>dēsertō</latin>” the Latin motto?"
      answer: "DARTMOUTH"
    boni:
      - question: "From what Latin source did Dartmouth draw this quotation?"
        answer: "VULGATE  // BIBLIA <latin>VULGĀTA</latin> //"
      - question: "What is the Latin motto of the University of Missouri?"
        answer: "<latin>SALŪS POPULĪ</latin>"
  - tossup:
      question: "The English words pantry and accompany are both ultimately derived from what Latin noun?"
      answer: "PANIS"
    boni:
      - question: "From what Latin verb with what meaning do we ultimately derive the word impulse?"
        answer: "<latin>PELLŌ</latin>"
      - question: "From what Latin verb with what meaning do we ultimately derive the word plead?"
        answer: "<latin>PLACEŌ</latin>"
  - tossup:
      question: "What mythological name is shared by the killer of Dido’s husband Sychaeus and a sculptor who fell in love with his own creation, Galatea?"
      answer: "PYGMALION"
    boni:
      - question: "To make matters worse, the former Pygmalion was Dido’s brother. Dido did however have a more faithful sibling in what sister of hers, who tried to save Dido from her pyre?"
        answer: "ANNA (PERENNA)"
      - question: "Which goddess brought to life the latter Pygmalion’s creation?"
        answer: "APHRODITE / VENUS"
  - tossup:
      question: "What law was the result of the final plebeian secession in 287 BC?"
      answer: "<latin>LĒX HORTĒNSIA</latin>"
    boni:
      - question: "What was the Latin term for the resolutions of the concilium <latin>plēbis</latin>, which the <latin>Lēx Hortēnsia</latin> gave the force of law"
        answer: "<latin>PLĒBISCĪTUM / PLĒBISCĪTA</latin>"
      - question: "What tribune of 133 BC tried to block Tiberius Gracchus from using <latin>plēbiscīta</latin> to bypass the Senate to pass his land reforms?"
        answer: "(M.) OCTAVIUS"
  - tossup:
      question: "Inspired by a dream of Athena, what maiden asked permission from her father to wash her clothes at the river, where she encountered the newly-raftwrecked Odysseus?"
      answer: "NAUSICAÄ"
    boni:
      - question: "Name Nausicaä’s father, the king of the Phaeacians and the husband of Arete."
        answer: "ALCINOUS"
      - question: "To reach the island of the Phaeacians after his raftwreck, Odysseus used what type of item, a gift of the goddess Ino, as a life-preserver?"
        answer: "VEIL / HEAD-DRESS / MANTILLA / WIMPLE / CLOAK"
  - tossup:
      question: "Change the Latin name for Cupid, <latin>Cupīdō</latin>, to the accusative singular."
      answer: "<latin>CUPĪDINEM</latin>"
    boni:
      - question: "Now do the same for the names Iuppiter and Venus."
        answer: "IOVEM, VENEREM"
      - question: "Now do the same for the goddess <latin>Cerēs</latin>. CEREREM"
        answer: ""
  - tossup:
      question: "Give the form of hic, haec, hoc that would agree with corpora."
      answer: "HAEC"
    boni:
      - question: "Give the form of hic, haec, hoc that would agree with <latin>rēgī</latin>."
        answer: "HUIC"
      - question: "Give the form of hic, haec, hoc that would agree with senum."
        answer: "<latin>HŌRUM</latin>"
  - tossup:
      question: "Phillip the V remained friendly to Rome after his defeat at Cynoscephalae and the ensuing peace, but which of his sons led Macedon into a conflict with Rome that would be called the Third Macedonian War?"
      answer: "PERSEUS"
    boni:
      - question: "The Battle of Pydna, which ended the Third Macedonian War, showed the obsolescence of what Greek battle formation?"
        answer: "PHALANX"
      - question: "What adventurer claimed to be the son of Perseus and united the Republics that were created after the defeat of Perseus in what is known as the Fourth Macedonian War?"
        answer: "ANDRISCUS / PSEUDO-PHILLIP"
  - tossup:
      question: "Translate the prepositional phrase in the sentence: virum <latin>vīdimus, quī ā chīrurgō Graecō necātus</latin> erat."
      answer: "BY THE GREEK SURGEON / CHIRURGEON"
    boni:
      - question: "Now translate the whole sentence from the toss-up. WE SAW THE MAN, WHO HAD BEEN KILLED BY THE GREEK SURGEON / CHIRURGEON"
        answer: ""
      - question: "Now translate:  <latin>Cēnam</latin> quam <latin>coquī Graecī parāverint tū amābis</latin>. YOU WILL LOVE THE DINNER WHICH THE GREEK COOKS PREPARE(D) / WILL HAVE PREPARED"
        answer: ""
  - tossup:
      question: "Who gratefully told the Argonauts how they might pass through the Clashing Rocks after Zetes and Calaïs chased off the Harpies which plagued him?"
      answer: "PHINEUS"
    boni:
      - question: "Of what city in Thrace was Phineus king?"
        answer: "SALMYDESSUS"
      - question: "What god was the father of Zetes and Calaïs, as well as of Phineus’ wife Cleopatra?"
        answer: "BOREAS"
  - tossup:
      question: "Give the form of the verb <latin>agō</latin> that would be used in this sentence: “the producer wanted the play to be performed in Rome.”"
      answer: "<latin>AGĪ</latin> / (UT) <latin>AGERĒTUR</latin>"
    boni:
      - question: "Give the form of the verb <latin>agō</latin> that would be used in this sentence: “the actors seemed not to have performed the play before.”"
        answer: "<latin>ĒGISSE</latin>"
      - question: "Make <latin>ēgisse</latin> future."
        answer: "<latin>ĀCTŪRUS</latin> (-A, -UM ESSE)"
  - tossup:
      question: "(HAND OUT THE VISUAL AND GIVE 5 SECONDS TO INSPECT IT)"
      answer: "TU: Identify by letter the facility known as a forica where a Roman might go to use a bathroom while out in the city. A"
    boni:
      - question: "What would a Roman get from the facility labelled D?"
        answer: "FOOD / DRINK / VICTUALS / SUSTENANCE"
      - question: "The image labelled B shows a part of what type of complex?"
        answer: "BATHS / THERMAE / BALNEAE"
