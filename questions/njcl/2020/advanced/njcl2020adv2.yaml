tournament: "NJCL Certamen"
year: 2020
division: "Advanced"
round: "Round 2"
questions:
  - tossup:
      question: "In mythology, what type of object was stolen from Amyntor’s house by Autolycus and frightened Hector’s son, Astyanax, because of its crowning horsehair plume?"
      answer: "HELM(ET)"
    boni:
      - question: "In the <title>Iliad</title>, of what alloy is Hector’s helmet made, like most armor and weapons in the poem?"
        answer: "BRONZE"
      - question: "In Book 9 of the <title>Aeneid</title>, what two lovers are killed by Italians after the light reflecting off a helmet betrays them?"
        answer: "NISUS and EURYALUS"
  - tossup:
      question: "Translate the following sentence into Latin using a gerundive, “They entered the city at night to avoid the patrols.”"
      answer: "<latin>URBEM INTRĀVĒRUNT NOCTŪ / NOCTE  AD VĪTANDŌS VIGILĒS / VIGILAS</latin> /  <latin>VĪTANDŌRUM VIGILIUM / VIGILARUM CAUSĀ</latin>"
    boni:
      - question: "Now translate “They entered the city at night to avoid the patrols” using a gerund."
        answer: "<latin>URBEM INTRAVERUNT NOCTŪ / NOCTE AD VĪTANDUM</latin> <latin>VIGILĒS</latin> / <latin>VIGILĒS VĪTANDĪ CAUSĀ</latin>"
      - question: "Now translate “They entered the city at night to avoid the patrols” using a supine."
        answer: "<latin>URBEM INTRĀVĒRUNT NOCTŪ / NOCTE VIGILĒS VĪTĀTUM</latin>"
  - tossup:
      question: "During the empire the offices of <latin>praepositus ab epistulīs</latin> or <latin>praepositus ab rationibus</latin> wielded a great deal of authority in imperial administration, but the men occupying these positions came from different walks of life.  During the reign of Claudius, however, there was a preponderance of freedmen.  Which freedman held the position of <latin>praepositus ab epistulīs</latin><title>?</title>"
      answer: "NARCISSUS"
    boni:
      - question: "Which of Claudius’ freedmen held the position of <latin>praepositus ā</latin> <latin>studiīs</latin>?"
        answer: "POLYBIUS"
      - question: "A freedman named Pallas held the position of <latin>praepositus ā ratiōnibus</latin>.  What did this put him in charge of?"
        answer: "ACCOUNTS / FINANCE / MONEY"
  - tossup:
      question: "Give the Latin noun and its meaning at the root of “mood”."
      answer: "<latin>MODUS</latin> – MODE / METHOD / WAY"
    boni:
      - question: "Give the Latin verb and its meaning at the ultimate root of “indicative.”"
        answer: "<latin>DICŌ</latin> – TO DEDICATE / PROCLAIM / MAKE KNOWN / DECLARE"
      - question: "Give the Latin word and its meaning at the root of “principal.”"
        answer: "<latin>CAPIO</latin> - TAKE // <latin>PRIMUS</latin> - FIRST // <latin>PRINCEPS</latin> - CHIEF/LEADER"
  - tossup:
      question: "<title><latin>Dē Providentiā, Dē Brevitāte Vitae, Dē Constantiā Sapientis,</latin></title> and <title><latin>Dē Tranquillitāte Animī</latin></title> are some of the titles contained in the 12 books of <title><latin>Dialogī</latin></title>, which were written by what author from Corduba?"
      answer: "SENECA THE YOUNGER / (LUCIUS ANNAEUS) SENECA MINOR"
    boni:
      - question: "What work of Seneca the Younger consisted of 124 letters that are addressed to Lucilius?"
        answer: "<title><latin>EPISTULAE MORALĒS</latin></title>"
      - question: "What tragedy attributed to Seneca the Younger is the only extant <latin>fabula praetexta?</latin>"
        answer: "<title><latin>OCTAVIA</latin></title>   <latin>--</latin>"
  - tossup:
      question: "What king of Rome’s death in a fire caused by a lightning bolt was the culmination of a reign of violent conquest that saw the destruction of Alba Longa and the brutal dismemberment of Mettius Fufetius?"
      answer: "TULLUS HOSTILIUS’"
    boni:
      - question: "Hostilius’ warlike reign was an about-face from the reign of what predecessor, who fought no wars during his reign?"
        answer: "NUMA (POMPILIUS)"
      - question: "Who was Tullus Hostilius’ grandfather, who fought alongside Romulus when the Sabines invaded Rome?"
        answer: "HOST(I)US HOSTILIUS"
  - tossup:
      question: "Which of the following pronouns cannot be reflexive: <latin>vōbīs, tū, mihi, sibi, tē?</latin>"
      answer: "<latin>TŪ</latin>"
    boni:
      - question: "Which of the following pronouns cannot have the enclitic -<latin>cum</latin> added to it: <latin>quibus, hāc, mē, vōbīs?</latin>"
        answer: "<latin>HĀC</latin>"
      - question: "Which of the following is not an enclitic associated with pronouns: <latin>-ce, -me, -pte, -nam?</latin>"
        answer: "<latin>-ME</latin>"
  - tossup:
      question: "<latin>Dictātor Carthaginensium</latin> is a reference to Hannibal Barca that is found in what work, which withheld the names of popular senators and commanders in order to focus on the collective <latin>rēs publica</latin> and told Roman history from the foundation of Rome and the origins of Italian cities all the way up to 152 BC?"
      answer: "<title><latin>ORĪGINĒS</latin></title>"
    boni:
      - question: "What work of Cato the Elder is the first work of Latin prose to come down to us in its entirety?"
        answer: "<title><latin>DĒ AGRĪ CULTURĀ / DĒ RĒ RUSTICĀ</latin></title>"
      - question: "A famous speech given by Cato the Elder in 167 B.C. opposed declaring war on what Greek city-state?"
        answer: "RHODES"
  - tossup:
      question: "In a version found only in a lost Euripidean play, which hero, on his return to Proëtus’ kingdom, forcefully removes Stheneboea from their airborne mode of transportation, Pegasus?"
      answer: "BELLEROPHON(TES)"
    boni:
      - question: "In Greek, Stheneboea’s name refers to her richness in what livestock, whose name is also contained within the word “Bosporus?”"
        answer: "COW(S) / CATTLE"
      - question: "This woman appears in Homer’s account of the Bellerophon myth, in Book 6 of the <title>Iliad</title>. By what name is she known there?"
        answer: "ANTE(I)A"
  - tossup:
      question: "Listen carefully to the following Latin passage about our hero Horatius, which I will read twice, then <latin>RESPONDĒ LATĪNĒ</latin> to the questions which follow.\t \t<latin>Movet ferōcis iuvenis Horātiī animum complōrātiō sorōris in victōriā tantōque gaudiō publicō.  Strictō itaque gladiō simul verbīs increpāns trānsfīgit puellam. \"Abī hinc cum immātūrō amōre ad spōnsum,\" inquit, \"oblīta frātrum mortuōrum vīvīque, oblīta patriae. Sic eat quaecumque Rōmāna lūgēbit hostem.\"</latin> REREAD  The question:  <latin>Quālem amōrem Horātius putāvit sorōrem suam habēre?</latin>"
      answer: "<latin>IMMĀTŪRUM</latin>"
    boni:
      - question: "<latin>Quōrum soror oblīta est?</latin>"
        answer: "<latin>FRĀTRUM (MORTUŌRUM) // (VĪVĪ) FRATRIS \t\tET PATRIAE (anything plural that has these elements)</latin>"
      - question: "<latin>Quōmodo puella mortua est?</latin>"
        answer: "<latin>GLADIŌ (FRĀTRIS) // FRĀTER EAM</latin>  \t\t<latin>OCCĪDIT / NECĀVIT / INTERFĒCIT / TRANSFIXIT / NECAT / INTERFICIT / TRANSFIGIT  --</latin>"
  - tossup:
      question: "Translate the motto of Virginia: <latin>sīc semper tyrannīs</latin>."
      answer: "THUS ALWAYS TO TYRANTS"
    boni:
      - question: "What neighboring state has the motto <latin>scūtō bonae voluntātis tuae corōnāstī nōs</latin> on its seal along with that state’s Italian motto?"
        answer: "MARYLAND"
      - question: "Give the Latin motto of the state of North Carolina."
        answer: "<latin>ESSE QUAM VIDĒRĪ</latin>"
  - tossup:
      question: "What successful admiral of the late first century BC built the first <title><latin>thermae</latin></title> in Rome along with two aqueducts?"
      answer: "(M. VIPSANIUS) AGRIPPA"
    boni:
      - question: "What was a <title><latin>sudatorium</latin></title> designed to do?"
        answer: "INDUCE SWEATING"
      - question: "<title><latin>Palaestra</latin></title> is a term from Greek that came to mean a general exercise area, but originally was designed for two specific activities.  Name one of these activities."
        answer: "BOXING / WRESTLING"
  - tossup:
      question: "Whose followers discovered a buried horse’s head in a grove, indicating that they should build a citadel, the Byrsa, after which they bought the land that a bull’s hide could encompass, thereby founding the city of Carthage?"
      answer: "DIDO’S"
    boni:
      - question: "What goddess, an ardent enemy of the Trojans in the <title>Aeneid</title>, directed Dido’s followers to the horse’s head?"
        answer: "JUNO"
      - question: "From what city in Phoenicia did Dido emigrate in order to found Carthage?"
        answer: "TYRE"
  - tossup:
      question: "Give an antonym of the noun <latin>lētum</latin>."
      answer: "<latin>VĪTA / CONCORDIA</latin>"
    boni:
      - question: "Give an antonym of the adjective <latin>locūplēs.</latin>"
        answer: "<latin>EGENS / HUMILIS / MISER / PAUPER / INDIGE(N)S</latin>"
      - question: "Give an antonym of the verb <latin>cēlō</latin>."
        answer: "<latin>PATEŌ / (DĒ)MONSTRŌ</latin>"
  - tossup:
      question: "What author explained that knowledge of acoustics for the construction of theaters, optics for lighting, medicine for hygiene, and philosophy was an important part of an architect's education in his ten books of <title><latin>Dē Architectūrā</latin></title>?"
      answer: "(M.) VITRUVIUS (POLLIO)"
    boni:
      - question: "The <title><latin>Dē Architectūrā</latin></title> was dedicated to what man, who was carrying out a vast program for improving Rome’s public buildings and had secured a pension for Vitruvius?"
        answer: "AUGUSTUS"
      - question: "What author, who lived in the age of Tiberius, wrote an encyclopedic work that treated the six <latin>artēs</latin>, although only his 8 books on medicine come down to us today?"
        answer: "(A. CORNELIUS) CELSUS  <latin>--</latin>"
  - tossup:
      question: "In 298 BC, Rome was invited to give aid against the Samnites. Out of what area of Italy did the Romans drive the Samnites?"
      answer: "LUCANIA"
    boni:
      - question: "Who led this relief expedition against the Samnites?"
        answer: "(L. CORNELIUS) SCIPIO BARBATUS"
      - question: "3 years later at Camerinum, Scipio Barbatus was defeated.  What Samnite general had put together an alliance of Gauls, Samnites and Etruscans to accomplish this?"
        answer: "(GELLIUS) EGNATIUS"
  - tossup:
      question: "Give the correct form of <latin>adveniō</latin> that would be used to translate this sentence into Latin: I wonder how Valerie arrived so quickly."
      answer: "<latin>ADVĒNERIT</latin>"
    boni:
      - question: "Give the correct form of <latin>arcessō</latin> that would be used to translate this sentence into Latin: The emperor had to summon us."
        answer: "<latin>ARCESSENDĪ/AE (ERĀMUS) // ARCESSERE</latin>"
      - question: "Give the correct form of <latin>lavō</latin> that would be used to translate this sentence into Latin: If only the dishes had been washed earlier!"
        answer: "<latin>LAVĀTĪ/-AE/-A ESSENT /</latin>/   <latin>LAUTĪ/-AE/-A ESSENT</latin> // <latin>LŌTĪ/-AE/-A ESSENT</latin>"
  - tossup:
      question: "Nasty rumors that Laelius and Scipio Aemilianus were the real authors of his plays, accusations of plagiarism, and a charge of <latin>contāminātio</latin> were all challenges concerning the originality of what author’s comedies, which include <title><latin>Phormio, Eunuchus,</latin></title> and <title><latin>Andria</latin></title>?"
      answer: "TERENCE / (P.) TERENTIUS (AFER)"
    boni:
      - question: "What play of Terence was finally performed successfully on the third attempt after the first two attempts were interrupted by distractions such as tightrope walkers and gladiators?"
        answer: "<title><latin>HECYRA</latin></title>"
      - question: "Terence’s defense of <latin>contāminātio</latin> came about due to the criticism of what rival playwright who also wrote <latin>fābulae palliātae</latin>?"
        answer: "LUSCIUS (OF LANUVIUM) / LUSCIUS (LANUVINUS)"
  - tossup:
      question: "In Book 24 of the <title>Iliad</title>, Achilles compares Priam’s grief to the sorrow of what woman, who stood transfixed on the lonely peaks of Mount Sipylus after twelve of her children were killed by the gods?"
      answer: "NIOBE"
    boni:
      - question: "What two deities killed her children, because they were angered at her words about their mother, Leto?"
        answer: "APOLLO and ARTEMIS"
      - question: "Some writers say that two of Niobe’s children survived, one boy and one girl. Name both of these survivors."
        answer: "AMYCLAS and CHLORIS  <latin>--</latin>"
  - tossup:
      question: "Complete the following analogy: <latin>quīnque : quīntus :: quīndecim :</latin> <emphasis><latin>[blank]</latin></emphasis><latin>?</latin>"
      answer: "<latin>QUĪNTUS DECIMUS</latin> / <latin>QUINDECIMUS BUT THAT’S LATE</latin>"
    boni:
      - question: "Complete the following analogy: <latin>quīnque : quīnī :: duodecim :</latin> <emphasis><latin>[blank]</latin></emphasis><latin>?</latin>"
        answer: "<latin>DUODĒNĪ</latin>"
      - question: "Complete the following analogy: <latin>quīnque : quīnquiēns :: septendecim:</latin><emphasis><latin>[blank]</latin></emphasis><latin>?</latin>"
        answer: "<latin>SEPTIĒSDECIĒ(N)S</latin>"
