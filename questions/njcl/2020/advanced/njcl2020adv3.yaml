tournament: "NJCL Certamen"
year: 2020
division: "Advanced"
round: "Round 3"
questions:
  - tossup:
      question: "Who led the Senate to reject Tiberius Gracchus' treaty saving the army of Gaius Hostilius Mancinus when it had been trapped by the Numantines, then himself captured the city of Numantia in 133 B.C.?"
      answer: "(P. CORNELIUS) SCIPIO AEMILIANUS / AFRICANUS MINOR"
    boni:
      - question: "Some have supposed that Tiberius Gracchus undertook his land reform bills in part to take revenge on Scipio by taking control of the very land Scipio would need for his veterans.  Gracchus had also appointed a political arch enemy of Scipio Aemilianus to the land commission.  Who was this?"
        answer: "(APP.) CLAUDIUS PULCHER"
      - question: "Tiberius himself, of course, was killed when he tried to run for reelection.  Who led the mob of senators that killed Tiberius Gracchus?"
        answer: "SCIPIO NASICA"
  - tossup:
      question: "Translate into English: <latin>Adventus sociōrum salūtī fessīs Rōmānīs fuit.</latin>"
      answer: "THE ARRIVAL OF THEIR ALLIES WAS A SALVATION / SAFETY / HEALTH FOR THE TIRED ROMANS"
    boni:
      - question: "What two uses of the dative are illustrated in that sentence?"
        answer: "PURPOSE & REFERENCE / DOUBLE DATIVE"
      - question: "What use of the genitive is illustrated in that sentence?"
        answer: "SUBJECTIVE"
  - tossup:
      question: "What name is shared by related Megarians—a general whose daughter, Endeïs, married Aeacus, and an outlaw who compelled travelers to wash their feet, then pushed them off a cliff into the jaws of a sea-turtle?"
      answer: "SC(E)IRON"
    boni:
      - question: "What pair, the sons of Aeacus and Endeïs, killed their half-brother, Phocus, at their mother’s request?"
        answer: "PELEUS and TELAMON"
      - question: "Theseus killed Sceiron, the outlaw, while traveling to Athens from what city?"
        answer: "TROEZEN"
  - tossup:
      question: "The duel between Alexander Hamilton and Aaron Burr is the climactic moment of the musical <title>Hamilton</title>.  From what Latin noun, with what meaning, do we derive the noun “duel”?"
      answer: "<latin>BELLUM</latin> – WAR /  \t\t<latin>DUELLUM [</latin>medieval OR archaic]<latin>-</latin> FIGHT BETWEEN TWO MEN"
    boni:
      - question: "When entire units of the Roman army were found guilty of major crimes, generals culled a tenth of the soldiers responsible, a process known as <latin>decimātiō</latin>.  From what Latin word, with what meaning, do we derive “cull”?"
        answer: "<latin>LEGŌ</latin> – CHOOSE / READ // <latin>COLLIGŌ -</latin> COLLECT / GATHER"
      - question: "Such crimes included insubordination, revolt, and cowardice.  Give the Latin roots and their meanings of two of those crimes."
        answer: "ANY TWO OF: <latin>ORDŌ</latin> – RANK, <latin>(RE)VOLVŌ / (RE)VOLVITO</latin> – ROLL, <latin>CAUDA</latin> – TAIL"
  - tossup:
      question: "Aelius Stilo and Varro Reatinus wrote on the authenticity of works attributed to what author of <title><latin>Rudens, Poenulus, Mostellaria,</latin></title> and 18 other comedies?"
      answer: "(T. MACCIUS) PLAUTUS"
    boni:
      - question: "Volcacius Sedigitus ranked Plautus second among ten comedic playwrights. Which comedic playwright, who was the author of <title><latin>Plocium</latin></title>, was ranked first by Sedigitus?"
        answer: "CAECILIUS STATIUS"
      - question: "What writer of <latin>fabulae palliātae</latin> entitled <title><latin>Caupuncula</latin></title> and <title><latin>Pancratiastes</latin></title> was ranked last by Sedigitus?"
        answer: "(Q.) ENNIUS  <latin>--</latin>"
  - tossup:
      question: "Listen carefully to the following Latin passage, which I will read twice, then <latin>RESPONDĒ LATĪNĒ</latin> to the questions which follow.   \t<latin>Bōs in Sabīnīs nāta cuidam patrī familiae dīcitur mīranda magnitūdine ac speciē; fīxa per multās aetātēs cornua in vestībulō templī Diānae mōnumentum eī fuēre mīrāculō.</latin>   REREAD   \tThe question: <latin>Cur haec bōs mīranda est?</latin>"
      answer: "<latin>MAGNITŪDINE (AC) SPECIĒ //</latin>  <latin>OB / PROPTER MAGNITŪDINEM (AC) SPECIEM</latin>"
    boni:
      - question: "<latin>Ubi erant cornua huius bovis multās</latin> <latin>aetātēs?</latin>"
        answer: "<latin>IN VESTĪBULŌ TEMPLĪ / IN TEMPLŌ (DIĀNAE)</latin>"
      - question: "<latin>Cūr cornua ibi fīxa sunt?</latin>"
        answer: "<latin>(UT) MŌNUMENTUM (EĪ) MĪRĀCULŌ</latin>"
  - tossup:
      question: "What type of animal killed a child who was laid on a bed of parsley for safekeeping, filled the bridal chamber of Admetus and Alcestis, guarded the original shrine at Delphi before being killed by Apollo, and replaced the hair of Medusa?"
      answer: "SNAKE / SERPENT / DRAGON"
    boni:
      - question: "Name the child who was laid on a bed of parsley for safekeeping by his nurse, Hypsipyle."
        answer: "OPHELTES / ARCHEMORUS"
      - question: "Name the serpentine guardian of the original shrine at Delphi, who was killed by Apollo."
        answer: "PYTHON"
  - tossup:
      question: "What author’s religious views were so strict that he wrote a <title><latin>De Corona</latin></title> claiming military service as incompatible with the Christian faith and a <title><latin>De Spectaculis</latin></title> discouraging Christians from taking part in theatrical spectacles, and converted to a strict, non-orthodox sect known as Montanism?"
      answer: "(Q. SEPTIMIUS FLORENS) TERTULLIAN(US)"
    boni:
      - question: "What work of Tertullian, written in 197 A.D., was written in the form of a speech addressed to governors of the provinces which sought to defend Christians from the attacks of pagans?"
        answer: "<title><latin>APOLOGETICUM / APOLOGETICUS</latin></title>"
      - question: "What other Christian apologist’s series of 81 letters provides information on the nature of life in Africa Proconsularis and the persecutions occurring in Christian communities during the 3rd century A.D.?"
        answer: "(THASCIUS CAECILIUS) CYPRIAN(US)"
  - tossup:
      question: "Give the Latin word which means “in the works of” or “in the presence of”?"
      answer: "<latin>APUD</latin>"
    boni:
      - question: "What other Latin word as a preposition means “in the presence of,” and, as an adverb, means “face to face.”"
        answer: "<latin>CORAM</latin>"
      - question: "What Latin adverb means “duly” or “according to custom”?"
        answer: "<latin>RĪTE</latin>"
  - tossup:
      question: "Respondē aut Anglicē aut Latīnē: Quem Dioclētiānus nōmināvit “Herculium Augustum”?"
      answer: "<latin>MAXIMIĀNUM /</latin> MAXIMIAN(US)"
    boni:
      - question: "<latin>Respondē Latīnē: In quā prōvinciā habitāvit Dioclētiānus postquam abdicāvit?</latin>"
        answer: "<latin>(IN) DALMATIĀ</latin>"
      - question: "<latin>Respondē Latīnē: Quāle aedificium maximum Cōnstantīnus fīnīvit inter arcum Titī et forum?</latin>"
        answer: "<latin>BASILICAM</latin>  <latin>--</latin>"
  - tossup:
      question: "What author of the Silver Age, who was given the epithet <latin>Rhētor</latin>, gives us insight into the types of exercises practiced in schools of rhetoric in his <title><latin>Oratōrum et Rhētorum Sententiae Divisiōnēs Colorēs</latin></title>?"
      answer: "SENECA THE ELDER / (LUCIUS ANNAEUS) SENECA MAIOR"
    boni:
      - question: "What is the name of the rhetorical exercise based on Greek or Roman law which involved a fictitious trial with opposing sides?"
        answer: "<latin>CONTROVERSIA(E)</latin>"
      - question: "What is the name of the rhetorical exercise in which an orator has to guide the action of a famous mythological or historical figure who is facing a difficult decision?"
        answer: "<latin>SUASORIA(E)</latin>"
  - tossup:
      question: "Who inhabited Ocaleae and married Amphitryon’s widow, Alcmene, after fleeing his native Crete, where he had established a great reputation as a law-giver?"
      answer: "RHADAMANTHYS"
    boni:
      - question: "Because of this reputation, Rhadamanthys was made one of the judges of the dead, where he served alongside what brother of his?"
        answer: "MINOS"
      - question: "What native of Oenone was traditionally considered the third judge of the dead?"
        answer: "AEACUS"
  - tossup:
      question: "What Latin phrase, which is similar in form to <latin>ā marī usque ad mare</latin>, might someone use in order to say that an evening was wonderful from beginning to end, and is equivalent to the English turn of phrase “from soup to nuts”?"
      answer: "<latin>AB ŌVŌ USQUE AD MALA</latin>"
    boni:
      - question: "<latin>Ā marī usque ad mare</latin> is the national motto of what country?"
        answer: "CANADA"
      - question: "What Latin phrase serves as a reminder not to say anything bad about the dead?"
        answer: "<latin>DĒ MORTUĪS NĪL NISĪ BONUM</latin>"
  - tossup:
      question: "What river divided Cisalpine Gaul into northern and southern regions and is today Italy’s longest?"
      answer: "<latin>PADUS</latin> / PO"
    boni:
      - question: "What river, located in Southern Gaul, started in the Alps and flowed into the Mediterranean near Arles?"
        answer: "<latin>RHODANUS</latin> / RHONE"
      - question: "What river ran through the provinces of Raetia, Noricum, Pannonia, and Moesia?"
        answer: "<latin>DĀNUVIUS</latin> / DANUBE"
  - tossup:
      question: "Translate the two verb forms <latin>vexī</latin> and <latin>vīxī</latin>."
      answer: "I HAVE BORNE / BORE / CONVEYED / CARRIED and I (HAVE) LIVED"
    boni:
      - question: "Translate the two verb forms <latin>quīsse</latin> and <latin>quiēsse.</latin>"
        answer: "TO HAVE BEEN ABLE and TO HAVE RESTED"
      - question: "Translate the two verb forms <latin>peperī</latin> and <latin>pepulī</latin>."
        answer: "I HAVE BEGOTTEN / BROUGHT FORTH and I HAVE DRIVEN / PUSHED  <latin>--</latin>"
  - tossup:
      question: "What author of the first century B.C. gives us a rich account of his friend Atticus’s character, literary interests, and political attitudes in his work of at least 16 books that contains biographical sketches of Romans, Greeks, and foreigners?"
      answer: "CORNELIUS NEPOS"
    boni:
      - question: "The only remnants of Cornelius Nepos’s <title><latin>Dē Virīs Illustribus</latin></title> are one book on foreign military leaders and part of another book containing the lives of Latin historians, of which only two biographies remain. One of these biographies is the biography of Atticus. Which Latin historian is the subject of the other biography?"
        answer: "CATO THE ELDER / (M. PORCIUS) CATO MAIOR"
      - question: "What poet dedicated his <latin>libellus</latin> of poetry to Cornelius Nepos?"
        answer: "(C. VALERIUS) CATULLUS"
  - tossup:
      question: "Say in Latin, “It’s hailing.”"
      answer: "<latin>GRANDINAT</latin>"
    boni:
      - question: "Say in Latin: “I’m tired of the work.”"
        answer: "<latin>MĒ OPERIS / LABORIS / ONERIS TAEDET</latin>"
      - question: "Say in Latin: “He regrets his mistakes.”"
        answer: "<latin>EUM (SUŌRUM / EIUS) ERRŌRUM / MENDŌRUM PAENITET</latin>"
  - tossup:
      question: "<latin>Respondē Latīnē:  Cuius arcū sagittīsque ūsus est Philoctētēs ut Paridem occīderet?</latin>"
      answer: "<latin>HERCULIS / HERCULEI</latin>"
    boni:
      - question: "<latin>Respondē Latīnē: Ā quō Philoctētēs morsus est in īnsulā Tenedō ?</latin>"
        answer: "<latin>(Ā / AB) SERPENTE / ANGUE / VĪPERĀ / COLUBRE</latin>"
      - question: "<latin>Respondē Anglicē: Hoc vulnus tam odōrum erat ut Graecī Philoctētēn relinquerent in quā īnsulā?</latin>"
        answer: "LEMNOS"
  - tossup:
      question: "Give the form of <latin>prōsum</latin> that would appear in a Latin translation of this sentence: “Complaints will not benefit us now.”"
      answer: "<latin>(NŌN)</latin> <latin>PRŌDERUNT</latin>"
    boni:
      - question: "Give the form of <latin>prōsum</latin> that would appear in a Latin translation of this sentence: “He ate so much pie that it benefitted him to lie down.”"
        answer: "<latin>PRŌDESSET</latin>"
      - question: "Give the form of <latin>prōsum</latin> that would appear in a Latin translation of this sentence: “I’m asking how this benefitted us.”"
        answer: "<latin>PRŌFUERIT</latin>  <latin>--</latin>"
  - tossup:
      question: "Political life moves in mysterious ways. Name the wealthy man of a famous family who, although he was exiled in the reign of Caligula, became consul during the reign of Claudius and the figurehead of a conspiracy against Nero in 65 AD that cost him his life."
      answer: "(C. CALPURNIUS) PISO"
    boni:
      - question: "Piso brought many down with him.  Name the young writer of the epic <latin>Bellum Cīvīle</latin> who was forced to commit suicide as a result of being associated with the conspiracy."
        answer: "LUCAN"
      - question: "Nero was infamous for his excesses, but one of his more remarkable excesses was taking as a wife Poppaea Sabina, who had been married to one of his friends. Who was this “friend” of Nero who gave up his own wife to his friend?"
        answer: "(M. SALVIUS) OTHO"
