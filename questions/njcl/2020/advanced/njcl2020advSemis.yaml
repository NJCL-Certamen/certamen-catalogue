tournament: "NJCL Certamen"
year: 2020
division: "Advanced"
round: "Semifinals"
questions:
  - tossup:
      question: "<latin>Dēscrībāmus nunc prōprietātēs dictiōnum in hāc sententiā: Tantī est vōs amīcīs amāre ēnarrāre. Quō cāsū est “vōs”?</latin>"
      answer: "<latin>ACCUSĀTĪVŌ</latin>"
    boni:
      - question: "<latin>Rēspondē Anglicē: quō cāsū et quā rātiōne est “tantī?</latin>"
        answer: "<latin>”</latin> GENITIVE of (INDEFINITE) VALUE"
      - question: "<latin>Quid Anglicē significat “Tantī est vōs amīcīs amāre ēnarrāre”?</latin>"
        answer: "IT IS OF SUCH GREAT VALUE / WORTHWHILE / REALLY IMPORTANT THAT YOU TELL YOUR FRIENDS TO LOVE / THAT YOU LOVE TO TALK TO YOUR FRIENDS / THAT YOU TELL YOUR FRIENDS YOU LOVE THEM"
  - tossup:
      question: "The <title><latin>Principia Historiae</latin></title> on Lucius Verus’s campaign against the Parthians and letters to Marcus Aurelius were written by what author and rhetorician from Cirta, who was selected as the tutor of Marcus Aurelius and Lucius Verus?"
      answer: "(M. CORNELIUS) FRONTO"
    boni:
      - question: "What is the title of Marcus Aurelius’s work, which is a series of moral reflections in Greek that reflect his Stoic attitude?"
        answer: "<title>MEDITATIONS /</title>  <title><latin>MEDITĀTIŌNĒS</latin></title> <title>/  (</title><title><latin>TA) EIS HEAUTON</latin></title>"
      - question: "What author’s <title><latin>Octavius</latin></title> may be an indirect response to a lost public speech of Fronto which contains a discourse against Christians?"
        answer: "MINUCIUS FELIX’S"
  - tossup:
      question: "<latin>Respondē Latīnē:</latin> <latin>Ex quō frūctū vēnit amurca?</latin>"
      answer: "<latin>(EX) OLĪVĪS</latin>"
    boni:
      - question: "<latin>Respondē aut Latīnē aut Anglīcē:  Quāle vīnum in Italiā antīquā optimum et pretiōsissimum habēbātur?</latin>"
        answer: "<latin>(VĪNUM) FALERNUM /</latin> FALERNIAN WINE OR <latin>(VĪNUM)</latin> <latin>CAECUBUM</latin> / CAECUBAN WINE"
      - question: "<latin>Respondē Latīnē: Quid nōminātur tempus dormiendī post prandium?</latin>"
        answer: "<latin>MERĪDIĀTIŌ</latin>"
  - tossup:
      question: "Which two of the following words are derived from the same Latin root: salami, assail, saliva, exult."
      answer: "ASSAIL & EXULT"
    boni:
      - question: "Which two of the following words are derived from the same Latin root: denizen, insular, entrée, vie."
        answer: "DENIZEN & ENTRÉE"
      - question: "Which two of the following words are derived from the same Latin root: aid, alimony, conjure, jocund."
        answer: "AID & JOCUND"
  - tossup:
      question: "After fleeing to the protection of the Titan Atlas, what daughter of Nereus and Doris was convinced by the messenger Delphin to marry the god of the sea, Poseidon?"
      answer: "AMPHITRITE"
    boni:
      - question: "What youth received a crown from Amphitrite when he needed to prove his kinship to Poseidon?"
        answer: "THESEUS"
      - question: "Amphitrite and Poseidon had three children—Triton, Rhode, and Benthesicyme. Poseidon gave Benthesicyme what youth to raise after his mother, Chione, threw him into the sea?"
        answer: "EUMOLPUS  <latin>--</latin>"
  - tossup:
      question: "Granted the title of <latin>dux orientis</latin>, which nobleman of Palmyra defeated the prefect Ballista and recovered several eastern provinces for Gallienus?"
      answer: "(P. SEPTIMIUS) OD(A)ENATHUS"
    boni:
      - question: "What son of Odaenathus succeeded him with his wife Zenobia as regent?"
        answer: "(LUCIUS JULIUS) VABALLATHUS"
      - question: "What rebellious father and son of the same name did the forces of Gallienus defeat in Europe after they had taken control in Syria?"
        answer: "MACRIANUS"
  - tossup:
      question: "Which of the following words does not belong with the others because of some point of grammar: <latin>actūtum, emptum, sātum, rīsum</latin>."
      answer: "<latin>ACTŪTUM</latin>"
    boni:
      - question: "Which of the following words does not belong with the others because of some point of grammar: <latin>crepō, suescō, crēbrō, gerō</latin>."
        answer: "<latin>CRĒBRŌ</latin>"
      - question: "Which of the following words does not belong with the others because of some point of grammar: <latin>capī, temperī, poscī, cierī.</latin>"
        answer: "<latin>TEMPERĪ</latin>"
  - tossup:
      question: "What island stands “low-lying, farthest out to sea and facing towards the dusk”— near the islands of “Dulichium, Same (pronounced SAW-may), and wooded Zacynthus”—according to the account given to Alcinoüs by its native son Odysseus?"
      answer: "ITHACA"
    boni:
      - question: "Few places on Ithaca are explicitly described in the <title>Odyssey</title>. Book 13, however, describes Odysseus landing at a harbor sacred to what sea deity?"
        answer: "PHORCYS"
      - question: "Book 24 describes an orchard tilled by what man, who stops the war with the suitors’ parents when he kills Eupeithes?"
        answer: "LAËRTES"
  - tossup:
      question: "What massive work contained the titles <title><latin>Sexagesis, Marcipor,</latin></title> and <title><latin>Eumenides</latin></title> in its 150 books in which prose is interspersed with verse?"
      answer: "(VARRO’S [REATINUS’ / OF REATE’S]) <title>MENIPPEAN SATIRES /</title> <title><latin>SATURAE</latin></title> <latin>MENIPPEAE / SATURARUM MENIPPEARUM LIBRI</latin>"
    boni:
      - question: "What work on the apotheosis of the emperor Claudius is the only near-complete classical Menippean Satire that survives?"
        answer: "<title><latin>APOCOLOCYNTOSIS / LUDUS DĒ MORTE CLAUDIĪ</latin></title>"
      - question: "What late author wrote a Menippean Satire which contained dialogue between the imprisoned author and the personified version of Philosophy?"
        answer: "(ANICIUS MANLIUS SEVERINUS) BOETHIUS"
  - tossup:
      question: "Translate into Latin: This battle is the kind that kills even the most pious hero."
      answer: "<latin>HOC PROELIUM EST QUOD ETIAM PIISSIMUM / PIENTISSIMUM / MAXIMĒ PIUM HĒRŌA / VIRUM / HĒRŌEM</latin> (BUT POST-CLASSICAL) <latin>NECĀVIT/ NECAT / NECET</latin>"
    boni:
      - question: "Translate into Latin: If only I had found a brighter torch!"
        answer: "<latin>(UTINAM / [Ō] SI) CLARIŌREM / FULGIDIOREM / LUCIDIOREM / FULGENTIOREM / CANDIDIOREM TAEDAM / FACEM / LAMPADA / LUMEN INVĒNISSEM / NACTUS, -A, -UM ESSEM / REPPERISSEM!</latin>"
      - question: "Translate into Latin using a relative pronoun: Neptune must send the dolphin to persuade the nymph."
        answer: "<latin>DELPHĪN(US) NEPTŪNŌ MITTENDUS EST / DELPHĪNUM NEPTŪNŌ NECESSE EST MITTERE / NEPTŪNUM OPORTET  DELPHĪNUM MITTERE / NEPTŪNUS DEBET DELPHĪNUM MITTERE QUĪ NYMPHAE / NYMPHAI / NYMPHEI / NAIDĪ PERSUADEAT                     --</latin>"
  - tossup:
      question: "Consider this list of verbs: <latin>adipīscor, ulcīscor, pacīscor, expergīscor</latin>, and <latin>opperior</latin>. Which verb defines the action in this sentence? <latin>Mane Marcum dormientem incitō</latin>."
      answer: "<latin>EXPERGĪSCOR</latin>"
    boni:
      - question: "Considering the same verbs: <latin>adipīscor, ulcīscor, pacīscor, expergīscor</latin>, and <latin>opperior</latin>. Which verb defines the action? <latin>Tibi quīnque sestertiōs dabō, nōn decem.</latin>"
        answer: "<latin>PACĪSCOR</latin>"
      - question: "Considering the same verbs: <latin>adipīscor, ulcīscor, pacīscor, expergīscor</latin>, and <latin>opperior</latin>, which verb defines the action? <latin>Sedēbō hīc dum mater mea adveniat</latin>."
        answer: "<latin>OPPERIOR</latin>"
  - tossup:
      question: "While fighting at Troy, who bore a shield that the Hylean worker Tychios had crafted from seven hides, using it to block arrows from hitting his half-brother, Teucer?"
      answer: "AJAX TELAMON // TELAMONIAN AJAX // \t\tAJAX THE GREAT(ER) // BIG AJAX"
    boni:
      - question: "In Book 7 of the <title>Iliad</title>, Ajax is drawn by lot to duel against Hector. What son of Euaemon, who in other poems discovered a chest containing an image of Dionysus after the fall of Troy, also had cast his lot to duel Hector?"
        answer: "EURYPYLUS"
      - question: "In Book 9 of the <title>Iliad</title>, Ajax is sent as an ambassador to Achilles alongside what two men, delivering only a brief speech?"
        answer: "ODYSSEUS and PHOENIX"
  - tossup:
      question: "Did you know that you have rights?  Provided is a list of questions you may or may not have as a Roman of the late Republic.  Looking at the laws on the right hand side of the page, please provide the letter corresponding to the law which would best answer the legal question on the left labeled 1."
      answer: "D"
    boni:
      - question: "Now, please provide the letter corresponding to the law which would best answer the legal question labeled as 2."
        answer: "E"
      - question: "Finally, please identify the letter corresponding to the law which would not directly answer any of the questions on the left."
        answer: "B"
  - tossup:
      question: "Listen carefully to the following Latin passage, which I will read twice, then <latin>RESPONDĒ LATĪNĒ</latin> to the questions which follow. HEADS UP: this is NOT the same <latin>bōs</latin> as in Round 3. \t<latin>Sabīnusque ut prīma apta diēs sacrificiō vīsa est, bovem Rōmam actam dēdūcit ad fānum Diānae et ante āram statuit.</latin> <latin>Ibi sacerdos Rōmāna, cum eam magnitūdō victimae celebrātā fāmā bovis mōvisset, fāta est.</latin> REREAD  The question:  <latin>Quandō</latin> <latin>Sabīnus bovem Rōmam</latin> <latin>dēdūcit?</latin>"
      answer: "<latin>(PRĪMĀ/PRĪMŌ) DIĒ APTĀ/APTŌ (SACRIFICIŌ)</latin>     <latin>CUM (PRĪMA) DIĒS APTA SACRIFICIŌ VIDĒRET/</latin>      <latin>UBI (PRĪMA) DIĒS APTA SACRIFICIŌ VĪSA EST/</latin> \t\t<latin>UT (PRĪMA) DIĒS APTA SACRIFICIŌ VISA EST</latin>  \t\t(*<emphasis><latin>PROMPT</latin></emphasis><latin>*</latin> ON <latin>PRĪMĀ DIĒ)</latin>"
    boni:
      - question: "<latin>Quōmodo sacerdos Rōmāna mōta est?</latin>"
        answer: "<latin>MAGNITŪDINE VICTIMAE / BOVIS // CELEBRĀTĀ FĀMĀ</latin>"
      - question: "<latin>Postquam Romam vēnit, quō duxit Sabinus bovem?</latin>"
        answer: "<latin>(AD) FANUM / TEMPLUM DIANAE // (AD) ARAM</latin>"
  - tossup:
      question: "What work of Cicero, which is partially based on a work by Panaetius, discussed the four essential virtues and was dedicated to his son Marcus?"
      answer: "<title><latin>DĒ OFFICIĪS</latin></title>"
    boni:
      - question: "What textbook on rhetoric, which was written in question and answer format, did Cicero write for the education of his son?"
        answer: "<title><latin>PARTITIŌNĒS ORATORIAE</latin></title>"
      - question: "What late author of the 4th century A.D. composed a commentary on the <latin>Somnium Scīpiōnis</latin>, the last book of Cicero’s <title><latin>Dē Republicā</latin></title>?"
        answer: "(AMBROSIUS THEODOSIUS) MACROBIUS  <latin>--</latin>"
  - tossup:
      question: "At the beginning of the reign of Claudius, what commander became the first Roman to cross the Atlas Mountains while successfully suppressing a revolt in Mauretania?"
      answer: "(C.) SUETONIUS PAULINUS"
    boni:
      - question: "Whose execution at the end of Caligula’s reign had sparked that revolt in Mauretania?"
        answer: "PTOLEMY (OF MAURETANIA)"
      - question: "Who was Ptolemy’s mother?"
        answer: "CLEOPATRA SELENE"
  - tossup:
      question: "What Latin abbreviation is used to indicate the front of a page, or the right-hand page?"
      answer: "<latin>F.R.</latin>"
    boni:
      - question: "Give two possible Latin words represented by the abbreviation “<latin>fl.</latin>”<latin>.</latin>"
        answer: "<latin>FLORES / FLORUIT</latin>"
      - question: "The abbreviation <latin>ff.</latin>, which often appeared on works of art, stands for what Latin word?"
        answer: "<latin>FĒCĒRUNT</latin> [<emphasis>NOT</emphasis> <latin>FĒCIT</latin>]"
  - tossup:
      question: "The lines: <latin>Pauca meō Gallō, sed quae legat ipsa Lycōris, carmina sunt dīcenda: neget quis carmina Gallō?</latin> make up the address to Cornelius Gallus that begins the tenth poem of what work of Latin Literature?"
      answer: "<title>ECLOGUES / BUCOLICS</title>"
    boni:
      - question: "What Roman author, who most likely flourished during the reign of Nero, used Vergil as a model for his seven eclogues?"
        answer: "CALPURNIUS SICULUS"
      - question: "What author of the third century A.D. leaves us 4 eclogues along with a didactic poem on hunting?"
        answer: "(M. AURELIUS OLYMPIUS) NEMESIANUS"
  - tossup:
      question: "Who successfully strung the bow that Heracles had given to his mother, overcoming his brothers Agathyrsus and Gelonus to become king of an eponymous tribe north of the Black Sea?"
      answer: "SCYTHES"
    boni:
      - question: "Scythes’ mother is sometimes known by what name, which she shares with the mother of the Crommyonian Sow?"
        answer: "ECHIDNA"
      - question: "The story of Scythes is related in Book 4 of Herodotus’ <title>Histories</title>. Herodotus then describes how the Scythians invaded the territory of what people, who appear in the <title>Odyssey</title> at the bounds of the earth, where the sun never rose?"
        answer: "CIMMERIANS / <latin>CIMMERIOI</latin>  <latin>--</latin>"
  - tossup:
      question: "What grammatical anomaly is shared by all the following nouns: <latin>penātēs, valvae, moenia?</latin>"
      answer: "THEY ARE PLURAL ONLY / <latin>PLURĀLIA TANTUM</latin>"
    boni:
      - question: "What grammatical anomaly is shared by all the following nouns: <latin>trīticum, āēr, aurum?</latin>"
        answer: "THEY ARE SINGULAR ONLY / <latin>SINGŪLĀRIA TANTUM</latin>"
      - question: "What grammatical anomaly is shared by all the following nouns: <latin>prece, ope, fruge</latin>?"
        answer: "REGULAR IN THE PLURAL BUT DEFECTIVE IN THE SINGULAR (A&G 103f.)"
