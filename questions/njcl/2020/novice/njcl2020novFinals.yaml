tournament: "NJCL Certamen"
year: 2020
division: "Novice"
round: "Finals"
questions:
  - tossup:
      question: "Which two of the following verbs are synonyms with one another: <latin>abdō, colō, dēdō, reddō, cēlō?</latin>"
      answer: "<latin>ABDŌ, CĒLŌ</latin>"
    boni:
      - question: "What meaning is shared by all of the following: <latin>gerō, transportō, ferō</latin>?"
        answer: "(TO / I) CARRY / BEAR"
      - question: "Which of the following verbs cannot be used impersonally: <latin>dēlectō, doleō, liceō, pereō, placeō</latin>?"
        answer: "<latin>PEREŌ</latin>"
  - tossup:
      question: "What three word Latin phrase could be used to describe an item that is absolutely essential and without which you cannot function?"
      answer: "<latin>SINE QUĀ NŌN</latin>"
    boni:
      - question: "What two word Latin phrase meaning “come with me” often can be used interchangeably with the phrase <latin>sine quā nōn</latin>?"
        answer: "<latin>VĀDE MĒCUM</latin>"
      - question: "If somebody were to suddenly lose their <latin>vāde mēcum</latin>, then one might say that there has been a disturbance in the “existing state of affairs.” What two word Latin phrase could one use to describe “the current state of affairs?”"
        answer: "<latin>STATUS QUŌ</latin>"
  - tossup:
      question: "<latin>Respondē Latīnē: Quid factum est in quattuor plānīs, quī statūmen, rūdus, nucleus, et dorsum nōminantur?</latin>"
      answer: "<latin>VIA</latin>"
    boni:
      - question: "<latin>Respondē aut Anglīcē aut Latīnē: Quā viā Rōmānī Genuam īvērunt?</latin>"
        answer: "<latin>AURĒLIĀ /</latin> AURELIA"
      - question: "<latin>Respondē aut Anglīcē aut Latīnē: Quibus duābus viīs Rōmānī īvērunt Rōmā Capuam?</latin>"
        answer: "<latin>(VIĀ) LATĪNĀ ET (VIĀ) APPIĀ //</latin> (VIA) LATINA AND (VIA) APPIA"
  - tossup:
      question: "Listen carefully to the following Latin passage, which I will read twice, then <latin>RESPONDĒ LATĪNĒ</latin> to the questions which follow. \t<latin>Agricola plaustrum duōbus bovibus tractum agēbat. Subitō plaustrum magnō saxō in viā occurrit et movērī ā bovibus nōn poterat.  Sorōrēs maximē commōtae erant et lacrimāre incēpērunt.  Aurēlia, tamen, nōn timēbat. Illa dē plaustrō saluit et cum agricolā maximīs cum vīribus saxum mōvit. Eugē! Omnēs felicēs domum rediērunt.</latin> \tREPEAT  \tThe question: <latin>Quī plaustrum trahēbant?</latin>"
      answer: "<latin>(DUO) BOVĒS / TAURĪ / VACCAE /  \t\tIUVENCAE/-Ī  / PECUDĒS</latin>"
    boni:
      - question: "<latin>Cui timor dēerat?</latin>"
        answer: "<latin>AURĒLIAE</latin>"
      - question: "<latin>Quōmodo saxum mōtum est?</latin>"
        answer: "<latin>(MAXIMĪS CUM) VĪRIBUS // AB AURĒLIĀ ET/CUM AGRICOLĀ //</latin> \t\t(<latin>*</latin><emphasis><latin>prompt</latin></emphasis><latin>*</latin> on solely “<latin>AB AURĒLIĀ</latin>” or “<latin>AB AGRICOLĀ</latin>”)"
  - tossup:
      question: "What creature, on whose horns Taÿgete had stamped Artemis’ name, was finally captured at the River Ladon by Heracles, completing his third labor?"
      answer: "CERYNITIAN / CERYNEIAN HIND"
    boni:
      - question: "Angered at the capture of her sacred animal, Artemis confronted Heracles as he carried away the hind. She let him go, however, after he blamed his actions on what man?"
        answer: "EURYSTHEUS"
      - question: "Taÿgete was a member of what mythological group, traditionally considered the sisters of the Hyades?"
        answer: "PLEIAD(E)S"
  - tossup:
      question: "What gender are all of the following nouns: <latin>vulgus, pelagus, genū, animal</latin>?"
      answer: "NEUTER"
    boni:
      - question: "Which of these does not take the same case as the others: <latin>apud, contrā, prō, prope, suprā</latin>?"
        answer: "<latin>PRŌ</latin>"
      - question: "Which of these does not take a dative: <latin>aequus, amīcus, cārus, plēnus, similis</latin>?"
        answer: "<latin>PLĒNUS</latin>"
  - tossup:
      question: "What proconsul, in 1 BC, appointed a king named Ariobarzanes to the Armenian throne, but eventually died in Lycia while returning to Italy in 4 AD, only two years after the death of his brother, Lucius Caesar?"
      answer: "GAIUS (IULIUS) CAESAR"
    boni:
      - question: "By what title was Gaius saluted by the <latin>equitēs</latin> when he was admitted to the Senate in 1 BC?"
        answer: "<latin>PRĪNCEPS IUVENTŪTIS</latin>"
      - question: "What daughter of Drusus and Antonia, who was first married to Gaius Caesar, was accused of cooperating with Sejanus to poison her second husband, Drusus II?"
        answer: "(CLAUDIA LIVIA JULIA) LIVILLA // LIVIA JULIA"
  - tossup:
      question: "For the sentence, “We saw Hercules opening the wine,” use a participle of the verb <latin>aperiō</latin> to translate “opening” into Latin."
      answer: "<latin>APERIENTEM</latin>"
    boni:
      - question: "Use a participle of the verb <latin>aperiō</latin> to translate “opened” in the sentence: “Pholus did not want to drink the opened wine.”"
        answer: "<latin>APERTUM</latin>"
      - question: "Now use a form <latin>veniō</latin> to translate “about to come” in the sentence: “Pholus knows that the centaurs are about to come.”"
        answer: "<latin>VENTŪRŌS / VENTŪRĀS / VENTŪRA (ESSE)</latin>"
  - tossup:
      question: "At this point we will share a screen with the visual.  Once the visual is displayed you will have 10 seconds to examine it before I begin the toss-up question.    Please identify the mythological figure identified with the number 2."
      answer: "MEDEA"
    boni:
      - question: "Now please identify the mythological brigand identified with the number 5."
        answer: "SINIS / PITYOCAMPTES (prompt on “pine-bender”)"
      - question: "On what mountain did the scene featuring the mythological figure identified with the number 4 occur?"
        answer: "(MT.) OETA"
  - tossup:
      question: "Out of the Stadium of Domitian, the Baths of Caracalla, the Theater of Pompey, and the Pantheon which was NOT located in Rome’s Campus Martius?"
      answer: "BATHS OF CARACALLA"
    boni:
      - question: "Name two other emperors who had public bath complexes named for them in the city of Rome."
        answer: "<latin>two</latin> of: NERO, TITUS, TRAJAN, DIOCLETIAN, CONSTANTINE"
      - question: "Caracalla is one of the emperors who made restorations to the Pantheon. What earlier emperor had it rebuilt to its present form?"
        answer: "HADRIAN"
  - tossup:
      question: "What derivative of a second conjugation Latin verb meaning “see” means “face”?"
      answer: "VISAGE"
    boni:
      - question: "Give a derivative of that same Latin verb that means “imagine”."
        answer: "ENVISAGE / ENVISION / VISUALIZE"
      - question: "Give the nominative singular, genitive singular, and gender of the Latin word at the root of “imagine.”"
        answer: "<latin>IMĀGŌ, IMĀGINIS</latin>, F."
  - tossup:
      question: "What region is described in the following three clues: it was the region where Poseidon celebrated a festival while the gods held council in Book 1 of the <title>Odyssey</title>, the region ruled by a queen whose hubris caused it to endure the sea-monster Cetus, and the home region of the Trojan ally Memnon?"
      answer: "ETHIOPIA"
    boni:
      - question: "Name that queen, who was placed in the stars after her death—but upside-down on her chair, with her feet in the air."
        answer: "CASSIOPEIA"
      - question: "In Book 1 of the <title>Odyssey</title>, the first discussion in the gods’ council concerns what man, who killed his lover’s husband, then was killed by his lover’s son?"
        answer: "AEGISTHUS"
  - tossup:
      question: "Translate into Latin: “Both you and I will go to the Circus tomorrow.”"
      answer: "<latin>ET EGO ET TŪ / VŌS AD CIRCUM CRĀS ĪBIMUS</latin> <emphasis>DO NOT READ ALL THE ALTERNATE COMBINATIONS!!!</emphasis> (ALSO ACCEPT <latin>AC/ATQUE...AC/ATQUE, -QUE…-QUE</latin>, OR ANY  COMBINATION OF THOSE WORDS AND <latin>ET</latin> FOR “BOTH...AND,” ALSO ACCEPT <latin>CUM...TUM</latin> BUT ONLY IN THAT COMBINATION)"
    boni:
      - question: "Translate into Latin: “I went home and slept.”"
        answer: "<latin>(EGO) Ī</latin>(<latin>V</latin>)<latin>Ī / ĪBAM / ĪVERAM DOMUM ET DORMĪVĪ / DORMIĒBAM</latin>"
      - question: "Translate into Latin: “The athlete ran from Rome to Pompeii.”"
        answer: "<latin>ATHLĒTA RŌMĀ POMPĒIŌS CUCURRIT / CURRĒBAT</latin>"
  - tossup:
      question: "Rēspondē aut Anglicē aut Latīnē: Quae pars ōrātiōnis est “umquam?"
      answer: "” ADVERBIUM / ADVERB"
    boni:
      - question: "<latin>Rēspondē aut Anglicē aut Latīnē: Cuius temporis est verbum “convocābat?</latin>"
        answer: "<latin>” IMPERFECTĪ /</latin> IMPERFECT"
      - question: "<latin>Rēspondē aut Anglicē aut Latīnē: Cuius modī est “ferte?</latin>"
        answer: "<latin>” IMPERĀTĪVĪ /</latin> IMPERATIVE"
  - tossup:
      question: "What king’s pursuit of a retreating Roman left wing with his cavalry allowed forces \tunder Eumenes II to stampede his elephants with javelins and defeat him at the battle of Magnesia-ad-Sipylum?"
      answer: "ANTIOCHUS III / THE GREAT"
    boni:
      - question: "Over what Ionian city, granted to Rome later in the second century BC, did Eumenes II rule?"
        answer: "PERGAMUM / PERGAMON"
      - question: "What Roman ex-consul shared effective command with Eumenes at Magnesia because Scipio Africanus was ill during the battle?"
        answer: "(CN. DOMITIUS) AHENOBARBUS"
  - tossup:
      question: "After spending a “great year” in the service of Ares for killing a dragon, who became king of a Boeotian city that was founded where a spotted cow lay down?"
      answer: "CADMUS"
    boni:
      - question: "After Cadmus had killed the dragon, who appeared to him, saying to sow the earth with half of the dragon’s teeth?"
        answer: "ATHENA / ONCA"
      - question: "When Cadmus sowed the teeth, a huge number of men were born from the earth. How did Cadmus reduce this mass of men to only five?"
        answer: "<emphasis>THREW A STONE</emphasis> AMONG THEM (CAUSING THEM TO FIGHT / KILL EACH OTHER)"
  - tossup:
      question: "In the sentence, “He was a man of tremendous spirit,” use the same noun to translate the word “spirit” in two ways. \t\t<latin>ANIMĪ, ANIMŌ</latin> (or pl.) <latin>// ANIMAE, ANIMĀ // SPĪRITŪS, SPĪRITŪ //</latin>"
      answer: "<latin>VIS / VĪ // VIRTŪTIS / VIRTŪTE</latin>"
    boni:
      - question: "In the sentence “Marcus’ friend, Aemilia, is a wonderful companion,” translate “Marcus’ friend” in two ways."
        answer: "<latin>AMĪCA MĀRCI / AMĪCA MĀRCŌ</latin>"
      - question: "Translate into Latin “Aemilia taught Marcus many things.”"
        answer: "<latin>AEMILIA MULTA / MULTĀS RĒS MĀRCUM DOCUIT / DOCĒBAT</latin>"
  - tossup:
      question: "Who, while fighting at the <latin>Silva Arsia</latin>, simultaneously killed and was killed by Arruns, soon after putting his own sons to death when they plotted to reinstate the Tarquins?"
      answer: "(L. IUNIUS) BRUTUS"
    boni:
      - question: "What co-consul of Brutus ruled alone for a time before choosing a suffect consul to succeed Brutus?"
        answer: "(VALERIUS) POPLICOLA / PUBLICOLA"
      - question: "What <latin>praenōmen</latin> was shared by the man who was elected to fill Brutus’ consulship and the first <latin>magister equitum</latin>?"
        answer: "SPURIUS (LUCRETIUS & CASSIUS)"
  - tossup:
      question: "Which of the following words derive from the same Latin root: duke, double, dome, conduct?"
      answer: "DUKE & CONDUCT"
    boni:
      - question: "Which of the following words derive from the same Latin root: molecule, mill, monitor, monster?"
        answer: "MONITOR & MONSTER"
      - question: "Which of the following words derive from the same Latin root: termite, integer, detain, tangible?"
        answer: "INTEGER & TANGIBLE"
  - tossup:
      question: "According to some versions, who created Phaënon while fashioning humans from clay, although he is better known for enabling humans to have sustenance with a special gift delivered by fennel-stalk?"
      answer: "PROMETHEUS"
    boni:
      - question: "What god carried Phaënon off to heaven, where he became a planet?"
        answer: "ZEUS"
      - question: "Although some versions say it was Prometheus, what Olympian is sometimes said to have delivered Athena from Zeus’ head?"
        answer: "HEPHAESTUS"
