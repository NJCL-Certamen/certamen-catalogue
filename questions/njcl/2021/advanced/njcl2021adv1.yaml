tournament: "NJCL Certamen"
year: 2021
division: "Advanced"
round: "Round 1"
questions:
  - tossup:
      question: "What Roman hero was said to have given up his property to redeem debtors from slavery after saving the Capitol from the Gauls in 390 BC?"
      answer: "(M. MANLIUS) CAPITOLINUS"
    boni:
      - question: "What law of 367 BC set an upper limit of 300 <latin>iugera</latin> for any one citizen’s property?"
        answer: "<latin>LEX LICINIA(-SEXTIA)</latin>"
      - question: "When the Romans were measuring out their payment to the Gauls, what Gallic chieftain threw his sword on the scales and responded to their complaints with the phrase “<latin>vae victīs</latin>”?"
        answer: "BRENNUS"
  - tossup:
      question: "For the verb <latin>vetō</latin>, give the 3rd person singular perfect active subjunctive."
      answer: "<latin>VETUERIT</latin>"
    boni:
      - question: "For the verb <latin>tundō</latin>, give the 3rd person plural pluperfect active subjunctive."
        answer: "TUTUDISSENT"
      - question: "For the verb <latin>sciō</latin>, give the 2nd person plural future active imperative."
        answer: "<latin>SCITŌTE</latin>"
  - tossup:
      question: "What triad of deities intervened in the Gigantomachy by killing Agrius and Thoas, but are best known for spinning, measuring, and cutting the threads of mortals’ lives?"
      answer: "FATES / <latin>MOIRAI</latin> / <latin>PARCAE</latin> / <latin>FATA</latin>"
    boni:
      - question: "Give Hesiod’s names for the three Fates."
        answer: "CLOTHO, LACHESIS, and ATROPOS"
      - question: "The Fates did become directly involved in mortal affairs on certain occasions. Apollo once made the Fates drunk and convinced them to offer what mortal a special boon or gift?"
        answer: "ADMETUS"
  - tossup:
      question: "I hope you enjoyed the 1995 movie Braveheart with Mel Gibson. Translate into English this line from the movie: <latin>Hūc ad pūgnandum prō eīs nōn vēnimus</latin>."
      answer: "WE DID NOT COME HERE TO FIGHT FOR THEM"
    boni:
      - question: "Now translate this sentence. <latin>Virī līberī vōs pūgnandī causā vēnistis</latin>."
        answer: "YOU HAVE COME AS FREE MEN FOR THE SAKE OF FIGHTING / TO FIGHT."
      - question: "Now translate this most famous line from the movie. <latin>Vītās nostrās capiant, sed lībertātem nostram numquam capient.</latin>"
        answer: "THEY MAY TAKE OUR LIVES, BUT THEY WILL NEVER TAKE OUR FREEDOM."
  - tossup:
      question: "<latin>RESPONDĒ AUT LATĪNĒ AUT ANGLICĒ:</latin> <latin>Quī duo magistrātūs summum imperium tenuērunt dum Rōma rēs pūblica est?</latin>"
      answer: "CŌNSULĒS / CONSULS <latin>CŌNSUL(ĒS) ET PRAETŌR(ĒS) /</latin> CONSUL(S) AND PRAETOR(S) / <latin>CŌNSUL(ĒS) ET DICTĀTŌR(ĒS) /</latin> CONSULS AND DICTATORS / <latin>DICTATOR(ES) ET MAGISTRI / MAGISTER EQUITUM /</latin> DICTATOR(S) AND MAGISTER EQUITUM / MASTER(S) OF HORSE"
    boni:
      - question: "<latin>Respondē Latīnē: Ā quibus comitiīs cōnsulēs ēlēcti sunt?</latin>"
        answer: "CENTURIĀTĪS"
      - question: "<latin>Respondē Latīnē: Quod signum potestātis tulērunt lictōrēs?</latin>"
        answer: "FASCĒS"
  - tossup:
      question: "First serving under Scipio Aemilianus at Numantia in 133 BC, what Roman later fought against Jugurtha with Quintus Metellus in 109 and then replaced his former commander by winning his first consulship?"
      answer: "<latin>(C.) MARIUS</latin>"
    boni:
      - question: "How many consulships did Marius hold?"
        answer: "7"
      - question: "Where did Marius defeat the Teutones, who were invading Gaul in 102 BC?"
        answer: "<latin>AQUAE SEXTIAE</latin>"
  - tossup:
      question: "<latin>Dēscribāmus nunc propriētātēs dictiōnum in hāc sententiā</latin>: “<latin>sibi quisque rūrī metit</latin>” <latin>Quō cāsū est “sibi”?</latin>"
      answer: "(IN CĀSŪ) DĀTIVŌ"
    boni:
      - question: "<latin>Cuius temporis est “metit”?</latin>"
        answer: "(TEMPORIS) PRAESENTIS / IN (TEMPORE) PRAESENTE"
      - question: "<latin>Quō casū est “rūrī”?</latin>"
        answer: "(IN CĀSŪ) DĀTIVŌ / LOCATIVŌ"
  - tossup:
      question: "Which of the following nouns does not belong because of meaning: <latin>simulācrum, instar, vultus, rabiēs, spectrum</latin>?"
      answer: "<latin>RABIĒS</latin>"
    boni:
      - question: "Which of the following nouns does not belong because of meaning: <latin>prōlēs, prōpāgō, stirps, prōgeniēs, prōditor</latin>?"
        answer: "<latin>PRŌDITOR</latin>"
      - question: "Which of the following nouns does not belong because of meaning: <latin>īnferia, terminus, mēta, cardō, modus</latin>?"
        answer: "<latin>ĪNFERIA</latin>"
  - tossup:
      question: "What author traveled in the East, learning Greek, and led a monastic life for three years in the desert of Chalcis before returning to Rome to become the private secretary of Pope Damasus, at whose behest he eventually began writing a Latin translation of the Bible that is known as the <title>Vulgate</title>?"
      answer: "JEROME / (SOPHRONIUS EUSEBIUS) HIERONYMUS"
    boni:
      - question: "What other late Christian author subscribed to Manichaeism before eventually converting to Christianity and wrote an autobiographical work entitled <title><latin>Confessiōnēs</latin></title>?"
        answer: "(ST.) AUGUSTINE / (AURELIUS) AUGUSTINUS"
      - question: "What work of Jerome contains the biographies of 135 Christian writers?"
        answer: "<title><latin>DĒ VIRĪS ILLUSTRIBUS</latin></title>"
  - tossup:
      question: "What type of tree, into which Amphissus’ mother, Dryope, was transformed, produced the fruit which caused some of Odysseus’ comrades to forget about their homes and families?"
      answer: "LOTUS (TREE)"
    boni:
      - question: "Odysseus’ crew had come to the land of the Lotus-Eaters after escaping what people, who lived in Ismarus in Thrace and killed six men on each of Odysseus’ ships?"
        answer: "CICONIANS / CICONES"
      - question: "What deity’s attempted rape could Lotis only escape by transforming into a lotus tree?"
        answer: "PRIAPUS"
  - tossup:
      question: "<latin>RESPONDĒ AUT LATĪNĒ AUT ANGLICĒ:</latin> <latin>In quot partēs dīviditur Gallia, ut dīxit Caesar?</latin>"
      answer: "<latin>TRĒS /</latin> THREE"
    boni:
      - question: "<latin>RESPONDĒ LATĪNĒ:</latin> <latin>Quae gentēs hās trēs partēs incolunt?</latin>"
        answer: "AQUĪTĀNĪ, BELGAE, CELTAE / GALLĪ"
      - question: "<latin>RESPONDĒ AUT LATĪNĒ AUT ANGLICĒ:</latin> <latin>Hārum gentium quī fortissimī sunt?</latin>"
        answer: "BELGAE / BELGIANS"
  - tossup:
      question: "Using a participle, translate the following sentence into Latin: I’m going to run ten miles today!"
      answer: "<latin>CURSŪRUS/A/UM SUM DECEM MĪLIA PASSUUM HODIĒ</latin>"
    boni:
      - question: "Translate the following sentence into Latin: Running is good for my health."
        answer: "<latin>CURRERE BONUM SALŪTĪ (MEAE / MIHI) / PRŌ (MEĀ) VALETŪDINE EST</latin>"
      - question: "Translate the following sentence into Latin: Unless a bear were chasing me, I wouldn’t run ten miles every day."
        answer: "<latin>NISI URSUS/A MĒ AGITĀRET / SEQUERĒTUR, DECEM MĪLIA PASSUUM COTĪDIĒ NŌN CURREREM</latin>"
  - tossup:
      question: "What author, allegedly intending to write about violent war, had one of his metrical feet stolen by Cupid in the opening of his <title><latin>Amores</latin></title>?"
      answer: "(P.) OVID(IUS NASO)"
    boni:
      - question: "What other author spurns the desire for land, war, and riches and prefers the peacefulness of the countryside in the opening lines of his three books of elegies?"
        answer: "(ALBIUS) TIBULLUS"
      - question: "Ovid describes himself as the <latin>praeceptor amōris</latin> in which of his works, which aims to teach his readers how to find love?"
        answer: "<title><latin>ARS AMATORIA</latin></title>"
  - tossup:
      question: "What king, who derived his name from the ransom that his sister paid Heracles for him, married a woman who became a dog when their son Polydorus died?"
      answer: "PRIAM"
    boni:
      - question: "What son of Priam was transformed into a diver-bird after throwing himself into the sea?"
        answer: "AESACUS"
      - question: "What king, the husband of Priam’s daughter Ilione, treacherously murdered Polydorus for his gold after Troy fell to the Greek forces?"
        answer: "POLYM(N)ESTOR"
  - tossup:
      question: "Listen carefully to the following passage, which I will read twice, and answer IN LATIN the question that follows: <latin>Nātūram, animālia, artem admīrans, cotīdiē ego, Ianus nōmine, per māximās silvās in mediā cīvitāte Novī Eborācī vagābar. Ūnō diē pictōrem mīrābilissimam artem plēnam arborum animāliumque pingentem prae mē conspēxī. “Papae,” inquam “quidquid ā tē pingitur in vērō mundō subitō apparet.”</latin> The question: <latin>In quā cīvitāte Ianus errābat?</latin>"
      answer: "(<latin>IN) NOVŌ EBORĀCŌ / NOVĪ EBORĀCĪ</latin>"
    boni:
      - question: "<latin>Quae Ianus cotīdiē in māximīs silvīs admīrātur?</latin>"
        answer: "<latin>NĀTŪRAM, ANIMĀLIA, (ET) ARTEM</latin> (answer must be plural because of quae, so animalia by itself OR both of the other two)"
      - question: "<latin>Cūr ars Ianum stupefēcit?</latin>"
        answer: "<latin>QUIDQUID (Ā PICTŌRE) PINGITUR IN VĒRŌ MUNDŌ (SUBITŌ) APPĀRET.</latin>"
  - tossup:
      question: "The story of Aristaeus and Orpheus is a famous digression contained in what work of Latin literature, which was inspired by Hesiod’s <title>Works and Days</title> and contains four books of hexameters?"
      answer: "THE <title><latin>GEORGICS</latin></title>"
    boni:
      - question: "Which book of the Georgics focuses on beekeeping and contains this famous digression?"
        answer: "FOUR / THE FOURTH / BOOK 4"
      - question: "Vergil ends book four of the Georgics with the line “<latin>Tītyre, tē patulae cecinī sub tegmine fāgī.</latin>” which is a reference to what other work?"
        answer: "<title>ECLOGUES / BUCOLICS /</title> <title><latin>BUCOLICAE</latin></title>"
  - tossup:
      question: "What warrior was freed by Priam from the bloodguilt of killing Hippolyta and then fought for him against the Greeks at Troy, where she was killed by Achilles, who fell in love with her corpse?"
      answer: "PENTHESILEIA"
    boni:
      - question: "Achilles killed what Greek after he jeered at Achilles for his love for Penthesileia?"
        answer: "THERSITES"
      - question: "After killing Thersites, Achilles was himself forced to journey to what island to be purified of his bloodguilt?"
        answer: "LESBOS"
  - tossup:
      question: "<latin>RESPONDĒ AUT LATĪNĒ AUT ANGLICĒ:</latin> <latin>Quī imperātor Rōmānus plūrimōs annōs rēxit?</latin>"
      answer: "AUGUSTUS / THEODOSIUS II"
    boni:
      - question: "<latin>Quī imperātor Rōmānus prīmī saeculī paucissimōs mēnsēs rēxit?</latin>"
        answer: "OTHO"
      - question: "<latin>Quī imperātor Rōmānus scrīpsit dē Carthāginiēnsibus et Etrūscīs?</latin>"
        answer: "CLAUDIUS"
  - tossup:
      question: "What derivative of a Latin word meaning “small” or “short” means “a container, usually rectangular and made of leather, that is used to carry books and documents”?"
      answer: "BRIEFCASE"
    boni:
      - question: "What derivative of the same word is used to describe texts or plays that have been shortened?"
        answer: "ABRIDGED / ABBREVIATED"
      - question: "What Latin adjective also meaning “small” is derived from a Latin verb meaning “do”?"
        answer: "<latin>EXIGUUS</latin> (-<latin>A</latin>, -<latin>UM</latin>)"
  - tossup:
      question: "Which of the following nouns, if any, does not belong with the others because of gender: <latin>murmur, imber, rōbur, calcar,</latin> <latin>aequor</latin>?"
      answer: "<latin>IMBER</latin>"
    boni:
      - question: "Which of those nouns, if any, does not belong because of declension: <latin>murmur, imber, rōbur, calcar,</latin> <latin>aequor?</latin>"
        answer: "NONE"
      - question: "Which of those nouns: <latin>murmur, imber, rōbur, calcar,</latin> <latin>aequor</latin>, if any, drops a vowel before the final “-r” in its stem?"
        answer: "<latin>IMBER</latin>"
