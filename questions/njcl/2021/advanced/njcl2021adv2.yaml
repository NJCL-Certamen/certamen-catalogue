tournament: "NJCL Certamen"
year: 2021
division: "Advanced"
round: "Round 2"
questions:
  - tossup:
      question: "What man migrated to Ceos, to which he brought Etesian winds, after his son by Autonoë was torn apart by his own hounds and his assault on Eurydice caused her to be bitten by a snake?"
      answer: "ARISTAEÜS"
    boni:
      - question: "Name Aristaeüs’ mother, who wrestled a lion."
        answer: "CYRENE"
      - question: "What daughter of Aristaeüs was driven from Euboea to Drepane for nursing Dionysus?"
        answer: "MACRIS"
  - tossup:
      question: "What use of the genitive case is seen in these lines of Vergil’s <title>Aeneid</title>: “<latin>admonet in somnīs et turbida terret imāgō; mē puer Ascanius capitisque iniūria cārī…</latin>”?"
      answer: "OBJECTIVE GENITIVE"
    boni:
      - question: "What use of the ablative case is seen in the very next line from the <title>Aeneid</title>: “<latin>...quem rēgnō Hesperiae fraudō et fātālibus arvīs</latin>”?"
        answer: "ABLATIVE OF SEPARATION / DEPRIVATION"
      - question: "What use of the accusative case is <latin>torva</latin> in this sentence: “<latin>Tālibus Aenēās ardentem et torva tuentem lēnībat dictīs animum lacrimāsque ciēbat</latin>”?"
        answer: "ADVERBIAL ACCUSATIVE"
  - tossup:
      question: "The story continues. Listen carefully to the following passage involving bananas, <latin>ariēnae</latin>, which I will read twice, and answer IN LATIN the question that follows: <latin>Dum in pictūrā duae sīmiae ariēnās mātūrās comedunt, in proximā arbore sīmiae vīvae, coruscantēs hās tamquam ēnsēs, inter sē comminus pūgnāre simulābant. Quō vīsō, ego et pictor tantīs cachinnīs dērīdēre coepimus ut sīmiae nōs adesse animadverterent et irāscerentur. Itaque ariēnae factae sunt hastae, quae ab eīs in nōs contorsae sunt.</latin> The question: <latin>Quōmodo ariēnīs ūtēbāntur?</latin>"
      answer: "<latin>TAMQUAM / UT / SIMILIBUS / SICUT ĒNSIBUS / HASTĪS // ĒNSĒS / HASTĀS SIMULĀBANT</latin>"
    boni:
      - question: "<latin>Quid sīmiae facere simulābant antequam duōs hominēs conspēxērunt?</latin>"
        answer: "<latin>INTER SĒ (COMMINUS) PŪGNĀRE</latin>"
      - question: "<latin>Quid sīmiae agunt cum duo vīrī dērīsērunt?</latin>"
        answer: "(<latin>SĪMIAE) EŌS (ADESSE) ANIMADVERTĒRUNT / ANIMADVERTUNT // IRĀTAE SUNT / IRASCUNTUR // ARIĒNĀS AD EŌS CONTORSĒRUNT / CONTORQUENT</latin>"
  - tossup:
      question: "What December festival was celebrated in a prominent official’s house where drinking, game playing, and music were enjoyed exclusively by women?"
      answer: "<latin>BONA DEA</latin>"
    boni:
      - question: "What April festival involved cleaning out sheep pens, fumigating them with smoke, and then jumping through a bonfire to purify the flocks?"
        answer: "<latin>PARĪLIA / PALĪLIA</latin>"
      - question: "What May festival involved rising at midnight, walking barefoot through the house, and spitting out nine black beans in order to appease the spirits of the deceased?"
        answer: "<latin>LEMŪRIA</latin>"
  - tossup:
      question: "What author described Saturnian verse as so archaic that it was sung by ancient country divinities and prophets, and went on to write the first works of Latin Literature in dactylic hexameter?"
      answer: "(Q.) ENNIUS"
    boni:
      - question: "What is the title of Ennius’s <latin>fābula praetexta</latin>, which is named for a battle that occurred during the Aetolian campaign of his patron Marcus Fulvius Nobilior?"
        answer: "<title><latin>AMBRACIA</latin></title>"
      - question: "What other work of Ennius recounts Roman history from the arrival of Aeneas to military campaigns during the time of his own death in 18 books?"
        answer: "<title><latin>ANNĀLĒS</latin></title>"
  - tossup:
      question: "Using <latin>accidō</latin>, say in Latin, “It happens to the best of us.”"
      answer: "<latin>OPTIMŌ / OPTIMAE / OPTIMĪS NOSTRUM / EX NŌBĪS ACCIDIT</latin>"
    boni:
      - question: "Using two forms of <latin>fīō</latin>, say in Latin, “Whatever can happen, will happen.”"
        answer: "<latin>QUIDQUID / QUICQUID FIERĪ POTEST / POSSIT, FĪET</latin>"
      - question: "Using <latin>contingō</latin>, say in Latin, “If you all had listened to me, this never would have happened to you.”"
        answer: "<latin>SĪ (VŌS OMNĒS) MĒ / MIHI AUDĪVISSĒTIS, HOC VŌBĪS NUMQUAM CONTIGISSET</latin>"
  - tossup:
      question: "What two Homeric characters—whom Poseidon, in the form of Calchas, encourages to defend the Greek ships in Book 13 of the <title>Iliad</title>—often act and are referenced collectively in the poem, because they possess the same name?"
      answer: "AJAXES / AIANTES // AJAX THE GREAT(ER) / TELAMON / SALAMIS and AJAX THE LESS(ER) / OILEUS / LOCRIS"
    boni:
      - question: "In Book 3 of the <title>Iliad</title>, whom does Priam ask about Ajax the Greater as they together watch the Greek chieftains from the walls of Troy?"
        answer: "HELEN"
      - question: "In Book 17 of the <title>Iliad</title>, what two men carry Patroclus’ body back to the Greek camp as both Ajaxes guard them?"
        answer: "MENELAÜS and MERIONES"
  - tossup:
      question: "<latin>RĒSPONDĒ AUT LATĪNĒ AUT ANGLICĒ:</latin> <latin>Cuius iussū interfectus est Cicerō?</latin>"
      answer: "<latin>(MARCĪ) ANTŌN(I)Ī /</latin> MARC ANTONY(’S)"
    boni:
      - question: "<latin>RĒSPONDĒ AUT LATĪNĒ AUT ANGLICĒ: Ubi mortuus est Cicerō?</latin>"
        answer: "FORMIĪS / (AT) FORMIAE / FORMIA"
      - question: "<latin>RĒSPONDE LATĪNĒ: Quae partēs corporis Cicerōnis, ut dīcitur, amputātae sunt et in Fōrō Rōmānō positae sunt?</latin>"
        answer: "CAPUT ET MANŪS"
  - tossup:
      question: "Exploring the relationship between God the Father and God the Son, and setting a uniform date for Easter were two of the discussions featured at what event, called for by Constantine the Great in 325 A.D.?"
      answer: "(FIRST) COUNCIL OF NICAEA"
    boni:
      - question: "In what modern day country is ancient Nicaea located?"
        answer: "TURKEY"
      - question: "In what year did Constantine move the capital of Rome to Byzantium?"
        answer: "330 A.D."
  - tossup:
      question: "What derivative of a Latin word meaning “to stuff” is an English noun meaning “a ludicrous satire”?"
      answer: "FARCE"
    boni:
      - question: "What derivative of the same word means “a localized area of tissue, as in the heart or kidney, that is dying or dead, having been deprived of its blood supply because of an obstruction by embolism or thrombosis”?"
        answer: "INFARCT(ION)"
      - question: "What derivative of a Latin word meaning “full” is an English noun meaning “the state of being full or complete”?"
        answer: "PLENITUDE / PLENTY"
  - tossup:
      question: "What <emphasis>type</emphasis> of creature was impersonated by Zeus to rape Antiope, picked up an object that made Athena’s cheeks overly puff out, and was half-man, half-goat?"
      answer: "SATYR(S)"
    boni:
      - question: "What satyr—ignorant that it would be his downfall—picked up that <latin>aulos</latin> discarded by Athena?"
        answer: "MARSYAS"
      - question: "After Antiope became pregnant by Zeus, she fled from Thebes to avoid the anger of her father, the city’s regent. Name that man, who was the brother of Lycus."
        answer: "NYCTEUS"
  - tossup:
      question: "The Perusine War is the only political reference contained in the <latin>monobiblos</latin> of what author, whose elegies are mainly centered around a woman named Cynthia?"
      answer: "(SEX.) PROPERTIUS"
    boni:
      - question: "According to Apuleius, what was Cynthia’s real name?"
        answer: "HOSTIA"
      - question: "In Book 3, Propertius includes an <latin>epicēdīon</latin> for what adopted son of Augustus?"
        answer: "MARCELLUS"
  - tossup:
      question: "<latin>RESPONDĒ LATĪNĒ</latin>: <latin>Quod animal mūgit?</latin>"
      answer: "VACCA / BOS / PECUS / TAURUS / IUVENCUS"
    boni:
      - question: "<latin>RESPONDĒ LATĪNĒ: Cui animālī multae pulchrīs colōribus ut oculīs pennae in caudā sunt?</latin>"
        answer: "PĀVŌNĪ"
      - question: "<latin>RESPONDĒ LATĪNĒ: Quod animal mappam rubram, ubi quatitur, petat</latin>?"
        answer: "<latin>TAURUS</latin>"
  - tossup:
      question: "Cato the Elder and Laelius play main roles in dialogues written by what famous orator and statesman, who famously prosecuted Vatinius, Piso, and Catiline?"
      answer: "(M. TULLIUS) CICERO"
    boni:
      - question: "Cato the Elder is the main spokesman in Cicero’s dialogue concerning what subject?"
        answer: "OLD AGE // <latin>DĒ SENECTŪTE // SENECTŪS</latin>"
      - question: "In a section of what prominent treatise of Cicero does Scipio Africanus appear to Scipio Aemilianus in a dream to show him the insignificance of all human things?"
        answer: "<title><latin>DĒ RĒ PŪBLICĀ</latin></title>"
  - tossup:
      question: "After the disastrous defeat of Marcus Aurelius Cotta at Chalcedon in 74 BC, what consul obtained command over Cilicia and Asia and won a series of stunning victories at Cyzicus, Cabira, Lemnos, and Tigranocerta against Mithridates VI before his soldiers mutinied, sending him home to tend to his cherry trees?"
      answer: "(L. LICINIUS) LUCULLUS"
    boni:
      - question: "Following the mutiny of his soldiers, Lucullus was replaced by Acilius Glabrio and then Pompey. What city was founded by Pompey after he defeated Mithridates VI there in 66 BC, the final battle of Rome’s third war with the Pontic king?"
        answer: "NICOPOLIS"
      - question: "Betrayed by his family and facing open rebellion, where did Mithridates commit suicide in 63 BC?"
        answer: "PANTICAPAEUM"
  - tossup:
      question: "Complete the analogy: <latin>vidētis</latin> is to <latin>vidēmini</latin> as <latin>vīdistis</latin> is to ____."
      answer: "<latin>VĪSĪ/AE/A ESTIS</latin>"
    boni:
      - question: "Complete the analogy: <latin>videō</latin> is to <latin>vidē</latin> as <latin>cōnor</latin> is to ____."
        answer: "<latin>CŌNĀRE</latin>"
      - question: "Complete this analogy: <latin>vidēbat</latin> is to <latin>vīderat</latin> as <latin>gaudērēmus</latin> is to ____."
        answer: "<latin>GAVĪSĪ/AE/A ESSĒMUS</latin>"
  - tossup:
      question: "Of the words <latin>antrum, fluctus, papilio, līmen,</latin> and <latin>pectus</latin>, which is best described in the following sentence? <latin>Per hiemem ursī in hōc locō dormiunt.</latin>"
      answer: "<latin>ANTRUM</latin>"
    boni:
      - question: "Of the words <latin>antrum, fluctus, papilio, līmen,</latin> and <latin>pectus</latin>, which is best described in the following sentence? <latin>Necesse est marītō uxōrem trans hoc ferre ut rēs infelicēs vitent.</latin>"
        answer: "LĪMEN"
      - question: "Of the words <latin>antrum, fluctus, papilio, līmen,</latin> and <latin>pectus</latin>, which is best described in the following sentence? <latin>Nautae sperant ut hoc aequum sit.</latin>"
        answer: "<latin>FLUCTUS</latin>"
  - tossup:
      question: "The four sons of Astacus served as defenders of what city, where attackers such as Hippomedon, Parthenopaeüs, and Polyneices fell while trying to breach its seven gates?"
      answer: "THEBES"
    boni:
      - question: "Which of the Seven Against Thebes ironically bore a shield that was inscribed with a naked man bearing fire and the message “I will burn down the city”?"
        answer: "CAPANEÜS"
      - question: "Which of the Seven Against Thebes characteristically bore a shield on which nothing was inscribed?"
        answer: "AMPHIARAÜS"
  - tossup:
      question: "In the <title>Aeneid,</title> who speaks this line <latin>Hunc ego Dītī sacrum iussa ferō tēque istō corpore solvō</latin> and is described as flying on saffron wings and trailing a thousand colors across the sun as she goes to end Dido’s suffering?"
      answer: "IRIS"
    boni:
      - question: "Who is the speaker of the following lines from the <title>Aeneid</title>: <latin>Mēne inceptō dēsistere victam, nec posse Ītaliā Teucrōrum āvertere rēgem? Quippe vetor fātīs. Pallāsne exūrere classem Argīvom atque ipsōs potuit submergere pontō, ūnīus ob noxam et furiās Aiācis Oīlēī?</latin>"
        answer: "JUNO / IUNO"
      - question: "Who is being described in the following lines from the <title>Aeneid</title>: <latin>Hic Hammōne satus raptā Garamantide nymphā templa Iovī centum lātīs immānia rēgnīs, centum ārās posuit vigilemque sacrāverat ignem, excubiās dīvum aeternās, pecudumque cruōre pingue sōlum et variīs flōrentia līmina sertīs.</latin>"
        answer: "IARBAS"
  - tossup:
      question: "Translate the following sentence from Latin to English: <latin>Latrō cānissimus latrantibus canibus pavefactus est.</latin>"
      answer: "THE VERY HOARY / GRAY / WHITE // HOARIEST / GRAYEST / WHITEST BURGLAR WAS TERRIFIED BY THE BARKING DOGS"
    boni:
      - question: "Translate this sentence into English: <latin>For fūrem farris ferre ferrum.</latin>"
        answer: "I SAY THAT THE GRAIN / SPELT / WHEAT / CORN THIEF IS CARRYING A SWORD"
      - question: "Translate this sentence into English: <latin>Hesternā nocte perlēgī fābellam dē fānō ē faenō factō ab porculō.</latin>"
        answer: "LAST NIGHT I READ A (LITTLE) STORY ABOUT A TEMPLE MADE OF HAY BY A (LITTLE) PIG(GY) / PIGLET"
      - question: "<emphasis>Replacements for DC & VA teams: (VA will sub in their original team from Round 1 only for these replacement Boni)</emphasis> Augustus limited the number of <latin>mūnera</latin> which municipal magistrates outside the city of Rome could celebrate to how many per year?"
        answer: "ONE"
      - question: "In 27 AD Tiberius forbade any private citizen to hold a <latin>mūnus</latin> if that citizen was worth fewer than how many sesterces?"
        answer: "400,000"
