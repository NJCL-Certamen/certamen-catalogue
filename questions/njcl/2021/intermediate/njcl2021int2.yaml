tournament: "NJCL Certamen"
year: 2021
division: "Intermediate"
round: "Round 2"
questions:
  - tossup:
      question: "In response to what woman’s lack of humility did Poseidon send Cetus to ravage her land of Ethiopia, leading her husband to offer their daughter, Andromeda, as an offering?"
      answer: "CASSIOPEIA"
    boni:
      - question: "Name this husband of Cassiopeia."
        answer: "CEPHEUS"
      - question: "What is unusual about Cassiopeia’s constellation, in which she sits in a chair?"
        answer: "SHE LIES ON HER BACK WITH HER FEET IN THE AIR // SHE IS UPSIDE-DOWN"
  - tossup:
      question: "What is the modern name of <latin>Aquincum</latin>?"
      answer: "BUDAPEST"
    boni:
      - question: "What is the modern name of <latin>Aquae Sextiae</latin>?"
        answer: "AIX(-EN-PROVENCE)"
      - question: "What is the modern name of <latin>Aquae Sūlis</latin>?"
        answer: "BATH"
  - tossup:
      question: "What English derivative of <latin>rapiō</latin> is an adjective that means extremely hungry or voracious?"
      answer: "RAVENOUS / RAPACIOUS"
    boni:
      - question: "What English adjective, derived from the Latin word <latin>regō</latin>, means disorderly and not readily ruled, controlled, or managed?"
        answer: "UNRULY / INCORRIGIBLE / UNREGULATED / IRREGULAR"
      - question: "What English verb, derived from the Latin word <latin>rideō</latin>, means to make fun of or to mock?"
        answer: "RIDICULE / DERIDE"
  - tossup:
      question: "After gaining control of Messana circa 288 BC, what corps of discharged Campanian mercenaries appealed to the Carthaginians for help against Hiero’s siege in 264 BC, an event that ignited the First Punic War?"
      answer: "MAMERTINES"
    boni:
      - question: "A year later, what Roman consul managed to detach Hiero from his alliance with Carthage, gaining him the first triumphal cognomen in history?"
        answer: "(M’/ MANIUS) VALERIUS (MAXIMUS) / MESSALLA"
      - question: "In 262 BC, what city that served as the Carthaginian base on the south coast of Sicily did the Romans besiege before moving to the naval front?"
        answer: "AGRIGENTUM"
  - tossup:
      question: "Translate the verb form <latin>vincam</latin> into English."
      answer: "I WILL WIN / LET ME WIN / MAY I WIN / I COULD WIN / I SHOULD WIN"
    boni:
      - question: "Now translate this verb form into English: <latin>vincēminī.</latin>"
        answer: "Y’ALL / YOU (ALL) WILL BE DEFEATED"
      - question: "Now translate the verb form of <latin>vincō</latin> in this sentence: <latin>Sciō mē vīcisse.</latin>"
        answer: "(I) WON // (I/TO) HAVE WON // (I) WAS WINNING // (I) HAD WON"
  - tossup:
      question: "What type of subjunctive clause is found in the following sentence: <latin>Nōnnūllī leōnēs timēbant nē līberī suī in urbem errārent</latin>."
      answer: "FEARING (CLAUSE)"
    boni:
      - question: "What type of subjunctive clause is found in the following sentence: <latin>Cum vōs nostrī amīcī sitis, tamen volumus vōs vincere in hōc certāmine</latin>."
        answer: "CONCESSIVE (<latin>CUM</latin> CLAUSE) (prompt on <latin>cum</latin> clause)"
      - question: "What use of the subjunctive is found in the following sentence: <latin>Necesse erat mihi scīre num Lūcius pervēnisset</latin>."
        answer: "INDIRECT QUESTION"
  - tossup:
      question: "According to tradition, which of the kings of Rome divided the people into five classes based on wealth and into groups of 100 men each for voting?"
      answer: "SERVIUS TULLIUS"
    boni:
      - question: "What was the name of the assembly in which these five classes voted?"
        answer: "<latin>COMITIA CENTURIĀTA</latin> / CENTURIATE ASSEMBLY"
      - question: "Who plotted with Tarquinius Superbus to overthrow Servius Tullius?"
        answer: "TULLIA (THE YOUNGER / MINOR)"
  - tossup:
      question: "In Book 6 of the <title>Aeneid</title>, what ghost flees back to the shade of her former husband, Sychaeus, after Aeneas meets her in the Underworld and tries to explain why he left her in Carthage?"
      answer: "DIDO"
    boni:
      - question: "Dido and her husband Sychaeus hailed from Tyre, a city of what seafaring people?"
        answer: "PHOENICIA(NS)"
      - question: "Name Dido’s brother, who murdered Sychaeus in order to steal his wealth and usurped the throne?"
        answer: "PYGMALION"
  - tossup:
      question: "Appropriately decline the Latin phrase <latin>quaedam callida dūx</latin> in the sentence: The people elected a certain experienced leader."
      answer: "<latin>QUANDAM CALLIDAM DUCEM</latin>"
    boni:
      - question: "Appropriately decline the Latin phrase <latin>quaedam callida dūx</latin> in the sentence: The country was saved by certain experienced leaders."
        answer: "<latin>QUIBUSDAM CALLIDĪS DUCIBUS</latin>"
      - question: "Appropriately decline the Latin phrase <latin>quaedam callida dūx</latin> in the sentence: The community’s love for a certain experienced leader carried her to a second term."
        answer: "<latin>CUIUSDAM CALLIDAE DUCIS</latin>"
  - tossup:
      question: "What deity, whom the citizens of his primary cult-center of Epidaurus called the son of Apollo and Coronis, was Machaon’s father and the primary god of healing?"
      answer: "ASCLEPIUS / AESCULAPIUS"
    boni:
      - question: "What younger brother of Machaon accompanied him to fight at Troy?"
        answer: "PODAL(E)IRIUS"
      - question: "Coronis was killed after being unfaithful to Apollo with what son of Elatus?"
        answer: "ISCHYS"
  - tossup:
      question: "From what Latin verb with what meaning do we derive “flume” and “outflux?”"
      answer: "<latin>FLUŌ / FLUERE</latin> - FLOW"
    boni:
      - question: "From what Latin verb with what meaning do we derive “defunct?”"
        answer: "<latin>FUNGOR / FUNGĪ</latin> - PERFORM"
      - question: "From what Latin verb with what meaning do we derive “fail?”"
        answer: "<latin>FALLŌ / FALLERE</latin> - TRICK / DISAPPOINT"
  - tossup:
      question: "RĒSPONDĒ LATĪNĒ: Quem cāsum expectat praepositiō “propter”?"
      answer: "ACCŪSĀTĪVUM"
    boni:
      - question: "<latin>RĒSPONDĒ LATĪNĒ: Quem cāsum expectat praepositiō “cis”?</latin>"
        answer: "ACCŪSĀTĪVUM"
      - question: "<latin>RĒSPONDĒ LATĪNĒ: Quem cāsum expectat praepositiō “secundum”?</latin>"
        answer: "ACCŪSĀTĪVUM"
  - tossup:
      question: "Italian cuisine certainly has changed since the time of the ancient Romans! Which of the following pizza toppings did the ancient Romans have: tomato, bell pepper, onion, pineapple?"
      answer: "ONION"
    boni:
      - question: "Which of the following dishes would have felt especially extravagant to an average Roman due to the type of meat used: chicken piccata, goat stew, pork salami, beef steak?"
        answer: "BEEF STEAK / PORK SALAMI"
      - question: "Now time for dessert! Which flavor of gelato could the Romans theoretically have produced, if they could keep it cold enough: rum raisin, honey walnut, mint chocolate chip, coffee."
        answer: "HONEY WALNUT"
  - tossup:
      question: "After seeing the dead fish that he had caught be revived by a patch of grass, what Boeotian man consumed that grass and became a god with the fins and tail of a fish?"
      answer: "GLAUCUS"
    boni:
      - question: "After his transformation, Glaucus fell in love with what nymph, who was put off by his fishiness and rejected him?"
        answer: "A jealous suitor of Glaucus then transformed her via a potion. SCYLLA"
      - question: "Euripides calls Glaucus the prophet or son of what sea-god?"
        answer: "NEREUS"
  - tossup:
      question: "While applying for college your friend wonders aloud to you that the University of North Dakota’s motto is quite strange. They say it has something to do with nuts and murder, but they have confused a letter. What is the motto of the University of North Dakota which translates to “Light and Law”?"
      answer: "<latin>LUX ET LEX</latin>"
    boni:
      - question: "Your bashful friend thanks you for your correction and cites the mistake as a <latin>lapsus menti</latin>--a slip of the...chin?! What more semantically correct Latin phrase has your friend confused this time?"
        answer: "<latin>LAPSUS MEMORIAE / MENTIS / LINGUAE</latin>"
      - question: "Alas! Your friend takes solace in the Senecan maxim <latin>Errare humanum est</latin>. What does this mean?"
        answer: "TO ERR IS HUMAN // EVERYONE MAKES MISTAKES"
  - tossup:
      question: "The story from the previous round about <latin>Ianus</latin> continues. Listen carefully to the following passage, which I will read twice, and answer IN LATIN the question that follows. <latin>Ūnō diē Ianus duās fēminās prope statuam saltantēs vidēbat. Erant fēlīcēs quod nēmō eās vexābat, atque telephonīs pictūrās multārum rērum capiēbant. Hae fēminae pulchram et calvam aquilam, quae in statuā constitit, nōn cōnspēxērunt. Haec avis fēminās dērīdēbat et quoque saltāre coepit.</latin> REREAD The question: <latin>Qualis aquila in statuā erat?</latin>"
      answer: "<latin>PULCHRA / CALVA</latin>"
    boni:
      - question: "<latin>Cur fēminae aquilam nōn vīdērunt?</latin>"
        answer: "<latin>SALTĀBANT / PICTŪRĀS CAPIĒBANT</latin> // <latin>AQUILA IN STATUĀ CŌNSTITIT</latin>"
      - question: "<latin>Ā quibus duae fēminae spectābantur?</latin>"
        answer: "(<latin>Ā) IANŌ ET AQUILĀ</latin>"
  - tossup:
      question: "The year 69 AD is known for having four different emperors contending for power. The whole upheaval started when what governor of Gallia Lugdunensis renounced his allegiance to Nero?"
      answer: "(C. IULIUS) VINDEX"
    boni:
      - question: "Vindex was unable to put together an effective coalition of allies and his revolt was put down by the armies of the Rhine. Who commanded these armies?"
        answer: "(L.) VERGINIUS RUFUS"
      - question: "One of the reasons Vindex had been unable to garner support was his Gallic birth. From what Gallic group had Vindex descended?"
        answer: "AQUĪTĀNI / AQUITANIANS (C&S, p. 403, col. 1)"
  - tossup:
      question: "Translate the following sentence into Latin: There is a fire in Rome."
      answer: "(<latin>EST) IGNIS RŌMAE</latin>"
    boni:
      - question: "Translate the following sentence into Latin using a gerundive: We must flee to Athens."
        answer: "<latin>NŌBĪS ATHĒNĀS FUGIENDUM EST</latin>"
      - question: "Translate the following sentence into Latin: My son will sail from Carthage to find us."
        answer: "<latin>FĪLIUS (MEUS) CARTHĀGINE NĀVIGĀBIT NŌS INVENTUM / UT NŌS INVENIAT / QUĪ NŌS INVENIAT / AD NŌS INVENIENDŌS/-ĀS/-A / NOSTRUM INVENIENDŌRUM CAUSĀ / GRĀTIĀ</latin>"
  - tossup:
      question: "What city in Aetolia had a king who omitted Artemis during an annual harvest sacrifice, leading the goddess to punish that king, Oeneus, by sending a giant boar to ravage the fields?"
      answer: "CALYDON"
    boni:
      - question: "According to Ovid’s <title>Metamorphoses</title>, what two uncles of Meleager grew angry at his decision to give the boar’s hide to Atalanta, sparking a fatal quarrel?"
        answer: "TOXEUS and PLEXIPPUS"
      - question: "Who killed Meleager by burning his life-brand in revenge for her brothers’ murder?"
        answer: "ALTHAEA"
  - tossup:
      question: "Derived from a Latin adjective meaning “many,” what Latin noun means “crowd”?"
      answer: "<latin>MULTITŪDŌ / FREQUENTIA</latin>"
    boni:
      - question: "Derived from a Latin adjective meaning “quick,” what Latin noun means “speed”?"
        answer: "<latin>CELERITĀS / VĒLŌCITĀS / RAPIDITĀS / PERNĪCITĀS</latin>"
      - question: "Derived from a Latin adjective meaning “treacherous,” what Latin noun means “treachery”?"
        answer: "<latin>PERFIDIA</latin> (It would be treacherous to take <latin>PRŌDITIŌ</latin> because it comes from the verb.)"
