tournament: "NJCL Certamen"
year: 2021
division: "Novice"
round: "Round 1"
questions:
  - tossup:
      question: "Who found a group of 13 sailors eating his cheese, ate six of them, became drunk on the wine they provided, and had his only eye poked out by their leader, Odysseus?"
      answer: "POLYPHEMUS"
    boni:
      - question: "What name did Odysseus call himself when Polyphemus inquired about his identity?"
        answer: "<emphasis>OUTIS</emphasis> / NO-ONE / NOBODY / NO MAN"
      - question: "What priest of Apollo from Ismarus provided the wine with which Odysseus got Polyphemus drunk?"
        answer: "MARO(N)"
  - tossup:
      question: "Keeping everything but the tense the same, change <latin>timēs</latin> to the future tense so that it means “you will fear.”"
      answer: "<latin>TIMĒBIS</latin>"
    boni:
      - question: "Now change <latin>timēbis</latin> to the perfect tense so that it means “you feared.”"
        answer: "<latin>TIMUISTĪ</latin>"
      - question: "Now change <latin>timuistī</latin> to the future perfect tense so that it means “you will have feared.”"
        answer: "<latin>TIMUERIS</latin>"
  - tossup:
      question: "When your mother says to you <latin>fēlīcem diem nātālem</latin>, what is she wishing you?"
      answer: "A HAPPY BIRTHDAY"
    boni:
      - question: "When she says to you <latin>bonum vesperum</latin>, what is she wishing you this time?"
        answer: "A GOOD EVENING"
      - question: "What about when she says <latin>beātum mātūtīnum</latin> to you? What is she wishing you?"
        answer: "A HAPPY / BLESSED / GOOD MORNING"
  - tossup:
      question: "On which hill did the Romans preserve ancient artifacts such as a simple wattle and daub hut and the <latin>Fīcus Rūminālis</latin>, which they believed dated back to Rome’s founding?"
      answer: "PALATINE"
    boni:
      - question: "Who supposedly built and lived in that hut, which was painstakingly preserved on the Palatine Hill until at least the Imperial Era?"
        answer: "ROMULUS (AND REMUS)"
      - question: "What kind of tree grew on the spot where Faustulus was said to have found the twins at the base of the Palatine?"
        answer: "FIG / FICUS"
  - tossup:
      question: "Which noun does <emphasis>not</emphasis> belong with the others because of location: <latin>nāsus, auris, oculus, ōs, genū?</latin>"
      answer: "<latin>GENŪ</latin>"
    boni:
      - question: "Which noun does not belong with the others because of location: <latin>harēna, pōns, sēdēs, gladiātorēs, bēstiae?</latin>"
        answer: "<latin>PŌNS</latin>"
      - question: "Which noun does not belong with the others because of its traditional color: <latin>rosa, herba, sanguis, mālum, cerasus</latin>?"
        answer: "HERBA"
  - tossup:
      question: "What hero’s only daughter, Gorgophone—whom he raised together with his Ethiopian wife, Andromeda—was so named in honor of his defeat of the Gorgon Medusa?"
      answer: "PERSEUS"
    boni:
      - question: "Perseus was himself the son of what woman, who was the only daughter of King Acrisius?"
        answer: "DANAË"
      - question: "Gorgophone was the mother of what Spartan king, who was the husband of Leda and the stepfather of Helen and Polydeuces?"
        answer: "TYNDAREÜS"
  - tossup:
      question: "What Roman king is said to have originally been named Lucumo?"
      answer: "(L.) TARQUINIUS PRISCUS"
    boni:
      - question: "What Roman king is said to have originally been named Mastarna?"
        answer: "SERVIUS TULLIUS"
      - question: "What Roman king is said to have hailed from Cures?"
        answer: "NUMA (POMPILIUS)"
  - tossup:
      question: "What use of the ablative case is found in the following sentence: <latin>Cucurrimus ad urbem magnā cum celeritāte quod multōs hostēs adoriēbantur</latin>."
      answer: "MANNER"
    boni:
      - question: "What use of the ablative case is found in the following sentence: <latin>Ego possum numerāre celerius multō quam tū</latin>."
        answer: "DEGREE OF DIFFERENCE"
      - question: "What use of the ablative case is found in the following sentence: <latin>Amīcī meī voluērunt Capuam īre tertiō diē Iānuāriī</latin>."
        answer: "TIME WHEN"
  - tossup:
      question: "What body of water received its name when a black-sailed ship led its namesake to throw himself into its waters because he thought his son Theseus had died?"
      answer: "AEGEAN SEA"
    boni:
      - question: "What two objects—though he is sometimes said to have also left a shield—did Aegeus leave under a rock for Theseus to move when he had come of age?"
        answer: "SWORD and (PAIR OF) SANDALS"
      - question: "What woman was the mother of Theseus by either Aegeus or the god Poseidon?"
        answer: "AETHRA"
  - tossup:
      question: "What grandson of Scipio Africanus and son of a man who had served as both consul and censor was elected tribune of the plebs in 133 BC and worked to distribute public lands to small landholders?"
      answer: "<latin>TIBERIUS GRACCHUS</latin>"
    boni:
      - question: "To avoid senatorial refusal, Tiberius presented his land reform bill to the <latin>Concilium Plebis</latin> without consulting the Senate, which was contrary to the common practice but not without precedent. What previous tribune of the plebs had passed a land law in 232 BC in the same way?"
        answer: "<latin>(C.) FLAMINIUS</latin>"
      - question: "The Roman Senate found an ally among the ten tribunes when he vetoed Tiberius Gracchus’ land law. Who was this tribune?"
        answer: "(<latin>M.) OCTAVIUS</latin>"
  - tossup:
      question: "Porpoise, piscine, pisciculture, and Pisces are all derived from what Latin noun with what meaning?"
      answer: "<latin>PISCIS</latin> - FISH"
    boni:
      - question: "Marmot, murine, murarium, and muscle are all derived from what Latin noun with what meaning?"
        answer: "<latin>MUS</latin> - MOUSE"
      - question: "Toreador, torero, taurine, and <latin>suovetaurilia</latin> are all derived from what Latin noun with what meaning?"
        answer: "<latin>TAURUS</latin> - BULL"
  - tossup:
      question: "Listen to the following passage, which I will read twice, and answer in English the question that follows: <latin>Ūnō diē, dea Aurōra iuvenem pulchrum, nōmine Tīthōnum, spectāvit. Statim, Aurōra iuvenem amāvit, et ad eum cucurrit. Tīthōnus Aurōram valdē amābat, sed timēbat, quod Aurōra erat dea et Tīthōnus erat vir mortālis. Aurōra Iovem rogāvit, et Iuppiter Tīthōnō vītam aeternam dedit. Sed ēheu! Iuppiter tantum vītam aeternam dedit! Mox, Tīthōnus erat senex, sed semper vīvēbat.</latin> Question: Why was Tithonus afraid?"
      answer: "AURORA WAS A GODDESS, HE WAS A MORTAL / MAN [PROMPT IF ONLY ONE PIECE IS GIVEN]"
    boni:
      - question: "Whom did Aurora ask for help?"
        answer: "JUPITER"
      - question: "Jupiter gave Tithonus eternal life, but what was wrong with his gift?"
        answer: "DIDN’T GIVE ETERNAL YOUTH [ACCEPT EQUIVALENTS]"
  - tossup:
      question: "At what time would a Roman take a “postprandial” nap?"
      answer: "AFTER LUNCH"
    boni:
      - question: "<latin>Prandium</latin> was the common name for the midday meal in the late Republic. What was the name of the original heavy midday meal of the early Romans?"
        answer: "<latin>CĒNA</latin>"
      - question: "After a hearty midday <latin>cēna</latin>, what was the name of the light supper taken in the evening?"
        answer: "<latin>VESPERNA</latin>"
  - tossup:
      question: "Translate the following sentence into English: <latin>āthlētae equum parō</latin>."
      answer: "I PREPARE / AM PREPARING THE ATHLETE’S HORSE / THE HORSE OF / FOR THE ATHLETE"
    boni:
      - question: "Translate the following sentence into English: <latin>caelum noctis erat pulchrum</latin>."
        answer: "THE NIGHT(’S) SKY / THE SKY OF THE NIGHT WAS PRETTY / BEAUTIFUL"
      - question: "Now translate the following sentence into Latin: I have seen the dog’s head."
        answer: "<latin>CAPUT CANIS VĪDĪ</latin>"
  - tossup:
      question: "From January of 68 AD to the end of 69, how many men were emperor?"
      answer: "FIVE"
    boni:
      - question: "What woman was married to two of them?"
        answer: "POPPAEA (SABINA)"
      - question: "Which of them was her husband before her marriage to Nero?"
        answer: "OTHO"
  - tossup:
      question: "Translate Yale’s motto: <latin>lux et veritās</latin>."
      answer: "LIGHT AND TRUTH"
    boni:
      - question: "Give the Latin for the motto of MIT."
        answer: "<latin>MĒNS ET MANUS</latin>"
      - question: "What university has the motto <latin>vōx clamantis in desertō</latin>?"
        answer: "DARTMOUTH"
  - tossup:
      question: "What god is sometimes depicted in art as riding a hippocamp, a creature with the head of a horse and the body of a fish, which represents his creation of the first horse and rule over the sea?"
      answer: "POSEIDON / NEPTUNE"
    boni:
      - question: "What horse was the offspring of Poseidon and Medusa?"
        answer: "PEGASUS"
      - question: "What other male horse was the offspring of Poseidon and Demeter?"
        answer: "ARION"
  - tossup:
      question: "What derivative of the Latin verb <latin>mūtō</latin> meaning to change, is the periodic shedding of an outer layer of skin?"
      answer: "MOLT(ING)"
    boni:
      - question: "What derivative of the Latin verb <latin>plaudō</latin> meaning to clap, describes a result, situation, or event as highly unlikely?"
        answer: "IMPLAUSIBLE"
      - question: "What derivative of the Latin verb <latin>iaciō</latin> meaning to throw, is an individual whose reactions or responses would be studied in a psychological experiment?"
        answer: "SUBJECT"
  - tossup:
      question: "Change the noun <latin>cīvēs</latin> to the ablative plural as in the phrase “with the citizens.”"
      answer: "<latin>(CUM) CĪVIBUS</latin>"
    boni:
      - question: "Change the noun <latin>iniuriae</latin> to the ablative plural as in the phrase “from injustices.”"
        answer: "<latin>(Ē / EX / Ā / AB / DĒ) INIURIĪS</latin>"
      - question: "Change the noun <latin>deae</latin> to the ablative plural as in the phrase “by the goddesses”."
        answer: "<latin>(AB) DEĀBUS</latin>"
  - tossup:
      question: "What type of animal were Maera, Orthrus, Laelaps, and the three-headed Cerberus?"
      answer: "DOG(S)"
    boni:
      - question: "What hunter caught sight of Artemis while she bathed, was transformed into a deer, and was torn apart by his own dogs?"
        answer: "ACTAEON"
      - question: "What creature was the perpetual enemy of the hound Laelaps?"
        answer: "TEUMESSIAN FOX / VIXEN"
