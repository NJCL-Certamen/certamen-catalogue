tournament: "NJCL Certamen"
year: 2022
division: "Advanced"
round: "Round 2"
questions:
  - tossup:
      question: "Who, after stealing several pears from a neighbor’s tree, delights in his crime as he relates the story from his youth both to the reader and to God in his <latin><title>Confessiōnēs</title></latin>?"
      answer: "(SAINT) AUGUSTINE"
    boni:
      - question: "Before converting to Christianity, to what dualistic philosophy originating in the Sassanian Empire did Augustine subscribe?"
        answer: "MANICHAEISM / MANICHAEAN / PHILOSOPHY OF MANI"
      - question: "After converting to Christianity, Augustine became a prominent voice of Christian doctrine. In what city did he serve as bishop from 395 until his death in 430 AD?"
        answer: "HIPPO (REGIUS)"
  - tossup:
      question: "According to some sources, when Hera became enraged at Zeus’s single-parent birth of Athena, Hera independently gave birth to what god, whom she hated and tossed out?"
      answer: "HEPHAESTUS"
    boni:
      - question: "In other versions, it was not Hephaestus that Hera bore, but what monster?"
        answer: "TYPH(A)ON / TYPHOS / TYPHOEÜS"
      - question: "During the Gigantomachy, what giant attempted to rape Hera, but was killed by Zeus’ thunderbolt and Heracles’ arrow?"
        answer: "PORPHYRION"
  - tossup:
      question: "What man destroyed the resisting cities of Florentia and Praeneste before winning a decisive battle at the Colline Gate, where he beat the supporters of Marius?"
      answer: "(L. CORNELIUS) SULLA (FELIX)"
    boni:
      - question: "What law appointed Sulla dictator for an undefined period in 82 BC?"
        answer: "<latin>LĒX VALERIA</latin>"
      - question: "To what town in Campania near Naples did Sulla retire in 80 BC, where he died two years later?"
        answer: "PUTEOLI / POZZUOLI"
  - tossup:
      question: "Put the phrase <latin>saltāns lepus</latin> in the accusative plural."
      answer: "<latin>SALTANTĒS LEPORĒS</latin>"
    boni:
      - question: "Now put the phrase <latin>versūta vulpēs</latin> in the ablative singular."
        answer: "<latin>VERSŪTĀ VULPE</latin>"
      - question: "The nouns <latin>vulpēs</latin> and <latin>lepus</latin> are called epicenes because they have what feature related to gender?"
        answer: "THEY HAVE A (SINGLE / FIXED) GENDER INDEPENDENT OF THE ANIMAL’S SEX"
  - tossup:
      question: "<latin>Respondē aut Anglicē aut Latīnē. Ubi mīlitēs plūrimās conchās iussū Caligulae collēgērunt?</latin>"
      answer: "FRANCE / GAUL / <latin>GALLIA</latin> / (THE) ENGLISH CHANNEL / DOVER STRAIT / GESORIACUM / <latin>GESORIACĪ</latin> / BOULOGNE(-SUR-MER)"
    boni:
      - question: "<latin>Respondē Anglicē aut Latīnē. Ubi erat Caesar, ut adversam superātō gurgite rīpam attigit et Hesperiae arvīs vetitīs constitit?</latin>"
        answer: "THE RUBICON / THE BANKS OF THE RUBICON (ON THE SIDE OF ROME HAVING JUST CROSSED IT) / <latin>IN RUBICŌNE / IN RĪPĀ RUBICŌNIS / CIS RUBICŌNEM</latin>"
      - question: "<latin>Respondē aut Anglicē aut Latīnē. Ubi est hic locus, ut Vergilius nōbīs nārrat? Hīc manus ob patriam pugnandō vulnera passī, / quīque sacerdōtēs castī, dum vīta manēbat, / quīque piī vātēs et Phoebō digna locūtī.</latin>"
        answer: "<latin>ELYSIUM</latin> / ELYSIAN FIELDS / UNDERWORLD"
  - tossup:
      question: "What use of the subjunctive is seen in the following sentence? <latin>Dīligentius audīvissem, sī fuissem in locō tuō.</latin>"
      answer: "(PAST) CONTRARY TO FACT CONDITIONAL / (PAST) CONTRAFACTUAL (OR EQUIVALENT)"
    boni:
      - question: "Now identify the use of the subjunctive in this sentence. <latin>Eram incertus num hunc ūsum didicissētis.</latin>"
        answer: "INDIRECT QUESTION (OR EQUIVALENT)"
      - question: "Now identify the use of the subjunctive in this sentence. <latin>Memineritis huius ūsūs, dum eī studeātis.</latin>"
        answer: "PROVISO CLAUSE / EXPRESSING A CONDITION / PROVISO (OR EQUIVALENT)"
  - tossup:
      question: "Per his request, an upright oar stuck into the ground marked the grave of what Ithacan sailor, who died after falling from Circe’s roof?"
      answer: "ELPENOR"
    boni:
      - question: "Why had Elpenor fallen off the roof?"
        answer: "HE WAS DRUNK"
      - question: "When Odysseus returned to Circe’s island, she gave him information on the dangers awaiting him. She must have been intimately familiar with which one, since she had created it according to Ovid?"
        answer: "SCYLLA"
  - tossup:
      question: "Differentiate in meaning between <latin>horridus</latin> and <latin>torridus</latin>."
      answer: "BRISTLY / SHAGGY / RUDE / WILD / HORRID and DRY / PARCHED / TORRID"
    boni:
      - question: "Differentiate in meaning between <latin>vestīgium</latin> and <latin>fastīgium</latin>."
        answer: "FOOTPRINT / TRACE / SOLE / TRACK / VESTIGE and PEDIMENT / GABLE / ROOF / SUMMIT / PEAK / SUMMIT / FASTIGIUM"
      - question: "Differentiate in meaning between <latin>possideō</latin> and <latin>porrigō</latin>."
        answer: "TO OWN / POSSESS / OCCUPY and TO STRETCH OUT / PUT FORTH / EXTEND"
  - tossup:
      question: "Put the following battles of the 2nd century BC in order from earliest to latest: Pydna, Aquae Sextiae, Cynoscephalae, Arausio."
      answer: "CYNOSCEPHALAE, PYDNA, ARAUSIO, AQUAE SEXTIAE"
    boni:
      - question: "What commander defeated the forces of Philip V at the Cynoscephalae?"
        answer: "(T. QUINCTIUS) FLAMININUS"
      - question: "What two commanders were embarrassingly defeated at Arausio?"
        answer: "(Q. SERVILIUS) CAEPIO and (CN.) MALLIUS MAXIMUS"
  - tossup:
      question: "Excluding all forms of alliteration, what literary device is exemplified by this quote from the Sibyl: <latin>Sī tē nulla movet tantae pietātis imāgō, at ramum hunc agnoscās.</latin>"
      answer: "CHIASMUS / HYPERBATON / SYNCHESIS"
    boni:
      - question: "To whom does the Sibyl deliver this line?"
        answer: "CHARON"
      - question: "Charon had expressed concern with allowing the still-living Aeneas into the Underworld and cites two examples of heroic misadventures in the Underworld. Name any of the three heroes involved in these misdeeds."
        answer: "HERCULES / THESEUS / PIRITHOÜS"
  - tossup:
      question: "Listen to the following adapted epitaph, which I will read twice, then answer the questions that follow in English: <latin>Moneō tē lectīs litterīs, nē contemnās et velīs titulum movēre, et corporī iniūriam facere.</latin> (CIL VI 36537) Q: Name one thing that the deceased warns the reader against wanting."
      answer: "MOVING HIS GRAVESTONE / TITLE / WRITING AND DESECRATING THE BODY"
    boni:
      - question: "The passage continues: <latin>Sī quis autem sibi admīserit, nōn bonō suō fēcerit, et superōs et īnferōs īrātōs habeat. Hōc lectō, merum profunde.</latin> What will happen if someone should allow himself to perform the acts from the toss up?"
        answer: "ANGERS THE GODS (ABOVE AND BELOW) / HE WILL NOT BENEFIT"
      - question: "What case and use is the word <latin>lectō</latin> in the last sentence?"
        answer: "ABLATIVE ABSOLUTE"
  - tossup:
      question: "What teenage emperor, together with his praetorian prefect, broke the Persian siege of Antioch, recovered the province of Mesopotamia, and almost captured Ctesiphon during his reign from 238-244 AD?"
      answer: "GORDIAN(US) III"
    boni:
      - question: "What was the name of this praetorian prefect, who was replaced by Philip the Arab upon his death in 243 AD?"
        answer: "(C. FURIUS SABINIUS AQUILA) TIMESITHEUS / TIMISTHEUS"
      - question: "Philip remained in the eastern part of the Roman empire before traveling to Rome in 247 AD for what event?"
        answer: "(ROME’S) 1000TH ANNIVERSARY / BIRTHDAY"
  - tossup:
      question: "Who published his work decades at a time, spanning a period of history from the 8th century BC to his own day, although over one hundred books of his <title>Ab Urbe Condītā</title> are lost?"
      answer: "LIVY / (T.) LIVIUS"
    boni:
      - question: "What term is given to the summaries of Livy’s individual books, of which we have all except for two?"
        answer: "<latin>PERIOCHAE</latin>"
      - question: "For which two books do we not have <latin>periochae</latin>?"
        answer: "136 and 137"
  - tossup:
      question: "“Find where two winds blow, and blow meets blow and woe is laid upon woe” was the cryptic location, given to the Spartans, of the bones of what mythical hero, who killed his own mother to avenge his father, Agamemnon?"
      answer: "ORESTES"
    boni:
      - question: "The Spartan Lichas eventually deciphered that the oracle referred to the tools of what profession?"
        answer: "(BLACK)SMITH"
      - question: "Orestes’ bones were critical in the Spartan capture of what Arcadian city?"
        answer: "TEGEA"
  - tossup:
      question: "What English noun, derived from a Latin verb meaning “to bind tight”, is a narrow passage of water connecting two areas of water?"
      answer: "STRAIT"
    boni:
      - question: "What English word, derived from <latin>pars</latin>, means “to put into danger of loss, harm, or failure”?"
        answer: "JEOPARDIZE"
      - question: "What English word, derived from a Latin word meaning “to found or establish”, is a candle holder attached to a wall?"
        answer: "SCONCE"
  - tossup:
      question: "In the sentence, “<latin>Scrīptōrēs carmine foedō splendida facta linunt</latin>,” replace the phrase <latin>carmine foedō</latin> with the proper forms of the noun <latin>cantus</latin> and adjective <latin>tristis</latin>."
      answer: "<latin>CANTŪ TRISTĪ</latin>"
    boni:
      - question: "Now replace that phrase with the noun <latin>nēnia</latin> and the adjective <latin>taetra</latin> keeping the case and number the same."
        answer: "<latin>NĒNIĀ TAETRĀ</latin>"
      - question: "Now replace that phrase with the noun <latin>pecten</latin> and adjective <latin>sordidum</latin> keeping the case and number the same."
        answer: "<latin>PECTINE SORDIDŌ</latin>"
  - tossup:
      question: "What silver-age author from Corduba wrote an epic about Caesar’s struggle against the Senate between 49 and 48 BC dubiously titled <title>Pharsalia</title>?"
      answer: "(M. ANNAEUS) LUCAN(US)"
    boni:
      - question: "What is the proper title for this epic, the only extant work of Lucan?"
        answer: "<title>BELLUM CĪVĪLE / DĒ BELLŌ CĪVĪLĪ</title>"
      - question: "To what pair of authors is Lucan directly related by blood?"
        answer: "THE SENECAS / SENECA THE ELDER and SENECA THE YOUNGER"
  - tossup:
      question: "What son of Elare tried to rape Leto and was therefore punished in the Underworld by being stretched out over nine acres?"
      answer: "TITYOS / TITYUS"
    boni:
      - question: "These are four depictions of mythological punishments similar to Tityos’. Identify by letter the punishment of a braggadocious musician who was defeated by Apollo."
        answer: "A (- MARSYAS)"
      - question: "Identify who is being punished in image D and by whom."
        answer: "ACTAEON - ARTEMIS / DIANA"
  - tossup:
      question: "How many people would typically fit on a single <latin>lectus</latin> in a Roman <latin>trīclīnium</latin>?"
      answer: "THREE"
    boni:
      - question: "For what type of person was the lowest seat on the middle couch reserved to conveniently speak with the host and receive urgent messages?"
        answer: "CONSUL / MOST HONORED GUEST"
      - question: "What was the term for the later style of curved couch that fit with a round table, much like the Greek letter after which it was named?"
        answer: "<latin>SIGMA</latin>"
  - tossup:
      question: "What text lingo describes a reaction that could be expressed by the Latin phrase <latin>volvens rīdensque humī</latin>? The abbreviation or translation is acceptable."
      answer: "ROFL / ROLLING ON THE FLOOR / GROUND LAUGHING / SMILING"
    boni:
      - question: "Give the two English abbreviations or their English meanings, both starting with the same first two letters, that indicate information is forthcoming and could be expressed by the Latin words <latin>nūntiandum</latin> and <latin>dēcernendum</latin>."
        answer: "TBA / (IT) MUST / TO BE ANNOUNCED and (IT) MUST / TO BE DETERMINED / TBD"
      - question: "Give the English abbreviation or its English meaning that indicates urgency and could be expressed by the Latin phrase <latin>quam prīmum</latin>."
        answer: "ASAP / AS SOON AS POSSIBLE / STAT"

