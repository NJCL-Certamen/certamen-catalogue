tournament: NJCL Certamen
year: 2022
division: Advanced
round: Round 3
questions:
  - tossup:
      question: "What city, founded by a man who received fifty young men and fifty young women as a prize for a wrestling victory, was invulnerable until the Palladium was stolen by Diomedes and Odysseus?"
      answer: "ILIUM / TROY"
    boni:
      - question: "That founder, Ilus, had a daughter Themiste, who married which of his nephews?"
        answer: "CAPYS"
      - question: "What famous hero had both Trojan and Dardanian blood, through these grandparents, Capys and Themiste?"
        answer: "AENEAS"
  - tossup:
      question: "What man acknowledged a general in Britain as Caesar to secure his rear while going east to fight Pescennius Niger, helping him win the civil wars following Pertinax’s death?"
      answer: "(L.) SEPTIMIUS SEVERUS"
    boni:
      - question: "You now have 10 seconds to examine the visual: This is a collection of coins from the Severan dynasty. Place these coins in order of reigns of the emperors depicted, from the earliest to latest."
        answer: "C-B-D-A"
      - question: "The coin marked Bonus 2 was minted for one of the powerful women of the dynasty. Who is this woman, who was the mother of the emperor on coin A?"
        answer: "JULIA MAMAEA"
  - tossup:
      question: "What gender is shared by the nouns <latin>colus, pīnus, humus, manus</latin>?"
      answer: "FEMININE"
    boni:
      - question: "Using the noun <latin>pelagus</latin>, say in Latin “the wide, blue sea.”"
        answer: "<latin>LĀTUM (ET) CAERULEUM / VENETUM PELAGUS</latin>"
      - question: "What feminine noun meaning “little left hand” became masculine when it became the name of a man?"
        answer: "<latin>SCAEVOLA</latin>"
  - tossup:
      question: "Although Suetonius famously wrote biographies on the Caesars from Julius Caesar to Domitian, he also wrote on select Latin authors. Whom does Suetonius describe in the following adapted passage? <latin>Quīdam eum captum esse existimant, et inter fīnem secundī Punicī bellī et initium tertiī nātus et mortuus est; Rōmae vīxit cum Scīpiōne Africānō et Gāiō Laeliō. Scrīpsit cōmoediās sex.</latin>"
      answer: "(P.) <latin>TERENTIUS</latin> (<latin>AFER</latin>) / TERENCE"
    boni:
      - question: "In which of Terence's comedies does the woman referred to in the title, Glycerium, never actually appear, though complications around her betrothal, pregnancy, and parentage drive the plot?"
        answer: "<title>ANDRIA</title> / <title>THE WOMAN FROM ANDROS</title>"
      - question: "What is the Latin term for the charge levied against Terence by his literary rival, Luscius of Lanuvium, who asserted that Terence's plays featured plots that simply mixed together those of previous Greek comedians?"
        answer: "<latin>CONTĀMINĀTIŌ</latin> // <latin>CONTĀMINĀRE</latin> (<latin>FĀBULĀS</latin>)"
  - tossup:
      question: "Which of the following, if any, is NOT derived from the same Latin root as the others: villain, avail, valedictorian, prevalent?"
      answer: "VILLAIN"
    boni:
      - question: "Differentiate in derivation between “villain” and “avail,” providing each Latin root and its meaning."
        answer: "<latin>VĪLLA</latin> - HOUSE, VILLA AND <latin>VALEŌ</latin> - TO BE STRONG / ABLE"
      - question: "What is the shared root and its meaning of the words “vilify” and “revile”?"
        answer: "<latin>VĪLIS</latin>, CHEAP / OF SMALL VALUE / WORTHLESS"
  - tossup:
      question: "Respondē Anglicē: Quid trībūnus plēbis fēcit, sī lēgem dissensit et id vetārī voluit?"
      answer: "VETO(ING) / SHOUT “<latin>INTERCĒDŌ</latin>”"
    boni:
      - question: "Respondē Anglicē: In quam rem, quae <latin>pulvīnus</latin> in linguā Latīnā appellātur, caput pōnis ad dormiendum, sī tū habēs?"
        answer: "PILLOW / CUSHION"
      - question: "Respondē Anglicē: Quī cibus, nōtissimus in Americā Merīdiānā, praesertim in Louisiānā, saepe consūmitur ientāculō? Factum est ā molā salsā et bene gustat cum multō caseō."
        answer: "GRITS / CORNMEAL / PORRIDGE / CREAM OF WHEAT / POLENTA / OATMEAL"
  - tossup:
      question: "What consul, standing <latin>in Senātū</latin> on the Nones of December, advocated for severe punishment for the instigators of a popular conspiracy against the Roman state in 63 BC that was led by Catiline?"
      answer: "(M. TULLIUS) CICERO"
    boni:
      - question: "Counter to Cicero’s advocacy for the death penalty, what Roman politician, whose influence was growing, instead had argued for life imprisonment?"
        answer: "(C. JULIUS) CAESAR"
      - question: "Cicero’s second and third Catilinarians were not delivered in the Senate, but to what audience?"
        answer: "<latin>AD POPULUM</latin> / (IN FRONT OF) THE PEOPLE"
  - tossup:
      question: "Translate this sentence into English: <latin>Nāvis gubernātōrī nāviganda est</latin>."
      answer: "THE CAPTAIN / HELMSMAN / STEERSMAN MUST STEER THE SHIP // THE SHIP MUST BE / IS (ABOUT) TO BE SAILED BY THE HELMSMAN / STEERSMAN / CAPTAIN"
    boni:
      - question: "Now translate this sentence: <latin>Nam scit utrum māne nāvigent</latin>."
        answer: "FOR (S)HE / THEY KNOW(S) WHETHER THEY (SHOULD / WILL) SAIL / ARE SAILING IN THE MORNING"
      - question: "And translate this sentence: <latin>Ut fāma est, māgna tempestās aequorī diūtissimē minātūra est</latin>."
        answer: "AS THE STORY / RUMOR IS / GOES, A GREAT STORM WILL / IS ABOUT / GOING TO THREATEN THE SEA FOR A VERY LONG / THE LONGEST TIME"
  - tossup:
      question: "What man, after convincing a Tegean king to join a doomed expedition by giving a lock of Medusa’s hair to Sterope, wrestled the river god Acheloüs for the hand of Deianeira?"
      answer: "HERACLES / HERCULES"
    boni:
      - question: "What name is shared by this Tegean king, who perished in that expedition alongside all but one of his sons, and an Ethiopian king who married Cassiopeia?"
        answer: "CEPHEÜS"
      - question: "Name the Tegean Cepheüs’ surviving son, who shares his name with an Arcadian king who defeated Heracles in the wrestling match at the Olympic Games?"
        answer: "ECHEMUS"
  - tossup:
      question: "Broken pottery, old bricks, volcanic ash, lime, and cement, when mixed together, created what building material that Romans used to construct walls?"
      answer: "CONCRETE / <latin>OPUS CAEMENTĪCIUM</latin>"
    boni:
      - question: "What was the distinguishing feature of walls built using the <latin>opus rēticulātum</latin> technique?"
        answer: "(CONCRETE CORE FACED WITH SQUARE STONES IN A) DIAGONAL / NET-SHAPED (PATTERN)"
      - question: "What style of wall was constructed from large squared stones held together by their own weight instead of using concrete or mortar?"
        answer: "<latin>OPUS QUADRĀTUM</latin> / ASHLAR (BLOCK / MASONRY)"
  - tossup:
      question: "What territory became the <latin>cāsus bellī</latin> for the Third Mithridatic War after the Romans claimed in 74 BC that Nicomedes IV had left them his kingdom in Asia Minor?"
      answer: "BITHYNIA"
    boni:
      - question: "Where did the Romans, led by Marcus Aurelius Cotta, engage Mithridates in a land and sea battle for the first time in that war?"
        answer: "CHALCEDON"
      - question: "Name the Roman who won brilliant victories at Cyzicus and later Tigranocerta before command was transferred to Pompey by the <latin>Lēx Manilia</latin>."
        answer: "(L. LICINIUS) LUCULLUS"
  - tossup:
      question: "Susan Schearer taught at Handley High School and then Classical Cottage School for many years. Using <latin>casa</latin> for “cottage” and the adjective <latin>arduus</latin> for “lofty”, say in Latin: “The cottage is not very lofty but very strong”."
      answer: "<latin>CASA NŌN EST ARDUISSIMA / MAXIMĒ ARDUA SED FORTISSIMA</latin>"
    boni:
      - question: "Susan’s strengths as a teacher were many and included inspiring a love of creative arts and Certamen. Using <latin>praestāns</latin> to mean “outstanding,” say in Latin “Many of her students were most outstanding in art and Certamen.”"
        answer: "<latin>MULTĪ/AE DISCIPULĪ/AE / DISCIPULŌRUM / DISCIPULĀRUM DĒ / EX DISCIPULĪS ERANT / FUĒRUNT PRAESTANTISSIMĪ/AE ARTE ET CERTĀMINE</latin>"
      - question: "Using <latin>exāmen</latin> to mean “test,” and <latin>causā</latin> say in Latin. “They also studied very diligently for the sake of completing tests.”"
        answer: "<latin>QUOQUE / ET(IAM) EXĀMINUM CŌNFICIENDŌRUM / FĪNIENDŌRUM CAUSĀ DĪLIGENTISSIMĒ / VALDĒ DĪLIGENTER STUDĒBANT / STUDUĒRUNT</latin>"
  - tossup:
      question: "Who was born near the springs of Oceanus ⁠— possibly deriving his name from the Greek word for stream, <latin>pēgē</latin> ⁠— and once created a spring from a mountain with a blow from his hoof?"
      answer: "PEGASUS"
    boni:
      - question: "On Mt. Helicon Pegasus created a spring. What was the name of this spring, which means “horse spring” in Greek?"
        answer: "HIPPOCRENE"
      - question: "What brother of Pegasus was born in the same way as Pegasus, springing from the severed neck of Medusa?"
        answer: "CHRYSAOR"
  - tossup:
      question: "<latin>Ei mihi! cūr umquam iuvenālibus ācta lacertīs / Phrixēam petiit Pelias arbor ovem?</latin> This unanswered question from Medea to Jason appears in what collection containing twenty letters from mythological subjects to their lovers?"
      answer: "(OVID’S) <title>HEROIDĒS</title>"
    boni:
      - question: "Medea is not the only woman to write a letter to Jason. What granddaughter of Bacchus wrote to Jason: <latin>certa fuī prīmō hospita fēminea pellere castra manū Lemniadēsque virō vincere nōvērunt: mīlite tam fortī vīta tuenda fuit!</latin>"
        answer: "HYPSIPYLE"
      - question: "What Trojan prince, like Jason, has two letters addressed to him among the <title>Heroidēs</title>?"
        answer: "PARIS (BY HELEN & OENONE)"
  - tossup:
      question: "Listen to the following adapted epitaph for a dog, which I will read twice, then answer the questions that follow in ENGLISH: <latin>Quam dulcis fuit ista, quam benigna, quae cum vīveret, in sinū iacēbat somnī socia semper et lectī. Ō factum male, canis, quod perīstī! Lātrārēs modo sīquis adcubāret rīvālis dominae licentiōsa.</latin>"
      answer: "SLEEP / DREAM(S) // BED / COUCH // LAP"
    boni:
      - question: "When would the dog bark?"
        answer: "WHEN SOME RIVAL SLEPT ALONGSIDE / SAT NEXT TO / LEANED UP ON / APPROACHED HER MISTRESS // WHEN SOME RIVAL SLEPT IN HER MISTRESS’ BED"
      - question: "The epitaph continues: <latin>Altum iam tenet eam sepulcrum nec saevīre potes nec īnsilīre nec blandīs mihi morsibus renīdēs.</latin> Describe two things the dog can no longer do now that she’s buried, according to this portion of the epitaph."
        answer: "TWO OF: GO WILD / BE SAVAGE; JUMP / LEAP (UP ONTO HER LAP); (GENTLY) BITE(S) / NIP(S THE AUTHOR) / SMILE / LAUGH / SHINE"
  - tossup:
      question: "Give the Latin form of the pronoun needed to render the following English sentence in Latin. “The students’ fear of us is unwarranted.”"
      answer: "<latin>NOSTRĪ</latin>"
    boni:
      - question: "Which is NOT an enclitic or suffix primarily used with pronouns (spell each): <latin>-met, -pse, -ve, -modī</latin>?"
        answer: "<latin>-VE</latin>"
      - question: "What do the enclitics <latin>-met</latin> and <latin>-pse</latin> add to the meaning of pronouns?"
        answer: "EMPHASIS / THEY INTENSIFY (THE PRONOUNS)"
  - tossup:
      question: "What Silver-Age poet who held stoic beliefs followed in the literary tradition of Lucilius by composing six satires before suddenly dying at the age of 28 in 64 AD?"
      answer: "(A.) <latin>PERSIUS</latin>"
    boni:
      - question: "Persius’ fifth satire contains a panegyric treatment of his favorite teacher. Who was this stoic educator who also taught Lucan?"
        answer: "(L. ANNAEUS) CORNUTUS"
      - question: "What cognomen is shared between Persius and another satirist of the Augustan period? The latter satirist’s works are contained in two books and named after their conversational tone."
        answer: "<latin>FLACCUS</latin>"
  - tossup:
      question: "Differentiate in meaning between <latin>imber</latin> and <latin>crēber</latin>."
      answer: "STORM / RAIN / WATER and THICK / FREQUENT / CLOSE"
    boni:
      - question: "Differentiate in meaning among <latin>iūgerum, iugum</latin>, and <latin>iēiūnus</latin>."
        answer: "ACRE, YOKE / RIDGE / MOUNTAIN, and HUNGRY / FASTING / JEJUNE"
      - question: "Differentiate in meaning between <latin>cānus</latin> and <latin>cavus</latin>."
        answer: "WHITE / GRAY / HOARY and WIDE / EXCAVATED / CONCAVE / HOLLOW"
  - tossup:
      question: "What emperor, during whose reign a commander of the Upper Rhine named Lentulus Gaetulicus conspired to install Marcus Aemilius Lepidus in 39 AD, was himself murdered in 41 AD?"
      answer: "CALIGULA’S / GAIUS’"
    boni:
      - question: "What woman, Caligula’s sister and Marcus Aemilius Lepidus’ wife, did Caligula deify as Panthea after her death?"
        answer: "(IULIA) DRUSILLA"
      - question: "Though Caligula was mocked for his fake invasion of Britain, what did he manage to build at Gesoriacum on the northern coast of France?"
        answer: "LIGHTHOUSE"
  - tossup:
      question: "According to Pausanias, at what city did a pomegranate tree grow on the tomb of Menoeceus, who sacrificed himself to defeat Adrastus’ forces and save his father, Creon?"
      answer: "THEBES"
    boni:
      - question: "Pausanias also describes a statue of what goddess outside Corinth that shows the goddess holding a pomegranate in one hand and a staff with a cuckoo on it in the other?"
        answer: "HERA"
      - question: "What wife of Orion had a name meaning “pomegranate”?"
        answer: "SIDE"
