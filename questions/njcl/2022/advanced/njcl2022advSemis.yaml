tournament: NJCL Certamen
year: 2022
division: Advanced
round: Semifinals
questions:
  - tossup:
      question: "What author drew focus to his interest in natural science as a defense against the charge that he had enchanted his wife, Pudentilla, in his <title>Apolōgia</title>?"
      answer: "APULEIUS (MADAURENSIS)"
    boni:
      - question: "Apuleius’ <latin>praenōmen</latin> is conflated with the name of the main character of his <title>Metamorphōsēs</title> who spends the majority of the book as a donkey. What is that name?"
        answer: "LUCIUS / <latin>LŪCIUS</latin>"
      - question: "What goddess ends up transforming the asinine Lucius back into a human, perhaps even into the author himself, at the end of the book?"
        answer: "ISIS (CAMPENSIS)"
  - tossup:
      question: "Shortly after a false charge by Fonteius Capito labeled him as a traitor, what man led a revolt on the lower Rhine against legionaries of Vitellius, forming a short-lived Batavian republic?"
      answer: "(IULIUS) CIVILIS"
    boni:
      - question: "What other commander along the Rhine failed to stop Civilis from advancing to Vetera and was later lynched by troops who were still loyal to Vitellius?"
        answer: "(HORDEONIUS) FLACCUS"
      - question: "In 70 AD, what ally of Vespasian formed an army that Quintus Petillius Cerialis used to recover Moguntiacum, Trier, and Vetera?"
        answer: "(C. LICINIUS) MUCIANUS"
  - tossup:
      question: "What Latin word is combined with <latin>integer</latin> in a Horatian quote that denotes a blameless man, is combined with <latin>aqua</latin> in a euphemistic term for alcohol, and is the <latin>v.</latin> in the abbreviation <latin>c.v.</latin>?"
      answer: "<latin>VĪTA / VĪTAE</latin>"
    boni:
      - question: "What four-word quotation from Horace’s <title>Odes</title> literally means “I have erected a monument more lasting than bronze”?"
        answer: "<latin>“EXĒGĪ MONUMENTUM AERE PERENNIUS”</latin>"
      - question: "An idiomatic phrase from Horace refers to the “good old days” with the name of what consul of 42 BC?"
        answer: "(L. MUNATIUS) PLANCUS"
  - tossup:
      question: "What name in mythology is shared by an Argive king who advised Polyneices on enlisting the help of Amphiaraüs, a Cypriot man whose death caused a woman’s calcification, and a daughter of Ligdus transformed into a man on the eve of their wedding?"
      answer: "IPHIS"
    boni:
      - question: "The first Iphis mentioned in the toss-up may have had a personal investment in the success of the Seven Against Thebes. Which of the seven was his son-in-law?"
        answer: "CAPANEÜS"
      - question: "In Ovid’s <latin><title>Metamorphōsēs</title></latin>, who recounts the tale of the Cypriot Iphis whose death caused Anaxarete to turn to stone?"
        answer: "VERTUMNUS / VORTUMNUS"
  - tossup:
      question: "Give the two Latin words, a verb and a pronoun, that are at the root of “rendezvous”."
      answer: "<latin>(RED)DŌ</latin> and <latin>TŪ / VŌS</latin>"
    boni:
      - question: "Based on its Latin derivation, how many years have passed if an establishment is celebrating its sesquicentennial anniversary?"
        answer: "150"
      - question: "Using your knowledge of Latin derivatives, what can you conclude about a species of lichen that is “saxicolous”?"
        answer: "IT INHABITS / GROWS / LIVES ON ROCKS"
  - tossup:
      question: "Abandoned by her abducted mother when she was just nine years old, what woman was raised by her aunt Clytemnestra before being promised in marriage to two different men by her thoughtless father, Menelaüs?"
      answer: "HERMIONE"
    boni:
      - question: "Name both of the individuals to whom Menelaüs promised Hermione’s hand in marriage."
        answer: "ORESTES and NEOPTOLEMUS / PYRRHUS"
      - question: "What son of Orestes and Hermione tried but failed to defend the Peloponnese against the invading Heraclids?"
        answer: "TISAMENUS"
  - tossup:
      question: "Aided by his wife Valeria in obtaining reinforcements after a defeat near Carrhae, what Caesar was able to capture Nisibis and Ctesiphon a year later in 298 AD?"
      answer: "GALERIUS"
    boni:
      - question: "Diocletian joined Galerius in the east after defeating the revolt of Domitius Domitianus and Aurelius Achilleus with an eight-month siege of what city?"
        answer: "ALEXANDRIA"
      - question: "What Persian king took advantage of the fact that Diocletian was occupied in Egypt to overrun Armenia and invade Syria?"
        answer: "NARSES / NARSEH / NARSEUS"
  - tossup:
      question: "Susan Schearer loves to travel, not just to conventions, but also around the world to classical sites. Using <latin>austrālis</latin> for “southern” and remembering that <latin>Tonstrīx</latin> means “Schearer,” Say in Latin: “Schearer and her husband were returning rather often to southern France.”"
      answer: "<latin>TONSTRĪX ET MARĪTUS / VIR (SUUS) AD / IN GALLIAM / FRANCIAM AUSTRĀLEM SAEPIUS REDĪ(Ē)BANT/ REVENIĒBANT</latin>"
    boni:
      - question: "Now, using <latin>mantica</latin> for “travel-bag,” say in Latin, “If only I had gone with her and carried her travel-bag.”"
        answer: "<latin>(O SĪ / UTINAM) CUM EĀ I(V)ISSEM ET MANTICAM (EIUS) PORTA(VI)SSEM / TULISSEM</latin>"
      - question: "Now say in Latin using a relative clause of purpose: “I would have helped her bring more pictures home to show her students.”"
        answer: "<latin>(AD)IUVISSEM EAM FERRE / PORTĀRE PLŪRĒS PICTŪRĀS / PLŪS PICTŪRĀRUM DOMUM QUĀS DISCIPULĪS (EIUS) (DĒ)MŌNSTRĀRET / OSTENDERET</latin>"
  - tossup:
      question: "What Latin author wrote a hexameter poem on weather signs from which Vergil borrowed, translated Apollonius of Rhodes’ <title>Argonautica</title> into Latin, and described Caesar’s campaign in Gaul in the <title>Bellum Sēquanīcum</title>?"
      answer: "(P. TERENTIUS VARRO) ATACINUS / VARRO OF ATAX"
    boni:
      - question: "Which leader of the <latin>Suēbī</latin> is heavily featured in Varro Atacinus’ account of Caesar’s campaign?"
        answer: "ARIOVISTUS"
      - question: "What was the name of Varro Atacinus’ lover, to whom he dedicated a series of elegiac poems?"
        answer: "LEUCADIA"
  - tossup:
      question: "Listen to the following adapted epitaph, which I will read twice, then answer the questions that follow in LATIN: <latin>Hīc iacet Optātus, īnfāns pietātis nōbilis, cui precor ut cinerēs sint līlia sintque rōsae, terraque, quae māter nunc est, sibi sit levis, ōrō. Namque vīta puerī fuit gravis nūllīs. Ergō quia parentēs miserī possunt praestāre, hoc sepulchrum cōnstituēre nātō suō.</latin> (CIL 9.3184). Q: <latin>Quālis īnfāns fuit Optātus?</latin>"
      answer: "<latin>(PIETĀTIS) NŌBILIS / PIUS / MORTUUS</latin>"
    boni:
      - question: "<latin>Cūr māter ōrat ut terra sit levis īnfāntī?</latin>"
        answer: "<latin>NAM / QUOD VĪTA PUERĪ FUIT GRAVIS NŪLLĪS</latin>"
      - question: "<latin>Quō mūnere parentēs post mortem Optātī fungī possunt?</latin>"
        answer: "<latin>SEPULCHRUM (NĀTŌ SUŌ) CŌNSTITUĒRE / CŌNSTITUĒRUNT</latin>"
  - tossup:
      question: "After subduing the neighboring Trinovantes in Essex, what ruler of the area north of the River Thames met an invasion in 54 BC that the forces of Julius Caesar launched against Britain?"
      answer: "CASSIVELAUNUS / CASSIBELANUS / CASWALLAWN"
    boni:
      - question: "Cassivelaunus’ nation, the Catuvellauni, were conquered a century later and settled in what city as their capital, which Boudicca brutally sacked and is today called St. Albans?"
        answer: "VERULAMIUM"
      - question: "In 53 BC, what leader of the Eburones defeated a legion-and-a-half of Romans near Liège much in the style of the Battle of Caudine Forks?"
        answer: "AMBIORIX"
  - tossup:
      question: "What man’s death led Pronoüs and Agenor to go to the Arcadian king Agapenor and sell their sister, Arsinoë, although she was still in mourning for her husband?"
      answer: "ALCMAEON"
    boni:
      - question: "Perhaps Alcmaeon should more properly be called her ex-husband, since he had already married what daughter of the river Acheloüs?"
        answer: "CALLIRRHOË"
      - question: "Callirrhoë bore Alcmaeon what two sons, who grew to manhood overnight by the will of Zeus so that they might avenge their father’s murder?"
        answer: "ACARNAN and AMPHOTERUS"
  - tossup:
      question: "You have 10 seconds to examine the visual: <latin>Dīc mihi quae ex hīs persōnīs avāritiā afflicta sit?</latin>"
      answer: "F"
    boni:
      - question: "<latin>Quae ex reliquīs persōnīs consumpsisset aliquid amārum, oculīs clausīs et sine lacrimīs?</latin>"
        answer: "A"
      - question: "<latin>Quae ex reliquīs persōnīs aegritūdine afflicta est?</latin>"
        answer: "B"
  - tossup:
      question: "What is the name for a verbal noun which appears only in the accusative and ablative cases in the 4th declension, such as in the phrases <latin>mīrābilē vīsū</latin> and <latin>contendērunt vīsum</latin>?"
      answer: "SUPINE"
    boni:
      - question: "In Statius’ <title>Thebaid</title>, Parthenopaeus is referred to as “<latin>trux Atalantiadēs</latin>”, which refers to him by using a name of his mother. What is the name for this type of noun?"
        answer: "MATRONYM(IC)"
      - question: "Petronius’ use of the word <latin>apoculāmus</latin>, meaning “we rush off,” in his <title>Satyricon</title> and Horace’s use of <latin>dēproeliantīs</latin> in <title>Ode</title> 1.9 are both examples of what linguistic phenomenon, described by a Greek phrase, that refers to the only attested use of a word in the language or an author’s corpus?"
        answer: "<title>HAPAX (LEGOMENON)</title>"
  - tossup:
      question: "Who speaks the following lines, which I will read as prose, and to whom are they addressed in Book 1 of the <title>Aeneid</title>? <latin>Solvite corde metum, Teucrī, sēclūdite cūrās. Rēs dūra et rēgnī novitās mē tālia cōgunt mōlīrī, et lātē fīnis cūstōde tuērī.</latin>"
      answer: "DIDO to TROJANS / ILIONEUS"
    boni:
      - question: "Who speaks the following lines, which I will read as prose, and to whom are they addressed in Book 1 of the <title>Aeneid</title>? <latin>Nāte deā, quae nunc animō sententia surgit? Omnia tūta vidēs, classem sociōsque receptōs.</latin>"
        answer: "ACHATES to AENEAS"
      - question: "Who speaks the following lines, which I will read as prose, and to whom are they addressed in Book 4 of the <title>Aeneid</title>? <latin>vāde age, nāte, vocā Zephyrōs et lābere pennīs Dardaniumque ducem, Tyriā Karthāgine quī nunc exspectat fātīsque datās nōn respicit urbēs…</latin>"
        answer: "JUPITER to MERCURY"
  - tossup:
      question: "<latin>Respondē Anglicē. Quae fēmina, quod crēdidit sē vestem melius texere quam deam, mūtāta est in arāneam</latin>?"
      answer: "ARACHNE"
    boni:
      - question: "<latin>Respondē Anglicē. Quis crēdēbat sē tībiā canere posse dulcius quam deum sōlis?</latin>"
        answer: "PAN / MARSYAS"
      - question: "<latin>Respondē Anglicē. Quis ad montem Olympum volāre in equō volucrī temptābat, sed ad terram cecidit?</latin>"
        answer: "BELLEROPHON(TES) / HIPPONOÜS"
  - tossup:
      question: "Which of the following regions was not located in Asia Minor: Pamphylia, Paphlagonia, Pannonia, Phrygia?"
      answer: "PANNONIA"
    boni:
      - question: "Which of the remaining regions — Pamphylia, Paphlagonia, and Phrygia — did not border the coast and stood on Asia Minor’s central plateau during the Late Republic and Early Empire?"
        answer: "PHRYGIA"
      - question: "Which of the following islands was located farthest from the coast of Asia Minor: Lesbos, Cythera, Rhodes, Samos, Cos?"
        answer: "CYTHERA"
  - tossup:
      question: "What son of Portheus undoubtedly did nothing to boost the confidence of his already nervous comrades when he jumped from the Trojan Horse and died on impact?"
      answer: "ECHION"
    boni:
      - question: "Earlier that day, what man nearly sent the whole thing off the rails by being fooled by Helen imitating his wife’s voice and would have called out in reply if Odysseus had not clapped a hand on his mouth?"
        answer: "ANTICLUS"
      - question: "What man, tasked with choosing the men to be in the horse, was probably regretting picking these two after these incidents?"
        answer: "EP(E)IUS"
  - tossup:
      question: "The interjections <latin>em, ei,</latin> and <latin>vae</latin> often precede what noun case in Latin, as seen in such expressions as <latin>vae victīs</latin> and <latin>ei mihi</latin>?"
      answer: "DATIVE"
    boni:
      - question: "Which of these Latin phrases conveys a meaning closest to <latin>mihi</latin> as it is being used in the following sentence: <latin>Tū semper eris mihi optimus auctor — mēcum, apud mē, quam mē, cōram mē</latin>."
        answer: "<latin>APUD MĒ</latin>"
      - question: "Give the case and reason of <latin>rīvōque fluentī</latin> in the following sentence from Vergil’s <title>Eclogues</title>: <latin>Fer cinerēs, Amaryllī, forās rīvōque fluentī transque caput iace, nec respexerīs.</latin>"
        answer: "DATIVE OF DIRECTION / MOTION"
  - tossup:
      question: "What author followed a now-lost <title>Large Epitome</title> to rehash a 37-book work called <title>Peri Physeos</title>, which the Greek philosopher Epicurus used to explain his views on nature?"
      answer: "(T.) LUCRETIUS (CARUS)"
    boni:
      - question: "To what deity does Lucretius dedicate his didactic poem?"
        answer: "VENUS (GENETRIX)"
      - question: "What Latin word does Lucretius use to refer to the unpredictable “swerve” of atoms in the universe?"
        answer: "<latin>CLĪNĀMEN</latin>"
