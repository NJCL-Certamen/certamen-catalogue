tournament: NJCL Certamen
year: 2022
division: Intermediate
round: Round 1
questions:
  - tossup:
      question: "What Gallic leader threatened the town of Clusium and later won a battle at Allia River before sacking Rome in 390 BC?"
      answer: "BRENNUS"
    boni:
      - question: "What city, which had previously hosted Tarquinius Superbus after he fled from Rome, gave refuge to the Vestal Virgins during Brennus’ occupation?"
        answer: "CAERE"
      - question: "What conqueror of Veii and so-called “second founder of Rome” was said to have saved Rome from Brennus after a seven-month occupation?"
        answer: "(M. FURIUS) CAMILLUS"
  - tossup:
      question: "Who was given several prods and nudges to travel to the Peloponnese by the disguised Athena to seek news of his father, who had been absent for 20 years from his home of Ithaca?"
      answer: "TELEMACHUS"
    boni:
      - question: "Name a person in whose form Athena speaks to Telemachus in order to encourage him."
        answer: "MENTOR / MENTES"
      - question: "Name one of the kings that Telemachus visited in the Peloponnese."
        answer: "NESTOR / MENELAÜS"
  - tossup:
      question: "Which of the following nouns cannot be the same case as the others: <latin>bōbus, sermōne, marī, porticuum, gaudiīs</latin>?"
      answer: "<latin>PORTICUUM</latin>"
    boni:
      - question: "Of the same list of nouns, <latin>bōbus, sermōne, marī, porticuum,</latin> and <latin>gaudiīs</latin>, which two are neuter?"
        answer: "<latin>MARĪ</latin> AND <latin>GAUDIĪS</latin>"
      - question: "Of the same list of nouns, <latin>bōbus, sermōne, marī, porticuum,</latin> and <latin>gaudiīs</latin>, name all the forms that can appear in two cases."
        answer: "<latin>BŌBUS</latin>, <latin>MARĪ</latin>, <latin>GAUDIĪS</latin>"
  - tossup:
      question: "The Romans used products from what plant to fertilize crops, bind perfumes, fuel lamps, clean bodies, and flavor food?"
      answer: "OLIVE (TREE) / <latin>OLEA</latin> / <latin>OLĪVA</latin>"
    boni:
      - question: "What was the Latin name for the unappetizing and watery first pressings of olives?"
        answer: "<latin>AMURCA</latin>"
      - question: "What was the name for the style of jar with a pointed bottom commonly used to store and transport olive oil, wine, and other staple foods?"
        answer: "<latin>AMPHORA</latin>"
  - tossup:
      question: "From what Latin verb with what meaning do we ultimately derive “exhortation”?"
      answer: "<latin>HORTOR</latin> - TO URGE, ENCOURAGE, INCITE, CHEER"
    boni:
      - question: "From what Latin noun with what meaning do we ultimately derive “redundant”?"
        answer: "<latin>UNDA</latin> - WAVE, BILLOW"
      - question: "From what Latin verb with what meaning do we ultimately derive “obsession”?"
        answer: "<latin>SEDEŌ</latin> - TO SIT"
  - tossup:
      question: "Differentiate in meaning between <latin>noceō</latin> and <latin>nōscō</latin>."
      answer: "HARM / HURT and LEARN / KNOW / DISCERN / BECOME ACQUAINTED WITH"
    boni:
      - question: "Differentiate in meaning between <latin>gemō</latin> and <latin>gerō</latin>."
        answer: "SIGH / GROAN / LAMENT and BEAR / WEAR / WAGE / CARRY / MANAGE / HANDLE / DO"
      - question: "Differentiate in meaning between <latin>sanō</latin> and <latin>sonō</latin>."
        answer: "HEAL / CURE and MAKE A NOISE / (RE)SOUND"
  - tossup:
      question: "Who were punished in the Underworld for mass homicide with the meaningless task of fetching water in leaky buckets?"
      answer: "THE DANAÏDS"
    boni:
      - question: "Which of the Danaïds avoided this punishment by sparing her husband Lynceus?"
        answer: "HYPERM(N)ESTRA"
      - question: "Which other Danaïd was raped by Poseidon and bore Nauplius?"
        answer: "AMYMONE"
  - tossup:
      question: "Respondē aut Anglicē aut Latīnē: <latin>Quis est māter mātris tuae?</latin>"
      answer: "<latin>AVIA</latin> (TUA) / YOUR GRANDMOTHER"
    boni:
      - question: "Respondē aut Anglicē aut Latīnē: <latin>Quī sunt līberī līberōrum tuōrum?</latin>"
        answer: "<latin>NEPŌS (TUUS / TUA) / NEPŌTĒS (TUĪ / TUAE)</latin> / YOUR GRANDCHILD(REN)"
      - question: "Respondē Latīnē: <latin>Quis est fēmina quae crīnēs prō pecūniā secat?</latin>"
        answer: "<latin>TONSTRĪX</latin> / <latin>ORNĀTRĪX</latin>"
  - tossup:
      question: "What <latin>novus homō</latin>’s achievements include the tribunate of 232 BC, the consulship of 223 BC, and the censorship of 220 BC, during which he built a road from Rome to Ariminum?"
      answer: "(C.) FLAMINIUS"
    boni:
      - question: "At what battle in 217 BC did Flaminius lose his life in battle against Hannibal?"
        answer: "(LAKE) TRASIMENE"
      - question: "What road ran parallel to the <latin>Via Flaminia</latin> on the coast from Tuscany to Pisae?"
        answer: "<latin>VIA AURĒLIA</latin>"
  - tossup:
      question: "Give the correct present-tense form of <latin>possum</latin> for the following Latin sentence: <latin>Piscēs per aquam natāre optimē [BLANK].</latin>"
      answer: "<latin>POSSUNT</latin>"
    boni:
      - question: "Give the correct imperfect-tense form of the verb <latin>possum</latin> for this sentence: <latin>Neptūnus, rēx mārium, nōn [BLANK] ventōrum potīrī.</latin>"
        answer: "<latin>POTERAT</latin>"
      - question: "Give the correct present-tense form of the verb <latin>pāreō</latin> for this sentence: <latin>“Ecce,” inquit Neptūnus ventīs, “vōs [BLANK] mihi debētis.”</latin>"
        answer: "<latin>PARĒRE</latin>"
  - tossup:
      question: "Who fathered one daughter, Macaria, and many, many sons, including Tlepolemus, Telephus, Aventinus, and Hyllus during his adventures, most of which began when he murdered people in fits of madness or otherwise abused the strength advantage that he had over others?"
      answer: "HERACLES / HERCULES"
    boni:
      - question: "Whom did Heracles wrestle in an attempt to make up for his thoughtless behavior at the house of Admetus?"
        answer: "THANATOS / DEATH"
      - question: "Whom did Heracles throw from the walls of Tiryns after he asked Heracles about some mares Heracles had stolen?"
        answer: "IPHITUS"
  - tossup:
      question: "What modern country encompasses the territory that Romans at the time of Augustus would have called Achaea?"
      answer: "GREECE"
    boni:
      - question: "What region to the northeast of Achaea covered a large part of the Balkan peninsula and was governed as a Roman province from Thessalonica starting in 146 BC?"
        answer: "MACEDONIA"
      - question: "What region to the immediate northwest of Achaea became its own province under later emperors and comprises parts of modern Greece and Albania?"
        answer: "EPIRUS"
  - tossup:
      question: "What use of the ablative case is seen in this sentence: <latin>Sī mea fīlia domum ante duodecimam hōram adveniet, timōre līberābor</latin>?"
      answer: "(ABLATIVE OF) SEPARATION"
    boni:
      - question: "What about this use of the ablative case: <latin>Sim multō laetior, sī mē vocet</latin>?"
        answer: "(ABLATIVE OF) DEGREE OF DIFFERENCE"
      - question: "What use of the dative case is seen in this sentence: <latin>Cloelia multās virginēs hostibus ēripuit</latin>?"
        answer: "(DATIVE OF) SEPARATION"
  - tossup:
      question: "Who took a break from fighting the Greeks both to scold Paris for not returning to battle and to visit his wife, Andromache, and son, Astyanax, on the walls of Troy?"
      answer: "HECTOR"
    boni:
      - question: "Whom had Paris been dueling before he was swept back to Troy by a protective Aphrodite?"
        answer: "MENELAÜS"
      - question: "What part of Hector’s gear scared his infant son when he visited him on the walls?"
        answer: "HELMET / (HORSE-HAIR) PLUME / CREST"
  - tossup:
      question: "Let’s imagine you are texting in Latin. What English text lingo might be rendered in Latin as “<latin>ut opīnor</latin>”?"
      answer: "IM(H)O / IN MY OPINION / AS I THINK"
    boni:
      - question: "What English text lingo is equivalent to the Latin statement “<latin>id erat tam longum ut nōn id lēgerim</latin>”?"
        answer: "TL(;)DR / IT WAS SO LONG THAT I DID NOT READ IT"
      - question: "What English text lingo might be rendered in Latin as “<latin>dīcas mihi</latin>”?"
        answer: "LMK / LET ME KNOW"
  - tossup:
      question: "What emperor was initially accepted by the Senate as <latin>melior pessimō princeps</latin> but later received the title <latin>optimus princeps</latin> during the course of his reign from 98 to 117 AD?"
      answer: "TRAJAN"
    boni:
      - question: "What name is given to the welfare program started by Nerva and expanded by Trajan?"
        answer: "<latin>ALIMENTA</latin>"
      - question: "What king of the Dacians who first warred against the Romans during the reign of Domitian was defeated by Trajan?"
        answer: "DECEBALUS"
  - tossup:
      question: "The pronounced influence of Semitic culture on Bronze Age Greece is symbolized by the mythological migration of what Phoenician prince to Greece when he tried but failed to find his abducted sister, Europa?"
      answer: "CADMUS"
    boni:
      - question: "What city did Cadmus found in Boeotia?"
        answer: "THEBES / CADMEIA"
      - question: "What innovation, critical to communication, is Cadmus credited with bringing to Greece?"
        answer: "ALPHABET / WRITING"
  - tossup:
      question: "Listen to the following passage, which I will read twice, then answer the questions that follow in LATIN: <latin>Īrātus sum. Fortasse nōn īrāscī dēbeō, sed īrātus sum. Quamquam omnēs sciunt amōrem inīquum et difficilem esse, mea causa iūsta est. Nam mihi nūllam epistulam tam diū mīsistī. Ūnō modō mihi placēre poteris: sī nunc plūrimās longissimāsque epistulās mīserīs.</latin>"
      answer: "<latin>OMNES</latin>"
    boni:
      - question: "<latin>Cūr īrāscitur auctor lēctiōnis?</latin>"
        answer: "<latin>NŪLLAE LITTERAE SUNT MISSAE</latin>"
      - question: "<latin>Quid lēctōrem oportet facere ut veniam petat?</latin>"
        answer: "<latin>PLŪRIMĀS / LONGISSIMĀS LITTERĀS MĪSERIT</latin>"
  - tossup:
      question: "Which two of the following five English words share a Latin root: mural, moral, marine, muscle, maritime?"
      answer: "MARINE and MARITIME"
    boni:
      - question: "What other noun, with what meaning, lies at the root of “moral”?"
        answer: "<latin>MŌS</latin> - CUSTOM"
      - question: "What other noun, with what meaning, lies at the root of “mural”?"
        answer: "<latin>MŪRUS</latin> - WALL"
  - tossup:
      question: "What item of clothing is described in the <title>Lexicon Recentis Latīnitātis</title> as <latin>brevissimae brācae</latin>?"
      answer: "SHORTS / CAPRI PANTS"
    boni:
      - question: "Give the letter for what the <title>Lexicon Recentis Latīnitātis</title> describes as <latin>pilamalleus minūtus</latin>."
        answer: "D"
      - question: "Give the letter for what the <title>Lexicon Recentis Latīnitātis</title> describes as <latin>autocinētum locīs inīquīs aptum</latin>."
        answer: "A"
        