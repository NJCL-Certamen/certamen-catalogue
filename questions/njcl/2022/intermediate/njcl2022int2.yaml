tournament: NJCL Certamen
year: 2022
division: Intermediate
round: Round 2
questions:
  - tossup:
      question: What king of Corinth founded the Isthmian games when he discovered the body of his nephew Melicertes but was still punished in the Underworld by having to push a boulder up a hill eternally?
      answer: SISYPHUS
    boni:
      - question: Sisyphus told the river Asopus that Zeus had abducted what woman, Asopus’ daughter?
        answer: AEGINA
      - question: What brother of Xuthus and Dorus was the father of both Sisyphus and Melicertes’ father, Athamas?
        answer: AEOLUS
  - tossup:
      question: What small temple located off the <latin>Forum Rōmānum</latin> had a pair of gates that were symbolically opened in times of war and closed during peace?
      answer: (TEMPLE OF) JANUS
    boni:
      - question: What temple, located on the Capitoline Hill, was associated with the minting of Roman currency?
        answer: (TEMPLE OF) JUNO MONETA
      - question: Where in Rome was a temple built to Aesculapius after one of the healing god’s sacred snakes swam there?
        answer: TIBER ISLAND / <latin>ĪNSULA TIBERĪNA</latin>
  - tossup:
      question: Which of the following words, if any, is NOT derived from the same Latin root as the others: incision, cascade, occident, cadenza?
      answer: INCISION
    boni:
      - question: Which Latin verb is at the root of “incision”?
        answer: <latin>CAEDŌ</latin> / <latin>INCĪDŌ</latin> - CUT
      - question: Which of the following words, if any, is NOT derived from the same Latin root as others: maleficent, dismal, malady, maladroit?
        answer: ALL FROM THE SAME ROOT
  - tossup:
      question: Translate the subordinate verb in this sentence into Latin: We believe that our teacher will be kind.
      answer: <latin>FUTŪRUM / FUTŪRAM (ESSE) / FORE</latin>
    boni:
      - question: Translate the subordinate verb in this sentence into Latin: We believe that our teacher was kind.
        answer: <latin>FUISSE</latin>
      - question: Translate the subordinate verb in this sentence into Latin: We believed that our teacher had been kind.
        answer: <latin>FUISSE</latin>
  - tossup:
      question: "Listen to the following passage, which I will read twice, then answer the questions that follow in ENGLISH: <latin>Diū nōn librum in manūs, nōn stilum sūmpsī; diū nesciō quid sit ōtium, quid quiēs, quid dēnique illud iners, iūcundum tamen nihil agere, nihil esse.</latin> Q: What hasn’t the author done in a long time?"
      answer: HELD A BOOK / PEN (IN HIS HANDS) // KNOW / HAVE LEISURE
    boni:
      - question: "The passage continues: <latin>tam multa mē negōtia amīcōrum nec Rōmā sēcēdere nec litterīs studēre patiuntur. Nūlla enim studia tantī sunt, ut amīcitiae officium neglegātur.</latin> Why is the author so busy?"
        answer: (THE MANY AFFAIRS / BUSINESS OF HIS) FRIENDS (PREVENT HIM FROM LEAVING ROME OR WRITING)
      - question: The author’s final admonition states that no endeavors are so worthwhile that what may be neglected?
        answer: (THE DUTY OF) FRIENDSHIP / FRIENDS
  - tossup:
      question: Who killed Tyrrhus’ pet deer with his arrows in Book 7 of the <title>Aeneid</title> and had earlier participated in a hunt near Carthage alongside his father, Aeneas?
      answer: ASCANIUS / <latin>IÜLUS</latin>
    boni:
      - question: In the <title>Aeneid</title>, what deity impersonated Ascanius in Carthage?
        answer: CUPID
      - question: What city did Ascanius later found in Italy?
        answer: ALBA (LONGA)
  - tossup:
      question: While journeying from Edessa to Carrhae to worship at the Temple of the Moon, what emperor was killed while urinating on the roadside — a deserved death given he had ordered the death of his younger brother, who had been made co-ruler by their father, Septimius Severus?
      answer: (M. AURELIUS ANTONINUS) CARACALLA
    boni:
      - question: What was the name of Caracalla’s brother, whom he had killed in 212 AD?
        answer: (P. SEPTIMIUS) GETA
      - question: Popular with the military like his father, Caracalla raised the soldiers’ pay from 400 to 600 of what type of silver coin?
        answer: <latin>DĒNĀRIUS</latin> / <latin>DĒNĀRIĪ</latin>
  - tossup:
      question: "Note to players: A description is acceptable. <latin>Coepī</latin>, <latin>odī</latin>, and <latin>meminī</latin> are all what type of verb?"
      answer: DEFECTIVE / LACKS PRESENT SYSTEM (OR EQUIVALENT)
    boni:
      - question: "<latin>Volitō</latin>, <latin>saltō</latin>, and <latin>captō</latin> are all what type of verb? A description is acceptable."
        answer: FREQUENTATIVE / ITERATIVE / INTENSIVE / INDICATE REPEATED / FORCED ACTION (OR EQUIVALENT)
      - question: "<latin>Adipiscor</latin>, <latin>īrascor</latin>, and <latin>senescō</latin> are all what type of verb? A description is acceptable."
        answer: INCEPTIVE / INCHOATIVE / INDICATE START OF AN ACTION (OR EQUIVALENT)
  - tossup:
      question: "Please give the English for the motto of Ecuador: <latin>prō deō, patriā, et libertāte</latin>."
      answer: FOR GOD, HOMELAND, AND FREEDOM (ACCEPT ANY VALID TRANSLATION)
    boni:
      - question: "Please give the English for the motto of Belize: <latin>sub umbrā flōreō</latin>."
        answer: I FLOURISH UNDER THE SHADE (ACCEPT ANY VALID TRANSLATION)
      - question: "Please give the English for the motto of São Paulo: <latin>nōn dūcor, dūcō</latin>."
        answer: I AM NOT LED, I LEAD (ACCEPT ANY VALID TRANSLATION)
  - tossup:
      question: What festival began on December 17 and celebrated the harvest god who supposedly ruled Italy during a golden age?
      answer: <latin>SATURNALIA</latin>
    boni:
      - question: "Take a moment to look over these Emoji descriptions of Roman holidays and festivals. Which letter best represents <latin>Lemūria</latin>?"
        answer: A
      - question: Which holiday is best represented by letter B?
        answer: <latin>LUPERCĀLIA</latin>
  - tossup:
      question: "Distinguish in meaning between <latin>diēs</latin> and <latin>dīvus</latin>."
      answer: DAY and DIVINE / GOD
    boni:
      - question: "Distinguish in meaning between the locations <latin>focus</latin> and <latin>fossa</latin>."
        answer: HEARTH and DITCH
      - question: "Distinguish in meaning between the military terms <latin>obses</latin> and <latin>obsidiō</latin>."
        answer: HOSTAGE and SIEGE
  - tossup:
      question: What god learned a lesson as old as time the hard way: you shouldn’t throw the discus with your young male lover when that lover has recently spurned one of the winds for you, since the winds can make a discus go wherever they want?
      answer: APOLLO
    boni:
      - question: Who was this son of Amyclas whom Apollo both loved and accidentally killed with his discus?
        answer: HYACINTH(US)
      - question: Hyacinthus gave his name to the hyacinth flower, but what other man in mythology became a hyacinth after his death at Troy?
        answer: TELAMONIAN / GREAT(ER) / BIG(GER) / HUGER / SALAMINIAN AJAX
  - tossup:
      question: Respondē Anglicē. Cui cīvitātum foederātārum Americae est sententia “Labor omnia vincit”?
      answer: OKLAHOMA
    boni:
      - question: "Respondē aut Anglicē aut Latīnē. Quid signōrum <latin>Zodiacī</latin> arcum et tēlum nōminī suō simile habet?"
        answer: <latin>SAGITTĀRIUS</latin> / SAGITTARIUS
      - question: "Of the nouns <latin>carcerēs, mappae, factiōnēs, mētae, aurīgae</latin>, which is best defined by the following sentence: Hodiē caeruleus ruberque sunt colorēs hārum atque asinī elephantīque sunt animalia hārum."
        answer: <latin>FACTIŌNĒS</latin>
  - tossup:
      question: What deity was either the child of Zeus and Dione or was spawned when Uranus’ severed genitals landed in the sea?
      answer: APHRODITE
    boni:
      - question: Name one of the islands to which the Zephyrs carried Aphrodite after she arose from the foam.
        answer: CYPRUS / CYTHERA
      - question: Paphos was another location that became a center of worship for Aphrodite, where what craftsman famously prayed to her for a miracle?
        answer: PYGMALION
  - tossup:
      question: "Following Terentilius Harsa’s suggestion to codify Roman law in 462 BC, what legislation was begun by the <latin>decemvirī</latin> in 451 BC?"
      answer: (LAWS OF THE) TWELVE TABLES / <latin>DUODECIM TABULAE</latin>
    boni:
      - question: What woman was lusted after by Appius Claudius Crassus, the most prominent decemvir, and was killed by her father to protect her honor?
        answer: VERGINIA / VIRGINIA
      - question: The plebs seceded for the second time in Roman history due to their dissatisfaction with the Twelve Tables. Name either of the two consuls who ended the secession with legislation in 449 BC.
        answer: (L.) VALERIUS (POTITUS) / (L. VALERIUS) POTITUS and (M.) HORATIUS (BARBATUS) / (M. HORATIUS) BARBATUS
  - tossup:
      question: "Using <latin>prohibeō</latin>, say in Latin to more than one person: “Don’t stop me now.”"
      answer: <latin>NŌLĪTE PROHIBĒRE MĒ NUNC / IAM</latin>
    boni:
      - question: "No doubt you are a fan of No Doubt’s 90’s song “Don’t Speak.” Translate “Don’t Speak” into Latin using a deponent verb."
        answer: <latin>NŌLĪ / NŌLĪTE LOQUĪ / FĀRĪ</latin>
      - question: "A simply sublime song by Simple Minds was “Don’t You (Forget About Me).” Dropping the “you,” translate the sentence, “Don’t forget about me,” into Latin using a deponent verb."
        answer: <latin>NŌLĪ / NŌLĪTE OBLĪVĪSCĪ MEĪ / (DĒ) MĒ</latin>
  - tossup:
      question: What character in mythology gained a significant advantage once he obtained a weapon that he used to turn his rival Phineus, the tyrant Polydectes, and the Titan Atlas to stone?
      answer: PERSEUS
    boni:
      - question: What was this hard-to-counter weapon?
        answer: MEDUSA’S (PETRIFYING, DECAPITATED) HEAD
      - question: Surprisingly, most myths say that Perseus did not use Medusa’s head to defeat a sea-monster to rescue what Ethiopian princess, whom he then married despite Phineus’ objections?
        answer: ANDROMEDA
  - tossup:
      question: "Now showing at the <latin>Cinema Rōmāna</latin> is the hit movie <emphasis>Fire Island</emphasis>. What would its title in Latin be?"
      answer: <latin>INSULA IGNIS / IGNEA / FLAMMAE / FLAMMEA</latin>
    boni:
      - question: "What would be the Latin title of the movie <emphasis>Red Notice</emphasis>, which refers to an announcement asking international authorities to arrest a suspicious person?"
        answer: <latin>NUNTIUM / ĒDICTUM RUBRUM // NUNTIUS RUBER // EPISTULA RUBRA // LITTERAE RUBRAE</latin>
      - question: "Another recent movie was <emphasis>Everything, Everywhere, All At Once</emphasis>. Using <latin>tempus</latin>, say in Latin “at the same time.”"
        answer: <latin>EŌDEM / QUŌDAM TEMPORE</latin>
  - tossup:
      question: Following a victory at the Frigidus River, what Roman emperor became the last to rule a united empire, ended the Olympic games, and closed all pagan temples?
      answer: THEODOSIUS I / THE GREAT
    boni:
      - question: St. Ambrose demanded that Theodosius repent for the massacre of citizens at what city in Macedonia in 390 AD?
        answer: THESSALONICA / THESSALONIKI
      - question: What previous eastern emperor, who was killed at the Battle of Adrianople, had Theodosius succeeded in 378 AD?
        answer: VALENS
  - tossup:
      question: You may have seen a viral video in which a dandelion is dunked in water. Give both Latin nouns and their meanings from which “dandelion” is derived.
      answer: <latin>DĒNS</latin> - TOOTH, <latin>LEŌ</latin> - LION
    boni:
      - question: "A dandelion may be hydrophobic. A synonym of hydrophobic in this context might be “waterproof.” Give the Latin word at the root of “waterproof.”"
        answer: <latin>PRŌBŌ</latin> - TO PROVE / TRY / TEST // <latin>PRŌBUS</latin> - HONEST / GOOD
      - question: "Finally, many companies are afraid of commitment and, dodging the “waterproof” label, certify their products as “water-resistant.” Give both Latin words at the root of “certify.”"
        answer: <latin>CERTUS</latin> - DETERMINED / SURE, <latin>FACIŌ</latin> - TO MAKE / DO
