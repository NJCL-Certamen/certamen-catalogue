tournament: NJCL Certamen
year: 2022
division: Intermediate
round: Round Three
questions:
  - tossup:
      question: "What Latin noun, with what meaning, lies at the ultimate root of “usher,” “orifice,” and “oral?”"
      answer: "<latin>ŌS</latin>, MOUTH"
    boni:
      - question: "Which English word, IF ANY, is NOT derived from the Latin verb <latin>coquō</latin>: apricot, biscuit, concoction, precocious."
        answer: "NONE (OF THEM) / ALL COME FROM <latin>COQUŌ</latin>"
      - question: "What Latin verb, with what meaning, lies at the root of “soufflé” and “conflate”?"
        answer: "<latin>FLŌ / FLĀRE</latin>, TO BLOW"
  - tossup:
      question: "Which of the following mythological characters are not traditionally depicted with wings: Pegasus, Calliope, Iris, Celaeno, and the Theban Sphinx?"
      answer: "CALLIOPE"
    boni:
      - question: "Deino and Pemphredo were members of what group, who were shaken down for quest information by Perseus?"
        answer: "GRAEAE // GRAY SISTERS"
      - question: "Who were the parents of the Graeae, as well as the Gorgons and Ladon?"
        answer: "PHORCYS AND CETO"
  - tossup:
      question: "Recently, a big storm arose when videos were released allegedly confirming that aliens exist. Due to the dubious nature of grainy videos as evidence, many of these reports should be taken <latin>cum grānō sālis</latin>. What is the meaning of this Latin phrase?"
      answer: "WITH A GRAIN OF SALT / WITH SKEPTICISM (OR EQUIVALENT)"
    boni:
      - question: "Even seeing a UFO in person can be dangerous! Many witnesses report being abducted or otherwise affected by UFO sightings. Adapting a common Latin phrase about spending habits, warn an observer from looking up at the night sky."
        answer: "<latin>CAVEAT SPECTĀTOR / TUTOR</latin>"
      - question: "The sudden and portentous arrival of aliens would certainly be miraculous to see. What Latin phrase could one use to describe this prodigious event, originally referring to a divine being appearing in a theatrical work to suddenly rescue the hero from an inextricable dilemma?"
        answer: "<latin>DEUS EX MACHINĀ // ALIĒNUS / ALIĒNĪ EX MACHINA</latin>"
  - tossup:
      question: "Aulus Hirtius and Vibius Pansa successfully forced what man to abandon the siege of Mutina, after which he withdrew to Transalpine Gaul and sent emissaries to Octavian in hopes of reconciliation, an effort that eventually led to him being included in the Second Triumvirate?"
      answer: "(M.) ANTONIUS // (MARC) ANTONY"
    boni:
      - question: "What assassin of Caesar had Antony been besieging at Mutina, a man who shares a cognomen with one of his fellow assassins?"
        answer: "DECIMUS (IUNIUS) BRUTUS"
      - question: "After Antony’s defeat, the Senate, in an attempt to curb Octavian’s rising power, gave command of the Roman fleet to what man, a son of one of Julius Caesar’s greatest rivals?"
        answer: "SEXTUS POMPEY / POMPEIUS"
  - tossup:
      question: "According to Ovid, what god, who was notoriously harsh against people who denied his worship, turned the daughters of Minyas into bats and all but one of a crew of pirates into dolphins?"
      answer: "BACCHUS / (PATER) LIBER / LENAEUS"
    boni:
      - question: "According to Ovid, what Lydian sailor, who tried to defend Bacchus from his piratical crewmates, was the only sailor on his ship to avoid dolphindom?"
        answer: "ACOËTES"
      - question: "In his gratitude for being spared, Acoëtes would later serve as messenger to what impious Theban king, who was a nephew of Semele and a cousin of Bacchus?"
        answer: "PENTHEUS"
  - tossup:
      question: "Differentiate in meaning between the noun <latin>mūnus</latin> and the verb <latin>mūniō</latin>."
      answer: "DUTY / GIFT and FORTIFY / BUILD (A WALL) (RESPECTIVELY)"
    boni:
      - question: "Differentiate in meaning between <latin>lapis</latin> and <latin>lupus</latin>."
        answer: "STONE / ROCK / ROCKY PROTUBERANCE and WOLF"
      - question: "Differentiate in meaning between the anagrammatic words <latin>mandāre</latin> and <latin>damnāre</latin>."
        answer: "ORDER / CHARGE / ENTRUST and CONDEMN / DAMN (RESPECTIVELY)"
  - tossup:
      question: "Who defeated the Juthungi and Alemanni in Italy before heading East and achieving a victory at Antioch in 271 AD on his way to capture Zenobia?"
      answer: "AURELIAN(US)"
    boni:
      - question: "Of what ancient queendom, roughly equivalent to modern-day Syria, was Zenobia the queen?"
        answer: "PALMYRA // PALMYRENE EMPIRE"
      - question: "While serving as <latin>magister equitum</latin> for his predecessor Claudius Gothicus, Aurelian received what nickname for his harsh discipline, literally translating to “a hand towards the sword”?"
        answer: "<latin>MĀNUS AD FERRUM</latin>"
  - tossup:
      question: "Give the present tense form of <latin>volō, velle</latin> to complete this sentence: <latin>Hodiē et Aurēlia et Claudia Marcum vīsitāre</latin> [BLANK]."
      answer: "<latin>VOLUNT</latin>"
    boni:
      - question: "Give the present tense form of <latin>volō, velle</latin> to complete this sentence: <latin>Marce, quid tū facere</latin> [BLANK]."
        answer: "<latin>VĪS</latin>"
      - question: "Give the present tense form of <latin>volō, velle</latin> to complete this sentence: <latin>Dīc mihi, Marce, num tū hodiē eās vīsitāre</latin> [BLANK]."
        answer: "<latin>VELĪS</latin>"
  - tossup:
      question: "Who was so revered in Greece that several regions claimed she was born there, each assigning her a different set of parents, though all agree that she participated in the Calydonian Boar Hunt, where she was the first to wound the boar?"
      answer: "ATALANTA"
    boni:
      - question: "Whom did Atalanta marry after he defeated her through chicanery or deceit in a footrace?"
        answer: "MELANION / HIPPOMENES"
      - question: "Name any two of the attested parents of Atalanta."
        answer: "IAS(I)US / IASION; CLYMENE; SCHOEN(E)US; M(A)ENALUS"
  - tossup:
      question: "<latin>Dux hastam mīlitī dedit ut inimīcum interficeret</latin>. Quid Anglicē significat “hastam”?"
      answer: "SPEAR / JAVELIN / LANCE / PIKE / VOULGE / POINTY STICK / NAGINATA / GLAIVE / HARPOON / GUANDAO / FAUCHARD / BILL"
    boni:
      - question: "<latin>Librīs in capsā positīs, dominus ex tablīnō exiit</latin>. Quid Anglicē significat “capsa”?"
        answer: "A REPOSITORY / BOX (FOR BOOKS) / BOOKCASE / SATCHEL"
      - question: "<latin>Ignōscē mihi, pater, quia errāvī</latin>. Quid Anglicē significat “errō”?"
        answer: "MAKE A MISTAKE / WANDER / ERR / SIN"
  - tossup:
      question: "What Roman king was said to have extended the <latin>pōmērium</latin> and created the first census before being assassinated by his daughter and son-in-law?"
      answer: "SERVIUS TULLIUS"
    boni:
      - question: "What prophetic sign had been seen when Servius Tullius was a child, signifying that he was destined to rule Rome?"
        answer: "(A BURNING RING / CROWN OF) FIRE AROUND HIS HEAD"
      - question: "According to Claudius, what was the original name of Servius Tullius?"
        answer: "MASTARNA (OF VULCI)"
  - tossup:
      question: "Translate just the participle in this sentence: <latin>Prīmā lūce pīrātae nāvigātūrī sunt</latin>."
      answer: "(ARE) GOING TO SAIL / ABOUT TO SAIL / INTENDING TO SAIL / FINNA SAIL"
    boni:
      - question: "What are the tense and voice of the infinitive in this sentence? <latin>Quōmodo scītis pīrātas nōn captōs esse</latin>?"
        answer: "PERFECT PASSIVE (INFINITIVE)"
      - question: "Translate the last two words of this sentence: <latin>Mox pīrātae capiendī sunt</latin>."
        answer: "HAVE TO / NEED TO / MUST BE CAPTURED"
  - tossup:
      question: "To reach what city were all of the following necessary: the aid of Telephus, the permission of Artemis, and in some cases ships borrowed from Agamemnon?"
      answer: "TROY / ILIUM"
    boni:
      - question: "Whom did Agamemnon have to sacrifice so that Artemis would allow the winds to blow the Greeks to Troy?"
        answer: "IPHIGEN(E)IA / IPHIANASSA"
      - question: "In order to continue their voyage, the Greeks were required to heal Telephus, who had been wounded by Achilles’ spear. How did the Greeks heal Telephus’ wound?"
        answer: "THEY SCRAPED RUST FROM THE SPEAR INTO THE SELFSAME WOUND"
  - tossup:
      question: "Eleven benevolent elephants are truly unruly by the car’s real rear wheel. Which adjective in that tongue twister is NOT derived from Latin?"
      answer: "ELEVEN"
    boni:
      - question: "Give the Latin noun and its meaning from which the adjective “real” is ultimately derived."
        answer: "<latin>RĒS</latin> - THING / MATTER"
      - question: "Give the Latin verb and its meaning from which “unruly” is derived."
        answer: "<latin>REGŌ</latin> - TO RULE / GUIDE / DIRECT"
  - tossup:
      question: "Listen carefully to the following passage, which I will read twice, then answer the questions that follow in ENGLISH: <latin>Illī hominēs, quī cupiunt cētera fera animālia superāre, summīs opibus ūtī dēbent, nē vītam silentiō vīvant velut bēstiae. Nam nātūra alia animālia fēcit inferiōra atque ventrī servientia. Sed nostra tōta vīs in animō et corpore sita est. Sequimur nōn sōlum animī imperium sīcut deī, sed etiam corporis servitium sīcut bēstiae.</latin>"
      answer: "N/A (Listening Question)"
    boni:
      - question: "According to the passage, what is one of the two places that are the source of mankind’s power?"
        answer: "MIND / SOUL / REASON / INTELLECT or BODY"
      - question: "According to the passage, how has nature made other animals different from humans?"
        answer: "LESSER / LOWER // THEY ARE ENSLAVED TO THEIR GULLET(S) / STOMACH(S) / BELLY / BELLIES"
      - question: "Why ought humans use the greatest resources?"
        answer: "SO THAT THEY DO NOT / TO AVOID LIVING / LEST THEY LIVE LIFE IN SILENCE (AS BEASTS DO) // TO NOT LIVE LIKE BEASTS / OTHER ANIMALS"
  - tossup:
      question: "What Latin noun — the opposite of the noun meaning “business” — literally means “leisure” or “free time”?"
      answer: "<latin>ŌTIUM / VACĀTIŌ / IMMŪNITAS</latin>"
    boni:
      - question: "What Latin indeclinable noun — the opposite of the noun meaning “wickedness,” “crime,” or “impious deed,” — means “right” or “divine law”?"
        answer: "<latin>FĀS</latin>"
      - question: "What Latin noun, when negated similarly to <latin>negōtium</latin> and <latin>nefās</latin>, produces the noun <latin>nēmō</latin>, meaning “no one”?"
        answer: "<latin>HOMŌ</latin>"
  - tossup:
      question: "What was built to establish a boundary between Caledonia and Roman Britannia by a Roman emperor in the second century AD?"
      answer: "ANTONINE / HADRIAN’S WALL"
    boni:
      - question: "<latin>Eborācum</latin>, a Roman city identified with the modern city of York, was a city quite close to Hadrian’s Wall. Which letter on the map denotes <latin>Eborācum</latin>?"
        answer: "A"
      - question: "Identify any of the other cities on the map by letter and Latin name."
        answer: "B - <latin>DĒVA</latin>; C - <latin>CAMULODŪNUM</latin>; D - <latin>GLĒVUM</latin>; E - <latin>LONDĪNIUM</latin>"
  - tossup:
      question: "At what sort of institution would you be if you and members of your <latin>familia</latin> took directions from a <latin>lanista</latin> as you fought each other with <latin>rudēs</latin> in preparation for the <latin>lūdī</latin>?"
      answer: "<latin>LŪDUS (GLADIĀTŌRIUS)</latin> / GLADIATORIAL SCHOOL"
    boni:
      - question: "What was a <latin>rudis</latin>, which was gifted to retiring gladiators as a symbol of their freedom?"
        answer: "WOODEN SWORD"
      - question: "In contrast to publicly funded <latin>lūdī</latin>, what was the term for games bankrolled by private citizens, often to gain popular favor?"
        answer: "<latin>MŪNUS / MŪNERA</latin>"
  - tossup:
      question: "I am guessing some of you have watched The Masked Singer. Say in Latin, “You all loved the queen of hearts.”"
      answer: "(VŌS OMNĒS) AMĀVISTIS / AMĀBĀTIS RĒGĪNAM <latin>CORD(I)UM / PECTORUM</latin>"
    boni:
      - question: "Now say in Latin: “I thought that the bull had sung better.”"
        answer: "<latin>PUTĀVĪ / DĒCRĒVĪ / CRĒDIDĪ TAURUM CECINISSE / CANTĀVISSE MELIUS</latin>"
      - question: "Jewel’s favorite song she performed was “La vie en rose” which means “Life in rose color.” Say in Latin: “Most pleasing to her was life in rose.”"
        answer: "<latin>IŪCUNDISSIMA/UM / GRĀTISSIMA/UM EĪ ERAT VĪTA RŌSEA / RUBĒNS / RUBRA / IN ROSĀ</latin>"
  - tossup:
      question: "For which of his labors was Heracles crossing the Libyan desert when he grew so frustrated at the heat that he threatened the sun? Rather than being punished for his temerity, Helios rewarded him by lending him a golden cup with which he sailed to Erytheia to steal some animals."
      answer: "(STEALING) GERYON’S CATTLE / TENTH LABOR"
    boni:
      - question: "Describe the unusual appearance of Geryon’s watchdog, Orthus, as Apollodorus describes."
        answer: "HE HAD TWO HEADS / WAS BICAPITAL"
      - question: "Heracles used his famous club to kill both Orthus and Geryon’s herdsman, Eurytion, but what weapon did he use to kill Geryon as Geryon pursued him?"
        answer: "HIS BOW / ARROW (DIPPED IN BLOOD OF THE HYDRA)"