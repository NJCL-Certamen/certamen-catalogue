tournament: NJCL Certamen
year: 2022
division: Intermediate
round: Finals
questions:
  - tossup:
      question: "In order to avoid the humiliation of appearing in Scipio Africanus’ triumph, what Carthaginian princess took poison given to her by Masinissa?"
      answer: "SOPHONISBA"
    boni:
      - question: "What Carthaginian commander and governor of Numidia was the father of Sophonisba?"
        answer: "HASDRUBAL (SON OF) GISGO / GISCO (PROMPT ON HASDRUBAL)"
      - question: "Hasdrubal Gisco traveled to the court of King Syphax in an attempt to secure his support for the Carthaginians. What personal friend of Scipio Africanus arrived at virtually the same time, attempting to win his support for the Romans?"
        answer: "(C.) LAELIUS"
  - tossup:
      question: "Using the verb <latin>adipiscor</latin>, say in Latin “you are obtaining.”"
      answer: "ADIPISCERIS / ADIPISCIMINĪ"
    boni:
      - question: "What form of <latin>adipiscor</latin> would you use to translate the following sentence into Latin: Aulus, if you obtained happiness, you would live a long life."
        answer: "ADIPISCERĒRIS"
      - question: "What form of <latin>adipiscor</latin> would you use to translate the following sentence into Latin: I don’t know whether you, Tullia, have obtained food for tonight’s dinner."
        answer: "ADEPTA SĪS // ADEPTĪ / AE SĪTIS"
  - tossup:
      question: "Say in Latin, “The consul was so sick that, for many days, he remained at home.”"
      answer: "CŌNSUL TAM AEGER / INVALIDUS / MORBIDUS ERAT UT DOMĪ MULTŌS DIĒS MANĒRET"
    boni:
      - question: "Now say in Latin: “The Roman priestesses were afraid that the consul was dead.”"
        answer: "SACERDŌTĒS / VATĒS RŌMĀNAE TIMĒBANT / METUĒBANT / VERĒBANTUR / TIMUĒRUNT / METUĒRUNT / VERITAE SUNT NĒ CŌNSUL MORTUUS ESSET"
      - question: "Using <latin>pōtiō, pōtiōnis</latin> for “potion,”, say in Latin: “The consul drank a potion so that he might be healed more quickly.”"
        answer: "CONSUL PŌTIŌNEM BIBĒBAT / BIBIT / HAURIĒBAT / HAUSIT QUŌ / UT (EŌ) CELERIUS SĀNĀRĒTUR / CŪRĀRĒTUR / (CON)SĀNESCERET"
  - tossup:
      question: "The lightning bolt of Zeus and the shout of Athena prevented what man from slaying <emphasis>all</emphasis> the fathers of the suitors in Book 24 of the <title>Odyssey</title>, although he had already slain one, Eupeithes?"
      answer: "LAËRTES"
    boni:
      - question: "What son of Eupeithes had been killed in the slaughter the previous day?"
        answer: "ANTINOÜS"
      - question: "What man, the father of a herdsman who was killed in the previous day’s slaughter, fought on the side of Odysseus and Laërtes?"
        answer: "DOLIUS"
  - tossup:
      question: "On what type of object would a Roman find a <latin>mālus</latin>, <latin>fūnis</latin>, <latin>rēmus</latin>, <latin>prōra</latin>, and <latin>nauta</latin>?"
      answer: "SHIP / BOAT / <latin>NĀVIS</latin>"
    boni:
      - question: "Of the words in the tossup: <latin>mālus</latin>, <latin>fūnis</latin>, <latin>rēmus</latin>, <latin>prōra</latin>, and <latin>nauta</latin>, which is best described by the following Latin sentence? <latin>Haec pars nāvis simillima arbōrī est; vēla restēsque dēpendent sīcut folia.</latin>"
        answer: "<latin>MĀLUS</latin>"
      - question: "Of the words in the tossup: <latin>mālus</latin>, <latin>fūnis</latin>, <latin>rēmus</latin>, <latin>prōra</latin>, and <latin>nauta</latin>, which is best described by the following Latin sentences? <latin>Haec pars nāvis quoque ex arbōribus facta est et nāvem trāns aquam prōpulsat.</latin>"
        answer: "<latin>RĒMUS</latin>"
  - tossup:
      question: "Given that “these bros” include Polyphontes and Maeon, what is the name of “this dude,” who was ambushed by 50 men on his way to Thebes and is also represented in the other picture as “Red-face man?”"
      answer: "TYDEUS"
    boni:
      - question: "Please identify “this fellow,” whom Tydeus has recently killed."
        answer: "MELANIPPUS"
      - question: "Please identify “this woman,” who had been considering helping Tydeus until his disgusting actions shortly after Melanippus was killed."
        answer: "ATHENA / MINERVA"
  - tossup:
      question: "Which of the following English words, if any, is not derived from the same Latin root as the others: cowardly, cauliflower, miscue, caudate."
      answer: "CAULIFLOWER"
    boni:
      - question: "Give the Latin noun and its meaning at the root of “cowardly,” “miscue,” and “caudate.”"
        answer: "<latin>CAUDA</latin>, TAIL"
      - question: "What other derivative of <latin>cauda</latin> means “a concluding musical section that is distinct from the main section”?"
        answer: "CODA"
  - tossup:
      question: "Treated by Augustus as a natural northern border to <latin>Nōricum</latin> and <latin>Pannonia</latin>, what lengthy river was crossed by Trajan as he expanded the empire into <latin>Dācia</latin>?"
      answer: "DANUBE / <latin>DĀNUVIUS</latin> / (H)ISTER"
    boni:
      - question: "What river ran along the northeastern border of <latin>Gallia</latin>, also serving as a natural barrier with the Germanic people living beyond?"
        answer: "RHINE / <latin>RHĒNUS</latin>"
      - question: "Which great river to the west of <latin>Mesopotamia</latin> served as the much contested border between the Roman and Parthian Empires for centuries?"
        answer: "<latin>EUPHRĀTES</latin> / EUPHRATES"
  - tossup:
      question: "When recognized by the spotter, perform the following command: <latin>Ūtere aut bracchiīs aut manibus tuīs ut figūram cordis faciat.</latin>"
      answer: "STUDENT SHOULD MAKE THE SHAPE OF A HEART WITH THEIR ARMS / HANDS / FINGERS"
    boni:
      - question: "Now, act out the following command: <latin>Simulantēs crocodīlōs adesse, luctāminī hōs crocodīlōs.</latin>"
        answer: "MULTIPLE STUDENTS SHOULD PRETEND TO WRESTLE CROCODILES (ON THE GROUND WHILE SEATED OR STANDING)"
      - question: "<latin>Ēheu, maximē pluit.</latin> Now, act out the following command: <latin>tegite capita vestra nē in tempestāte madescātis.</latin>"
        answer: "MULTIPLE STUDENTS SHOULD (PRETEND TO) COVER THEIR HEADS AS IF IT IS RAINING (IN A STORM)"
  - tossup:
      question: "Because he was the great-great-grandfather of Spermo, Elaïs, and Oeno, what god saved them from Agamemnon when he attempted to abduct them to support his war at Troy?"
      answer: "DIONYSUS"
    boni:
      - question: "What miraculous abilities had Dionysus given to these sisters?"
        answer: "THEY COULD PRODUCE FOOD AND DRINK / THEY COULD PRODUCE GRAIN / BREAD, OIL, AND WINE / TRANSFORM WATER INTO WINE, GRASS INTO WHEAT, BERRIES INTO OLIVES"
      - question: "As Agamemnon was attempting to force the sisters to go to Troy to help feed his army, Dionysus intervened and turned them into what?"
        answer: "(WHITE) DOVES"
  - tossup:
      question: "Which of these nouns, <latin>līmen</latin>, <latin>lūmen</latin>, <latin>flūmen</latin>, <latin>nōmen</latin>, <latin>nūmen</latin>, is being described in the following Latin sentence: <latin>Vōs estis extrā et transitūrī hoc ut vīllam intrārētis?</latin>"
      answer: "<latin>LĪMEN</latin>"
    boni:
      - question: "Which of those nouns, <latin>līmen</latin>, <latin>lūmen</latin>, <latin>flūmen</latin>, <latin>nōmen</latin>, <latin>nūmen</latin>, is being described in this Latin sentence: <latin>Horatius Cocles in hoc insiluit post Pontem Sublicium defendit?</latin>"
        answer: "<latin>FLŪMEN</latin>"
      - question: "Which of those nouns, <latin>līmen</latin>, <latin>lūmen</latin>, <latin>flūmen</latin>, <latin>nōmen</latin>, <latin>nūmen</latin>, is being described in this Latin sentence: <latin>Hoc verbum plurālī numerō saepe oculī appellātur, quod oculī refulgentēs esse videntur.</latin>"
        answer: "<latin>LŪMEN</latin>"
  - tossup:
      question: "Translate these sentences from Latin to English: <latin>Eugepae! Quamquam cotidiē pluitque tonuitque, īram Iovis superāvimus.</latin>"
      answer: "HUZZAH / HOORAY! ALTHOUGH IT’S BEEN (BOTH) RAINING AND STORMING / THUNDERING EVERY DAY / DAILY, WE HAVE SURVIVED / SURPASSED / OVERCOME THE WRATH / ANGER OF JOVE / JUPITER"
    boni:
      - question: "Translate from Latin to English: <latin>tandem nōs sole ardentī Apollōnis siccātī sumus.</latin>"
        answer: "FINALLY / AT LAST, WE HAVE BEEN / WERE DRIED (OFF) BY THE BLAZING / BURNING SUN OF APOLLO"
      - question: "Translate from Latin to English: <latin>spērāmus nōs sub lūnae lūce suāviter dormītūrōs esse.</latin>"
        answer: "WE HOPE (THAT) WE WILL SLEEP / SLUMBER SWEETLY / SOFTLY UNDER / IN THE LIGHT OF THE MOON"
  - tossup:
      question: "What tribe on the northern border of Capua did the Samnites attack in 343 BC, causing the Capuans to appeal to Rome for help in what became the First Samnite War?"
      answer: "SIDICINI"
    boni:
      - question: "What Roman commander laid siege to Naples from 327-326 BC, igniting the Second Samnite War?"
        answer: "(Q. PUBLILIUS) PHILO"
      - question: "According to Livy, the Samnites were forced to accept peace terms and end the Second Samnite War following a Roman victory at what battle of 305 BC?"
        answer: "BOVIANUM"
  - tossup:
      question: "Menelaüs dedicated what warrior’s shield in the temple of Hera in Argos, because Menelaüs had killed him after he wounded Patroclus?"
      answer: "EUPHORBUS"
    boni:
      - question: "What brother of Euphorbus unsuccessfully tried to counsel Hector to pull the Trojans behind the walls in anticipation of Achilles’ return to the battle?"
        answer: "POLYDAMAS"
      - question: "What priest of Apollo was the father of both Euphorbus and Polydamas?"
        answer: "PANTHOÜS"
  - tossup:
      question: "What was first discovered by a freedman named Milichus, who told the emperor’s secretary Epaphroditus, who alerted the emperor in 65 AD about this plot, which ultimately failed to dethrone Nero?"
      answer: "THE PISONIAN CONSPIRACY / CONSPIRACY OF (L. CALPURNIUS) PISO"
    boni:
      - question: "Antonius Natalis, in an attempt to save himself from being tortured, implicated what former advisor and tutor to Nero?"
        answer: "(L. ANNAEUS) SENECA THE YOUNGER"
      - question: "What other Roman author, Seneca’s nephew, was also implicated in the conspiracy and forced to commit suicide?"
        answer: "(M. ANNAEUS) LUCANUS / LUCAN"
  - tossup:
      question: "Listen to the following passage, which I will read twice, then answer the questions that follow in LATIN: <latin>Ībam Viā Sacrā, ut soleō, cōgitāns dē rēbus meīs. Occurrit quīdam nōtus mihi nōmine tantum, raptāque manū, “Quid agis,” ait. “Suāviter,” inquam. Cum ille sequerētur, ego, miserē discēdere quaerēns, modo ībam celerius, modo cōnsistēbam.</latin>"
      answer: "Dē quō putābat nārrātor fābulae per viam ambulāns? (DĒ) RĒBUS / SUĪS"
    boni:
      - question: "Quid dē advenā ab auctōre cognitum est?"
        answer: "(EIUS) NŌMEN (SŌLUM/TANTUM)"
      - question: "Quōmodo effugere cōnābātur nārrātor huius fābulae?"
        answer: "(MODO) ĪBAT CELERIUS / (MODO) CŌNSISTĒBAT"
  - tossup:
      question: "What man, the son of Poseidon and Europa, received a lump of earth from the god Triton and helped the Argonauts pass the Symplegades by using his ability to run on water?"
      answer: "EUPHEMUS"
    boni:
      - question: "What island did the lump of earth become when Euphemus threw it into the sea from the Argo?"
        answer: "THERA / SANTORINI / CALLISTE"
      - question: "What descendant of Euphemus emigrated from Thera to found a colony in Cyrene?"
        answer: "BATTUS"
  - tossup:
      question: "What form of the noun <latin>vulnus</latin> would be needed to translate “wound” in the following sentence: “The nature of the wound was difficult to discern”?"
      answer: "<latin>VULNERIS</latin>"
    boni:
      - question: "What form of the noun <latin>tussis</latin> would be needed to translate “cough” in the following sentence: “The antibiotics prescribed by the doctor attacked the cough”?"
        answer: "<latin>TUSSIM</latin> / <latin>TUSSEM</latin>"
      - question: "What form of the noun <latin>rete</latin> would be needed to translate “net” in this sentence: “The sailors knew that the net had been frayed by the storm”?"
        answer: "<latin>RETE</latin>"
  - tossup:
      question: "Translate into English the Latin motto of Everton F.C.: <latin>nīl satis nisi optimum</latin>."
      answer: "NOTHING (IS) ENOUGH UNLESS (IT IS) / IF NOT (IT IS) / EXCEPT THE BEST"
    boni:
      - question: "Give the Latin motto of the University of Louisiana Lafayette."
        answer: "<latin>FORTITER, FĒLĪCITER, FIDĒLITER</latin>"
      - question: "Translate the motto of the University of Miami of Ohio: <latin>prōdesse quam cōnspicī</latin>."
        answer: "TO ACCOMPLISH WITHOUT BEING CONSPICUOUS // TO BENEFIT / BE BENEFICIAL / USEFUL / GOOD (RATHER) THAN TO BE SEEN / OBSERVED / ADMIRED / SCRUTINIZED"
  - tossup:
      question: "Promoted to Augustus upon his father’s death, who governed Africa, Italy, and Illyricum before assuming control of the entire western empire in 340 AD by winning at Aquileia against his brother Constantine II?"
      answer: "CONSTANS (I)"
    boni:
      - question: "What officer of British and Frankish ancestry overthrew Constans in 350 AD?"
        answer: "MAGNENTIUS"
      - question: "What Persian king had Constantius II been fighting in the east before retreating to deal with Magnentius’ revolt in 351 AD?"
        answer: "SHAPUR II / THE GREAT"