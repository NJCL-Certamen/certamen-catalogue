tournament: NJCL Certamen
year: 2022
division: Intermediate
round: Semifinals
questions:
  - tossup:
      question: "What use of the genitive case is seen in this sentence: <latin>Parum somnī sed satis sapientiae habeō</latin>?"
      answer: "PARTITIVE / OF THE WHOLE / INDICATES THE WHOLE TO WHICH THE PART BELONGS (OR EQUIVALENT)"
    boni:
      - question: "What use of the genitive case is seen in this sentence: <latin>Nostra pātria amōre lībertātis sustinētur</latin>?"
        answer: "OBJECTIVE / SUBJECTIVE // INDICATES OBJECT OF THE IMPLIED VERB / VERBAL IDEA (OR EQUIVALENT)"
      - question: "What use of the genitive case is seen in this sentence: <latin>Amīcitia tua magnī habēbātur</latin>?"
        answer: "(INDEFINITE) VALUE / INDICATES THE AMOUNT OF VALUE / ESTEEM (OR EQUIVALENT) (PROMPT ON “DESCRIPTION” / “QUALITY”)"
  - tossup:
      question: "In various stories, what man married Aegle, the Amazonian maiden Antiope, and Phaedra, the sister of a woman he abandoned on Naxos after she had helped him kill the Minotaur?"
      answer: "THESEUS"
    boni:
      - question: "Name either of the two sons of Theseüs and Phaedra who were designated to succeed him."
        answer: "DEMOPHO(Ö)N / ACAMAS"
      - question: "What usurper seized the throne of Athens after Theseus’ death and led the Athenian contingent to Troy?"
        answer: "MENESTHEUS"
  - tossup:
      question: "What conflict began when Marcus Valerius Laevinus warned Rome against a foreign king’s aggression, and allies of Rome like Pergamum and Rhodes directly appealed for help against the imperialistic attacks of Philip V?"
      answer: "SECOND MACEDONIAN WAR"
    boni:
      - question: "Flamininus’ likeness was minted on gold coins and he became the first Roman to receive divine honors in Greece after he declared the freedom of Greece at what event after this war?"
        answer: "ISTHMIAN GAMES"
      - question: "Several years later, Philip allied with Rome in a war against which Seleucid king?"
        answer: "ANTIOCHUS III / THE GREAT / MEGAS"
  - tossup:
      question: "What two-word nominative phrase, which in the ablative contracts to form a Latin adverb for “greatly,” today refers to a large or important work of music, art, or literature?"
      answer: "<latin>MAGNUM OPUS</latin>"
    boni:
      - question: "What Latin noun, which means “insult,” derives from a prefix meaning “not” and a noun meaning “law” or “right”?"
        answer: "<latin>INIŪRIA</latin>"
      - question: "The prefix <latin>in</latin> can also mean “upon” or “onto.” What Latin noun, which means “jealousy” or “envy” comes from this meaning of <latin>in</latin> and a verb meaning “to see”?"
        answer: "<latin>INVIDIA</latin>"
  - tossup:
      question: "What group of men stopped in Nemea, where they held funeral games after the tragic death of the infant Opheltes, and then continued on their mission to restore Polyneices to the throne which his brother had withheld?"
      answer: "THE SEVEN AGAINST THEBES"
    boni:
      - question: "Opheltes was the son of which Nemean king?"
        answer: "LYCURGUS"
      - question: "Because of where Opheltes had been set down by his negligent nursemaid, victors in the Nemean games, which were established in his honor, were awarded a crown made from what vegetation?"
        answer: "CELERY / PARSLEY"
  - tossup:
      question: "Which of the following words, if any, does not belong due to derivation: meridian, journal, dismal, daily, sojourn?"
      answer: "THEY ALL COME FROM <latin>DIĒS</latin>"
    boni:
      - question: "Which of the following words, if any, does not belong due to derivation: vinegar, acetic, accretion, acrid, exacerbate?"
        answer: "ACCRETION"
      - question: "Give the Latin verb and its meaning from which accretion is derived."
        answer: "<latin>CRĒSCŌ</latin> - GROW"
  - tossup:
      question: "Considering individuals with the occupations <latin>fullō</latin>, <latin>ornātrīx</latin>, <latin>caupō</latin>, <latin>iūdex</latin>, and <latin>sacerdōs</latin>, which would be most likely to get their <latin>toga</latin> bloody while sacrificing animals?"
      answer: "<latin>SACERDŌS</latin>"
    boni:
      - question: "To which of the remaining individuals — <latin>fullō</latin>, <latin>ornātrīx</latin>, <latin>caupō</latin>, and <latin>iūdex</latin> — would the <latin>sacerdōs</latin> take their bloody <latin>toga</latin> to be cleaned by soaking it in urine?"
        answer: "<latin>FULLŌ</latin>"
      - question: "Which of the remaining individuals — <latin>ornātrīx</latin>, <latin>caupō</latin>, and <latin>iūdex</latin> — might the <latin>fullō</latin> ask to collect urine from her <latin>taberna</latin>?"
        answer: "<latin>CAUPŌ</latin>"
  - tossup:
      question: "<latin>Respondē aut Anglicē aut Latīnē aut Graecē: Dīcendō quod nōmen falsum fefellit Ulixēs cyclōpem Polyphēmum?</latin>"
      answer: "NO ONE / <latin>NĒMŌ</latin> / <latin>NĒMINEM</latin> / <latin>OUTIS</latin> / <latin>OUTIN(A)</latin>"
    boni:
      - question: "<latin>Respondē aut Anglicē aut Latīnē: Quis magnā fraude Troiānīs nārrāvit Graecōs ā lītoribus eōrum discessisse?</latin>"
        answer: "SINON"
      - question: "<latin>Respondē aut Anglicē aut Latīnē: Ut Alcīdēn dēciperet, quis bovēs caudīs in montem Aventīnum trāxit?</latin>"
        answer: "CACUS"
  - tossup:
      question: "Using the deponent verb <latin>sequor</latin>, tell one person in Latin: Follow the road!"
      answer: "<latin>SEQUERE VIAM / ITER / SĒMITAM</latin>"
    boni:
      - question: "Using a passive imperative form, command a road to be built."
        answer: "(<latin>VIA / ITER / SĒMITA</latin>,) <latin>MŪNĪRE / AEDIFICĀRE / FĪ / (CŌN)STRUERE</latin>"
      - question: "Now command those roads, “Roads, don’t be destroyed!”"
        answer: "<latin>VIAE, NŌLĪTE VASTĀRĪ / DĒLĒRĪ / RUERE (SĒ) / DĒSTRUĪ</latin>"
  - tossup:
      question: "A plague on what island drives Aeneas’ Trojans to Delos in Book 3 of the <title>Aeneid</title>, making them abandon the homes that they had taken over from Idomeneus’ subjects?"
      answer: "CRETE"
    boni:
      - question: "What was the pronouncement of the Delian oracle that Anchises interpreted to mean that they should go to Crete, the home of their ancestor, Teucer?"
        answer: "SEEK YOUR ANCIENT MOTHER (AND THERE REST)"
      - question: "Who, having manifested from effigies brought by Aeneas from burning Troy, appeared to Aeneas in a dream to say that Crete was not the ancient mother that the oracle described?"
        answer: "(PHRYGIAN DI) PENATES"
  - tossup:
      question: "Translate this sentence into English: <latin>difficillimum factū est nōmen tuum simul ambābus manibus scrībere.</latin>"
      answer: "TO WRITE / WRITING YOUR NAME WITH BOTH HANDS AT THE SAME TIME IS VERY DIFFICULT TO DO"
    boni:
      - question: "Now translate this sentence. <latin>Difficilius est pingere circulum perfectum sine aliquibus errōribus.</latin>"
        answer: "IT IS MORE DIFFICULT TO DRAW / PAINT A PERFECT CIRCLE WITHOUT ANY / SOME ERRORS / MISTAKES"
      - question: "Now translate this sentence. <latin>Difficillimum omnium tamen est cōnfitērī quandō errāverīs.</latin>"
        answer: "HOWEVER IT IS MOST DIFFICULT OF ALL / THE MOST DIFFICULT THING OF ALL IS TO ADMIT / CONFESS WHEN YOU (HAVE) MADE A MISTAKE / ERRED"
  - tossup:
      question: "What mythological figure purified Jason and Medea of the murder of Absyrtus, turned Picus into a woodpecker for resisting her advances, and turned Odysseus’ men into pigs?"
      answer: "CIRCE"
    boni:
      - question: "What was the name of the magic herb used by Circe to reverse the transformation of Odysseus’ men?"
        answer: "MOLY"
      - question: "During the Gigantomachy, a giant named Picoloüs invaded Circe’s island. Circe slew the giant, whose blood first caused moly to bloom. As giants could only be slain by mortals with divine cooperation, which god came to aid Circe in killing Picoloüs?"
        answer: "HELIOS"
  - tossup:
      question: "What tense and mood of verb is common to the Latin mottoes of the state of Kentucky, the University of Chicago, and the state of Wyoming?"
      answer: "PRESENT SUBJUNCTIVE"
    boni:
      - question: "What tense and mood of verb is common to the Latin mottoes of Johns Hopkins University and Columbia University?"
        answer: "FUTURE INDICATIVE"
      - question: "The motto of the University of Missouri is <latin>Salūs Populī</latin>, meaning “the welfare of the people.” What three Latin words are added to the end of that motto to create a quote from Cicero that serves as the motto of the state of Missouri, which translates to “the welfare of the people shall be the supreme law”?"
        answer: "(<latin>SALŪS POPULĪ</latin>) <latin>SUPRĒMA LĒX ESTŌ</latin>"
  - tossup:
      question: "What is the Latin term for the group instituted during the reign of Augustus that would handle situations like A?"
      answer: "<latin>VIGILĒS</latin>"
    boni:
      - question: "What was the Latin term for the office created during the reign of Augustus entrusted with the care of C?"
        answer: "<latin>CŪRĀTOR AQUĀRUM</latin>"
      - question: "What was the Latin term for a commissioner of equestrian rank, first appointed by Augustus, whose only responsibility was the care of B?"
        answer: "<latin>PRAEFECTUS ANNŌNAE // PRAEFECTUS RĒĪ FRŪMENTĀRIAE</latin>"
  - tossup:
      question: "Listen to the following epitaph, which I will read twice, then answer the questions that follow in ENGLISH: <latin>Cāra meīs vīxī, virgō vītam reddidī. mortua haec egō sum et sum cinis, is cinis terra est, ea est terra dea, egō sum dea, mortua nōn sum. rogō tē, hospes, nōlī ossa mea violāre.</latin>"
      answer: "DO NOT DISTURB / TOUCH / MOVE / VIOLATE MY BONES"
    boni:
      - question: "Using context clues, who or what are the <latin>meīs</latin> in the first sentence?"
        answer: "(THE DEAD GIRL’S) PARENTS / FAMILY / HOUSEHOLD (vel sim.)"
      - question: "Why does the narratrix of the epitaph claim to not be dead?"
        answer: "HER ASHES ARE THE EARTH, THE EARTH IS A GODDESS (THEREFORE THE DECEASED IS NOT DEAD)"
  - tossup:
      question: "What employee of the king of Pisa sabotaged the chariot of his employer, Oenomaüs, allowing Pelops to win the race that allowed him to marry Hippodameia?"
      answer: "MYRTILUS"
    boni:
      - question: "How did Myrtilus sabotage Oenomaüs’ chariot?"
        answer: "HE REPLACED THE (CHARIOT’S AXLE / WHEEL / BRONZE LINCH)PINS (WITH ONES MADE OF BEESWAX) // (MADE THE CHARIOT’S) WHEELS FELL OFF"
      - question: "What god was Myrtilus’ father?"
        answer: "HERMES"
  - tossup:
      question: "What emperor appointed a professional dancer as praetorian prefect, a charioteer as head of the <latin>vigilēs</latin>, and a barber as <latin>praefectus annōnae</latin> during his reign from 218-222 AD?"
      answer: "ELAGABAL(US) / HELIOGABAL(US) / (AVITUS) BASSIANUS"
    boni:
      - question: "What mother of Elegabalus was killed and thrown into the Tiber with him after they were found hiding in a latrine?"
        answer: "JULIA SOAEM(E)IAS (BASSIANA)"
      - question: "Elegabalus adopted a conical black stone as an image of his cult, which originated in what city?"
        answer: "EMESA / HOMS"
  - tossup:
      question: "What city in ancient <latin>Calābria</latin>, the south-eastern prong of Italy’s “boot”, stood at the end of the <latin>Via Appia</latin> and served as Rome’s primary port on the Adriatic?"
      answer: "<latin>BRUNDISIUM / BRINDISI</latin>"
    boni:
      - question: "What mountainous region to the south and east of <latin>Latium</latin> was home to the Oscan-speaking peoples who frequently clashed with the expanding Roman republic?"
        answer: "<latin>SAMNIUM / SANNIO</latin>"
      - question: "What Italian region to the north of <latin>Latium</latin> and east of <latin>Etrūria</latin> across the Apennines contained fertile valleys for growing crops, included the city of Perusia, and was connected to Rome by the <latin>Via Flāminia</latin>?"
        answer: "<latin>UMBRIA</latin>"
  - tossup:
      question: "Latin is a classical language. Give the Latin noun and its English meaning at the root of “classical.”"
      answer: "<latin>CLASSIS</latin> – FLEET / (PROPERTY) CLASS / LEVY / GRADE / RANK"
    boni:
      - question: "From what Latin verb, with what meaning, do we derive the English words “puny” and “naïve”?"
        answer: "<latin>NASCOR</latin> - TO BE BORN / GROW"
      - question: "Distinguish in meaning between the Latin nouns at the root of the English adjectives “literal” (spell) and “littoral” (spell)."
        answer: "(<latin>LITTERA / LITTERAE</latin>) - LETTER / LITERATURE; (<latin>LĪTUS</latin>) - SHORE"
  - tossup:
      question: "Differentiate in meaning between <latin>pictor</latin> and <latin>pistor</latin>."
      answer: "PAINTER AND BAKER / MILLER"
    boni:
      - question: "Differentiate in meaning among the enclitics <latin>-ne</latin>, <latin>-ve</latin>, and <latin>-que</latin>."
        answer: "<latin>-NE</latin> SIGNIFIES A QUESTION, <latin>-VE</latin> MEANS ‘OR’, <latin>-QUE</latin> MEANS ‘AND’"
      - question: "Differentiate in meaning between the noun <latin>nūbes</latin> and the adverb <latin>nūper</latin>."
        answer: "CLOUD / STORM / FOG / MIST and RECENTLY"