tournament: NJCL Certamen
year: 2022
division: Novice
round: Round 1
questions:
  - tossup:
      question: "Please give the meanings of the Latin ordinals <latin>prīmus</latin> and <latin>secundus</latin>."
      answer: "<latin>PRĪMUS</latin> - (THE) FIRST // <latin>SECUNDUS</latin> - (THE) SECOND / FOLLOWING / FAVORABLE / NEXT"
    boni:
      - question: "Differentiate in meaning between <latin>cum</latin> and <latin>sine</latin>."
        answer: "<latin>CUM</latin> - WITH / WHEN / SINCE / ALTHOUGH // <latin>SINE</latin> - WITHOUT"
      - question: "Differentiate in meaning between <latin>possum</latin> and <latin>faciō</latin>."
        answer: "<latin>POSSUM</latin> - TO BE ABLE / CAN // <latin>FACIŌ</latin> - TO MAKE / CONSTRUCT / DO / BUILD"
  - tossup:
      question: "<latin>Spurius</latin>, <latin>Kaesō</latin>, <latin>Mānius</latin>, <latin>Tiberius</latin>, and <latin>Lūcius</latin> are all examples of what part of a Roman citizen’s name?"
      answer: "<latin>PRAENŌMEN</latin> / <latin>PRAENŌMINA</latin>"
    boni:
      - question: "Based on its etymology, which <latin>praenōmen</latin>, abbreviated L., may have originally been given to children born when it was light outside?"
        answer: "<latin>LŪCIUS</latin> / <latin>LŪCIA</latin>"
      - question: "Based on its etymology, what other <latin>praenōmen</latin> may have originally been given to children born specifically in the morning?"
        answer: "<latin>MĀNIUS</latin> / <latin>MĀNIA</latin>"
  - tossup:
      question: "What state’s seal features two Latin mottos — “<latin>animīs opibusque parātī</latin>” and “<latin>dum spīrō, spērō</latin>”?"
      answer: "SOUTH CAROLINA"
    boni:
      - question: "Please translate the second motto from the toss-up into English: <latin>dum spīrō, spērō</latin>."
        answer: "WHILE I BREATHE, I HOPE"
      - question: "What state has the motto “<latin>nīl sine nūmine</latin>”?"
        answer: "COLORADO"
  - tossup:
      question: "Respondē aut Latīnē aut Anglicē: Quod animal vīcit Herculēs labōre prīmō?"
      answer: "LEŌNEM (NEMEĀNUM / NEMEĀ) / (NEMEAN) LION"
    boni:
      - question: "Respondē aut Latīnē aut Anglicē: Quod nōmen est canī in picturā sinistrā, quī tria capita habet?"
        answer: "CERBERUS"
      - question: "Respondē aut Latīnē aut Anglicē: Quod nōmen est hominī in picturā dextrā, qui tria corpora habet?"
        answer: "GĒRYON(ĒS) / GERYON"
  - tossup:
      question: "When recognized by the spotter, pretend to do the following action: <latin>consūme cibum quamquam nōn es in trīclīniō</latin>."
      answer: "(STUDENT SHOULD MAKE GESTURES SIMULATING EATING)"
    boni:
      - question: "Now pretend to do this action: <latin>legite librōs in tablīnō</latin>."
        answer: "(MULTIPLE STUDENTS SHOULD MAKE GESTURES SIMULATING READING BOOKS)"
      - question: "Now pretend to do this action: <latin>coquite cēnam in culīnā</latin>."
        answer: "(MULTIPLE STUDENTS SHOULD MAKE GESTURES SIMULATING COOKING)"
  - tossup:
      question: "What famous Roman had been planning a conquest of Parthia before his assassination on March 15, 44 BC?"
      answer: "(C.) JULIUS CAESAR"
    boni:
      - question: "What term did the Romans use to refer to the 15th of March due to it falling in the middle of the month?"
        answer: "IDES (OF MARCH) / <latin>ĪDŪS (MARTIAE)</latin>"
      - question: "What position did Caesar declare he would hold “for life” in 44 BC, after holding it each year since 49 BC?"
        answer: "DICTATOR / <latin>DICTĀTOR (PERPETUŌ / IN PERPETUUM)</latin>"
  - tossup:
      question: "Faced with a splitting migraine, who requested that the god Hephaestus take an axe to his head and release the young goddess trapped within?"
      answer: "ZEUS"
    boni:
      - question: "Who was this goddess, the Greek deity of arts and crafts?"
        answer: "ATHENA"
      - question: "According to other sources, what Titan helped Zeus bear Athena?"
        answer: "PROMETHEUS / METIS"
  - tossup:
      question: "Give the Latin form of “cat,” which is the 3rd declension noun <latin>fēlēs</latin>, <latin>fēlis</latin>, for this sentence. “That is a wise cat.”"
      answer: "<latin>FĒLĒS</latin>"
    boni:
      - question: "Give the correct form of <latin>fēlēs</latin> if the following sentence were in Latin. “The dog runs from the cat.”"
        answer: "<latin>FĒLE(M)</latin>"
      - question: "Give the Latin form of “cats” in this sentence: “I gave food to my cats.”"
        answer: "<latin>FĒLIBUS</latin>"
  - tossup:
      question: "Listen to the following passage in Latin, which I will read twice, then answer in English the question that follows: <latin>Ōlim īnfāns in monte Cyllēnē nātus est</latin>. <latin>Hic īnfāns erat fīlius Iovis et Māiae</latin>. <latin>Īnfāns cum mātre habitābat</latin>, <latin>sed cum patre nōn habitābat</latin>, <latin>quod Iūppiter in monte Olympō habitat</latin>. <latin>Īnfantī nōmen erat Mercurius</latin>. With whom did Mercury live?"
      answer: "MAIA / HIS MOTHER"
    boni:
      - question: "According to the passage, why didn’t Mercury live with his father?"
        answer: "BECAUSE JUPITER / HIS FATHER LIVES ON MT. OLYMPUS"
      - question: "The passage continues: <latin>Mercurius erat īnfāns mīrābilis</latin>. <latin>Hic īnfāns ambulāre</latin>, <latin>fābulās nārrāre</latin>, et <latin>canere poterat</latin>. Name one thing that Mercury was able to do, even though he was a baby."
        answer: "WALK // SING // TELL STORIES / A STORY"
  - tossup:
      question: "What emperor withdrew from Rome and conducted his reign <latin>in absentiā</latin> from the island of Capri beginning in 26 AD?"
      answer: "TIBERIUS"
    boni:
      - question: "What notorious Praetorian Prefect was left in charge of the city and began plotting to take the throne before Tiberius ordered his execution in 31 AD?"
        answer: "(L. AELIUS) SEJANUS"
      - question: "Who replaced Sejanus as Praetorian Prefect?"
        answer: "(NAEVIUS SUTORIUS) MACRO"
  - tossup:
      question: "Consider the sentence: “<latin>Rostrum tuae avis magnum est</latin>.” What case is the noun meaning “bird”?"
      answer: "GENITIVE (OF POSSESSION)"
    boni:
      - question: "What case is the noun meaning “bird” in this sentence: “<latin>Ab ave meā amātus sum</latin>”."
        answer: "ABLATIVE (OF AGENT)"
      - question: "What case is the noun meaning “bird” in this sentence? “<latin>Avī meae nōmen est Mellīta</latin>.”"
        answer: "DATIVE (OF POSSESSION)"
  - tossup:
      question: "The Phlegethon, the fields of Asphodel, and the Styx could all be found where?"
      answer: "THE UNDERWORLD / ORCUS / DIS / HADES"
    boni:
      - question: "Which river did souls drink from to forget their lives?"
        answer: "LETHE"
      - question: "Which river marked the boundary of the Underworld?"
        answer: "ACHERON / STYX"
  - tossup:
      question: "What English word derived from a Latin word for “door” is a person employed as a caretaker of a building?"
      answer: "JANITOR / PORTER"
    boni:
      - question: "What English adjective derived from two Latin words literally means “well-wishing”?"
        answer: "BENEVOLENT"
      - question: "What English adjective derived from the Latin word for “day” is used to describe animals that are active during the day?"
        answer: "DIURNAL"
  - tossup:
      question: "Into what sea, situated between Sardinia and mainland Italy, does the Tiber flow at the port of Ostia?"
      answer: "TYRRHENIAN / (<latin>MARE</latin>) <latin>TYRRHĒNUM</latin> / TYRRSĒNUM"
    boni:
      - question: "What sea lies to the east of the Italian peninsula, separating it from Dalmatia and Macedonia?"
        answer: "ADRIATIC / (<latin>MARE</latin>) <latin>ADRIĀTICUM</latin>"
      - question: "What name is given to the southern continuation of the Adriatic between the “heel” of the Italian peninsula and Greece, containing many islands such as Ithaca and Corcyra?"
        answer: "IONIAN (SEA) / (<latin>MARE</latin>) <latin>IŌNIUM</latin>"
  - tossup:
      question: "Translate into English: <latin>Sulpicia est poēta clarior</latin>."
      answer: "SULPICIA IS A RATHER / MORE / TOO / KINDA FAMOUS POET(ESS)"
    boni:
      - question: "Say in Latin: Have you read about Sulpicia?"
        answer: "<latin>LĒGISTI(S)NE DĒ SULPICIĀ?</latin>"
      - question: "Now say in Latin using the neuter noun <latin>carmen</latin> for poem: Sulpicia wrote a poem which I loved."
        answer: "<latin>SULPICIA CARMEN SCRĪPSIT / SCRĪBĒBAT QUOD (EGO) AMĀVĪ / AMĀBAM // MIHI AMĀTUM // Ā MĒ AMĀTUM</latin>"
  - tossup:
      question: "Though he was supposed to be left to die on Mount Cithaeron, who survived thanks to the kindness of some shepherds and grew up as royalty at Corinth?"
      answer: "OEDIPUS"
    boni:
      - question: "What father of Oedipus ordered his exposure?"
        answer: "LAIUS"
      - question: "Why did Laius try to kill his infant son?"
        answer: "HE HEARD A PROPHECY THAT HIS SON WOULD KILL HIM"
  - tossup:
      question: "Which of the following nouns is derived from a Latin noun meaning “star”: dedication, incident, constellation, solitude."
      answer: "CONSTELLATION"
    boni:
      - question: "Which of those same words, dedication, incident, constellation, and solitude, is derived from a word meaning “alone”?"
        answer: "SOLITUDE"
      - question: "From what verb with what meaning do we derive “incident”?"
        answer: "<latin>CADŌ</latin> – (TO) FALL"
  - tossup:
      question: "Which Roman king from the city of <latin>Curēs</latin> established the cult of Mars, the office of <latin>pontifex maximus</latin>, and other religious customs?"
      answer: "NUMA (POMPILIUS)"
    boni:
      - question: "What college of priestesses established by Numa were tasked with maintaining the sacred fire?"
        answer: "VESTAL VIRGINS // VESTAL(S)"
      - question: "According to legend, what water nymph was said to have been the advisor of Numa?"
        answer: "EGERIA"
  - tossup:
      question: "For the verb <latin>cantō</latin>, give the second person plural, imperfect active indicative — a form that means “y’all were singing”?"
      answer: "<latin>CANTĀBĀTIS</latin>"
    boni:
      - question: "Give the equivalent form for the verb <latin>claudō</latin>, meaning “y’all were closing”."
        answer: "<latin>CLAUDĒBĀTIS</latin>"
      - question: "Now give the second person plural, perfect active indicative for <latin>claudō</latin>, which means “y’all have closed”."
        answer: "<latin>CLAUSISTIS</latin>"
  - tossup:
      question: "Which half-brother of Zeus was immortal, unlike others of his kind, was entrusted with the training of many heroes, and was considered the wisest of the centaurs?"
      answer: "CH(E)IRON"
    boni:
      - question: "On what mountain did Chiron live?"
        answer: "(MOUNT) PELION"
      - question: "Chiron and the other centaurs were forced to emigrate from Pelion after their war with what tribe, who were led by their king Pirithoüs?"
        answer: "LAPITHS"