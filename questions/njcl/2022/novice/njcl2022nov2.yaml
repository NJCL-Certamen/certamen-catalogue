tournament: NJCL Certamen
year: 2022
division: Novice
round: Round 2
questions:
  - tossup:
      question: "Originally an agricultural god, which Roman deity is thought to have attained his bellicose attributes later due to the association of the farming season with war?"
      answer: "MARS"
    boni:
      - question: "With what Greek god is Mars associated?"
        answer: "ARES"
      - question: "Mars was the progenitor, or ancestor, of the Roman people via what set of twins?"
        answer: "ROMULUS AND REMUS"
  - tossup:
      question: "Listen to the following passage in Latin, which I will read twice. Then answer in English the question that follows. <latin>Ūnō diē, Mercurius clam domō exiit. Subitō, Mercurius vīdit testūdinem! “Ego,” inquit, “testūdinem habēre volō! Hanc testūdinem habēre volō!” Tum Mercurius testūdinem cēpit.</latin> The question: What type of animal did Mercury see?"
      answer: "TURTLE / TORTOISE"
    boni:
      - question: "The story continues: <latin>“Ego,” inquit, “canere volō!” Itaque Mercurius testūdinem interfēcit! Tum Mercurius ex testūdine lyram fēcit. Deinde Mercurius lyrā mūsicam fēcit, et dīxit, “Pater meus est Iuppiter, māter mea est Maia, et ego sum īnfāns mīrābilis!”</latin> According to the passage, why did Mercury kill the turtle?"
        answer: "HE WANTED TO SING / MAKE A LYRE / MAKE MUSIC"
      - question: "What is one thing that Mercury said about himself in his song?"
        answer: "HE IS AN AMAZING BABY / HIS FATHER IS JUPITER / HIS MOTHER IS MAIA"
  - tossup:
      question: "Complete the following analogy: <latin>cubiculum</latin> : <latin>vīlla</latin> :: <latin>arbor</latin> : [BLANK]."
      answer: "SILVA / ARBORETUM / HORTUS / NĀTŪRA"
    boni:
      - question: "Complete the following analogy: statue : <latin>statua</latin> :: blue : [BLANK]."
        answer: "CAERULEUS / VENETUS"
      - question: "Complete the following analogy: <latin>quattuor</latin> : <latin>quīnque</latin> :: <latin>septendecim</latin> : [BLANK]."
        answer: "DUODĒVĪGINTĪ"
  - tossup:
      question: "Which Roman saved his father’s life at the Battle of Ticinus River before campaigning against the Carthaginians in Spain and ultimately winning the Second Punic War in 202 BC?"
      answer: "(P. CORNELIUS) SCIPIO (THE FUTURE) AFRICANUS"
    boni:
      - question: "Later in 218 BC after the defeat at the Ticinus, what colleague of the elder Scipio was also defeated at the Trebia River?"
        answer: "(TI. SEMPRONIUS) LONGUS"
      - question: "What animals, including one named <latin>Surus</latin>, aided Hannibal in his war efforts against Rome?"
        answer: "ELEPHANTS"
  - tossup:
      question: "Of the forms <latin>aperītis</latin>, <latin>aperuit</latin>, <latin>aperiunt</latin>, and <latin>aperiō</latin>, which does not fit by tense?"
      answer: "APERUIT"
    boni:
      - question: "Translate <latin>aperuit</latin> into English."
        answer: "HE / SHE / IT / THEY (HAS / HAVE) OPENED"
      - question: "Make <latin>aperuit</latin> pluperfect, meaning “she had opened.”"
        answer: "APERUERAT"
  - tossup:
      question: "Which of the following English words, if any, is NOT derived from the same Latin root as the others: efficient, faith, munificence, faction?"
      answer: "FAITH"
    boni:
      - question: "What is the Latin word and its meaning at the root of efficient, munificence, and faction?"
        answer: "<latin>FACIŌ</latin> / <latin>FACERE</latin> - TO DO / MAKE / CONSTRUCT / BUILD / PRODUCE"
      - question: "What is the Latin word and its meaning at the root of faith?"
        answer: "<latin>FĪDES</latin>, TRUST / FAITH / CONFIDENCE // <latin>FĪDERE</latin>, TO TRUST / BELIEVE / RELY"
  - tossup:
      question: "The Roman woman <latin>Metella</latin> has had many identities. After what event in <latin>Metella</latin>’s life did people start calling her a <latin>mātrōna</latin> instead of a <latin>puella</latin>?"
      answer: "WEDDING / MARRIAGE"
    boni:
      - question: "Give the Latin term that the man labeled A would use to describe <latin>Metella</latin>."
        answer: "UXOR / CONIUNX / MULIER / MARĪTA"
      - question: "Give the Latin term that <latin>Metella</latin> would use to describe the person labeled C."
        answer: "AVUNCULUS / MATERTERA"
  - tossup:
      question: "What hero was provided with a ball of string that allowed him to safely navigate the Cretan labyrinth?"
      answer: "THESEUS"
    boni:
      - question: "Which Cretan princess provided Theseus this life-saving help?"
        answer: "ARIADNE / ARIADNA"
      - question: "Theseus abandoned Ariadne, perhaps on a god’s order, on what island in the Cyclades?"
        answer: "NAXOS / DIA"
  - tossup:
      question: "Which emperor — who had a successful military career against the Iazyges, Marcomanni, and Quadi — served as the last of the Five Good Emperors?"
      answer: "MARCUS AURELIUS (ANTONINUS)"
    boni:
      - question: "What philosophy did Marcus Aurelius practice and write about in a work called the <title>Meditations</title>?"
        answer: "STOIC(ISM)"
      - question: "Which infamous son of Marcus Aurelius succeeded him in 180 AD and interrupted the relative stability the empire had seen since the reign of Nerva?"
        answer: "COMMODUS"
  - tossup:
      question: "Recall that the Latin word <latin>nōmen</latin> can mean “noun.” Respondē aut Anglicē aut Latīnē: Quot casūs nōminibus sunt in linguā Latīnā?"
      answer: "SEPTEM / SEX / QUĪNQUE / 7 / 6 / 5"
    boni:
      - question: "Respondē aut Anglicē aut Latīnē: In linguā Latīnā, quot dēclīnātiōnēs nōminibus sunt?"
        answer: "QUĪNQUE / 5"
      - question: "Respondē aut Anglicē aut Latīnē: In linguā Latīnā, quot vocēs verbīs sunt?"
        answer: "DUAE / 2 (ACTĪVA et PASSĪVA)"
  - tossup:
      question: "For the verb <latin>respondeō</latin>, give the 1st person singular perfect active indicative, meaning “I have responded.”"
      answer: "RESPONDĪ"
    boni:
      - question: "Give the corresponding form of the verb <latin>discēdō</latin>, meaning “I have departed.”"
        answer: "DISCESSĪ"
      - question: "Give the corresponding form of the verb <latin>canō</latin>, meaning “I have cut.”"
        answer: "CECINĪ"
  - tossup:
      question: "Using not only his muscles but also his brain, who used the fire-breathing abilities of the Chimera for his own benefit?"
      answer: "BELLEROPHON(TES) / HIPPONOÜS"
    boni:
      - question: "How exactly did Bellerophon do this?"
        answer: "TIPPED A SPEAR WITH LEAD, WHICH MELTED UNDER THE FIRE AND POURED INTO THE CHIMERA’S THROAT"
      - question: "Bellerophon is often said to be the son of which god?"
        answer: "POSEIDON / NEPTUNE / <latin>NEPTŪNUS</latin>"
  - tossup:
      question: "The English words curule, discourse, incursion, and recurrent are all derived from what Latin verb with what meaning?"
      answer: "<latin>CURRŌ</latin> – RUN"
    boni:
      - question: "From what Latin verb, with what meaning, do the words proxy, curator and curious derive?"
        answer: "<latin>CŪRŌ</latin> – CARE (FOR)"
      - question: "What derivative of <latin>cūrō</latin> is an English adjective that means “strictly correct”?"
        answer: "ACCURATE"
  - tossup:
      question: "On what hill, located between the Circus Maximus and the Forum Romanum, were a series of imperial palaces built on the site of Romulus’ original settlement?"
      answer: "PALATINE / <latin>PALĀTIUM</latin> / (<latin>MŌNS</latin>) <latin>PALĀTĪNUS</latin>"
    boni:
      - question: "What hill stands across from the Palatine on the opposite side of the Circus Maximus?"
        answer: "AVENTINE / (<latin>MŌNS</latin>) <latin>AVENTĪNUS</latin> / <latin>AVENTĪNUM</latin>"
      - question: "What other hill overlooks the Forum Romanum and was the terminus of triumphal processions?"
        answer: "CAPITOLINE / <latin>CAPITŌLIUM</latin> / (<latin>MŌNS</latin>) <latin>CAPITŌLĪNUS</latin>"
  - tossup:
      question: "<latin>Māgna ōrātiō</latin> means “a great speech” in Latin. Change that phrase to the accusative singular."
      answer: "<latin>MĀGNAM ŌRĀTIŌNEM</latin>"
    boni:
      - question: "Now make the phrase <latin>māgna ōrātio</latin> ablative singular."
        answer: "<latin>MAGNĀ ŌRĀTIŌNE</latin>"
      - question: "Now make the phrase <latin>māgna ōrātiō</latin> comparative, meaning “a greater speech”."
        answer: "<latin>MĀIOR ŌRĀTIŌ</latin>"
  - tossup:
      question: "Until she relented and allowed Odysseus to make a raft, who planned to keep him on her island, Ogygia, for more than seven years?"
      answer: "CALYPSO"
    boni:
      - question: "Calypso ultimately relented after Zeus sent what god to order her to let Odysseus go?"
        answer: "HERMES"
      - question: "Name Calypso’s father, a Titan who became the namesake of a mountain range in northwestern Africa."
        answer: "ATLAS"
  - tossup:
      question: "Say in Latin: The messenger gave the letter to the leader."
      answer: "<latin>NŪNTIUS</latin> / ANGELUS <latin>EPISTULAM</latin> / <latin>LITTERĀS</latin> / <latin>LITTERAM</latin> <latin>DUCĪ</latin> / <latin>IMPERĀTORĪ</latin> / <latin>PRĪNCIPĪ</latin> <latin>DEDIT</latin> / <latin>DĀBAT</latin>"
    boni:
      - question: "Using <latin>soleō</latin>, say in Latin: We are accustomed to reading long books carefully."
        answer: "<latin>SOLĒMUS LEGERE DĪLIGENTER / CAUTĒ / CUM CŪRĀ LONGŌS / LĀTŌS LIBRŌS</latin>"
      - question: "Say in Latin: The citizens heard the words of the king and queen."
        answer: "<latin>CĪVĒS VERBA RĒGIS ET RĒGĪNAE AUDĪVĒRUNT / AUDIĒBANT</latin>"
  - tossup:
      question: "Shakespeare’s <title>Romeo and Juliet</title> features remarkable similarities to the story of which Babylonian couple, who were also kept apart by their families and eventually died by suicide?"
      answer: "PYRAMUS and THISBE"
    boni:
      - question: "What animal’s tracks did Pyramus see, causing him to conclude that Thisbe was dead?"
        answer: "LION(ESS)"
      - question: "What plant had its berries permanently stained by their blood?"
        answer: "MULBERRY (TREE)"
  - tossup:
      question: "At what battle in Tusculan territory was it said that the Dioscuri — Castor and Pollux — helped the Romans defeat the Latin League in 496 BC?"
      answer: "(LAKE) REGILLUS"
    boni:
      - question: "What elderly ex-king, joining with Octavius Mamilius, fought alongside the Latins at Lake Regillus after his expulsion from Rome in 509 BC?"
        answer: "TARQUINIUS SUPERBUS / TARQUIN THE PROUD"
      - question: "The Latin League was disbanded in 338 BC after the battle of Antium, when the Romans took what objects to become the Forum’s rostra?"
        answer: "SHIPS / PROWS (OF SHIPS) / RAMS (OF SHIPS) / FRONTS OF SHIPS"
  - tossup:
      question: "What meaning is shared by these two-word Latin phrases “<latin>ab ōvō</latin>” and “<latin>ab initiō</latin>”?"
      answer: "FROM THE BEGINNING / START"
    boni:
      - question: "Give the Latin form that fills in the Latin phrase “<latin>ab ōvō usque ad</latin> [BLANK]”?"
        answer: "<latin>MĀLUM</latin> / <latin>MĀLA</latin>"
      - question: "What two-word Latin phrase means “endlessly”?"
        answer: "<latin>AD INFINITUM</latin> / <latin>AD NAUSEAM</latin> / <latin>AD PERPETUITĀTEM</latin> / <latin>IN PERPETUITĀTE</latin> / <latin>SINE FINĒ</latin>"