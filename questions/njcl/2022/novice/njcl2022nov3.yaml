tournament: NJCL Certamen
year: 2022
division: Novice Division
round: Round Three
questions:
  - tossup:
      question: "In what year did the Roman empire see a plague, a fire in Rome, and the eruption of Mt. Vesuvius?"
      answer: "79 AD // 832 AUC"
    boni:
      - question: "What “darling of mankind” saw these events happen during his short reign that lasted until 81 AD?"
        answer: "TITUS"
      - question: "The popular Titus did ignite controversy among Roman nationalists when he carried on an affair with which Jewish princess?"
        answer: "BERENICE / BERENIKE"
  - tossup:
      question: "Which of the following English words, if any, is NOT derived from the same Latin root as the others: illusion, translucent, lucid, lucifer?"
      answer: "ILLUSION"
    boni:
      - question: "Which of the following English words, if any, is NOT derived from the same Latin root as the others: longevity, elongate, longitude, prolong?"
        answer: "NONE / ALL FROM THE SAME (ROOT)"
      - question: "Which of the following English words, if any, is NOT derived from the same Latin root as the others: circumference, ferrous, defer, referee?"
        answer: "FERROUS"
  - tossup:
      question: "Make the Latin adjective <latin>callidus, callida, callidum</latin> agree with the Latin noun <latin>scrīptrīx</latin>."
      answer: "CALLIDA"
    boni:
      - question: "Now, change this phrase <latin>scrīptrīx callida</latin>, to the genitive plural."
        answer: "SCRĪPTRĪCUM CALLIDĀRUM"
      - question: "Finally, give the correct form of <latin>callida</latin> to complete the blank in the following sentence: <latin>puella pecūniam scrīptrīcibus</latin> [BLANK] dedit."
        answer: "CALLIDĪS"
  - tossup:
      question: "What Roman god, sometimes identified as a patron of astronomy due to the planet that bears his name and as the protector of thieves because of his juvenile record, is identified with the Greek Hermes?"
      answer: "MERCURY / <latin>MERCURIUS</latin>"
    boni:
      - question: "Mercury induced what hero to fulfill his destiny instead of staying in Carthage?"
        answer: "AENEAS"
      - question: "One of Mercury’s important responsibilities was as a psychopomp. What does a psychopomp do?"
        answer: "LEADS SOULS (TO THE UNDERWORLD)"
  - tossup:
      question: "Using the verb <latin>fugiō</latin>, say to Livia in Latin: “Livia, run away from danger!”"
      answer: "<latin>LĪVIA, Ē(X) / Ā(B) PERĪCULŌ / PERĪCULUM FUGE!</latin>"
    boni:
      - question: "Now, in Latin, tell the students: “Students, throw your books!”"
        answer: "<latin>DISCIPULĪ / DISCIPULAE / STUDENTĒS, LIBRŌS (VESTRŌS) IACITE / IACTĀTE!</latin> (accept compounds of <latin>iaciō</latin>)"
      - question: "Using the verb <latin>cadō</latin>, say to a bridge: “Bridge, don’t fall!”"
        answer: "<latin>PŌNS, NŌLĪ CADERE! // NĒ CECIDERĪS / CADĀS // CAVĒ CADĀS</latin>"
  - tossup:
      question: "The transformation of Phineus and Atlas was brought about by which woman’s decapitated head, which had the power to turn people to stone?"
      answer: "MEDUSA’S"
    boni:
      - question: "Phineus was the brother of Cepheus and the uncle of what Ethiopian princess?"
        answer: "ANDROMEDA"
      - question: "Atlas was turned into a mountain range holding up the sky because he could not avoid the sons of Zeus, despite the warning of which Titaness of justice and law?"
        answer: "THEMIS"
  - tossup:
      question: "Which people humiliated the Romans by forcing them to “pass under the yoke” at the Battle of Caudine Forks in 321 BC?"
      answer: "SAMNITES"
    boni:
      - question: "The Battle of Caudine Forks took place during what war?"
        answer: "SECOND SAMNITE WAR"
      - question: "What Samnite leader demanded this action in exchange for the soldiers’ lives?"
        answer: "GAVIUS (PONTIUS) / (C.) PONTIUS"
  - tossup:
      question: "What Latin adverb, used to indicate a spelling mistake by the original author, also begins the motto of Virginia, “[BLANK] semper tyrannīs”?"
      answer: "<latin>SĪC</latin>"
    boni:
      - question: "What state name is missing from the seal labeled B?"
        answer: "IDAHO"
      - question: "What Latin motto is missing from the seal labeled D?"
        answer: "<latin>ESSE QUAM VIDĒRĪ</latin>"
  - tossup:
      question: "What did the Romans ferment to make <latin>vīnum</latin>?"
      answer: "GRAPES / <latin>ŪVA(E) / MUSTUM</latin>"
    boni:
      - question: "What did the Romans get when <latin>vīnum</latin> spoiled?"
        answer: "VINEGAR / <latin>ACĒTUM</latin> / SOUR WINE"
      - question: "The parts of what animal were fermented by the Romans to make <latin>garum</latin>?"
        answer: "FISH / <latin>PISCIS / SCOMBER</latin>"
  - tossup:
      question: "Of the Latin nouns <latin>aurīga, iter, praemium, socius,</latin> and <latin>umbra</latin>, which is a synonym for <latin>via</latin>?"
      answer: "<latin>ITER</latin>"
    boni:
      - question: "Of the Latin nouns <latin>aurīga, iter, praemium, socius,</latin> and <latin>umbra</latin>, which is being described by this Latin sentence: <latin>currum in Circō Maximō agēbat?</latin>"
        answer: "<latin>AURĪGA</latin>"
      - question: "Of the Latin nouns <latin>aurīga, iter, praemium, socius,</latin> and <latin>umbra</latin>, which is being described by this Latin sentence: <latin>datum est victōrī ubi in lūdō vincit?</latin>"
        answer: "<latin>PRAEMIUM</latin>"
  - tossup:
      question: "Listen carefully to the following passage. The question: Quem Narcissus amābat?"
      answer: "<latin>NARCISSUM / NĒMINEM / SĒ (SŌLUM AMĀBAT) / NŪLLŌS (PUERŌS) / NŪLLĀS (PUELLĀS)</latin>"
    boni:
      - question: "Ēchō nōn est homo. Quālis est Ēchō?"
        answer: "<latin>NYMPHA / AMĀNS</latin>"
      - question: "Quid Ēchō nōn facere poterat?"
        answer: "<latin>AMŌREM / DĒ (SUŌ) AMŌRE (NARCISSĪ) DĪCERE</latin>"
  - tossup:
      question: "Who married a stranger from Corinth as a result of the correct answer to the Sphinx’s riddle, unaware that the stranger was her son, Oedipus?"
      answer: "JOCASTA / EPICASTA"
    boni:
      - question: "Name a daughter of Oedipus and Jocasta."
        answer: "ANTIGONE / ISMENE"
      - question: "Name a son of Oedipus and Jocasta."
        answer: "ETEOCLES / POLYN(E)ICES"
  - tossup:
      question: "Which man was said to have seen a cross in the sky and the words “in this sign you shall conquer” in Greek prior to the Battle of the Milvian Bridge in 312 AD?"
      answer: "CONSTANTINE I / THE GREAT"
    boni:
      - question: "Which son of Maximian did Constantine defeat at the Milvian Bridge?"
        answer: "MAXENTIUS"
      - question: "Which co-Augustus did Constantine defeat in battles at Adrianople and Chrysopolis in order to gain sole rule by 324 AD?"
        answer: "(VALERIUS) LICINIUS (LICINIANUS)"
  - tossup:
      question: "Your JCL chapter is preparing food for the year-end celebration. Using the verb <latin>coquō</latin>, how would you tell your friends in Latin: “we are cooking”?"
      answer: "<latin>COQUIMUS</latin>"
    boni:
      - question: "Since you are already getting excited about next year’s party, how would you change <latin>coquimus</latin> to the future tense, saying “we will cook”?"
        answer: "<latin>COQUĒMUS</latin>"
      - question: "The ingredients are not happy about this and reply: “we will not be cooked.” How would you change <latin>coquēmus</latin> to the passive to express this idea?"
        answer: "<latin>(NŌN) COQUĒMUR</latin>"
  - tossup:
      question: "What man ultimately deemed that the Greek inscription “kallistei” meaning “for the fairest,” referred to Aphrodite when conducting his “judgment” of three goddesses?"
      answer: "PARIS / ALEXANDER / ALEXANDROS"
    boni:
      - question: "On what was this Greek word inscribed?"
        answer: "(GOLDEN) APPLE"
      - question: "On what mountain near Troy had this judgment taken place?"
        answer: "(MOUNT) IDA"
  - tossup:
      question: "The Parisii were a group of Gauls that dwelled near the Seine River and gave their name to the modern city of Paris. What name did the Romans use to refer to this city?"
      answer: "<latin>LUTETIA</latin>"
    boni:
      - question: "Originally a Greek colony on the Mediterranean coast, what did the Romans call the modern city Marseilles?"
        answer: "<latin>MASSILIA / MASSALIA</latin>"
      - question: "What did the Romans call the fortified town, used to defend against Germanic people, which eventually became the modern city Vienna?"
        answer: "<latin>VINDOBONA</latin>"
  - tossup:
      question: "Respondē Latīne: Quot pedēs canī sunt?"
      answer: "<latin>QUATTUOR (PEDĒS)</latin>"
    boni:
      - question: "Respondē Latīne: Quot pulmōnēs porcō sunt?"
        answer: "<latin>DUO (PULMŌNĒS)</latin>"
      - question: "Respondē Latīne: Quot oculī septem delphīnīs sunt?"
        answer: "<latin>QUATTUORDECIM</latin>"
  - tossup:
      question: "Which of the following phrases does NOT belong because of grammar: circum urbem, dē librīs, in inimīcōs, per iānuam?"
      answer: "<latin>DĒ LIBRĪS</latin>"
    boni:
      - question: "Which of the following takes an object in the same case as dē: ad, trāns, prō, ob?"
        answer: "<latin>PRŌ</latin>"
      - question: "Which of the following takes an object in the same case as circum: sine, ex, ab, contrā?"
        answer: "<latin>CONTRĀ</latin>"
  - tossup:
      question: "What man interrupted his journey to Iolcus to carry a disguised goddess across a river, earning her help and favor when he led the Argonauts?"
      answer: "JASON"
    boni:
      - question: "What object did Jason lose while he was helping Hera across the river?"
        answer: "(ONE) SANDAL"
      - question: "Jason was traveling to Iolcus to visit what man, his uncle?"
        answer: "PELIAS"
  - tossup:
      question: "From what Latin verb do we derive “indoctrinate” and “doctor”?"
      answer: "<latin>DOCEŌ</latin> (TO TEACH)"
    boni:
      - question: "From what Latin verb do we derive “improv” and “envision”?"
        answer: "<latin>VIDEŌ</latin> (TO SEE)"
      - question: "From what Latin verb do we derive “scrivener” and “proscription”?"
        answer: "<latin>SCRĪBŌ</latin> (TO WRITE DOWN / ENGRAVE / DRAW)"