tournament: NJCL Certamen
year: 2022
division: Novice
round: Semifinals
questions:
  - tossup:
      question: "From what Latin noun, with what meaning, do we derive “sewer” and “aqueduct”?"
      answer: "<latin>AQUA</latin> – WATER"
    boni:
      - question: "From what Latin verb, with what meaning, do we derive “enemy”?"
        answer: "<latin>AMŌ</latin> – LOVE"
      - question: "From what Latin noun, with what meaning, do we derive the chemical symbol Ag?"
        answer: "<latin>ARGENTUM</latin> – SILVER"
  - tossup:
      question: "At what battle — fought off the northwestern coast of Sicily — was the Punic commander Hanno defeated by Lutatius Catulus, bringing an end to the First Punic War in 241 BC?"
      answer: "AEGATES (ISLANDS)"
    boni:
      - question: "Where had the Romans, led by the hubristic consul Publius Claudius Pulcher, been defeated in 249 BC?"
        answer: "(CAPE OF) DREPANA / DREPANUM"
      - question: "What two islands became Rome’s second province after being annexed between the First and Second Punic Wars?"
        answer: "SARDINIA and CORSICA"
  - tossup:
      question: "At the museum, you see urns decorated with depictions of what Roman goddess holding torches or pomegranates as the queen of the Underworld?"
      answer: "PROSERPINA [do NOT accept PERSEPHONE]"
    boni:
      - question: "You also find a terracotta statue of a Roman agricultural goddess surrounded by poppies and snakes. Which goddess does the statue represent?"
        answer: "CERES [do NOT accept DEMETER]"
      - question: "Finally, you see a Roman fresco of a youthful god leaning against a cypress tree visibly dripping tears of sap. Which god is depicted, mourning his lover Cyparissus, who had been transformed into the tree due to grief?"
        answer: "APOLLO / SILVANUS"
  - tossup:
      question: "Translate the following sentence into English: <latin>āthlēta magnā cum dīligentiā exercēbat.</latin>"
      answer: "THE ATHLETE WAS EXERCISING WITH GREAT DILIGENCE / EFFORT / CARE"
    boni:
      - question: "Translate the following sentence into English: <latin>piscātrīx quīnque hōrīs redībit.</latin>"
        answer: "THE FISHER (WOMAN / LADY) / (FEMALE) FISHERMAN WILL RETURN (WITH)IN FIVE HOURS"
      - question: "Translate the following sentence into Latin: The fisher woman was much more certain than the athlete."
        answer: "<latin>PISCĀTRĪX MULTŌ CERTIOR FUIT / ERAT ĀTHLĒTĀ / QUAM ĀTHLĒTA</latin>"
  - tossup:
      question: "Distinguish in meaning among the following three nouns: <latin>porta, portus, porcus.</latin>"
      answer: "<latin>PORTA</latin> – DOOR / GATE / PORTAL; <latin>PORTUS</latin> – HARBOR / PORT; <latin>PORCUS</latin> – PIG"
    boni:
      - question: "Now distinguish in meaning among these three verbs: <latin>pereō, parō, pellō.</latin>"
        answer: "<latin>PEREŌ</latin> - DIE, PERISH; <latin>PARŌ</latin> – PREPARE; <latin>PELLŌ</latin> – PUSH / DRIVE"
      - question: "Now distinguish in meaning among these three adjectives: <latin>pār, pauper, parātus.</latin>"
        answer: "<latin>PĀR</latin> - EQUAL / EVEN; <latin>PAUPER</latin> - POOR; <latin>PARĀTUS</latin> - PREPARED"
  - tossup:
      question: "Name one of the two battle sites where the emperor from Leptis Magna secured victories over his rivals Pescennius Niger and Clodius Albinus."
      answer: "LYONS / <latin>LUGDŪNUM</latin> // ISSUS"
    boni:
      - question: "Septimius Severus’ brutal but militarily successful reign was marked by the sack of what Parthian capital in 198 AD?"
        answer: "CTESIPHON"
      - question: "What province was divided by Septimius into two regions called Coele and Phoenice?"
        answer: "SYRIA (do not accept SYRIA PALESTINA)"
  - tossup:
      question: "What warrior came to Troy’s aid with twelve other women and was killed on the battlefield by Achilles, who fell in love with her corpse?"
      answer: "PENTHESILE(I)A"
    boni:
      - question: "Who was Penthesilea’s father?"
        answer: "ARES / MARS"
      - question: "To which goddess did Penthesilea’s mother, Otrera, supposedly build a famous temple at Ephesus?"
        answer: "ARTEMIS / DIANA"
  - tossup:
      question: "What two-word Latin phrase, abbreviated <latin>q.v.</latin>, can often be found in footnotes?"
      answer: "<latin>QUOD VIDĒ / QUOD VIDEĀS</latin> (do NOT accept <latin>QUANTUM VĪS</latin>)"
    boni:
      - question: "Which of the following abbreviations would be LEAST likely to appear in a footnote: <latin>pro tem., loc. cit., ibid., op. cit.</latin>?"
        answer: "PRO TEM."
      - question: "Please give the full Latin phrase and its meaning for the abbreviation <latin>loc. cit.</latin>"
        answer: "<latin>LOCŌ CITĀTŌ</latin> - IN THE PLACE CITED / <latin>LOCĪS CITĀTĪS</latin> - IN THE PLACES CITED"
  - tossup:
      question: "What son of Venilia and Daunus was the primary suitor of the Italian princess Lavinia until Aeneas arrived and caused a fatal war over her hand in marriage?"
      answer: "TURNUS"
    boni:
      - question: "Name Lavinia’s father, the king of a namesake people in Italy, who was told that his daughter would marry a foreigner."
        answer: "LATINUS"
      - question: "In Book 10 of the <title><latin>Aeneid</latin></title>, Turnus kills Pallas, taking what object of his as a prize? When Aeneas duels Turnus at the end of the <title><latin>Aeneid</latin></title>, he sees this object and, maddened, kills Turnus."
        answer: "(SWORD-)BELT / BALDRIC (THAT SHOWS THE DANAÏDS’ CRIME)"
  - tossup:
      question: "Listen to the following passage, which I will read twice, then answer the question that follows in ENGLISH. Note that the word <latin>pālus, pālūdis</latin> means “swamp”:\n\n<latin>Duae rānae prope crocodīlōs in pālūde sedent. rana benigna dīcit, “ecce! quid est illud in aquā?” tum rāna crūdēlis rēspondit, “nesciō. īre et vidēre dēbēs.” prīma rāna vehementer respondit, “certē!” rāna benigna ad figūram obscūram in aquā natat. rāna altera crūdēliter rīdet propter crocodīlōs.</latin>\n\nThe question: What were the two frogs doing in the swamp?"
      answer: "SITTING / TALKING (do not accept SWIMMING)"
    boni:
      - question: "What two things did the cruel frog suggest that the kind frog do?"
        answer: "(HE / SHE SHOULD) GO AND SEE (THE THING IN THE WATER / CROCODILE)"
      - question: "The passage continues: <latin>procul bēnigna rāna clāmat, “Sōlum sāxum māgnum est!” crocodīlus rānae crūdēlī ā tergō clam appropinquat, rīdens et cibum volēns.</latin>\n\nAccording to the kind frog, what was the dark shape in the water?"
        answer: "(ONLY) A BIG ROCK / NOTHING DANGEROUS"
  - tossup:
      question: "Make the demonstrative pronoun <latin>ille</latin> agree with the noun form <latin>nāvium</latin>."
      answer: "<latin>ILLĀRUM</latin>"
    boni:
      - question: "Make <latin>ille</latin> agree with the noun form <latin>arboris</latin>."
        answer: "<latin>ILLĪUS</latin>"
      - question: "Make <latin>ille</latin> agree with the noun form <latin>domum</latin>."
        answer: "<latin>ILLAM</latin>"
  - tossup:
      question: "Consisting of stacks of tiles creating space in the floors and walls for hot air to circulate, what heating system was used in Roman <latin>thermae</latin>?"
      answer: "HYPOCAUST / <latin>HYPOCAUSTUM</latin>"
    boni:
      - question: "What was the name for the room, usually the closest to the hypocaust, containing a hot water bath?"
        answer: "<latin>CAL(I)DĀRIUM</latin>"
      - question: "What was the name for the hottest room, lacking a pool and used as a sweat bath?"
        answer: "<latin>LACŌNICUM / SŪDĀTŌRIUM</latin>"
  - tossup:
      question: "<emphasis>[HAND OUT VISUAL] Please open the visual; you now have 10 seconds to inspect the visual:</emphasis>\nGive the letter of Utica, the city where Cato the Younger died."
      answer: "D"
    boni:
      - question: "Distinguish by letter between Aquincum and Aquileia."
        answer: "AQUINCUM - H, AQUILEIA - F"
      - question: "Give the letter or letters of the city or cities that were in the province of Cilicia."
        answer: "L"
  - tossup:
      question: "What English word, derived from a Latin noun meaning “race” or “kind”, is the collective term for all the people born in the same range of time?"
      answer: "GENERATION"
    boni:
      - question: "What English word, derived from the Latin verb meaning “to take”, is a statement acknowledging that something has been paid for?"
        answer: "RECEIPT"
      - question: "What English word, derived from the Latin noun meaning “sister”, can be used to refer to a person belonging to the same extended family or related by race, geography, language, or interest?"
        answer: "COUSIN"
  - tossup:
      question: "Begged by his second-in-command to let his men rest from their rowing, what man overrode his better judgment to stop at the island of Thrinacia, the home of Helios’ cattle?"
      answer: "ODYSSEUS"
    boni:
      - question: "Despite the warnings of Circe, who had encouraged Odysseus’ men to eat the cattle of the Sun that grazed on Thrinacia?"
        answer: "EURYLOCHUS"
      - question: "Which daughter of Helios informed the god that his sacred cattle had been eaten by Odysseus’ men?"
        answer: "LAMPETIË"
  - tossup:
      question: "<latin>Respondē Latīnē: Quot sunt decem et decem?</latin>"
      answer: "<latin>VĪGINTĪ</latin>"
    boni:
      - question: "<latin>Respondē Latīnē: Quot sunt vīgintī dīvīsī in partēs quattuor?</latin>"
        answer: "<latin>QUĪNQUE</latin>"
      - question: "<latin>Respondē Latīnē: Quot sunt ter vīgintī?</latin>"
        answer: "<latin>SEXĀGINTĀ</latin>"
  - tossup:
      question: "Which tribune, via the legislation of his ally Gaius Rubrius, tried to establish the colony of Junonia at Carthage as part of the resettlement efforts originally formulated by his brother, Tiberius?"
      answer: "GAIUS (SEMPRONIUS) GRACCHUS"
    boni:
      - question: "What previous law of 367 BC was Tiberius Gracchus building on when he attempted to limit land ownership to 500 <latin>iūgera</latin>?"
        answer: "<latin>LĒX LICINIA-SEXTIA</latin> // <latin>LĒGĒS LICINIAE-SEXTIAE</latin> // THE LICINIAN-SEXTIAN LAWS / ROGATIONS"
      - question: "During the time of the Gracchi, which consul of 125 BC pursued enfranchisement for all Italians, but had to abandon these efforts when he was sent to help Massilia fight hostile neighbors in southern Gaul?"
        answer: "(M.) FULVIUS FLACCUS"
  - tossup:
      question: "In what three ways must Latin adjectives agree with the nouns they describe?"
      answer: "GENDER, CASE, NUMBER"
    boni:
      - question: "In what two ways must a Latin relative pronoun agree with the noun or pronoun it describes, that is, its antecedent?"
        answer: "GENDER AND NUMBER"
      - question: "In what ways must the perfect passive indicative form of a regular Latin verb agree with its subject?"
        answer: "GENDER, NUMBER, PERSON, (CASE)"
  - tossup:
      question: "Participants in the expedition of the Argonauts and the Calydonian Boar hunt, which brothers, a charioteer and a boxer, were hatched from eggs?"
      answer: "CASTOR & POLLUX / POLYDEUCES // DIOSCURI / GEMINI // (ACCEPT BUT DO NOT REVEAL “TYNDARIDAE”)"
    boni:
      - question: "Some writers said that, despite being twins, they had different fathers. Name those two fathers."
        answer: "ZEUS (POLLUX / POLYDEUCES) and TYNDAREUS (CASTOR)"
      - question: "According to these versions, which of their sisters shared the same father with Pollux?"
        answer: "HELEN"
  - tossup:
      question: "Give the one-word Latin form that means “to be unwilling” — the present infinitive of <latin>nōlō</latin>."
      answer: "<latin>NŌLLE</latin>"
    boni:
      - question: "Now give the two-word phrase that is used as the third person singular, present indicative form of <latin>nōlō</latin>, meaning “she is unwilling”."
        answer: "<latin>NŌN VULT</latin>"
      - question: "Now give the third person singular, perfect indicative of <latin>nōlō</latin>, meaning “she was not willing”."
        answer: "<latin>NŌLUIT</latin>"
