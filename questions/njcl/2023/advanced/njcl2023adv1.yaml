tournament: NJCL Certamen
year: 2023
division: Advanced
round: Round 1
questions:
  - tossup:
      question: "The <latin>fabulae praetextae</latin> <title><latin>Romulus</latin></title> and <title><latin>Clastidium</latin></title> were written by what Latin author, who more famously composed a <title><latin>Bellum Punicum</latin></title>?"
      answer: "(CN.) NAEVIUS"
    boni:
      - question: "What powerful Roman family did Naevius attack in his verses?"
        answer: "METELLI"
      - question: "In what meter was the <title><latin>Bellum Punicum</latin></title> written?"
        answer: "SATURNIAN (VERSE) // SATURNIANS"
  - tossup:
      question: "Listen to the following passage, which I will read twice, then <latin>respondē Latīnē</latin> to the questions that follow: <latin>Sōle orientī, duae iuvenēs ē casā ēgressae sunt. Eīs māne proficīscendum erat ut longum iter ante noctem perficerent. Nōndum duās hōrās ambulāverant ubi prīma iuvenis exclāmāvit, “Amīca! Cōnsiste! Gregem canum ferōrum nōbīs appropinquantem videō! Quōmodo nōs servāre possumus?” secunda iuvenis, quae multō fortior quam comes erat, cultrum dēstrīnxit et canibus advertit.</latin> REREAD The question: <latin>quandō iuvenēs ē casā ēgressae sunt</latin>?"
      answer: "<latin>SŌLE ORIENTĪ / MĀNE / PRIMĀ LUCE</latin>"
    boni:
      - question: "<latin>Cūr necesse erat iuvenibus māne proficīscī</latin>?"
        answer: "<latin>UT (LONGUM) ITER (ANTE NOCTEM) PERFICERENT / QUOD ITER ERAT LONGUM</latin>"
      - question: "<latin>Quod perīculum iuvenēs in viā obiērunt</latin>?"
        answer: "<latin>GREGEM CANUM (FERŌRUM) / CANĒS (FERŌS)</latin>"
  - tossup:
      question: "When recognized by the moderator, perform the following command or describe the actions you are being asked to perform: <latin>Manibus sublātīs, stā in ūnō pede.</latin>"
      answer: "STUDENT STANDS ON ONE FOOT WITH HANDS RAISED IN THE AIR."
    boni:
      - question: "<latin>Ūnō pede in sellā, alterō humī positō, circumspectā et dīc Anglicē, “Ego sum dux patriae.”</latin>"
        answer: "WITH ONE FOOT ON THE CHAIR AND THE OTHER ON THE GROUND, ONE STUDENT LOOKS AROUND AND SAYS IN ENGLISH, “I AM THE LEADER OF THE / MY COUNTRY.”"
      - question: "<latin>Aurēs digitīs tangentēs, dīcite Anglicē, “Vōs audīre nōn possumus.”</latin>"
        answer: "WITH FINGERS IN / ON EARS, AT LEAST TWO STUDENTS SAY “WE CAN’T HEAR YOU.”"
  - tossup:
      question: "What group, while they were on an island called “Bear Mountain,” found six-armed earthborn monsters, met the king Cyzicus, heeded Mopsus’ prophecies, and obeyed Jason’s orders?"
      answer: "(THE) ARGONAUTS / MINYANS"
    boni:
      - question: "What actual mountain, sacred to the goddess Cybele, stood on the island “Bear Mountain” and was the site of propitiatory sacrifices by the Argonauts?"
        answer: "(MOUNT) DINDYMUS / DINDYMON"
      - question: "To learn that the Argonauts needed to propitiate Cybele, the seer Mopsus interpreted the cries of what bird, into which Ceÿx was transformed in another story?"
        answer: "KINGFISHER / HALCYON (BIRD)"
  - tossup:
      question: "What general — together with his older brother, who was nicknamed <latin>Calvus</latin> — won his greatest victory at Dertosa before dying at the Upper Baetis river in 211 BC, leaving command to his son, Scipio Africanus?"
      answer: "PUBLIUS (CORNELIUS) SCIPIO (THE ELDER)"
    boni:
      - question: "Where did the younger Scipio save his father’s life in battle in 218 BC in one of the opening skirmishes of the war?"
        answer: "TICINUS RIVER"
      - question: "Scipio Africanus later took what city in Hispania in 209 BC by attacking over a lagoon?"
        answer: "<latin>CARTHĀGŌ NOVA</latin> / NEW CARTHAGE"
  - tossup:
      question: "Consider the Latin sentence: <latin>carmina optima magnā cum arte semper scrībantur.</latin> What mood is the verb?"
      answer: "SUBJUNCTIVE"
    boni:
      - question: "Translate the sentence from the tossup: <latin>carmina optima magnā cum arte semper scrībantur.</latin>"
        answer: "LET / MAY THE BEST SONGS / POEMS ALWAYS BE WRITTEN WITH GREAT SKILL"
      - question: "What word would replace the phrase <latin>magnā cum arte</latin> if instead of saying “with great skill” you wished to say the Latin for “very quickly”?"
        answer: "<latin>CELERRIMĒ</latin>"
  - tossup:
      question: "Ranging from simple geometric patterns of black and white <latin>tesserae</latin> to vibrant mythological scenes made of colored marble, what art form was used as a common floor decoration throughout the Roman world?"
      answer: "MOSAIC"
    boni:
      - question: "[Hand out the Visual] You now have 5 seconds to inspect the visual. Behold these wondrous mosaics from antiquity. Which of the mosaics can be described with these Latin sentences? “<latin>Hāc in pictūrā sunt animalia ingentia quae contra hominēs pugnant. Haec animalia enim nolunt exire patriā suā.</latin>”"
        answer: "D"
      - question: "Which of the other mosaics could be described with the following Latin sentences? “<latin>Sunt in hāc pictūrā animalia quae aut in flumine aut in marī habitant. Est quoque animal quod plusquam quattuor pedes habet.</latin>”"
        answer: "A"
  - tossup:
      question: "What author wrote defenses against charges of contaminating and plagiarizing his plays in the prologues of his <title><latin>Andria</latin></title> and <title><latin>Eunuchus</latin></title>?"
      answer: "TERENCE / (P.) TERENTIUS (AFER)"
    boni:
      - question: "What play of Terence was said to be so boring that it was interrupted twice before being performed in its entirety on the third attempt?"
        answer: "<title><latin>HECYRA</latin></title>"
      - question: "What play of Terence is about a parasite who helps two cousins marry the women they love?"
        answer: "<title><latin>PHORMIO</latin></title>"
  - tossup:
      question: "What man vainly searched shrubs and wild asparagus for Perigune after killing her father in the same way the father had killed travelers on Corinth’s isthmus — by bending pines?"
      answer: "THESEUS"
    boni:
      - question: "That father, Sinis, was also known by what name meaning “pine-bender”?"
        answer: "PITYOCAMPTES"
      - question: "Name Theseus’ and Perigune’s son, who ran the foot-race at the second Nemean Games."
        answer: "MELANIPPUS"
  - tossup:
      question: "What woman, born at Cologne in 15 AD, allegedly enlisted the services of the poisoner Locusta to help kill her husband Claudius, paving the way for her son Nero to take the throne?"
      answer: "AGRIPPINA THE YOUNGER / MINOR // JULIA AGRIPPINA"
    boni:
      - question: "What biological son of Claudius was originally the emperor’s designated successor, but was superseded by Nero due to Agrippina’s machinations and was later poisoned by Nero?"
        answer: "(TI. CLAUDIUS CAESAR) BRITANNICUS"
      - question: "What earlier wife of Claudius was the mother of Britannicus?"
        answer: "(VALERIA) MESSALINA"
  - tossup:
      question: "What type of person did the Romans call a <latin>pictrix</latin>?"
      answer: "PAINTER (prompt on “artist”)"
    boni:
      - question: "What type of person did the Romans call a <latin>luctātor</latin>?"
        answer: "WRESTLER"
      - question: "What Latin word did the Romans use to refer to a dancer?"
        answer: "<latin>SALTĀTOR / SALTĀTRĪX</latin>"
  - tossup:
      question: "What historian, a <latin>consul suffectus</latin> in 97 AD, launched his political career with the help of his father-in-law, about whom he wrote a biography entitled <title><latin>Dē Vītā Iūliī Agricolae</latin></title>?"
      answer: "(P. / C. CORNELIUS) TACITUS"
    boni:
      - question: "What work of Tacitus narrates historical events from the reign of Galba to the death of Domitian?"
        answer: "<title><latin>HISTORIAE</latin></title> / HISTORIES"
      - question: "Drawing on a historical work of Pliny the Elder, Tacitus also wrote an ethnographic treatise about what Roman province?"
        answer: "<latin>GERMANIA</latin> / GERMANY"
  - tossup:
      question: "Which of the following Latin words does not belong because of a point of grammar: <latin>oppidō, ōrdō, sociō, vīnō</latin>?"
      answer: "<latin>ŌRDŌ</latin>"
    boni:
      - question: "Say in Latin using the word <latin>ōrdō</latin>, “A row longer than the street.”"
        answer: "<latin>ŌRDŌ LONGIOR QUAM VIA // ŌRDŌ LONGIOR VIĀ</latin>"
      - question: "How would you say in Latin using <latin>ōrdō</latin>, “in a certain line”?"
        answer: "<latin>(IN) QUŌDAM / CERTŌ ŌRDINE</latin>"
  - tossup:
      question: "What Greek god’s many children included Phlegyas, the Bistonian king Diomedes, Penthesilea, and Phobos and Deimos, whom he fathered in his affair with Aphrodite?"
      answer: "ARES’"
    boni:
      - question: "Phlegyas was himself the father of Coronis, who bore what child to Apollo?"
        answer: "ASCLEPIUS"
      - question: "According to one story, Phlegyas was killed by what two sons of Chthonius?"
        answer: "LYCUS AND NYCTEUS"
  - tossup:
      question: "What work, which prompted Propertius to say “<latin>nesciō quid maius nascitur Īliade</latin>”, was an epic that was almost burned by Plotius Tucca and Varius Rufus on the orders of the author, Vergil?"
      answer: "<title>AENEID</title>"
    boni:
      - question: "Vergil and Propertius belonged to what man’s literary circle, which also included Horace?"
        answer: "(C. CILNIUS) MAECENAS"
      - question: "Name the four-book work of Vergil that included the story of Aristaeus and Orpheus."
        answer: "(THE) <title>GEORGICS</title> / <title><latin>GEORGICA</latin></title>"
  - tossup:
      question: "For the verb <latin>tueor</latin>, provide the third person singular, future indicative form that means “she will watch.”"
      answer: "<latin>TUĒBITUR</latin>"
    boni:
      - question: "Keeping everything else the same, change <latin>tuēbitur</latin> to the future perfect so that it means “she will have watched.”"
        answer: "<latin>TU(I)TA ERIT</latin>"
      - question: "Keeping everything else the same, change <latin>tuita erit</latin> to the perfect and subjunctive so that it means “she might have watched.”"
        answer: "<latin>TU(I)TA SIT</latin>"
  - tossup:
      question: "According to its derivation, under what circumstances does an “igneous” rock form?"
      answer: "IN FIRE / IN HIGH TEMPERATURES"
    boni:
      - question: "According to its derivation, what quality do “vitreous” rocks like obsidian have?"
        answer: "GLASSY / TRANSLUCENT"
      - question: "According to its derivation, what substance does the structure known as a “flume” transport?"
        answer: "WATER"
  - tossup:
      question: "Into what type of animal, which a man rides in a statue built at Taenarum to honor Arion, were the Tyrrhenian pirates who kidnapped Dionysus transformed?"
      answer: "DOLPHIN(S) / MEMBERS OF DOLPHINDOM"
    boni:
      - question: "Name the helmsman of the Tyrrhenian pirate ship who tried to defend the god and was thus spared the fate of his crewmates."
        answer: "ACOËTES"
      - question: "After Arion landed at Taenarum, he traveled to Corinth. What tyrant received him there?"
        answer: "PERIANDER"
  - tossup:
      question: "What future emperor was awoken in the night by Aemilius Laetus and Eclectus to the news that Commodus had been killed, was offered the throne, and ruled for the first four months of 193 AD?"
      answer: "(P. HELVIUS) PERTINAX"
    boni:
      - question: "What successor of Pertinax secured the throne when he offered more sesterces to the praetorian guard than his rival, Sulpicianus?"
        answer: "(M.) DIDIUS (SEVERUS) JULIANUS"
      - question: "Besides Pertinax, Didius Julianus, and Septimius Severus, what other two individuals might be considered emperors of 193 AD, though they were ultimately defeated by Severus at Issus and Lugdunum?"
        answer: "(C.) PESCENNIUS NIGER AND (D.) CLODIUS ALBINUS"
  - tossup:
      question: "Translate the motto of Maine: <latin>Dīrigō</latin>."
      answer: "I LEAD / POINT (THE WAY) // I DIRECT"
    boni:
      - question: "Name the two U.S. states that mention freedom in their Latin mottos using either the adjective <latin>līber</latin> or the noun <latin>lībertās</latin>."
        answer: "MASSACHUSETTS AND WEST VIRGINIA"
      - question: "What state has the Ciceronian motto <latin>cēdant arma togae</latin>?"
        answer: "WYOMING"
