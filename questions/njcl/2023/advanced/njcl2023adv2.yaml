tournament: NJCL Certamen
year: 2023
division: Advanced
round: Round 2
questions:
  - tossup:
      question: "Name the men who, during the consulship of Metellus Celer, formed an <latin>amīcitia</latin> with the following goals: the first sought support for business ventures in Asia, the second sought to procure land for his veterans, and the third sought the consulship for the next year alongside the oft-neglected Bibulus."
      answer: "(M. LICINIUS) CRASSUS, (CN.) POMPEIUS / POMPEY (MAGNUS), and (C. IULIUS) CAESAR"
    boni:
      - question: "For what year did Pompey and Crassus run for the consulship in order to prevent the election of Domitius and to prolong Caesar’s proconsulship in Gaul?"
        answer: "55 BC"
      - question: "Where had the three men met in the previous year to reaffirm their <latin>amīcitia</latin> and form a plan to head off the threats posed by Domitius and Cicero?"
        answer: "LUC(C)A"
  - tossup:
      question: "What prophetic man was struck blind for the crime of accidentally stumbling upon the goddess Athena as she bathed?"
      answer: "T(E)IRESIAS"
    boni:
      - question: "Identify the man looking into the water in this image, whom Teiresias predicted would live a long life if he avoided self-knowledge."
        answer: "NARCISSUS"
      - question: "Identify the woman in the background of this image, who can only look on helplessly as Narcissus falls in love with himself."
        answer: "ECHO"
  - tossup:
      question: "Give a Latin synonym of the verb <latin>necō, necāre</latin>."
      answer: "<latin>INTERFICIŌ / CAEDŌ / OCCĪDŌ / TRUCĪDŌ / OBTRUNCŌ / INTERIMŌ / DELEŌ</latin>"
    boni:
      - question: "Now give a Latin antonym of the verb <latin>āmittō, āmittere</latin>."
        answer: "<latin>INVENIŌ / REPERIŌ / NANCĪSCOR / OFFENDŌ</latin>"
      - question: "Now give a Latin antonym of the verb <latin>oblīviscor, oblīviscī</latin>."
        answer: "<latin>MEMINĪ / RECORDOR / REMINĪSCOR / (IN) MEMORIĀ TENĒRE</latin>"
  - tossup:
      question: "A rite of Priapus performed by a woman named Quartilla, the recitation of a poem by Eumolpus, and a dinner at the house of Trimalchio are all elements of what Latin narrative by Petronius?"
      answer: "<title><latin>SATYRICON</latin></title> / <title><latin>SATYRICA</latin></title>"
    boni:
      - question: "Ancient sources referred to Petronius by what title, which was given to him because he was Nero’s judge of refinement?"
        answer: "ARBITER ĒLEGANTIAE // ĒLEGANTIAE ARBITER // ARBITER ĒLEGANTIĀRUM"
      - question: "The <title><latin>Satyricon</latin></title> falls into what genre, which is characterized by an alternation of prose and verse?"
        answer: "MENIPPEAN SATIRE // <title><latin>SATURAE MENIPPEAE</latin></title>"
  - tossup:
      question: "Translate this Latin sentence into English: <latin>cūr cōnsul sacerdōtī imperāvit ut victimās hodiē īnspiceret?</latin>"
      answer: "WHY DID THE CONSUL ORDER THE PRIEST TO INSPECT / SEE THE VICTIMS / SACRIFICES TODAY?"
    boni:
      - question: "Now translate this Latin sentence into English: <latin>quis sciēbat tantam pecūniam urbī surrēptam esse?</latin>"
        answer: "WHO KNEW / WAS KNOWING THAT SO MUCH MONEY HAD BEEN TAKEN / STOLEN FROM THE CITY?"
      - question: "Now translate this Latin sentence into English: <latin>in quō oppidō per noctem maneāmus?</latin>"
        answer: "IN WHAT TOWN SHOULD WE STAY (THROUGH / DURING) THE NIGHT / TONIGHT / AT NIGHT"
  - tossup:
      question: "What woman learned that she should avoid the Arimaspians and follow an Ethiopian river from the chained Prometheus, who says that she will reach the Nile to transform back from being a cow?"
      answer: "IO"
    boni:
      - question: "Upon arriving at the banks of the Nile, Io gave birth to what son?"
        answer: "EPAPHUS"
      - question: "According to one story, Epaphus founded what Egyptian city and named it after his wife?"
        answer: "MEMPHIS"
  - tossup:
      question: "What 1st century BC author from Cisalpine Gaul wrote a book entitled <title><latin>Dē Excellentibus Ducibus Exterārum Gentium</latin></title> and biographies of Cato the Elder and Atticus, which are all that remains of the <title><latin>Dē Vīrīs Illūstribus</latin></title>?"
      answer: "(CORNELIUS) NEPOS"
    boni:
      - question: "What poet dedicated his <latin>libellus</latin> to Cornelius Nepos?"
        answer: "(C. VALERIUS) CATULLUS"
      - question: "What other author wrote a <title><latin>Dē Vīrīs Illūstribus</latin></title> that contained the biographies of writers of which the <title><latin>Dē Grammaticīs et Rhētoribus</latin></title> survives?"
        answer: "(C.) SUETONIUS (TRANQUILLUS)"
  - tossup:
      question: "Provide the form of the noun <latin>gelū</latin> that would be used in the sentence “After this summer, I favor the frost,” which would be the dative singular."
      answer: "<latin>GELŪ</latin>"
    boni:
      - question: "For the noun <latin>gelū</latin>, provide the genitive singular form that fits the sentence “I forgot about the frost.”"
        answer: "<latin>GELŪS</latin>"
      - question: "For the noun <latin>gelū</latin>, provide the accusative singular form that fits the sentence “Maybe we can melt the frost.”"
        answer: "<latin>GELŪ</latin>"
  - tossup:
      question: "What secretary of Pope Damasus studied Hebrew extensively in order to compose a direct translation of the Hebrew bible into Latin, which is now called the <title><latin>Vulgate</latin></title>?"
      answer: "(SAINT SOPHRONIUS EUSEBIUS) HIERONYMUS / JEROME"
    boni:
      - question: "What teacher of Jerome is famous for his commentaries on Terence and Vergil?"
        answer: "(AELIUS) DONATUS"
      - question: "What other late Latin author wrote the <title><latin>Cōnfessiōnēs</latin></title> and <title><latin>Dē Cīvitāte Deī</latin></title>?"
        answer: "(SAINT) AUGUSTINE // (SAINT / SANCTUS) AURELIUS AUGUSTINUS"
  - tossup:
      question: "When recognized by the moderator, perform the following commands or describe them: <latin>Surge, tolle bracchia sicut alās, et fac sonum gallīnae.</latin>"
      answer: "STUDENT GETS UP AND MAKES CHICKEN SOUNDS WHILE RAISING / WAVING / FLAPPING THEIR ARMS LIKE WINGS"
    boni:
      - question: "<latin>Simulāte vōs habēre nāsōs longōs et facite sonum elephantī</latin>."
        answer: "AT LEAST TWO STUDENTS PRETEND TO HAVE TRUNKS AND MAKE ELEPHANT NOISES"
      - question: "<latin>Simulāte vōs habēre bracchia brevia et facite sonum tyrannosaurī rēgis</latin>."
        answer: "STUDENTS PRETEND TO HAVE SHORT ARMS AND MAKE T-REX NOISES"
  - tossup:
      question: "What city’s “fifty bedchambers” are despoiled by Polites’ bloody death at the hands of Pyrrhus, as well as the abduction of Cassandra and the merciless killing of Priam?"
      answer: "TROY / ILIUM"
    boni:
      - question: "In the <title><latin>Aeneid</latin></title>, the story told by what man convinced the Trojans to bring the Trojan Horse into the city?"
        answer: "SINON"
      - question: "In the <title><latin>Aeneid</latin></title>, Sinon deceitfully says that he turned against the Greeks because of the fate suffered by what comrade of his?"
        answer: "PALAMEDES"
  - tossup:
      question: "For the verb <latin>parcō</latin>, provide the perfect active infinitive form that means “to have spared.”"
      answer: "<latin>PEPERCISSE</latin>"
    boni:
      - question: "For the verb <latin>fallō</latin>, provide the future active infinitive form that means “to be about to deceive.”"
        answer: "<latin>FALSŪRUS/A/UM (ESSE)</latin>"
      - question: "For the verb <latin>mālō</latin>, provide the second person singular, present active subjunctive form that means “you might prefer.”"
        answer: "<latin>MĀLIS</latin>"
  - tossup:
      question: "Explain the use of the ablative found in these lines from Book 1 of the <title><latin>Aeneid</latin></title>, which I will read as prose: <latin>rēgīna deum tot volvere cāsūs / īnsignem pietāte virum, tot adīre labōrēs / impulerit</latin>."
      answer: "RESPECT / SPECIFICATION // IT EXPLAINS MORE SPECIFICALLY THE ADJECTIVE ĪNSIGNEM / HOW THE MAN IS REMARKABLE"
    boni:
      - question: "How is the ablative used in this line, also from Book 1 of the <title><latin>Aeneid</latin></title>: <latin>disiēcitque ratēs ēvertitque aequora ventīs</latin>?"
        answer: "MEANS / INSTRUMENT // EXPLAINS THAT THE WINDS ARE USED TO DISTURB THE SEA"
      - question: "How is the ablative used in this line, also from Book 1 of the <title><latin>Aeneid</latin></title>: <latin>Sunt mihi bis septem praestantī corpore nymphae</latin>?"
        answer: "DESCRIPTION // GIVE INFORMATION ABOUT THE NYMPHS"
  - tossup:
      question: "What king made peace with Rome by signing a treaty at Apamea in 188 BC to conclude the Seleucid War?"
      answer: "ANTIOCHUS III / THE GREAT"
    boni:
      - question: "Where had Scipio Asiaticus defeated Antiochus III in late 190 or early 189 BC?"
        answer: "MAGNESIA (AD SIPYLUM)"
      - question: "What king of Pergamum, who took the throne in 197 BC, commanded the right flank of the Roman infantry at Magnesia?"
        answer: "EUMENES II"
  - tossup:
      question: "Who wrote <latin>“Quidquid agunt hominēs . . . nostrī farrāgo libellī est”</latin> before being exiled to Egypt by Domitian over the scathing writing that also appeared in his five books of satires?"
      answer: "(D. IUNIUS) JUVENAL(IS)"
    boni:
      - question: "<latin>“Ō cūrās hominum! Ō quantum est in rēbus ināne”</latin> was the opening line of what other satirist’s work?"
        answer: "(AULES) PERSIUS (FLACCUS)"
      - question: "Persius’s opening line was said to be taken from the first book of what earlier author?"
        answer: "(C.) LUCILIUS"
  - tossup:
      question: "Of the English words “inculcate”, “cockatrice”, “calumny”, and “decal”, which is NOT derived from the Latin word <latin>calx</latin>?"
      answer: "CALUMNY"
    boni:
      - question: "What English word also derived from <latin>calx</latin> means “resisting authority or control”?"
        answer: "RECALCITRANT"
      - question: "What English word also derived from <latin>calx</latin> is a “road or path raised above the natural level of the ground”?"
        answer: "CAUSEWAY"
  - tossup:
      question: "What imperial complex lay just southeast of the Circus Maximus, featured two <latin>palaestrae</latin>, and was completed in 217 AD, the same year as the murder of its namesake, a son of Septimius Severus?"
      answer: "BATHS OF CARACALLA"
    boni:
      - question: "What baths lay near the Aurelian Wall near the Porta Nomentana and almost directly north of the Baths of Caracalla?"
        answer: "(BATHS OF) DIOCLETIAN"
      - question: "What bath complex was built on the Quirinal Hill and was the last of the imperial <latin>thermae</latin>?"
        answer: "(BATHS OF) CONSTANTINE"
  - tossup:
      question: "Among what group did a son of Eurymus named Telemus act as a prophet, including predicting that Odysseus would come and poke out the single eye of Polyphemus?"
      answer: "CYCLOP(E)S"
    boni:
      - question: "Odysseus’ men visited the land of the Cyclopes immediately after leaving what people?"
        answer: "LOTUS-EATERS / <latin>LOTOPHAGOI</latin>"
      - question: "What woman was the mother of Polyphemus?"
        answer: "THOÖSA"
  - tossup:
      question: "Listen to the following passage about a gopher, for which we will use <latin>gopher, gopherī</latin>, which I will read twice, then respond in English to the questions that follow: <latin>“Agricola ōlim in hortō suō gopherum invēnit, quī sub terrā vītam ēgit. Gopher versābātur in flōribus, herbīs, holeribus, frūctibus, quōs agricola cūrāvit, et terram dīripuit. Mox terra cava et sicca et macra facta est. Agricola gopherum repellere cōnābātur nē hortum eius dēpraedārētur. Gopher, tandem, erat tam plēnus cibī ut ab agricolā vix dēcurreret.”</latin> The question: How is the land described following the efforts of the pesky gopher?"
      answer: "EMPTY / DRY / BARREN / ETC."
    boni:
      - question: "Name three things the farmer grew that the gopher was interested in."
        answer: "3 OF: FLOWERS, GRASSES / HERBS, VEGETABLES, FRUITS"
      - question: "What problem plagued the gopher while making his escape?"
        answer: "HE WAS SO FULL OF FOOD, ESCAPING WAS DIFFICULT (and similar)"
  - tossup:
      question: "What man—whose reign was deeply influenced by the praetorian prefect Anthemius, his wife Athenaïs, who later took the name Aelia Eudoxia, and his sister Pulcheria—succeeded Arcadius when he was just 7 years old and ruled the Eastern Empire from 408-450 AD?"
      answer: "THEODOSIUS II"
    boni:
      - question: "What kind of institution did Theodosius II build in Constantinople in 425 AD which rivaled those in Alexandria and Athens?"
        answer: "A UNIVERSITY"
      - question: "What emperor succeeded Theodosius II and ruled in the east from 450-457 AD?"
        answer: "MARCIAN"