tournament: NJCL Certamen
year: 2023
division: Advanced
round: Round 3
questions:
  - tossup:
      question: "What author, whose work contains the banquet of Granius and attacks against Lentulus Lupus, was the first man of an aristocratic family to become a writer and wrote 30 books of satires?"
      answer: "(C.) LUCILIUS"
    boni:
      - question: "Lucilius was a member of what man’s literary circle, which also included Terence, Panaetius, and Laelius?"
        answer: "(P. CORNELIUS) SCIPIO AEMILIANUS’S"
      - question: "Lucilius was known to be the first satirist to write in what meter, which became the standard meter for satire from then on?"
        answer: "(DACTYLIC) HEXAMETER"
  - tossup:
      question: "Distinguish in meaning between the verbs <latin>colō</latin> and <latin>cōgō</latin>."
      answer: "<latin>COLŌ</latin> - TO CULTIVATE / TEND / TAKE CARE OF / WORSHIP; <latin>CŌGŌ</latin> - TO COLLECT / ASSEMBLE / DRIVE / PUSH / FORCE / COMPEL"
    boni:
      - question: "Distinguish in meaning between the verbs <latin>fingō</latin> and <latin>fīgō</latin>."
        answer: "<latin>FINGŌ</latin> - TO TOUCH / HANDLE / FORM / SHAPE / PRETEND; <latin>FĪGŌ</latin> - TO FIX / FASTEN / ATTACH"
      - question: "Distinguish in meaning between the verbs <latin>minuō</latin> and <latin>minor</latin>."
        answer: "<latin>MINUŌ</latin> - TO LESSEN / DIMINISH / WEAKEN; <latin>MINOR</latin> - TO THREATEN"
  - tossup:
      question: "In a mausoleum on the <title>Via <latin>Praenestīna</latin></title>, what emperor buried his mother, the influential Augusta Helena, and later followed her in adopting the Christian faith though he didn’t convert until his death in 337 AD?"
      answer: "(FLAVIUS) CONSTANTINUS / CONSTANTINE I / THE GREAT"
    boni:
      - question: "What man divorced Helena in order to marry Maximian’s step-daughter to help solidify the tetrarchy in 293 AD?"
        answer: "CONSTANTIUS CHLORUS / I"
      - question: "What daughter of Diocletian did Galerius marry in the same year?"
        answer: "(GALERIA) VALERIA"
  - tossup:
      question: "What sort of event, from which the voices of cranes helped Megarus flee, caused an oracle of Themis to say “throw your mother’s bones over your shoulder” to Deucalion and Pyrrha?"
      answer: "FLOOD / DELUGE"
    boni:
      - question: "On what mountain did Deucalion and Pyrrha land after their long voyage?"
        answer: "(MT.) PARNASSUS"
      - question: "What creatures, who invented the making of statues of the gods, fled to Asia after divining the coming of this flood?"
        answer: "TELCHINES"
  - tossup:
      question: "Listen to the following passage about Grimace or <latin>Vultus Distortus</latin>, which I will read twice, then answer the question that follows in ENGLISH: <latin>ōlim erat animal magnum, rotundum, et purpureum, nōmine Vultus Distortus. illud lacte glaciālī bibendō tam fruebātur ut saepe hominēs aliquid bibentēs sequeretur et pōcula raperet. sed nōn multī īrascebantur propter benignitātem Vultūs Distortī. Ergo, diē eius natālī, genus novum lactis glaciālis factum est, tam dulce et tam purpureum quam hoc animal insolitum.</latin>"
      answer: "PEOPLE DRINKING (SOMETHING / MILKSHAKES / FROZEN MILK)"
    boni:
      - question: "Why were most people not angry when Grimace stole their cups?"
        answer: "BECAUSE OF ITS / HIS NICENESS / KINDNESS"
      - question: "The passage continues: <latin>quaedam puella “felicem natālem, Vultus Distorte” exclāmāvit et pōculum purpureum hausit. sed nescīvit sē numquam aliquid plūs locutūram ob pōtiōnem nefastam. ēheu!</latin> What did the girl not know after wishing Grimace a happy birthday?"
        answer: "THAT SHE WOULD NEVER SAY ANYTHING ELSE / MORE // THAT THOSE WERE HER LAST WORDS"
  - tossup:
      question: "What man held the <latin>cura annōnae</latin> as quaestor in Ostia before becoming tribune and passing a <title><latin>Lēx Appulēia dē Maiestāte</latin></title> which punished Servilius Caepio for the disaster at Arausio? He ultimately was the target of a <latin>senātūs cōnsultum ultimum</latin> wielded by Marius for instigating mob violence."
      answer: "(L. APPULEIUS) SATURNINUS"
    boni:
      - question: "What ally of Saturninus attempted to illegally run for the consulship of 99 BC and was killed during the upheaval of the <latin>senātūs cōnsultum ultimum</latin>?"
        answer: "(C. SERVILIUS) GLAUCIA"
      - question: "What consul of 115 BC and author of an autobiography, the <title><latin>Dē Vītā Suā</latin></title>, had superseded Saturninus’ <latin>cura annōnae</latin>, which helped turn Saturninus against the nobility?"
        answer: "(M. AEMILIUS) SCAURUS"
  - tossup:
      question: "What man was inspired by the teeth in a snake’s jawbone to create the saw, causing him to be flung off the Acropolis and turned to a partridge when his uncle Daedalus got jealous?"
      answer: "PERDIX / TALUS / CALUS"
    boni:
      - question: "What was the name of Daedalus’ sister, the mother of this young inventor?"
        answer: "PERDIX"
      - question: "Name either of the other two inventions with which this young inventor was sometimes credited."
        answer: "(GEOMETRIC) COMPASS / POTTER’S WHEEL"
  - tossup:
      question: "Stylistic asymmetry, or <latin>inconcinnitas</latin>, characterizes the works of what author, who wrote a historical work in monographic form on the war against Catiline?"
      answer: "(C.) SALLUST(IUS CRISPUS)"
    boni:
      - question: "Sallust wrote another historical monograph on the wars against what foreign ruler?"
        answer: "JUGURTHA"
      - question: "What work of Sallust is incomplete and narrates events from 78 to 67 BC?"
        answer: "<title><latin>HISTORIAE</latin></title> / <title>HISTORIES</title>"
  - tossup:
      question: "In the English sentence “If we were present at school, we would be happy,” say in Latin, “we would be happy.”"
      answer: "(NŌS) LAETĪ/AE/Ā ESSĒMUS // (NŌS) GAUDĒRĒMUS / LAETĀRĒMUR"
    boni:
      - question: "Now translate this sentence into English: <latin>nisi magister homō maximae sapientiae fuisset, dēspērāvissēmus.</latin>"
        answer: "IF THE / OUR TEACHER HAD NOT BEEN A PERSON OF THE GREATEST WISDOM, WE WOULD HAVE DESPAIRED / GIVEN UP HOPE"
      - question: "Now translate this sentence into English: <latin>sī quid agere velītis, tantum nūmina petātis.</latin>"
        answer: "IF YOU (ALL SHOULD) WANT TO DO ANYTHING, (YOU SHOULD / WOULD) JUST / ONLY / MERELY ASK THE GODS / SPIRITS"
  - tossup:
      question: "When recognized by the moderator, perform or describe the following commands, keeping in mind to be safe: <latin>soleam tuam rēmovē, et tūtissimē eam iace.</latin>"
      answer: "STUDENT SHOULD REMOVE THEIR OWN SHOE AND VERY SAFELY TOSS IT"
    boni:
      - question: "<latin>Multipliciter pulsāte manū vestrā manum alīus hominis.</latin>"
        answer: "MULTIPLE STUDENTS SHOULD SLAP HANDS / HIGH FIVE (ANYONE) MULTIPLE TIMES"
      - question: "<latin>Quīnquiēns plaudite et dīcite</latin> English, “<latin>eāmus, aquilae</latin>.”"
        answer: "AT LEAST TWO STUDENTS CLAP 5 TIMES AND SAY “LET’S GO EAGLES”"
  - tossup:
      question: "Change the Latin phrase <latin>īdem locus</latin> to the genitive singular, which means “of the same place”."
      answer: "<latin>EIUSDEM LOCĪ</latin>"
    boni:
      - question: "Change the Latin phrase <latin>īdem locus</latin> to the nominative plural, which means “the same places”."
        answer: "<latin>EADEM LOCA / (E)ĪDEM LOCĪ</latin>"
      - question: "Now, using a comparative form of <latin>idōneus</latin>, say in Latin, “there are more suitable places”."
        answer: "<latin>SUNT MAGIS IDŌNEA LOCA / IDŌNEĪ LOCĪ</latin>"
  - tossup:
      question: "What abbreviation originally comes from the two-word Latin phrase <latin>vidēre licet</latin>, which is contracted to the single word <latin>vidēlicet</latin>, meaning “namely”?"
      answer: "viz."
    boni:
      - question: "Give the Latin for the abbreviation q.s., used on prescriptions to indicate the pharmacist should dispense an amount suitable for the need."
        answer: "<latin>QUANTUM SUFFICIT / SATIS</latin>"
      - question: "Coins of the late Queen Elizabeth II bear the inscription <latin>D G REG F D</latin>. Give the Latin and English for either <latin>D G</latin> or <latin>F D</latin>."
        answer: "<latin>DEĪ GRĀTIĀ</latin>, BY THE GRACE OF GOD // <latin>FIDEĪ DĒFĒNSātrīx / DĒFĒNSOR</latin>, DEFENDER OF THE FAITH"
  - tossup:
      question: "What work, dedicated to Gaius Memmius, expounds on Epicureanism and provides explanations for various physical and natural phenomena in 6 books of dactylic hexameter and was written by Lucretius?"
      answer: "<title><latin>DĒ RĒRUM NĀTŪRĀ</latin></title>"
    boni:
      - question: "The preface of the <title><latin>Dē Rērum Nātūrā</latin></title> contains an address to which goddess?"
        answer: "VENUS (GENETRIX)"
      - question: "According to Jerome, the <title><latin>Dē Rērum Nātūrā</latin></title> was revised and published by what author?"
        answer: "(M. TULLIUS) CICERO"
  - tossup:
      question: "After slaying the chieftain Deldo of the Bastarnae in single combat, what grandson of a triumvir was denied the honor of the <latin>spolia opīma</latin> by Octavian?"
      answer: "(M. LICINIUS) CRASSUS (THE YOUNGER)"
    boni:
      - question: "What prefect of Egypt was recalled by Octavian in 29 BC for setting up statues of himself?"
        answer: "CORNELIUS GALLUS"
      - question: "Before his suicide, Cornelius Gallus had pushed the frontier of Roman Egypt down to the First Cataract of the Nile. In 25 BC, what title was used for the Queen of Ethiopia who attacked the Romans there?"
        answer: "CANDACE"
  - tossup:
      question: "What mythological location do characters leave through a gate of ivory after a parade of heroes is shown by the Sibyl and the deceased Anchises to Aeneas?"
      answer: "(THE) UNDERWORLD / DIS / PLUTO / EREBUS / HADES (IN THE <title>AENEID</title>)"
    boni:
      - question: "In the <title>Aeneid</title>, Aeneas reaches the Underworld by entering a cave near what lake?"
        answer: "(LAKE) AVERNUS / AORNOS"
      - question: "In the Underworld, Aeneas sees what person, “now a woman, once a young man, returned by her fate to her own form again”?"
        answer: "CAENIS / CAENEUS"
  - tossup:
      question: "Identify the author of the following scene from Latin literature: <latin>Erat Mīsēnī classemque imperiō praesēns regēbat. Nōnum Kalendās Septembrēs hōrā ferē septimā māter mea indicat eī appārēre nūbem inūsitātā et magnitūdine et speciē. … Nūbēs — incertum procul intuentibus ex quō monte; Vesuvium fuisse posteā cognitum est — oriēbātur.</latin>"
      answer: "(C. CAECILIUS) PLINIUS SECUNDUS / PLINY THE YOUNGER (Ep. 6.16.4-5)"
    boni:
      - question: "Which Roman poet provides the source material for the scene depicted in letter A?"
        answer: "(M. ANNAEUS) LUCAN(US)"
      - question: "Which Roman author provides the source material for the scene depicted in letter C?"
        answer: "(A.) GELLIUS"
  - tossup:
      question: "Rationalized by Pausanias as a female bandit on Mount Phicium, what “strangler” asked Boeotian travelers a cryptic riddle to which Oedipus gave the answer of “man”?"
      answer: "(THE) SPHINX"
    boni:
      - question: "What man was usually identified as the last victim of the Sphinx?"
        answer: "HAEMON"
      - question: "According to one story, Hera sent the Sphinx to punish Thebes when they did not punish Laius for abducting what youth?"
        answer: "CHRYSIPPUS"
  - tossup:
      question: "Give the Latin verb and its meaning from which we derive “entreatment,” “portrait,” “trace,” and “trailer.”"
      answer: "<latin>TRAHŌ (TRAHERE)</latin> - TO DRAG"
    boni:
      - question: "What derivative of <latin>trahō</latin> is defined as “a written work dealing comprehensively with a subject”?"
        answer: "TREATISE / TRACT"
      - question: "What derivative of <latin>trahō</latin> and a Latin prefix meaning “apart” is defined as “deeply upset”?"
        answer: "DISTRAUGHT"
  - tossup:
      question: "In Augustus’ time, the financial burdens incurred from burials were lessened because of the creation of what structures, which allowed families to store their urns in one place and whose name derives from the Latin word for “dove”?"
      answer: "<latin>COLUMBĀRIUM/A</latin>"
    boni:
      - question: "Before the introduction of <latin>columbāria</latin>, what hill in ancient Rome housed the mass graves of the plebeians known as <latin>puticulī</latin>?"
        answer: "ESQUILINE HILL"
      - question: "What was the Latin term for the sacred boundary of Rome, within which no one was allowed to be buried?"
        answer: "<latin>POMERIUM</latin>"
  - tossup:
      question: "Translate the following sentence from Latin to English: <latin>Certamine actō, nostrīs cum amīcīs gaudeāmus!</latin>"
      answer: "NOW THAT THE ROUND / CONTEST / CERTAMEN IS OVER, LET US REJOICE WITH OUR FRIENDS"
    boni:
      - question: "Now translate this sentence into English: <latin>Moderātor vidētur oblītus esse rogandōrum bonōrum.</latin>"
        answer: "IT SEEMS THAT THE MODERATOR FORGOT ABOUT (ASKING) THE BONI (QUESTIONS)"
      - question: "Finally, translate into English: <latin>Nōbīs mīrandum est utrum hoc certamen umquam perficiat.</latin>"
        answer: "WE MUST WONDER WHETHER THIS ROUND / CONTEST / CERTAMEN WILL EVER END"
