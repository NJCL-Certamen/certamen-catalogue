tournament: "NJCL Certamen"
year: 2023
division: "Advanced"
round: "Finals"
questions:
  - tossup:
      question: "A work on the heresies most widespread in Spain and a book against the Pelagian heresy were written by what author, who was forced to flee Spain due to an invasion by the Vandals and wrote a historical work covering events until the year 417 AD? \t\t"
      answer: "(PAULUS) OROSIUS"
    boni:
      - question: "What was the name of Orosius’s historical work, which was requested by Augustine for use in his <title><latin>Dē Cīvitāte Deī</latin></title>?\t"
        answer: "<title><latin>HISTORIAE ADVERSUS PĀGĀNŌS</latin></title>"
      - question: "What author’s <title><latin>Dē Gubernātiōne Deī</latin></title> disagrees with Orosius’ point of view on contemporary events and insinuated that German invasions were a divine design to punish Christians for their faults?\t"
        answer: "SALVIAN(US)"
  - tossup:
      question: "[Hand out the <emphasis>Visual</emphasis>] You may now open the visual, you have 10 seconds to inspect it \tThis is a relief depicting a scene of Roman comedy <latin>in mediās rēs</latin>. Which stock character is presented second from the left, holding a staff and wearing a beard? \t\t"
      answer: "<latin>SENEX (DURUS)</latin> / (STERN) OLD MAN"
    boni:
      - question: "What is the ancient term for the twin-piped instrument being played by the figure in the center of the frame?\t"
        answer: "<latin>TIBIA(E) /</latin> AULOS / AULOI (prompt on “double flute”;  \t\tcrush dreams on “single flute”)"
      - question: "Which stock character is presented on the far right of the frame, bent at the knee and wearing a broad grimace?\t"
        answer: "<latin>SERVUS CALLIDUS /</latin> CLEVER (EN)SLAVE(D PERSON)"
  - tossup:
      question: "What meaning is shared by the Latin nouns at the ultimate roots of “plagiarism” and “reticular”?\t"
      answer: "NET / SNARE / TRAP"
    boni:
      - question: "What body part, whose name refers to its length and is derived from a Latin distributive numeral, connects the stomach to the small intestine?\t"
        answer: "DUODENUM"
      - question: "What English word, a direct borrowing from a Latin word which means “a spot” or “a stain,” is a part of the eye located near the center of the retina, which processes sharp, straight-ahead vision?\t"
        answer: "MACULA"
  - tossup:
      question: "What sort of ritual caused a feud between Mastusius and Demophon, saved Athens from Eurystheus’ forces with Macaria’s help, and nearly occurred at Aulis to produce winds?"
      answer: "HUMAN / FEMALE SACRIFICE (ON AN ALTAR)"
    boni:
      - question: "What king of Athens sacrificed one of his daughters after an oracle said it was necessary to defeat the forces of Eleusis?\t"
        answer: "ERECHTHEUS"
      - question: "What Locrian man stopped an annual human sacrifice in the town of Temesa by beating a ghostly hero in a boxing-match?\t"
        answer: "EUTHYMUS"
  - tossup:
      question: "What man, while emperor, had 900 million sesterces of debt records burned in the Forum and established the <latin>fossātum Āfricae</latin> to shore up Rome’s southern borders, much as he had done in the north? \t"
      answer: "HADRIAN"
    boni:
      - question: "Before he was “named” as Trajan’s successor, Hadrian had become the ward of Trajan and another man after the deaths of Hadrian’s parents. Name this other guardian of Hadrian, who served as Trajan’s Praetorian Prefect during the final years of his reign. \t\t"
        answer: "(P. ACILIUS) ATTIANUS"
      - question: "There is surprisingly little textual evidence about the construction of Hadrian’s Wall, but we get a sense of what life was like there from a cache of documents dated shortly before its construction. At what major fort along the wall were these documents found? \t\t"
        answer: "VINDOLANDA  <latin>SCORE CHECK</latin>"
  - tossup:
      question: "12 days after he was returned to Troy from custody by Eëtion of Imbros, what son of Laothoë was killed by Achilles, who had once seized him in the orchard of his father Priam?\t"
      answer: "LYCAON"
    boni:
      - question: "Laothoë was also said to be the mother of what son of Priam, often called his youngest? \t\t"
        answer: "POLYDORUS"
      - question: "Achilles had captured Lycaon while he was harvesting tree shoots in Priam’s orchard. Name either the type of tree that he was using or what he was making with them. \t\t"
        answer: "FIG (TREE) / CHARIOT(-RAILS/RIMS)"
  - tossup:
      question: "Translate the following Latin sentence into English: <latin>sīdera sequere domum aviae inventum</latin>.\t"
      answer: "FOLLOW THE STARS / CONSTELLATION(S)  \t\tTO FIND GRANDMOTHER’S HOUSE"
    boni:
      - question: "Now say in Latin as if to a group of people, using a deponent verb, “Depart as soon as possible so that you’re not late.”\t \t\t"
        answer: "<latin>PROFICĪSCIMINĪ / ĒGREDIMINI QUAMPRĪMUM NĒ TARDĪ/AE/A SĪTIS</latin>"
      - question: "Now say in Latin to that same group using a future imperative: “Remember to enjoy your journey by looking at the flowers!”\t"
        answer: "<latin>MEMENTŌTE FRUĪ (VESTRŌ) ITINERE  \t\tFLŌRIBUS SPECTANDĪS / FLŌRĒS SPECTANDŌ</latin>"
  - tossup:
      question: "Suetonius said <latin>docuit multōs et nōbilēs vīsusque est peridōneus praeceptor</latin> about what author and “Latin siren,” who created an edition of Lucilius and wrote epyllia called <title>Lydia</title> and <title>Dictynna</title>?\t"
      answer: "VALERIUS CATO"
    boni:
      - question: "What neoteric poet wrote a historical poem on Caesar’s campaign against Ariovistus and erotic poetry to Leucadia?\t"
        answer: "(P. TERENTIUS) VARRO OF ATAX / <latin>ATACINUS</latin>"
      - question: "Catullus referred to what poet as a <latin>salaputium</latin> <latin>disertum</latin> in his 53rd poem? \t\t"
        answer: "(LICINIUS) CALVUS"
  - tossup:
      question: "In what war did negotiations at the Locrian city of Nicaea stall when one side refused to cede control of Demetrias, Chalcis, and Acrocorinth, the so-called “Three Fetters” of Philip V?\t"
      answer: "SECOND MACEDONIAN (WAR)"
    boni:
      - question: "A skirmish along what river in 198 BC between the forces of Flamininus and Philip V began the Second Macedonian War?\t"
        answer: "AOÜS (RIVER)"
      - question: "What Greek <title>strategos</title> in the Achaean League later allied with Flamininus against the Spartan king Nabis?\t"
        answer: "PHILOPOEMEN"
  - tossup:
      question: "Of the nouns <latin>angustia, dēlūbrum, foedus, lētum</latin>, and <latin>rabiēs</latin>, which is being described by the following Latin sentence: <latin>effigiēs deōrum in hōc locō vidērī poterant</latin>?\t \t\t"
      answer: "DĒLŪBRUM"
    boni:
      - question: "Of the nouns <latin>angustia, dēlūbrum, foedus, lētum</latin>, and <latin>rabiēs</latin>, which is being described by this Latin sentence: <latin>id quod omnibus hominibus accidet?</latin>\t"
        answer: "<latin>LĒTUM</latin>"
      - question: "Of the nouns <latin>angustia, dēlūbrum, foedus, lētum</latin>, and <latin>rabiēs</latin>, which is being described by this Latin sentence: <latin>est coniunctio civitātum ut pax efficerētur</latin>.\t"
        answer: "<latin>FOEDUS</latin>  <latin>SCORE CHECK</latin>"
  - tossup:
      question: "In the <title>Aeneid</title>, Orodes prophesies the death of what man — the rider of the horse Rhaebus and the ruler of Caere — before he duels Aeneas in the hopes of avenging Lausus’ death?"
      answer: "MEZENTIUS"
    boni:
      - question: "What king of the Etruscans fought alongside Aeneas out of hatred for Mezentius?\t\t"
        answer: "TARCHON"
      - question: "According to one story, a man named Tarchon uncovered what autochthonous Etruscan prophet while plowing?\t"
        answer: "TAGES"
  - tossup:
      question: "A letter from Arethusa to Lycotas and <latin>epicēdia</latin> to Cornelia and Marcellus are included in the work of what Roman author, who expounded upon the origin of the myths and cults of Rome in the style of the <title><latin>Aitia</latin></title> by Callimachus?\t"
      answer: "(SEX.) PROPERTIUS"
    boni:
      - question: "In Book 1 of his elegies, Propertius does not mention politics except for a single reference to what war?\t"
        answer: "THE PERUSINE WAR / <latin>BELLUM PERUSINUM</latin>"
      - question: "What later author reveals the true names of many of the women whom famous Roman elegists called by pseudonyms including Propertius’ Cynthia? \t\t"
        answer: "(L.) APULEIUS (MADAURENSIS)"
  - tossup:
      question: "With command of the third legion <latin>Augusta</latin>, what governor of Numidia marched on Carthage and overwhelmed the forces of Gordian II, ending their joint reign after only 20 days?\t"
      answer: "CAPELLIANUS"
    boni:
      - question: "What praetorian prefect defeated Shapur I in 243 AD, allowing the Romans to regain control of Carrhae and Nisibis?\t \t\t"
        answer: "(C. FURIUS SABINIUS AQUILA) TIMESITHEUS / TIMISTHEUS"
      - question: "At what battle of 243 AD in northern Mesopotamia did Gordian III and Timesitheus defeat Shapur?\t"
        answer: "(BATTLE OF) RESAENA / R(H)ESAINA"
  - tossup:
      question: "Listen carefully to the following passage about passages or <latin>locī</latin>, which I will read twice, then <latin>respondē Latīne</latin> to the questions that follow: \t<latin>Ōlim erant moderātōrēs quī roganda inspiciēbant nē imparātī ad conventiōnem nationālem advenīrent. subitō quīdam moderātor cāsum dīrum, roganda in quibus discipulī locōs audiunt āmissa esse, animadvertit. “Ēheu” flēbant cēterī, quod omnēs moderātōrēs sciēbant discipulōs locōs amāre sed locōs difficillimōs scriptū esse. Moderātor ignāvus exclāmāvit “Quid faciāmus? Quō modō quīnque diēbus quīnque locōs scrībēmus?”</latin>"
      answer: "REREAD"
    boni:
      - question: "<latin>Secundum locum, quōmodo dē locīs sentiunt discipulī?</latin>"
        answer: "AMANT / AMĀMUS (LOCŌS)"
      - question: "<latin>Quō tempore locī perficiendī erant?</latin>"
        answer: "QUINQUE DIĒBUS // QUINTŌ/Ā DIĒ "
  - tossup:
      question: "Translate the following sentence into English: <latin>rērum nātūra dīligentissimē legendō spectāndōque erit discenda.</latin>\t"
      answer: "THE NATURE / COURSE / ORDER OF THINGS  \t\tWILL HAVE TO BE LEARNED BY / IN / THROUGH MOST DILIGENTLY  \t\tREADING / CHOOSING AND WATCHING"
    boni:
      - question: "Now translate this sentence into English: <latin>perfacile est cum iudiciō inoptātō dissensū, arduum autem cum eōdem consensū.</latin>\t \t\t"
        answer: "IT IS (VERY) EASY TO DISAGREE WITH AN UNDESIRED JUDGMENT; \tHOWEVER / BUT DIFFICULT TO AGREE WITH THE SAME (JUDGMENT)"
      - question: "Say in Latin using a gerundive: “We become better by carrying out our duties.”\t\t"
        answer: "<latin>(NŌS) MELIŌRĒS OFFICIĪS / MŪNERIBUS PER/CŌN/EFFICIENDĪS FĪMUS  SCORE CHECK</latin>"
  - tossup:
      question: "Although it was meant to be a universal history, what work only had two books focusing on the history of Rome and western regions, and instead expounded upon the history of Macedon in the majority of its 44 books? \t\t"
      answer: "(POMPEIUS TROGUS’S) <title><latin>HISTORIAE PHILLIPICAE</latin></title> <title>/ PHILLIPIC HISTORIES</title>"
    boni:
      - question: "What cavalry commander of Tiberius wrote a historical work dedicated to Marcus Vinicius that included a panegyric of Tiberius?\t"
        answer: "(VELLEIUS) PATERCULUS"
      - question: "What author during the reign of Tiberius composed a work that praised Cassius as the last of the Romans and was originally ordered to be burnt by Sejanus but was saved?\t\t"
        answer: "(A.) CREMUTIUS CORDUS"
  - tossup:
      question: "Adopted in 2020, translate the Latin motto of the United States Space Force: <latin>semper suprā</latin>.\t"
      answer: "ALWAYS ABOVE"
    boni:
      - question: "Related to the state motto of Kansas, give the Latin motto of the Royal Air Force of the UK. It is also shared by the air forces of Australia and New Zealand.\t \t\t"
        answer: "PER ARDUA AD ASTRA"
      - question: "Give the related celestial motto for the Royal Canadian Air Force, a quote from Book 9 of the <title>Aeneid</title> meaning, “thus one goes to the stars.”\t"
        answer: "<latin>SĪC ĪTUR AD ASTRA</latin>"
  - tossup:
      question: "When recognized by the spotter, perform or describe the following commands: <latin>Surgās et simulēs tē nummum in āëre versāre.</latin> \t\t"
      answer: "STUDENT SHOULD STAND AND <emphasis>PRETEND</emphasis> TO FLIP A COIN IN THE AIR"
    boni:
      - question: "<latin>Surge, tē amplectere, et dīc Anglicē, “Ego sum amīcus meus cārissimus.”</latin>\t \t\t"
        answer: "ONE STUDENT STANDS, HUGS THEMSELF, AND SAYS,  \t\t“I AM MY (OWN) BEST / DEAREST FRIEND”"
      - question: "<latin>Queriminī quod algētis.</latin> \t\t"
        answer: "AT LEAST TWO STUDENTS COMPLAIN BECAUSE THEY ARE COLD"
  - tossup:
      question: "Which of the following provinces during the time of Trajan lay furthest east: <latin>Creta et Cyrenaïca, Moesia Superior, Galatia, Cilicia</latin>?\t"
      answer: "<latin>CILICIA</latin>"
    boni:
      - question: "Which of the following provinces during the time of Trajan lay furthest west: <latin>Pannonia Superior, Noricum, Moesia Inferior,</latin> or <latin>Dalmatia</latin>?\t"
        answer: "NORICUM"
      - question: "Which province contained the city of Tomi or <latin>Tomis</latin>, the exile place of Ovid?"
        answer: "<latin>MOESIA INFERIOR</latin>"
  - tossup:
      question: "What mountain’s crag of Coddinus was carved with an old image of Cybele by Broteas, whose sister turned to stone on it when she could not stop weeping for her slain children?"
      answer: "(MOUNT) SIPYLUS"
    boni:
      - question: "Which of Niobe’s children survived the killing of her siblings and was renamed when she became permanently pale with fear during the killing?\t"
        answer: "MELIBOEA / CHLORIS"
      - question: "According to one story, Zeus threw Mount Sipylus on Tantalus when Tantalus abetted what man’s theft of a guard-dog from Zeus’ shrine on Crete?\t"
        answer: "PANDAREUS"
