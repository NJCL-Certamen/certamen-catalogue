tournament: "NJCL Certamen"
year: 2023
division: "Advanced"
round: "Semifinals"
questions:
  - tossup:
      question: "What author wrote a historical work covering the reign of Romulus to the death of Jovian at the request of the emperor Valens, under whom he served as <latin>magister memoriae</latin>? \t\t"
      answer: "EUTROPIUS"
    boni:
      - question: "What author’s 31-book historical work covered the reign of Nerva to the death of Valens at Adrianople?\t"
        answer: "(AMMIANUS) MARCELLINUS’S"
      - question: "What historical work, attributed to six different authors, covers the period from 96 to 284 AD?\t"
        answer: "<title><latin>HISTORIA AUGUSTA</latin></title>"
  - tossup:
      question: "When recognized, perform or describe the following commands: <latin>Aperī dōnum nātāle, sed dōnum tibi nōn placet.</latin> \t"
      answer: "STUDENT SHOULD PRETEND TO OPEN  \t\tA BIRTHDAY GIFT, BUT THEY DON’T LIKE IT"
    boni:
      - question: "<latin>Comedite cibum sicut porcī ēsurientēs.</latin>  \t\t"
        answer: "AT LEAST TWO STUDENTS PRETEND TO EAT LIKE PIGS"
      - question: "In honor of Shark Week, which is very bad for seals: <latin>Simulāte vōs phocās esse, quī ā squatīnā dēvorantur</latin>. \t\t"
        answer: "AT LEAST TWO STUDENTS PRETEND TO BE SEALS  \t\tBEING DEVOURED BY A SHARK"
  - tossup:
      question: "What is the meaning of the Latin body part at the root of “cutlet” and “coast”?\t \t\t"
      answer: "RIB (<latin>COSTA</latin>)"
    boni:
      - question: "What is the meaning of the Latin body part at the root of “adrenaline”?\t \t\t"
        answer: "KIDNEY (<latin>RĒN / RĒNĒS</latin>)"
      - question: "The word “trivet” is also derived from the Latin term for a body part. What is the meaning of the Latin body part at the root of “trivet”?\t"
        answer: "FOOT (<latin>PĒS</latin>)"
  - tossup:
      question: "What giant was honored with a grave at Panopeus and in a cave called the Elarium, named for his mother Elare, though he was punished in Hades for trying to rape Leto?"
      answer: "TITYUS / TITYOS"
    boni:
      - question: "Over how many acres was Tityus’ body stretched in the Underworld?\t"
        answer: "NINE"
      - question: "Tityus was the grandfather of what Argonaut, who was the progenitor of the colonizers of the island of Thera?\t"
        answer: "EUPHEMUS"
  - tossup:
      question: "Listen to the following passage about the intrepid <latin>Indiāna Iōhannēs</latin>, which I will read twice, then respond IN LATIN to the questions that follow: \t<latin>mīlitēs Germānī fēminam virumque fūnibus vinctōs in spēluncam dēmittunt. lūmen sōlum in cavernā spargitur aliquot facibus, quae post hominēs dēiciuntur. prīmō silentium, tum mōtus, subitō sībilus. “anguēs ōdī,” gemit Indiāna Iōhannēs, et facem rapit vix ante morsum serpentis. ille tremit et immōtus consistit</latin>"
      answer: "REREAD"
    boni:
      - question: "\t<latin>quid audit Indiāna ut serpentēs adesse cōgnōscat?</latin> "
        answer: "<latin>SĪBILUM / SŌNUM SERPENTIS</latin> "
      - question: "The adventure continues: <latin>fēmina Mariāna, autem, auram levem āgnōscēns, dēclārat, “nē vereāris, Indiāna, et festinēmus illūc! exitum post illum parietem cavum inveniēmus.”</latin> \tThe question: <latin>quōmodo reperitur modus fugiendī ā Mariānā?</latin>\t "
        answer: "AURAM (LEVEM) ĀGNŌSCIT // PARIETEM ESSE CAVUM ĀGNŌSCIT // \t\tPARIETE CAVŌ // PARIĒS EST CAVUS // EUNT POST PARIETEM "
  - tossup:
      question: "[Hand out the <emphasis>Visual</emphasis>] You now have 5 seconds to inspect the visual. \tName site “D”, a fortified hill where Julius Caesar’s army employed circumvallation and contravallation to decisively defeat the forces of Vercingetorix in 52 BC.\t"
      answer: "ALESIA"
    boni:
      - question: "Which letter corresponds to Atuatuca, the site where Ambiorix massacred the forces of Titurius Sabinus and Aurunculeius Cotta after tricking them into leaving their camp?"
        answer: "“F”"
      - question: "Identify the site by name and letter where Caesar attempted to block the migration of the Helvetians by destroying its bridge over the Rhône river."
        answer: "“C”, (LAKE) GENEVA / <latin>GENĀVA / GENNA / GENĒVA / LACUS LEMMANUS</latin>"
  - tossup:
      question: "The people of Celaenae supposedly honored what man and his pupil Olympus, despite the fact that his flayed skin still hung in its town square after he lost a musical duel to Apollo?\t"
      answer: "MARSYAS"
    boni:
      - question: "According to Hyginus, Apollo defeated Marsyas by doing what with his lyre—a technique that Marsyas was unable to replicate with his flute? \t\t"
        answer: "PLAYED IT UPSIDE-DOWN (ACCEPT EQUIVALENTS)"
      - question: "The Phrygians claim that Marsyas appeared to help them in their wars against what invaders, whom the ghost of Neoptolemus drove away from Delphi?\t"
        answer: "GAULS"
  - tossup:
      question: "In Latin literature, which mythological figure is the subject of lost plays written by both Lucan and Ovid, a tragedy by Seneca the Younger, and is one of the women in Ovid’s <title>Heroides</title> who wrote letters to Jason?\t"
      answer: "MEDEA"
    boni:
      - question: "What 1st century BC Latin author wrote a lost play entitled <title><latin>Oedipus</latin></title>?\t \t\t"
        answer: "(C. IULIUS) CAESAR"
      - question: "What Latin author retells the story of Jason and the Golden Fleece in an unpublished epic poem entitled <title><latin>Argonautica</latin></title> that is dedicated to Vespasian? \t\t"
        answer: "(C.) VALERIUS FLACCUS (BALBUS SETINUS)"
  - tossup:
      question: "What use of the subjunctive is found in this Latin sentence, which is adapted from Cicero’s 1st <title>Catilinarian</title>: <latin>Quem nostrum ignōrāre putās quid proximā, quid superiōre nocte ēgerīs?</latin>\t"
      answer: "INDIRECT QUESTION (Allow descriptions)"
    boni:
      - question: "What use of the subjunctive is found in this Latin sentence, taken from Cicero’s <title>1st Philippic</title>: <latin>Ecce enim Kalendīs Iuniīs, quibus ut adessēmus ēdīxerat, mūtāta omnia?</latin>\t\t"
        answer: "INDIRECT COMMAND"
      - question: "What use of the subjunctive is found in this Latin sentence, from Book 7 of Vitruvius’ <title><latin>Dē Architectūrā</latin></title>: <latin>et sī plānō pede erit ērūderandum, quaerātur sōlum…solidum?</latin>\t\t"
        answer: "JUSSIVE / HORTATORY"
  - tossup:
      question: "Translate only the gerundive phrase found in the following Latin sentence: <latin>hospitēs ad mē adiuvandum montēs ascendere quam celerrimē adoriēbantur.</latin>\t\t"
      answer: "(IN ORDER) TO HELP ME (ASCEND THE MOUNTAINS)"
    boni:
      - question: "Translate the following sentence into Latin: “I had hoped that my friends would envy me.”\t"
        answer: "<latin>SPĒRĀVERAM (MEŌS) AMĪCŌS MIHI INVĪSŪRŌS ESSE // \t\tSPĒRĀVERAM FUTŪRUM ESSE / FORE UT AMĪCĪ MIHI INVIDĒRENT</latin>"
      - question: "Now translate this sentence into Latin using a supine: “On the tenth day before the Kalends, I will come down from the mountain to address you.”\t\t"
        answer: "<latin>ANTE DIEM (UN)DECIMUM KALENDĀS,  \t\tTĒ ALLOCŪTUM / APPELLĀTUM DĒ MONTE DĒSCENDAM.  SCORE CHECK</latin>"
  - tossup:
      question: "<title>Oedipothyestes</title>, <title>Eumenides</title>, <title>Marcopolis</title>, and <title>Sexagesis</title> are titles of stories contained in what massive 150 book work of prose mixed with poetry authored by Varro Reatinus? \t\t"
      answer: "<title><latin>SATURAE MENIPPEAE</latin></title> <title>/ MENIPPEAN SATIRES</title>"
    boni:
      - question: "What other work of Varro, preserved in Augustine’s <title><latin>Dē Cīvitāte Deī</latin></title>, sets the founding date of Rome at 754 BC and was said to be used by Vergil in composing the Aeneid? \t\t"
        answer: "<title><latin>ANTĪQUITĀTĒS (RĒRUM HŪMĀNĀRUM ET DĪVĪNĀRUM)</latin></title>"
      - question: "What grammatical work of Varro Reatinus is dedicated to Accius? \t\t"
        answer: "<title><latin>DĒ ANTĪQUITĀTE LITTERĀRUM</latin></title>"
  - tossup:
      question: "What consul marched through the dense Ciminian Forest, outflanked an advancing Etruscan army, and defeated them near Lake Vadimo in 310 BC, redeeming his previous defeat to the Samnites at the Battle of Lautulae? \t\t"
      answer: "(Q. FABIUS MAXIMUS) RULLIANUS"
    boni:
      - question: "What Roman general defeated the Boii at Lake Vadimo in 283 BC?"
        answer: "(P. CORNELIUS) DOLABELLA"
      - question: "What Etrurian city was likely annexed by Rome in 273 BC with a grant of <latin>cīvitās sine suffrāgiō</latin>, perhaps because it sheltered the Vestal Virgins when they fled the sack of Rome by Brennus?\t"
        answer: "CAERE / CERVETERI"
  - tossup:
      question: "\t<latin>Respondē Latīnē: quis sum? ego ex urnīs pro tabernīs stantibus ūrīnam colligō ut vestēs lavem.</latin>\t"
      answer: "FULLŌ / LAVĀTOR / LAVĀTRIX"
    boni:
      - question: "<latin>Respondē Latīnē: quis sum? ego omnēs senātōrēs inspiciō quō melius sciam num satis opum et mōrum habeant.</latin>\t"
        answer: "CENSOR"
      - question: "<latin>Respondē Latīnē: quis sum? pilleō indūtō, ego tandem voluntātem meam sequī possum et līberī meī cīvēs erunt.</latin> \t"
        answer: "LĪBERTUS / LĪBERTA // LĪBERTĪNUS/A"
  - tossup:
      question: "In Ovid’s <title>Metamorphoses</title>, what deity removes all shame from the daughters of Propoëtus as part of her worship on Cyprus, where she also petrified the heartless girl Anaxarete?\t\t"
      answer: "VENUS"
    boni:
      - question: "What city, named for the daughter of Pygmalion and his ivory statue, was Venus’ chief cult center in Cyprus?\t"
        answer: "PAPHOS"
      - question: "In the <title>Metamorphoses</title>, Venus turned a horned Cypriot people, the Cerastae, into what sort of animals?\t"
        answer: "BULL(OCKS)"
  - tossup:
      question: "For the verb <latin>moneō</latin>, provide the second person plural, future, active, imperative form that means “you shall warn!”\t"
      answer: "<latin>MONĒTŌTE</latin>"
    boni:
      - question: "Keeping everything else the same, change <latin>monētōte</latin> to the present and passive so that it means “be warned!”\t"
        answer: "<latin>MONĒMINĪ</latin>"
      - question: "Keeping everything else the same, change <latin>monēminī</latin> to the third person and future so that it means “let them be warned!”\t"
        answer: "<latin>MONENTOR  SCORE CHECK</latin>"
  - tossup:
      question: "What <latin>cognōmen</latin> is shared by a son-in-law of Cinna who was supported by the Numidian chieftain Iarbas in 80 BC, a candidate for consul in 55 BC who intended to recall Caesar from Gaul, and Nero’s father?\t"
      answer: "AHENOBARBUS"
    boni:
      - question: "With Iarbas defeated, what son of Gauda was restored to the throne, ensuring a lasting friendship between the Romans and Numidians?\t"
        answer: "HIEMPSAL (II)"
      - question: "Though the Battle of the Colline Gate ensured Sulla’s control of the Republic, what city in Etruria was not starved out until 79 BC?\t"
        answer: "VOLATERRAE / VOLTERRA"
  - tossup:
      question: "What work of Cicero — dedicated to the memory of his rival Hortensius — includes himself, Atticus, and the title character as interlocutors in a dialogue on Roman and Greek eloquence?\t"
      answer: "<title><latin>BRUTUS</latin></title> // <title><latin>DĒ CLĀRĪS ŌRĀTŌRIBUS</latin></title>"
    boni:
      - question: "Drawing on the <title><latin>Rhetorica ad Herennium</latin></title>, what other work of Cicero was a small and incomplete treatise on rhetoric that was supposedly composed during his youth? \t\t"
        answer: "<title><latin>DĒ INVENTIŌNE</latin></title>"
      - question: "What work of Cicero was intended to be an introduction to translations of speeches of Aeschines and Demosthenes?\t"
        answer: "<title><latin>DĒ OPTIMŌ GENERE ŌRĀTŌRUM</latin></title>"
  - tossup:
      question: "Distinguish in meaning among the Latin adjectives <latin>commodus, commūnis</latin>, and <latin>complūrēs</latin>.\t\t"
      answer: "<latin>COMMODUS</latin> - SUITABLE / PROPER / COMPLETE / PERFECT / CONVENIENT \t\t<latin>COMMŪNIS</latin> - COMMON / GENERAL / PUBLIC / GENERAL\t<latin>COMPLŪRĒS</latin> - SEVERAL / NOT A FEW / MORE THAN ONE / (VERY) MANY"
    boni:
      - question: "Distinguish in meaning among <latin>tumidus, turbidus</latin>, and <latin>turma</latin>."
        answer: "<latin>TUMIDUS</latin> - SWOLLEN / EXCITED / ENRAGED / ARROGANT\t<latin>TURBIDUS</latin> - WILD / CONFUSED / DISORDERED / VIOLENT\t<latin>TURMA</latin> - A SQUADRON / CAVALRY DIVISION / TEAM"
      - question: "Distinguish in meaning among <latin>undique, ūsquam</latin>, and <latin>ūsque</latin>."
        answer: "<latin>UNDIQUE</latin> - FROM ALL SIDES / ON ALL SIDES / EVERYWHERE \t\t<latin>ŪSQUAM</latin> - IN ANY PLACE / ANYWHERE / IN ANY THING / IN ANY WAY \t\t<latin>ŪSQUE</latin> - ALL THE WAY / RIGHT ON / WITHOUT INTERRUPTION / \t\tCONTINUOUSLY / CONSTANTLY"
  - tossup:
      question: "In Homer, contests in what activity are won by Laodamas and by Epeius, though the disguised beggar Odysseus uses this skill more practically to defeat Irus?"
      answer: "BOXING / FIST-FIGHTING / FISTICUFFS / PUGILISM"
    boni:
      - question: "What was Irus’ real name?\t"
        answer: "ARNAEUS"
      - question: "Whom did Epeius defeat in the boxing-match at Patroclus’s funeral games?\t"
        answer: "EURYALUS  <latin>SCORE CHECK</latin>"
  - tossup:
      question: "After the armies of Upper and Lower Germany declared Vitellius emperor, Galba  \tscrambled to find a successor by adopting what man, who proved to be no match in popularity compared to Otho?\t"
      answer: "(L.) CALPURNIUS PISO (FRUGI LICINIANUS) /  \t\t(L. CALPURNIUS PISO FRUGI) LICINIANUS"
    boni:
      - question: "Galba was forced to adopt because his two sons had died several years earlier.  Who was their mother?\t"
        answer: "(AEMILIA) LEPIDA"
      - question: "After falling victim to Otho’s forces, according to Suetonius, the steward Argivus  \trecovered Galba’s head and buried it with the rest of his remains in his private gardens \talong what road?\t"
        answer: "<latin>VIA AURĒLIA</latin>"
