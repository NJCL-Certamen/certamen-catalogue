tournament: "NJCL Certamen"
year: 2023
division: "Intermediate"
round: "Round 2"
questions:
  - tossup:
      question: "Whose attempt to feed his son to the gods earned him the eternal punishment of being just out of reach of food and drink?\t"
      answer: "TANTALUS’"
    boni:
      - question: "Whose attempt to rape Hera earned him the eternal punishment of being strapped to a flaming wheel?\t"
        answer: "IXION’S"
      - question: "For murdering their husbands on their wedding night, what punishment did the Danaïds earn in Hades?\t"
        answer: "HAD TO CARRY WATER IN LEAKY BUCKETS / SIEVES"
  - tossup:
      question: "It’s time for Certamen Caesar Says, except this time, rather than doing the action, state Caesar’s instructions in English. <latin>Caesar dīcit,</latin> “<latin>nōlī clāmāre</latin>.” \t \t\t"
      answer: "(CAESAR SAYS) DON’T SHOUT / YELL (ACCEPT EQUIVALENTS)"
    boni:
      - question: "What is Caesar saying now: <latin>Caesar dīcit, “manēte in ūnō locō.”</latin> \t \t\t"
        answer: "(CAESAR SAYS) STAY / REMAIN IN ONE PLACE (ACCEPT EQUIVALENTS)"
      - question: "Now, translate what Caesar is saying: <latin>Caesar dīcit, “dulcem aquam bibite.”</latin> \t\t"
        answer: "(CAESAR SAYS) DRINK THE SWEET / FRESH WATER (ACCEPT EQUIVALENTS)"
  - tossup:
      question: "Supply the correct participial form of <latin>sciō</latin> needed to render the following sentence into Latin: “Aurelia and Julia walked to the school, knowing that they would learn much there.”\t"
      answer: "<latin>SCIENTĒS</latin>"
    boni:
      - question: "Supply the correct participial form of <latin>cōgnōscō</latin> needed to render the following sentence into Latin: “Aurelia and Julia are about to learn many things in school.”\t"
        answer: "<latin>CŌGNITŪRAE</latin>"
      - question: "Using <latin>doceō</latin> and the ablative absolute construction, translate this sentence into Latin: “After many things had been taught, Aurelia and Julia walked home.” \t\t"
        answer: "<latin>MULTĪS (RĒBUS) DOCTĪS, AURĒLIA ET / ATQUE / AC IŪLIA / IŪLIAQUE \t\tDOMUM AMBULĀBANT / AMBULĀVĒRUNT</latin>"
  - tossup:
      question: "Name the emperors who immediately preceded and succeeded Antoninus Pius"
      answer: "HADRIAN AND (ONE OR BOTH OF) MARCUS AURELIUS AND LUCIUS VERUS"
    boni:
      - question: "Name both the emperors who immediately succeeded Septimius Severus."
        answer: "PERSON 1: GETA; PERSON 2: CARACALLA / MARCUS AURELIUS ANTONINUS / (L. SEPTIMIUS) BASSIANUS"
      - question: "Name the emperors who immediately preceded and succeeded Alexander Severus?"
        answer: "ELAGABALUS / HELIOGABALUS AND MAXIMINUS THRAX"
  - tossup:
      question: "<latin>Quid Anglicē significat “aedificō”</latin>?\t \t\t"
      answer: "TO BUILD (UP) / CONSTRUCT / RAISE / ERECT / ESTABLISH"
    boni:
      - question: "<latin>Quid Anglicē significat “vēscor”</latin>?\t"
        answer: "TO EAT / FEED (UPON) / ENJOY / USE / HAVE /\tBREATHE / BANQUET / FEAST / GRATIFY THE PALATE"
      - question: "<latin>Quid Anglicē significat “inhibeō”</latin>?\t"
        answer: "TO HOLD IN / HOLD BACK / RESTRAIN / \tCHECK / PREVENT / HINDER / INHIBIT / SET IN OPERATION /  \t\tPRACTICE / PERFORM / USE / EMPLOY / INFLICT  <latin>SCORE CHECK</latin>"
  - tossup:
      question: "Sometimes, after successful military campaigns in which at least 5,000 enemies were killed, the Senate bestowed what honor upon the <latin>imperātor</latin> that included a special procession through the center of the city? \t\t"
      answer: "TRIUMPH / <latin>TRIUMPHUS / POMPA TRIUMPHĀLIS</latin>"
    boni:
      - question: "What was the name of the special purple garment with gold embroidery that triumphant leaders would wear during this procession?\t"
        answer: "<latin>TOGA PICTA / TUNICA PALMĀTA</latin>"
      - question: "According to Plutarch, what man, who served as suffect consul with Brutus, celebrated the first triumph in Rome in 509 B.C. after his victory at the Battle of Silva Arsia?\t \t\t"
        answer: "(P. VALERIUS) POPLICOLA / PUBLICOLA"
  - tossup:
      question: "While everyone else was enjoying the entertainment, who burst into tears in the court of the Phaeacians at a song that recounted his struggles at Troy?\t \t\t"
      answer: "ODYSSEUS / ULYSSES / ULIXES"
    boni:
      - question: "Assuming the character labeled as “A” is Arete, who is identified by the letter “B”?"
        answer: "ALCINOÜS"
      - question: "Give both the identifying letter and the name of the bard in this visual."
        answer: "D - DEMODOCUS"
  - tossup:
      question: "Translate the following sentence from Latin to English: <latin>Audiāmus fābulam!</latin> \t\t"
      answer: "LET US / LET’S  / WE MAY / SHOULD HEAR / LISTEN TO \t\tA STORY / PLAY / FABLE"
    boni:
      - question: "Using <latin>fruor</latin> and <latin>fābula</latin>, translate the following question from English to Latin: Do you enjoy plays?\t"
        answer: "<latin>FRUERIS(NE) / FRUIMINĪ(NE) FĀBULĪS</latin>"
      - question: "Using <latin>fruor</latin> and <latin>fābula</latin>, translate the following sentence from English to Latin: Let the spectators enjoy the plays.\t"
        answer: "<latin>SPECTĀTŌRĒS FĀBULĪS FRUANTUR</latin>"
  - tossup:
      question: "What is the Latin noun and its meaning at the root of “animation”?\t \t\t"
      answer: "ANIMA / ANIMUS  - BREATH / SOUL / LIFE / AIR / MIND / SPIRIT"
    boni:
      - question: "What is the Latin verb and its meaning at the root of “accident”? \t "
        answer: "CADŌ / CADERE - TO FALL (DOWN) / DESCEND / SETTLE / SINK // \t\t<latin>ACCIDŌ / ACCIDERE</latin> - TO HAPPEN / OCCUR"
      - question: "What is the Latin verb and its meaning at the root of “pictorial”?\t "
        answer: "PINGŌ / PINGERE - TO PAINT / COLOR"
  - tossup:
      question: "Which emperor introduced the Actia-Dusaria Games, negotiated peace with the Sassanid Empire, erected a cenotaph to Gordian III, and celebrated Rome’s 1,000th anniversary?\t \t\t"
      answer: "(M. IULIUS) PHILIP(PUS) THE ARAB / I"
    boni:
      - question: "Which successor of Philip led a rebellion that ultimately led to the betrayal and death of Philip?\t"
        answer: "DECIUS"
      - question: "At what location of Shakespearean fame did Philip meet Decius in battle in 249 AD?"
        answer: "VERONA"
  - tossup:
      question: "Consider the sentence:  “I always forget that thing!” Please provide the genitive singular form of <latin>rēs</latin> so that it fits the sentence.\t"
      answer: "<latin>REĪ</latin>"
    boni:
      - question: "For the noun <latin>rēs</latin>, provide the dative singular form so that it fits the sentence “This rock looks similar to that thing.”\t"
        answer: "<latin>REĪ</latin>"
      - question: "For the noun <latin>rēs</latin>, provide the nominative plural form so that it fits the sentence “What are those things?”\t"
        answer: "<latin>RĒS</latin>"
  - tossup:
      question: "Under commissions chaired by Appius Claudius and run by <latin>decemvirī</latin>, what body of work officially codified all previous Roman laws in 450 BC?\t \t\t"
      answer: "TWELVE TABLE(T)S / <latin>DUODECIM TABULAE</latin>"
    boni:
      - question: "What law challenged the Twelve Tables by allowing for intermarriage between  \tplebeians and patricians in 445 BC?\t"
        answer: "<latin>LĒX CANULĒIA</latin>"
      - question: "What law of 287 BC ended the fifth and final secession of the plebs and made the plebiscite binding on all citizens?\t"
        answer: "<latin>LĒX HORTENSIA</latin>"
  - tossup:
      question: "Aurelia’s story continues. Listen carefully to the following Latin passage, which I will read twice, then respond IN ENGLISH to the question which follows:    \t<latin>Prīmō vīdit Aurēlia vestibulum pictūrīs mīrīs pictum.  Tam clārē pictae sunt ut</latin> \t\t<latin>hominēs ibi dēpictī vīvere vidērentur, ūnā cum rēbus ex aurō factīs, quae ā \t\thominibus portābantur.</latin> "
      answer: "(REREAD)"
    boni:
      - question: "What was remarkable about the people depicted in these paintings? "
        answer: "THEY APPEAR TO BE ALIVE / LIFELIKE"
      - question: "What were these people doing in the paintings?"
        answer: "BRINGING / CARRYING GOLD(EN) THINGS / THINGS MADE OF GOLD"
  - tossup:
      question: "In the <title>Aeneid,</title> when Aeneas arrives in Carthage, what god masquerades as Ascanius in order to improve Aeneas’ chances for a warm reception from Dido by making her fall in love?\t"
      answer: "CUPID(O)"
    boni:
      - question: "What Trojan leads a group that had been separated from Aeneas and is the first Trojan to speak with Dido?\t"
        answer: "ILIONEUS"
      - question: "What god ultimately reminds Aeneas that he was not meant to remain in Africa with Dido?\t"
        answer: "MERCURY / MERCURIUS"
  - tossup:
      question: "Of <latin>anas</latin>, <latin>bālaena, delphīnus,</latin> and <latin>piscis,</latin> which is being described by the following sentence: <latin>Ego aut in flūminibus aut in marī habitō et hominēs ex nāvibus mē capere temptant ut mē cōnsūmant. Ego ex aquā spīrāre nōn possum.</latin>\t"
      answer: "PISCIS"
    boni:
      - question: "Of <latin>anas</latin>, <latin>bālaena, delphīnus,</latin> and <latin>piscis</latin>, which is being described here: <latin>Ego sum animal, in marī habitāns. Saepe cum hominibus lūdō. Rōmānī figūrīs meī ūtēbantur ut septem curricula in circō numerārent.</latin>\t"
        answer: "DELPHĪNUS"
      - question: "Of <latin>anas</latin>, <latin>bālaena, delphīnus,</latin> and <latin>piscis</latin>, which is being described here: <latin>Ego sum animal maximum et in marī quoque habitō. Ego super aquam spīrō et carmen meum longē in marī audītum est.</latin>\t"
        answer: "BĀLAENA"
  - tossup:
      question: " \tAfter surviving a flood, what couple repopulated the earth with their rock throwing? \t\t"
      answer: "DEUCALION AND PYRRHA"
    boni:
      - question: "The oracle of which goddess told Deucalion and Pyrrha to throw the bones of their mother over their shoulders, which they took to mean rocks, the bones of the earth?\t\t"
        answer: "THEMIS"
      - question: "Who were the parents of Pyrrha, a Titan and the first mortal woman?\t \t\t"
        answer: "EPIMETHEUS AND PANDORA"
  - tossup:
      question: "<latin>Respondē Anglicē: Quis sum? Marītum malum habēbam, et iste alteram uxōrem volēbat. Ergō, fīliōs nostrōs necāvī, et Athēnās volāvī.</latin> \t"
      answer: "MEDEA"
    boni:
      - question: "<latin>Respondē Anglicē: Quis sum? Ōlim, deam Diānam in silvā spectābam. Nunc,  mortuus sum quod canēs mē interfēcērunt.</latin> \t\t\t\t"
        answer: "ACTAEON"
      - question: "<latin>Respondē Anglicē: Quis sum? Eram pulcherrimus iuvenis et omnēs mē  amābant–ego quoque mē amābam! Sed nunc, flōs sum, quod mē nimium amābam.</latin> \t \t\t"
        answer: "NARCISSUS"
  - tossup:
      question: "The periodic table of elements contains many Latin, Greek, and mythological references. Give the Latin and the English for the element whose symbol is Pb. \t\t"
      answer: "<latin>PLUMBUM -</latin> LEAD"
    boni:
      - question: "Give the Latin and the English for the element whose symbol is Ag."
        answer: "<latin>ARGENTUM</latin> - SILVER"
      - question: "Give the Latin and the English for the element whose symbol is Sn."
        answer: "<latin>STANNUM</latin>  - TIN"
  - tossup:
      question: "Against what people was the lasting superiority of Rome’s manipular formation proven at battles like Pydna and Cynoscephalae, where the phalanx of Philip V was crushed?"
      answer: "MACEDONIA(NS) (prompt on “Greek”)"
    boni:
      - question: "What veteran of the Spanish and Ligurian wars served as consul at Pydna?"
        answer: "(L. AEMILIUS) PAULLUS (MACEDONICUS)"
      - question: "What king of Macedon and son of Philip V was defeated at Pydna?\t"
        answer: "PERSEUS"
  - tossup:
      question: "When recognized, perform this command, knowing that <latin>pūnctum</latin> means “point”: <latin>rogā moderātōrem Anglicē ut decem pūncta dōnet.</latin> \t\t"
      answer: "STUDENT SHOULD ASK THE MODERATOR <emphasis>IN ENGLISH</emphasis> FOR <emphasis>TEN POINTS</emphasis>"
    boni:
      - question: "Now, perform the following command: <latin>dīcite moderātōrī Anglicē fēminam esse dūcem.</latin>       "
        answer: "<emphasis>STUDENTS</emphasis> SHOULD TELL MODERATOR <emphasis>IN ENGLISH</emphasis> THAT  \t\tA / THE / ANY SPECIFIC WOMAN IS THE LEADER / IN CHARGE"
      - question: "Now, knowing that <latin>factio</latin> means “team”, perform this command: <latin>vōs omnēs aliīs factiōnibus bonam fortūnam Anglicē offerātis.</latin>\t"
        answer: "<emphasis>ALL</emphasis> STUDENTS SHOULD WISH \t\tGOOD LUCK <emphasis>IN ENGLISH</emphasis> TO THE <emphasis>OTHER TEAMS</emphasis>"
