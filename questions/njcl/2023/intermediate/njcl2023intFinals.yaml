  - tossup:
      question: "<latin>Dīc mihi Anglicē nōmen lūdī quem dēscrībō. In lūdō sunt duo exercitūs. Rēx exercituī dēfendendus est, sed persōna potentissima in lūdō rēgīna est. Sunt quoque equitēs, castella, et peditēs.</latin>\t"
