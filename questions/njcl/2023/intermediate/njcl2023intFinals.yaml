      - question: "<latin>Dīc mihi Anglicē nōmen lūdī quem dēscrībō. In lūdō, multī autoraedās agunt! Agere in “via īridis” possunt, et ut vincant, hominēs conchās et banānās iaciunt. Sī quis ē viā cadit, testūdō nūbem agit et auxilium fert.</latin>\t"
        answer: "MARIO KART"
