    boni:
      - question: "<latin>Surgite et, mē spectantēs, dīcite Anglicē, “Nōs moritūrī tē salūtāmus.”</latin>  \t"
        answer: "AT LEAST TWO STUDENTS STAND, LOOK AT THE READER,  AND SAY “WE WHO ARE ABOUT TO DIE SALUTE YOU.”"
      - question: "<latin>Surgite, duo ex vōbīs, et clāmantēs, pugnāte sīcut rētiārius et andabata</latin>"
        answer: "TWO STUDENTS STAND, SHOUT, AND PRETEND TO  FIGHT LIKE A RETIARIUS (WITH NET AND TRIDENT) AND AN  ANDABATA (AS IF EYES ARE COVERED)"
  - tossup:
