  - tossup:
      question: "Listen carefully to the following Latin passage, which I will read twice, then answer in Latin the questions that follow.  \t<latin>Via tendēns in tumulum Aegyptiōrum antīquōrum fīēbat angustior et angustior Aureliā procēdente. Tum Aurēlia nihil aliud in mūrō invēnit. Puella mīrāta est ubi essent pictūrae et rēs aurō factae. puella sibi dīxit: “Hoc mīrābile est! nihil adest.” Subitō, Aurēlia clāmōrem amīcorum audīvit. Incipiēbat exīre ē tumulō, sed iānua statim clausa est. Aurēlia timēns vidēre audīreque nihil poterat …</latin> REREAD  The question:  <latin>Appropinquāns ad fīnem tumulī, quid Aurēlia in murō vīdit?</latin>"
