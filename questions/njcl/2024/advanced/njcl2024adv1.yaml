tournament: "NJCL Certamen"
year: 2024
division: "Advanced"
round: "Round 1"
questions:
  - tossup:
      question: "What Greek god, known by the epithets <latin>Ennosigaeos</latin> and <latin>Enosichthon</latin>, was the father of such characters as Rhode, Cycnus, Bellerophon, and Theseus, and ruled the sea? \t\t"
      answer: "POSEIDON"
    boni:
      - question: "What Nereid was Poseidon’s wife and queen of the seas?\t"
        answer: "AMPHITRITE"
      - question: "With what deity did Poseidon contend for the patronage of Corinth?\t"
        answer: "HELIOS"
  - tossup:
      question: "Provide the form of the Latin noun <latin>mūnus</latin> needed to render the following English sentence into Latin: “Oh what a beautiful gift!”\t"
      answer: "<latin>MŪNUS</latin>"
    boni:
      - question: "Provide the form of the Latin noun <latin>mūnus</latin> needed for this sentence, if you were to use <latin>oblīvīscor</latin> as the main verb: “Do not forget the gifts!” \t"
        answer: "<latin>MŪNERUM / MŪNERA</latin>"
      - question: "Provide the form of the Latin noun <latin>mūnus</latin> needed for this sentence: “Cicero intended that toga as a gift for his brother.”\t"
        answer: "<latin>MŪNERĪ / MŪNUS</latin>"
  - tossup:
      question: "What ex-dictator strongly resisted Scipio’s wish to take the Second Punic War to  \tmainland Africa and died in 203 BC before he could see the success at Zama?"
      answer: "(Q.) FABIUS MAXIMUS / VERRUCOSUS / CUNCTATOR // CUNCTATOR"
    boni:
      - question: "What position did Cunctator hold in 215 BC at the same time as an augurship, a feat not \t\trepeated until the time of Sulla?\t"
        answer: "PONTIFEX MAXIMUS"
      - question: "Who was Cunctator’s <latin>magister equitum</latin>, who disagreed with his tactics and ended up leading a divided command?\t"
        answer: "(M.) MINUCIUS RUFUS"
  - tossup:
      question: "Of pinna, cochlea, malleus, and ossicle, what word related to the human ear refers to any small bone, such as the three tiny bones in the ear?\t"
      answer: "OSSICLE"
    boni:
      - question: "Of pinna, cochlea, malleus, and ossicle<latin>,</latin> what part of the human ear gets its name from its snail or shell-like shape?\t"
        answer: "COCHLEA"
      - question: "The aural ossicles are the malleus, incus, and stapes. Give the English meaning of any <emphasis>two</emphasis> of these three Latin words. \t \t\t"
        answer: "MALLEUS"
  - tossup:
      question: "In its fourth book, what work describes the Usipeti and Tencteri, as well as Ambiorix, and then transitions to narrating two invasions of Britain by the forces of Julius Caesar?"
      answer: "(JULIUS CAESAR’S <title><latin>COMMENTĀRIĪ</latin></title>) <title><latin>DĒ BELLŌ GALLICŌ</latin></title> // <title><latin>BELLUM GALLICUM</latin></title> //  \t<title>THE GALLIC WAR</title>"
    boni:
      - question: "The seventh book of the work, which discusses the campaigns of 52 BC, focuses on Caesar’s fight against what Gallic coalition leader?\t"
        answer: "VERCINGETORIX"
      - question: "Doubtful sequels of Caesar’s main two works describe wars in three main regions. Name any <emphasis>two</emphasis> of the three regions that also provide titles for works in the so-called <latin>corpus Caesariānum</latin>.\t"
        answer: "ALEXANDRIA / EGYPT // AFRICA // SPAIN  <latin>SCORE CHECK</latin>"
  - tossup:
      question: "Construction on this building began in 121 AD under Hadrian. Set on a massive 145m by 100m base, this decastyle Corinthian temple with double <latin>cellae</latin> was built over the ruins of Nero’s <latin>Domus Aurea</latin>. What was this largest temple in Rome, dedicated to both the city’s patron goddess and the city itself?\t \t\t"
      answer: "TEMPLE OF VENUS AND ROMA / ROME [PASS OUT <emphasis>VISUAL</emphasis>]"
    boni:
      - question: "This is a map of the Roman and Imperial Fora - the Temple of Venus and Roma is number 20. What Latin term describes the type of building numbered 13, 14, and 19?"
        answer: "<latin>BASILICA(E)</latin> "
      - question: "Many Roman leaders were eager to leave their mark on the city and did so by adding <latin>fora</latin> adjacent to the Roman Forum. Who was responsible for adding the <latin>forum</latin> marked number 2, whose most remarkable monument still stands today in its northwest center?"
        answer: "TRAJAN"
  - tossup:
      question: "Translate the following sentence from Latin to English: <latin>Portīs apertīs, bovēs ex oppidō cucurrērunt.</latin>\t"
      answer: "WITH THE GATES (HAVING BEEN) OPENED /  \t\tAFTER / WHEN / SINCE / ALTHOUGH THE GATES WERE / HAD BEEN OPENED,  \t\tCOWS / OXEN RAN OUT OF THE TOWN"
    boni:
      - question: "Translate the following sentence from Latin to English: <latin>Lūcem sōlis vidēre procul possumus.</latin>\t"
        answer: "WE CAN SEE THE LIGHT OF THE SUN (FROM) FAR AWAY"
      - question: "Translate the following sentence from Latin to English: <latin>Vir vulnerātus magnā cum vōce exclāmābit.</latin>\t"
        answer: "THE WOUNDED MAN WILL CALL OUT / CRY OUT / SHOUT(OUT) / \t\tEXCLAIM WITH A LARGE / GREAT / LOUD VOICE"
  - tossup:
      question: "What schoolmate of Rufinus, whom he later attacked in an <title><latin>Apologia</latin></title>, wrote a late <title><latin>Dē Vīrīs Illūstribus</latin></title> and used his skill in Hebrew to translate the Bible into the <title>Vulgate</title>?"
      answer: "(ST.) JEROME"
    boni:
      - question: "What first-century-BC author, a friend of Catullus, also wrote a <title><latin>Dē Vīrīs Illūstribus</latin></title>, as well as the works <title><latin>Chronica</latin></title> and <title><latin>Exempla</latin></title>?\t"
        answer: "(CORNELIUS) NEPOS"
      - question: "Suetonius’ <title><latin>Dē Vīrīs Illūstribus</latin></title> survives only in one section, which discusses what two sorts of people?\t"
        answer: "GRAMMARIANS / PHILOLOGISTS / <latin>GRAMMATICĪ</latin>"
  - tossup:
      question: "Over which area of the Underworld would you find the Hecatoncheires standing guard in order to keep the Titans and other evil-doers within?\t"
      answer: "TARTARUS"
    boni:
      - question: "Who was punished in Tartarus by spinning on a flaming wheel?\t"
        answer: "IXION"
      - question: "What creature with a hundred snake heads was the son of Gaia and Tartarus? \t\t"
        answer: "TYPH(A)ON / TYPHÖEUS"
  - tossup:
      question: "When recognized by the spotter, perform or explain the following command: <latin>humī sedēns, fac sonum lacrimantis hominis</latin>.\t\t"
      answer: "STUDENT SHOULD SIT ON GROUND AND MAKE THE SOUND OF A CRYING \tPERSON (OR EXPLAIN WHAT THEY WOULD DO)"
    boni:
      - question: "Now, perform or explain this command: <latin>rīdentēs, stāte et vehementer plaudite moderātōrī</latin>.\t"
        answer: "MULTIPLE STUDENTS SHOULD STAND, \t\tSMILING OR LAUGHING, AND APPLAUD THE MODERATOR"
      - question: "Now, perform or explain this command: <latin>quasī dormientēs, pōnite capita vestra suprā mēnsam</latin>.\t"
        answer: "MULTIPLE STUDENTS SHOULD ACT LIKE THEY’RE SLEEPING \t\tAND PLACE THEIR HEADS ON/ABOVE THE TABLE \t <latin>SCORE CHECK</latin>"
  - tossup:
      question: "What author was forced to investigate the claims of cannibalism that he had made when he was exiled to Egypt for insulting Domitian in one of his mocking <title>Satires</title>?"
      answer: "JUVENAL // (D. IUNIUS) IUVENAL(IS)"
    boni:
      - question: "What elegist was not exiled to Egypt, but was punished by Augustus for erecting statues there while serving as the province’s governor?\t"
        answer: "(C.) CORNELIUS GALLUS"
      - question: "What man from Juvenal’s time was born in Egypt and performed at the court of Domitian before being executed by the emperor?\t"
        answer: "PARIS"
  - tossup:
      question: "Listen carefully to the following passage about Certamen, which I will read twice, keeping in mind that <latin>tinniō</latin> means “buzz,” then respond in English to the questions that follow: \t<latin>in certāmine, moderātor lēgit, “cūr patiēbātur Ulixēs multās tempestātēs in pelagō?” discipula quaedam prīmum tinnuit et laetē dēclārāvit, “clārē secundum Homērum, quia oculum fīliī Poseidōnis perforāret, tunc audācter nōmen suum vērum dāret.”</latin>"
      answer: "REREAD"
    boni:
      - question: "The story continues: <latin>moderātor respondit, “mē paenitet, sed nōn accipere tuum rēspōnsum possum. dēbēs Neptūnum, nōn Poseidōnem, nōmināvisse ob nōmen Rōmānum.”</latin> \tWhy is the moderator sorry?"
        answer: "THEY CANNOT ACCEPT (THE ANSWER)"
      - question: "Keeping in mind the correction, what would a correct answer to the moderator’s original question be?"
        answer: "ULYSSES ANGERED <emphasis>NEPTUNE</emphasis> / BLINDED <emphasis>NEPTUNE’S</emphasis> SON, etc. / \t\t(THEY SHOULD HAVE SAID) “<latin>ĪRĀ NEPTŪNĪ”</latin> "
  - tossup:
      question: "After killing his wife’s first husband Tantalus, what son of Atreus and Aerope married her, led 100 ships to Troy, and commanded the combined forces of Greece there? \t\t"
      answer: "AGAMEMNON"
    boni:
      - question: "What city, founded by Perseus, did Agamemnon rule?\t"
        answer: "MYCENAE"
      - question: "Who was the father of both Clytemnestra’s first husband, Tantalus, and her lover, Aegisthus?\t"
        answer: "THYESTES"
  - tossup:
      question: "The cities of Caesarea and Tingis gave their names to two Roman provinces, which had previously been part of what African kingdom usurped by Claudius in 44 AD?\t\t"
      answer: "MAURETANIA"
    boni:
      - question: "What commander, a future governor of Britain, suppressed the rebellion of Aedemon in Mauritania?\t"
        answer: "(C.) SUETONIUS PAULINUS"
      - question: "Give the modern name of one of the two cities listed in the toss-up"
        answer: "CHERCHELL / TANGIER(S)"
  - tossup:
      question: "Give a Latin word that is not a compound of <latin>sciō</latin> but <title>is</title> a synonym for <latin>sciō</latin>.\t \t\t"
      answer: "(COG)NOSCŌ / SENTIŌ / SAPIŌ"
    boni:
      - question: "Give a Latin synonym for <latin>iubeō</latin>.\t"
        answer: "<latin>IMPERŌ / MANDŌ / ROGŌ / POSCŌ</latin>"
      - question: "Give a Latin antonym for <latin>urbs</latin>.\t"
        answer: "<latin>RŪS / AGER / OPPIDUM / VĪCUS</latin>"
  - tossup:
      question: "Provide the form of the verb <latin>quaerō</latin> needed to render the following English sentence into Latin: “Who, searching for truth, will not find happiness?”\t\t"
      answer: "<latin>QUAERĒNS / QUAERENTĒS / QUAERENDŌ / QUAERENDĀ</latin>"
    boni:
      - question: "Provide the form of the verb <latin>quaerō</latin> needed to render the following English sentence into Latin: “The thieves, about to look for the treasure, were captured.”\t"
        answer: "<latin>QUAESĪTŪRĪ/AE/A</latin>"
      - question: "Provide the form of the verb <latin>quaerō</latin> needed to render the following English sentence into Latin: “We must search for our ten sheep.”\t"
        answer: "<latin>QUAERENDĪ/AE (SUNT)</latin>"
  - tossup:
      question: "What Latin word with what meaning does the pharmaceutical abbreviation <latin>Rx</latin>. stand for?\t\t\t"
      answer: "<latin>RECIPE</latin>, “TAKE!”"
    boni:
      - question: "If your doctor tells you to take a medication <latin>p.r.n</latin>., how often are they suggesting that you take it? \t"
        answer: "AS NEEDED"
      - question: "What Latin word with what meaning does the medical abbreviation <latin>gtt</latin>. stand for? \t\t"
        answer: "<latin>GUTTAE</latin>, DROPS"
  - tossup:
      question: "What consul had been sent by the senate to suppress a rebellion of farmers in Florence and later marched on Rome in 78 BC where he was defeated by Pompey?"
      answer: "(M. AEMILIUS) LEPIDUS (FATHER OF THE TRIUMVIR)"
    boni:
      - question: "Prior to his consulship, what province had Lepidus shamelessly plundered while serving as governor?\t"
        answer: "SICILY"
      - question: "Following his defeat in Rome, Lepidus fled to Sardinia and died trying to establish ties with what other rebel in Spain, who was said to get advice from a white fawn?\t\t"
        answer: "(Q.) SERTORIUS"
  - tossup:
      question: "What author says he “wouldn’t have opposed being an auctioneer or payment-collector,” like his father, but instead learned from Orbilius to write works like <title>Epodes</title> and <title>Odes</title>?"
      answer: "HORACE // (Q.) HORATIUS (FLACCUS)"
    boni:
      - question: "The poem in Horace’s <title>Satires</title> that discusses his father is actually dedicated to what man, who was also addressed in the first <title>Satire</title> and at the beginning of the <title>Odes</title>?"
        answer: "(C. CILNIUS) MAECENAS"
      - question: "Horace also writes that he was actually recommended to Maecenas by what man, an author of a <title><latin>Dē Morte</latin></title> who helped prepare the <title>Aeneid</title> for publication after Vergil’s death? \t\t"
        answer: "(L. VARIUS) RUFUS // (L.) VARIUS (RUFUS)  <latin>SCORE CHECK</latin>"
  - tossup:
      question: "What Aetolian warrior, who overcame an ambush by Maeon and his Theban comrades while returning from an embassy on behalf of the Seven Against Thebes, was the father of Diomedes?\t"
      answer: "TYDEÜS"
    boni:
      - question: "What co-commander with Maeon died in the fighting?\t"
        answer: "POLYPHONTES"
      - question: "What act of sacrilege did Tydeüs commit, causing Athena to think twice about granting him immortality?\t"
        answer: "EATING (MELANIPPUS’) BRAINS"
