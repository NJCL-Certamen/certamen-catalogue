tournament: "NJCL Certamen"
year: 2024
division: "Advanced"
round: "Round 2"
questions:
  - tossup:
      question: "Marveling at a certain sepulcher, you see the letters <latin>R.I.P.</latin> For what three Latin words do these letters stand?\t"
      answer: "REQUIĒSCA(N)T IN PĀCE"
    boni:
      - question: "<title>(Note to mod: pronounce the abbreviation “bay punctum ee punctum day punctum”)</title> \t<latin>Respondē Latīnē: Medicus tibi remedium aegritūdinis dat, et īnscrībit litterās b.i.d. Quotiēns remedium cōnsūmere dēbēs?</latin>\t"
        answer: "BIS (IN DIE)"
      - question: "<latin>Respondē Latīnē: Advocātus tē consulit dē līte recentī et dīcit: “nōn vincere potes et poenās dabis.” Quid advocātus prō iūdice dīcet?</latin>\t"
        answer: "NŌLŌ / NŌLLE CONTENDERE"
  - tossup:
      question: "Objects like “a rope,” “three coins,” “a little casket,” and “a pot of gold” give modern titles to what author’s plays, which also include one named after a “braggart soldier?”"
      answer: "(T. MACCIUS) PLAUTUS"
    boni:
      - question: "What play of Plautus has a title literally meaning “the ghost”?\t \t\t<title></title>"
        answer: "MOSTELLĀRIA / PHASMA"
      - question: "What play of Plautus has a title literally meaning “the little satchel”?\t"
        answer: "<title><latin>VIDULĀRIA</latin></title>"
  - tossup:
      question: "What meaning is communicated by the Latin adjectival suffix -<latin>ōsus</latin>, which is commonly attached to nouns?\t"
      answer: "FULL OF / PRONE TO / GIVEN TO"
    boni:
      - question: "What is communicated by the Latin suffix -<latin>ēnsis</latin>? \t\t"
        answer: "INDICATES BELONGING TO (A LOCATION) / INHABITANT OF /  \t\tSPATIAL RELATIONSHIP"
      - question: "What is communicated by the addition of the suffix -<latin>īdēs</latin> to a name? \t\t"
        answer: "SON OF / CHILD OF / PATRONYMIC / DESCENT / RELATIONSHIP"
  - tossup:
      question: "Which of the following people was NOT transformed into an animal according to Ovid’s <title>Metamorphoses</title>: Alcyone, Callisto, Actaeon, Philemon?\t"
      answer: "PHILEMON"
    boni:
      - question: "Of the people listed in the tossup, Alcyone, Callisto, Actaeon, and Philemon, which was transformed into a type of bird?\t"
        answer: "ALCYONE"
      - question: "Whom did Apollo transform into a cypress tree after he could not assuage his grief over killing a pet stag?\t"
        answer: "CYPARISSUS"
  - tossup:
      question: "Continuing the Severan dynasty’s tradition of powerful empresses, what two women, the mother and grandmother of Alexander Severus, began his reign with a joint regency in 222 AD?\t"
      answer: "JULIA MAMAEA AND JULIA MAESA"
    boni:
      - question: "What praetorian prefect and notable jurist served as Julia Mamaea’s right-hand man in the early part of Severus’ emperorship, though he was assassinated around 224 AD?"
        answer: "(CN. DOMITIUS ANNIUS) ULPIAN(US)"
      - question: "What noblewoman did Julia Mamaea arrange for Alexander Severus to marry in 225 AD, only to have her exiled to North Africa by 227 AD?\t"
        answer: "(SALLUSTIA) ORBIANA \t <latin>SCORE CHECK</latin>"
  - tossup:
      question: "Who visited Anius, Acestes, Helenus, and Dido on his journey from Troy to Italy? \t\t"
      answer: "AENEAS"
    boni:
      - question: "On what island did Aeneas meet Acestes and bury his father, Anchises?\t \t\t"
        answer: "SICILY / T(H)RINACRIA"
      - question: "What prophecy, first given by Celaeno, did Helenus confirm for Aeneas when he visited him at Buthrotum? \t\t"
        answer: "THAT HE WOULDN’T BE DONE WANDERING UNTIL HE BECAME \t\tSO HUNGRY THAT HE <emphasis>ATE HIS OWN TABLES</emphasis>"
  - tossup:
      question: "Give the number of elisions found in the following line of Catullus, which I will read as prose: <latin>Ōdī et amō. Quārē id faciam fortasse requīris</latin>.\t"
      answer: "TWO [PASS OUT <emphasis>VISUAL</emphasis>]"
    boni:
      - question: "Here you see six lines from different poems of Catullus. Line A is written in dactylic hexameter.  What is the scansion of the first four feet of line A?"
        answer: "SSSS(DS)"
      - question: "Of the remaining lines, give the letter of the line written in hendecasyllabic."
        answer: "D"
  - tossup:
      question: "Listen carefully to the following passage about Certamen, which I will read twice, then <latin>respondē Latīnē</latin> to the questions that follow: \t<latin>in eōdem certāmine, quattuor discipulī bonum audiēbant: “surgite omnēs, salīte in locō, et facite sonum asinōrum.” cum certāminātōrēs respondissent et rūrsus consēdissent, moderātor vultū sevērō rettulit, “minimē! audīvī clārissimē trēs asinōs ūnumque equum.”</latin>     "
      answer: "REREAD"
    boni:
      - question: "The passage continues: <latin>ūnus ex discipulīs gemuit, “sed nōn rūrī</latin> <latin>habitō. nesciō omnīnō quōmodo asinus sonet.”</latin> \tThe question: <latin>cūr nesciēbat discipulus quōmodo asinus sonāret?</latin>"
        answer: "(QUOD) NŌN RŪRĪ HABIT(ĀB)AT / HABITET / HABITĀRET //  \t\t(QUOD) IN URBE HABIT(ĀB)AT / HABITET / HABITĀRET "
      - question: "<latin>nunc rectē respondēte bonō moderātoris: surgite omnēs, salīte in locō, et facite sonum asinōrum.</latin>"
        answer: "<emphasis>ALL</emphasis> STUDENTS SHOULD RISE, JUMP IN PLACE,  \t\tAND MAKE DONKEY SOUNDS (description acceptable)"
  - tossup:
      question: "What short-tenured emperor married Nero’s widow Statilia Messalina, had previously married another wife of Nero, Poppaea Sabina, and succeeded Galba to the throne?\t\t"
      answer: "OTHO"
    boni:
      - question: "What brother of Vespasian had been made prefect of Rome by Otho and was responsible for besieging Vitellius in the Capitol?\t"
        answer: "(T.) FLAVIUS SABINUS"
      - question: "What future emperor disguised himself as a priest of Isis and escaped Rome before Vespasian’s troops could arrive to finally defeat Vitellius? \t\t"
        answer: "(T. FLAVIUS) DOMITIAN(US)"
  - tossup:
      question: "Give a Latin synonym for <latin>carmen</latin>.\t \t\t"
      answer: "POĒMA / CANTUS / CANTICUM / CANTIŌ / VERSUS / FĀBULA"
    boni:
      - question: "Give a Latin synonym for <latin>consuescō</latin>.\t"
        answer: "<latin>SOLEŌ / (AS)SUESCŌ / INSUESCŌ</latin>"
      - question: "Give a Latin antonym for <latin>dūrus</latin>.\t"
        answer: "<latin>MOLLIS / LĒNIS / URBĀNUS / FĒLIX / \t\tFORTŪNĀTUS / LEVIS / LĒVIS / MĪTIS / DULCIS  SCORE CHECK</latin>"
  - tossup:
      question: "What author’s phrase “<latin>in tenuī labor</latin>” describes the toil of his poetry and of bees, which appear with Aristaeüs in the fourth book of his didactic work on agriculture — <title>Georgics</title>?"
      answer: "(P.) VERGIL(IUS MARO)"
    boni:
      - question: "The two other main characters of Book 4 of the <title>Georgics</title> are what tragic couple?"
        answer: "ORPHEUS AND EURYDICE"
      - question: "Among the other events of the <title>Georgics</title> is what sort of occurrence at Noricum?"
        answer: "PLAGUE (AMONG ANIMALS)"
  - tossup:
      question: "Say in Latin using <latin>currō:</latin>  Let’s run to the forum today! \t\t"
      answer: "<latin>HODIĒ AD / IN FORUM CURRĀMUS</latin>"
    boni:
      - question: "Say in Latin using <latin>resistō:</latin>  Let’s always resist the enemies! \t\t"
        answer: "<latin>SEMPER HOSTIBUS / HOSTĪ RESISTĀMUS</latin>"
      - question: "Say in Latin using a common Latin idiom with <latin>faciō:</latin>  Let’s inform the queen immediately! \t\t"
        answer: "<latin>STATIM / CŌNFESTIM / EXTEMPLŌ RĒGĪNAM CERTIŌREM FACIĀMUS</latin>"
  - tossup:
      question: "What Greek hero was claimed by multiple regions and given many possible fathers, such as Iasus and Schoeneus? Nevertheless most versions say that she was suckled by a she-bear at birth.\t"
      answer: "ATALANTA"
    boni:
      - question: "Into what animals were Atalanta and her lover Hippomenes transformed?\t"
        answer: "LIONS"
      - question: "According to Ovid, what goddess transformed them out of anger that they made love in her temple?\t"
        answer: "CYBELE / CYBEBE / MAGNA MATER"
  - tossup:
      question: "Accompanied by a mercenary army of 20,000 infantry, 2,000 archers, 500 slingers, 3,000 cavalry, and 20 war elephants, what king set sail for Italy in 280 BC and fought the Romans in a war where he won several battles but endured heavy losses?"
      answer: "PYRRHUS"
    boni:
      - question: "Under the command of Curius Dentatus, where did the Romans effectively end the war with Pyrrhus in 275 BC?\t"
        answer: "BENEVENTUM / BENEVENTO / MAL(E)VENTUM"
      - question: "Following the Battle of Heraclea in 280 BC, Pyrrhus actually tried to march on Rome herself but was stopped 40 miles away by Rome’s Latin allies at what town? \t\t"
        answer: "PRAENESTE / PALESTRINA"
  - tossup:
      question: "For the verb <latin>patior</latin>, give the second person singular future indicative form which means “you will endure.”\t"
      answer: "<latin>PATIĒRIS / PATIĒRE</latin>"
    boni:
      - question: "Now, keeping everything else the same, change <latin>patiēris</latin> to the imperfect subjunctive form which means “you would be enduring.”\t"
        answer: "<latin>PATERĒRIS / PATERĒRE</latin>"
      - question: "Now, give the imperative form of the same verb needed to tell one person “Endure!” \t\t"
        answer: "<latin>PATERE</latin>"
  - tossup:
      question: "First codified in law in 180 BC and further refined by 80 BC, what system required a candidate for office to do ten years of military service before progressing through a specific order of Roman magistracies with set age requirements and gaps between terms? \t\t"
      answer: "<latin>CURSUS HONŌRUM</latin>"
    boni:
      - question: "What did it mean to get elected to a magistracy <latin>suō annō</latin>?"
        answer: "IN THE FIRST YEAR ELIGIBLE / AT THE YOUNGEST AGE POSSIBLE /  \t\tprompt on IN HIS OWN YEAR"
      - question: "Although it was later renamed <latin>consul</latin>, what was the chief executive office originally called in the first years of the republic?"
        answer: "<latin>PRAETOR</latin> "
  - tossup:
      question: "In the book of the <title>Odyssey</title> known as the <title>Nekuia</title>, where does Odysseus encounter Elpenor, Anticleia, and Teiresias, all of whom have already died?\t \t\t"
      answer: "(EDGE / BOUNDARY OF THE) UNDERWORLD / HADES"
    boni:
      - question: "What request did Elpenor make when he saw Odysseus in the Underworld? \t\t"
        answer: "TO BE BURIED"
      - question: "What shade refused to speak to Odysseus because of a disagreement they had had at Troy?\t"
        answer: "BIG(GER) / GREAT(ER) / SALAMINIAN / TELAMON(IAN) AJAX"
  - tossup:
      question: "According to its derivation, what is in the diet of a nucivorous animal, which primarily eats <latin>nucēs</latin>?\t"
      answer: "NUTS"
    boni:
      - question: "Worms and other bivalves are considered limivorous animals. According to its derivation, what do limivorous animals consume?\t"
        answer: "MUD / DIRT"
      - question: "According to its derivation, what is a food source for merdivorous insects?\t \t\t"
        answer: "DUNG / EXCREMENT / FECES / POOP"
  - tossup:
      question: "What goddess, whose Sicilian spring festival frames the poem <title><latin>Pervigilium</latin></title>, is invoked at the beginning of <title><latin>Dē Rērum Nātūrā</latin></title> as “<latin>Aeneadum genetrix</latin>,” or “mother of Aeneas’ descendants”?\t"
      answer: "VENUS"
    boni:
      - question: "Venus appears as a character in the tale of Cupid and Psyche that makes up most of Books 4-6 of what work from the second century AD?"
        answer: "(APULEIUS’) <title><latin>METAMORPHŌSĒS</latin></title> / <title><latin>ASINUS AUREUS</latin></title> <latin>/</latin> <title>GOLDEN ASS</title>"
      - question: "Venus also appears as a primary character in the third book of what work, which Pliny said its author “wrote with greater care than genius”?\t"
        answer: "(SILIUS ITALICUS’) <title><latin>PŪNICA</latin></title>"
  - tossup:
      question: "What is the meaning of the motto of New York University, “<latin>perstāre et praestāre</latin>”?\t \t\t"
      answer: "TO PERSEVERE AND EXCEL"
    boni:
      - question: "What is the Latin motto of Dartmouth College, which means “the voice of one shouting in the wilderness”?\t"
        answer: "<latin>VŌX CLĀMANTIS IN DĒSERTŌ</latin>"
      - question: "What is the Latin motto of the University of Vermont, which means “for virtuous studies and matters”? \t"
        answer: "<latin>STUDIĪS ET RĒBUS HONESTĪS</latin>"
