tournament: "NJCL Certamen"
year: 2024
division: "Advanced"
round: "Round 3"
questions:
  - tossup:
      question: "What author praises the valor of the military tribune Quintus Caedicius and quotes his own speech for the Rhodians in his seven-book history on Rome’s beginnings titled <title><latin>Orīginēs</latin></title>?\t"
      answer: "(M. PORCIUS) CATO (THE ELDER / CENSOR / MAIOR / CENSORIUS)"
    boni:
      - question: "Cato’s work mentions very few people by name, perhaps because Cato did not want to glorify powerful individuals, since he himself was a <latin>novus homō</latin> from what city?\t\t"
        answer: "TUSCULUM"
      - question: "Among those mentioned by name is what man, whose praetorship marks the work’s end?"
        answer: "(SER.) SULPICIUS GALBA"
  - tossup:
      question: "Make the Latin phrase <latin>atrōx lampas</latin> accusative singular.\t \t\t"
      answer: "ATRŌCEM LAMPADA / LAMPADEM"
    boni:
      - question: "Now make <latin>atrōcem lampada</latin> genitive plural.\t"
        answer: "<latin>ATRŌCIUM LAMPADUM</latin>"
      - question: "Now make <latin>atrōcium lampadum</latin> ablative singular.\t"
        answer: "<latin>ATRŌCĪ / ATRŌCE LAMPADE</latin>"
  - tossup:
      question: "Provide the Latin term for the item that was given to a <latin>pūpa</latin> on her <latin>diēs lūstricus</latin> along with a <latin>praenōmen</latin> to welcome her to the family and protect her from evil magic.\t \t\t"
      answer: "BULLA (AUREA) / CREPUNDIA / LŪNULA(E)"
    boni:
      - question: "How long was the period of <latin>prīmōrdia</latin> between birth and the <latin>diēs lūstricus</latin>? \t\t"
        answer: "SEVEN / EIGHT / NINE DAYS"
      - question: "What did the <latin>paterfamiliās</latin> do during the <latin>susceptiō</latin> on the day of a child’s birth? \t\t"
        answer: "ACCEPT / REJECT / RECOGNIZE / LIFT UP THE NEWBORN  \t\t(WELCOMING IT INTO THE FAMILY OR REJECTING IT)"
  - tossup:
      question: "When recognized by the spotter, make the sound of the animal that is being described<latin>: Hoc animal saepe cum amīcīs vēnātur tōtam per noctem. Lūnam admīrātur. Pecora comedit. Lycāōn in formam huius animālis mūtātur.</latin> \t\t"
      answer: "STUDENT HOWLS LIKE A WOLF"
    boni:
      - question: "Make the sound of this animal after conferring with your team: <latin>Hoc animal ingentissimum apud animālia terrestria est. Proboscidem longam habet et numquam oblīvīscitur.</latin>\t"
        answer: "MAKE ELEPHANT NOISE"
      - question: "Finally, make the sound of this animal after conferring with your team: <latin>Hoc animal apud palūdēs habitat. Perītissimum est et saliendī et natandī. Quādam in fābulā Graecā, chorus est quī cantat brekekekek koax koax.</latin>\t"
        answer: "MAKE FROG NOISE"
  - tossup:
      question: "What creatures were eaten by wild animals on Mount Olympus after they themselves had eaten Abderus while Heracles was retrieving them from the king of the Bistones as his eighth labor?\t"
      answer: "MARES / HORSES OF DIOMEDES"
    boni:
      - question: "According to Diodorus Siculus, how did Heracles calm the mares so that he could transport them to Eurystheus?\t"
        answer: "FED DIOMEDES TO THEM"
      - question: "On his way to Thrace to capture the mares, Heracles saved what queen of Thessaly from death after he drunkenly interrupted her funeral?\t"
        answer: "ALCESTIS \t <latin>SCORE CHECK</latin>"
  - tossup:
      question: "Listen carefully to the following passage about Certamen, which I will read twice, remembering that <latin>tinniō</latin> means “buzz,” then respond in English to the questions that follow: \t<latin>Ōlim erat rogandum visuāle, cuius imāgō in pariēte prōiecta est. Moderātor legere coepit: “Quid–.” Subitō, plūrimīs certāminātōribus simul tinnientibus, dēstitit moderātor et incrēdulus ā discipulā prīmā responsum postulāvit. Illa “Claudius” inquit</latin>"
      answer: "REREAD"
    boni:
      - question: "The passage continues: <latin>Moderātor stupefactus, “recta es,” inquit, “et vēlōcior quam Atalanta! Mihi vix crēdibile est.” Nam moderātor nescīvit verba rogandī in pariēte vidērī posse.</latin> \tHow does the moderator figuratively describe the player’s speed in buzzing?"
        answer: "FASTER THAN ATALANTA"
      - question: "How did the students know the answer so quickly?"
        answer: "THE WORDS OF THE QUESTION WERE VISIBLE / PROJECTED (ON THE WALL)"
  - tossup:
      question: "For the verb <latin>gaudeō</latin>, give the second person plural perfect indicative form which means in English “you all have rejoiced”.\t"
      answer: "<latin>GĀVĪSĪ/AE/A ESTIS</latin>"
    boni:
      - question: "Now, keeping everything else the same, make <latin>gāvīsī estis</latin> future perfect.\t\t"
        answer: "<latin>GĀVĪSĪ ERITIS</latin>"
      - question: "Now, keeping everything else the same, make <latin>gāvīsī estis</latin> subjunctive.\t"
        answer: "<latin>GĀVĪSĪ SĪTIS</latin>"
  - tossup:
      question: "What author, brought to Rome as a boy by his aunt despite illness, learned from Papirius Fabianus about Stoicism, which he featured in his works like <title><latin>Dē Īrā</latin></title> and <title><latin>Epistulae Mōrālēs</latin></title>?\t"
      answer: "(L. ANNAEUS) SENECA THE YOUNGER / <latin>MINOR</latin>"
    boni:
      - question: "What close friend of Seneca was the addressee of his <title><latin>Epistulae Mōrālēs</latin></title>?\t"
        answer: "LUCILIUS (JUNIOR)"
      - question: "Among Seneca’s dialogues were three dialogues dedicated to what equestrian of the Neronian era, who was probably a relative of Seneca?\t"
        answer: "(ANNAEUS) SERENUS"
  - tossup:
      question: "Which two of the following Latin words are synonyms: <latin>addō, optō, incipiō, legō</latin>? \t\t"
      answer: "<latin>OPTŌ</latin> AND <latin>LEGŌ</latin>"
    boni:
      - question: "Give a Latin synonym for <latin>incipiō</latin>.\t"
        answer: "<latin>COEPĪ / INCOHŌ / ORDIOR</latin>"
      - question: "Give a Latin antonym for <latin>addō.</latin>\t"
        answer: "CAPIŌ (AND MOST COMPOUNDS) / DĒMŌ / \tADIMŌ / RAPIŌ (AND MOST COMPOUNDS) / SUBTRAHŌ / EXTRAHŌ / \tAUFERŌ / MINUŌ / RĒMOVEŌ"
  - tossup:
      question: "On what island did Theseus retire and die several years before Thetis left the young Achilles there to hide out in disguise as a girl?\t"
      answer: "SCYROS"
    boni:
      - question: "What king of Scyros pushed Theseus off a cliff and later agreed to rear Achilles under the name of Pyrrha?\t"
        answer: "LYCOMEDES"
      - question: "When Theseus had provoked an invasion by the Dioscuri, who prompted the Athenians to banish Theseus and later led the Athenian contingent to Troy?\t"
        answer: "MENESTHEÜS  <latin>SCORE CHECK</latin>"
  - tossup:
      question: "What two men, while supposedly serving an unprecedented ten straight terms in their office, abolished military tribunates with consular power and allowed one consul to be plebeian in a set of namesake laws enacted by 367 BC? \t\t"
      answer: "(C.) LICINIUS (STOLO) AND (L.) SEXTIUS (LATERANUS)"
    boni:
      - question: "Laws that abolished lending with interest and specified that one consulship must be held by a plebeian were passed by which <latin>tribūnus plēbis</latin> in 342 BC?"
        answer: "(L.) GENUCIUS"
      - question: "What year marked the first time in Roman history when both consuls were plebeians?"
        answer: "172 BC"
  - tossup:
      question: "What mythological item was taken from an offspring of Poseidon and Theophane who traveled from Orchomenos to Colchis, where Phrixus dedicated it and Jason later stole it?\t\t"
      answer: "GOLDEN FLEECE [PASS OUT <emphasis>VISUAL</emphasis>]"
    boni:
      - question: "You are looking at two pieces of pottery representing scenes in the story of Jason. In image 1, if Jason is labeled A, what mythological character is labeled B?"
        answer: "PELIAS"
      - question: "In image 2, what mythological character is labeled C?"
        answer: "PHINEÜS / PHINEAS"
  - tossup:
      question: "From what Latin noun with what meaning is “molecule” derived?\t \t"
      answer: "MŌLES - MASS / HEAP / LUMP / PILE"
    boni:
      - question: "From what Latin noun with what meaning is “molar,” the type of tooth, derived?"
        answer: "<latin>MOLA</latin> - MILLSTONE / MILL / GROUND MEAL"
      - question: "From what Latin noun with what meaning is “bicuspid” derived?"
        answer: "<latin>CUSPIS</latin> - (SHARP) POINT / TIP / SPIT / SPEAR / STING"
  - tossup:
      question: "Translate the following sentence from Latin to English: <latin>Scīsne cūr odium bellī habeam?</latin>\t\t"
      answer: "DO YOU KNOW WHY I HAVE A HATRED OF / FOR WAR?"
    boni:
      - question: "Translate the following sentence from Latin to English: <latin>Timeō nē hostēs nocte sē moveant.</latin>\t\t"
        answer: "I FEAR THAT THE ENEMIES (WILL) MOVE / ARE MOVING (THEMSELVES) / \t(A)D(V)ANCE / ARE (A)D(V)ANCING AT NIGHT"
      - question: "Translate the following sentence from Latin to English: <latin>Turba hīc manēbit dummodo ōrātor bene dīcat.</latin>\t"
        answer: "THE CROWD WILL REMAIN HERE  \t\tPROVIDED THAT / AS LONG AS THE ORATOR SPEAKS WELL"
  - tossup:
      question: "Men including a tetrarch of the Asian kingdom of Galatia, a politician accused of poisoning, and a gang leader who brawled with Clodius were all defended in court by what orator?\t"
      answer: "(M. TULLIUS) CICERO"
    boni:
      - question: "Cicero effectively acts as a prosecutor, rather than a defense lawyer, in what series of 14 speeches that contributed in large part to his execution in 43 BC?\t"
        answer: "<title>PHILIPPICS</title>"
      - question: "In another speech delivered after his consulship, Cicero offers a defense of the citizenship of what man, as well as a defense of the practice of literature itself?"
        answer: "(A. LICINIUS) ARCHIAS (POETA / THE POET) \t <latin>SCORE CHECK</latin>"
  - tossup:
      question: "What two-word Latin phrase refers to a unique or prodigious occurrence, giving rise to the concept of a black swan, and was originally coined by the poet Juvenal?\t \t\t"
      answer: "RĀRA AVIS"
    boni:
      - question: "What other phrase, also first said by Juvenal, means “a sound mind in a sound body”?\t\t\t"
        answer: "<latin>MĒNS SĀNA IN CORPORE SĀNŌ</latin>"
      - question: "What other famous Latin quote is used to convey that everyone has their own taste?\t \t\t"
        answer: "DĒ GUSTIBUS NŌN EST DISPUTANDUM / SUUM CUIQUE /  \t\tQUOT HOMINĒS TOT SENTENTIAE"
  - tossup:
      question: "Writers in what genre, also called <latin>rīcīniāta</latin>, included an equestrian from Caesar’s era and Publilius Syrus, who incorporated the exaggerated gestures and silent action that later dominated it?\t"
      answer: "MIME"
    boni:
      - question: "At Rome, mime was differentiated from other dramas by the fact that it did not use what objects, which represented stock characters in genres like Atellan Farce?\t"
        answer: "MASK(S)"
      - question: "Actors in mime were known by a Latin name that indicated they did not have the typical type of what object?\t"
        answer: "SHOES"
  - tossup:
      question: "<latin>Rēspondē aut Anglicē aut Latīnē</latin>: <latin>quō īre debēs, sī vīs sedēre prope scaenam et actōrēs spectāre?</latin>\t"
      answer: "(TO THE) THEATER / <latin>(AD) THEĀTRUM</latin>"
    boni:
      - question: "<latin>Rēspondē aut Anglicē aut Latīnē: quem locum Rōmae vītēs, nisi fremitūs equōrum et aurigārum tē dēlectant?</latin>"
        answer: "CIRCUS (MAXIMUS) /  \t\t<latin>CIRCUM (MAXIMUM) / CIRCUS (MAXIMUS)</latin>"
      - question: "<latin>Rēspondē aut Anglicē aut Latīnē</latin>: <latin>ad quem locum necesse est vōbīs īre, quamquam nōlentibus, sī crīminis terribilis damnātī estis?</latin>"
        answer: "(TO) JAIL / PRISON / THE DUNGEON //  \t\t<latin>(AD) CARCER(EM MĀMERTĪNUM) / TULLIĀNUM</latin>"
  - tossup:
      question: "What lyre player used his prodigious musical skill to move the rocks that built the walls of Thebes while his brother Zethus was carrying one rock at a time by hand?\t"
      answer: "AMPHION"
    boni:
      - question: "Who was the mother of Zethus and Amphion?\t"
        answer: "ANTIOPE"
      - question: "Who was the wife of Zethus?\t"
        answer: "THEBE  <latin>SCORE CHECK</latin>"
  - tossup:
      question: "What emperor instituted a system of state-owned workshops called <latin>fabricae</latin> that supplied the military, divided up Italy into 12 dioceses, and passed the Edict on Maximum Prices during his reign from 284 to 305 AD? \t"
      answer: "DIOCLETIAN"
    boni:
      - question: "What city did Diocletian besiege for eight months in order to defeat a rebellion led by Domitius Domitianus and Aurelius Achilleus?\t"
        answer: "ALEXANDRIA"
      - question: "Diocletian famously retired on May 1, 305 AD, leaving what city, which served as one of Rome’s four satellite capitals during the tetrarchy?\t"
        answer: "NICOMEDIA"
