tournament: "NJCL Certamen"
year: 2024
division: "Advanced"
round: "Finals"
questions:
  - tossup:
      question: "Of the words <latin>quaestus, lūcrum, frūctus,</latin> and <latin>impensa</latin>, which is least like the other three in meaning, because it refers to an amount of money paid, or literally “weighed out,” for a transaction?\t"
      answer: "<latin>IMPENSA</latin>"
    boni:
      - question: "Give a synonym of the Latin adjective <latin>locuples</latin>. \t\t"
        answer: "<latin>(PER/PRAE)DĪVES / DĪS / PECŪNIŌSUS / OPULEN(TU)S</latin>"
      - question: "Give the meaning of the Latin economic term <latin>faenus</latin>.\t"
        answer: "INTEREST / PROFIT / USURY"
  - tossup:
      question: "What sort of natural feature, the topic of the start of Vibius Sequester’s work, is the subject of Ausonius’ <title>Mosella</title> and Cornelius Gallus’ line, “<latin>ūnō tellūrēs dīvidit amne duās</latin>”?\t"
      answer: "RIVER"
    boni:
      - question: "What elegist wrote a letter that purports to be from the river Arethusa to Lycotas as part of a poetic book that describes Vertumnus, Tarpeia’s treachery, and the story of Hercules and Cacus?\t"
        answer: "(SEX.) PROPERTIUS"
      - question: "Vibius Sequester’s <title><latin>Dē Flūminibus Fontibus Lacubus Nemoribus Palūdibus Montibus Gentibus Per Litterās</latin></title> is often grouped with what late author’s poem <title><latin>Dē Reditū Suō</latin></title>?"
        answer: "(RUTILIUS CLAUDIUS) NAMATIANUS"
  - tossup:
      question: "When recognized by the spotter, perform or describe the following commands: <latin>ōre et oculīs clausīs, cavē nē ūllum sonum quīnque secundās faciās</latin>. \t\t"
      answer: "FOR 5 SECONDS, STUDENT SHOULD CLOSE AND NOT OPEN THEIR EYES \tAND MOUTH AND MAKE NO NOISE (or explain)"
    boni:
      - question: "Now, perform or describe this command: <latin>loquiminī Anglicē moderātōrī quamlibet sententiam, sed quōque lūsōre singula verba invicem dīcente.</latin>"
        answer: "MULTIPLE STUDENTS SHOULD SPEAK A SENTENCE TO THE MODERATOR, \t\tWITH STUDENTS TAKING TURNS TO SAY ONE WORD AT A TIME (or explain)"
      - question: "Now, perform or describe this command: <latin>quisque vestrum simul moderātōrem roganda dīversa Anglicē roget ut mentem eius confundātis.</latin>"
        answer: "EACH STUDENT SHOULD ASK THE MODERATOR \t\tA DIFFERENT QUESTION AT THE SAME TIME (or explain)"
  - tossup:
      question: "What people were paid an annual indemnity of 350 pounds of gold when they were led by Ruga, whose Balkan incursions inspired later ones in Gaul that Aetius stopped at Chalons?\t"
      answer: "HUNS"
    boni:
      - question: "When Ruga died, he passed on his rule to Attila and what other nephew, whom Attila perhaps executed?\t"
        answer: "BLEDA"
      - question: "What sister of Valentinian III, in a desperate bid to avoid a loveless aristocratic marriage, supposedly wrote a letter to Attila asking him to invade the West on her behalf?  \t\t"
        answer: "(JUSTA GRATA) HONORIA"
  - tossup:
      question: "Who was the father of Ptoliporthes, Polypoëtes, and Telegonus by three different women, two of whom he met on adventures and the other of whom earned a reputation for faithfulness?\t"
      answer: "ODYSSEUS / ULYSSES"
    boni:
      - question: "What Thesprotian queen was the mother of Polypoëtes?\t"
        answer: "CALLIDICE"
      - question: "When Odysseus was living with Callidice and the Thesprotians, from what neighboring people did Odysseus fail to defend the kingdom?\t"
        answer: "BRYGI / BRYGE(IAN)S  <latin>SCORE CHECK</latin>"
  - tossup:
      question: "<latin>Dēscrībāmus nunc prōprietātēs dictiōnum in hāc sententiā: Quisquis es, iacentem calamum et sōpītum, ut ita dīxerim, leōnem importūnīs lātrātibus excitāstī. Cuius persōnae est “excitāstī”?</latin>\t"
      answer: "SECUNDAE / TŪ"
    boni:
      - question: "<latin>“Importūnīs lātrātibus”.  Dīc mihi Latīnē formam cāsū nōminātīvō illīus locūtiōnis.</latin> \t\t"
        answer: "IMPORTŪNĪ LĀTRĀTŪS"
      - question: "<latin>Verbō “dīcō” ūtēns, nārrā mihi Latīnē formam pārem formae “excitāstī,” et quae brevior quoque sit.</latin>\t"
        answer: "DĪXTĪ"
  - tossup:
      question: "What island, first settled by Tectamus, was inhabited by the last descendant of the Meliae to survive from the Age of Bronze, at least until Medea or Poeas in one way or another destroyed him?\t"
      answer: "CRETE"
    boni:
      - question: "On what island, which was revealed by Apollo with a flaming bolt, did the Argonauts initiate a tradition of ribald joking at the rites of Apollo?\t"
        answer: "ANAPHE"
      - question: "After that, on what other island did the Argonauts create a tradition of a footrace where participants carried water jars?\t"
        answer: "AEGINA"
  - tossup:
      question: "What man’s support of Gaius Norbanus and Lucius Cornelius Scipio helped make them consuls, though he himself served as consul the following year with Marius the Younger and the previous year, 84 BC, with Cinna?  \t"
      answer: "(CN. PAPIRIUS) CARBO"
    boni:
      - question: "What man hunted down Carbo after Carbo fled to Sicily and became known as <latin>adulescentulus carnifex</latin>, or “teenager butcher,” for his youthful ruthlessness?"
        answer: "(CN.) POMPEIUS (MAGNUS) // POMPEY (THE GREAT)"
      - question: "According to Plutarch, Carbo grew frustrated at Sulla’s military skills during their conflict, comparing him to what two animals, but said he feared one of them more?"
        answer: "LION"
  - tossup:
      question: "What play’s quiet “<latin>statāria</latin>” plot focuses on a son who enlists in Asia and his regretful father Menedemus, who condemns himself to till his own soil as personal punishment?"
      answer: "(TERENCE’S) <title>HEAUTONTIMORUMENOS</title> / <title>SELF-TORMENTOR</title>"
    boni:
      - question: "Fill in the blank from this quote from Terence’s <title>Heautontimorumenos</title> with two Latin words: “<latin>[blank], hūmānī nihil ā mē aliēnum putō</latin>.”\t"
        answer: "<latin>HOMŌ SUM</latin>"
      - question: "At the end of <title>Heautontimorumenos</title>, Menedemus’ son Clinia returns and marries his long-time lover, who turns out to be the daughter of what neighbor of Menedemus?"
        answer: "CHREMES"
  - tossup:
      question: "For the verb <latin>iuvō,</latin> provide the second person singular present passive imperative form needed to say “be helped!”\t"
      answer: "<latin>IUVĀRE</latin>"
    boni:
      - question: "For the verb <latin>iuvō,</latin> provide the second person plural present passive imperative form needed to say “be helped!”\t"
        answer: "<latin>IUVĀMINĪ</latin>"
      - question: "For the verb <latin>iuvō,</latin> provide the second person singular future active imperative form needed to say “you shall help!”\t"
        answer: "<latin>IUVĀTŌ</latin>"
  - tossup:
      question: "This map approximates the birthplaces of several Roman authors. What letter corresponds to the birthplace of the author whom the commentators Donatus and Servius studied at length, and whose birthplace is named in his self-written epitaph: <latin>Mantua mē genuit</latin>…?"
      answer: "A (Vergil: Mantua)"
    boni:
      - question: "One of Vergil’s poet friends and fellow client of Maecenas wrote the line “<latin>caelum nōn animum mūtant quī trāns mare currunt</latin>,” last year’s convention theme. What letter marks where he was born?"
        answer: "D (Horace: Venusia)"
      - question: "What letter marks the birthplace of the Roman poet who returned there after wearying of life and poverty at Rome, with Pliny the Younger paying for his voyage?"
        answer: "F (Martial: Augusta Bi(l)bilis)"
  - tossup:
      question: "Listen carefully to the following passage, which I will read twice, based on a true story as reported by Lucian of Samosata. Then <latin>respondē Latīnē</latin> to the questions that follow: \t<latin>turbō inopinātus nāvem Lūciānī in aethera sustulit. Lūnam adeptus, proelium inter copiās lūnārēs atque sōlārēs mīrātus, Lūciānus verēbātur nē vulnerārētur. equitēs enim Lūnae ā vulturibus tricipitibus vehēbāntur; contrāriē Sōlis ā formīcīs ingentibus. ambae aciēs in campō ab arāneīs textō concurrērunt ut regnātor superōrum dēcernerētur.</latin>     "
      answer: "REREAD"
    boni:
      - question: "<latin>quālēs avēs exercitum lūnārem vehēbant?</latin>"
        answer: "VULTURĒS (TRICIPITĒS / CUM TRIBUS CAPITIBUS) "
      - question: "<latin>quis struxerat humum in quā mīlitēs pugnātūrī erant?</latin>"
        answer: "ARĀNEA(E) / ARĀNEUS / ARĀNEĪ"
  - tossup:
      question: "Who told emissaries to take the gifts that they brought him and give them to Aeneas instead, since he preferred to build the city of Argyripa rather than fight against Aeneas like at Troy?\t"
      answer: "DIOMEDES"
    boni:
      - question: "Who led Latinus’ emissaries to Diomedes?\t"
        answer: "VENULUS"
      - question: "When Ovid tells the story in the <title>Metamorphoses</title>, he says that Diomedes founded the city of Argyripa in the lands of what Iapygian king?\t"
        answer: "DAUNUS"
  - tossup:
      question: "What early Republic figure may have been mentioned as the leader of a war band on the <latin>Lapis Satricānus</latin> from the late 6th century BC, when legend says he was sole consul after Silva Arsia?"
      answer: "(P. VALERIUS) PUBLICOLA / POPLICOLA // POPLIOS VALESIOS"
    boni:
      - question: "The much more famous <latin>Lapis Niger</latin> inscription was found under the black pavement of the Roman Forum carved on a block of what material? \t\t"
        answer: "<latin>GROTTA OBSCŪRA / TŪFA</latin> / TUFF"
      - question: "The earliest known piece of writing at Rome is the possessive form of the Greek name Ktektos, which was found on a Corinthian pot in the graves on which of the seven hills of Rome?\t"
        answer: "ESQUILINE"
  - tossup:
      question: "Differentiate in meaning between <latin>faustus</latin> and <latin>haustus</latin>. \t\t"
      answer: "<latin>FAUSTUS -</latin> FORTUNATE / OF GOOD OMEN / PROPITIOUS, \t\t<latin>HAUSTUS</latin> - DRINK(ING) / SWALLOW(ING/ED) / DRAW(ING/N) / DRAUGHT / \t\tHAVING BEEN ^^^^^"
    boni:
      - question: "Differentiate in meaning between <latin>nīmīrum</latin> and <latin>nimis</latin>."
        answer: "<latin>NĪMĪRUM</latin> - WITHOUT A DOUBT / DOUBTLESS / \tCERTAINLY / SURELY / TRULY \t\t<latin>NIMIS</latin> - AND BEYOND MEASURE / TOO MUCH / EXCESSIVELY"
      - question: "Differentiate in meaning between <latin>mācresco</latin> and <latin>medeor</latin>."
        answer: "<latin>MĀCRESCO -</latin> TO GROW LEAN / PINE AWAY \t<latin>MEDEOR -</latin> TO HEAL / CURE / REMEDY"
  - tossup:
      question: "What man, after his new Scythian wife convinced him to blind or torture his sons by Cleopatra, was punished by blindness, though other stories said it came from revealing the future or giving Phrixus directions from Salmydessus?\t"
      answer: "PHINEUS"
    boni:
      - question: "According to the <title>Iliad</title>, another Cleopatra finally convinced what man, her husband, to save his city from the invading Curetes, despite his anger with his mother?\t"
        answer: "MELEAGER"
      - question: "To stop a plague, another Cleopatra was one of the first two women sent as an annual sacrifice for a thousand years to atone for the sacrilege of what man? \t \t\t"
        answer: "AJAX THE LESS(ER) / LOCRIS"
  - tossup:
      question: "Say in Latin using a subjunctive:  There’s no doubt that he killed the snakes. \t\t"
      answer: "<latin>NŌN DUBIUM EST QUĪN SERPENTĒS / ANGUĒS INTERFĒCERIT /  \t\tNECĀVERIT</latin>"
    boni:
      - question: "Say in Latin, using the form <latin>aberat</latin>: The gods were so far from favoring Rome that they aided their enemy.\t"
        answer: "<latin>TANTUM ABERAT UT DEĪ RŌMAE FAVĒRENT \t\tUT HOSTEM / HOSTĒS (EŌRUM / EIUS) IUVĀRENT</latin>"
      - question: "Without using any form of <latin>sum</latin> or its compounds, say in Latin using <latin>prohibeō</latin> and a subjunctive<latin>:</latin>  I can prevent you from entering the city.\t"
        answer: "<latin>QUEŌ (TĒ / VŌS) \t\tPROHIBĒRE QUŌMINUS / NĒ / URBEM INTRĒ(TI)S</latin>"
  - tossup:
      question: "Differentiate in derivation between the English noun soil and the English verb soil.\t\t"
      answer: "NOUN → <latin>SOLUM</latin> (“GROUND, SOIL”), VERB → <latin>SUS</latin> (“PIG”) / <latin>SOLIUM</latin> (“SEAT”)"
    boni:
      - question: "Differentiate in derivation between the English noun pall and the English verb appall."
        answer: "NOUN → <latin>PALLIUM</latin> (“CLOAK”), VERB → <latin>PALLEO</latin> (“BE(COME) PALE”)"
      - question: "Differentiate in derivation between the English verb tender as in “I hereby tender my resignation” and the English adjective tender as in “tender is the night.”"
        answer: "VERB → <latin>TENDŌ</latin> (“STRETCH”), ADJECTIVE → <latin>TENER</latin> (“SOFT, DELICATE”)"
  - tossup:
      question: "What governor of Britain fought against the Deceangli of Flintshire, the Silures of south Wales, and helped trap Caratacus before he was handed over to the Romans by the Brigantes, during his tenure from 47 to 52 AD as the successor of Aulus Plautius?"
      answer: "(P.) OSTORIUS SCAPULA"
    boni:
      - question: "Towards the end of his governorship, at what location in modern Essex did Ostorius establish a colony of veterans with a temple to Claudius?"
        answer: "CAMULODUNUM / COLCHESTER"
      - question: "What Brigantian Queen had handed over Caratacus to the Romans?\t"
        answer: "CARTIMANDUA \t <latin>SCORE CHECK</latin>"
  - tossup:
      question: "What imperial author, after joining Sextus Pompeius’ Asian proconsulship, attacked Sejanus as a bad <latin>exemplum</latin> in his nine-book <title><latin>Factōrum et Dictōrum Memorābilium</latin></title>?"
      answer: "VALERIUS MAXIMUS"
    boni:
      - question: "Maximus’ criticism of Sejanus contrasts with the praise of Sejanus in the two-book history of what author, born at Aeclanum and a cavalry commander for Tiberius?"
        answer: "(VELLEIUS) PATERCULUS"
      - question: "Sejanus is an implicit character in the work of Phaedrus since he is referenced in several forewords to the fables. What is the Greek term for such a foreword?"
        answer: "<latin>PROMȲTHION / PROMȲTHIA / PROMȲTHIUM</latin>"
