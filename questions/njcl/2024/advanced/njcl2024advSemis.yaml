tournament: "NJCL Certamen"
year: 2024
division: "Advanced"
round: "Semifinals"
questions:
  - tossup:
      question: "When her husband died in a quarrel over the proper division of cattle with the Dioscuri, what woman died by suicide, displaying similar faithfulness to when she chose a mortal lover over Apollo?\t"
      answer: "MARPESSA"
    boni:
      - question: "Who was Marpessa’s father, who pursued Marpessa and Idas as they fled from him across the Lycormas River?\t"
        answer: "EVENUS"
      - question: "In another story, Idas and his brother Lynceus quarreled with the Dioscuri because they were betrothed to what man’s daughters, whom the Dioscuri assaulted?  \t\t"
        answer: "LEUCIPPUS"
  - tossup:
      question: "Listen carefully to the following passage about a notable <latin>pepō</latin>, or pumpkin, which I will read twice, then <latin>respondē Latīnē</latin> to the questions that follow: \t<latin>in fastīgiō montis Olympī, conventus caelestis Herculem, pepōnem portantem, tuētur. pepōne prōlātō, Herculēs sollemniter intonat, “ēn hic pepō, rēliquiae Tiberiī Claudiī Caesaris Augustī Germānicī, quī particeps ōrdinis nostrī esse vult. quid faciāmus?” inde prōnuntiat Iuppiter, “ob vitia ac crūdēlitātem istīus, precem vetō. immō aptius est concīdendus, percoquendus, gustandus.”</latin>    "
      answer: "REREAD"
    boni:
      - question: "<latin>quid est dēsīderium imperātōris mortuī?</latin>"
        answer: "DEUS / NŪMEN ESSE / FIERĪ //  \t\tPARTICEPS (ŌRDINIS) DEŌRUM ESSE // DĪVĪNITĀS "
      - question: "<latin>cūr negat Iuppiter Claudium dīvum factum īrī?</latin>"
        answer: "OB / PROPTER VITIUM/A / CRŪDĒLITĀTEM //  \t\tVITIŌ / VITIĪS / CRŪDĒLITĀTE //\tAPTIUS (EST CLAUDIUS) CONCĪDENDUS / PERCOQUENDUS /  \t\tGUSTANDUS // APTUS / APTIOR EST CONCĪDĪ etc. // APTUS / APTIOR EST \tQUĪ CONCĪDĀTUR etc. // APTUM / APTIUS EST EUM CONCĪDĪ etc. "
  - tossup:
      question: "What sort of people are named in the title of a late seven-book history whose topic Augustine suggested, since it complemented his godly focus with its author Orosius’ view on non-Christians?\t\t"
      answer: "PAGAN(S) / COUNTRY-DWELLER // <latin>PĀGĀNĪ</latin>"
    boni:
      - question: "What 3rd-century AD author included reproaches of pagans in his <title><latin>Īnstrūctiōnēs</latin></title>?"
        answer: "COMMODIAN(US)"
      - question: "What author also criticized pagans in his <title><latin>Contrā Symmachum</latin></title>, written in the time of Orosius?\t"
        answer: "(A.) PRUDENTIUS (CLEMENS)"
  - tossup:
      question: "At what battle did a combined force of Samnites and Gauls under Gellius Egnatius defeat the pursuing army of Scipio Barbatus in 298 or 295 BC, leading to an important battle at Sentinum?\t"
      answer: "(BATTLE OF) CAMERINUM"
    boni:
      - question: "The Etruscans’ peace with the Romans after the Third Samnite War didn’t last. What Etruscan city’s destruction in 264 BC signaled Rome’s complete control of peninsular Italy?\t"
        answer: "VOLSINII / VULSINII"
      - question: "Where in Rome were 2,000 statues from Volsinii erected?\t"
        answer: "FORUM BOARIUM"
  - tossup:
      question: "Which of the following is the closest synonym of <latin>precor</latin>: <latin>potior, populor, postulō, plicō</latin>?  \t"
      answer: "<latin>POSTULŌ</latin>"
    boni:
      - question: "Which of the following IF ANY could not be considered a synonym of <latin>geminō</latin>: <latin>iungō</latin>, <latin>dūplicō, conferō, nectō</latin>?\t"
        answer: "THEY ALL BELONG"
      - question: "Which of the following IF ANY could not be considered a synonym of <latin>prōdō</latin>: <latin>rotō</latin>, <latin>prōmō, pariō</latin>, <latin>relinquō</latin>?\t"
        answer: "<latin>ROTŌ</latin>"
  - tossup:
      question: "Using <latin>nancīscor</latin>, say in Latin: If only I had obtained more money!\t \t\t"
      answer: "(<latin>UTINAM) PLŪS PECŪNIAE NA(N)CTUS/A/UM ESSEM</latin><emphasis><latin>!</latin></emphasis>"
    boni:
      - question: "Using <latin>adipiscor</latin>, say in Latin using a gerundive: The women have come to Rome to acquire money. \t\t"
        answer: "<latin>FĒMINAE VĒNĒRUNT RŌMAM AD PECŪNIAM ADIPISCENDAM // \tPECŪNIAE ADIPISCENDAE CAUSĀ / GRATIĀ //\tPECŪNIĀRUM ADIPISCENDĀRUM CAUSĀ / GRATIĀ</latin>"
      - question: "Say in Latin using a gerundive: We have found a lake suitable for catching large fish. \t\t"
        answer: "<latin>LACUM APTUM / IDŌNEUM MAGNŌ PISCĪ CAPIENDŌ /  \t\tMAGNĪS PISCIBUS CAPIENDĪS INVĒNIMUS / REPPERIMUS</latin>"
  - tossup:
      question: "What emperor adopted Gaius Valens Hostilianus Messius Quintus, the surviving son of Decius, after winning at Abrittus, substantiating his claim to the throne in 251 AD?\t \t\t"
      answer: "(C. VIBIUS) TREBONIANUS GALLUS"
    boni:
      - question: "Along with Hostilian, Trebonianus Gallus elevated his own son to the rank of Augustus. What was that son’s name?\t"
        answer: "(C. VIBIUS) VOLUSIAN(US)"
      - question: "At the battle of Barbalissos in 252 AD, which Persian king defeated the eastern legions and proceeded to gain control of all of Roman Syria?\t"
        answer: "SHAPUR / SAPOR I"
  - tossup:
      question: "When Julius Caesar Strabo entered the poets’ guild, what author supposedly did not rise for him, thinking his own <title>Epinausimache</title>, <title>Atreus</title>, <title>Brutus</title>, and <title>Decius</title> were better tragedies?\t"
      answer: "(L.) ACCIUS"
    boni:
      - question: "Accius’ <title>Atreus</title> contains what famous three-word Latin phrase, later used as an imperial slogan?\t"
        answer: "<latin>ŌDERINT DUM METUANT</latin>"
      - question: "What two mythological men are the main characters of Accius’ tragedy <title><latin>Nyctēgresia</latin></title>?"
        answer: "ODYSSEUS AND DIOMEDES"
  - tossup:
      question: "Who killed two men, one who sang a reaping song whilst beheading travelers and another who forced travelers to tend his vines, while he himself was serving Omphale? \t \t\t"
      answer: "HERACLES / HERCULES / ALCIDES"
    boni:
      - question: "What king of Lydia had been Omphale’s husband?\t"
        answer: "TMOLUS"
      - question: "What was the name of Omphale’s son with Heracles?\t"
        answer: "LAMUS / AGELAÜS"
  - tossup:
      question: "Give a two word phrase equivalent to the verb form <latin>fore</latin>.\t"
      answer: "<latin>FUTŪRUS/A(M)/UM ESSE</latin>"
    boni:
      - question: "Give the single Latin conjunction that best fills in the blank in the following sentence: <latin>librōs legimus</latin> [blank] <latin>celerius ad sapientiam perveniāmus.</latin>\t"
        answer: "<latin>QUŌ</latin>"
      - question: "The adverb <latin>forsan</latin> is a contraction of what three word Latin phrase? \t"
        answer: "<latin>FORS SIT AN</latin>"
  - tossup:
      question: "Which of the following English words is NOT derived from a Latin word meaning to destroy: devastate, indelible, subdue, and perdition? \t"
      answer: "SUBDUE"
    boni:
      - question: "What English verb derived from <latin>radō</latin> means “completely destroy,” as in a town? \t\t"
        answer: "RAZE / ERASE"
      - question: "What English verb derived from <latin>stirps</latin> means “root out and destroy completely”? \t\t"
        answer: "EXTIRPATE"
  - tossup:
      question: "What late emperor, after defeating a rebellion of the widow Faustina and usurper Procopius, settled the Danube frontier with starving Goths who then invaded Thrace in 376 AD?  \t"
      answer: "VALENS"
    boni:
      - question: "Valens ruled in the east, with Valentinian I ruling in the west until 375 AD. Valentinian I is said to have died of a stroke after getting angry during negotiations with what Germanic people?\t"
        answer: "QUADI"
      - question: "Faustina was the widow of what man, who ruled the entire empire after the death of his brothers Constans and Constantine II?\t"
        answer: "CONSTANTIUS II"
  - tossup:
      question: "What woman, whose beauty Ovid says drew a thousand suitors, compared herself favorably to Diana and was consequently shot with an arrow after bearing twins, one fathered by Apollo and one by Mercury?\t"
      answer: "CHIONE"
    boni:
      - question: "Who was Chione’s father, who was transformed into a hawk out of grief at her death? \t\t"
        answer: "DAEDALION"
      - question: "What skilled musician was Chione’s son by Apollo?\t"
        answer: "PHILAMMON"
  - tossup:
      question: "<latin>Respondē Latīnē</latin>: <latin>quid accidit ubi multitūdō guttārum aquae liquidae dē caelō cadat?</latin>\t"
      answer: "<latin>PLUIT / PLUVIA(E) / IMBER</latin> (or another appropriate description in Latin)"
    boni:
      - question: "<latin>Respondē Latīnē</latin>: <latin>quid accidit ubi gubernātor nōn cōnspicit alteram nāvem adesse et nāve suā eam ferit?</latin>\t"
        answer: "NAUFRAGIUM (EST) / NĀVIS (SUB)MERSA EST \t\t(or another appropriate description in Latin)"
      - question: "<latin>Respondē Latīnē</latin>: <latin>quandō gubernātor suā sponte alteram nāvem nāve suā ferit?</latin> \t\t"
        answer: "<latin>IN NAUMACHIĀ / BELLŌ (NĀVALĪ) // UT HOSTĒS SUBMERGAT</latin> \t\t(or another appropriate description in Latin)"
  - tossup:
      question: "What author wrote “<latin>tantā dulcēdine captōs / adficit animōs</latin>,” referring to the style of his sketchbook collection of 32 poems titled <title><latin>Silvae</latin></title> and his mythological epic <title>Thebaid</title>?"
      answer: "(P. PAPINIUS) STATIUS"
    boni:
      - question: "What other mythological epic of Statius was left unfinished?\t"
        answer: "<title>ACHILLEID</title>"
      - question: "Statius was a favorite and inspiration for what medieval author of the poem \t\t<title>The House of Fame</title> and the epic <title>Troilus and Criseyde</title>?\t"
        answer: "(C. / GEOFFREY) CHAUCER  <latin>SCORE CHECK</latin>"
  - tossup:
      question: "Describe the genre of the work seen here. Given that <latin>ēlixam</latin> means “boiled,” it should be no surprise this is an excerpt from Apicius’ <title><latin>Dē rē coquīnāriā</latin></title>."
      answer: "RECIPE / COOKBOOK"
    boni:
      - question: "This recipe yields a sauce similar to Worcestershire. In English, name three of the ingredients listed in the third line."
        answer: "WINE (<latin>vīnum</latin>), (SWEET) WINE (REDUCTION, <latin>carēnum</latin>),  \tHONEY (<latin>mel</latin>), (OLIVE) OIL (<latin>oleī</latin>), (DRY) VINEGAR (<latin>acētum</latin>)"
      - question: "In the second line, an ingredient is listed that was thought to be extinct until its rediscovery just last year. What is the Latin name for that ingredient?\t "
        answer: "SILPHIUM / SILFIUM "
  - tossup:
      question: "<latin>Respondē Latinē: Quod mare invenītur inter Mare Aegaeum et Pontum Euxīnum?</latin>\t\t"
      answer: "<latin>(MARE / PONTUS) PROPONTIS // (MARE) PROPONTICUM // \t\t(PONTUS) PROPONTICUS</latin>"
    boni:
      - question: "<latin>Respondē Latinē: Quod fretum transītur nāvibus nāvigantibus ē Propontide in septentriōnēs?</latin>"
        answer: "<latin>BOSP(H)ORUS</latin> "
      - question: "<latin>Respondē Latinē: Quī lacus magnus iacet iuxtā Pontum Euxīnum ubi Scythae habitāre dicuntur?</latin>"
        answer: "<latin>(LACUS / PĀLUS) MAEŌTIS</latin> "
  - tossup:
      question: "What use of the accusative case is found in the following sentence: <latin>Lacrima cecidit dē vultū Eurydicēs sua pectora tunsae.</latin> \t\t"
      answer: "GREEK (ACCUSATIVE) / SPECIFICATION / SYNECDOCHICAL / RESPECT  \t\t(accept description)"
    boni:
      - question: "What use of the accusative case is found in the following sentence: <latin>Sī ātrium tuum, odōrem cibī redolēns, fēlibus egeat, mūrēs statim ingrediantur.</latin>\t \t\t"
        answer: "COGNATE (ACCUSATIVE) / KINDRED SPECIFICATION \t\t(prompt on “direct object”)"
      - question: "Now translate that sentence: <latin>Sī ātrium tuum, odōrem cibī redolēns, fēlibus egeat, mūrēs statim ingrediantur.</latin>\t \t\t"
        answer: "IF YOUR ATRIUM, SMELLING / REDOLENT OF (THE SMELL OF) FOOD, \t(SHOULD) LACK / LACKS CATS,  \t\tIMMEDIATELY (THE) MICE WOULD / WILL / COULD ENTER"
  - tossup:
      question: "What Greek warrior campaigned with Belus or married a daughter of Cinyras on Cyprus  after the Trojan War, when he nearly shot Hector and often hid behind the great shield of his half-brother Ajax?\t"
      answer: "TEUCER"
    boni:
      - question: "What woman, a relative of the Trojan king Priam, was Teucer’s mother?\t"
        answer: "HESIONE"
      - question: "In the <title>Iliad</title>, Teucer loses the archery-contest at Patroclus’ funeral-games when Apollo causes him to miss the pigeon that was his target, hitting what instead?  \t\t"
        answer: "THE CORD (THAT WAS TIED TO THE PIGEON’S FOOT AND A SHIP’S MAST)  <latin>SCORE CHECK</latin>"
  - tossup:
      question: "Experts in what field include two rival consular candidates under Augustus, though only one accepted the position? Both were featured in later works by Gaius and Ulpian and in the <title><latin>Corpus Iūris Cīvīlis</latin></title>. \t"
      answer: "(CIVIL) LAW / LEGAL / JURISPRUDENCE"
    boni:
      - question: "What other jurist was known for his many books of <title><latin>Quaestiōnēs</latin></title> and <title><latin>Respōnsa</latin></title>?"
        answer: "(AEMILIUS) PAPINIAN(US)"
      - question: "What jurist wrote a consolatory letter to Cicero upon the death of his daughter, Tullia, and had a niece who wrote six poems that survive in the corpus of Tibullus’ works?"
        answer: "(SER.) SULPICIUS (RUFUS)"
