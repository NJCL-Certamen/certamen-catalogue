tournament: "NJCL Certamen"
year: 2024
division: "Intermediate"
round: "Round 1"
questions:
  - tossup:
      question: "Containing the Sporades and Cyclades islands, what arm of the Mediterranean Sea lies to the north of Crete, separating Asia Minor from Greece, and was named for the father of Theseus?\t"
      answer: "AEGEAN SEA / <latin>MARE AEGAEUM</latin> [PASS OUT <emphasis>VISUAL</emphasis>]"
    boni:
      - question: "Which letter identifies the Hellespont, a critical shipping lane near the site of Troy where Helle fell while riding the Golden Ram to Colchis?"
        answer: "E"
      - question: "Which letter identifies the Saronic Gulf, the location of the port that Theseus founded at Piraeus and the island of Salamis from where Telamonian Ajax hailed?"
        answer: "D"
  - tossup:
      question: "In a touching scene that echoes an almost identical moment from Book 11 of Homer’s <title>Odyssey</title>, what man thrice attempts to embrace the ghost of his wife Creüsa while leaving Troy in Book 2 of Vergil’s <title>Aeneid</title>?\t"
      answer: "AENEAS"
    boni:
      - question: "Which son of Aeneas and Creüsa travels with him on his journey to Italy?\t\t"
        answer: "ASCANIUS / IULUS"
      - question: "Whose ghost had appeared to Aeneas as the Greeks took the city, warning him to flee? \t\t"
        answer: "HECTOR"
  - tossup:
      question: "What English term used in geometry literally “carries itself around” the outside of a circular area?\t"
      answer: "CIRCUMFERENCE"
    boni:
      - question: "What circle-related term, from the Latin word for “to touch,” is a line that touches a curve at exactly one point?\t"
        answer: "TANGENT"
      - question: "A secant is a line that crosses a curve at two or more points. From what Latin word with what meaning is secant derived?\t"
        answer: "<latin>SECŌ, SECĀRE</latin>"
  - tossup:
      question: "Agrippina the Younger and Drusus Caesar were among the descendants of what notable woman of the Julio-Claudian family, who was the only daughter of Augustus?"
      answer: "JULIA (THE ELDER / <latin>MAIOR</latin>)"
    boni:
      - question: "Which children of Julia the Elder were designated as heirs to the throne ahead of Tiberius prior to their deaths in 2 AD and 4 AD?\t"
        answer: "GAIUS & LUCIUS CAESAR"
      - question: "What was the relationship between the emperor Caligula and Julia the Elder?"
        answer: "JULIA THE ELDER WAS CALIGULA’S GRANDMOTHER"
  - tossup:
      question: "Using the verb <latin>sequor</latin>, say in Latin “you are following.” \t\t"
      answer: "<latin>SEQUERIS / SEQUERE / SEQUIMINĪ</latin>"
    boni:
      - question: "Using the same verb, now say in Latin “they had followed.”\t\t"
        answer: "<latin>SECŪTĪ/AE/A ERANT // SECŪTUS/A/UM ERAT</latin>"
      - question: "And using that same verb again, say in Latin “to follow.” \t\t"
        answer: "<latin>SEQUĪ / SECŪTUM / SECŪTŪ</latin>"
  - tossup:
      question: "Which figure in the Underworld, traditionally paid in obols, ignored the spirits crowding the riverbanks who could not pay the fee for his ferry?\t"
      answer: "CHARON"
    boni:
      - question: "Which crafty Corinthian king, improperly buried by his wife, took advantage of the traditional Greek burial rituals to escape the Underworld?\t"
        answer: "SISYPHUS"
      - question: "Which brother of Sisyphus was also in the Underworld, in his case for the crime of imitating Zeus with torches and clashing metal?\t"
        answer: "SALMONEÜS"
  - tossup:
      question: "<latin>Dēscrībāmus nunc prōprietātēs dictiōnum in hāc sententiā: Rēgīna, ā cīvibus laudāta, erat laeta. Quae pārs ōrātiōnis est “rēgīna”?</latin>\t"
      answer: "NŌMEN"
    boni:
      - question: "<latin>Quae pārs ōrātiōnis est “laeta”?</latin>\t"
        answer: "ADIECTĪVUM"
      - question: "<latin>Quae pārs ōrātiōnis est “erat”?</latin>\t"
        answer: "VERBUM"
  - tossup:
      question: "Against a fleet commanded by Hanno the Great, where did the Romans led by Lutatius Catulus effectively end the First Punic War in 241 BC?\t"
      answer: "AEGATES (ISLANDS)"
    boni:
      - question: "As part of the war indemnity imposed on the Carthaginians, what island was given entirely to Rome as its first province outside peninsular Italy?\t"
        answer: "SICILY"
      - question: "In 238 BC, what Carthaginian man and father of Hannibal was given chief command of the Punic forces?\t"
        answer: "HAMILCAR (BARCA)"
  - tossup:
      question: "<latin>Quid Anglicē significat venēnum</latin>?\t"
      answer: "POISON / POTION / VENOM / DRUG"
    boni:
      - question: "<latin>Quid Anglicē significat interdum</latin>?\t"
        answer: "SOMETIMES / OCCASIONALLY / MEANWHILE"
      - question: "<latin>Quid Anglicē significat caedēs</latin>?\t"
        answer: "SLAUGHTER / MURDER / HAVOC / KILLING //  \t\tYOU WILL KILL"
  - tossup:
      question: "Translate the following sentence from Latin to English: <latin>Exīre mihi placet.</latin> \t\t"
      answer: "IT PLEASES ME TO LEAVE // I WANT TO LEAVE // I (WOULD) LIKE TO LEAVE"
    boni:
      - question: "Translate the following sentence from Latin to English: <latin>Fūribus fūgere nōn licet.</latin> \t\t"
        answer: "IT IS NOT ALLOWED / PERMITTED FOR THIEVES TO FLEE // \t\tTHIEVES ARE NOT ALLOWED TO FLEE // THIEVES MAY / CAN NOT FLEE"
      - question: "Translate the following sentence from Latin to English: <latin>duōs annōs trāns mare nāvigāvimus.</latin>\t"
        answer: "WE SAILED ACROSS THE SEA (FOR) TWO YEARS  <latin>SCORE CHECK</latin>"
  - tossup:
      question: "In Book 14 of Homer’s <title>Iliad</title>, which goddess, in an attempt to influence the outcome of the Trojan War, asked a son of Nyx to help her temporarily incapacitate her husband Zeus?\t"
      answer: "HERA"
    boni:
      - question: "Who was this son of Nyx who assisted Hera?\t"
        answer: "SLEEP / HYPNOS"
      - question: "In Book 16, which Trojan ally’s body is carried away by Sleep and Death to his home in Lycia?\t"
        answer: "SARPEDON’S"
  - tossup:
      question: "When recognized, perform or describe the following command: <latin>Monstrā moderātōrī titulum nōminis tuī.</latin> \t\t"
      answer: "PLAYER SHOULD SHOW THE MODERATOR THEIR NAMETAG"
    boni:
      - question: "Perform or describe the following commands: <latin>surgite et clāmāte “iō certāmen!”</latin> \t\t"
        answer: "PLAYERS SHOULD GET UP AND SHOUT “YAY CERTAMEN / CONTEST!” \t\t(accept any expression of excitement, e.g. huzzah, yo!)"
      - question: "Perform or describe the following commands: <latin>nārrāte auditōribus “hic locus est frigidus!”</latin> \t\t"
        answer: "PLAYERS SHOULD TELL THE AUDIENCE “THIS PLACE / ROOM IS COLD!”"
  - tossup:
      question: "Where might a Roman have seen a man cutting himself free with a knife after colliding with a rival around the <latin>mēta</latin> at the end of the <latin>spīna</latin> to avoid getting trampled by his horses?\t"
      answer: "<latin>CIRCUS (MAXIMUS)</latin> / CHARIOT (RACE)"
    boni:
      - question: "How many horses pulled the <latin>quadrīga</latin>, the most common form of chariot?"
        answer: "FOUR"
      - question: "If a horse was called a <latin>centēnārius</latin>, what distinction had it achieved?"
        answer: "100 VICTORIES"
  - tossup:
      question: "What hero, who killed famous kings like Hippocoön, Neleüs, Laomedon, and Eurytus, was most famous for serving his cousin by completing mighty tasks such as avian pest control and royal clothing theft, as well as lion and hydra slaying?\t\t"
      answer: "HERACLES / HERCULES"
    boni:
      - question: "Which daughter of the aforementioned Eurytus did Heracles attempt to marry by winning an archery contest?\t"
        answer: "IOLE"
      - question: "Which centaur convinced Heracles’ wife Deianira to take his toxic blood, playing on her jealousy of Iole?\t"
        answer: "NESSUS"
  - tossup:
      question: "Which of the following, if any, does not belong because of derivation: augment, authority, auxiliary, auction?\t"
      answer: "THEY ALL BELONG"
    boni:
      - question: "From what Latin verb with what meaning do the words in the tossup derive?\t "
        answer: "AUGEŌ, AUGĒRE - TO INCREASE"
      - question: "The English and Latin word <latin>augur</latin> has some dubious derivation. According to some, it derives from <latin>augeō</latin>. To others, it derives from what Latin noun with what meaning, which also gives us words like “aviation”?"
        answer: "<latin>AVIS</latin> - BIRD"
  - tossup:
      question: "Listen carefully to the following passage about King Croesus of Lydia and Solon the Athenian, which I will read twice, then respond in English to the questions that follow: \t<latin>ōlim Croesus, vir dīves, Lȳdiam regēbat. dum Solōn, sapientiā nōtus, Lȳdiam vīsitat, rēx eum rogāvit, “quis est homō fēlīcissimus in mundō?” Solōn, pecūniam Croesī nōn laudāns, respondit, “agricola nōmine Tellūs. erat neque dīves neque pauper, sed līberōs habuit, et moriēbātur patriam suam custōdiēns.”</latin>"
      answer: "REPEAT"
    boni:
      - question: "What did Solon fail to praise?"
        answer: "(CROESUS’) WEALTH / RICHES / MONEY"
      - question: "What was Tellus, the happiest man on earth, doing when he died?"
        answer: "GUARDING / DEFENDING HIS COUNTRY"
  - tossup:
      question: "Using the noun <latin>cīvis</latin>, give the appropriate Latin form for “citizen” in the sentence “Caesar led the citizens into war.”\t"
      answer: "<latin>CĪVĒS / CĪVĪS</latin>"
    boni:
      - question: "Now using <latin>cīvis</latin>, give the appropriate Latin form for “citizen” in the sentence “Caesar trusted the citizens, because he knew they would make the right decision.” \t\t"
        answer: "<latin>CĪVIBUS / CĪVĒS / CĪVĪS</latin>"
      - question: "Again using <latin>cīvis</latin>, give the form for “citizen” in “Part of the citizens wanted to continue fighting.”\t"
        answer: "<latin>CĪVIUM</latin>"
  - tossup:
      question: "Provide the Latin phrase and English translation for the abbreviation <latin>et al.</latin>, which is often used to denote further contributors to a paper in a bibliography.\t \t\t"
      answer: "ET ALIĪ/AE/A, AND THE OTHERS"
    boni:
      - question: "Provide the Latin word and English translation for the abbreviation <latin>ibid.</latin>\t \t\t"
        answer: "IBIDEM, IN THE SAME PLACE"
      - question: "Where in an academic paper might you see the abbreviation <latin>ibid.</latin>? \t\t"
        answer: "IN A FOOTNOTE / ENDNOTE / CITATION / BIBLIOGRAPHY"
  - tossup:
      question: "Who, the first mortal on Ithaca to learn the true identity of the disguised Odysseus, had recently returned from sandy Pylos with a seer and had spent years supporting his mother Penelope?\t"
      answer: "TELEMACHUS"
    boni:
      - question: "Name the seer, the son of Polypheides, that Telemachus brought back with him to Ithaca. \t\t"
        answer: "THEOCLYMENUS"
      - question: "Which Ithacan seer interpreted an omen of two eagles in Book 2 of Homer’s <title>Odyssey</title>? \t\t"
        answer: "HALITHERSES <latin>SCORE CHECK</latin>"
  - tossup:
      question: "What emperor might have gone on to be one of Rome’s greatest rulers if not for his untimely death in 81 AD, after which he was succeeded by his markedly less beloved brother Domitian?\t"
      answer: "TITUS"
    boni:
      - question: "Besides the eruption of Mt. Vesuvius, name one of the other natural disasters that occurred during Titus’ short reign.\t"
        answer: "FIRE (IN ROME) / EARTHQUAKE / PLAGUE"
      - question: "Perhaps Titus’ only major “controversy” was the affair he carried on with a Jewish princess. Name her.\t"
        answer: "BERENICE"
