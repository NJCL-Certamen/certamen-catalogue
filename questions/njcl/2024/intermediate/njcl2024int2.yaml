tournament: "NJCL Certamen"
year: 2024
division: "Intermediate"
round: "Round 2"
questions:
  - tossup:
      question: "What type of ceremony in ancient Rome is taking place when a person, having been touched by a <latin>vindicta</latin> in the presence of a <latin>praetor</latin>, is then allowed to wear a <latin>pilleus</latin> for the first time after earning their freedom? \t\t"
      answer: "<latin>MANŪMISSIŌ</latin> / MANUMISSION // FREEDOM (FROM SLAVERY) //  \t\tBECOME A <latin>LĪBERTUS/A</latin>"
    boni:
      - question: "How were the three parts of a freedman’s new name typically determined when their former <latin>dominus</latin> was a male Roman citizen?"
        answer: "<latin>PRAENŌMEN</latin>: SAME AS <latin>DOMINUS</latin> / ASSIGNED BY <latin>DOMINUS</latin> \t\t<latin>NŌMEN</latin>: SAME AS <latin>DOMINUS</latin>  \t\t<latin>COGNŌMEN</latin>: ENSLAVED PERSON’S (SINGLE) NAME USED DURING THEIR \t\tENSLAVEMENT"
      - question: "How was the freedman’s name determined when freed from a female <latin>domina</latin>, who would have lacked a three-part name?\t "
        answer: "PRAENŌMEN AND <latin>NŌMEN</latin> TAKEN FROM <latin>DOMINA</latin>’S FATHER  \t\t(<latin>COGNŌMEN</latin> STILL ENSLAVED PERSON’S SINGLE NAME)"
  - tossup:
      question: "Which Titaness spent nine nights with Zeus, personified memory, and was the mother of the Muses?\t"
      answer: "MNEMOSYNE"
    boni:
      - question: "Which of Mnemosyne’s brothers was a Titan of the sun?\t"
        answer: "HYPERION"
      - question: "By which other Titaness did Zeus father the Hours and the Fates?\t"
        answer: "THEMIS"
  - tossup:
      question: "While she was fetching water from the spring of Camena, what figure of early Roman history was said to have betrayed the city gates to the Sabines and was crushed by their shields?\t"
      answer: "TARPEIA"
    boni:
      - question: "What Sabine commander later became the co-ruler of Rome with Romulus? \t\t"
        answer: "(TITUS) TATIUS"
      - question: "What woman, who later became the wife of Romulus, was said to have halted the fighting between the Romans and the Sabines?\t"
        answer: "HERSILIA / HORA"
  - tossup:
      question: "Using the verb <latin>moneō</latin>, say in Latin “she was warned.”\t"
      answer: "<latin>MONĒBĀTUR / MONITA EST</latin>"
    boni:
      - question: "Now make <latin>monēbātur</latin> future perfect tense, meaning “she will have been warned.” \t\t"
        answer: "<latin>MONITA ERIT</latin>"
      - question: "Change <latin>monita erit</latin> to the present active subjunctive, so that it means “let her warn.” \t\t"
        answer: "<latin>MONEAT</latin>"
  - tossup:
      question: "Listen carefully to the following passage, which I will read twice, as wealthy King Croesus and the wise Solon continue to discuss the happiest person in the world. Then <latin>respondē Latīnē</latin> to the questions that follow: \t<latin>postquam Solōn agricolam fēlīcissimum hominum appellāvit,</latin> <latin>verba rēgem Croesum nōn delectābant. rēx, vexātus, iterum rogāvit, “quis autem est secundus fēlicitāte?” Solōn respondit, “Bitōn et Cleobis, quōrum māter erat sacerdōs. postquam bovēs āmissī erant, iuvenēs mātrem ad templum tulērunt et in somnō mortuī sunt.”</latin>"
      answer: "(REREAD)"
    boni:
      - question: "<latin>ad quem locum volēbat māter īre?</latin>"
        answer: "(AD) TEMPLUM"
      - question: "<latin>cūr iuvenēs, nōn bovēs, sacerdōtem portābant?</latin>"
        answer: "(CUM / QUIA / QUOD) BOVĒS ĀMISSĪ ESSENT / SUNT / ERANT / SINT"
  - tossup:
      question: "According to Book 4 of Ovid’s <title>Metamorphoses</title>, which Greek hero was shooed away by Atlas, who feared a son of Jupiter would steal his golden apples, and repaid this inhospitality by using the head of Medusa to turn Atlas to stone?\t"
      answer: "PERSEUS"
    boni:
      - question: "Which princess did Perseus save from a sea monster shortly after his encounter with Atlas?\t"
        answer: "ANDROMEDA"
      - question: "Which kingdom was ruled by Andromeda’s parents, Cepheus and Cassiopeia? \t\t"
        answer: "(A)ETHIOPIA"
  - tossup:
      question: "What English derivative of the Latin verb <latin>trahō, trahere</latin> is an operation in mathematics, used for taking one number away from another number?     \t"
      answer: "SUBTRACT(ION)"
    boni:
      - question: "What Latin verb is the ultimate root of addition?\t "
        answer: "DŌ, DARE (prompt on <latin>ADDŌ, ADDERE</latin>)"
      - question: "What English word for an operation in mathematics is derived from a Latin verb meaning “to fold?”"
        answer: "MULTIPLY / MULTIPLICATION"
  - tossup:
      question: "Following the death of Alexander Severus in 235 AD, what man from the Balkans, who once wrestled seven Roman soldiers in a row, took the throne and kicked off the period of the barracks emperors for the next 50 years?\t"
      answer: "MAXIMINUS THRAX"
    boni:
      - question: "If Maximinus Thrax was Rome’s largest emperor, his rival was perhaps its very oldest. Name this senator from Africa who briefly ruled jointly with his son of the same name in 238 AD.\t"
        answer: "GORDIAN I"
      - question: "What 13-year-old emperor survived the year 238 AD to rule for six years supported by his praetorian prefect, Timesitheus? \t"
        answer: "GORDIAN III"
  - tossup:
      question: "Which of the following words does NOT belong due to meaning: <latin>aqua</latin>, <latin>saxum, lac, oleum</latin>, <latin>vīnum</latin>?\t"
      answer: "<latin>SAXUM</latin>"
    boni:
      - question: "You could make a good comparison between this type of question and the New York Times’ mini-game “Connections. What category do the rest of the words from the toss-up fit under?\t"
        answer: "LIQUIDS / EDIBLES (ACCEPT SIMILAR)"
      - question: "If the category to tie the following words together were ‘verbs to describe fire,’ what is a Latin word you could add to go with <latin>ārdeō, caleō,</latin> and <latin>ūrō</latin>?\t \t\t"
        answer: "INCENDŌ / FERVEŌ / FLAMMŌ / AESTUŌ / TORREŌ / CREMŌ"
  - tossup:
      question: "Identify the use of the ablative case in the following Latin sentence: <latin>Caesare interfectō, senātus in tumultum mittitur.</latin>\t"
      answer: "ABLATIVE ABSOLUTE (or comparable description)"
    boni:
      - question: "Identify the use of the ablative case in the following sentence: <latin>senātōrēs rem magnā cum cūrā agere temptāvērunt.</latin>\t"
        answer: "MANNER (or comparable description)"
      - question: "Identify the use of the ablative case in the following sentence: <latin>Calpurnia dolōre lacrimāre coepit.</latin>\t"
        answer: "CAUSE / MANNER / SOURCE (or comparable description)"
  - tossup:
      question: "Which aunt of Actaeon and Pentheus, misled by a goddess disguised as her nurse, demanded that her lover Zeus appear to her as he routinely appeared to his own wife, which led to her incineration and the strange birth of the god Dionysus?\t"
      answer: "SEMELE"
    boni:
      - question: "Which of her sisters was the mother of Pentheus?\t"
        answer: "AGAVE"
      - question: "Which of her sisters was the mother of Actaeon?\t"
        answer: "AUTONOË"
  - tossup:
      question: "Using the noun <latin>lūna</latin> and the adjective <latin>tertius</latin>, say in Latin “on the third moon.” \t\t"
      answer: "(IN) LŪNĀ TERTIĀ"
    boni:
      - question: "Using the Latin noun <latin>stella</latin> and the adjective <latin>ambō</latin>, translate the prepositional phrase “from both stars” into Latin.\t"
        answer: "(<latin>ĀB / DĒ / EX) AMBĀBUS STELLĪS</latin>"
      - question: "Using the noun <latin>nūbes</latin> and the adjective <latin>parvus</latin>, translate the prepositional phrase “through a small cloud” into Latin.\t"
        answer: "<latin>PER NŪBEM PARVAM / NŪBE PARVĀ</latin>"
  - tossup:
      question: "Which of the following ancient locations lay farthest north? Tarentum, Beneventum, Agrigentum, Mediolanum?\t"
      answer: "MEDIOLANUM"
    boni:
      - question: "Which of the following ancient locations lay farthest south? Ravenna, Capua, Tibur, Ticinus River?\t"
        answer: "CAPUA"
      - question: "Which of the following ancient locations lay farthest west? Drepana, Olisipo, Lutetia, Gades?\t"
        answer: "OLISIPO"
  - tossup:
      question: "The 45th anniversary of Kylie Minogue’s career was marked with the release of her album <title>Tension</title> last year. From what Latin verb with what meaning is “tension” derived?\t\t"
      answer: "<latin>TENDŌ -</latin> TO STRETCH / BEND"
    boni:
      - question: "Beyoncé marked 34 years of her career with the release of <title>Cowboy Carter</title> earlier this year. The title of the track <title>Protector</title> is derived from what Latin verb with what meaning?\t "
        answer: "(<latin>PRŌ)TEGŌ</latin> - TO COVER / PROTECT"
      - question: "At present, the worm in everybody’s ear is Sabrina Carpenter’s <title>Espresso</title>. From what Latin verb with what meaning is “espresso” derived?\t "
        answer: "PREMŌ - TO PRESS / <latin>EXPRIMŌ</latin> - TO (EX)PRESS"
  - tossup:
      question: "In Book 21 of Homer’s <title>Iliad</title>, which god, sent by Hera, saves Achilles from the enraged Scamander with great blasts of flame?\t"
      answer: "HEPHAESTUS"
    boni:
      - question: "What was the name the gods used for the river Scamander?\t"
        answer: "XANTHUS"
      - question: "In the subsequent fight between the gods, which Olympian declines to fight Leto, learning from Hera’s treatment of Artemis that Zeus’ consorts seem to pack a punch? \t\t"
        answer: "HERMES  <latin>SCORE CHECK</latin>"
  - tossup:
      question: "<title>(Note to moderator: read Ti as T-I):</title> \tA Roman altar from the 1st century AD bears the inscription <latin>Ti Claudius Felix</latin>. What is the <latin>praenōmen</latin> of the individual named?\t"
      answer: "TIBERIUS [PASS OUT <emphasis>VISUAL</emphasis>]"
    boni:
      - question: "What is the relationship among the three people named on the inscription?"
        answer: "FATHER, MOTHER, AND (THEIR) SON / CHILD //  \t\tHUSBAND, WIFE, AND (THEIR) SON / CHILD \t\t(PROMPT ON “A FAMILY”)"
      - question: "According to the inscription, to whom is this monument dedicated?"
        answer: "(THE MOST SACRED) SUN (GOD) /  \t\t<latin>SOL (SANCTISSIMUS) / SOLĪ (SANCTISSIMŌ)</latin> "
  - tossup:
      question: "When a student successfully completes medical school and receives their degree, they are officially able to claim the title <latin>M.D.</latin> For what Latin phrase, with what English meaning, does <latin>M.D.</latin> stand?\t"
      answer: "<latin>MEDICĪNAE DOCTOR / DOCTRIX</latin>, DOCTOR OF MEDICINE"
    boni:
      - question: "Some students may choose to pursue a <latin>Ph.D.</latin> For what Latin phrase, with what English meaning, does <latin>Ph.D.</latin> stand?\t \t\t"
        answer: "PHILOSOPHIAE DOCTOR / DOCTRIX, DOCTOR OF PHILOSOPHY"
      - question: "Some students may choose to attend law school and pursue a <latin>J.D.</latin> For what Latin phrase, with what English meaning, does <latin>J.D.</latin> stand?\t \t\t"
        answer: "JŪRIS DOCTOR / DOCTRIX, DOCTOR OF LAW"
  - tossup:
      question: "Given the strict rules of Greek hospitality, who was sent with a sealed letter written by King Proëtus to the court of King Iobates, a letter that instructed Iobates to kill its bearer? \t\t"
      answer: "BELLEROPHON(TES) / HIPPONOÜS"
    boni:
      - question: "What personal stake did King Iobates have in the alleged crime committed by Bellerophon at the court of King Proëtus? \t\t"
        answer: "BELLEROPHON HAD ALLEGEDLY VIOLATED (ANTEIA / STHENEBOEA) \t\tTHE DAUGHTER OF IOBATES (AND KING PROËTUS’ WIFE)"
      - question: "Which daughter of Iobates did Bellerophon eventually marry?\t\t"
        answer: "PHILONOË / CA(S)SANDRA / ANTICLEIA"
  - tossup:
      question: "After what disastrous defeat were the armies of Titus Veturius Calvinus and Spurius Postumius Albinus forced to pass under the yoke in 321 BC?\t \t\t"
      answer: "CAUDINE FORKS / <latin>FURCULAE CAUDĪNAE</latin>"
    boni:
      - question: "What Samnite commander defeated the Romans at this battle?\t"
        answer: "GA(V)IUS PONTIUS"
      - question: "Due to a dispute about Sabine tribes and an appeal for Roman help, what city near Pompeii served as the <latin>cāsus bellī</latin> for the Second Samnite War?\t"
        answer: "<latin>NEĀPOLIS</latin> / NAPLES  <latin>SCORE CHECK</latin>"
  - tossup:
      question: "<latin>Dēscrībāmus nunc prōprietātēs dictiōnum in hāc sententiā:  Pater fīliīs fīliābusque cibum parābat.  Quō cāsū est “cibum”?</latin>\t \t\t"
      answer: "ACCŪSĀTĪVŌ / (CĀSUS EST) ACCŪSĀTĪVUS"
    boni:
      - question: "<latin>Quō cāsū est “fīliīs” in illā sententiā?</latin>\t"
        answer: "DATĪVŌ / DATĪVUS"
      - question: "<latin>Quō cāsū est “pater”?</latin>\t"
        answer: "NŌMINĀTĪVŌ / NŌMINĀTĪVUS"
