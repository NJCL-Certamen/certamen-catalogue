tournament: "NJCL Certamen"
year: 2024
division: "Intermediate"
round: "Finals"
questions:
  - tossup:
      question: "Give the Latin for the prepositional phrase in the following sentence: Many Roman students learned oratory in Athens.\t"
      answer: "<latin>ATHĒNĪS</latin>"
    boni:
      - question: "Using the noun <latin>studium</latin> and the adjective <latin>gravis</latin>, translate the prepositional phrase in the following sentence: “They applied themselves with serious zeal.” \t\t"
        answer: "<latin>GRAVĪ (CUM) STUDIŌ</latin>"
      - question: "Now give the Latin for the prepositional phrase in the following sentence “When they finished their studies, they returned to Rome.”\t"
        answer: "<latin>RŌMAM</latin>"
  - tossup:
      question: "The Romans gained the upper hand in what conflict when they were able to shift war veterans from the siege of Numantia under Scipio Aemilianus to Sicily in 133 BC?\t \t\t"
      answer: "FIRST SERVILE WAR / FIRST SICILIAN SLAVE REVOLT"
    boni:
      - question: "What two men, one Cilician and one Syrian, led this revolt?\t"
        answer: "EUNUS AND CLEON"
      - question: "The First Servile War, along with some additional revolts in Campania, may have also led to an uprising of Pergamene serfs under what pretender to the throne of that kingdom?"
        answer: "ARISTONICUS // EUMENES III"
  - tossup:
      question: "“Menagerie,” “menial,” and “remnant” are derived from what Latin verb with what meaning?\t"
      answer: "<latin>MANEŌ -</latin> TO REMAIN, STAY"
    boni:
      - question: "“Jeopardy” and “parcel” are derived from what Latin noun with what meaning?"
        answer: "<latin>PARS</latin> - PART"
      - question: "“Adequate” and “egalitarian” all come from what Latin adjective with what meaning?"
        answer: "<latin>AEQUUS</latin> - EQUAL, LEVEL, FAIR"
  - tossup:
      question: "Who rejected the advice of Polydamas that the Trojans retreat back within the city’s walls, instead opting to camp out by the Greek ships, whereupon he saw an illusion of his brother Deiphobus and died at Achilles’ hands?\t"
      answer: "HECTOR"
    boni:
      - question: "Which deity impersonated Deiphobus during Hector’s fight with Achilles?\t"
        answer: "ATHENA"
      - question: "What does Hector prophesy immediately before his death? \t\t"
        answer: "ACHILLES’ DEATH (AT PARIS’ HANDS, WITH APOLLO’S HELP)"
  - tossup:
      question: "Give an antonym of the Latin nouns <latin>exōrdium</latin>, <latin>prīncipium</latin>, and <latin>initium</latin>, which all mean “beginning.”\t"
      answer: "<latin>FĪNIS / EXITUS / TERMINUS / PERŌRĀTIO</latin>"
    boni:
      - question: "What defective Latin verb means “begin”?\t"
        answer: "<latin>COEPĪ / COEPISSE</latin>"
      - question: "Translate Cicero’s phrase “<latin>omnium enim rērum prīncipia parva sunt</latin>,” which was used as the NJCL Convention motto in 2014.\t \t\t"
        answer: "FOR THE BEGINNINGS OF ALL THINGS ARE SMALL  <latin>SCORE CHECK</latin>"
  - tossup:
      question: "<latin>Dēscrībāmus nunc prōprietātēs dictiōnum in hāc sententiā:  Mīlitibus imperāvit ut fortiter pugnārent. Cuius modī est “imperāvit”?</latin> \t\t"
      answer: "INDICĀTĪVĪ / (EST MODUS) INDICĀTĪVUS"
    boni:
      - question: "<latin>Cuius modī est “pugnārent”?</latin>\t"
        answer: "SUBIUNCTĪVĪ / CŌNIUNCTĪVĪ // \t\t(EST MODUS) SUBIUNCTĪVUS / CONIUNCTĪVUS"
      - question: "<latin>Quae pārs ōrātiōnis est “ut”?</latin>\t"
        answer: "CŌNIUNCTIŌ"
  - tossup:
      question: "What individual was never considered during the division of the empire among his three half-brothers because he had been killed by his father Constantine in 326 AD? \t\t"
      answer: "(FLAVIUS JULIUS) CRISPUS"
    boni:
      - question: "What first wife of Constantine and mother of Crispus was also executed?\t"
        answer: "MINERVINA"
      - question: "Where was Fausta, the mother of Crispus’ half-brothers, supposedly murdered by Constantine? \t"
        answer: "(OVERLY HOT) BATH(S)"
  - tossup:
      question: "Using the verb <latin>videō</latin>, say in Latin “they seem.”\t"
      answer: "<latin>VIDĒTUR / VIDENTUR</latin>"
    boni:
      - question: "Still using <latin>videō</latin>, give the third person plural, pluperfect, active, subjunctive, so that it means “they would have seen.”\t"
        answer: "<latin>VĪDISSENT</latin>"
      - question: "Make <latin>vīdissent</latin> passive, so that it means “they would have seemed.” \t\t"
        answer: "<latin>VĪSĪ/AE/A ESSENT</latin>"
  - tossup:
      question: "You are reading through a scientific paper and you come across the abbreviation <latin>et</latin> <latin>seq.</latin> Give the Latin and English for that abbreviation. \t\t"
      answer: "<latin>ET SEQUENS / SEQUENTĒS / SEQUENTIA / SEQUITUR</latin>"
    boni:
      - question: "In the periodic table, there are many elements with symbols derived from their Latin names, including mercury, tin, antimony, copper, sodium, and lead. Provide the two-letter symbol and the Latin name for one of the previously named elements."
        answer: "SEE BELOW"
      - question: "Provide the two-letter symbol and the Latin name for two more of the previously named elements."
        answer: "<title>(respectively)</title> HG, <latin>HYDRARGYRUM</latin> / SN, <latin>STANNUM</latin> / SB, <latin>STIBIUM</latin> / CU, <latin>CUPRUM</latin> / NA, <latin>NATRIUM</latin> / PB, <latin>PLUMBUM</latin>"
  - tossup:
      question: "What man instigated a war between Orchomenus and Thebes, married a Theban princess after helping Thebes win the war, was exiled from Thebes for murdering the princess in a fit of madness, and became a god after Philoctetes helped him burn away his mortal side?\t\t"
      answer: "HERACLES / HERCULES"
    boni:
      - question: "Who was Philoctetes’ father, who in some accounts replaced his son in lighting Heracles’ funeral pyre?\t"
        answer: "POEAS"
      - question: "What eldest son of Heracles and Deianeira was also present at his funeral pyre?\t"
        answer: "HYLLUS"
  - tossup:
      question: "<latin>Respondē Latīnē:</latin> <latin>Antequam Rōmānī pugnās gladiātōriās in amphitheātrō spectābant, ubi pugnae glādiātōriae exhibērī solēbant?</latin> \t\t"
      answer: "IN FORŌ / CIRCŌ // APUD SEPULCHRUM / FŪNERA / TUMULUM"
    boni:
      - question: "<latin>Respondē Latīnē:</latin> <latin>Quī gladiātor ob galeam suam nihil vidēre poterat?</latin>"
        answer: "ANDĀBATA  "
      - question: "<latin>Respondē Latīnē:</latin> <latin>Quī gladiātor duōbus gladiīs pugnāvit?</latin>"
        answer: "DIMACHAERUS "
  - tossup:
      question: "In the identification of trees, leaf shape is one of the most distinctive features. Of acuminate, falcate, flabellate, palmate, and pinnate, what type of leaf has a feather-like shape?\t"
      answer: "PINNATE"
    boni:
      - question: "Of acuminate, falcate, flabellate, obovate, and palmate, what type of leaf has a hooked or sickle shape?\t"
        answer: "FALCATE"
      - question: "Knowing that <latin>tilia</latin> <title></title>means Linden tree, what is the shape of the leaves on a <latin>Tilia Cordata?</latin>\t"
        answer: "HEART-SHAPED / LIKE A HEART"
  - tossup:
      question: "Which princess, sickened by a goddess who ate vipers and never slept, became deeply envious of her sister and repeatedly obstructed Mercury from his visits to Athens until he turned her to stone so he could visit her sister Herse?\t"
      answer: "AGLAUROS / AGRAULOS"
    boni:
      - question: "Who was the father of Herse and Aglauros?\t"
        answer: "CECROPS"
      - question: "Who was the third sister of Aglauros and Herse?\t"
        answer: "PANDROSUS"
  - tossup:
      question: "To what general category do the terms <latin>septentriōnālis, auster,</latin> and <latin>sōlis ortus</latin> refer?\t \t\t"
      answer: "(CARDINAL) DIRECTIONS (ON A COMPASS / MAP) // REGIONS OF THE EARTH"
    boni:
      - question: "To what general category do the terms <latin>sēmita, clivus, trāmes,</latin> and <latin>callis</latin> refer? \t\t"
        answer: "ROAD(S) / WALKWAY(S)"
      - question: "What types of items were <latin>soccī, calceī,</latin> and <latin>mulleī?</latin>\t"
        answer: "SHOES / FOOTWEAR"
  - tossup:
      question: "When recognized, perform or describe the following commands: <latin>tē verte ad socium et dīc Anglicē “hodiē tempestās ūmidissima est!”</latin> \t\t"
      answer: "PLAYER SHOULD TURN TO THEIR TEAMMATE AND SAY \t\t“THE WEATHER TODAY IS VERY HUMID!”"
    boni:
      - question: "Perform or describe the following command: <latin>extendite mānūs et rogāte Anglicē “pluitne?”</latin>\t"
        answer: "PLAYERS SHOULD STICK OUT THEIR HANDS \t\tAND ASK “IS IT RAINING / DID IT RAIN?”"
      - question: "Perform or describe the following command: <latin>tegite capita bracchiīs et clāmāte Anglicē “minimē! grandinat!”</latin>\t"
        answer: "PLAYERS SHOULD COVER THEIR HEADS \t\tWITH THEIR ARMS AND SHOUT “NO! IT’S HAILING!”  <latin>SCORE CHECK</latin>"
  - tossup:
      question: "What boy was told to leave a battle by Apollo after killing Numanus, exhibited his horsemanship at the funeral games of his grandfather, and had his form taken by Cupid to charm Queen Dido?\t"
      answer: "ASCANIUS / IULUS"
    boni:
      - question: "In what city was Aeneas petitioning Evander while Ascanius was killing Numanus?"
        answer: "PALLANTIUM / PALLANTEUM"
      - question: "With what gift from the gods did Aeneas return from this trip?\t\t"
        answer: "(NEW) ARMS / ARMOR / SHIELD (FROM VULCAN)  [PASS OUT THE <emphasis>VISUAL</emphasis>]"
  - tossup:
      question: "These are portraits of Roman Emperors taken from gold coins of their era. What dynasty do these men represent, a group name argued by Machiavelli to have been earned due to their competent governance?\t"
      answer: "FIVE GOOD EMPERORS"
    boni:
      - question: "Identify by letter the emperor under whose reign the Roman Empire reached its greatest extent.\t"
        answer: "D (Trajan)"
      - question: "Again by letter, order these five emperors chronologically from earliest to latest"
        answer: "C (Nerva), D (Trajan), B (Hadrian), E (Antoninus Pius), A (Marcus Aurelius)"
  - tossup:
      question: "Listen carefully to the following passage, which I will read twice, then <latin>respondē Latīnē</latin> to the questions that follow: \t<latin>Dīdō et Anna, sorōrēs ducēsque novae urbis Karthāginis, fabrōs et artificēs īnspiciēbant. quīdam architectus, ā mulieribus vīsus, prope mūrum iacēbat, somnō superātus. Anna illum allocūta est, “heus, vir! tē excitā ad murum perficiendum!” architectō surgente et sē excūsante, Dīdō sorōrī susurrāvit, “bene fēcistī, Anna. deābus volentibus, nemo nōs prohibeat urbem struere.”</latin>      "
      answer: "REREAD"
    boni:
      - question: "<latin>cūr Anna dīxit architectum excitāndum esse?</latin>"
        answer: "AD MURUM PERFICIENDUM // \t\tUT MURUM PERFICIAT // UT MURUS PERFICIATUR // \t\tMURI PERFICIENDI CAUSA / GRATIA "
      - question: "<latin>Quālī vōce Dīdō Annam laudāvit?</latin>"
        answer: "PARVĀ / DULCĪ / QUIĒTĀ (VŌCE) // SUSURRĀVIT"
  - tossup:
      question: "Translate the following sentence from Latin to English: <latin>Aurēlia ad bibliothēcam mittētur quae librōs ūtilēs inveniat.</latin> \t\t"
      answer: "AURELIA WILL BE SENT TO THE LIBRARY TO FIND USEFUL BOOKS / \t\tWHO IS TO / MIGHT / MAY / WOULD / FIND USEFUL BOOKS"
    boni:
      - question: "Translate the following sentence from Latin to English: <latin>Metuō nē tuī nōminis oblītus sim.</latin>\t"
        answer: "I AM AFRAID THAT I FORGOT YOUR NAME"
      - question: "Translate the following sentence from Latin to English: <latin>Cum tempus idōneum dormiendō esset, līberī tamen vigilābant.</latin>\t"
        answer: "ALTHOUGH / WHEN THE TIME WAS \t\tSUITABLE FOR SLEEPING, NEVERTHELESS / STILL THE CHILDREN WERE / \t\tSTAYED AWAKE / KEPT STAYING AWAKE / KEPT WATCH / WERE KEEPING \t\tWATCH"
  - tossup:
      question: "After Odysseus and his men left Ismarus, who greeted them warmly and offered no violence, yet still forced Odysseus to drag three of his men back to the ship after they got addicted to a local food?\t"
      answer: "LOTUS-EATERS / <latin>LOTOPHAG(O)I</latin>"
    boni:
      - question: "What priest of Apollo had given Odysseus a gift of wine in Ismarus?\t"
        answer: "MARON"
      - question: "Which seer had warned Polyphemus that he would lose his sight to a man named Odysseus?\t"
        answer: "TELEMUS"
