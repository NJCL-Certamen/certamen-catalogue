tournament: "NJCL Certamen"
year: 2024
division: "Novice"
round: "Round 2"
questions:
  - tossup:
      question: "Using the verb <latin>habeō</latin>, say in Latin “we have.”\t"
      answer: "<latin>HABĒMUS</latin>"
    boni:
      - question: "Using the same verb, now say in Latin “they will have.”\t"
        answer: "<latin>HABĒBIT / HABĒBUNT</latin>"
      - question: "And using that same verb again, say in Latin “you have had.”\t"
        answer: "<latin>HABUISTĪ / HABUISTIS</latin>"
  - tossup:
      question: "What city was the scene of the following mythological events? At the death of the king, his sons agreed to alternate their rule; this accord devolved into war between the brothers. At their death, one daughter defied the rulings of the new ruler and was buried alive, leaving Ismene as the only surviving child of Oedipus.\t"
      answer: "(BOEOTIAN) THEBES"
    boni:
      - question: "Name the sons of Oedipus who could not share the throne of Thebes."
        answer: "POLYN(E)ICES and ETEOCLES"
      - question: "Who was the mother of all of these children of Oedipus?"
        answer: "JOCASTA / EPICASTA"
  - tossup:
      question: "Listen carefully to the following fable about a lion, which I will read twice, then respond in English to the questions that follow: \t<latin>ōlim lupus cervum cēpit, quem ad leōnem portāvit. tum leō cervum in quattuor partēs frangēbat. leō aliīs animālibus dīxit, “pars prīma est mea, quod rēx animālium sum. pars secunda quoque est mea, quod fortissimus sum. et tertia et quārta sunt meae, quod vōs mē timētis.”</latin>    "
      answer: "REREAD"
    boni:
      - question: "How many portions of the deer did the lion claim for himself?"
        answer: "ALL / FOUR"
      - question: "Why did the lion explain he is entitled to the third and fourth portions?"
        answer: "BECAUSE (THE) OTHER ANIMALS FEAR HIM / \tBECAUSE EVERYONE (“YOU”) FEAR HIM"
  - tossup:
      question: "When recognized, perform or explain the following command: <latin>tange caput tuum duōbus digitīs.</latin>\t \t\t"
      answer: "STUDENT SHOULD TOUCH THEIR OWN HEAD WITH TWO FINGERS / TOES"
    boni:
      - question: "Now perform or explain this command: <latin>Omnēs, manibus terram tangite</latin>. \t\t"
        answer: "ALL STUDENTS SHOULD TOUCH THE GROUND WITH AT LEAST ONE HAND"
      - question: "Finally, perform or explain this command: <latin>Surgite, omnēs, et pollicēs vertite</latin>. \t\t"
        answer: "ALL STUDENTS SHOULD STAND UP AND “TURN THEIR THUMBS” (GIVE A \tSIGNAL WITH THUMBS)"
  - tossup:
      question: "Often surrounded by a shaded colonnade and next to a <latin>piscīna</latin>, what part of a Roman <latin>thermae</latin> was an open space for wrestling, discus-throwing, and other forms of exercise?\t\t"
      answer: "<latin>PALAESTRA</latin>"
    boni:
      - question: "What would a visitor to a <latin>thermae</latin> do in a <latin>piscīna</latin>?\t"
        answer: "BATHE / SWIM"
      - question: "What did the Romans call the lukewarm room used to acclimate the body to the heat of the <latin>caldārium</latin>?\t"
        answer: "<latin>TEPIDĀRIUM  SCORE CHECK</latin>"
  - tossup:
      question: "The English words contemporary, extemporaneous, tempo, and temporal are all derived from what Latin word with what meaning?\t"
      answer: "<latin>TEMPUS</latin> - TIME"
    boni:
      - question: "The words millennial and annual come from what Latin word with what meaning?"
        answer: "<latin>ANNUS</latin> - YEAR"
      - question: "What other English word, a grammatical term used to describe when verbs occur, also comes from the Latin word <latin>tempus</latin>?"
        answer: "TENSE"
  - tossup:
      question: "What early Roman figure, who resided in the town of Cures before he became king, brought the Vestal Virgins to Rome from Alba Longa and established many other religious institutions?\t"
      answer: "NUMA (POMPILIUS)"
    boni:
      - question: "Numa was said to have received counsel and guidance from a nymph. Name her. \t\t"
        answer: "EGERIA"
      - question: "What temple did Numa establish with doors which were traditionally open in wartime and closed during peacetime?\t"
        answer: "(TEMPLE OF) JANUS"
  - tossup:
      question: "Medusa is often associated with death, but many living things were also attributed to her. What winged horse emerged from her blood after Perseus decapitated her? \t"
      answer: "PEGASUS"
    boni:
      - question: "What sword-wielding giant also sprang from Medusa’s blood? \t"
        answer: "CHRYSAOR"
      - question: "What creatures sprang out of the drops of Medusa’s blood that fell as Perseus flew over the desert?\t"
        answer: "SNAKES / VIPERS / SERPENTS"
  - tossup:
      question: "What abbreviation, seen inscribed onto many Roman monuments, can be directly translated to mean “the senate and the people of Rome”?\t"
      answer: "<latin>S.P.Q.R.</latin>"
    boni:
      - question: "What Latin phrase does S.P.Q.R. stand for?\t"
        answer: "<latin>SENĀTUS POPULUSQUE RŌMĀNUS</latin>"
      - question: "What Latin motto with what English translation is on the penny, the dollar bill, and the seal of the United States?\t"
        answer: "<latin>Ē PLŪRIBUS ŪNUM,</latin>\tONE OUT OF MANY / ONE FROM MANY / OUT OF MANY ONE"
  - tossup:
      question: "Define the Latin noun <latin>emptor</latin>.\t"
      answer: "BUYER / SHOPPER / PURCHASER"
    boni:
      - question: "Define the Latin noun <latin>iānitor</latin>.\t"
        answer: "DOOR ATTENDANT / KEEPER // PORTER // JANITOR"
      - question: "Define the Latin noun <latin>pictrix</latin>.\t"
        answer: "PAINTER / EMBROIDERER"
  - tossup:
      question: "When their failure to pass legislation which would further their ambitions became frustrating enough, to whom did Crassus and Pompey turn to complete their informal political alliance, the First Triumvirate?\t"
      answer: "(C. JULIUS) CAESAR [PASS OUT <emphasis>VISUAL</emphasis>]"
    boni:
      - question: "These are busts of the three members of the First Triumvirate. <title>By letter</title>, who was the first to die?"
        answer: "B"
      - question: "Identify bust B or C by the full Roman name of the man depicted."
        answer: "B: MARCUS LICINIUS CRASSUS / C: GNAEUS POMPEIUS MAGNUS"
  - tossup:
      question: "What nymph was turned into a laurel tree while fleeing the god Apollo? \t"
      answer: "DAPHNE"
    boni:
      - question: "Who aided Daphne by turning her into a laurel tree?\t\t"
        answer: "HER FATHER / PENE(I)ÜS / ZEUS / GAIA"
      - question: "In Ovid’s version of the story, Apollo, undaunted by Daphne’s transformation, says, “Since you, Daphne, cannot be my wife, you at least will be my tree.” What object does Apollo then fashion from a branch of the laurel tree?\t \t\t"
        answer: "WREATH / CROWN / (VICTORY) DECORATION"
  - tossup:
      question: "What degree of adverb is shown by words like <latin>citius, altius</latin>, and <latin>fortius</latin>?\t"
      answer: "COMPARATIVE"
    boni:
      - question: "What is the positive adverb of <latin>fortis</latin>?\t"
        answer: "<latin>FORTITER</latin>"
      - question: "Translate the phrase <latin>quam celerrimē</latin>.\t"
        answer: "AS QUICKLY AS POSSIBLE"
  - tossup:
      question: "In 330 AD, the capital of the Roman empire was moved to what city, previously called Byzantium and today called Istanbul?\t"
      answer: "CONSTANTINOPLE"
    boni:
      - question: "What sea near Constantinople is connected with the Sea of Marmara via the Bosporus Strait and was called <latin>Pontus Euxīnus</latin> by the Romans?\t"
        answer: "BLACK SEA"
      - question: "Consider you are a Roman who wishes to move from Rome to Constantinople. In what cardinal direction would you primarily travel?\t"
        answer: "EAST"
  - tossup:
      question: "What queen of the Amazons entered the Trojan War on the side of the Trojans after the death of Hector? \t"
      answer: "PENTHESILE(I)A"
    boni:
      - question: "What Greek hero killed Penthesilea, and then became enamored with her corpse after her death? \t"
        answer: "ACHILLES"
      - question: "One man made fun of Achilles’ infatuation with Penthesilea’s corpse. Who was this man, who also insulted Agamemnon’s decision-making in Book 2 of the <title>Iliad</title>? \t"
        answer: "THERSITES  <latin>SCORE CHECK</latin>"
  - tossup:
      question: "Translate the following sentence from Latin to English: <latin>Puellae aquam bibent.</latin>\t\t"
      answer: "THE GIRLS WILL DRINK WATER /  \t\tTHEY WILL DRINK THE GIRL’S WATER"
    boni:
      - question: "Translate the following sentence from Latin to English: <latin>Canēs per urbem festīnāverant.</latin>\t\t"
        answer: "THE DOGS HAD HURRIED THROUGH / IN THE CITY"
      - question: "Translate the following sentence from Latin to English: <latin>Māter vōcem fīliae laudāvit.</latin>\t\t\t"
        answer: "THE MOTHER PRAISED THE VOICE OF HER DAUGHTER"
  - tossup:
      question: "What term derived from the Latin verb for “to run” refers to the flow of electricity\trunning through a circuit?\t"
      answer: "CURRENT"
    boni:
      - question: "Derived from the Latin verb for “to lead,” what term is given to an object or material, like metal, that allows the flow of electricity in one or more directions?\t"
        answer: "CONDUCTOR"
      - question: "Derived from the Latin noun for “island,” what term is given to an object or material, like rubber or plastic, that does <title>not</title> allow electricity to freely flow through it?\t"
        answer: "INSULATOR"
  - tossup:
      question: "With victories at Issus and Lugdunum over rival claimants to the throne, what man of African origin emerged successful out of the upheaval of 193 AD and began a new imperial dynasty?\t"
      answer: "(L.) SEPTIMIUS SEVERUS"
    boni:
      - question: "What influential Syrian woman and wife of Septimius Severus is considered one of the most powerful empresses in Roman history?\t"
        answer: "JULIA DOMNA"
      - question: "What structure did Septimius Severus commission to be built in the Roman forum to commemorate his victories over the Parthians in 203 AD?\t\t"
        answer: "ARCH (OF SEPTIMIUS SEVERUS)"
  - tossup:
      question: "Give a synonym for the Latin noun <latin>casa</latin>, which means “house.”\t \t\t"
      answer: "<latin>DOMUS / AEDĒS / VĪLLA / TĒCTUM / AULA</latin>"
    boni:
      - question: "Give a Latin noun that means “kitchen.”\t"
        answer: "<latin>CULĪNA</latin>"
      - question: "Give a Latin noun that means “bedroom.”\t"
        answer: "<latin>CUBICULUM</latin>"
  - tossup:
      question: "Who trapped his wife and her lover in a chain-link net when he discovered that she was cheating on him with his brother, the god of war?\t"
      answer: "HEPHAESTUS / VULCAN"
    boni:
      - question: "What other Olympian deity did Hephaestus trap, this time on a golden throne, for throwing him off Mt. Olympus when he was born?\t"
        answer: "HERA"
      - question: "What other Olympian deity trapped Pirithoüs and Theseus in chairs of forgetfulness after they attempted to abduct his wife? \t"
        answer: "HADES"
