tournament: "NJCL Certamen"
year: 2024
division: "Novice"
round: "Round 3"
questions:
  - tossup:
      question: "What mythological woman helped the hero she loved murder her half-brother, navigate a labyrinth, and escape Crete? \t"
      answer: "ARIADNE"
    boni:
      - question: "What mythological woman, the daughter of the Spartan king Icarius, exploited her cunning to keep a horde of suitors at bay until her husband could return from the Trojan War?\t"
        answer: "PENELOPE"
      - question: "What mythological woman sent her daughter to Aulis to marry Achilles, only to learn that the same daughter was sacrificed instead? \t"
        answer: "CLYTEMNESTRA"
  - tossup:
      question: "Using the noun <latin>leō</latin> and the adjective <latin>scelestus</latin>, translate the prepositional phrase “with the wicked lions” into Latin.\t"
      answer: "<latin>(CUM) LEŌNIBUS SCELESTĪS</latin>"
    boni:
      - question: "Using the noun <latin>lupus</latin> and the adjective <latin>ferōx</latin>, say in Latin “near the fierce wolf.” \t\t\t"
        answer: "<latin>PROPE / PROPTER / IŪXTĀ / AD LUPUM FERŌCEM</latin>"
      - question: "Using the noun <latin>animal</latin> and the adjective <latin>omnis</latin>, say in Latin “of all the animals.” \t\t"
        answer: "<latin>ANIMĀLIUM OMNIUM // DĒ / EX / Ē OMNIBUS ANIMĀLIBUS</latin>"
  - tossup:
      question: "What Governor of Hispania Tarraconensis seized power upon Nero’s death in 68 AD and was the first of four emperors who ruled during the tumultuous period between the Julio-Claudian and Flavian dynasties?\t"
      answer: "(SERVIUS SULPICIUS) GALBA"
    boni:
      - question: "What Governor of Lusitania succeeded Galba and ruled from January to April 69 AD?"
        answer: "(M. SALVIUS) OTHO"
      - question: "Galba may have made a strategic mistake by not adopting what popular commander in Upper Germany, who had previously defeated the rebellion of Julius Vindex at Vesontio in 68 AD?\t"
        answer: "(L.) VERGINIUS RUFUS"
  - tossup:
      question: "What is the Latin term for the meal which typically preceded <latin>meridiātiō</latin>, or naptime, and consisted of cold leftovers from last night’s <latin>cēna</latin> to satisfy midday hunger?\t\t"
      answer: "<latin>PRANDIUM</latin>"
    boni:
      - question: "When would a Roman eat <latin>ientāculum</latin>, often simple bread with salt or dipped in wine? \t\t"
        answer: "(FIRST THING IN THE) MORNING / BREAKFAST TIME"
      - question: "What is the Latin term for the course in a Roman <latin>cēna</latin> which in English is called an appetizer?\t"
        answer: "<latin>GUSTĀTIO / GUSTUS / PRŌMULSIS / ANTECĒNA</latin>"
  - tossup:
      question: "Who, although chosen first as the captain of the <title>Argo</title>, let Jason keep the job out of respect and because he preferred to focus on his labors? \t"
      answer: "HERACLES / HERCULES"
    boni:
      - question: "Heracles left the <title>Argo</title> to search for what missing young Argonaut? \t"
        answer: "HYLAS"
      - question: "What had happened to Hylas? \t\t"
        answer: "NYMPHS (OF THE SPRING PEGAE) ABDUCTED HIM  <latin>SCORE CHECK</latin>"
  - tossup:
      question: "<latin>Quid Anglicē significat sūmō</latin>?\t \t\t"
      answer: "TO TAKE (UP) / ASSUME / LAY HOLD OF / USE UP / PUT ON"
    boni:
      - question: "<latin>Quid Anglicē significat sepulcrum</latin>?\t"
        answer: "GRAVE / TOMB / BURIAL-PLACE"
      - question: "<latin>Quid Anglicē significat angustus</latin>?\t \t\t"
        answer: "NARROW / CONTRACTED / STRAIT / SMALL / SHORT"
  - tossup:
      question: "Consider the following list of words about enslaved people in ancient Rome: <latin>fugitīvus</latin>, \t<latin>vicārius, lībertus, pecūlium, paedagōgus</latin>. Which of those words referred to a formerly-enslaved person who had been freed?\t"
      answer: "<latin>LĪBERTUS</latin>"
    boni:
      - question: "Which of the words <latin>fugitīvus, vicārius, lībertus, pecūlium, paedagōgus</latin> referred to the property enslaved people were sometimes allowed to hold at their owner’s discretion?\t\t"
        answer: "<latin>PECŪLIUM</latin>"
      - question: "Which of the words <latin>fugitīvus, vicārius, lībertus, pecūlium, paedagōgus</latin> referred to a person who was enslaved by someone who was themselves enslaved?\t"
        answer: "<latin>VICĀRIUS</latin>"
  - tossup:
      question: "Give an antonym of the Latin noun <latin>hostis</latin>, which means “enemy.”\t \t\t"
      answer: "AMĪCUS/A // SOCIUS/A // COMES // CONTUBERNĀLIS // SODĀLIS"
    boni:
      - question: "Give a Latin noun that means “guest.”\t"
        answer: "<latin>HOSPES / CONVĪVA / UMBRA</latin>"
      - question: "Give a Latin noun that means “spouse.”\t \t\t"
        answer: "MARĪTUS/A // CONIU(N)X // UXOR // VIR // MULIER"
  - tossup:
      question: "Tennessee borders eight different states. Which of these bordering states has the Latin motto, <latin>Rēgnat Populus</latin>?\t"
      answer: "ARKANSAS [PASS OUT <emphasis>VISUAL</emphasis>]"
    boni:
      - question: "You are looking at the state seals of four other states with a word in their Latin mottoes removed. What shared Latin word has been removed from the mottoes in images A and \tB?"
        answer: "<latin>SEMPER</latin> "
      - question: "What shared Latin verb form has been removed from the mottoes in images C and D?"
        answer: "<latin>ESTŌ</latin>"
  - tossup:
      question: "What mythological man, while searching for his abducted sister, founded the Greek city of Thebes? \t"
      answer: "CADMUS"
    boni:
      - question: "What first king of Athens was said to have been born from the earth and to have taught the Athenians about marriage? \t"
        answer: "CECROPS"
      - question: "What mythological man founded Sparta, naming the city after his wife? \t\t"
        answer: "LACEDAEMON"
  - tossup:
      question: "Translate the following sentence from Latin into English: <latin>Mārcus Lūciō epistulam scrīpsit.</latin>\t"
      answer: "MARCUS WROTE A LETTER TO / FOR LUCIUS"
    boni:
      - question: "Translate the following sentence from Latin into English: <latin>Puerī pontem trāns flūmen aedificābant.</latin>\t"
        answer: "(THE) BOYS WERE BUILDING A BRIDGE ACROSS THE RIVER"
      - question: "Translate the following sentence from Latin into English: <latin>Turba quattuor hōrās ōrātiōnem audīvit.</latin>\t \t\t"
        answer: "THE CROWD LISTENED TO / HEARD THE SPEECH FOR FOUR HOURS"
  - tossup:
      question: "Using the Latin noun <latin>rēs</latin>, give the form of “matter” in the following sentence: “The Senate heard an important matter in their meeting.”\t"
      answer: "<latin>RĒS / REM</latin>"
    boni:
      - question: "Continuing to use <latin>rēs</latin>, translate its form in this sentence: “The king is occupied with weighty matters.”\t"
        answer: "<latin>RĒBUS</latin>"
      - question: "And still with <latin>rēs</latin>, translate its form in this sentence: “The beginnings of all things are small.”\t"
        answer: "<latin>RĒRUM</latin>"
  - tossup:
      question: "What mythical creatures are said to have been descendents of Ixion and Nephele, famously fought the Lapiths, and were half-human, half-horse? \t"
      answer: "CENTAURS"
    boni:
      - question: "What couple’s wedding erupted into battle when the centaurs tried to kidnap the Lapith women who were in attendance? \t \t\t"
        answer: "P(E)IRITHOÜS AND HIPPODAM(E)IA / LAODAMIA / DIA / DEIDAMEIA"
      - question: "What centaur was known for mentoring heroes such as Achilles, Asclepius, and Jason?\t\t"
        answer: "CH(E)IRON"
  - tossup:
      question: "What type of living organism is grown and cultivated in the process called arboriculture? \t\t"
      answer: "TREE(S)"
    boni:
      - question: "Native to the Eastern U.S. from Maine to Mississippi, and given that <latin>quercus</latin> means oak, in what environment would you expect to find <latin>Quercus Montāna</latin> based on its scientific name?\t"
        answer: "(ON) MOUNTAINS / (ON) RIDGE TOPS"
      - question: "A smaller oak found in the Southern Rocky Mountains is the <latin>Quercus Undulāta</latin>.  Based on your knowledge of Latin vocabulary, what shape do the leaves on a <latin>Quercus Undulāta</latin> have?\t"
        answer: "WAVY / WAVE-LIKE (the Wavyleaf Oak)"
  - tossup:
      question: "What man’s son-in-law Octavius Mamillius led the Latin League at Lake Regillus, supporting his campaign to reclaim the throne he had lost as the last king of Rome? \t\t"
      answer: "(L.) TARQUINIUS SUPERBUS // TARQUIN THE PROUD / SUPERB"
    boni:
      - question: "Who was the Roman dictator at Lake Regillus?\t"
        answer: "(A.) POSTUMIUS (ALBUS)"
      - question: "What event occurred for the first time just a few years after Lake Regillus in 494 BC and traditionally happened five total times throughout Roman history? \t\t"
        answer: "SECESSION(S) OF THE PLEB(EIAN)S / <latin>SĒCESSIŌ(NĒS) PLĒBIS</latin>  <latin>SCORE CHECK</latin>"
  - tossup:
      question: "Listen carefully to the following fable, which I will read twice, that involves a <latin>spēlunca</latin>, \t\tor cave, and <latin>sandalia</latin>, or sandals. Then <latin>respondē Latīnē</latin> to the questions that follow: \t<latin>fēmina puellam miseram prope spēluncam spectat. puella lacrimat, “ēheu! meam pecūniam in hāc spēluncā āmīsī.” fēmina, quod spēlunca est sordida, sandalia dēpōnit et pecūniam in spēluncā quaerit, sed nōn invenit. ubi ē spēluncā venit, neque puellam, neque sandalia videt.</latin>       "
      answer: "REREAD"
    boni:
      - question: "<latin>cūr dēpōnit fēmina sandalia sua?</latin>"
        answer: "(QUOD) SPĒLUNCA EST SORDIDA /  \t\t(QUOD) PECŪNIA EST IN SPĒLUNCĀ"
      - question: "<latin>quid invenit fēmina in spēluncā?</latin>"
        answer: "NIHIL / NŪLLAM PECŪNIAM "
  - tossup:
      question: "What English word, derived from a Latin verb that means “to feel”, is defined as either “a punishment assigned to a defendant found guilty by a court” or “a unit of writing that conveys a statement, question, exclamation or demand”?\t"
      answer: "SENTENCE"
    boni:
      - question: "What English job title, derived from a Latin verb meaning “to sit”, was held by individuals such as Andrew Jackson and Abraham Lincoln?\t"
        answer: "PRESIDENT"
      - question: "What English verb, derived from a Latin verb meaning “to write”, originally meant “ to arrange to receive something regularly, typically a publication, by paying in advance”? Today, it can more commonly be applied to YouTube channels and streaming services. \t\t"
        answer: "SUBSCRIBE"
  - tossup:
      question: "Translate the following sentence from Latin to English: <latin>Vīlla nautārum vacua semper \t\test</latin>.\t"
      answer: "THE HOUSE / VILLA OF THE SAILORS IS ALWAYS EMPTY"
    boni:
      - question: "Translate the following sentence from Latin to English: <latin>Claudia medicam vīsitāvit quod manum vulnerāverat.</latin>\t\t"
        answer: "CLAUDIA VISITED THE DOCTOR BECAUSE SHE (HAD) HURT HER HAND"
      - question: "Translate the following sentence from Latin to English: <latin>Magistrae discipulōs discere volunt.</latin>\t"
        answer: "(THE FEMALE) TEACHERS WANT (THEIR / THE) STUDENTS TO LEARN"
  - tossup:
      question: "<latin>Rēspondē aut Anglicē aut Latīnē: Quot capita Cerberō sunt?</latin>\t"
      answer: "TRIA / THREE"
    boni:
      - question: "<latin>Rēspondē aut Anglicē aut Latīnē: Quot oculōs Cȳclops habet?</latin>\t"
        answer: "ŪNUM / ONE"
      - question: "<latin>Rēspondē aut Anglicē aut Latīnē: Quot manūs Briareō sunt?</latin>"
        answer: "CENTUM / ONE HUNDRED  <latin>SCORE CHECK</latin>"
  - tossup:
      question: "What tribune had originally proposed citizenship for Italian tribes in 122 BC, building on land reform plans introduced by his older brother Tiberius? \t\t"
      answer: "GAIUS (SEMPRONIUS) GRACCHUS"
    boni:
      - question: "Just a year into the Social War, what law granted Roman citizenship to all Italians who had not raised arms against Rome?\t"
        answer: "<latin>LĒX IŪLIA (DĒ CĪVITĀTE)</latin>"
      - question: "What law just a year later extended citizenship to all Italian communities, even if they had rebelled?\t"
        answer: "<latin>LĒX PLAUTIA-PAPĪRIA (DĒ CĪVITĀTE SOCIĪS DANDA)</latin>"
