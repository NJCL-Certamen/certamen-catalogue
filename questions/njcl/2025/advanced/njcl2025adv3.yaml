tournament: "NJCL Certamen"
year: 2025
division: "Advanced"
round: "Round 3"
questions:
  - tossup:
      question: "Who roamed Troy’s battlefield clad in a leopard skin, wore a helmet whose chin-strap broke in a duel against Menelaüs, and wielded a bow, which he used to shoot Achilles?\t\t"
      answer: "PARIS / ALEXANDER"
    boni:
      - question: "In Book 11 of the <title>Iliad</title>, Paris wounds a series of Greeks, including what man, who was raced back to the Greek ships because they did not want to lose his healing ability? \t\t"
        answer: "MACHAON"
      - question: "Paris also wounded what man, a son of Euaemon who later stories say went mad after seeing an image of Dionysus inside a chest?\t"
        answer: "EURYPYLUS"
  - tossup:
      question: "What artistic form involved arranging individual pieces of marble or other stone in a bed of mortar into designs such as landscapes, portraits, or geometric patterns? \t\t"
      answer: "MOSAIC // <latin>OPUS TESSELLĀTUM / VERMICULĀTUM</latin>"
    boni:
      - question: "What was the Latin term for the pieces of stone used in a mosaic?\t"
        answer: "<latin>TESSERA(E)</latin>"
      - question: "What was the difference between a conventional <latin>opus tessellātum</latin> mosaic and a mosaic in the <latin>opus vermiculātum</latin> style?\t"
        answer: "<latin>VERMICULĀTUM</latin> USED <emphasis>SMALLER TILES</emphasis>  \t(< 1mm) SO THAT THE MOSAIC ALMOST LOOKED LIKE A PAINTING"
  - tossup:
      question: "Give the Latin motto that references the city of Venice and was later adopted by the state of Idaho. \t"
      answer: "<latin>ESTŌ PERPETUA</latin>"
    boni:
      - question: "A 13th-century pope wrote the poetic lines “<latin>Nīteris incassum nāvem submergere Petrī / fluctuat at numquam mergitur illa ratis</latin>.” In the 15th century, what European city shortened those lines to <latin>fluctuat nec mergitur</latin> and made that their motto?\t"
        answer: "PARIS"
      - question: "Architect Daniel Burnham was in charge of designing and implementing over 60 parks and gardens in what American city in keeping with its Latin motto, <latin>urbs in hortō</latin>?\t \t\t"
        answer: "CHICAGO"
  - tossup:
      question: "For the verb <latin>fallō, fallere</latin>, give the 2nd person singular perfect active subjunctive form, which would mean “may you have deceived.”\t"
      answer: "<latin>FEFELLERĪS</latin>"
    boni:
      - question: "For the same verb, give the 2nd person plural present passive subjunctive form, which would mean “may y’all be deceived.”\t"
        answer: "<latin>FALLĀMINĪ</latin>"
      - question: "For the same verb and form, <latin>fallāminī</latin>, give both the standard and alternate singular forms, which would mean “may you be deceived.”\t"
        answer: "<latin>FALLĀRIS & FALLĀRE</latin>"
  - tossup:
      question: "<latin>Quid Anglicē significat “idōneus”</latin>?\t"
      answer: "FIT / PROPER / SUITABLE / APT / CAPABLE"
    boni:
      - question: "<latin>Quid Anglicē significat “garrīre”</latin>?\t"
        answer: "(TO) CHATTER / PRATTLE / CHAT / TALK"
      - question: "<latin>Quid Anglicē significat adverbium “rārō”</latin>?\t \t\t"
        answer: "(ADVERB:) SELDOM / HARDLY (EVER) / RARELY  <latin>SCORE CHECK</latin>"
  - tossup:
      question: "What sort of weapon killed the giant Agrius when wielded by the Fates, slew the brigand Periphetes when Theseus turned it on him, and crushed Hydra’s heads when Heracles wielded it?\t"
      answer: "CLUB(S)"
    boni:
      - question: "Heracles used his club to kill many beasts, like what creature owned by Eurytion? \t\t"
        answer: "ORTH(R)US"
      - question: "After returning from his cattle-raid of the Taphians, Amphitryon tried to throw a club at one of the cattle, but instead hit what father-in-law of his, killing him instantly? \t\t"
        answer: "ELECTRYON"
  - tossup:
      question: "Who led an occupying force, which was besieged by Quintus Salvidienus, Agrippa, and 10 legions in 40 BC in Etruria, and then surrendered after the support of their relative Marc Antony proved ineffectual?\t"
      answer: "LUCIUS ANTONIUS / FULVIA"
    boni:
      - question: "In what city were Fulvia and Antonius besieged and captured?\t"
        answer: "PERUSIA / PERUGIA"
      - question: "Two of Marc Antony’s legates were called from Gaul to relieve Perusia from the siege, though they both proved ineffectual. Name one of them. \t\t"
        answer: "(P.) VENTIDIUS BASSUS / (C.) ASINIUS POLLIO"
  - tossup:
      question: "In what first work of Ovid does he claim that Cupid stole a foot from his poetry, forcing Ovid to use elegiac couplets, the typical meter for love poetry?\t"
      answer: "<title><latin>AMŌRĒS</latin></title>"
    boni:
      - question: "What work of Ovid covers a variety of mythological stories, including those of Orpheus, Eurydice, and Daphne, in fifteen books?\t"
        answer: "<title><latin>METAMORPHŌSES</latin></title>"
      - question: "What work of Ovid consists of twenty-one letters written mostly from the perspectives of mythological women?\t"
        answer: "<title><latin>HĒRŌIDES</latin></title>"
  - tossup:
      question: "The Romans often used their temples in the Forum for multiple purposes.  What large temple in the Forum Romanum housed the <latin>aerārium</latin>, the Roman treasury? \t\t"
      answer: "(TEMPLE OF) SATURN"
    boni:
      - question: "In what temple would you have found the Roman office of weights and measures? \t\t"
        answer: "(TEMPLE OF) CASTOR AND POLLUX"
      - question: "Because of its location beside the facility where Roman coins were first minted, what Roman temple likely stored metal and coins for the mint and ultimately became associated with the mint itself?\t"
        answer: "(TEMPLE OF) JUNO MONETA"
  - tossup:
      question: "Listen carefully to the following passage about the author Sappho, which I will read twice, then <latin>respondē Latīnē</latin> to the questions that follow: \t<latin>Sapphō, poēta Graeca, decem mīlia versuum composuit. et Graecī et Rōmānī carminibus dē vītā eius et amōre fēminārum et virōrum fruēbantur, itaque Mūsa decima nunc appellātur. paucī autem versūs adhuc supersunt, quōs nōs legere possīmus.</latin>    "
      answer: "REREAD"
    boni:
      - question: "<latin>Quot versūs hodiē supersunt ex carminibus Sapphicīs?</latin>"
        answer: "PAUCĪ"
      - question: "<latin>Quō agnōmine appellātur Sapphō ab hominibus posteriōribus?</latin>"
        answer: "MŪSĀ/A DECIMĀ/A"
  - tossup:
      question: "What Attic town, the site of a tomb whose location only Theseus knew, was visited by Ismene and the exiled Polyneices, according to Sophocles’ play which recounts Oedipus’ death?\t"
      answer: "COLONUS"
    boni:
      - question: "The initial action of <title>Oedipus at Colonus</title> takes place in front of a grove sacred to what deities, whom Greeks sometimes euphemistically referred to as “the Kindly Ones”?"
        answer: "EUMENIDES / ERINYES / FURIES / SEMNAI (THEAI)"
      - question: "Sophocles gives Polyneices’ mother as Jocasta, following the standard story. But other stories give Polyneices’ mother as what woman, the daughter of Hyperphas? \t\t"
        answer: "EURYGANEIA"
  - tossup:
      question: "What Roman author, a member of the <latin>quindecimvirī sacrīs faciundīs,</latin> wrote historical works called <title><latin>Annālēs</latin></title> and <title><latin>Historiae</latin></title> in addition to a biography of his father-in-law Gnaeus Julius Agricola, the governor of Britannia from 78 to 84 AD?\t \t\t"
      answer: "(P. / C. CORNELIUS) TACITUS"
    boni:
      - question: "What Roman historian wrote a massive history of Rome, although only parts of it remain, which extended from the founding of the city to 9 BC?\t"
        answer: "(T.) LIVY / <latin>LIVIUS</latin>"
      - question: "What <latin>novus homō</latin> from Amiternum wrote monographs about the Jugurthine War and Catilinarian Conspiracy?\t"
        answer: "(C.) SALLUST(IUS CRISPUS)"
  - tossup:
      question: "What emperor abolished the consular judge system his predecessor set up, created a charity named after his wife, and commissioned Lollius Urbicus to extend Rome’s northern border into Scotland?\t"
      answer: "ANTONINUS PIUS"
    boni:
      - question: "What later emperor, whose reign saw raids from the Costobocae, reinstituted Hadrian’s consular judge system?\t"
        answer: "MARCUS AURELIUS"
      - question: "What Parthian king was planning to seize Armenia for one of his relatives, but was dissuaded upon receiving a letter from Antoninus?\t"
        answer: "VOLOGESES / VOLOGASES (III)"
  - tossup:
      question: "<latin>Dēscrībāmus nunc proprietātēs dictiōnum in hāc sententiā: Quī montem moveat, lapillōs ferendō incipit. Quō cāsū est ferendō?</latin>\t"
      answer: "ABLATĪVŌ"
    boni:
      - question: "<latin>Quō cāsū est quī?</latin>\t"
        answer: "NŌMINĀTĪVŌ"
      - question: "<latin>Quae pars ōrātiōnis est ferendō?</latin>\t"
        answer: "NŌMEN (VERBĀLE) / GERUNDIUM \t\t[DO NOT TAKE <latin>GERUNDĪVUM</latin>]"
  - tossup:
      question: "What Roman author, while governor of Bithynia, wrote letters to the emperor Trajan, although his most famous letter describes the eruption of Mt. Vesuvius in 79 AD? \t\t"
      answer: "PLINY THE YOUNGER"
    boni:
      - question: "What religious sect did Pliny deal with in Bithynia, asking for guidance from Trajan and receiving instructions not to punish anyone who publicly sacrifices to the Roman gods?\t\t"
        answer: "CHRISTIANS / CHRISTIANITY"
      - question: "Which of Pliny’s teachers was a salaried professor of rhetoric under Vespasian and wrote <title><latin>Institūtiō Ōrātōria</latin></title>, which deals with the art of giving speeches?\t\t"
        answer: "(M. FABIUS) QUINTILIAN(US)  <latin>SCORE CHECK</latin>"
  - tossup:
      question: "While investigating a crime, if a detective discovered something capilliform, what shape would it be in?\t"
      answer: "(IN THE SHAPE OF) HAIR"
    boni:
      - question: "Upon further inspection, the detective finds something squamiform. What shape would this piece of evidence be in?\t"
        answer: "(IN THE SHAPE OF A) SCALE"
      - question: "The detective finds an ensiform object as the last crucial piece of evidence. What shape is this ensiform evidence?\t"
        answer: "(IN THE SHAPE OF A) SWORD"
  - tossup:
      question: "Since the Phlegyans had blocked the land route to Delphi, what king of Trachis elected to sail instead, leading to his shipwreck and the avian transformation of his wife, Alcyone?"
      answer: "CEŸX"
    boni:
      - question: "According to some stories, Ceÿx was killed for impiously calling himself by what name? \t\t"
        answer: "ZEUS / JUPITER"
      - question: "In Ovid’s <title>Metamorphoses</title>, Ceÿx is introduced in the context of the story of Peleüs. In that version, the two prepare to fight a giant wolf sent by what woman?\t"
        answer: "PSAMATHE"
  - tossup:
      question: "When listening to this question, one might notice its language and phrasing and subtle clues and length. What literary device is exemplified by the previous sentence and is also demonstrated when Catullus asks his friend to come with <latin>candidā puellā et vīnō et sale et omnibus cachinnīs</latin> whereby an abundance of conjunctions is used for emphasis? \t\t"
      answer: "POLYSYNDETON"
    boni:
      - question: "Instead of directly telling his friend to bring those things, Catullus introduces his list with <latin>nōn sine</latin>. What literary device is that phrase an example of?\t"
        answer: "LITOTES"
      - question: "What do we call the opposite of polysyndeton where a noticeable lack of conjunctions is utilized to emphasize each element such as Caesar’s famous <latin>vēnī, vīdī, vīcī</latin>? \t\t"
        answer: "ASYNDETON"
  - tossup:
      question: "In what battle of the Second Punic War did Flaminius and the Romans walk into an ambush set by Hannibal during an earthquake as they fought the Carthaginians with their backs to the lake that gave the battle its name?\t"
      answer: "(LAKE) TRASIMENE [PASS OUT <emphasis>VISUAL</emphasis>]"
    boni:
      - question: "What battle of the 1st century BC is depicted as letter C?"
        answer: "ALESIA"
      - question: "Now put all four battles in chronological order by letter from earliest to latest."
        answer: "D (TRASIMENE), A (ZAMA), C (ALESIA), B (ACTIUM)"
  - tossup:
      question: "For this question, the word <latin>bombārium</latin> means “buzzer,” like the one you are holding. When recognized by the spotter, perform or describe the following command: <latin>tolle deciēns bombārium.</latin>\t"
      answer: "PLAYER RAISES THEIR BUZZER TEN TIMES"
    boni:
      - question: "Now perform or describe this command: <latin>date bombāria inter vōs, deinde quisque suum prōprium recipiat.</latin>\t"
        answer: "MULTIPLE PLAYERS EXCHANGE BUZZERS, \t\tTHEN TAKE BACK THEIR PROPER BUZZER"
      - question: "Now perform or describe this command: <latin>omnia bombāria simul premite, deinde quisque clāmet sē celerrimum fuisse.</latin>\t"
        answer: "PLAYERS BUZZ SIMULTANEOUSLY \t\tTHEN EACH SHOUT THAT THEY WERE THE FASTEST"
