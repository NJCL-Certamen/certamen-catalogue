tournament: "NJCL Certamen"
year: 2025
division: "Advanced"
round: "Finals"
questions:
  - tossup:
      question: "What region was ruled by the Melampodes until their reign was ended by a son of the native naiad Anchinoë, and is also known for having a king who sacrificed strangers yearly to Zeus until Heracles killed him?\t"
      answer: "EGYPT"
    boni:
      - question: "A few sources associate Egypt with the people of what island, some of whom supposedly sprung up autochthonously, such as Evenor?\t"
        answer: "ATLANTIS"
      - question: "Another early Greek-affiliated people in Egypt were those of what town, who at the time of Herodotus had uniquely dedicated a temple to Perseus and celebrated games for him? \t\t"
        answer: "CHEMMIS"
  - tossup:
      question: "What <latin>gēns</latin> produced the 79 BC consul that fought against Lycian pirates, the <latin>magister equitum</latin> that killed Spurius Maelius, and multiple men - including Tolosa’s conqueror - with the surname Caepio?\t"
      answer: "<latin>SERVĪLIĪ / SERVĪLIUS /</latin> <latin>GĒNS SERVĪLIA</latin>"
    boni:
      - question: "Tolosa had been the chief sanctuary of what people, who had been incited to revolt by the Tigurini?\t"
        answer: "(VOLCAE) TECTOSAGES"
      - question: "In 75 BC, Servilius Isauricus attacked the western borders of what province, which Sulla had governed in 96 BC?\t"
        answer: "CILICIA"
  - tossup:
      question: "Which of the following, if any, is not derived from the same Latin root as the others: assure, hussar, proxy, scour?\t"
      answer: "HUSSAR"
    boni:
      - question: "From what Latin verb with what meaning is “hussar” derived?"
        answer: "<latin>CURRŌ</latin> - RUN"
      - question: "From what Latin verb with what meaning are the other words in the tossup derived?"
        answer: "<latin>CŪRŌ</latin> - (TAKE) CARE (OF / FOR)"
  - tossup:
      question: "The Latin abbreviation <latin>d.s.p.</latin> can be found in older genealogical records to indicate that an individual died under what circumstances?\t"
      answer: "CHILDLESS // \t\t(DIED) WITHOUT (EVER HAVING) CHILDREN / OFFSPRING / ISSUE"
    boni:
      - question: "Another abbreviation with the same meaning is <latin>ob.s.p.</latin> What Latin word does <latin>ob.</latin> stand for in that abbreviation?\t"
        answer: "<latin>OBIIT</latin>"
      - question: "Genealogical records can also indicate that an individual died <latin>s.p.s.</latin> This indicates that the individual died under what circumstances?\t\t"
        answer: "WITHOUT (HAVING) <emphasis>LIVING</emphasis> CHILDREN / OFFSPRING / ISSUE //  \t\tOUTLIVED (THEIR) CHILDREN"
  - tossup:
      question: "Translate the following sentence from Latin to English: <latin>Mārius cōgitābat relinqueretne consilium an audacter rem susciperet</latin>"
      answer: "MARIUS WAS THINKING / CONSIDERING IF / WHETHER HE SHOULD ABANDON HIS PLAN / ADVICE / COUNSEL  OR BOLDLY UNDERTAKE / START THE THING / MATTER"
    boni:
      - question: "Translate the following sentence from Latin to English: <latin>Mīlitēs invādentēs ratī sunt noctem sibi victīs praesidiō fore.</latin>"
        answer: "THE INVADING SOLDIERS THOUGHT THAT THE NIGHT WOULD BE A PROTECTION FOR THEM (IF THEY {WERE // SHOULD BE}) DEFEATED"
      - question: "Assuming the role of one of the soldiers, say in Latin, “if we win, we know it will be because we are mindful of the location.”\t \t\t"
        answer: "SĪ VINCIMUS / VINCĒMUS / VĪCERIMUS / VINCĀMUS,  \t\tSCĪMUS / SCIĒMUS / SCIĀMUS / (COG/AG)NOV(ER)IMUS \t\t(ID) FORE QUOD / QUIA LOCĪ / SITŪS / ĀREAE / REGIŌNIS"
  - tossup:
      question: "What pair, one of whom speared Tagus and Sulmo as the other was being hunted by Volcens, planned to loot the Rutulian camp but were foiled when one of them unwisely put on a shiny, plundered helmet?\t"
      answer: "NISUS AND EURYALUS"
    boni:
      - question: "Euryalus had earlier won the foot-race at the funeral-games of Anchises, largely because Nisus had tripped up what competitor as he neared the finish line?\t"
        answer: "SALIUS"
      - question: "The dying Euryalus is likened to a poppy whose head droops down under the weight of rain. Vergil adapted this simile primarily from Homer’s description of the death of Gorgythion, who was killed by what Greek in Book 8 of the <title>Iliad</title>?\t"
        answer: "TEUCER"
  - tossup:
      question: "What man's personal views concerning military service, women's clothing, and Roman spectacles were so strict that he founded a Christian sect named after himself, joined the Montanists, and addressed <title><latin>Ad Scapulam</latin></title> to the governor of Africa Proconsularis, in addition to writing <title><latin>Ad Nātiōnēs</latin></title> and <title><latin>Dē Spectāculīs</latin></title>? \t\t"
      answer: "(Q. SEPTIMIUS FLORENS) TERTULLIAN(US)"
    boni:
      - question: "What profession, which perhaps influenced Tertullian’s combative and aggressive writing style, did he practice in Rome?\t"
        answer: "LAWYER / <latin>RHĒTOR</latin>"
      - question: "Which work of Tertullian was addressed to a group of imprisoned Christians awaiting execution?\t"
        answer: "<title><latin>AD MARTYRĀS</latin></title> / TO (THE) MARTYRS"
  - tossup:
      question: "What is the meaning of <latin>glaeba</latin>, which is seen in Book 7 of Caesar’s <title><latin>Dē Bellō Gallicō</latin></title> when he writes “<latin>trāditās glaebās in ignem prōiciēbat</latin>”? \t\t"
      answer: "LUMP OF EARTH / CLOD / SOIL / MASS / BALL / LUMP"
    boni:
      - question: "What is the meaning of the Latin word <latin>prūrīgō</latin>, which is seen in Book 4 of Martial’s <title>Epigrams</title> when he writes “<latin>paenitet obscēnae prūrīginis</latin>”?\t \t\t"
        answer: "ITCH / ITCHING / LASCIVIOUSNESS"
      - question: "What is the meaning of the Latin word <latin>protervus</latin>, which is seen in Book 1 of Horace’s <title>Odes</title> when he writes “<latin>tristitiam et metūs trādam protervīs ventīs</latin>”? \t\t"
        answer: "VIOLENT / VEHEMENT / PRESSING FORWARD / OPPRESSIVE"
  - tossup:
      question: "Ecphrasis, or the written description of a work of art, is often employed by poets to extend the boundaries of their stories. The ecphrastic description of which of these scenes can be found in Book 8 of Vergil’s <title>Aeneid</title>?"
      answer: "B (SHIELD OF AENEAS)"
    boni:
      - question: "In what author’s work would you find a description of the scene shown in figure A on a bedspread?"
        answer: "CATULLUS(’ 64)"
      - question: "Given that figure D is a scene from Book 1 of the <title>Aeneid</title>, identify the two men in the foreground and the specific structure they are looking at."
        answer: "AENEAS AND ACHATES LOOKING AT (PAINTINGS/RELIEFS ON)  \t\tTHE TEMPLE OF JUNO (IN CARTHAGE)"
  - tossup:
      question: "Alliteratively translate the genitive singular for the phrase “of the other wing.”\t\t"
      answer: "<latin>ĀLAE ALTERĪUS / ALĪUS / ALIAE</latin>"
    boni:
      - question: "Alliteratively translate the dative singular for the phrase “for no divinity.”\t\t"
        answer: "<latin>NULLĪ NŪMINĪ</latin>"
      - question: "Alliteratively translate the nominative plural for the phrase “the first ancient prices.” \t\t"
        answer: "<latin>PRĪMA PRETIA PRISCA / PRISTĪNA</latin>"
  - tossup:
      question: "During the empire, smaller <latin>fora vēnālia</latin> that specialized in specific foods opened in Rome. Of <latin>brassica, crustula, mulsum, perna</latin>, and <latin>rhombus</latin>, which would a Roman have purchased at the <latin>Forum Holitōrium</latin>?\t"
      answer: "<latin>BRASSICA</latin>"
    boni:
      - question: "Of <latin>brassica, crustula, mulsum, perna</latin>, and <latin>rhombus</latin>, which would a Roman have purchased at the <latin>Forum Piscārium</latin>?\t"
        answer: "<latin>RHOMBUS</latin>"
      - question: "Of <latin>Forum Vīnārium, Forum Suārium, Forum Piscārium</latin>, or <latin>Forum Pistōrium</latin>, where would a Roman have gone to purchase <latin>perna</latin>?\t"
        answer: "FORUM SUĀRIUM"
  - tossup:
      question: "<latin>Dēscrībāmus nunc proprietātēs dictiōnum in hāc sententiā: rīsisse Cupīdō dīcitur atque ūnum surripuisse pedem. Quō cāsū est Cupīdō?</latin>\t"
      answer: "NŌMINĀTĪVŌ"
    boni:
      - question: "<latin>Quō tempore est surripuisse?</latin>\t"
        answer: "PERFECTŌ (PRAETERITŌ)"
      - question: "<latin>Dīc eandem sententiam omnibus verbīs plūrālibus, sī potest.</latin> \t\t"
        answer: "RĪSISSE CUPĪDINĒS DĪCUNTUR ATQUE DUŌS  \t\t(vel TRĒS etc.) SURRIPUISSE PEDĒS"
  - tossup:
      question: "Where were the <latin>Fēriae Latīnae</latin>, the festival in honor of Jupiter Latiaris in his role as god of the Latin League, held? \t\t"
      answer: "MONS ALBĀNUS / MOUNT ALBA <latin>/</latin> ALBAN MOUNT (prompt on Alba Longa)"
    boni:
      - question: "Upon taking office each year, the magistrates selected specific dates for the <latin>Fēriae Latīnae</latin>, which took place in what month? \t"
        answer: "APRIL"
      - question: "One of the unusual Roman gods, the god of grain-rust and mildew, was honored in a festival on the 25th of April.  Give his name or the name of the festival. \t\t"
        answer: "<latin>RŌBĪGUS / RŌBĪGŌ / RŌBĪGĀLIA</latin>"
  - tossup:
      question: "What emperor, the descendant of a sausage maker, received Leo I’s support after Severus III’s death, though his failure to fight the Visigothic king Euric led Ricimer to murder him in 472 AD?\t"
      answer: "ANTHEMIUS"
    boni:
      - question: "Anthemius was initially favored to succeed Marcian as the Eastern emperor, but was passed over for Leo I at the will of what Gothic-Alanic general?\t"
        answer: "ASPAR"
      - question: "What emperor was elevated to the throne by Ricimer’s nephew Gundobad after Ricimer and his final pet emperor Olybrius died in 472 AD?\t"
        answer: "GLYCERIUS"
  - tossup:
      question: "Listen carefully to the following passage, which I will read twice, about the novelist \t\tMadeline Miller, whom I will call <latin>Magistra Molitor</latin>, then <latin>respondē Latīnē</latin> to the \t\tquestions that follow: \t<latin>clāritās Magistrae Molitōris duobus operibus cōnstitūta est; prīmum vītam Achilleī finxit, alterum nymphae Circēs. Molitor rēbātur hās fābulās modīs novīs narrandās esse ut plūs plēnitātis persōnīs antīquīs darētur. numquam enim dubitābat quīn librōs suōs legere iuvenibus modernīs prōdesset, quī sē in scriptīs agnoscerent</latin>"
      answer: "REREAD"
    boni:
      - question: "<latin>secundum Molitōrem, quomodo plūs plēnitātis datur?</latin>"
        answer: "(HĀS) FĀBULAS (MODĪS NOVĪS) NARRANDŌ / NARRA(BI)T"
      - question: "<latin>quid spērābat Molitor iuvenēs adiūtūrum esse?</latin>"
        answer: "LIBRŌS (SUŌS) / FĀBULĀS \t\t(SUĀS) / OPERA (SUA LEGERE / LECTŪRŌS / LECTŪRĀS ESSE) // \t\tSĒ (IN SCRIPTĪS / LIBRĪS / FĀBULĪS) AGNOSCERE / AGNĪTŪRŌS/ĀS/A  "
  - tossup:
      question: "What Roman author, who was <latin>prōconsul</latin> of Asia and was once an informer for Nero, went nearly unmentioned by Latin sources for centuries after his own time despite writing the longest Latin historical epic, the 17-book <title><latin>Pūnica</latin></title>, perhaps because he is often overshadowed by his contemporaries?\t"
      answer: "(TI. CATIUS ASCONIUS) SILIUS ITALICUS"
    boni:
      - question: "What group is the subject of an unfinished epic from the principate and an earlier epic by Varro Atacinus?\t"
        answer: "ARGONAUTS"
      - question: "What Latin epic begins with a dedication to Domitian and breaks off at the protagonist’s education by Cheiron?\t"
        answer: "<title><latin>ACHILLEID</latin></title>"
  - tossup:
      question: "What terrible act was committed by a Libyan queen under coercion by Hera, causing Zeus to let that queen—Lamia—remove and reinsert her own eyes? This act was also perpetrated in Corinth upon Mermerus and Pheres by Medea. \t\t"
      answer: "KILLING (ONE’S OWN) CHILDREN / INFANTICIDE"
    boni:
      - question: "What wife of Athamas tried to kill Ino’s children, but ended up smothering her own? \t\t"
        answer: "THEMISTO"
      - question: "Lamia is often associated with what monster, who fed on young men and had one leg made of brass and one leg that resembled a donkey’s?\t"
        answer: "EMP(O)USA"
  - tossup:
      question: "What two men from Augusta Treverorum attempted to incite Gallic rebellion by hosting a conference at Durocortorum after Druidic prophecies convinced them to murder Dillius Vocula and form a secret alliance with Julius Civilis? \t\t"
      answer: "(JULIUS) CLASSICUS AND (JULIUS) TUTOR"
    boni:
      - question: "Civilis’ rebellion was prompted by what man, who falsely charged Civilis with treason before being murdered by Fabius Valens?\t"
        answer: "FONTEIUS CAPITO"
      - question: "Dillius Vocula became involved with Civilis’ rebellion after what man, then stationed at Novaesium, summoned him from Moguntiacum?\t"
        answer: "(M.) HORDEONIUS FLACCUS"
  - tossup:
      question: "Fill in the blank in the following sentence with a form of <latin>faciō</latin> that avoids a mixed conditional. <latin>Sī ego _____ rēx, omnēs bellō domuissem</latin>. \t\t"
      answer: "<latin>FACTUS/-A/-UM ESSEM / FĒCISSEM</latin>"
    boni:
      - question: "Provide the archaic form of <latin>faciō</latin> that would express the verb in the following sentence. “I might have traveled to Millett Arena in 5 minutes.”\t"
        answer: "<latin>(ITER) FAXIM</latin>"
      - question: "Provide the archaic form of <latin>faciō</latin> that would express the verb in the following sentence. \t“After I will have made a challenge, my shenanigans will be denied.” \t"
        answer: "<latin>FAXŌ</latin>  <latin>SCORE CHECK</latin>"
  - tossup:
      question: "What mortal founded Ialysus, Cameirus, and Lindus after he killed Licymnius with a club and was exiled to Rhodes, from which he led forces to Troy and died at the hands of Sarpedon?\t"
      answer: "TLEPOLEMUS"
    boni:
      - question: "In some versions, Tlepolemus was married to Polyxo, who took revenge on what woman by sending maids dressed as the Furies to kill her?\t"
        answer: "HELEN"
      - question: "Tlepolemus was the son of Heracles and what woman?\t"
        answer: "ASTYOCHE / ASTYDAMEIA"
