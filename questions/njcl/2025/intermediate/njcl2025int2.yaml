tournament: "NJCL Certamen"
year: 2025
division: "Intermediate"
round: "Round 2"
questions:
  - tossup:
      question: "Which of the following, if any, is not derived from the same Latin root as the others: component, deposit, expository, posthumous?\t"
      answer: "POSTHUMOUS"
    boni:
      - question: "What Latin verb with what meaning is at the root of component, deposit, and expository?"
        answer: "<latin>PŌNŌ</latin> - PLACE / PUT"
      - question: "What other derivative of <latin>pōnō</latin> is defined as “a good, affirmative, or constructive quality or attribute,” or as “constructive, optimistic, or confident”?"
        answer: "POSITIVE"
  - tossup:
      question: "<latin>Respondē Latīnē: Quot digitī tibi sunt?</latin>  \t"
      answer: "DECEM / VĪGINTĪ /\t OCTŌ / DUODĒVIGINTĪ \t(ADJUST FOR NUMBER OF FINGERS STUDENT ACTUALLY HAS)"
    boni:
      - question: "<latin>Respondē Latīnē: Quot corda tibi sunt?</latin>  \t"
        answer: "ŪNUM"
      - question: "<latin>Respondē Latīnē: Quot supercilia vōbīs omnibus sunt?</latin> \t"
        answer: "OCTŌ\t(ADJUST FOR NUMBER OF EYEBROWS THE TEAM ACTUALLY HAS)"
  - tossup:
      question: "Who refused to join the First Triumvirate, viewing it as a threat to the Republic—the same reason that led him to denounce Catiline’s conspiracy?\t \t\t"
      answer: "(M. TULLIUS) CICERO"
    boni:
      - question: "Cicero was a veteran of what war, during which he fought on the side of the Roman state under Pompeius Strabo?\t"
        answer: "SOCIAL / MARSIC / ITALIAN WAR"
      - question: "Which corrupt governor of Sicily did Cicero prosecute to launch his political career, successfully defeating the orator Hortensius?\t"
        answer: "VERRES"
  - tossup:
      question: "Of the Roman occupations <latin>carnifex</latin>, <latin>caupō</latin>, <latin>faber</latin>, <latin>sūtor</latin>, and <latin>tonsor</latin>, which would have created <latin>soleae</latin>, <latin>calceī</latin>, and <latin>caligae</latin>?\t"
      answer: "<latin>SŪTOR</latin> [PASS OUT <emphasis>VISUAL</emphasis>]"
    boni:
      - question: "You are looking at four frescoes of people at work. Which image represents <latin>fullōnēs</latin>?"
        answer: "C"
      - question: "What is the Latin term for the occupation depicted in image D?"
        answer: "<latin>PISTOR / PISTRIX / PĀNIFEX</latin>     "
  - tossup:
      question: "Cloanthus, Euryalus, Entellus, and Acestes all win prizes on Sicily at funeral games held in honor of what man, Aeneas’s late father?\t"
      answer: "ANCHISES’"
    boni:
      - question: "When the Trojans had left Sicily the first time, what god of winds did Juno convince to blow them off course?\t"
        answer: "AEOLUS"
      - question: "Who poked his head above the waves and calmed the storm that was raised by Aeolus? \t\t"
        answer: "NEPTUNE / NEPTUNUS  <latin>SCORE CHECK</latin>"
  - tossup:
      question: "Using the verb <latin>dīcō, dīcere</latin>, say in Latin: “I was speaking.”\t"
      answer: "<latin>DĪCĒBAM</latin>"
    boni:
      - question: "Using the verb <latin>dīcō, dīcere</latin>, say in Latin “I will have spoken.”\t"
        answer: "<latin>DĪXERŌ</latin>"
      - question: "Using the verb <latin>dīcō, dīcere</latin>, say in Latin: “I am about to speak.” \t\t"
        answer: "<latin>DĪCTŪRUS/A/UM (SUM)</latin>"
  - tossup:
      question: "Who originally set out to find his sister Europa but was deterred by the gods, eventually founding a city that would later be known as Thebes?\t"
      answer: "CADMUS"
    boni:
      - question: "When Cadmus reached the site where he would later found Thebes, he killed a dragon sacred to Ares. What did Athena instruct Cadmus to do with the dragon’s teeth?\t\t"
        answer: "PLANT / SOW / SCATTER THEM"
      - question: "What is the name for the group of men who grew from the dragon’s planted teeth?\t\t"
        answer: "SPART(O)I // SOWN (MEN / ONES / FELLOWS)"
  - tossup:
      question: "Translate the following sentence from Latin to English: <latin>Ab urbe cum nostrīs mātribus nōs profectae sumus</latin>.\t\t"
      answer: "WE DEPARTED / SET OUT FROM THE CITY WITH OUR MOTHERS"
    boni:
      - question: "Translate the following sentence from Latin to English: <latin>Soror tua multō celerior quam frāter tuus est</latin>.\t"
        answer: "YOUR SISTER IS MUCH / A LOT / FAR \t\tQUICKER / FASTER THAN YOUR BROTHER"
      - question: "Translate the following sentence from Latin to English: <latin>Certāmine inceptō, omnēs spectātōrēs clāmāvērunt</latin>.\t\t"
        answer: "WHEN / AFTER / SINCE THEY (HAD) STARTED / BEGAN THE CONTEST // \t\tWITH THE CONTEST / CERTAMEN (HAVING BEEN) BEGUN / STARTED, \tALL THE SPECTATORS / WATCHERS SHOUTED / CHEERED"
  - tossup:
      question: "Give a synonym of the Latin noun <latin>comes</latin>, which means “comrade,” “ally,” or “friend.” \t\t"
      answer: "<latin>SODĀLIS /</latin>/ <latin>SOCIUS/-A /</latin>/ <latin>AMĪCUS/-A</latin>"
    boni:
      - question: "What Latin noun meaning “treaty” shares a form with an adjective meaning “disgraceful?”\t"
        answer: "<latin>FOEDUS</latin>"
      - question: "What Latin noun means “duty” in a military context, though it can also mean “gift”? \t\t"
        answer: "<latin>MŪNUS</latin>"
  - tossup:
      question: "Who was forced to resign his consulship of 509 BC because, despite his participation in the overthrow of Tarquinius Superbus, he bore the name Tarquinius and the people thought the Tarquins had ruled too long?\t"
      answer: "(L. TARQUINIUS) COLLATINUS"
    boni:
      - question: "Collatinus had participated in the overthrow of Superbus because what man had raped his wife?\t"
        answer: "SEXTUS (TARQUINIUS)"
      - question: "After Collatinus’ resignation, what suffect consul was elected to replace him? \t\t"
        answer: "(P.) VALERIUS / POPLICOLA / PUBLICOLA  <latin>SCORE CHECK</latin>"
  - tossup:
      question: "From what Latin noun with what meaning are “sewer” and “aquifer” derived?\t\t\t"
      answer: "<latin>AQUA</latin> - WATER"
    boni:
      - question: "From what Latin noun with what meaning are “desire” and “consider” derived?"
        answer: "<latin>SĪDUS</latin> - STAR / CONSTELLATION"
      - question: "“Terracotta” derives from a Latin noun and a Latin verb. Name them and their meanings."
        answer: "TERRA - LAND / EARTH,  <latin>COQUŌ -</latin> COOK"
  - tossup:
      question: "What mortal was suckled by goats, learned the art of medicine from Cheiron, used his talents to revive the dead Hippolytus, and was eventually worshipped as a god of healing?\t"
      answer: "ASCLEPIUS / AESCULAPIUS"
    boni:
      - question: "What Greek Olympian god, upset with Asclepius for raising the dead, killed Asclepius with a weapon forged by the Cyclopes?\t"
        answer: "ZEUS"
      - question: "What animal, which is wrapped around the <latin>cadūceus</latin>, is associated with Asclepius?\t\t"
        answer: "SNAKE"
  - tossup:
      question: "For the adjective <latin>parvus</latin>, give the form necessary to translate the following sentence into Latin: It is difficult to catch a small cat.\t"
      answer: "<latin>PARVAM / PARVUM</latin>"
    boni:
      - question: "For the adjective <latin>parvus</latin>, give the form necessary to translate the following sentence into Latin: You can make the day better in small ways.\t"
        answer: "<latin>PARVĪS</latin>"
      - question: "For the adjective <latin>parvus</latin>, give the form necessary to translate the following sentence into Latin: He used to be the smallest boy.\t"
        answer: "<latin>MINIMUS</latin>"
  - tossup:
      question: "What governor of Lusitania had his wife taken from him by the emperor Nero but would soon rise to the throne himself after the death of Galba in 69 AD?\t"
      answer: "OTHO"
    boni:
      - question: "At which battle of 69 AD was Otho defeated by the forces of Vitellius, led by the generals Valens and Caecina?\t"
        answer: "FIRST BATTLE OF CREMONA / BEDRIACUM"
      - question: "Ironically, Vitellius was defeated at Cremona just a few months later. What commander of Vespasian was responsible for Vitellius’s defeat?\t"
        answer: "ANTONIUS PRIMUS"
  - tossup:
      question: "According to medical abbreviations, how often should a medicine labelled <latin>b.i.d.</latin> be taken?\t"
      answer: "TWICE A DAY"
    boni:
      - question: "According to medical abbreviations, how should a medicine labelled <latin>p.o.</latin> be administered?\t"
        answer: "BY / THROUGH THE MOUTH"
      - question: "According to medical abbreviations, in what form should a medicine labelled <latin>gtt.</latin> be administered?\t"
        answer: "(IN / BY) DROPS (prompt on LIQUID)"
  - tossup:
      question: "What woman refused to marry a king and, despite being locked away by her father, gave birth to a son named Perseus?\t"
      answer: "DANAЁ"
    boni:
      - question: "In order to help his mother refuse the king’s advances, Perseus needed to bring back the head of Medusa. What goddess, who had her own reasons to dislike Medusa, helped Perseus?\t"
        answer: "ATHENA / MINERVA"
      - question: "Name two items needed to defeat Medusa, which were gifted to Perseus.\t\t"
        answer: "CAP OF DARKNESS / INVISIBILITY // WINGED SANDALS // \t(LARGE) POUCH / WALLET // SHIELD // SWORD"
  - tossup:
      question: "What do the following have in common: <latin>Epulōnēs, Lupercī, Flāminēs, Haruspicēs</latin>?\t\t"
      answer: "(THEY ARE ALL TYPES OF) PRIESTS / PRIESTHOODS"
    boni:
      - question: "What type of priest used detailed stone or clay diagrams of animal livers to interpret the will of the gods?\t"
        answer: "<latin>HARUSPEX / HARUSPICĒS</latin>"
      - question: "What did the casting of a spear onto a small plot of land by priests known as <latin>Fētiālēs</latin> represent?\t"
        answer: "ROME DECLARING WAR // DECLARATION OF WAR"
  - tossup:
      question: "The story of Oedipus continues. Listen carefully to the following passage, which I will read twice, then respond in English to the questions that follow: \t<latin>Oedipus, quī ōrāculum Delphicum vīsitāverat, numquam ad urbem suam redīre voluit. nam ōrāculum prōnūntiāverat Oedipum patrem occīsūrum esse et mātrem in mātrimōnium dūctūrum.</latin>     "
      answer: "REREAD"
    boni:
      - question: "The story continues: <latin>ōlim quīdam vir in equō vectus superbē Oedipum ē viā discēdere iussit. Oedipus tamen virum superbum pulsāvit!</latin>\t \tHow was the arrogant man traveling?"
        answer: "(CARRIED) ON / BY (A) HORSE"
      - question: "How did Oedipus react to the man’s demand for him to move?"
        answer: "STRUCK HIM"
  - tossup:
      question: "What prince, after delivering the killing blow to the Calydonian Boar, decided to gift the boarskin to Atalanta?\t"
      answer: "MELEAGER"
    boni:
      - question: "Upon hearing that her son had killed her brothers in a skirmish over the boarskin, what did Meleager’s mother do?\t\t"
        answer: "SHE BURNED THE STICK / LOG CONNECTED TO MELEAGER’S LIFESPAN"
      - question: "Which of Meleager’s relatives did Artemis turn into guinea fowl after Meleager’s death?\t\t"
        answer: "(MELEAGER’S) SISTER(S) // EURYMEDE / MELANIPPE / GORGE / DEIANEIRA  <latin>SCORE CHECK</latin>"
  - tossup:
      question: "Consider the sentence “The forest is full of shadows.” Provide the form of the noun <latin>umbra</latin>, in the genitive plural, needed to translate the sentence.\t"
      answer: "<latin>UMBRĀRUM</latin>"
    boni:
      - question: "Change the noun <latin>castra</latin>, which means “camp,” to the accusative so that it fits the sentence “After the sun went down, we returned to the camp.”\t"
        answer: "<latin>CASTRA</latin>"
      - question: "Change the noun <latin>homō</latin>, which means “person,” to the dative so that it fits the sentence “Don’t trust that person.”\t"
        answer: "<latin>HOMINĪ</latin>"
