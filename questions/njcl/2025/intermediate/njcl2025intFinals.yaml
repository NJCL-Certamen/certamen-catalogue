        answer: "MULTIPLE STUDENTS JUMP IN PLACE ONE BY ONE"
  - tossup:
      question: "In Book 14 of Ovid’s <title>Metamorphoses</title>, who sadly relates to Anchises the tale of his children, because he is upset that his son Andros could not stop the Greeks from kidnapping his daughters for their power to produce corn, wine, and olive oil, leading to their transformation into doves?\t"
