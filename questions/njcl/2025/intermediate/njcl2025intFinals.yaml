        answer: "BACCHUS / LIBER"
      - question: "Anius also showed Anchises a pair of famous trees on Delos. Why were these trees famous?\t"
        answer: "<emphasis>LATONA</emphasis> HAD CLUNG TO THEM WHILE <emphasis>GIVING BIRTH</emphasis>"
  - tossup:
