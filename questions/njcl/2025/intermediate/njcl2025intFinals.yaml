      - question: "What two Latin words meaning “evil” and “child” could you use to say “evil child” alliteratively?\t\t"
        answer: "<latin>PRĀVUS/-A/-UM</latin> AND <latin>PRŌLĒS / PUER / PUELLA / PŪPUS / PŪPA //\tIMPROBUS/-A/-UM</latin> AND <latin>INFĀNS</latin>"
