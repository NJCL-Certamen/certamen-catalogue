  - tossup:
      question: "The story of Oedipus continues. Listen carefully to the following passage, which I will read twice, then <latin>respondē Latīnē</latin> to the questions that follow: \t<latin>post multōs annōs, Antigonē, Oedipī fīlia, sē interrogat: “quid faciam dē frātribus meīs? ambō sunt mortuī, alter in sepulcrō iūstē positus, alter sub sōle turpiter iacēns. sī eum in terrā sepeliam, rex mē pūniat. sed timor nēminem adiuvat. fortiter faciam quod faciendum sit!” itaque noctū ex urbe discēdit ut rem efficiat.</latin>   "
      answer: "REREAD"
    boni:
      - question: "<latin>cūr timet soror?</latin>"
