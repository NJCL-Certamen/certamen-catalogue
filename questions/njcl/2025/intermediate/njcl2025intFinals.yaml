questions:
  - tossup:
      question: "<latin>Respondē aut Latīnē aut Anglicē: Cuius caput Hannibal invēnit ad pedēs suōs iactātum post proelium ad flūmen Metaurum</latin>? \t\t"
      answer: "<latin>(FRĀTRIS)</latin> <latin>HASDRUBALIS</latin> / (HIS BROTHER) HASDRUBAL(’S)"
    boni:
      - question: "<latin>Respondē aut Latīnē aut Anglicē:</latin> <latin>Quōmodo Hannibal mortuus est</latin>?"
        answer: "HE COMMITTED / DIED BY SUICIDE (WITH POISON) // <latin>SĒ INTERFĒCIT</latin> // \t\t<latin>MORTEM SIBI CONSCĪVIT // NECĀVIT / OCCĪDIT / CECĪDIT //</latin> \t\t(HOMICIDE BY) POISON / <latin>VENĒNŌ</latin> // FEVER / <latin>FEBRĪ</latin>"
      - question: "<latin>Respondē aut Latīnē aut Anglicē:</latin> <latin>Ubi Hannibal mortuus est</latin>?"
        answer: "<latin>IN BITHYNIĀ</latin> / IN BITHYNIA [prompt on ASIA MINOR]"
  - tossup:
      question: "Which of the following, if any, is not derived from the same Latin root as the others: sullen, desolate, parasol, solitaire?\t"
      answer: "PARASOL"
    boni:
      - question: "From what Latin word with what meaning are the other words in the tossup derived?"
        answer: "<latin>SŌLUS/-A/-UM</latin> - ALONE / LONELY"
      - question: "What other English word, also derived from <latin>sōlus</latin>, is a synonym for a monologue?"
        answer: "SOLILOQUY"
  - tossup:
      question: "When recognized by the spotter, perform or describe the following commands: “<latin>Surge et ambābus manibus tange caput!”</latin>\t"
      answer: "STUDENT STANDS AND TOUCHES HEAD \tWITH BOTH HANDS (OR DESCRIBES ACTION)"
    boni:
      - question: "When recognized by the spotter, perform or describe the following commands: “<latin>Ambābus manibus sublātīs, omnēs, dīcite Anglicē: stilōs dēponite!”</latin>    \t\t"
