  - tossup:
      question: "Another incident in the life of <latin>Flāvia</latin>. Listen carefully to the following passage, which I will read twice, then <latin>respondē Latīnē</latin> to the questions that follow: \t<latin>in Circō Maximō, puer dīves Flāviam vocāvit, “puella, vīsne plūs pecūniae habēre? tibi decem dēnāriōs dabō postquam aurīga albus vincet. sī tamen alius aurīga vincet, mihi vīgintī dēbēbis.” quamquam Flāviae nulla pecūnia erat, illa cōnsensit et signum imperātōris exspectāvit.</latin>     "
      answer: "REREAD"
    boni:
      - question: "The story continues:  <latin>post signum, aurīgae statim equōs incitāvērunt. nunc aurīga ruber prīmum locum tenēbat, tum viridis, deinde caeruleus.</latin>  \tThe question: <latin>factiō alba Flāviae victōriam dabit. quot factiōnēs puerō victōriam dabunt?</latin>"
        answer: "TRĒS / QUINQUE "
      - question: "\tThe story continues to continue: <latin>omnēs equī celerrimē ad fīnem festīnāvērunt, et imperātor victōrem nuntiāvit. eā nocte, Flāvia mātrī decem dēnāriōs ostendit.</latin>  \tThe question:  <latin>cūr necesse erat puerō dēnāriōs trādere?</latin>"
        answer: "(QUOD) {(FACTIŌ) ALBA / (AURĪGA) ALBUS} {VĪCIT / SUPERĀVIT} "
  - tossup:
      question: "Where would a Roman often go before <latin>cēna</latin>, handing a <latin>quadrans</latin> to the <latin>servus</latin> as a <latin>balneāticum</latin> before entering the <latin>apodȳtērium</latin> and undressing?\t \t\t"
