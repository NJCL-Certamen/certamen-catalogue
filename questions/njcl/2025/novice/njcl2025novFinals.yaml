        answer: "PELEUS"
      - question: "To whom did Hippomenes turn for assistance in besting Atalanta in the footrace for her hand in marriage?\t"
        answer: "APHRODITE"
  - tossup:
      question: "After winning <title>Roman Family Feud</title>, you might get a special prize. What Latin word can be used to say “prize”?\t"
      answer: "<latin>PRETIUM / PRAEMIUM /</latin> <latin>PALMA / SPOLIUM</latin>"
    boni:
      - question: "With the game over, you are so glad you didn’t compete in vain. What is the Latin word you can use to say “in vain”? \t"
        answer: "<latin>FRŪSTRĀ / NĒQUĪQUAM / INCASSUM</latin>"
      - question: "Your team was made up of you, your father, your uncle, and your cousin. What Latin word is used to describe your cousin, who is the son of your father’s brother? \t\t"
        answer: "<latin>PATRUĒLIS / CŌNSŌBRĪNUS</latin>  SCORE CHECK"
  - tossup:
      question: "What law of 445 BC legalized intermarriage between patricians and plebeians? \t\t"
      answer: "<latin>LĒX CANULEIA</latin> / THE CANULEIAN LAW"
    boni:
      - question: "What plebeian was the first of his class appointed as dictator in 356 BC?\t\t\t"
        answer: "(CN.) MARCIUS RUTILUS"
      - question: "What plebeian was the first of his class appointed as praetor in 337 BC?\t\t\t"
        answer: "(Q.) PUBLILIUS PHILO"
  - tossup:
      question: "From what Latin noun with what meaning are “voyage” and “trivia” derived? \t\t"
      answer: "<latin>VIA</latin> - ROAD"
    boni:
