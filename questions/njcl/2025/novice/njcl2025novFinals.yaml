      question: "What Latin word completes the following Latin mottoes: “<latin>artēs</latin>, <latin>scientia</latin>, [blank]”, “[blank] <latin>vōs līberābit</latin>”, “<latin>lūx et</latin> [blank],” and “[blank]”?\t"
