      - question: "What university has the motto “<latin>vēritās vōs līberābit</latin>”?\t\t"
        answer: "JOHNS HOPKINS (UNIVERSITY)"
  - tossup:
      question: "Translate the following sentence into Latin: We heard the songs in the garden.\t\t"
      answer: "<latin>CARMINA / CANTIUNCULAS IN HORTŌ AUDIĒBĀMUS / AUDĪVIMUS</latin>"
    boni:
