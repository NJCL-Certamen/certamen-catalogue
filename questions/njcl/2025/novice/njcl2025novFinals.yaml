  - tossup:
      question: "What maiden was so beautiful that mortals neglected their worship of Venus in favor of her, making Venus so mad that Venus sent her son Cupid to make this maiden fall in love with a monster, only for Cupid to accidentally wound himself and fall in love with her? \t\t"
      answer: "PSYCHE"
    boni:
      - question: "After a bit of a kerfuffle about mistaken identity, Psyche needed to atone for her mistakes with her mother-in-law Venus. Name one of the tasks Venus gave Psyche to complete. \t\t"
        answer: "SORT GRAIN / COLLECT GOLDEN WOOL / \tCOLLECT WATER FROM RIVER STYX / OBTAIN PROSERPINA’S BEAUTY"
      - question: "After Psyche completed these tasks and married Cupid, she became a goddess of what? \t\t"
        answer: "THE SOUL"
