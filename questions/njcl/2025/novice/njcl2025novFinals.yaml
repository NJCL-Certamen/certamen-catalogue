questions:
  - tossup:
      question: "<latin>Quod animal est? Hoc animal est signum zōdiacī. Hoc animal quoque in aquā habitat et semper natat. Fēlēs valdē volunt hoc animal consūmere.</latin> \t"
      answer: "PISCIS / PISCĒS"
    boni:
      - question: "<latin>Quod animal est? Hoc animal in silvīs habitat, lūnam spectat, et ululat. Hoc animal saevior cane est.</latin> \t"
        answer: "LUPUS / LUPA"
      - question: "<latin>Quod animal est? Hoc animal maximum est. Pedēs maximōs, aurēs maximās, et nāsum longissimum habet.</latin> \t"
        answer: "ELEPHANTUS / ELEPHANTA / ELEPHA(N)S"
  - tossup:
      question: "Which of the following Roman coins was worth the most: <latin>as, aureus, dēnārius, quādrans,</latin> or <latin>sestertius</latin>?\t"
      answer: "<latin>AUREUS</latin>"
    boni:
      - question: "Of what metal was a <latin>dēnārius</latin> typically made? \t"
        answer: "SILVER"
      - question: "Given that the back side of a coin is called the “reverse” what is the front side, which often bore an image of the emperor’s head, called?\t"
        answer: "OBVERSE"
  - tossup:
      question: "For the sentence “The farmers walked with their horses for a whole day,” provide the correct Latin form of the noun <latin>diēs</latin>.\t"
      answer: "<latin>DIEM</latin>"
    boni:
      - question: "For the noun <latin>diēs</latin>, provide the form that fits the sentence “Within eight days, I shall sit down for a rest.”\t"
        answer: "<latin>DIĒBUS</latin>"
      - question: "For the noun <latin>diēs</latin>, provide the form that fits the sentence “No more corndogs? It’s the end of days!”\t"
        answer: "<latin>DIĒRUM</latin>"
  - tossup:
      question: "What maiden was exposed on Mt. Parthenion because her father wanted a boy, but was saved by a she-bear and raised by hunters to become a swift-footed devotee of Artemis?\t \t\t"
      answer: "ATALANTA"
