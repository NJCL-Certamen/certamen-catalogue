        answer: "<latin>AVĒS(, QUAE) IN ARBORIBUS (SUNT, ) \t\tDULCITER / DULCE CANTĀBUNT / CANENT</latin>"
      - question: "And this sentence: The poet tries to write beautiful words.\t\t"
        answer: "<latin>POĒTA VERBA / VOCĀBULA PULCHRA SCRĪBERE  \t\tTEMPTAT / CONĀTUR / MŌLITUR</latin>"
  - tossup:
      question: "When Aeneas is advised by his father’s ghost to travel to the Underworld, to whom does he turn to guide him to the entrance?\t"
