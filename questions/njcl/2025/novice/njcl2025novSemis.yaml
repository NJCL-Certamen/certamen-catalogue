tournament: "NJCL Certamen"
year: 2025
division: "Novice"
round: "Semifinals"
questions:
  - tossup:
      question: "Theoretically containing 600 men, what division of the Roman army did Marius introduce between the legion and the century?\t"
      answer: "COHORT / <latin>COHORS</latin>"
    boni:
      - question: "How many cohorts made up a Roman legion in this period of the late Republic? \t"
        answer: "TEN"
      - question: "What earlier fighting unit, consisting of two centuries, did Marius’ cohort replace? \t\t"
        answer: "MANIPLE / <latin>MANIP(U)LUS</latin>"
  - tossup:
      question: "What maiden, although perhaps better known as the monster she was transformed into, was the victim of Circe’s jealousy over the affection of the youth Glaucus?\t"
      answer: "SCYLLA"
    boni:
      - question: "A different Scylla betrayed her father because she fell in love with the invading King Minos. Who was her father?\t"
        answer: "NISUS"
      - question: "Nisus had a very distinctive physical feature that made him—and his city!—invincible, at least until Scylla cut it off. What was it?\t"
        answer: "PURPLE (LOCK OF) HAIR"
  - tossup:
      question: "Many gravestones contain the inscription R.I.P. What Latin phrase with what English meaning does that abbreviation stand for? \t\t"
      answer: "<latin>REQUIESCAT IN PACE</latin>, (MAY HE/SHE/THEY) REST IN PEACE"
    boni:
      - question: "What two-word Latin phrase often found on gravestones and abbreviated D.M. literally translates into English as “to the spirits of the dead”?\t"
        answer: "<latin>DĪS MANIBUS</latin>"
      - question: "What Latin phrase, often used in place of R.I.P. on a gravestone, was abbreviated with S.T.T.L.? \t"
        answer: "<latin>SIT TIBI TERRA LEVIS // SIT TERRA TIBI LEVIS</latin>"
  - tossup:
      question: "Whose murder, carried out in his mother’s presence in his own military tent, sparked the crisis of the third century in 235 AD?\t"
      answer: "SEVERUS ALEXANDER(’S)"
    boni:
      - question: "Who was this mother of Severus Alexander?\t"
        answer: "JULIA MAMAEA"
      - question: "What commander of the Pannonian legions led the coup that deposed Severus Alexander? \t\t"
        answer: "MAXIMINUS THRAX / (C.) IULIUS VERUS MAXIMINUS (THRAX)"
  - tossup:
      question: "What article of clothing would a Roman matron primarily wear outdoors over her other clothing, giving her the ability to cover her head?\t"
      answer: "<latin>PALLA /</latin> VEIL"
    boni:
      - question: "What long, flowing garment was the distinctive mark of a Roman matron?\t \t\t\t\t"
        answer: "STOLA / VESTIS LONGA"
      - question: "What article of clothing was a <latin>subligāculum</latin>?\t"
        answer: "UNDERWEAR / LOINCLOTH"
  - tossup:
      question: "Let’s hear about another incident in the life of <latin>Flāvia</latin>. Listen carefully to the following passage, which I will read twice, then <latin>respondē Latīnē</latin> to the questions that follow: \t<latin>Flāvia cum mātre prope templum Saturnī stābat. vox mātris clāra ad deum surrēxit, “Saturne omnipotens, pater deōrum, dā auxilium nostrae familiae pauperī. abest nōbīs satis pecūniae, satis cibī, satis laetitiae. sine vīnō aut aurō, possum tibi sōlum lacrimās offerre.”</latin>      "
      answer: "REREAD"
    boni:
      - question: "<latin>quid māter deō dare poterat?</latin>"
        answer: "LACRIMĀS / FLETŪS"
      - question: "The story continues: <latin>tum Flāvia mātrem rogāvit, “Saturnusne verba tua audiet? deusne auxilium mittet?” “nesciō, fīlia mea,” respondit māter, “nōs hominēs vītam meliōrem spērāmus, sed deōs nōn intellegimus.”</latin> \tThe question: <latin>quī nōn ab hominibus intelleguntur?</latin>"
        answer: "DĪ / DEĪ / DEAE //  \t\tSATURNUS ET (CĒTERĪ / ALIĪ) DEĪ "
  - tossup:
      question: "What Latin verb, a compound of <latin>cum</latin> and a verb meaning “to do or drive,” means “to  \tforce”?\t"
      answer: "<latin>CŌGŌ</latin>"
    boni:
      - question: "A compound of <latin>sub</latin> and a verb meaning “to hold,” what Latin verb means “to maintain”?  \t\t"
        answer: "<latin>SUSTINEŌ</latin>"
      - question: "A compound of <latin>inter</latin> and a verb meaning “to go,” what Latin verb means “to perish”? \t\t"
        answer: "<latin>INTEREŌ</latin>"
  - tossup:
      question: "Before Theseus could go off and fight the Minotaur, he had to fight his way to Athens. Which of the bandits he met on the way was notorious for robbing travelers, forcing them to wash his feet, and then kicking them off the cliff to a giant turtle below?\t"
      answer: "SCEIRON"
    boni:
      - question: "Which bandit tied his victims to pine trees he had bent down to the ground and then let the trees go?\t"
        answer: "SINIS / PITYOCAMPTES"
      - question: "Which bandit forced his victims to fit into a bed, either by stretching them to be long enough or cutting off their legs to be short enough?\t \t\t"
        answer: "PROCRUSTES / DAMASTES / POLYPEMON"
  - tossup:
      question: "Victories over the Parthians, the defeat of Maxentius at the Milvian Bridge, and the sack of Judea are all commemorated on what type of monument in Rome?\t\t"
      answer: "(TRIUMPHAL) ARCH / <latin>ARCUS (TRIUMPHĀLIS)</latin>"
    boni:
      - question: "What type of monuments feature helical friezes depicting continuous scenes? On one such monument in Rome, the scene shows a Roman emperor’s victories in the Dacian Wars; another shows a different emperor’s campaigns in the Marcommannic Wars. \t\t"
        answer: "COLUMNS"
      - question: "What specific monument in Rome was commissioned by the Senate to commemorate the return of Augustus from Hispania and Gallia and has surrounding friezes depicting scenes of prosperity meant to reinforce the Roman Peace?\t"
        answer: "<latin>ĀRA PĀCIS</latin>"
  - tossup:
      question: "<latin>Respondē aut Anglicē aut Latīnē: Quis sum? In spēluncā habitō. Virōs ad statuās mūtō. Capillī meī serpentēs sunt.</latin>\t"
      answer: "MEDŪSA"
    boni:
      - question: "<latin>Respondē aut Anglicē aut Latīnē: Quis sum? Neptūnus est pater meus; Pegasus est frāter meus. Nōmen Graecum meum significat “gladius aureus.”</latin>\t"
        answer: "CHRYSAOR"
      - question: "<latin>Respondē aut Anglicē aut Latīnē: Quis sum? Sum fīlia Cēpheī et Cassiopēae. Perseus mē ā monstrō horribilī maritimō servāvit.</latin>\t"
        answer: "ANDROMEDA"
  - tossup:
      question: "Using the Latin verb <latin>dō, dare</latin>, give the second person singular imperfect passive indicative, which means “you were given.”\t"
      answer: "<latin>DABĀRIS / DABĀRE</latin>"
    boni:
      - question: "Using the Latin verb <latin>plaudō, plaudere</latin>, give the third person plural perfect passive indicative, which means “they were applauded.”\t"
        answer: "<latin>PLAUSĪ/AE/A (SUNT)</latin>"
      - question: "Using the Latin verb <latin>videō, vidēre</latin>, give the first person plural pluperfect passive indicative, which means “we had been seen.”\t"
        answer: "<latin>VĪSĪ/AE/A ERĀMUS</latin>"
  - tossup:
      question: "Which of the following words, if any, does not belong because of derivation: export, important, passport, report?\t"
      answer: "PASSPORT"
    boni:
      - question: "From what Latin noun with what meaning is passport derived?"
        answer: "<latin>PORTUS</latin> - HARBOR / <latin>PASSUS</latin> - STEP / PACE"
      - question: "From what Latin verb with what meaning are the remaining words in the tossup derived?"
        answer: "<latin>PORTŌ</latin> - CARRY  [PASS OUT THE <emphasis>VISUAL</emphasis>] Please do not open the visual until instructed to do so, and remember there is no consultation on this visual toss up; \tYou may now open the visual, you have 10 seconds to examine it."
  - tossup:
      question: "What rival suitor is featured on stamp D shortly before Heracles defeats him to marry Deianeira?\t"
      answer: "ACHELOÜS"
    boni:
      - question: "Other than Heracles, what character appears on both stamps A and G?"
        answer: "EURYSTHEUS"
      - question: "Put these events in the life of Heracles in order from earliest to latest."
        answer: "C, E, G, B, A, D, F"
  - tossup:
      question: "Translate this sentence into English: <latin>Medicus aquam gladiātōrī alterī dat.</latin>\t"
      answer: "THE/A DOCTOR GIVES (THE) WATER TO {THE/AN OTHER // A SECOND} \tGLADIATOR."
    boni:
      - question: "Now translate this sentence: <latin>Leō ingēns gladiō gladiātōris vulnerātus erat.</latin> \t\t"
        answer: "THE/A HUGE LION HAD BEEN WOUNDED BY THE \t\t{GLADIATOR’S SWORD / SWORD OF THE GLADIATOR}."
      - question: "Now translate this sentence: <latin>Neque gladiātor neque leō grātiās crūdēlī medicō aget.</latin>           \t"
        answer: "NEITHER THE GLADIATOR NOR THE LION WILL \t\t{GIVE THANKS TO / THANK} THE CRUEL DOCTOR."
  - tossup:
      question: "Driven to madness by Allecto, what prince of the Rutulians led the resistance to Aeneas and the Trojans in Italy?\t"
      answer: "TURNUS"
    boni:
      - question: "In battle, Turnus was often aided by his sister, a nymph who served as his charioteer and notably once returned his sword to him. Who was she?\t"
        answer: "JUTURNA"
      - question: "The <title>Aeneid</title> ends with Turnus’ death at whose hands?\t"
        answer: "AENEAS’  SCORE CHECK"
  - tossup:
      question: "What body of water could be found south of Sarmatia and north of Bithynia and Pontus? On its eastern shore was the home of a mythological character who betrayed her father and killed her brother to help Jason fulfill his quest?\t \t\t"
      answer: "BLACK SEA / <latin>PONTUS EUXINUS</latin>"
    boni:
      - question: "Located between the Bosphorus and Hellespont, what body of water connects the Black Sea to the Aegean Sea?\t"
        answer: "SEA OF MARMARA / <latin>PROPONTIS</latin>"
      - question: "In 67 AD, Nero ordered thousands of enslaved Jews to begin constructing a canal across an isthmus near what Greek city? Abandoned after Nero’s death, this project would eventually be completed in 1893.\t"
        answer: "CORINTH / <latin>CORINTHUS</latin>"
  - tossup:
      question: "What two Romans literally and figuratively divided the imperial palace in two, only to realize that their rivalry was so far beyond diplomacy that it ended in violence in 211 AD? \t"
      answer: "CARACALLA AND GETA"
    boni:
      - question: "Whose grave did Caracalla visit in Alexandria in 215 AD before conducting a massacre there? \t"
        answer: "ALEXANDER THE GREAT"
      - question: "In 213 AD, a civil war between two rival claimants to the throne of Parthia made an invasion of that empire viable for Caracalla. Name one of these two Parthians"
        answer: "VOLOGESES (V) / ARTABANUS (V)"
  - tossup:
      question: "For the noun <latin>bracchium</latin>, provide the nominative plural form so that it fits the sentence “My arms are green.”\t"
      answer: "<latin>BRACCHIA</latin>"
    boni:
      - question: "For the noun <latin>bracchium</latin>, provide the genitive plural form so that it fits the sentence “Sometimes I remember my arms.”\t"
        answer: "<latin>BRACCHIŌRUM</latin>"
      - question: "For the noun <latin>bracchium</latin>, provide the genitive singular form so that it fits the sentence “Look at the size of <title>that</title> arm.”\t"
        answer: "<latin>BRACCH(I)Ī</latin>"
  - tossup:
      question: "What Greek city had as its first king the autochthonous half-snake hero Cecrops, who accepted the gifts of a salt-water well and an olive tree from two gods as part of a contest, and was later ruled by Erichthonius, Pandion, and Aegeus?\t"
      answer: "ATHENS"
    boni:
      - question: "King Erichthonius was the son of Gaia and what god, who accidentally impregnated the earth while trying to rape Athena?\t"
        answer: "HEPHAESTUS"
      - question: "King Pandion made the mistake of betrothing his daughter Procne to what Thracian king? \t\t"
        answer: "TEREUS"
  - tossup:
      question: "Of <latin>dēns, hiems, nūper, sententia,</latin> and <latin>unda</latin>, which is described in the following sentence: <latin>saepe ningit hōc tempore annī</latin>? \t"
      answer: "<latin>HIEMS</latin>"
    boni:
      - question: "Of <latin>dēns, insignis, nūper, sententia,</latin> and <latin>unda</latin>, which is described in the following sentence: <latin>tempestātēs in marī hanc rem creant</latin>?\t"
        answer: "<latin>UNDA</latin>"
      - question: "Of <latin>dēns, insignis, nūper, pullus,</latin> and <latin>sententia,</latin> which is described in the following sentence: <latin>hoc verbum descrībit hominem quī omnibus nōtus est</latin>?\t"
        answer: "<latin>INSIGNIS</latin>"
